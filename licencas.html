<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Guia nova por padrão: link clicado não tira o colaborador de onde ele estava. -->
<base target="_blank">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentos e licenças (equipe) — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Duas origens porque o /exec responde 302 para a segunda: sem isto o aparelho paga
     DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte não pode segurar a primeira pintura: entra como preload e vira folha depois. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"></noscript>
<style>
:root{
  /* Paleta canonica da equipe — a mesma em todas as telas. */
  --canvas:#F1E7DC;--surface:#FFFFFF;--surface-warm:#FBF6EF;
  --ink:#113D39;--ink-2:#3F5854;--muted:#6E6256;--line:#E4D9C9;--line-2:#D6C3AC;
  --brand-dark:#073034;--brand-teal:#0F8C85;--brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,37:1 no canvas).
     Este e o mesmo teal escurecido so para letra e fundo de letra; o --brand-teal
     segue canonico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E;--amber-txt:#8A5A10;--amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber da 2,61:1 com #fff, o --amber-2 da 4,68:1. Como
     preenchimento de barra, icone ou borda, o --amber original continua valendo. */
  --amber-2:#B05F12;
  --vermelho:#C0392B;--verde:#2E9D5F;--verde-2:#25804C;
  /* Raios: so pelos tokens — 10 em campo, 12 padrao, 16 nos blocos grandes, pilula. */
  --radius-sm:10px;--radius:12px;--radius-lg:16px;--radius-pill:999px;
  /* Levantar de cartao clicavel: uma sombra so, igual em todas as telas. */
  --lift:0 8px 20px rgba(17,61,57,.10);
  /* Tamanhos e o teal claro vem das paginas irmas: a regua de acoes e colada
     literal do contrato, entao os nomes que ela usa tem de existir aqui.
     Os degraus 4 a 6 entraram com a lista e o modal (o nome do cliente na linha
     e o ID no topo da ficha): sem eles as regras copiadas do registro.html caem
     no valor herdado e a linha desalinha. */
  --fs-1:11px;--fs-2:12px;--fs-3:13px;--fs-4:15px;--fs-5:19px;--fs-6:24px;
  --receita-soft:#DBEFEC;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- barra superior (igual às páginas irmãs) ---------- */
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:var(--radius-pill);white-space:nowrap}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd;white-space:nowrap}
.barra a.volta,.barra a.plan{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.barra a.plan{border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:4px 11px}
.save-status{font-size:13px;font-weight:800;padding:6px 13px;border-radius:var(--radius-pill);background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
/* O MESMO indicador aparece em dois lugares: a faixa da barra escura e o rodape
   do modal da ficha (claro). So o estado neutro precisa de outra tinta — o da
   barra e feito para fundo escuro e sumiria no branco. Vem ANTES dos estados
   coloridos de proposito: mesma especificidade, quem vier depois ganha. */
.save-status.claro{background:var(--surface-warm);color:var(--ink-2)}
/* Branco sobre --amber da 2,61:1 e sobre --verde 3,44:1 — o rotulo do proprio
   status de gravacao some. Um degrau mais escuro na MESMA familia: 4,68:1 e 4,92:1. */
.save-status.saving{background:var(--amber-2);color:#fff}.save-status.ok{background:var(--verde-2);color:#fff}.save-status.err{background:var(--vermelho);color:#fff}

/* ---------- topo: filtros + busca ---------- */
.topo{padding:14px 16px 6px}
.grupo{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grupo .rot{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px;align-self:center}
.chip{font-size:13px;font-weight:700;border-radius:var(--radius-pill);padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--brand-teal)}
.chip.on{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.chip .n{background:rgba(0,0,0,.10);border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
/* Ordenação: a setinha no chip ativo e a direção escrita por extenso logo abaixo
   — "▲" sozinho não diz o que é "para cima" numa coluna de data. */
.chip .ord{margin-left:5px;font-size:11px;opacity:.9}
.ord-info{font-size:var(--fs-2);color:var(--muted);font-weight:700}
.ord-info b{color:var(--ink-2)}
.chip.alerta.on{background:var(--vermelho);border-color:var(--vermelho)}
.chip.falta.on{background:var(--amber);border-color:var(--amber)}
/* B.7: a busca é a pílula larga da tela. */
.busca{flex:1;min-width:220px;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}

/* ---------- revelacao progressiva ---------- */
/* Régua de ações: busca sempre à mão, filtros a um clique, contagem à vista.
   Antes os doze chips de filtro abriam a tela — quem chegava tinha de ler a
   parede inteira antes de achar o campo de busca, que é o que 9 em 10 usam. */
.barra-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.barra-acoes .campo-busca{flex:1;min-width:200px;font-size:16px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink)}
.barra-acoes .campo-busca:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.btn-filtros{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--ink);font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.btn-filtros:hover{border-color:var(--brand-teal)}
.btn-filtros[aria-expanded="true"]{background:var(--receita-soft);border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.btn-filtros svg{width:15px;height:15px;flex:none}
.cont-filtros{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:var(--radius-pill);background:var(--brand-teal-txt);color:#fff;
  font-size:var(--fs-1);font-weight:800}
/* display:inline-flex ganha do atributo hidden — sem esta linha o selo mostrava
   um "0" permanente ao lado de Filtros. */
.cont-filtros[hidden]{display:none}
.resumo-lista{font-size:var(--fs-3);color:var(--ink-2);white-space:nowrap}
.painel-filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
  padding:14px 16px;margin:0 0 14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-warm)}
.painel-filtros[hidden]{display:none}
/* Cada grupo de chips ocupa a fileira inteira: Situação e Vencimento não se misturam. */
.painel-filtros .grupo{width:100%}
.btn-limpar{min-height:38px;padding:0 15px;border-radius:var(--radius-pill);border:1px dashed var(--line-2);
  background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:var(--fs-2);cursor:pointer}
.btn-limpar:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
/* A contagem desta tela tem quatro números; no celular ela precisa quebrar, senão
   o nowrap do contrato empurra a página para o lado. */
@media(max-width:560px){.resumo-lista{white-space:normal}}
.lista-mais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.lista-mais button{min-height:44px;padding:0 18px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--brand-teal-txt);
  font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.lista-mais button:hover{border-color:var(--brand-teal);background:var(--receita-soft)}
.lista-mais .btn-todos{background:transparent;color:var(--ink-2);font-weight:600}
/* O rodapé da lista fica FORA dela, num bloco próprio: era assim quando a grade
   rolava para o lado (quem rolasse perderia de vista o botão de mostrar mais) e
   continua sendo, porque é ele que diz quanto da lista está desenhado. */
#rodape-lista{padding:0 16px 48px}
#rodape-lista .quanto{display:block;text-align:center;font-size:var(--fs-2);color:var(--muted);margin-top:6px}

/* ---------- cards de resumo ---------- */
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:0 16px 12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.rhead{padding:9px 13px;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff}
.rcard.vencidos .rhead{background:var(--vermelho)}
.rcard.d30 .rhead{background:var(--amber)}
.rcard.d60 .rhead{background:var(--brand-teal-txt)}
.rcard.falta .rhead{background:#6B8486}
.rhead .n{background:rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:2px 9px;font-size:11px}
/* 5px de folga em cima + 5 linhas de 30px: a caixa termina exatamente onde uma
   linha termina. Antes a sexta aparecia pela metade, atravessada pela borda do
   cartão, e parecia defeito de dado — quem via achava que o nome do cliente
   estava cortado na planilha. A folga de baixo só aparece no fim da rolagem. */
.rlista{max-height:155px;overflow:auto;padding:5px 5px 9px}
/* Altura fixa de 30px: com align-items:baseline a linha media 30,5px e sobrava
   meia linha aparecendo embaixo. É deste 30 que sai o múltiplo do max-height. */
.tk{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;font-family:var(--sans);font-size:12px;line-height:1.5;height:30px;
  border:0;background:transparent;color:inherit;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer}
.tk:hover{background:var(--surface-warm)}
.tk .d{font-weight:800;white-space:nowrap;color:var(--ink)}
.tk .lb{color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .tp{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.rvazio{color:var(--muted);font-size:12px;padding:9px}

/* ---------- lista de clientes (só leitura) ----------
   A grade editável de 12 colunas virou uma LISTA de leitura: sete colunas-chave,
   nenhum campo dentro da linha, e o clique abre a ficha por cima. A decisão é do
   dono, com as palavras dele: "a lista fica limpa e ninguém altera sem querer".
   As larguras e os nomes de classe são os mesmos do registro.html de propósito —
   as telas da equipe têm de ficar indistinguíveis entre si. */
.lista{padding:12px 16px 10px;display:flex;flex-direction:column;gap:8px}
.cli{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cli.aberto{border-color:var(--brand-teal);box-shadow:0 5px 20px rgba(7,48,52,.10)}
/* Faixa lateral por situação: bate o olho na lista e vê quem está vencido ou sem
   data sem precisar abrir a ficha. As tintas são as mesmas da etiqueta de prazo
   que já existia na grade — vermelho vencido, âmbar até 30 dias, cinza sem data. */
.cli.sit-venc{border-left:4px solid var(--vermelho)}
.cli.sit-d30{border-left:4px solid var(--amber)}
.cli.sit-sem{border-left:4px solid var(--line-2)}
.cli.sit-inativo{border-left:4px solid var(--line-2)}
/* O cabeçalho (.lista-cab) repete a MESMA régua de colunas da linha — as duas
   larguras moram na mesma regra justamente para não desalinharem quando alguém
   mexer. Sete colunas: ID · Cliente · CNPJ · Cidade · Documento mais crítico ·
   Vencimento · Situação. NÃO é <table>: sem tabela não há rolagem lateral, e era
   ela que exigia coluna congelada, faixa sticky e realce de linha inteira. */
.lista-cab,.cli-head{display:grid;
  /* O nome é o que a pessoa procura na lista e era o primeiro a ser cortado —
     "AJUB - Cirurgia de Cab…" não identifica ninguém. Ele leva o maior peso; a
     coluna de documento cede, porque ali o corte já é explícito, com o "+N". */
  grid-template-columns:60px minmax(0,2.4fr) 142px minmax(0,.7fr) minmax(0,1.9fr) 96px minmax(0,146px);
  gap:12px;align-items:center}
.lista-cab{padding:2px 14px 0;font-size:var(--fs-1);font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted)}
/* O cabeçalho também ordena: cada rótulo é um botão de verdade (Tab chega nele,
   Enter e Espaço ordenam). É o que restou do "clique em qualquer cabeçalho" da
   grade antiga — e abaixo de 900px, onde a régua some, os mesmos critérios
   continuam nos chips "Ordenar por" do painel de filtros. */
.lista-cab button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  text-transform:inherit;letter-spacing:inherit;text-align:inherit}
.lista-cab button:hover{color:var(--brand-teal-txt)}
.cli-head{width:100%;text-align:left;background:none;border:0;padding:12px 14px;
  cursor:pointer;font-family:var(--sans);color:inherit}
.cli-head:hover{background:var(--surface-warm)}
/* O .cli tem overflow:hidden e o contorno global (offset 2px) sairia cortado na
   borda do cartão: aqui ele entra para dentro, senão o foco de teclado some. */
.cli-head:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.c-id{font-size:var(--fs-2);font-weight:700;color:var(--muted);white-space:nowrap}
.c-nome{font-weight:600;font-size:var(--fs-4);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-doc,.c-cid{font-size:var(--fs-3);color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Documento e data em algarismo de largura fixa: uma coluna de CNPJ desalinhado
   é justamente o que se lê errado quando se confere um cliente atrás do outro. */
.c-doc,.c-data{font-variant-numeric:tabular-nums}
.c-data{font-size:var(--fs-3);color:var(--ink-2);text-align:center;white-space:nowrap}
.c-docs{display:flex;gap:4px;min-width:0;overflow:hidden}
/* Entre 900px e 1320px a linha aperta — é a faixa do notebook com o menu lateral
   aberto, onde sobram ~836px de coluna para as sete. Aí o "+N" cede a vez: uma
   pílula INTEIRA e o nome do cliente legível valem mais que a contagem, que
   continua por extenso no title da linha. Abaixo de 900px a linha vira duas e o
   "+N" volta, porque ali sobra espaço. */
@media(min-width:901px) and (max-width:1320px){.c-tag.mais{display:none}}
/* E as quatro colunas de largura fixa apertam o cinto na mesma faixa: sem isso
   a pílula do documento não cabia inteira e o nome ficava com 76px, que é
   "AJUB…" e mais nada. O piso min-content na coluna do documento é o que garante
   a pílula inteira; quem cede é o nome, que corta com reticências e continua
   dizendo quem é. */
@media(min-width:901px) and (max-width:1320px){
  .lista-cab,.cli-head{gap:10px;
    grid-template-columns:52px minmax(0,2.2fr) 128px minmax(0,.65fr) minmax(min-content,1.4fr) 84px minmax(0,110px)}
}
/* Sem max-width e sem reticências, de propósito: pílula cortada ("Alvará San…")
   não identifica documento nenhum, e era pior que mostrar uma a menos. Quem
   manda no corte é a CONTAGEM, que sempre sobra num "+N" honesto. */
.c-tag{font-size:var(--fs-1);font-weight:700;color:var(--ink-2);background:var(--surface-warm);
  border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 8px;
  white-space:nowrap;flex-shrink:0}
.c-tag.mais{background:transparent;border-style:dashed;color:var(--muted)}
/* Documento cujo vencimento nem foi informado ainda: mesma pílula, traço aberto —
   é a pendência que o cartão "Faltando dados" já conta. */
.c-tag.semdata{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-txt)}
.c-fim{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
/* Coluna em branco continua dizendo o NOME do que falta ("sem CNPJ", "sem
   documento", "sem data") em vez de um vazio mudo. Classe própria: o `.vazio`
   da lista sem resultado tem 15px e padding de 30px. */
.c-falta{font-size:var(--fs-2);color:var(--muted);font-weight:600}
/* Selo de pendência ao lado da situação: quantos documentos deste cliente ainda
   não têm vencimento informado. É a mesma conta do cartão "Faltando dados". */
.selo{font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap;letter-spacing:.2px;
  background:#EEF3F1;color:#4a6360;border:1px solid #D9E5E2;cursor:help}
.selo.alerta{background:var(--amber-soft);color:#8a5117;border-color:var(--amber-line)}
/* Abaixo de 900px as sete colunas não cabem lado a lado: nome e situação ficam na
   primeira linha da MESMA faixa e o resto desce para uma segunda, menor. Continua
   sendo uma linha clicável só — não vira dois cartões. */
@media(max-width:900px){
  .lista-cab{display:none}
  .cli-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  /* Quebra forçada: sem ela o "resto" subiria para a primeira linha sempre que sobrasse espaço. */
  .cli-head::after{content:"";order:3;flex:0 0 100%;height:0}
  .c-nome{order:1;flex:1 1 auto}
  .c-fim{order:2;flex:none;flex-direction:row;align-items:center;gap:6px}
  .c-id,.c-doc,.c-cid,.c-docs,.c-data{order:4;flex:0 1 auto;font-size:var(--fs-2);color:var(--muted);text-align:left}
  /* Na segunda linha os documentos são mais uma informação entre outras: sem a
     moldura de pílula eles param de empilhar a faixa em três alturas. */
  .c-docs{flex-wrap:wrap;gap:0 8px}
  .c-tag,.c-tag.semdata{background:transparent;border-color:transparent;padding:0;font-size:var(--fs-2);
    font-weight:600;color:var(--muted);max-width:none}
}
/* Selo de situação: é a última coluna da linha e nunca depende só da cor — o
   texto já diz "Vencido", "Em 12 dias", "Em dia", "Sem data". */
.pill{font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap;letter-spacing:.2px;border:1px solid transparent}
.pill.sit-venc{background:#F7DFDC;color:#8E2A1D;border-color:var(--vermelho)}
.pill.sit-d30{background:var(--amber-soft);color:#8A4B12;border-color:var(--amber)}
.pill.sit-d60{background:#E1F0EE;color:#0b6c66;border-color:#BBDBD7}
.pill.sit-d90,.pill.sit-ok{background:#E6F3EC;color:#1f6b45;border-color:#BFE0CD}
.pill.sit-sem{background:var(--amber-soft);color:var(--amber-txt);border-color:var(--amber-line)}
.pill.sit-inativo{background:#EEE9E2;color:var(--muted);border-color:var(--line)}
.cli.destaque{background:#FFF3B0;transition:background .4s ease}
.vazio{padding:30px 16px;text-align:center;color:var(--muted);font-size:15px}

/* ---------- campos (hoje só dentro da ficha) ----------
   São os mesmos quatro tipos de célula de sempre — senha, data, documento/link e
   só-leitura hachurada. Nada aqui mudou de comportamento: só deixaram de ser
   pintados dentro da linha da lista. */
input[type=text],input[type=date],input[type=password]{font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--line-2);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--brand-teal);outline-offset:0}
/* No Safari, focar campo com menos de 16px amplia a página sozinha. Na grade
   isso não incomodava (ninguém digitava 12 colunas no celular); dentro da ficha,
   sim — é lá que se digita agora. Só os campos, e só onde o problema existe. */
@media(max-width:640px){input[type=text],input[type=date],input[type=password]{font-size:16px}}
.ro{padding:6px 8px;font-size:12px;color:var(--muted);background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.02) 6px,rgba(0,0,0,.02) 12px);
  border:1px dashed var(--line-2);border-radius:var(--radius-sm);white-space:normal;word-break:break-word}
.dt{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.dt input{flex:1;min-width:104px}
.tag-d{flex:none;font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:3px 7px;white-space:nowrap;min-width:44px;text-align:center}
.tag-d.vazio{background:var(--amber-soft);color:var(--amber-txt)}
.tag-d.na{background:#EEE9E2;color:var(--muted)}
.tag-d.venc{background:#F7DFDC;color:var(--vermelho)}
.tag-d.d30{background:#FCEFE0;color:var(--amber-txt)}
.tag-d.d60{background:#E1F0EE;color:#0b6c66}
.tag-d.d90,.tag-d.ok{background:#E6F3EC;color:#1f6b45}
.dt.venc input[type=date]{border-color:var(--vermelho)}
.dt.d30 input[type=date]{border-color:var(--amber)}
.sig{display:flex;align-items:center;gap:4px;min-width:0}
/* ---------- coluna de LINK: campo de URL + atalho para abrir ---------- */
.lk-cel{display:flex;align-items:center;gap:4px;min-width:0}
.lk-cel input,.lk-cel .ro{flex:1;min-width:0}
.lk-ir{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  font-size:13px;font-weight:800;line-height:1;text-decoration:none;border:1px solid var(--line-2);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--brand-teal-txt)}
.lk-ir:hover{border-color:var(--brand-teal);background:#EAF5F4}
/* Sem URL válida o atalho fica apagado e não clica — não abre guia em branco. */
.lk-ir.off{color:var(--line-2);border-style:dashed;background:transparent;cursor:default}

/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:var(--radius-pill);padding:12px 20px}
/* Densidade da grade: cabe ao lado de um campo sem empurrar a coluna. */
.btn--micro{padding:5px 7px;font-size:11px;line-height:1;flex:none;white-space:nowrap}
.btn.modo{color:var(--muted);border-style:dashed;font-weight:800}
.btn.modo:hover{border-style:solid;color:var(--brand-teal-txt)}

/* ---------- estados ---------- */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:48vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:60ch}
.state code{background:var(--surface-warm);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.state ol{text-align:left;color:var(--ink-2);font-size:13px;max-width:60ch;line-height:1.7;padding-left:20px}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}

@media(max-width:720px){.resumo{grid-template-columns:1fr}.barra .tag{display:none}}

/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}

/* ---------- explicacao recolhida (C.2) ----------
   O dado vem primeiro; a instrucao fica a um clique e lembra a escolha. */
details.ajuda{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:8px 16px}
details.ajuda>summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:12px;font-weight:800;color:var(--ink-2)}
details.ajuda>summary::-webkit-details-marker{display:none}
details.ajuda>summary::after{content:" \25BE";color:var(--muted)}
details.ajuda[open]>summary::after{content:" \25B4"}
details.ajuda>.txt{padding:0 12px 11px;font-size:12px;color:var(--muted);line-height:1.55}
details.ajuda>.txt b{color:var(--ink-2)}
details.ajuda>.txt a{color:var(--brand-teal-txt)}
/* Os quatro cartões de exemplo continuam inteiros, só que a um clique de
   distância: a CONTAGEM deles já está na régua, então nada de pendência some. */
details.situacao>summary{padding:10px 13px;font-size:13px}
details.situacao>.resumo{padding:0 12px 12px}
/* ---------- o que nao gravou (C.3) ----------
   A linha (ou o campo) fica marcada e o "tentar de novo" nasce ali mesmo. */
.falhou{outline:2px solid var(--vermelho);outline-offset:-2px}
/* A LINHA fica marcada na lista mesmo com a ficha fechada — é o que mostra, de

.cli.falhou{background:#FBEAE7}
.cli.falhou .cli-head:hover{background:#F7E0DC}
.btn-retry{display:block;margin-top:4px;font-family:var(--sans);font-size:11px;font-weight:800;cursor:pointer;
  border:1px solid var(--vermelho);background:var(--vermelho);color:#fff;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap}
.btn-retry:disabled{opacity:.6;cursor:default}
/* ---------- padroes compartilhados (B.10 e B.12) ---------- */
/* Foco de teclado sempre visivel — quem navega por Tab precisa ver onde esta. */
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}

.barra{flex-wrap:wrap}
@media(max-width:560px){.barra .cnt{display:none}}

/* ---- coluna de documento (Abrir / Enviar) ----
   O endereço cru saiu da tela: quem trabalha aqui quer ABRIR o documento ou
   MANDAR um, e não ler uma URL de 120 caracteres. O campo de URL continua
   existindo atrás do "⋯", porque colar link ainda acontece — só deixou de ser
   o estado padrão de 666 células. */
.doc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.doc-bt{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;font-weight:700;
  padding:5px 9px;border-radius:7px;border:1px solid transparent;text-decoration:none;cursor:pointer;background:none}
.doc-ir{color:#0F8C85;border-color:#cfe6e2;background:#F2F9F8}
.doc-ir:hover{background:#EAF4F1}
.doc-env{color:#8A7D70;border:1px dashed #D8CFC3;background:none}
.doc-env:hover{color:#0F8C85;border-color:#0F8C85}
.doc-obs{font-style:italic;color:#8A7D70;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-mais{border:none;background:none;color:#B8AFA6;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px}
.doc-mais:hover{color:#113D39;background:#F1ECE4}
@media (hover:hover){ .doc .doc-mais{opacity:.32} .doc:hover .doc-mais,.doc:focus-within .doc-mais{opacity:1} }
.doc-spin{display:inline-block;width:12px;height:12px;border:2px solid #cfe6e2;border-top-color:#0F8C85;
  border-radius:50%;animation:docgira .8s linear infinite}
@keyframes docgira{to{transform:rotate(360deg)}}
.doc-erro{display:block;color:#A4303F;font-size:11px;line-height:1.3;margin-top:3px}

/* ---------- a ficha do cliente (modal) ----------
   Toda a edição desta tela mora aqui dentro. O que era o modo "fichas" — cada
   campo com o rótulo do lado, agrupado por assunto — virou o conteúdo do modal,
   e o que era a grade virou a lista de leitura. É a mesma informação de sempre,
   montada pelas mesmas funções (montarGrupos/assuntoDe/rotFicha), só que agora
   um cliente por vez e com espaço para respirar. */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:90;background:rgba(7,48,52,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
/* O modal cobre a janela inteira (position:fixed;inset:0), inclusive a faixa dos
   264px onde mora o menu lateral — e o menu é z-index:940. Com os 90 daqui, o
   menu ficava POR CIMA do véu: clicável enquanto se digita, e um clique distraído
   trocaria de página com a ficha aberta. A regra em `body.b4s` vem do shell; a de
   baixo garante o 960 também quando o b4u-shell.js não carregou. */
body.b4s .modal{z-index:960}
.modal.modal-cad{z-index:960}
.modal-box{background:var(--canvas);border-radius:var(--radius-lg);width:100%;max-width:860px;overflow:hidden;box-shadow:0 20px 60px rgba(7,48,52,.35)}
/* A ficha tem rodapé fixo: a caixa é uma coluna com altura de tela, o miolo rola
   e o rodapé (status + salvar + fechar) fica sempre à vista. */
.modal-cad .modal-box{max-width:920px;display:flex;flex-direction:column;
  max-height:calc(100vh - 72px);margin:36px auto}
.modal-cad .modal-body{flex:1;min-height:0;overflow:auto}
.modal-cad .modal-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:11px 16px;background:var(--surface);border-top:1px solid var(--line)}
.modal-cad .modal-foot .spacer{flex:1}
.modal-top{position:sticky;top:0;z-index:2;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:10px;padding:13px 16px}
.modal-top b{font-size:var(--fs-4);font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-top .spacer{flex:1}
.modal-top .cad-id{font-size:var(--fs-2);font-weight:700;color:#cfe6e2;white-space:nowrap}
.modal-top button{font-family:var(--sans);font-size:var(--fs-5);font-weight:800;line-height:1;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:var(--radius-pill);width:32px;height:32px;cursor:pointer}
.modal-body{padding:16px}
/* Aviso de "tem coisa por gravar": aparece no primeiro pedido de fechar e o
   segundo fecha mesmo assim — confirmação em dois tempos, sem caixa do navegador. */
.cad-aviso{font-size:var(--fs-2);font-weight:700;color:#8a5117;background:var(--amber-soft);
  border:1px solid var(--amber-line);border-radius:var(--radius-sm);padding:6px 10px}
.cad-aviso[hidden]{display:none}
@media(max-width:640px){
  .modal-cad{padding:8px}
  .modal-cad .modal-box{max-height:calc(100vh - 16px)}
}
/* ---- seções da ficha: um assunto por bloco ----
   Cada assunto ("Alvará Sanitário") é um bloco com o documento e o vencimento
   dele juntos — que é como a pessoa pensa, e não em "coluna de link" e "coluna
   de data" em partes opostas da linha. O bloco abre e fecha: quem veio conferir
   uma coisa não precisa passar os olhos pelas outras seis. */
.msec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.msec-tit{width:100%;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  padding:10px 13px;border:0;background:#F7F3EC;font-family:var(--sans);
  font-size:var(--fs-1);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--brand-dark);text-align:left}
.msec-tit:hover{background:#EFE8DC}
.msec-tit .arw{font-size:10px;color:var(--muted);transition:transform .15s}
.msec.fechado .msec-tit .arw{transform:rotate(-90deg)}
/* O contador é o que impede a seção fechada de virar esconderijo: ela diz
   quantos campos já têm resposta sem precisar abrir. */
.msec-tit .n{margin-left:auto;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);font-size:var(--fs-1)}
/* O corpo some só por CSS: os campos continuam no DOM, então salvar e o "tentar
   de novo" continuam funcionando com a seção fechada. */
.msec.fechado .msec-campos{display:none}
.msec-campos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 13px 14px}
.mfld{display:flex;flex-direction:column;min-width:0;gap:4px}
.mfld.full{grid-column:1/-1}
.mfld>.lbl{font-size:var(--fs-1);font-weight:800;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfld>.lbl .lock{opacity:.6;font-weight:700}
@media(max-width:600px){.msec-campos{grid-template-columns:1fr}}
/* Rodapé da ficha: o que ela salva sozinha, a pasta do Drive e a planilha. */
.rodape{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:var(--fs-2);color:var(--muted)}
.rodape .lk{color:var(--brand-teal-txt);text-decoration:none;font-weight:800;font-size:var(--fs-2);display:inline-flex;align-items:center;gap:5px}
.rodape .lk svg{width:13px;height:13px}
.rodape .lk:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}
/* Faixa do "não gravei" dentro da ficha, com o botão de tentar de novo. */
.ign{background:var(--amber-soft);border:1px solid var(--amber-line);color:#8a5117;border-radius:var(--radius-sm);
  padding:8px 11px;font-size:var(--fs-2);font-weight:700;margin-bottom:10px}
.ign:empty{display:none}

<!-- A ficha do cliente. Fica FORA do #app de propósito: carregar() repinta o
     #app inteiro, e uma recarga não pode apagar a ficha que alguém está
     preenchendo. -->

      <span class="spacer"></span>

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
/* A chave da equipe não é mais fixa: é o código do dia de cada colaborador
   (aba "Colaboradores" da planilha de Contatos), que chega por e-mail no
   index.html. Esta constante ficou vazia de propósito — se voltar a ter valor,
   volta a existir uma senha compartilhada que não expira e não diz quem é quem. */
const CHAVE_PADRAO = '';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}

/* Sem chave na URL não há painel da equipe. A porta é o index.html: a pessoa
   digita o e-mail, recebe o código do dia e volta para CÁ — é para isso que
   serve o `destino`, senão todo login despejaria a pessoa na home da equipe,
   longe do que ela tinha clicado.
   Esta página ficou de fora da primeira rodada de endurecimento e passou dias
   com a chave fixa antiga escrita aqui como padrão: quem soubesse a string
   entrava no painel da equipe sem se identificar. */
if (!chaveAtual()) {
  location.replace('index.html?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash.
// Vira a coluna "Colaborador" da aba log.
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;
  try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* ---------- busca que entende CNPJ com e sem pontuação (C.1) ---------- */
function soDigitos(s){return String(s==null?'':s).replace(/\D/g,'');}
/** Compara o texto normalizado e, quando o termo tem 6 dígitos ou mais, também
 *  só os dígitos dos dois lados. */
function casaBusca(alvoTxt,alvoDig,termo){
  const t=normTxt(termo);
  if(!t)return true;
  if(alvoTxt.indexOf(t)>=0)return true;
  const d=soDigitos(termo);
  return d.length>=6&&alvoDig.indexOf(d)>=0;
}
/** Lembra no navegador se a explicação fica aberta — a escolha é de quem usa. */
function ligarDetalhes(el,chave){
  if(!el)return;
  try{if(localStorage.getItem(chave)==='1')el.open=true;}catch(e){}
  el.addEventListener('toggle',()=>{try{localStorage.setItem(chave,el.open?'1':'0');}catch(e){}});
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Ficou vazia de propósito: quem cuida da espera na tela agora é o b4u-espera.js.
   As frases que esta função escrevia falavam em demora e em tentar de novo, e era
   lendo isso que a pessoa recarregava justo quando a resposta já vinha. A função
   continua existindo porque ainda é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
   de espera continua correndo por cima, sem avisar da repetição: quem lê "tentando
   de novo" recarrega justo quando a resposta já vinha. Erro só se a segunda falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
/* O JSONP sempre teve teto; o POST não tinha. Uma resposta perdida no meio de um
   corpo de ~13 MB deixava a promise pendurada para sempre: spinner eterno na
   célula (que sobrevive a filtro e ordenação) e o aviso de "sair sem salvar"
   pedindo confirmação até o F5. Agora há prazo, e quem estourar sabe. */
async function postAcao(obj,ms){
  const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),ms||120000);
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ctl.signal});
    const d=await r.json();
    if(d&&d.erro)throw new Error(d.erro);
    return d;
  }catch(e){
    if(e&&e.name==='AbortError') throw new Error('A resposta demorou demais.');
    throw e;
  }finally{ clearTimeout(t); }
}

/* ---------------- estado ---------------- */
let LINHAS=[], COLUNAS=[], ESPELHADAS=[], EDITAVEIS=[], SIGILOSAS=[], DATAS=[], LINKS=[], META={}, GRUPOS=[];
/* Valores que o filtro de situação realmente conhece — qualquer outra coisa
   cai em 'todos'. É o mesmo ?f= que o painel do colaborador manda no link. */
const FILTROS_OK=['todos','falta','vencidos','d30','d60','d90'];
let FILTRO='todos';      // todos | falta | vencidos | d30 | d60 | d90
let DOC='todos';         // 'todos' ou o nome de uma coluna de vencimento
let TERMO='';
let SO_ATIVOS=true;
let VER_CADASTRO=false;  // mostrar as colunas espelhadas do Registro (só leitura)
let SORT={key:'urgencia',dir:'asc'};
const REVELADAS=new Set();
const hoje=new Date(); hoje.setHours(0,0,0,0);

/* ---------------- revelação progressiva ---------------- */
/* Filtros recolhidos, com memória. O contador ao lado do botão existe para
   evitar o único efeito colateral ruim de esconder filtro: a pessoa esquece que
   filtrou e acha que os dados sumiram. Por isso, com filtro ativo, o painel
   nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da grade. Dois botões de propósito: "mais 20" para quem lê, "todas" para
   quem vai usar Ctrl+F ou imprimir. Buscar ou filtrar volta o teto ao início —
   o resultado é outro, e continuar de onde parou confundiria. */
const PASSO = 20;
let TETO = PASSO;
function rodapeLista(mostrados, total){
  if(total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todas as ${total}</button>
  </div>`;
}

const eh=(lista,c)=>lista.some(x=>normTxt(x)===normTxt(c));
/* Espelhada = vem do Registro por IMPORTRANGE. Escrever nela destruiria a fórmula,
   então aqui ela é só leitura — e fica escondida até você pedir para ver. */
const ehEspelhada=c=>eh(ESPELHADAS,c);
const ehSigilosa=c=>eh(SIGILOSAS,c);
const ehData=c=>eh(DATAS,c);
const ehLink=c=>eh(LINKS,c);
/* Link PURO = endereço da web, não documento. A coluna "Link Prefeitura" é o
   caso que originou isto: a célula oferecia "Enviar ⬆" e alguém foi procurar o
   arquivo da prefeitura para subir. Ninguém faz upload de um portal — cola a
   URL e pronto. As outras colunas de link (documento, cópia, certidão, alvará…)
   continuam com o envio, que é o que a equipe faz nelas.
   O critério é o nome COMEÇAR com "Link" ("Link Prefeitura", "Link do portal").
   O teste roda nas duas telas mesmo onde ainda não há coluna assim: a lista de
   colunas vem do backend em tempo de execução, então basta o cadastro ganhar
   uma "Link …" para a célula errada aparecer sem ninguém mexer aqui.
   Se amanhã aparecer outra coluna de endereço com nome fora desse padrão, é
   aqui — e só aqui — que se ajusta. */
function ehLinkPuro(c){
  if(!ehLink(c)) return false;
  const p=tnorm(tokens(c)[0]||'');            // por tnorm: vem "LINK ", "Link", "link"
  return p==='link'||p==='links';
}
/* O backend manda a lista de colunas editáveis. Coluna fora dela vira só leitura —
   mas senha, data e link continuam editáveis, porque são tipos de campo, não papéis.
   Backend antigo (sem a lista) deixa tudo como está. */
function ehSoLeitura(c){
  if(ehEspelhada(c)) return true;
  if(!EDITAVEIS.length) return false;
  if(ehSigilosa(c)||ehData(c)||ehLink(c)) return false;
  return !eh(EDITAVEIS,c);
}
/* ID e Nome já vêm nas duas primeiras colunas da lista, cravadas */
const ocultaSempre=c=>['id','nome','name'].includes(normTxt(c));
function curto(c){return String(c).replace(/^Vencimento\s+/i,'').replace(/^Certificado de\s+/i,'Cert. ').trim();}

/* ---------------- as colunas que a LINHA da lista mostra ----------------
   Os nomes reais das colunas vêm do backend em tempo de execução e MUDAM quando
   alguém renomeia um cabeçalho no cadastro. Por isso nada de nome cru no código:
   a coluna é procurada por apelido normalizado — exato primeiro, "contém" depois
   — e resolvida uma vez por carga, não a cada linha desenhada. Sem coluna
   correspondente o mapa fica vazio e a linha mostra um traço, que é diferente de
   "o cliente não tem CNPJ". */
function normCol(s){return normTxt(s).replace(/\s+/g,' ').replace(/[?:.]+$/,'');}
function colDe(alts){
  for(const a of alts){const c=COLUNAS.find(x=>normCol(x)===a);if(c)return c;}
  for(const a of alts){const c=COLUNAS.find(x=>normCol(x).indexOf(a)>=0);if(c)return c;}
  return '';
}
let COLS_LINHA={cnpj:'',cidade:''};
function mapearLinha(){
  COLS_LINHA={
    cnpj:colDe(['cnpj ou cpf','cnpj/cpf','cnpj','cpf']),
    cidade:colDe(['cidade','municipio'])
  };
}
/* CNPJ e CPF chegam do cadastro ora pontuados, ora crus. A lista mostra sempre
   pontuado, para a coluna inteira ler igual; o que não tem 11 nem 14 dígitos vai
   como está — inventar máscara em documento estranho esconderia o erro de
   digitação de quem cadastrou. */
function fmtDoc(v){
  const d=soDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return String(v==null?'':v);
}

/* ---------------- grupos de coluna (derivados do NOME, em tempo de execução) ----
   A grade é larga e a planilha muda sozinha, então nada de lista fixa: o grupo sai
   do próprio nome da coluna, em três passos.
   1) tira das pontas as palavras que dizem o PAPEL do campo (link, senha,
      vencimento, login…). O que sobra é o ASSUNTO:
        "Certificado Digital Senha"    -> "Certificado Digital"
        "Link Prefeitura"              -> "Prefeitura"
        "Vencimento Alvará Sanitário"  -> "Alvará Sanitário"
   2) assunto que TERMINA em outro assunto é o mesmo assunto, e o grupo leva o
      nome do pedaço menor — o mais específico:
        "Certificado de CLI" termina em "CLI" -> grupo CLI = [arquivo, vencimento]
      Antes a junção era pelo COMEÇO, e "Certificado de CLI" + "Certificado de
      CRM" viravam um grupo "Certificado de" com os dois documentos dentro e os
      vencimentos jogados em grupos à parte. O dono pediu o contrário: um assunto
      por grupo, cada um com o seu arquivo e a sua data ao lado.
   3) o cabeçalho da coluna passa a mostrar só o PAPEL; o assunto vira a faixa. */
const PAPEIS=new Set(['link','links','url','endereco','vencimento','vencto','venc','vence','validade',
  'valido','data','datas','emissao','expedicao','senha','password','login','usuario','user','acesso',
  'codigo','numero','n','no','status','situacao','observacao','observacoes','obs','protocolo',
  'arquivo','copia','pdf','inicio','fim']);
const PALAVRINHAS=new Set(['de','da','do','das','dos','e','a','o','em','no','na','para','por']);
function tokens(c){return String(c==null?'':c).trim().split(/\s+/).filter(Boolean);}
function tnorm(t){return normTxt(t).replace(/[^0-9a-z\-]/g,'');}
function ehPalavraDePapel(t){const n=tnorm(t);return PAPEIS.has(n)||PALAVRINHAS.has(n);}
function assuntoDe(c){
  let t=tokens(c);
  while(t.length>1&&ehPalavraDePapel(t[0])) t=t.slice(1);
  while(t.length>1&&ehPalavraDePapel(t[t.length-1])) t=t.slice(0,-1);
  return t.join(' ')||String(c||'');
}
/** "Certificado de CLI" termina em "CLI"? Compara palavra a palavra e sempre por
    tnorm: os nomes vêm do cadastro com acento, caixa alta e espaço sobrando, e
    igualdade crua de string deixaria "vencimento  CLI" de fora do grupo. */
function terminaEm(assunto,fim){
  const a=tokens(assunto).map(tnorm), f=tokens(fim).map(tnorm);
  if(!f.length||f.length>a.length) return false;
  return f.every((t,i)=>t===a[a.length-f.length+i]);
}
/** Nome do grupo de um assunto: o MENOR assunto da grade em que ele termina.
    Como todo sufixo mais curto também é sufixo dos maiores, pegar sempre o menor
    já resolve a cadeia inteira de uma vez e não depende da ordem das colunas. */
function assuntoDoGrupo(assunto,todos){
  let nome=assunto, n=tokens(assunto).length;
  todos.forEach(a=>{
    const m=tokens(a).length;
    if(m&&m<n&&terminaEm(assunto,a)){ nome=a; n=m; }
  });
  return nome;
}
/** Duas colunas podem chegar com o mesmo assunto escrito de jeitos diferentes
    ("CLI" e " cli "); o grupo é o mesmo, então a chave dele é normalizada. */
function chaveDeGrupo(nome){return tokens(nome).map(tnorm).join(' ');}
function montarGrupos(cols){
  const assunto=new Map();
  cols.forEach(c=>assunto.set(c,assuntoDe(c)));
  const todos=cols.map(c=>assunto.get(c));
  /* Partição estável: o grupo nasce onde a primeira coluna dele aparece e as irmãs
     se encostam nele — coluna só troca de lugar se uma irmã veio antes. */
  const grupos=[], onde=new Map();
  cols.forEach(c=>{
    const nome=assuntoDoGrupo(assunto.get(c),todos)||curto(c);
    const k=chaveDeGrupo(nome);
    if(!onde.has(k)){onde.set(k,grupos.length);grupos.push({nome,cols:[]});}
    grupos[onde.get(k)].cols.push(c);
  });
  return grupos;
}
/* O rótulo de cada campo dentro do grupo é resolvido por rotFicha(), lá embaixo:
   é ele que tira do nome da coluna o que o título do bloco já disse. A versão que
   existia aqui servia ao cabeçalho da grade, que deixou de existir. */

/* ---------------- datas ---------------- */
function diasAte(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
  return Math.round((new Date(+m[1],+m[2]-1,+m[3])-hoje)/864e5);}
function fmtBR(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(iso||'');}
function estado(v){
  const s=String(v==null?'':v).trim();
  if(!s) return {cl:'vazio',dias:null,txt:'falta'};
  const d=diasAte(s);
  if(d===null) return {cl:'na',dias:null,txt:s.length>7?s.slice(0,7)+'…':s};
  if(d<0)   return {cl:'venc',dias:d,txt:'vencido'};
  if(d<=30) return {cl:'d30',dias:d,txt:d+'d'};
  if(d<=60) return {cl:'d60',dias:d,txt:d+'d'};
  if(d<=90) return {cl:'d90',dias:d,txt:d+'d'};
  return {cl:'ok',dias:d,txt:fmtBR(s).slice(3)};
}
function ativoDe(l){const s=normTxt(l.ativo);if(!s)return null;
  if(/^(sim|s|true|verdadeiro|1|x|ativo)$/.test(s))return true;
  if(/^(nao|n|false|falso|0|-|inativo)$/.test(s))return false;return null;}

function colsData(){return DOC==='todos'?DATAS:[DOC];}
function urgencia(l,keys){
  let min=null;
  (keys||DATAS).forEach(k=>{const st=estado(l.valores[k]);if(st.dias!=null&&(min===null||st.dias<min))min=st.dias;});
  return min;
}
function faltandoCols(l){return colsData().filter(k=>!String(l.valores[k]||'').trim());}
function faltando(l){
  return faltandoCols(l).map(curto);
}

/* ---------------- a situação do cliente na lista ----------------
   É a MESMA régua dos chips e dos cartões (vencido · ≤30 · ≤60 · ≤90), para não
   existirem duas verdades na página. O texto do selo já diz o estado — a cor só
   reforça —, e a faixa lateral da linha repete o mesmo para quem bate o olho de
   longe. "Sem data" não é cinza mudo: é a pendência que o cartão "Faltando
   dados" conta, e é dela que sai a próxima tarefa de alguém. */
function situacaoDe(l){
  if(ativoDe(l)===false) return 'inativo';
  const u=urgencia(l,colsData());
  if(u===null) return 'sem';
  if(u<0)   return 'venc';
  if(u<=30) return 'd30';
  if(u<=60) return 'd60';
  if(u<=90) return 'd90';
  return 'ok';
}
function classeSituacao(l){return 'sit-'+situacaoDe(l);}
function dias(n,txt){return n+' '+(txt||'dia')+(Math.abs(n)===1?'':'s');}
function rotuloSituacao(l,s){
  if(s==='inativo') return {rot:'Inativo',dica:'Cliente marcado como inativo no cadastro.'};
  if(s==='sem')     return {rot:'Sem data',dica:'Nenhum vencimento em data que dê para acompanhar.'};
  const u=urgencia(l,colsData());
  if(s==='venc') return {rot:'Vencido',dica:'O mais atrasado venceu há '+dias(-u)+'.'};
  if(s==='ok')   return {rot:'Em dia',dica:'O vencimento mais próximo ainda está a '+dias(u)+'.'};
  return {rot:u===0?'Vence hoje':'Em '+dias(u),dica:'O vencimento mais próximo é em '+dias(u)+'.'};
}
/* O documento que manda na linha é aquele cujo vencimento está mais perto. Se
   nenhum tem data legível, quem manda é o primeiro SEM vencimento — é ele que
   alguém precisa ir buscar. Só depois vem o que tem anotação em texto livre
   ("Não localizado"), que não é data mas também não é ausência. */
function critico(l){
  const keys=colsData();
  let melhor=null;
  keys.forEach(k=>{const st=estado(l.valores[k]);
    if(st.dias!=null&&(melhor===null||st.dias<melhor.d)) melhor={c:k,d:st.dias,v:l.valores[k]};});
  if(melhor) return melhor;
  const vazia=keys.find(k=>!String(l.valores[k]||'').trim());
  if(vazia) return {c:vazia,d:null,v:''};
  const livre=keys.find(k=>String(l.valores[k]||'').trim());
  return livre?{c:livre,d:null,v:l.valores[livre]}:null;
}
/** Outra coluna que também pede ação agora: sem vencimento, ou vencendo em 30
 *  dias. É o que vira o "+N" ao lado do documento mais crítico. */
function pedeAtencao(l,k){
  const v=String(l.valores[k]||'').trim();
  if(!v) return true;
  const st=estado(v);
  return st.dias!=null&&st.dias<=30;
}

/* ---------------- filtros ---------------- */
function passaFiltro(l){
  if(SO_ATIVOS&&ativoDe(l)===false) return false;
  if(FILTRO==='todos') return true;
  if(FILTRO==='falta') return faltando(l).length>0;
  const u=urgencia(l,colsData());
  if(u===null) return false;
  if(FILTRO==='vencidos') return u<0;
  if(FILTRO==='d30') return u<=30;
  if(FILTRO==='d60') return u<=60;
  if(FILTRO==='d90') return u<=90;
  return true;
}
/* Texto e dígitos da linha, guardados até alguém editar a linha.
   As colunas sigilosas ficam de fora: senha nunca entra na busca. */
function chavesBusca(l){
  if(l._bt==null){
    const campos=COLUNAS.filter(c=>!ehSigilosa(c)).map(c=>l.valores[c]);
    l._bt=normTxt([l.id,l.nome_cliente].concat(campos).join(' '));
    l._bd=[String(l.id)].concat(campos).map(soDigitos).filter(Boolean).join('|');
  }
  return l;
}
function esquecerBusca(l){l._bt=null;l._bd=null;}
function passaBusca(l,termo){
  if(!termo) return true;
  chavesBusca(l);
  return casaBusca(l._bt,l._bd,termo);
}
/* ---------- as chaves de ordenação da lista ----------
   Uma entrada por COLUNA da lista, para o cabeçalho e os chips "Ordenar por"
   ordenarem exatamente pelo que está escrito na linha. `v` devolve o valor cru
   (nunca o texto já formatado: data ordena pelo aaaa-mm-dd, não pelo dd/mm) e
   `t` diz como comparar. Coluna sem valor devolve '' — e vazio vai sempre para
   o fim, nas duas direções. */
const ORD_COLS={
  id:            {t:'txt', v:l=>l.id},
  nome_cliente:  {t:'txt', v:l=>l.nome_cliente},
  cnpj:          {t:'doc', v:l=>COLS_LINHA.cnpj?l.valores[COLS_LINHA.cnpj]:''},
  cidade:        {t:'txt', v:l=>COLS_LINHA.cidade?l.valores[COLS_LINHA.cidade]:''},
  documento:     {t:'txt', v:l=>{const c=critico(l);return c?nomeDoc(c.c):'';}},
  /* Vencimento: dias até o mais próximo, e não o texto da data — é a mesma conta
     dos chips e dos cartões, para a ordem nunca contradizer a situação da linha. */
  urgencia:      {t:'num', v:l=>{const u=urgencia(l,colsData());return u===null?'':u;}},
  /* Situação vai pela GRAVIDADE, não pelo alfabeto: "Vencido" antes de "Em dia"
     é a única ordem que responde "em quem eu preciso mexer hoje". */
  situacao:      {t:'num', v:l=>{const p={venc:0,d30:1,d60:2,d90:3,ok:4,inativo:5,sem:''};
                                 const r=p[situacaoDe(l)];return r==null?'':r;}}
};
/* Texto sem acento e sem caixa: "Água" e "agua" ficam juntas. */
function cmpTxt(a,b){return normTxt(a).localeCompare(normTxt(b),'pt',{numeric:true});}
/* Documento ordena pelos DÍGITOS: com pontuação, "08.852…" e "08852…" caíam em
   pontos distintos da mesma coluna. */
function cmpDoc(a,b){return soDigitos(a).localeCompare(soDigitos(b),'pt',{numeric:true});}
function cmpNum(a,b){const x=parseFloat(String(a).replace(',','.')),y=parseFloat(String(b).replace(',','.'));
  return (isFinite(x)?x:Infinity)-(isFinite(y)?y:Infinity);}
function cmpOrd(a,b){
  const def=ORD_COLS[SORT.key];
  const va=def?def.v(a):a.valores[SORT.key],vb=def?def.v(b):b.valores[SORT.key];
  /* Coluna em branco quer dizer "falta preencher": ela vai SEMPRE para o fim,
     nas duas direções. Jogá-la para o topo no Z→A esconderia justamente o que a
     pessoa abriu a tela para ver. */
  const ea=String(va==null?'':va).trim()==='',eb=String(vb==null?'':vb).trim()==='';
  if(ea&&eb)return 0;
  if(ea)return 1;
  if(eb)return -1;
  const t=def?def.t:'txt';
  const r=t==='num'?cmpNum(va,vb):t==='doc'?cmpDoc(va,vb):cmpTxt(va,vb);
  return SORT.dir==='desc'?-r:r;
}
function visiveis(){
  const termo=String(TERMO||'').trim();
  const arr=LINHAS.filter(l=>passaFiltro(l)&&passaBusca(l,termo));
  /* Ordena o que SOBROU do filtro e da busca — nunca a lista crua. */
  arr.sort((a,b)=>cmpOrd(a,b)||String(a.id).localeCompare(String(b.id),'pt',{numeric:true}));
  return arr;
}

/* ---------------- células ---------------- */
/* Uma data preenchida NÃO tem botão nenhum ao lado — assim nenhum clique
   distraído apaga o vencimento. O atalho de trocar data↔texto só aparece
   quando não há nada a perder: campo vazio, ou campo que já é texto. */
function celData(l,c){
  const v=String(l.valores[c]||'').trim();
  const isISO=/^\d{4}-\d{2}-\d{2}$/.test(v);
  const livre=!!v&&!isISO;
  const st=estado(v);
  const atalho = isISO ? ''
    : (livre ? `<button type="button" class="btn btn--micro modo" data-modo="${esc(c)}" data-para="data" title="Trocar por um campo de data">📅 data</button>`
             : `<button type="button" class="btn btn--micro modo" data-modo="${esc(c)}" data-para="texto" title="Escrever texto (N/A, “Não localizado”…)">texto</button>`);
  return `<div class="dt ${st.cl}">
    ${livre
      ? `<input type="text" data-c="${esc(c)}" value="${esc(v)}" placeholder="ex.: Não localizado">`
      : `<input type="date" data-c="${esc(c)}" value="${isISO?v:''}">`}
    ${atalho}
    <span class="tag-d ${st.cl}">${esc(st.txt)}</span>
  </div>`;
}
function celSigilosa(l,c){
  const v=String(l.valores[c]||'');
  const aberta=REVELADAS.has(l.id+'|'+c);
  return `<div class="sig">
    <input type="${aberta?'text':'password'}" data-c="${esc(c)}" value="${esc(v)}" autocomplete="off" placeholder="—">
    <button type="button" class="btn btn--micro" data-ver="${esc(c)}" title="${aberta?'Esconder':'Mostrar'}">${aberta?'🙈':'👁️'}</button>
    <button type="button" class="btn btn--micro" data-copiar="${esc(c)}" title="Copiar">📋</button>
  </div>`;
}
/* Só abre o que é mesmo endereço — campo vazio ou com anotação solta deixa o
   atalho apagado, para ninguém cair numa guia em branco. */
function urlOk(v){return /^https?:\/\/[^\s]+$/i.test(String(v==null?'':v).trim());}
function atalhoAbrir(v){
  const u=String(v||'').trim();
  return urlOk(u)
    ? `<a class="lk-ir" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="Abrir em outra guia">↗</a>`
    : `<span class="lk-ir off" title="Sem endereço válido para abrir" aria-hidden="true">↗</span>`;
}
/* Células com o campo de URL à mostra (o "⋯" aberto), por id|coluna. */
const ABERTAS=new Set();
/* Envios em andamento: id|coluna -> nome do arquivo. */
const ENVIANDO=new Map();
/* Erro por célula, com validade — id|coluna -> {txt, ate}. Um aviso que fica
   para sempre atravessa filtro e busca e ainda está lá meia hora depois. */
const ERROS=new Map();
const chaveCel=(id,c)=>String(id)+'|'+c;

function erroDaCel(l,c){
  const e=ERROS.get(chaveCel(l.id,c));
  if(!e) return '';
  if(Date.now()>e.ate){ ERROS.delete(chaveCel(l.id,c)); return ''; }
  return `<span class="doc-erro">${esc(e.txt)}</span>`;
}

/* A coluna de link de DOCUMENTO não mostra mais o endereço: mostra o documento.
   (A coluna de endereço puro — "Link Prefeitura" e afins — é outra história e
   sai logo no começo desta função; veja ehLinkPuro.)
     tem link ......... Abrir ↗            + ⋯
     vazia ............ Enviar ⬆           + ⋯
     texto solto ...... Enviar ⬆ + a anotação em itálico + ⋯
     enviando ......... roda + nome do arquivo
   O "⋯" guarda o que é raro e o que dá para estragar: o campo de URL editável e
   a troca do arquivo. Coluna que FALHOU ao gravar fica aberta à força — fechar
   mostraria um "Abrir ↗" verde apontando um endereço que só existe na memória
   deste navegador. */
function celLink(l,c){
  const v=String(l.valores[c]||'').trim();
  const k=chaveCel(l.id,c);
  /* Coluna de endereço puro (ehLinkPuro): o campo de URL fica sempre à mostra,
     com o atalho de abrir ao lado. Sem "Enviar ⬆" e sem o "⋯" — não há arquivo
     para mandar nem para trocar, e esconder o campo atrás do "⋯" só somaria um
     clique a quem veio colar um endereço. */
  if(ehLinkPuro(c)){
    return `<div class="doc" data-cel="${esc(k)}">
      <div class="lk-cel">
        <input type="text" data-c="${esc(c)}" data-link="1" value="${esc(v)}" placeholder="https://…" inputmode="url" spellcheck="false">
        ${atalhoAbrir(v)}
      </div>
      ${erroDaCel(l,c)}</div>`;
  }
  const f=FALHAS.get(String(l.id));
  const falhou=!!(f&&f.campos&&f.campos.has(c));
  const enviando=ENVIANDO.get(k);

  if(enviando!==undefined){
    return `<div class="doc" data-cel="${esc(k)}"><span class="doc-spin"></span>
      <span class="doc-obs">${esc(enviando)}</span></div>`;
  }

  if(ABERTAS.has(k)||falhou){
    /* O "⋯" aberto é onde moram as DUAS formas de trocar o documento: mandar
       outro arquivo (o mesmo fluxo do "Enviar ⬆" — o backend já grava por cima e
       responde `substituiu`) e colar um endereço à mão. Até aqui só existia o
       campo de endereço: uma célula preenchida oferecia "Abrir ↗" e mais nada, e
       trocar o arquivo não tinha caminho nenhum na tela. */
    const jaTem=urlOk(v);
    return `<div class="doc" data-cel="${esc(k)}">
      <div class="lk-cel">
        <input type="text" data-c="${esc(c)}" data-link="1" value="${esc(v)}" placeholder="https://…" inputmode="url" spellcheck="false">
        ${atalhoAbrir(v)}
      </div>
      <button type="button" class="doc-bt doc-env" data-env="${esc(c)}" title="${jaTem?'Sobe outro arquivo no lugar do que está aqui':'Sobe o arquivo para a pasta do cliente'}">${jaTem?'Enviar outro arquivo ⬆':'Enviar ⬆'}</button>
      <button type="button" class="doc-mais" data-mais="${esc(c)}" title="Fechar">✕</button>
      ${erroDaCel(l,c)}</div>`;
  }

  const acao=urlOk(v)
    ? `<a class="doc-bt doc-ir" href="${esc(v)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`
    : `<button type="button" class="doc-bt doc-env" data-env="${esc(c)}">Enviar ⬆</button>` +
      (v?`<span class="doc-obs" title="${esc(v)}">${esc(v)}</span>`:'');
  return `<div class="doc" data-cel="${esc(k)}">${acao}
    <button type="button" class="doc-mais" data-mais="${esc(c)}" title="Trocar o arquivo ou colar um endereço">⋯</button>
    ${erroDaCel(l,c)}</div>`;
}
/* ---------------- envio do documento ---------------- */
const DOC_MAX=10*1024*1024;                 // igual ao anexo de chamado
let DOC_ALVO=null;                          // {id, coluna} do clique que abriu o seletor

/* A célula é trocada por ela mesma (outerHTML), e não pelo miolo do campo que a
   contém: dentro da ficha quem envolve a célula é o rótulo, e repintar o
   envelope levaria o nome do campo junto. */
function repintarCel(l,c){
  const cel=document.querySelector('.corpo[data-id="'+CSS.escape(String(l.id))+'"] [data-cel="'+CSS.escape(chaveCel(l.id,c))+'"]');
  if(cel) cel.outerHTML=celLink(l,c);
}
function erroNaCel(l,c,txt){
  ERROS.set(chaveCel(l.id,c),{txt:txt,ate:Date.now()+45000});
  repintarCel(l,c);
}
function lerBase64(file){
  return new Promise((ok,fail)=>{
    const fr=new FileReader();
    fr.onerror=()=>fail(new Error('Não consegui ler o arquivo.'));
    fr.onload=()=>{ const s=String(fr.result||''); ok(s.slice(s.indexOf(',')+1)); };
    fr.readAsDataURL(file);
  });
}
async function enviarDocumento(l,c,file){
  if(file.size>DOC_MAX){
    erroNaCel(l,c,'O arquivo tem '+(file.size/1048576).toFixed(1)+' MB e o limite é 10 MB.');
    return;
  }
  const k=chaveCel(l.id,c);
  ERROS.delete(k); ENVIANDO.set(k,file.name); repintarCel(l,c);
  setSave('saving','Enviando '+file.name+'…');
  try{
    const b64=await lerBase64(file);
    const d=await postAcao({acao:'licenca_upload', id:l.id, coluna:c,
      cliente:l.valores['Nome']||'', cod:respAtual(),
      arquivo_nome:file.name, arquivo_tipo:file.type||'application/octet-stream',
      arquivo_base64:b64});
    // resposta sem url NÃO apaga o link que já estava lá
    if(d&&d.url){ l.valores[c]=d.url; esquecerBusca(l); }
    setSave('ok',(d&&d.substituiu?'Documento substituído ✓ ':'Documento enviado ✓ ')+horaAgora());
  }catch(e){
    /* O texto da exceção continua sendo lido aqui — só para separar o timeout do
       resto — mas nunca chega à tela: na célula vai um aviso em português nosso. */
    const msg=String((e&&e.message)||e);
    /* No timeout o arquivo PODE ter subido: o servidor grava dentro do lock e só
       depois responde. Reenviar às cegas duplicaria o documento na pasta. */
    erroNaCel(l,c, msg.indexOf('demorou')>-1
      ? 'Demorou demais. O arquivo pode ter subido — recarregue antes de mandar de novo.'
      : 'Não foi possível enviar o documento. Tente de novo.');
    setSave('err','Não foi possível enviar. Tente de novo.');
  }finally{
    ENVIANDO.delete(k); repintarCel(l,c);
    /* A linha da lista acompanha: quem sobe um documento com a ficha aberta vê a
       célula; quem fechou a ficha no meio do envio vê a linha certa ao voltar. */
    atualizarCabeca(l.id);
  }
}

function celSoLeitura(l,c){
  const v=String(l.valores[c]||'');
  const t=ehEspelhada(c)?'Vem do cadastro do cliente — edite em Registros de clientes'
                        :'Coluna mantida pelo sistema — só leitura';
  const caixa=`<div class="ro" title="${esc(t)}">${esc(v||'—')}</div>`;
  /* link só de leitura continua abrindo: some o campo, fica o atalho */
  return ehLink(c)?`<div class="lk-cel">${caixa}${atalhoAbrir(v)}</div>`:caixa;
}
function cel(l,c){
  if(ehSoLeitura(c)) return celSoLeitura(l,c);
  if(ehSigilosa(c))  return celSigilosa(l,c);
  if(ehData(c))      return celData(l,c);
  if(ehLink(c))      return celLink(l,c);
  return `<input type="text" data-c="${esc(c)}" value="${esc(l.valores[c]||'')}">`;
}

/* ---------------- render ---------------- */
function colsVisiveis(){
  return COLUNAS.filter(c=>!ocultaSempre(c)&&(VER_CADASTRO||!ehEspelhada(c)));
}
/* O agrupamento por assunto continua sendo derivado do nome em tempo de execução
   — é ele que mantém CLI, CRM, Alvará etc. cada um com o seu arquivo e o seu
   vencimento juntos. Antes ele desenhava a faixa escura por cima da grade;
   agora desenha as SEÇÕES da ficha. Mesma informação, mesmo código.
   O mapa ao contrário (coluna -> assunto) é o que deixa a lista dizer o NOME do
   documento — "Alvará Sanitário", e não "Vencimento Alvará Sanitário". */
let GRUPO_DE=new Map();
function montarGruposAgora(){
  GRUPOS=montarGrupos(colsVisiveis());
  GRUPO_DE=new Map();
  GRUPOS.forEach(g=>g.cols.forEach(c=>GRUPO_DE.set(c,g.nome)));
}
function nomeDoc(c){return GRUPO_DE.get(c)||assuntoDe(c)||curto(c);}
/* Pasta do cliente no Drive (vem do cadastro, no payload da grade). Só vira
   botão quando há endereço de verdade — campo vazio some, em vez de virar um
   link morto. Mora no rodapé da ficha: na lista ele seria um link clicável
   dentro de uma linha clicável, e o clique certo viraria loteria. */
function atalhoDrive(l){
  const u=String(l.drive||'').trim();
  if(!urlOk(u)) return '';
  return `<a class="lk drive" href="${esc(u)}" target="_blank" rel="noopener noreferrer"`
    +` title="Abrir a pasta deste cliente no Drive" aria-label="Abrir a pasta de `
    +`${esc(l.nome_cliente||l.id)} no Drive">`
    +`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">`
    +`<path d="M4 20h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-7.5L10 4H4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1z"/></svg>Pasta no Drive ↗</a>`;
}

/* ---------------- a linha da lista ----------------
   ID · Cliente · CNPJ · Cidade · Documento mais crítico · Vencimento mais
   próximo · Situação. Nenhum input, select ou textarea aqui dentro: a lista é de
   leitura, e é isso que impede alterar sem querer. Toda edição acontece na ficha.
   É um role="button" (e não um <button>) porque dentro dele há pílulas e selos
   com title próprio; o teclado é atendido à mão no keydown (Enter e Espaço). */

/** O que não coube nas sete colunas vira o title da linha: dá para conferir sem
 *  abrir nada — inclusive os outros vencimentos, que na grade ficavam a uma
 *  rolagem lateral de distância. */
function tituloLinha(l){
  const p=[];
  if(COLS_LINHA.cnpj)  p.push('CNPJ: '+(String(l.valores[COLS_LINHA.cnpj]||'').trim()||'em branco'));
  if(COLS_LINHA.cidade)p.push('Cidade: '+(String(l.valores[COLS_LINHA.cidade]||'').trim()||'em branco'));
  colsData().forEach(k=>{
    const v=String(l.valores[k]||'').trim(),st=estado(v);
    p.push(nomeDoc(k)+': '+(v?(st.dias!=null?fmtBR(v)+' — '+st.txt:v):'sem vencimento'));
  });
  if(ativoDe(l)===false)p.push('Cliente inativo');
  p.push('Clique para abrir a ficha.');
  return p.join(' · ');
}
/* Uma pílula INTEIRA com o nome do documento mais crítico; o que não coube vira
   "+N", que continua dizendo que há mais (a lista completa está no title da
   linha e na ficha). Pílula cortada ("Alvará San…") não identifica documento
   nenhum, e era pior que mostrar uma a menos.
   Por isso o orçamento de largura, igual ao das pílulas de produto do
   registro.html: com um assunto comprido ("Certificado Digital Responsável
   Legal") o "+N" sairia pela borda e apareceria pela metade, então ele cede a
   vez — a contagem inteira continua no title, que é onde ela já estava. */
const DOC_LARGURA=19;
function docsHTML(l,crit){
  if(!crit) return '<span class="c-falta">sem documento</span>';
  const outros=colsData().filter(k=>k!==crit.c&&pedeAtencao(l,k));
  const semData=crit.d===null&&!String(crit.v||'').trim();
  const nome=nomeDoc(crit.c);
  return `<span class="c-tag${semData?' semdata':''}" title="${esc(nome+(semData?' — sem vencimento informado':''))}">${esc(nome)}</span>`+
    (outros.length&&nome.length<=DOC_LARGURA
      ?`<span class="c-tag mais" title="${esc('Também pedem atenção: '+outros.map(nomeDoc).join(', '))}">+${outros.length}</span>`:'');
}
/** Vencimento mais próximo: data em dd/mm/aaaa, o texto livre como foi escrito,
 *  e "sem data" quando é isso que falta — coluna em branco diz o que falta em
 *  vez de ficar muda. */
function vencHTML(crit){
  if(!crit) return '<span class="c-falta">—</span>';
  if(crit.d!=null) return esc(fmtBR(crit.v));
  const v=String(crit.v||'').trim();
  return v?esc(estado(v).txt):'<span class="c-falta">sem data</span>';
}
function cabecaHTML(l){
  const s=situacaoDe(l),info=rotuloSituacao(l,s);
  const doc=COLS_LINHA.cnpj?String(l.valores[COLS_LINHA.cnpj]||'').trim():'';
  const cid=COLS_LINHA.cidade?String(l.valores[COLS_LINHA.cidade]||'').trim():'';
  const crit=critico(l);
  const nf=faltandoCols(l).length;
  return `<div class="cli-head" role="button" tabindex="0" aria-haspopup="dialog" title="${esc(tituloLinha(l))}">
      <span class="c-id">${esc(l.id)}</span>
      <span class="c-nome">${esc(l.nome_cliente||'(sem nome)')}</span>
      <span class="c-doc">${COLS_LINHA.cnpj?(doc?esc(fmtDoc(doc)):'<span class="c-falta">sem CNPJ</span>'):'—'}</span>
      <span class="c-cid">${cid?esc(cid):'<span class="c-falta">—</span>'}</span>
      <span class="c-docs">${docsHTML(l,crit)}</span>
      <span class="c-data">${vencHTML(crit)}</span>
      <span class="c-fim"><span class="pill sit-${s}" title="${esc(info.dica)}">${esc(info.rot)}</span>${
        nf?`<span class="selo alerta" title="${esc('Sem vencimento informado: '+faltando(l).join(', '))}">${nf} sem data</span>`:''
      }</span>
    </div>`;
}
/** Seta da coluna ativa — só ela ganha marca, senão a lista pareceria ordenada
 *  por sete critérios ao mesmo tempo.
 *  O espaço antes da seta é NÃO SEPARÁVEL (\u00A0) de propósito: com espaço
 *  comum, o rótulo que quase preenche a coluna empurrava a seta sozinha para uma
 *  segunda linha, e o cabeçalho ficava com o dobro da altura por causa dela. */
function seta(key){return SORT.key===key?(SORT.dir==='asc'?'\u00A0▲':'\u00A0▼'):'';}
/* O cabeçalho das colunas repete a régua da linha (mesma regra de CSS) e some
   abaixo de 900px, onde a linha deixa de ser sete colunas. Cada rótulo é um
   botão que ordena — por isso ele NÃO é mais aria-hidden: aqui não é enfeite, e
   a coluna ativa se anuncia com aria-sort. */
function cabecalhoLista(){
  const bt=(k,rot,estilo)=>{
    const at=SORT.key===k;
    return `<span role="columnheader"${estilo?' style="'+estilo+'"':''}`+
      `${at?` aria-sort="${SORT.dir==='asc'?'ascending':'descending'}"`:''}>`+
      `<button type="button" data-sort="${esc(k)}" title="Ordenar por ${esc(rot)}">${esc(rot)}${seta(k)}</button></span>`;
  };
  return `<div class="lista-cab" role="row">`+
    bt('id','ID')+bt('nome_cliente','Cliente')+bt('cnpj','CNPJ / CPF')+bt('cidade','Cidade')+
    bt('documento','Documento mais crítico')+bt('urgencia','Vencimento','text-align:center')+
    bt('situacao','Situação','text-align:right')+`</div>`;
}

/* Rótulo do campo dentro da ficha. "Link Contrato Social" é nome de COLUNA de
   planilha; na ficha o assunto já está no título do bloco, então o campo só
   precisa dizer o que ele é. */
function rotFicha(c,grupo){
  /* Coluna de endereço puro não é documento: chamá-la de "Documento" aqui seria
     repetir o engano que fez alguém sair à procura do arquivo da prefeitura para
     subir. O título do bloco já diz de quem é o endereço. */
  if(ehLinkPuro(c)) return 'Endereço';
  let t=String(c||'').replace(/^link\s+/i,'').trim();
  if(/^vencimento/i.test(t)) return 'Vencimento';
  if(grupo){
    const g=normTxt(grupo);
    const tn=normTxt(t);
    /* Coluna com o mesmo nome do bloco: o rótulo diz o que o campo É, senão a
       ficha repetiria o título logo abaixo dele. "Documento" só vale para coluna
       de link — chamar assim uma coluna de observação seria informação errada. */
    if(tn===g) return ehLink(c)?'Documento':ehSigilosa(c)?'Senha':t;
    if(tn.startsWith(g+' ')) t=t.slice(grupo.length).trim();
  }
  return t||c;
}
/* Blocos fechados por linha: id -> Set de índices de grupo. Fica só na memória
   da sessão, de propósito — abrir tudo de novo é um clique, e guardar isso por
   cliente viraria estado que ninguém lembra de ter criado. */
const GRP_FECHADOS=new Map();
function grupoFechado(id,g){ const s=GRP_FECHADOS.get(String(id)); return !!(s&&s.has(g)); }
function alternarGrupo(id,g){
  const k=String(id); if(!GRP_FECHADOS.has(k)) GRP_FECHADOS.set(k,new Set());
  const s=GRP_FECHADOS.get(k); if(s.has(g)) s.delete(g); else s.add(g);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.msec-tit'); if(!t) return;
  const sec=t.closest('.msec'), corpo=t.closest('.corpo');
  if(!sec||!corpo) return;
  const g=+sec.dataset.g;
  alternarGrupo(corpo.dataset.id,g);
  const fechado=grupoFechado(corpo.dataset.id,g);
  sec.classList.toggle('fechado',fechado);
  t.setAttribute('aria-expanded',String(!fechado));
});

/* ---------------- o conteúdo da ficha ----------------
   É o mesmo que o modo fichas já montava: cada assunto num bloco, com o
   documento e o vencimento dele lado a lado, e o rótulo do campo dizendo só o
   que o título do bloco ainda não disse. As quatro células (senha, data,
   documento/link e só-leitura) continuam sendo as de sempre — cel() não mudou. */
function corpoHTML(l){
  const blocos=GRUPOS.map((g,gi)=>{
    const fech=grupoFechado(l.id,gi);
    const preenchidos=g.cols.filter(c=>String(l.valores[c]||'').trim()).length;
    const campos=g.cols.map(c=>{
      const trav=ehSoLeitura(c);
      /* Campo de endereço ocupa a linha inteira: uma URL de 120 caracteres numa
         coluna de metade da ficha vira um risco. */
      return `<div class="mfld${ehLink(c)?' full':''}">`
        +`<span class="lbl">${esc(rotFicha(c,g.nome))}${trav?' <span class="lock" title="Só leitura">🔒</span>':''}</span>`
        +cel(l,c)+`</div>`;
    }).join('');
    return `<div class="msec${fech?' fechado':''}" data-g="${gi}">
      <button type="button" class="msec-tit" aria-expanded="${fech?'false':'true'}">`
      +`<span class="arw" aria-hidden="true">▼</span>${esc(g.nome)}`
      +`<span class="n">${preenchidos} de ${g.cols.length}</span></button>
      <div class="msec-campos">${campos}</div>
    </div>`;
  }).join('');
  return `<div class="corpo" data-id="${esc(l.id)}">
    <div class="ign"></div>
    ${blocos||'<div class="vazio">Esse cliente não tem colunas para mostrar.</div>'}
    <div class="rodape">
      <span>As alterações salvam sozinhas. Campos com 🔒 são só leitura — vêm do cadastro do cliente ou são mantidos pelo sistema.</span>
      ${atalhoDrive(l)}
      ${META.planilha_url?`<a class="lk" href="${esc(META.planilha_url)}" target="_blank" rel="noopener noreferrer">Planilha ↗</a>`:''}
    </div>
  </div>`;
}

function desenharLista(){
  montarGruposAgora();
  const arr=visiveis();
  document.getElementById('cnt').textContent=arr.length+' de '+LINHAS.length+' clientes';
  const el=document.getElementById('lista');
  /* A lista nasce com 20 linhas: 111 linhas de uma vez era a parede que o dono do
     produto reclamou. Quem vai conferir muitos pede "todas" uma vez e segue
     igual; quem só veio ver um cliente nunca paga por 111. */
  const total=arr.length;
  const n=Math.min(TETO,total);
  el.innerHTML=total
    ? cabecalhoLista()+arr.slice(0,n).map(l=>
        `<div class="cli ${classeSituacao(l)}${ABERTOS.has(String(l.id))?' aberto':''}" data-id="${esc(l.id)}">${cabecaHTML(l)}</div>`).join('')
    : `<div class="vazio">Nada com esse filtro.</div>`;
  const rod=document.getElementById('rodape-lista');
  if(rod)rod.innerHTML=rodapeLista(n,total)+
    (total>n?`<span class="quanto">Mostrando ${n} de ${total} linhas.</span>`:'');
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
}
function itemResumo(l,c){
  const st=estado(l.valores[c]);
  return `<button type="button" class="tk" data-goto="${esc(l.id)}">
    <span class="d">${st.dias!=null&&st.dias<0?'vencido':fmtBR(l.valores[c])}</span>
    <span class="lb">${esc(l.nome_cliente||l.id)}</span>
    <span class="tp">${esc(curto(c))}</span></button>`;
}
function desenharResumo(){
  const keys=colsData();
  const base=LINHAS.filter(l=>!SO_ATIVOS||ativoDe(l)!==false);
  const itens=(min,max)=>{
    const out=[];
    base.forEach(l=>keys.forEach(k=>{const st=estado(l.valores[k]);
      if(st.dias!=null&&st.dias>=min&&st.dias<=max)out.push({l,k,d:st.dias});}));
    out.sort((a,b)=>a.d-b.d); return out;
  };
  const venc=itens(-99999,-1), d30=itens(0,30), d60=itens(31,60);
  const falta=base.filter(l=>faltando(l).length>0);
