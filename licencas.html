  cidade:        {t:'txt', v:l=>COLS_LINHA.cidade?l.valores[COLS_LINHA.cidade]:''},
  documento:     {t:'txt', v:l=>{const c=critico(l);return c?nomeDoc(c.c):'';}},
  /* Vencimento: dias até o mais próximo, e não o texto da data — é a mesma conta
     dos chips e dos cartões, para a ordem nunca contradizer a situação da linha. */
  urgencia:      {t:'num', v:l=>{const u=urgencia(l,colsData());return u===null?'':u;}},
  /* Situação vai pela GRAVIDADE, não pelo alfabeto: "Vencido" antes de "Em dia"
     é a única ordem que responde "em quem eu preciso mexer hoje". */
  situacao:      {t:'num', v:l=>{const p={venc:0,d30:1,d60:2,d90:3,ok:4,inativo:5,sem:''};
                                 const r=p[situacaoDe(l)];return r==null?'':r;}}
};
/* Texto sem acento e sem caixa: "Água" e "agua" ficam juntas. */
function cmpTxt(a,b){return normTxt(a).localeCompare(normTxt(b),'pt',{numeric:true});}
/* Documento ordena pelos DÍGITOS: com pontuação, "08.852…" e "08852…" caíam em
   pontos distintos da mesma coluna. */
function cmpDoc(a,b){return soDigitos(a).localeCompare(soDigitos(b),'pt',{numeric:true});}
function cmpNum(a,b){const x=parseFloat(String(a).replace(',','.')),y=parseFloat(String(b).replace(',','.'));
  return (isFinite(x)?x:Infinity)-(isFinite(y)?y:Infinity);}
function cmpOrd(a,b){
  const def=ORD_COLS[SORT.key];
  const va=def?def.v(a):a.valores[SORT.key],vb=def?def.v(b):b.valores[SORT.key];
  /* Coluna em branco quer dizer "falta preencher": ela vai SEMPRE para o fim,
     nas duas direções. Jogá-la para o topo no Z→A esconderia justamente o que a
     pessoa abriu a tela para ver. */
  const ea=String(va==null?'':va).trim()==='',eb=String(vb==null?'':vb).trim()==='';
  if(ea&&eb)return 0;
  if(ea)return 1;
  if(eb)return -1;
  const t=def?def.t:'txt';
  const r=t==='num'?cmpNum(va,vb):t==='doc'?cmpDoc(va,vb):cmpTxt(va,vb);
  return SORT.dir==='desc'?-r:r;
}
function visiveis(){
  const termo=String(TERMO||'').trim();
  const arr=LINHAS.filter(l=>passaFiltro(l)&&passaBusca(l,termo));
  /* Ordena o que SOBROU do filtro e da busca — nunca a lista crua. */
  arr.sort((a,b)=>cmpOrd(a,b)||String(a.id).localeCompare(String(b.id),'pt',{numeric:true}));
  return arr;
}

/* ---------------- células ---------------- */
/* Uma data preenchida NÃO tem botão nenhum ao lado — assim nenhum clique
   distraído apaga o vencimento. O atalho de trocar data↔texto só aparece
   quando não há nada a perder: campo vazio, ou campo que já é texto. */
function celData(l,c){
  const v=String(l.valores[c]||'').trim();
  const isISO=/^\d{4}-\d{2}-\d{2}$/.test(v);
  const livre=!!v&&!isISO;
  const st=estado(v);
  const atalho = isISO ? ''
    : (livre ? `<button type="button" class="btn btn--micro modo" data-modo="${esc(c)}" data-para="data" title="Trocar por um campo de data">📅 data</button>`
             : `<button type="button" class="btn btn--micro modo" data-modo="${esc(c)}" data-para="texto" title="Escrever texto (N/A, “Não localizado”…)">texto</button>`);
  return `<div class="dt ${st.cl}">
    ${livre
      ? `<input type="text" data-c="${esc(c)}" value="${esc(v)}" placeholder="ex.: Não localizado">`
      : `<input type="date" data-c="${esc(c)}" value="${isISO?v:''}">`}
    ${atalho}
    <span class="tag-d ${st.cl}">${esc(st.txt)}</span>
  </div>`;
}
function celSigilosa(l,c){
  const v=String(l.valores[c]||'');
  const aberta=REVELADAS.has(l.id+'|'+c);
  return `<div class="sig">
    <input type="${aberta?'text':'password'}" data-c="${esc(c)}" value="${esc(v)}" autocomplete="off" placeholder="—">
    <button type="button" class="btn btn--micro" data-ver="${esc(c)}" title="${aberta?'Esconder':'Mostrar'}">${aberta?'🙈':'👁️'}</button>
    <button type="button" class="btn btn--micro" data-copiar="${esc(c)}" title="Copiar">📋</button>
  </div>`;
}
/* Só abre o que é mesmo endereço — campo vazio ou com anotação solta deixa o
   atalho apagado, para ninguém cair numa guia em branco. */
function urlOk(v){return /^https?:\/\/[^\s]+$/i.test(String(v==null?'':v).trim());}
function atalhoAbrir(v){
  const u=String(v||'').trim();
  return urlOk(u)
    ? `<a class="lk-ir" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="Abrir em outra guia">↗</a>`
    : `<span class="lk-ir off" title="Sem endereço válido para abrir" aria-hidden="true">↗</span>`;
}
/* Células com o campo de URL à mostra (o "⋯" aberto), por id|coluna. */
const ABERTAS=new Set();
/* Envios em andamento: id|coluna -> nome do arquivo. */
const ENVIANDO=new Map();
/* Erro por célula, com validade — id|coluna -> {txt, ate}. Um aviso que fica
   para sempre atravessa filtro e busca e ainda está lá meia hora depois. */
const ERROS=new Map();
const chaveCel=(id,c)=>String(id)+'|'+c;

function erroDaCel(l,c){
  const e=ERROS.get(chaveCel(l.id,c));
  if(!e) return '';
  if(Date.now()>e.ate){ ERROS.delete(chaveCel(l.id,c)); return ''; }
  return `<span class="doc-erro">${esc(e.txt)}</span>`;
}

/* A coluna de link de DOCUMENTO não mostra mais o endereço: mostra o documento.
   (A coluna de endereço puro — "Link Prefeitura" e afins — é outra história e
   sai logo no começo desta função; veja ehLinkPuro.)
     tem link ......... Abrir ↗            + ⋯
     vazia ............ Enviar ⬆           + ⋯
     texto solto ...... Enviar ⬆ + a anotação em itálico + ⋯
     enviando ......... roda + nome do arquivo
   O "⋯" guarda o que é raro e o que dá para estragar: o campo de URL editável e
   a troca do arquivo. Coluna que FALHOU ao gravar fica aberta à força — fechar
   mostraria um "Abrir ↗" verde apontando um endereço que só existe na memória
   deste navegador. */
function celLink(l,c){
  const v=String(l.valores[c]||'').trim();
  const k=chaveCel(l.id,c);
  /* Coluna de endereço puro (ehLinkPuro): o campo de URL fica sempre à mostra,
     com o atalho de abrir ao lado. Sem "Enviar ⬆" e sem o "⋯" — não há arquivo
     para mandar nem para trocar, e esconder o campo atrás do "⋯" só somaria um
     clique a quem veio colar um endereço. */
  if(ehLinkPuro(c)){
    return `<div class="doc" data-cel="${esc(k)}">
      <div class="lk-cel">
        <input type="text" data-c="${esc(c)}" data-link="1" value="${esc(v)}" placeholder="https://…" inputmode="url" spellcheck="false">
        ${atalhoAbrir(v)}
      </div>
      ${erroDaCel(l,c)}</div>`;
  }
  const f=FALHAS.get(String(l.id));
  const falhou=!!(f&&f.campos&&f.campos.has(c));
  const enviando=ENVIANDO.get(k);

  if(enviando!==undefined){
    return `<div class="doc" data-cel="${esc(k)}"><span class="doc-spin"></span>
      <span class="doc-obs">${esc(enviando)}</span></div>`;
  }

  if(ABERTAS.has(k)||falhou){
    /* O "⋯" aberto é onde moram as DUAS formas de trocar o documento: mandar
       outro arquivo (o mesmo fluxo do "Enviar ⬆" — o backend já grava por cima e
       responde `substituiu`) e colar um endereço à mão. Até aqui só existia o
       campo de endereço: uma célula preenchida oferecia "Abrir ↗" e mais nada, e
       trocar o arquivo não tinha caminho nenhum na tela. */
    const jaTem=urlOk(v);
    return `<div class="doc" data-cel="${esc(k)}">
      <div class="lk-cel">
        <input type="text" data-c="${esc(c)}" data-link="1" value="${esc(v)}" placeholder="https://…" inputmode="url" spellcheck="false">
        ${atalhoAbrir(v)}
      </div>
      <button type="button" class="doc-bt doc-env" data-env="${esc(c)}" title="${jaTem?'Sobe outro arquivo no lugar do que está aqui':'Sobe o arquivo para a pasta do cliente'}">${jaTem?'Enviar outro arquivo ⬆':'Enviar ⬆'}</button>
      <button type="button" class="doc-mais" data-mais="${esc(c)}" title="Fechar">✕</button>
      ${erroDaCel(l,c)}</div>`;
  }

  const acao=urlOk(v)
    ? `<a class="doc-bt doc-ir" href="${esc(v)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`
    : `<button type="button" class="doc-bt doc-env" data-env="${esc(c)}">Enviar ⬆</button>` +
      (v?`<span class="doc-obs" title="${esc(v)}">${esc(v)}</span>`:'');
  return `<div class="doc" data-cel="${esc(k)}">${acao}
    <button type="button" class="doc-mais" data-mais="${esc(c)}" title="Trocar o arquivo ou colar um endereço">⋯</button>
    ${erroDaCel(l,c)}</div>`;
}
/* ---------------- envio do documento ---------------- */
const DOC_MAX=10*1024*1024;                 // igual ao anexo de chamado
let DOC_ALVO=null;                          // {id, coluna} do clique que abriu o seletor

/* A célula é trocada por ela mesma (outerHTML), e não pelo miolo do campo que a
   contém: dentro da ficha quem envolve a célula é o rótulo, e repintar o
   envelope levaria o nome do campo junto. */
function repintarCel(l,c){
  const cel=document.querySelector('.corpo[data-id="'+CSS.escape(String(l.id))+'"] [data-cel="'+CSS.escape(chaveCel(l.id,c))+'"]');
  if(cel) cel.outerHTML=celLink(l,c);
}
function erroNaCel(l,c,txt){
  ERROS.set(chaveCel(l.id,c),{txt:txt,ate:Date.now()+45000});
  repintarCel(l,c);
}
function lerBase64(file){
  return new Promise((ok,fail)=>{
    const fr=new FileReader();
    /* Falha AQUI é do navegador lendo o disco: nada saiu daqui, e é o único erro
       deste caminho sobre o qual dá para afirmar "não subiu". Marcado, para não
       cair na peneira de erro de servidor lá embaixo. */
    fr.onerror=()=>{const x=new Error('Não consegui ler o arquivo.');x.local=true;fail(x);};
    fr.onload=()=>{ const s=String(fr.result||''); ok(s.slice(s.indexOf(',')+1)); };
    fr.readAsDataURL(file);
  });
}
async function enviarDocumento(l,c,file){
  if(file.size>DOC_MAX){
    erroNaCel(l,c,'O arquivo tem '+(file.size/1048576).toFixed(1)+' MB e o limite é 10 MB.');
    return;
  }
  const k=chaveCel(l.id,c);
  ERROS.delete(k); ENVIANDO.set(k,file.name); repintarCel(l,c);
  setSave('saving','Enviando '+file.name+'…');
  try{
    const b64=await lerBase64(file);
    const d=await postAcao({acao:'licenca_upload', id:l.id, coluna:c,
      cliente:l.valores['Nome']||'', cod:respAtual(),
      arquivo_nome:file.name, arquivo_tipo:file.type||'application/octet-stream',
      arquivo_base64:b64});
    // resposta sem url NÃO apaga o link que já estava lá
    if(d&&d.url){ l.valores[c]=d.url; esquecerBusca(l); }
    setSave('ok',(d&&d.substituiu?'Documento substituído ✓ ':'Documento enviado ✓ ')+horaAgora());
  }catch(e){
    /* Antes, o timeout era reconhecido FAREJANDO a palavra "demorou" no texto da
       exceção. Bastava alguém reescrever a mensagem — ou a falha chegar por outro
       caminho, como o `r.json()` topando com uma página HTML — para o aviso virar
       "tente de novo" num envio que PODE ter dado certo. Agora quem responde é o
       `.incerto`, que o postAcao marca; o texto voltou a ser só texto.
       Enviar de novo às cegas duplicaria o documento na pasta do cliente, e por
       isso esta rota nunca diz "tente de novo" — ela manda recarregar e conferir.
       Não há conferência automática aqui: o que se compara numa gravação de campo
       é o valor mandado, e num upload o valor é uma URL que o servidor inventa. */
    if(e&&e.local){
      erroNaCel(l,c,'Não consegui ler o arquivo. Escolha de novo.');
      setSave('err','Não consegui ler o arquivo.');
    }else if(e&&e.incerto){
      erroNaCel(l,c,'Não consegui confirmar se subiu. Recarregue antes de mandar de novo — o documento pode já estar na pasta.');
      setSave('err','Não consegui confirmar se o documento subiu. Recarregue antes de mandar de novo.');
    }else if(e&&e.doServidor){
      erroNaCel(l,c,'O servidor recusou: '+String((e&&e.message)||e));
      setSave('err','O servidor recusou o documento.');
    }else{
      /* Sobrou o que NÃO veio do postAcao — ele só devolve `doServidor` ou
         `incerto`. Isto estourou depois, no código que guarda a URL e repinta a
         célula: o envio já tinha voltado, o documento SUBIU. Dizer "o servidor
         recusou" aqui era acusar o servidor de um erro nosso, e ainda convidar a
         subir o mesmo arquivo de novo. */
      erroNaCel(l,c,'O documento subiu, mas a tela não acompanhou. Recarregue para ver o link.');
      setSave('ok','Documento enviado ✓ '+horaAgora()+' · recarregue para a tela acompanhar');
    }
  }finally{
    ENVIANDO.delete(k); repintarCel(l,c);
    /* A linha da lista acompanha: quem sobe um documento com a ficha aberta vê a
       célula; quem fechou a ficha no meio do envio vê a linha certa ao voltar. */
    atualizarCabeca(l.id);
  }
}

function celSoLeitura(l,c){
  const v=String(l.valores[c]||'');
  const t=ehEspelhada(c)?'Vem do cadastro do cliente — edite em Registros de clientes'
                        :'Coluna mantida pelo sistema — só leitura';
  const caixa=`<div class="ro" title="${esc(t)}">${esc(v||'—')}</div>`;
  /* link só de leitura continua abrindo: some o campo, fica o atalho */
  return ehLink(c)?`<div class="lk-cel">${caixa}${atalhoAbrir(v)}</div>`:caixa;
}
function cel(l,c){
  if(ehSoLeitura(c)) return celSoLeitura(l,c);
  if(ehSigilosa(c))  return celSigilosa(l,c);
  if(ehData(c))      return celData(l,c);
  if(ehLink(c))      return celLink(l,c);
  return `<input type="text" data-c="${esc(c)}" value="${esc(l.valores[c]||'')}">`;
}

/* ---------------- render ---------------- */
function colsVisiveis(){
  return COLUNAS.filter(c=>!ocultaSempre(c)&&(VER_CADASTRO||!ehEspelhada(c)));
}
/* O agrupamento por assunto continua sendo derivado do nome em tempo de execução
   — é ele que mantém CLI, CRM, Alvará etc. cada um com o seu arquivo e o seu
   vencimento juntos. Antes ele desenhava a faixa escura por cima da grade;
   agora desenha as SEÇÕES da ficha. Mesma informação, mesmo código.
   O mapa ao contrário (coluna -> assunto) é o que deixa a lista dizer o NOME do
   documento — "Alvará Sanitário", e não "Vencimento Alvará Sanitário". */
let GRUPO_DE=new Map();
function montarGruposAgora(){
  GRUPOS=montarGrupos(colsVisiveis());
  GRUPO_DE=new Map();
  GRUPOS.forEach(g=>g.cols.forEach(c=>GRUPO_DE.set(c,g.nome)));
}
function nomeDoc(c){return GRUPO_DE.get(c)||assuntoDe(c)||curto(c);}
/* Pasta do cliente no Drive (vem do cadastro, no payload da grade). Só vira
   botão quando há endereço de verdade — campo vazio some, em vez de virar um
   link morto. Mora no rodapé da ficha: na lista ele seria um link clicável
   dentro de uma linha clicável, e o clique certo viraria loteria. */
function atalhoDrive(l){
  const u=String(l.drive||'').trim();
  if(!urlOk(u)) return '';
  return `<a class="lk drive" href="${esc(u)}" target="_blank" rel="noopener noreferrer"`
    +` title="Abrir a pasta deste cliente no Drive" aria-label="Abrir a pasta de `
    +`${esc(l.nome_cliente||l.id)} no Drive">`
    +`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">`
    +`<path d="M4 20h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-7.5L10 4H4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1z"/></svg>Pasta no Drive ↗</a>`;
}

/* ---------------- a linha da lista ----------------
   ID · Cliente · CNPJ · Cidade · Documento mais crítico · Vencimento mais
   próximo · Situação. Nenhum input, select ou textarea aqui dentro: a lista é de
   leitura, e é isso que impede alterar sem querer. Toda edição acontece na ficha.
   É um role="button" (e não um <button>) porque dentro dele há pílulas e selos
   com title próprio; o teclado é atendido à mão no keydown (Enter e Espaço). */

/** O que não coube nas sete colunas vira o title da linha: dá para conferir sem
 *  abrir nada — inclusive os outros vencimentos, que na grade ficavam a uma
 *  rolagem lateral de distância. */
function tituloLinha(l){
  const p=[];
  if(COLS_LINHA.cnpj)  p.push('CNPJ: '+(String(l.valores[COLS_LINHA.cnpj]||'').trim()||'em branco'));
  if(COLS_LINHA.cidade)p.push('Cidade: '+(String(l.valores[COLS_LINHA.cidade]||'').trim()||'em branco'));
  colsData().forEach(k=>{
    const v=String(l.valores[k]||'').trim(),st=estado(v);
    p.push(nomeDoc(k)+': '+(v?(st.dias!=null?fmtBR(v)+' — '+st.txt:v):'sem vencimento'));
  });
  if(ativoDe(l)===false)p.push('Cliente inativo');
  p.push('Clique para abrir a ficha.');
  return p.join(' · ');
}
/* Uma pílula INTEIRA com o nome do documento mais crítico; o que não coube vira
   "+N", que continua dizendo que há mais (a lista completa está no title da
   linha e na ficha). Pílula cortada ("Alvará San…") não identifica documento
   nenhum, e era pior que mostrar uma a menos.
   Por isso o orçamento de largura, igual ao das pílulas de produto do
   registro.html: com um assunto comprido ("Certificado Digital Responsável
   Legal") o "+N" sairia pela borda e apareceria pela metade, então ele cede a
   vez — a contagem inteira continua no title, que é onde ela já estava. */
const DOC_LARGURA=19;
function docsHTML(l,crit){
  if(!crit) return '<span class="c-falta">sem documento</span>';
  const outros=colsData().filter(k=>k!==crit.c&&pedeAtencao(l,k));
  const semData=crit.d===null&&!String(crit.v||'').trim();
  const nome=nomeDoc(crit.c);
  return `<span class="c-tag${semData?' semdata':''}" title="${esc(nome+(semData?' — sem vencimento informado':''))}">${esc(nome)}</span>`+
    (outros.length&&nome.length<=DOC_LARGURA
      ?`<span class="c-tag mais" title="${esc('Também pedem atenção: '+outros.map(nomeDoc).join(', '))}">+${outros.length}</span>`:'');
}
/** Vencimento mais próximo: data em dd/mm/aaaa, o texto livre como foi escrito,
 *  e "sem data" quando é isso que falta — coluna em branco diz o que falta em
 *  vez de ficar muda. */
function vencHTML(crit){
  if(!crit) return '<span class="c-falta">—</span>';
  if(crit.d!=null) return esc(fmtBR(crit.v));
  const v=String(crit.v||'').trim();
  return v?esc(estado(v).txt):'<span class="c-falta">sem data</span>';
}
function cabecaHTML(l){
  const s=situacaoDe(l),info=rotuloSituacao(l,s);
  const doc=COLS_LINHA.cnpj?String(l.valores[COLS_LINHA.cnpj]||'').trim():'';
  const cid=COLS_LINHA.cidade?String(l.valores[COLS_LINHA.cidade]||'').trim():'';
  const crit=critico(l);
  const nf=faltandoCols(l).length;
  return `<div class="cli-head" role="button" tabindex="0" aria-haspopup="dialog" title="${esc(tituloLinha(l))}">
      <span class="c-id">${esc(l.id)}</span>
      <span class="c-nome">${esc(l.nome_cliente||'(sem nome)')}</span>
      <span class="c-doc">${COLS_LINHA.cnpj?b4uIdentHTML(doc,COLS_LINHA.cnpj,'sem CNPJ'):'—'}</span>
      <span class="c-cid">${cid?esc(cid):'<span class="c-falta">—</span>'}</span>
      <span class="c-docs">${docsHTML(l,crit)}</span>
      <span class="c-data">${vencHTML(crit)}</span>
      <span class="c-fim"><span class="pill sit-${s}" title="${esc(info.dica)}">${esc(info.rot)}</span>${
        nf?`<span class="selo alerta" title="${esc('Sem vencimento informado: '+faltando(l).join(', '))}">${nf} sem data</span>`:''
      }</span>
    </div>`;
}
/** Seta da coluna ativa — só ela ganha marca, senão a lista pareceria ordenada
 *  por sete critérios ao mesmo tempo.
 *  O espaço antes da seta é NÃO SEPARÁVEL (\u00A0) de propósito: com espaço
 *  comum, o rótulo que quase preenche a coluna empurrava a seta sozinha para uma
 *  segunda linha, e o cabeçalho ficava com o dobro da altura por causa dela. */
function seta(key){return SORT.key===key?(SORT.dir==='asc'?'\u00A0▲':'\u00A0▼'):'';}
/* O cabeçalho das colunas repete a régua da linha (mesma regra de CSS) e some
   abaixo de 900px, onde a linha deixa de ser sete colunas. Cada rótulo é um
   botão que ordena — por isso ele NÃO é mais aria-hidden: aqui não é enfeite, e
   a coluna ativa se anuncia com aria-sort. */
function cabecalhoLista(){
  /* `curto` é o rótulo da BARRA DE ORDENAÇÃO do celular — ver a nota do
     `.cab-sm` na folha. Sem ele, "Venc. do certificado digital" sozinho ocupa
     uma fileira inteira a 390px, e a barra passa de duas para três. */
  const bt=(k,rot,curto,estilo)=>{
    const at=SORT.key===k;
    return `<span role="columnheader"${estilo?' style="'+estilo+'"':''}`+
      `${at?` aria-sort="${SORT.dir==='asc'?'ascending':'descending'}"`:''}>`+
      `<button type="button" data-sort="${esc(k)}" title="Ordenar por ${esc(rot)}">`+
      `<span class="cab-lg">${esc(rot)}</span><span class="cab-sm">${esc(curto||rot)}</span>`+
      `${seta(k)}</button></span>`;
  };
  return `<div class="lista-cab" role="row">`+
    bt('id','ID')+bt('nome_cliente','Cliente')+bt('cnpj','CNPJ / CPF','CNPJ')+bt('cidade','Cidade')+
    bt('documento','Documento mais crítico','Documento')+
    bt('urgencia','Vencimento','Vencimento','text-align:center')+
    bt('situacao','Situação','Situação','text-align:right')+`</div>`;
}

/* Rótulo do campo dentro da ficha. "Link Contrato Social" é nome de COLUNA de
   planilha; na ficha o assunto já está no título do bloco, então o campo só
   precisa dizer o que ele é. */
function rotFicha(c,grupo){
  /* Coluna de endereço puro não é documento: chamá-la de "Documento" aqui seria
     repetir o engano que fez alguém sair à procura do arquivo da prefeitura para
     subir. O título do bloco já diz de quem é o endereço. */
  if(ehLinkPuro(c)) return 'Endereço';
  let t=String(c||'').replace(/^link\s+/i,'').trim();
  if(/^vencimento/i.test(t)) return 'Vencimento';
  if(grupo){
    const g=normTxt(grupo);
    const tn=normTxt(t);
    /* Coluna com o mesmo nome do bloco: o rótulo diz o que o campo É, senão a
       ficha repetiria o título logo abaixo dele. "Documento" só vale para coluna
       de link — chamar assim uma coluna de observação seria informação errada. */
    if(tn===g) return ehLink(c)?'Documento':ehSigilosa(c)?'Senha':t;
    if(tn.startsWith(g+' ')) t=t.slice(grupo.length).trim();
  }
  return t||c;
}
/* Blocos fechados por linha: id -> Set de índices de grupo. Fica só na memória
   da sessão, de propósito — abrir tudo de novo é um clique, e guardar isso por
   cliente viraria estado que ninguém lembra de ter criado. */
const GRP_FECHADOS=new Map();
function grupoFechado(id,g){ const s=GRP_FECHADOS.get(String(id)); return !!(s&&s.has(g)); }
function alternarGrupo(id,g){
  const k=String(id); if(!GRP_FECHADOS.has(k)) GRP_FECHADOS.set(k,new Set());
  const s=GRP_FECHADOS.get(k); if(s.has(g)) s.delete(g); else s.add(g);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.msec-tit'); if(!t) return;
  const sec=t.closest('.msec'), corpo=t.closest('.corpo');
  if(!sec||!corpo) return;
  const g=+sec.dataset.g;
  alternarGrupo(corpo.dataset.id,g);
  const fechado=grupoFechado(corpo.dataset.id,g);
  sec.classList.toggle('fechado',fechado);
  t.setAttribute('aria-expanded',String(!fechado));
});

/* ---------------- o conteúdo da ficha ----------------
   É o mesmo que o modo fichas já montava: cada assunto num bloco, com o
   documento e o vencimento dele lado a lado, e o rótulo do campo dizendo só o
   que o título do bloco ainda não disse. As quatro células (senha, data,
   documento/link e só-leitura) continuam sendo as de sempre — cel() não mudou. */
function corpoHTML(l){
  const blocos=GRUPOS.map((g,gi)=>{
    const fech=grupoFechado(l.id,gi);
    const preenchidos=g.cols.filter(c=>String(l.valores[c]||'').trim()).length;
    const campos=g.cols.map(c=>{
      const trav=ehSoLeitura(c);
      /* Campo de endereço ocupa a linha inteira: uma URL de 120 caracteres numa
         coluna de metade da ficha vira um risco. */
      return `<div class="mfld${ehLink(c)?' full':''}">`
        +`<span class="lbl">${esc(rotFicha(c,g.nome))}${trav?' <span class="lock" title="Só leitura">🔒</span>':''}</span>`
        +cel(l,c)+`</div>`;
    }).join('');
    return `<div class="msec${fech?' fechado':''}" data-g="${gi}">
      <button type="button" class="msec-tit" aria-expanded="${fech?'false':'true'}">`
      +`<span class="arw" aria-hidden="true">▼</span>${esc(g.nome)}`
      +`<span class="n">${preenchidos} de ${g.cols.length}</span></button>
      <div class="msec-campos">${campos}</div>
    </div>`;
  }).join('');
  return `<div class="corpo" data-id="${esc(l.id)}">
    <div class="ign"></div>
    ${blocos||'<div class="vazio">Esse cliente não tem colunas para mostrar.</div>'}
    <div class="rodape">
      <span>As alterações salvam sozinhas. Campos com 🔒 são só leitura — vêm do cadastro do cliente ou são mantidos pelo sistema.</span>
      ${atalhoDrive(l)}
      ${META.planilha_url?`<a class="lk" href="${esc(META.planilha_url)}" target="_blank" rel="noopener noreferrer">Planilha ↗</a>`:''}
    </div>
  </div>`;
}

function desenharLista(){
  montarGruposAgora();
  const arr=visiveis();
  document.getElementById('cnt').textContent=arr.length+' de '+LINHAS.length+' clientes';
  const el=document.getElementById('lista');
  /* A lista nasce com 20 linhas: 111 linhas de uma vez era a parede que o dono do
     produto reclamou. Quem vai conferir muitos pede "todas" uma vez e segue
     igual; quem só veio ver um cliente nunca paga por 111. */
  const total=arr.length;
  const n=Math.min(TETO,total);
  el.innerHTML=total
    ? cabecalhoLista()+arr.slice(0,n).map(l=>
        `<div class="cli ${classeSituacao(l)}${ABERTOS.has(String(l.id))?' aberto':''}" data-id="${esc(l.id)}">${cabecaHTML(l)}</div>`).join('')
    : `<div class="vazio">Nada com esse filtro.</div>`;
  const rod=document.getElementById('rodape-lista');
  if(rod)rod.innerHTML=rodapeLista(n,total)+
    (total>n?`<span class="quanto">Mostrando ${n} de ${total} linhas.</span>`:'');
  revelarColunaAtiva();
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
}
/* No celular o cabeçalho é uma tira que rola de lado, e a coluna ativa pode
   nascer FORA do pedaço visível: a tela abre ordenada por Vencimento, que é a
   sexta de sete, e ela abriria mostrando "Ordenar · ID · Cliente · CNPJ" sem
   marca nenhuma — isto é, parecendo que a lista não está ordenada por nada.
   Mexe só no scroll da TIRA. `scrollIntoView` levaria a página junto e jogaria a
   primeira linha da lista para fora da tela a cada redesenho. */
function revelarColunaAtiva(){
  const cab=document.querySelector('.lista-cab');
  if(!cab||cab.scrollWidth<=cab.clientWidth+1) return;
  const at=cab.querySelector('[aria-sort]'); if(!at) return;
  const r=at.getBoundingClientRect(),c=cab.getBoundingClientRect();
  if(r.left<c.left) cab.scrollLeft+=r.left-c.left-10;
  else if(r.right>c.right) cab.scrollLeft+=r.right-c.right+10;
}
function itemResumo(l,c){
  const st=estado(l.valores[c]);
  return `<button type="button" class="tk" data-goto="${esc(l.id)}">
    <span class="d">${st.dias!=null&&st.dias<0?'vencido':fmtBR(l.valores[c])}</span>
    <span class="lb">${esc(l.nome_cliente||l.id)}</span>
    <span class="tp">${esc(curto(c))}</span></button>`;
}
function desenharResumo(){
  /* A guarda que faltava. Este resumo é decorativo — mora dentro de um
     "Ver quem está em cada situação" que pode não existir nesta tela. Sem a
     linha abaixo, o innerHTML de um elemento ausente estourava DENTRO do
     try/catch do carregar(), e a página inteira caía na tela de "não
     conseguimos carregar" com o dado JÁ na mão. Tela não morre por enfeite. */
  const alvoResumo=document.getElementById('resumo'); if(!alvoResumo) return;
  const keys=colsData();
  const base=LINHAS.filter(passaAtivo);
  const itens=(min,max)=>{
    const out=[];
    base.forEach(l=>keys.forEach(k=>{const st=estado(l.valores[k]);
      if(st.dias!=null&&st.dias>=min&&st.dias<=max)out.push({l,k,d:st.dias});}));
    out.sort((a,b)=>a.d-b.d); return out;
  };
  const venc=itens(-99999,-1), d30=itens(0,30), d60=itens(31,60);
  const falta=base.filter(l=>faltando(l).length>0);
  const card=(cls,titulo,lista,render)=>`<div class="rcard ${cls}">
      <div class="rhead"><span>${titulo}</span><span class="n">${lista.length}</span></div>
      <div class="rlista">${lista.length?lista.slice(0,60).map(render).join(''):'<div class="rvazio">Nada por aqui 🎉</div>'}</div></div>`;
  alvoResumo.innerHTML=
    card('vencidos','Vencidos',venc,x=>itemResumo(x.l,x.k))+
    card('d30','Vence em até 30 dias',d30,x=>itemResumo(x.l,x.k))+
    card('d60','Vence em 31–60 dias',d60,x=>itemResumo(x.l,x.k))+
    card('falta','Faltando dados',falta,l=>`<button type="button" class="tk" data-goto="${esc(l.id)}">
        <span class="d">${esc(l.id)}</span><span class="lb">${esc(l.nome_cliente||'')}</span>
        <span class="tp">${esc(faltando(l).join(' · '))}</span></button>`);
}
/* Quantos filtros estão pegando agora — vira o selo ao lado do botão Filtros (C.5).
   Só conta o que está ESCONDIDO no painel: a busca fica à vista na régua, e um
   selo dizendo "1 filtro" por causa dela faria a pessoa procurar o que não sumiu. */
function filtrosPainel(){
  return (mesmoConj(F_SIT,SIT_TODOS())?0:1)+(F_DOC.length?1:0)+
         (mesmoConj(F_ATIVO,ATIVO_PADRAO)?0:1)+(SO_PEND?1:0)+
         (SORT.key!=='urgencia'||SORT.dir!=='asc'?1:0);
}
/* Volta para a visão com que a tela abre — inclusive a ORDEM. Depois que a lista
   "Ordenar por" saiu da régua, este botão passou a ser o caminho de volta para o
   "vencimento mais próximo" nas telas cuja linha não tem uma coluna de
   vencimento para clicar. Por isso o title dele fala em ordem. */
function limparFiltros(){
  F_SIT=SIT_TODOS();F_DOC=[];F_ATIVO=ATIVO_PADRAO.slice();SO_PEND=false;TERMO='';TETO=PASSO;
  SORT={key:'urgencia',dir:'asc'};
  const b=document.getElementById('busca');if(b)b.value='';
  sincronizarCaixas();
  redesenhar();
}
/* ---------- ordenação: só o cabeçalho ----------
   A lista "Ordenar por" saiu da régua a pedido do dono: ordenar é clicar no
   TÍTULO da coluna, uma vez para A→Z e outra para Z→A. O estado (SORT) e o
   ?ord=/?dir= continuam os MESMOS, então link antigo e F5 continuam valendo —
   inclusive um ?ord= que aponte para uma coluna da planilha sem título clicável
   (o validarURL descarta só o que não existe).
   Abaixo da largura em que a linha deixa de ser grade o cabeçalho não some mais:
   ele vira uma fileira de botões "Ordenar" (ver a folha lá em cima). Sem isso,
   ordenar teria acabado no celular junto com a lista que saiu daqui. */

/** Uma opção de <select>, com a contagem no rótulo quando ela existe. Continua
 *  existindo por causa do modo de queda: sem o b4u-filtro.js a régua volta a ser
 *  <select> de escolha única. */
function opt(v,rot,sel,n){
  return `<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>`+
         esc(rot)+(n!=null?' · '+n:'')+`</option>`;
}

/* ---------- a régua ----------
   Três caixas de seleção múltipla (b4u-filtro.js) e dois botões de dois estados.
   As caixas são CONSTRUÍDAS antes de qualquer uma entrar na página: se o módulo
   estiver lá mas quebrar no meio, o catch cai nos <select> de sempre com os
   marcadores de posição ainda intactos — plantar de uma em uma deixaria a régua
   pela metade, meio caixa e meio select. */
const FILTROS={ativo:null,venc:null,doc:null};
/* Valor de <select> que quer dizer "o estado atual não cabe numa escolha única".
   Ver a nota do desenharFiltros(). */
const MANTEM='__mantem__';
function por(cx,no){ cx.replaceWith(no); return no; }
function porHTML(cx,html){ const t=document.createElement('div'); t.innerHTML=html;
  return por(cx,t.firstElementChild); }
function itensAtivo(){ return ATIVO_ITENS.map(i=>({v:i.v,r:i.r,c:i.r})); }
function itensVenc(){ return VENC_ITENS.map(i=>({v:i.v,r:i.r,c:i.r})); }
/* A lista de documentos sai das COLUNAS DE DATA da planilha, que trocam de nome
   sozinhas — por isso ela é montada depois que os dados chegam, e não escrita
   aqui. */
function itensDoc(){ return DATAS.map(c=>({v:c,r:curto(c),c:curto(c)})); }
/* Conjuntos com nome próprio (regra 6 do b4u-filtro.js): são os mesmos atalhos
   que o ?f= nomeava, e é assim que a equipe fala — "os vencidos", "o que vence
   em 30 dias". Sem eles o botão diria "Vencido +1" no atalho mais usado da tela.
   Atalho que cai em cima de outro sai da lista: dois nomes para o mesmo conjunto
   fariam o rótulo depender da ordem em que a tabela foi escrita. */
function atalhosVenc(){
  const out=[],vistos=[];
  Object.keys(SIT_ATALHO).forEach(k=>{
    const q=SIT_ATALHO[k];
    if(!q.length||vistos.some(v=>mesmoConj(v,q))) return;
    vistos.push(q); out.push({quando:q,rot:SIT_ATALHO_ROT[k]});
  });
  return out;
}
function montarFiltros(){
  const cxA=document.getElementById('cx-ativos'),
        cxV=document.getElementById('cx-venc'),
        cxD=document.getElementById('cx-doc');
  if(!cxA||!cxV||!cxD) return;
  if(window.B4UFiltro) try{
    const fa=B4UFiltro.criar({
      id:'f-ativos', rot:'Ativos', itens:itensAtivo(), marcados:F_ATIVO,
      /* Nasce com os ativos (e os que não dizem) marcados, como a tela sempre
         abriu. Zero marcado quer dizer "não me mostre nada", e o componente
         avisa em âmbar — desmarcar os três é gesto deliberado numa lista de
         três. */
      vazio:'nada', rotTodos:'Ativos e inativos', rotNada:'Nenhum', rotTodas:'Todos',
      rotEspecial:[{quando:ATIVO_PADRAO,rot:'Só os ativos'}],
      aoMudar:m=>{ F_ATIVO=m; TETO=PASSO; redesenhar(); }
    });
    const fv=B4UFiltro.criar({
      id:'f-sit', rot:'Vencimento', itens:itensVenc(), marcados:F_SIT,
      vazio:'nada', rotTodos:'Todos os vencimentos', rotNada:'Nenhuma situação', rotTodas:'Todas',
      rotEspecial:atalhosVenc(),
      aoMudar:m=>{ F_SIT=m; TETO=PASSO; redesenhar(); }
    });
    const fd=B4UFiltro.criar({
      id:'f-doc', rot:'Documento', itens:itensDoc(), marcados:F_DOC,
      /* Nasce vazia, e vazia aqui quer dizer TODOS os documentos: esta caixa
         escolhe QUAL vencimento a tela está olhando, e "nenhum" não é resposta
         que alguém queira dar — seria a tela sem coluna de data nenhuma. */
      vazio:'todos', rotTodos:'Todos os documentos', rotNada:'Nenhum documento',
      aoMudar:m=>{ F_DOC=m; TETO=PASSO; redesenhar(); }
    });
    FILTROS.ativo=fa; FILTROS.venc=fv; FILTROS.doc=fd;
    por(cxA,fa.no); por(cxV,fv.no); por(cxD,fd.no);
    return;
  }catch(e){ FILTROS.ativo=FILTROS.venc=FILTROS.doc=null; }
  /* ── sem o módulo ──────────────────────────────────────────────────────────
     Os <select> de escolha única de antes. Perde-se a COMBINAÇÃO (ver vencidos e
     vencendo em 30 ao mesmo tempo, ativos e inativos juntos), não a capacidade
     de filtrar: cada opção guarda o mesmo estado em lista que as caixas guardam,
     com um item só dentro. Quem preenche as opções — e devolve a contagem ao
     rótulo — é o desenharFiltros(), logo abaixo. */
  porHTML(cxA,'<select class="filtro" id="f-ativos" aria-label="Ativos"></select>');
  porHTML(cxV,'<select class="filtro" id="f-sit" aria-label="Vencimento"></select>');
  porHTML(cxD,'<select class="filtro" id="f-doc" aria-label="Documento"></select>');
}
/** Escreve o estado nas caixas SEM disparar o aoMudar delas (quem escreveu já
 *  sabe o que escreveu, e avisar de volta faria o laço). É o que faz o "Limpar"
 *  e o ?abrir= aparecerem na régua, e não só na lista. */
function sincronizarCaixas(){
  if(FILTROS.ativo) FILTROS.ativo.marcados(F_ATIVO);
  if(FILTROS.venc)  FILTROS.venc.marcados(F_SIT);
  if(FILTROS.doc)   FILTROS.doc.marcados(F_DOC);
}
/* A contagem no rótulo da opção, escrita no painel que o componente montou.
   Ver a nota do `.b4f-li .f-n` na folha: ela não entra no texto do item de
   propósito. Tudo aqui é guarda — se a marcação do componente mudar, a contagem
   some e a régua continua inteira. */
function pintarContagens(f,mapa){
  if(!f||!f.painel) return;
  [].slice.call(f.painel.querySelectorAll('.b4f-li[data-v]')).forEach(li=>{
    const v=li.getAttribute('data-v');
    if(mapa[v]==null) return;
    let n=li.querySelector('.f-n');
    if(!n){ n=document.createElement('span'); n.className='f-n'; li.appendChild(n); }
    n.textContent='· '+mapa[v];
    n.classList.toggle('zero',mapa[v]===0);
  });
}
/* A régua inteira, redesenhada: a contagem de cada opção, o estado dos dois
   botões e — no modo de queda — as opções dos <select>.
   Cada caixa conta IGNORANDO a si mesma (o `pular` do passaFiltro). */
function desenharFiltros(){
  /* A contagem conta SOBRE O QUE A BUSCA DEIXOU. Com "padaria" escrito no campo,
     "Vencido · 40" seria a conta da carteira inteira ao lado de uma lista de
     três — e o número que não fala da tela que está na frente da pessoa é pior
     que número nenhum: ela clica na opção esperando 40 linhas e recebe uma. É a
     mesma regra das telas irmãs, onde as listas do filtro saem do `baseBusca()`. */
  const termo=String(TERMO||'').trim();
  const n=(pular,pred)=>LINHAS.filter(l=>passaBusca(l,termo)&&passaFiltro(l,pular)&&pred(l)).length;
  const cAtivo={}, cVenc={}, cDoc={};
  ATIVO_ITENS.forEach(i=>{ cAtivo[i.v]=n('ativo',l=>chaveAtivo(l)===i.v); });
  VENC_ITENS.forEach(i=>{ cVenc[i.v]=n('venc',l=>vencDe(l)===i.v); });
  /* Documento conta quantos clientes TÊM aquele vencimento preenchido — é a
     pergunta que se faz antes de escolher a coluna ("essa aqui tem dado?"). */
  DATAS.forEach(c=>{ cDoc[c]=n(null,l=>!!String(l.valores[c]||'').trim()); });
  const nPend=n('pend',l=>faltando(l).length>0);

  pintarContagens(FILTROS.ativo,cAtivo);
  pintarContagens(FILTROS.venc,cVenc);
  pintarContagens(FILTROS.doc,cDoc);

  /* "Com pendências" é o "Faltando dados" que era uma OPÇÃO do filtro de
     situação — e que, por ser opção, valia no lugar do prazo. Como botão ele
     anda JUNTO: dá para pedir "os vencidos que ainda estão com campo em branco".
     O número é a mesma contagem que a opção dava.
     O que ele filtra, e nada além disso: cliente com pelo menos UMA coluna de
     vencimento em branco entre as que a caixa Documento deixou de pé. Não olha
     CNPJ, não olha telefone, não olha o cadastro. */
  const bp=document.getElementById('f-pend');
  if(bp){
    bp.setAttribute('aria-pressed',String(SO_PEND));
    bp.innerHTML='Com pendências <span class="n">'+nPend+'</span>';
    bp.title=(SO_PEND?'Mostrando só quem tem':'Mostra só quem tem')+
      ' vencimento em branco — nas colunas que a caixa Documento deixou de pé.'+
      (SO_PEND?' Clique para ver todos.':'');
  }
  /* Sem coluna espelhada não há o que mostrar nem esconder: o botão some em vez
     de virar um interruptor que não acende nada. */
  const bc=document.getElementById('f-cad');
  if(bc){
    bc.hidden=!ESPELHADAS.length;
    bc.setAttribute('aria-pressed',String(VER_CADASTRO));
    bc.title=VER_CADASTRO?'As colunas que vêm do cadastro estão à vista na ficha. Clique para escondê-las.'
                         :'Mostra na ficha as colunas que vêm do cadastro (só leitura).';
  }
  /* ── modo de queda: os <select> ──────────────────────────────────────────────
     Escolha única não sabe dizer "vencido E vencendo em 30". Quando o estado veio
     do endereço com uma combinação que o <select> não representa, ele ganha uma
     primeira opção que DIZ isso, em vez de acender a opção errada: um filtro que
     mente sobre si mesmo é pior que um filtro sem atalho. */
  const sv=document.getElementById('f-sit');
  if(sv&&sv.tagName==='SELECT'){
    const todas=mesmoConj(F_SIT,SIT_TODOS());
    const um=F_SIT.length===1?F_SIT[0]:'';
    const sel=todas?'__todas__':(um||MANTEM);
    sv.innerHTML=(sel===MANTEM?opt(MANTEM,F_SIT.length+' vencimentos marcados',sel):'')+
      opt('__todas__','Todos os vencimentos',sel,LINHAS.filter(l=>passaBusca(l,termo)&&passaFiltro(l,'venc')).length)+
      VENC_ITENS.map(i=>opt(i.v,i.r,sel,cVenc[i.v])).join('');
    sv.classList.toggle('corta',!todas);
  }
  const sd=document.getElementById('f-doc');
  if(sd&&sd.tagName==='SELECT'){
    const sel=!F_DOC.length?'__todos__':(F_DOC.length===1?F_DOC[0]:MANTEM);
    sd.innerHTML=(sel===MANTEM?opt(MANTEM,F_DOC.length+' documentos marcados',sel):'')+
      opt('__todos__','Todos os documentos',sel)+
      DATAS.map(c=>opt(c,curto(c),sel,cDoc[c])).join('');
    sd.classList.toggle('corta',!!F_DOC.length);
  }
  const sa=document.getElementById('f-ativos');
  if(sa&&sa.tagName==='SELECT'){
    const padrao=mesmoConj(F_ATIVO,ATIVO_PADRAO);
    const tudo=mesmoConj(F_ATIVO,ATIVO_ITENS.map(i=>i.v));
    const sel=padrao?'1':tudo?'0':MANTEM;
    sa.innerHTML=(sel===MANTEM?opt(MANTEM,F_ATIVO.map(v=>(ATIVO_ITENS.filter(i=>i.v===v)[0]||{r:v}).r).join(' e '),sel):'')+
      opt('1','Só clientes ativos',sel,cAtivo.sim+cAtivo['?'])+
      opt('0','Ativos e inativos',sel,cAtivo.sim+cAtivo['?']+cAtivo.nao);
    sa.classList.toggle('corta',!padrao&&!tudo);
  }
}
/* A contagem em texto é o que permite recolher os chips e os cartões sem esconder
   pendência: os números continuam na primeira linha da tela, filtrada ou não. */
function desenharResumoLista(){
  const el=document.getElementById('resumo-lista');if(!el)return;
  const keys=colsData();
  const base=LINHAS.filter(passaAtivo);
  const vis=visiveis().length;
  const nUrg=(min,max)=>base.filter(l=>{const u=urgencia(l,keys);return u!==null&&u>=min&&u<=max;}).length;
  const nFalta=base.filter(l=>faltando(l).length>0).length;
  const p=[(vis===base.length?String(base.length):vis+' de '+base.length)+' clientes'];
  if(nFalta)p.push(nFalta+' faltando dados');
  const nVenc=nUrg(-99999,-1); if(nVenc)p.push(nVenc+' vencidos');
  const n30=nUrg(-99999,30);   if(n30)p.push(n30+' vencem em 30 dias');
  el.textContent=p.join(' · ');
}
function redesenhar(){desenharFiltros();desenharResumo();desenharLista();desenharResumoLista();
  sincronizarURL();}
function aplicarBusca(){TETO=PASSO;   // resultado novo, teto novo
  desenharFiltros();desenharLista();desenharResumoLista();sincronizarURL();}

/* ---------- busca e filtros no endereço (C.10) ----------
   F5 volta para a mesma visão; chave, cod e #hash ficam intactos.
   Senha nunca vai para cá — nem valor, nem coluna (não dá para ordenar por ela). */
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    set('q',TERMO);
    /* O ?f= continua saindo no vocabulário de sempre quando a seleção é
       exatamente um dos conjuntos que ele nomeava — é o link que o painel do
       colaborador manda e o que está colado em conversa de meses atrás. Fora
       deles vai a lista de baldes, que o lerURL também sabe ler. */
    set('f',textoF());
    set('doc',F_DOC.join(','));
    set('ativos',textoAtivos());
    set('pend',SO_PEND?'1':'');
    set('cad',VER_CADASTRO?'1':'');
    set('ord',SORT.key==='urgencia'?'':SORT.key);
    set('dir',SORT.dir==='asc'?'':SORT.dir);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function textoF(){
  if(mesmoConj(F_SIT,SIT_TODOS())) return '';
  const k=Object.keys(SIT_ATALHO).filter(x=>SIT_ATALHO[x].length&&mesmoConj(F_SIT,SIT_ATALHO[x]))[0];
  return k||F_SIT.join(',');
}
function textoAtivos(){
  if(mesmoConj(F_ATIVO,ATIVO_PADRAO)) return '';
  if(mesmoConj(F_ATIVO,ATIVO_ITENS.map(i=>i.v))) return '0';   // o ?ativos=0 de sempre
  return F_ATIVO.join(',');
}
/** Lista separada por vírgula, reduzida ao que existe. Sobrando nada, devolve o
 *  padrão: endereço com lixo dentro não pode abrir a tela vazia. */
function listaURL(s,ok,padrao){
  const out=String(s||'').split(',').map(x=>x.trim().toLowerCase())
    .filter((x,i,a)=>ok.indexOf(x)>=0&&a.indexOf(x)===i);
  return out.length?out:padrao.slice();
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  const f=(p.get('f')||'').trim().toLowerCase();
  /* Três gerações de ?f= atendidas de uma vez: o vazio (tudo), o vocabulário
     antigo ('falta', 'vencidos', 'd30'…) e a lista de baldes que esta tela
     passou a escrever. 'falta' era a única opção que não falava de prazo — ela
     virou o botão "Com pendências", e por isso acende o BOTÃO em vez de
     estreitar o vencimento. Valor que não é nenhum dos três cai em "tudo":
     filtro que ninguém pediu é pior que filtro nenhum. */
  SO_PEND=(f==='falta')||p.get('pend')==='1';
  F_SIT=(SIT_ATALHO[f]&&SIT_ATALHO[f].length)?SIT_ATALHO[f].slice()
      :(!f||f==='todos'||f==='falta')?SIT_TODOS()
      :listaURL(f,SIT_TODOS(),SIT_TODOS());
  F_DOC=String(p.get('doc')||'').split(',').map(s=>s.trim())
    .filter((c,i,a)=>c&&a.indexOf(c)===i);
  const at=(p.get('ativos')||'').trim().toLowerCase();
  F_ATIVO=!at?ATIVO_PADRAO.slice()
        :at==='0'?ATIVO_ITENS.map(i=>i.v)
        :listaURL(at,ATIVO_ITENS.map(i=>i.v),ATIVO_PADRAO);
  VER_CADASTRO=p.get('cad')==='1';
  SORT={key:(p.get('ord')||'urgencia'),dir:p.get('dir')==='desc'?'desc':'asc'};
  TERMO=p.get('q')||'';
}
/* Depois que as colunas chegam, o que veio do endereço tem de existir de verdade. */
function validarURL(){
  /* Coluna de vencimento vinda do endereço tem de EXISTIR: a planilha troca de
     nome de coluna sozinha, e um ?doc= velho apontando para o nada deixaria a
     tela olhando um conjunto vazio de datas — todo mundo "sem data". */
  F_DOC=F_DOC.map(d=>DATAS.filter(x=>normTxt(x)===normTxt(d))[0]).filter(Boolean);
  const k=SORT.key;
  /* As chaves da lista (ORD_COLS) valem sempre; um ?ord= antigo apontando para
     uma COLUNA da planilha continua ordenando, desde que ela exista e não seja
     sigilosa — senha nunca entra no endereço. */
  const ok=!!ORD_COLS[k]||(COLUNAS.indexOf(k)>=0&&!ehSigilosa(k));
  if(!ok)SORT.key='urgencia';
  if(!ESPELHADAS.length)VER_CADASTRO=false;
}

/* ---------------- salvar ---------------- */
const SUJOS=new Map();    // id (texto) -> {timer,campos:Set}
/* ---------- o que não gravou (C.3) ----------
   FALHAS = o servidor recusou e o dado só existe na tela. A linha e o campo ficam
   marcados, nasce um "tentar de novo" ali mesmo e fechar a aba pede confirmação. */
const FALHAS=new Map();   // id (texto) -> {campos:Set}
function temPendencia(){return SUJOS.size>0||FALHAS.size>0;}
/* O MESMO indicador em dois lugares: a faixa da barra escura (a de sempre) e o
   rodapé da ficha. Com a ficha aberta a barra fica atrás do véu — e o indicador
   não pode sumir justamente na tela em que se digita. A classe "claro" só troca
   a tinta do estado neutro, que foi desenhado para fundo escuro. */
function setSave(cl,txt){
  const base='save-status '+(cl||'');
  const el=document.getElementById('saveStatus');
  if(el){el.className=base;el.textContent=txt||'';}
  const cad=document.getElementById('saveStatusCad');
  if(cad){cad.className=base+' claro';cad.textContent=txt||'';}
}
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
/* ---------- o terceiro estado ----------
   Uma gravação que não deu para confirmar NÃO é uma gravação que falhou. As duas
   pedem que o texto digitado não se perca (e por isso as duas entram em FALHAS,
   que é o que segura o aviso de "sair sem gravar"), mas só uma delas autoriza
   repetir. Este conjunto é a diferença: quem está aqui recebe selo de dúvida, sem
   botão, e a instrução de recarregar. */
const INCERTOS=new Set();

/* O selo que a linha ganha quando algo não gravou. Duas formas, porque são dois
   fatos diferentes — e a diferença aparece no que ele OFERECE: o de falha tem
   botão (repetir é seguro, o servidor disse que não gravou); o de dúvida não tem
   botão nenhum, porque a única ação segura ali é recarregar e olhar. */
function seloFalha(id){
  return INCERTOS.has(String(id))
    ? '<span class="ign-duvida">sem confirmação — recarregue a página para ver se gravou</span>'
    : '<button type="button" class="btn-retry" data-retry="'+esc(String(id))+'">não salvou — tentar de novo</button>';
}

function marcarFalha(id,falhou){
  const chave=CSS.escape(String(id));
  /* A LINHA continua marcada na lista mesmo com a ficha fechada — é o que
     mostra, de longe, que aquele cliente tem coisa que não gravou. */
  const no=document.querySelector('.cli[data-id="'+chave+'"]');
  if(no)no.classList.toggle('falhou',!!falhou);
  /* A faixa e os campos vivem no .corpo, que hoje é pintado dentro do modal:
     procurar pelo .corpo funciona esteja ele onde estiver (e não existe quando a
     ficha está fechada, que é o caso em que não há campo para marcar). */
  const corpo=document.querySelector('.corpo[data-id="'+chave+'"]');
  if(!corpo)return;
  const cx=corpo.querySelector('.ign');
  if(cx){
    /* Trocar, não só inserir. O guarda antigo era `se falhou e ainda não há selo,
       insere` — o que bastava quando havia UM selo só. Com dois, ele congelava o
       primeiro: uma linha que falhou (botão vermelho) e depois ficou em dúvida
       continuaria oferecendo "tentar de novo" embaixo de um texto que pede para NÃO
       repetir; e o contrário — dúvida antes, recusa do servidor depois — esconderia o
       botão justamente quando repetir passou a ser o certo. O selo é redesenhado a
       cada chamada, e some quando não há mais o que marcar. */
    if(falhou)
      cx.innerHTML=(INCERTOS.has(String(id))
        ? 'A resposta do servidor não chegou. O que você digitou continua aqui. '
        : 'Não consegui gravar o que você mudou aqui. ')+seloFalha(id);
    else cx.innerHTML='';
  }
  /* o campo que não gravou também fica marcado, para não sobrar dúvida de onde foi */
  const f=FALHAS.get(String(id));
  corpo.querySelectorAll('[data-c]').forEach(el=>{
    el.classList.toggle('falhou',!!(falhou&&f&&f.campos.has(el.dataset.c)));
  });
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
/* O pedido de confirmação ao sair da página é da casca (b4u-modal.js), pelo
   `sujo:()=>temPendencia()` da adoção — a mesma linha estava escrita em sete
   telas. */
function agendarSalvar(id,coluna,ms){
  const k=String(id);
  let s=SUJOS.get(k);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(k,s);}
  s.campos.add(coluna);
  clearTimeout(s.timer);
  s.timer=setTimeout(()=>salvar(k),ms==null?700:ms);
  setSave('saving','Salvando…');
}
/* Enter não espera o debounce: quem apertou já saiu da linha e precisa ver o
   "Salvo ✓" enquanto ainda lembra do que digitou. */
function salvarAgora(id,coluna){
  const k=String(id);
  let s=SUJOS.get(k);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(k,s);}
  s.campos.add(coluna);
  clearTimeout(s.timer);
  salvar(k);
}
async function salvar(id){
  const k=String(id);
  const s=SUJOS.get(k); if(!s) return;
  clearTimeout(s.timer);
  SUJOS.delete(k);
  const l=LINHAS.find(x=>String(x.id)===k); if(!l) return;
  const campos={}; s.campos.forEach(c=>campos[c]=b4uParaPlanilha(l.valores[c],c));
  /* Cada gravação recebe um número. A conferência do caso incerto demora alguns
     segundos, e nesse meio-tempo a pessoa pode ter digitado de novo: sem este
     carimbo, a resposta de uma conferência VELHA pintaria "Salvo ✓ (confirmado)"
     por cima de uma gravação nova que ainda está viajando. */
  /* O post voltou? É o que separa "a tela quebrou depois de gravar" de "a exceção
     nem chegou a virar requisição". Sem esta marca, um erro lançado ANTES do post
     — dentro do mesmo try — seria anunciado como gravação bem-sucedida. */
  let respondeu=false;
  const seq=++CONF_N; CONF_SEQ.set(k,seq);
  try{
    setSave('saving','Salvando…');
    const r=await postAcao({acao:'licenca_salvar',id:l.id,campos,
      cliente:l.nome_cliente||'',cod:respAtual()});
    respondeu=true;
    // avisa baixinho se o backend recusou alguma coluna (espelho do Registro)
    const ign=(r&&r.ignoradas)||[];
    FALHAS.delete(k); INCERTOS.delete(k); marcarFalha(k,false);
    setSave('ok','Salvo ✓ '+horaAgora()+(ign.length?' · '+ign.length+' campo(s) só de leitura':''));
    /* Gravou tudo: o aviso de "tem coisa por gravar" no rodapé da ficha sai e o
       Fechar volta a ser Fechar. */
    if(!temPendencia()&&CAD)CAD.aviso(false);
    // a contagem da régua também é pendência: gravar um vencimento muda o número
    desenharResumo();desenharFiltros();desenharResumoLista();
    /* A linha da lista acompanha o que acabou de ser gravado (o vencimento mais
       próximo, o documento crítico, a situação) sem redesenhar a lista inteira —
       redesenhar tiraria o foco de quem está digitando na ficha. */
    atualizarCabeca(k);
  }catch(e){
    /* Uma resposta que chega depois de outra gravação já ter assumido esta linha
       não tem mais nada a dizer sobre ela: o que está na tela é o texto da
       gravação nova, e o veredicto desta aqui — sucesso ou fracasso — falaria de
       algo que já não está mais lá. Sai calada, sem tocar na faixa. */
    if(CONF_SEQ.get(k)!==seq) return;
    /* TRÊS desfechos, não dois — e a diferença é toda ela sobre o que dá para
       AFIRMAR. */

    /* (1) O servidor leu, decidiu e recusou. Não gravou. O texto é escrito por nós
       ("coluna travada", "linha mudou de lugar") e vai para a tela: aqui quem lê é
       da equipe, e esconder o motivo já custou caro neste painel. */
    if(e&&e.doServidor){
      FALHAS.set(k,{campos:s.campos}); INCERTOS.delete(k); marcarFalha(k,true);
      setSave('err','O servidor recusou: '+String((e&&e.message)||e));
      return;
    }
    /* (2) A exceção NÃO veio do postAcao — ele só devolve `doServidor` ou
       `incerto`. Restam dois casos, e o `respondeu` os separa:
       • o post JÁ tinha voltado e quem estourou foi o código de tela que roda
         depois dele — então GRAVOU, e dizer "o servidor recusou" seria inverter o
         fato e ainda oferecer um "tentar de novo" que regravaria o que já está lá;
       • o post NEM chegou a sair (algo estourou antes dele, dentro do mesmo try) —
         aí nada foi gravado e repetir é seguro. */
    if(!e||!e.incerto){
      if(respondeu){
        FALHAS.delete(k); INCERTOS.delete(k); marcarFalha(k,false);
        setSave('ok','Salvo ✓ '+horaAgora()+' · a tela não acompanhou — recarregue para vê-la certa');
      }else{
        FALHAS.set(k,{campos:s.campos}); INCERTOS.delete(k); marcarFalha(k,true);
        setSave('err','Não foi possível salvar. Tente de novo.');
      }
      return;
    }
    /* (3) A resposta se perdeu. A gravação acontece ANTES da resposta, e o front
       não tem como saber se ela aconteceu — então, em vez de decretar, ele vai
       PERGUNTAR.
       A pendência é registrada AGORA, antes de perguntar: a conferência leva até
       28 s, e nesse intervalo `SUJOS` já foi esvaziado. Sem isto, `temPendencia()`
       diria "não há nada por gravar" e o F5 que a mensagem seguinte vai pedir
       sairia sem aviso nenhum, levando o texto junto. Só o SELO na linha espera —
       porque o selo é uma afirmação, e ainda não há nada a afirmar. */
    FALHAS.set(k,{campos:s.campos});
    setSave('saving','A resposta não chegou — conferindo se gravou…');
    const r=await conferirGravacao(l.id,campos);
    if(CONF_SEQ.get(k)!==seq) return;   // enquanto conferíamos, outra gravação assumiu a linha
    if(r==='bateu'){
      FALHAS.delete(k); INCERTOS.delete(k); marcarFalha(k,false);
      setSave('ok','Salvo ✓ (confirmado) '+horaAgora());
      if(!temPendencia()&&CAD)CAD.aviso(false);
      desenharResumo();desenharFiltros();desenharResumoLista();
      atualizarCabeca(k);
      return;
    }
    if(r==='nao-bateu'){
      /* Única hora em que "mande de novo" é conselho honesto: a linha foi lida e o
         valor não está lá. */
      INCERTOS.delete(k); marcarFalha(k,true);
      setSave('err','Não gravou tudo: reli a linha e algum campo não está com o que você mandou. Pode mandar de novo.');
      return;
    }
    /* 'nao-sei': a dúvida continua de pé. Selo de dúvida, sem botão — e o pedido é
       recarregar, nunca repetir. */
    INCERTOS.add(k); marcarFalha(k,true);
    setSave('err','Não consegui confirmar se salvou. Recarregue antes de mandar de novo.');
  }
}
function tentarDeNovo(id){
  const k=String(id), f=FALHAS.get(k); if(!f) return;
  FALHAS.delete(k); INCERTOS.delete(k); marcarFalha(k,false);
  let s=SUJOS.get(k);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(k,s);}
  f.campos.forEach(c=>s.campos.add(c));
  clearTimeout(s.timer);
  salvar(k);
}

/* ===================================================================
   A ficha do cliente, no modal
   -------------------------------------------------------------------
   A lista mostra as sete colunas que a equipe lê de relance; o resto —
   e TODA a edição — abre aqui, por cima, sem trocar de página e sem
   empurrar as outras linhas para baixo. O maquinário de gravação não
   mudou: agendarSalvar, salvar e postAcao são os mesmos de sempre, só
   passaram a ser chamados de dentro daqui.
   =================================================================== */
const ABERTOS=new Set();   // de quem é a ficha aberta (acende a linha na lista)
let CAD_ID='';             // de quem é a ficha aberta — ou a última que esteve
/* A MOLDURA da ficha mora no b4u-modal.js: véu e clique fora, Esc, trava da
   rolagem do fundo, foco preso dentro da caixa, o aviso de "tem coisa por
   gravar" e o fechar em dois tempos. O que fica nesta página é o que é DESTA
   ficha — o que se pinta dentro da caixa e o que se grava. Sem o arquivo, CAD é
   nulo: a ficha não abre e a lista continua inteira. */
const CAD = window.B4UModal && window.B4UModal.adotar('modalCad', {
  ids:{titulo:'cadTitulo',selo:'cadId',pill:'cadSit',corpo:'cadBody',
       status:'saveStatusCad',aviso:'cadAviso',fechar:'cadFechar',x:'fechaCad'},
  base:{pill:'pill',status:'save-status claro'},
  sujo:()=>temPendencia(),
  /* Ao sair, a gravação que ainda esperava o debounce é DESCARREGADA na hora:
     deixá-lo correndo com a ficha fora da tela é o jeito de perder o que foi
     digitado. */
  aoFechar:()=>{
    if(SUJOS.size)descarregarPendentes();
    ABERTOS.delete(String(CAD_ID));marcarLinhaAberta();
    document.getElementById('cadBody').innerHTML='';
  },
  /* O foco volta para a linha de onde saiu: quem navega por teclado não é jogado
     de volta para o topo da página. */
  focoVolta:()=>document.querySelector('.cli[data-id="'+CSS.escape(String(CAD_ID))+'"] .cli-head')
});
function cadAberto(){return !!CAD&&CAD.aberto();}
function linhaPorId(id){return LINHAS.find(x=>String(x.id)===String(id))||null;}
/** Nome, ID e situação no topo da ficha — acompanham a edição sem redesenhar nada. */
function atualizarTopoCad(id){
  if(!cadAberto()||String(CAD_ID)!==String(id))return;
  const l=linhaPorId(id);if(!l)return;
  const s=situacaoDe(l),info=rotuloSituacao(l,s);
  CAD.titulo(l.nome_cliente||'(sem nome)').selo(l.id).pill({texto:info.rot,classe:'sit-'+s,dica:info.dica});
}
/** Acende na lista a linha da ficha que está aberta. */
function marcarLinhaAberta(){
  document.querySelectorAll('.cli').forEach(n=>n.classList.toggle('aberto',ABERTOS.has(n.dataset.id)));
}
/** Repinta SÓ a linha daquele cliente — a lista inteira, nunca, durante a edição. */
function atualizarCabeca(id){
  const l=linhaPorId(id);if(!l)return;
  const no=document.querySelector('.cli[data-id="'+CSS.escape(String(id))+'"]');
  if(no){
    /* Se o foco estava NA linha (é onde ele volta ao fechar a ficha), ele volta
       para ela depois da repintura: uma gravação que termina meio segundo depois
       não pode jogar quem navega por teclado de volta para o topo da página. */
    const cabeca=no.querySelector('.cli-head');
    const tinhaFoco=!!cabeca&&document.activeElement===cabeca;
    no.innerHTML=cabecaHTML(l);
    if(tinhaFoco){const nova=no.querySelector('.cli-head');if(nova)nova.focus();}
    no.classList.remove('sit-venc','sit-d30','sit-d60','sit-d90','sit-ok','sit-sem','sit-inativo');
    no.classList.add(classeSituacao(l));
  }
  atualizarTopoCad(id);   // e o topo da ficha mostra a situação nova
}
function abrirCadastro(id){
  const l=linhaPorId(id);if(!l)return;
  if(!CAD)return;
  CAD_ID=String(l.id);
  document.getElementById('cadBody').innerHTML=corpoHTML(l);
  CAD.abrir();
  atualizarTopoCad(CAD_ID);
  ABERTOS.clear();ABERTOS.add(CAD_ID);
  marcarLinhaAberta();
  /* Reabrir não pode apagar o que não gravou: a faixa e o "tentar de novo"
     nascem de novo junto com os campos. */
  if(FALHAS.has(CAD_ID))marcarFalha(CAD_ID,true);
}
/* Grava agora o que estava esperando o debounce. É o salvar() de sempre, só sem
   os 700 ms de espera. */
function descarregarPendentes(){
  Array.from(SUJOS.keys()).forEach(id=>{const s=SUJOS.get(id);if(s)clearTimeout(s.timer);salvar(id);});
}
/* O campo em foco era tratado À MÃO só aqui: a gravação desta tela sai do
   `change`, que só dispara quando o campo perde o foco, e fechar pelo Esc não
   passa por blur nenhum — sem captura, sair logo depois de digitar levava embora
   o que a pessoa acabou de escrever. Isso virou regra da casca (b4u-modal.js):
   antes de decidir qualquer coisa, ela solta o foco do campo, o `change` de
   sempre dispara e o autosave desta página faz o resto. O que era exceção de uma
   tela passou a valer nas sete. */
function fecharCadastro(forcado){if(CAD)CAD.fechar(forcado);}
/* O botão "Salvar alterações" NÃO substitui o autosave: cada edição continua
   chamando agendarSalvar(), e é ele que impede perder texto digitado — foi para
   isso que ele existe nesta tela. O botão ANTECIPA a gravação pendente (mata o
   debounce e salva na hora), reenvia o que falhou e, quando tudo entrou, FECHA a
   ficha: salvar é o gesto de encerrar, e ficar com a ficha aberta depois de
   confirmar faz a pessoa clicar em Fechar sem saber se gravou.

   Só fecha se gravou MESMO. Falha mantém a ficha na tela: fechar por cima de uma
   gravação que não foi levaria embora o aviso e a chance de tentar de novo, e a
   pessoa sairia achando que salvou. */
async function salvarAgoraCad(){
  const id=CAD_ID, btn=document.getElementById('cadSalvar');
  if(temPendencia()){
    if(btn){btn.disabled=true;btn.dataset.rot=btn.textContent;btn.textContent='Salvando…';}
    try{
      /* Linha em DÚVIDA não volta para a fila. Tirar o botão "tentar de novo" da
         linha e deixar o botão primário da ficha reenviando a mesma coisa seria
         fechar a porta e deixar a janela aberta: a gravação pode ter entrado, e
         mandar de novo é o que este caminho todo existe para não fazer. Ela fica
         pendente — a ficha não fecha, e o recado diz o que fazer. */
      /* o que falhou antes volta para a fila de sujos antes do disparo */
      if(id&&FALHAS.has(String(id))&&!INCERTOS.has(String(id))){
        const f=FALHAS.get(String(id));
        const su=SUJOS.get(String(id))||{timer:null,campos:new Set()};
        f.campos.forEach(c=>su.campos.add(c));
        SUJOS.set(String(id),su);FALHAS.delete(String(id));
      }
      const ids=Array.from(SUJOS.keys());
      ids.forEach(k=>{const su=SUJOS.get(k);if(su)clearTimeout(su.timer);});
      await Promise.all(ids.map(k=>salvar(k)));
    }catch(e){ /* salvar() já registra a falha em FALHAS e avisa na tela */ }
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.rot||'Salvar alterações';}
  }
    /* Sobrou dúvida: a ficha NÃO fecha (o `temPendencia()` abaixo cuida disso) e
       agora ela diz por quê. Sem este recado, o botão pareceria não ter feito
       nada. */
    if(INCERTOS.size) setSave('err','Uma gravação ficou sem confirmação. Recarregue a página para ver se ela entrou — não mande de novo.');
  if(temPendencia())return;            // não gravou: a ficha continua aberta
  fecharCadastro(true);
}

/* ---------------- eventos ---------------- */
/* A linha em memória sai do envelope mais próximo que tenha data-id: a ficha
   aberta (.corpo) ou a linha da lista (.cli). */
function linhaDo(el){
  const no=el.closest('[data-id]'); if(!no) return null;
  return linhaPorId(no.dataset.id);
}
/* enquanto se digita num link, o atalho ↗ acende ou apaga na hora */
document.addEventListener('input',e=>{
  const el=e.target;
  if(!el.dataset||!el.dataset.link) return;
  const cx=el.closest('.lk-cel'); if(!cx) return;
  const antigo=cx.querySelector('.lk-ir'); if(!antigo) return;
  antigo.outerHTML=atalhoAbrir(el.value);
});
/* Passa o que está no campo para a linha em memória e reacerta a etiqueta de prazo
   ao lado. É o mesmo caminho para quem sai do campo e para quem dá Enter. */
function aplicarCampo(el){
  if(!el||!el.dataset||!el.dataset.c) return null;
  const l=linhaDo(el); if(!l) return null;
  const c=el.dataset.c;
  l.valores[c]=el.value;
  esquecerBusca(l);
  const cx=el.closest('.dt');
  if(cx){const st=estado(l.valores[c]);cx.className='dt '+st.cl;
    const tag=cx.querySelector('.tag-d');if(tag){tag.className='tag-d '+st.cl;tag.textContent=st.txt;}}
  return {l:l,c:c};
}
/* A régua inteira num handler só. `TETO=PASSO` em tudo que mexe em LINHA: outro
   resultado, outro começo de lista. "Dados do cadastro" mexe em COLUNA e por
   isso não zera o teto. */
document.addEventListener('change',e=>{
  const id=e.target.id;
  /* Só o modo de queda chega aqui: com o b4u-filtro.js quem avisa é o aoMudar de
     cada caixa, e os dois botões respondem ao clique, não ao change. */
  if(id==='f-sit'){ const v=e.target.value;
    if(v!==MANTEM){ F_SIT=v==='__todas__'?SIT_TODOS():[v]; TETO=PASSO; redesenhar(); } return; }
  if(id==='f-doc'){ const v=e.target.value;
    if(v!==MANTEM){ F_DOC=v==='__todos__'?[]:[v]; TETO=PASSO; redesenhar(); } return; }
  if(id==='f-ativos'){ const v=e.target.value;
    if(v!==MANTEM){ F_ATIVO=v==='1'?ATIVO_PADRAO.slice():ATIVO_ITENS.map(i=>i.v); TETO=PASSO; redesenhar(); } return; }
  const r=aplicarCampo(e.target); if(!r) return;
  // sair do campo depois do Enter dispara change com o mesmo valor: não grava duas vezes
  if(e.target._jaGravado===e.target.value){e.target._jaGravado=null;return;}
  agendarSalvar(r.l.id,r.c);
});
document.addEventListener('click',async e=>{
  const rt=e.target.closest('.btn-retry[data-retry]');
  if(rt){rt.disabled=true;tentarDeNovo(rt.dataset.retry);return;}
  /* Rodapé da ficha: salvar agora, fechar, e o × do topo. Vêm ANTES do teste do
     véu, senão o clique no botão contaria como clique fora. */
  if(e.target.closest('#cadSalvar')){salvarAgoraCad();return;}
  /* Fechar, × e clique no véu não estão aqui: quem cuida deles é a casca do
     b4u-modal.js, que precisa passar pelo aviso de "tem coisa por gravar" antes
     de deixar sair. */
  const env=e.target.closest('[data-env]');
  if(env){
    const l=linhaDo(env); if(!l) return;
    DOC_ALVO={id:l.id, coluna:env.dataset.env};
    const inp=document.getElementById('doc-file'); inp.value=''; inp.click();
    return;
  }
  const mais=e.target.closest('[data-mais]');
  if(mais){
    const l=linhaDo(mais); if(!l) return;
    const c=mais.dataset.mais, k=chaveCel(l.id,c);
    if(ABERTAS.has(k)) ABERTAS.delete(k); else ABERTAS.add(k);
    repintarCel(l,c);
    const campo=document.querySelector('.corpo[data-id="'+CSS.escape(String(l.id))+'"] [data-c="'+CSS.escape(c)+'"]');
    if(campo&&ABERTAS.has(k)) campo.focus();
    return;
  }
  const md=e.target.closest('.modo[data-modo]');
  if(md){
    const l=linhaDo(md); if(!l) return;
    const c=md.dataset.modo, atual=String(l.valores[c]||'').trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(atual)) return;      // nunca mexe numa data preenchida
    l.valores[c]=(md.dataset.para==='texto')?'N/A':'';
    esquecerBusca(l);
    const cx=md.closest('.dt'); if(cx) cx.outerHTML=celData(l,c);
    agendarSalvar(l.id,c,120);
    return;
  }
  const ver=e.target.closest('button[data-ver]');
  if(ver){
    const l=linhaDo(ver); if(!l) return;
    const c=ver.dataset.ver, k=l.id+'|'+c;
    if(REVELADAS.has(k)) REVELADAS.delete(k); else REVELADAS.add(k);
    const cx=ver.closest('.sig'); if(cx) cx.outerHTML=celSigilosa(l,c);
    return;
  }
  const cp=e.target.closest('button[data-copiar]');
  if(cp){
    const l=linhaDo(cp); if(!l) return;
    const txt=String(l.valores[cp.dataset.copiar]||'');
    try{ await navigator.clipboard.writeText(txt); }
    catch(err){ const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();
      try{document.execCommand('copy');}catch(e2){} t.remove(); }
    const antes=cp.textContent; cp.textContent='✓'; setTimeout(()=>{cp.textContent=antes;},1200);
    return;
  }
  if(e.target.closest('#btn-limpar')){limparFiltros();return;}
  /* Os dois botões de dois estados da régua. Vêm antes da linha da lista: ela
     é o último `closest` do handler e engoliria qualquer clique que sobrasse. */
  if(e.target.closest('#f-pend')){SO_PEND=!SO_PEND;TETO=PASSO;redesenhar();return;}
  if(e.target.closest('#f-cad')){VER_CADASTRO=!VER_CADASTRO;redesenhar();return;}
  if(e.target.closest('.btn-mais')){TETO+=PASSO;desenharLista();return;}
  if(e.target.closest('.btn-todos')){TETO=LINHAS.length;desenharLista();return;}
  /* Ordenar: um clique no título ordena A→Z, o mesmo título de novo inverte para
     Z→A. Não volta o teto ao início — a lista é a mesma, só noutra ordem, e
     recolher o que a pessoa já mandou mostrar seria castigo por ordenar.
     Filtro e busca continuam de pé: quem ordena é o visiveis(), sempre sobre o
     que sobrou dos dois, nunca sobre a lista crua. */
  const ord=e.target.closest('[data-sort]');
  if(ord){const k=ord.dataset.sort;
    /* O redesenho apaga o botão que acabou de ser apertado, e com ele o foco.
       Devolver o foco ao botão equivalente é o que deixa ordenar A→Z e depois
       Z→A pelo TECLADO: sem isto o segundo Enter caía no vazio, e o cabeçalho —
       que agora é o único caminho para ordenar — só servia para o mouse. */
    const tinhaFoco=document.activeElement===ord;
    if(SORT.key===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.key=k;SORT.dir='asc';}
    desenharLista();sincronizarURL();
    if(tinhaFoco){const n=document.querySelector('.lista-cab button[data-sort=\"'+CSS.escape(k)+'\"]');
      if(n)n.focus();}
    return;}
  /* A linha inteira abre a ficha. É o único jeito de editar esta tela. */
  const head=e.target.closest('.cli-head');
  if(head){const no=head.closest('.cli');if(no)abrirCadastro(no.dataset.id);return;}
  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto);return;}
});
/* Um seletor de arquivo só, reaproveitado por todas as células. */
(function(){
  const inp=document.createElement('input');
  inp.type='file'; inp.id='doc-file'; inp.hidden=true;
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0], alvo=DOC_ALVO;
    inp.value=''; DOC_ALVO=null;
    if(!f||!alvo) return;
    const l=LINHAS.find(x=>String(x.id)===String(alvo.id));
    if(l) enviarDocumento(l,alvo.coluna,f);
  });
  document.body.appendChild(inp);
})();

/* ---------- Enter grava e segue (C.14) ----------
   Na grade, Enter descia para a MESMA coluna da linha seguinte, porque se
   digitava uma coluna inteira de uma vez. Dentro da ficha não existe linha
   seguinte: o Enter continua gravando NA HORA — é o que faz ver o "Salvo ✓"
   enquanto ainda se lembra do que digitou — e leva o foco para o próximo campo
   da própria ficha; Shift+Enter volta para o anterior.
   Campo de seção fechada e campo só-leitura ficam de fora: o primeiro não está
   na tela, e o segundo nem tem campo (é um <div class="ro">). */
function camposDaFicha(){
  const corpo=document.querySelector('#cadBody .corpo');
  if(!corpo) return [];
  return Array.from(corpo.querySelectorAll('[data-c]'))
    .filter(el=>!el.disabled&&!el.readOnly&&el.getClientRects().length);
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.ctrlKey||e.metaKey||e.altKey) return;
  const el=e.target;
  if(!el.dataset||!el.dataset.c||el.tagName==='TEXTAREA') return;
  e.preventDefault();
  const r=aplicarCampo(el);
  if(r){ el._jaGravado=el.value; salvarAgora(r.l.id,r.c); }
  const campos=camposDaFicha();
  const i=campos.indexOf(el);
  if(i<0) return;
  const alvo=campos[i+(e.shiftKey?-1:1)];
  // campo de data não aceita select() — por isso a tentativa é protegida
  if(alvo){alvo.focus();try{if(alvo.select)alvo.select();}catch(_){}}
});
/* Atalhos de teclado (C.4): com a ficha aberta, Esc é dela antes de tudo; a
   linha da lista é um role="button", então Enter e Espaço abrem a ficha; "/"
   foca a busca e Esc a limpa — sem atrapalhar quem já está digitando. */
/* Esc com a ficha aberta NÃO chega aqui: a casca do b4u-modal.js escuta na
   captura, fecha o modal de cima da pilha e corta a propagação — senão o mesmo
   Esc que fecha a ficha limparia também a busca da lista por baixo. */
document.addEventListener('keydown',e=>{
  const linha=e.target&&e.target.closest&&e.target.closest('.cli-head');
  if(linha&&(e.key==='Enter'||e.key===' '||e.key==='Spacebar')){
    e.preventDefault();
    const no=linha.closest('.cli');if(no)abrirCadastro(no.dataset.id);
    return;
  }
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';TERMO='';aplicarBusca();}
});
/* ---------- ?abrir=ID: chegar com a ficha já aberta ----------
   O dossiê da pesquisa rápida manda para cá em guia nova quando o colaborador
   clica em "Alterar". Sem isto ele cairia na lista e teria de procurar de novo o
   cliente que já estava na tela — que é exatamente o passo que o botão existe
   para poupar.

   Só na PRIMEIRA carga, e o parâmetro sai do endereço assim que é usado. Se
   ficasse, um F5 reabriria a ficha por cima do que a pessoa estivesse fazendo, e
   o endereço que ela copiasse da barra levaria o colega para dentro de uma ficha
   que ele não pediu.

   Quem faz o trabalho é o irPara(), o MESMO dos cartões de resumo: ele limpa o
   filtro se o cliente estiver escondido, sobe o teto da lista se ele estiver
   além dele, rola até a linha e abre. Reaproveitar em vez de reimplementar é o
   que garante que o link funcione mesmo quando a tela abriu filtrada. */
let JA_ABRIU_PELO_ENDERECO=false;
function abrirPeloEndereco(){
  if(JA_ABRIU_PELO_ENDERECO) return;
  JA_ABRIU_PELO_ENDERECO=true;
  const alvo=(new URLSearchParams(location.search).get('abrir')||'').trim();
  if(!alvo) return;
  try{ const u=new URL(location.href); u.searchParams.delete('abrir');
       history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(e){}
  irPara(alvo);
}
function irPara(id){
  const alvo=String(id);
  const achar=()=>document.querySelector(`.cli[data-id="${CSS.escape(alvo)}"]`);
  if(!achar()){
    if(!visiveis().some(l=>String(l.id)===alvo)){
      /* Nenhum filtro pode esconder a linha para onde estamos indo: o vencimento
         volta a ser todos, a pendência desliga e os inativos entram — cliente
         inativo era o caso que o "só ativos" segurava calado, e o link do painel
         chegava numa lista que não tinha ninguém. */
      F_SIT=SIT_TODOS();SO_PEND=false;F_ATIVO=ATIVO_ITENS.map(i=>i.v);sincronizarCaixas();
      TERMO=alvo;TETO=PASSO;
      const b=document.getElementById('busca');if(b)b.value=TERMO;
    }
    /* O teto não pode esconder justamente a linha para onde estamos indo. */
    const pos=visiveis().findIndex(l=>String(l.id)===alvo);
    if(pos>=TETO)TETO=Math.ceil((pos+1)/PASSO)*PASSO;
    redesenhar();
  }
  const no=achar(); if(!no) return;
  no.scrollIntoView({block:'center',behavior:'smooth'});
  no.classList.add('destaque'); setTimeout(()=>no.classList.remove('destaque'),3500);
  /* Quem clicou num vencimento do cartão veio para AGIR naquele documento: a
     ficha abre junto, que é onde se resolve. */
  abrirCadastro(alvo);
}

/* ---------------- carregar ---------------- */
/* A ordem aqui é a da tela: primeiro o que responde (busca e contagem), depois o
   que refina (os doze chips, recolhidos), depois os exemplos, e só então a grade.
   Os chips e os cartões continuam existindo — deixaram de ser pedágio. */
function layout(){
  return `<div class="topo">
    <input class="busca campo-busca" id="busca" type="search" autocomplete="off" placeholder="Buscar por ID, cliente, CNPJ, CRM, cidade…  ( / para focar)">
    <span id="cx-ativos"></span>
    <span id="cx-venc"></span>
    <span id="cx-doc"></span>
    <button type="button" class="f-tog" id="f-pend" aria-pressed="false">Com pendências</button>
    <button type="button" class="f-tog mostra" id="f-cad" aria-pressed="false" hidden>Dados do cadastro</button>
    <button type="button" class="btn-limpar" id="btn-limpar" title="Volta para a visão sem filtro, sem busca e na ordem de vencimento">Limpar</button>
    <span class="resumo-lista" id="resumo-lista"></span>
  </div>
  <div class="lista" id="lista"></div>
  <div id="rodape-lista"></div>`;
}
async function carregar(){
  try{
    const d=await jsonp(API_URL+'?tipo=licencas_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro) throw new Error(d.erro);
    COLUNAS=d.colunas||[]; ESPELHADAS=d.espelhadas||[]; EDITAVEIS=d.editaveis||[];
    SIGILOSAS=d.sigilosas||[]; DATAS=d.datas||[]; LINKS=d.links||[];
    LINHAS=(d.linhas||[]).map(l=>Object.assign({valores:{},nome_cliente:'',ativo:''},l));
    LINHAS.forEach(l=>COLUNAS.forEach(c=>{if(l.valores[c]==null)l.valores[c]='';}));
    META=d;
    /* Quem está usando, para o botão da barra. ESTA ROTA AINDA NÃO MANDA O NOME:
       só `tipo=equipe` (colaborador) e `tipo=daily_equipe` trazem um `eu`, e o
       `?cod=` da URL é código de log, não nome — batizar o botão com ele seria
       inventar. Então o botão fica com o rótulo genérico "Minha conta" e o painel
       diz, sem rodeio, que não identificou quem está usando; o seletor de
       aparência, que é o motivo de o botão existir, funciona igual.
       A leitura de `d.eu` já está escrita: no dia em que `licencas_equipe` passar a
       devolver `eu:{nome}` — o servidor já resolve o colaborador pela chave, em
       `exigirEquipe_` — o nome aparece aqui sem tocar nesta tela. */
    if(window.B4UShell) B4UShell.usuario({nome:(d.eu&&d.eu.nome)||''});
    mapearLinha();                                 // CNPJ e cidade da linha, por apelido
    validarURL();                                  // a visão vem do endereço (C.10)
    document.getElementById('app').innerHTML=layout();
    montarFiltros();            // as três caixas de seleção entram na régua
    if(d.planilha_url) document.getElementById('plan').href=d.planilha_url;
    const b=document.getElementById('busca');
    b.value=TERMO;
    b.addEventListener('input',e=>{TERMO=e.target.value;aplicarBusca();});
    redesenhar();
    /* A grade já está pintada: a barra corre até 100% e o overlay sai revelando a
       tela pronta, sem somar espera de verdade. */
    abrirPeloEndereco();          // ?abrir=ID — ver o comentário na função
    if(window.B4UEspera) B4UEspera.concluir();
  }catch(e){
    /* Uma mensagem só, sem detalhe técnico. O que estava aqui era um roteiro de
       manutenção da planilha — vocabulário nosso, que na tela de quem usa só
       assusta e vira ligação para o atendimento. Quem conserta é a equipe, pelo
       log do servidor; a pessoa só precisa saber que pode tentar de novo. */
    if(window.B4UEspera) B4UEspera.telaErro(document.getElementById('app'));
    else document.getElementById('app').innerHTML=
      '<div class="state"><h1>Não conseguimos carregar as informações</h1>'
      +'<p>Houve um erro ao recuperar as informações. Tente novamente em alguns '
      +'minutos. Se o problema continuar, entre em contato com o atendimento.</p></div>';
  }
}
document.getElementById('volta').href='colaborador?chave='+encodeURIComponent(chaveAtual());

/* ---------------- menu lateral ----------------
   Montado ANTES de carregar(): a identidade desta tela é a chave, que já está na
   URL desde a primeira linha deste script — não há o que esperar da API. E se a
   busca falhar, o erro pinta dentro do #app com o menu inteiro de pé, que é a
   mesma razão de o erro nunca ser pintado no <body>.
   Sem `contexto`: esta página não sabe o NOME de quem está usando (o `cod` é
   código de log, não nome), e um rótulo inventado seria pior que bloco nenhum.
   Os links levam só a chave, como o logo e o "← Painel" já levavam aqui. */
if (window.B4UShell) {
  B4UShell.montar({
    perfil: 'equipe',
    ativo: 'licencas',
    link: function (pag) { return pag + '?chave=' + encodeURIComponent(chaveAtual()); }
  });

  /* O botão de quem está usando (e, com ele, o seletor de aparência) nasce junto
     do menu lateral, com rótulo genérico. O nome entra depois, quando a API
     responder — ver a chamada de `usuario({nome})` no carregar(). */
  B4UShell.usuario();
  /* Esta página tem <base target="_blank">, para o colaborador nunca perder a
     tela em que estava ao abrir um documento. O menu lateral segue a MESMA
     regra: o dono decidiu que tudo abre em guia nova, sem exceção, e o próprio
     B4UShell já marca os links do menu com target="_blank" rel="noopener".
     As duas exceções continuam sendo o logo (#logo-home) e o "← Painel"
     (#volta), escritos à mão com target="_self": eles são o gesto de VOLTAR. */
}

lerURL();
carregar();
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador') {
        try { href = 'colaborador?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
