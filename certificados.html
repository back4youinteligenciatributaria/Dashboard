<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Guia nova por padrão: link clicado não tira o colaborador de onde ele estava. -->
<base target="_blank">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificados e acessos (equipe) — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Duas origens porque o /exec responde 302 para a segunda: sem isto o aparelho paga
     DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte não pode segurar a primeira pintura: entra como preload e vira folha depois. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"></noscript>
<style>
:root{
  /* Paleta canonica da equipe — a mesma em todas as telas. */
  --canvas:#F1E7DC;--surface:#FFFFFF;--surface-warm:#FBF6EF;
  --ink:#113D39;--ink-2:#3F5854;--muted:#6E6256;--line:#E4D9C9;--line-2:#D6C3AC;
  --brand-dark:#073034;--brand-teal:#0F8C85;--brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,37:1 no canvas).
     Este e o mesmo teal escurecido so para letra e fundo de letra; o --brand-teal
     segue canonico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E;--amber-txt:#8A5A10;--amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber da 2,61:1 com #fff, o --amber-2 da 4,68:1. Como
     preenchimento de barra, icone ou borda, o --amber original continua valendo. */
  --amber-2:#B05F12;
  --vermelho:#C0392B;--verde:#2E9D5F;--verde-2:#25804C;
  /* Raios: so pelos tokens — 10 em campo, 12 padrao, 16 nos blocos grandes, pilula. */
  --radius-sm:10px;--radius:12px;--radius-lg:16px;--radius-pill:999px;
  /* Levantar de cartao clicavel: uma sombra so, igual em todas as telas. */
  --lift:0 8px 20px rgba(17,61,57,.10);
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- barra superior (igual às páginas irmãs) ---------- */
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:var(--radius-pill);white-space:nowrap}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd;white-space:nowrap}
.barra a.volta,.barra a.plan{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.barra a.plan{border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:4px 11px}
.save-status{font-size:13px;font-weight:800;padding:6px 13px;border-radius:var(--radius-pill);background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
/* Branco sobre --amber da 2,61:1 e sobre --verde 3,44:1 — o rotulo do proprio
   status de gravacao some. Um degrau mais escuro na MESMA familia: 4,68:1 e 4,92:1. */
.save-status.saving{background:var(--amber-2);color:#fff}.save-status.ok{background:var(--verde-2);color:#fff}.save-status.err{background:var(--vermelho);color:#fff}

/* ---------- topo: filtros + busca ---------- */
.topo{padding:14px 16px 6px}
.linha-filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.grupo{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grupo .rot{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px;align-self:center}
.chip{font-size:13px;font-weight:700;border-radius:var(--radius-pill);padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--brand-teal)}
.chip.on{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.chip .n{background:rgba(0,0,0,.10);border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.chip.alerta.on{background:var(--vermelho);border-color:var(--vermelho)}
.chip.falta.on{background:var(--amber);border-color:var(--amber)}
.chip.limpar{border-style:dashed;color:var(--muted)}
/* B.7: a busca é a pílula larga da tela. */
.busca{flex:1;min-width:220px;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}

/* ---------- cards de resumo ---------- */
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:0 16px 12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.rhead{padding:9px 13px;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff}
.rcard.vencidos .rhead{background:var(--vermelho)}
.rcard.d30 .rhead{background:var(--amber)}
.rcard.d60 .rhead{background:var(--brand-teal-txt)}
.rcard.falta .rhead{background:#6B8486}
.rhead .n{background:rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:2px 9px;font-size:11px}
.rlista{max-height:150px;overflow:auto;padding:5px}
.tk{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;font-family:var(--sans);font-size:12px;
  border:0;background:transparent;color:inherit;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer}
.tk:hover{background:var(--surface-warm)}
.tk .d{font-weight:800;white-space:nowrap;color:var(--ink)}
.tk .lb{color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .tp{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.rvazio{color:var(--muted);font-size:12px;padding:9px}

/* ---------- grade ---------- */
.tabela-wrap{overflow:auto;max-height:calc(100vh - 190px);border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;font-size:12px}
thead th{position:sticky;background:var(--brand-dark);color:#fff;text-align:left;white-space:nowrap;border-right:1px solid rgba(255,255,255,.08)}
/* Faixa de grupo (assunto) por cima dos cabeçalhos — a âncora na rolagem lateral. */
thead tr.grupos th{top:0;z-index:22;height:26px;padding:4px 10px;font-size:11px;font-weight:800;
  letter-spacing:.4px;text-transform:uppercase;color:#9FC7C3;background:#052528}
thead tr.grupos th.alt{background:#0A4247}
thead tr.cols th{top:26px;z-index:20;padding:9px 10px;font-size:11px;font-weight:700}
thead.sem-faixa tr.cols th{top:0}
thead tr.cols th[data-sort]{cursor:pointer;user-select:none}
thead tr.cols th[data-sort]:hover{background:#0a4247}
thead tr.cols th .ord{opacity:.55;font-size:11px;margin-left:4px}
thead tr.cols th .lock{opacity:.6;font-size:11px;margin-left:4px}
/* Separador vertical no começo de cada grupo — vale no cabeçalho e no corpo. */
thead th.ini{border-left:2px solid rgba(255,255,255,.30)}
tbody td.ini{border-left:2px solid var(--line-2)}
tbody td{padding:4px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;background:var(--surface)}
tbody tr:nth-child(even) td{background:var(--surface-warm)}
th.col-id,td.col-id{left:0;width:76px;min-width:76px;max-width:76px}
th.col-nome,td.col-nome{left:76px;min-width:196px;max-width:216px}
td.col-id,td.col-nome{position:sticky;z-index:15}
thead tr.grupos th.col-id,thead tr.grupos th.col-nome{z-index:28}
thead tr.cols th.col-id,thead tr.cols th.col-nome{z-index:26}
td.col-id{background:var(--surface);font-weight:800;color:var(--brand-teal-txt);padding:7px 9px;white-space:nowrap;box-shadow:1px 0 0 var(--line)}
td.col-nome{background:var(--surface);font-weight:700;font-size:12px;line-height:1.25;padding:7px 9px;white-space:normal;box-shadow:2px 0 6px rgba(7,48,52,.07)}
tbody tr:nth-child(even) td.col-id,tbody tr:nth-child(even) td.col-nome{background:var(--surface-warm)}
td.col-nome .flag{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.3px;border-radius:var(--radius-pill);padding:2px 8px}
td.col-nome .flag.nova{background:var(--amber-soft);color:var(--amber-txt);border:1px solid var(--amber-line)}
td.col-nome .flag.inativo{background:#EEE9E2;color:var(--muted);border:1px solid var(--line)}
tr.destaque>td{background:#FFF3B0!important;transition:background .4s ease}

/* ---------- campos da grade ---------- */
input[type=text],input[type=date],input[type=password]{font-family:var(--sans);font-size:12px;padding:6px 8px;border:1px solid var(--line-2);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--brand-teal);outline-offset:0}
.ro{padding:6px 8px;font-size:12px;color:var(--muted);background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.02) 6px,rgba(0,0,0,.02) 12px);
  border:1px dashed var(--line-2);border-radius:var(--radius-sm);white-space:normal;word-break:break-word}
.dt{display:flex;align-items:center;gap:4px;min-width:186px}
.dt input{flex:1;min-width:104px}
.tag-d{flex:none;font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:3px 7px;white-space:nowrap;min-width:44px;text-align:center}
.tag-d.vazio{background:var(--amber-soft);color:var(--amber-txt)}
.tag-d.na{background:#EEE9E2;color:var(--muted)}
.tag-d.venc{background:#F7DFDC;color:var(--vermelho)}
.tag-d.d30{background:#FCEFE0;color:var(--amber-txt)}
.tag-d.d60{background:#E1F0EE;color:#0b6c66}
.tag-d.d90,.tag-d.ok{background:#E6F3EC;color:#1f6b45}
.dt.venc input[type=date]{border-color:var(--vermelho)}
.dt.d30 input[type=date]{border-color:var(--amber)}
.sig{display:flex;align-items:center;gap:4px;min-width:158px}
/* ---------- coluna de LINK: campo de URL + atalho para abrir ---------- */
.lk-cel{display:flex;align-items:center;gap:4px;min-width:190px}
.lk-cel input,.lk-cel .ro{flex:1;min-width:110px}
.lk-ir{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  font-size:13px;font-weight:800;line-height:1;text-decoration:none;border:1px solid var(--line-2);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--brand-teal-txt)}
.lk-ir:hover{border-color:var(--brand-teal);background:#EAF5F4}
/* Sem URL válida o atalho fica apagado e não clica — não abre guia em branco. */
.lk-ir.off{color:var(--line-2);border-style:dashed;background:transparent;cursor:default}

/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:var(--radius-pill);padding:12px 20px}
/* Densidade da grade: cabe ao lado de um campo sem empurrar a coluna. */
.btn--micro{padding:5px 7px;font-size:11px;line-height:1;flex:none;white-space:nowrap}
.btn.modo{color:var(--muted);border-style:dashed;font-weight:800}
.btn.modo:hover{border-style:solid;color:var(--brand-teal-txt)}

/* ---------- estados ---------- */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:48vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:60ch}
.state code{background:var(--surface-warm);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.state ol{text-align:left;color:var(--ink-2);font-size:13px;max-width:60ch;line-height:1.7;padding-left:20px}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:720px){.resumo{grid-template-columns:1fr}.barra .tag{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}

/* ---------- explicacao recolhida (C.2) ----------
   O dado vem primeiro; a instrucao fica a um clique e lembra a escolha. */
details.ajuda{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:8px 16px}
details.ajuda>summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:12px;font-weight:800;color:var(--ink-2)}
details.ajuda>summary::-webkit-details-marker{display:none}
details.ajuda>summary::after{content:" \25BE";color:var(--muted)}
details.ajuda[open]>summary::after{content:" \25B4"}
details.ajuda>.txt{padding:0 12px 11px;font-size:12px;color:var(--muted);line-height:1.55}
details.ajuda>.txt b{color:var(--ink-2)}
details.ajuda>.txt a{color:var(--brand-teal-txt)}
/* ---------- o que nao gravou (C.3) ----------
   A linha (ou o campo) fica marcada e o "tentar de novo" nasce ali mesmo. */
.falhou{outline:2px solid var(--vermelho);outline-offset:-2px}
tr.falhou>td{background:#FBEAE7!important}
.btn-retry{display:block;margin-top:4px;font-family:var(--sans);font-size:11px;font-weight:800;cursor:pointer;
  border:1px solid var(--vermelho);background:var(--vermelho);color:#fff;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap}
.btn-retry:disabled{opacity:.6;cursor:default}
/* ---------- padroes compartilhados (B.10 e B.12) ---------- */
/* Foco de teclado sempre visivel — quem navega por Tab precisa ver onde esta. */
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}
/* A barra nunca estoura: quebra de linha e o contador some no celular. */
.barra{flex-wrap:wrap}
@media(max-width:560px){.barra .cnt{display:none}}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="barra">
  <a class="logo" id="logo-home" href="colaborador.html" target="_self" title="Voltar para o painel do colaborador">back<span class="y">4you</span></a>
  <span class="tag">🔐 Certificados e acessos</span>
  <span class="spacer"></span>
  <span class="save-status" id="saveStatus"></span>
  <span class="cnt" id="cnt"></span>
  <a class="plan" id="plan" href="#" target="_blank" rel="noopener">Planilha ↗</a>
  <a class="volta" id="volta" href="colaborador.html" target="_self">← Painel</a>
</div>
<div id="app"><div class="state"><div class="spin"></div><p>Carregando certificados e acessos…</p></div></div>

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbxJ63h8C5A6lgDgd_xp9XIPk3uaa0ks04CD1hQTptcZNTDfGwQadPej5xResVknzshe/exec';
const CHAVE_PADRAO='b4u-equipe-2026';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash.
// Vira a coluna "Colaborador" da aba log.
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;
  try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* ---------- busca que entende CNPJ com e sem pontuação (C.1) ---------- */
function soDigitos(s){return String(s==null?'':s).replace(/\D/g,'');}
/** Compara o texto normalizado e, quando o termo tem 6 dígitos ou mais, também
 *  só os dígitos dos dois lados. */
function casaBusca(alvoTxt,alvoDig,termo){
  const t=normTxt(termo);
  if(!t)return true;
  if(alvoTxt.indexOf(t)>=0)return true;
  const d=soDigitos(termo);
  return d.length>=6&&alvoDig.indexOf(d)>=0;
}
/** Lembra no navegador se a explicação fica aberta — a escolha é de quem usa. */
function ligarDetalhes(el,chave){
  if(!el)return;
  try{if(localStorage.getItem(chave)==='1')el.open=true;}catch(e){}
  el.addEventListener('toggle',()=>{try{localStorage.setItem(chave,el.open?'1':'0');}catch(e){}});
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
function jsonpAviso(txt){
  const p = document.getElementById('espera-txt')
       || document.querySelector('#app .state p')
       || document.querySelector('.state p');
  if(p) p.textContent = txt;
}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. Enquanto
   espera, a tela diz que ainda estamos buscando — erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    if(typeof pararEspera === 'function'){ try{ pararEspera(); }catch(_){} }
    jsonpAviso('Ainda estou buscando — tentando de novo…');
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
async function postAcao(obj){const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});const d=await r.json();if(d&&d.erro)throw new Error(d.erro);return d;}

/* ---------------- estado ---------------- */
let LINHAS=[], COLUNAS=[], ESPELHADAS=[], EDITAVEIS=[], SIGILOSAS=[], DATAS=[], LINKS=[], META={}, GRUPOS=[];
/* Valores que o filtro de situação realmente conhece — qualquer outra coisa
   cai em 'todos'. É o mesmo ?f= que o painel do colaborador manda no link. */
const FILTROS_OK=['todos','falta','vencidos','d30','d60','d90'];
let FILTRO='todos';      // todos | falta | vencidos | d30 | d60 | d90
let DOC='todos';         // 'todos' ou o nome de uma coluna de vencimento
let TERMO='';
let SO_ATIVOS=true;
let VER_CADASTRO=false;  // mostrar as colunas espelhadas do Registro (só leitura)
let SORT={key:'urgencia',dir:'asc'};
const REVELADAS=new Set();
const hoje=new Date(); hoje.setHours(0,0,0,0);

const eh=(lista,c)=>lista.some(x=>normTxt(x)===normTxt(c));
/* Espelhada = vem do Registro por IMPORTRANGE. Escrever nela destruiria a fórmula,
   então aqui ela é só leitura — e fica escondida até você pedir para ver. */
const ehEspelhada=c=>eh(ESPELHADAS,c);
const ehSigilosa=c=>eh(SIGILOSAS,c);
const ehData=c=>eh(DATAS,c);
const ehLink=c=>eh(LINKS,c);
/* O backend manda a lista de colunas editáveis. Coluna fora dela vira só leitura —
   mas senha, data e link continuam editáveis, porque são tipos de campo, não papéis.
   Backend antigo (sem a lista) deixa tudo como está. */
function ehSoLeitura(c){
  if(ehEspelhada(c)) return true;
  if(!EDITAVEIS.length) return false;
  if(ehSigilosa(c)||ehData(c)||ehLink(c)) return false;
  return !eh(EDITAVEIS,c);
}
/* ID e Nome já aparecem nas colunas congeladas */
const ocultaSempre=c=>['id','nome','name'].includes(normTxt(c));
function curto(c){return String(c).replace(/^Vencimento\s+/i,'').replace(/^Certificado de\s+/i,'Cert. ').trim();}

/* ---------------- grupos de coluna (derivados do NOME, em tempo de execução) ----
   A grade é larga e a planilha muda sozinha, então nada de lista fixa: o grupo sai
   do próprio nome da coluna, em três passos.
   1) tira das pontas as palavras que dizem o PAPEL do campo (link, senha,
      vencimento, login…). O que sobra é o ASSUNTO:
        "Certificado Digital Senha"    -> "Certificado Digital"
        "Link Prefeitura"              -> "Prefeitura"
        "Vencimento Alvará Sanitário"  -> "Alvará Sanitário"
   2) assuntos que começam pela mesma palavra viram um grupo só, batizado com o
      maior pedaço de nome que todos compartilham:
        "Procuração RFB" + "Procuração e-CAC" -> "Procuração"
   3) o cabeçalho da coluna passa a mostrar só o PAPEL; o assunto vira a faixa. */
const PAPEIS=new Set(['link','links','url','endereco','vencimento','vencto','venc','vence','validade',
  'valido','data','datas','emissao','expedicao','senha','password','login','usuario','user','acesso',
  'codigo','numero','n','no','status','situacao','observacao','observacoes','obs','protocolo',
  'arquivo','copia','pdf','inicio','fim']);
const PALAVRINHAS=new Set(['de','da','do','das','dos','e','a','o','em','no','na','para','por']);
function tokens(c){return String(c==null?'':c).trim().split(/\s+/).filter(Boolean);}
function tnorm(t){return normTxt(t).replace(/[^0-9a-z\-]/g,'');}
function ehPalavraDePapel(t){const n=tnorm(t);return PAPEIS.has(n)||PALAVRINHAS.has(n);}
function assuntoDe(c){
  let t=tokens(c);
  while(t.length>1&&ehPalavraDePapel(t[0])) t=t.slice(1);
  while(t.length>1&&ehPalavraDePapel(t[t.length-1])) t=t.slice(0,-1);
  return t.join(' ')||String(c||'');
}
/** Maior pedaço de nome (em palavras) comum a todos os assuntos da lista. */
function prefixoComum(lista){
  const t=lista.map(tokens);
  let n=0;
  while(n<t[0].length&&t.every(x=>n<x.length&&tnorm(x[n])===tnorm(t[0][n]))) n++;
  return (n?t[0].slice(0,n):t[0].slice(0,1)).join(' ');
}
function montarGrupos(cols){
  const assunto=new Map();
  cols.forEach(c=>assunto.set(c,assuntoDe(c)));
  /* assuntos que dividem a primeira palavra entram no mesmo grupo */
  const porPrimeira=new Map();
  cols.forEach(c=>{
    const a=assunto.get(c), p=tnorm(tokens(a)[0]||'');
    if(!porPrimeira.has(p)) porPrimeira.set(p,[]);
    if(porPrimeira.get(p).indexOf(a)<0) porPrimeira.get(p).push(a);
  });
  const nomeDoGrupo=new Map();
  porPrimeira.forEach((lista,p)=>{
    const nome=(lista.length>1&&p)?prefixoComum(lista):lista[0];
    lista.forEach(a=>nomeDoGrupo.set(a,nome));
  });
  /* Partição estável: o grupo nasce onde a primeira coluna dele aparece e as irmãs
     se encostam nele — coluna só troca de lugar se uma irmã veio antes. */
  const grupos=[], onde=new Map();
  cols.forEach(c=>{
    const nome=nomeDoGrupo.get(assunto.get(c))||curto(c);
    if(!onde.has(nome)){onde.set(nome,grupos.length);grupos.push({nome,cols:[]});}
    grupos[onde.get(nome)].cols.push(c);
  });
  return grupos;
}
/** Dentro de um grupo o cabeçalho mostra só o que a faixa ainda não disse. */
function rotuloNoGrupo(col,grupo){
  const sobrando=tokens(grupo).map(tnorm);
  const resto=[];
  tokens(col).forEach(t=>{
    const i=sobrando.indexOf(tnorm(t));
    if(i>=0){sobrando.splice(i,1);return;}
    resto.push(t);
  });
  return resto.filter(t=>!PALAVRINHAS.has(tnorm(t))).join(' ').trim()||curto(col);
}

/* ---------------- datas ---------------- */
function diasAte(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
  return Math.round((new Date(+m[1],+m[2]-1,+m[3])-hoje)/864e5);}
function fmtBR(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(iso||'');}
function estado(v){
  const s=String(v==null?'':v).trim();
  if(!s) return {cl:'vazio',dias:null,txt:'falta'};
  const d=diasAte(s);
  if(d===null) return {cl:'na',dias:null,txt:s.length>7?s.slice(0,7)+'…':s};
  if(d<0)   return {cl:'venc',dias:d,txt:'vencido'};
  if(d<=30) return {cl:'d30',dias:d,txt:d+'d'};
  if(d<=60) return {cl:'d60',dias:d,txt:d+'d'};
  if(d<=90) return {cl:'d90',dias:d,txt:d+'d'};
  return {cl:'ok',dias:d,txt:fmtBR(s).slice(3)};
}
function ativoDe(l){const s=normTxt(l.ativo);if(!s)return null;
  if(/^(sim|s|true|verdadeiro|1|x|ativo)$/.test(s))return true;
  if(/^(nao|n|false|falso|0|-|inativo)$/.test(s))return false;return null;}

function colsData(){return DOC==='todos'?DATAS:[DOC];}
function urgencia(l,keys){
  let min=null;
  (keys||DATAS).forEach(k=>{const st=estado(l.valores[k]);if(st.dias!=null&&(min===null||st.dias<min))min=st.dias;});
  return min;
}
function faltando(l){
  return colsData().filter(k=>!String(l.valores[k]||'').trim()).map(curto);
}

/* ---------------- filtros ---------------- */
function passaFiltro(l){
  if(SO_ATIVOS&&ativoDe(l)===false) return false;
  if(FILTRO==='todos') return true;
  if(FILTRO==='falta') return faltando(l).length>0;
  const u=urgencia(l,colsData());
  if(u===null) return false;
  if(FILTRO==='vencidos') return u<0;
  if(FILTRO==='d30') return u<=30;
  if(FILTRO==='d60') return u<=60;
  if(FILTRO==='d90') return u<=90;
  return true;
}
/* Texto e dígitos da linha, guardados até alguém editar a linha.
   As colunas sigilosas ficam de fora: senha nunca entra na busca. */
function chavesBusca(l){
  if(l._bt==null){
    const campos=COLUNAS.filter(c=>!ehSigilosa(c)).map(c=>l.valores[c]);
    l._bt=normTxt([l.id,l.nome_cliente].concat(campos).join(' '));
    l._bd=[String(l.id)].concat(campos).map(soDigitos).filter(Boolean).join('|');
  }
  return l;
}
function esquecerBusca(l){l._bt=null;l._bd=null;}
function passaBusca(l,termo){
  if(!termo) return true;
  chavesBusca(l);
  return casaBusca(l._bt,l._bd,termo);
}
function visiveis(){
  const termo=String(TERMO||'').trim();
  const arr=LINHAS.filter(l=>passaFiltro(l)&&passaBusca(l,termo));
  const dir=SORT.dir==='asc'?1:-1;
  arr.sort((a,b)=>{
    if(SORT.key==='urgencia'){
      const ua=urgencia(a,colsData()),ub=urgencia(b,colsData());
      if(ua===null&&ub===null) return String(a.id).localeCompare(String(b.id),'pt',{numeric:true});
      if(ua===null) return 1; if(ub===null) return -1;
      return (ua-ub)*dir;
    }
    if(SORT.key==='id') return String(a.id).localeCompare(String(b.id),'pt',{numeric:true})*dir;
    if(SORT.key==='nome_cliente') return normTxt(a.nome_cliente).localeCompare(normTxt(b.nome_cliente),'pt')*dir;
    return normTxt(a.valores[SORT.key]).localeCompare(normTxt(b.valores[SORT.key]),'pt')*dir;
  });
  return arr;
}

/* ---------------- células ---------------- */
/* Uma data preenchida NÃO tem botão nenhum ao lado — assim nenhum clique
   distraído apaga o vencimento. O atalho de trocar data↔texto só aparece
   quando não há nada a perder: campo vazio, ou campo que já é texto. */
function celData(l,c){
  const v=String(l.valores[c]||'').trim();
  const isISO=/^\d{4}-\d{2}-\d{2}$/.test(v);
  const livre=!!v&&!isISO;
  const st=estado(v);
  const atalho = isISO ? ''
    : (livre ? `<button type="button" class="btn btn--micro modo" data-modo="${esc(c)}" data-para="data" title="Trocar por um campo de data">📅 data</button>`
             : `<button type="button" class="btn btn--micro modo" data-modo="${esc(c)}" data-para="texto" title="Escrever texto (N/A, “Não localizado”…)">texto</button>`);
  return `<div class="dt ${st.cl}">
    ${livre
      ? `<input type="text" data-c="${esc(c)}" value="${esc(v)}" placeholder="ex.: Não localizado">`
      : `<input type="date" data-c="${esc(c)}" value="${isISO?v:''}">`}
    ${atalho}
    <span class="tag-d ${st.cl}">${esc(st.txt)}</span>
  </div>`;
}
function celSigilosa(l,c){
  const v=String(l.valores[c]||'');
  const aberta=REVELADAS.has(l.id+'|'+c);
  return `<div class="sig">
    <input type="${aberta?'text':'password'}" data-c="${esc(c)}" value="${esc(v)}" autocomplete="off" placeholder="—">
    <button type="button" class="btn btn--micro" data-ver="${esc(c)}" title="${aberta?'Esconder':'Mostrar'}">${aberta?'🙈':'👁️'}</button>
    <button type="button" class="btn btn--micro" data-copiar="${esc(c)}" title="Copiar">📋</button>
  </div>`;
}
/* Só abre o que é mesmo endereço — campo vazio ou com anotação solta deixa o
   atalho apagado, para ninguém cair numa guia em branco. */
function urlOk(v){return /^https?:\/\/[^\s]+$/i.test(String(v==null?'':v).trim());}
function atalhoAbrir(v){
  const u=String(v||'').trim();
  return urlOk(u)
    ? `<a class="lk-ir" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="Abrir em outra guia">↗</a>`
    : `<span class="lk-ir off" title="Sem endereço válido para abrir" aria-hidden="true">↗</span>`;
}
function celLink(l,c){
  const v=String(l.valores[c]||'');
  return `<div class="lk-cel">
    <input type="text" data-c="${esc(c)}" data-link="1" value="${esc(v)}" placeholder="https://…" inputmode="url" spellcheck="false">
    ${atalhoAbrir(v)}
  </div>`;
}
function celSoLeitura(l,c){
  const v=String(l.valores[c]||'');
  const t=ehEspelhada(c)?'Espelho do Registro (fórmula IMPORTRANGE) — edite em Registros de clientes'
                        :'Coluna mantida pelo sistema — só leitura';
  const caixa=`<div class="ro" title="${esc(t)}">${esc(v||'—')}</div>`;
  /* link só de leitura continua abrindo: some o campo, fica o atalho */
  return ehLink(c)?`<div class="lk-cel">${caixa}${atalhoAbrir(v)}</div>`:caixa;
}
function cel(l,c){
  if(ehSoLeitura(c)) return celSoLeitura(l,c);
  if(ehSigilosa(c))  return celSigilosa(l,c);
  if(ehData(c))      return celData(l,c);
  if(ehLink(c))      return celLink(l,c);
  return `<input type="text" data-c="${esc(c)}" value="${esc(l.valores[c]||'')}">`;
}

/* ---------------- render ---------------- */
function colsVisiveis(){
  return COLUNAS.filter(c=>!ocultaSempre(c)&&(VER_CADASTRO||!ehEspelhada(c)));
}
function gradeCols(){return GRUPOS.reduce((a,g)=>a.concat(g.cols),[]);}
/* Se nenhuma família tiver duas colunas, a faixa não teria o que dizer — some. */
function temFaixa(){return GRUPOS.some(g=>g.cols.length>1);}
function cabecalho(){
  const seta=k=>SORT.key===k?`<span class="ord">${SORT.dir==='asc'?'▲':'▼'}</span>`:'';
  const faixa=GRUPOS.map((g,i)=>
    `<th scope="colgroup" class="ini ${i%2?'alt':''}" colspan="${g.cols.length}">${g.cols.length>1?esc(g.nome):''}</th>`).join('');
  const cols=GRUPOS.map(g=>g.cols.map((c,j)=>{
    const rot=g.cols.length>1?rotuloNoGrupo(c,g.nome):curto(c);
    const trav=ehSoLeitura(c);
    /* senha não é critério de ordenação — ordenar por ela já contaria demais */
    if(ehSigilosa(c)) return `<th scope="col" class="${j===0?'ini':''}">${esc(rot)}</th>`;
    const k=ehData(c)?'urgencia':c;
    return `<th scope="col" class="${j===0?'ini':''}" data-sort="${esc(k)}"${trav?' title="Só leitura"':''}>`+
      `${esc(rot)}${trav?'<span class="lock">🔒</span>':''}${seta(k)}</th>`;
  }).join('')).join('');
  return (temFaixa()?`<tr class="grupos"><th class="col-id"></th><th class="col-nome"></th>${faixa}</tr>`:'')+
  `<tr class="cols"><th scope="col" class="col-id" data-sort="id">ID${seta('id')}</th>
    <th scope="col" class="col-nome" data-sort="nome_cliente">Cliente${seta('nome_cliente')}</th>${cols}</tr>`;
}
function linhaHTML(l){
  const at=ativoDe(l);
  const flags=at===false?'<span class="flag inativo">inativo</span>':'';
  const tds=GRUPOS.map(g=>g.cols.map((c,j)=>`<td class="${j===0?'ini':''}">${cel(l,c)}</td>`).join('')).join('');
  return `<tr data-id="${esc(l.id)}">
    <td class="col-id">${esc(l.id)}</td>
    <td class="col-nome">${esc(l.nome_cliente||'(sem nome)')}<br>${flags}</td>
    ${tds}
  </tr>`;
}
function desenharTabela(){
  GRUPOS=montarGrupos(colsVisiveis());
  const th=document.getElementById('thead');
  th.className=temFaixa()?'':'sem-faixa';
  th.innerHTML=cabecalho();
  const arr=visiveis();
  document.getElementById('cnt').textContent=arr.length+' de '+LINHAS.length+' clientes';
  document.getElementById('tbody').innerHTML=arr.length
    ? arr.map(linhaHTML).join('')
    : `<tr><td colspan="${gradeCols().length+2}" style="padding:26px;text-align:center;color:var(--muted)">Nada com esse filtro.</td></tr>`;
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
}
function itemResumo(l,c){
  const st=estado(l.valores[c]);
  return `<button type="button" class="tk" data-goto="${esc(l.id)}">
    <span class="d">${st.dias!=null&&st.dias<0?'vencido':fmtBR(l.valores[c])}</span>
    <span class="lb">${esc(l.nome_cliente||l.id)}</span>
    <span class="tp">${esc(curto(c))}</span></button>`;
}
function desenharResumo(){
  const keys=colsData();
  const base=LINHAS.filter(l=>!SO_ATIVOS||ativoDe(l)!==false);
  const itens=(min,max)=>{
    const out=[];
    base.forEach(l=>keys.forEach(k=>{const st=estado(l.valores[k]);
      if(st.dias!=null&&st.dias>=min&&st.dias<=max)out.push({l,k,d:st.dias});}));
    out.sort((a,b)=>a.d-b.d); return out;
  };
  const venc=itens(-99999,-1), d30=itens(0,30), d60=itens(31,60);
  const falta=base.filter(l=>faltando(l).length>0);
  const card=(cls,titulo,lista,render)=>`<div class="rcard ${cls}">
      <div class="rhead"><span>${titulo}</span><span class="n">${lista.length}</span></div>
      <div class="rlista">${lista.length?lista.slice(0,60).map(render).join(''):'<div class="rvazio">Nada por aqui 🎉</div>'}</div></div>`;
  document.getElementById('resumo').innerHTML=
    card('vencidos','Vencidos',venc,x=>itemResumo(x.l,x.k))+
    card('d30','Vence em até 30 dias',d30,x=>itemResumo(x.l,x.k))+
    card('d60','Vence em 31–60 dias',d60,x=>itemResumo(x.l,x.k))+
    card('falta','Faltando dados',falta,l=>`<button type="button" class="tk" data-goto="${esc(l.id)}">
        <span class="d">${esc(l.id)}</span><span class="lb">${esc(l.nome_cliente||'')}</span>
        <span class="tp">${esc(faltando(l).join(' · '))}</span></button>`);
}
/* Quantos filtros estão pegando agora — vira o número do "Limpar filtros" (C.5). */
function filtrosAtivos(){
  return (FILTRO!=='todos'?1:0)+(DOC!=='todos'?1:0)+(String(TERMO).trim()?1:0)+(SO_ATIVOS?0:1);
}
function limparFiltros(){
  FILTRO='todos';DOC='todos';TERMO='';SO_ATIVOS=true;
  const b=document.getElementById('busca');if(b)b.value='';
  redesenhar();
}
function desenharChips(){
  const keys=colsData();
  const base=l=>(!SO_ATIVOS||ativoDe(l)!==false);
  const nUrg=(min,max)=>LINHAS.filter(l=>{if(!base(l))return false;const u=urgencia(l,keys);return u!==null&&u>=min&&u<=max;}).length;
  const nFalta=LINHAS.filter(l=>base(l)&&faltando(l).length>0).length;
  const c=(k,rot,n,extra)=>`<button type="button" class="chip ${extra||''} ${FILTRO===k?'on':''}" data-f="${k}">${rot}${n!=null?`<span class="n">${n}</span>`:''}</button>`;
  document.getElementById('chipsSit').innerHTML=
    `<span class="rot">Situação</span>`+
    c('todos','Todos',LINHAS.filter(base).length)+
    c('falta','Faltando dados',nFalta,'falta')+
    c('vencidos','Vencidos',nUrg(-99999,-1),'alerta')+
    c('d30','≤ 30 dias',nUrg(-99999,30))+
    c('d60','≤ 60 dias',nUrg(-99999,60))+
    c('d90','≤ 90 dias',nUrg(-99999,90));
  const d=(k,rot)=>`<button type="button" class="chip ${DOC===k?'on':''}" data-doc="${esc(k)}">${esc(rot)}</button>`;
  const nAtivos=filtrosAtivos();
  document.getElementById('chipsDoc').innerHTML=
    `<span class="rot">Vencimento</span>`+d('todos','Todos')+DATAS.map(x=>d(x,curto(x))).join('')+
    `<button type="button" class="chip ${SO_ATIVOS?'on':''}" id="chipAtivos">Só ativos</button>`+
    (ESPELHADAS.length?`<button type="button" class="chip ${VER_CADASTRO?'on':''}" id="chipCadastro" title="Colunas que vêm do Registro por fórmula — aqui são só leitura">Dados do cadastro</button>`:'')+
    (nAtivos?`<button type="button" class="chip limpar" id="limparFiltros" title="Volta para a visão sem filtro e sem busca">Limpar filtros<span class="n">${nAtivos}</span></button>`:'');
}
function redesenhar(){desenharChips();desenharResumo();desenharTabela();sincronizarURL();}
function aplicarBusca(){desenharChips();desenharTabela();sincronizarURL();}

/* ---------- busca e filtros no endereço (C.10) ----------
   F5 volta para a mesma visão; chave, cod e #hash ficam intactos.
   Senha nunca vai para cá — nem valor, nem coluna (não dá para ordenar por ela). */
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    set('q',TERMO);
    set('f',FILTRO==='todos'?'':FILTRO);
    set('doc',DOC==='todos'?'':DOC);
    set('ativos',SO_ATIVOS?'':'0');
    set('cad',VER_CADASTRO?'1':'');
    set('ord',SORT.key==='urgencia'?'':SORT.key);
    set('dir',SORT.dir==='asc'?'':SORT.dir);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  const f=(p.get('f')||'').trim().toLowerCase();
  FILTRO=FILTROS_OK.indexOf(f)>=0?f:'todos';   // o ?f= que o painel manda continua valendo
  DOC=(p.get('doc')||'todos').trim()||'todos';
  SO_ATIVOS=p.get('ativos')!=='0';
  VER_CADASTRO=p.get('cad')==='1';
  SORT={key:(p.get('ord')||'urgencia'),dir:p.get('dir')==='desc'?'desc':'asc'};
  TERMO=p.get('q')||'';
}
/* Depois que as colunas chegam, o que veio do endereço tem de existir de verdade. */
function validarURL(){
  if(DOC!=='todos'){
    const m=DATAS.filter(x=>normTxt(x)===normTxt(DOC))[0];
    DOC=m||'todos';
  }
  const k=SORT.key;
  const ok=k==='urgencia'||k==='id'||k==='nome_cliente'||(COLUNAS.indexOf(k)>=0&&!ehSigilosa(k));
  if(!ok)SORT.key='urgencia';
  if(!ESPELHADAS.length)VER_CADASTRO=false;
}

/* ---------------- salvar ---------------- */
const SUJOS=new Map();    // id (texto) -> {timer,campos:Set}
/* ---------- o que não gravou (C.3) ----------
   FALHAS = o servidor recusou e o dado só existe na tela. A linha e o campo ficam
   marcados, nasce um "tentar de novo" ali mesmo e fechar a aba pede confirmação. */
const FALHAS=new Map();   // id (texto) -> {campos:Set}
function temPendencia(){return SUJOS.size>0||FALHAS.size>0;}
function setSave(cl,txt){const el=document.getElementById('saveStatus');el.className='save-status '+(cl||'');el.textContent=txt||'';}
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function marcarFalha(id,falhou){
  const tr=document.querySelector('tr[data-id="'+CSS.escape(String(id))+'"]');
  if(!tr)return;
  tr.classList.toggle('falhou',!!falhou);
  const nome=tr.querySelector('td.col-nome');
  if(nome){
    const antigo=nome.querySelector('.btn-retry');
    if(falhou&&!antigo)nome.insertAdjacentHTML('beforeend',
      '<button type="button" class="btn-retry" data-retry="'+esc(String(id))+'">não salvou — tentar de novo</button>');
    if(!falhou&&antigo)antigo.remove();
  }
  const f=FALHAS.get(String(id));
  tr.querySelectorAll('[data-c]').forEach(el=>{
    el.classList.toggle('falhou',!!(falhou&&f&&f.campos.has(el.dataset.c)));
  });
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
window.addEventListener('beforeunload',e=>{if(temPendencia()){e.preventDefault();e.returnValue='';}});
function agendarSalvar(id,coluna,ms){
  const k=String(id);
  let s=SUJOS.get(k);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(k,s);}
  s.campos.add(coluna);
  clearTimeout(s.timer);
  s.timer=setTimeout(()=>salvar(k),ms==null?700:ms);
  setSave('saving','Salvando…');
}
/* Enter não espera o debounce: quem apertou já saiu da linha e precisa ver o
   "Salvo ✓" enquanto ainda lembra do que digitou. */
function salvarAgora(id,coluna){
  const k=String(id);
  let s=SUJOS.get(k);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(k,s);}
  s.campos.add(coluna);
  clearTimeout(s.timer);
  salvar(k);
}
async function salvar(id){
  const k=String(id);
  const s=SUJOS.get(k); if(!s) return;
  clearTimeout(s.timer);
  SUJOS.delete(k);
  const l=LINHAS.find(x=>String(x.id)===k); if(!l) return;
  const campos={}; s.campos.forEach(c=>campos[c]=l.valores[c]==null?'':l.valores[c]);
  try{
    setSave('saving','Salvando…');
    const r=await postAcao({acao:'cert_salvar',id:l.id,campos,
      cliente:l.nome_cliente||'',cod:respAtual()});
    // avisa baixinho se o backend recusou alguma coluna (espelho do Registro)
    const ign=(r&&r.ignoradas)||[];
    FALHAS.delete(k); marcarFalha(k,false);
    setSave('ok','Salvo ✓ '+horaAgora()+(ign.length?' · '+ign.length+' campo(s) só de leitura':''));
    desenharResumo();desenharChips();
  }catch(e){
    FALHAS.set(k,{campos:s.campos});
    marcarFalha(k,true);
    setSave('err','Não salvou: '+(e.message||e));
  }
}
function tentarDeNovo(id){
  const k=String(id), f=FALHAS.get(k); if(!f) return;
  FALHAS.delete(k); marcarFalha(k,false);
  let s=SUJOS.get(k);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(k,s);}
  f.campos.forEach(c=>s.campos.add(c));
  clearTimeout(s.timer);
  salvar(k);
}

/* ---------------- eventos ---------------- */
function linhaDo(el){
  const tr=el.closest('tr[data-id]'); if(!tr) return null;
  return LINHAS.find(x=>String(x.id)===tr.dataset.id)||null;
}
/* enquanto se digita num link, o atalho ↗ acende ou apaga na hora */
document.addEventListener('input',e=>{
  const el=e.target;
  if(!el.dataset||!el.dataset.link) return;
  const cx=el.closest('.lk-cel'); if(!cx) return;
  const antigo=cx.querySelector('.lk-ir'); if(!antigo) return;
  antigo.outerHTML=atalhoAbrir(el.value);
});
/* Passa o que está no campo para a linha em memória e reacerta a etiqueta de prazo
   ao lado. É o mesmo caminho para quem sai do campo e para quem dá Enter. */
function aplicarCampo(el){
  if(!el||!el.dataset||!el.dataset.c) return null;
  const l=linhaDo(el); if(!l) return null;
  const c=el.dataset.c;
  l.valores[c]=el.value;
  esquecerBusca(l);
  const cx=el.closest('.dt');
  if(cx){const st=estado(l.valores[c]);cx.className='dt '+st.cl;
    const tag=cx.querySelector('.tag-d');if(tag){tag.className='tag-d '+st.cl;tag.textContent=st.txt;}}
  return {l:l,c:c};
}
document.addEventListener('change',e=>{
  const r=aplicarCampo(e.target); if(!r) return;
  // sair do campo depois do Enter dispara change com o mesmo valor: não grava duas vezes
  if(e.target._jaGravado===e.target.value){e.target._jaGravado=null;return;}
  agendarSalvar(r.l.id,r.c);
});
document.addEventListener('click',async e=>{
  const rt=e.target.closest('.btn-retry[data-retry]');
  if(rt){rt.disabled=true;tentarDeNovo(rt.dataset.retry);return;}
  const md=e.target.closest('.modo[data-modo]');
  if(md){
    const l=linhaDo(md); if(!l) return;
    const c=md.dataset.modo, atual=String(l.valores[c]||'').trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(atual)) return;      // nunca mexe numa data preenchida
    l.valores[c]=(md.dataset.para==='texto')?'N/A':'';
    esquecerBusca(l);
    md.closest('td').innerHTML=celData(l,c);
    agendarSalvar(l.id,c,120);
    return;
  }
  const ver=e.target.closest('button[data-ver]');
  if(ver){
    const l=linhaDo(ver); if(!l) return;
    const c=ver.dataset.ver, k=l.id+'|'+c;
    if(REVELADAS.has(k)) REVELADAS.delete(k); else REVELADAS.add(k);
    ver.closest('td').innerHTML=celSigilosa(l,c);
    return;
  }
  const cp=e.target.closest('button[data-copiar]');
  if(cp){
    const l=linhaDo(cp); if(!l) return;
    const txt=String(l.valores[cp.dataset.copiar]||'');
    try{ await navigator.clipboard.writeText(txt); }
    catch(err){ const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();
      try{document.execCommand('copy');}catch(e2){} t.remove(); }
    const antes=cp.textContent; cp.textContent='✓'; setTimeout(()=>{cp.textContent=antes;},1200);
    return;
  }
  if(e.target.closest('#limparFiltros')){limparFiltros();return;}
  const chip=e.target.closest('.chip[data-f]');
  if(chip){FILTRO=chip.dataset.f;redesenhar();return;}
  const cd=e.target.closest('.chip[data-doc]');
  if(cd){DOC=cd.dataset.doc;redesenhar();return;}
  if(e.target.closest('#chipAtivos')){SO_ATIVOS=!SO_ATIVOS;redesenhar();return;}
  if(e.target.closest('#chipCadastro')){VER_CADASTRO=!VER_CADASTRO;redesenhar();return;}
  const th=e.target.closest('th[data-sort]');
  if(th){const k=th.dataset.sort;
    if(SORT.key===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.key=k;SORT.dir='asc';}
    desenharTabela();sincronizarURL();return;}
  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto);return;}
});
/* ---------- Enter grava e desce (C.14) ----------
   Esta tela é digitação em massa, uma coluna inteira de cada vez: Enter fecha a
   linha e cai na MESMA coluna da linha seguinte; Shift+Enter volta. Na última
   linha grava e fica onde está — dar a volta faria a pessoa reescrever a primeira
   linha sem perceber. */
/* Linha vizinha que dá para editar. O filtro tira a linha da grade, mas se ela
   estiver só escondida a gente pula do mesmo jeito: quem filtrou não quer o
   cursor caindo justamente no que mandou sumir. */
function linhaVizinha(tr,passo){
  let p=tr;
  for(;;){
    p=passo>0?p.nextElementSibling:p.previousElementSibling;
    if(!p) return null;
    if(!p.dataset||!p.dataset.id) continue;      // a linha do "Nada com esse filtro"
    if(!p.getClientRects().length) continue;     // escondida
    return p;
  }
}
/* Campo da mesma coluna na linha de destino. Coluna espelhada/só leitura não tem
   campo nenhum (é um <div class="ro">), então o Enter segue para a próxima
   editável em vez de largar o foco no nada. */
function campoDestino(tr,coluna){
  const ok=el=>!!el&&!el.disabled&&!el.readOnly;
  const igual=tr.querySelector('[data-c="'+CSS.escape(coluna)+'"]');
  if(ok(igual)) return igual;
  const cols=gradeCols();
  for(let j=cols.indexOf(coluna)+1;j<cols.length;j++){
    const el=tr.querySelector('[data-c="'+CSS.escape(cols[j])+'"]');
    if(ok(el)) return el;
  }
  return null;
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.ctrlKey||e.metaKey||e.altKey) return;
  const el=e.target;
  if(!el.dataset||!el.dataset.c||el.tagName==='TEXTAREA') return;
  const tr=el.closest('tr[data-id]'); if(!tr) return;
  e.preventDefault();
  const r=aplicarCampo(el);
  if(r){ el._jaGravado=el.value; salvarAgora(r.l.id,r.c); }
  const prox=linhaVizinha(tr,e.shiftKey?-1:1);
  if(!prox) return;
  const alvo=campoDestino(prox,el.dataset.c);
  // campo de data não aceita select() — por isso a tentativa é protegida
  if(alvo){alvo.focus();try{if(alvo.select)alvo.select();}catch(_){}}
});
/* Atalhos de busca (C.4): "/" foca, Esc limpa — e não atrapalham quem já está
   digitando noutro campo da grade. */
document.addEventListener('keydown',e=>{
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';TERMO='';aplicarBusca();}
});
function irPara(id){
  const achar=()=>document.querySelector(`tr[data-id="${CSS.escape(String(id))}"]`);
  if(!achar()){
    FILTRO='todos';TERMO=String(id);
    const b=document.getElementById('busca');if(b)b.value=TERMO;
    redesenhar();
  }
  const tr=achar(); if(!tr) return;
  tr.scrollIntoView({block:'center',behavior:'smooth'});
  tr.classList.add('destaque'); setTimeout(()=>tr.classList.remove('destaque'),3500);
}

/* ---------------- carregar ---------------- */
function layout(){
  return `<div class="topo">
    <div class="linha-filtros"><div class="grupo" id="chipsSit"></div></div>
    <div class="linha-filtros">
      <div class="grupo" id="chipsDoc"></div>
      <input class="busca" id="busca" type="search" autocomplete="off" placeholder="Buscar por ID, cliente, CNPJ (com ou sem pontos), responsável, login…  ( / para focar)">
    </div>
  </div>
  <details class="ajuda" id="ajuda">
    <summary>ⓘ Como funciona esta tela</summary>
    <div class="txt">Editar aqui grava direto na planilha${META.aba?' (aba <b>'+esc(META.aba)+'</b>)':''}. O atalho <b>texto</b> troca o campo de data por texto livre (“Não localizado”, “Em constituição”…) e só aparece em campo vazio — data preenchida não tem botão ao lado, para ninguém apagar sem querer. Coluna de endereço tem o atalho <b>↗</b> ao lado, que abre o documento em outra guia quando o campo é mesmo um link.<br>As senhas ficam escondidas, com botão de mostrar e de copiar, e <b>nunca</b> entram na busca nem no endereço desta página. A lista de clientes e os dados de cadastro vêm do <b>Registro</b> por fórmula — por isso não dá para editá-los aqui nem incluir cliente novo; faça isso em <a href="registro.html?chave=${encodeURIComponent(chaveAtual())}">Registros de clientes</a>.<br>Na grade, a faixa escura acima dos cabeçalhos junta as colunas por <b>assunto</b> (o mesmo documento, o mesmo portal), para não se perder na rolagem lateral. A busca acha CNPJ com ou sem pontuação, <b>/</b> pula para ela e <b>Esc</b> limpa.</div>
  </details>
  <div class="resumo" id="resumo"></div>
  <div class="tabela-wrap"><table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table></div>`;
}
async function carregar(){
  try{
    const d=await jsonp(API_URL+'?tipo=certificados_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro) throw new Error(d.erro);
    COLUNAS=d.colunas||[]; ESPELHADAS=d.espelhadas||[]; EDITAVEIS=d.editaveis||[];
    SIGILOSAS=d.sigilosas||[]; DATAS=d.datas||[]; LINKS=d.links||[];
    LINHAS=(d.linhas||[]).map(l=>Object.assign({valores:{},nome_cliente:'',ativo:''},l));
    LINHAS.forEach(l=>COLUNAS.forEach(c=>{if(l.valores[c]==null)l.valores[c]='';}));
    META=d;
    validarURL();                                  // a visão vem do endereço (C.10)
    document.getElementById('app').innerHTML=layout();
    ligarDetalhes(document.getElementById('ajuda'),'b4u.certificados.ajuda');
    if(d.planilha_url) document.getElementById('plan').href=d.planilha_url;
    const b=document.getElementById('busca');
    b.value=TERMO;
    b.addEventListener('input',e=>{TERMO=e.target.value;aplicarBusca();});
    redesenhar();
  }catch(e){
    const msg=String(e.message||e);
    const xlsx=/\.xlsx|Excel|Planilhas Google/i.test(msg);
    document.getElementById('app').innerHTML=`<div class="state"><h1>Não consegui carregar</h1>
      <p>${esc(msg)}</p>
      ${xlsx?`<ol>
        <li>Abra os <b>Certificados e Acessos</b> no Drive.</li>
        <li><b>Arquivo → Salvar como Planilhas Google</b>.</li>
        <li>Copie o link do arquivo NOVO.</li>
        <li>Cole na aba <code>Config</code> da planilha <b>Links App Script</b>, linha <code>Certificados e Acessos</code>.</li>
        <li>Rode <code>limparCacheConfig()</code> no Apps Script e recarregue esta página.</li>
      </ol>`:`<p>Se falar em chave faltando, confira a linha <code>Certificados e Acessos</code> na aba <code>Config</code> da planilha <b>Links App Script</b> e rode <code>limparCacheConfig()</code>.</p>`}
    </div>`;
  }
}
document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());
lerURL();
carregar();
