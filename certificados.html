<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Certificados e acessos — agora em Documentos e acessos</title>
<!--
  ESTA PÁGINA NÃO EXISTE MAIS. Ela virou uma seção de documentos.html.

  POR QUE UM REDIRECIONAMENTO, E NÃO UM ARQUIVO APAGADO
  "Certificados e acessos" foi um endereço da equipe por meses. Está em favorito,
  em link colado no WhatsApp, no histórico do navegador de todo mundo e no rodapé
  de dossiê de cliente antigo. Apagar o arquivo transformaria cada um desses em
  um 404 — e um 404 não explica nada: quem clicasse concluiria que o painel caiu,
  e ligaria para perguntar. Isto aqui responde a pergunta antes de ela existir.

  A CHAVE E O CÓDIGO VÃO JUNTO. Sem repassar a query string, o redirecionamento
  levaria a pessoa para uma tela de "acesso restrito" — o que, do lado de quem
  usa, é indistinguível de estar quebrado. Todo parâmetro segue, inclusive o
  ?abrir=ID que o dossiê usa para chegar com a ficha já aberta.

  `location.replace` e não `href`: assim este endereço não entra no histórico e
  o botão Voltar do navegador leva de onde a pessoa veio, e não de volta para cá
  num laço.

  QUANDO APAGAR DE VERDADE: quando ninguém mais chegar por aqui. Enquanto houver
  dúvida, custa 20 linhas manter.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       color:#3d3a34;background:#F7F3EC;padding:24px;text-align:center}
  a{color:#1F6F6B;font-weight:700}
</style>
</head>
<body>
  <p>"Certificados e acessos" agora faz parte de <strong>Documentos e acessos</strong>.<br>
     Levando você para lá… <a id="ir" href="documentos">abrir agora</a></p>
<script>
(function(){
  var destino = 'documentos' + location.search + location.hash;
  var ir = document.getElementById('ir');
  if (ir) ir.href = destino;
  location.replace(destino);
})();
</script>
</body>
</html>
