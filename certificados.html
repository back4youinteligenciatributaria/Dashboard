    repintarCel(l,c);
    const campo=document.querySelector('.corpo[data-id="'+CSS.escape(String(l.id))+'"] [data-c="'+CSS.escape(c)+'"]');
    if(campo&&ABERTAS.has(k)) campo.focus();
    return;
  }
  const md=e.target.closest('.modo[data-modo]');
  if(md){
    const l=linhaDo(md); if(!l) return;
    const c=md.dataset.modo, atual=String(l.valores[c]||'').trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(atual)) return;      // nunca mexe numa data preenchida
    l.valores[c]=(md.dataset.para==='texto')?'N/A':'';
    esquecerBusca(l);
    const fld=md.closest('.fld'); if(fld){const dt=fld.querySelector('.dt'); if(dt)dt.outerHTML=celData(l,c);}
    agendarSalvar(l.id,c,120);
    return;
  }
  const ver=e.target.closest('button[data-ver]');
  if(ver){
    const l=linhaDo(ver); if(!l) return;
    const c=ver.dataset.ver, k=l.id+'|'+c;
    if(REVELADAS.has(k)) REVELADAS.delete(k); else REVELADAS.add(k);
    const sig=ver.closest('.sig'); if(sig)sig.outerHTML=celSigilosa(l,c);
    return;
  }
  const cp=e.target.closest('button[data-copiar]');
  if(cp){
    const l=linhaDo(cp); if(!l) return;
    const txt=String(l.valores[cp.dataset.copiar]||'');
    try{ await navigator.clipboard.writeText(txt); }
    catch(err){ const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();
      try{document.execCommand('copy');}catch(e2){} t.remove(); }
    const antes=cp.textContent; cp.textContent='✓'; setTimeout(()=>{cp.textContent=antes;},1200);
    return;
  }
  /* Salvar agora. Fechar, × e clique no véu não estão aqui: quem cuida deles é a
     casca do b4u-modal.js, que precisa passar pelo aviso de "tem coisa por
     gravar" antes de deixar sair. */
  if(e.target.closest('#cadSalvar')){salvarAgoraCad();return;}
  if(e.target.closest('#btn-limpar')){limparFiltros();return;}
  /* Os dois botões de dois estados da régua. Vêm antes da linha da lista: ela
     é o último `closest` do handler e engoliria qualquer clique que sobrasse. */
  if(e.target.closest('#f-pend')){SO_PEND=!SO_PEND;TETO=PASSO;redesenhar();return;}
  if(e.target.closest('#f-cad')){VER_CADASTRO=!VER_CADASTRO;redesenhar();return;}
  if(e.target.closest('.btn-mais')){TETO+=PASSO;desenharLista();return;}
  if(e.target.closest('.btn-todos')){TETO=LINHAS.length;desenharLista();return;}
  /* Ordenar: um clique no título ordena A→Z, o mesmo título de novo inverte para
     Z→A. Não volta o teto ao início — a lista é a mesma, só noutra ordem, e
     recolher o que a pessoa já mandou mostrar seria castigo por ordenar.
     Filtro e busca continuam de pé: quem ordena é o visiveis(), sempre sobre o
     que sobrou dos dois, nunca sobre a lista crua. */
  const ord=e.target.closest('[data-sort]');
  if(ord){const k=ord.dataset.sort;
    /* O redesenho apaga o botão que acabou de ser apertado, e com ele o foco.
       Devolver o foco ao botão equivalente é o que deixa ordenar A→Z e depois
       Z→A pelo TECLADO: sem isto o segundo Enter caía no vazio, e o cabeçalho —
       que agora é o único caminho para ordenar — só servia para o mouse. */
    const tinhaFoco=document.activeElement===ord;
    if(SORT.key===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.key=k;SORT.dir='asc';}
    desenharLista();sincronizarURL();
    if(tinhaFoco){const n=document.querySelector('.lista-cab button[data-sort=\"'+CSS.escape(k)+'\"]');
      if(n)n.focus();}
    return;}
  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto);return;}
  /* A linha da lista é o gesto de abrir a ficha. Vem por último: qualquer botão
     de dentro da ficha já saiu acima, e a lista não tem mais nada clicável
     dentro dela. */
  const head=e.target.closest('.cli-head');
  if(head){const no=head.closest('.cli');if(no)abrirFicha(no.dataset.id);return;}
});
/* Um seletor de arquivo só, reaproveitado por todas as células. */
(function(){
  const inp=document.createElement('input');
  inp.type='file'; inp.id='doc-file'; inp.hidden=true;
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0], alvo=DOC_ALVO;
    inp.value=''; DOC_ALVO=null;
    if(!f||!alvo) return;
    const l=LINHAS.find(x=>String(x.id)===String(alvo.id));
    if(l) enviarDocumento(l,alvo.coluna,f);
  });
  document.body.appendChild(inp);
})();
/* ---------- Enter grava na hora (C.14) ----------
   Enter continua sendo "gravei, pode sair": mata o debounce e manda na hora, com
   a ficha ainda aberta. O que ele NÃO faz mais é descer para a mesma coluna do
   cliente seguinte — aquilo era digitação em massa direto na grade, e a grade
   acabou: agora cada cliente é uma ficha, e a de baixo nem está na tela. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.ctrlKey||e.metaKey||e.altKey) return;
  const el=e.target;
  if(!el.dataset||!el.dataset.c||el.tagName==='TEXTAREA') return;
  e.preventDefault();
  const r=aplicarCampo(el);
  if(r){ el._jaGravado=el.value; salvarAgora(r.l.id,r.c); }
});
/* Atalhos (C.4): Esc fecha a ficha antes de tudo; depois "/" foca a busca e Esc
   limpa — e nenhum deles atrapalha quem já está digitando num campo. A linha da
   lista é um role="button": sem o Enter e o Espaço daqui, a tela ficaria só para
   o mouse. */
/* Esc com a ficha aberta NÃO chega aqui: a casca do b4u-modal.js escuta na
   captura, fecha o modal de cima da pilha e corta a propagação — senão o mesmo
   Esc que fecha a ficha limparia também a busca da lista por baixo. */
document.addEventListener('keydown',e=>{
  const linha=e.target&&e.target.closest&&e.target.closest('.cli-head');
  if(linha&&(e.key==='Enter'||e.key===' '||e.key==='Spacebar')){
    e.preventDefault();
    const no=linha.closest('.cli');if(no)abrirFicha(no.dataset.id);
    return;
  }
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';TERMO='';aplicarBusca();}
});
/* Dos cartões de resumo para a linha: acha, destaca e abre a ficha — que é o que
   quem clicou num vencimento veio fazer. */
/* ---------- ?abrir=ID: chegar com a ficha já aberta ----------
   O dossiê da pesquisa rápida manda para cá em guia nova quando o colaborador
   clica em "Alterar". Sem isto ele cairia na lista e teria de procurar de novo o
   cliente que já estava na tela — que é exatamente o passo que o botão existe
   para poupar.

   Só na PRIMEIRA carga, e o parâmetro sai do endereço assim que é usado. Se
   ficasse, um F5 reabriria a ficha por cima do que a pessoa estivesse fazendo, e
   o endereço que ela copiasse da barra levaria o colega para dentro de uma ficha
   que ele não pediu.

   Quem faz o trabalho é o irPara(), o MESMO dos cartões de resumo: ele limpa o
   filtro se o cliente estiver escondido, sobe o teto da lista se ele estiver
   além dele, rola até a linha e abre. Reaproveitar em vez de reimplementar é o
   que garante que o link funcione mesmo quando a tela abriu filtrada. */
let JA_ABRIU_PELO_ENDERECO=false;
function abrirPeloEndereco(){
  if(JA_ABRIU_PELO_ENDERECO) return;
  JA_ABRIU_PELO_ENDERECO=true;
  const alvo=(new URLSearchParams(location.search).get('abrir')||'').trim();
  if(!alvo) return;
  try{ const u=new URL(location.href); u.searchParams.delete('abrir');
       history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(e){}
  irPara(alvo);
}
function irPara(id){
  const alvo=String(id);
  const achar=()=>document.querySelector('.cli[data-id="'+CSS.escape(alvo)+'"]');
  if(!achar()){
    if(!visiveis().some(l=>String(l.id)===alvo)){
      /* Nenhum filtro pode esconder a linha para onde estamos indo: o vencimento
         volta a ser todos, a pendência desliga e os inativos entram — cliente
         inativo era o caso que o "só ativos" segurava calado, e o link do painel
         chegava numa lista que não tinha ninguém. */
      F_SIT=SIT_TODOS();SO_PEND=false;F_ATIVO=ATIVO_ITENS.map(i=>i.v);sincronizarCaixas();
      TERMO=alvo;TETO=PASSO;
      const b=document.getElementById('busca');if(b)b.value=TERMO;
    }
    /* O teto não pode esconder justamente a linha para onde estamos indo. */
    const pos=visiveis().findIndex(l=>String(l.id)===alvo);
    if(pos>=TETO)TETO=Math.ceil((pos+1)/PASSO)*PASSO;
    redesenhar();
  }
  const no=achar(); if(!no) return;
  no.scrollIntoView({block:'center',behavior:'smooth'});
  no.classList.add('flash'); setTimeout(()=>no.classList.remove('flash'),1800);
  abrirFicha(alvo);
}
/* ---------------- carregar ---------------- */
/* A ordem aqui é a da tela: primeiro o que responde (busca e contagem), depois o
   que refina (os chips e a ordenação, recolhidos), depois os exemplos, e só
   então a lista. Os chips e os cartões continuam existindo — deixaram de ser
   pedágio. */
function layout(){
  return `<div class="topo">
    <input class="busca campo-busca" id="busca" type="search" autocomplete="off" placeholder="Buscar por ID, cliente, CNPJ, responsável, login…  ( / para focar)">
    <span id="cx-ativos"></span>
    <span id="cx-venc"></span>
    <span id="cx-doc"></span>
    <button type="button" class="f-tog" id="f-pend" aria-pressed="false">Com pendências</button>
    <button type="button" class="f-tog mostra" id="f-cad" aria-pressed="false" hidden>Dados do cadastro</button>
    <button type="button" class="btn-limpar" id="btn-limpar" title="Volta para a visão sem filtro, sem busca e na ordem de vencimento">Limpar</button>
    <span class="resumo-lista" id="resumo-lista"></span>
  </div>
  <details class="ajuda situacao" id="det-situacao">
    <summary>Ver quem está em cada situação</summary>
    <div class="resumo" id="resumo"></div>
  </details>
  <div class="dica" id="dica"></div>
  <div class="lista" id="lista"></div>`;
}
async function carregar(){
  try{
    const d=await jsonp(API_URL+'?tipo=certificados_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro) throw new Error(d.erro);
    COLUNAS=d.colunas||[]; ESPELHADAS=d.espelhadas||[]; EDITAVEIS=d.editaveis||[];
    SIGILOSAS=d.sigilosas||[]; DATAS=d.datas||[]; LINKS=d.links||[];
    LINHAS=(d.linhas||[]).map(l=>Object.assign({valores:{},nome_cliente:'',ativo:''},l));
    LINHAS.forEach(l=>COLUNAS.forEach(c=>{if(l.valores[c]==null)l.valores[c]='';}));
    META=d;
    /* Quem está usando, para o botão da barra. ESTA ROTA AINDA NÃO MANDA O NOME:
       só `tipo=equipe` (colaborador) e `tipo=daily_equipe` trazem um `eu`, e o
       `?cod=` da URL é código de log, não nome — batizar o botão com ele seria
       inventar. Então o botão fica com o rótulo genérico "Minha conta" e o painel
       diz, sem rodeio, que não identificou quem está usando; o seletor de
       aparência, que é o motivo de o botão existir, funciona igual.
       A leitura de `d.eu` já está escrita: no dia em que `certificados_equipe` passar a
       devolver `eu:{nome}` — o servidor já resolve o colaborador pela chave, em
       `exigirEquipe_` — o nome aparece aqui sem tocar nesta tela. */
    if(window.B4UShell) B4UShell.usuario({nome:(d.eu&&d.eu.nome)||''});
    validarURL();                                  // a visão vem do endereço (C.10)
    mapearColunasLinha();                          // quais colunas a lista mostra
    document.getElementById('app').innerHTML=layout();
    montarFiltros();            // as três caixas de seleção entram na régua
    if(d.planilha_url) document.getElementById('plan').href=d.planilha_url;
    const b=document.getElementById('busca');
    b.value=TERMO;
    b.addEventListener('input',e=>{TERMO=e.target.value;aplicarBusca();});
    redesenhar();
    /* A tabela já está pintada: a barra corre até 100% e o overlay sai revelando
       a tela pronta, sem somar espera de verdade. */
    abrirPeloEndereco();          // ?abrir=ID — ver o comentário na função
    if (window.B4UEspera) B4UEspera.concluir();
  }catch(e){
    /* Uma mensagem só, igual em todo o painel. Aqui saía o texto da exceção mais
       um passo a passo de manutenção (converter .xlsx, conferir a aba de
       configuração, limpar o cache do servidor) — receita para nós, escrita na
       tela de quem só queria ver os certificados. O roteiro continua existindo:
       ele agora fica com quem cuida do sistema, não com quem usa o painel. */
    if (window.B4UEspera) B4UEspera.telaErro(document.getElementById('app'));
    else document.getElementById('app').innerHTML =
      '<div class="state"><h1>Não conseguimos carregar as informações</h1>'
      + '<p>Houve um erro ao recuperar as informações. Tente novamente em alguns '
      + 'minutos. Se o problema continuar, entre em contato com o atendimento.</p></div>';
  }
}
document.getElementById('volta').href='colaborador?chave='+encodeURIComponent(chaveAtual());

/* ---------------- menu lateral ----------------
   Montado ANTES de carregar(): a identidade desta tela é a chave, que já está na
   URL desde a primeira linha deste script — não há o que esperar da API. E se a
   busca falhar, o erro pinta dentro do #app com o menu inteiro de pé, que é a
   mesma razão de o erro nunca ser pintado no <body>.
   Sem `contexto`: esta página não sabe o NOME de quem está usando (o `cod` é
   código de log, não nome), e um rótulo inventado seria pior que bloco nenhum.
   Os links levam só a chave, como o logo e o "← Painel" já levavam aqui. */
if (window.B4UShell) {
  B4UShell.montar({
    perfil: 'equipe',
    ativo: 'certificados',
    link: function (pag) { return pag + '?chave=' + encodeURIComponent(chaveAtual()); }
  });

  /* O botão de quem está usando (e, com ele, o seletor de aparência) nasce junto
     do menu lateral, com rótulo genérico. O nome entra depois, quando a API
     responder — ver a chamada de `usuario({nome})` no carregar(). */
  B4UShell.usuario();
  /* Esta página tem <base target="_blank">, para o colaborador nunca perder a
     tela em que estava ao abrir um documento. O menu lateral segue a MESMA
     regra: o dono decidiu que tudo abre em guia nova, sem exceção, e o próprio
     B4UShell já marca os links do menu com target="_blank" rel="noopener".
     As duas exceções continuam sendo o logo (#logo-home) e o "← Painel"
     (#volta), escritos à mão com target="_self": eles são o gesto de VOLTAR. */
}

lerURL();
carregar();
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador') {
        try { href = 'colaborador?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
