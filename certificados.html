<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Guia nova por padrão: link clicado não tira o colaborador de onde ele estava. -->
<base target="_blank">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificados e procurações (equipe) — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F1E7DC;--surface:#FFFFFF;--surface-warm:#FBF6EF;
  --ink:#113D39;--ink-2:#3F5854;--muted:#8A7D70;--line:#E4D9C9;--line-2:#D6C3AC;
  --brand-dark:#073034;--brand-teal:#0F8C85;--brand-euc:#3FA680;
  --amber:#E8892E;--amber-soft:#FCEFE0;--vermelho:#C0392B;--verde:#2E9D5F;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:900;font-size:17px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:20px}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd}
.barra a.volta,.barra a.plan{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600}
.barra a.plan{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 11px}
.save-status{font-size:12.5px;font-weight:800;padding:6px 13px;border-radius:20px;background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
.save-status.saving{background:var(--amber);color:#fff}.save-status.ok{background:var(--verde);color:#fff}.save-status.err{background:var(--vermelho);color:#fff}

.topo{padding:12px 16px 6px}
.linha-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.grupo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grupo .rot{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--brand-teal)}
.chip.on{background:var(--brand-teal);border-color:var(--brand-teal);color:#fff}
.chip .n{background:rgba(0,0,0,.10);border-radius:999px;padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.chip.alerta.on{background:var(--vermelho);border-color:var(--vermelho)}
.chip.falta.on{background:var(--amber);border-color:var(--amber)}
.busca{flex:1;min-width:220px;font-family:var(--sans);font-size:14px;padding:10px 15px;border-radius:24px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.dica{font-size:11.5px;color:var(--muted);padding:0 16px 8px}

.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:0 16px 12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.rhead{padding:9px 13px;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff}
.rcard.vencidos .rhead{background:var(--vermelho)}
.rcard.d30 .rhead{background:var(--amber)}
.rcard.d60 .rhead{background:var(--brand-teal)}
.rcard.falta .rhead{background:#6B8486}
.rhead .n{background:rgba(255,255,255,.25);border-radius:999px;padding:2px 9px;font-size:11.5px}
.rlista{max-height:150px;overflow:auto;padding:5px}
.tk{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px}
.tk:hover{background:var(--surface-warm)}
.tk .d{font-weight:800;white-space:nowrap;color:var(--ink)}
.tk .lb{color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .tp{font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap}
.rvazio{color:var(--muted);font-size:12px;padding:9px}

.tabela-wrap{overflow:auto;max-height:calc(100vh - 150px);border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
thead th{position:sticky;top:0;z-index:20;background:var(--brand-dark);color:#fff;font-weight:700;text-align:left;
  padding:9px 10px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.08);font-size:11.5px;cursor:pointer;user-select:none}
thead th:hover{background:#0a4247}
thead th .ord{opacity:.55;font-size:10px;margin-left:4px}
tbody td{padding:4px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;background:var(--surface)}
tbody tr:nth-child(even) td{background:var(--surface-warm)}
th.col-id,td.col-id{position:sticky;left:0;width:76px;min-width:76px;max-width:76px}
th.col-nome,td.col-nome{position:sticky;left:76px;min-width:200px;max-width:220px}
thead th.col-id,thead th.col-nome{z-index:26}
td.col-id,td.col-nome{z-index:15}
td.col-id{background:var(--surface);font-weight:800;color:var(--brand-teal);padding:7px 9px;white-space:nowrap;box-shadow:1px 0 0 var(--line)}
td.col-nome{background:var(--surface);font-weight:700;font-size:12px;line-height:1.25;padding:7px 9px;white-space:normal;box-shadow:2px 0 6px rgba(7,48,52,.07)}
tbody tr:nth-child(even) td.col-id,tbody tr:nth-child(even) td.col-nome{background:var(--surface-warm)}
td.col-nome .flag{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:800;letter-spacing:.3px;border-radius:999px;padding:2px 8px}
td.col-nome .flag.nova{background:var(--amber-soft);color:#8a5117;border:1px solid #F0D6B4}
td.col-nome .flag.orfa{background:#F3E3E1;color:#8B2E22;border:1px solid #E0BDB8}
td.col-nome .flag.inativo{background:#EEE9E2;color:var(--muted);border:1px solid var(--line)}
tr.destaque>td{background:#FFF3B0!important;transition:background .4s ease}

input[type=text],input[type=date],textarea{font-family:var(--sans);font-size:12.5px;padding:6px 8px;border:1px solid var(--line-2);
  border-radius:7px;background:var(--surface);color:var(--ink);width:100%}
input:focus,textarea:focus{outline:2px solid var(--brand-teal);outline-offset:0}
textarea{resize:vertical;min-height:34px;line-height:1.35}
.dt{display:flex;align-items:center;gap:4px;min-width:172px}
.dt input{flex:1;min-width:104px}
.dt a.modo{flex:none;font-size:10px;font-weight:800;letter-spacing:.2px;cursor:pointer;text-decoration:none;
  color:var(--muted);border:1px dashed var(--line-2);border-radius:6px;padding:4px 6px;white-space:nowrap}
.dt a.modo:hover{border-style:solid;border-color:var(--brand-teal);color:var(--brand-teal)}
.tag-d{flex:none;font-size:10px;font-weight:800;border-radius:999px;padding:3px 7px;white-space:nowrap;min-width:44px;text-align:center}
.tag-d.vazio{background:var(--amber-soft);color:#8a5117}
.tag-d.na{background:#EEE9E2;color:var(--muted)}
.tag-d.venc{background:#F7DFDC;color:var(--vermelho)}
.tag-d.d30{background:#FCEFE0;color:#8a5117}
.tag-d.d60{background:#E1F0EE;color:#0b6c66}
.tag-d.d90,.tag-d.ok{background:#E6F3EC;color:#1f6b45}
.dt.venc input[type=date]{border-color:var(--vermelho)}
.dt.d30 input[type=date]{border-color:var(--amber)}

.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:50vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:14px;max-width:52ch}
.state code{background:var(--surface-warm);padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:720px){.resumo{grid-template-columns:1fr}.barra .tag,.barra .cnt{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}
</style>
</head>
<body>
<div class="barra">
  <a class="logo" id="logo-home" href="colaborador.html" target="_self" title="Voltar para o painel do colaborador">back<span class="y">4you</span></a>
  <span class="tag">🔐 Certificados e procurações</span>
  <span class="spacer"></span>
  <span class="save-status" id="saveStatus"></span>
  <span class="cnt" id="cnt"></span>
  <a class="plan" id="plan" href="#" target="_blank" rel="noopener">Planilha ↗</a>
  <a class="volta" id="volta" href="colaborador.html" target="_self">← Painel</a>
</div>
<div id="app"><div class="state"><div class="spin"></div><p>Carregando certificados…</p></div></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbyGAro0qPWpZcVX665KwKd-BK3ouSvVkAj5Vxw_phgO82EDa3gJrURcHjWIPYNQXT5d/exec';
const CHAVE_PADRAO='b4u-equipe-2026';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}
// código do colaborador (vai no hash da URL, igual restituicao.html) — é o que aparece
// na coluna "Colaborador" da aba log. Sem hash, o log registra só "equipe".
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash
// (formato antigo dos atalhos por pessoa). Vira a coluna "Colaborador" da aba log.
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function jsonp(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},25000);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
async function postAcao(obj){const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});const d=await r.json();if(d&&d.erro)throw new Error(d.erro);return d;}

/* ---------------- estado ---------------- */
const DOCS=[
  {k:'venc_certificado',curto:'Certificado',label:'Venc. certificado'},
  {k:'venc_ecac',curto:'e-CAC',label:'Venc. procuração e-CAC'},
  {k:'venc_spe',curto:'SPE',label:'Venc. procuração SPE'}
];
let LINHAS=[], META={};
/* ?f=<filtro> na URL abre a página já filtrada (deep-link vindo do painel
   do colaborador). Só aceita os valores que o FILTRO realmente conhece —
   qualquer outra coisa cai em 'todos'. */
const FILTROS_OK=['todos','falta','vencidos','d30','d60','d90','semlinha'];
function filtroDaURL(){
  const f=(new URLSearchParams(location.search).get('f')||'').trim().toLowerCase();
  return FILTROS_OK.indexOf(f)>=0?f:'todos';
}
let FILTRO=filtroDaURL();    // todos | falta | vencidos | d30 | d60 | d90 | semlinha
let DOC='todos';             // todos | venc_certificado | venc_ecac | venc_spe
let SO_ATIVOS=true;
let SORT={key:'urgencia',dir:'asc'};
const hoje=new Date(); hoje.setHours(0,0,0,0);

/* ---------------- datas ---------------- */
function diasAte(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
  return Math.round((new Date(+m[1],+m[2]-1,+m[3])-hoje)/864e5);}
function fmtBR(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(iso||'');}
/* classe do valor: vazio (falta preencher) | na (N/A ou texto livre) | venc | d30 | d60 | d90 | ok */
function estado(v){
  const s=String(v==null?'':v).trim();
  if(!s) return {cl:'vazio',dias:null,txt:'falta'};
  const d=diasAte(s);
  if(d===null) return {cl:'na',dias:null,txt:s.length>6?s.slice(0,6)+'…':s};
  if(d<0)   return {cl:'venc',dias:d,txt:'vencido'};
  if(d<=30) return {cl:'d30',dias:d,txt:d+'d'};
  if(d<=60) return {cl:'d60',dias:d,txt:d+'d'};
  if(d<=90) return {cl:'d90',dias:d,txt:d+'d'};
  return {cl:'ok',dias:d,txt:fmtBR(s).slice(3)};
}
function ativoDe(l){const s=normTxt(l.ativo);if(!s)return null;
  if(/^(sim|s|true|verdadeiro|1|x|ativo)$/.test(s))return true;
  if(/^(nao|n|false|falso|0|-|inativo)$/.test(s))return false;return null;}

/* menor nº de dias entre os documentos considerados (null = nenhum com data) */
function docsDe(){return DOC==='todos'?DOC_KEYS:[DOC];}
const DOC_KEYS=DOCS.map(d=>d.k);
function urgencia(l,keys){
  let min=null;
  (keys||DOC_KEYS).forEach(k=>{const st=estado(l[k]);if(st.dias!=null&&(min===null||st.dias<min))min=st.dias;});
  return min;
}
function faltando(l){
  const f=[];
  DOCS.forEach(d=>{if(!String(l[d.k]||'').trim())f.push(d.curto);});
  if(!String(l.responsavel||'').trim())f.push('responsável');
  return f;
}

/* ---------------- filtros ---------------- */
function passaFiltro(l){
  if(SO_ATIVOS&&ativoDe(l)===false) return false;
  const keys=docsDe();
  if(FILTRO==='todos') return true;
  if(FILTRO==='semlinha') return !l.na_planilha;
  if(FILTRO==='falta'){
    if(DOC!=='todos') return !String(l[DOC]||'').trim();
    return faltando(l).length>0;
  }
  const u=urgencia(l,keys);
  if(u===null) return false;
  if(FILTRO==='vencidos') return u<0;
  if(FILTRO==='d30') return u<=30;
  if(FILTRO==='d60') return u<=60;
  if(FILTRO==='d90') return u<=90;
  return true;
}
function passaBusca(l,termo){
  if(!termo) return true;
  return normTxt([l.id,l.nome_cliente,l.nome,l.responsavel,l.obs].join(' ')).includes(termo);
}
function visiveis(){
  const termo=normTxt((document.getElementById('busca')||{}).value||'');
  let arr=LINHAS.filter(l=>passaFiltro(l)&&passaBusca(l,termo));
  const dir=SORT.dir==='asc'?1:-1;
  arr.sort((a,b)=>{
    if(SORT.key==='urgencia'){
      const ua=urgencia(a,docsDe()),ub=urgencia(b,docsDe());
      if(ua===null&&ub===null) return String(a.id).localeCompare(String(b.id),'pt',{numeric:true});
      if(ua===null) return 1; if(ub===null) return -1;      // sem data sempre no fim
      return (ua-ub)*dir;
    }
    if(SORT.key==='id') return String(a.id).localeCompare(String(b.id),'pt',{numeric:true})*dir;
    return normTxt(a[SORT.key]).localeCompare(normTxt(b[SORT.key]),'pt')*dir;
  });
  return arr;
}
function contar(fn){return LINHAS.filter(l=>(!SO_ATIVOS||ativoDe(l)!==false)&&fn(l)).length;}

/* ---------------- render ---------------- */
/* Uma data preenchida NÃO tem botão nenhum ao lado — assim nenhum clique
   distraído apaga o vencimento. O atalho de trocar data↔texto só aparece
   quando não há nada a perder: campo vazio, ou campo que já é texto. */
function celData(l,k){
  const v=String(l[k]||'').trim();
  const isISO=/^\d{4}-\d{2}-\d{2}$/.test(v);
  const livre=!!v&&!isISO;
  const st=estado(v);
  const atalho = isISO ? ''
    : (livre ? `<a class="modo" data-modo="${k}" data-para="data" title="Trocar por um campo de data">📅 data</a>`
             : `<a class="modo" data-modo="${k}" data-para="texto" title="Marcar como não se aplica">N/A</a>`);
  return `<div class="dt ${st.cl}">
    ${livre
      ? `<input type="text" data-k="${k}" value="${esc(v)}" placeholder="ex.: N/A">`
      : `<input type="date" data-k="${k}" value="${isISO?v:''}">`}
    ${atalho}
    <span class="tag-d ${st.cl}">${esc(st.txt)}</span>
  </div>`;
}
function linhaHTML(l){
  const at=ativoDe(l);
  const flags=[
    !l.na_planilha?'<span class="flag nova">sem linha</span>':'',
    l.orfa?'<span class="flag orfa">fora do Site Links</span>':'',
    at===false?'<span class="flag inativo">inativo</span>':''
  ].join(' ');
  return `<tr data-id="${esc(l.id)}">
    <td class="col-id">${esc(l.id)}</td>
    <td class="col-nome">${esc(l.nome_cliente||l.nome||'(sem nome)')}<br>${flags}</td>
    <td><input type="text" data-k="responsavel" value="${esc(l.responsavel||'')}" placeholder="quem assina"></td>
    <td>${celData(l,'venc_certificado')}</td>
    <td>${celData(l,'venc_ecac')}</td>
    <td>${celData(l,'venc_spe')}</td>
    <td style="min-width:230px"><textarea data-k="obs" rows="1" placeholder="só a equipe vê">${esc(l.obs||'')}</textarea></td>
  </tr>`;
}
function seta(k){return SORT.key===k?`<span class="ord">${SORT.dir==='asc'?'▲':'▼'}</span>`:'';}
function desenharTabela(){
  const arr=visiveis();
  document.getElementById('cnt').textContent=arr.length+' de '+LINHAS.length;
  const corpo=arr.length
    ? arr.map(linhaHTML).join('')
    : `<tr><td colspan="7" style="padding:26px;text-align:center;color:var(--muted)">Nada com esse filtro.</td></tr>`;
  document.getElementById('tbody').innerHTML=corpo;
  document.querySelectorAll('thead th[data-sort]').forEach(th=>{
    const k=th.dataset.sort;
    th.innerHTML=th.dataset.label+(SORT.key===k?`<span class="ord">${SORT.dir==='asc'?'▲':'▼'}</span>`:'');
  });
}
function itemResumo(l,k){
  const st=estado(l[k]);
  const doc=DOCS.find(d=>d.k===k);
  return `<div class="tk" data-goto="${esc(l.id)}">
    <span class="d">${st.cl==='vazio'?'—':(st.dias!=null&&st.dias<0?'vencido':fmtBR(l[k]))}</span>
    <span class="lb">${esc(l.nome_cliente||l.id)}</span>
    <span class="tp">${doc?doc.curto:''}</span></div>`;
}
function desenharResumo(){
  const keys=docsDe();
  const base=LINHAS.filter(l=>!SO_ATIVOS||ativoDe(l)!==false);
  const itens=(min,max)=>{
    const out=[];
    base.forEach(l=>keys.forEach(k=>{const st=estado(l[k]);
      if(st.dias!=null&&st.dias>=min&&st.dias<=max)out.push({l,k,d:st.dias});}));
    out.sort((a,b)=>a.d-b.d);
    return out;
  };
  const venc=itens(-99999,-1), d30=itens(0,30), d60=itens(31,60);
  const falta=base.filter(l=>DOC!=='todos'?!String(l[DOC]||'').trim():faltando(l).length>0);
  const card=(cls,titulo,lista,render)=>`<div class="rcard ${cls}">
      <div class="rhead"><span>${titulo}</span><span class="n">${lista.length}</span></div>
      <div class="rlista">${lista.length?lista.slice(0,60).map(render).join(''):'<div class="rvazio">Nada por aqui 🎉</div>'}</div></div>`;
  document.getElementById('resumo').innerHTML=
    card('vencidos','Vencidos',venc,x=>itemResumo(x.l,x.k))+
    card('d30','Vence em até 30 dias',d30,x=>itemResumo(x.l,x.k))+
    card('d60','Vence em 31–60 dias',d60,x=>itemResumo(x.l,x.k))+
    card('falta','Faltando dados',falta,l=>`<div class="tk" data-goto="${esc(l.id)}">
        <span class="d">${esc(l.id)}</span><span class="lb">${esc(l.nome_cliente||'')}</span>
        <span class="tp">${esc((DOC!=='todos'?[DOCS.find(d=>d.k===DOC).curto]:faltando(l)).join(' · '))}</span></div>`);
}
function desenharChips(){
  const keys=docsDe();
  const base=l=>(!SO_ATIVOS||ativoDe(l)!==false);
  const nUrg=(min,max)=>LINHAS.filter(l=>{if(!base(l))return false;const u=urgencia(l,keys);return u!==null&&u>=min&&u<=max;}).length;
  const nFalta=LINHAS.filter(l=>base(l)&&(DOC!=='todos'?!String(l[DOC]||'').trim():faltando(l).length>0)).length;
  const nSem=LINHAS.filter(l=>base(l)&&!l.na_planilha).length;
  const c=(k,rot,n,extra)=>`<button class="chip ${extra||''} ${FILTRO===k?'on':''}" data-f="${k}">${rot}${n!=null?`<span class="n">${n}</span>`:''}</button>`;
  document.getElementById('chipsSit').innerHTML=
    `<span class="rot">Situação</span>`+
    c('todos','Todos',LINHAS.filter(base).length)+
    c('falta','Faltando dados',nFalta,'falta')+
    c('vencidos','Vencidos',nUrg(-99999,-1),'alerta')+
    c('d30','≤ 30 dias',nUrg(-99999,30))+
    c('d60','≤ 60 dias',nUrg(-99999,60))+
    c('d90','≤ 90 dias',nUrg(-99999,90))+
    c('semlinha','Sem linha na planilha',nSem);
  const d=(k,rot)=>`<button class="chip ${DOC===k?'on':''}" data-doc="${k}">${rot}</button>`;
  document.getElementById('chipsDoc').innerHTML=
    `<span class="rot">Documento</span>`+d('todos','Todos')+DOCS.map(x=>d(x.k,x.curto)).join('')+
    `<button class="chip ${SO_ATIVOS?'on':''}" id="chipAtivos">Só ativos</button>`;
}
function redesenhar(){desenharChips();desenharResumo();desenharTabela();}

/* ---------------- salvar ---------------- */
const SUJOS=new Map();   // id -> {timer, campos:Set}
function setSave(cl,txt){const el=document.getElementById('saveStatus');el.className='save-status '+(cl||'');el.textContent=txt||'';}
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function agendarSalvar(id,campo,ms){
  let s=SUJOS.get(id);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(id,s);}
  s.campos.add(campo);
  clearTimeout(s.timer);
  s.timer=setTimeout(()=>salvar(id),ms==null?700:ms);
  setSave('saving','Salvando…');
}
async function salvar(id){
  const s=SUJOS.get(id); if(!s) return;
  SUJOS.delete(id);
  const l=LINHAS.find(x=>String(x.id)===String(id)); if(!l) return;
  const campos={}; s.campos.forEach(k=>campos[k]=l[k]==null?'':l[k]);
  try{
    setSave('saving','Salvando…');
    const r=await postAcao({acao:'cert_salvar',id:l.id,campos,
      cliente:l.nome_cliente||l.nome||'',cod:respAtual()});
    if(r&&r.criada){l.na_planilha=true;l.row=r.row;desenharChips();}
    setSave('ok',(r&&r.criada?'Linha criada ✓ ':'Salvo ✓ ')+horaAgora());
    desenharResumo();desenharChips();
  }catch(e){setSave('err','Não salvou: '+(e.message||e));}
}

/* ---------------- eventos ---------------- */
document.addEventListener('change',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.k) return;
  const tr=el.closest('tr[data-id]'); if(!tr) return;
  const l=LINHAS.find(x=>String(x.id)===tr.dataset.id); if(!l) return;
  const k=el.dataset.k;
  l[k]=el.value;
  const cel=el.closest('.dt');
  if(cel){const st=estado(l[k]);cel.className='dt '+st.cl;
    const tag=cel.querySelector('.tag-d');if(tag){tag.className='tag-d '+st.cl;tag.textContent=st.txt;}}
  agendarSalvar(l.id,k);
});
document.addEventListener('click',e=>{
  const md=e.target.closest('a.modo');
  if(md){
    const tr=md.closest('tr[data-id]'); const l=LINHAS.find(x=>String(x.id)===tr.dataset.id); if(!l) return;
    const k=md.dataset.modo, atual=String(l[k]||'').trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(atual)) return;      // nunca mexe numa data preenchida
    l[k]=(md.dataset.para==='texto')?'N/A':'';
    md.closest('td').innerHTML=celData(l,k);
    agendarSalvar(l.id,k,120);
    return;
  }
  const chip=e.target.closest('.chip[data-f]');
  if(chip){FILTRO=chip.dataset.f;redesenhar();return;}
  const cd=e.target.closest('.chip[data-doc]');
  if(cd){DOC=cd.dataset.doc;redesenhar();return;}
  if(e.target.closest('#chipAtivos')){SO_ATIVOS=!SO_ATIVOS;redesenhar();return;}
  const th=e.target.closest('th[data-sort]');
  if(th){const k=th.dataset.sort;
    if(SORT.key===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.key=k;SORT.dir='asc';}
    desenharTabela();return;}
  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto);return;}
});
document.addEventListener('input',e=>{
  if(e.target.tagName==='TEXTAREA'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';}
});
function irPara(id){
  const achar=()=>document.querySelector(`tr[data-id="${CSS.escape(String(id))}"]`);
  if(!achar()){FILTRO='todos';document.getElementById('busca').value=String(id);redesenhar();}
  const tr=achar(); if(!tr) return;
  tr.scrollIntoView({block:'center',behavior:'smooth'});
  tr.classList.add('destaque'); setTimeout(()=>tr.classList.remove('destaque'),3500);
}

/* ---------------- carregar ---------------- */
function layout(){
  return `<div class="topo">
    <div class="linha-filtros"><div class="grupo" id="chipsSit"></div></div>
    <div class="linha-filtros">
      <div class="grupo" id="chipsDoc"></div>
      <input class="busca" id="busca" type="search" placeholder="Buscar por ID, cliente, responsável ou observação…">
    </div>
  </div>
  <div class="dica">Editar aqui grava direto na planilha. <b>N/A</b> marca o que não se aplica (fica diferente de “falta preencher”) e só aparece em campo vazio — data preenchida não tem botão ao lado, para ninguém apagar sem querer. Cliente sem linha ganha uma assim que você preencher o primeiro campo.</div>
  <div class="resumo" id="resumo"></div>
  <div class="tabela-wrap"><table>
    <thead><tr>
      <th class="col-id" data-sort="id" data-label="ID">ID</th>
      <th class="col-nome" data-sort="nome_cliente" data-label="Cliente">Cliente</th>
      <th data-sort="responsavel" data-label="Responsável legal">Responsável legal</th>
      <th data-sort="urgencia" data-label="Venc. certificado">Venc. certificado</th>
      <th data-sort="urgencia" data-label="Venc. procuração e-CAC">Venc. procuração e-CAC</th>
      <th data-sort="urgencia" data-label="Venc. procuração SPE">Venc. procuração SPE</th>
      <th data-label="Observações internas">Observações internas</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>`;
}
async function carregar(){
  try{
    const d=await jsonp(API_URL+'?tipo=certificados_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro) throw new Error(d.erro);
    LINHAS=(d.linhas||[]).map(l=>Object.assign({responsavel:'',venc_certificado:'',venc_ecac:'',venc_spe:'',obs:'',nome:''},l));
    META=d;
    document.getElementById('app').innerHTML=layout();
    if(d.planilha_url) document.getElementById('plan').href=d.planilha_url;
    const q=new URLSearchParams(location.search).get('q');
    if(q) document.getElementById('busca').value=q;
    document.getElementById('busca').addEventListener('input',()=>desenharTabela());
    redesenhar();
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="state"><h1>Não consegui carregar</h1>
      <p>${esc(e.message||e)}</p>
      <p>Se falar em chave faltando, confira a linha <code>Certificados e Procurações</code> na aba <code>Config</code> da planilha <b>Links App Script</b> e rode <code>limparCacheConfig()</code> no Apps Script.</p></div>`;
  }
}
document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());
carregar();
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador.html') {
        try { href = 'colaborador.html?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador.html'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
