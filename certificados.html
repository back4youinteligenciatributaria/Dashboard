<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
/* A chave da equipe não é mais fixa: é o código do dia de cada colaborador
   (aba "Colaboradores" da planilha de Contatos), que chega por e-mail no
   index.html. Esta constante ficou vazia de propósito — se voltar a ter valor,
   volta a existir uma senha compartilhada que não expira e não diz quem é quem. */
const CHAVE_PADRAO = '';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}

/* Sem chave na URL não há painel da equipe. A porta é o index.html: a pessoa
   digita o e-mail, recebe o código do dia e volta para CÁ — é para isso que
   serve o `destino`, senão todo login despejaria a pessoa na home da equipe,
   longe do que ela tinha clicado.
   Até 04/08/2026 existia uma chave fixa antiga escrita aqui como padrão: quem
   abrisse a página sem chave nenhuma entrava assim mesmo, sem se identificar.
   A string não se repete neste arquivo de propósito — ele é servido ao
   navegador, e comentário vaza igual a código. */
if (!chaveAtual()) {
  location.replace('index.html?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash.
// Vira a coluna "Colaborador" da aba log.
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;
  try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* ---------- busca que entende CNPJ com e sem pontuação (C.1) ---------- */
function soDigitos(s){return b4uDigitos(s);}
/** Compara o texto normalizado e, quando o termo tem 6 dígitos ou mais, também
 *  só os dígitos dos dois lados. */
function casaBusca(alvoTxt,alvoDig,termo){
  const t=normTxt(termo);
  if(!t)return true;
  if(alvoTxt.indexOf(t)>=0)return true;
  const d=soDigitos(termo);
  return d.length>=6&&alvoDig.indexOf(d)>=0;
}
/** Lembra no navegador se a explicação fica aberta — a escolha é de quem usa. */
function ligarDetalhes(el,chave){
  if(!el)return;
  try{if(localStorage.getItem(chave)==='1')el.open=true;}catch(e){}
  el.addEventListener('toggle',()=>{try{localStorage.setItem(chave,el.open?'1':'0');}catch(e){}});
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Vazia de propósito. Ela existia só para trocar o texto da espera por frases que
   falavam em lentidão e em nova tentativa — quem lia aquilo entendia "vai dar
   errado" e recarregava a página bem quando a resposta já vinha chegando. Quem
   cuida do que a pessoa lê enquanto espera agora é o b4u-espera.js. A função fica
   no lugar porque é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
   de espera continua correndo por cima durante a segunda tentativa — de propósito:
   a pessoa não precisa saber que houve retentativa, só que ainda estamos
   trabalhando. Erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
/* O JSONP sempre teve teto; o POST não tinha. Uma resposta perdida no meio de um
   corpo de ~13 MB deixava a promise pendurada para sempre: spinner eterno na
   célula (que sobrevive a filtro e ordenação) e o aviso de "sair sem salvar"
   pedindo confirmação até o F5. Agora há prazo, e quem estourar sabe. */
async function postAcao(obj,ms){
  const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),ms||120000);
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ctl.signal});
    const d=await r.json();
    if(d&&d.erro)throw new Error(d.erro);
    return d;
  }catch(e){
    if(e&&e.name==='AbortError') throw new Error('A resposta demorou demais.');
    throw e;
  }finally{ clearTimeout(t); }
}

/* ---------------- estado ---------------- */
let LINHAS=[], COLUNAS=[], ESPELHADAS=[], EDITAVEIS=[], SIGILOSAS=[], DATAS=[], LINKS=[], META={}, GRUPOS=[];
/* Valores que o filtro de situação realmente conhece — qualquer outra coisa
   cai em 'todos'. É o mesmo ?f= que o painel do colaborador manda no link. */
const FILTROS_OK=['todos','falta','vencidos','d30','d60','d90'];
let FILTRO='todos';      // todos | falta | vencidos | d30 | d60 | d90
let DOC='todos';         // 'todos' ou o nome de uma coluna de vencimento
let TERMO='';
let SO_ATIVOS=true;
let VER_CADASTRO=false;  // mostrar as colunas espelhadas do Registro (só leitura)
let SORT={key:'urgencia',dir:'asc'};
const REVELADAS=new Set();
const hoje=new Date(); hoje.setHours(0,0,0,0);

/* ---------------- revelação progressiva ---------------- */
/* Filtros recolhidos, com memória. O contador ao lado do botão existe para
   evitar o único efeito colateral ruim de esconder filtro: a pessoa esquece que
   filtrou e acha que os dados sumiram. Por isso, com filtro ativo, o painel
   nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da grade. Dois botões de propósito: "mais 20" para quem lê, "todas" para
   quem vai usar Ctrl+F ou imprimir. Buscar ou filtrar volta o teto ao início —
   o resultado é outro, e continuar de onde parou confundiria. */
const PASSO = 20;
let TETO = PASSO;
function rodapeLista(mostrados, total){
  if(total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todas as ${total}</button>
  </div>`;
}

const eh=(lista,c)=>lista.some(x=>normTxt(x)===normTxt(c));
/* Espelhada = vem do Registro por IMPORTRANGE. Escrever nela destruiria a fórmula,
   então aqui ela é só leitura — e fica escondida até você pedir para ver. */
const ehEspelhada=c=>eh(ESPELHADAS,c);
const ehSigilosa=c=>eh(SIGILOSAS,c);
const ehData=c=>eh(DATAS,c);
const ehLink=c=>eh(LINKS,c);
/* Link PURO = endereço da web, não documento. A coluna "Link Prefeitura" é o
   caso que originou isto: a célula oferecia "Enviar ⬆" e alguém foi procurar o
   arquivo da prefeitura para subir. Ninguém faz upload de um portal — cola a
   URL e pronto. As outras colunas de link (documento, cópia, certidão, alvará…)
   continuam com o envio, que é o que a equipe faz nelas.
   O critério é o nome COMEÇAR com "Link" ("Link Prefeitura", "Link do portal").
   O teste roda nas duas telas mesmo onde ainda não há coluna assim: a lista de
   colunas vem do backend em tempo de execução, então basta o cadastro ganhar
   uma "Link …" para a célula errada aparecer sem ninguém mexer aqui.
   Se amanhã aparecer outra coluna de endereço com nome fora desse padrão, é
   aqui — e só aqui — que se ajusta. */
/* ENDEREÇOS PUROS: a lista FECHADA de colunas que apontam para um lugar da web
   em vez de um arquivo. Só elas perdem o "Enviar ⬆".
   A regra antiga era "o nome começa com Link" — e quebrou feio: nesta planilha os
   DOCUMENTOS também se chamam "Link Contrato Social", "Link Cartão CNPJ", "Link
   Alvará Sanitário". Todos perderam o envio de uma vez, e a ficha virou um
   formulário de colar URL.
   O casamento é EXATO, por nome inteiro normalizado, e não por pedaço. Casar por
   pedaço tem um contra-exemplo real e caro: "Link Certificado de regularidade
   CRM PJ" contém "CRM" e viraria portal — um documento de verdade, perdido de
   novo pela mesma classe de erro. Coluna nova entra como DOCUMENTO por padrão,
   que é o lado seguro: sobra um botão de enviar onde não se usa, em vez de faltar
   onde se precisa. Portal novo? Acrescente o nome aqui. */
const ENDERECOS_PUROS=['link prefeitura','link crm','link portal','link do portal',
                       'link e cac','link ecac','link sefaz','link gov','link site',
                       /* Formulário é endereço para PREENCHER, não arquivo para anexar. */
                       'link form diagnostico','link form','link formulario'];
function ehLinkPuro(c){
  if(!ehLink(c)) return false;
  return ENDERECOS_PUROS.indexOf(normTxt(c))>=0;
}
/* O backend manda a lista de colunas editáveis. Coluna fora dela vira só leitura —
   mas senha, data e link continuam editáveis, porque são tipos de campo, não papéis.
   Backend antigo (sem a lista) deixa tudo como está. */
function ehSoLeitura(c){
  if(ehEspelhada(c)) return true;
  if(!EDITAVEIS.length) return false;
  if(ehSigilosa(c)||ehData(c)||ehLink(c)) return false;
  return !eh(EDITAVEIS,c);
}
/* ID e Nome já aparecem nas colunas congeladas */
const ocultaSempre=c=>['id','nome','name'].includes(normTxt(c));
function curto(c){return String(c).replace(/^Vencimento\s+/i,'').replace(/^Certificado de\s+/i,'Cert. ').trim();}

/* ---------------- grupos de coluna (derivados do NOME, em tempo de execução) ----
   A grade é larga e a planilha muda sozinha, então nada de lista fixa: o grupo sai
   do próprio nome da coluna, em três passos.
   1) tira das pontas as palavras que dizem o PAPEL do campo (link, senha,
      vencimento, login…). O que sobra é o ASSUNTO:
        "Certificado Digital Senha"    -> "Certificado Digital"
        "Link Prefeitura"              -> "Prefeitura"
        "Vencimento Alvará Sanitário"  -> "Alvará Sanitário"
   2) assunto que TERMINA em outro assunto é o mesmo assunto, e o grupo leva o
      nome do pedaço menor — o mais específico:
        "Certificado de CLI" termina em "CLI" -> grupo CLI = [arquivo, vencimento]
      Antes a junção era pelo COMEÇO, e "Certificado de CLI" + "Certificado de
      CRM" viravam um grupo "Certificado de" com os dois documentos dentro e os
      vencimentos jogados em grupos à parte. O dono pediu o contrário: um assunto
      por grupo, cada um com o seu arquivo e a sua data ao lado.
   3) o cabeçalho da coluna passa a mostrar só o PAPEL; o assunto vira a faixa. */
const PAPEIS=new Set(['link','links','url','endereco','vencimento','vencto','venc','vence','validade',
  'valido','data','datas','emissao','expedicao','senha','password','login','usuario','user','acesso',
  'codigo','numero','n','no','status','situacao','observacao','observacoes','obs','protocolo',
  'arquivo','copia','pdf','inicio','fim']);
const PALAVRINHAS=new Set(['de','da','do','das','dos','e','a','o','em','no','na','para','por']);
function tokens(c){return String(c==null?'':c).trim().split(/\s+/).filter(Boolean);}
function tnorm(t){return normTxt(t).replace(/[^0-9a-z\-]/g,'');}
function ehPalavraDePapel(t){const n=tnorm(t);return PAPEIS.has(n)||PALAVRINHAS.has(n);}
function assuntoDe(c){
  let t=tokens(c);
  while(t.length>1&&ehPalavraDePapel(t[0])) t=t.slice(1);
  while(t.length>1&&ehPalavraDePapel(t[t.length-1])) t=t.slice(0,-1);
  return t.join(' ')||String(c||'');
}
/** "Certificado de CLI" termina em "CLI"? Compara palavra a palavra e sempre por
    tnorm: os nomes vêm do cadastro com acento, caixa alta e espaço sobrando, e
    igualdade crua de string deixaria "vencimento  CLI" de fora do grupo. */
function terminaEm(assunto,fim){
  const a=tokens(assunto).map(tnorm), f=tokens(fim).map(tnorm);
  if(!f.length||f.length>a.length) return false;
  return f.every((t,i)=>t===a[a.length-f.length+i]);
}
/** Nome do grupo de um assunto: o MENOR assunto da grade em que ele termina.
    Como todo sufixo mais curto também é sufixo dos maiores, pegar sempre o menor
    já resolve a cadeia inteira de uma vez e não depende da ordem das colunas. */
function assuntoDoGrupo(assunto,todos){
  let nome=assunto, n=tokens(assunto).length;
  todos.forEach(a=>{
    const m=tokens(a).length;
    if(m&&m<n&&terminaEm(assunto,a)){ nome=a; n=m; }
  });
  return nome;
}
/** Duas colunas podem chegar com o mesmo assunto escrito de jeitos diferentes
    ("CLI" e " cli "); o grupo é o mesmo, então a chave dele é normalizada. */
function chaveDeGrupo(nome){return tokens(nome).map(tnorm).join(' ');}
function montarGrupos(cols){
  const assunto=new Map();
  cols.forEach(c=>assunto.set(c,assuntoDe(c)));
  const todos=cols.map(c=>assunto.get(c));
  /* Partição estável: o grupo nasce onde a primeira coluna dele aparece e as irmãs
     se encostam nele — coluna só troca de lugar se uma irmã veio antes. */
  const grupos=[], onde=new Map();
  cols.forEach(c=>{
    const nome=assuntoDoGrupo(assunto.get(c),todos)||curto(c);
    const k=chaveDeGrupo(nome);
    if(!onde.has(k)){onde.set(k,grupos.length);grupos.push({nome,cols:[]});}
    grupos[onde.get(k)].cols.push(c);
  });
  return grupos;
}
/** Dentro de um grupo, o rótulo mostra só o que o título do grupo ainda não
    disse: em "Certificado Digital", a coluna "Senha Certificado Digital" vira
    "Senha". Se não sobrar nada (a coluna É o assunto), quem chama devolve o
    nome inteiro. */
function rotuloNoGrupo(col,grupo){
  const sobrando=tokens(grupo).map(tnorm);
  const resto=[];
  tokens(col).forEach(t=>{
    const i=sobrando.indexOf(tnorm(t));
    if(i>=0){sobrando.splice(i,1);return;}
    resto.push(t);
  });
  return resto.filter(t=>!PALAVRINHAS.has(tnorm(t))).join(' ').trim();
}
/* ---------------- datas ---------------- */
function diasAte(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
  return Math.round((new Date(+m[1],+m[2]-1,+m[3])-hoje)/864e5);}
function fmtBR(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(iso||'');}
/* CNPJ/CPF com pontuação na lista: a coluna vem da planilha só com dígitos, e
   catorze números colados não se confere de relance. Valor que não tem 11 nem
   14 dígitos sai como veio — melhor cru que mascarado errado. */
function fmtDoc(v){return b4uFmtDoc(v).trim();}
function estado(v){
  const s=String(v==null?'':v).trim();
  if(!s) return {cl:'vazio',dias:null,txt:'falta'};
  const d=diasAte(s);
  if(d===null) return {cl:'na',dias:null,txt:s.length>7?s.slice(0,7)+'…':s};
  if(d<0)   return {cl:'venc',dias:d,txt:'vencido'};
  if(d<=30) return {cl:'d30',dias:d,txt:d+'d'};
  if(d<=60) return {cl:'d60',dias:d,txt:d+'d'};
  if(d<=90) return {cl:'d90',dias:d,txt:d+'d'};
  return {cl:'ok',dias:d,txt:fmtBR(s).slice(3)};
}
function ativoDe(l){const s=normTxt(l.ativo);if(!s)return null;
  if(/^(sim|s|true|verdadeiro|1|x|ativo)$/.test(s))return true;
  if(/^(nao|n|false|falso|0|-|inativo)$/.test(s))return false;return null;}

/* ---------------- as colunas-chave da lista ----------------
   A lista mostra seis colunas: ID · Cliente · CNPJ · Venc. do certificado
   digital · Venc. das procurações · Situação. As três do meio saem da planilha,
   e a planilha MUDA SOZINHA — nome de coluna cru escrito aqui quebraria calado
   na primeira vez que alguém renomeasse "Procuração e-CAC Vencimento".
   Por isso a descoberta é em tempo de execução e por nome normalizado (sem
   acento, sem caixa), com plano B para cada caso:
     · CNPJ  — vem espelhado do cadastro do cliente; se não vier, a coluna
               simplesmente não cobra nada (veja cabecaHTML).
     · certificado digital — as colunas de DATA que falam de "certificado";
               na falta delas, as datas que não são de procuração.
     · procurações — as colunas de DATA que falam de "procuração"; na falta
               delas, as datas que sobraram depois do certificado.
   São CONJUNTOS, e não uma coluna só, porque hoje já são duas procurações
   (e-CAC e SPE) e amanhã pode ser outra: a célula mostra a mais urgente e diz
   num "+N" quantas outras existem. */
const COLS_LINHA={cnpj:'',cert:[],proc:[]};
/** Primeira coluna cujo nome normalizado casa — igual antes, "contém" depois. */
function colDe(alts){
  for(const a of alts){const c=COLUNAS.find(x=>normTxt(x)===a);if(c)return c;}
  for(const a of alts){const c=COLUNAS.find(x=>normTxt(x).indexOf(a)>=0);if(c)return c;}
  return '';
}
function mapearColunasLinha(){
  COLS_LINHA.cnpj=colDe(['cnpj ou cpf','cnpj/cpf','cnpj','cpf','documento']);
  const proc=DATAS.filter(c=>normTxt(c).indexOf('procuracao')>=0);
  const cert=DATAS.filter(c=>normTxt(c).indexOf('certificado')>=0);
  COLS_LINHA.cert=cert.length?cert:DATAS.filter(c=>proc.indexOf(c)<0);
  COLS_LINHA.proc=proc.length?proc:DATAS.filter(c=>COLS_LINHA.cert.indexOf(c)<0);
}
/* Situação da linha: a resposta de "preciso agir neste cliente?". Sai do
   vencimento mais próximo entre as colunas de data que o filtro de Vencimento
   deixou de pé — é a mesma conta dos chips, para o selo nunca contradizer o
   número que está logo acima dele. */
const SITUACOES={
  venc:{rot:'Vencido',dica:'Tem vencimento com data já passada.'},
  d30:{rot:'Vence em 30 dias',dica:'O vencimento mais próximo cai nos próximos 30 dias.'},
  d60:{rot:'Vence em 60 dias',dica:'O vencimento mais próximo cai entre 31 e 60 dias.'},
  ok:{rot:'Em dia',dica:'Nenhum vencimento nos próximos 60 dias.'},
  sem:{rot:'Sem data',dica:'Nenhum vencimento preenchido — não dá para saber o prazo deste cliente.'},
  inativo:{rot:'Inativo',dica:'Cliente marcado como inativo no cadastro.'}
};
function situacaoDe(l){
  if(ativoDe(l)===false) return 'inativo';
  const u=urgencia(l,colsData());
  if(u===null) return 'sem';
  if(u<0) return 'venc';
  if(u<=30) return 'd30';
  if(u<=60) return 'd60';
  return 'ok';
}
function classeSituacao(l){return 'sit-'+situacaoDe(l);}

function colsData(){return DOC==='todos'?DATAS:[DOC];}
function urgencia(l,keys){
  let min=null;
  (keys||DATAS).forEach(k=>{const st=estado(l.valores[k]);if(st.dias!=null&&(min===null||st.dias<min))min=st.dias;});
  return min;
}
function faltando(l){
  return colsData().filter(k=>!String(l.valores[k]||'').trim()).map(curto);
}

/* ---------------- filtros ---------------- */
function passaFiltro(l){
  if(SO_ATIVOS&&ativoDe(l)===false) return false;
  if(FILTRO==='todos') return true;
  if(FILTRO==='falta') return faltando(l).length>0;
  const u=urgencia(l,colsData());
  if(u===null) return false;
  if(FILTRO==='vencidos') return u<0;
  if(FILTRO==='d30') return u<=30;
  if(FILTRO==='d60') return u<=60;
  if(FILTRO==='d90') return u<=90;
  return true;
}
/* Texto e dígitos da linha, guardados até alguém editar a linha.
   As colunas sigilosas ficam de fora: senha nunca entra na busca. */
function chavesBusca(l){
  if(l._bt==null){
    const campos=COLUNAS.filter(c=>!ehSigilosa(c)).map(c=>l.valores[c]);
    l._bt=normTxt([l.id,l.nome_cliente].concat(campos).join(' '));
    l._bd=[String(l.id)].concat(campos).map(soDigitos).filter(Boolean).join('|');
  }
  return l;
}
function esquecerBusca(l){l._bt=null;l._bd=null;}
function passaBusca(l,termo){
  if(!termo) return true;
  chavesBusca(l);
  return casaBusca(l._bt,l._bd,termo);
}
/* ---------- as chaves de ordenação da lista ----------
   Uma entrada por COLUNA da lista, para o cabeçalho e os chips "Ordenar por"
   ordenarem exatamente pelo que está escrito na linha. `v` devolve o valor cru
   (as datas ordenam pelo aaaa-mm-dd que veio da planilha, nunca pelo dd/mm/aaaa
   que a célula mostra) e `t` diz como comparar. Coluna sem valor devolve '' — e
   vazio vai sempre para o fim, nas duas direções. */
const ORD_COLS={
  id:            {t:'txt', v:l=>l.id},
  nome_cliente:  {t:'txt', v:l=>l.nome_cliente},
  cnpj:          {t:'doc', v:l=>COLS_LINHA.cnpj?valDe(l,COLS_LINHA.cnpj):''},
  /* As duas colunas de data são CONJUNTOS (hoje já são duas procurações): a
     ordem segue a mesma data que a célula mostra — a mais urgente do assunto. */
  cert:          {t:'data',v:l=>{const c=maisUrgente(l,COLS_LINHA.cert);return c?valDe(l,c):'';}},
  proc:          {t:'data',v:l=>{const c=maisUrgente(l,COLS_LINHA.proc);return c?valDe(l,c):'';}},
  urgencia:      {t:'num', v:l=>{const u=urgencia(l,colsData());return u===null?'':u;}},
  /* Situação vai pela GRAVIDADE, não pelo alfabeto: "Vencido" antes de "Em dia"
     é a única ordem que responde "em quem eu preciso mexer hoje". */
  situacao:      {t:'num', v:l=>{const p={venc:0,d30:1,d60:2,ok:3,inativo:4,sem:''};
                                 const r=p[situacaoDe(l)];return r==null?'':r;}}
};
/* Texto sem acento e sem caixa: "Água" e "agua" ficam juntas. */
function cmpTxt(a,b){return normTxt(a).localeCompare(normTxt(b),'pt',{numeric:true});}
/* Documento ordena pelos DÍGITOS: com pontuação, "08.852…" e "08852…" caíam em
   pontos distintos da mesma coluna. */
function cmpDoc(a,b){return soDigitos(a).localeCompare(soDigitos(b),'pt',{numeric:true});}
function cmpNum(a,b){const x=parseFloat(String(a).replace(',','.')),y=parseFloat(String(b).replace(',','.'));
  return (isFinite(x)?x:Infinity)-(isFinite(y)?y:Infinity);}
/* Data ordena por CALENDÁRIO — pelo valor da planilha, nunca pelo dd/mm/aaaa da
   tela. Texto livre ("N/A", "Não localizado") não é prazo: fica depois de todas
   as datas, nas duas direções — igual ao que maisUrgente() já faz na hora de
   escolher qual data a célula mostra. */
function cmpOrd(a,b){
  const def=ORD_COLS[SORT.key];
  const va=def?def.v(a):valDe(a,SORT.key),vb=def?def.v(b):valDe(b,SORT.key);
  /* Coluna em branco quer dizer "falta preencher": ela vai SEMPRE para o fim,
     nas duas direções. Jogá-la para o topo no Z→A esconderia justamente o que a
     pessoa abriu a tela para ver. */
  const ea=String(va==null?'':va).trim()==='',eb=String(vb==null?'':vb).trim()==='';
  if(ea&&eb)return 0;
  if(ea)return 1;
  if(eb)return -1;
  const t=def?def.t:'txt';
  if(t==='data'){
    const da=estado(va).dias,db=estado(vb).dias;
    if(da!=null&&db!=null)return SORT.dir==='desc'?db-da:da-db;
    if(da==null&&db!=null)return 1;                 // texto livre depois da data
    if(da!=null&&db==null)return -1;
    const r=cmpTxt(va,vb);return SORT.dir==='desc'?-r:r;
  }
  const r=t==='num'?cmpNum(va,vb):t==='doc'?cmpDoc(va,vb):cmpTxt(va,vb);
  return SORT.dir==='desc'?-r:r;
}
function visiveis(){
  const termo=String(TERMO||'').trim();
  const arr=LINHAS.filter(l=>passaFiltro(l)&&passaBusca(l,termo));
  /* Ordena o que SOBROU do filtro e da busca — nunca a lista crua. */
  arr.sort((a,b)=>cmpOrd(a,b)||String(a.id).localeCompare(String(b.id),'pt',{numeric:true}));
  return arr;
}

/* ---------------- células ---------------- */
/* Uma data preenchida NÃO tem botão nenhum ao lado — assim nenhum clique
   distraído apaga o vencimento. O atalho de trocar data↔texto só aparece
   quando não há nada a perder: campo vazio, ou campo que já é texto. */
function celData(l,c){
  const v=String(l.valores[c]||'').trim();
  const isISO=/^\d{4}-\d{2}-\d{2}$/.test(v);
  const livre=!!v&&!isISO;
  const st=estado(v);
  const atalho = isISO ? ''
    : (livre ? `<button type="button" class="btn btn--micro modo" data-modo="${esc(c)}" data-para="data" title="Trocar por um campo de data">📅 data</button>`
             : `<button type="button" class="btn btn--micro modo" data-modo="${esc(c)}" data-para="texto" title="Escrever texto (N/A, “Não localizado”…)">texto</button>`);
  return `<div class="dt ${st.cl}">
    ${livre
      ? `<input type="text" data-c="${esc(c)}" value="${esc(v)}" placeholder="ex.: Não localizado">`
      : `<input type="date" data-c="${esc(c)}" value="${isISO?v:''}">`}
    ${atalho}
    <span class="tag-d ${st.cl}">${esc(st.txt)}</span>
  </div>`;
}
function celSigilosa(l,c){
  const v=String(l.valores[c]||'');
  const aberta=REVELADAS.has(l.id+'|'+c);
  return `<div class="sig">
    <input type="${aberta?'text':'password'}" data-c="${esc(c)}" value="${esc(v)}" autocomplete="off" placeholder="—">
    <button type="button" class="btn btn--micro" data-ver="${esc(c)}" title="${aberta?'Esconder':'Mostrar'}">${aberta?'🙈':'👁️'}</button>
    <button type="button" class="btn btn--micro" data-copiar="${esc(c)}" title="Copiar">📋</button>
  </div>`;
}
/* Só abre o que é mesmo endereço — campo vazio ou com anotação solta deixa o
   atalho apagado, para ninguém cair numa guia em branco. */
function urlOk(v){return /^https?:\/\/[^\s]+$/i.test(String(v==null?'':v).trim());}
function atalhoAbrir(v){
  const u=String(v||'').trim();
  return urlOk(u)
    ? `<a class="lk-ir" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="Abrir em outra guia">↗</a>`
    : `<span class="lk-ir off" title="Sem endereço válido para abrir" aria-hidden="true">↗</span>`;
}
/* Células com o campo de URL à mostra (o "⋯" aberto), por id|coluna. */
const ABERTAS=new Set();
/* Envios em andamento: id|coluna -> nome do arquivo. */
const ENVIANDO=new Map();
/* Erro por célula, com validade — id|coluna -> {txt, ate}. Um aviso que fica
   para sempre atravessa filtro e busca e ainda está lá meia hora depois. */
const ERROS=new Map();
const chaveCel=(id,c)=>String(id)+'|'+c;

function erroDaCel(l,c){
  const e=ERROS.get(chaveCel(l.id,c));
  if(!e) return '';
  if(Date.now()>e.ate){ ERROS.delete(chaveCel(l.id,c)); return ''; }
  return `<span class="doc-erro">${esc(e.txt)}</span>`;
}

/* A coluna de link de DOCUMENTO não mostra mais o endereço: mostra o documento.
   (A coluna de endereço puro — "Link Prefeitura" e afins — é outra história e
   sai logo no começo desta função; veja ehLinkPuro.)
     tem link ......... Abrir ↗            + ⋯
     vazia ............ Enviar ⬆           + ⋯
     texto solto ...... Enviar ⬆ + a anotação em itálico + ⋯
     enviando ......... roda + nome do arquivo
   O "⋯" guarda o que é raro e o que dá para estragar: o campo de URL editável e
   a troca do arquivo. Coluna que FALHOU ao gravar fica aberta à força — fechar
   mostraria um "Abrir ↗" verde apontando um endereço que só existe na memória
   deste navegador.
   ENVIAR OUTRO ARQUIVO: até agora não havia caminho nenhum para trocar o
   documento por outro — quem tinha um "Abrir ↗" só podia colar uma URL nova à
   mão. O backend já substituía (o `cert_upload` devolve `d.substituiu` e a
   mensagem "Documento substituído ✓" estava pronta e nunca aparecia, porque
   nenhum botão a alcançava). Agora o "⋯" da célula PREENCHIDA oferece o envio
   ao lado do campo de URL. Só na célula preenchida: na vazia o "Enviar ⬆" já
   está à mostra, e repetir o botão dentro do "⋯" seria dois caminhos para a
   mesma coisa. */
function celLink(l,c){
  const v=String(l.valores[c]||'').trim();
  const k=chaveCel(l.id,c);
  /* Coluna de endereço puro (ehLinkPuro): o campo de URL fica sempre à mostra,
     com o atalho de abrir ao lado. Sem "Enviar ⬆" e sem o "⋯" — não há arquivo
     para mandar nem para trocar, e esconder o campo atrás do "⋯" só somaria um
     clique a quem veio colar um endereço. Vale igual no modo fichas, que passa
     por esta mesma função. */
  if(ehLinkPuro(c)){
    return `<div class="doc" data-cel="${esc(k)}">
      <div class="lk-cel">
        <input type="text" data-c="${esc(c)}" data-link="1" value="${esc(v)}" placeholder="https://…" inputmode="url" spellcheck="false">
        ${atalhoAbrir(v)}
      </div>
      ${erroDaCel(l,c)}</div>`;
  }
  const f=FALHAS.get(String(l.id));
  const falhou=!!(f&&f.campos&&f.campos.has(c));
  const enviando=ENVIANDO.get(k);

  if(enviando!==undefined){
    return `<div class="doc" data-cel="${esc(k)}"><span class="doc-spin"></span>
      <span class="doc-obs">${esc(enviando)}</span></div>`;
  }

  if(ABERTAS.has(k)||falhou){
    return `<div class="doc" data-cel="${esc(k)}">
      <div class="lk-cel">
        <input type="text" data-c="${esc(c)}" data-link="1" value="${esc(v)}" placeholder="https://…" inputmode="url" spellcheck="false">
        ${atalhoAbrir(v)}
      </div>
      ${urlOk(v)?`<button type="button" class="doc-bt doc-env" data-env="${esc(c)}" title="Manda um arquivo novo no lugar deste — o documento de agora é substituído">Enviar outro arquivo ⬆</button>`:''}
      <button type="button" class="doc-mais" data-mais="${esc(c)}" title="Fechar">✕</button>
      ${erroDaCel(l,c)}</div>`;
  }

  const acao=urlOk(v)
    ? `<a class="doc-bt doc-ir" href="${esc(v)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`
    : `<button type="button" class="doc-bt doc-env" data-env="${esc(c)}">Enviar ⬆</button>` +
      (v?`<span class="doc-obs" title="${esc(v)}">${esc(v)}</span>`:'');
  return `<div class="doc" data-cel="${esc(k)}">${acao}
    <button type="button" class="doc-mais" data-mais="${esc(c)}" title="Trocar o arquivo ou colar um endereço">⋯</button>
    ${erroDaCel(l,c)}</div>`;
}
/* ---------------- envio do documento ---------------- */
const DOC_MAX=10*1024*1024;                 // igual ao anexo de chamado
let DOC_ALVO=null;                          // {id, coluna} do clique que abriu o seletor

/* A célula vive dentro da ficha (o `.corpo` pintado no modal), não mais numa
   linha da grade. Procurar pelo `.corpo[data-id]` funciona esteja ele onde
   estiver — e simplesmente não acha nada quando a ficha está fechada, que é
   justamente o caso em que não há o que repintar. */
function repintarCel(l,c){
  const cel=document.querySelector('.corpo[data-id="'+CSS.escape(String(l.id))+'"] [data-cel="'+CSS.escape(chaveCel(l.id,c))+'"]');
  /* outerHTML, e não innerHTML do pai: na grade a célula ocupava o <td> inteiro,
     mas na ficha ela divide o `.fld` com o RÓTULO do campo — repintar o pai
     levava o rótulo junto e o campo ficava sem nome. */
  if(cel) cel.outerHTML=celLink(l,c);
}
function erroNaCel(l,c,txt){
  ERROS.set(chaveCel(l.id,c),{txt:txt,ate:Date.now()+45000});
  repintarCel(l,c);
}
function lerBase64(file){
  return new Promise((ok,fail)=>{
    const fr=new FileReader();
    fr.onerror=()=>fail(new Error('Não consegui ler o arquivo.'));
    fr.onload=()=>{ const s=String(fr.result||''); ok(s.slice(s.indexOf(',')+1)); };
    fr.readAsDataURL(file);
  });
}
async function enviarDocumento(l,c,file){
  if(file.size>DOC_MAX){
    erroNaCel(l,c,'O arquivo tem '+(file.size/1048576).toFixed(1)+' MB e o limite é 10 MB.');
    return;
  }
  const k=chaveCel(l.id,c);
  ERROS.delete(k); ENVIANDO.set(k,file.name); repintarCel(l,c);
  setSave('saving','Enviando '+file.name+'…');
  try{
    const b64=await lerBase64(file);
    const d=await postAcao({acao:'cert_upload', id:l.id, coluna:c,
      cliente:l.valores['Nome']||'', cod:respAtual(),
      arquivo_nome:file.name, arquivo_tipo:file.type||'application/octet-stream',
      arquivo_base64:b64});
    // resposta sem url NÃO apaga o link que já estava lá
    if(d&&d.url){ l.valores[c]=d.url; esquecerBusca(l); }
    setSave('ok',(d&&d.substituiu?'Documento substituído ✓ ':'Documento enviado ✓ ')+horaAgora());
  }catch(e){
    /* O texto da exceção continua sendo LIDO — é ele que separa o timeout do
       resto — mas não é mais ESCRITO na célula nem na faixa de status. */
    const msg=String((e&&e.message)||e);
    /* No timeout o arquivo PODE ter subido: o servidor grava dentro do lock e só
       depois responde. Reenviar às cegas duplicaria o documento na pasta — por
       isso este caso ganha aviso próprio, que diz o que fazer. */
    erroNaCel(l,c, msg.indexOf('demorou')>-1
      ? 'Demorou demais. O arquivo pode ter subido — recarregue antes de mandar de novo.'
      : 'Não foi possível enviar. Tente de novo.');
    setSave('err','Não foi possível enviar. Tente de novo.');
  }finally{
    ENVIANDO.delete(k); repintarCel(l,c);
  }
}

function celSoLeitura(l,c){
  const v=String(l.valores[c]||'');
  /* A dica diz ONDE editar, não COMO o dado chega até aqui: nome de fórmula e de
     aba são assunto de quem cuida dos bastidores, e na tela só faziam a pessoa
     achar que precisava mexer neles. */
  const t=ehEspelhada(c)?'Vem do cadastro do cliente — edite em Registros de clientes'
                        :'Coluna mantida pelo sistema — só leitura';
  const caixa=`<div class="ro" title="${esc(t)}">${esc(v||'—')}</div>`;
  /* link só de leitura continua abrindo: some o campo, fica o atalho */
  return ehLink(c)?`<div class="lk-cel">${caixa}${atalhoAbrir(v)}</div>`:caixa;
}
function cel(l,c){
  if(ehSoLeitura(c)) return celSoLeitura(l,c);
  if(ehSigilosa(c))  return celSigilosa(l,c);
  if(ehData(c))      return celData(l,c);
  if(ehLink(c))      return celLink(l,c);
  return `<input type="text" data-c="${esc(c)}" value="${esc(l.valores[c]||'')}">`;
}

/* ---------------- render ---------------- */
function colsVisiveis(){
  return COLUNAS.filter(c=>!ocultaSempre(c)&&(VER_CADASTRO||!ehEspelhada(c)));
}
function valDe(l,c){return c?b4uTexto((l.valores||{})[c]).trim():'';}

/* ---------------- a linha da lista ----------------
   Seis colunas, nenhum campo: quem lê a lista não altera nada sem querer. É um
   role="button" (e não um <button>) porque dentro dele há etiquetas de prazo com
   title próprio; o teclado é atendido à mão no keydown (Enter e Espaço). */

/** Entre as colunas de data de um assunto, a que cobra primeiro. Texto solto
    ("N/A", "Não localizado") entra por último: é informação, mas não é prazo, e
    não pode ganhar de uma data de verdade na hora de escolher o que mostrar. */
function maisUrgente(l,cols){
  let alvo='',melhor=null;
  (cols||[]).forEach(c=>{
    const v=valDe(l,c); if(!v) return;
    const st=estado(v);
    const peso=st.dias==null?Infinity:st.dias;
    if(melhor===null||peso<melhor){melhor=peso;alvo=c;}
  });
  return alvo;
}
/** O miolo de uma célula de vencimento na lista: a data que cobra primeiro, a
    etiqueta de prazo dela e um "+N" com quantas outras do mesmo assunto estão
    preenchidas. O "+N" existe porque a etiqueta NUNCA é cortada — duas datas
    inteiras dizem mais que três pela metade —, e o que sobra vai para o title
    da linha, que lista assunto por assunto. */
function celDataLista(l,cols){
  if(!cols.length) return '<span class="c-falta">—</span>';
  const alvo=maisUrgente(l,cols);
  if(!alvo) return '<span class="c-falta">sem data</span>';
  const v=valDe(l,alvo),st=estado(v);
  const outras=cols.filter(c=>c!==alvo&&valDe(l,c)).length;
  /* A etiqueta só aparece quando ela COBRA alguma coisa (vencido, ou faltam N
     dias). No estado "ok" ela dizia "02/2027" — o mês e o ano da data que já
     está escrita ao lado, palavra por palavra. Na grade isso fazia sentido,
     porque ali a data morava dentro de um campo; aqui era só repetição. */
  const cobra=st.dias!=null&&st.dias<=90;
  return `<span class="txt">${esc(st.dias==null?v:fmtBR(v))}</span>`
    +(cobra?`<span class="tag-d ${st.cl}">${esc(st.txt)}</span>`:'')
    +(outras?`<span class="c-tag mais" title="Este assunto tem mais ${outras} data preenchida — passe o mouse na linha para ver todas.">+${outras}</span>`:'');
}
/** O que não coube nas seis colunas vira o title da linha: dá para conferir sem
 *  abrir nada — inclusive as datas que não têm coluna própria aqui. */
function tituloCabeca(l){
  const p=[];
  if(COLS_LINHA.cnpj)p.push('CNPJ: '+(valDe(l,COLS_LINHA.cnpj)?fmtDoc(valDe(l,COLS_LINHA.cnpj)):'em branco'));
  const add=c=>{const v=valDe(l,c);p.push(curto(c)+': '+(v?(estado(v).dias==null?v:fmtBR(v)):'em branco'));};
  COLS_LINHA.cert.forEach(add);
  COLS_LINHA.proc.forEach(add);
  DATAS.filter(c=>COLS_LINHA.cert.indexOf(c)<0&&COLS_LINHA.proc.indexOf(c)<0).forEach(add);
  p.push('Situação: '+SITUACOES[situacaoDe(l)].rot);
  p.push('Clique para abrir a ficha.');
  return p.join(' · ');
}
function cabecaHTML(l){
  const s=situacaoDe(l),info=SITUACOES[s];
  const doc=valDe(l,COLS_LINHA.cnpj);
  /* Coluna em branco diz o NOME do que falta. Mas quando a PLANILHA não tem
     coluna de CNPJ nenhuma, a célula não cobra nada: escrever "sem CNPJ" em
     todas as linhas seria acusar a equipe de um dado que a tela nem tem onde
     guardar — e ninguém saberia onde preencher. */
  const docHTML=doc?b4uIdentHTML(doc,COLS_LINHA.cnpj||'CNPJ')
    :(COLS_LINHA.cnpj?'<span class="c-falta">sem CNPJ</span>':'<span class="c-falta">—</span>');
  return `<div class="cli-head" role="button" tabindex="0" aria-haspopup="dialog" title="${esc(tituloCabeca(l))}">
      <span class="c-id">${esc(l.id)}</span>
      <span class="c-nome">${esc(l.nome_cliente||'(sem nome)')}</span>
      <span class="c-doc">${docHTML}</span>
      <span class="c-data">${celDataLista(l,COLS_LINHA.cert)}</span>
      <span class="c-data">${celDataLista(l,COLS_LINHA.proc)}</span>
      <span class="c-fim"><span class="pill sit-${s}" title="${esc(info.dica)}">${esc(info.rot)}</span></span>
    </div>`;
}
/** Seta da coluna ativa — só ela ganha marca, senão a lista pareceria ordenada
 *  por seis critérios ao mesmo tempo.
 *  O espaço antes da seta é NÃO SEPARÁVEL (\u00A0) de propósito: com espaço
 *  comum, o rótulo que quase preenche a coluna empurrava a seta sozinha para uma
 *  segunda linha, e o cabeçalho ficava com o dobro da altura por causa dela. */
function seta(key){return SORT.key===key?(SORT.dir==='asc'?'\u00A0▲':'\u00A0▼'):'';}
/* O cabeçalho das colunas repete a régua da linha (mesma regra de CSS) e some
   abaixo de 900px, onde a linha deixa de ser seis colunas. Cada rótulo é um
   botão que ordena — por isso ele NÃO é mais aria-hidden: aqui não é enfeite, e
   a coluna ativa se anuncia com aria-sort. */
function cabecalhoLista(){
  const bt=(k,rot,estilo)=>{
    const at=SORT.key===k;
    return `<span role="columnheader"${estilo?' style="'+estilo+'"':''}`+
      `${at?` aria-sort="${SORT.dir==='asc'?'ascending':'descending'}"`:''}>`+
      `<button type="button" data-sort="${esc(k)}" title="Ordenar por ${esc(rot)}">${esc(rot)}${seta(k)}</button></span>`;
  };
  return `<div class="lista-cab" role="row">`+
    bt('id','ID')+bt('nome_cliente','Cliente')+bt('cnpj','CNPJ')+
    bt('cert','Venc. do certificado digital')+bt('proc','Venc. das procurações')+
    bt('situacao','Situação','text-align:right')+`</div>`;
}

/* ---------------- a ficha (o miolo do modal) ----------------
   O agrupamento por assunto que a grade já sabia montar (montarGrupos/assuntoDe)
   vira a divisão em seções: é a mesma informação, e cada bloco traz o documento
   e o vencimento dele juntos — que é como a pessoa pensa, e não em "coluna de
   link" e "coluna de data" em partes opostas da linha. */
function campoFichaHTML(l,c,grupo){
  const trav=ehSoLeitura(c);
  const rot=`<span class="lbl" title="${esc(c)}">${esc(rotFicha(c,grupo))}${trav?' <span class="cad">🔒</span>':''}</span>`;
  /* Endereço e observação ocupam a fileira inteira: URL e texto corrido em meia
     coluna viram três linhas de reticências. */
  const full=ehLink(c)||normTxt(c).indexOf('observac')>=0;
  return `<div class="fld${full?' full':''}">${rot}${cel(l,c)}</div>`;
}
function corpoHTML(l){
  /* Título de grupo com nada embaixo lê como defeito da tela — foi o caso do
     "Certificado Digital Responsável Legal", que aparecia sozinho quando todas
     as colunas dele estavam vazias e sumiam. Aqui a ficha mostra TODOS os
     campos, cheios ou vazios (é onde se preenche), então o título nunca fica
     órfão; a guarda abaixo cobre o único jeito que restou de isso acontecer:
     um grupo que ficou sem coluna nenhuma visível. */
  const blocos=GRUPOS.map(g=>{
    if(!g.cols.length) return '';
    const preenchidos=g.cols.filter(c=>valDe(l,c)).length;
    return `<div class="gsec"><h3><span class="dot"></span>${esc(g.nome)}`
      +`<span class="n">${preenchidos} de ${g.cols.length}</span></h3>`
      +`<div class="grid">${g.cols.map(c=>campoFichaHTML(l,c,g.nome)).join('')}</div></div>`;
  }).join('');
  /* Pasta do cliente no Drive (vem do cadastro, no payload da grade). Só vira
     link quando há endereço de verdade — campo vazio some, em vez de virar um
     link morto. Era um ícone colado no nome na grade; aqui mora no rodapé da
     ficha, junto dos outros atalhos. */
  const drive=String(l.drive||'').trim();
  return `<div class="corpo" data-id="${esc(l.id)}">
    <div class="ign" id="ign_${esc(l.id)}"></div>
    ${blocos||'<div class="vazio">Esse cliente não tem colunas para mostrar.</div>'}
    <div class="rodape">
      <span>As alterações salvam sozinhas. Campos com 🔒 são mantidos pelo sistema.</span>
      ${urlOk(drive)?`<a class="lk" href="${esc(drive)}" target="_blank" rel="noopener noreferrer" aria-label="Abrir a pasta de ${esc(l.nome_cliente||l.id)} no Drive">📁 Pasta no Drive ↗</a>`:''}
      ${META.planilha_url?`<a class="lk" href="${esc(META.planilha_url)}" target="_blank" rel="noopener noreferrer">Planilha ↗</a>`:''}
    </div>
  </div>`;
}

/* Rótulo do campo dentro da ficha. "Senha Certificado Digital" é nome de COLUNA
   de planilha; na ficha o assunto já está no título da seção, então o campo só
   precisa dizer o que ele é ("Senha"). O nome cru continua no title do rótulo,
   para quem precisar casar o campo com a coluna do cadastro. */
function rotFicha(c,grupo){
  /* Coluna de link tem DOIS papéis nesta tela, e o rótulo tem de dizer qual:
     documento de verdade, que aceita arquivo ("Certificado Digital Link"), ou
     endereço de acesso, que é um portal e nunca aceita ("Link Prefeitura",
     "Link CRM"). Chamar os dois de "Documento" foi exatamente o engano que
     levou alguém a procurar o arquivo da prefeitura para subir. */
  if(ehLink(c)) return ehLinkPuro(c)?'Endereço':'Documento';
  /* Coluna que É o assunto não sobra nada depois de tirar o nome do grupo — aí
     o rótulo é o nome inteiro mesmo. */
  return (grupo?rotuloNoGrupo(c,grupo):'')||curto(c);
}

/* Quais linhas estão com a ficha aberta. É um Set (e não um id solto) porque é
   ele que acende a linha na lista e sobrevive a um redesenho. */
const ABERTOS=new Set();
function desenharLista(){
  GRUPOS=montarGrupos(colsVisiveis());
  const arr=visiveis();
  document.getElementById('cnt').textContent=arr.length+' de '+LINHAS.length+' clientes';
  const el=document.getElementById('lista'),dica=document.getElementById('dica');
  if(!el) return;
  const total=arr.length;
  if(!total){
    el.innerHTML=`<div class="vazio">${LINHAS.length?'Nenhum cliente com esse filtro ou essa busca.':'Nenhum cliente para mostrar.'}</div>`;
    if(dica)dica.textContent='';
    return;
  }
  /* A lista nasce com 20 linhas: 111 linhas de uma vez era a parede que o dono
     reclamou. Quem veio conferir um cliente nunca paga por 111. */
  const n=Math.min(TETO,total);
  el.innerHTML=cabecalhoLista()+
    arr.slice(0,n).map(l=>`<div class="cli ${classeSituacao(l)}${ABERTOS.has(String(l.id))?' aberto':''}" data-id="${esc(l.id)}">${cabecaHTML(l)}</div>`).join('')+
    rodapeLista(n,total);
  if(dica)dica.textContent=total>n?('Mostrando '+n+' de '+total+'.'):'';
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
}
function itemResumo(l,c){
  const st=estado(l.valores[c]);
  return `<button type="button" class="tk" data-goto="${esc(l.id)}">
    <span class="d">${st.dias!=null&&st.dias<0?'vencido':fmtBR(l.valores[c])}</span>
    <span class="lb">${esc(l.nome_cliente||l.id)}</span>
    <span class="tp">${esc(curto(c))}</span></button>`;
}
function desenharResumo(){
  const keys=colsData();
  const base=LINHAS.filter(l=>!SO_ATIVOS||ativoDe(l)!==false);
  const itens=(min,max)=>{
    const out=[];
    base.forEach(l=>keys.forEach(k=>{const st=estado(l.valores[k]);
      if(st.dias!=null&&st.dias>=min&&st.dias<=max)out.push({l,k,d:st.dias});}));
    out.sort((a,b)=>a.d-b.d); return out;
  };
  const venc=itens(-99999,-1), d30=itens(0,30), d60=itens(31,60);
  const falta=base.filter(l=>faltando(l).length>0);
  const card=(cls,titulo,lista,render)=>`<div class="rcard ${cls}">
      <div class="rhead"><span>${titulo}</span><span class="n">${lista.length}</span></div>
      <div class="rlista">${lista.length?lista.slice(0,60).map(render).join(''):'<div class="rvazio">Nada por aqui 🎉</div>'}</div></div>`;
  document.getElementById('resumo').innerHTML=
    card('vencidos','Vencidos',venc,x=>itemResumo(x.l,x.k))+
    card('d30','Vence em até 30 dias',d30,x=>itemResumo(x.l,x.k))+
    card('d60','Vence em 31–60 dias',d60,x=>itemResumo(x.l,x.k))+
    card('falta','Faltando dados',falta,l=>`<button type="button" class="tk" data-goto="${esc(l.id)}">
        <span class="d">${esc(l.id)}</span><span class="lb">${esc(l.nome_cliente||'')}</span>
        <span class="tp">${esc(faltando(l).join(' · '))}</span></button>`);
}
/* Quantos filtros estão pegando agora — vira o selo ao lado do botão Filtros (C.5).
   Só conta o que está ESCONDIDO no painel: a busca fica à vista na régua, e um
   selo dizendo "1 filtro" por causa dela faria a pessoa procurar o que não sumiu.
   A ordenação entra porque também mora no painel e também muda o que aparece. */
function filtrosPainel(){
  return (FILTRO!=='todos'?1:0)+(DOC!=='todos'?1:0)+(SO_ATIVOS?0:1)+
         (SORT.key!=='urgencia'||SORT.dir!=='asc'?1:0);
}
function limparFiltros(){
  FILTRO='todos';DOC='todos';TERMO='';SO_ATIVOS=true;TETO=PASSO;
  SORT={key:'urgencia',dir:'asc'};
  const b=document.getElementById('busca');if(b)b.value='';
  redesenhar();
}
/* ---------- ordenação ----------
   A grade era ordenada clicando no cabeçalho da coluna. A lista de leitura não
   tem 17 cabeçalhos para clicar, então os critérios viraram chips no painel de
   filtros — os mesmos três que respondem por esta tela. Clicar de novo no mesmo
   critério inverte, como a seta do cabeçalho fazia. Um ?ord= antigo apontando
   para uma coluna continua ordenando (validarURL cuida disso); ele só não tem
   chip aceso. */
const ORDENS=[
  {k:'urgencia',rot:'Vencimento mais próximo',asc:'do mais urgente para o menos',desc:'do menos urgente para o mais'},
  {k:'id',rot:'ID',asc:'do menor para o maior',desc:'do maior para o menor'},
  {k:'nome_cliente',rot:'Cliente',asc:'de A a Z',desc:'de Z a A'},
  {k:'cnpj',rot:'CNPJ',asc:'do menor para o maior',desc:'do maior para o menor'},
  {k:'cert',rot:'Venc. do certificado digital',asc:'do mais urgente para o menos',desc:'do menos urgente para o mais'},
  {k:'proc',rot:'Venc. das procurações',asc:'do mais urgente para o menos',desc:'do menos urgente para o mais'},
  {k:'situacao',rot:'Situação',asc:'vencidos primeiro',desc:'em dia primeiro'}
];
function desenharOrdem(){
  const el=document.getElementById('ordChips');if(!el)return;
  el.innerHTML='<span class="rot">Ordenar por</span>'+ORDENS.map(o=>
    `<button type="button" class="chip ${SORT.key===o.k?'on':''}" data-s="${o.k}">${esc(o.rot)}`+
    (SORT.key===o.k?`<span class="ord">${SORT.dir==='asc'?'▲':'▼'}</span>`:'')+`</button>`).join('');
  const info=document.getElementById('ordInfo');
  const at=ORDENS.find(o=>o.k===SORT.key);
  if(info)info.innerHTML=at
    ?('Ordenado por <b>'+esc(at.rot)+'</b> — '+esc(SORT.dir==='asc'?at.asc:at.desc)+'. Clicar de novo no mesmo critério inverte.')
    :'';
}
function desenharChips(){
  const keys=colsData();
  const base=l=>(!SO_ATIVOS||ativoDe(l)!==false);
  const nUrg=(min,max)=>LINHAS.filter(l=>{if(!base(l))return false;const u=urgencia(l,keys);return u!==null&&u>=min&&u<=max;}).length;
  const nFalta=LINHAS.filter(l=>base(l)&&faltando(l).length>0).length;
  const c=(k,rot,n,extra)=>`<button type="button" class="chip ${extra||''} ${FILTRO===k?'on':''}" data-f="${k}">${rot}${n!=null?`<span class="n">${n}</span>`:''}</button>`;
  document.getElementById('chipsSit').innerHTML=
    `<span class="rot">Situação</span>`+
    c('todos','Todos',LINHAS.filter(base).length)+
    c('falta','Faltando dados',nFalta,'falta')+
    c('vencidos','Vencidos',nUrg(-99999,-1),'alerta')+
    c('d30','≤ 30 dias',nUrg(-99999,30))+
    c('d60','≤ 60 dias',nUrg(-99999,60))+
    c('d90','≤ 90 dias',nUrg(-99999,90));
  const d=(k,rot)=>`<button type="button" class="chip ${DOC===k?'on':''}" data-doc="${esc(k)}">${esc(rot)}</button>`;
  /* O "Limpar filtros" agora é fixo no rodapé do painel (#btn-limpar) — não é
     mais um chip que aparece e some no meio dos outros doze. */
  document.getElementById('chipsDoc').innerHTML=
    `<span class="rot">Vencimento</span>`+d('todos','Todos')+DATAS.map(x=>d(x,curto(x))).join('')+
    `<button type="button" class="chip ${SO_ATIVOS?'on':''}" id="chipAtivos">Só ativos</button>`+
    (ESPELHADAS.length?`<button type="button" class="chip ${VER_CADASTRO?'on':''}" id="chipCadastro" title="Vêm do cadastro do cliente — na ficha são só leitura">Dados do cadastro</button>`:'');
  desenharOrdem();
}
/* A contagem em texto é o que permite recolher os chips e os cartões sem esconder
   pendência: os números continuam na primeira linha da tela, filtrada ou não. */
function desenharResumoLista(){
  const el=document.getElementById('resumo-lista');if(!el)return;
  const keys=colsData();
  const base=LINHAS.filter(l=>!SO_ATIVOS||ativoDe(l)!==false);
  const vis=visiveis().length;
  const nUrg=(min,max)=>base.filter(l=>{const u=urgencia(l,keys);return u!==null&&u>=min&&u<=max;}).length;
  const nFalta=base.filter(l=>faltando(l).length>0).length;
  const p=[(vis===base.length?String(base.length):vis+' de '+base.length)+' clientes'];
  if(nFalta)p.push(nFalta+' faltando dados');
  const nVenc=nUrg(-99999,-1); if(nVenc)p.push(nVenc+' vencidos');
  const n30=nUrg(-99999,30);   if(n30)p.push(n30+' vencem em 30 dias');
  el.textContent=p.join(' · ');
}
function redesenhar(){desenharChips();desenharResumo();desenharLista();desenharResumoLista();
  if(FILTROS_UI)FILTROS_UI.atualizarContador();
  sincronizarURL();}
function aplicarBusca(){TETO=PASSO;   // resultado novo, teto novo
  desenharChips();desenharLista();desenharResumoLista();sincronizarURL();}

/* ---------- busca e filtros no endereço (C.10) ----------
   F5 volta para a mesma visão; chave, cod e #hash ficam intactos.
   Senha nunca vai para cá — nem valor, nem coluna (não dá para ordenar por ela). */
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    set('q',TERMO);
    set('f',FILTRO==='todos'?'':FILTRO);
    set('doc',DOC==='todos'?'':DOC);
    set('ativos',SO_ATIVOS?'':'0');
    set('cad',VER_CADASTRO?'1':'');
    set('ord',SORT.key==='urgencia'?'':SORT.key);
    set('dir',SORT.dir==='asc'?'':SORT.dir);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  const f=(p.get('f')||'').trim().toLowerCase();
  FILTRO=FILTROS_OK.indexOf(f)>=0?f:'todos';   // o ?f= que o painel manda continua valendo
  DOC=(p.get('doc')||'todos').trim()||'todos';
  SO_ATIVOS=p.get('ativos')!=='0';
  VER_CADASTRO=p.get('cad')==='1';
  SORT={key:(p.get('ord')||'urgencia'),dir:p.get('dir')==='desc'?'desc':'asc'};
  TERMO=p.get('q')||'';
}
/* Depois que as colunas chegam, o que veio do endereço tem de existir de verdade. */
function validarURL(){
  if(DOC!=='todos'){
    const m=DATAS.filter(x=>normTxt(x)===normTxt(DOC))[0];
    DOC=m||'todos';
  }
  const k=SORT.key;
  /* As chaves da lista (ORD_COLS) valem sempre; um ?ord= antigo apontando para
     uma COLUNA da planilha continua ordenando, desde que ela exista e não seja
     sigilosa — senha nunca entra no endereço. */
  const ok=!!ORD_COLS[k]||(COLUNAS.indexOf(k)>=0&&!ehSigilosa(k));
  if(!ok)SORT.key='urgencia';
  if(!ESPELHADAS.length)VER_CADASTRO=false;
}

/* ---------------- salvar ---------------- */
const SUJOS=new Map();    // id (texto) -> {timer,campos:Set}
/* ---------- o que não gravou (C.3) ----------
   FALHAS = o servidor recusou e o dado só existe na tela. A linha e o campo ficam
   marcados, nasce um "tentar de novo" ali mesmo e fechar a aba pede confirmação. */
const FALHAS=new Map();   // id (texto) -> {campos:Set}
function temPendencia(){return SUJOS.size>0||FALHAS.size>0;}
/* O MESMO indicador em dois lugares: a faixa da barra escura e o rodapé da
   ficha. Quem está com a ficha aberta não vê a barra lá em cima — e é
   justamente ali que se digita. */
function setSave(cl,txt,tit){
  const base='save-status '+(cl||'');
  const barra=document.getElementById('saveStatus');
  if(barra){barra.className=base;barra.textContent=txt||'';barra.title=tit||'';}
  const cad=document.getElementById('saveStatusCad');
  if(cad){cad.className=base+' claro';cad.textContent=txt||'';cad.title=tit||'';}
}
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function marcarFalha(id,falhou){
  const chave=CSS.escape(String(id));
  /* A LINHA continua marcada na lista mesmo com a ficha fechada — é o que
     mostra, de longe, que aquele cliente tem coisa que não gravou. */
  const no=document.querySelector('.cli[data-id="'+chave+'"]');
  if(no)no.classList.toggle('falhou',!!falhou);
  /* A faixa e os campos vivem no .corpo, que hoje é pintado dentro do modal:
     procurar pelo .corpo funciona esteja ele onde estiver (e não existe quando a
     ficha está fechada, que é o caso em que não há o que marcar). */
  const corpo=document.querySelector('.corpo[data-id="'+chave+'"]');
  if(!corpo)return;
  const cx=corpo.querySelector('.ign');
  if(cx){
    const antigo=cx.querySelector('.btn-retry');
    if(falhou&&!antigo)cx.insertAdjacentHTML('beforeend',
      '<button type="button" class="btn-retry" data-retry="'+esc(String(id))+'">não salvou — tentar de novo</button>');
    if(!falhou&&antigo)antigo.remove();
  }
  const f=FALHAS.get(String(id));
  corpo.querySelectorAll('[data-c]').forEach(el=>{
    el.classList.toggle('falhou',!!(falhou&&f&&f.campos.has(el.dataset.c)));
  });
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
window.addEventListener('beforeunload',e=>{if(temPendencia()){e.preventDefault();e.returnValue='';}});
function agendarSalvar(id,coluna,ms){
  const k=String(id);
  let s=SUJOS.get(k);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(k,s);}
  s.campos.add(coluna);
  clearTimeout(s.timer);
  s.timer=setTimeout(()=>salvar(k),ms==null?700:ms);
  setSave('saving','Salvando…');
}
/* Enter não espera o debounce: quem apertou precisa ver o "Salvo ✓" enquanto
   ainda lembra do que digitou. */
function salvarAgora(id,coluna){
  const k=String(id);
  let s=SUJOS.get(k);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(k,s);}
  s.campos.add(coluna);
  clearTimeout(s.timer);
  salvar(k);
}
async function salvar(id){
  const k=String(id);
  const s=SUJOS.get(k); if(!s) return;
  clearTimeout(s.timer);
  SUJOS.delete(k);
  const l=LINHAS.find(x=>String(x.id)===k); if(!l) return;
  const campos={}; s.campos.forEach(c=>campos[c]=b4uParaPlanilha(l.valores[c],c));
  const ign=document.getElementById('ign_'+k);
  try{
    setSave('saving','Salvando…');
    const r=await postAcao({acao:'cert_salvar',id:l.id,campos,
      cliente:l.nome_cliente||'',cod:respAtual()});
    // avisa baixinho se o backend recusou alguma coluna (espelho do Registro)
    const ignoradas=((r&&r.ignoradas)||[]).filter(Boolean);
    FALHAS.delete(k); marcarFalha(k,false);
    setSave('ok','Salvo ✓ '+horaAgora()+(ignoradas.length?' · '+ignoradas.length+' campo(s) só de leitura':''),
      ignoradas.length?('Não gravadas: '+ignoradas.join(', ')):'');
    /* A faixa dentro da ficha diz QUAIS colunas o servidor recusou — o rodapé só
       dá o número, e "1 campo só de leitura" não diz qual foi. */
    if(ign)ign.innerHTML=ignoradas.length?('Não gravei: <b>'+ignoradas.map(esc).join('</b>, <b>')+'</b> — coluna travada ou que não existe mais no cadastro.'):'';
    /* Gravou tudo: o aviso de "tem coisa por gravar" no rodapé da ficha sai, e o
       Fechar volta a ser Fechar. */
    if(!temPendencia()){CAD_AVISADO=false;avisoCad(false);}
    // a contagem da régua também é pendência: gravar um vencimento muda o número
    atualizarLinha(k);
    desenharResumo();desenharChips();desenharResumoLista();
  }catch(e){
    FALHAS.set(k,{campos:s.campos});
    marcarFalha(k,true);
    /* Aviso curto e sem detalhe técnico: o que a pessoa precisa saber é que não
       salvou e que dá para tentar de novo — a linha fica marcada como falha e o
       "tentar de novo" reenvia os mesmos campos. */
    setSave('err','Não foi possível salvar. Tente de novo.');
  }
}
function tentarDeNovo(id){
  const k=String(id), f=FALHAS.get(k); if(!f) return;
  FALHAS.delete(k); marcarFalha(k,false);
  let s=SUJOS.get(k);
  if(!s){s={timer:null,campos:new Set()};SUJOS.set(k,s);}
  f.campos.forEach(c=>s.campos.add(c));
  clearTimeout(s.timer);
  salvar(k);
}
/* Só a LINHA daquele cliente é repintada — nunca a lista inteira: redesenhar
   durante a digitação tiraria o foco de quem está preenchendo a ficha. Como os
   campos vivem no modal e não dentro da linha, repintar aqui não incomoda
   ninguém, e assim CNPJ, vencimentos e situação acompanham a edição. */
function atualizarLinha(id){
  const l=LINHAS.find(x=>String(x.id)===String(id)); if(!l) return;
  const no=document.querySelector('.cli[data-id="'+CSS.escape(String(id))+'"]');
  if(no){
    /* Se o foco estava NA linha (é onde ele volta ao fechar a ficha), ele volta
       para ela depois da repintura: uma gravação que termina meio segundo depois
       não pode jogar quem navega por teclado de volta para o topo da página. */
    const cabeca=no.querySelector('.cli-head');
    const tinhaFoco=!!cabeca&&document.activeElement===cabeca;
    no.innerHTML=cabecaHTML(l);
    if(tinhaFoco){const nova=no.querySelector('.cli-head');if(nova)nova.focus();}
    /* a faixa lateral acompanha a mudança de situação sem redesenhar a lista */
    no.classList.remove('sit-venc','sit-d30','sit-d60','sit-ok','sit-sem','sit-inativo');
    no.classList.add(classeSituacao(l));
  }
  atualizarTopoCad(id);   // e o topo da ficha mostra o nome e a situação novos
}

/* ===================================================================
   A ficha no modal
   -------------------------------------------------------------------
   A lista mostra as colunas que a equipe lê de relance; o resto abre
   aqui, por cima, sem trocar de página. O conteúdo é o MESMO cel() de
   sempre — os quatro tipos de célula, o upload, a etiqueta de prazo —,
   só mudou onde ele é pintado.
   =================================================================== */
let CAD_ID='';           // de quem é a ficha aberta
let CAD_AVISADO=false;   // já avisamos que tem coisa por gravar? (fechar em 2 tempos)
function elCad(){return document.getElementById('modalCad');}
function cadAberto(){const m=elCad();return !!m&&!m.hidden;}
/** Aviso de "tem alteração por gravar" no rodapé; o botão passa a dizer que sai assim mesmo. */
function avisoCad(mostrar){
  const a=document.getElementById('cadAviso');if(a)a.hidden=!mostrar;
  const b=document.getElementById('cadFechar');if(b)b.textContent=mostrar?'Fechar assim mesmo':'Fechar';
}
/** Nome, ID e situação no topo da ficha — acompanham a edição sem redesenhar nada. */
function atualizarTopoCad(id){
  if(!cadAberto()||String(CAD_ID)!==String(id))return;
  const l=LINHAS.find(x=>String(x.id)===String(id));if(!l)return;
  const s=situacaoDe(l),info=SITUACOES[s];
  const t=document.getElementById('cadTitulo');if(t)t.textContent=l.nome_cliente||'(sem nome)';
  const i=document.getElementById('cadId');if(i)i.textContent=l.id;
  const p=document.getElementById('cadSit');

/** Acende na lista a linha da ficha que está aberta. */
function marcarLinhaAberta(){
  document.querySelectorAll('.cli').forEach(n=>n.classList.toggle('aberto',ABERTOS.has(n.dataset.id)));
}
function abrirFicha(id){
  const l=LINHAS.find(x=>String(x.id)===String(id));if(!l)return;
  const m=elCad();if(!m)return;
  CAD_ID=String(l.id);CAD_AVISADO=false;
  document.getElementById('cadBody').innerHTML=corpoHTML(l);
  m.hidden=false;
  /* Enquanto a ficha está aberta a página atrás não rola. */
  document.body.style.overflow='hidden';
  atualizarTopoCad(CAD_ID);
  avisoCad(false);
  ABERTOS.clear();ABERTOS.add(CAD_ID);
  marcarLinhaAberta();
  /* Reabrir não pode apagar o que não gravou: a faixa e o "tentar de novo"
     nascem de novo junto com os campos. */
  if(FALHAS.has(CAD_ID))marcarFalha(CAD_ID,true);
  const cx=m.querySelector('.modal-box');if(cx)cx.focus();
}
/* Grava agora o que estava esperando o debounce. É o salvar() de sempre, só sem
   os 700 ms de espera. */
function descarregarPendentes(){
  Array.from(SUJOS.keys()).forEach(id=>{const s=SUJOS.get(id);if(s)clearTimeout(s.timer);salvar(id);});
}
/* Fechar com alteração por gravar avisa antes, em dois tempos como o resto da
   casa (nunca uma caixa do navegador): o primeiro Fechar/Esc/clique no véu
   explica, o segundo sai. Ao sair assim mesmo a gravação pendente é DESCARREGADA
   na hora — deixar o debounce correndo com a ficha fora da tela é exatamente o
   jeito de perder o que foi digitado. */
function fecharFicha(){
  const m=elCad();if(!m||m.hidden)return;
  if(temPendencia()&&!CAD_AVISADO){CAD_AVISADO=true;avisoCad(true);return;}
  if(SUJOS.size)descarregarPendentes();
  m.hidden=true;
  document.body.style.overflow='';
  const id=CAD_ID;CAD_ID='';CAD_AVISADO=false;
  avisoCad(false);
  ABERTOS.delete(String(id));marcarLinhaAberta();
  document.getElementById('cadBody').innerHTML='';
  /* O foco volta para a linha de onde saiu: quem navega por teclado não é jogado
     de volta para o topo da página. */
  const no=document.querySelector('.cli[data-id="'+CSS.escape(String(id))+'"] .cli-head');
  if(no)no.focus();
}
/* O botão "Salvar alterações" NÃO substitui o autosave: cada edição continua
   chamando agendarSalvar(), e é ele que impede perder texto digitado — foi para
   isso que ele existe nesta tela. O botão ANTECIPA a gravação pendente (mata o
   debounce e salva na hora), reenvia o que falhou e, quando tudo entrou, FECHA a
   ficha: salvar é o gesto de encerrar, e ficar com a ficha aberta depois de
   confirmar faz a pessoa clicar em Fechar sem saber se gravou.

   Só fecha se gravou MESMO. Falha mantém a ficha na tela: fechar por cima de uma
   gravação que não foi levaria embora o aviso e a chance de tentar de novo, e a
   pessoa sairia achando que salvou. */
async function salvarAgoraCad(){
  const id=CAD_ID, btn=document.getElementById('cadSalvar');
  if(temPendencia()){
    if(btn){btn.disabled=true;btn.dataset.rot=btn.textContent;btn.textContent='Salvando…';}
    try{
      /* o que falhou antes volta para a fila de sujos antes do disparo */
      if(id&&FALHAS.has(String(id))){
        const f=FALHAS.get(String(id));
        const su=SUJOS.get(String(id))||{timer:null,campos:new Set()};
        f.campos.forEach(c=>su.campos.add(c));
        SUJOS.set(String(id),su);FALHAS.delete(String(id));
      }
      const ids=Array.from(SUJOS.keys());
      ids.forEach(k=>{const su=SUJOS.get(k);if(su)clearTimeout(su.timer);});
      await Promise.all(ids.map(k=>salvar(k)));
    }catch(e){ /* salvar() já registra a falha em FALHAS e avisa na tela */ }
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.rot||'Salvar alterações';}
  }
  if(temPendencia())return;            // não gravou: a ficha continua aberta
  CAD_AVISADO=false;avisoCad(false);
  fecharFicha();
}

/* Todo campo editável vive dentro do `.corpo` da ficha — não há mais campo
   nenhum na lista, que é só leitura. */
function linhaDo(el){

/* Passa o que está no campo para a linha em memória e reacerta a etiqueta de prazo
   ao lado. É o mesmo caminho para quem sai do campo e para quem dá Enter. */
function aplicarCampo(el){
  if(!el||!el.dataset||!el.dataset.c) return null;
  const l=linhaDo(el); if(!l) return null;
  const c=el.dataset.c;
  l.valores[c]=el.value;
  esquecerBusca(l);
  const cx=el.closest('.dt');
  if(cx){const st=estado(l.valores[c]);cx.className='dt '+st.cl;
    const tag=cx.querySelector('.tag-d');if(tag){tag.className='tag-d '+st.cl;tag.textContent=st.txt;}}
  return {l:l,c:c};
}
document.addEventListener('change',e=>{
  const r=aplicarCampo(e.target); if(!r) return;
  // sair do campo depois do Enter dispara change com o mesmo valor: não grava duas vezes
  if(e.target._jaGravado===e.target.value){e.target._jaGravado=null;return;}
  agendarSalvar(r.l.id,r.c);
});

  }
  const cp=e.target.closest('button[data-copiar]');
  if(cp){

    const txt=String(l.valores[cp.dataset.copiar]||'');

    catch(err){ const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();
      try{document.execCommand('copy');}catch(e2){} t.remove(); }
    const antes=cp.textContent; cp.textContent='✓'; setTimeout(()=>{cp.textContent=antes;},1200);
    return;
  }
  /* Rodapé da ficha: salvar agora, fechar, e o × do topo. Vêm ANTES do teste do

  if(e.target.closest('#cadSalvar')){salvarAgoraCad();return;}
  if(e.target.closest('#cadFechar')||e.target.closest('#fechaCad')){fecharFicha();return;}
  if(e.target.id==='modalCad'){fecharFicha();return;}

  const ord=e.target.closest('.chip[data-s],[data-sort]');

  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto);return;}

/* ---------- Enter grava na hora (C.14) ----------
   Enter continua sendo "gravei, pode sair": mata o debounce e manda na hora, com
   a ficha ainda aberta. O que ele NÃO faz mais é descer para a mesma coluna do
   cliente seguinte — aquilo era digitação em massa direto na grade, e a grade
   acabou: agora cada cliente é uma ficha, e a de baixo nem está na tela. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.ctrlKey||e.metaKey||e.altKey) return;
  const el=e.target;
  if(!el.dataset||!el.dataset.c||el.tagName==='TEXTAREA') return;
  e.preventDefault();
  const r=aplicarCampo(el);
  if(r){ el._jaGravado=el.value; salvarAgora(r.l.id,r.c); }
});
/* Atalhos (C.4): Esc fecha a ficha antes de tudo; depois "/" foca a busca e Esc
   limpa — e nenhum deles atrapalha quem já está digitando num campo. A linha da
   lista é um role="button": sem o Enter e o Espaço daqui, a tela ficaria só para
   o mouse. */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&cadAberto()){e.preventDefault();fecharFicha();return;}
  const linha=e.target&&e.target.closest&&e.target.closest('.cli-head');
  if(linha&&(e.key==='Enter'||e.key===' '||e.key==='Spacebar')){
    e.preventDefault();
    const no=linha.closest('.cli');if(no)abrirFicha(no.dataset.id);
    return;
  }
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';TERMO='';aplicarBusca();}
});
/* Dos cartões de resumo para a linha: acha, destaca e abre a ficha — que é o que
   quem clicou num vencimento veio fazer. */
function irPara(id){
  const alvo=String(id);
  const achar=()=>document.querySelector('.cli[data-id="'+CSS.escape(alvo)+'"]');
  if(!achar()){
    if(!visiveis().some(l=>String(l.id)===alvo)){
      FILTRO='todos';TERMO=alvo;TETO=PASSO;
      const b=document.getElementById('busca');if(b)b.value=TERMO;
    }
    /* O teto não pode esconder justamente a linha para onde estamos indo. */
    const pos=visiveis().findIndex(l=>String(l.id)===alvo);
    if(pos>=TETO)TETO=Math.ceil((pos+1)/PASSO)*PASSO;
    redesenhar();
  }
  const no=achar(); if(!no) return;
  no.scrollIntoView({block:'center',behavior:'smooth'});
  no.classList.add('flash'); setTimeout(()=>no.classList.remove('flash'),1800);
  abrirFicha(alvo);
}

async function carregar(){
  try{
    const d=await jsonp(API_URL+'?tipo=certificados_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro) throw new Error(d.erro);
    COLUNAS=d.colunas||[]; ESPELHADAS=d.espelhadas||[]; EDITAVEIS=d.editaveis||[];
    SIGILOSAS=d.sigilosas||[]; DATAS=d.datas||[]; LINKS=d.links||[];
    LINHAS=(d.linhas||[]).map(l=>Object.assign({valores:{},nome_cliente:'',ativo:''},l));
    LINHAS.forEach(l=>COLUNAS.forEach(c=>{if(l.valores[c]==null)l.valores[c]='';}));
    META=d;
    validarURL();                                  // a visão vem do endereço (C.10)
    mapearColunasLinha();                          // quais colunas a lista mostra
    document.getElementById('app').innerHTML=layout();
    FILTROS_UI=ligarFiltros('certificados',filtrosPainel);   // depois do layout: o painel já existe
    if(d.planilha_url) document.getElementById('plan').href=d.planilha_url;
    const b=document.getElementById('busca');
    b.value=TERMO;
    b.addEventListener('input',e=>{TERMO=e.target.value;aplicarBusca();});
    redesenhar();
    /* A tabela já está pintada: a barra corre até 100% e o overlay sai revelando
       a tela pronta, sem somar espera de verdade. */
    if (window.B4UEspera) B4UEspera.concluir();
  }catch(e){
    /* Uma mensagem só, igual em todo o painel. Aqui saía o texto da exceção mais
       um passo a passo de manutenção (converter .xlsx, conferir a aba de
       configuração, limpar o cache do servidor) — receita para nós, escrita na
       tela de quem só queria ver os certificados. O roteiro continua existindo:
       ele agora fica com quem cuida do sistema, não com quem usa o painel. */
    if (window.B4UEspera) B4UEspera.telaErro(document.getElementById('app'));
    else document.getElementById('app').innerHTML =
      '<div class="state"><h1>Não conseguimos carregar as informações</h1>'
      + '<p>Houve um erro ao recuperar as informações. Tente novamente em alguns '
      + 'minutos. Se o problema continuar, entre em contato com o atendimento.</p></div>';
  }
}
document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());

/* ---------------- menu lateral ----------------
   Montado ANTES de carregar(): a identidade desta tela é a chave, que já está na
   URL desde a primeira linha deste script — não há o que esperar da API. E se a
   busca falhar, o erro pinta dentro do #app com o menu inteiro de pé, que é a
   mesma razão de o erro nunca ser pintado no <body>.
   Sem `contexto`: esta página não sabe o NOME de quem está usando (o `cod` é
   código de log, não nome), e um rótulo inventado seria pior que bloco nenhum.
   Os links levam só a chave, como o logo e o "← Painel" já levavam aqui. */
if (window.B4UShell) {
  B4UShell.montar({
    perfil: 'equipe',
    ativo: 'certificados',
    link: function (pag) { return pag + '?chave=' + encodeURIComponent(chaveAtual()); }
  });
  /* Esta página tem <base target="_blank">, para o colaborador nunca perder a
     tela em que estava ao abrir um documento. O menu lateral segue a MESMA
     regra: o dono decidiu que tudo abre em guia nova, sem exceção, e o próprio
     B4UShell já marca os links do menu com target="_blank" rel="noopener".
     As duas exceções continuam sendo o logo (#logo-home) e o "← Painel"
     (#volta), escritos à mão com target="_self": eles são o gesto de VOLTAR. */
}

lerURL();
carregar();
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador.html') {
        try { href = 'colaborador.html?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador.html'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
