<style>
/* B4U-DESIGN:INICIO — paleta, cantos e fonte que as 22 páginas dividem.
   Bloco copiado de b4u-design.css (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-design.js`.

   Entra ANTES do <style> da página de propósito — é a camada base. Se esta
   página precisar mesmo de um valor diferente, redeclare o token no `:root`
   dela, que vem depois e vence. */
:root{
  /* ── Superfícies ─────────────────────────────────────────────────────────
     `--canvas` é o bege do fundo da página; `--surface` é o branco do cartão
     que se apoia nele; `--surface-warm` é o branco quebrado das faixas e
     cabeçalhos de tabela, que separam sem precisar de borda. */
  --canvas:#F1E7DC;
  --surface:#FFFFFF;
  --surface-warm:#FBF6EF;

  /* ── Letra ───────────────────────────────────────────────────────────────
     `--ink` é o texto normal, `--ink-2` o secundário, `--muted` o rótulo.
     `--muted` já foi #8A7D70 e reprovava em contraste (3,28:1); #6E6256 dá
     4,85:1 no bege e 5,92:1 no branco, e é a cor de quase todo rótulo do
     sistema — por isso ela precisa passar, e não só quase. */
  --ink:#113D39;
  --ink-2:#3F5854;
  --muted:#6E6256;

  /* ── Traços ──────────────────────────────────────────────────────────────
     `--line` divide o que é do mesmo grupo; `--line-2` fecha o que é caixa. */
  --line:#E4D9C9;
  --line-2:#D6C3AC;

  /* ── Marca ───────────────────────────────────────────────────────────────
     `--brand-teal` é canônico em logo, foco, borda e série de gráfico. Como
     TEXTO ele reprova (4,11:1 no branco, 3,44:1 no receita-soft), e para isso
     existe o `--brand-teal-txt`: o mesmo teal escurecido, 5,54:1 no branco e
     4,54:1 no bege, usado só onde é letra ou fundo de letra. Os dois são a
     mesma cor com dois trabalhos. O 4,54:1 passa, mas passa RASPANDO: quem for
     escurecer o `--canvas` um dia tem de conferir este par antes. */
  --brand-dark:#073034;
  --brand-teal:#0F8C85;
  --brand-euc:#3FA680;
  --brand-teal-txt:#0C756F;

  /* ── SINAL: as quatro cores que querem dizer alguma coisa ────────────────
     Estas quatro NÃO seguem o tema (ver OS QUATRO TEMAS, no fim do arquivo). Se
     "vencido" mudasse de vermelho conforme a pele escolhida, a cor deixaria de
     ser informação e viraria decoração — e quem trabalha nesta tela o dia
     inteiro lê a cor antes de ler a palavra.

     `--amber` tem 2,61:1 no branco: serve de PREENCHIMENTO e de borda, nunca de
     letra. Para letra âmbar existe o `--amber-txt` (5,91:1 no branco).

     ┌── PENDÊNCIA CONHECIDA: `--verde` E `--vermelho` REPROVAM COMO LETRA ────┐
     │                                                                        │
     │ Os dois NÃO têm o par `-txt` que o âmbar tem, e são usados nas duas     │
     │ funções ao mesmo tempo:                                                │
     │                                                                        │
     │     --verde     12 usos como `color`, 11 como `background`, 7 em borda │
     │     --vermelho  41 usos como `color`, 31 como `background`, 41 em borda │
     │                                                                        │
     │ E o lado TEXTO reprova. Medido nos valores atuais:                     │
     │                                                                        │
     │     --verde     #2E9D5F   2,82:1 no bege · 3,44:1 no branco   REPROVA  │
     │     --vermelho  #C0392B   4,46:1 no bege · 5,43:1 no branco   raspando │
     │                                                                        │
     │ O mínimo para texto é 4,5:1. É a mesma falha do `--muted` antigo (que   │
     │ dava 3,28:1), e atinge `.hint.ok` e `.lk.ok`, que são letra e nada      │
     │ mais. Há prova de que alguém já tinha esbarrado nisso sem nomear: o     │
     │ `.det-fbtn.ativo` escreve `color:#0E5B37` à mão — um verde bem mais     │
     │ escuro — em vez de usar o token.                                       │
     │                                                                        │
     │ CONSERTO MEDIDO E NÃO APLICADO (decisão de 10/08/2026):                 │
     │                                                                        │
     │     --verde     #2E9D5F -> #1F7546   (2,82:1 -> 4,66:1 no bege)        │
     │     --vermelho  #C0392B -> #BB3728   (4,46:1 -> 4,66:1 no bege)        │
     │                                                                        │
     │ Matiz e saturação ficam onde estão; só a luminosidade desce, o mínimo   │
     │ para passar com folga. Escurecer é seguro pelo lado do FUNDO: TODAS as  │
     │ regras `background:var(--verde)` / `background:var(--vermelho)` já vêm  │
     │ com `color:#fff` (ou são faixa/pontinho sem texto), e fundo mais escuro │
     │ com letra branca só melhora.                                           │
     │                                                                        │
     │ POR QUE NÃO FOI APLICADO AGORA: mexer nestes dois repinta as 22         │
     │ páginas, inclusive as 8 do cliente. A rodada que centralizou os tokens  │
     │ era de ESTRUTURA — nenhum pixel de cor mudou nela de propósito, para    │
     │ que qualquer diferença que aparecesse em produção tivesse uma causa só. │
     │ Trocar cor é decisão de produto e vai junto da varredura do MODO        │
     │ ESCURO, que já vai ter de abrir os 22 arquivos.                         │
     │                                                                        │
     │ QUANDO FOR FAZER, olhe também o `--verde-2`: várias páginas o declaram  │
     │ valendo #25804C, com a nota "o verde um degrau mais escuro, para virar  │
     │ FUNDO de texto branco". Com o conserto acima, o `--verde` do núcleo     │
     │ fica MAIS ESCURO que o `--verde-2`, e a convenção do sufixo -2 se       │
     │ inverte nesse par. Não dá para resolver daqui: o `--verde-2` mora no    │
     │ `:root` de cada página.                                                │
     └────────────────────────────────────────────────────────────────────────┘

     (Escrito assim, sem dois-pontos colado no nome, de propósito: a
     `tokensCanonicos()` do `_aplica-design.js` varre este bloco com um regex de
     declaração e NÃO pula comentário. Nome de token seguido de dois-pontos aqui
     dentro vira token canônico de mentira, e o `--verde-2` de mentira faria as
     22 páginas aparecerem como "exceção mantida" no terminal. Vale para todo
     comentário deste arquivo: cite o token, nunca o escreva como declaração.) */
  --amber:#E8892E;
  --amber-txt:#8A5A10;
  --vermelho:#C0392B;
  --verde:#2E9D5F;

  /* ── Cantos ──────────────────────────────────────────────────────────────
     Uma escala só, no site inteiro, e mais QUADRADA que redonda.
       4px  campo, selo, célula
       6px  cartão, linha da lista, botão
       8px  bloco grande e modal
     `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é citado
     em mais de cem regras, mas o valor acompanha o resto — pílula virou
     etiqueta. Círculo de verdade (avatar, contador, spinner) continua com
     `border-radius:50%` escrito na regra e não passa por aqui. */
  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-pill:6px;

  /* ── Escala tipográfica ──────────────────────────────────────────────────
     Seis degraus, e o pulo entre eles é de propósito irregular: 11-12-13 é a
     faixa de rótulo, selo e nota de rodapé, onde 1px já muda a hierarquia; 15 é
     o corpo; 19 e 24 são título de bloco e de tela. Um degrau constante (1,2×,
     por exemplo) daria 11-13-16-19-23-28 e gastaria três tamanhos na faixa em
     que o olho não distingue nada.
     ATENÇÃO: o `body{font-size:15px}` das páginas está escrito à mão e NÃO sai
     daqui. Quem mexer na escala não muda o corpo do texto; muda só quem usa
     `var(--fs-N)` — que é rótulo, selo, cabeçalho de tabela e título. */
  --fs-1:11px;
  --fs-2:12px;
  --fs-3:13px;
  --fs-4:15px;
  --fs-5:19px;
  --fs-6:24px;

  /* ── Fonte ───────────────────────────────────────────────────────────────
     Montserrat vem do Google Fonts, declarado no <head> de cada página. O
     `system-ui` é o que aparece enquanto ela não chega — e é o que fica se ela
     não chegar nunca. */
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
/* B4U-DESIGN:FIM */
</style>
<style>
:root{
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,37:1 no canvas).
     Este e o mesmo teal escurecido so para letra e fundo de letra; o --brand-teal
     segue canonico em logo, foco, bordas e preenchimentos. */
  --amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber da 2,61:1 com #fff, o --amber-2 da 4,68:1. Como
     preenchimento de barra, icone ou borda, o --amber original continua valendo. */
  --amber-2:#B05F12;
  --verde-2:#25804C;
  /* Levantar de cartao clicavel: uma sombra so, igual em todas as telas. */
  --lift:0 8px 20px rgba(17,61,57,.10);
  /* Tamanhos e o teal claro vem das paginas irmas: a regua de acoes e colada
     literal do contrato, entao os nomes que ela usa tem de existir aqui.
     O --fs-4 entrou com a lista de leitura: e o corpo do NOME do cliente, que
     tem de ser maior que o resto da linha para o olho cair nele primeiro. */
  --receita-soft:#DBEFEC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- barra superior (igual às páginas irmãs) ---------- */
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:var(--radius-pill);white-space:nowrap}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd;white-space:nowrap}
.barra a.volta,.barra a.plan{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.barra a.plan{border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:4px 11px}
.save-status{font-size:13px;font-weight:800;padding:6px 13px;border-radius:var(--radius-pill);background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
/* O MESMO indicador aparece em dois lugares: a faixa da barra escura e o rodape
   da ficha (claro). So o estado neutro precisa de outra tinta — o da barra e
   feito para fundo escuro e sumiria no branco. Vem ANTES dos estados coloridos
   de proposito: mesma especificidade, quem vier depois ganha. */
.save-status.claro{background:var(--surface-warm);color:var(--ink-2)}
/* Branco sobre --amber da 2,61:1 e sobre --verde 3,44:1 — o rotulo do proprio
   status de gravacao some. Um degrau mais escuro na MESMA familia: 4,68:1 e 4,92:1. */
.save-status.saving{background:var(--amber-2);color:#fff}.save-status.ok{background:var(--verde-2);color:#fff}.save-status.err{background:var(--vermelho);color:#fff}

/* ---------- topo: filtros + busca ---------- */
.topo{padding:14px 16px 6px}
.grupo{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grupo .rot{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px;align-self:center}
.chip{font-size:13px;font-weight:700;border-radius:var(--radius-pill);padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--brand-teal)}
.chip.on{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.chip .n{background:rgba(0,0,0,.10);border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.chip.alerta.on{background:var(--vermelho);border-color:var(--vermelho)}
.chip.falta.on{background:var(--amber);border-color:var(--amber)}
/* ---------- ordenacao (regras ORFAS) ----------
   ORDENAR VOLTOU A SER O CABECALHO DA LISTA — ver `.lista-cab button` la embaixo.
   Estas quatro regras sobraram da epoca dos chips "Ordenar por" no painel de
   filtros; nada na pagina usa `.chip .ord` nem `.ord-info` desde entao. Ficam
   escritas so para quem procurar por elas nao pensar que estao valendo. */
.chip .ord{margin-left:5px;font-size:11px;opacity:.9}
.ord-info{font-size:12px;color:var(--muted);font-weight:700}
.ord-info b{color:var(--ink-2)}
.ord-info:empty{display:none}
/* B.7: a busca é a pílula larga da tela. */
.busca{flex:1;min-width:220px;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}

/* ---------- revelacao progressiva ---------- */
/* Régua de ações: busca sempre à mão, filtros a um clique, contagem à vista.
   Antes os doze chips de filtro abriam a tela — quem chegava tinha de ler a
   parede inteira antes de achar o campo de busca, que é o que 9 em 10 usam. */
.barra-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.barra-acoes .campo-busca{flex:1;min-width:200px;font-size:16px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink)}
.barra-acoes .campo-busca:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.btn-filtros{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--ink);font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.btn-filtros:hover{border-color:var(--brand-teal)}
.btn-filtros[aria-expanded="true"]{background:var(--receita-soft);border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.btn-filtros svg{width:15px;height:15px;flex:none}
.cont-filtros{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:var(--radius-pill);background:var(--brand-teal-txt);color:#fff;
  font-size:var(--fs-1);font-weight:800}
/* display:inline-flex ganha do atributo hidden — sem esta linha o selo mostrava
   um "0" permanente ao lado de Filtros. */
.cont-filtros[hidden]{display:none}
.resumo-lista{font-size:var(--fs-3);color:var(--ink-2);white-space:nowrap}
/* ---------- régua de filtros ----------
   O mesmo desenho da tela de Tarefas Daily, que virou o padrão da casa: busca
   larga à esquerda e listas suspensas ao lado, todas visíveis de uma vez. Antes
   era um botão "Filtros" abrindo um painel com doze chips — dois cliques para
   ver o que agora está à mostra, e um estado a mais para a pessoa lembrar.

   A CONTAGEM não se perdeu na troca: ela saiu do chip e entrou no RÓTULO da
   opção ("Vencidos · 12"). Era a única informação que os chips davam e a lista
   não daria de graça, e sem ela a troca teria sido um retrocesso disfarçado de
   arrumação. */
.topo{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:14px 16px 4px}
select.filtro{font-family:var(--sans);font-size:var(--fs-3);color:var(--brand-teal-txt);
  background:var(--surface);border:1px solid var(--brand-teal);border-radius:var(--radius-pill);
  padding:9px 13px;cursor:pointer;font-weight:700;max-width:100%;min-width:0;text-overflow:ellipsis}
select.filtro:focus{outline:2px solid var(--brand-teal);outline-offset:-1px}
/* Filtro que ESCONDE linha se anuncia: âmbar, para "estou vendo tudo?" ter
   resposta sem abrir nada. O estado neutro fica no teal de sempre. */
select.filtro.corta{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-txt)}
/* ── os dois botões de dois estados da régua ──────────────────────────────────
   "Com pendências" e "Dados do cadastro" respondem SIM ou NÃO. Um <select> de
   duas opções para uma pergunta de sim ou não custa dois toques, esconde metade
   da resposta dentro dele e ainda deixa a dúvida de qual das duas é a ligada; o
   botão diz o estado na cara e muda com um toque.
   38px é a altura da régua (a mesma do .btn-limpar, do select.filtro do modo de
   queda e do botão do b4u-filtro.js) — botão mais alto que os vizinhos quebraria
   a linha da régua sozinho. */
.f-tog{font-family:inherit;font-size:var(--fs-3);font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;min-height:38px;min-width:0;max-width:100%;
  border:1px solid var(--brand-teal);color:var(--brand-teal-txt);background:var(--surface);
  border-radius:var(--radius-pill);padding:0 13px;line-height:1.2;text-align:left}
.f-tog:hover{border-color:var(--brand-teal-txt)}
.f-tog:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.f-tog[hidden]{display:none}
.f-tog .n{flex:none;font-weight:800;font-variant-numeric:tabular-nums}
/* Ligado e ESCONDENDO linha: âmbar, a mesma cor com que o select.filtro.corta
   avisava "não é tudo o que existe". */
.f-tog[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-txt)}
/* Ligado e MOSTRANDO mais coluna: não esconde nada de ninguém, então não é
   alarme — é o teal cheio de "está ligado". */
.f-tog.mostra[aria-pressed="true"]{background:var(--brand-teal);border-color:var(--brand-teal);color:#fff}
/* A contagem no rótulo da opção do b4u-filtro.js ("Vencidos · 12"). Era a única
   informação que os chips davam e a lista não dá de graça. Ela é escrita no DOM
   do painel DEPOIS que o componente o montou, e não dentro do texto do item, de
   propósito: mudar o texto do item obriga a remontar o painel a cada clique, e
   remontar com ele aberto apaga o foco de quem está marcando várias coisas
   seguidas — justo no controle que existe para isso. Se a marcação do componente
   mudar um dia, some a contagem e mais nada. */
.b4f-li .f-n{flex:none;margin-left:auto;padding-left:10px;font-size:var(--fs-1);font-weight:700;
  color:var(--muted);font-variant-numeric:tabular-nums}
.b4f-li .f-n.zero{opacity:.45}
.painel-filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
  padding:14px 16px;margin:0 0 14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-warm)}
.painel-filtros[hidden]{display:none}
/* Cada grupo de chips ocupa a fileira inteira: Situação e Vencimento não se misturam. */
.painel-filtros .grupo{width:100%}
.btn-limpar{min-height:38px;padding:0 15px;border-radius:var(--radius-pill);border:1px dashed var(--line-2);
  background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:var(--fs-2);cursor:pointer}
.btn-limpar:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
/* A contagem desta tela tem quatro números; no celular ela precisa quebrar, senão
   o nowrap do contrato empurra a página para o lado. */
@media(max-width:560px){.resumo-lista{white-space:normal}}
.lista-mais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.lista-mais button{min-height:44px;padding:0 18px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--brand-teal-txt);
  font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.lista-mais button:hover{border-color:var(--brand-teal);background:var(--receita-soft)}
.lista-mais .btn-todos{background:transparent;color:var(--ink-2);font-weight:600}
/* Quanto da lista está desenhado. Vazio quando tudo cabe no teto — sem linha à toa. */
.dica{font-size:var(--fs-2);color:var(--muted);padding:8px 16px 0}
.dica:empty{display:none}

/* ---------- cards de resumo ---------- */
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:0 16px 12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.rhead{padding:9px 13px;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff}
.rcard.vencidos .rhead{background:var(--vermelho)}
.rcard.d30 .rhead{background:var(--amber)}
.rcard.d60 .rhead{background:var(--brand-teal-txt)}
.rcard.falta .rhead{background:#6B8486}
.rhead .n{background:rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:2px 9px;font-size:11px}
/* 5px de folga em cima + 5 linhas de 30px: a caixa termina exatamente onde uma
   linha termina. Antes a sexta aparecia pela metade, atravessada pela borda do
   cartão, e parecia defeito de dado — quem via achava que o nome do cliente
   estava cortado na planilha. A folga de baixo só aparece no fim da rolagem. */
.rlista{max-height:155px;overflow:auto;padding:5px 5px 9px}
/* Altura fixa de 30px: com align-items:baseline a linha media 30,5px e sobrava
   meia linha aparecendo embaixo. É deste 30 que sai o múltiplo do max-height. */
.tk{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;font-family:var(--sans);font-size:12px;line-height:1.5;height:30px;
  border:0;background:transparent;color:inherit;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer}
.tk:hover{background:var(--surface-warm)}
.tk .d{font-weight:800;white-space:nowrap;color:var(--ink)}
.tk .lb{color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .tp{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.rvazio{color:var(--muted);font-size:12px;padding:9px}

/* ---------- a lista: só leitura, uma linha por cliente ----------
   A grade de 17 colunas com campo em cada célula acabou: "a lista fica limpa e
   ninguém altera sem querer". Aqui só se LÊ — nenhum input, select ou textarea
   dentro da linha —, e toda a edição acontece no modal que a linha abre.
   Seis colunas por linha (ID · Cliente · CNPJ · Venc. do certificado digital ·
   Venc. das procurações · Situação) e o resto da ficha no modal.
   NÃO é <table> de propósito: a grade do CSS convive com os cartões de resumo
   que já existem aqui, e a tabela obrigava as duas colunas presas, a rolagem
   lateral e o cabeçalho de dois andares — que era justamente o que ninguém
   entendia. O cabeçalho (.lista-cab) repete a MESMA régua de colunas; as duas
   larguras moram na mesma regra para não desalinharem quando alguém mexer. */
.lista{padding:12px 16px 48px;display:flex;flex-direction:column;gap:8px}
.cli{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cli.aberto{border-color:var(--brand-teal);box-shadow:0 5px 20px rgba(7,48,52,.10)}
/* Situação do cliente: faixa lateral colorida para bater o olho na lista e ver
   na hora quem precisa de ação — sem precisar abrir a ficha. Só o que cobra
   ganha cor: quem está em dia não precisa de faixa nenhuma. */
.cli.sit-venc,.cli.aberto.sit-venc{border-left:4px solid var(--vermelho)}
.cli.sit-d30,.cli.aberto.sit-d30{border-left:4px solid var(--amber)}
.cli.sit-sem,.cli.aberto.sit-sem{border-left:4px solid var(--line-2)}
.cli.sit-inativo,.cli.aberto.sit-inativo{border-left:4px solid var(--muted)}
.lista-cab,.cli-head{display:grid;
  /* O nome é o que a pessoa procura na lista, e era o primeiro a ser cortado —
     "AJUB - Cirurgia de Cab…" não identifica ninguém. Ele leva o maior peso; as
     colunas de data cedem, porque ali o corte já é explícito, com o "+N". */
  grid-template-columns:60px minmax(0,2.6fr) 136px minmax(0,1.15fr) minmax(0,1.15fr) minmax(0,142px);
  gap:12px;align-items:center}
.lista-cab{padding:2px 14px 0;font-size:var(--fs-1);font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted)}
/* O cabeçalho ORDENA, e desde que o <select id="f-ord"> saiu da régua ele é o
   ÚNICO jeito de ordenar: cada rótulo é um botão de verdade (Tab chega nele,
   Enter e Espaço ordenam). Abaixo de 900px ele não some — vira a barra de
   ordenação (ver a regra lá embaixo). */
.lista-cab button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  text-transform:inherit;letter-spacing:inherit;text-align:inherit;
  /* Alvo de 44px. Era aceitável ter 13px de altura enquanto o cabeçalho era o
     atalho de quem já sabia e a lista "Ordenar por" da régua respondia por
     todo mundo; agora ele é o ÚNICO jeito de ordenar. */
  display:inline-flex;align-items:center;min-height:44px}
.lista-cab button:hover{color:var(--brand-teal-txt)}
.lista-cab button:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:var(--radius-sm)}
/* A seta (▲/▼) é o indicador de direção; a coluna ativa também muda de cor para
   não depender só dela — e o aria-sort no <span role="columnheader"> diz o mesmo
   para quem não vê a tela. */
.lista-cab [aria-sort] button{color:var(--brand-teal-txt)}
/* Dois rótulos por título: o longo, que a grade comporta, e o CURTO, que faz a
   barra de ordenação do celular caber em duas fileiras em vez de três. Só um
   deles está na tela por vez, e `display:none` também tira do nome acessível —
   é por isso que são dois <span> e não um `content:attr()` de CSS, que deixaria
   o leitor de tela lendo os dois. O title do botão traz sempre o nome longo. */
.lista-cab .cab-sm{display:none}
.cli-head{width:100%;text-align:left;background:none;border:0;padding:12px 14px;
  cursor:pointer;font-family:var(--sans);color:inherit}
.cli-head:hover{background:var(--surface-warm)}
/* O .cli tem overflow:hidden e o contorno global (offset 2px) sairia cortado na
   borda do cartão: aqui ele entra para dentro, senão o foco de teclado some. */
.cli-head:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.c-id{font-size:var(--fs-2);font-weight:700;color:var(--muted);white-space:nowrap}
.c-nome{font-weight:600;font-size:var(--fs-4);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-doc{font-size:var(--fs-3);color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Documento e data em algarismo de largura fixa: uma coluna de CNPJ desalinhado
   é justamente o que se lê errado quando se confere um cadastro atrás do outro. */
.c-doc,.c-data{font-variant-numeric:tabular-nums}
.c-data{font-size:var(--fs-3);color:var(--ink-2);display:flex;align-items:center;gap:6px;min-width:0}
/* Só a DATA encolhe: a etiqueta de prazo ao lado dela nunca é cortada. O
   min-width:0 na etiqueta desfaz os 44px que ela tem na ficha (lá ela alinha uma
   coluna de campos); na linha ela ocupa só o que a palavra pede, e é isso que
   sobra de largura para a data ao lado entre 900 e 1200px. */
.c-data .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-data .tag-d{min-width:0}
/* Sem max-width e sem reticências, de propósito: etiqueta cortada ("venci…") não
   diz prazo nenhum, e era pior que mostrar uma a menos. Quem manda no corte é a
   CONTAGEM, que sempre sobra num "+N" honesto. */
.c-tag{font-size:var(--fs-1);font-weight:700;color:var(--ink-2);background:var(--surface-warm);
  border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 8px;
  white-space:nowrap;flex-shrink:0}
.c-tag.mais{background:transparent;border-style:dashed;color:var(--muted)}
.c-fim{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
/* Coluna em branco continua dizendo o NOME do que falta ("sem CNPJ", "sem data")
   em vez de um vazio mudo — é o sinal de tarefa que a grade sempre deu. Classe
   própria: o `.vazio` da lista sem resultado tem 15px e padding de 30px. */
.c-falta{font-size:var(--fs-2);color:var(--muted);font-weight:600;white-space:nowrap}
/* Abaixo de 1180px as seis colunas não cabem lado a lado: nome e situação ficam
   na primeira linha da MESMA faixa e o resto desce para uma segunda, menor.
   Continua sendo uma linha clicável só — não vira dois cartões.
   O corte é MAIS ALTO que o das telas irmãs (900px) por causa das duas colunas
   de vencimento: cada uma leva uma data E a etiqueta de prazo ao lado, e a data
   é o tipo de informação que não sobrevive a reticências — "2…" e "21/0…" não
   dizem prazo nenhum, dizem defeito. Com o menu lateral ocupando 264px, um
   monitor de 1100px já cai nessa faixa. Abaixo de 900px, como manda o contrato,
   continua sendo duas linhas. */
@media(max-width:1180px){
  /* O cabeçalho para de ser régua de colunas e vira a BARRA DE ORDENAÇÃO. Ele
     sumia aqui (display:none) porque a linha deixa de ser uma grade — e podia
     sumir, porque os mesmos critérios estavam na lista "Ordenar por" da régua.
     Essa lista saiu, a pedido do dono; se o cabeçalho sumisse junto, ordenar
     teria acabado no celular, que é onde esta tela é usada de pé. Mesma
     marcação, outro arranjo.
     Uma TIRA QUE ROLA DE LADO, e não uma fileira que quebra: em pé, com sete
     critérios, o embrulho comia 150px de altura antes da primeira linha da
     lista — a tela abria mostrando o cabeçalho em vez do primeiro cliente. É o
     mesmo gesto (e o mesmo desenho) que o societario-equipe.html usa.
     O rótulo "Ordenar" na frente existe para a tira não ser lida como mais uma
     fileira de filtros: sem ele, "ID · Cliente · CNPJ" logo abaixo de três
     caixas de filtro é exatamente o que parece. */
  .lista-cab{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;padding:0 14px 8px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .lista-cab::-webkit-scrollbar{display:none}
  /* O rótulo ROLA junto, e não fica grudado na borda: preso, ele fica por CIMA do
     botão que passa por baixo e a tira exibe "Ordenar" ao lado de meia palavra
     ("…ções"), que lê como defeito. Solto, ele sai de cena quando a pessoa rola —
     e volta no primeiro gesto para a direita. É o mesmo desenho do
     societario-equipe.html. */
  .lista-cab::before{content:"Ordenar";flex:none;padding-right:4px;
    color:var(--muted);white-space:nowrap;text-transform:none}
  /* O text-align:right que a coluna Situação carrega só faz sentido dentro da
     grade; aqui ele deixaria um botão solto na ponta da tira. */
  .lista-cab>span{flex:none;min-width:0;text-align:left!important}
  .lista-cab button{min-height:44px;padding:0 12px;border:1px solid var(--line);
    border-radius:var(--radius-pill);background:var(--surface);color:var(--ink-2);
    font-size:var(--fs-2);font-weight:700;text-transform:none;letter-spacing:0;
    white-space:nowrap}
  .lista-cab .cab-lg{display:none}
  .lista-cab .cab-sm{display:inline}
  .lista-cab [aria-sort] button{border-color:var(--brand-teal);background:var(--surface-warm);
    color:var(--brand-teal-txt)}
  .cli-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  /* Quebra forçada: sem ela o "resto" subiria para a primeira linha sempre que sobrasse espaço. */
  .cli-head::after{content:"";order:3;flex:0 0 100%;height:0}
  .c-nome{order:1;flex:1 1 auto}
  .c-fim{order:2;flex:none;flex-direction:row;align-items:center;gap:6px}
  .c-id,.c-doc,.c-data{order:4;flex:0 1 auto;font-size:var(--fs-2);color:var(--muted);text-align:left}
}
/* Selo de situação da linha: Vencido (vermelho) · Vence em 30 dias (âmbar) ·
   Vence em 60 dias (teal) · Vence em 90 dias e Em dia (verde) · Sem data (cinza)
   · Inativo. É a última coluna da linha, e responde "preciso agir neste
   cliente?".
   O degrau de 90 dias veste o MESMO verde do "Em dia" — como na tela irmã: aos
   90 dias ninguém precisa agir hoje, e uma quarta cor no meio da régua faria a
   lista parecer mais alarmada do que é. Quem muda é o texto, que é o que se lê. */
.pill{font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap;letter-spacing:.2px;border:1px solid transparent}
.pill.sit-venc{background:#F7E2DF;color:#8E2A1D;border-color:var(--vermelho)}
.pill.sit-d30{background:var(--amber-soft);color:#8A4B12;border-color:var(--amber)}
.pill.sit-d60{background:#E1F0EE;color:#0b6c66;border-color:#BBDCD8}
.pill.sit-d90,.pill.sit-ok{background:#E6F3EC;color:#1f6b45;border-color:#BFE0CD}
.pill.sit-sem{background:#EEE9E2;color:var(--muted);border-color:var(--line)}
.pill.sit-inativo{background:#EEE9E2;color:var(--muted);border-color:var(--line-2)}
.vazio{padding:30px 16px;text-align:center;color:var(--muted);font-size:15px}
@keyframes fl{0%{background:#FFE79A}100%{background:transparent}}
.flash{animation:fl 1.8s ease}

/* ---------- campos da grade ---------- */
input[type=text],input[type=date],input[type=password]{font-family:var(--sans);font-size:12px;padding:6px 8px;border:1px solid var(--line-2);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--brand-teal);outline-offset:0}
.ro{padding:6px 8px;font-size:12px;color:var(--muted);background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.02) 6px,rgba(0,0,0,.02) 12px);
  border:1px dashed var(--line-2);border-radius:var(--radius-sm);white-space:normal;word-break:break-word}
.dt{display:flex;align-items:center;gap:4px;min-width:186px}
.dt input{flex:1;min-width:104px}
/* A data deixou de ser centralizada: aquilo existia para as datas caírem na
   mesma prumada NA COLUNA da grade. Dentro da ficha o campo ocupa a largura
   toda ao lado do rótulo, e centralizar só afastava o número do nome do campo. */
.tag-d{flex:none;font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:3px 7px;white-space:nowrap;min-width:44px;text-align:center}
.tag-d.vazio{background:var(--amber-soft);color:var(--amber-txt)}
.tag-d.na{background:#EEE9E2;color:var(--muted)}
.tag-d.venc{background:#F7DFDC;color:var(--vermelho)}
.tag-d.d30{background:#FCEFE0;color:var(--amber-txt)}
.tag-d.d60{background:#E1F0EE;color:#0b6c66}
.tag-d.d90,.tag-d.ok{background:#E6F3EC;color:#1f6b45}
.dt.venc input[type=date]{border-color:var(--vermelho)}
.dt.d30 input[type=date]{border-color:var(--amber)}
.sig{display:flex;align-items:center;gap:4px;min-width:158px}
/* ---------- coluna de LINK: campo de URL + atalho para abrir ---------- */
.lk-cel{display:flex;align-items:center;gap:4px;min-width:190px}
/* Dentro da célula de documento aberta, o campo de endereço divide a fileira com
   "Enviar outro arquivo" e o ✕. Sem o flex-grow ele ficava nos 190px mínimos e
   uma URL do Drive aparecia pela metade, que é o que se veio conferir. */
.doc .lk-cel{flex:1 1 240px}
.lk-cel input,.lk-cel .ro{flex:1;min-width:110px}
.lk-ir{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  font-size:13px;font-weight:800;line-height:1;text-decoration:none;border:1px solid var(--line-2);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--brand-teal-txt)}
.lk-ir:hover{border-color:var(--brand-teal);background:#EAF5F4}
/* Sem URL válida o atalho fica apagado e não clica — não abre guia em branco. */
.lk-ir.off{color:var(--line-2);border-style:dashed;background:transparent;cursor:default}

/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:var(--radius-pill);padding:12px 20px}
/* Densidade da grade: cabe ao lado de um campo sem empurrar a coluna. */
.btn--micro{padding:5px 7px;font-size:11px;line-height:1;flex:none;white-space:nowrap}
.btn.modo{color:var(--muted);border-style:dashed;font-weight:800}
.btn.modo:hover{border-style:solid;color:var(--brand-teal-txt)}

/* ---------- estados ---------- */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:48vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:60ch}
.state code{background:var(--surface-warm);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.state ol{text-align:left;color:var(--ink-2);font-size:13px;max-width:60ch;line-height:1.7;padding-left:20px}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* O título NÃO some mais no telefone: o dono pediu a mesma barra em todas as
   telas da equipe — título e quem está usando, e só. Ele cabia mal quando a
   barra ainda carregava contador, "Planilha ↗" e "← Painel"; hoje esses três
   saem da vista pela folha do b4u-shell.js e sobra espaço de sobra. */
@media(max-width:720px){.resumo{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}

/* ---------- explicacao recolhida (C.2) ----------
   O dado vem primeiro; a instrucao fica a um clique e lembra a escolha. */
/* Os quatro cartões de exemplo continuam inteiros, só que a um clique de
   distância: a CONTAGEM deles já está na régua, então nada de pendência some. */
details.situacao>summary{padding:10px 13px;font-size:13px}
details.situacao>.resumo{padding:0 12px 12px}
/* ---------- o que nao gravou (C.3) ----------
   A linha (ou o campo) fica marcada e o "tentar de novo" nasce ali mesmo. */
.falhou{outline:2px solid var(--vermelho);outline-offset:-2px}
.cli.falhou{background:#FBEAE7}
.btn-retry{display:block;margin-top:4px;font-family:var(--sans);font-size:11px;font-weight:800;cursor:pointer;
  border:1px solid var(--vermelho);background:var(--vermelho);color:#fff;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap}
.btn-retry:disabled{opacity:.6;cursor:default}
/* O painel passou a ter TRES estados de gravacao, nao dois: gravou, nao gravou e
   NAO SEI. O terceiro nao pode usar o mesmo selo do segundo — o .btn-retry diz
   "nao salvou" e convida a repetir, e nesta hora ninguem sabe se a gravacao
   aconteceu. Repetir uma gravacao que talvez tenha ido e o estrago que este
   caminho todo existe para evitar. Por isso a duvida tem selo proprio: cor de
   aviso, nao de erro, e sem botao nenhum para clicar. */
.ign-duvida{display:block;margin-top:4px;font-family:var(--sans);font-size:11px;font-weight:800;
  color:var(--amber-2);background:var(--amber-soft);border:1px solid var(--amber-line);
  border-radius:var(--radius-pill);padding:2px 9px}
/* ---------- padroes compartilhados (B.10 e B.12) ---------- */
/* Foco de teclado sempre visivel — quem navega por Tab precisa ver onde esta. */
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}
/* A barra nunca estoura: quebra de linha e o contador some no celular. */
.barra{flex-wrap:wrap}
@media(max-width:560px){.barra .cnt{display:none}}
/* ---- coluna de documento (Abrir / Enviar) ----
   O endereço cru saiu da tela: quem trabalha aqui quer ABRIR o documento ou

<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a
   célula tem ponto e barra, o Sheets desiste e guarda texto.
   Onde não existe máscara canônica (telefone, inscrição), o valor vai como foi
   digitado: o conserto ali depende do patch do backend. */
function b4uParaPlanilha(valor,coluna){
  const s=b4uTexto(valor).trim();
  const t=b4uIdent(coluna);
  if(!s||!t||!/^\d+$/.test(s))return s;
  const d=b4uDigitos(s);
  if((t.tipo==='doc'||t.tipo==='cnpj')&&d.length===14)return b4uFmtDoc(d);
  if((t.tipo==='doc'||t.tipo==='cpf')&&d.length===11)return b4uFmtDoc(d);
  if(t.tipo==='cep'&&d.length===8)return b4uFmtCep(d);
  return s;
}
/* B4U-TEXTO:FIM */
</script>

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
/* A chave da equipe não é mais fixa: é o código do dia de cada colaborador
   (aba "Colaboradores" da planilha de Contatos), que chega por e-mail no
   index.html. Esta constante ficou vazia de propósito — se voltar a ter valor,
   volta a existir uma senha compartilhada que não expira e não diz quem é quem. */
const CHAVE_PADRAO = '';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}

/* Sem chave na URL não há painel da equipe. A porta é o index.html: a pessoa
   digita o e-mail, recebe o código do dia e volta para CÁ — é para isso que
   serve o `destino`, senão todo login despejaria a pessoa na home da equipe,
   longe do que ela tinha clicado.
   Até 04/08/2026 existia uma chave fixa antiga escrita aqui como padrão: quem
   abrisse a página sem chave nenhuma entrava assim mesmo, sem se identificar.
   A string não se repete neste arquivo de propósito — ele é servido ao
   navegador, e comentário vaza igual a código. */
if (!chaveAtual()) {
  location.replace('index?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash.
// Vira a coluna "Colaborador" da aba log.
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;
  try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* ---------- busca que entende CNPJ com e sem pontuação (C.1) ---------- */
function soDigitos(s){return b4uDigitos(s);}
/** Compara o texto normalizado e, quando o termo tem 6 dígitos ou mais, também
 *  só os dígitos dos dois lados. */
function casaBusca(alvoTxt,alvoDig,termo){
  const t=normTxt(termo);
  if(!t)return true;
  if(alvoTxt.indexOf(t)>=0)return true;
  const d=soDigitos(termo);
  return d.length>=6&&alvoDig.indexOf(d)>=0;
}
/** Lembra no navegador se a explicação fica aberta — a escolha é de quem usa. */
function ligarDetalhes(el,chave){
  if(!el)return;

  el.addEventListener('toggle',()=>{try{localStorage.setItem(chave,el.open?'1':'0');}catch(e){}});

/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Vazia de propósito. Ela existia só para trocar o texto da espera por frases que
   falavam em lentidão e em nova tentativa — quem lia aquilo entendia "vai dar
   errado" e recarregava a página bem quando a resposta já vinha chegando. Quem
   cuida do que a pessoa lê enquanto espera agora é o b4u-espera.js. A função fica
   no lugar porque é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
   de espera continua correndo por cima durante a segunda tentativa — de propósito:
   a pessoa não precisa saber que houve retentativa, só que ainda estamos
   trabalhando. Erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
/* O JSONP sempre teve teto; o POST não tinha. Uma resposta perdida no meio de um
   corpo de ~13 MB deixava a promise pendurada para sempre: spinner eterno na
   célula (que sobrevive a filtro e ordenação) e o aviso de "sair sem salvar"
   pedindo confirmação até o F5. Agora há prazo, e quem estourar sabe. */
async function postAcao(obj,ms){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),ms||120000);
  try{
    /* O `JSON.stringify` mora DENTRO do try: fora dele, um valor circular ou um
       getter que estoura sairia sem marca nenhuma — nem `doServidor` nem
       `incerto` — e quem lê a exceção lá na frente não teria como saber que ela
       nunca chegou a virar requisição. */
    const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ctl.signal});
    const d=await r.json();
    /* Erro que o SERVIDOR mandou: ele processou, decidiu e recusou. É o único
       caso em que dá para garantir que não gravou. */
    if(d&&d.erro){ const err=new Error(d.erro); err.doServidor=true; throw err; }
    return d;
  }catch(e){
    /* ---------- "não salvou" é uma AFIRMAÇÃO, e o front não tem como fazê-la ----------
       O servidor GRAVA e só depois responde. Quando a resposta se perde, a
       gravação já aconteceu — e há quatro jeitos de isso ocorrer: o prazo
       estourar, o `r.json()` topar com uma página HTML (cota, tela de
       autorização), o 302 do /exec para o googleusercontent falhar, ou a aba ser
       suspensa com a requisição em voo.
       Em todos, a planilha está certa e a tela dizia "Não foi possível salvar".
       A equipe aprendeu a desconfiar do painel por causa disso.
       Agora a exceção carrega `.incerto`: só o erro VINDO DO SERVIDOR é falha de
       verdade; o resto é silêncio, e silêncio não é resposta. */
    if(e&&e.name==='AbortError'){ const x=new Error('A resposta demorou.'); x.incerto=true; throw x; }
    if(e&&e.doServidor) throw e;
    const x=new Error(String((e&&e.message)||e)); x.incerto=true; throw x;
  }finally{ clearTimeout(t); }
}

/* ---------------- releitura de confirmação ----------------
   `incerto` quer dizer "não sei", e "não sei" é o pior recado que um painel pode
   dar a quem acabou de digitar. Só existe um jeito de saber: PERGUNTAR DE NOVO.
   E perguntar é uma LEITURA — não repete a gravação, não cria nada, não duplica
   documento nenhum. Por isso ela pode rodar sozinha, sem pedir licença.

   Duas escolhas que sustentam a conferência:

   • Compara pelo MESMO funil que converteu o valor na ida (`b4uParaPlanilha`).
     Comparar o que a planilha devolve com o que a tela mostra acusaria diferença
     de MÁSCARA — "00.623.904/0001-73" contra "00623904000173" — como se fosse
     falta de gravação, e a conferência viraria mentira ao contrário.

   • Nada do que volta é pintado. A ficha continua exatamente como está: quem
     está digitando não pode ver o próprio texto ser trocado por causa de uma
     conferência que ele não pediu e não vê acontecer.

   Não existe rota de leitura por linha — esta página tem uma leitura só, a de
   bloco. `relerLinha` é o ponto único onde isso está escrito: no dia em que o
   backend ganhar um `tipo=certificados_linha&id=`, muda esta função e mais nada. */
const CONF_ESPERA=3000;   // o servidor grava DENTRO do lock: perguntar antes de ele soltar devolve o valor velho
/* Teto da conferência. O `jsonp()` desta página tem prazo de 45 s e AINDA repete
   uma vez depois de 4 s de pausa: no pior caso a pergunta levaria mais de um
   minuto e meio, com a faixa dizendo "conferindo se gravou…" o tempo todo. Passou
   de 25 s, a conferência desiste e vira dúvida — que é a resposta honesta, e é o
   mesmo que ela diria depois de esperar mais um minuto. */
const CONF_TETO=25000;
function comTeto(p,ms){return Promise.race([p,new Promise((_,f)=>setTimeout(()=>f(new Error('a conferência demorou')),ms))]);}
let CONF_N=0;                 // numera as gravações
const CONF_SEQ=new Map();     // id → número da última gravação disparada nesta linha
function esperaMs(ms){return new Promise(r=>setTimeout(r,ms));}
async function relerLinha(id){
  const d=await jsonp(API_URL+'?tipo=certificados_equipe&chave='+encodeURIComponent(chaveAtual()));
  if(!d||d.erro) throw new Error(String((d&&d.erro)||'releitura vazia'));
  const l=(d.linhas||[]).find(x=>String(x.id)===String(id));
  if(!l) throw new Error('linha não encontrada na releitura');
  return l.valores||{};
}
/* 'bateu' | 'nao-bateu' | 'nao-sei'.
   NUNCA devolve 'bateu' por falta de informação: releitura que falhou é dúvida,
   não é confirmação. Um "Salvo ✓" errado custa mais caro que a dúvida. */
async function conferirGravacao(id,campos){
  try{
    await esperaMs(CONF_ESPERA);
    const v=await comTeto(relerLinha(id),CONF_TETO);
    /* Coluna que a releitura NÃO devolve (sumiu do cabeçalho da planilha depois
       da carga, ou o backend deixou de mandá-la) não é prova de nada: ela viraria
       '' contra o valor mandado e derrubaria a conferência de uma gravação que
       pode ter sido perfeita. Fica de fora — e se não sobrar nenhuma coluna
       comparável, o veredicto é dúvida, porque vazio não confirma. */
    const cols=Object.keys(campos).filter(c=>Object.prototype.hasOwnProperty.call(v,c));
    if(!cols.length) return 'nao-sei';
    const igual=c=>String(b4uParaPlanilha(v[c]==null?'':v[c],c)).trim()
                  ===String(campos[c]==null?'':campos[c]).trim();
    return cols.every(igual)?'bateu':'nao-bateu';
  }catch(_){ return 'nao-sei'; }
}

let LINHAS=[], COLUNAS=[], ESPELHADAS=[], EDITAVEIS=[], SIGILOSAS=[], DATAS=[], LINKS=[], META={}, GRUPOS=[];
/* ---------------- os filtros, em listas ----------------
   Três caixas de seleção múltipla e dois botões de dois estados, e por isso três
   LISTAS e dois booleanos onde antes havia palavras soltas. A escolha única
   respondia "vencidos OU faltando dados"; a régua nova responde "vencidos E
   vencendo em 30, dos ativos e dos inativos, e só quem tem pendência" — que é a
   pergunta que alguém faz de verdade antes de sentar para trabalhar a lista. */
/* Os três estados que a coluna "Ativo?" produz. O `?` é a linha que não diz nem
   sim nem não, e ela SEMPRE passou: o "só clientes ativos" de antes escondia
   apenas quem estava marcado como inativo. Por isso ela nasce marcada junto do
   `sim` — e por isso ela é um item de verdade na caixa, e não uma exceção
   escondida no código: sem item, o "Todos / Nenhuma" a apagaria calado. */
const ATIVO_ITENS=[{v:'sim',r:'Ativos'},{v:'nao',r:'Inativos'},{v:'?',r:'Não informado'}];
const ATIVO_PADRAO=['sim','?'];
/* Os baldes de vencimento. É a MESMA régua do selo da linha (situacaoDe), para o
   filtro nunca contradizer o que a linha diz de si mesma — e é por isso que ela
   é uma tabela, lida pelo filtro, pelo selo e pela contagem, em vez de três
   escadas de `if` escritas em três lugares. `dias` é o TETO do balde; quem não
   tem `dias` é ponta da régua (vencido, em dia, sem data).
   O DEGRAU DE 90 DIAS ESTAVA FALTANDO AQUI, e a falta era acidental: o filtro
   desta tela já oferecia "Vence em até 90 dias" (o ?f=d90 que o painel do
   colaborador manda), e a etiqueta de cada célula de data já pintava `d90` — só
   o selo da LINHA parava em 60 e chamava de "Em dia" quem vence em 75 dias.
   Sem o degrau, virar a lista em caixas de seleção teria encolhido o ?f=d90
   para "até 60" calado. Agora a tabela é a mesma da tela irmã. */
const VENC_ITENS=[
  {v:'venc',r:'Vencido'},
  {v:'d30', r:'Vence em 30 dias', dias:30},
  {v:'d60', r:'Vence em 60 dias', dias:60},
  {v:'d90', r:'Vence em 90 dias', dias:90},
  {v:'ok',  r:'Em dia'},
  {v:'sem', r:'Sem data'}
];
/* O vocabulário do ?f= antigo — o que o painel do colaborador manda no link e o
   que está colado em conversa de meses atrás. Cada atalho é o CONJUNTO de baldes
   que ele sempre quis dizer, RECORTADO contra os baldes que esta tela tem: um
   atalho que citasse um balde inexistente viraria um conjunto com valor fantasma
   dentro — valor que a caixa não teria como mostrar nem desmarcar. Hoje as duas
   telas têm os cinco baldes e nada é recortado; o recorte fica de pé porque a
   régua de baldes é dado, e dado muda.
   'todos' e 'falta' ficam de fora: o primeiro é a lista inteira e o segundo
   virou o botão "Com pendências". */
const SIT_ATALHO=(function(){
  const tem=VENC_ITENS.map(i=>i.v), so=a=>a.filter(v=>tem.indexOf(v)>=0);
  return {vencidos:so(['venc']),d30:so(['venc','d30']),
          d60:so(['venc','d30','d60']),d90:so(['venc','d30','d60','d90'])};
})();
const SIT_ATALHO_ROT={vencidos:'Vencidos',d30:'Vence em até 30 dias',
                      d60:'Vence em até 60 dias',d90:'Vence em até 90 dias'};
let F_SIT=SIT_TODOS();   // baldes de vencimento marcados
let F_DOC=[];            // colunas de vencimento marcadas; vazia = todas
let F_ATIVO=ATIVO_PADRAO.slice();
let SO_PEND=false;       // só quem tem vencimento em branco
let TERMO='';
let VER_CADASTRO=false;  // mostrar as colunas espelhadas do Registro (só leitura)
/* A tela abre pelo vencimento mais próximo, como sempre — só que pela COLUNA
   Situação, que é a que entrega essa ordem no clique (ver ORD_COLS.situacao). A
   chave importa porque é ela que o cabeçalho marca com `aria-sort` e com a

let SORT={key:'situacao',dir:'asc'};
const REVELADAS=new Set();
const hoje=new Date(); hoje.setHours(0,0,0,0);

/* ---------------- revelação progressiva ---------------- */
/* Filtros recolhidos, com memória. O contador ao lado do botão existe para
   evitar o único efeito colateral ruim de esconder filtro: a pessoa esquece que
   filtrou e acha que os dados sumiram. Por isso, com filtro ativo, o painel
   nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da grade. Dois botões de propósito: "mais 20" para quem lê, "todas" para
   quem vai usar Ctrl+F ou imprimir. Buscar ou filtrar volta o teto ao início —
   o resultado é outro, e continuar de onde parou confundiria. */
const PASSO = 20;
let TETO = PASSO;
function rodapeLista(mostrados, total){
  if(total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todas as ${total}</button>
  </div>`;
}

const eh=(lista,c)=>lista.some(x=>normTxt(x)===normTxt(c));
/* Espelhada = vem do Registro por IMPORTRANGE. Escrever nela destruiria a fórmula,
   então aqui ela é só leitura — e fica escondida até você pedir para ver. */
const ehEspelhada=c=>eh(ESPELHADAS,c);
const ehSigilosa=c=>eh(SIGILOSAS,c);
const ehData=c=>eh(DATAS,c);
const ehLink=c=>eh(LINKS,c);
/* Link PURO = endereço da web, não documento. A coluna "Link Prefeitura" é o
   caso que originou isto: a célula oferecia "Enviar ⬆" e alguém foi procurar o
   arquivo da prefeitura para subir. Ninguém faz upload de um portal — cola a
   URL e pronto. As outras colunas de link (documento, cópia, certidão, alvará…)
   continuam com o envio, que é o que a equipe faz nelas.
   O critério é o nome COMEÇAR com "Link" ("Link Prefeitura", "Link do portal").
   O teste roda nas duas telas mesmo onde ainda não há coluna assim: a lista de
   colunas vem do backend em tempo de execução, então basta o cadastro ganhar
   uma "Link …" para a célula errada aparecer sem ninguém mexer aqui.
   Se amanhã aparecer outra coluna de endereço com nome fora desse padrão, é
   aqui — e só aqui — que se ajusta. */
/* ENDEREÇOS PUROS: a lista FECHADA de colunas que apontam para um lugar da web
   em vez de um arquivo. Só elas perdem o "Enviar ⬆".
   A regra antiga era "o nome começa com Link" — e quebrou feio: nesta planilha os
   DOCUMENTOS também se chamam "Link Contrato Social", "Link Cartão CNPJ", "Link
   Alvará Sanitário". Todos perderam o envio de uma vez, e a ficha virou um
   formulário de colar URL.
   O casamento é EXATO, por nome inteiro normalizado, e não por pedaço. Casar por
   pedaço tem um contra-exemplo real e caro: "Link Certificado de regularidade
   CRM PJ" contém "CRM" e viraria portal — um documento de verdade, perdido de
   novo pela mesma classe de erro. Coluna nova entra como DOCUMENTO por padrão,
   que é o lado seguro: sobra um botão de enviar onde não se usa, em vez de faltar
   onde se precisa. Portal novo? Acrescente o nome aqui. */
const ENDERECOS_PUROS=['link prefeitura','link crm','link portal','link do portal',
                       'link e cac','link ecac','link sefaz','link gov','link site',
                       /* Formulário é endereço para PREENCHER, não arquivo para anexar. */
                       'link form diagnostico','link form','link formulario'];
function ehLinkPuro(c){
  if(!ehLink(c)) return false;
  return ENDERECOS_PUROS.indexOf(normTxt(c))>=0;
}
/* O backend manda a lista de colunas editáveis. Coluna fora dela vira só leitura —
   mas senha, data e link continuam editáveis, porque são tipos de campo, não papéis.
   Backend antigo (sem a lista) deixa tudo como está. */
function ehSoLeitura(c){
  if(ehEspelhada(c)) return true;
  if(!EDITAVEIS.length) return false;
  if(ehSigilosa(c)||ehData(c)||ehLink(c)) return false;
  return !eh(EDITAVEIS,c);
}
/* ID e Nome já aparecem nas colunas congeladas */
const ocultaSempre=c=>['id','nome','name'].includes(normTxt(c));
function curto(c){return String(c).replace(/^Vencimento\s+/i,'').replace(/^Certificado de\s+/i,'Cert. ').trim();}

/* ---------------- grupos de coluna (derivados do NOME, em tempo de execução) ----
   A grade é larga e a planilha muda sozinha, então nada de lista fixa: o grupo sai
   do próprio nome da coluna, em três passos.
   1) tira das pontas as palavras que dizem o PAPEL do campo (link, senha,
      vencimento, login…). O que sobra é o ASSUNTO:
        "Certificado Digital Senha"    -> "Certificado Digital"
        "Link Prefeitura"              -> "Prefeitura"
        "Vencimento Alvará Sanitário"  -> "Alvará Sanitário"
   2) assunto que TERMINA em outro assunto é o mesmo assunto, e o grupo leva o
      nome do pedaço menor — o mais específico:
        "Certificado de CLI" termina em "CLI" -> grupo CLI = [arquivo, vencimento]
      Antes a junção era pelo COMEÇO, e "Certificado de CLI" + "Certificado de
      CRM" viravam um grupo "Certificado de" com os dois documentos dentro e os
      vencimentos jogados em grupos à parte. O dono pediu o contrário: um assunto
      por grupo, cada um com o seu arquivo e a sua data ao lado.
   3) o cabeçalho da coluna passa a mostrar só o PAPEL; o assunto vira a faixa. */
const PAPEIS=new Set(['link','links','url','endereco','vencimento','vencto','venc','vence','validade',
  'valido','data','datas','emissao','expedicao','senha','password','login','usuario','user','acesso',
  'codigo','numero','n','no','status','situacao','observacao','observacoes','obs','protocolo',
  'arquivo','copia','pdf','inicio','fim']);
const PALAVRINHAS=new Set(['de','da','do','das','dos','e','a','o','em','no','na','para','por']);
function tokens(c){return String(c==null?'':c).trim().split(/\s+/).filter(Boolean);}
function tnorm(t){return normTxt(t).replace(/[^0-9a-z\-]/g,'');}
function ehPalavraDePapel(t){const n=tnorm(t);return PAPEIS.has(n)||PALAVRINHAS.has(n);}
function assuntoDe(c){
  let t=tokens(c);
  while(t.length>1&&ehPalavraDePapel(t[0])) t=t.slice(1);
  while(t.length>1&&ehPalavraDePapel(t[t.length-1])) t=t.slice(0,-1);
  return t.join(' ')||String(c||'');
}
/** "Certificado de CLI" termina em "CLI"? Compara palavra a palavra e sempre por
    tnorm: os nomes vêm do cadastro com acento, caixa alta e espaço sobrando, e
    igualdade crua de string deixaria "vencimento  CLI" de fora do grupo. */
function terminaEm(assunto,fim){
  const a=tokens(assunto).map(tnorm), f=tokens(fim).map(tnorm);
  if(!f.length||f.length>a.length) return false;
  return f.every((t,i)=>t===a[a.length-f.length+i]);
}
/** Nome do grupo de um assunto: o MENOR assunto da grade em que ele termina.
    Como todo sufixo mais curto também é sufixo dos maiores, pegar sempre o menor
    já resolve a cadeia inteira de uma vez e não depende da ordem das colunas. */
function assuntoDoGrupo(assunto,todos){
  let nome=assunto, n=tokens(assunto).length;
  todos.forEach(a=>{
    const m=tokens(a).length;
    if(m&&m<n&&terminaEm(assunto,a)){ nome=a; n=m; }
  });
  return nome;
}
/** Duas colunas podem chegar com o mesmo assunto escrito de jeitos diferentes
    ("CLI" e " cli "); o grupo é o mesmo, então a chave dele é normalizada. */
function chaveDeGrupo(nome){return tokens(nome).map(tnorm).join(' ');}
function montarGrupos(cols){
  const assunto=new Map();
  cols.forEach(c=>assunto.set(c,assuntoDe(c)));
  const todos=cols.map(c=>assunto.get(c));
  /* Partição estável: o grupo nasce onde a primeira coluna dele aparece e as irmãs
     se encostam nele — coluna só troca de lugar se uma irmã veio antes. */
  const grupos=[], onde=new Map();
  cols.forEach(c=>{
    const nome=assuntoDoGrupo(assunto.get(c),todos)||curto(c);
    const k=chaveDeGrupo(nome);
    if(!onde.has(k)){onde.set(k,grupos.length);grupos.push({nome,cols:[]});}
    grupos[onde.get(k)].cols.push(c);
  });
  return grupos;
}
/** Dentro de um grupo, o rótulo mostra só o que o título do grupo ainda não
    disse: em "Certificado Digital", a coluna "Senha Certificado Digital" vira
    "Senha". Se não sobrar nada (a coluna É o assunto), quem chama devolve o
    nome inteiro. */
function rotuloNoGrupo(col,grupo){
  const sobrando=tokens(grupo).map(tnorm);
  const resto=[];
  tokens(col).forEach(t=>{
    const i=sobrando.indexOf(tnorm(t));
    if(i>=0){sobrando.splice(i,1);return;}
    resto.push(t);
  });
  return resto.filter(t=>!PALAVRINHAS.has(tnorm(t))).join(' ').trim();
}
/* ---------------- datas ---------------- */
function diasAte(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
  return Math.round((new Date(+m[1],+m[2]-1,+m[3])-hoje)/864e5);}
function fmtBR(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(iso||'');}
/* CNPJ/CPF com pontuação na lista: a coluna vem da planilha só com dígitos, e
   catorze números colados não se confere de relance. Valor que não tem 11 nem
   14 dígitos sai como veio — melhor cru que mascarado errado. */
function fmtDoc(v){return b4uFmtDoc(v).trim();}
function estado(v){
  const s=String(v==null?'':v).trim();
  if(!s) return {cl:'vazio',dias:null,txt:'falta'};
  const d=diasAte(s);
  if(d===null) return {cl:'na',dias:null,txt:s.length>7?s.slice(0,7)+'…':s};
  if(d<0)   return {cl:'venc',dias:d,txt:'vencido'};
  if(d<=30) return {cl:'d30',dias:d,txt:d+'d'};
  if(d<=60) return {cl:'d60',dias:d,txt:d+'d'};
  if(d<=90) return {cl:'d90',dias:d,txt:d+'d'};
  return {cl:'ok',dias:d,txt:fmtBR(s).slice(3)};
}
function ativoDe(l){const s=normTxt(l.ativo);if(!s)return null;
  if(/^(sim|s|true|verdadeiro|1|x|ativo)$/.test(s))return true;
  if(/^(nao|n|false|falso|0|-|inativo)$/.test(s))return false;return null;}

/* ---------------- as colunas-chave da lista ----------------
   A lista mostra seis colunas: ID · Cliente · CNPJ · Venc. do certificado
   digital · Venc. das procurações · Situação. As três do meio saem da planilha,
   e a planilha MUDA SOZINHA — nome de coluna cru escrito aqui quebraria calado
   na primeira vez que alguém renomeasse "Procuração e-CAC Vencimento".
   Por isso a descoberta é em tempo de execução e por nome normalizado (sem
   acento, sem caixa), com plano B para cada caso:
     · CNPJ  — vem espelhado do cadastro do cliente; se não vier, a coluna
               simplesmente não cobra nada (veja cabecaHTML).
     · certificado digital — as colunas de DATA que falam de "certificado";
               na falta delas, as datas que não são de procuração.
     · procurações — as colunas de DATA que falam de "procuração"; na falta
               delas, as datas que sobraram depois do certificado.
   São CONJUNTOS, e não uma coluna só, porque hoje já são duas procurações
   (e-CAC e SPE) e amanhã pode ser outra: a célula mostra a mais urgente e diz
   num "+N" quantas outras existem. */
const COLS_LINHA={cnpj:'',cert:[],proc:[]};
/** Primeira coluna cujo nome normalizado casa — igual antes, "contém" depois. */
function colDe(alts){
  for(const a of alts){const c=COLUNAS.find(x=>normTxt(x)===a);if(c)return c;}
  for(const a of alts){const c=COLUNAS.find(x=>normTxt(x).indexOf(a)>=0);if(c)return c;}
  return '';
}
function mapearColunasLinha(){
  COLS_LINHA.cnpj=colDe(['cnpj ou cpf','cnpj/cpf','cnpj','cpf','documento']);
  const proc=DATAS.filter(c=>normTxt(c).indexOf('procuracao')>=0);
  const cert=DATAS.filter(c=>normTxt(c).indexOf('certificado')>=0);
  COLS_LINHA.cert=cert.length?cert:DATAS.filter(c=>proc.indexOf(c)<0);
  COLS_LINHA.proc=proc.length?proc:DATAS.filter(c=>COLS_LINHA.cert.indexOf(c)<0);
}
/* Situação da linha: a resposta de "preciso agir neste cliente?". Sai do
   vencimento mais próximo entre as colunas de data que o filtro de Vencimento
   deixou de pé — é a mesma conta dos chips, para o selo nunca contradizer o
   número que está logo acima dele. */
const SITUACOES={
  venc:{rot:'Vencido',dica:'Tem vencimento com data já passada.'},
  d30:{rot:'Vence em 30 dias',dica:'O vencimento mais próximo cai nos próximos 30 dias.'},
  d60:{rot:'Vence em 60 dias',dica:'O vencimento mais próximo cai entre 31 e 60 dias.'},
  d90:{rot:'Vence em 90 dias',dica:'O vencimento mais próximo cai entre 61 e 90 dias.'},
  ok:{rot:'Em dia',dica:'Nenhum vencimento nos próximos 90 dias.'},
  sem:{rot:'Sem data',dica:'Nenhum vencimento preenchido — não dá para saber o prazo deste cliente.'},
  inativo:{rot:'Inativo',dica:'Cliente marcado como inativo no cadastro.'}
};
/* O BALDE de vencimento da linha, sem olhar o cadastro. Ele existe separado do
   selo porque um cliente inativo continua tendo vencimento: se a contagem de
   "Vencido · 12" pulasse os inativos, os números da caixa deixariam de somar no
   dia em que alguém marcasse "Inativos" na caixa de Ativos — e a pessoa ficaria
   procurando as linhas que faltam. A régua sai da tabela VENC_ITENS. */
function vencDe(l){
  const u=urgencia(l,colsData());
  if(u===null) return 'sem';
  if(u<0) return 'venc';
  for(const i of VENC_ITENS){ if(i.dias!=null&&u<=i.dias) return i.v; }
  return 'ok';
}
function situacaoDe(l){return ativoDe(l)===false?'inativo':vencDe(l);}
function classeSituacao(l){return 'sit-'+situacaoDe(l);}

function colsData(){return F_DOC.length?F_DOC:DATAS;}
function urgencia(l,keys){
  let min=null;
  (keys||DATAS).forEach(k=>{const st=estado(l.valores[k]);if(st.dias!=null&&(min===null||st.dias<min))min=st.dias;});
  return min;
}
function faltando(l){
  return colsData().filter(k=>!String(l.valores[k]||'').trim()).map(curto);
}

/* ---------------- filtros ---------------- */
function SIT_TODOS(){return VENC_ITENS.map(i=>i.v);}
function mesmoConj(a,b){return a.length===b.length&&a.every(v=>b.indexOf(v)>=0);}
function chaveAtivo(l){const a=ativoDe(l);return a===true?'sim':a===false?'nao':'?';}
function passaAtivo(l){return F_ATIVO.indexOf(chaveAtivo(l))>=0;}
function passaVenc(l){return F_SIT.indexOf(vencDe(l))>=0;}
/* `pular` deixa UM dos filtros de fora. É o que faz a contagem no rótulo da
   opção dizer a verdade: sem ele, a opção DESMARCADA mostraria sempre zero (ela
   está sendo filtrada por si mesma) e a marcada mostraria o total — dois números
   que não ajudam ninguém a decidir se vale a pena clicar.
   Os três filtros são E entre si e OU dentro de cada um: "vencidos ou vencendo
   em 30, entre os ativos, com pendência". */
function passaFiltro(l,pular){
  if(pular!=='ativo'&&!passaAtivo(l)) return false;
  if(pular!=='venc' &&!passaVenc(l))  return false;
  if(pular!=='pend' &&SO_PEND&&faltando(l).length===0) return false;
  return true;
}
/* Texto e dígitos da linha, guardados até alguém editar a linha.
   As colunas sigilosas ficam de fora: senha nunca entra na busca. */
function chavesBusca(l){
  if(l._bt==null){
    const campos=COLUNAS.filter(c=>!ehSigilosa(c)).map(c=>l.valores[c]);
    l._bt=normTxt([l.id,l.nome_cliente].concat(campos).join(' '));
    l._bd=[String(l.id)].concat(campos).map(soDigitos).filter(Boolean).join('|');
  }
  return l;
}
function esquecerBusca(l){l._bt=null;l._bd=null;}
function passaBusca(l,termo){
  if(!termo) return true;
  chavesBusca(l);
  return casaBusca(l._bt,l._bd,termo);
}
/* ---------- as chaves de ordenação da lista ----------
   Uma entrada por COLUNA da lista, para o cabeçalho ordenar exatamente pelo que
   está escrito nela. `v` devolve o valor cru
   (as datas ordenam pelo aaaa-mm-dd que veio da planilha, nunca pelo dd/mm/aaaa
   que a célula mostra) e `t` diz como comparar. Coluna sem valor devolve '' — e
   vazio vai sempre para o fim, nas duas direções. */
const ORD_COLS={
  id:            {t:'txt', v:l=>l.id},
  nome_cliente:  {t:'txt', v:l=>l.nome_cliente},
  cnpj:          {t:'doc', v:l=>COLS_LINHA.cnpj?valDe(l,COLS_LINHA.cnpj):''},
  /* As duas colunas de data são CONJUNTOS (hoje já são duas procurações): a
     ordem segue a mesma data que a célula mostra — a mais urgente do assunto. */
  cert:          {t:'data',v:l=>{const c=maisUrgente(l,COLS_LINHA.cert);return c?valDe(l,c):'';}},
  proc:          {t:'data',v:l=>{const c=maisUrgente(l,COLS_LINHA.proc);return c?valDe(l,c):'';}},
  /* Sem cabeçalho próprio nesta tela — a linha mostra as datas de verdade (o
