/** Desde quando o cliente está devendo retorno naquela etapa:
 *  1) coluna "Esperando retorno desde"  2) log (data em que virou "Enviado ao cliente")
 *  3) prazo da etapa (aproximado)  4) nada. */
function esperandoDesde(l,e){
  let d=parseData(l.espera_desde);if(d)return{d:d,fonte:'coluna'};
  const log=(l.espera_log||{})[e.stk];d=parseData(log);if(d)return{d:d,fonte:'log'};
  d=parseData(l[e.pk]);if(d)return{d:d,fonte:'prazo'};
  return{d:null,fonte:''};
}
function diasCorridos(de,ate){return Math.max(0,Math.round((meia(ate)-meia(de))/86400000));}
function computeResumo(){
  const t0=meia(new Date()),dow=t0.getDay(),fimSemana=addDias(t0,(7-dow)%7),proxIni=addDias(fimSemana,1),proxFim=addDias(proxIni,6);
  const b={atrasada:[],semana:[],proxima:[],adiante:[],cobrar:[]};
  baseRows().forEach(l=>{
    TAREFAS.forEach(tf=>{
      const d=parseData(l[tf.k]);if(!d)return;
      if(statusConcluido(tf.stk,l[tf.stk]))return;
      if(aguardandoCliente(tf.stk,l[tf.stk]))return;   // está com o cliente → vai para "Cobrar"
      const dm=meia(d),g=dm.getTime();
      /* `resp` entrou junto porque a listinha ganhou a coluna Responsável. É o
         MESMO textoResp() da lista principal — o resumo não pode dizer um dono
         diferente do que a linha diz três centímetros abaixo.
         A data agora vai por extenso (dd/mm/aaaa, o fmtBR4 da lista) e não mais
         no dd/mm curto: o curto existia porque cabiam cinco linhas numa caixa de
         168px, e a caixa não existe mais. Sem o ano, "12/03" em "Mais adiante"
         não dizia se era o março que vem ou o de 2028. */
      const item={row:l.row,id:l.id,nome:l.nome,resp:textoResp(l),k:tf.k,label:tf.label,
                  dataStr:fmtBR4(dm),ord:g};
      if(g<t0.getTime())b.atrasada.push(item);
      else if(g<=fimSemana.getTime())b.semana.push(item);
      else if(g<=proxFim.getTime())b.proxima.push(item);
      else b.adiante.push(item);                       // nada mais some da vista
    });
    ESPERA.forEach(e=>{
      if(!aguardandoCliente(e.stk,l[e.stk]))return;
      const r=esperandoDesde(l,e);
      b.cobrar.push({row:l.row,id:l.id,nome:l.nome,resp:textoResp(l),k:e.stk,label:e.label,
        dias:r.d?diasCorridos(r.d,t0):null,desde:r.d?fmtBR(r.d):'',fonte:r.fonte});
    });
  });
  ['atrasada','semana','proxima','adiante'].forEach(k=>b[k].sort((x,y)=>x.ord-y.ord));
  b.cobrar.sort((x,y)=>{                                  // do mais demorado ao menos
    if(x.dias==null&&y.dias==null)return 0;
    if(x.dias==null)return 1;
    if(y.dias==null)return -1;
    return y.dias-x.dias;
  });
  return b;
}
/* ---------- "Ver quem está em cada situação", no formato do daily ----------
   Os CINCO grupos são os mesmos de sempre e na mesma ordem; quem cai em qual
   continua sendo o computeResumo() logo acima, que não foi tocado. O que mudou é
   a FORMA: onde havia cinco cartões de 255px com a lista rolando por dentro,
   agora há, para cada grupo, o cabeçalho com o nome e a contagem ao lado, o
   cabeçalho de colunas, e uma linha por item — que é como o daily desenha os
   grupos dele. */
const RGRUPOS=[
  {k:'atrasada',rot:'Atrasadas'},
  {k:'semana',  rot:'Esta semana (até domingo)'},
  {k:'proxima', rot:'Próxima semana'},
  {k:'adiante', rot:'Mais adiante'},
  {k:'cobrar',  rot:'Cobrar o cliente de retorno'}
];
/* O cabeçalho de colunas nasce DENTRO de cada grupo (é o que o daily faz), e não
   uma vez no topo: assim ele continua na tela quando a pessoa rola até o quarto
   grupo, e assim o quadro "Cobrar" pode ter a última coluna diferente — ali não
   existe prazo, existe HÁ QUANTO TEMPO se está esperando. */
function cabResumo(k){
  return `<div class="rcab"><span>ID</span><span>Cliente</span><span>Etapa</span>`+
         `<span>${esc(rotResp())}</span><span>${k==='cobrar'?'Esperando há':'Prazo'}</span></div>`;
}
/* As colunas escolhidas são as que a lista principal já mostra, menos as duas que
   aqui seriam repetição: o STATUS do cliente (a pílula colorida) não diz nada
   sobre ESTA tarefa, e a etapa "atual" da linha vira, aqui, a etapa DO ITEM — que
   é mais específica e é o motivo de o item estar neste quadro. */
function linhaTk(t,g){
  /* O `title` encolheu de propósito. Ele existia porque o cartão era estreito e
     cortava tudo: repetia ID, nome, etapa e prazo, que agora são quatro colunas à
     vista. O que sobrou é o que a linha REALMENTE não mostra — o nome inteiro,
     quando ele não coube na coluna — mais o convite de clique. Repetir o que já
     está na tela treina a pessoa a não ler o balão no dia em que ele tiver algo. */
  const tit=(t.nome||'(sem nome)')+' — clique para abrir a ficha';
  return `<div class="tk g-${g}" data-goto="${esc(String(t.row))}" data-k="${esc(t.k)}"
      role="button" tabindex="0" title="${esc(tit)}">
    <span class="tk-id">${esc(t.id)}</span>
    <span class="tk-nome">${esc(t.nome||'(sem nome)')}</span>
    <span class="tk-etapa">${esc(t.label)}</span>
    <span class="tk-resp">${t.resp?esc(t.resp):'<span class="c-falta">sem responsável</span>'}</span>
    <span class="tk-prazo">${esc(t.dataStr)}</span>
  </div>`;
}
const FONTE_ESPERA={coluna:'data informada',log:'registrada no log',prazo:'aproximada (prazo da etapa)'};
function linhaCobrar(t){
  const quanto=t.dias==null?'—':(t.dias===0?'hoje':t.dias+' dias');
  /* Aqui o balão CONTINUA carregando peso: a coluna diz "12 dias" e não tem como
     dizer desde quando nem de onde saiu a data — e "de onde saiu" muda o que se
     faz com o número (data informada vale; aproximada pelo prazo da etapa é
     chute). Quando não há data nenhuma, ele diz onde preencher. */
  const tit=(t.nome||'(sem nome)')+'\n'+(t.dias==null
    ? 'Sem data: preencha "Esperando retorno desde" na ficha deste cliente'
    : 'esperando desde '+t.desde+' ('+(FONTE_ESPERA[t.fonte]||'')+')');
  return `<div class="tk g-cobrar" data-goto="${esc(String(t.row))}" data-k="${esc(t.k)}"
      role="button" tabindex="0" title="${esc(tit)}">
    <span class="tk-id">${esc(t.id)}</span>
    <span class="tk-nome">${esc(t.nome||'(sem nome)')}</span>
    <span class="tk-etapa">${esc(t.label)}</span>
    <span class="tk-resp">${t.resp?esc(t.resp):'<span class="c-falta">sem responsável</span>'}</span>
    <span class="tk-prazo${t.dias==null?' sem':''}">${esc(quanto)}</span>
  </div>`;
}
/* Os cinco quadros saíram da primeira dobra. O que impede de esconder pendência
   não é o quadro: é a contagem em texto na régua ("11 tarefas atrasadas · 17
   vencem esta semana"), que fica visível com o bloco fechado. Aqui dentro ficam
   os exemplos — bons, mas no lugar errado. */
function atualizarResumo(){
  /* A guarda que faltava. Este resumo é decorativo — mora dentro de um
     "Ver quem está em cada situação" que pode não existir nesta tela. Sem a
     linha abaixo, o innerHTML de um elemento ausente estourava DENTRO do
     try/catch do carregar(), e a página inteira caía na tela de "não
     conseguimos carregar" com o dado JÁ na mão. Tela não morre por enfeite. */
  const alvoResumo=document.getElementById('resumo'); if(!alvoResumo) return;
  const b=computeResumo();
  /* Grupo vazio não desenha — a regra do daily. Antes, cada cartão vazio dizia
     "Nada por aqui 🎉"; numa semana calma eram cinco caixas anunciando o nada.
     Quando os cinco estão vazios a frase aparece uma vez, e é a mesma. */
  const gs=RGRUPOS.filter(g=>b[g.k]&&b[g.k].length);
  alvoResumo.innerHTML = gs.length
    ? gs.map(g=>`<div class="rgrupo ${g.k}"><h3>${esc(g.rot)}</h3><span class="n">${b[g.k].length}</span></div>`+
        cabResumo(g.k)+
        `<div class="rlista">${b[g.k].map(t=>g.k==='cobrar'?linhaCobrar(t):linhaTk(t,g.k)).join('')}</div>`).join('')
    : '<div class="rvazio">Nada por aqui 🎉 Nenhuma etapa com prazo em aberto e ninguém devendo retorno.</div>';
}
/* ================= a régua: cinco grupos de filtro =================
   Prazos · Etapa atual · STATUS · Responsável · Ativos. Cinco grupos
   independentes; dentro de cada um dá para marcar VÁRIOS (era um por vez), e os
   cinco combinam entre si, com a busca e com a ordenação da lista. A contagem de
   cada opção já respeita os OUTROS grupos ativos, então o número sempre bate com
   o que aparece ao marcar.
   As regras de prazo são as MESMAS dos quadros de resumo (statusConcluido /
   aguardandoCliente), para não existir duas verdades na página.

   ─── POR QUE PRAZOS É DIFERENTE DOS OUTROS QUATRO ───
   Etapa, Status, Responsável e Ativos são PARTIÇÕES: cada cliente cai em uma
   opção e em uma só, e a soma das opções é a carteira inteira. Nelas a caixa
   nasce com TUDO marcado (`vazio:'nada'` do b4u-filtro.js) — desmarcar uma é
   dizer "esta eu não quero ver", e desmarcar todas é dizer "não me mostre nada",
   que a caixa avisa em âmbar. Por isso a lista de opções delas tem de ser
   COMPLETA, inclusive as de contagem zero: uma opção que falta é uma linha que
   some da tela sem ninguém ter pedido. É o motivo de "Tudo concluído", "Sem
   status", "sem responsável" entrarem mesmo valendo zero.

   Prazos não é partição: as opções se sobrepõem ("Atrasados" está dentro de
   "Prazo em aberto") e a união delas NÃO é a carteira (um cliente com todas as
   etapas concluídas não casa com nenhuma). Marcar todas ali não poderia querer
   dizer "sem filtro", e nascer com todas marcadas esconderia justamente os
   clientes em dia. Então ela nasce VAZIA e vazio quer dizer TODOS
   (`vazio:'todos'`), que é exatamente o "Todos os prazos" de antes. Marcar
   várias é OU: atrasados OU vencendo esta semana. */
let FPRAZO=[],FETAPA=[],FSTATUS=[],FRESP=[],FATIVO=[];
let TAREFAS_ATIVAS=[],ESPERA_ATIVAS=[],TEM_PRAZO=false,TEM_STATUS=false;
const ETAPA_OK='__ok__',STATUS_VAZIO='__sem__',RESP_VAZIO='__semresp__',ATIVO_VAZIO='__semativo__';
/* A coluna de situação do cliente ("Ativos"), quando a planilha manda uma. Vazio
   quando não manda — e aí a caixa simplesmente não aparece. Ver `montarItens()`. */
let K_ATIVO='';

/** O que a planilha realmente traz — filtro de coluna vazia simplesmente não aparece. */
function mapearColunas(){
  const tem=k=>LINHAS.some(l=>String(l[k]==null?'':l[k]).trim()!=='');
  TAREFAS_ATIVAS=TAREFAS.filter(tf=>tem(tf.k)||tem(tf.stk));
  ESPERA_ATIVAS=ESPERA.filter(e=>tem(e.stk));
  TEM_PRAZO=TAREFAS_ATIVAS.some(tf=>tem(tf.k));
  TEM_STATUS=tem('status');
  /* ---------- a caixa "Ativos" ----------
     O dono pediu "Ativos (status), um filtro checkbox" — a SITUAÇÃO DO CLIENTE
     (ativo, inativo, suspenso), que é coisa do cadastro e não do processo de
     restituição. O `status` que esta tela já filtra é outra coisa: é o estágio da
     restituição (PROTOCOLADO, PRÉ - ONBOARDING, INTERROMPIDO…), e ele já tem a
     caixa dele.

     A rota `restituicao_equipe` não manda nada parecido hoje: as colunas que
     chegam estão todas em COLS, e nenhuma delas é a situação do cliente. Em vez
     de INVENTAR uma (derivar "ativo" de status != Perdido/INTERROMPIDO seria
     exatamente o tipo de semântica que não se chuta — "Perdido" é o negócio, não
     o cadastro), a caixa PROCURA a coluna pelo nome, do mesmo jeito que a lista
     procura a de responsável em `acharCampo()`. No dia em que o backend mandar,
     ela aparece sozinha, com o nome que a planilha der; enquanto não mandar, ela
     não aparece e nada mais na tela muda.
     O que falta do lado do backend está no relatório desta rodada. */
  K_ATIVO=acharCampo(/\bativo\b|\binativo\b|\bsituacao do cliente\b|^situacao$/);
}
function janelas(){
  const t0=meia(new Date()),dow=t0.getDay();
  return {hoje:t0,t0:t0.getTime(),semana:addDias(t0,(7-dow)%7).getTime(),d30:addDias(t0,30).getTime()};
}
/** Etapas que ainda dependem da EQUIPE: não concluídas e não paradas com o cliente. */
function etapasEmAberto(l){
  return TAREFAS_ATIVAS.filter(tf=>!statusConcluido(tf.stk,l[tf.stk])&&!aguardandoCliente(tf.stk,l[tf.stk]));
}
/** Datas (em ms) dos prazos dessas etapas. */
function prazosEmAberto(l){
  const r=[];etapasEmAberto(l).forEach(tf=>{const d=parseData(l[tf.k]);if(d)r.push(meia(d).getTime());});return r;
}
/** Primeira etapa não concluída = onde o cliente está parado hoje (ordem do fluxo). */
function etapaAtual(l){const tf=TAREFAS_ATIVAS.find(t=>!statusConcluido(t.stk,l[t.stk]));return tf?tf.k:ETAPA_OK;}
function esperandoAlgo(l){return ESPERA_ATIVAS.some(e=>aguardandoCliente(e.stk,l[e.stk]));}
/** Maior espera em dias corridos; null quando não dá para saber a data de início. */
function maiorEspera(l){
  const hoje=janelas().hoje;let m=null;
  ESPERA_ATIVAS.forEach(e=>{
    if(!aguardandoCliente(e.stk,l[e.stk]))return;
    const r=esperandoDesde(l,e);if(!r.d)return;
    const d=diasCorridos(r.d,hoje);if(m==null||d>m)m=d;
  });
  return m;
}
/* ---------- casaX(l,v): UMA opção. casaXs(l,vs): a lista marcada ----------
   As de baixo (`casaPrazo(l,'atrasado')`) são as regras de sempre, palavra por
   palavra; as de cima juntam a lista marcada. A separação existe porque a
   CONTAGEM de cada opção pergunta por uma opção só ("quantos sobram se eu marcar
   ESTA agora?") enquanto o filtro pergunta pela lista inteira. */
function casaPrazo(l,f){
  if(f==='espera')return esperandoAlgo(l);
  if(f==='espera15'){const m=maiorEspera(l);return m!=null&&m>15;}
  const j=janelas(),ps=prazosEmAberto(l);
  if(f==='aberto')return ps.length>0;
  if(f==='atrasado')return ps.some(g=>g<j.t0);
  if(f==='semana')return ps.some(g=>g>=j.t0&&g<=j.semana);
  if(f==='d30')return ps.some(g=>g>=j.t0&&g<=j.d30);
  if(f==='semprazo')return etapasEmAberto(l).length>0&&ps.length===0;
  return true;
}
function casaPrazos(l,fs){
  if(!fs.length)return true;                       // vazio = todos os prazos (o repouso)
  /* Marcadas TODAS, o botão do componente diz "Todos os prazos" — e então a lista
     tem de mostrar todos mesmo. Sem esta linha o rótulo mentiria: a união das
     opções não cobre quem está com tudo concluído, e esses clientes sumiriam
     debaixo de um botão que promete o contrário. */
  if(fs.length>=PRAZO_ITENS.length&&PRAZO_ITENS.every(i=>fs.indexOf(i.v)>=0))return true;
  return fs.some(f=>casaPrazo(l,f));
}
function casaEtapa(l,f){return etapaAtual(l)===f;}
function casaStatus(l,f){const n=normTxt(l.status);return f===STATUS_VAZIO?n==='':n===f;}
/** A chave de responsável da linha: o mesmo texto que a lista mostra, normalizado. */
function chaveResp(l){const t=textoResp(l).trim();return t?normTxt(t):RESP_VAZIO;}
function casaResp(l,f){return chaveResp(l)===f;}
/** A chave da situação do cliente, quando a planilha manda a coluna. */
function chaveAtivo(l){
  if(!K_ATIVO)return ATIVO_VAZIO;
  const t=String(l[K_ATIVO]==null?'':l[K_ATIVO]).trim();
  return t?normTxt(t):ATIVO_VAZIO;
}
function casaAtivo(l,f){return chaveAtivo(l)===f;}
/* Caixa que não tem opção nesta carga (a planilha não trouxe a coluna) não filtra
   NADA — nem tudo, nem nada. Sem esta guarda, a lista marcada dela seria vazia e
   uma partição vazia esconderia a carteira inteira por causa de uma coluna que
   nem existe. */
function porLista(l,fs,itens,uma){return !itens.length||fs.some(f=>uma(l,f));}
/** ig = grupo ignorado, para a contagem facetada daquele grupo. */
function aplicaChips(arr,ig){
  return arr.filter(l=>
    (ig==='prazo' ||casaPrazos(l,FPRAZO))&&
    (ig==='etapa' ||porLista(l,FETAPA,ETAPA_ITENS,casaEtapa))&&
    (ig==='status'||porLista(l,FSTATUS,STATUS_ITENS,casaStatus))&&
    (ig==='resp'  ||porLista(l,FRESP,RESP_ITENS,casaResp))&&
    (ig==='ativo' ||porLista(l,FATIVO,ATIVO_ITENS,casaAtivo)));
}
/** Valores únicos de um texto por linha, com a chave normalizada e o rótulo como
 *  ele veio da planilha (caixa e espaços preservados). Serve ao STATUS, ao
 *  Responsável e à situação do cliente — os três leem uma coluna de texto livre. */
function unicos(fn){
  const m=new Map();let vazio=0;
  LINHAS.forEach(l=>{
    const raw=String(fn(l)==null?'':fn(l)).trim();
    if(!raw){vazio++;return;}
    const n=normTxt(raw);if(!m.has(n))m.set(n,raw);
  });
  const lista=Array.from(m,e=>({n:e[0],raw:e[1]}));
  lista.sort((a,b)=>a.raw.localeCompare(b.raw,'pt',{sensitivity:'base'}));
  return {lista:lista,vazio:vazio};
}
/* ---------- as opções de cada caixa ----------
   Recalculadas a cada carga, porque quem manda é o que a planilha trouxe: etapa
   nova, status novo digitado, colaborador que entrou. Sem contagem — ela é
   facetada e muda a cada busca, então entra depois, no `desenharChips()`. */
let PRAZO_ITENS=[],ETAPA_ITENS=[],STATUS_ITENS=[],RESP_ITENS=[],ATIVO_ITENS=[];
let ROT_ATIVO='Ativos';
function valoresDe(itens){return itens.map(i=>i.v);}
function montarItens(){
  PRAZO_ITENS=[];
  /* Só leva marcador o que LEVAVA COR nos chips. "Vence em 30 dias" e "Sem prazo
     definido" eram chips neutros: pôr marcador neles seria inventar urgência que
     a tela nunca disse — e, com tudo marcado, marca nenhuma quer dizer nada. */
  if(TEM_PRAZO)PRAZO_ITENS=PRAZO_ITENS.concat([
    {v:'aberto',rot:'Prazo em aberto'},
    {v:'atrasado',rot:marca('acao','Atrasados')},
    {v:'semana',rot:marca('olho','Vence esta semana')},
    {v:'d30',rot:'Vence em 30 dias'},
    {v:'semprazo',rot:'Sem prazo definido'}]);
  if(ESPERA_ATIVAS.length)PRAZO_ITENS=PRAZO_ITENS.concat([
    {v:'espera',rot:marca('cliente','Esperando o cliente')},
    {v:'espera15',rot:marca('cliente','Espera +15 dias')}]);

  /* "Tudo concluído" entra SEMPRE que existe alguma etapa, mesmo valendo zero:
     ele é o resto da partição, e sem ele o cliente que terminou tudo não casaria
     com nenhuma opção marcada e sumiria da lista sem ninguém ter pedido. */
  ETAPA_ITENS=TAREFAS_ATIVAS.map(tf=>({v:tf.k,rot:tf.label}));
  if(ETAPA_ITENS.length)ETAPA_ITENS.push({v:ETAPA_OK,rot:'Tudo concluído'});

  const st=unicos(l=>l.status);
  STATUS_ITENS=TEM_STATUS?st.lista.map(x=>({v:x.n,rot:x.raw})):[];
  /* Mesma regra do "Tudo concluído": só entra quando existe linha em branco, e aí
     ela PRECISA entrar. */
  if(STATUS_ITENS.length&&st.vazio)STATUS_ITENS.push({v:STATUS_VAZIO,rot:'Sem status'});

  /* ---------- Responsável ----------
     O painel já filtrava por responsável, só que do lado de FORA: o `?cod=` (ou o
     #hash) vai para o servidor, e `montarRestituicaoEquipe_` devolve a carteira
     daquele colaborador — daí o comentário do `baseRows()`. Quem é pleno recebe a
     carteira de várias pessoas, e é aí que uma caixa aqui dentro passa a ter o que
     escolher. Os valores saem do MESMO `textoResp()` que a lista mostra (a coluna
     de responsável quando a planilha tem uma; o nome resolvido pela chave quando
     não tem), então a caixa nunca oferece um nome que a lista não mostra.
     Com um valor só ela não aparece: uma caixa com uma opção não é escolha, é
     ruído — e no celular ele custa meia linha da régua. */
  const rs=unicos(l=>textoResp(l));
  RESP_ITENS=rs.lista.map(x=>({v:x.n,rot:x.raw}));
  if(rs.vazio&&RESP_ITENS.length)RESP_ITENS.push({v:RESP_VAZIO,rot:'sem responsável'});
  if(RESP_ITENS.length<2)RESP_ITENS=[];

  /* ---------- Ativos (a situação do cliente) ----------
     Só existe se a planilha mandar a coluna — ver a nota do K_ATIVO. O rótulo da
     caixa é o NOME que a planilha deu à coluna, e não "Ativos" cravado aqui: a
     tela não pode prometer uma palavra e mostrar outra. */
  ROT_ATIVO='Ativos';
  ATIVO_ITENS=[];
  if(K_ATIVO){
    const av=unicos(l=>l[K_ATIVO]);
    ATIVO_ITENS=av.lista.map(x=>({v:x.n,rot:x.raw}));
    if(av.vazio&&ATIVO_ITENS.length)ATIVO_ITENS.push({v:ATIVO_VAZIO,rot:'sem informação'});
    if(ATIVO_ITENS.length<2)ATIVO_ITENS=[];
    if(ATIVO_ITENS.length)ROT_ATIVO=rotuloDe(K_ATIVO,'Ativos');
  }
}
/* O que veio do endereço vale; o que não veio recebe o padrão da caixa. Roda
   depois do montarItens(), porque o padrão das quatro partições é "todas as
   opções marcadas" e as opções só existem depois dele. */
function aplicarPadroes(){
  const pad=(v,itens)=>v===null?valoresDe(itens):v;
  FPRAZO =URLF.prazo||[];                 // a caixa de prazos nasce vazia = todos
  FETAPA =pad(URLF.etapa, ETAPA_ITENS);
  FSTATUS=pad(URLF.status,STATUS_ITENS);
  FRESP  =pad(URLF.resp,  RESP_ITENS);
  FATIVO =pad(URLF.ativo, ATIVO_ITENS);
}
/** Um grupo está pegando quando ele NÃO está no estado de repouso: prazos com
 *  alguma marcada, partição com alguma desmarcada. */
function grupoCorta(vals,itens){
  if(!itens.length)return false;
  return vals.length!==itens.length;
}
function filtroAtivo(){
  return FPRAZO.length>0||grupoCorta(FETAPA,ETAPA_ITENS)||grupoCorta(FSTATUS,STATUS_ITENS)||
         grupoCorta(FRESP,RESP_ITENS)||grupoCorta(FATIVO,ATIVO_ITENS);
}
/* Quantos filtros estão pegando agora (C.5). Era o selo ao lado do botão
   "Filtros"; com a régua à vista o selo não é mais preciso — a própria caixa diz
   quantas opções ela deixou passar — mas a conta continua de pé e o contrato é o
   mesmo das telas irmãs. A busca não conta: ela está à mostra. */
function filtrosPainel(){
  return (FPRAZO.length?1:0)+(grupoCorta(FETAPA,ETAPA_ITENS)?1:0)+(grupoCorta(FSTATUS,STATUS_ITENS)?1:0)+
         (grupoCorta(FRESP,RESP_ITENS)?1:0)+(grupoCorta(FATIVO,ATIVO_ITENS)?1:0);
}
function limparFiltros(){
  /* "Limpar" volta ao REPOUSO de cada caixa, que não é o mesmo estado nas cinco:
     prazos vazio (= todos), as quatro partições cheias (= todas). */
  FPRAZO=[];
  FETAPA=valoresDe(ETAPA_ITENS);FSTATUS=valoresDe(STATUS_ITENS);
  FRESP=valoresDe(RESP_ITENS);FATIVO=valoresDe(ATIVO_ITENS);
  TETO=PASSO;
  const b=document.getElementById('busca');if(b)b.value='';
  redesenhar();
}
/** Uma opção da lista, com a contagem no rótulo quando ela existe. */
function opt(v,rot,sel,n){
  return `<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>`+
         esc(rot)+(n!=null?' · '+n:'')+`</option>`;
}
/* Repintar sem roubar o foco: quando o CONJUNTO de valores é o mesmo, só o rótulo
   muda (a contagem) e o <select> continua sendo o mesmo elemento, com o mesmo
   foco — quem está escolhendo pelo teclado não perde o lugar no meio do gesto. Só
   recria as opções quando a lista de valores mudou de verdade (etapa nova na
   planilha, status novo digitado).

   `off` é a opção que hoje não tem ninguém: ela CONTINUA à vista, com o "· 0" que
   é a resposta ("não tem nenhum atrasado"), mas sai da navegação por teclado para
   não custar uma parada a cada seta. O chip fazia isso com meio-tom (.chip.zero),
   que <option> não tem. A que está escolhida nunca é desativada — senão o filtro
   que a pessoa acabou de aplicar sumiria da própria lista. */
function pintarSelect(el,itens,sel){
  if(!el)return;
  const sig=itens.map(i=>i.v).join('\u0001');
  if(el._sig!==sig||el.options.length!==itens.length){
    el.innerHTML=itens.map(it=>opt(it.v,it.rot,sel,it.n)).join('');
    el._sig=sig;
  }else{
    itens.forEach((it,i)=>{el.options[i].textContent=it.rot+(it.n!=null?' · '+it.n:'');});
  }
  itens.forEach((it,i)=>{el.options[i].disabled=!!it.off&&String(it.v)!==String(sel);});
  el.value=String(sel);
}
/* ---------- marcador de urgência no rótulo ----------
   O chip dizia a urgência com COR: vermelho em "Atrasados", âmbar em "Vence esta
   semana", azul na espera do cliente. <option> não pinta, e a cor sozinha nunca
   serviu a quem não a enxerga — daltônico, leitor de tela, impressão em preto e
   branco. O marcador devolve a mesma informação em TEXTO, e desta vez para todo
   mundo.

   Um símbolo por NÍVEL, nunca um por item: quem vê "!!" duas vezes sabe que as
   duas pedem a mesma coisa, sem legenda.
     !!  o prazo já passou, é para hoje   (era o vermelho)
     !   está chegando, olhe              (era o âmbar)
     →   a bola está com o CLIENTE        (era o azul; não é grau de urgência,
                                           é de quem é a vez — daí a seta, que
                                           aponta para fora e não para cima)

   Por que NÃO "⚠": no macOS e no iOS o U+26A0 vira emoji colorido — a mesma cor
   que estamos tirando, agora fora do nosso controle e maior que a letra. "!!" e
   "!" são ASCII: existem em toda fonte, nunca viram emoji, e a intensidade se lê
   sem manual. A seta é o U+2192 simples, que também não tem versão emoji (as
   setas coloridas são outras: ➡ U+27A1, ⬅ U+2B05). Nenhum deles é lido em voz
   alta como "triângulo preto apontando para cima" — e, se o leitor de tela pular
   a pontuação, o rótulo já diz por extenso o que o marcador resume. */
const MARCA={acao:'!!',olho:'!',cliente:'→'};
function marca(nivel,rot){return (MARCA[nivel]||'')+' '+rot;}
/* ================= a régua desenhada: as cinco caixas =================
   Com o b4u-filtro.js no ar, cada grupo é uma caixa de seleção múltipla — a mesma
   do daily. Sem ele, cada grupo volta a ser o <select> de escolha única que esta
   tela tinha, com as mesmas opções, os mesmos marcadores e a mesma contagem: a
   régua continua inteira e a lista continua certa; perde-se a combinação.
   Nos dois caminhos o ESTADO é o mesmo — uma lista de marcados —, e é isso que
   permite os dois desenhos sem duas verdades. */
const FILTROS={prazo:null,etapa:null,status:null,resp:null,ativo:null};
/* O marcador de posição é SUBSTITUÍDO, não preenchido: um <span> em volta viraria
   um item de flex (ou uma célula de grade) dimensionado pelo conteúdo, e o filtro
   por dentro dele nunca encolheria. É a lição escrita no `por()` do daily. */
function por(cx,no){cx.replaceWith(no);return no;}
function porHTML(cx,html){const t=document.createElement('div');t.innerHTML=html;return por(cx,t.firstElementChild);}
function montarFiltros(){
  const cx={prazo:document.getElementById('cx-prazo'),etapa:document.getElementById('cx-etapa'),
            status:document.getElementById('cx-status'),resp:document.getElementById('cx-resp'),
            ativo:document.getElementById('cx-ativo')};
  if(!cx.prazo||!cx.etapa||!cx.status||!cx.resp||!cx.ativo)return;
  const itens=arr=>arr.map(i=>({v:i.v,r:i.rot,c:i.rot}));
  if(window.B4UFiltro) try{
    /* As cinco são CONSTRUÍDAS antes de qualquer uma entrar na página. Se o módulo
       estiver lá e quebrar no meio, o `catch` cai nos <select> com os marcadores de
       posição ainda intactos — construir e plantar de uma em uma deixaria a régua
       pela metade, meia caixa e meio select. */
    const f={};
    f.prazo=B4UFiltro.criar({id:'f-prazo',rot:'Prazos',itens:itens(PRAZO_ITENS),marcados:FPRAZO,
      /* Nasce vazia, e vazio aqui quer dizer TODOS — ver a nota lá em cima sobre
         por que Prazos não é partição. */
      vazio:'todos',rotTodos:'Todos os prazos',rotNada:'Nenhum prazo',
      aoMudar:m=>{FPRAZO=m;TETO=PASSO;redesenhar();}});
    f.etapa=B4UFiltro.criar({id:'f-etapa',rot:'Etapa atual',itens:itens(ETAPA_ITENS),marcados:FETAPA,
      vazio:'nada',rotTodos:'Todas as etapas',rotNada:'Nenhuma etapa',rotTodas:'Todas',
      aoMudar:m=>{FETAPA=m;TETO=PASSO;redesenhar();}});
    f.status=B4UFiltro.criar({id:'f-status',rot:'Status',itens:itens(STATUS_ITENS),marcados:FSTATUS,
      vazio:'nada',rotTodos:'Todos os status',rotNada:'Nenhum status',rotTodas:'Todos',
      aoMudar:m=>{FSTATUS=m;TETO=PASSO;redesenhar();}});
    f.resp=B4UFiltro.criar({id:'f-resp',rot:rotResp(),itens:itens(RESP_ITENS),marcados:FRESP,
      vazio:'nada',rotTodos:'Todos os responsáveis',rotNada:'Ninguém',rotTodas:'Todos',
      aoMudar:m=>{FRESP=m;TETO=PASSO;redesenhar();}});
    /* O rótulo de "todos" desta caixa é o ÚNICO montado em tempo de execução: as
       outras quatro têm um plural natural escrito à mão ("Todos os prazos"), e
       esta não tem, porque o nome da coluna só se sabe quando o payload chega.
       "Todos os clientes" seria a leitura errada — parece filtro de cliente, que é
       o que a busca faz. Então ele diz o nome da coluna e o estado: "Ativos: todos". */
    f.ativo=B4UFiltro.criar({id:'f-ativo',rot:ROT_ATIVO,itens:itens(ATIVO_ITENS),marcados:FATIVO,
      vazio:'nada',rotTodos:ROT_ATIVO+': todos',rotNada:'Nenhum',rotTodas:'Todos',
      aoMudar:m=>{FATIVO=m;TETO=PASSO;redesenhar();}});
    Object.keys(f).forEach(k=>{FILTROS[k]=f[k];por(cx[k],f[k].no);});
    return;
  }catch(e){FILTROS.prazo=FILTROS.etapa=FILTROS.status=FILTROS.resp=FILTROS.ativo=null;}
  /* ── sem o módulo ────────────────────────────────────────────────────────
     Um <select> por grupo, com a opção "todos" no topo — o desenho que a régua
     tinha antes das caixas. Escolher um valor guarda `[valor]`; escolher "todos"
     guarda o repouso do grupo. É o mesmo estado que as caixas produzem, só que
     sem combinações. */
  porHTML(cx.prazo, `<select class="filtro" id="f-prazo" aria-label="Prazos"></select>`);
  porHTML(cx.etapa, `<select class="filtro" id="f-etapa" aria-label="Etapa atual"></select>`);
  porHTML(cx.status,`<select class="filtro" id="f-status" aria-label="Status"></select>`);
  porHTML(cx.resp,  `<select class="filtro" id="f-resp" aria-label="${esc(rotResp())}"></select>`);
  porHTML(cx.ativo, `<select class="filtro" id="f-ativo" aria-label="${esc(ROT_ATIVO)}"></select>`);
}
/** O valor que o <select> nativo mostra para uma lista de marcados. Ele só sabe
 *  dizer três coisas, e a lista pode estar num quarto estado que ele não
 *  representa (duas etapas marcadas). Nesse caso ele fica em "todas", que é a
 *  opção mais perto de "não estou estreitando por aqui" — e a lista, que é o que
 *  a pessoa lê, continua certa. */
function valorSelect(vals,itens,todos){
  if(!itens.length)return todos;
  if(vals.length===1)return vals[0];
  return todos;
}
const SEL_TODOS={prazo:'todos',etapa:'todas',status:'todos',resp:'todos',ativo:'todos'};
/** O caminho inverso: o que o <select> nativo escolheu vira a lista de marcados. */
function escolherNoSelect(grupo,valor){
  const itens={prazo:PRAZO_ITENS,etapa:ETAPA_ITENS,status:STATUS_ITENS,resp:RESP_ITENS,ativo:ATIVO_ITENS}[grupo];
  const repouso=grupo==='prazo'?[]:valoresDe(itens);
  const vals=valor===SEL_TODOS[grupo]?repouso:[valor];
  if(grupo==='prazo')FPRAZO=vals;
  else if(grupo==='etapa')FETAPA=vals;
  else if(grupo==='status')FSTATUS=vals;
  else if(grupo==='resp')FRESP=vals;
  else if(grupo==='ativo')FATIVO=vals;
}
/* Uma caixa (ou um <select>) repintada com as contagens de agora.
   ─── POR QUE NÃO REMONTAR O PAINEL ABERTO ───
   Trocar a lista de itens REMONTA o painel do componente (é o que o `itens()`
   dele faz), e remontar com o painel aberto destruiria o checkbox que a pessoa
   acabou de clicar: o foco vai para o <body> e o `focusout` do próprio componente
   fecha o painel no meio do gesto — marcar duas opções seguidas viraria
   impossível.
   E não se perde nada com isso: a contagem desta caixa é FACETADA ignorando ela
   mesma, então marcar e desmarcar aqui dentro NÃO muda nenhum destes números. O
   que muda são a busca e as outras caixas, e nenhuma das duas dá para mexer sem
   antes fechar esta (o componente fecha uma ao abrir a outra). Ao fechar, o
   próximo redesenho repinta. */
function pintarFiltro(grupo,itens,marc,contar,rotTodos){
  const f=FILTROS[grupo];
  const comN=itens.map(i=>({v:i.v,rot:i.rot,n:contar(i.v)}));
  if(f){
    f.no.hidden=!itens.length;
    if(f.aberto())return;
    /* A contagem entra no rótulo da LINHA do painel ("Atrasados · 12") e fica
       fora do rótulo CURTO do botão fechado (o `c`): num botão de 240px que ainda
       precisa caber o "+2", o número é a primeira coisa que sobra. */
    const its=comN.map(i=>({v:i.v,r:i.rot+' · '+i.n,c:i.rot}));
    /* Remontar só quando algo mudou de verdade. Sem isto, cada tecla digitada na
       busca reconstruiria os cinco painéis inteiros. Os separadores são caracteres
       de controle porque valor e rótulo são texto livre vindo da planilha: com um
       "|" no meio, dois conjuntos diferentes poderiam dar a mesma assinatura. */
    const sig=its.map(i=>i.v+'\u0001'+i.r).join('\u0002');
    if(f._sig!==sig){f._sig=sig;f.itens(its);}
    f.marcados(marc);
    return;
  }
  const el=document.getElementById('f-'+grupo);
  if(!el)return;
  el.hidden=!itens.length;
  if(!itens.length)return;
  const zero=it=>{it.off=!it.n;return it;};
  const todos=SEL_TODOS[grupo];
  const sel=valorSelect(marc,itens,todos);
  const lista=[{v:todos,rot:rotTodos}].concat(comN.map(zero));
  pintarSelect(el,lista,sel);
  el.classList.toggle('corta',String(sel)!==String(todos));
}
/* As contagens continuam FACETADAS e cientes da busca — cada grupo conta ignorando
   a si mesmo (aplicaChips(base,grupo)) em cima do que a busca deixou. É o número
   que responde "quantos sobram se eu marcar isto agora", e não o total da
   planilha: trocar isso por contagem global seria um retrocesso. */
function desenharChips(){
  const b=document.getElementById('busca'),base=porBusca(b?b.value:'');
  const conta=(arr,uma)=>v=>arr.filter(l=>uma(l,v)).length;
  /* Prazos: sem coluna de prazo e sem etapa de espera não há o que filtrar, e a
     caixa some (PRAZO_ITENS nasce vazia) em vez de virar uma caixinha com uma
     opção só. O mesmo vale para as outras quatro. */
  pintarFiltro('prazo', PRAZO_ITENS, FPRAZO, conta(aplicaChips(base,'prazo'), casaPrazo), 'Todos os prazos');
  pintarFiltro('etapa', ETAPA_ITENS, FETAPA, conta(aplicaChips(base,'etapa'), casaEtapa), 'Todas as etapas');
  /* No STATUS não entra marcador de urgência, de propósito. Nos prazos a cor era
     uma escala ("atrasado" é pior que "vence esta semana") e dá para escrever essa
     escala em texto. No STATUS ela não é escala nenhuma: COR_RAW.status é a paleta
     da formatação condicional da planilha, uma cor por frase — verde em
     PROTOCOLADO, preto em Perdido, cinza em INTERROMPIDO, dois azuis diferentes
     para dois estados prospectivos. Não há bom/ruim derivável daí, e a lista de
     valores vem da planilha: um status novo digitado amanhã não teria nível
     nenhum. Marcar por chute seria pior que não marcar — diria a quem confia no
     marcador uma urgência que ninguém decidiu.
     O FUNDO colorido de cada status também não voltou: a caixa escapa o rótulo da
     linha (é texto, não HTML), então pintar valor por valor exigiria mexer no
     componente. A cor continua onde trabalha: na pílula da lista e na ficha. */
  pintarFiltro('status',STATUS_ITENS,FSTATUS,conta(aplicaChips(base,'status'),casaStatus),'Todos os status');
  pintarFiltro('resp',  RESP_ITENS,  FRESP,  conta(aplicaChips(base,'resp'),  casaResp),  'Todos os responsáveis');
  pintarFiltro('ativo', ATIVO_ITENS, FATIVO, conta(aplicaChips(base,'ativo'), casaAtivo), ROT_ATIVO+': todos');
}
/* A contagem em texto é o que permite recolher os quadros de prazo sem esconder
   pendência: os números continuam na primeira linha da tela, filtrada ou não. */
function desenharResumoLista(){
  const el=document.getElementById('resumo-lista');if(!el)return;
  const b=document.getElementById('busca');
  const vis=filtradas(b?b.value:'').length,tot=baseRows().length;
  const r=computeResumo();
  const p=[(vis===tot?String(tot):vis+' de '+tot)+' clientes'];
  if(r.atrasada.length)p.push(r.atrasada.length+' tarefas atrasadas');
  if(r.semana.length)p.push(r.semana.length+' vencem esta semana');
  if(r.cobrar.length)p.push(r.cobrar.length+' esperando o cliente');
  el.textContent=p.join(' · ');
}
/* ---------- ordenar: os seis critérios do #f-ord viraram as seis colunas ----------
   A lista suspensa "Ordenar por" saiu da régua a pedido do dono ("aplicar ordenar
   títulos AZ ZA sem ter a ordenação no filtro lá em cima"). Ela tinha SEIS
   critérios em duas direções cada, e nenhum se perdeu: os seis são exatamente as
   seis colunas da lista, e clicar no título ordena A→Z, clicar de novo Z→A.

     ID           -> coluna ID              (do menor para o maior / ao contrário)
     Cliente      -> coluna Cliente         (de A a Z / de Z a A)
     Responsável  -> coluna Responsável
     Etapa atual  -> coluna Etapa atual     (rótulo vem de rotComp())
     Prazo/Valor  -> quinta coluna          (rótulo vem de rotVal())
     Situação     -> coluna Situação

   O que a lista suspensa dizia e o cabeçalho não diria sozinho é o SIGNIFICADO da
   direção ("do menor para o maior" não é a mesma frase que "de A a Z" numa coluna
   de números). Isso ficou: é o `title` de cada botão, que anuncia o que o PRÓXIMO
   clique vai fazer. O estado de agora é a seta ▲/▼ ao lado do rótulo e o
   `aria-sort` do cabeçalho — vista e ouvida. */
const DIR_ROT={id:['do menor para o maior','do maior para o menor'],
               val:['do menor para o maior','do maior para o menor']};
function dirRot(k,dir){const par=DIR_ROT[k]||['de A a Z','de Z a A'];return par[dir==='asc'?0:1];}
function redesenhar(){
  const b=document.getElementById('busca');
  desenharChips();
  desenhar(b?b.value:'');
  desenharResumoLista();
  if(FILTROS_UI)FILTROS_UI.atualizarContador();
  sincronizarURL();
}
function ehNum(s){return /^\s*-?\d+([.,]\d+)?\s*$/.test(String(s));}
function valCmp(a,b){if(ehNum(a)&&ehNum(b))return parseFloat(String(a).replace(',','.'))-parseFloat(String(b).replace(',','.'));return String(a).localeCompare(String(b),'pt',{numeric:true,sensitivity:'base'});}
/* As três colunas calculadas da lista (responsável de fallback, etapa atual e
   prazo mais próximo) não existem na linha crua: o valor de ordenação delas sai
   da mesma função que pinta a coluna, para a ordem bater com o que se lê. */
function valOrd(l,key){
  if(key==='resp')return textoResp(l);
  if(key==='comp')return textoComp(l);
  if(key==='val'){
    if(K_VAL){const n=numDe(l[K_VAL]);return isFinite(n)?String(n):'';}
    const ps=prazosEmAberto(l);
    return ps.length?fmtBR4(new Date(Math.min.apply(null,ps))):'';
  }
  return l[key]==null?'':l[key];
}
function ordenar(arr){
  const key=SORT.key,dir=SORT.dir,col=COLS.find(c=>c.k===key);
  /* a coluna calculada de prazo ordena por data interpretada, igual às colunas
     de prazo da planilha; a de valor ordena por número */
  const isData=(col&&col.sort==='date')||(key==='val'&&!K_VAL);
  return arr.slice().sort((x,y)=>{
    let va=valOrd(x,key),vb=valOrd(y,key);
    const ea=String(va).trim()==='',eb=String(vb).trim()==='';
    if(ea&&eb)return 0;if(ea)return 1;if(eb)return -1;
    let r;
    if(isData){const da=parseData(va),db=parseData(vb);r=(da?da.getTime():Infinity)-(db?db.getTime():Infinity);}
    else r=valCmp(va,vb);
    return dir==='desc'?-r:r;
  });
}
/* Busca por ID, nome, CNPJ ou e-mail. O CNPJ acha com ou sem pontuação. */
function porBusca(termo){
  if(!normTxt(termo))return baseRows();
  return baseRows().filter(l=>casaBusca(
    normTxt(l.id+' '+l.nome+' '+l.cnpj+' '+(l.email||'')),
    soDigitos(l.id+' '+l.cnpj),termo));
}
function filtradas(termo){return aplicaChips(porBusca(termo),null);}
/** O espaço antes da seta é NÃO SEPARÁVEL (\u00A0) de propósito: com espaço
 *  comum, o rótulo que quase preenche a coluna empurrava a seta sozinha para uma
 *  segunda linha, e o cabeçalho ficava com o dobro da altura por causa dela — foi
 *  a lição do contatos-equipe.html, que tem o mesmo cabeçalho. */
function seta(key){return SORT.key===key?(SORT.dir==='asc'?'\u00A0▲':'\u00A0▼'):'';}
/* Um campo da ficha: rótulo em cima, controle embaixo — o mesmo desenho do
   cadastro do registro.html. O que era `<div class="cel">` dentro da célula da
   grade virou `.fld`; os atributos data-k continuam idênticos, porque é por eles
   que coletar() monta o que vai para a planilha. As larguras em pixel saíram: na
   ficha quem manda é a grade de duas colunas, e o que era largo vira full. */
function campoFichaHTML(l,c){
  const v=l[c.k]==null?'':l[c.k];
  const abrir=(c.t==='url'&&/^https?:/i.test(v))?`<a class="abrir" href="${esc(v)}" target="_blank" rel="noopener" title="abrir">↗</a>`:'';
  const largo=c.t==='area'||c.t==='mails'||c.t==='url'||c.w>=200;
  let campo;
  if(c.ro){
    if(c.opt&&corDe(c.opt,v)){const cor=corDe(c.opt,v);campo=`<span class="robadge" style="background:${cor};color:${textoContraste(cor)}">${esc(v)}</span>`;}
    else if(c.t==='area')campo=`<div class="ro roarea">${esc(v)||'—'}</div>`;
    else if(c.t==='mails'){
      const mails=String(v).split(/[,;\s]+/).map(x=>x.trim()).filter(x=>x.indexOf('@')>0);
      campo=`<div class="ro romails">`+(mails.length?mails.map(m=>`<a href="mailto:${esc(m)}">${esc(m)}</a>`).join(''):'—')+`</div>`;
    }
    else if(c.t==='url')campo=`<div class="ro rourl" title="${esc(v)}">${esc(v)||'—'}</div>`;
    else if(b4uEhIdentificador(c.label))campo=`<div class="ro" title="${esc(b4uFmt(v,c.label))}">${b4uIdentHTML(v,c.label)||'—'}</div>`;
    else campo=`<div class="ro" title="${esc(v)}">${esc(v)||'—'}</div>`;
  }else if(c.t==='select'){
    const opts=OPT[c.opt].slice();if(v&&opts.indexOf(v)<0)opts.unshift(v);
    const cor=corDe(c.opt,v);const st=cor?`background:${cor};color:${textoContraste(cor)};font-weight:700`:'';
    campo=`<select data-k="${c.k}" data-opt="${c.opt}" style="${st}"><option value=""${v===''?' selected':''}>—</option>`+opts.map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(o)}</option>`).join('')+`</select>`;
  }else if(c.t==='area')campo=`<textarea data-k="${c.k}" rows="3">${esc(v)}</textarea>`;
  else campo=`<input data-k="${c.k}" type="text" value="${esc(v)}"${b4uEhIdentificador(c.label)?' inputmode="numeric"':''}${c.dica?` placeholder="${esc(c.dica)}"`:''}>`;
  const rot=`<span class="lbl">${esc(c.label)}${c.ro?' <span class="cad" title="Coluna mantida pela planilha — não dá para editar por aqui.">🔒</span>':''}</span>`;
  /* data-campo em TODO campo, inclusive nos 🔒: é por ele que o clique num quadro
     de prazo acha o campo daquela tarefa para piscar, e prazo é só leitura — com
     o data-k sozinho (que só os editáveis têm) o destaque nunca chegaria lá. */
  return `<div class="fld${largo?' full':''}" data-campo="${esc(c.k)}">${rot}`+(abrir?`<span class="linha-campo">${campo}${abrir}</span>`:campo)+`</div>`;
}
/* ---------- as seções da ficha ----------
   Cliente e Equiparação são a identificação (só leitura); "Situação" reúne o que
   se mexe todo dia; e cada etapa do fluxo vira uma seção com o seu status, o seu
   prazo e o seu link juntos — é o MESMO pareamento de TAREFAS que já alimenta os
   quadros de prazo e os chips, não uma segunda lista de colunas para manter.
   O que sobrar cai em "Outras informações": coluna que a planilha ganhar não pode
   sumir da ficha sem ninguém perceber. */
const SEC_CLIENTE=['cnpj','email','natureza_juridica','natureza_empresarial','prospectivo','link_drive','link_equip'];
const SEC_SITUACAO=['status','obs_status','tarefas','espera_desde'];
const SEC_EQUIP=['visao_geral','estrategia'];
function montarSecoes(){
  const porK={};COLS.forEach(c=>porK[c.k]=c);
  const usadas=new Set(),secs=[];
  const add=(titulo,ks)=>{
    const cs=ks.filter(k=>k&&porK[k]&&!usadas.has(k)).map(k=>{usadas.add(k);return porK[k];});
    if(cs.length)secs.push({titulo:titulo,cols:cs});
  };
  add('Cliente',SEC_CLIENTE);
  add('Situação e observações',SEC_SITUACAO);
  add('Equiparação',SEC_EQUIP);
  TAREFAS.forEach(tf=>add(tf.label,[tf.stk,tf.k,tf.lk]));
  add('Outras informações',COLS.map(c=>c.k));
  return secs;
}
/* A ficha inteira. O data-row e o data-id ficam AQUI, no mesmo lugar em que
   estavam no <tr>: agendarSalvar() e coletar() continuam lendo os dois do
   elemento que embrulha os campos, sem saber que trocaram de casa. */
function corpoHTML(l){
  const blocos=montarSecoes().map(s=>`<div class="gsec"><h3><span class="dot"></span>${esc(s.titulo)}</h3>
      <div class="grid">${s.cols.map(c=>campoFichaHTML(l,c)).join('')}</div></div>`).join('');
  const drive=String(l.link_drive||'').trim(),plan=String(l.link_equip||'').trim();
  /* O "Planilha ↗" morava na coluna congelada do Nome para não obrigar a rolar a
     grade até a coluna do link. Sem grade e sem rolagem lateral, ele vem para o
     rodapé da ficha, ao lado da pasta do Drive — continua a um clique do nome. */
  return `<div class="corpo" data-row="${esc(String(l.row))}" data-id="${esc(l.id)}">
    <div class="ign"></div>
    ${blocos}
    <div class="rodape">
      <span>As alterações salvam sozinhas. Campos com 🔒 são mantidos pela planilha.</span>
      ${/^https?:/i.test(drive)?`<a class="lk" href="${esc(drive)}" target="_blank" rel="noopener">📁 Pasta no Drive ↗</a>`:''}
      ${/^https?:/i.test(plan)?`<a class="lk" href="${esc(plan)}" target="_blank" rel="noopener" aria-label="Abrir a planilha de equiparação de ${esc(l.nome||l.id)}">Planilha de equiparação ↗</a>`:''}
    </div>
  </div>`;
}
/* O cabeçalho das colunas repete a régua da linha (mesma regra de CSS). Abaixo de
   900px a GRADE dele some — a linha deixa de ser seis colunas —, mas os BOTÕES
   ficam, viram uma fileira de pílulas e continuam sendo o único jeito de ordenar
   a tela desde que a lista "Ordenar por" saiu da régua.
   Cada rótulo é um botão: por isso ele NÃO é aria-hidden, e por isso a coluna
   ativa se anuncia com aria-sort no <span role="columnheader"> — é a mesma marca
   que o contatos-equipe.html, o registro.html e o licencas.html já usam.
   O `title` diz o que o PRÓXIMO clique faz, com a mesma frase que a lista suspensa
   dizia ("do menor para o maior" nas colunas de número, "de A a Z" nas de texto):
   a seta mostra onde se está, o title mostra para onde se vai. */
function cabecalhoLista(){
  const bt=(k,rot,estilo)=>{
    const at=SORT.key===k;
    const prox=at?(SORT.dir==='asc'?'desc':'asc'):'asc';
    return `<span role="columnheader"${estilo?' style="'+estilo+'"':''}`+
      `${at?` aria-sort="${SORT.dir==='asc'?'ascending':'descending'}"`:''}>`+
      `<button type="button" data-sort="${esc(k)}" `+
      `title="Ordenar por ${esc(rot)} — ${esc(dirRot(k,prox))}">${esc(rot)}${seta(k)}</button></span>`;
  };
  /* O "Ordenar por" só aparece na fileira de pílulas do celular, onde os botões
     perdem o contexto de cabeçalho de coluna e precisam dizer para que servem. Na
     grade ele é `display:none` — uma sétima coluna empurraria as seis. */
  return `<div class="lista-cab" role="row"><span class="lc-rot" aria-hidden="true">Ordenar por</span>`+
    bt('id','ID')+bt('nome','Cliente')+bt('resp',rotResp())+
    bt('comp',rotComp())+bt('val',rotVal(),'text-align:right')+bt('status','Situação','text-align:right')+`</div>`;
}
/** O que não coube nas seis colunas vira o title da linha: dá para conferir sem
 *  abrir a ficha — inclusive quais etapas estão paradas com o cliente. */
function tituloLinha(l){
  const p=['CNPJ: '+(b4uFmt(l.cnpj,'CNPJ').trim()||'em branco')];
  p.push('Status: '+(String(l.status||'').trim()||'em branco'));
  if(K_COMP)p.push('Etapa atual: '+etapaRot(l));
  if(K_VAL){const ps=prazosEmAberto(l);p.push('Prazo mais próximo: '+(ps.length?fmtBR4(new Date(Math.min.apply(null,ps))):'nenhum em aberto'));}
  const esp=ESPERA_ATIVAS.filter(e=>aguardandoCliente(e.stk,l[e.stk])).map(e=>e.label);
  if(esp.length)p.push('Esperando o cliente: '+esp.join(', '));
  const tar=String(l.tarefas||'').trim();
  if(tar)p.push('Tarefas ativas: '+tar.replace(/\s+/g,' ').slice(0,120));
  p.push('Clique para abrir a ficha.');
  return p.join(' · ');
}
/* A linha da lista: ID · Cliente · Responsável · Etapa atual · Prazo · Situação.
   Nenhum campo aqui dentro — a lista é só de leitura, e é isso que impede alterar
   sem querer. É um role="button" (e não um <button>) porque dentro dele há pílula
   com title próprio; o teclado é atendido à mão no keydown (Enter e Espaço). */
function linhaHTML(l){
  const st=String(l.status==null?'':l.status).trim();
  const cor=corDe('status',st);
  const pill=st
    ?`<span class="pill${cor?'':' ncor'}" style="${cor?`background:${cor};color:${textoContraste(cor)};border-color:${cor}`:''}" title="${esc('STATUS: '+st)}">${esc(st)}</span>`
    :'<span class="pill sem" title="Coluna STATUS em branco">sem status</span>';
  const resp=textoResp(l),comp=textoComp(l),val=dadoVal(l);
  return `<div class="cli-head" role="button" tabindex="0" aria-haspopup="dialog" title="${esc(tituloLinha(l))}">
      <span class="c-id">${esc(l.id)}</span>
      <span class="c-nome">${esc(l.nome||'(sem nome)')}</span>
      <span class="c-resp">${resp?esc(resp):'<span class="c-falta">sem responsável</span>'}</span>
      <span class="c-etapa">${comp?esc(comp):'<span class="c-falta">—</span>'}</span>
      <span class="c-val ${val.cls}">${val.txt?esc(val.txt):'<span class="c-falta">'+esc(val.falta)+'</span>'}</span>
      <span class="c-fim">${pill}</span>
    </div>`;
}
function desenhar(termo){
  const arr=ordenar(filtradas(termo));
  document.getElementById('cnt').textContent=arr.length+' de '+baseRows().length+' clientes';
  /* Teto de 20: a tela abre com o começo da lista, não com as 110 linhas. */
  const n=Math.min(TETO,arr.length);
  const el=document.getElementById('lista');
  el.innerHTML=arr.length
    ?cabecalhoLista()+arr.slice(0,n).map(l=>`<div class="cli ${classeUrg(l)}${ABERTA===String(l.row)?' aberto':''}" data-row="${esc(String(l.row))}" data-id="${esc(l.id)}">${linhaHTML(l)}</div>`).join('')
    :`<div class="vazio">Nenhum cliente com os filtros de agora. <button type="button" class="chip limpar" data-limpar>Limpar filtros e busca</button></div>`;
  const mo=document.getElementById('mostrando');
  if(mo)mo.textContent=arr.length>n?('Mostrando '+n+' de '+arr.length+' clientes.'):'';
  const lm=document.getElementById('lista-mais');
  if(lm)lm.innerHTML=rodapeLista(n,arr.length);
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
}
/* Repinta UMA linha depois de gravar. Os campos vivem na ficha, não mais dentro
   da linha: repintá-la aqui não tira o foco de ninguém — e assim o status, a
   etapa e o prazo acompanham a edição. Redesenhar a LISTA inteira durante a
   digitação continua proibido. */
function atualizarLinha(row){
  const l=LINHAS.find(x=>String(x.row)===String(row));if(!l)return;
  const no=document.querySelector('.cli[data-row="'+CSS.escape(String(row))+'"]');
  if(no){
    /* Se o foco estava NA linha (é onde ele volta ao fechar a ficha), ele volta
       para ela depois da repintura: uma gravação que termina meio segundo depois
       não pode jogar quem navega por teclado de volta para o topo da página. */
    const cabeca=no.querySelector('.cli-head');
    const tinhaFoco=!!cabeca&&document.activeElement===cabeca;
    no.innerHTML=linhaHTML(l);
    if(tinhaFoco){const nova=no.querySelector('.cli-head');if(nova)nova.focus();}
    no.className='cli '+classeUrg(l)+(ABERTA===String(row)?' aberto':'')+(FALHAS.has(String(row))?' falhou':'');
  }
  atualizarTopoFicha(row);   // e o topo da ficha mostra o nome e a situação novos
}
function irPara(row,k){
  // a linha precisa estar visível: solta a busca e os filtros antes de rolar até ela
  const busca=document.getElementById('busca');
  let mexeu=false;
  if((busca&&busca.value)||filtroAtivo()){
    /* O repouso das cinco caixas, que não é o mesmo estado nas cinco: prazos vazia
       (= todos), as quatro partições cheias (= todas). */
    FPRAZO=[];
    FETAPA=valoresDe(ETAPA_ITENS);FSTATUS=valoresDe(STATUS_ITENS);
    FRESP=valoresDe(RESP_ITENS);FATIVO=valoresDe(ATIVO_ITENS);
    if(busca)busca.value='';mexeu=true;
  }
  /* O teto não pode esconder justamente a linha para onde estamos indo. */
  const pos=ordenar(filtradas(busca?busca.value:'')).findIndex(l=>String(l.row)===String(row));
  if(pos>=TETO){TETO=Math.ceil((pos+1)/PASSO)*PASSO;mexeu=true;}
  if(mexeu)redesenhar();
  requestAnimationFrame(()=>{
    const no=document.querySelector('.cli[data-row="'+CSS.escape(String(row))+'"]');if(!no)return;
    no.scrollIntoView({block:'center'});
    no.classList.add('destaque');setTimeout(()=>no.classList.remove('destaque'),5000);   // 5 segundos na linha
    /* Quem clicou num quadro de prazo veio por causa DAQUELA tarefa: a ficha abre
       e o campo dela pisca lá dentro, que é onde a edição acontece agora. */
    abrirFicha(row);
    if(!k)return;
    const cel=document.querySelector('.corpo .fld[data-campo="'+CSS.escape(k)+'"]');
    if(cel){cel.classList.add('flash');cel.scrollIntoView({block:'center'});setTimeout(()=>cel.classList.remove('flash'),1700);}
  });
}
/* Todo [data-k] de dentro do elemento vira campo do salvamento — é o contrato de
   `rest_salvar` e ele não mudou. O parâmetro continua se chamando `tr` porque a
   função é a mesma: só que o elemento que embrulha os campos deixou de ser a
   linha da tabela e passou a ser o .corpo da ficha. */
function coletar(tr){const campos={};tr.querySelectorAll('[data-k]').forEach(el=>campos[el.dataset.k]=b4uParaPlanilha(el.value,el.dataset.k));return campos;}

/* ===================================================================
   A ficha do cliente (o modal)
   -------------------------------------------------------------------
   A lista mostra as colunas que a equipe lê de relance; o controle inteiro abre
   aqui, por cima, sem trocar de página e sem empurrar as outras linhas. Os
   campos são os MESMOS de sempre (mesmo data-k, mesmas opções, mesmas travas) —
   só mudou onde eles são pintados. E é isso que faz a lista ficar limpa: com
   nenhum campo na linha, ninguém altera sem querer.
   =================================================================== */
let ABERTA='';           // qual linha está com a ficha aberta (acende na lista)
let CAD_ROW='';          // de quem é a ficha aberta
let CAD_AVISADO=false;   // já avisamos que tem coisa por gravar? (fechar em 2 tempos)
function elCad(){return document.getElementById('modalCad');}
function cadAberto(){const m=elCad();return !!m&&!m.hidden;}
/** Aviso de "tem alteração por gravar" no rodapé; o botão passa a dizer que sai assim mesmo. */
function avisoCad(mostrar){
  const a=document.getElementById('cadAviso');if(a)a.hidden=!mostrar;
  const b=document.getElementById('cadFechar');if(b)b.textContent=mostrar?'Fechar assim mesmo':'Fechar';
}
/** Nome, ID e situação no topo da ficha — acompanham a edição sem redesenhar nada. */
function atualizarTopoFicha(row){
  if(!cadAberto()||String(CAD_ROW)!==String(row))return;
  const l=LINHAS.find(x=>String(x.row)===String(row));if(!l)return;
  const t=document.getElementById('cadTitulo');if(t)t.textContent=l.nome||'(sem nome)';
  const i=document.getElementById('cadId');if(i)i.textContent=l.id;
  const p=document.getElementById('cadSit');
  if(p){
    const st=String(l.status==null?'':l.status).trim(),cor=corDe('status',st);
    p.className='pill'+(st?'':' sem');
    p.textContent=st||'sem status';
    p.title=st?('STATUS: '+st):'Coluna STATUS em branco';
    p.style.background=st&&cor?cor:'';
    p.style.color=st&&cor?textoContraste(cor):'';
    p.style.borderColor=st&&cor?cor:'';
  }
}
/** Acende na lista a linha da ficha que está aberta. */
function marcarLinhaAberta(){
  document.querySelectorAll('.cli').forEach(n=>n.classList.toggle('aberto',String(n.dataset.row)===String(ABERTA)));
}
function abrirFicha(row){
  const l=LINHAS.find(x=>String(x.row)===String(row));if(!l)return;
  const m=elCad();if(!m)return;
  CAD_ROW=String(l.row);CAD_AVISADO=false;
  document.getElementById('cadBody').innerHTML=corpoHTML(l);
  m.hidden=false;
  /* Enquanto a ficha está aberta a página atrás não rola: rolar por baixo do véu
     faz perder de vista a linha para onde o foco volta ao fechar. */
  document.body.style.overflow='hidden';
  atualizarTopoFicha(CAD_ROW);
  avisoCad(false);
  ABERTA=CAD_ROW;marcarLinhaAberta();
  /* Reabrir não pode apagar o que não gravou: a faixa e o "tentar de novo"
     nascem de novo junto com os campos. */
  if(FALHAS.has(CAD_ROW))marcarFalha(CAD_ROW,true);
  const cx=m.querySelector('.modal-box');if(cx)cx.focus();
}
/* Grava agora o que estava esperando o debounce. É o salvar() de sempre, só sem
   os 450 ms de espera — e com o que está na tela AGORA. */
function descarregarPendentes(){
  const cx=document.querySelector('.corpo[data-row]');
  if(!cx||!PENDENTES.has(String(cx.dataset.row)))return;
  clearTimeout(timers[cx.dataset.row]);
  salvar(cx.dataset.row,cx.dataset.id,coletar(cx));
}
/* Fechar com alteração por gravar avisa antes, em dois tempos como o resto da
   casa (nunca uma caixa do navegador): o primeiro Fechar/Esc/clique no véu
   explica, o segundo sai. Ao sair assim mesmo a gravação pendente é DESCARREGADA
   na hora — deixar o debounce correndo com a ficha fora da tela é exatamente o
   jeito de perder o que foi digitado. */
function fecharFicha(){
  const m=elCad();if(!m||m.hidden)return;
  if(temPendencia()&&!CAD_AVISADO){CAD_AVISADO=true;avisoCad(true);return;}
  descarregarPendentes();
  m.hidden=true;
  document.body.style.overflow='';
  const row=CAD_ROW;CAD_ROW='';CAD_AVISADO=false;
  avisoCad(false);
  ABERTA='';marcarLinhaAberta();
  document.getElementById('cadBody').innerHTML='';
  /* O foco volta para a linha de onde saiu: quem navega por teclado não é jogado
     de volta para o topo da página. */
  const no=document.querySelector('.cli[data-row="'+CSS.escape(String(row))+'"] .cli-head');
  if(no)no.focus();
}
/* O botão "Salvar alterações" NÃO substitui o autosave: cada edição continua
   chamando agendarSalvar(), e é ele que impede perder texto digitado — foi para
   isso que ele existe nesta tela. O botão ANTECIPA a gravação pendente (mata o
   debounce e salva na hora), reenvia o que falhou e, quando tudo entrou, FECHA a
   ficha: salvar é o gesto de encerrar, e ficar com a ficha aberta depois de
   confirmar faz a pessoa clicar em Fechar sem saber se gravou.

   Só fecha se gravou MESMO. Falha mantém a ficha na tela: fechar por cima de uma
   gravação que não foi levaria embora o aviso e a chance de tentar de novo, e a
   pessoa sairia achando que salvou. */
async function salvarAgoraCad(){
  const btn=document.getElementById('cadSalvar');
  if(temPendencia()){
    if(btn){btn.disabled=true;btn.dataset.rot=btn.textContent;btn.textContent='Salvando…';}
    try{
      const fila=[];
      /* o que falhou antes volta para a fila com os MESMOS campos que não entraram */
      FALHAS.forEach((f,k)=>fila.push({row:k,id:f.id,campos:f.campos}));
      /* e a gravação que ainda estava no debounce sai na hora, com o que está na
         tela agora — que é mais novo do que qualquer coisa da fila */
      const cx=document.querySelector('.corpo[data-row]');
      if(cx&&PENDENTES.has(String(cx.dataset.row))){
        clearTimeout(timers[cx.dataset.row]);
        const item={row:cx.dataset.row,id:cx.dataset.id,campos:coletar(cx)};
        const j=fila.findIndex(x=>String(x.row)===String(item.row));
        if(j>=0)fila[j]=item;else fila.push(item);
      }
      FALHAS.clear();
      await Promise.all(fila.map(x=>salvar(x.row,x.id,x.campos)));
    }catch(e){ /* salvar() já registra a falha em FALHAS e avisa na tela */ }
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.rot||'Salvar alterações';}
  }
  if(temPendencia())return;            // não gravou: a ficha continua aberta
  CAD_AVISADO=false;avisoCad(false);
  fecharFicha();
}
let timers={};
/* ---------- pendências e falhas de gravação (C.3) ----------
   PENDENTES = alteração ainda no debounce. FALHAS = o servidor recusou e o dado
   só existe na tela. Nos dois casos fechar a aba pede confirmação; a linha fica
   marcada na lista (para se ver de longe) e o "tentar de novo" nasce dentro da
   ficha, que é onde o texto que não gravou está. */
const PENDENTES=new Set();
const FALHAS=new Map();
function temPendencia(){return PENDENTES.size>0||FALHAS.size>0;}
function marcarFalha(row,falhou){
  const chave=CSS.escape(String(row));
  /* A LINHA continua marcada na lista mesmo com a ficha fechada — é o que mostra,
     de longe, que aquele cliente tem coisa que não gravou. */
  const no=document.querySelector('.cli[data-row="'+chave+'"]');
  if(no)no.classList.toggle('falhou',!!falhou);
  /* A faixa e o "tentar de novo" vivem no .corpo, que hoje é pintado dentro da
     ficha: procurar pelo .corpo funciona esteja ele onde estiver (e não existe
     quando a ficha está fechada, que é o caso em que não há o que marcar). */
  const corpo=document.querySelector('.corpo[data-row="'+chave+'"]');
  if(!corpo)return;
  const cx=corpo.querySelector('.ign');
  if(!cx)return;
  if(falhou&&!cx.querySelector('.btn-retry')){
    /* O motivo técnico da recusa não vai para a tela; o que a pessoa precisa
       saber é que o texto continua aqui e que dá para mandar de novo. */
    cx.innerHTML='Não gravei o que você mudou aqui — o texto continua na tela. ';
    cx.insertAdjacentHTML('beforeend',
      '<button type="button" class="btn-retry" data-retry="'+esc(String(row))+'">não salvou — tentar de novo</button>');
  }
  if(!falhou)cx.innerHTML='';
}
/* O maquinário de gravação é o mesmo de antes da ficha: 450 ms de debounce, a
   linha inteira em cada envio, `rest_salvar`. O que mudou foi só de ONDE ele é
   chamado — do .corpo da ficha, e não mais do <tr> da grade. */
function agendarSalvar(tr){
  const row=tr.dataset.row,campos=coletar(tr);
  setSave('saving','Alterado…');
  PENDENTES.add(String(row));
  clearTimeout(timers[row]);
  timers[row]=setTimeout(()=>salvar(row,tr.dataset.id,campos),450);
}
async function salvar(row,id,campos){
  setSave('saving','Salvando…');
  PENDENTES.add(String(row));
  try{
    await postAcao({acao:'rest_salvar',row:+row,id,campos,cod:respAtual()});
    const l=LINHAS.find(x=>x.row==row);if(l)Object.keys(campos).forEach(k=>l[k]=campos[k]);
    PENDENTES.delete(String(row));FALHAS.delete(String(row));marcarFalha(row,false);
    setSave('ok','Salvo ✓ '+horaAgora());
    atualizarResumo();
    /* Uma linha só, e os chips e a contagem: redesenhar a LISTA inteira tiraria
       do lugar a linha que a pessoa acabou de abrir. */
    atualizarLinha(row);
    /* Gravou tudo: o aviso de "tem coisa por gravar" no rodapé da ficha sai, e o
       Fechar volta a ser Fechar. */
    if(!temPendencia()){CAD_AVISADO=false;avisoCad(false);}
    desenharChips();desenharResumoLista();
    if(FILTROS_UI)FILTROS_UI.atualizarContador();
  }catch(e){
    PENDENTES.delete(String(row));
    FALHAS.set(String(row),{id:id,campos:campos});
    marcarFalha(row,true);
    /* A linha fica marcada com o "tentar de novo"; a faixa só avisa que não foi.
       O motivo técnico da recusa não ajuda quem está digitando. */
    setSave('err','Não foi possível salvar. Tente de novo.');
  }
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
window.addEventListener('beforeunload',e=>{if(temPendencia()){e.preventDefault();e.returnValue='';}});

/* A régua inteira num handler só, antes dos campos da ficha. `TETO=PASSO` em todos:
   outro resultado, outro começo de lista. */
document.addEventListener('change',e=>{
  const id=e.target.id;
  /* Só a QUEDA passa por aqui: com o b4u-filtro.js no ar, o `f-prazo` é o botão da
     caixa (botão não dispara `change`) e os checkbox de dentro do painel sobem sem
     id nenhum, caindo no teste do dataset.k logo abaixo. Cada caixa avisa pelo
     `aoMudar` dela, montado no montarFiltros(). */
  if(e.target.tagName==='SELECT'&&/^f-(prazo|etapa|status|resp|ativo)$/.test(id||'')){
    escolherNoSelect(id.slice(2),e.target.value); TETO=PASSO; redesenhar(); return;
  }
  const el=e.target;if(!el.dataset||!el.dataset.k)return;
  if(el.tagName==='SELECT'&&el.dataset.opt){const cor=corDe(el.dataset.opt,el.value);el.style.background=cor||'';el.style.color=cor?textoContraste(cor):'';el.style.fontWeight=cor?'700':'600';}
  /* O data-row/data-id que era do <tr> agora é do .corpo da ficha: agendarSalvar
     continua recebendo o elemento que embrulha os campos daquela linha. */
  const cx=el.closest('.corpo[data-row]');if(cx)agendarSalvar(cx);
});
document.addEventListener('click',e=>{
  /* O "tentar de novo" mora dentro da ficha; para o clique nele não escorrer
     para nada mais, ele é o primeiro e para aqui. */
  const rt=e.target.closest('[data-retry]');
  if(rt){
    e.stopPropagation();
    const k=rt.dataset.retry,f=FALHAS.get(k);
    if(f){rt.textContent='enviando…';rt.disabled=true;salvar(k,f.id,f.campos);}
    return;
  }
  /* Rodapé da ficha: salvar agora, fechar, e o × do topo. Vêm ANTES do teste do
     véu, senão o clique no botão contaria como clique fora. */
  if(e.target.closest('#cadSalvar')){salvarAgoraCad();return;}
  if(e.target.closest('#cadFechar')||e.target.closest('#fechaCad')){fecharFicha();return;}
  if(e.target.id==='modalCad'){fecharFicha();return;}
  /* Clicar na linha abre a ficha — é o único jeito de editar agora. */
  const head=e.target.closest('.cli-head');
  if(head){const no=head.closest('.cli');if(no)abrirFicha(no.dataset.row);return;}
  /* Ordenar pelo título da coluna: primeiro clique A→Z, o seguinte Z→A. É o único
     caminho da ordenação desde que o #f-ord saiu da régua, e ele vale nas duas
     larguras — no celular os mesmos botões são a fileira de pílulas.
     Redesenhar a lista já repinta o cabeçalho (ele é montado no `desenhar()`), e é
     assim que a seta e o `aria-sort` acompanham o clique. */
  const th=e.target.closest('[data-sort]');
  if(th){
    const k=th.dataset.sort;
    /* O botão que a pessoa clicou é DESTRUÍDO e recriado pelo desenhar() logo
       abaixo (o cabeçalho é montado junto com a lista). Quem estava no teclado
       perderia o foco para o topo do documento a cada ordenação — então ele é
       devolvido ao botão equivalente, quando era ali que ele estava. */
    const tinhaFoco=th.contains(document.activeElement);
    if(SORT.key===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.key=k;SORT.dir='asc';}
    TETO=PASSO;                                // outra ordem, outro começo de lista
    desenhar(document.getElementById('busca').value);
    if(tinhaFoco){
      const novo=document.querySelector('.lista-cab [data-sort="'+CSS.escape(k)+'"]');
      if(novo)novo.focus({preventScroll:true});
    }
    return;}
  if(e.target.closest('#btn-limpar,[data-limpar]')){limparFiltros();return;}
  /* "mais 20" para quem está lendo, "todos" para quem vai usar Ctrl+F. */
  if(e.target.closest('.btn-mais')){TETO+=PASSO;desenhar(document.getElementById('busca').value);return;}
  if(e.target.closest('.btn-todos')){TETO=baseRows().length;desenhar(document.getElementById('busca').value);return;}
  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto,tk.dataset.k);return;}
});
/* Enter num campo da ficha grava a linha inteira NA HORA (C.14) — é o mesmo gesto
   que existia na grade, onde ele também descia para a mesma coluna da linha
   seguinte. Aqui não há linha seguinte: a ficha é de um cliente só, e a próxima
   se abre pela lista. O que fazia diferença de verdade — não esperar os 450 ms
   com o texto ainda só na tela — continua igual. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.ctrlKey||e.metaKey||e.altKey)return;
  const el=e.target;
  if(!el.dataset||!el.dataset.k||el.tagName==='TEXTAREA')return;   // no textarea Enter é quebra de linha
  const cx=el.closest('.corpo[data-row]');if(!cx)return;
  e.preventDefault();
  clearTimeout(timers[cx.dataset.row]);
  salvar(cx.dataset.row,cx.dataset.id,coletar(cx));
});
/* Atalhos de busca (C.4): "/" foca, Esc limpa. Não atrapalha quem digita noutro
   campo — só o Esc dentro da própria busca continua valendo. Com a ficha aberta,
   Esc é dela antes de tudo, e a linha da lista (role="button") abre com Enter e
   Espaço: sem isto a tela ficaria só para o mouse. */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&cadAberto()){e.preventDefault();fecharFicha();return;}
  const linha=e.target&&e.target.closest&&e.target.closest('.cli-head');
  if(linha&&(e.key==='Enter'||e.key===' '||e.key==='Spacebar')){
    e.preventDefault();
    const no=linha.closest('.cli');if(no)abrirFicha(no.dataset.row);
    return;
  }
  /* A linha da listinha dos cinco quadros virou role="button" quando os cartões
     viraram lista (é assim que o daily desenha as dele), e role="button" que só
     responde ao mouse é pior que div nenhuma: promete teclado e não entrega. */
  const tk=e.target&&e.target.closest&&e.target.closest('.tk[data-goto]');
  if(tk&&(e.key==='Enter'||e.key===' '||e.key==='Spacebar')){
    e.preventDefault();
    irPara(tk.dataset.goto,tk.dataset.k);
    return;
  }
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';TETO=PASSO;redesenhar();}
});
window.addEventListener('hashchange',carregar);   // trocar o código (#) recarrega para o colaborador certo

document.getElementById('volta').href='colaborador?chave='+encodeURIComponent(chaveAtual());

/* ---------------- menu lateral ----------------
   Montado ANTES de carregar(): a identidade desta tela é a chave, que já está na
   URL desde a primeira linha deste script — não há o que esperar da API. E se a
   busca falhar, a tela de bloqueio ou o erro pintam dentro do #app com o menu
   inteiro de pé, que é a mesma razão de o erro nunca ser pintado no <body>.
   Sem `contexto`: quando a página abre ela ainda não sabe o nome do responsável
   (ele vem no payload, na tag da barra), e o menu ignora uma segunda montagem de
   propósito — inventar um rótulo agora seria pior que bloco nenhum.
   Os links levam só a chave, exatamente como o "← Painel" desta página: o `cod`
   nunca entrou no caminho de volta daqui. */
if (window.B4UShell) {
  B4UShell.montar({
    perfil: 'equipe',
    ativo: 'restituicao',
    link: function (pag) { return pag + '?chave=' + encodeURIComponent(chaveAtual()); }
  });

  /* O botão de quem está usando (e, com ele, o seletor de aparência) nasce junto
     do menu lateral, com rótulo genérico. O nome entra depois, quando a API
     responder — ver a chamada de `usuario({nome})` no carregar(). */
  B4UShell.usuario();
  /* Esta página tem <base target="_blank">, para o colaborador nunca perder a
     tela em que estava ao abrir um link do cliente. O menu lateral é o contrário
     disso: é navegação DENTRO do painel, e sair pela guia atual é o gesto — a
     mesma exceção que o logo e o "← Painel" já traziam escrita à mão.
     Só marcamos quem ainda não tem alvo próprio: assim o WhatsApp do rodapé do
     menu (que nasce com target="_blank") continua abrindo em guia nova. */
  document.querySelectorAll('.b4s-side a[href]').forEach(function (a) {
    if (!a.getAttribute('target')) a.setAttribute('target', '_self');
  });
}

carregar();
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador') {
        try { href = 'colaborador?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
