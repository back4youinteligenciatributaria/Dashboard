<style>
/* B4U-DESIGN:INICIO — paleta, cantos e fonte que as 22 páginas dividem.
   Bloco copiado de b4u-design.css (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-design.js`.

   Entra ANTES do <style> da página de propósito — é a camada base. Se esta
   página precisar mesmo de um valor diferente, redeclare o token no `:root`
   dela, que vem depois e vence. */
:root{
  /* ── Superfícies ─────────────────────────────────────────────────────────
     `--canvas` é o bege do fundo da página; `--surface` é o branco do cartão
     que se apoia nele; `--surface-warm` é o branco quebrado das faixas e
     cabeçalhos de tabela, que separam sem precisar de borda. */
  --canvas:#F1E7DC;
  --surface:#FFFFFF;
  --surface-warm:#FBF6EF;

  /* ── Letra ───────────────────────────────────────────────────────────────
     `--ink` é o texto normal, `--ink-2` o secundário, `--muted` o rótulo.
     `--muted` já foi #8A7D70 e reprovava em contraste (3,28:1); #6E6256 dá
     4,85:1 no bege e 5,92:1 no branco, e é a cor de quase todo rótulo do
     sistema — por isso ela precisa passar, e não só quase. */
  --ink:#113D39;
  --ink-2:#3F5854;
  --muted:#6E6256;

  /* ── Traços ──────────────────────────────────────────────────────────────
     `--line` divide o que é do mesmo grupo; `--line-2` fecha o que é caixa. */
  --line:#E4D9C9;
  --line-2:#D6C3AC;

  /* ── Marca ───────────────────────────────────────────────────────────────
     `--brand-teal` é canônico em logo, foco, borda e série de gráfico. Como
     TEXTO ele reprova (4,11:1 no branco, 3,44:1 no receita-soft), e para isso
     existe o `--brand-teal-txt`: o mesmo teal escurecido, 5,54:1 no branco e
     4,54:1 no bege, usado só onde é letra ou fundo de letra. Os dois são a
     mesma cor com dois trabalhos. O 4,54:1 passa, mas passa RASPANDO: quem for
     escurecer o `--canvas` um dia tem de conferir este par antes. */
  --brand-dark:#073034;
  --brand-teal:#0F8C85;
  --brand-euc:#3FA680;
  --brand-teal-txt:#0C756F;

  /* ── SINAL: as quatro cores que querem dizer alguma coisa ────────────────
     Estas quatro NÃO seguem o tema (ver OS QUATRO TEMAS, no fim do arquivo). Se
     "vencido" mudasse de vermelho conforme a pele escolhida, a cor deixaria de
     ser informação e viraria decoração — e quem trabalha nesta tela o dia
     inteiro lê a cor antes de ler a palavra.

     `--amber` tem 2,61:1 no branco: serve de PREENCHIMENTO e de borda, nunca de
     letra. Para letra âmbar existe o `--amber-txt` (5,91:1 no branco).

     ┌── PENDÊNCIA CONHECIDA: `--verde` E `--vermelho` REPROVAM COMO LETRA ────┐
     │                                                                        │
     │ Os dois NÃO têm o par `-txt` que o âmbar tem, e são usados nas duas     │
     │ funções ao mesmo tempo:                                                │
     │                                                                        │
     │     --verde     12 usos como `color`, 11 como `background`, 7 em borda │
     │     --vermelho  41 usos como `color`, 31 como `background`, 41 em borda │
     │                                                                        │
     │ E o lado TEXTO reprova. Medido nos valores atuais:                     │
     │                                                                        │
     │     --verde     #2E9D5F   2,82:1 no bege · 3,44:1 no branco   REPROVA  │
     │     --vermelho  #C0392B   4,46:1 no bege · 5,43:1 no branco   raspando │
     │                                                                        │
     │ O mínimo para texto é 4,5:1. É a mesma falha do `--muted` antigo (que   │
     │ dava 3,28:1), e atinge `.hint.ok` e `.lk.ok`, que são letra e nada      │
     │ mais. Há prova de que alguém já tinha esbarrado nisso sem nomear: o     │
     │ `.det-fbtn.ativo` escreve `color:#0E5B37` à mão — um verde bem mais     │
     │ escuro — em vez de usar o token.                                       │
     │                                                                        │
     │ CONSERTO MEDIDO E NÃO APLICADO (decisão de 10/08/2026):                 │
     │                                                                        │
     │     --verde     #2E9D5F -> #1F7546   (2,82:1 -> 4,66:1 no bege)        │
     │     --vermelho  #C0392B -> #BB3728   (4,46:1 -> 4,66:1 no bege)        │
     │                                                                        │
     │ Matiz e saturação ficam onde estão; só a luminosidade desce, o mínimo   │
     │ para passar com folga. Escurecer é seguro pelo lado do FUNDO: TODAS as  │
     │ regras `background:var(--verde)` / `background:var(--vermelho)` já vêm  │
     │ com `color:#fff` (ou são faixa/pontinho sem texto), e fundo mais escuro │
     │ com letra branca só melhora.                                           │
     │                                                                        │
     │ POR QUE NÃO FOI APLICADO AGORA: mexer nestes dois repinta as 22         │
     │ páginas, inclusive as 8 do cliente. A rodada que centralizou os tokens  │
     │ era de ESTRUTURA — nenhum pixel de cor mudou nela de propósito, para    │
     │ que qualquer diferença que aparecesse em produção tivesse uma causa só. │
     │ Trocar cor é decisão de produto e vai junto da varredura do MODO        │
     │ ESCURO, que já vai ter de abrir os 22 arquivos.                         │
     │                                                                        │
     │ QUANDO FOR FAZER, olhe também o `--verde-2`: várias páginas o declaram  │
     │ valendo #25804C, com a nota "o verde um degrau mais escuro, para virar  │
     │ FUNDO de texto branco". Com o conserto acima, o `--verde` do núcleo     │
     │ fica MAIS ESCURO que o `--verde-2`, e a convenção do sufixo -2 se       │
     │ inverte nesse par. Não dá para resolver daqui: o `--verde-2` mora no    │
     │ `:root` de cada página.                                                │
     └────────────────────────────────────────────────────────────────────────┘

     (Escrito assim, sem dois-pontos colado no nome, de propósito: a
     `tokensCanonicos()` do `_aplica-design.js` varre este bloco com um regex de
     declaração e NÃO pula comentário. Nome de token seguido de dois-pontos aqui
     dentro vira token canônico de mentira, e o `--verde-2` de mentira faria as
     22 páginas aparecerem como "exceção mantida" no terminal. Vale para todo
     comentário deste arquivo: cite o token, nunca o escreva como declaração.) */
  --amber:#E8892E;
  --amber-txt:#8A5A10;
  --vermelho:#C0392B;
  --verde:#2E9D5F;

  /* ── Cantos ──────────────────────────────────────────────────────────────
     Uma escala só, no site inteiro, e mais QUADRADA que redonda.
       4px  campo, selo, célula
       6px  cartão, linha da lista, botão
       8px  bloco grande e modal
     `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é citado
     em mais de cem regras, mas o valor acompanha o resto — pílula virou
     etiqueta. Círculo de verdade (avatar, contador, spinner) continua com
     `border-radius:50%` escrito na regra e não passa por aqui. */
  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-pill:6px;

  /* ── Escala tipográfica ──────────────────────────────────────────────────
     Seis degraus, e o pulo entre eles é de propósito irregular: 11-12-13 é a
     faixa de rótulo, selo e nota de rodapé, onde 1px já muda a hierarquia; 15 é
     o corpo; 19 e 24 são título de bloco e de tela. Um degrau constante (1,2×,
     por exemplo) daria 11-13-16-19-23-28 e gastaria três tamanhos na faixa em
     que o olho não distingue nada.
     ATENÇÃO: o `body{font-size:15px}` das páginas está escrito à mão e NÃO sai
     daqui. Quem mexer na escala não muda o corpo do texto; muda só quem usa
     `var(--fs-N)` — que é rótulo, selo, cabeçalho de tabela e título. */
  --fs-1:11px;
  --fs-2:12px;
  --fs-3:13px;
  --fs-4:15px;
  --fs-5:19px;
  --fs-6:24px;

  /* ── Fonte ───────────────────────────────────────────────────────────────
     Montserrat vem do Google Fonts, declarado no <head> de cada página. O
     `system-ui` é o que aparece enquanto ela não chega — e é o que fica se ela
     não chegar nunca. */
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
/* B4U-DESIGN:FIM */
</style>
<style>
:root{
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,37:1 no canvas).
     Este e o mesmo teal escurecido so para letra e fundo de letra; o --brand-teal
     segue canonico em logo, foco, bordas e preenchimentos. */
  --amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber da 2,61:1 com #fff, o --amber-2 da 4,68:1. Como
     preenchimento de barra, icone ou borda, o --amber original continua valendo. */
  --amber-2:#B05F12;
  --verde-2:#25804C;
  /* Escala de texto e o teal claro: as outras telas ja tinham, esta nao. Sem eles
     o CSS compartilhado da regua de acoes cai no valor herdado e desalinha. */
  --receita-soft:#DBEFEC;
  /* Levantar de cartao clicavel: uma sombra so, igual em todas as telas. */
  --lift:0 8px 20px rgba(17,61,57,.10);
  /* As colunas da listinha dos 5 quadros (ID · Cliente · Etapa · Responsável ·
     Prazo). Mora aqui, e não na regra, porque o cabeçalho e a linha leem os dois
     a mesma variável — é o que impede que uma seja mexida sem a outra. O nome do
     cliente leva o maior peso pelo mesmo motivo da lista principal: é o que a
     pessoa procura, e era o primeiro a ser cortado. */
  --rcols:58px minmax(0,2.4fr) minmax(0,1.4fr) minmax(0,1.2fr) 108px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:var(--radius-pill)}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd}.barra a.volta{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600}
.save-status{font-size:13px;font-weight:800;padding:6px 13px;border-radius:var(--radius-pill);background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
/* Branco sobre --amber da 2,61:1 e sobre --verde 3,44:1 — o rotulo do proprio
   status de gravacao some. Um degrau mais escuro na MESMA familia: 4,68:1 e 4,92:1. */
.save-status.saving{background:var(--amber-2);color:#fff}.save-status.ok{background:var(--verde-2);color:#fff}.save-status.err{background:var(--vermelho);color:#fff}
.topo{padding:12px 16px 8px}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chips .rot{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font-family:var(--sans);font-size:13px;font-weight:700;border-radius:var(--radius-pill);padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--brand-teal)}
.chip.on{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.chip .n{background:rgba(0,0,0,.10);border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.chip.alerta.on{background:var(--vermelho);border-color:var(--vermelho)}
.chip.aviso.on{background:var(--amber);border-color:var(--amber)}
.chip.espera.on{background:#007EB5;border-color:#007EB5}
.chip.zero{opacity:.5}
.chip.limpar{border-style:dashed;color:var(--muted)}
.chip .ord{margin-left:5px;font-size:11px;opacity:.9}
/* faixa de filtros rapidos, logo acima da tabela */
.filtros{padding:0 16px 10px}
.busca{width:100%;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:var(--radius-pill);padding:12px 20px}
.dica{font-size:12px;color:var(--muted);margin-top:7px}
/* ---------- "Ver quem está em cada situação": os 5 quadros no formato do daily ----------
   Eram cinco CARTÕES lado a lado (grid de minmax(255px,1fr)), cada um com a sua
   listinha rolando por dentro num quadro de 168px. Três estragos, todos do
   FORMATO e nenhum do dado:

     · a lista rolava por dentro do cartão — o sexto item de um quadro de doze só
       existia para quem descobrisse que aquilo rolava;
     · num cartão de 255px o nome do cliente cabia em três palavras, e quem
       precisava do nome inteiro tinha de parar o mouse em cima;
     · data, cliente e etapa vinham empilhados em linha corrida, sem coluna: não
       dava para correr o olho por nenhum dos três.

   O daily já tinha resolvido isso, e o dono pediu a MESMA forma: cabeçalho do
   grupo com o nome e a contagem ao lado, cabeçalho de colunas logo abaixo, e uma
   linha por item. As colunas aqui são as da restituição (ID · Cliente · Etapa ·
   Responsável · Prazo), não as do daily.

   AS CINCO CATEGORIAS SÃO AS MESMAS. Quem cai em qual quadro continua sendo o
   computeResumo(), que não foi tocado nesta rodada. */
.resumo{padding:0 16px 12px}
/* Grupo VAZIO não aparece — é o que o daily faz (o `agrupar()` dele termina em
   `.filter(o=>o.itens.length)`). Antes, cada cartão vazio dizia "Nada por aqui
   🎉": com a semana calma, eram cinco caixas dizendo que não há nada. Quando não
   há mesmo nada em nenhum dos cinco, a frase aparece uma vez só. */
.rgrupo{margin:16px 0 6px;display:flex;align-items:baseline;gap:9px}
.rgrupo:first-child{margin-top:4px}
.rgrupo h3{margin:0;font-size:var(--fs-2);text-transform:uppercase;letter-spacing:.06em;
  font-weight:800;color:var(--muted)}
.rgrupo .n{font-size:var(--fs-2);color:var(--muted);font-weight:700}
/* A urgência que o cartão dizia com a cor do cabeçalho continua dita em dois
   lugares: no título do grupo e na faixa lateral da linha.
   No TÍTULO só as duas que são escala — vermelho no que venceu, âmbar no que
   vence esta semana —, na mesma régua dos marcadores !! e ! da régua de filtros.
   "Próxima semana", "Mais adiante" e "Cobrar" ficam no cinza dos rótulos: não são
   grau de urgência, e pintar os cinco é o mesmo que não pintar nenhum.
   Na FAIXA lateral as cinco cores voltam inteiras (era o fundo do .rhead), porque
   ali elas separam grupo de grupo quando a página rola e o título saiu da tela. */
.rgrupo.atrasada h3{color:#8E2A1D}
.rgrupo.semana h3{color:var(--amber-txt)}
/* A régua de colunas mora numa variável, e o cabeçalho e a linha leem a MESMA —
   é o que impede as duas de desalinharem quando alguém mexer numa delas. */
.rcab,.tk{display:grid;grid-template-columns:var(--rcols);gap:0 12px;align-items:center}
/* Os 17px da esquerda somam os 13px de recuo da linha aos 4px da faixa lateral
   colorida dela; os 14px da direita somam os 13px à borda de 1px. Sem essa conta
   as colunas do cabeçalho ficam fracionadas em relação às da linha — pouco para
   alguém apontar o dedo, o bastante para o olho não confiar no alinhamento, que é
   a única coisa que esta grade tem a oferecer. */
.rcab{padding:2px 14px 5px 17px;font-size:var(--fs-1);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted)}
.rcab span:last-child{text-align:right}
.rlista{display:flex;flex-direction:column;gap:5px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  border-left:4px solid var(--line-2);padding:9px 13px;cursor:pointer;font-size:var(--fs-3)}
.tk:hover{border-color:var(--line-2);box-shadow:0 1px 5px rgba(7,48,52,.07)}
.tk:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.tk.g-atrasada{border-left-color:var(--vermelho)}
.tk.g-semana{border-left-color:var(--amber)}
.tk.g-proxima{border-left-color:var(--brand-teal-txt)}
.tk.g-adiante{border-left-color:#6B8486}
.tk.g-cobrar{border-left-color:#007EB5}
.tk-id{font-size:var(--fs-2);font-weight:700;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tk-nome{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-etapa,.tk-resp{font-size:var(--fs-2);color:var(--ink-2);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-prazo{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--ink)}
.tk-prazo.sem{color:var(--muted);font-weight:600}
.rvazio{color:var(--muted);font-size:var(--fs-3);padding:14px 4px}
/* Abaixo de 900px a grade desmonta do mesmo jeito que a linha da lista principal
   desmonta logo abaixo, e pelo mesmo motivo: 58px de ID ao lado de 108px de prazo
   deixariam o nome do cliente com uns 60px. Nome e prazo na primeira linha da
   MESMA faixa, o resto numa segunda, menor. Continua sendo uma linha clicável só. */
@media(max-width:900px){
  .rcab{display:none}
  .tk{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  /* Quebra forçada: sem ela o "resto" subiria para a primeira linha sempre que
     sobrasse espaço. */
  .tk::after{content:"";order:3;flex:0 0 100%;height:0}
  /* `1 1 0` e não `1 1 auto`: com base automática o nome pede a largura inteira
     do texto, ganha a linha toda e empurra a DATA para a linha de baixo — e a
     data é justamente o que se lê primeiro num quadro de prazos. Com base zero
     ele fica com o que sobrar e corta com reticências, que é o que o daily faz
     na coluna de assunto dele. */
  .tk-nome{order:1;flex:1 1 0;min-width:0}
  .tk-prazo{order:2;flex:none}
  .tk-id,.tk-etapa,.tk-resp{order:4;flex:0 1 auto;font-size:var(--fs-2);color:var(--muted);text-align:left}
}
/* ---------- a linha da lista: colunas-chave alinhadas, respiro de lista ----------
   Seis colunas por linha (ID · Cliente · Responsável · Etapa atual · Prazo ·
   Situação) e o controle inteiro na ficha, que abre ao clicar. NÃO é <table> de
   propósito: a grade do CSS convive com os cartões e os blocos recolhíveis que
   já existem aqui, e a tabela de 28 colunas obrigava a rolar para o lado — era
   rolando que se perdia de vista justamente o nome de quem se estava editando.
   O cabeçalho (.lista-cab) repete a MESMA régua de colunas — as duas larguras
   moram na mesma regra justamente para não desalinharem quando alguém mexer. */
/* Fecha em 4px porque a régua "Mostrando N de M" e os botões de mostrar mais
   vêm logo abaixo, fora do quadro: o respiro do fim da página é deles. */
.lista{padding:12px 16px 4px;display:flex;flex-direction:column;gap:8px}
#lista-mais{padding-bottom:44px}
.cli{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cli.aberto{border-color:var(--brand-teal);box-shadow:0 5px 20px rgba(7,48,52,.10)}
/* Faixa lateral pela URGÊNCIA, e não pelo STATUS: o STATUS já está na pílula da
   última coluna, com a cor exata da planilha, e repeti-lo na faixa não diria
   nada de novo. O que a lista fechada precisa entregar de relance é "em quem eu
   preciso mexer hoje": atrasado, vencendo esta semana, ou parado com o cliente. */
.cli.urg-atrasado{border-left:4px solid var(--vermelho)}
.cli.urg-semana{border-left:4px solid var(--amber)}
.cli.urg-espera{border-left:4px solid #007EB5}
.cli.urg-ok{border-left:4px solid var(--verde)}
.lista-cab,.cli-head{display:grid;
  /* O nome é o que a pessoa procura na lista e era o primeiro a ser cortado —
     "AJUB - Cirurgia de Cab…" não identifica ninguém. Ele leva o maior peso; a
     etapa cede, porque ali o texto é curto e sempre o mesmo punhado de rótulos. */
  grid-template-columns:58px minmax(0,2.2fr) minmax(0,1.1fr) minmax(0,1.3fr) 104px minmax(0,162px);
  gap:12px;align-items:center}
.lista-cab{padding:0 14px;font-size:var(--fs-1);font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted)}
/* ---------- ORDENAR PELO TÍTULO DA COLUNA ----------
   O cabeçalho é o único jeito de ordenar esta tela: a lista suspensa "Ordenar
   por" da régua (#f-ord) saiu, e os seis critérios dela são exatamente estas seis
   colunas. Por isso ele deixou de ser um enfeite discreto:

     · 44px de altura de alvo, e não os ~14px do texto. Era uma tira de letra de
       11px que dava para clicar com o mouse e não dava com o dedo;
     · a coluna ativa se anuncia com `aria-sort` (no <span role="columnheader">) e
       com a seta ▲/▼ ao lado do rótulo, que é a mesma coisa dita para quem lê a
       tela e para quem a ouve;
     · e ele NÃO some mais no celular. Some a GRADE — abaixo de 900px os mesmos
       seis botões viram uma fileira de pílulas com o rótulo "Ordenar por" na
       frente. Sem isso, tirar o #f-ord teria tirado a ordenação inteira do
       celular, que é justamente onde ela serve para achar o mais atrasado. */
.lista-cab button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  text-transform:inherit;letter-spacing:inherit;text-align:inherit;
  min-height:44px;display:inline-flex;align-items:center;gap:2px}
.lista-cab span:last-child button{margin-left:auto}
.lista-cab button:hover{color:var(--brand-teal-txt)}
.lista-cab [aria-sort] button{color:var(--brand-teal-txt)}
/* O rótulo "Ordenar por" só existe na fileira de pílulas do celular: na grade ele
   seria uma sétima coluna e empurraria as seis para fora do lugar. */
.lista-cab .lc-rot{display:none}
.cli-head{width:100%;text-align:left;background:none;border:0;padding:12px 14px;
  cursor:pointer;font-family:var(--sans);color:inherit}
.cli-head:hover{background:var(--surface-warm)}
/* O .cli tem overflow:hidden e o contorno global (offset 2px) sairia cortado na
   borda do cartão: aqui ele entra para dentro, senão o foco de teclado some. */
.cli-head:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.c-id{font-size:var(--fs-2);font-weight:700;color:var(--muted);white-space:nowrap}
.c-nome{font-weight:600;font-size:var(--fs-4);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-resp,.c-etapa{font-size:var(--fs-3);color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Valor e data em algarismo de largura fixa e alinhados à direita: uma coluna de
   números desalinhados é justamente o que se lê errado quando se confere uma
   linha atrás da outra. */
.c-val{font-size:var(--fs-3);color:var(--ink-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.c-val.atrasado{color:var(--vermelho);font-weight:800}
.c-val.semana{color:var(--amber-txt);font-weight:800}
.c-fim{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
/* Coluna em branco continua dizendo o NOME do que falta ("sem responsável",
   "sem prazo") em vez de um vazio mudo — é o sinal de tarefa que a linha sempre
   deu. Classe própria: o `.vazio` da lista sem resultado tem 15px e padding de
   30px, e já inchou um selo destes num balão de 80px de altura. */
.c-falta{font-size:var(--fs-2);color:var(--muted);font-weight:600}
/* Abaixo de 900px as seis colunas não cabem lado a lado: nome e situação ficam na
   primeira linha da MESMA faixa e o resto desce para uma segunda, menor. Continua
   sendo uma linha clicável só — não vira dois cartões. */
@media(max-width:900px){
  /* A GRADE do cabeçalho some; os BOTÕES ficam. Viram uma fileira de pílulas que
     quebra em quantas linhas precisar, cada uma com 44px de alvo — é a ordenação
     que antes morava no #f-ord, agora nos mesmos seis botões da versão larga (um
     desenho só, um estado só, um `aria-sort` só). */
  .lista-cab{display:flex;flex-wrap:wrap;align-items:center;gap:6px 7px;padding:2px 16px 8px}
  .lista-cab .lc-rot{display:inline;font-weight:800;color:var(--muted);align-self:center}
  .lista-cab span{text-align:left!important}
  .lista-cab span:last-child button{margin-left:0}
  .lista-cab button{padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-pill);
    background:var(--surface)}
  .lista-cab [aria-sort] button{border-color:var(--brand-teal);background:var(--receita-soft)}
  .cli-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  /* Quebra forçada: sem ela o "resto" subiria para a primeira linha sempre que sobrasse espaço. */
  .cli-head::after{content:"";order:3;flex:0 0 100%;height:0}
  .c-nome{order:1;flex:1 1 auto}
  .c-fim{order:2;flex:none;flex-direction:row;align-items:center;gap:6px}
  .c-id,.c-resp,.c-etapa,.c-val{order:4;flex:0 1 auto;font-size:var(--fs-2);color:var(--muted);text-align:left}
}
/* Pílula de situação: é o STATUS da planilha, com a MESMA cor da formatação
   condicional (corDe + textoContraste). Ela NUNCA corta o próprio texto —
   "PROSPECTIVO SOMENTE PROTOCOLADO" cortado não identifica situação nenhuma —,
   então quebra em duas linhas quando precisa. Sem status é cinza e diz "sem
   status", nunca fica em branco. */
.pill{font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:2px 9px;letter-spacing:.2px;
  border:1px solid transparent;white-space:normal;line-height:1.3;text-align:center}
.pill.sem{background:#EEE9E2;color:var(--muted);border-color:var(--line)}
/* Status QUE EXISTE mas que a formatação condicional da planilha não pinta. Não é
   o mesmo caso do `.sem` (coluna em branco): aqui há uma situação escrita, ela só
   não tem cor combinada. Sem esta regra a pílula ficava sem fundo e sem borda —
   texto solto numa coluna de pílulas, que se lê como "isto não é um status".
   E o caso não é hipotético: a lista da caixa de STATUS sai do que a planilha
   trouxe (`unicos(l=>l.status)`), então um status novo digitado amanhã cai aqui
   no mesmo dia em que aparece na régua. Contorno em vez de preenchimento, de
   propósito: cor cheia insinuaria uma cor combinada que ninguém combinou. */
.pill.ncor{background:var(--surface);color:var(--ink-2);border-color:var(--line-2)}
.vazio{padding:30px 16px;text-align:center;color:var(--muted);font-size:15px}

/* ---------- a ficha do cliente (o modal) ----------
   O mesmo desenho do registro.html: véu escuro, caixa com cabeçalho fixo, miolo
   que rola e rodapé sempre à vista com o indicador de gravação e os botões. */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:90;background:rgba(7,48,52,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
/* O modal cobre a janela inteira (position:fixed;inset:0), inclusive a faixa dos
   264px onde mora o menu lateral — e o menu é z-index:940. Com os 90 daqui, o
   menu ficava POR CIMA do véu: clicável enquanto se digita, e um clique
   distraído troca de página com a ficha aberta e o texto por gravar.
   A regra é escopada em `body.b4s` de propósito: sem o b4u-shell.js a página
   continua com os 90 originais e nada muda. */
body.b4s .modal{z-index:960}
/* Esta regra garante o 960 também quando o b4u-shell.js não carregou (aí o
   `body.b4s` não existe) — a ficha é onde se DIGITA. */
.modal.modal-cad{z-index:960}
.modal-box{background:var(--canvas);border-radius:var(--radius-lg);width:100%;max-width:920px;overflow:hidden;box-shadow:0 20px 60px rgba(7,48,52,.35)}
/* Rodapé fixo: a caixa é uma coluna com altura de tela, o miolo rola e o rodapé
   (status + salvar + fechar) fica sempre à vista. */
.modal-cad .modal-box{display:flex;flex-direction:column;max-height:calc(100vh - 72px);margin:36px auto}
.modal-cad .modal-body{flex:1;min-height:0;overflow:auto}
.modal-cad .modal-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:11px 16px;background:var(--surface);border-top:1px solid var(--line)}
.modal-cad .modal-foot .spacer{flex:1}
.modal-top{position:sticky;top:0;z-index:2;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:10px;padding:13px 16px}
.modal-top b{font-size:15px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-top .cad-id{font-size:12px;font-weight:700;color:#cfe6e2;white-space:nowrap}
.modal-top .spacer{flex:1}
.modal-top button{font-family:var(--sans);font-size:19px;font-weight:800;line-height:1;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:var(--radius-pill);width:32px;height:32px;cursor:pointer}
.modal-body{padding:16px}
/* O MESMO indicador aparece em dois lugares: a faixa da barra escura e o rodapé
   da ficha (claro). Só o estado neutro precisa de outra tinta — o da barra é
   feito para fundo escuro e sumiria no branco. Vem ANTES dos estados coloridos
   de propósito: mesma especificidade, quem vier depois ganha. */
.save-status.claro{background:var(--surface-warm);color:var(--ink-2)}
/* Aviso de "tem coisa por gravar": aparece no primeiro pedido de fechar e o
   segundo fecha assim mesmo — confirmação em dois tempos, sem caixa do navegador. */
.cad-aviso{font-size:12px;font-weight:700;color:#8a5117;background:var(--amber-soft);
  border:1px solid var(--amber-line);border-radius:var(--radius-sm);padding:6px 10px}
.cad-aviso[hidden]{display:none}
@media(max-width:640px){
  .modal-cad{padding:8px}
  .modal-cad .modal-box{max-height:calc(100vh - 16px)}
}
/* ---------- o conteúdo da ficha: os mesmos campos, agrupados por assunto ----------
   As seções saem do pareamento que a tela já usa (etapa + prazo + link), então
   não existe uma segunda lista de colunas para manter em dia. */
.corpo{padding:0}
.gsec{margin-bottom:13px}
.gsec:last-of-type{margin-bottom:6px}
.gsec h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand-dark);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.gsec h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--brand-teal);flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fld{display:flex;flex-direction:column;min-width:0}
.fld.full{grid-column:1/-1}
.fld>.lbl{font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .cad{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.fld input,.fld select,.fld textarea{font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
.fld textarea{resize:vertical;min-height:52px;line-height:1.35}
.fld select{font-weight:600;cursor:pointer}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand-teal);outline-offset:0}
.fld .linha-campo{display:flex;gap:7px;align-items:center}
.fld .linha-campo a.abrir{color:var(--brand-teal-txt);text-decoration:none;font-weight:800;font-size:15px;flex:none}
/* Somente-leitura dentro da ficha: caixa tracejada, do mesmo jeito do registro.
   CNPJ e e-mail continuam POR EXTENSO, sem reticências, porque são para copiar;
   a URL continua cortada com "…" (senão a ficha fica altíssima) e tem o ↗ ao lado. */
.fld .ro{font-size:13px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:var(--radius-sm);
  background:#EFE8DE;color:var(--ink-2);min-height:38px;word-break:break-word;
  display:flex;align-items:center;gap:7px;cursor:not-allowed;white-space:normal;text-overflow:clip}
.fld .ro.roarea{display:block;white-space:pre-wrap;max-height:120px;overflow:auto;line-height:1.35;font-size:12px;cursor:auto}
.fld .ro.rourl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12px;display:block}
.fld .ro.romails{display:block;line-height:1.35;cursor:auto}
.fld .ro.romails a{display:block;color:var(--brand-teal-txt);text-decoration:none;font-weight:600}
.fld .ro.romails a:hover{text-decoration:underline}
/* A etiqueta colorida de valor só-leitura tem a largura do texto: dentro do .fld,
   que é uma coluna flex, sem isto ela se estica de ponta a ponta e vira faixa. */
.robadge{display:inline-block;align-self:flex-start;padding:4px 9px;border-radius:var(--radius-sm);font-size:12px;font-weight:800;white-space:normal}
/* Rodapé da ficha: a mesma frase do registro sobre o salvamento e os links do
   cliente (a pasta no Drive e a planilha de equiparação). */
.rodape{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
.rodape .lk{color:var(--brand-teal-txt);text-decoration:none;font-weight:800;font-size:12px}
.ign{background:var(--amber-soft);border:1px solid var(--amber-line);color:#8a5117;border-radius:var(--radius-sm);padding:8px 11px;font-size:12px;font-weight:700;margin-bottom:10px}
.ign:empty{display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
@keyframes fl{0%{background:#FFE79A}100%{background:transparent}}
.flash{animation:fl 1.7s ease}
/* realce da linha por 5s ao clicar numa tarefa do resumo */
.cli.destaque{background:#FFF3B0;transition:background .4s ease}
.cli.destaque .cli-head{background:transparent}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:46vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:48ch}.state code{background:var(--surface-warm);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}


/* ---------- revelacao progressiva ---------- */
/* Régua de ações: busca sempre à mão, filtros a um clique, contagem à vista.
   Antes os filtros ficavam todos abertos na tela — quem chegava tinha de ler a
   parede inteira antes de achar o campo de busca, que é o que 9 em 10 usam. */
.barra-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.barra-acoes .campo-busca{flex:1;min-width:200px;font-size:16px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink)}
.barra-acoes .campo-busca:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
/* ---------- régua de filtros: CINCO CAIXAS DE SELEÇÃO ----------
   Prazos, Etapa e Status eram três listas suspensas de escolha única (que já
   tinham sido vinte e quatro chips), mais uma quarta lista só para ordenar. Agora
   são CINCO caixas de seleção múltipla do b4u-filtro.js — as mesmas do daily, que
   o dono aprovou —, e a quarta lista (Ordenar por) saiu: ordenar é clicar no
   título da coluna, logo acima da lista.

   Prazos · Etapa · Status · Responsável · Ativos.

   A CONTAGEM continua no rótulo de cada opção ("Atrasados · 12"), continua
   FACETADA e continua ciente da busca — é o número que responde "quantos sobram
   se eu marcar isto agora", e não o total da planilha.

   A URGÊNCIA dos prazos continua nos marcadores de texto ("!! Atrasados"), que é
   o que funciona no daltônico, no leitor de tela e no papel. A COR voltou por
   cima deles, dentro do painel — ver a nota do `.b4f-p` logo abaixo.

   O que continua fora: o fundo colorido de cada valor de STATUS. A cor dele é a
   paleta da formatação condicional da planilha (uma cor por frase, não uma
   escala), e ela vive onde trabalha — na pílula da lista e na ficha. */
select.filtro{font-family:var(--sans);font-size:var(--fs-3);color:var(--brand-teal-txt);
  background:var(--surface);border:1px solid var(--brand-teal);border-radius:var(--radius-pill);
  padding:9px 13px;cursor:pointer;font-weight:700;max-width:100%;min-width:0;text-overflow:ellipsis}
select.filtro:focus{outline:2px solid var(--brand-teal);outline-offset:-1px}
select.filtro[hidden]{display:none}
/* Filtro que ESCONDE linha se anuncia: âmbar, para "estou vendo tudo?" ter
   resposta sem abrir nada. O estado neutro fica no teal de sempre. */
select.filtro.corta{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-txt)}
/* O `.b4f` do b4u-filtro.js é `display:inline-flex`, e isso GANHA do atributo
   hidden: sem esta linha, a caixa que não tem o que filtrar nesta carga (sem
   coluna de prazo, sem responsável na planilha) continuaria à vista, vazia. É a
   mesma linha que o `select.filtro[hidden]` acima já precisava. */
.b4f[hidden]{display:none}
/* A COR DE VOLTA, dentro do painel — e só dentro dele.
   Os marcadores !! ! → nasceram porque <option> não aceita cor; no painel de
   checkbox ela é possível de novo, e aqui ela VOLTA POR CIMA do marcador, não no
   lugar dele: o marcador é o que sobrevive no daltônico, no leitor de tela, no
   papel e no <select> nativo da queda; a cor é o que faz o olho achar a linha sem
   ler. Um diz para todo mundo, a outra é mais rápida para quem enxerga.
   São as mesmas três dos chips de antes: vermelho no que venceu, âmbar no que
   vence esta semana, azul no que está com o cliente.
   O gancho é o `data-v` que o componente escreve em cada linha do painel — daí o
   seletor por VALOR, e não por posição. Se um dia ele deixar de escrever isso, o
   que se perde é a cor; o marcador continua no rótulo e nada quebra. */
#f-prazo-p .b4f-li[data-v="atrasado"] .b4f-tx{color:var(--vermelho)}
#f-prazo-p .b4f-li[data-v="semana"] .b4f-tx{color:var(--amber-txt)}
#f-prazo-p .b4f-li[data-v="espera"] .b4f-tx,
#f-prazo-p .b4f-li[data-v="espera15"] .b4f-tx{color:#0A5F86}
.btn-filtros{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--ink);font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.btn-filtros:hover{border-color:var(--brand-teal)}
.btn-filtros[aria-expanded="true"]{background:var(--receita-soft);border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.btn-filtros svg{width:15px;height:15px;flex:none}
.cont-filtros{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:var(--radius-pill);background:var(--brand-teal-txt);color:#fff;
  font-size:var(--fs-1);font-weight:800}
/* display:inline-flex ganha do atributo hidden — sem esta linha o selo mostrava
   um "0" permanente ao lado de Filtros. */
.cont-filtros[hidden]{display:none}

/* O mesmo aviso por extenso, dentro da ficha. Na lista cabe um ⚠; aqui, com o
   campo à vista e espaço para uma linha, cabe dizer o que aconteceu e o que
   fazer — que é o único jeito de o dado ser corrigido na origem. */

  color:var(--amber-txt,#8A5A10);font-weight:600}

<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a
   célula tem ponto e barra, o Sheets desiste e guarda texto.
   Onde não existe máscara canônica (telefone, inscrição), o valor vai como foi
   digitado: o conserto ali depende do patch do backend. */
function b4uParaPlanilha(valor,coluna){
  const s=b4uTexto(valor).trim();
  const t=b4uIdent(coluna);
  if(!s||!t||!/^\d+$/.test(s))return s;
  const d=b4uDigitos(s);
  if((t.tipo==='doc'||t.tipo==='cnpj')&&d.length===14)return b4uFmtDoc(d);
  if((t.tipo==='doc'||t.tipo==='cpf')&&d.length===11)return b4uFmtDoc(d);
  if(t.tipo==='cep'&&d.length===8)return b4uFmtCep(d);
  return s;
}
/* B4U-TEXTO:FIM */
</script>

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
/* A chave da equipe não é mais fixa: é o código do dia de cada colaborador
   (aba "Colaboradores" da planilha de Contatos), que chega por e-mail no
   index.html. Esta constante ficou vazia de propósito — se voltar a ter valor,
   volta a existir uma senha compartilhada que não expira e não diz quem é quem. */
const CHAVE_PADRAO = '';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}

/* Sem chave na URL não há painel da equipe. A porta é o index.html: a pessoa
   digita o e-mail, recebe o código do dia e volta para CÁ — é para isso que
   serve o `destino`, senão todo login despejaria a pessoa na home da equipe,
   longe do que ela tinha clicado.
   Até 04/08/2026 existia uma chave fixa antiga escrita aqui como padrão: quem
   abrisse a página sem chave nenhuma entrava assim mesmo, sem se identificar.
   A string não se repete neste arquivo de propósito — ele é servido ao
   navegador, e comentário vaza igual a código. */
if (!chaveAtual()) {
  location.replace('index?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash
// (formato antigo dos atalhos por pessoa). Vira a coluna "Colaborador" da aba log.
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* ---------- busca que entende CNPJ com e sem pontuação (C.1) ---------- */

/** Compara o texto normalizado e, quando o termo tem 6 dígitos ou mais, também
 *  só os dígitos dos dois lados — assim "12345678000190" acha "12.345.678/0001-90". */
function casaBusca(alvoTxt,alvoDig,termo){
  const t=normTxt(termo);
  if(!t)return true;
  if(alvoTxt.indexOf(t)>=0)return true;
  const d=soDigitos(termo);
  return d.length>=6&&alvoDig.indexOf(d)>=0;
}

/* Filtros recolhidos, com memória. O contador ao lado do botão existe para
   evitar o único efeito colateral ruim de esconder filtro: a pessoa esquece que
   filtrou e acha que os dados sumiram. Por isso, com filtro ativo, o painel
   nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}

/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Existia só para escrever frases de espera por cima do "Carregando…" — as que
   falavam em lentidão e em tentar de novo, e que faziam a pessoa recarregar. A
   espera agora é do b4u-espera.js, com barra e progresso, então a função ficou
   vazia. Continua existindo porque é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A
   segunda tentativa acontece por baixo da tela de espera, sem avisar nada: dizer
   "estou tentando de novo" no meio da espera faz a pessoa recarregar justo quando
   a resposta já vinha vindo. Erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}

const MES3={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
function parseData(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
  m=s.toLowerCase().match(/([a-zç]{3})[a-zç.]*\/?\s*(\d{4})/);if(m&&MES3[m[1]]!=null)return new Date(+m[2],MES3[m[1]],1);
  return null;
}

/* ---------- as colunas da lista (ID · Cliente · Responsável · … · Situação) ----------
   Os nomes das colunas vêm do backend em tempo de execução e mudam: em vez de
   cravar "responsavel" no código, a lista PROCURA a coluna pelo nome normalizado
   entre as que a planilha realmente mandou (a chave do objeto e o rótulo de COLS).
   Quando a coluna não existe, a lista não fica com um espaço em branco: ela cai
   para o dado que responde a MESMA pergunta ("preciso agir neste cliente?") e o
   rótulo do cabeçalho muda junto — a tela nunca promete o que não está mostrando. */
let K_RESP='',K_COMP='',K_VAL='';
function acharCampo(re){
  const rot={};COLS.forEach(c=>rot[c.k]=c.label);
  const vistos=new Set();
  for(const l of LINHAS){
    for(const k of Object.keys(l)){
      if(vistos.has(k))continue;
      vistos.add(k);
      if(l[k]&&typeof l[k]==='object')continue;      // espera_log é mapa, não coluna
      if(re.test(normTxt(k+' '+(rot[k]||''))))return k;
    }
  }
  return '';
}
function mapearColunasLista(){
  K_RESP=acharCampo(/responsav|consultor/);
  K_COMP=acharCampo(/competencia|periodo|referencia/);
  K_VAL=acharCampo(/valor|montante|credito/);
}
/** Rótulo da coluna: o nome que o backend deu, quando ela é uma das conhecidas;
 *  senão o nome canônico da coluna da lista — nunca a chave crua do objeto, que
 *  é vocabulário nosso ("responsavel" sem acento na régua não é nome de coluna). */
function rotuloDe(k,padrao){const c=COLS.find(x=>x.k===k);return c?c.label:padrao;}
function rotResp(){return rotuloDe(K_RESP,'Responsável');}
function rotComp(){return K_COMP?rotuloDe(K_COMP,'Competência'):'Etapa atual';}
function rotVal(){return K_VAL?rotuloDe(K_VAL,'Valor'):'Prazo';}
/** "R$ 1.234,56", "1234.56" ou "1.234,56" viram número; o que não é número, não vira. */
function numDe(v){
  let s=String(v==null?'':v).replace(/[^\d,.\-]/g,'').trim();
  if(!s)return NaN;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s);
  return isFinite(n)?n:NaN;
}
/** Separador de milhar sempre, duas casas — coluna de dinheiro se lê pela vírgula. */
function fmtValor(v){
  const n=numDe(v);
  if(!isFinite(n))return String(v==null?'':v).trim();   // texto livre continua como está
  return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
/** Responsável da linha; sem a coluna vale quem o servidor identificou pela chave
 *  (é dele a carteira que veio) — o mesmo nome que já aparece na tarja da barra. */
function textoResp(l){return K_RESP?String(l[K_RESP]==null?'':l[K_RESP]).trim():(RESPNOME||'');}
/** Em que etapa o cliente está parado — o MESMO cálculo do chip "Etapa atual",
 *  para não existirem duas verdades na página. */
function etapaRot(l){
  const k=etapaAtual(l);
  if(k===ETAPA_OK)return 'Tudo concluído';
  const tf=TAREFAS_ATIVAS.find(t=>t.k===k);
  return tf?tf.label:'';
}
/** Competência quando a planilha tem essa coluna; senão a etapa atual. */
function textoComp(l){return K_COMP?String(l[K_COMP]==null?'':l[K_COMP]).trim():etapaRot(l);}
/** A quinta coluna: o valor, quando a planilha tem um; senão o prazo mais próximo
 *  ainda em aberto, que é o que diz se este cliente precisa de mão hoje. */
function dadoVal(l){
  if(K_VAL){
    const v=String(l[K_VAL]==null?'':l[K_VAL]).trim();
    return {txt:v?fmtValor(v):'',cls:'',falta:'sem valor'};
  }
  const ps=prazosEmAberto(l);
  if(!ps.length)return {txt:'',cls:'',falta:esperandoAlgo(l)?'com o cliente':'sem prazo'};
  const g=Math.min.apply(null,ps),j=janelas();
  return {txt:fmtBR4(new Date(g)),cls:g<j.t0?'atrasado':(g<=j.semana?'semana':''),falta:''};
}
/** Faixa lateral: a urgência da linha, na mesma régua dos quadros de resumo. */
function classeUrg(l){
  const ps=prazosEmAberto(l),j=janelas();
  if(ps.some(g=>g<j.t0))return 'urg-atrasado';
  if(ps.some(g=>g>=j.t0&&g<=j.semana))return 'urg-semana';
  if(esperandoAlgo(l))return 'urg-espera';
  if(etapaAtual(l)===ETAPA_OK)return 'urg-ok';
  return '';
}

/* O código do colaborador (`cod`) é OPCIONAL — quem manda é a chave.

   chave de acesso" antes mesmo de perguntar qualquer coisa ao servidor: era esse
   portão que barrava quem abria a página com a chave certa e sem o #. O servidor
   nunca precisou dele — montarRestituicaoEquipe_ resolve o colaborador A PARTIR
   DA CHAVE (exigirEquipe_ → colaboradorPorChave_) e só consulta o `cod` como
   último recurso, quando o colaborador da chave não tem nome e não é pleno. Por
   isso ele viaja apenas quando existe de fato na URL. Quem não é da equipe
   continua barrado onde deve: no servidor. */
function carregar(){

  setSave('saving','Carregando…');
  let u=API_URL+'?tipo=restituicao_equipe&chave='+encodeURIComponent(chaveAtual());
  if(cod)u+='&cod='+encodeURIComponent(cod);
  return jsonp(u)
    .then(d=>{if(d.erro)throw new Error(d.erro);LINHAS=d.linhas||[];RESPNOME=d.responsavel||'';setSave('','');render();
      /* Esta é a ÚNICA rota de tela (fora colaborador e daily) que já sabe o nome
         de quem está usando: `montarRestituicaoEquipe_` resolve o colaborador a
         partir da chave e devolve em `responsavel`. Antes ele era pendurado no
         título da barra ("Restituição · Fulano"); agora vai para o botão de quem
         está usando, que é onde ele está em todas as outras. */
      if(window.B4UShell) B4UShell.usuario({nome:RESPNOME});
      /* conteúdo já pintado por baixo: a barra corre até 100% e o overlay sai */
      if(window.B4UEspera)B4UEspera.concluir();})
    /* O texto da exceção continua decidindo QUAL tela mostrar — ele só não pode
       aparecer nela: nome de arquivo e recado de servidor são vocabulário nosso.
       Os testes /inv[aá]lid/, /falta/ e /restrit/ casam com o que o servidor lança e
       NÃO podem mudar; os títulos, sim: eles falavam em "chave de acesso", que é o
       nome do parâmetro da URL — coisa nossa, não da pessoa que só quer entrar. */
    .catch(e=>{const m=String((e&&e.message)||e||'');setSave('err','Não foi possível carregar.');
      if(/inv[aá]lid/i.test(m))telaChave('Este link não está mais valendo','O seu código do dia venceu ou não confere. Volte ao painel e peça um novo acesso pelo seu e-mail.');
      else if(/falta/i.test(m))telaChave('Abra pelo seu link pessoal','O link que abre esta tela é o que chegou no seu e-mail, com o código do dia junto.');
      else if(/restrit/i.test(m))telaChave('Acesso restrito','Esta tela é da equipe. Se você precisa entrar aqui, fale com o atendimento.');
      else if(window.B4UEspera)B4UEspera.telaErro(document.getElementById('app'));
      else document.getElementById('app').innerHTML='<div class="state"><h1>Não conseguimos carregar as informações</h1>'
        +'<p>Houve um erro ao recuperar as informações. Tente novamente em alguns minutos. '
        +'Se o problema continuar, entre em contato com o atendimento.</p></div>';});
}
function baseRows(){return LINHAS;}   // o backend já entrega só as linhas do colaborador resolvido pela chave
/* ---------- busca e filtros no endereço (C.10) ----------
   F5 (ou mandar o link para alguém) volta para a mesma visão. Mexemos só nos
   parâmetros desta tela — a chave, o cod e o #hash continuam intactos. */
/* Com caixa de seleção o filtro deixou de ser UM valor e passou a ser uma LISTA,
   e o endereço acompanha: o mesmo parâmetro repetido, um por marcado
   (`?etapa=prazo_prelim&etapa=prazo_protocolo`). Repetir o parâmetro, e não juntar
   com vírgula, porque os valores de STATUS vêm da planilha — o dia em que alguém
   digitar um status com vírgula no meio, o separador cortaria o valor ao meio e o
   filtro passaria a não achar ninguém, calado.

   Três estados, e os três precisam caber no endereço:
     ausente        o padrão da caixa (todos marcados, ou nada marcado no Prazos)
     valores        exatamente o que está marcado
     __nada__       a pessoa desmarcou tudo — a lista fica vazia DE PROPÓSITO, e
                    um F5 que voltasse para "todos" desfaria o que ela fez.
   O formato antigo de valor único (`?prazo=atrasado`, dos links já guardados)
   continua sendo lido: um valor só é uma lista de um. */
const F_NADA='__nada__';
function escreverLista(u,chave,vals,todos){
  u.searchParams.delete(chave);
  if(!todos.length)return;                                   // caixa que não existe nesta carga
  /* O padrão não vai para o endereço: senão toda visita nasceria com uma URL de
     duzentos caracteres dizendo o que já é o normal. */
  if(vals.length===todos.length&&todos.every(v=>vals.indexOf(v)>=0))return;
  if(!vals.length){u.searchParams.append(chave,F_NADA);return;}
  vals.forEach(v=>u.searchParams.append(chave,v));
}
function sincronizarURL(){
  try{
    const u=new URL(location.href),b=document.getElementById('busca');
    const q=b?b.value:'';
    if(q)u.searchParams.set('q',q);else u.searchParams.delete('q');
    /* Prazos NÃO passa pelo escreverLista(), e a razão é o repouso dele: nas
       quatro partições o repouso é "todas marcadas", aqui é a lista VAZIA (vazio
       = todos, ver a nota do montarFiltros). Passar `FPRAZO` como padrão dele
       mesmo fazia a comparação "está no padrão?" dar certo SEMPRE, e o parâmetro
       era apagado em silêncio: `?prazo=atrasado` — o link que esta régua sempre
       produziu e que o `lerLista()` logo abaixo continua lendo — nunca chegava a
       ser escrito. Aqui é direto: vazio não escreve nada, marcado escreve um por
       marcado. Não existe `__nada__` neste grupo, porque vazio já quer dizer
       todos. */
    u.searchParams.delete('prazo');
    FPRAZO.forEach(v=>u.searchParams.append('prazo',v));
    escreverLista(u,'etapa',FETAPA,valoresDe(ETAPA_ITENS));
    escreverLista(u,'status',FSTATUS,valoresDe(STATUS_ITENS));
    escreverLista(u,'resp',FRESP,valoresDe(RESP_ITENS));
    escreverLista(u,'ativo',FATIVO,valoresDe(ATIVO_ITENS));
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
/** null = o parâmetro não veio, e quem decide o padrão é `aplicarPadroes()`. */
function lerLista(p,chave){
  const v=p.getAll(chave).filter(x=>String(x).trim()!=='');
  if(!v.length)return null;
  if(v.length===1&&v[0]===F_NADA)return [];
  return v;
}
let URLF={prazo:null,etapa:null,status:null,resp:null,ativo:null};
function lerURL(){
  const p=new URLSearchParams(location.search);
  /* Só GUARDA o que veio: os padrões dependem de quais opções a planilha trouxe,
     e isso só se sabe depois do mapearColunas(). Ver `aplicarPadroes()`. */
  URLF={prazo:lerLista(p,'prazo'),etapa:lerLista(p,'etapa'),status:lerLista(p,'status'),
        resp:lerLista(p,'resp'),ativo:lerLista(p,'ativo')};
  return p.get('q')||'';
}
/* A ordem aqui é a da tela: primeiro o que responde (busca, filtros e contagem),
