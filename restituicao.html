<!--
  ESTA PÁGINA VIROU UM RECORTE. Eram 2.721 linhas que desenhavam a planilha
  "Equiparacao Controle" (aba Consolidado). Aquela planilha foi APAGADA em
  02/09/2026: as colunas dela moram na aba Registro, e a tela virou o recorte
  `equiparacao` do b4u-recorte.html — seis seções (situação, adequação,
  preliminar, apuração, definitivo, riscos), cada uma com permissão própria.
  Aqui só sobrou o endereço.

  POR QUE O NOME CONTINUA "restituicao"
  Ele nunca descreveu o que a tela fazia — a tela sempre foi de equiparação —,
  mas é o que está no menu do b4u-shell.js, no cartão "Restituição" do painel
  do colaborador, em favorito e em conversa de WhatsApp. Renomear o arquivo e
  manter o endereço velho daria o mesmo trabalho e um arquivo a mais. O rótulo
  na tela é que foi corrigido para "Equiparação"; o caminho ficou.

  A QUERY STRING VAI JUNTO, e o `r=equiparacao` entra ANTES dela: sem repassar,
  o redirecionamento levaria a pessoa para "acesso restrito" — o que, do lado
  de quem usa, é indistinguível de estar quebrado. Colar as duas com "?" nos
  dois lados produziria `?r=equiparacao?chave=…`, que o URLSearchParams lê como
  UM parâmetro chamado "r". A chave sumiria em silêncio.

  O HASH TAMBÉM VAI. Aqui ele carregava o nome do responsável para filtrar; no
  recorte, `respAtual()` lê o hash como reserva do `?cod=`. Link velho salvo por
  alguém continua entrando com a mesma identidade.

  `location.replace` e não `href`: este endereço não entra no histórico, e o
  botão Voltar leva de onde a pessoa veio em vez de cair aqui num laço.

  A TELA ANTIGA está em `_to_delete/restituicao-html-antes-do-recorte-2026-09-02.html`
  e no histórico do GitHub. Apagar de vez quando o recorte tiver rodado algumas
  semanas contra dado real.
-->

  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       color:#3d3a34;background:#F7F3EC;padding:24px;text-align:center}
  a{color:#1F6F6B;font-weight:700}
</style>

<body>
  <p><strong>Equiparação</strong><br>
     Levando você para lá… <a id="ir" href="b4u-recorte?r=equiparacao">abrir agora</a></p>
<script>
(function(){
  var q = location.search ? '&' + location.search.slice(1) : '';
  var destino = 'b4u-recorte?r=equiparacao' + q + location.hash;
  var ir = document.getElementById('ir');
  if (ir) ir.href = destino;
  location.replace(destino);
})();
</script>
</body>
