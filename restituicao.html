<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Guia nova por padrão: link clicado não tira o colaborador de onde ele estava. -->
<base target="_blank">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restituição (equipe) — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F1E7DC;--surface:#FFFFFF;--surface-warm:#FBF6EF;
  --ink:#113D39;--ink-2:#3F5854;--muted:#8A7D70;--line:#E4D9C9;--line-2:#D6C3AC;
  --brand-dark:#073034;--brand-teal:#0F8C85;--brand-euc:#3FA680;
  --amber:#E8892E;--amber-soft:#FCEFE0;--amber-line:#F0D6B4;--vermelho:#8B2E22;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:900;font-size:17px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:20px}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd}.barra a.volta{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600}
.save-status{font-size:12.5px;font-weight:800;padding:6px 13px;border-radius:20px;background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
.save-status.saving{background:#E8892E;color:#fff}.save-status.ok{background:#2E9D5F;color:#fff}.save-status.err{background:#C0392B;color:#fff}
.topo{padding:12px 16px 8px}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chips .rot{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font-family:var(--sans);font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--brand-teal)}
.chip.on{background:var(--brand-teal);border-color:var(--brand-teal);color:#fff}
.chip .n{background:rgba(0,0,0,.10);border-radius:999px;padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.chip.alerta.on{background:var(--vermelho);border-color:var(--vermelho)}
.chip.aviso.on{background:var(--amber);border-color:var(--amber)}
.chip.espera.on{background:#007EB5;border-color:#007EB5}
.chip.zero{opacity:.5}
.chip.limpar{border-style:dashed;color:var(--muted)}
/* faixa de filtros rapidos, logo acima da tabela */
.filtros{padding:0 16px 10px}
.busca{width:100%;font-family:var(--sans);font-size:15px;padding:11px 15px;border-radius:24px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.dica{font-size:12px;color:var(--muted);margin-top:7px}
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px;padding:0 16px 12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.rhead{padding:10px 13px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff}
.rcard.atrasada .rhead{background:#C0392B}.rcard.semana .rhead{background:#E8892E}.rcard.proxima .rhead{background:var(--brand-teal)}
.rcard.adiante .rhead{background:#6B8486}.rcard.cobrar .rhead{background:#007EB5}
.rhead .n{background:rgba(255,255,255,.25);border-radius:999px;padding:2px 9px;font-size:12px}
.rlista{max-height:168px;overflow:auto;padding:6px}
.tk{display:flex;gap:8px;align-items:baseline;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:12.5px}
.tk:hover{background:var(--surface-warm)}
.tk .d{font-weight:800;color:var(--ink);white-space:nowrap}
.tk .d.sem{color:var(--muted);font-weight:700}
.tk .lb{color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .tp{font-size:10.5px;font-weight:700;color:var(--muted)}
.rvazio{color:var(--muted);font-size:12px;padding:10px 9px}
.tabela-wrap{overflow:auto;max-height:calc(100vh - 130px);border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px}
thead th{position:sticky;top:0;z-index:20;background:var(--brand-dark);color:#fff;font-weight:700;text-align:left;
  padding:9px 10px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.08);font-size:11.5px;cursor:pointer;user-select:none}
thead th:hover{background:#0a4247}
tbody td{padding:3px 5px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;background:var(--surface)}
tbody tr:nth-child(even) td{background:var(--surface-warm)}
/* colunas congeladas: ID e Nome */
th.col-id,td.col-id{position:sticky;left:0;width:74px;min-width:74px;max-width:74px}
th.col-nome,td.col-nome{position:sticky;left:74px;min-width:210px;max-width:230px}
thead th.col-id,thead th.col-nome{z-index:26}
td.col-id,td.col-nome{z-index:15}
td.col-id{background:var(--surface);font-weight:800;color:var(--brand-teal);padding:6px 9px;white-space:nowrap;box-shadow:1px 0 0 var(--line)}
td.col-nome{background:var(--surface);font-weight:700;font-size:12px;line-height:1.25;padding:6px 9px;white-space:normal;box-shadow:2px 0 6px rgba(7,48,52,.07)}
tbody tr:nth-child(even) td.col-id,tbody tr:nth-child(even) td.col-nome{background:var(--surface-warm)}
/* atalho para a planilha de equiparação do cliente, sempre visível (coluna congelada) */
td.col-nome a.eq{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:800;letter-spacing:.2px;
  color:#fff;background:var(--brand-teal);border-radius:999px;padding:3px 9px;text-decoration:none;white-space:nowrap}
td.col-nome a.eq:hover{background:var(--brand-euc)}
.cel{display:flex;gap:4px;align-items:center}
.cel input,.cel textarea,.cel select{font-family:var(--sans);font-size:12.5px;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);width:100%}
.cel textarea{resize:both;min-height:34px;line-height:1.35}
.cel select{font-weight:600;cursor:pointer}
.cel input:focus,.cel textarea:focus,.cel select:focus{outline:2px solid var(--brand-teal);outline-offset:0}
.cel a.abrir{color:var(--brand-teal);text-decoration:none;font-weight:800;font-size:14px;flex:none}
/* somente-leitura — sem "..." : CNPJ e e-mails aparecem por extenso (para copiar) */
.ro{padding:6px 8px;font-size:12.5px;color:var(--ink-2);white-space:normal;word-break:break-word;text-overflow:clip}
.ro.roarea{white-space:pre-wrap;max-height:58px;overflow:auto;line-height:1.3;font-size:12px}
/* URL não precisa aparecer por extenso (senão a linha fica altíssima) — use o ↗ */
.ro.rourl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11.5px}
.ro.romails{line-height:1.35}
.ro.romails a{display:block;color:var(--brand-teal);text-decoration:none;font-weight:600}
.ro.romails a:hover{text-decoration:underline}
.robadge{display:inline-block;padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:800;white-space:nowrap}
@keyframes fl{0%{background:#FFE79A}100%{background:transparent}}
.flash{animation:fl 1.7s ease}
tr.destaque>td{background:#FFF3B0!important;transition:background .4s ease}   /* realce da linha por 5s ao clicar numa tarefa */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:46vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:14px;max-width:48ch}.state code{background:var(--surface-warm);padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:720px){.resumo{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}
</style>
</head>
<body>
<div class="barra">
  <a class="logo" id="logo-home" href="colaborador.html" target="_self" title="Voltar para o painel do colaborador">back<span class="y">4you</span></a>
  <span class="tag" id="tag">Restituição</span>
  <span class="spacer"></span>
  <span class="save-status" id="saveStatus"></span>
  <span class="cnt" id="cnt"></span>
  <a class="volta" id="volta" href="colaborador.html" target="_self">← Painel</a>
</div>
<div id="app"><div class="state"><div class="spin"></div><p>Carregando restituição…</p></div></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbyGAro0qPWpZcVX665KwKd-BK3ouSvVkAj5Vxw_phgO82EDa3gJrURcHjWIPYNQXT5d/exec';
const CHAVE_PADRAO='b4u-equipe-2026';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash
// (formato antigo dos atalhos por pessoa). Vira a coluna "Colaborador" da aba log.
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function jsonp(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},25000);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
async function postAcao(obj){const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});const d=await r.json();if(d&&d.erro)throw new Error(d.erro);return d;}

// ID e Nome são colunas CONGELADAS (fora de COLS). ro:1 = somente leitura.
const COLS=[
  {k:'cnpj',label:'CNPJ',t:'text',w:160,ro:1},
  {k:'email',label:'E-mail do cliente',t:'mails',w:210,ro:1},
  {k:'status',label:'STATUS',t:'select',opt:'status',w:180},
  {k:'link_drive',label:'Link do drive',t:'url',w:170,ro:1},
  {k:'link_equip',label:'Planilha de equiparação',t:'url',w:150,ro:1},
  {k:'natureza_juridica',label:'Natureza Jurídica',t:'text',w:150,ro:1},
  {k:'prospectivo',label:'Prospectivo ou Retrospectivo',t:'text',opt:'prospectivo',w:170,ro:1},
  {k:'visao_geral',label:'Visão geral da equiparação',t:'area',w:260,ro:1},
  {k:'estrategia',label:'Estratégia Equiparação',t:'area',w:260,ro:1},
  {k:'natureza_empresarial',label:'Natureza Empresarial',t:'text',w:150,ro:1},
  {k:'obs_status',label:'Observações (Status Geral)',t:'area',w:260},
  {k:'espera_desde',label:'Esperando retorno desde',t:'text',w:130,sort:'date',dica:'dd/mm/aaaa'},
  {k:'rel_adequacao',label:'Relatório de Adequação',t:'select',opt:'rel_adequacao',w:160},
  {k:'prazo_adequacao',label:'Prazo Rel. Adequação',t:'text',w:120,sort:'date',ro:1},
  {k:'link_adequacao',label:'Link Rel. Adequação',t:'url',w:150},
  {k:'rel_prelim',label:'Relatório Executivo Preliminar',t:'select',opt:'rel_prelim',w:180},
  {k:'prazo_prelim',label:'Prazo Rel. Exec. Preliminar',t:'text',w:120,sort:'date',ro:1},
  {k:'link_prelim',label:'Link Rel. Exec. Preliminar',t:'url',w:150},
  {k:'apuracao_nfs',label:'Apuração de NFs e coleta documental',t:'select',opt:'apuracao_nfs',w:190},
  {k:'prazo_apuracao',label:'Prazo Apuração NFs',t:'text',w:120,sort:'date',ro:1},
  {k:'protocolo',label:'Protocolo',t:'select',opt:'protocolo',w:160},
  {k:'prazo_protocolo',label:'Prazo Protocolo',t:'text',w:120,sort:'date',ro:1},
  {k:'rel_def',label:'Relatório Executivo Definitivo',t:'select',opt:'rel_def',w:180},
  {k:'prazo_def',label:'Prazo Rel. Exec. Definitivo',t:'text',w:120,sort:'date',ro:1},
  {k:'link_def',label:'Link Rel. Exec. Definitivo',t:'url',w:150},
  {k:'tarefas',label:'Tarefas Ativas',t:'area',w:260}
];
const TAREFAS=[
  {k:'prazo_adequacao',stk:'rel_adequacao',label:'Rel. de Adequação'},
  {k:'prazo_prelim',stk:'rel_prelim',label:'Rel. Exec. Preliminar'},
  {k:'prazo_apuracao',stk:'apuracao_nfs',label:'Apuração NFs'},
  {k:'prazo_protocolo',stk:'protocolo',label:'Protocolo'},
  {k:'prazo_def',stk:'rel_def',label:'Rel. Exec. Definitivo'}
];
// Etapas em que "Enviado ao cliente" = a bola está com o CLIENTE (não é atraso da
// equipe): saem dos 3 quadros de prazo e entram em "Cobrar o cliente de retorno".
// O Rel. Exec. Definitivo fica de fora de propósito (ali "Enviado ao cliente" = entregue).
const ESPERA=[
  {stk:'rel_adequacao',pk:'prazo_adequacao',label:'Rel. de Adequação'},
  {stk:'rel_prelim',pk:'prazo_prelim',label:'Rel. Exec. Preliminar'},
  {stk:'apuracao_nfs',pk:'prazo_apuracao',label:'Apuração NFs'}
];
const ESPERA_STK={};ESPERA.forEach(e=>ESPERA_STK[e.stk]=e);
// opções EXATAS (aba Listas)
const OPT={
  status:['Alteração de CS prévia','Perdido','PROTOCOLADO','INTERROMPIDO','PRÉ - PROTOCOLO','PROSPECTIVO SOMENTE','PROSPECTIVO SOMENTE PROTOCOLADO','PRÉ - ONBOARDING','COLETA DE DOCUMENTAÇÃO'],
  prospectivo:['Retrospectivo','Retrospectivo e Prospectivo','Prospectivo'],
  rel_adequacao:['Aprovado','Falta onboarding','Em execução','Enviado ao cliente','Parado (não iniciar)'],
  rel_prelim:['Aprovado','Parado (não iniciar)','Em execução','Não feito','Enviado ao cliente'],
  apuracao_nfs:['Aprovada','Enviada ao cliente','Em execução','Parado (não iniciar)'],
  protocolo:['Finalizado','Parado (não iniciar)','Não iniciado','Em execução'],
  rel_def:['Enviado ao cliente','Parado','Pendente','Feito']
};
// cores EXATAS por valor (formatação condicional) — por coluna
const COR_RAW={
  status:{'Alteração de CS prévia':'#579BFC','Perdido':'#333333','PROTOCOLADO':'#00C875','INTERROMPIDO':'#757575','PRÉ - PROTOCOLO':'#CAB641','PROSPECTIVO SOMENTE':'#A1E3F6','PROSPECTIVO SOMENTE PROTOCOLADO':'#037F4C','PRÉ - ONBOARDING':'#FF6D3B','COLETA DE DOCUMENTAÇÃO':'#FFCB00'},
  prospectivo:{'Retrospectivo':'#00C875','Retrospectivo e Prospectivo':'#CAB641','Prospectivo':'#FFCB00'},
  rel_adequacao:{'Aprovado':'#00C875','Falta onboarding':'#DF2F4A','Em execução':'#FDAB3D','Enviado ao cliente':'#007EB5','Parado (não iniciar)':'#9D50DD'},
  rel_prelim:{'Aprovado':'#00C875','Parado (não iniciar)':'#9D50DD','Em execução':'#FDAB3D','Não feito':'#DF2F4A','Enviado ao cliente':'#007EB5'},
  apuracao_nfs:{'Aprovada':'#00C875','Enviada ao cliente':'#007EB5','Em execução':'#FDAB3D','Parado (não iniciar)':'#9D50DD'},
  protocolo:{'Finalizado':'#00C875','Parado (não iniciar)':'#784BD1','Não iniciado':'#DF2F4A','Em execução':'#FDAB3D'},
  rel_def:{'Enviado ao cliente':'#00C875','Parado':'#007EB5','Pendente':'#DF2F4A','Feito':'#FDAB3D'}
};
const COR_N={};Object.keys(COR_RAW).forEach(k=>{COR_N[k]={};Object.keys(COR_RAW[k]).forEach(v=>COR_N[k][normTxt(v)]=COR_RAW[k][v]);});
function corDe(opt,val){const m=COR_N[opt];return m?(m[normTxt(val)]||''):'';}
function textoContraste(hex){if(!hex)return '';const r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);return (0.299*r+0.587*g+0.114*b)<150?'#ffffff':'#10312f';}
function statusConcluido(stk,v){const n=normTxt(v);if(!n)return false;if(/nao feito/.test(n))return false;if(/aprovad|finaliz|conclu|protocolado|^feito$/.test(n))return true;if(stk==='rel_def'&&/enviad. ao cliente/.test(n))return true;return false;}
/** "Enviado ao cliente" / "Enviada ao cliente" = esperando retorno do cliente. */
function aguardandoCliente(stk,v){return !!ESPERA_STK[stk]&&/enviad[oa] ao cliente/.test(normTxt(v));}
function setSave(cls,txt){const el=document.getElementById('saveStatus');if(el){el.className='save-status '+(cls||'');el.textContent=txt||'';}}
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
const MES3={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
function parseData(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
  m=s.toLowerCase().match(/([a-zç]{3})[a-zç.]*\/?\s*(\d{4})/);if(m&&MES3[m[1]]!=null)return new Date(+m[2],MES3[m[1]],1);
  return null;
}
function meia(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDias(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function fmtBR(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
/** dd/mm; acrescenta /aa quando não é do ano corrente (importa no quadro "Mais adiante"). */
function fmtBRano(d){return fmtBR(d)+(d.getFullYear()!==new Date().getFullYear()?('/'+String(d.getFullYear()).slice(-2)):'');}

let LINHAS=[],RESPNOME='',SORT={key:'id',dir:'asc'};
function telaChave(titulo,msg){
  document.getElementById('app').innerHTML=`<div class="state"><div style="font-size:36px">🔒</div><h1>${esc(titulo)}</h1><p>${esc(msg)}</p></div>`;
  setSave('','');document.getElementById('tag').textContent='Restituição';document.getElementById('cnt').textContent='';
}
function carregar(){
  const cod=respAtual();   // o que vem depois do # = CÓDIGO de acesso do colaborador
  if(!cod){telaChave('Falta a chave de acesso','Abra pelo seu link pessoal, com o seu código no fim do endereço (depois do #).');return Promise.resolve();}
  setSave('saving','Carregando…');
  return jsonp(API_URL+'?tipo=restituicao_equipe&chave='+encodeURIComponent(chaveAtual())+'&cod='+encodeURIComponent(cod))
    .then(d=>{if(d.erro)throw new Error(d.erro);LINHAS=d.linhas||[];RESPNOME=d.responsavel||'';setSave('','');render();})
    .catch(e=>{const m=String(e.message||e);setSave('err','Erro');
      if(/inv[aá]lid/i.test(m))telaChave('Chave de acesso inválida','O código no fim do endereço não corresponde a nenhum colaborador. Confira o seu link.');
      else if(/falta/i.test(m))telaChave('Falta a chave de acesso','Abra pelo seu link pessoal, com o seu código no fim do endereço (depois do #).');
      else document.getElementById('app').innerHTML=`<div class="state"><h1>Não consegui carregar</h1><p>${esc(m)}</p><p>Confira o link e se o Web App foi republicado com <code>EquipeRestituicao.gs</code>.</p></div>`;});
}
function baseRows(){return LINHAS;}   // o backend já entrega só as linhas do colaborador do código
function render(){

    </div>

  document.getElementById('busca').addEventListener('input',()=>redesenhar());
  FPRAZO='todos';FETAPA='todas';FSTATUS='todos';   // dados novos entram sem filtro pendurado

  atualizarResumo();

}
/** Desde quando o cliente está devendo retorno naquela etapa:
 *  1) coluna "Esperando retorno desde"  2) log (data em que virou "Enviado ao cliente")
 *  3) prazo da etapa (aproximado)  4) nada. */
function esperandoDesde(l,e){
  let d=parseData(l.espera_desde);if(d)return{d:d,fonte:'coluna'};
  const log=(l.espera_log||{})[e.stk];d=parseData(log);if(d)return{d:d,fonte:'log'};
  d=parseData(l[e.pk]);if(d)return{d:d,fonte:'prazo'};
  return{d:null,fonte:''};
}
function diasCorridos(de,ate){return Math.max(0,Math.round((meia(ate)-meia(de))/86400000));}
function computeResumo(){
  const t0=meia(new Date()),dow=t0.getDay(),fimSemana=addDias(t0,(7-dow)%7),proxIni=addDias(fimSemana,1),proxFim=addDias(proxIni,6);
  const b={atrasada:[],semana:[],proxima:[],adiante:[],cobrar:[]};
  baseRows().forEach(l=>{
    TAREFAS.forEach(tf=>{
      const d=parseData(l[tf.k]);if(!d)return;
      if(statusConcluido(tf.stk,l[tf.stk]))return;
      if(aguardandoCliente(tf.stk,l[tf.stk]))return;   // está com o cliente → vai para "Cobrar"
      const dm=meia(d),g=dm.getTime();
      const item={row:l.row,id:l.id,nome:l.nome,k:tf.k,label:tf.label,dataStr:fmtBRano(dm),ord:g};
      if(g<t0.getTime())b.atrasada.push(item);
      else if(g<=fimSemana.getTime())b.semana.push(item);
      else if(g<=proxFim.getTime())b.proxima.push(item);
      else b.adiante.push(item);                       // nada mais some da vista
    });
    ESPERA.forEach(e=>{
      if(!aguardandoCliente(e.stk,l[e.stk]))return;
      const r=esperandoDesde(l,e);
      b.cobrar.push({row:l.row,id:l.id,nome:l.nome,k:e.stk,label:e.label,
        dias:r.d?diasCorridos(r.d,t0):null,desde:r.d?fmtBR(r.d):'',fonte:r.fonte});
    });
  });
  ['atrasada','semana','proxima','adiante'].forEach(k=>b[k].sort((x,y)=>x.ord-y.ord));
  b.cobrar.sort((x,y)=>{                                  // do mais demorado ao menos
    if(x.dias==null&&y.dias==null)return 0;
    if(x.dias==null)return 1;
    if(y.dias==null)return -1;
    return y.dias-x.dias;
  });
  return b;
}
function listaTk(arr){
  if(!arr.length)return '<div class="rvazio">Nada por aqui 🎉</div>';
  return arr.map(t=>`<div class="tk" data-goto="${t.row}" data-k="${t.k}" title="${esc(t.id+' · '+t.nome+' — '+t.label+'\nprazo '+t.dataStr)}"><span class="d">${esc(t.dataStr)}</span><span class="lb">${esc(t.id)} · ${esc(t.nome)}</span><span class="tp">${esc(t.label)}</span></div>`).join('');
}
function listaCobrar(arr){
  if(!arr.length)return '<div class="rvazio">Ninguém devendo retorno 🎉</div>';
  const FONTE={coluna:'data informada',log:'registrada no log',prazo:'aproximada (prazo da etapa)'};
  return arr.map(t=>{
    const quanto=t.dias==null?'—':(t.dias===0?'hoje':t.dias+'d');
    const tit=t.id+' · '+t.nome+' — '+t.label+'\n'+(t.dias==null?'Sem data: preencha "Esperando retorno desde" nesta linha'
      :('esperando desde '+t.desde+' ('+(FONTE[t.fonte]||'')+')'));
    return `<div class="tk" data-goto="${t.row}" data-k="${t.k}" title="${esc(tit)}"><span class="d${t.dias==null?' sem':''}">${esc(quanto)}</span><span class="lb">${esc(t.id)} · ${esc(t.nome)}</span><span class="tp">${esc(t.label)}</span></div>`;
  }).join('');
}
function atualizarResumo(){
  const b=computeResumo();
  document.getElementById('resumo').innerHTML=`
    <div class="rcard atrasada"><div class="rhead">Atrasadas <span class="n">${b.atrasada.length}</span></div><div class="rlista">${listaTk(b.atrasada)}</div></div>
    <div class="rcard semana"><div class="rhead">Esta semana (até domingo) <span class="n">${b.semana.length}</span></div><div class="rlista">${listaTk(b.semana)}</div></div>
    <div class="rcard proxima"><div class="rhead">Próxima semana <span class="n">${b.proxima.length}</span></div><div class="rlista">${listaTk(b.proxima)}</div></div>
    <div class="rcard adiante"><div class="rhead">Mais adiante <span class="n">${b.adiante.length}</span></div><div class="rlista">${listaTk(b.adiante)}</div></div>
    <div class="rcard cobrar"><div class="rhead">Cobrar o cliente de retorno <span class="n">${b.cobrar.length}</span></div><div class="rlista">${listaCobrar(b.cobrar)}</div></div>`;
}
/* ================= filtros rápidos (chips) =================
   Três grupos independentes — Prazos, Etapa atual e STATUS. Cada grupo escolhe um
   valor por vez e os três combinam entre si, com a busca e com a ordenação da
   tabela. A contagem de cada chip já respeita os OUTROS grupos ativos, então o
   número sempre bate com o que aparece ao clicar.
   As regras de prazo são as MESMAS dos cards de resumo (statusConcluido /
   aguardandoCliente), para não existir duas verdades na página. */
let FPRAZO='todos',FETAPA='todas',FSTATUS='todos';
let TAREFAS_ATIVAS=[],ESPERA_ATIVAS=[],TEM_PRAZO=false,TEM_STATUS=false;
const ETAPA_OK='__ok__',STATUS_VAZIO='__sem__';

/** O que a planilha realmente traz — chip de coluna vazia simplesmente não aparece. */
function mapearColunas(){
  const tem=k=>LINHAS.some(l=>String(l[k]==null?'':l[k]).trim()!=='');
  TAREFAS_ATIVAS=TAREFAS.filter(tf=>tem(tf.k)||tem(tf.stk));
  ESPERA_ATIVAS=ESPERA.filter(e=>tem(e.stk));
  TEM_PRAZO=TAREFAS_ATIVAS.some(tf=>tem(tf.k));
  TEM_STATUS=tem('status');
}
function janelas(){
  const t0=meia(new Date()),dow=t0.getDay();
  return {hoje:t0,t0:t0.getTime(),semana:addDias(t0,(7-dow)%7).getTime(),d30:addDias(t0,30).getTime()};
}
/** Etapas que ainda dependem da EQUIPE: não concluídas e não paradas com o cliente. */
function etapasEmAberto(l){
  return TAREFAS_ATIVAS.filter(tf=>!statusConcluido(tf.stk,l[tf.stk])&&!aguardandoCliente(tf.stk,l[tf.stk]));
}
/** Datas (em ms) dos prazos dessas etapas. */
function prazosEmAberto(l){
  const r=[];etapasEmAberto(l).forEach(tf=>{const d=parseData(l[tf.k]);if(d)r.push(meia(d).getTime());});return r;
}
/** Primeira etapa não concluída = onde o cliente está parado hoje (ordem do fluxo). */
function etapaAtual(l){const tf=TAREFAS_ATIVAS.find(t=>!statusConcluido(t.stk,l[t.stk]));return tf?tf.k:ETAPA_OK;}
function esperandoAlgo(l){return ESPERA_ATIVAS.some(e=>aguardandoCliente(e.stk,l[e.stk]));}
/** Maior espera em dias corridos; null quando não dá para saber a data de início. */
function maiorEspera(l){
  const hoje=janelas().hoje;let m=null;
  ESPERA_ATIVAS.forEach(e=>{
    if(!aguardandoCliente(e.stk,l[e.stk]))return;
    const r=esperandoDesde(l,e);if(!r.d)return;
    const d=diasCorridos(r.d,hoje);if(m==null||d>m)m=d;
  });
  return m;
}
function casaPrazo(l,f){
  if(f==='todos')return true;
  if(f==='espera')return esperandoAlgo(l);
  if(f==='espera15'){const m=maiorEspera(l);return m!=null&&m>15;}
  const j=janelas(),ps=prazosEmAberto(l);
  if(f==='aberto')return ps.length>0;
  if(f==='atrasado')return ps.some(g=>g<j.t0);
  if(f==='semana')return ps.some(g=>g>=j.t0&&g<=j.semana);
  if(f==='d30')return ps.some(g=>g>=j.t0&&g<=j.d30);
  if(f==='semprazo')return etapasEmAberto(l).length>0&&ps.length===0;
  return true;
}
function casaEtapa(l,f){return f==='todas'||etapaAtual(l)===f;}
function casaStatus(l,f){
  if(f==='todos')return true;
  const n=normTxt(l.status);
  return f===STATUS_VAZIO?n==='':n===f;
}
/** ig = grupo ignorado, para a contagem facetada dos chips daquele grupo. */
function aplicaChips(arr,ig){
  return arr.filter(l=>(ig==='prazo'||casaPrazo(l,FPRAZO))&&(ig==='etapa'||casaEtapa(l,FETAPA))&&(ig==='status'||casaStatus(l,FSTATUS)));
}
/** Valores de STATUS tirados da própria planilha (caixa/espaços normalizados). */
function statusUnicos(){
  const m=new Map();let vazio=0;
  LINHAS.forEach(l=>{
    const raw=String(l.status==null?'':l.status).trim();
    if(!raw){vazio++;return;}
    const n=normTxt(raw);if(!m.has(n))m.set(n,raw);
  });
  const lista=Array.from(m,e=>({n:e[0],raw:e[1]}));
  lista.sort((a,b)=>a.raw.localeCompare(b.raw,'pt',{sensitivity:'base'}));
  return {lista:lista,vazio:vazio};
}
function filtroAtivo(){return FPRAZO!=='todos'||FETAPA!=='todas'||FSTATUS!=='todos';}
function limparFiltros(){
  FPRAZO='todos';FETAPA='todas';FSTATUS='todos';
  const b=document.getElementById('busca');if(b)b.value='';
  redesenhar();
}
function chipHTML(dim,v,rot,n,extra,dica,estilo){
  const at=(dim==='prazo'?FPRAZO:dim==='etapa'?FETAPA:FSTATUS)===v;
  const cls='chip'+(extra?' '+extra:'')+(at?' on':'')+(!n&&!at?' zero':'');
  return '<button type="button" class="'+cls+'" data-dim="'+dim+'" data-v="'+esc(v)+'"'
    +(dica?' title="'+esc(dica)+'"':'')+(at&&estilo?' style="'+esc(estilo)+'"':'')
    +'>'+esc(rot)+'<span class="n">'+n+'</span></button>';
}
function desenharChips(){
  const cx=document.getElementById('filtros');if(!cx)return;
  const b=document.getElementById('busca'),base=porBusca(b?b.value:'');
  const bP=aplicaChips(base,'prazo'),bE=aplicaChips(base,'etapa'),bS=aplicaChips(base,'status');
  const nP=f=>bP.filter(l=>casaPrazo(l,f)).length;
  const nE=f=>bE.filter(l=>casaEtapa(l,f)).length;
  const nS=f=>bS.filter(l=>casaStatus(l,f)).length;
  let html='';

  // --- prazos e espera do cliente ---
  let p='<span class="rot">Prazos</span>'+chipHTML('prazo','todos','Todos',nP('todos'),'','Sem filtro de prazo');
  if(TEM_PRAZO){
    p+=chipHTML('prazo','aberto','Prazo em aberto',nP('aberto'),'','Tem prazo preenchido em etapa que ainda não concluiu')
      +chipHTML('prazo','atrasado','Atrasados',nP('atrasado'),'alerta','Prazo já venceu e a etapa não concluiu')
      +chipHTML('prazo','semana','Vence esta semana',nP('semana'),'aviso','Prazo entre hoje e domingo')
      +chipHTML('prazo','d30','Vence em 30 dias',nP('d30'),'','Prazo nos próximos 30 dias (atrasado tem chip próprio)')
      +chipHTML('prazo','semprazo','Sem prazo definido',nP('semprazo'),'','Tem etapa em andamento e nenhum prazo preenchido');
  }
  if(ESPERA_ATIVAS.length){
    p+=chipHTML('prazo','espera','Esperando o cliente',nP('espera'),'espera','Etapa em “Enviado ao cliente” — a bola está com ele')
      +chipHTML('prazo','espera15','Espera +15 dias',nP('espera15'),'espera','Esperando retorno há mais de 15 dias corridos');
  }
  if(TEM_PRAZO||ESPERA_ATIVAS.length)html+='<div class="chips">'+p+'</div>';

  // --- etapa em que o cliente está parado ---
  if(TAREFAS_ATIVAS.length){
    let e='<span class="rot">Etapa atual</span>'+chipHTML('etapa','todas','Todas',nE('todas'),'','Sem filtro de etapa');
    TAREFAS_ATIVAS.forEach(tf=>{e+=chipHTML('etapa',tf.k,tf.label,nE(tf.k),'','Primeira etapa ainda não concluída: '+tf.label);});
    const ok=nE(ETAPA_OK);
    if(ok||FETAPA===ETAPA_OK)e+=chipHTML('etapa',ETAPA_OK,'Tudo concluído',ok,'','Todas as etapas do fluxo já concluídas');
    html+='<div class="chips">'+e+'</div>';
  }

  // --- STATUS (valores tirados da planilha) ---
  if(TEM_STATUS){
    const u=statusUnicos();
    let t='<span class="rot">Status</span>'+chipHTML('status','todos','Todos',nS('todos'),'','Sem filtro de status');
    u.lista.forEach(x=>{
      const cor=corDe('status',x.raw);
      t+=chipHTML('status',x.n,x.raw,nS(x.n),'','STATUS: '+x.raw,cor?('background:'+cor+';border-color:'+cor+';color:'+textoContraste(cor)):'');
    });
    if(u.vazio)t+=chipHTML('status',STATUS_VAZIO,'Sem status',nS(STATUS_VAZIO),'','Coluna STATUS em branco');
    html+='<div class="chips">'+t+'</div>';
  }

  if(filtroAtivo()||(b&&b.value))html+='<div class="chips"><button type="button" class="chip limpar" id="limparFiltros">Limpar filtros e busca</button></div>';
  cx.innerHTML=html;
}
function redesenhar(){
  const b=document.getElementById('busca');
  desenharChips();
  desenhar(b?b.value:'');
}
function ehNum(s){return /^\s*-?\d+([.,]\d+)?\s*$/.test(String(s));}
function valCmp(a,b){if(ehNum(a)&&ehNum(b))return parseFloat(String(a).replace(',','.'))-parseFloat(String(b).replace(',','.'));return String(a).localeCompare(String(b),'pt',{numeric:true,sensitivity:'base'});}
function ordenar(arr){
  const key=SORT.key,dir=SORT.dir,col=COLS.find(c=>c.k===key),isData=col&&col.sort==='date';
  return arr.slice().sort((x,y)=>{
    let va=x[key]==null?'':x[key],vb=y[key]==null?'':y[key];
    const ea=String(va).trim()==='',eb=String(vb).trim()==='';
    if(ea&&eb)return 0;if(ea)return 1;if(eb)return -1;
    let r;
    if(isData){const da=parseData(va),db=parseData(vb);r=(da?da.getTime():Infinity)-(db?db.getTime():Infinity);}
    else r=valCmp(va,vb);
    return dir==='desc'?-r:r;
  });
}
function porBusca(termo){const alvo=normTxt(termo);return baseRows().filter(l=>!alvo||normTxt(l.id+' '+l.nome+' '+l.cnpj+' '+(l.email||'')).includes(alvo));}
function filtradas(termo){return aplicaChips(porBusca(termo),null);}
function seta(key){return SORT.key===key?(SORT.dir==='asc'?' ▲':' ▼'):'';}
function celHTML(l,c){
  const v=l[c.k]==null?'':l[c.k];
  const abrir=(c.t==='url'&&/^https?:/i.test(v))?`<a class="abrir" href="${esc(v)}" target="_blank" rel="noopener" title="abrir">↗</a>`:'';
  let campo;
  if(c.ro){
    if(c.opt&&corDe(c.opt,v)){const cor=corDe(c.opt,v);campo=`<span class="robadge" style="background:${cor};color:${textoContraste(cor)}">${esc(v)}</span>`;}
    else if(c.t==='area')campo=`<div class="ro roarea" style="width:${c.w}px">${esc(v)}</div>`;
    else if(c.t==='mails'){
      const mails=String(v).split(/[,;\s]+/).map(x=>x.trim()).filter(x=>x.indexOf('@')>0);
      campo=`<div class="ro romails" style="width:${c.w}px">`+(mails.length?mails.map(m=>`<a href="mailto:${esc(m)}">${esc(m)}</a>`).join(''):'—')+`</div>`;
    }
    else if(c.t==='url')campo=`<div class="ro rourl" style="width:${c.w}px" title="${esc(v)}">${esc(v)||'—'}</div>`;
    else campo=`<div class="ro" style="width:${c.w}px" title="${esc(v)}">${esc(v)}</div>`;
  }else if(c.t==='select'){
    const opts=OPT[c.opt].slice();if(v&&opts.indexOf(v)<0)opts.unshift(v);
    const cor=corDe(c.opt,v);const st=`width:${c.w}px`+(cor?`;background:${cor};color:${textoContraste(cor)};font-weight:700`:'');
    campo=`<select data-k="${c.k}" data-opt="${c.opt}" style="${st}"><option value=""${v===''?' selected':''}>—</option>`+opts.map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(o)}</option>`).join('')+`</select>`;
  }else if(c.t==='area')campo=`<textarea data-k="${c.k}" style="width:${c.w}px">${esc(v)}</textarea>`;
  else campo=`<input data-k="${c.k}" type="text" value="${esc(v)}"${c.dica?` placeholder="${esc(c.dica)}"`:''} style="width:${c.w}px">`;
  return `<td><div class="cel" data-cell="${c.k}">${campo}${abrir}</div></td>`;
}
/** Chip "Planilha ↗" na coluna congelada do Nome: abre a planilha de equiparação
 *  do cliente sem precisar rolar a tabela até a coluna do link. */
function atalhoEquip(l){
  const u=String(l.link_equip||'').trim();
  if(!/^https?:/i.test(u))return '';
  return `<br><a class="eq" href="${esc(u)}" target="_blank" rel="noopener" title="Abrir a planilha de equiparação de ${esc(l.nome||l.id)}">Planilha ↗</a>`;
}
function desenhar(termo){
  const arr=ordenar(filtradas(termo));
  document.getElementById('cnt').textContent=arr.length+' de '+baseRows().length+' clientes';
  const head='<thead><tr>'
    +'<th class="col-id" data-sort="id">ID'+seta('id')+'</th>'
    +'<th class="col-nome" data-sort="nome">Nome'+seta('nome')+'</th>'
    +COLS.map(c=>`<th data-sort="${c.k}" style="min-width:${c.w+16}px">${esc(c.label)}${seta(c.k)}</th>`).join('')+'</tr></thead>';
  const body='<tbody>'+(arr.map(l=>`<tr data-row="${l.row}" data-id="${esc(l.id)}"><td class="col-id">${esc(l.id)}</td><td class="col-nome">${esc(l.nome||'')}${atalhoEquip(l)}</td>${COLS.map(c=>celHTML(l,c)).join('')}</tr>`).join('')||`<tr><td colspan="${COLS.length+2}" style="padding:18px;color:var(--muted)">Nenhum cliente com os filtros de agora. <button type="button" class="chip limpar" id="limparFiltros">Limpar filtros e busca</button></td></tr>`)+'</tbody>';
  document.getElementById('tab').innerHTML=head+body;
}
function irPara(row,k){
  // a linha precisa estar visível: solta a busca e os chips antes de rolar até ela
  const busca=document.getElementById('busca');
  if((busca&&busca.value)||filtroAtivo()){FPRAZO='todos';FETAPA='todas';FSTATUS='todos';if(busca)busca.value='';redesenhar();}
  requestAnimationFrame(()=>{
    const tr=document.querySelector(`#tab tr[data-row="${row}"]`);if(!tr)return;
    tr.scrollIntoView({block:'center'});
    tr.classList.add('destaque');setTimeout(()=>tr.classList.remove('destaque'),5000);   // 5 segundos na linha
    const cel=tr.querySelector(`[data-cell="${k}"]`);if(cel){cel.classList.add('flash');setTimeout(()=>cel.classList.remove('flash'),1700);}
  });
}
function coletar(tr){const campos={};tr.querySelectorAll('[data-k]').forEach(el=>campos[el.dataset.k]=el.value);return campos;}
let timers={};
function agendarSalvar(tr){
  const row=tr.dataset.row,campos=coletar(tr);
  setSave('saving','Alterado…');
  clearTimeout(timers[row]);
  timers[row]=setTimeout(()=>salvar(row,tr.dataset.id,campos),450);
}
async function salvar(row,id,campos){
  setSave('saving','Salvando…');
  try{
    await postAcao({acao:'rest_salvar',row:+row,id,campos,cod:respAtual()});
    const l=LINHAS.find(x=>x.row==row);if(l)Object.keys(campos).forEach(k=>l[k]=campos[k]);
    setSave('ok','Salvo ✓ '+horaAgora());
    atualizarResumo();
    desenharChips();   // só os chips: redesenhar a tabela tiraria o foco de quem está digitando
  }catch(e){setSave('err','Não salvou: '+(e.message||e));}
}

document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.k)return;
  if(el.tagName==='SELECT'&&el.dataset.opt){const cor=corDe(el.dataset.opt,el.value);el.style.background=cor||'';el.style.color=cor?textoContraste(cor):'';el.style.fontWeight=cor?'700':'600';}
  const tr=el.closest('tr[data-row]');if(tr)agendarSalvar(tr);
});
document.addEventListener('click',e=>{
  const th=e.target.closest('th[data-sort]');
  if(th){const k=th.dataset.sort;if(SORT.key===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.key=k;SORT.dir='asc';}desenhar(document.getElementById('busca').value);return;}
  const chip=e.target.closest('.chip[data-dim]');
  if(chip){
    const d=chip.dataset.dim,v=chip.dataset.v;
    if(d==='prazo')FPRAZO=v;else if(d==='etapa')FETAPA=v;else if(d==='status')FSTATUS=v;
    redesenhar();return;
  }
  if(e.target.closest('#limparFiltros')){limparFiltros();return;}
  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto,tk.dataset.k);return;}
});
window.addEventListener('hashchange',carregar);   // trocar o código (#) recarrega para o colaborador certo

document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());
carregar();
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador.html') {
        try { href = 'colaborador.html?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador.html'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
