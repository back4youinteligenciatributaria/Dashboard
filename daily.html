<style>
/* B4U-DESIGN:INICIO — paleta, cantos e fonte que as 22 páginas dividem.
   Bloco copiado de b4u-design.css (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-design.js`.

   Entra ANTES do <style> da página de propósito — é a camada base. Se esta
   página precisar mesmo de um valor diferente, redeclare o token no `:root`
   dela, que vem depois e vence. */
:root{
  /* ── Superfícies ─────────────────────────────────────────────────────────
     `--canvas` é o bege do fundo da página; `--surface` é o branco do cartão
     que se apoia nele; `--surface-warm` é o branco quebrado das faixas e
     cabeçalhos de tabela, que separam sem precisar de borda. */
  --canvas:#F1E7DC;
  --surface:#FFFFFF;
  --surface-warm:#FBF6EF;

  /* ── Letra ───────────────────────────────────────────────────────────────
     `--ink` é o texto normal, `--ink-2` o secundário, `--muted` o rótulo.
     `--muted` já foi #8A7D70 e reprovava em contraste (3,28:1); #6E6256 dá
     4,85:1 no bege e 5,92:1 no branco, e é a cor de quase todo rótulo do
     sistema — por isso ela precisa passar, e não só quase. */
  --ink:#113D39;
  --ink-2:#3F5854;
  --muted:#6E6256;

  /* ── Traços ──────────────────────────────────────────────────────────────
     `--line` divide o que é do mesmo grupo; `--line-2` fecha o que é caixa. */
  --line:#E4D9C9;
  --line-2:#D6C3AC;

  /* ── Marca ───────────────────────────────────────────────────────────────
     `--brand-teal` é canônico em logo, foco, borda e série de gráfico. Como
     TEXTO ele reprova (4,11:1 no branco, 3,44:1 no receita-soft), e para isso
     existe o `--brand-teal-txt`: o mesmo teal escurecido, 5,54:1 no branco e
     4,54:1 no bege, usado só onde é letra ou fundo de letra. Os dois são a
     mesma cor com dois trabalhos. O 4,54:1 passa, mas passa RASPANDO: quem for
     escurecer o `--canvas` um dia tem de conferir este par antes. */
  --brand-dark:#073034;
  --brand-teal:#0F8C85;
  --brand-euc:#3FA680;
  --brand-teal-txt:#0C756F;

  /* ── SINAL: as quatro cores que querem dizer alguma coisa ────────────────
     Estas quatro NÃO seguem o tema (ver OS QUATRO TEMAS, no fim do arquivo). Se
     "vencido" mudasse de vermelho conforme a pele escolhida, a cor deixaria de
     ser informação e viraria decoração — e quem trabalha nesta tela o dia
     inteiro lê a cor antes de ler a palavra.

     `--amber` tem 2,61:1 no branco: serve de PREENCHIMENTO e de borda, nunca de
     letra. Para letra âmbar existe o `--amber-txt` (5,91:1 no branco).

     ┌── PENDÊNCIA CONHECIDA: `--verde` E `--vermelho` REPROVAM COMO LETRA ────┐
     │                                                                        │
     │ Os dois NÃO têm o par `-txt` que o âmbar tem, e são usados nas duas     │
     │ funções ao mesmo tempo:                                                │
     │                                                                        │
     │     --verde     12 usos como `color`, 11 como `background`, 7 em borda │
     │     --vermelho  41 usos como `color`, 31 como `background`, 41 em borda │
     │                                                                        │
     │ E o lado TEXTO reprova. Medido nos valores atuais:                     │
     │                                                                        │
     │     --verde     #2E9D5F   2,82:1 no bege · 3,44:1 no branco   REPROVA  │
     │     --vermelho  #C0392B   4,46:1 no bege · 5,43:1 no branco   raspando │
     │                                                                        │
     │ O mínimo para texto é 4,5:1. É a mesma falha do `--muted` antigo (que   │
     │ dava 3,28:1), e atinge `.hint.ok` e `.lk.ok`, que são letra e nada      │
     │ mais. Há prova de que alguém já tinha esbarrado nisso sem nomear: o     │
     │ `.det-fbtn.ativo` escreve `color:#0E5B37` à mão — um verde bem mais     │
     │ escuro — em vez de usar o token.                                       │
     │                                                                        │
     │ CONSERTO MEDIDO E NÃO APLICADO (decisão de 10/08/2026):                 │
     │                                                                        │
     │     --verde     #2E9D5F -> #1F7546   (2,82:1 -> 4,66:1 no bege)        │
     │     --vermelho  #C0392B -> #BB3728   (4,46:1 -> 4,66:1 no bege)        │
     │                                                                        │
     │ Matiz e saturação ficam onde estão; só a luminosidade desce, o mínimo   │
     │ para passar com folga. Escurecer é seguro pelo lado do FUNDO: TODAS as  │
     │ regras `background:var(--verde)` / `background:var(--vermelho)` já vêm  │
     │ com `color:#fff` (ou são faixa/pontinho sem texto), e fundo mais escuro │
     │ com letra branca só melhora.                                           │
     │                                                                        │
     │ POR QUE NÃO FOI APLICADO AGORA: mexer nestes dois repinta as 22         │
     │ páginas, inclusive as 8 do cliente. A rodada que centralizou os tokens  │
     │ era de ESTRUTURA — nenhum pixel de cor mudou nela de propósito, para    │
     │ que qualquer diferença que aparecesse em produção tivesse uma causa só. │
     │ Trocar cor é decisão de produto e vai junto da varredura do MODO        │
     │ ESCURO, que já vai ter de abrir os 22 arquivos.                         │
     │                                                                        │
     │ QUANDO FOR FAZER, olhe também o `--verde-2`: várias páginas o declaram  │
     │ valendo #25804C, com a nota "o verde um degrau mais escuro, para virar  │
     │ FUNDO de texto branco". Com o conserto acima, o `--verde` do núcleo     │
     │ fica MAIS ESCURO que o `--verde-2`, e a convenção do sufixo -2 se       │
     │ inverte nesse par. Não dá para resolver daqui: o `--verde-2` mora no    │
     │ `:root` de cada página.                                                │
     └────────────────────────────────────────────────────────────────────────┘

     (Escrito assim, sem dois-pontos colado no nome, de propósito: a
     `tokensCanonicos()` do `_aplica-design.js` varre este bloco com um regex de
     declaração e NÃO pula comentário. Nome de token seguido de dois-pontos aqui
     dentro vira token canônico de mentira, e o `--verde-2` de mentira faria as
     22 páginas aparecerem como "exceção mantida" no terminal. Vale para todo
     comentário deste arquivo: cite o token, nunca o escreva como declaração.) */
  --amber:#E8892E;
  --amber-txt:#8A5A10;
  --vermelho:#C0392B;
  --verde:#2E9D5F;

  /* ── Cantos ──────────────────────────────────────────────────────────────
     Uma escala só, no site inteiro, e mais QUADRADA que redonda.
       4px  campo, selo, célula
       6px  cartão, linha da lista, botão
       8px  bloco grande e modal
     `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é citado
     em mais de cem regras, mas o valor acompanha o resto — pílula virou
     etiqueta. Círculo de verdade (avatar, contador, spinner) continua com
     `border-radius:50%` escrito na regra e não passa por aqui. */
  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-pill:6px;

  /* ── Escala tipográfica ──────────────────────────────────────────────────
     Seis degraus, e o pulo entre eles é de propósito irregular: 11-12-13 é a
     faixa de rótulo, selo e nota de rodapé, onde 1px já muda a hierarquia; 15 é
     o corpo; 19 e 24 são título de bloco e de tela. Um degrau constante (1,2×,
     por exemplo) daria 11-13-16-19-23-28 e gastaria três tamanhos na faixa em
     que o olho não distingue nada.
     ATENÇÃO: o `body{font-size:15px}` das páginas está escrito à mão e NÃO sai
     daqui. Quem mexer na escala não muda o corpo do texto; muda só quem usa
     `var(--fs-N)` — que é rótulo, selo, cabeçalho de tabela e título. */
  --fs-1:11px;
  --fs-2:12px;
  --fs-3:13px;
  --fs-4:15px;
  --fs-5:19px;
  --fs-6:24px;

  /* ── Fonte ───────────────────────────────────────────────────────────────
     Montserrat vem do Google Fonts, declarado no <head> de cada página. O
     `system-ui` é o que aparece enquanto ela não chega — e é o que fica se ela
     não chegar nunca. */
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
/* B4U-DESIGN:FIM */
</style>
<style>
:root{
  /* Paleta canônica da equipe — a mesma em todas as telas. */
  --amber-soft:#FCEFE0;--amber-line:#F0D6B4;--amber-2:#B05F12;
  --verde-2:#25804C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);
  font-size:var(--fs-3);line-height:1.5;-webkit-font-smoothing:antialiased}
/* Gap e recuo laterais são os das telas irmãs (12px / 20px). Eram 10 e 14 — pouco
   para alguém defender e o bastante para a etiqueta "pular" de lugar ao trocar de
   tela pelo menu lateral. A ALTURA continua travada em 52px: é a medida que o
   `.topo{top:52px}` de duas irmãs escreveu à mão, e o botão de três riscos do
   b4u-shell.js foi desenhado com 28px justamente para não empurrá-la. */
.barra{position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;gap:12px;
  padding:0 20px;background:var(--brand-dark);color:#fff}
.barra .logo{font-weight:800;font-size:17px;letter-spacing:-.02em}
.barra .logo .y{color:var(--brand-euc)}
/* `.tag` e não `.titulo`: é o nome que as outras oito telas da equipe usam para o
   MESMO elemento, e uma barra padronizada não pode ter dois nomes para a mesma
   coisa — quem for mexer na barra de todas procuraria por `.tag` e passaria batido
   por esta. A declaração também é a delas, letra por letra: a etiqueta desta tela
   era um degrau maior e um tom mais clara que a das irmãs. */
.barra .tag{font-size:var(--fs-2);font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);
  padding:5px 11px;border-radius:var(--radius-pill);white-space:nowrap}
.barra .spacer{flex:1}
/* A contagem de tarefas continua sendo ESCRITA (desenharLista(), a cada
   redesenho), só não é mais mostrada: ela é o `#cnt` desta tela, e o dono tirou a
   contagem da barra. Quem a esconde é a folha do b4u-shell.js, para ela voltar
   sozinha se o shell não carregar. */
.barra .cont{font-size:var(--fs-2);color:#cfe6e2;white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 80px}

/* ---------- topo: busca, filtros, ação ---------- */
.topo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.busca{flex:1;min-width:220px;font-family:inherit;font-size:var(--fs-3);color:var(--ink);
  border:1px solid var(--line-2);border-radius:var(--radius-pill);padding:9px 15px;background:var(--surface)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:-1px}
.btn{font-family:inherit;font-size:var(--fs-3);font-weight:700;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:var(--radius-pill);padding:9px 15px}
.btn:hover{border-color:var(--brand-teal)}
.btn--primary{background:var(--brand-teal);border-color:var(--brand-teal);color:#fff}
.btn--primary:hover{background:var(--brand-teal-txt)}
/* `max-width` e `min-width:0` não são enfeite: o <select> de cliente dimensiona
   pela OPÇÃO MAIS LONGA, e uma razão social inteira ("AJUB - CIRURGIA DE CABEÇA
   E PESCOÇO E OTORRINOLARINGOLOGIA SOCIEDADE SIMPLES") esticava a caixa para
   563px dentro de uma janela de 390 — a página inteira ganhava rolagem lateral
   por causa de um nome de cliente. */
select.filtro{font-family:inherit;font-size:var(--fs-3);color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--radius-pill);padding:9px 13px;cursor:pointer;
  max-width:100%;min-width:0;text-overflow:ellipsis}
select.filtro:focus{outline:2px solid var(--brand-teal);outline-offset:-1px}
/* Todo filtro é colorido, mesmo no padrão: a caixa que diz "Minhas tarefas"
   está filtrando tanto quanto qualquer outra, e deixá-la cinza fazia parecer
   que a lista era tudo o que existe. */
select.filtro{border-color:var(--brand-teal);color:var(--brand-teal-txt);font-weight:700}
/* "Todo o time" é o estado que muda o significado da tela inteira — de "o que eu
   tenho" para "o que existe". Ele se anuncia: verde cheio, letra branca. */
select.filtro.time,input.filtro.time{background:var(--verde-2);border-color:var(--verde-2);color:#fff}
/* Texto que ainda não identifica ninguém. O filtro anterior CONTINUA valendo de
   propósito — trocar para "nada encontrado" a cada letra faria a lista piscar
   vazia no meio de "Aj-u-b". Mas isso não pode ser mudo: sem a marca, quem
   digitou errado acha que está vendo o resultado do que escreveu, quando está
   vendo o resultado do que escreveu antes. */
input.filtro.ruim{border-color:var(--amber);color:var(--amber-txt);background:var(--amber-soft)}
select.filtro.time option{background:var(--surface);color:var(--ink)}
/* Cliente é campo de DIGITAR, não de rolar: com a carteira inteira numa caixinha,
   achar "Ajub" custava rolagem e memória do nome exato. Com datalist, "ajub"
   basta — e o navegador casa por qualquer pedaço, inclusive pelo ID. */
input.filtro{font-family:inherit;font-size:var(--fs-3);color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--radius-pill);padding:9px 15px;min-width:0;max-width:100%}
input.filtro:focus{outline:2px solid var(--brand-teal);outline-offset:-1px}
input.filtro.on{border-color:var(--brand-teal);color:var(--brand-teal-txt);font-weight:700}
.cli-hint{font-size:var(--fs-1);color:var(--muted);line-height:1.35}
.cli-hint.err{color:var(--vermelho);font-weight:700}

/* ---------- mini-painel ----------
   Três blocos numa faixa só, entre a régua e a lista: o que está EM ABERTO
   repartido por prazo, o que foi CONCLUÍDO num período, e o aberto POR ÁREA.
   Cada número é um botão que aplica na régua o filtro que o produziu — o painel
   não é enfeite de leitura, é a régua dita em números.

   FICA ABAIXO DA RÉGUA, e não acima. A busca e as quatro caixas são o controle
   que a equipe usa dezenas de vezes por dia, com a mão já sabendo onde ficam;
   empurrá-las 90px para baixo cobraria essa memória de todo mundo em troca de um
   painel que se lê uma vez por abertura. A ordem lida é: eu escolho o recorte
   (régua) → o painel resume esse recorte → a lista mostra. */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:14px;display:grid;gap:12px 16px;
  grid-template-columns:minmax(0,1.6fr) minmax(0,auto) minmax(0,1.4fr)}
.pn-bl{min-width:0;display:flex;flex-direction:column;gap:7px;justify-content:flex-start}
.pn-bl+.pn-bl{border-left:1px solid var(--line);padding-left:16px}
.pn-cab{font-size:var(--fs-1);font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* O número grande é BOTÃO — ele desfaz o recorte e volta para "tudo em aberto".
   Sem chrome de botão de propósito: aqui o clique é um bônus de quem descobre, e
   um retângulo em volta de um número de 24px roubaria a leitura do painel. */
.pn-num{font:inherit;font-size:var(--fs-6);font-weight:800;line-height:1.1;color:var(--ink);
  background:none;border:0;padding:0;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.pn-num:hover{color:var(--brand-teal-txt)}
.pn-num:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:var(--radius-sm)}
.pn-num .un{font-size:var(--fs-2);font-weight:700;color:var(--muted);margin-left:6px}
.pn-num.verde{color:var(--verde-2)}
/* Ligado: sublinhado grosso, e não uma caixa em volta. O número já é o maior
   elemento do painel — cercá-lo mudaria a hierarquia da faixa inteira só para
   dizer um estado. */
.pn-num.ativo{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.pn-sub{font-size:var(--fs-1);color:var(--muted);font-variant-numeric:tabular-nums}
/* A BARRA — o gráfico. Uma linha de 8px, cada faixa proporcional à contagem e
   clicável como o selo de baixo. Empilhada e não em pizza porque a pergunta é
   "quanto de urgente sobre o total", e comprimento se compara de relance;
   ângulo, não. */
.pn-barra{display:flex;height:8px;border-radius:3px;overflow:hidden;background:var(--surface-warm);
  border:1px solid var(--line)}
.pn-seg{border:0;padding:0;cursor:pointer;background:var(--c);min-width:4px}
.pn-seg:hover{filter:brightness(1.12)}
.pn-selos{display:flex;flex-wrap:wrap;gap:5px}
.pn-selo{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:var(--fs-2);
  font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface-warm);
  color:var(--ink-2);border-radius:var(--radius-sm);padding:3px 8px;white-space:nowrap}
.pn-selo i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.pn-selo b{font-variant-numeric:tabular-nums;color:var(--ink)}
.pn-selo:hover{border-color:var(--c)}
/* Recorte ligado: contorno na cor do próprio recorte, e não um azul genérico de
   "selecionado" — a cor já é a informação em toda esta tela (ver a nota das
   cores de situação), e o estado ligado não pode falar outra língua. */
.pn-selo.ativo{background:var(--surface);border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
/* Zero continua À VISTA e deixa de ser clicável. "0 atrasadas" é a melhor
   notícia do painel e sumir com ela seria esconder a resposta; mas clicar para
   abrir uma lista vazia é um beco, e beco não se oferece. */
/* Exceção: o selo LIGADO nunca é desativado, mesmo zerado. Um recorte que a
   pessoa acabou de aplicar e que não achou nada precisa continuar clicável, ou
   o gesto que o ligou deixa de ser o gesto que o desliga. */
.pn-selo[disabled]{opacity:.5;cursor:default;box-shadow:none}
.pn-per{font:inherit;font-size:var(--fs-1);font-weight:700;text-transform:none;letter-spacing:0;
  color:var(--brand-teal-txt);background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--radius-sm);padding:2px 4px;cursor:pointer;max-width:100%}
.pn-per:focus{outline:2px solid var(--brand-teal);outline-offset:-1px}
.pn-areas{display:flex;flex-wrap:wrap;gap:5px}
/* A barra de cada área vive DENTRO do selo, como preenchimento proporcional ao
   maior — nove áreas em nove linhas com barra própria dariam um bloco mais alto
   que a régua, e o painel deixaria de ser mini. Aqui a mesma tinta faz as duas
   coisas: dizer o tamanho e ser o alvo do clique. */
.pn-area{position:relative;overflow:hidden;font:inherit;font-size:var(--fs-2);font-weight:700;
  cursor:pointer;border:1px solid var(--line);background:var(--surface-warm);color:var(--ink-2);
  border-radius:var(--radius-sm);padding:3px 8px;display:inline-flex;gap:7px;align-items:center;
  max-width:100%;min-width:0}
.pn-area::before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p);
  background:#DBEFEC}
.pn-area>span{position:relative;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-area>b{position:relative;font-variant-numeric:tabular-nums;color:var(--ink);flex:none}
.pn-area:hover{border-color:var(--brand-teal)}
.pn-area.ativo{border-color:var(--brand-teal);box-shadow:inset 0 0 0 1px var(--brand-teal);
  color:var(--brand-teal-txt)}
.pn-vazio{font-size:var(--fs-2);color:var(--muted)}

/* ---------- grupos ---------- */
.grupo{margin:18px 0 8px;display:flex;align-items:baseline;gap:9px}
.grupo h2{margin:0;font-size:var(--fs-2);text-transform:uppercase;letter-spacing:.06em;
  font-weight:800;color:var(--muted)}
.grupo .n{font-size:var(--fs-2);color:var(--muted);font-weight:700}
.grupo.atrasado h2{color:#8E2A1D}

/* ---------- linha ---------- */
/* Grade, não <table>: abaixo de 900px a linha vira duas dentro da mesma faixa,
   e tabela não faz isso sem virar rolagem lateral. */
.lista{display:flex;flex-direction:column;gap:6px}
/* Cabeçalho das colunas: existe para a grade ser lida como grade. Sem ele, seis
   informações alinhadas viram seis colunas sem nome e a pessoa adivinha qual é
   qual pela primeira linha. Some junto com a grade abaixo de 900px. */
/* O `padding-left` soma os 4px da faixa lateral colorida da linha (border-left)
   aos 13px de recuo dela. Sem essa soma o cabeçalho ficava 4px à esquerda do
   conteúdo — pouco para alguém apontar o dedo, o bastante para a coluna parecer
   torta e o olho não confiar no alinhamento, que é a única coisa que esta grade
   tem para oferecer. */
.cabgrade{display:grid;grid-template-columns:var(--cols);gap:0 12px;
  padding:2px 13px 6px 17px;font-size:var(--fs-1);font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted)}
.cabgrade span:last-child{text-align:right}
/* Grade, não <table>: abaixo de 900px cada linha vira duas dentro da mesma faixa,
   e tabela não faz isso sem virar rolagem lateral.
   As colunas são FIXAS de propósito — ID sempre no mesmo x, área sempre no
   mesmo x. Correr o olho por uma coluna só é o que faz uma lista de trinta
   linhas ser lida em segundos. */
/* RESPONSÁVEL ganhou 28px: com 124px, "Gian Paradisi (você)" era cortado
   exatamente no "(você)" — o marcador que existe para a pessoa achar as tarefas
   dela de relance virava "(voc…". Quem cede o espaço é o ASSUNTO, que é 1fr e
   quebra em mais linhas sem perder nada. */
:root{
--cols:78px minmax(0,1fr) 108px 152px 128px 108px
}
.t{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  border-left:4px solid var(--line-2);padding:10px 13px;display:grid;gap:2px 12px;
  grid-template-columns:var(--cols);align-items:start;cursor:pointer}
/* Assunto de três linhas fazia a linha crescer e, com align-items:center, ÁREA,
   RESPONSÁVEL, SITUAÇÃO e PRAZO desciam para o meio dela — longe do cabeçalho,
   e parecendo pertencer à linha de baixo. Com `start` toda coluna começa na
   mesma altura; o `padding-top` de 1px só acerta a base do texto pequeno com a
   do assunto, que é maior. */
.t-id,.t-area,.t-quem,.t-cel{padding-top:1px}
.t-id{font-size:var(--fs-2);font-weight:800;color:var(--brand-teal-txt);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-area,.t-quem{font-size:var(--fs-2);color:var(--ink-2);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-quem .vc{color:var(--brand-teal-txt);font-weight:700}
/* Se ainda assim faltar espaço, quem encolhe é o NOME, não o marcador: o nome
   cortado ainda identifica a pessoa, "(você)" cortado não identifica nada. */
.t-quem{display:flex;gap:4px;align-items:baseline}
.t-quem .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-quem .vc{flex:none}
.t-cel{min-width:0;display:flex;justify-content:flex-end}
.t:hover{border-color:var(--line-2);box-shadow:0 1px 5px rgba(7,48,52,.07)}
.t:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
/* Uma cor por situação, na faixa lateral e na pílula — as duas do mesmo tom, para
   a linha inteira dizer a mesma coisa de longe e de perto.
     A fazer .............. areia   (parado, sem alarme)
     Em andamento ......... teal    (a cor de "acontecendo" no resto do painel)
     Esperando terceiro ... âmbar   (não é culpa de ninguém aqui dentro)
     Feito ................ verde
     Cancelado ............ cinza
   Vermelho fica reservado para ATRASO, que é estado de prazo e não de situação —
   se ele também pintasse uma situação, a lista teria dois vermelhos querendo
   dizer coisas diferentes. */
.t.s-afazer{border-left-color:#C8B18C}
.t.s-andamento{border-left-color:var(--brand-teal)}
.t.s-esperando{border-left-color:var(--amber)}
.t.s-feito{border-left-color:var(--verde);opacity:.72}
.t.s-cancelado{border-left-color:var(--line-2);opacity:.55}
.t.venceu{border-left-color:var(--vermelho)}
.t-assunto{font-weight:700;font-size:var(--fs-4);min-width:0;overflow-wrap:anywhere;grid-column:2}
.t.s-feito .t-assunto,.t.s-cancelado .t-assunto{text-decoration:line-through;text-decoration-thickness:1px}
.t-meta{grid-column:2;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:var(--fs-2);color:var(--muted)}
.t-cli{color:var(--brand-teal-txt);font-weight:700}
/* "+2" ao lado do primeiro ID: diz que a tarefa alcança mais gente sem esticar
   a coluna. A lista inteira está no title da linha e dentro da ficha. */
.t-mais{margin-left:4px;font-size:var(--fs-1);font-weight:800;color:var(--muted)}
.t-prazo{font-variant-numeric:tabular-nums;white-space:nowrap}
.t-prazo.venceu{color:var(--vermelho);font-weight:700}
.t-prazo.hoje{color:var(--amber-txt);font-weight:700}
.pill{display:inline-block;font-size:var(--fs-1);font-weight:700;border-radius:var(--radius-pill);
  padding:2px 9px;border:1px solid var(--line-2);background:var(--surface-warm);color:var(--ink-2);white-space:nowrap}
.pill.p-afazer{background:#F3E7D5;color:#6B4E22;border-color:#E0CBA8}
.pill.p-andamento{background:#DBEFEC;color:#0A5F59;border-color:#9FD3CD}
.pill.p-esperando{background:var(--amber-soft);color:var(--amber-txt);border-color:var(--amber-line)}
.pill.p-feito{background:#E2F2E8;color:#1F6B45;border-color:#A8D9BE}
.pill.p-cancelado{background:#EFEAE3;color:var(--muted)}
.pill.p-todos{background:#EDE6FA;color:#5B3E9E;border-color:#CFC0EE}
.pill.p-interno{background:#EFEAE3;color:var(--ink-2)}
.vazio{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius);
  padding:26px 18px;text-align:center;color:var(--muted)}
/* "Experimente Todo o time" era texto: a saída da tela vazia estava escrita e não
   clicável, e a pessoa tinha de achar a caixinha lá em cima sozinha. */
.link-btn{font:inherit;font-weight:700;color:var(--verde-2);background:none;border:0;
  padding:0 2px;cursor:pointer;text-decoration:underline}
.link-btn:hover{color:var(--brand-teal-txt)}

/* ---------- modal ----------
   A MOLDURA — véu, caixa, cabeçalho escuro, rodapé, aviso de "tem coisa por
   gravar" — saiu daqui e mora no b4u-modal.js, que a monta em `b4m-` para os
   sete modais do painel de uma vez. Esta tela era a que mais destoava: véu mais
   claro, caixa mais estreita, × redondo em vez de pílula — três diferenças que
   ninguém decidiu, só aconteceram. O que fica abaixo é o que é DESTA ficha. */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label,.fld>.lbl{font-size:var(--fs-1);font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
/* FILHO DIRETO, e isso importa. O campo Cliente da ficha deixou de ser um
   <input> e virou a caixa de seleção do b4u-filtro.js, que traz DENTRO dela um
   campo de busca e um checkbox por linha. Escrito como `.fld input`, o vestido
   de campo desta tela (borda, 8px de recuo, largura cheia) alcançava aqueles
   controles e os deformava — checkbox de 15px com 10px de padding e borda de
   campo. Com `>`, cada arquivo veste o que é dele. */
.fld>input,.fld>select,.fld>textarea{font-family:inherit;font-size:var(--fs-3);color:var(--ink);
  border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:8px 10px;background:var(--surface);width:100%}
.fld textarea{resize:vertical;min-height:70px;line-height:1.45}
.fld>input:focus,.fld>select:focus,.fld>textarea:focus{outline:2px solid var(--brand-teal);outline-offset:-1px}
.fld .dica{font-size:var(--fs-1);color:var(--muted);line-height:1.35}
/* O que era campo e virou informação: "Aberto em" de uma tarefa que já existe. A
   tipografia é a do campo (mesmo tamanho, mesma altura de linha), sem a borda —
   o alinhamento com o campo ao lado é o que faz a grade continuar lendo como
   grade, mas nada aqui convida a clicar. */
.fld .valor{font-size:var(--fs-3);color:var(--ink);font-weight:700;padding:8px 0;
  font-variant-numeric:tabular-nums}
/* A caixa de seleção de cliente dentro da ficha. Na régua o botão tem teto de
   240px (uma razão social não pode esticar a barra); aqui ele é o campo, e campo
   ocupa a coluna inteira — do contrário ficaria um retângulo de 240px ao lado de
   um <select> de 350px, e a ficha pareceria torta. */
.fld-cli{min-width:0;display:flex}
.fld-cli .b4f-bt{max-width:100%;width:100%}
.fld-cli .b4f-rot{flex:1}
.gsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px;margin-bottom:12px}
.gsec h3{margin:0 0 10px;font-size:var(--fs-2);text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);display:flex;align-items:center;gap:7px}
.gsec h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--brand-euc);flex:none}
.msg{min-height:17px;font-size:var(--fs-2)}
.msg.err{color:var(--vermelho);font-weight:700}
.msg.ok{color:var(--verde-2);font-weight:700}

/* ---------- histórico ---------- */
/* A conversa em ordem de tempo, mais nova em cima. Nota e mudança de estado no
   MESMO fluxo: separar em dois lugares obrigaria a ler os dois para entender uma
   história só. */
.log{display:flex;flex-direction:column;gap:0}
.log-i{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.log-i:first-child{border-top:0}
.log-q{font-size:var(--fs-1);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.log-t{font-size:var(--fs-3);overflow-wrap:anywhere}
.log-t .quem{font-weight:700}
.log-i.tipo-situacao .log-t,.log-i.tipo-prazo .log-t,.log-i.tipo-responsavel .log-t{color:var(--ink-2)}
.log-i.tipo-situacao .log-t b,.log-i.tipo-prazo .log-t b{font-weight:700;color:var(--ink)}
.log-vazio{color:var(--muted);font-size:var(--fs-2);padding:6px 0}

/* Abaixo de 900px a grade desmonta: as seis colunas viram linhas empilhadas,
   porque 78px de ID ao lado de 108px de área num celular deixariam o assunto —
   que é o que se lê — com uns 60px. */
@media(max-width:900px){
  /* O painel desempilha pelo mesmo motivo que a grade: três colunas num celular
     dariam ~110px cada, e "Esta semana 12" não cabe em 110px sem quebrar no meio
     da palavra. Empilhado, o traço que separava vira o traço de cima. */
  .painel{grid-template-columns:1fr;gap:12px}
  .pn-bl+.pn-bl{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}
  .cabgrade{display:none}
  .t{grid-template-columns:1fr auto;gap:3px 10px}
  .t-assunto,.t-meta,.t-linha2{grid-column:1/-1}
  .t-linha2{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center}
  .t-cel{justify-content:flex-start}
}
@media(max-width:760px){ .grid{grid-template-columns:1fr} }
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<style>
/* Identificador que chegou da planilha com dígito faltando. O número aparece
   como veio — inventar o zero deixaria um CNPJ inexistente com cara de certo —
   e ganha um sublinhado pontilhado âmbar mais o ⚠. O title diz quantos dígitos

.b4u-trunc{text-decoration:underline dotted var(--amber,#E8892E);text-underline-offset:2px;cursor:help}
.b4u-trunc-m{color:var(--amber-txt,#8A5A10);font-size:.85em;margin-left:3px;vertical-align:1px}
/* Só para leitor de tela: o ⚠ é aria-hidden, e sem isto quem não vê a tela não
   ficaria sabendo que o número está incompleto. */
.b4u-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* O mesmo aviso por extenso, dentro da ficha. Na lista cabe um ⚠; aqui, com o
   campo à vista e espaço para uma linha, cabe dizer o que aconteceu e o que
   fazer — que é o único jeito de o dado ser corrigido na origem. */
.fld-aviso{display:block;margin-top:4px;font-size:var(--fs-1,11px);line-height:1.35;
  color:var(--amber-txt,#8A5A10);font-weight:600}

<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a
   célula tem ponto e barra, o Sheets desiste e guarda texto.
   Onde não existe máscara canônica (telefone, inscrição), o valor vai como foi
   digitado: o conserto ali depende do patch do backend. */
function b4uParaPlanilha(valor,coluna){
  const s=b4uTexto(valor).trim();
  const t=b4uIdent(coluna);
  if(!s||!t||!/^\d+$/.test(s))return s;
  const d=b4uDigitos(s);
  if((t.tipo==='doc'||t.tipo==='cnpj')&&d.length===14)return b4uFmtDoc(d);
  if((t.tipo==='doc'||t.tipo==='cpf')&&d.length===11)return b4uFmtDoc(d);
  if(t.tipo==='cep'&&d.length===8)return b4uFmtCep(d);
  return s;
}

<script charset="utf-8">
/* ══════════════════════════════════════════════════════════════════
   TAREFAS DAILY — a tela
   ------------------------------------------------------------------
   Substitui uma planilha de cinco abas, uma por colaborador. A aba por
   pessoa parecia organização e era o contrário: incluir alguém pedia
   uma aba nova, e a pergunta "o que vence esta semana no time" exigia
   abrir as cinco e juntar na cabeça.
   Aqui é uma lista só, e QUEM é um filtro — que abre em "as minhas"
   porque é a pergunta de 90% das aberturas, e muda em um clique porque
   os outros 10% são a daily inteira.
   ══════════════════════════════════════════════════════════════════ */
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';

function chaveAtual(){ const q=new URLSearchParams(location.search).get('chave'); return q?q.trim():''; }
/* Sem chave não há painel da equipe. A porta é o index.html, igual às irmãs. */
if(!chaveAtual()){
  location.replace('index?destino='+encodeURIComponent(
    location.pathname.split('/').pop()+location.search+location.hash));
}

function esc(s){return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return b4uTexto(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function soDigitos(s){return b4uDigitos(s);}

/* ---------- leitura (JSONP) e escrita (POST) ---------- */
const JSONP_TETO=45000, JSONP_PAUSA=4000;
function jsonpRepetivel(url){ return !/[?&]acao=[^&]/.test(url); }
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);
  const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);
  function limpa(){clearTimeout(t);delete window[cb];s.remove();}
  window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};
  s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
function jsonp(url){return jsonpTentativa(url).catch(e=>{ if(!jsonpRepetivel(url)) throw e;
  return new Promise(r=>setTimeout(r,JSONP_PAUSA)).then(()=>jsonpTentativa(url)); });}
async function postAcao(obj,ms){
  const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms||45000);
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ctl.signal});
    const d=await r.json();
    /* Erro que o SERVIDOR mandou: ele processou, decidiu e recusou. É o único
       caso em que dá para garantir que não gravou. */
    if(d&&d.erro){ const err=new Error(d.erro); err.doServidor=true; throw err; }
    return d;
  }catch(e){
    /* ---------- "não salvou" é uma AFIRMAÇÃO, e o front não tem como fazê-la ----------
       O servidor GRAVA e só depois responde. Quando a resposta se perde, a
       gravação já aconteceu — e havia quatro jeitos de isso ocorrer: o prazo
       estourar, o `r.json()` topar com uma página HTML (cota, tela de
       autorização), o 302 do /exec para o googleusercontent falhar, ou a aba ser
       suspensa com a requisição em voo.
       Em todos, a planilha está certa e a tela dizia "Não foi possível salvar".
       A equipe aprendeu a desconfiar do painel por causa disso.
       Agora a exceção carrega `.incerto`: só o erro VINDO DO SERVIDOR é falha de
       verdade; o resto é silêncio, e silêncio não é resposta. */
    if(e&&e.name==='AbortError'){ const x=new Error('A resposta demorou.'); x.incerto=true; throw x; }
    if(e&&e.doServidor) throw e;
    const x=new Error(String((e&&e.message)||e)); x.incerto=true; throw x;
  }
  finally{ clearTimeout(t); }
}

/* ---------- estado ---------- */
let TAREFAS=[], LOGS=[], EU=null, COLABS=[], CLIENTES=[], SITUACOES=[], HOJE='';
const TODOS_ID='TODOS';
let PLANILHA='';
/* ---------- o que está filtrado ----------
   Os QUATRO são LISTAS, porque a régua é de caixas de seleção: dá para ver duas
   pessoas, duas situações, quatro áreas e três clientes ao mesmo tempo.

   `F_SIT` era um valor só ('abertas' | '__todas__' | uma situação) e virou lista
   a pedido do dono. O que se perdeu na conversão não foi a informação e sim o
   NOME: "Em aberto" nunca foi um valor, é o conjunto {A fazer, Em andamento,
   Esperando terceiro} — e é como a equipe fala. Ele voltou como `rotEspecial` no
   b4u-filtro.js, que dá nome a um conjunto notável sem que ele precise ser um
   item da lista.

   O QUE A LISTA VAZIA QUER DIZER MUDA DE FILTRO PARA FILTRO, E É DE PROPÓSITO:

     F_QUEM []   ninguém marcado  -> a lista fica VAZIA, com aviso e um botão que
     F_AREA []   nenhuma marcada  -> remarca tudo. Estes três NASCEM cheios (o de
     F_SIT  []   nenhuma marcada  -> situação nasce no conjunto "Em aberto"), então
                                     chegar a zero é um gesto deliberado: a pessoa
                                     tirou o último item e pediu para não ver nada.
                                     Obedecer calado seria desfazer o que ela fez.

     F_CLI  []   nenhum marcado   -> TODOS os clientes. Este NASCE vazio, porque
                                     são centenas: marcar todos, um a um, para
                                     dizer "não quero filtrar por cliente" é
                                     absurdo. Vazio aqui é o repouso, não um
                                     pedido — ninguém CHEGA nele desmarcando o
                                     último de trezentos.

   A mesma assimetria está escrita no `b4u-filtro.js`, na opção `vazio`. */
let F_QUEM=[], F_SIT=[], F_CLI=[], F_AREA=[], TERMO='';
/* Tarefa sem responsável (ou sem área) não casa com nome nenhum e sumiria da tela
   justamente quando TUDO está marcado — que é o estado que a pessoa lê como "está
   tudo aqui". Então "sem responsável" e "sem área" são itens da lista, marcáveis
   como qualquer outro, e nascem marcados. */
const SEM='__sem__';
let AREAS=[];
let ABERTA=null;                      // tarefa aberta no modal (null = nova)
/* O `?cli=` com que a tela foi aberta. Guardado à parte de `F_CLI` porque as duas
   coisas se separam no primeiro clique: F_CLI é o filtro da RÉGUA, que a pessoa
   mexe à vontade; isto é de onde ela VEIO — o painel do colaborador manda para cá
   com "daily?chave=…&cli=250033&nova=1", e a tarefa nova tem de nascer com aquele
   cliente marcado mesmo que a régua já esteja mostrando outra coisa. */
let CLI_LINK='';
/* ---------- o RECORTE do mini-painel ----------
   `FOCO` é a quinta dimensão do filtro, e a única que não tem caixa na régua:
   um grupo de prazo ('atrasado', 'hoje', …) ou a janela de concluídas. Ele mora
   à parte dos quatro F_* de propósito — os quatro respondem "sobre QUEM/O QUÊ",
   e este responde "sobre QUANDO", que é a pergunta que a régua nunca soube fazer.

   Ele é APAGADO quando a situação muda na régua, e só nesse caso. Um recorte de
   prazo pressupõe as em aberto, e a janela de concluídas pressupõe "Feito":
   mexer na situação desfaz a premissa dos dois, e um recorte de pé sobre uma
   premissa desfeita é um filtro invisível — o pior defeito que esta tela pode
   ter. Trocar de pessoa, de área ou de cliente NÃO o apaga: essas três só
   estreitam, e quem clicou em "Atrasado" e depois marcou uma pessoa quer as
   atrasadas dela, não recomeçar. */
let FOCO=null;                        // null | {prazo:'atrasado'} | {feitas:true}
let PERIODO='semana';                 // a janela do bloco "Concluídas"
const ABERTAS=['A fazer','Em andamento','Esperando terceiro'];
const cls=s=>({'Em andamento':'andamento','Esperando terceiro':'esperando','Feito':'feito','Cancelado':'cancelado'}[s]||'afazer');
const ehTodos=v=>String(v==null?'':v).trim().toUpperCase()===TODOS_ID;

/* ---------- cliente digitável ----------
   O texto da caixa é "ID · Nome"; o que vale é o ID. Resolver aceita o ID cru,
   o texto inteiro, ou um pedaço do nome que case com UM cliente só — "ajub"
   resolve, "clinica" não resolve se houver duas, e aí a caixa diz isso em vez de
   escolher uma por conta própria. */
function resolverCliente(txt){
  const t=String(txt||'').trim();
  if(!t) return {id:'',ok:true};
  /* "Todos", "TODOS", e também "TODOS — vale para…" de um link ou colagem
     antiga: a primeira palavra manda. Recusar por causa do que vem depois do
     travessão seria implicância com quem colou. */
  if(ehTodos(t)||ehTodos(t.split(/[\s—-]/)[0])) return {id:TODOS_ID,ok:true};

  /* FORMA CANÔNICA "ID · Nome" — é o que a lista suspensa escreve, então é o
     caminho mais percorrido do campo e merece ser tratado primeiro, não por
     acidente. Antes ele só funcionava de carona no `soDigitos()` abaixo, e isso
     tinha dois furos: nome com número no meio ("Clinica 24 Horas") jogava
     dígitos a mais na conta e o ID exato deixava de bater; e a busca por pedaço
     também falhava, porque o "·" existe no texto digitado e NÃO existe em
     `id + nome`. Resultado: escolher da lista podia não achar o cliente que a
     própria lista ofereceu. */
  const antes=t.split('·')[0];
  if(t.indexOf('·')>0){
    const idc=soDigitos(antes);
    if(idc){ const c=CLIENTES.find(x=>String(x.id)===idc); if(c) return {id:c.id,ok:true}; }
  }

  const dig=soDigitos(t);
  if(dig){ const porId=CLIENTES.find(c=>String(c.id)===dig); if(porId) return {id:porId.id,ok:true}; }
  /* O "·" sai da comparação por pedaço pelo mesmo motivo: quem colou "250033 ·
     Nome" está descrevendo um cliente, não procurando um caractere que não
     existe no cadastro. Espaços repetidos colapsam nos dois lados. */
  const esp=s=>normTxt(String(s).replace(/·/g,' ')).replace(/\s+/g,' ');
  const n=esp(t);
  const casam=CLIENTES.filter(c=>esp(c.id+' '+c.nome).includes(n));
  if(casam.length===1) return {id:casam[0].id,ok:true};
  /* `casam` volta junto para quem for MOSTRAR a ambiguidade. Dizer "89 clientes
     casam com isso" e parar por aí não ajuda ninguém a escolher: a pessoa fica
     sabendo que errou e continua sem saber o que escrever. Com a lista em mão,
     o aviso vira sugestão. */
  if(casam.length>1)  return {id:'',ok:false,ambiguo:true,casam:casam,
                              msg:casam.length+' clientes casam com isso — escreva mais um pedaço.'};
  return {id:'',ok:false,msg:'Não achei esse cliente.'};
}
/* Uma tarefa pode valer para VÁRIOS clientes: a caixa aceita "250033; 250035",
   e cada pedaço passa pelo resolvedor de sempre. O separador de escrita é o
   ponto e vírgula (a vírgula é separador de CSV e estraga qualquer exportação),
   mas a leitura aceita os dois — quem digita não tem de decorar isso.

   "Todos" é exclusivo: junto de um cliente específico ele ganha e o resto some,
   porque uma tarefa que já alcança a carteira inteira não fica mais específica
   por citar alguém. O aviso abaixo do campo diz isso quando acontece. */
function resolverClientes(txt){
  /* SEPARADOR DE VÁRIOS CLIENTES É O PONTO E VÍRGULA, E SÓ ELE.
     Vírgula e barra estavam nesta lista e foram tiradas. O motivo é um bug real:
     razão social brasileira termina em vírgula o tempo todo — "…Clinica de
     Urologia, ME", "…Centro Diagnostico da Mulher, ME" — e o texto do campo é
     "ID · Razão Social". Partindo na vírgula, o primeiro pedaço resolvia certo
     pelo ID e o SEGUNDO virava "ME", que casa com 89 dos clientes. Resultado:
     escolher um cliente na lista suspensa, sem digitar nada, dava
     "89 clientes casam com isso — escreva mais um pedaço". A barra tem o mesmo
     problema em "S/A" e "COM/IND".
     O ponto e vírgula é o que o campo promete ("vários com ;"), o que o texto de
     ajuda manda usar e o que `idsTexto()` grava na planilha (`join('; ')`).

     Vírgula e barra continuam funcionando como separador — mas só quando o
     resultado PROVA que era separador: se cada sub-pedaço vira um cliente, era
     lista ("250033, 250035"); se não, era nome, e fica inteiro. Assim quem
     digita com vírgula continua sendo atendido sem que a razão social apanhe. */
  const bruto=String(txt||'').split(';').map(x=>x.trim()).filter(Boolean);
  if(!bruto.length) return {ids:[],ok:true,todos:false};
  const ids=[],ruins=[];
  let ambiguo=null, todos=false;
  const juntar=r=>{ if(ehTodos(r.id)){ todos=true; return; }
                    if(r.id&&ids.indexOf(r.id)<0) ids.push(r.id); };
  for(const p of bruto){
    const r=resolverCliente(p);
    if(r.ok){ juntar(r); if(todos) return {ids:[TODOS_ID],ok:true,todos:true,sobrou:bruto.length>1}; continue; }

    /* Não resolveu inteiro e tem vírgula ou barra: talvez fosse lista mesmo. */
    if(/[,\/]/.test(p)){
      const sub=p.split(/[,\/]+/).map(x=>x.trim()).filter(Boolean);
      const rs=sub.map(resolverCliente);
      if(sub.length>1 && rs.every(x=>x.ok&&x.id)){
        rs.forEach(juntar);
        if(todos) return {ids:[TODOS_ID],ok:true,todos:true,sobrou:true};
        continue;
      }
    }
    ruins.push(r.msg||('"'+p+'" não achei.')); if(r.ambiguo&&!ambiguo) ambiguo=r;
  }
  if(ruins.length) return {ids:ids,ok:false,msg:ruins[0],ambiguo:ambiguo};
  return {ids:ids,ok:true,todos:false};
}
const idsTexto=ids=>(ids||[]).join('; ');

/* ---------- o que cada caixa de seleção oferece ----------
   O `v` é o que fica guardado no F_*; o `r` é a linha do painel; o `c` é o rótulo
   curto do botão fechado, que precisa caber ao lado de um "+2".

   Aqui morava o `resolverQuem()`: um resolvedor que lia "Gian; Kariane" e podia
   responder "3 pessoas casam com isso". Ele existia porque o filtro era um campo
   de digitar. Com checkbox não há o que resolver — a pessoa aponta o nome —, e o
   resolvedor foi embora inteiro.

   O de CLIENTE ficou, e agora só serve ao caminho SEM o b4u-filtro.js: a caixa
   digitável da régua (`filtroCliTexto`) e a da ficha (`validarCliFicha`, no ramo
   de baixo) continuam existindo para quando o módulo não chega, e as duas leem
   "250033; 250035" pelo `resolverClientes()`. Ele NÃO foi embora junto do
   `resolverQuem()` por isso — e porque foi consertado duas vezes por bug de
   razão social com vírgula, que é conhecimento que não se joga fora enquanto
   houver um caminho que precise dele. */
/* O botão fechado mostra o PRIMEIRO NOME; o painel e o `title` continuam com o nome
   inteiro. "Gian Carlo Paradisi" no botão comia 179px da régua e empurrava a linha
   toda — e ninguém precisa do sobrenome para saber de quem é o filtro.
   Dois marcados com o mesmo primeiro nome NÃO são desambiguados: o "+N" já diz que
   há mais de um e o `title` lista os dois. Inicial de sobrenome numa régua é ruído.

   ONDE ESTÁ A REGRA. No b4u-shell.js (`B4UShell.primeiroNome`), junto da lista de
   partículas ("de", "da", "dos"…) e do `B4UShell.iniciais()` que o botão de quem
   está usando aplica no selo da barra. Ela morava em dois lugares — aqui e no
   colaborador.html — e os dois discordavam: lá a partícula era pulada para a
   inicial e NÃO para o primeiro nome. Uma implementação, uma resposta.

   A LISTA ABAIXO É CÓPIA DE RESERVA, no mesmo espírito da URL da API que cada
   página guarda por baixo do config.js: ela só entra em cena se o b4u-shell.js
   não carregar — e aí não há botão nem selo com quem concordar, mas a régua desta
   tela continua precisando de um rótulo curto. Quem manda, quando os dois estão
   de pé, é sempre o shell. Nome de uma palavra devolve essa palavra; nome que só
   tem partícula devolve o que veio, em vez de devolver nada. */
const PARTICULAS=['de','da','do','das','dos','e'];
function primeiroNome(nome){
  const t=String(nome||'').trim();
  if(window.B4UShell && typeof B4UShell.primeiroNome==='function') return B4UShell.primeiroNome(t);
  const partes=t.split(/\s+/).filter(p=>p&&PARTICULAS.indexOf(normTxt(p))<0);
  return partes[0]||t;
}
function itensQuem(){
  const out=[];
  /* Quem está usando a tela vem da rota, não da aba Colaboradores. Nos casos em
     que as duas listas não batem (nome grafado diferente, cadastro novo), o item
     de EU entra assim mesmo — senão o padrão da tela apontaria para uma caixa que
     não existe e a régua abriria dizendo "Ninguém". */
  const eu=(EU&&EU.nome)||'';
  if(eu && !COLABS.some(c=>normTxt(c.nome)===normTxt(eu)))
    out.push({v:eu,r:eu+' (você)',c:primeiroNome(eu)});
  COLABS.forEach(c=>out.push({v:c.nome,r:c.nome+(souEu(c.nome)?' (você)':''),c:primeiroNome(c.nome)}));
  out.push({v:SEM,r:'— sem responsável —',c:'sem responsável'});
  return out;
}
function itensArea(){
  return AREAS.map(a=>({v:a,r:a})).concat([{v:SEM,r:'— sem área —',c:'sem área'}]);
}
/* "— sem situação —" existe pelo mesmo motivo que "sem responsável" e "sem área":
   linha da planilha criada fora do painel pode ter a coluna Situação em branco, e
   ela sumiria da tela justamente quando TUDO está marcado — o estado que a pessoa
   lê como "está tudo aqui". Ele NÃO entra no conjunto "Em aberto": tarefa sem
   situação não é tarefa em andamento, é tarefa com cadastro pela metade, e é
   assim que a régua se comportava antes (o antigo 'abertas' também a escondia). */
function itensSit(){
  return SITUACOES.map(s=>({v:s,r:s})).concat([{v:SEM,r:'— sem situação —',c:'sem situação'}]);
}
/* O conjunto "Em aberto", reduzido ao que a planilha REALMENTE tem. `ABERTAS` é
   uma lista escrita à mão nesta página e `SITUACOES` vem do servidor: as duas
   podem discordar (situação renomeada, situação nova). Comparar o rótulo contra a
   lista escrita à mão faria "Em aberto" nunca aparecer no dia em que alguém
   trocasse "A fazer" por "A Fazer" na planilha. */
function sitAbertas(){ return ABERTAS.filter(s=>SITUACOES.indexOf(s)>=0); }
/* O estado com que a régua abre. Quando a interseção é vazia — planilha com outro
   vocabulário inteiro —, o padrão honesto é TUDO marcado: abrir a tela sem nada
   marcado seria acusar a pessoa de um filtro que ela não pôs. */
function sitPadrao(){ const a=sitAbertas(); return a.length?a:todosOsValores(itensSit()); }

/* A lista de clientes das DUAS caixas — a da régua e a da ficha. É a mesma
   pergunta ("quais clientes?") e por isso a mesma lista; o que muda é o que a
   seleção significa depois, e isso está em quem chama. */
function itensCliCom(marcados){
  /* "Todos" primeiro: na régua é a tarefa que vale para a carteira inteira, e
     marcá-la sozinha é a única forma de pedir SÓ essas; na ficha é o escopo da
     tarefa que está sendo escrita. Nos dois casos é o item que se escolhe sem
     pensar, e por isso é o primeiro. */
  const out=[{v:TODOS_ID,r:'Todos — vale para a carteira inteira',c:'Carteira inteira'}];
  CLIENTES.forEach(c=>out.push({v:String(c.id),r:c.id+' · '+c.nome,c:c.id+' · '+c.nome}));
  /* Id que veio por link (?cli=) ou que está gravado numa tarefa antiga e não
     está mais na carteira entra na lista assim mesmo. Sem isto ele continuaria
     valendo sem aparecer em lugar nenhum — filtro ativo e invisível, ou pior, um
     cliente que some da ficha ao abrir e volta apagado ao salvar. */
  (marcados||[]).forEach(v=>{ if(!ehTodos(v)&&!out.some(i=>String(i.v)===String(v)))
    out.push({v:String(v),r:v+' · (fora da carteira)',c:String(v)}); });
  return out;
}
function itensCli(){ return itensCliCom(F_CLI); }
const todosOsValores=itens=>itens.map(i=>String(i.v));
const marcadoTudo=(lista,itens)=>itens.length>0&&itens.every(i=>lista.indexOf(String(i.v))>=0);

function rotuloClientes(cru){
  const ids=String(cru||'').split(/[;,\/]+/).map(x=>x.trim()).filter(Boolean);
  if(!ids.length) return '';
  if(ids.length===1) return rotuloCliente(ids[0]);
  return ids.join('; ');
}
function rotuloCliente(id){
  if(ehTodos(id)) return 'Todos';
  const c=CLIENTES.find(x=>String(x.id)===String(id));
  return c?(c.id+' · '+c.nome):(id||'');
}
/* Uma <datalist> só, no `layout()`, e SÓ para o caminho sem o b4u-filtro.js —
   é a caixa digitável da régua e a da ficha que a usam. Com o módulo no ar
   ninguém digita cliente em lugar nenhum, e ela fica sem consumidor; continua
   sendo escrita porque o caminho sem módulo tem de achá-la já pronta, e porque
   custa uma lista de <option> que o navegador só monta se alguém pedir.
   A ficha chegou a montar uma SEGUNDA com o mesmo id, o que só servia para o
   navegador ter de escolher uma; hoje há uma só.
   TODOS em primeiro, que é a praxe da casa e o caso que se escolhe sem pensar. */
/* A opção é só "Todos". O rótulo explicativo virou o texto de ajuda embaixo do
   campo: quando ele vinha DENTRO do <option>, escolher a opção escrevia a frase
   inteira na caixa, e o resolvedor — que compara o texto todo — não reconhecia
   mais "TODOS" e acusava "não achei esse cliente". A explicação foi para onde
   ela cabe, e a caixa voltou a conter só o que é dado. */
function datalistClientes(){
  return `<datalist id="dl-cli"><option value="Todos"></option>`+
    CLIENTES.map(c=>`<option value="${esc(c.id+' · '+c.nome)}"></option>`).join('')+`</datalist>`;
}

/* ---------- datas ---------- */
/* Comparação por STRING aaaa-mm-dd, nunca por objeto Date: Date interpreta fuso e
   uma tarefa que vence hoje em São Paulo já apareceu como atrasada às 21h. */
function fmtData(v){ const s=b4uTexto(v).trim(); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?(m[3]+'/'+m[2]+'/'+m[1]):s; }
function diasAte(prazo){
  if(!/^\d{4}-\d{2}-\d{2}/.test(prazo)||!/^\d{4}-\d{2}-\d{2}/.test(HOJE)) return null;
  const a=new Date(prazo.slice(0,10)+'T12:00:00'), b=new Date(HOJE.slice(0,10)+'T12:00:00');
  return Math.round((a-b)/864e5);
}
function nomeCliente(id){ const c=CLIENTES.find(x=>String(x.id)===String(id)); return c?c.nome:''; }

/* ---------- quem sou eu ----------
   Casa pelo NOME que veio da aba Colaboradores, que é o mesmo texto gravado na
   coluna Responsável. E-mail seria mais seguro, mas a planilha guarda o nome — e
   inventar uma segunda chave aqui criaria duas verdades sobre a mesma pessoa. */
function souEu(nome){ return !!(EU && nome && normTxt(nome)===normTxt(EU.nome)); }
/* O nome de quem está usando a tela vem com "(você)" atrás, em toda parte: numa
   lista com cinco nomes parecidos, achar o próprio é a primeira coisa que se faz
   e não pode custar leitura. */
function comVoce(nome){
  if(!nome) return '';
  return '<span class="nm">'+esc(nome)+'</span>'+(souEu(nome)?'<span class="vc">(você)</span>':'');
}

/* ---------- filtro ----------
   `filtrar()` é o `visiveis()` de sempre com duas torneiras. O mini-painel precisa
   de contas que a LISTA não faz: "quantas em aberto" tem de responder a mesma
   coisa enquanto a pessoa está lendo as concluídas, e "quantas por área" tem de
   mostrar as nove áreas mesmo com uma só marcada — senão o painel some justamente
   quando serve para voltar.

   Por isso as opções, e por isso são só estas duas: SITUAÇÃO e ÁREA. Quem, cliente
   e busca continuam valendo em toda conta, porque é isso que faz o painel falar do
   que está na tela e não de uma daily paralela.

     visiveis()                       a lista: tudo, mais o FOCO
     filtrar({semSituacao:true})      base do painel: prazo e concluídas
     filtrar({semSituacao,semArea})   base do quadro por área */
function visiveis(){ return filtrar({foco:true}); }
function filtrar(op){
  op=op||{};
  const termo=normTxt(TERMO), dig=soDigitos(TERMO);
  /* Normalizado UMA vez, fora do laço. Com trezentas tarefas e trinta nomes
     marcados, `normTxt` por linha era o custo de digitar na busca. */
  const quem=F_QUEM.map(normTxt), area=F_AREA.map(normTxt);
  const semQuem=F_QUEM.indexOf(SEM)>=0, semArea=F_AREA.indexOf(SEM)>=0;
  /* Situação NÃO passa por `normTxt`: aqui os valores marcados vieram da própria
     lista `SITUACOES`, que é a mesma coluna que a tarefa guarda — comparar texto
     cru é comparar a planilha com ela mesma. Normalizar faria "Feito" casar com
     "feito", que é uma situação diferente se alguém um dia criar as duas. */
  const sit=F_SIT.map(String);
  const semSit=sit.indexOf(SEM)>=0;
  /* Cliente "Todos" não é um id: é o escopo da tarefa. Ele sai da lista de ids
     comparáveis e volta na regra logo abaixo. */
  const cliEsp=F_CLI.map(String).filter(x=>!ehTodos(x));
  return TAREFAS.filter(t=>{
    /* DE QUEM e ÁREA: a lista vazia quer dizer NADA (ver a nota do estado, lá em
       cima) — e isso cai sozinho de `indexOf` em lista vazia, sem ramo especial. */
    const r=normTxt(t.responsavel||'');
    if(!r){ if(!semQuem) return false; }
    else if(quem.indexOf(r)<0) return false;
    if(!op.semArea){
      const a=normTxt(t.area||'');
      if(!a){ if(!semArea) return false; }
      else if(area.indexOf(a)<0) return false;
    }
    /* SITUAÇÃO: mesma regra de De quem e Área — lista vazia quer dizer nada, e
       isso cai sozinho de `indexOf` em lista vazia. */
    if(!op.semSituacao){
      const s=t.situacao==null?'':String(t.situacao);
      if(!s.trim()){ if(!semSit) return false; }
      else if(sit.indexOf(s)<0) return false;
    }
    /* CLIENTE: aqui, e SÓ aqui, a lista vazia quer dizer TODOS — é o filtro que
       nasce sem nada marcado.

       Por cliente, o escopo "Todos" entra junto: é tarefa que vale para a carteira
       inteira, e escondê-la faria parecer que não há nada a fazer ali. Este ramo
       já foi um bug — o filtro comparava o TEXTO da caixa ("250033 · Nome do
       cliente") com `t.cliente_id`, que é só o número, e nunca casava: sobrava
       apenas o ramo do "Todos" e a tela respondia que aquele cliente só tinha
       tarefas gerais. Com checkbox o que está guardado já é o id, e a comparação
       é direta — mas a regra do escopo continua valendo e continua aqui.

       Vários clientes no filtro: basta a tarefa alcançar UM deles. É "ou", não
       "e" — pedir a tarefa que serve aos três ao mesmo tempo não é a pergunta que
       alguém faz na daily.

       Marcar só "Todos" pede exatamente as da carteira inteira: `cliEsp` fica
       vazio e sobra a exigência de `temTodos`. */
    if(F_CLI.length){
      const lista=(t.clientes&&t.clientes.length)
        ? t.clientes.map(c=>String(c.id))
        : String(t.cliente_id||'').split(/[;,\/]+/).map(x=>x.trim()).filter(Boolean);
      const temTodos=lista.some(ehTodos);
      if(!(temTodos || cliEsp.some(x=>lista.indexOf(x)>=0))) return false;
    }
    if(termo){
      const alvo=normTxt([t.assunto,t.detalhe,t.cliente,t.responsavel,t.id].join(' '));
      if(!alvo.includes(termo) && !(dig && soDigitos(t.cliente_id+' '+t.id).includes(dig))) return false;
    }
    /* O RECORTE do painel, por último: ele é o mais estreito de todos e só faz
       sentido depois que os quatro de sempre já disseram o que sobra. */
    if(op.foco && FOCO){
      if(FOCO.prazo){ const g=GRUPOS.find(x=>x.k===FOCO.prazo); if(!g||!g.fn(t)) return false; }
      if(FOCO.feitas && !feitaNaJanela(t)) return false;
    }
    return true;
  });
}

/* ---------- grupos ----------
   Por DECISÃO, não por cliente nem por ordem de digitação: a lista responde
   "o que eu faço agora?" e essa resposta é sempre uma data. */
/* Encerrada NÃO entra na régua de prazo. Uma tarefa feita ontem com prazo de
   anteontem apareceria em "Atrasado", em vermelho, cobrando o que já aconteceu —
   e a lista passaria a mentir justamente para quem entregou no fim. Prazo só
   pesa enquanto há o que fazer. */
const ENCERRADA=t=>ABERTAS.indexOf(t.situacao)<0;
const GRUPOS=[
  {k:'atrasado', rot:'Atrasado',      fn:t=>{if(ENCERRADA(t))return false;const d=diasAte(t.prazo); return d!==null&&d<0;}},
  {k:'hoje',     rot:'Hoje',          fn:t=>!ENCERRADA(t)&&diasAte(t.prazo)===0},
  {k:'semana',   rot:'Esta semana',   fn:t=>{if(ENCERRADA(t))return false;const d=diasAte(t.prazo); return d!==null&&d>0&&d<=7;}},
  {k:'depois',   rot:'Depois',        fn:t=>{if(ENCERRADA(t))return false;const d=diasAte(t.prazo); return d!==null&&d>7;}},
  {k:'semprazo', rot:'Sem prazo',     fn:t=>!ENCERRADA(t)&&diasAte(t.prazo)===null},
  /* Por último, e só quando o filtro de situação pede: quem abre a tela quer ver
     o que falta, não o que já saiu. */
  {k:'encerrado',rot:'Encerradas',    fn:ENCERRADA}
];
function agrupar(lista){
  const out=GRUPOS.map(g=>({g:g,itens:[]}));
  lista.forEach(t=>{ const i=GRUPOS.findIndex(g=>g.fn(t)); if(i>=0) out[i].itens.push(t); });
  /* Dentro do grupo: prazo, depois situação, depois assunto — estável e sem
     surpresa quando duas tarefas empatam. */
  out.forEach(o=>o.itens.sort((a,b)=>
    o.g.k==='encerrado'
      ? (String(b.concluido_em||'').localeCompare(String(a.concluido_em||'')) ||
         normTxt(a.assunto).localeCompare(normTxt(b.assunto)))
      : ((a.prazo||'9999').localeCompare(b.prazo||'9999') ||
         ABERTAS.indexOf(a.situacao)-ABERTAS.indexOf(b.situacao) ||
         normTxt(a.assunto).localeCompare(normTxt(b.assunto)))));
  return out.filter(o=>o.itens.length);
}

/* ══════════════════════════════════════════════════════════════════
   MINI-PAINEL
   ------------------------------------------------------------------
   Responde três perguntas em uma faixa, e cada resposta é um botão:

     1. o que está EM ABERTO, repartido por prazo   -> filtra por prazo
     2. o que foi CONCLUÍDO no período              -> lista as concluídas
     3. o aberto POR ÁREA                           -> filtra por área

   TODA CONTA RESPEITA A RÉGUA (de quem, cliente, busca). Abrindo em "minhas
   tarefas", o painel é o meu; clicando em "todo o time", vira o do time. A
   alternativa — o painel sempre falar do time inteiro — foi descartada porque
   faria o número do painel discordar da contagem da lista quase sempre, e um
   painel que a lista não confirma vira um segundo sistema para conferir.

   AS DUAS EXCEÇÕES, e por que existem:

     SITUAÇÃO não entra em conta nenhuma. Se entrasse, clicar em "Concluídas"
     zeraria os cinco números de "Em aberto" — e o painel se apagaria no exato
     clique em que ele precisa continuar de pé para trazer a pessoa de volta.
     "Em aberto" quer dizer em aberto, sempre, e não "em aberto dentro do que a
     situação deixou passar".

     ÁREA não entra no quadro por área, pelo mesmo motivo: com uma área marcada,
     o quadro mostraria uma barra só e deixaria de ser o lugar de onde se troca
     de área. Ele mostra as nove e marca a que está valendo.
   ══════════════════════════════════════════════════════════════════ */
/* Dia corrido a partir de uma data ISO. Mesmo 'T12:00:00' do `maisDiasUteis`,
   pela mesma razão: `new Date('2026-08-10')` é meia-noite UTC, que em Brasília é
   o dia 9 — a data volta um dia calada. */
function maisDias(iso,n){
  const base=/^\d{4}-\d{2}-\d{2}/.test(String(iso||''))?String(iso).slice(0,10):null;
  const d=base?new Date(base+'T12:00:00'):new Date();
  if(isNaN(d.getTime())) return '';
  d.setHours(12,0,0,0); d.setDate(d.getDate()+n);
  const p=x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
/* HOJE vem do SERVIDOR — a mesma escolha do prazo padrão. Celular com data
   errada daria uma "semana" diferente para uma pessoa só, e ninguém descobriria
   olhando a tela. O relógio local é só o último recurso. */
function hojeISO(){ const h=String(HOJE||'').slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(h)?h:maisDias(null,0); }
/* Quatro janelas fixas, e não um par de campos de data. Estas quatro são as
   perguntas que se faz de verdade — "o que saiu nesta daily", "o que saiu na
   passada", "como está o mês", "e nos últimos 30 dias". Um seletor de datas
   livre atende um caso raro cobrando dois cliques e um teclado de todo mundo. */
const PERIODOS=[
  {v:'semana',  r:'esta semana'},
  {v:'passada', r:'semana passada'},
  {v:'mes',     r:'este mês'},
  {v:'dias30',  r:'últimos 30 dias'}
];
/* A semana começa na SEGUNDA. Semana de trabalho, não semana de calendário: numa
   segunda-feira de manhã "esta semana" tem de estar quase vazia, que é o ponto de
   partida da daily — e não vir cheia com o que se entregou na sexta anterior. */
function janela(){
  const h=hojeISO();
  const dow=new Date(h+'T12:00:00').getDay();          // 0 domingo … 6 sábado
  const segunda=maisDias(h,-((dow+6)%7));
  if(PERIODO==='semana')  return {de:segunda,           ate:maisDias(segunda,6)};
  if(PERIODO==='passada'){ const s=maisDias(segunda,-7); return {de:s, ate:maisDias(s,6)}; }
  if(PERIODO==='mes'){
    const um=h.slice(0,8)+'01';
    /* +32 dias cai sempre no mês seguinte (fevereiro de 28 inclusive); o dia 1
       dele, menos um dia, é o último deste. Sem tabela de dias por mês. */
    const fim=maisDias(maisDias(um,32).slice(0,8)+'01',-1);
    return {de:um, ate:fim};
  }
  return {de:maisDias(h,-29), ate:h};
}
/* CONCLUÍDA é "Feito", e só. Cancelado sai do aberto mas não é entrega: contá-lo
   engordaria o número da semana com o que se decidiu NÃO fazer — e esse número
   existe justamente para dizer o que saiu. Cancelado continua alcançável pela
   caixa de Situação, que é onde ele é a pergunta. */
function feitaNaJanela(t){
  if(String(t.situacao||'')!=='Feito') return false;
  const c=String(t.concluido_em||'').slice(0,10);
  if(!c) return false;                    // sem data não dá para dizer em que semana saiu
  const p=janela();
  return c>=p.de && c<=p.ate;
}
/* A cor de cada faixa de prazo. Vermelho -> âmbar -> teal -> teal claro é a
   urgência descendo; "sem prazo" é AREIA, a mesma cor de "A fazer" na faixa
   lateral da linha, porque é o mesmo estado: parado, sem alarme. Deixá-la no
   fim do degradê de teal diria que tarefa sem prazo é a menos urgente de todas,
   quando ela é a que ninguém decidiu ainda. */
const CORPRAZO={atrasado:'var(--vermelho)', hoje:'var(--amber)',
                semana:'var(--brand-teal)', depois:'#9FD3CD', semprazo:'#C8B18C'};
const ROTPRAZO={atrasado:'atrasadas', hoje:'para hoje', semana:'esta semana',
                depois:'depois', semprazo:'sem prazo'};
const ORDEMPRAZO=['atrasado','hoje','semana','depois','semprazo'];
function contagens(){
  const base=filtrar({semSituacao:true});
  const prazo={}; ORDEMPRAZO.forEach(k=>prazo[k]=0);
  let aberto=0;
  base.forEach(t=>{
    if(ENCERRADA(t)) return;
    const g=GRUPOS.find(x=>x.k!=='encerrado'&&x.fn(t));
    if(g){ prazo[g.k]++; aberto++; }
  });
  const feitas=base.filter(feitaNaJanela).length;
  /* O quadro por área ignora o filtro de área — ver a nota lá em cima. */
  const areas={};
  filtrar({semSituacao:true,semArea:true}).forEach(t=>{
    if(ENCERRADA(t)) return;
    const a=String(t.area||'').trim()||SEM;
    areas[a]=(areas[a]||0)+1;
  });
  /* Ordem: a lista canônica de áreas primeiro (é a ordem que a equipe conhece,
     das caixas e da ficha), depois o que a planilha tiver de área fora dela, e
     "sem área" por último — ele é falta de cadastro, não uma área. */
  const chaves=AREAS.filter(a=>areas[a])
    .concat(Object.keys(areas).filter(a=>a!==SEM&&AREAS.indexOf(a)<0).sort())
    .concat(areas[SEM]?[SEM]:[]);
  return {prazo:prazo, aberto:aberto, feitas:feitas,
          areas:chaves.map(a=>({a:a, n:areas[a]})), janela:janela()};
}
const ddmm=iso=>{ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[3]+'/'+m[2]:''; };
function desenharPainel(){
  const box=document.getElementById('painel'); if(!box) return;
  const c=contagens();
  const p=c.janela;
  const maior=c.areas.reduce((m,x)=>Math.max(m,x.n),0)||1;
  const seg=ORDEMPRAZO.filter(k=>c.prazo[k]>0).map(k=>
    `<button class="pn-seg" type="button" style="flex:${c.prazo[k]};--c:${CORPRAZO[k]}"
       data-pn="prazo" data-v="${k}" aria-label="${c.prazo[k]} ${ROTPRAZO[k]}"
       title="${c.prazo[k]} ${ROTPRAZO[k]}"></button>`).join('');
  const selos=ORDEMPRAZO.map(k=>
    `<button class="pn-selo${FOCO&&FOCO.prazo===k?' ativo':''}" type="button"
       style="--c:${CORPRAZO[k]}" data-pn="prazo" data-v="${k}"
       aria-pressed="${FOCO&&FOCO.prazo===k?'true':'false'}"${c.prazo[k]||(FOCO&&FOCO.prazo===k)?'':' disabled'}
       ><i></i><b>${c.prazo[k]}</b> ${esc(ROTPRAZO[k])}</button>`).join('');
  const areas=c.areas.length
    ? c.areas.map(x=>{
        const so=F_AREA.length===1&&String(F_AREA[0])===String(x.a);
        const rot=x.a===SEM?'sem área':x.a;
        return `<button class="pn-area${so?' ativo':''}" type="button"
          style="--p:${Math.round(x.n/maior*100)}%" data-pn="area" data-v="${esc(x.a)}"
          aria-pressed="${so?'true':'false'}" title="${esc(rot)}: ${x.n} em aberto"
          ><span>${esc(rot)}</span><b>${x.n}</b></button>`;
      }).join('')
    : `<span class="pn-vazio">Nada em aberto neste recorte.</span>`;
  box.innerHTML=`
  <div class="pn-bl">
    <div class="pn-cab">Em aberto</div>
    <button class="pn-num" type="button" data-pn="aberto"
      title="Ver tudo o que está em aberto">${c.aberto}<span class="un">${c.aberto===1?'tarefa':'tarefas'}</span></button>
    ${seg?`<div class="pn-barra">${seg}</div>`:''}
    <div class="pn-selos">${selos}</div>
  </div>
  <div class="pn-bl">
    <div class="pn-cab">Concluídas
      <select class="pn-per" id="pn-periodo" aria-label="Período das concluídas">
        ${PERIODOS.map(o=>`<option value="${o.v}"${o.v===PERIODO?' selected':''}>${esc(o.r)}</option>`).join('')}
      </select></div>
    <button class="pn-num verde${FOCO&&FOCO.feitas?' ativo':''}" type="button" data-pn="feitas"
      aria-pressed="${FOCO&&FOCO.feitas?'true':'false'}"
      title="Listar só as concluídas deste período">${c.feitas}<span class="un">${c.feitas===1?'tarefa':'tarefas'}</span></button>
    <div class="pn-sub">${ddmm(p.de)} a ${ddmm(p.ate)}</div>
  </div>
  <div class="pn-bl">
    <div class="pn-cab">Em aberto por área</div>
    <div class="pn-areas">${areas}</div>
  </div>`;
}
/* O clique do painel escreve na RÉGUA — não num estado paralelo. É o que faz o
   painel ensinar a régua em vez de competir com ela: depois de clicar em
   "Atrasadas", a caixa de Situação está em "Em aberto" à vista de todos, e o
   caminho de volta é o mesmo de sempre.
   Todo alvo é ALTERNADOR: clicar de novo no que já está ligado desliga. Sem
   isso, desfazer um recorte exigiria adivinhar qual controle o produziu. */
function acaoPainel(qual,v){
  const emAberto=()=>{ F_SIT=sitPadrao(); if(FILTROS.sit) FILTROS.sit.marcados(F_SIT); };
  if(qual==='aberto'){ emAberto(); FOCO=null; }
  else if(qual==='prazo'){ const igual=!!(FOCO&&FOCO.prazo===v);
                           emAberto(); FOCO=igual?null:{prazo:v}; }
  else if(qual==='feitas'){
    if(FOCO&&FOCO.feitas){ emAberto(); FOCO=null; }
    else { F_SIT=['Feito']; if(FILTROS.sit) FILTROS.sit.marcados(F_SIT); FOCO={feitas:true}; }
  }
  else if(qual==='area'){
    const so=F_AREA.length===1&&String(F_AREA[0])===String(v);
    F_AREA = so ? todosOsValores(itensArea()) : [String(v)];
    if(FILTROS.area) FILTROS.area.marcados(F_AREA);
    /* A barra clicada conta ABERTAS. Se a tela estivesse nas concluídas, obedecer
       ao clique sem trocar a situação mostraria uma lista que não tem relação
       nenhuma com o número que a pessoa apontou. Um recorte de PRAZO, esse fica:
       "atrasadas do Fiscal" é uma pergunta inteira. */
    if(!FOCO||FOCO.feitas){ FOCO=null; emAberto(); }
  }
  desenharLista();
}
/* ---------- desenho ---------- */
function pillSit(s){ return `<span class="pill p-${cls(s)}">${esc(s)}</span>`; }
function linhaHTML(t){
  const fim=ENCERRADA(t);
  const d=fim?null:diasAte(t.prazo);
  const prazoCls=d===null?'':(d<0?'venceu':(d===0?'hoje':''));
  /* Encerrada mostra QUANDO ficou pronta, que é a informação que sobra depois.
     O prazo dela já não cobra nada e ocuparia a linha dizendo o passado errado. */
  const prazoTxt=fim
    ? (t.concluido_em?'concluída '+fmtData(t.concluido_em):(t.situacao==='Cancelado'?'cancelada':'concluída'))
    : (t.prazo?fmtData(t.prazo):'sem prazo');
  const quem=t.responsavel?comVoce(t.responsavel):'<span style="color:var(--muted)">sem responsável</span>';
  /* Coluna 1 é sempre a MESMA informação: o identificador do alvo. ID do cliente,
     "Todos" ou "interno" — nunca o nome, que é longo e desalinha a coluna. */
