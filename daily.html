  /* Com vários clientes, a coluna mostra o primeiro e conta o resto ("+2"): ela
     tem 78px e existe para o olho correr reto por ela. A lista inteira vai no
     title da linha, junto do resto do resumo. */
  const lstCli=(t.clientes&&t.clientes.length)?t.clientes.map(c=>String(c.id))
    :String(t.cliente_id||'').split(/[;,\/]+/).map(x=>x.trim()).filter(Boolean);
  const idAlvo=t.escopo==='Todos'?'Todos'
    :(t.escopo==='Interno'?'interno'
      :(lstCli.length>1?esc(lstCli[0])+'<span class="t-mais">+'+(lstCli.length-1)+'</span>'
                       :esc(t.cliente_id||'—')));
  const nomeCli=t.escopo==='Cliente'
    ? `<span class="t-cli">${esc(t.cliente||nomeCliente(t.cliente_id)||'')}</span>` : '';
  const nLog=LOGS.filter(l=>String(l.daily_id)===String(t.id)&&l.tipo==='nota').length;
  return `<div class="t s-${cls(t.situacao)}${d!==null&&d<0?' venceu':''}"
     role="button" tabindex="0" data-id="${esc(t.id)}"
     title="${esc(resumoHover(t))}">
    <div class="t-id">${idAlvo}</div>
    <div class="t-assunto">${esc(t.assunto||'(sem assunto)')}</div>
    <div class="t-area">${esc(t.area||'')}</div>
    <div class="t-quem">${quem}</div>
    <div class="t-cel">${pillSit(t.situacao)}</div>
    <div class="t-cel"><span class="t-prazo ${prazoCls}">${esc(prazoTxt)}</span></div>
    <div class="t-meta">${nomeCli}${nLog?`<span>· ${nLog} nota${nLog>1?'s':''}</span>`:''}</div>
  </div>`;
}
/* O que o mouse revela: o detalhe e as últimas linhas do histórico. Vai no `title`
   nativo de propósito — um balão nosso teria de resolver posicionamento, borda de
   tela e toque, e a linha inteira já é um botão que abre a ficha com o histórico
   completo. Aqui é espiada, não leitura. */
function resumoHover(t){
  const partes=[];
  /* Com vários clientes a coluna só mostra o primeiro e um "+N". A lista por
     extenso tem de estar em algum lugar alcançável sem abrir a ficha, e este é
     o lugar: o mesmo gesto que já revela o detalhe. */
  const lc=(t.clientes&&t.clientes.length)?t.clientes:[];
  if(lc.length>1) partes.push('Clientes: '+lc.map(c=>c.id+(c.nome?' · '+c.nome:'')).join('\n          '));
  if(t.detalhe) partes.push(t.detalhe);
  const log=LOGS.filter(l=>String(l.daily_id)===String(t.id))
    .slice().sort((a,b)=>String(b.quando).localeCompare(String(a.quando))).slice(0,4);
  if(log.length){
    partes.push('— histórico —');
    log.forEach(l=>partes.push((l.quando||'')+'  '+(l.quem||'equipe')+': '+
      (l.tipo==='nota'?l.texto:(l.tipo+' '+l.texto))));
  }
  return partes.join('\n') || t.assunto || '';
}
function layout(){
  /* Os QUATRO filtros saem daqui vazios e são preenchidos pelo `montarFiltros()`,
     porque quem os desenha depende de o b4u-filtro.js ter carregado ou não.
     Situação era a exceção — um <select> de valor único — e deixou de ser: o dono
     pediu a mesma caixa das outras três, e a razão de ela ser diferente ("a
     pergunta é o que está em aberto, que não se responde marcando duas") não
     sobreviveu ao uso, porque "A fazer + Em andamento, sem os que esperam
     terceiro" é exatamente a pergunta de quem vai sentar e trabalhar. */
  return `
  <div class="topo">
    <input class="busca" id="busca" type="search" autocomplete="off" placeholder="Buscar por assunto, cliente, pessoa…  ( / para focar)" value="${esc(TERMO)}">
    <span id="cx-quem"></span>
    <span id="cx-sit"></span>
    <span id="cx-area"></span>
    <span id="cx-cli"></span>
    <button class="btn btn--primary" id="nova" type="button">+ Nova tarefa</button>
  </div>
  ${datalistClientes()}
  <div class="painel" id="painel"></div>
  <div id="lista"></div>`;
}

/* ---------- a régua de filtros ----------
   Quatro caixas de seleção múltipla (b4u-filtro.js) e, se ele não tiver carregado,
   quatro controles nativos que fazem a mesma pergunta com uma escolha por vez. O
   segundo caminho não é enfeite: é o que mantém a tela usável quando um arquivo
   não chega — e é o mesmo desenho que a régua tinha antes das caixas. */
const FILTROS={quem:null,sit:null,area:null,cli:null};
/* O marcador de posição é SUBSTITUÍDO, não preenchido. A régua é um flex, e um
   <span> em volta vira um item de flex que se dimensiona pelo conteúdo: o filtro
   por dentro dele nunca encolhe, e uma razão social inteira no rótulo botava 548px
   de botão numa tela de 390 — a página inteira ganhava rolagem lateral por causa de
   um nome de cliente (o mesmo estrago que o `max-width` do <select> já evitava). */
function por(cx,no){ cx.replaceWith(no); return no; }
function porHTML(cx,html){ const t=document.createElement('div'); t.innerHTML=html;
  return por(cx,t.firstElementChild); }
function montarFiltros(){
  const cxQ=document.getElementById('cx-quem'),
        cxS=document.getElementById('cx-sit'),
        cxA=document.getElementById('cx-area'),
        cxC=document.getElementById('cx-cli');
  if(!cxQ||!cxS||!cxA||!cxC) return;
  /* Os quatro são CONSTRUÍDOS antes de qualquer um entrar na página. Se o módulo
     estiver lá mas quebrar no meio, o `catch` cai nos controles nativos com os
     marcadores de posição ainda intactos — construir e plantar de um em um
     deixaria a régua pela metade, meio caixa e meio select. */
  if(window.B4UFiltro) try{
    const fq=B4UFiltro.criar({
      id:'f-quem', rot:'De quem', itens:itensQuem(), marcados:F_QUEM,
      /* Nasce cheio; zero marcado quer dizer "não me mostre nada". */
      vazio:'nada', rotTodos:'Todo o time', rotNada:'Ninguém', rotTodas:'Todos',
      /* Só este ganha o verde cheio: abrir para o time inteiro muda o significado
         da tela de "o que eu tenho" para "o que existe". */
      todosVerde:true,
      aoMudar:m=>{ F_QUEM=m; desenharLista(); }
    });
    const fs=B4UFiltro.criar({
      id:'f-sit', rot:'Situação', itens:itensSit(), marcados:F_SIT,
      vazio:'nada', rotTodos:'Todas as situações', rotNada:'Nenhuma situação', rotTodas:'Todas',
      /* O NOME do conjunto com que a tela abre. Sem ele o botão diria "A fazer +2"
         no estado padrão — trocando a palavra que a equipe usa por uma contagem
         que ninguém pediu. Ver a regra 6 do b4u-filtro.js. */
      rotEspecial:[{quando:sitAbertas(), rot:'Em aberto'}],
      /* Mexeu na situação à mão: o recorte do painel cai. Ver a nota do `FOCO`. */
      aoMudar:m=>{ F_SIT=m; FOCO=null; desenharLista(); }
    });
    const fa=B4UFiltro.criar({
      id:'f-area', rot:'Área', itens:itensArea(), marcados:F_AREA,
      vazio:'nada', rotTodos:'Todas as áreas', rotNada:'Nenhuma área', rotTodas:'Todas',
      aoMudar:m=>{ F_AREA=m; desenharLista(); }
    });
    const fc=B4UFiltro.criar({
      id:'f-cli', rot:'Cliente', itens:itensCli(), marcados:F_CLI,
      /* Nasce vazio, e vazio aqui quer dizer TODOS — são centenas de clientes. */
      vazio:'todos', rotTodos:'Todos os clientes', rotNada:'Nenhum cliente',
      aoMudar:m=>{ F_CLI=m; desenharLista(); }
    });
    FILTROS.quem=fq; FILTROS.sit=fs; FILTROS.area=fa; FILTROS.cli=fc;
    por(cxQ,fq.no); por(cxS,fs.no); por(cxA,fa.no); por(cxC,fc.no);
    return;
  }catch(e){ FILTROS.quem=FILTROS.sit=FILTROS.area=FILTROS.cli=null; }
  /* ── sem o módulo ──────────────────────────────────────────────────────────
     Um <select> por filtro, com a opção "todos" no topo. Escolher um nome guarda
     `[nome]`; escolher "Todo o time" guarda a lista inteira — o mesmo estado que
     as caixas produzem, só que sem combinações. Situação recupera aqui os dois
     atalhos que ela sempre teve ("Em aberto" e "Todas as situações"), que na
     caixa viraram um conjunto com nome e a linha "Todas / Nenhuma". O cliente
     volta a ser a caixa digitável de antes, que já sabe ler "250033; 250035" e
     mora aqui do lado. */
  porHTML(cxQ,`<select class="filtro" id="f-quem" aria-label="De quem">
    <option value="__todos__">Todo o time</option>
    ${itensQuem().map(i=>`<option value="${esc(i.v)}">${esc(i.r)}</option>`).join('')}</select>`);
  porHTML(cxS,`<select class="filtro" id="f-sit" aria-label="Situação">
    <option value="abertas">Em aberto</option>
    <option value="__todas__">Todas as situações</option>
    ${SITUACOES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>`);
  porHTML(cxA,`<select class="filtro" id="f-area" aria-label="Área">
    <option value="__todas__">Todas as áreas</option>
    ${itensArea().map(i=>`<option value="${esc(i.v)}">${esc(i.r)}</option>`).join('')}</select>`);
  porHTML(cxC,`<input class="filtro" id="f-cli" list="dl-cli" autocomplete="off" aria-label="Cliente"
    placeholder="Cliente — vários com ;" value="${F_CLI.length?esc(rotuloClientes(idsTexto(F_CLI))):''}">`);
}
/* Marca tudo de novo — é o botão da tela vazia e o atalho "todo o time". Escrever
   no componente NÃO dispara o `aoMudar` dele (senão desenharia a lista duas
   vezes), então quem chama redesenha. */
function marcarTudo(qual){
  if(qual==='quem'){ F_QUEM=todosOsValores(itensQuem()); if(FILTROS.quem) FILTROS.quem.marcados(F_QUEM); }
  if(qual==='area'){ F_AREA=todosOsValores(itensArea()); if(FILTROS.area) FILTROS.area.marcados(F_AREA); }
  /* Situação volta para "Em aberto", e não para TODAS. O desfazer útil é o estado
     com que a tela abre — quem esvaziou a situação queria ver tarefas, não a lista
     de encerradas de dois anos. Marcar todas está a um clique dali, na própria
     caixa. */
  if(qual==='sit'){ F_SIT=sitPadrao(); if(FILTROS.sit) FILTROS.sit.marcados(F_SIT); FOCO=null; }
  desenharLista();
}
function desenharLista(){
  const box=document.getElementById('lista'); if(!box) return;
  /* O painel é redesenhado JUNTO, e por aqui — não por quem mexe no filtro. Todo
     caminho que muda o que a lista mostra passa neste ponto (régua, busca, link,
     salvar, recarga em segundo plano), e um painel atualizado em outro lugar
     ficaria devendo em algum deles. Um só ponto, uma só verdade. */
  desenharPainel();
  const vis=visiveis();
  const gs=agrupar(vis);
  document.getElementById('cont').textContent=vis.length+(vis.length===1?' tarefa':' tarefas');
  const CAB=`<div class="cabgrade"><span>Cliente</span><span>Assunto</span><span>Área</span>
    <span>Responsável</span><span>Situação</span><span>Prazo</span></div>`;
  box.innerHTML = gs.length ? gs.map(o=>`<div class="grupo ${o.g.k}"><h2>${esc(o.g.rot)}</h2><span class="n">${o.itens.length}</span></div>
                 ${CAB}<div class="lista">${o.itens.map(linhaHTML).join('')}</div>`).join('')
                            : telaVazia();
  /* Os controles refletem o estado: trocar de filtro pelo teclado, pelo botão da
     tela vazia ou por um link não pode deixar a caixinha dizendo uma coisa e a
     lista mostrando outra. Com o b4u-filtro.js no ar quem cuida disso é o próprio
     componente (e o `marcarTudo`); o que sobra aqui é o select de situação e, sem
     o módulo, os controles nativos. */
  if(FILTROS.quem) return;
  const q=document.getElementById('f-quem'), a=document.getElementById('f-area'),
        c=document.getElementById('f-cli'), s=document.getElementById('f-sit');
  if(q){ const tudo=marcadoTudo(F_QUEM,itensQuem());
         q.value=tudo?'__todos__':(F_QUEM.length===1?F_QUEM[0]:'__todos__');
         q.classList.toggle('time',tudo); }
  if(a){ const tudo=marcadoTudo(F_AREA,itensArea());
         a.value=tudo?'__todas__':(F_AREA.length===1?F_AREA[0]:'__todas__'); }
  /* O <select> nativo só sabe dizer três coisas; a lista pode estar num quarto
     estado que ele não representa (duas situações marcadas). Nesse caso ele fica
     em "Todas as situações", que é a opção mais próxima de "não estou estreitando
     por aqui" — e a lista, que é o que a pessoa lê, continua certa. */
  if(s){ const abertas=sitAbertas();
         s.value=marcadoTudo(F_SIT,itensSit())?'__todas__'
           :(abertas.length&&F_SIT.length===abertas.length&&abertas.every(x=>F_SIT.indexOf(x)>=0)?'abertas'
             :(F_SIT.length===1?F_SIT[0]:'__todas__')); }
  if(c) c.classList.toggle('on',F_CLI.length>0);
}
/* A tela vazia diz POR QUE está vazia. Nada marcado em "De quem" ou em "Área" é um
   estado que a pessoa criou de propósito, e ele não pode parecer defeito nem
   parecer "acabaram as tarefas": a frase nomeia o que está desmarcado e o botão ao
   lado desfaz em um clique. Filtro válido sem resultado continua com a frase de
   sempre. */
function telaVazia(){
  if(!F_QUEM.length) return `<div class="vazio">Ninguém marcado.
    <button type="button" class="link-btn" id="marcar-quem">Marcar todo o time</button>.</div>`;
  if(!F_AREA.length) return `<div class="vazio">Nenhuma área marcada.
    <button type="button" class="link-btn" id="marcar-area">Marcar todas as áreas</button>.</div>`;
  if(!F_SIT.length) return `<div class="vazio">Nenhuma situação marcada.
    <button type="button" class="link-btn" id="marcar-sit">Voltar para as em aberto</button>.</div>`;
  /* Recorte do painel sem resultado tem saída própria. Ele é o único filtro sem
     caixa na régua: quem não sabe que clicou nele não tem onde procurar, e a
     frase de sempre ("nada com esses filtros") mandaria a pessoa conferir quatro
     controles que estão todos certos. */
  if(FOCO) return `<div class="vazio">Nada neste recorte.
    <button type="button" class="link-btn" id="limpar-foco">Ver tudo em aberto</button>.</div>`;
  const tudo=marcadoTudo(F_QUEM,itensQuem());
  return `<div class="vazio">Nada por aqui com esses filtros.${tudo?''
    :' Ver <button type="button" class="link-btn" id="ir-time">todo o time</button>.'}</div>`;
}

/* ---------- prazo padrão: 48 horas ÚTEIS ----------
   Tarefa nova nasce com prazo para daqui a dois dias úteis, e o campo continua
   editável — é palpite, não regra.

   A conta parte de `HOJE`, que vem do SERVIDOR, e não do relógio do aparelho:
   celular com data errada ou em outro fuso daria prazo errado para uma pessoa
   só, calado, e ninguém descobriria olhando a tela. Sem `HOJE` (payload ainda
   não chegou), aí sim cai no relógio local — melhor um palpite do que um campo
   vazio.

   O 'T12:00:00' não é enfeite: `new Date('2026-08-10')` é lido como MEIA-NOITE
   UTC, que no horário de Brasília é 21h do dia 9 — a data volta um dia. Ao meio-
   dia local, nenhum fuso do Brasil cruza a virada, e a data sai inteira.

   FERIADO NÃO ENTRA NA CONTA — segunda a sexta, e ponto. Foi decisão do dono,
   tomada depois de eu levantar o assunto: a empresa tem planilha de Feriados nos
   links centrais, mas trazê-la até aqui exigiria mexer no backend, e o ganho não
   paga. Numa semana com feriado o sugerido cai um dia mais cedo do que o ideal —
   e como o campo é editável, quem abre a tarefa corrige em um clique.

   Está escrito aqui para o próximo leitor não "consertar" o que não está
   quebrado: a ausência de feriado é escolha, não esquecimento. */
function maisDiasUteis(iso, n){
  const base = /^\d{4}-\d{2}-\d{2}/.test(String(iso||'')) ? String(iso).slice(0,10) : null;
  const d = base ? new Date(base+'T12:00:00') : new Date();
  if(isNaN(d.getTime())) return '';
  d.setHours(12,0,0,0);
  let faltam = n;
  while(faltam > 0){
    d.setDate(d.getDate()+1);
    const s = d.getDay();
    if(s !== 0 && s !== 6) faltam--;   // 0 domingo, 6 sábado
  }
  const p = x => String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function prazoPadrao(){ return maisDiasUteis(HOJE, 2); }

/* ---------- ficha ---------- */
function campoSelect(id,rot,opts,valor,full){
  return `<div class="fld${full?' full':''}"><label for="${id}">${esc(rot)}</label>
    <select id="${id}">${opts.map(o=>`<option value="${esc(o.v)}"${String(o.v)===String(valor)?' selected':''}>${esc(o.r)}</option>`).join('')}</select></div>`;
}
function fichaHTML(t){
  const nova=!t;
  t=t||{situacao:'A fazer',responsavel:(EU&&EU.nome)||'',
        aberto_em:HOJE,prazo:'',assunto:'',detalhe:'',cliente_id:'',concluido_em:''};
  const optColab=[{v:'',r:'— sem responsável —'}]
    .concat(COLABS.map(c=>({v:c.nome,r:c.nome+(souEu(c.nome)?' (você)':'')})));
  /* Na CRIAÇÃO a lista traz só as situações abertas. Registrar uma tarefa já
     "Feito" descreve uma tarefa que nunca existiu enquanto trabalho: ela não
     entra em atraso de ninguém, não entra em resumo de ninguém, e serve só para
     engordar a lista de encerradas. Quem quer registrar o que já aconteceu tem o
     histórico. Na ficha de uma tarefa que existe, todas voltam — é lá que se
     conclui. */
  const optSit=(nova?SITUACOES.filter(x=>ABERTAS.indexOf(x)>=0):SITUACOES).map(s=>({v:s,r:s}));
  const optArea2=[{v:'',r:'— sem área —'}].concat(AREAS.map(a=>({v:a,r:a})));
  return `
  <div class="gsec">
    <h3><span class="dot"></span>A tarefa</h3>
    <div class="grid">
      <div class="fld full"><label for="f-assunto">Assunto</label>
        <input id="f-assunto" value="${esc(t.assunto)}" placeholder="Em uma linha: o que precisa acontecer"></div>
      <div class="fld full"><label for="f-detalhe">Detalhe</label>
        <textarea id="f-detalhe" placeholder="O plano. O que já aconteceu vai no histórico, abaixo.">${esc(t.detalhe)}</textarea></div>
      ${campoSelect('f-resp','Responsável',optColab,t.responsavel)}
      ${campoSelect('f-sit2','Situação',optSit,t.situacao)}
      ${campoSelect('f-area2','Área',optArea2,t.area||'')}
      <!-- O campo Cliente é montado pelo montarCliFicha(), logo depois de este
           HTML entrar na página: com o b4u-filtro.js ele é a mesma caixa de
           seleção da régua (mais um input type=hidden com o que vai para a
           planilha); sem ele, volta a ser a caixa digitável de sempre. O rótulo
           é um span.lbl e não um label[for], porque no caminho da caixa não há
           campo de digitar para ele apontar.
           (Sem crase nesta nota: ela mora dentro de um template literal, e uma
           crase aqui fecharia a string no meio do HTML.) -->
      <div class="fld"><span class="lbl">Cliente</span>
        <span id="cx-cli2"></span>
        <span class="cli-hint" id="f-cli-hint">Em branco = tarefa interna, sem cliente.</span></div>
      <div class="fld"><label for="f-prazo">Prazo</label>
        <input id="f-prazo" type="date" value="${esc(nova?(t.prazo||prazoPadrao()):t.prazo)}">
        ${nova?'<span class="dica">Sugerido: 48h úteis. Pode trocar.</span>':''}</div>
      <!-- "Aberto em" saiu das opções editáveis a pedido do dono: é automático,
           sempre o dia em que a tarefa foi aberta. O DADO não saiu — numa tarefa
           que já existe ele aparece aqui como texto, porque a informação continua
           servindo, e o salvarFicha() continua mandando o que estava gravado.
           Numa tarefa nova não há o que mostrar: é hoje, e dizer isso seria
           gastar uma linha da ficha para repetir o calendário. -->
      ${nova?'':`<div class="fld"><span class="lbl">Aberto em</span>
        <span class="valor">${esc(fmtData(t.aberto_em)||'—')}</span></div>`}
      ${nova?'':`<div class="fld"><label for="f-concl">Concluído em</label><input id="f-concl" type="date" value="${esc(t.concluido_em)}">
        <span class="dica">Preenche sozinho ao marcar Feito; dá para corrigir.</span></div>`}
    </div>
  </div>
  ${nova?'':`
  <div class="gsec">
    <h3><span class="dot"></span>Histórico</h3>
    <div class="fld full" style="margin-bottom:11px">
      <label for="f-nota">O que aconteceu</label>
      <textarea id="f-nota" placeholder="Uma nota. Ela é ACRESCENTADA ao histórico — nada aqui é sobrescrito."></textarea>
    </div>
    <div class="log" id="log"></div>
  </div>`}`;
}

/* ---------- o campo Cliente da ficha ----------
   Ele deixou de ser texto e virou a mesma caixa de seleção da régua, a pedido do
   dono ("a mesma coisa também em cliente na hora de criar, já que dá pra criar
   mais de um"). Três coisas precisam continuar verdadeiras depois da troca, e as
   três estão implementadas logo abaixo:

   1. `#f-cli2` CONTINUA EXISTINDO E CONTINUA TENDO `.value`. Ele está em
      CAMPOS_FICHA, que é o instantâneo com que a casca do b4u-modal.js decide se
      "Fechar" avisa antes de perder o que foi digitado; e o `salvarFicha()` lê o
      valor dele. Com a caixa no ar ele vira um <input type="hidden"> que a caixa
      escreve, no MESMO formato que a planilha guarda ("250033; 250035", que é o
      que o `idsTexto()` produz). Trocar o tipo do campo não pode mudar o que sai
      dele.

   2. "TODOS" É EXCLUSIVO, E AGORA DÁ PARA IMPEDIR. Ele não é um atalho de
      interface: é um valor de verdade, que quer dizer "vale para a carteira
      inteira, aparece na ficha de cada cliente". Junto de um cliente específico
      ele é contraditório — a tarefa não fica mais específica por citar alguém
      que ela já alcança. No campo de texto isso só podia ser AVISADO depois do
      fato ("o que veio junto foi ignorado"); a caixa consegue impedir antes, e
      por isso o aviso morreu.

   3. VAZIO É RESPOSTA, NÃO FILTRO VAZIO. Tarefa sem cliente é tarefa interna, e é
      o estado normal de uma tarefa nova. Nem `vazio:'todos'` (que diria que a
      tarefa vale para a carteira inteira) nem `vazio:'nada'` (que pintaria de
      âmbar o caminho mais comum da tela) descrevem isso — daí o terceiro modo
      `vazio:'livre'` no b4u-filtro.js. O texto de ajuda embaixo continua onde
      estava. */
let FICHA_CLI=null;      // a instância da caixa, ou null no caminho sem o módulo
let CLI_FICHA=[];        // os ids marcados nela

/* Os clientes de uma tarefa, do jeito que ela vier. `t.clientes` é a forma nova
   (objetos); `t.cliente_id` é a coluna crua, que pode trazer vários separados por
   ";" — e a leitura continua aceitando vírgula e barra porque é assim que os
   outros leitores desta tela (a linha da lista, o filtro) já leem o que está
   gravado. Sem tarefa, o que vale é de onde a pessoa veio: o `?cli=`. */
function idsDaTarefa(t){
  if(!t) return CLI_LINK?[CLI_LINK]:[];
  const l=(t.clientes&&t.clientes.length)?t.clientes.map(c=>String(c.id))
    :String(t.cliente_id||'').split(/[;,\/]+/).map(x=>x.trim()).filter(Boolean);
  return l.some(ehTodos)?[TODOS_ID]:l;
}
/* A exclusão mútua do TODOS, decidida pelo que ACABOU de ser marcado — e não pelo
   que sobrou. Sem olhar o que entrou não dá para saber a intenção: a mesma lista
   {TODOS, 250033} chega tanto de quem marcou TODOS por cima de um cliente quanto
   de quem marcou um cliente por cima do TODOS, e as duas querem coisas opostas.
   Desmarcar não desmarca nada de tabela: `entrou` vazio devolve a lista como veio. */
function exclusivoTodos(novo,velho){
  const entrou=novo.filter(v=>velho.indexOf(v)<0);
  if(entrou.some(ehTodos)) return [TODOS_ID];
  if(entrou.length&&novo.some(ehTodos)) return novo.filter(v=>!ehTodos(v));
  return novo;
}
/* O que vai para a planilha, escrito no campo escondido. Chamado a cada mudança
   da caixa — é ele que faz o instantâneo de "sujo" enxergar o cliente. */
function escreverCliOculto(){
  const el=document.getElementById('f-cli2');
  if(el) el.value=idsTexto(CLI_FICHA);
}
function montarCliFicha(ids){
  const cx=document.getElementById('cx-cli2');
  FICHA_CLI=null; CLI_FICHA=(ids||[]).map(String);
  if(!cx) return;
  if(window.B4UFiltro) try{
    const f=B4UFiltro.criar({
      /* Id próprio: `f-cli` já é o botão da régua e `f-cli2` é o campo escondido
         que este aqui escreve. Dois nós com o mesmo id fariam o
         `getElementById` responder pelo primeiro que o navegador achasse. */
      id:'f-cli-ficha', rot:'Cliente', itens:itensCliCom(CLI_FICHA), marcados:CLI_FICHA,
      vazio:'livre', rotNada:'Sem cliente — tarefa interna',
      aoMudar:m=>{
        CLI_FICHA=exclusivoTodos(m,CLI_FICHA);
        /* Escrever de volta NÃO chama `aoMudar` (é o contrato do componente), e
           é o que desmarca na tela o que a exclusão mútua tirou. */
        if(FICHA_CLI) FICHA_CLI.marcados(CLI_FICHA);
        escreverCliOculto();
        validarCliFicha();
      }
    });
    const cofre=document.createElement('div');
    cofre.className='fld-cli';
    const oculto=document.createElement('input');
    oculto.type='hidden'; oculto.id='f-cli2';
    cofre.appendChild(f.no); cofre.appendChild(oculto);
    FICHA_CLI=f;
    por(cx,cofre);
    escreverCliOculto();
    return;
  }catch(e){ FICHA_CLI=null; }
  /* ── sem o módulo ──────────────────────────────────────────────────────────
     A caixa digitável de sempre, com o `resolverClientes()` por trás. O
     `<datalist id="dl-cli">` que ela usa é o do `layout()`, que já está na página
     desde o boot — a ficha chegou a montar um segundo com o mesmo id, o que só
     servia para o navegador ter de escolher um. */
  porHTML(cx,`<input id="f-cli2" list="dl-cli" autocomplete="off"
    value="${esc(CLI_FICHA.length?rotuloClientes(idsTexto(CLI_FICHA)):'')}"
    placeholder="Digite um pedaço do nome, ou TODOS">`);
}
function logHTML(id){
  const itens=LOGS.filter(l=>String(l.daily_id)===String(id))
    .slice().sort((a,b)=>String(b.quando).localeCompare(String(a.quando)));
  if(!itens.length) return '<div class="log-vazio">Nada registrado ainda.</div>';
  return itens.map(l=>`<div class="log-i tipo-${esc(normTxt(l.tipo))}">
      <span class="log-q">${esc(l.quando)}</span>
      <span class="log-t"><span class="quem">${esc(l.quem||'equipe')}</span> ${
        l.tipo==='nota'?esc(l.texto):('mudou '+esc(l.tipo)+': <b>'+esc(l.texto)+'</b>')}</span>
    </div>`).join('');
}
/* O seletor de situação usa a MESMA cor da pílula da lista. Sem isso a ficha
   dizia em texto o que a lista dizia em cor, e a pessoa tinha de traduzir entre
   as duas telas. */
const COR_SIT={
  'A fazer':          ['#F3E7D5','#6B4E22'],
  'Em andamento':     ['#DBEFEC','#0A5F59'],
  'Esperando terceiro':['#FCEFE0','#8A5A10'],
  'Feito':            ['#E2F2E8','#1F6B45'],
  'Cancelado':        ['#EFEAE3','#6E6256']
};
function pintarSituacao(){
  const el=document.getElementById('f-sit2'); if(!el) return;
  const c=COR_SIT[el.value]||['','',];
  el.style.background=c[0]||''; el.style.color=c[1]||''; el.style.fontWeight=c[0]?'700':'';
}
/* O que está escrito na ficha, num texto só. Esta tela NÃO tem autosave: o que
   foi digitado e não passou pelo botão Salvar só existe aqui. Comparar com o
   instantâneo tirado na abertura é o jeito de saber se fechar agora perde alguma
   coisa — que é a pergunta que a casca faz antes de deixar sair. */
/* `f-aberto` saiu daqui junto com o campo: ele deixou de ser editável, e um id
   que não existe mais só contribuiria com uma string vazia constante para o
   instantâneo. `f-cli2` FICOU — ele continua existindo, agora como campo
   escondido que a caixa de seleção escreve, e é por ele que "escolhi um cliente
   e fechei sem salvar" continua sendo pendência. */
const CAMPOS_FICHA=['f-assunto','f-detalhe','f-resp','f-sit2','f-area2','f-cli2',
                    'f-prazo','f-concl','f-nota'];
function instantaneoFicha(){
  return CAMPOS_FICHA.map(id=>{const el=document.getElementById(id);return el?el.value:'';}).join('\u0001');
}
let FICHA_LIMPA='';
/* A MOLDURA da ficha mora no b4u-modal.js: véu e clique fora, Esc, trava da
   rolagem do fundo, foco preso dentro da caixa e o fechar em dois tempos. Esta
   tela é a que mais ganha com isso: era o único modal editável da equipe SEM
   aviso de "tem coisa por gravar", sem confirmação ao sair da página e sem
   fechar em dois tempos — fechar com o formulário preenchido perdia tudo calado. */
const MODAL = window.B4UModal && window.B4UModal.adotar('modal', {
  ids:{titulo:'m-tit',selo:'m-id',corpo:'m-body',msg:'m-msg',
       aviso:'cadAviso',fechar:'m-fechar',x:'m-x'},
  base:{msg:'msg'},
  largura:760,
  /* Só conta como pendência com a ficha ABERTA: fechada, os campos continuam
     pintados no #m-body e um instantâneo velho acusaria pendência para sempre. */
  sujo:()=>{const m=document.getElementById('modal');
            return !!m&&!m.hidden&&instantaneoFicha()!==FICHA_LIMPA;},
  /* A caixa de cliente é desmontada junto: ela registra o próprio nó na lista de
     painéis abertos do b4u-filtro.js, e uma instância pendurada ali depois de o
     `#m-body` ter sido reescrito é um fantasma que ainda responde a clique fora. */
  aoFechar:()=>{ABERTA=null; if(FICHA_CLI) FICHA_CLI.destruir(); FICHA_CLI=null;}
});
function abrirFicha(t){
  if(!MODAL)return;
  ABERTA=t||null;
  MODAL.titulo(t?(t.assunto||'Tarefa'):'Nova tarefa').selo(t?('#'+t.id):'').msg('','');
  document.getElementById('m-body').innerHTML=fichaHTML(t);
  /* ANTES do instantâneo: o campo escondido de cliente nasce aqui, e um
     instantâneo tirado sem ele acharia que a ficha ficou suja sozinha. */
  montarCliFicha(idsDaTarefa(t));
  if(t){ const l=document.getElementById('log'); if(l) l.innerHTML=logHTML(t.id); }
  document.getElementById('m-salvar').textContent=t?'Salvar':'Criar tarefa';
  FICHA_LIMPA=instantaneoFicha();     // o ponto de partida: daqui para a frente é edição
  MODAL.abrir();
  validarCliFicha();
  pintarSituacao();
  setTimeout(()=>{const f=document.getElementById('f-assunto');if(f)f.focus();},40);
}
function fecharFicha(forcado){ if(MODAL) MODAL.fechar(forcado); }
/* Diz na hora o que aquele texto virou — ou por que não virou nada. Sem isto a
   pessoa só descobre no clique de salvar, com o formulário inteiro preenchido. */
/* `aoVivo` = a pessoa está DIGITANDO agora (evento `input`), e não terminou.
   Enquanto ela digita, texto que ainda não identifica ninguém NÃO é erro: é uma
   frase pela metade. Pintar de vermelho a cada letra transforma o caminho normal
   ("clico em Nova tarefa e começo a escrever o cliente") numa sequência de
   avisos de erro que só somem quando, por sorte, o texto fecha em um cliente só.
   Foi exatamente essa a queixa: "Cliente / 89 clientes casam com isso" aparecia
   no meio da digitação, dizia que estava errado, e não dizia o que escrever.

   Vermelho fica para os dois momentos em que a frase ACABOU: quando o campo
   perde o foco e quando se tenta salvar. Aí, sim, o texto não virou cliente e
   isso precisa doer — a regra de nunca gravar tarefa interna calada continua
   valendo, e é o `salvarFicha()` que a aplica. */
function validarCliFicha(aoVivo){
  const el=document.getElementById('f-cli2'), h=document.getElementById('f-cli-hint');
  if(!el||!h) return {id:'',ok:true};
  /* ── com a caixa de seleção ────────────────────────────────────────────────
     Não há o que validar: o que está marcado veio da lista, então é sempre um
     cliente que existe. Sobra a linha de baixo, que deixou de ser aviso e virou
     confirmação — ela diz por extenso o que a caixa está dizendo abreviado.
     `ok` é sempre true, e é por isso que o `salvarFicha()` não tem mais como
     barrar aqui: a única forma de barrar era texto que não virou cliente, e não
     existe mais texto. */
  if(FICHA_CLI){
    const ids=CLI_FICHA;
    h.className='cli-hint';
    h.textContent = !ids.length ? 'Em branco = tarefa interna, sem cliente.'
      : (ids.some(ehTodos) ? 'Vale para todos os clientes — aparece na ficha de cada um.'
      : (ids.length>1 ? ids.length+' clientes: '+ids.map(rotuloCliente).join('  ·  ')
                      : rotuloCliente(ids[0])));
    return {id:idsTexto(ids),ok:true};
  }
  const r=resolverClientes(el.value);
  if(!el.value.trim()){ h.className='cli-hint'; h.textContent='Em branco = tarefa interna, sem cliente. Vários clientes: separe por ponto e vírgula.'; }
  else if(r.ok&&r.todos){ h.className='cli-hint';
    h.textContent=r.sobrou?'Vale para TODOS os clientes — o que veio junto foi ignorado, porque "Todos" já alcança a carteira inteira.'
                          :'Vale para todos os clientes — aparece na ficha de cada um.'; }
  else if(r.ok&&r.ids.length>1){ h.className='cli-hint';
    h.textContent=r.ids.length+' clientes: '+r.ids.map(rotuloCliente).join('  ·  '); }
  else if(r.ok){ h.className='cli-hint'; h.textContent=r.ids.length?rotuloCliente(r.ids[0]):''; }
  else if(r.ambiguo){
    /* AMBÍGUO: mostra QUEM casa, em vez de só contar. Três exemplos bastam para
       a pessoa perceber o que tem em comum e escrever o pedaço que separa; a
       lista inteira de 89 seria outra parede de texto. */
    const ex=r.ambiguo.casam.slice(0,3).map(c=>c.id+' · '+c.nome).join('   ·   ');
    const n=r.ambiguo.casam.length;
    /* Os exemplos aparecem nos dois casos; o que muda é a COR. Digitando, é
       sugestão. Depois de sair do campo, continua sem identificar cliente e o
       salvar vai barrar — então precisa parecer um problema, mas um problema
       com a saída à vista. */
    h.className=aoVivo?'cli-hint':'cli-hint err';
    h.textContent=n+' clientes casam — '+ex+(n>3?'  e mais '+(n-3)+'. Escreva mais um pedaço.':'');
  }
  else if(aoVivo){ h.className='cli-hint'; h.textContent='Continue escrevendo…'; }
  else { h.className='cli-hint err'; h.textContent=r.msg; }
  /* `id` continua existindo para quem chama esperando um valor só — agora ele é
     a lista já formatada, que é o que a planilha guarda. */
  return {id:idsTexto(r.ids),ok:r.ok,msg:r.msg};
}

async function salvarFicha(){
  const btn=document.getElementById('m-salvar'), msg=document.getElementById('m-msg');
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const cli=validarCliFicha();
  /* ABERTO EM NÃO É MAIS CAMPO — mas continua sendo DADO, e ele não pode se
     perder por ter saído da tela. São dois casos, e os dois têm de ser escritos
     aqui porque o que sumiu foi justamente o <input> que os respondia sozinho:
       tarefa nova      -> hoje, que é o que o campo já trazia por padrão;
       tarefa existente -> o que está gravado nela, devolvido intacto.
     Mandar vazio na edição apagaria a data de abertura de toda tarefa antiga na
     primeira vez que alguém trocasse uma vírgula do assunto. Quando a tarefa
     antiga já vier sem data, vai vazio mesmo — não há o que preservar, e inventar
     "hoje" seria dizer que ela nasceu na hora em que foi editada. */
  const abertoEm=ABERTA ? b4uTexto(ABERTA.aberto_em||'').trim() : (HOJE||'').slice(0,10);
  const dados={ assunto:v('f-assunto'), detalhe:v('f-detalhe'), responsavel:v('f-resp'),
                situacao:v('f-sit2'), area:v('f-area2'), cliente_id:cli.id,
                prazo:v('f-prazo'),
                aberto_em:abertoEm, concluido_em:v('f-concl') };
  if(!dados.assunto){ msg.className='msg err'; msg.textContent='Escreva o assunto.'; return; }
  /* Texto escrito que não virou cliente NÃO vira tarefa interna calada: seria
     perder a intenção de quem digitou e ainda esconder o engano. */
  if(!cli.ok){ msg.className='msg err'; msg.textContent=cli.msg||'Confira o cliente.'; return; }
  btn.disabled=true; msg.className='msg'; msg.textContent='Salvando…';
  try{
    let d;
    if(ABERTA){
      const nota=v('f-nota');
      d=await postAcao(Object.assign({acao:'daily_salvar',id:ABERTA.id,campos:dados},nota?{nota:nota}:{}));
    }else{
      d=await postAcao(Object.assign({acao:'daily_nova'},dados));
    }
    msg.className='msg ok'; msg.textContent='Salvo ✓';
    /* Troca só a linha mexida. Se o servidor não mandou a linha, relê tudo. */
    if(!aplicarUma(d)) await recarregar();
    fecharFicha(true);          // gravou: sair não perde nada, e o aviso não faz sentido
  }catch(e){
    /* A ficha CONTINUA ABERTA — fechar por cima de um salvamento que não foi
       levaria embora a única pista de que deu errado.
       Duas mensagens, porque são duas situações: o servidor recusar (aí sim não
       gravou, e "tente de novo" é o conselho certo) e a resposta se perder (a
       gravação PODE ter acontecido, e mandar de novo criaria tarefa em dobro —
       por isso o conselho vira "recarregue antes"). */
    if(e&&e.incerto){
      msg.className='msg err';
      msg.textContent='Não consegui confirmar se salvou. Recarregue a página antes de mandar de novo — a tarefa pode já estar gravada.';
    }else{
      msg.className='msg err';
      msg.textContent='O servidor recusou: '+String((e&&e.message)||e);
    }
  }finally{ btn.disabled=false; }
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const linha=e.target.closest&&e.target.closest('.t');
  if(linha){ const t=TAREFAS.find(x=>String(x.id)===linha.dataset.id); if(t) abrirFicha(t); return; }
  /* `closest` e não `e.target.dataset`: os alvos do painel têm filhos (o pontinho,
     o número em negrito, o nome da área), e clicar em cima do número devolveria o
     <b>, que não tem data-pn nenhum. */
  const pn=e.target.closest&&e.target.closest('[data-pn]');
  if(pn){ acaoPainel(pn.dataset.pn,pn.dataset.v); return; }
  if(e.target.id==='limpar-foco'){ acaoPainel('aberto'); return; }
  if(e.target.id==='nova'){ abrirFicha(null); return; }
  if(e.target.id==='ir-time'||e.target.id==='marcar-quem'){ marcarTudo('quem'); return; }
  if(e.target.id==='marcar-area'){ marcarTudo('area'); return; }
  if(e.target.id==='marcar-sit'){ marcarTudo('sit'); return; }
  if(e.target.id==='m-salvar'){ salvarFicha(); return; }
  /* Fechar, × e clique no véu não estão aqui: quem cuida deles é a casca do
     b4u-modal.js, que precisa passar pelo aviso de "tem coisa por gravar" antes
     de deixar sair. */
});
/* Esc com a ficha aberta NÃO chega aqui: a casca do b4u-modal.js escuta na
   captura, fecha o modal de cima da pilha e corta a propagação. */
document.addEventListener('keydown',e=>{
  const linha=e.target&&e.target.closest&&e.target.closest('.t');
  if(linha&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); linha.click(); return; }
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))){
    e.preventDefault(); const b=document.getElementById('busca'); if(b)b.focus(); }
});
document.addEventListener('change',e=>{
  /* Os QUATRO abaixo só existem SEM o b4u-filtro.js: com ele, `f-quem`, `f-sit`,
     `f-area` e `f-cli` são botões, e botão não dispara `change` nem `input`. Os
     checkboxes de dentro do painel disparam, sim — mas sem `id`, e por isso não
     caem aqui. */
  /* O período das concluídas. Ele NÃO é um filtro da régua: muda a pergunta do
     bloco, e a lista só o sente quando o recorte de concluídas está ligado — mas
     redesenhar tudo é uma volta pelo `desenharLista()`, e ela é barata. */
  if(e.target.id==='pn-periodo'){
    PERIODO=e.target.value; desenharLista();
    /* O `desenharLista()` reescreve o painel inteiro, e com ele este <select> —
       quem acabou de escolher ficaria com o foco no <body>, e a seta para baixo
       deixaria de mudar o período. Devolvemos o foco ao controle que a pessoa
       ainda está usando. */
    const s=document.getElementById('pn-periodo'); if(s) s.focus();
    return;
  }
  if(e.target.id==='f-sit'){
    const v=e.target.value;
    F_SIT = v==='abertas' ? sitPadrao()
          : (v==='__todas__' ? todosOsValores(itensSit()) : [v]);
    FOCO=null;
    desenharLista();
  }
  if(e.target.id==='f-quem'){
    const v=e.target.value;
    F_QUEM = v==='__todos__' ? todosOsValores(itensQuem()) : [v];
    desenharLista();
  }
  if(e.target.id==='f-area'){
    const v=e.target.value;
    F_AREA = v==='__todas__' ? todosOsValores(itensArea()) : [v];
    desenharLista();
  }
  if(e.target.id==='f-cli'){ filtroCliTexto(e.target); }
  if(e.target.id==='f-cli2'){ validarCliFicha(); }
  /* Marcou Feito: a data de hoje entra no campo AQUI, à vista, e não escondida no
     servidor — quem concluiu ontem corrige antes de salvar, em vez de descobrir
     depois que ficou com a data errada. Saindo de Feito a data cai: a tarefa
     deixou de estar concluída, e uma data de conclusão pendurada mentiria. */
  if(e.target.id==='f-sit2'){
    pintarSituacao();
    const cc=document.getElementById('f-concl'); if(!cc) return;
    if(e.target.value==='Feito'){ if(!cc.value) cc.value=(HOJE||'').slice(0,10); }
    else cc.value='';
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='busca'){ TERMO=e.target.value; desenharLista(); }
  if(e.target.id==='f-cli2'){ validarCliFicha(true); }   // digitando: nada de vermelho
  if(e.target.id==='f-cli'){ filtroCliTexto(e.target); }
});
/* Saiu do campo: a frase acabou. Agora texto que não virou cliente é erro, e
   aparece antes de a pessoa ir preencher o resto da ficha — em vez de só na hora
   de salvar, com o dedo já no botão. `focusout` e não `blur` porque `blur` não
   sobe pela árvore e este ouvinte é delegado no documento. */
document.addEventListener('focusout',e=>{
  if(e.target&&e.target.id==='f-cli2') validarCliFicha(false);
});
/* A caixa digitável de cliente — só no caminho SEM o b4u-filtro.js. Resolve
   enquanto se digita e só filtra quando o texto identifica cliente: filtrar a cada
   letra deixaria a lista piscando vazia no meio de "Aj-u-b". Apagar o campo volta
   para todos. Com ponto e vírgula vale para VÁRIOS: "250033; 250035" traz os dois. */
function filtroCliTexto(el){
  if(!el.value.trim()){ if(F_CLI.length){F_CLI=[];desenharLista();} el.classList.remove('on','ruim'); return; }
  const r=resolverClientes(el.value);
  const novo=r.ok?r.ids:null;
  el.classList.toggle('ruim',!novo);
  el.title=novo?'':(r.msg||'Ainda não identifiquei esse cliente — a lista continua no filtro anterior.');
  if(novo && idsTexto(novo)!==idsTexto(F_CLI)){ F_CLI=novo; desenharLista(); }
}

/* ---------- carga ---------- */
function aplicar(d){
  TAREFAS=d.tarefas||[]; LOGS=d.logs||[]; EU=d.eu||null;
  COLABS=d.colaboradores||[]; CLIENTES=d.clientes||[];
  SITUACOES=d.situacoes||['A fazer','Em andamento','Esperando terceiro','Feito','Cancelado'];
  AREAS=d.areas||['Contábil','Pessoal','Fiscal','Jurídico','Societário','Restituição','Financeiro','Atendimento','Gestão'];
  HOJE=d.hoje||''; PLANILHA=d.planilha_url||'';
  /* O nome de quem está usando vai para o botão da barra. Vem de `d.eu`, o mesmo
     campo que decide o que é "meu" na régua de filtros — então a barra e o filtro
     nunca podem discordar sobre quem é a pessoa. Fica aqui, no `aplicar()`, e não
     na carga: a recarga em segundo plano passa por aqui também. */
  if(window.B4UShell) B4UShell.usuario({nome:(EU&&EU.nome)||''});
}
async function recarregar(){
  const d=await jsonp(API_URL+'?tipo=daily_equipe&chave='+encodeURIComponent(chaveAtual()));
  if(d&&d.erro) throw new Error(d.erro);
  aplicar(d);
  /* Relemos a planilha inteira: colaborador novo, cliente novo ou área nova têm de
     aparecer nas caixas. O que estava marcado continua marcado — o componente
     guarda os valores, não os índices. O que é NOVO não entra marcado sozinho:
     mexer na seleção de quem está com a tela aberta seria mudar o que ela vê sem
     ela ter pedido. Como o rótulo do botão deixa de dizer "todas", a mudança fica
     à vista em vez de acontecer calada. */
  if(FILTROS.quem) FILTROS.quem.itens(itensQuem());
  if(FILTROS.area) FILTROS.area.itens(itensArea());
  if(FILTROS.cli)  FILTROS.cli.itens(itensCli());
  /* Situação releva também o CONJUNTO com nome: se a planilha ganhou (ou perdeu)
     uma situação aberta, "Em aberto" passa a querer dizer outra coisa, e um
     `quando` congelado na criação nomearia o conjunto errado. */
  if(FILTROS.sit){ FILTROS.sit.itens(itensSit());
                   FILTROS.sit.rotEspecial([{quando:sitAbertas(), rot:'Em aberto'}]); }
  desenharLista();
}
/* ---------- aplicar SÓ o que mudou ----------
   Salvar relia a planilha inteira: com a carteira grande isso é uma volta ao
   servidor de vários segundos para trocar uma palavra numa linha. Agora a
   escrita devolve a linha COMO FICOU e o histórico dela, e a tela troca só
   aquilo.
   O que chega é o que está GRAVADO, não o que a tela pediu — o servidor
   normaliza e recusa coisas, e aplicar o próprio pedido deixaria a tela
   discordando da planilha até o próximo F5.
   Sem `tarefa` na resposta (backend antigo), cai na recarga completa: a tela
   fica correta de qualquer jeito, só mais devagar. */
function aplicarUma(d){
  if(!d||!d.tarefa) return false;
  const t=d.tarefa;
  const i=TAREFAS.findIndex(x=>String(x.id)===String(t.id));
  if(i>=0) TAREFAS[i]=t; else TAREFAS.push(t);
  if(d.logs){
    LOGS=LOGS.filter(l=>String(l.daily_id)!==String(t.id)).concat(d.logs);
  }
  desenharLista();
  return true;
}
async function boot(){
  /* O botão de quem está usando nasce ANTES da resposta, com rótulo genérico: ele
     é a única porta para o seletor de aparência, e essa porta não pode depender de
     a API responder. O nome entra por cima em `aplicar()`. Nesta tela o `montar()`
     do menu lateral fica lá embaixo, depois do layout — mas o botão não espera por
     ele: a barra já está no HTML desde o começo. */
  if(window.B4UShell) B4UShell.usuario();
  try{
    const d=await jsonp(API_URL+'?tipo=daily_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro) throw new Error(d.erro);
    aplicar(d);
    /* ---------- o estado com que a tela abre ----------
       DE QUEM abre no NOME de quem está usando — não em "minhas tarefas", que era
       um rótulo a mais para a mesma coisa. Quando a rota não diz quem é (chave de
       serviço, cadastro que não bate com a aba Colaboradores), o padrão honesto é
       TODO MUNDO marcado: lista vazia agora quer dizer "não me mostre nada", e
       abrir a tela nesse estado seria acusar a pessoa de um filtro que ela não
       pôs. ÁREA abre com todas marcadas. CLIENTE abre vazio, que aqui quer dizer
       todos (ver a nota do estado, lá em cima). */
    F_QUEM = (EU&&EU.nome) ? [EU.nome] : todosOsValores(itensQuem());
    F_AREA = todosOsValores(itensArea());
    /* SITUAÇÃO abre no conjunto "Em aberto" — as mesmas três de sempre, agora
       como três caixas marcadas em vez de uma opção chamada "Em aberto". O nome
       continua no botão (ver `rotEspecial`), então o que a pessoa lê ao abrir a
       tela é exatamente o que ela lia antes. */
    F_SIT  = sitPadrao();
    F_CLI  = [];
    /* ?cli=250001 abre já filtrado naquele cliente: é assim que o painel do
       colaborador manda para cá a partir do bloco de pendências da ficha. O mesmo
       id fica guardado no CLI_LINK, porque com "&nova=1" ele também é o cliente
       com que a ficha nova nasce marcada. */
    const p=new URLSearchParams(location.search);
    const cli=(p.get('cli')||'').trim();
    if(cli){ F_CLI=[cli]; CLI_LINK=cli; F_QUEM=todosOsValores(itensQuem()); }
    if(p.get('nova')==='1') setTimeout(()=>abrirFicha(null),60);
    /* ?t=12 abre AQUELA tarefa. É o link que vai nos e-mails: um clique e a
       ficha está aberta, sem procurar na lista. Vem com "todo o time" e "todas
       as situações" porque o link pode apontar para tarefa de outra pessoa ou
       já encerrada — e um link que abre em branco é pior que link nenhum. */
    const alvo=(p.get('t')||'').trim();
    if(alvo){
      const t=TAREFAS.find(x=>String(x.id)===alvo);
      if(t){ F_QUEM=todosOsValores(itensQuem()); F_SIT=todosOsValores(itensSit());
             setTimeout(()=>abrirFicha(t),60); }
    }
    document.getElementById('app').innerHTML=layout();
    montarFiltros();
    desenharLista();
    if(window.B4UShell) B4UShell.montar({
      perfil:'equipe', ativo:'daily',
      link:pag=>pag+'?chave='+encodeURIComponent(chaveAtual())
    });
  }catch(e){
    /* A MENSAGEM DO SERVIDOR APARECE. Nas telas do cliente ela é escondida de
       propósito — é vocabulário nosso e do outro lado só assusta. Aqui não: esta
       é tela de equipe, e todo erro possível desta rota é acionável e escrito
       para ser lido ("Falta a chave 'Planilha Daily' na aba Config…", "Acesso
       restrito à equipe."). Trocar isso por "tente em alguns minutos" manda a
       pessoa esperar por um problema que não passa sozinho — e foi exatamente o
       que aconteceu na primeira vez que esta tela subiu. */
    const txt=String((e&&e.message)||'').trim();
    const generica='Não foi possível carregar as tarefas.';
    document.getElementById('app').innerHTML=
      `<div class="vazio"><b>${esc(txt||generica)}</b>${txt?'':''}
        <div style="margin-top:10px;font-size:var(--fs-2)">
          Se a mensagem fala em <b>chave "Planilha Daily"</b>, o link da planilha ainda não está
          na aba Config da <b>Links App Script</b> — cole lá e rode <code>limparCacheConfig()</code>.<br>
          Se fala em <b>acesso</b>, a chave do dia expirou: volte pelo
          <a href="index">início</a>.
        </div>
      </div>`;
  }finally{
    if(window.B4UEspera) B4UEspera.concluir();
  }
}
boot();
</script>
