};

const DEFINICOES = [
  { chave:'fiscal',      arquivo:'fiscal',       titulo:'Impostos e faturamento',  desc:'Quanto você faturou, quanto vai pagar de imposto e como isso se divide.' },
  { chave:'equiparacao', arquivo:'equiparacao',  titulo:'Equiparação hospitalar',  desc:'Pedidos de restituição, valores atualizados e situação de cada processo.' },
  { chave:'societario',  arquivo:'societario',   titulo:'Societário',  desc:'Contrato social, alterações, alvarás, processos e modelos de documentos da empresa.' },
  { chave:'pessoal',     arquivo:'dptopessoal',  titulo:'Departamento Pessoal',    desc:'Folha, encargos e obrigações trabalhistas.' },
  // A página contábil existe e está pronta. Quem decide se ela aparece é o `disponiveis`
  // que vem do backend (PAINEIS_OCULTOS) — aqui ela fica registrada para não sumir por acidente.
  { chave:'contabil',    arquivo:'contabil',     titulo:'Contábil',                desc:'Balanço, resultado do exercício e a posição contábil da empresa.' },
];

/* ---------- o que o menu lateral precisa saber ----------
 * Quem está do outro lado da tela é a EMPRESA, e o nome dela não vem no `tipo=links`:
 * quem o traz é o payload fiscal (`config.razao_social`), o mesmo que as páginas
 * internas mostram no cabeçalho. A home busca esse payload logo depois de pintar e o
 * guarda no cache compartilhado — então na primeira visita ele ainda não existe.
 * Nesse caso devolvemos `null` e o menu simplesmente não mostra o bloco: melhor um
 * menu sem contexto do que um nome inventado na tela de quem paga a conta. */
function contextoEmpresa(id){
  try{
    const raw = (window.B4U && B4U.cacheLer) ? B4U.cacheLer('fiscal', id) : null;
    const cfg = (raw && raw.config) || {};
    const nome = String(cfg.razao_social||'').trim();
    if(!nome) return null;
    // Mesma regra do cabeçalho do fiscal: CNPJ quando há, o número do cliente quando não.
    return { rot:'Empresa', nome: esc(nome),
             sub: cfg.cnpj ? 'CNPJ '+b4uIdentHTML(cfg.cnpj,'CNPJ') : esc('cliente '+b4uTexto(id)) };
  }catch(e){ return null; }
}

/* O href do WhatsApp já foi montado pelo bloco compartilhado, com o ID no texto.
   Lemos o que está na barra em vez de remontar: número escrito duas vezes vira dois
   números diferentes no dia em que alguém troca um deles. Sem barra, devolve vazio e
   o rodapé do menu não aparece — que é o comportamento previsto pelo módulo. */
function hrefWhatsApp(){
  const a = document.querySelector('.b4u-bar .b4u-btn.wa');
  return a ? esc(a.getAttribute('href')||'') : '';
}

function render(id, codigo, disponiveis, pessoa){
  const destino = pagina => `${pagina}#${id}-${codigo}`;
  const areasP = pessoa && Array.isArray(pessoa.areas) ? pessoa.areas : null;   // login por e-mail
  const visiveis = DEFINICOES.filter(d => disponiveis[d.chave] && (!areasP || areasP.indexOf(d.chave)>=0));
  /* Agenda de pagamentos SEGURADA (04/08/2026): o cliente não vê calendário de
     vencimentos em lugar nenhum por enquanto. A página guias.html continua no
     repositório, inteira e funcionando — o que saiu foram os caminhos até ela.
     Quem manda é o servidor: PAINEIS_OCULTOS.guias barra a rota e a ação, então
     nem digitando o endereço se chega. Para voltar, é lá que se mexe primeiro. */
  const cardGuias = '';
  const totalCards = (cardGuias ? 1 : 0) + visiveis.length;
  // O nome já vai na saudação; aqui fica só o que ela não diz (o papel do acesso).
  const primeiro = String((pessoa && pessoa.nome) || '').trim().split(/\s+/)[0] || '';
  const quem = pessoa
    ? (/principal/i.test(pessoa.papel||'')
        ? `<div class="quem">Você entrou como responsável principal.</div>`
        : (primeiro ? '' : `<div class="quem">Você: <b>${esc(pessoa.email||'')}</b></div>`))
    : '';
  pararEspera();

  /* A ordem desta pilha é a tela: primeiro a RESPOSTA (a frase-resumo e o que exige
     ação), só depois as PORTAS (os cards de área). Quem chega precisa saber se tem
     algo pendente antes de escolher para onde ir — invertido, ele escolhe às cegas.
     Alerta de pendência não recolhe nunca, nem entra em <details>. */
  document.getElementById('miolo').innerHTML = `
    <div class="saudacao">
      <h1>Olá${primeiro?', '+esc(primeiro):''}.</h1>
      <!-- span, não div: um <div> dentro de <p> é fechado pelo parser e o esqueleto
           vira irmão do parágrafo — ficava na tela para sempre. -->
      <p id="hm-resumo"><span class="b4u-skel" style="height:15px;width:92%;margin:0 auto"></span></p>
      ${quem}
    </div>
    <div class="alertas-home" id="alertas-home">${window.B4U&&window.B4U.skeleton?window.B4U.skeleton(1,44):''}</div>
    <div class="grade${totalCards===1?' grade--uma':''}" id="grade"></div>
    <div class="acoes-chamado">
      <button type="button" class="ac-btn ac-primary" id="ac-abrir">Abrir um chamado</button>
      <a class="ac-btn" href="${destino('meustickets')}">Meus chamados</a>
      <button type="button" class="ac-btn" id="ac-contatos">E-mails e contatos</button>
    </div>
    <div class="confiar-row" id="confiar-row"></div>`;

  document.getElementById('grade').innerHTML = (cardGuias + (visiveis.length
    ? visiveis.map(d => `<a class="opcao" href="${destino(d.arquivo)}">
        <div class="icone">${ICONES[d.chave]}</div>
        <h2>${d.titulo}</h2>
        <p>${d.desc}</p>
        <span class="seta">→</span>
      </a>`).join('')
    : '')) || `<p style="color:var(--muted);grid-column:1/-1;text-align:center">Nenhum painel disponível para este cliente ainda.</p>`;

  const ab = document.getElementById('ac-abrir');
  if (ab) ab.addEventListener('click', () => { if (window.B4U && window.B4U.abrirChamado) window.B4U.abrirChamado({}); });
  const ct = document.getElementById('ac-contatos');
  if (ct) ct.addEventListener('click', () => abrirContatos(id, codigo));

  // "confiar neste aparelho": a OFERTA agora aparece só uma vez, logo após inserir o
  // código (tela telaConfiarAparelho). Na home mostramos apenas a CONFIRMAÇÃO quando o
  // aparelho já é confiável (com a opção de sair). Sem oferta recorrente aqui.
  const cr = document.getElementById('confiar-row');
  if (cr){
    if (lerToken()){
      cr.innerHTML = `<span class="conf-ok">✓ Este aparelho é confiável — você entra sem digitar código.</span> · <button type="button" class="linklike" id="sair-ap">Sair deste aparelho</button>`;
      cr.querySelector('#sair-ap').addEventListener('click', async ()=>{ await sairDesteAparelho(id, codigo); render(id, codigo, disponiveis, pessoa); });
    } else {
      cr.innerHTML = '';
    }
  }

  /* A barra e o menu das páginas internas montam os links de área a partir daqui: só
     a home recebe `disponiveis`, e sem este registro o fiscal degradava para um link
     só. Guardamos o que a home REALMENTE mostrou — já filtrado por PAINEIS_OCULTOS
     (que vem false do backend) e pelas áreas do acesso de quem entrou. Assim nenhuma
     página oferece uma porta que a pessoa não consegue abrir.
     O mapa é montado FORA do try: se o localStorage estiver bloqueado (aba anônima,
     cota estourada) a gravação falha, mas o menu desta página continua sabendo o que
     mostrar — ele recebe o objeto, não a chave. */
  const visivel = {};
  DEFINICOES.forEach(d => { visivel[d.chave] = !!(disponiveis[d.chave] && (!areasP || areasP.indexOf(d.chave)>=0)); });
  try {
    localStorage.setItem('b4u_disp_' + id, JSON.stringify(visivel));
  } catch(e){}

  /* Menu lateral. Montado UMA vez, e aqui, porque é só neste ponto que a home sabe
     quais áreas existem para esta pessoa — antes disso o menu ofereceria tudo.
     `render()` roda duas vezes no caminho do cache quente (pinta do cache, repinta com
     a resposta); o módulo ignora a segunda chamada de propósito, então o menu não
     pisca nem remonta — e por isso o contexto tem de ser o melhor que houver AGORA.
     `destino` é a mesma regra dos cartões: <arquivo>#<id>-<codigo>, a query nunca
     depois do '#'. E o menu vive no <body>, fora do #miolo: repintar o miolo (trocar
     de aparelho, sair, erro) não o derruba. */
  if (window.B4UShell) B4UShell.montar({
    perfil: 'cliente',
    ativo: 'home',
    contexto: contextoEmpresa(id),
    link: destino,
    disp: visivel,
    wa: hrefWhatsApp()
  });

  // alertas de pendência + frase-resumo da saudação (só quem realmente abre o fiscal)
  carregarAlertasHome(id, codigo, !!disponiveis.fiscal && (!areasP || areasP.indexOf('fiscal')>=0));
}

/* ---------- Alertas de pendência na home ----------
 * A home NÃO pode depender de o cliente ter aberto o fiscal antes: quem entra pela
 * primeira vez no celular via uma home limpa mesmo tendo guia vencida e notas sem
 * divisão, e lia o silêncio como "está tudo em dia". Então ela mesma busca o
 * `tipo=fiscal` e conta as pendências. O localStorage do fiscal continua servindo
 * para pintar na hora, enquanto a resposta não chega. */
const PAGINAS_ALERTA = { fiscal:'fiscal', contabil:'contabil',
  equiparacao:'equiparacao', societario:'societario', dptopessoal:'dptopessoal', pessoal:'dptopessoal' };

function pintarAlertas(id, codigo, itens){
  const box = document.getElementById('alertas-home'); if(!box) return;
  box.innerHTML = (itens||[]).map(p=>{
    const arq = PAGINAS_ALERTA[p.area] || 'fiscal';
    // A query vai ANTES do '#': depois dela o '?pend=1' vira parte do fragmento e
    // contamina o código de acesso, derrubando a sessão de quem clica no alerta.
    const alvo = arq + (p.pend?'?pend=1':'') + '#' + id + '-' + codigo;
    return `<a class="alerta-card" href="${esc(alvo)}">
      <span class="alerta-ico">!</span>
      <span class="alerta-txt"><b>${esc(p.titulo)}</b>${p.detalhe?`<span>${esc(p.detalhe)}</span>`:''}</span>
      <span class="alerta-seta">→</span></a>`; }).join('');
}

/* A saudação é o resumo: ela diz em uma frase o que precisa da atenção dele hoje —
   e diz explicitamente quando não precisa de nada. Silêncio não é resposta. */
function pintarResumo(itens, incerto){
  const p = document.getElementById('hm-resumo'); if(!p) return;
  if(incerto){
    p.textContent = 'Aqui fica tudo o que você precisa acompanhar sobre a sua empresa — de impostos a processos em andamento.';
    return;
  }
  const frases = (itens||[]).map(x=>x.frase).filter(Boolean);
  if(!frases.length){
    p.innerHTML = '<span class="tudo-em-dia">Está tudo em dia — nada precisa da sua atenção hoje.</span>';
    return;
  }
  const n = frases.length;
  const lista = n===1 ? frases[0] : frases.slice(0,-1).join(', ') + ' e ' + frases[n-1];
  p.textContent = `Hoje você tem ${n===1?'uma coisa':n+' coisas'} para ver: ${lista}.`;
}

let ALERTAS_EM_VOO = false;   // render() pode rodar duas vezes (cache + resposta): uma busca só
async function carregarAlertasHome(id, codigo, temFiscal){
  if(!document.getElementById('alertas-home')) return;

  // 1) pinta na hora: o payload fiscal guardado, ou o resumo que o painel fiscal deixou
  let pintou = false;
  const cacheFiscal = (temFiscal && window.B4U && B4U.cacheLer) ? B4U.cacheLer('fiscal', id) : null;
  if(cacheFiscal){
    const it = pendenciasDoFiscal(cacheFiscal); pintarAlertas(id, codigo, it); pintarResumo(it, false); pintou = true;
  } else {
    let pend=null; try{ pend = JSON.parse(localStorage.getItem('b4u_pend_'+id)||'null'); }catch(e){}
    if(pend && Array.isArray(pend.itens)){ pintarAlertas(id, codigo, pend.itens); pintarResumo(pend.itens, false); pintou = true; }
  }

  if(!temFiscal){
    // Sem painel fiscal não há o que contar aqui — e não dá para afirmar que está tudo em dia.
    if(!pintou){ pintarAlertas(id, codigo, []); pintarResumo(null, true); }
    return;
  }
  if(!pintou){
    const box=document.getElementById('alertas-home');
    if(box) box.innerHTML = (window.B4U && B4U.skeleton) ? B4U.skeleton(1,44) : '';
  }
  if(ALERTAS_EM_VOO) return;

  // 2) busca a verdade. O payload fiscal vai para o cache compartilhado (B4U.cacheChave),
  //    então esta chamada também adianta a abertura do painel fiscal.
  ALERTAS_EM_VOO = true;
  let raw = null;
  try{
    const d = await jsonp(API_URL+'?id='+encodeURIComponent(id)+'&codigo='+encodeURIComponent(codigo)+'&tipo=fiscal');
    if(d && !d.erro){ raw = d; if(window.B4U && B4U.cacheGravar) B4U.cacheGravar('fiscal', id, d); }
  }catch(e){}
  ALERTAS_EM_VOO = false;
  if(!raw) raw = cacheFiscal;
  if(!raw){ if(!pintou){ pintarAlertas(id, codigo, []); pintarResumo(null, true); } return; }

  const itens = pendenciasDoFiscal(raw);
  pintarAlertas(id, codigo, itens);
  pintarResumo(itens, false);
  try{ localStorage.setItem('b4u_pend_'+id, JSON.stringify({itens, ts:Date.now()})); }catch(e){}
}

/* ---------- Contagem das pendências a partir do payload fiscal ----------
 * Mesmas três contas do painel fiscal (guias vencidas, notas sem divisão, lucro sem
 * distribuição), aqui só para contar — nada é redesenhado. */
const HOJE_HOME = (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; })();
const numH = v => Number(v)||0;
const compH = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const diaH  = d => compH(d)+'-'+String(d.getDate()).padStart(2,'0');
const brlH  = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const chaveNorm = s => String(s).trim().toLowerCase().replace(/\s+/g,' ');
function metrica(row, chave){
  if(!row) return undefined;
  if(chave in row) return row[chave];
  const alvo = chaveNorm(chave);
  const k = Object.keys(row).find(x=>chaveNorm(x)===alvo);
  return k===undefined ? undefined : row[k];
}
/* Peso de cada centro numa nota: true => rateio igual; número => valor/bruto;
   nenhum marcado => a nota inteira cai em "Não identificado". */
function semDivisao(nf){
  const map = (nf && nf.centros) || {}; const nomes = Object.keys(map);
  const marcados = nomes.filter(k=>map[k]===true);
  const numericos = nomes.filter(k=>typeof map[k]==='number');
  if(!marcados.length && !numericos.length) return true;
  const bruto = numH(nf.valorBruto);
  if(marcados.indexOf('Não identificado')>=0) return true;
  const nid = numH(map['Não identificado']);
  return bruto ? (nid/bruto) > 0.005 : nid > 0;
}
const notaInativaH = nf => !!(nf && (nf.ativa===false || /cancel|substit/i.test(nf.situacao||'')));

function pendenciasDoFiscal(raw){
  const itens = [];
  const anoAtual = String(compH(HOJE_HOME)).slice(0,4);

  // -- guias vencidas (venc no passado e ainda não marcadas como pagas) --------
  const regras = (raw.regras||[]).filter(r=>/^R\d+$/.test(String(r.id||'')));
  const regraDe = Object.fromEntries(regras.map(r=>[r.id,r]));
  const empresa = (raw.empresa||[]).filter(r=>/^\d{4}-\d{2}$/.test(String(r.competencia||'')));
  const porComp = Object.fromEntries(empresa.map(r=>[r.competencia,r]));
  const comDado = empresa.filter(r=>numH(metrica(r,'Total (R$)'))>0);
  const baseMedia = (comDado.length?comDado:empresa).slice(-3);
  const mediaDe = k => baseMedia.length ? baseMedia.reduce((s,r)=>s+numH(metrica(r,k)),0)/baseMedia.length : 0;
  const valorDe = item => {
    const rr = regraDe[item.id_regra]||{};
    if(numH(rr.valor_previsto)>0) return numH(rr.valor_previsto);
    const fonte = String(rr.metrica_fonte||'').trim(); if(!fonte) return 0;
    const chaves = fonte.split('|').map(s=>s.trim()).filter(Boolean);
    const n = Math.max(1, numH(rr.acumula_meses)||1);
    const ref = String(item.competencia_ref||''); if(!/^\d{4}-\d{2}$/.test(ref)) return 0;
    const [a,m] = ref.split('-').map(Number);
    let total = 0;
    for(let i=0;i<n;i++){ const c = compH(new Date(a,m-1-i,1)); const r = porComp[c];
      total += chaves.reduce((s,k)=>s+(r?numH(metrica(r,k)):mediaDe(k)),0); }
    return Math.round(total*100)/100;
  };
  /* AQUI ficava o alerta de "guias vencidas" na home. Saiu junto com a agenda em
     04/08/2026: ele é feito do calendário (raw.calendario), e apontava para uma
     página que o cliente não alcança mais — alerta que não leva a lugar nenhum é
     pior do que alerta nenhum. O cálculo está preservado no histórico do arquivo;
     quando a agenda voltar, ele volta com ela. */

  // -- notas do ano sem divisão definida --------------------------------------
  let semDiv = 0;
  Object.keys(raw.nfs||{}).forEach(c=>{
    if(String(c).slice(0,4)!==anoAtual) return;
    ['prestadas','tomadas'].forEach(tab=>{
      ((raw.nfs[c]||{})[tab]||[]).forEach(nf=>{ if(semDivisao(nf) && !notaInativaH(nf)) semDiv++; });
    });
  });
  if(semDiv>0) itens.push({ area:'fiscal', pend:true,
    titulo: semDiv>1 ? `${semDiv} notas sem divisão definida` : 'Uma nota sem divisão definida',
    detalhe:'Sem isso a divisão do imposto sai errada.',
    frase: semDiv>1 ? `${semDiv} notas ainda estão sem divisão definida` : 'uma nota ainda está sem divisão definida' });

  // -- meses com lucro apurado e nenhuma distribuição informada ----------------
  let lucroSemDist = 0;
  empresa.forEach(r=>{
    if(String(r.competencia||'').slice(0,4)!==anoAtual) return;
    if(numH(metrica(r,'Apuração de lucro do mês (R$)'))>0 && numH(metrica(r,'Dividendos distribuídos (R$)'))<=0) lucroSemDist++;
  });
  if(lucroSemDist>0) itens.push({ area:'fiscal',
    titulo: lucroSemDist>1 ? `${lucroSemDist} meses com lucro sem distribuição informada` : 'Um mês com lucro sem distribuição informada',
    detalhe:'Informe quanto foi distribuído de lucros/dividendos.',
    frase: lucroSemDist>1 ? `${lucroSemDist} meses com lucro ainda estão sem distribuição informada`
                          : 'um mês com lucro ainda está sem distribuição informada' });

  return itens;
}

const AREAS_LABEL = { fiscal:'Fiscal', contabil:'Contábil', pessoal:'Pessoal', societario:'Societário', equiparacao:'Equiparação', financeiro:'Financeiro' };
let CT = null;

function fecharOverlay(force){
  if(!force && CT && CT.editando && CT.dirty){ pedirDescartar(); return; }
  const o=document.getElementById('ov-contatos'); if(o) o.remove(); CT=null;
}
function pedirDescartar(){
  const foot=document.getElementById('ct-foot');
  if(!foot){ const o=document.getElementById('ov-contatos'); if(o) o.remove(); CT=null; return; }
  foot.innerHTML=`<span class="ct-warn">⚠ Alterações não salvas</span>`+
    `<button class="ac-btn" id="ct-keep">Continuar</button>`+
    `<button class="ac-btn ct-danger" id="ct-discard">Sair sem salvar</button>`;
  document.getElementById('ct-keep').addEventListener('click', montarFoot);
  document.getElementById('ct-discard').addEventListener('click', ()=>fecharOverlay(true));
}
function montarFoot(){
  const foot=document.getElementById('ct-foot'); if(!foot||!CT) return;
  foot.innerHTML=`<button class="ac-btn" id="ct-cancel">Fechar</button>`+(CT.editando?`<button class="ac-btn ac-primary" id="ct-save">Salvar</button>`:'');
  document.getElementById('ct-cancel').addEventListener('click', ()=>fecharOverlay());
  const save=document.getElementById('ct-save'); if(save) save.addEventListener('click', salvarContatos);
}

async function abrirContatos(id, codigo){
  fecharOverlay(true);
  const ov = document.createElement('div');
  ov.id = 'ov-contatos'; ov.className = 'ov';
  ov.innerHTML = `<div class="sheet"><div class="sheet-head"><b>Contatos e acessos</b><button class="sheet-x" aria-label="Fechar">✕</button></div>
    <div class="sheet-body" id="ct-body"><div class="state" style="min-height:120px"><div class="spin"></div><p>Carregando…</p></div></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e=>{ if(e.target===ov) fecharOverlay(); });
  ov.querySelector('.sheet-x').addEventListener('click', ()=>fecharOverlay());
  try{
    const d = await jsonp(API_URL+'?id='+encodeURIComponent(id)+'&codigo='+encodeURIComponent(codigo)+'&tipo=contatos');
    if(d.erro) throw new Error(d.erro);
    CT = { id, codigo, dirty:false,
      contatos:(d.contatos||[]).map(c=>({nome:c.nome,email:c.email,papel:c.papel,areas:Object.keys(c.areas||{}).filter(a=>c.areas[a]),_open:false})),
      areas:(d.areas&&d.areas.length)?d.areas:Object.keys(AREAS_LABEL), editando:!!d.podeEditar, euEmail:(d.euEmail||'').toLowerCase() };
    renderContatos();
  /* Falhou a leitura dos contatos: a folha mostra a MESMA mensagem de erro do resto do
     painel. O que deu errado é assunto nosso; para quem está do outro lado, o que
     importa é que não carregou e que dá para tentar de novo. */
  }catch(e){
    const corpo = document.getElementById('ct-body');
    if(!corpo) return;
    if(window.B4UEspera) corpo.innerHTML = B4UEspera.erroHTML();
    else corpo.innerHTML = '<p class="sheet-note">Não conseguimos carregar as informações. '
      + 'Tente novamente em alguns minutos. Se o problema continuar, entre em contato '
      + 'com o atendimento.</p>';
  }
}

function renderContatos(){
  const body=document.getElementById('ct-body'); if(!body||!CT) return;
  const podeEditar = CT.editando;
  const aviso = podeEditar ? '' : `<p class="sheet-note" style="color:#9A6B10">Você está vendo em modo leitura. Só um <b>responsável principal</b> (entrando com o próprio código) pode editar.</p>`;
  body.innerHTML = `
    <p class="sheet-note">Toque em um nome para ver ou editar. <b>Principal</b> acessa tudo; <b>Secundário</b> recebe só as áreas marcadas.</p>
    ${aviso}
    <div id="ct-lista">${CT.contatos.map((c,i)=>cardContato(c,i,podeEditar)).join('') || '<p class="sheet-note">Nenhum contato cadastrado ainda.</p>'}</div>
    ${podeEditar?`<button class="ac-btn ct-add" id="ct-add">+ Adicionar contato</button>`:''}
    <div class="ct-err" id="ct-err"></div>
    <div class="sheet-foot" id="ct-foot"></div>`;
  montarFoot();
  const add=document.getElementById('ct-add');
  if(add) add.addEventListener('click',()=>{
    CT.contatos.push({nome:'',email:'',papel:'Secundário',areas:[],_open:true}); CT.dirty=true;
    renderContatos();
    // renderContatos refaz o innerHTML inteiro e a folha volta ao topo: sem levar o
    // cartão novo até os olhos, ele acha que o toque não funcionou e toca de novo.
    focarUltimoContato();
  });
  wireCards(podeEditar);
}

function focarUltimoContato(){
  const cards=document.querySelectorAll('#ct-lista .ct-acc');
  const novo=cards[cards.length-1]; if(!novo) return;
  novo.scrollIntoView({block:'center'});
  const nm=novo.querySelector('.ct-nome'); if(nm) nm.focus({preventScroll:true});
}

function cardContato(c,i,editar){
  const principal=/principal/i.test(c.papel);
  const pill=`<span class="ct-papel ${principal?'p':'s'}">${principal?'Principal':'Secundário'}</span>`;
  const chev=`<span class="ct-chev">▾</span>`;
  if(!editar){
    return `<div class="ct-acc${c._open?' open':''}" data-i="${i}">
      <div class="ct-acc-head" data-i="${i}"><span class="ct-acc-name">${esc(c.nome||'—')}</span>${pill}${chev}</div>
      <div class="ct-acc-body">
        <div class="ct-mail">${esc(c.email||'—')}</div>
        <div class="ct-areas">${principal?'<span class="ct-area-chip on">Acesso total</span>':CT.areas.map(a=>`<span class="ct-area-chip${c.areas.indexOf(a)>=0?' on':''}">${AREAS_LABEL[a]||a}</span>`).join('')}</div>
      </div></div>`;
  }
  const euMesmo = !!CT.euEmail && (c.email||'').toLowerCase()===CT.euEmail;
  return `<div class="ct-acc${c._open?' open':''}" data-i="${i}">
    <div class="ct-acc-head" data-i="${i}"><span class="ct-acc-name">${esc(c.nome||'Novo contato')}</span>${euMesmo?'<span class="ct-voce">você</span>':''}${pill}${chev}</div>
    <div class="ct-acc-body">
      <label class="ct-lbl">Nome</label>
      <input class="ct-in ct-nome" data-i="${i}" placeholder="Nome" value="${esc(c.nome)}">
      <label class="ct-lbl">E-mail</label>
      <!-- Sem isto o iPhone entrega "Ana@empresa.com" (maiúscula automática) e esconde a tecla @. -->
      <input class="ct-in ct-email" data-i="${i}" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e-mail@empresa.com" value="${esc(c.email)}"${euMesmo?' readonly':''}>
      <label class="ct-lbl">Tipo de acesso</label>
      <select class="ct-in ct-papel-sel" data-i="${i}"${euMesmo?' disabled title="Você não pode remover o seu próprio acesso principal"':''}>
        <option value="Principal"${principal?' selected':''}>Principal · acesso total</option>
        ${euMesmo?'':`<option value="Secundário"${!principal?' selected':''}>Secundário · áreas escolhidas</option>`}
      </select>
      <div class="ct-areas-wrap${principal?' oculto':''}">
        <label class="ct-lbl">Áreas que recebe</label>
        <div class="ct-areas">${CT.areas.map(a=>`<label class="ct-area-chk"><input type="checkbox" data-i="${i}" data-area="${a}"${c.areas.indexOf(a)>=0?' checked':''}> ${AREAS_LABEL[a]||a}</label>`).join('')}</div>
      </div>
      ${euMesmo?'<p class="ct-selfnote">Este é o seu acesso — você não pode se remover.</p>':`<div class="ct-rm-linha"><button class="ct-rm" type="button" data-i="${i}">Remover contato</button></div>`}
    </div></div>`;
}

function wireCards(editar){
  document.querySelectorAll('#ct-lista .ct-acc-head').forEach(h=>h.addEventListener('click',e=>{
    const acc=e.currentTarget.closest('.ct-acc'); const i=+e.currentTarget.dataset.i;
    const abrir=!acc.classList.contains('open'); acc.classList.toggle('open',abrir);
    if(CT.contatos[i]) CT.contatos[i]._open=abrir;
  }));
  if(!editar) return;
  document.querySelectorAll('.ct-nome').forEach(el=>el.addEventListener('input',e=>{
    const i=+e.target.dataset.i; CT.contatos[i].nome=e.target.value; CT.dirty=true;
    const acc=e.target.closest('.ct-acc'), nm=acc&&acc.querySelector('.ct-acc-name');
    if(nm) nm.textContent=e.target.value||'Novo contato';
  }));
  document.querySelectorAll('.ct-email').forEach(el=>el.addEventListener('input',e=>{ CT.contatos[+e.target.dataset.i].email=e.target.value; CT.dirty=true; }));
  document.querySelectorAll('.ct-papel-sel').forEach(el=>el.addEventListener('change',e=>{
    const i=+e.target.dataset.i, principal=/principal/i.test(e.target.value);
    CT.contatos[i].papel=e.target.value; CT.dirty=true;
    const acc=e.target.closest('.ct-acc');
    const wrap=acc&&acc.querySelector('.ct-areas-wrap'); if(wrap) wrap.classList.toggle('oculto',principal);
    const pill=acc&&acc.querySelector('.ct-papel'); if(pill){ pill.className='ct-papel '+(principal?'p':'s'); pill.textContent=principal?'Principal':'Secundário'; }
  }));
  // Remover contato em dois tempos: o primeiro clique só pede confirmação
  // (mesmo padrão do painel da equipe). Volta ao normal sozinho em 6 segundos.
  document.querySelectorAll('.ct-rm').forEach(btn=>{
    let prazo=null;
    const repor=()=>{ clearTimeout(prazo); prazo=null;
      btn.classList.remove('confirmar'); btn.textContent='Remover contato';
      const d=btn.parentElement&&btn.parentElement.querySelector('.ct-rm-desfazer'); if(d) d.remove(); };
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.i;
      if(btn.classList.contains('confirmar')){ clearTimeout(prazo); CT.contatos.splice(i,1); CT.dirty=true; renderContatos(); return; }
      btn.classList.add('confirmar'); btn.textContent='Clique de novo para remover';
      if(btn.parentElement && !btn.parentElement.querySelector('.ct-rm-desfazer')){
        const cancelar=document.createElement('button');
        cancelar.type='button'; cancelar.className='ct-rm-desfazer'; cancelar.textContent='cancelar';
        cancelar.addEventListener('click',repor);
        btn.parentElement.appendChild(cancelar);
      }
      prazo=setTimeout(repor,6000);
    });
  });
  document.querySelectorAll('.ct-area-chk input').forEach(el=>el.addEventListener('change',e=>{
    const i=+e.target.dataset.i, a=e.target.dataset.area, arr=CT.contatos[i].areas;
    if(e.target.checked){ if(arr.indexOf(a)<0) arr.push(a); } else { const k=arr.indexOf(a); if(k>=0) arr.splice(k,1); }
    CT.dirty=true;
  }));
}

const ORDINAL_CT = ['1º','2º','3º','4º','5º','6º','7º','8º','9º','10º'];
/* O backend descarta em silêncio quem está sem e-mail e ainda responde sucesso — o
   sócio some da lista e nunca recebe acesso. Barramos aqui, apontando a linha. */
function validarContatos(){
  for(let i=0;i<CT.contatos.length;i++){
    const c=CT.contatos[i];
    const nome=String(c.nome||'').trim(), email=String(c.email||'').trim();
    const quem = nome ? `“${nome}”` : `o ${ORDINAL_CT[i]||(i+1)+'º'} contato`;
    if(!nome && !email) return { i, msg:`O ${ORDINAL_CT[i]||(i+1)+'º'} contato está em branco. Preencha nome e e-mail ou remova o cartão.` };
    if(!email) return { i, msg:`Falta o e-mail de ${quem}. Sem e-mail ele não recebe o acesso — preencha ou remova o cartão.` };
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return { i, msg:`O e-mail de ${quem} está incompleto: “${email}”. Confira antes de salvar.` };
  }
  return null;
}

async function salvarContatos(){
  const err=document.getElementById('ct-err'), btn=document.getElementById('ct-save'); if(err) err.textContent='';
  const falha=validarContatos();
  if(falha){
    // Abre o cartão do contato incompleto e leva a pessoa até ele — o erro sozinho,
    // com o cartão fechado, não diz qual dos quatro nomes está faltando.
    CT.contatos.forEach((c,k)=>{ c._open = (k===falha.i); });
    renderContatos();
    const errNovo=document.getElementById('ct-err'); if(errNovo) errNovo.textContent=falha.msg;
    const card=document.querySelectorAll('#ct-lista .ct-acc')[falha.i];
    if(card){ card.scrollIntoView({block:'center'});
      const alvo=card.querySelector(String(CT.contatos[falha.i].nome||'').trim()?'.ct-email':'.ct-nome');
      if(alvo) alvo.focus({preventScroll:true}); }
    return;
  }
  const payload=CT.contatos.map(c=>({nome:c.nome,email:c.email,papel:c.papel,areas:/principal/i.test(c.papel)?[]:c.areas}));
  const params=new URLSearchParams({ id:CT.id, codigo:CT.codigo, acao:'salvar_contatos', contatos:JSON.stringify(payload) });
  if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  try{
    const d=await jsonp(API_URL+'?'+params.toString());
    if(d.erro) throw new Error(d.erro);
    CT.dirty=false;
    // Se o backend tiver descartado alguém mesmo assim, ele diz quem — e nós mostramos.
    const ign=(d && Array.isArray(d.ignorados)) ? d.ignorados.filter(Boolean) : [];
    const avisoIgn = ign.length
      ? `<p class="sheet-note" style="color:#9A6B10;max-width:40ch;margin:10px auto 0">⚠ ${ign.length===1?'Não foi salvo':'Não foram salvos'}: ${esc(ign.map(x=>(x&&(x.nome||x.email))||String(x)).join(', '))}. ${ign.length===1?'Esse contato ficou':'Esses contatos ficaram'} sem e-mail válido e não ${ign.length===1?'recebe':'recebem'} acesso.</p>`
      : '';
    // A confirmação é frase nossa. Antes vinha `d.mensagem` do backend, e o que o
    // backend escreve muda sem aviso — inclusive para texto de exceção. O único dado
    // do servidor que ainda aparece aqui são os nomes ignorados, e esses vão por esc().
    document.getElementById('ct-body').innerHTML=`<div class="state" style="min-height:160px"><h1 style="font-size:var(--fs-5)">Contatos salvos ✓</h1><p>Tudo certo.</p>${avisoIgn}<button class="ac-btn ac-primary" id="ct-ok">Fechar</button></div>`;
    document.getElementById('ct-ok').addEventListener('click', ()=>fecharOverlay(true));
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Salvar'; }
    const e2=document.getElementById('ct-err');
    // O que ele digitou continua na tela: a frase precisa dizer isso.
    if(e2) e2.textContent='Não consegui salvar os contatos agora. Nada foi perdido — o que você digitou continua aqui, tente de novo em alguns segundos.'; }
}

/* ---------- código de verificação: 6 caixinhas, só números ----------
 * `autocomplete="one-time-code"` é o que faz o iPhone/Mac oferecer o código sozinho
 * em cima do teclado. Só que o gatilho está no E-MAIL, não aqui: quem decide é a
 * heurística do sistema lendo o assunto e a última linha do texto plano. Se algum dia
 * o preenchimento parar, olhe `enviarEmailAcesso_` no Contatos.gs antes de mexer aqui.
 *
 * NÃO chamar a WebOTP API (`navigator.credentials.get({otp:{transport:['sms']}})`):
 * ela só recebe código por SMS, e o nosso vai por e-mail — a chamada abriria um pedido
 * de permissão que fica pendurado pra sempre. Se um dia o envio passar a ter SMS, é
 * bem aqui (junto do wireOTP, com AbortController amarrado na saída da tela) que ela
 * entra, e o SMS precisa terminar com a linha `@painel.back4you.com.br #123456`. */
function boxesOTP(){
  return `<div class="otp" id="otp">${Array.from({length:6}).map(()=>
    `<input class="otp-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="dígito do código">`).join('')}</div>
    <button type="button" class="otp-colar" id="otp-colar" hidden>Colar código</button>
    <p class="otp-dica" id="otp-dica" role="status" aria-live="polite"></p>`;
}
function wireOTP(onComplete){
  const inputs = Array.from(document.querySelectorAll('#otp .otp-box'));
  const val = () => inputs.map(i=>i.value).join('');
  const marcar = ()=> inputs.forEach(i=> i.classList.toggle('ok', !!i.value));
  // Um caminho só para espalhar os dígitos: colar com Ctrl+V, botão "Colar código" e
  // autofill do sistema caem todos aqui — duas cópias dessa regra viravam duas regras.
  function distribuir(digitos, focoAtual){
    const d = String(digitos||'').replace(/\D/g,'').slice(0,inputs.length);
    if(!d) return false;
    inputs.forEach((x,k)=> x.value=d[k]||''); marcar();
    (inputs[Math.min(d.length,inputs.length-1)]||focoAtual||inputs[0]).focus();
    if(d.length>=inputs.length && onComplete) onComplete(val());
    return true;
  }
  inputs.forEach((inp,i)=>{
    inp.addEventListener('input', ()=>{
      inp.value = inp.value.replace(/\D/g,'').slice(0,1);
      if(inp.value && i<inputs.length-1) inputs[i+1].focus();
      marcar();
      if(val().length===inputs.length && onComplete) onComplete(val());
    });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Backspace' && !inp.value && i>0){ inputs[i-1].focus(); e.preventDefault(); }
    });
    inp.addEventListener('paste', e=>{
      e.preventDefault();
      distribuir((e.clipboardData.getData('text')||''), inp);
    });
  });
  // No Android/Chrome não existe autofill de código vindo de e-mail (a WebOTP só cobre
  // SMS): lá o cliente teria que segurar o campo e caçar "colar" no menu do sistema.
  // O botão troca isso por um toque — e some de vez em quem não tem a API.
  const bt = document.getElementById('otp-colar'), dica = document.getElementById('otp-dica');
  if(bt && navigator.clipboard && navigator.clipboard.readText){
    bt.hidden = false;
    bt.addEventListener('click', async ()=>{
      if(dica) dica.textContent = '';
      let txt = '';
      // ler a área de transferência exige gesto do usuário E permissão. Negou? o botão
      // sai de cena: insistir num pedido recusado só ensina a pessoa a dizer não.
      try{ txt = await navigator.clipboard.readText(); }
      catch(e){ bt.hidden = true; return; }
      // /\d{6}/ e não "todos os dígitos": o que costuma estar na área de transferência é
      // o e-mail inteiro, cheio de outros números — queremos a sequência de 6, só ela.
      const m = String(txt||'').match(/\d{6}/);
      if(!m){ if(dica) dica.textContent = 'Não achei um código de 6 dígitos na área de transferência.'; return; }
      distribuir(m[0]);
    });
  }
  if(inputs[0]) inputs[0].focus();
  return { val, clear:()=>{inputs.forEach(i=>{i.value='';i.classList.remove('ok');}); if(dica) dica.textContent=''; inputs[0]&&inputs[0].focus();} };
}

/* ---------- entrar com o código pessoal (já tem ID+empresa no link) ----------
 * Sinaliza que a oferta de "confiar neste aparelho" pode aparecer — mas quem a
 * mostra é o boot(), e só depois de o backend aceitar o código. Convidar antes de
 * conferir era oferecer confiança num acesso que ainda ia falhar. */
let OFERECER_CONFIAR = false;
function entrarComCodigo(entrada){
  const { id, codigo } = getIdCodigo();
  const empresa = (codigo||'').split('-')[0].trim();
  const contato = String(entrada||'').replace(/\D/g,'');   // código é numérico
  if (contato.length !== 6) return 'Digite os 6 dígitos do seu código.';
  if (!empresa) return 'Faltou o código da empresa no endereço — entre pelo seu e-mail.';
  location.hash = id + '-' + empresa + '-' + contato;      // corrige a URL
  OFERECER_CONFIAR = true;
  boot();                                                  // valida primeiro
  return '';
}

/* Classifica a falha do acesso. O 1º segmento do código é a senha DA EMPRESA e ela
   muda todo dia: quando é ela que caducou, nenhum código pessoal digitado nas
   caixinhas vai passar — o caminho certo é recomeçar pelo e-mail. */
function falhaDeEmpresa(e){
  const m = String((e && e.message) || e || '');
  if (/incompleto/i.test(m)) return false;                 // a empresa está ok; falta o código pessoal
  return /inválid|invalid|restrito|expir|venc/i.test(m);
}

const WA_ACESSO = m => 'https://wa.me/5511937173906?text='+encodeURIComponent(m);

/* ---------- E-MAIL PRIMEIRO: pede o e-mail, envia o código, monta o link ---------- */
async function telaLoginEmail(aviso){
  pararEspera();
  const wa = WA_ACESSO('Olá, preciso de ajuda com o acesso ao painel back4you.');
  const nota = (typeof aviso === 'string' && aviso)
    ? `<p style="color:var(--amber-txt);font-weight:700;max-width:40ch">${esc(aviso)}</p>` : '';
  document.getElementById('miolo').innerHTML = `
    <div class="state">
      <h1>Acesse o seu painel</h1>
      ${nota}
      <p>Digite o seu e-mail cadastrado. Enviamos um código de 6 dígitos para você entrar.</p>
      <form id="mail-form" class="id-form">
        <input id="mail-input" type="email" inputmode="email" autocomplete="email" placeholder="seu@email.com" required>
        <button type="submit" class="ac-btn ac-primary">Enviar código</button>
      </form>
      <div class="ct-err" id="mail-err" style="min-height:18px"></div>
      <p style="margin-top:2px">Não sabe qual e-mail? <a href="${wa}" target="_blank" rel="noopener" style="color:var(--brand-teal-txt);font-weight:700">Falar com o atendimento</a></p>
    </div>`;
  const form = document.getElementById('mail-form');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('mail-input').value.trim();
    const errEl = document.getElementById('mail-err');
    if(!email){ errEl.textContent='Digite o seu e-mail.'; return; }
    const btn = form.querySelector('button'); btn.disabled=true; btn.textContent='Enviando…';
    try{
      const d = await jsonp(API_URL+'?tipo=login_email_iniciar&email='+encodeURIComponent(email));
      if(d.erro) throw new Error(d.erro);
      if(!d.encontrado){ btn.disabled=false; btn.textContent='Enviar código';
        errEl.innerHTML = 'Não encontramos esse e-mail no cadastro. Confira ou <a href="'+wa+'" target="_blank" rel="noopener" style="color:var(--brand-teal-txt);font-weight:700">fale com o atendimento</a>.'; return; }
      if(d.enviado===false){ btn.disabled=false; btn.textContent='Enviar código';
        // A frase é nossa, sempre. Aqui entrava `d.mensagem` colado em innerHTML: quando
        // o envio falha, o que o backend manda costuma ser o texto cru da exceção
        // ('Service invoked too many times…') — e virava HTML na tela do cliente.
        // O único HTML desta linha é o link de atendimento, que é nosso.
        errEl.innerHTML = 'Encontramos seu cadastro, mas não consegui enviar o e-mail agora. Fale com o <a href="'+wa+'" target="_blank" rel="noopener" style="color:var(--brand-teal-txt);font-weight:700">atendimento</a>.'; return; }
      telaCodigoEmail(email, d.mascarado||'');
    }catch(err){ btn.disabled=false; btn.textContent='Enviar código'; errEl.textContent = B4U.msgAmigavel(err); }
  });
  document.getElementById('mail-input').focus();
}

function telaCodigoEmail(email, mascarado){
  pararEspera();
  const wa = WA_ACESSO('Olá, não recebi o código de acesso ao painel back4you.');
  document.getElementById('miolo').innerHTML = `
    <div class="state">
      <h1>Código de verificação</h1>
      <p>Enviamos um código de 6 dígitos para ${mascarado?('<b>'+esc(mascarado)+'</b>'):'o seu e-mail'}. Digite abaixo para entrar.</p>
      ${boxesOTP()}
      <div class="ct-err" id="cod-err" style="min-height:18px"></div>
      <button type="button" class="ac-btn ac-primary" id="cod-continuar" style="min-width:220px">Continuar</button>
      <p style="margin-top:12px;color:var(--muted)">Não recebeu? <button type="button" class="linklike" id="reenviar-mail">Reenviar código</button> · <a href="${wa}" target="_blank" rel="noopener" style="color:var(--brand-teal-txt);font-weight:700">atendimento</a></p>
    </div>`;
  const otp = wireOTP(()=>submeter());
  const btn = document.getElementById('cod-continuar');
  async function submeter(){
    const code = otp.val();
    const errEl = document.getElementById('cod-err');
    if(code.length<6){ errEl.textContent='Digite os 6 dígitos.'; return; }
    errEl.textContent=''; btn.disabled=true; btn.textContent='Entrando…';
    try{
      const d = await jsonp(API_URL+'?tipo=login_email_verificar&email='+encodeURIComponent(email)+'&codigo='+encodeURIComponent(code));
      if(d.erro) throw new Error(d.erro);
      // Código errado, expirado ou tentativa demais: para quem digitou é tudo a mesma
      // coisa — digitar de novo. `d.mensagem` saía daqui porque é texto do backend, e
      // num dia ruim o que vem é a exceção do Apps Script, não uma frase para ler.
      if(!d.ok){ btn.disabled=false; btn.textContent='Continuar'; errEl.textContent = 'Código incorreto.'; otp.clear(); return; }
      if(d.destino && irParaEquipe(d.destino)) return;
      if(d.multi && d.empresas && d.empresas.length){ return telaEscolherEmpresa(d.empresas); }
      location.hash = d.hash;
      OFERECER_CONFIAR = true;   // a oferta de confiar sai no fim do boot, com o acesso já aceito
      boot();
    }catch(err){ btn.disabled=false; btn.textContent='Continuar'; errEl.textContent = B4U.msgAmigavel(err); }
  }
  btn.addEventListener('click', submeter);
  document.getElementById('reenviar-mail').addEventListener('click', async ()=>{
    const errEl = document.getElementById('cod-err'); errEl.textContent='Reenviando…';
    try{ const d=await jsonp(API_URL+'?tipo=login_email_iniciar&email='+encodeURIComponent(email));
      errEl.textContent = d.encontrado ? 'Código reenviado. Confira o seu e-mail.' : 'E-mail não encontrado.'; otp.clear(); }
    catch(e){ errEl.textContent = 'Não consegui reenviar agora.'; }
  });
}

/* ---------- Colaborador: mesma porta, outro destino ----------
   Quem é da equipe não tem painel de cliente para abrir. O back devolve
   `destino` (colaborador?chave=CÓDIGO DO DIA) e a gente sai daqui.

   Se a pessoa tinha clicado num link direto de outra página da equipe, a
   guarda daquela página mandou ela para cá com ?destino=. Nesse caso o alvo é
   aquela página — só falta enxertar a chave do dia nela. É o que faz a volta
   ao ponto de partida funcionar em vez de largar todo mundo na home.

   Só caminho RELATIVO passa. `destino` chega pela URL, e URL é coisa que
   qualquer um escreve: sem esta checagem, um link
   index.html?destino=https://site-falso/… viraria um redirecionamento com a
   cara do painel — e ainda levando a chave do dia junto. */
function irParaEquipe(destinoDoBack){
  const relativo = (u)=> !!u && !/^[a-z]+:/i.test(u) && u.slice(0,2) !== '//';
  if(!relativo(destinoDoBack)) return false;

  const chave = new URLSearchParams((destinoDoBack.split('?')[1]||'').split('#')[0]).get('chave')||'';
  const pedido = new URLSearchParams(location.search).get('destino')||'';

  if(chave && relativo(pedido)){
    const [semHash, hash=''] = pedido.split('#');
    const [caminho, busca=''] = semHash.split('?');
    const qs = new URLSearchParams(busca);
    qs.set('chave', chave);
    location.href = caminho + '?' + qs.toString() + (hash ? '#'+hash : '');
  } else {
    location.href = destinoDoBack;
  }
  return true;
}

/* ---------- E-mail com acesso a várias empresas: escolher qual abrir ---------- */
function telaEscolherEmpresa(empresas){
  document.getElementById('miolo').innerHTML = `
    <div class="state">
      <h1>Escolha a empresa</h1>
      <p>O seu e-mail tem acesso a mais de uma empresa. Selecione qual você quer abrir.</p>
      <div class="escolha-empresas">
        ${empresas.map((e,i)=>`<button type="button" class="ac-btn ac-primary escolha-emp" data-i="${i}">${esc(e.nome||('Empresa '+e.id))}</button>`).join('')}
      </div>
    </div>`;
  document.querySelectorAll('.escolha-emp').forEach(b=>b.addEventListener('click', ()=>{
    const e = empresas[+b.dataset.i];
    location.hash = e.hash;
    OFERECER_CONFIAR = true;
    boot();
  }));
}

/* ---------- ID+empresa no link, mas falta/expirou o código pessoal ----------
 * A tela precisa DIZER o que aconteceu (o `msg` que o boot mandou) e, quando o que
 * caducou foi o link da empresa, não pode oferecer caixinhas: qualquer código pessoal
 * digitado ali seria remontado sobre a senha vencida e falharia de novo, sem explicação. */
async function telaAcessoExpirado(id, msg){
  pararEspera();
  const { codigo } = getIdCodigo();
  if(!(codigo||'').split('-')[0].trim())
    return telaLoginEmail('Este endereço está sem o código da empresa. Entre pelo seu e-mail que montamos o link certo.');
  if(falhaDeEmpresa(msg))
    return telaLoginEmail('Seu link de ontem venceu — peça um novo abaixo.');
  const aviso = /incompleto/i.test(String((msg && msg.message) || msg || ''))
    ? 'Este link abre a sua empresa, mas ainda falta dizer quem é você.'
    : (msg ? B4U.msgAmigavel(msg) : '');
  let opcoes = [];
  try{ const d = await jsonp(API_URL+'?id='+encodeURIComponent(id)+'&tipo=reenvio_opcoes'); opcoes = (d && d.opcoes) || []; }catch(e){}
  const wa = WA_ACESSO('Olá, preciso de ajuda com o acesso ao painel (ID '+id+').');
  document.getElementById('miolo').innerHTML = `
    <div class="state">
      <h1>Código de verificação</h1>
      ${aviso?`<p style="color:var(--amber-txt);font-weight:700;max-width:40ch">${esc(aviso)}</p>`:''}
      <p>Digite o seu código de acesso pessoal de 6 dígitos — o que você recebeu por e-mail.</p>
      ${boxesOTP()}
      <div class="ct-err" id="cod-err" style="min-height:18px"></div>
      <button type="button" class="ac-btn ac-primary" id="cod-continuar" style="min-width:220px">Continuar</button>
      <p style="margin-top:14px;color:var(--muted)">Não tem o código? Enviamos um novo para o seu e-mail:</p>
      <div class="reenvio" id="reenvio">
        ${opcoes.length
          ? opcoes.map(o=>`<button type="button" class="ac-btn reenvio-op" data-idx="${esc(o.idx)}">Enviar para ${esc(o.mascarado)}</button>`).join('')
          : `<p style="color:var(--muted)">Nenhum e-mail cadastrado para este acesso.</p>`}
      </div>
      <p style="margin-top:8px">Prefere entrar pelo e-mail? <button type="button" class="linklike" id="ir-email">Usar meu e-mail</button> · <a href="${wa}" target="_blank" rel="noopener" style="color:var(--brand-teal-txt);font-weight:700">atendimento</a></p>
    </div>`;
  const otp = wireOTP(()=>submeter());
  const errEl = document.getElementById('cod-err');
  function submeter(){
    // Confere os 6 dígitos ANTES de mexer na URL — igual à tela de código por e-mail.
    if(otp.val().length !== 6){ errEl.textContent = 'Digite os 6 dígitos.'; return; }
    errEl.textContent = '';
    const err = entrarComCodigo(otp.val()); if(err) errEl.textContent = err;
  }
  document.getElementById('cod-continuar').addEventListener('click', submeter);
  document.getElementById('ir-email').addEventListener('click', ()=>telaLoginEmail());
  document.querySelectorAll('.reenvio-op').forEach(b=>b.addEventListener('click', async ()=>{
    const box=document.getElementById('reenvio'); box.innerHTML='<div class="spin"></div>';
    try{
      const d = await jsonp(API_URL+'?id='+encodeURIComponent(id)+'&acao=reenviar_codigo&idx='+encodeURIComponent(b.dataset.idx));
      if(d.erro) throw new Error(d.erro);
      // Frase nossa, igual à do reenvio por e-mail. `d.mensagem` saiu daqui pelo mesmo
      // motivo das outras telas: é texto do servidor, e o do servidor num dia ruim é a
      // exceção do Apps Script — que não é assunto de quem só quer o código.
      box.innerHTML = `<p style="color:var(--brand-teal-txt);font-weight:700">Código reenviado. Confira o seu e-mail.</p>`;
    }catch(e){ box.innerHTML = `<p style="color:#8B2E22">${esc(B4U.msgAmigavel(e))}</p>`; }
  }));
}

function erro(){ return telaLoginEmail(); }   // sem id → entra pelo e-mail

/* ---------- Confiar neste aparelho (token no localStorage) ---------- */
function lerToken(){ try{ return localStorage.getItem('b4u_token'); }catch(e){ return null; } }
function salvarToken(t){ try{ localStorage.setItem('b4u_token', t); }catch(e){} }
/* Sair do aparelho apaga também o payload guardado: é dado financeiro dele, não pode
   sobreviver ao logout no navegador de ninguém. */
function limparToken(){ try{ localStorage.removeItem('b4u_token'); }catch(e){}
  if(window.B4U && B4U.limparCache) B4U.limparCache(); }
async function tentarToken(){
  const tok = lerToken(); if(!tok) return false;
  try{ const d = await jsonp(API_URL+'?tipo=entrar_token&token='+encodeURIComponent(tok));
    if(d && d.ok && d.hash){ location.hash = d.hash; return true; }
    limparToken(); }catch(e){}
  return false;
}
async function confiarNesteAparelho(id, codigo){
  const nav = (navigator.userAgent||'').slice(0,60);
  try{ const d = await jsonp(API_URL+'?id='+encodeURIComponent(id)+'&codigo='+encodeURIComponent(codigo)+'&acao=confiar_aparelho&aparelho='+encodeURIComponent(nav));
    if(d && d.ok && d.token){ salvarToken(d.token); return true; } }catch(e){}
  return false;
}
async function sairDesteAparelho(id, codigo){
  try{ await jsonp(API_URL+'?id='+encodeURIComponent(id)+'&codigo='+encodeURIComponent(codigo)+'&acao=revogar_aparelhos'); }catch(e){}
  limparToken();
  try{ localStorage.removeItem('b4u_pend_'+id); }catch(e){}
}
/* Oferta "confiar neste aparelho" — tela PRÓPRIA, mostrada UMA vez e SÓ no caminho de
 * sucesso, quando o backend já aceitou o código. `depois` continua de onde o boot
 * parou, sem pagar uma segunda chamada à API. */
function telaConfiarAparelho(depois){
  pararEspera();
  const { id, codigo } = getIdCodigo();
  const seguir = typeof depois === 'function' ? depois : boot;
  if(!(id && codigo)) return seguir();
  document.getElementById('miolo').innerHTML = `
    <div class="state">
      <div style="font-size:var(--fs-6);line-height:1;margin-bottom:4px">🔒</div>
      <h1>Confiar neste aparelho?</h1>
      <p>Se este aparelho é só seu, mantemos você conectado por <b>30 dias</b> sem pedir o código de novo.</p>
      <div class="id-form" style="gap:10px;align-items:center">
        <button type="button" class="ac-btn ac-primary" id="cf-sim" style="min-width:250px">Confiar neste aparelho — 30 dias</button>
        <button type="button" class="linklike" id="cf-nao">Agora não</button>
      </div>
      <div class="ct-err" id="cf-aviso" style="min-height:18px;max-width:40ch"></div>
      <p style="margin-top:12px;color:var(--muted);font-size:var(--fs-2)">Não ative em computadores públicos ou compartilhados.</p>
    </div>`;
  document.getElementById('cf-sim').addEventListener('click', async (e)=>{
    const b = e.currentTarget;
    b.disabled=true; b.textContent='Ativando…';
    if(await confiarNesteAparelho(id, codigo)) return seguir();
    // Não engolir a falha: ele clicou, esperou e precisa saber que não ficou guardado.
    const av=document.getElementById('cf-aviso');
    if(av) av.textContent='Não consegui guardar este aparelho agora. Você entrou normalmente — dá para tentar de novo mais tarde.';
    b.disabled=false; b.textContent='Tentar de novo';
    const n=document.getElementById('cf-nao'); if(n) n.textContent='Continuar assim mesmo';
  });
  document.getElementById('cf-nao').addEventListener('click', ()=> seguir());
}

/* Esqueleto da home enquanto o payload não chega — mesma silhueta do conteúdo real. */
function pintarEsqueleto(){
  const sk = (n,h)=> (window.B4U&&window.B4U.skeleton) ? window.B4U.skeleton(n,h) : '';
  document.getElementById('miolo').innerHTML = `
    <div class="saudacao" style="width:100%;max-width:560px">${sk(1,26)}${sk(1,15)}</div>
    <div class="grade" aria-hidden="true">
      <div class="b4u-skel" style="height:120px;width:100%"></div>
      <div class="b4u-skel" style="height:120px;width:100%"></div>
      <div class="b4u-skel" style="height:120px;width:100%"></div>
      <div class="b4u-skel" style="height:120px;width:100%"></div>
    </div>
    <p id="espera-txt" role="status" style="margin-top:20px;font-size:var(--fs-3);color:var(--muted)">Carregando o seu painel…</p>`;
}

/* A espera inteira — barra, porcentagem e frases — mora no b4u-espera.js. Estes dois
   nomes ficam porque há dezenas de chamadas espalhadas pela página. */
function comecarEspera(){ if (window.B4UEspera) B4UEspera.iniciar({ perfil:'cliente' }); }
function pararEspera(){
  /* Tirar o atributo do <body> antes de concluir: a espera automática só começa no
     DOMContentLoaded, e várias telas daqui (cache quente, login por e-mail, acesso
     expirado) ficam prontas ANTES disso. Sem esta linha o overlay subiria por cima de
     uma tela já pintada e só sairia pela trava de segurança. */
  if (document.body) document.body.removeAttribute('data-b4u-espera');
  if (window.B4UEspera) B4UEspera.concluir();
}

/* Tarja discreta sobre o conteúdo pintado a partir do cache. `null` remove. */
function tarjaAtualizando(texto){
  const miolo = document.getElementById('miolo'); if(!miolo) return;
  let t = document.getElementById('tarja-atu');
  if(texto === null){ if(t) t.remove(); return; }
  if(!t){ t = document.createElement('div'); t.id='tarja-atu'; t.className='tarja-atualizando';
    miolo.insertBefore(t, miolo.firstChild); }
  t.textContent = texto;
}
function horaDoCache(tipo, id){
  try{ const o = JSON.parse(localStorage.getItem(B4U.cacheChave(tipo,id))||'null');
    return o && o.ts ? new Date(o.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : ''; }
  catch(e){ return ''; }
}

async function boot(){
  const { id, codigo } = getIdCodigo();
  if (!(id && codigo)) { if(await tentarToken()) return boot(); }   // aparelho confiável entra sem código
  if (!id) return telaLoginEmail();                          // URL sem código → e-mail primeiro
  if (!codigo) return telaAcessoExpirado(id, 'incompleto');

  // Cache: a segunda visita começa pintada. Não vale quando a pessoa acabou de digitar
  // o código — aí a home antiga piscaria antes da tela de confiar.
  const cache = (!OFERECER_CONFIAR && window.B4U && B4U.cacheLer) ? B4U.cacheLer('links', id) : null;
  if (cache && cache.disponiveis){
    render(id, codigo, cache.disponiveis, cache.pessoa || null);
    tarjaAtualizando('Atualizando…');
  } else {
    pintarEsqueleto();
    comecarEspera();
  }

  try {
    const url = API_URL + '?id=' + encodeURIComponent(id) + '&codigo=' + encodeURIComponent(codigo) + '&tipo=links';
    const d = await jsonp(url);
    if (d.erro) throw new Error(d.erro);
    if (window.B4U && B4U.cacheGravar) B4U.cacheGravar('links', id, d);
    const pintar = () => render(id, codigo, d.disponiveis || {}, d.pessoa || null);
    if (OFERECER_CONFIAR && !lerToken()){ OFERECER_CONFIAR = false; return telaConfiarAparelho(pintar); }
    OFERECER_CONFIAR = false;
    pintar();
  } catch (e) {
    pararEspera();
    if(await tentarToken()) return boot();                   // código expirou mas o aparelho é confiável
    // Falha de rede com cache na tela: manter o que está lá é melhor que apagar tudo.
    // O teste continua sendo na mensagem da falha (é ela que diz se o acesso é o
    // problema); o que ela diz nunca chega à tela — só decide qual caminho seguir.
    if (cache && cache.disponiveis && !falhaDeEmpresa(e) && !/incompleto/i.test(String((e && e.message) || e || ''))){
      const h = horaDoCache('links', id);
      tarjaAtualizando('Não consegui atualizar agora — mostrando os dados' + (h?(' de '+h):' guardados') + '.');
      return;
    }
    OFERECER_CONFIAR = false;
    telaAcessoExpirado(id, e);   // sem chave pessoal / expirado -> tela de acesso
  }
}
boot();
