<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do cliente — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Duas origens porque o /exec responde 302 para a segunda: sem isto o aparelho paga
     DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte não pode segurar a primeira pintura: entra como preload e vira folha depois. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"></noscript>
<style>
:root{
  /* PALETA CANÔNICA — igual nas 7 páginas do cliente. Não redeclare tons aqui. */
  --canvas:#F1E7DC; --surface:#FFFFFF; --surface-warm:#FBF6EF;
  --ink:#113D39; --ink-2:#3F5854; --muted:#6E6256; --line:#E4D9C9; --line-2:#D6C3AC;
  --brand-dark:#073034; --brand-teal:#0F8C85; --brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,44:1 no receita-soft).
     Este é o mesmo teal escurecido só para texto e fundo de texto; o --brand-teal
     continua canônico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E; --amber-txt:#8A5A10; --vermelho:#C0392B; --verde:#2E9D5F;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber dá 2,61:1 e o --verde 3,44:1 com #fff; estes devolvem
     4,68:1 e 4,92:1. Como preenchimento de barra ou ícone, os originais continuam. */
  --amber-2:#B05F12; --verde-2:#25804C;
  /* Escala tipográfica — 6 passos, sem meio pixel. */
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:15px; --fs-5:19px; --fs-6:24px;
  /* Raios — 12 padrão, 16 para caixas grandes, 999 só para pílulas. */
/* Cantos: uma escala só, no site inteiro, e mais QUADRADA que redonda.
     4px  campo, selo, célula
     6px  cartão, linha da lista, botão
     8px  bloco grande e modal
   `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é
   citado em mais de cem regras, mas o valor agora acompanha o resto —
   pílula virou etiqueta. Círculo de verdade (avatar, contador, spinner)
   continua com border-radius:50% escrito na regra, e não passa por aqui. */
  --radius-sm:4px;--radius:6px;--radius-lg:8px;--radius-pill:6px;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  --brand-eucalipto2:var(--brand-euc);
  --receita-soft:#DBEFEC;
  /* Espaçamento e elevação — mesmos três degraus em todas as páginas do cliente. */
  --pad-sm: 14px 16px;
  --pad:    18px 20px;
  --pad-lg: 24px 26px;
  --lift:   0 8px 20px rgba(17,61,57,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
/* No Safari, focar campo com menos de 16px amplia a página sozinho. Só os campos. */
input,select,textarea{font-size:16px}
/* Amostra de cor da legenda — token compartilhado, um tamanho só em todas as páginas. */
.sw{width:10px;height:10px;border-radius:var(--radius-sm);flex-shrink:0;display:inline-block}
body{
  background:var(--canvas);color:var(--ink);font-family:var(--sans);
  min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:4px}

.topo{padding:28px 24px 0;text-align:center}
.logo{font-weight:800;font-size:var(--fs-6);letter-spacing:-.02em}
.logo .b{color:var(--brand-dark)} .logo .y{color:var(--brand-teal)}
/* Com o menu lateral montado a marca passa a ser a dele, e a folha do módulo já
   esconde este `.topo .logo`. A faixa ficaria como um vão de 28px sem nada dentro.
   Some a faixa, não o elemento: o `.topo` continua no DOM, e sem o módulo (sem a
   classe b4s no body) a home continua exatamente como era. */
body.b4s .topo{display:none}

/* Largura padrão do conteúdo — igual nas 7 páginas do cliente. */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}
@media(max-width:640px){.wrap{padding:0 14px 60px}}
.miolo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:32px}
.saudacao{text-align:center;margin-bottom:36px;max-width:560px}
.saudacao h1{font-size:var(--fs-6);font-weight:800;letter-spacing:-.01em}
.saudacao p{font-size:var(--fs-4);color:var(--ink-2);margin-top:10px;line-height:1.6}
.saudacao .cliente{font-size:var(--fs-2);color:var(--ink-2);font-weight:600;margin-top:10px}
.saudacao .tudo-em-dia{color:var(--brand-teal-txt);font-weight:700}
.acoes-chamado{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
/* Enquanto o chamado está segurado, o atalho para "meus chamados" também some — ele
   levaria a uma lista que ninguém consegue alimentar. Regra daqui, não do bloco. */
.acoes-chamado a[href*="meustickets"]{display:none!important}
.escolha-empresas{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:10px}
.escolha-emp{min-width:260px}
.ac-btn{font-family:var(--sans);font-size:var(--fs-3);font-weight:700;text-decoration:none;cursor:pointer;
  padding:11px 20px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:border-color .12s,transform .12s,box-shadow .12s}
.ac-btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.ac-btn.ac-primary{background:var(--brand-teal-txt);color:#fff;border-color:var(--brand-teal-txt);box-shadow:0 8px 18px -8px rgba(18,141,132,.6)}
.ac-btn.ac-primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.quem{margin-top:14px;font-size:var(--fs-2);color:var(--ink-2)}
.quem-trocar{background:none;border:0;color:var(--brand-teal-txt);font-weight:700;cursor:pointer;font-size:var(--fs-2);text-decoration:underline;padding:0 2px}
.confiar-row{margin-top:18px;font-size:var(--fs-2);color:var(--muted);text-align:center;line-height:1.6}
.conf-ok{color:var(--brand-teal-txt);font-weight:600}
.alertas-home{width:100%;max-width:680px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.alerta-card{display:flex;align-items:center;gap:12px;background:#FCEFE0;border:1px solid #F0D6B4;border-radius:var(--radius);
  padding:12px 15px;text-decoration:none;color:var(--ink);transition:border-color .12s,transform .12s}
.alerta-card:hover{border-color:#E0A96A;transform:translateY(-2px);box-shadow:var(--lift)}
/* Branco sobre --amber dá 2,61:1 — o "!" some dentro do círculo. Com --amber-2: 4,68:1. */
.alerta-ico{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--amber-2);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:var(--fs-4)}
.alerta-txt{flex:1;font-size:var(--fs-3);display:flex;flex-direction:column;gap:2px}
.alerta-txt span{font-size:var(--fs-2);color:var(--muted)}
/* O --amber-txt agora É #8A5A10: sobre este creme dá 5,19:1 (o antigo #B05F12
   dava 4,13:1 e reprovava). Um valor só, e pelo token. */
.alerta-seta{color:var(--amber-txt);font-weight:700}
/* Tarja de revalidação: pintamos com o cache e avisamos, discreto, que já estamos
   buscando o número novo. Some quando a resposta chega. */
.tarja-atualizando{width:100%;max-width:680px;margin:0 auto 12px;text-align:center;
  font-size:var(--fs-2);font-weight:600;color:var(--ink-2);background:var(--receita-soft);
  border-radius:var(--radius-pill);padding:6px 14px}
.id-form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;width:100%;max-width:380px}
.id-form input{flex:1;min-width:190px;font-family:var(--sans);font-size:16px;padding:11px 13px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
.id-form input:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.reenvio{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin:6px auto 0}
.reenvio-op{width:100%}
/* código de verificação — 6 caixinhas numéricas */
.otp{display:flex;gap:9px;justify-content:center;margin:14px 0 6px}
.otp-box{width:46px;height:56px;text-align:center;font-size:var(--fs-6);font-weight:700;font-family:var(--sans);
  color:var(--ink);border:1.5px solid var(--line-2);border-radius:var(--radius);background:var(--surface);caret-color:var(--brand-teal)}
.otp-box:focus{outline:none;border-color:var(--brand-teal);box-shadow:0 0 0 3px rgba(15,140,133,.16)}
.otp-box.ok{border-color:var(--brand-teal)}
@media(max-width:400px){.otp{gap:6px}.otp-box{width:42px;height:52px;font-size:var(--fs-5);border-radius:var(--radius-sm)}}
@media(max-width:340px){.otp-box{width:38px;height:48px;font-size:var(--fs-5)}}
/* "Colar código": discreto de propósito — quem tem autofill nem precisa olhar pra ele */
.otp-colar{background:none;border:1px solid var(--line-2);border-radius:var(--radius-pill);color:var(--brand-teal-txt);
  font:inherit;font-size:var(--fs-2);font-weight:700;padding:6px 14px;cursor:pointer}
.otp-colar:hover{border-color:var(--brand-teal);background:var(--surface-warm)}
.otp-colar[hidden]{display:none}
/* :empty some para a dica não abrir um buraco no meio da tela enquanto não tem o que dizer */
.otp-dica{font-size:var(--fs-2);color:var(--muted);max-width:34ch;line-height:1.45}
.otp-dica:empty{display:none}
.linklike{background:none;border:0;color:var(--brand-teal-txt);font-weight:700;cursor:pointer;font:inherit;padding:0}
.linklike:hover{text-decoration:underline}
/* overlay de contatos (bottom sheet no mobile, modal no desktop) */
.ov{position:fixed;inset:0;z-index:1000;background:rgba(7,48,52,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.ov{align-items:center;padding:24px}}
.sheet{position:relative;z-index:1010;background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media(min-width:640px){.sheet{border-radius:var(--radius-lg)}}
.sheet-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:var(--fs-4);font-weight:800}
.sheet-x{background:none;border:0;font-size:var(--fs-4);cursor:pointer;color:var(--muted)}
.sheet-body{padding:16px 20px 20px}
.sheet-note{font-size:var(--fs-2);color:var(--muted);line-height:1.5;margin-bottom:14px}
.ct-fld{margin-bottom:12px}
.ct-fld label{display:block;font-size:var(--fs-2);font-weight:700;color:var(--ink-2);margin-bottom:5px}
.ct-fld .ct-sub{font-weight:400;color:var(--muted)}
.ct-fld textarea{width:100%;font-family:var(--sans);font-size:16px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface-warm);color:var(--ink);resize:vertical;min-height:44px}
.ct-fld textarea:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.ct-err{color:#8B2E22;font-size:var(--fs-2);min-height:16px}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);padding-top:12px}
.sheet-foot .ac-btn{flex:1}
@media(min-width:640px){.sheet-foot .ac-btn{flex:0 0 auto}}
/* accordion de contatos (cada nome abre/fecha) */
.ct-acc{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;background:var(--surface);overflow:hidden}
.ct-acc.open{border-color:var(--brand-teal);box-shadow:0 2px 12px rgba(15,140,133,.09)}
.ct-acc-head{display:flex;align-items:center;gap:9px;padding:13px 14px;cursor:pointer;user-select:none}
.ct-acc-head:hover{background:var(--surface-warm)}
.ct-acc-name{flex:1;font-size:var(--fs-3);font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-chev{color:var(--muted);font-size:var(--fs-1);transition:transform .18s}
.ct-acc.open .ct-chev{transform:rotate(180deg)}
.ct-acc-body{display:none;padding:2px 14px 14px}
.ct-acc.open .ct-acc-body{display:block}
.ct-papel{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap}
.ct-papel.p{background:var(--brand-teal-txt);color:#fff}
.ct-papel.s{background:var(--surface-warm);color:var(--ink-2);border:1px solid var(--line)}
.ct-lbl{display:block;font-size:var(--fs-2);font-weight:700;color:var(--ink-2);margin:11px 0 4px}
.ct-mail{font-size:var(--fs-2);color:var(--ink-2);margin:6px 0 10px;word-break:break-all}
.ct-areas{display:flex;flex-wrap:wrap;gap:6px}
.ct-areas-wrap.oculto{display:none}
.ct-area-chip{font-size:var(--fs-1);font-weight:600;padding:2px 9px;border-radius:var(--radius-pill);background:var(--surface-warm);color:var(--muted);border:1px solid var(--line)}
.ct-area-chip.on{background:var(--receita-soft,#DBEFEC);color:var(--brand-dark);border-color:transparent}
.ct-in{width:100%;font-family:var(--sans);font-size:16px;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface-warm);color:var(--ink)}
.ct-in:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.ct-in[disabled],.ct-in[readonly]{opacity:.7}
.ct-area-chk{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-2);font-weight:600;color:var(--ink-2);background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius-pill);padding:5px 10px;cursor:pointer}
.ct-area-chk input{accent-color:var(--brand-teal)}
.ct-rm{margin-top:14px;background:none;border:0;color:#8B2E22;font-size:var(--fs-2);font-weight:700;cursor:pointer;padding:2px 0}
/* remoção em dois tempos: o primeiro clique só avisa, o segundo remove */
.ct-rm.confirmar{background:#F7EEEC;border:1px solid #E4C9C4;border-radius:var(--radius-sm);padding:7px 11px;margin-top:12px}
.ct-rm-desfazer{margin-left:10px;background:none;border:0;padding:0;font-family:inherit;font-size:var(--fs-2);
  font-weight:700;color:var(--ink-2);text-decoration:underline;cursor:pointer}
.ct-rm:hover{text-decoration:underline}
.ct-voce{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--brand-teal-txt);background:var(--surface-warm);border:1px solid var(--line);padding:3px 9px;border-radius:var(--radius-pill);white-space:nowrap}
.ct-selfnote{font-size:var(--fs-2);color:var(--muted);margin-top:14px}
/* Branco sobre --verde dá 3,44:1. O --verde-2 é o mesmo verde um degrau mais escuro
   (já declarado nas telas de equipe) e devolve 4,92:1 — a família de cor não muda. */
.ct-add{margin-top:10px;width:100%;background:var(--verde-2);color:#fff;border-color:transparent;font-weight:800}
.ct-add:hover{background:#178A4B}
/* #9A6B10 dava 3,84:1 no canvas. Pelo token: 4,85:1. */
.ct-warn{flex:1;font-size:var(--fs-2);font-weight:700;color:var(--amber-txt);display:flex;align-items:center;gap:6px}
.ct-danger{background:#8B2E22;color:#fff;border-color:transparent}

.grade{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:18px;max-width:680px;width:100%}
.grade.grade--uma{grid-template-columns:minmax(240px,340px);justify-content:center}
@media(max-width:560px){.grade{grid-template-columns:1fr}}
.opcao.opcao-destaque{grid-column:1/-1;border-color:var(--brand-teal);background:linear-gradient(135deg,rgba(18,141,132,.08),rgba(25,175,164,.05))}
.opcao.opcao-destaque .icone{background:var(--brand-teal);color:#fff}

.opcao{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--pad-lg);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;
  transition:transform .15s, box-shadow .15s; position:relative; overflow:hidden;
}
.opcao:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.opcao .icone{
  width:42px;height:42px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  background:var(--surface-warm);color:var(--brand-teal-txt);flex-shrink:0;
}
.opcao .icone svg{width:22px;height:22px}
.opcao h2{font-size:var(--fs-4);font-weight:700;letter-spacing:-.01em}
.opcao p{font-size:var(--fs-2);color:var(--muted);line-height:1.5}
/* A seta é a affordance de "isto abre". Em --line-2 dava 1,71:1 no branco — invisível
   para quem tem pouca acuidade. --muted, o mesmo token que dptopessoal/societario/
   meustickets já usam na seta deles: 5,92:1. */
.opcao .seta{position:absolute;top:24px;right:22px;color:var(--muted);font-size:var(--fs-4);transition:transform .15s, color .15s}
.opcao:hover .seta{transform:translateX(3px);color:var(--brand-teal-txt)}

footer{padding:18px 24px;text-align:center;font-size:var(--fs-2);color:var(--muted)}

.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:70vh;text-align:center;padding:0 24px;margin:0 auto}
.state h1{font-size:var(--fs-5);font-weight:700}
.state p{color:var(--muted);font-size:var(--fs-4);max-width:44ch}
.state code{background:var(--surface-warm);padding:2px 6px;border-radius:4px;border:1px solid var(--line);font-size:var(--fs-3)}
.spin{width:26px;height:26px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="config.js"></script>
<!-- A tela de espera vive num arquivo só, compartilhado por todas as páginas. Se ele
     não carregar, nada quebra: as chamadas são protegidas por `window.B4UEspera &&`. -->
<script src="b4u-espera.js" charset="utf-8"></script>
<!-- O menu lateral também mora num arquivo só: era ele ou continuar copiando a barra
     à mão em oito páginas. Se não carregar, a home fica exatamente como era — a
     chamada abaixo está protegida por `window.B4UShell &&` e a folha nunca entra. -->
<script src="b4u-shell.js" charset="utf-8"></script>
<style>
/* Identificador que chegou da planilha com dígito faltando. O número aparece
   como veio — inventar o zero deixaria um CNPJ inexistente com cara de certo —
   e ganha um sublinhado pontilhado âmbar mais o ⚠. O title diz quantos dígitos
   vieram, quantos deveriam vir e onde consertar. Cor só de aviso: âmbar, não
   vermelho, porque o cadastro não está errado, está incompleto na origem. */
.b4u-trunc{text-decoration:underline dotted var(--amber,#E8892E);text-underline-offset:2px;cursor:help}
.b4u-trunc-m{color:var(--amber-txt,#8A5A10);font-size:.85em;margin-left:3px;vertical-align:1px}
/* Só para leitor de tela: o ⚠ é aria-hidden, e sem isto quem não vê a tela não
   ficaria sabendo que o número está incompleto. */
.b4u-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* O mesmo aviso por extenso, dentro da ficha. Na lista cabe um ⚠; aqui, com o
   campo à vista e espaço para uma linha, cabe dizer o que aconteceu e o que
   fazer — que é o único jeito de o dado ser corrigido na origem. */
.fld-aviso{display:block;margin-top:4px;font-size:var(--fs-1,11px);line-height:1.35;
  color:var(--amber-txt,#8A5A10);font-weight:600}
</style>
<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a
   célula tem ponto e barra, o Sheets desiste e guarda texto.
   Onde não existe máscara canônica (telefone, inscrição), o valor vai como foi
   digitado: o conserto ali depende do patch do backend. */
function b4uParaPlanilha(valor,coluna){
  const s=b4uTexto(valor).trim();
  const t=b4uIdent(coluna);
  if(!s||!t||!/^\d+$/.test(s))return s;
  const d=b4uDigitos(s);
  if((t.tipo==='doc'||t.tipo==='cnpj')&&d.length===14)return b4uFmtDoc(d);
  if((t.tipo==='doc'||t.tipo==='cpf')&&d.length===11)return b4uFmtDoc(d);
  if(t.tipo==='cep'&&d.length===8)return b4uFmtCep(d);
  return s;
}
/* B4U-TEXTO:FIM */

      var cb='b4ucb_'+Math.random().toString(36).slice(2);
      var s=document.createElement('script');
      var t=setTimeout(function(){ limpa(); fail(new Error('A API não respondeu.')); }, JSONP_TETO);
      function limpa(){ clearTimeout(t); try{delete window[cb];}catch(e){window[cb]=undefined;} s.remove(); }
      window[cb]=function(d){ limpa(); ok(d); };
      s.onerror=function(){ limpa(); fail(new Error('Não consegui alcançar a API.')); };
      s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
      document.body.appendChild(s);
    });
  }
  /* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
     deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
     de espera segue correndo por cima, sem anunciar a segunda tentativa: avisar que
     "ainda estamos buscando" no meio da espera assusta e faz recarregar justamente
     quando a resposta já vinha. Erro só se a segunda também falhar. */
  function jsonp(url){
    return jsonpTentativa(url).catch(function(e){
      if(!jsonpRepetivel(url)) throw e;
      return new Promise(function(r){ setTimeout(r, JSONP_PAUSA); })
        .then(function(){ return jsonpTentativa(url); });
    });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* Traduz qualquer erro para uma frase que o cliente entende — e que não o culpa.
     `e.message` NUNCA vai para a tela: ele é vocabulário nosso, não dele. */
  function msgAmigavel(e){
    var m = String((e && e.message) || e || '');
    if (/API|alcançar|respondeu|network|timeout|Failed to fetch/i.test(m))
      return 'Não consegui falar com o sistema agora. Confira a sua internet e tente de '
           + 'novo em alguns segundos — nada do que você digitou foi perdido.';
    if (/restrito|acesso|código|senha|contato/i.test(m))
      return 'Este link não está mais valendo. Peça um novo acesso para a gente que '
           + 'reenviamos na hora.';
    return 'Deu um problema do nosso lado, não seu. A equipe já foi avisada. Se for '
         + 'urgente, chame no WhatsApp.';
  }

  /* A segunda visita não precisa recomeçar do esqueleto. Guardamos o último payload por
     6h e pintamos com ele na hora, com tarja de "atualizando"; quando a resposta chega,
     redesenhamos. Dado financeiro no aparelho dele — por isso prazo curto e limpeza no
     logout (B4U.limparCache), junto do aparelho confiável. */
  var CACHE_MS = 6 * 60 * 60 * 1000;
  function cacheChave(tipo, id){ return 'b4u_pl_' + tipo + '_' + id; }
  function cacheLer(tipo, id){
    try {
      var o = JSON.parse(localStorage.getItem(cacheChave(tipo, id)) || 'null');
      if (!o || (Date.now() - o.ts) > CACHE_MS) return null;
      return o.raw;
    } catch (e) { return null; }
  }
  function cacheGravar(tipo, id, raw){
    try { localStorage.setItem(cacheChave(tipo, id),
          JSON.stringify({ ts: Date.now(), raw: raw })); } catch (e) {}
  }
  function limparCache(){
    /* Sai o payload e sai também o b4u_disp_ (quais áreas o cliente tem): num aparelho
       compartilhado, a barra do próximo não pode herdar o mapa de painéis do anterior. */
    try { Object.keys(localStorage).forEach(function (k) {
          if (k.indexOf('b4u_pl_') === 0 || k.indexOf('b4u_disp_') === 0) localStorage.removeItem(k); }); } catch (e) {}
  }

  var IC = {

    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.1.3.7 1.1 1.4 1.7.9.8 1.6 1 1.9 1.2.3.1.5.1.6-.1.2-.2.7-.8.9-1 .2-.3.4-.2.6-.1.2.1 1.5.7 1.7.9.3.1.4.2.5.3.1.2.1.7-.1 1.3Z"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-6.5A8 8 0 1 1 21 12Z"/></svg>',
    help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.8 2.8 0 0 1 5.4 1c0 1.8-2.6 2.2-2.6 3.9"/><path d="M12 17.4h.01"/></svg>',
    chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 13 4 4L19 7"/></svg>',
    guias:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="m8.5 15 2 2 4-4"/></svg>',
    pessoal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><path d="M16 4.2c1.7.4 3 2 3 3.8s-1.3 3.4-3 3.8M23 20c0-2.8-2.3-5.1-5.4-5.8"/></svg>',
    fiscal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>',
    equiparacao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5Z"/><path d="m9 12 2 2 4-4"/></svg>'
  };

  var C = idc();
  var linkHome = 'index' + (C.id ? '#'+C.id+(C.codigo?'-'+C.codigo:'') : '');
  var linkTickets = 'meustickets' + (C.id ? '#'+C.id+(C.codigo?'-'+C.codigo:'') : '');
  var waHref = 'https://wa.me/'+WA+'?text='+encodeURIComponent('Olá, sou cliente back4you'+(C.id?' (ID '+C.id+')':'')+'.');

  // ---- links de área na própria barra --------------------------------------
  /* Do fiscal para a agenda não havia caminho: era voltar para a home e pagar outra
     chamada à API. Os links saem do `disponiveis` que a HOME já recebeu e gravou no
     aparelho (b4u_disp_<id>) — assim respeitam PAINEIS_OCULTOS e o acesso da pessoa
     sem esta página perguntar nada. Sem esse registro, só a agenda, que quem tem
     fiscal ou pessoal sempre tem. */
  var AREAS_LINK = [
    ['fiscal',      'Fiscal',       'fiscal',      IC.fiscal],
    ['dptopessoal', 'Pessoal',      'pessoal',     IC.pessoal],
    ['equiparacao', 'Equiparação',  'equiparacao', IC.equiparacao]
  ];
  function disponiveisSalvos(){
    try { var o = JSON.parse(localStorage.getItem('b4u_disp_'+C.id)||'null');
          return (o && (o.disponiveis || o)) || null; } catch(e){ return null; }
  }
  function linksDeArea(){
    var disp = disponiveisSalvos();
    var aqui = (location.pathname.split('/').pop()||'').toLowerCase().replace(/\.html?$/,'');
    /* Sem tirar o .html, quem entra por um link antigo (/fiscal.html) não casa
       com 'fiscal' da lista e a barra oferece um atalho para a página em que a
       pessoa já está. As duas formas de endereço continuam valendo. */
    return AREAS_LINK.filter(function(a){
      if (a[0].toLowerCase() === aqui) return false;                       // não linkar a página atual
      return !!(disp && disp[a[2]]);
    }).slice(0, 2)                                                          // 2 links: a barra ainda tem 3 botões fixos
     .map(function(a){
       /* b4u-nav: é esta classe que a folha do b4u-shell.js esconde quando o menu
          lateral está montado — o menu já diz isto, e melhor (sem o corte em 2).
          Não pode ser `.b4u-btn.ghost` sozinha: ela também veste botões que ficam. */
       return '<a class="b4u-btn ghost b4u-nav" href="'+esc(a[0]+(C.id?('#'+C.id+(C.codigo?'-'+C.codigo:'')):''))+'" '+
              'title="'+esc(a[1])+'">'+a[3]+'<span class="b4u-lbl">'+esc(a[1])+'</span></a>';
     }).join('');
  }

  // ---- barra fixa ----------------------------------------------------------
  var bar = document.createElement('div');
  bar.className = 'b4u-bar';
  bar.innerHTML =
    '<a class="b4u-logo" href="'+esc(linkHome)+'"><span>back</span><span class="y">4you</span></a>' +
    (CFG.home ? '' :
      // b4u-nav: mesma marca dos links de área — o menu lateral esconde este atalho
      // porque ele virou o item "Início" de lá. Escondido, nunca removido.
      '<a class="b4u-btn ghost b4u-nav" href="'+esc(linkHome)+'">'+IC.home+'<span class="b4u-lbl">Início</span></a>') +
    (CFG.home ? '' : linksDeArea()) +
    '<a class="b4u-btn wa" href="'+esc(waHref)+'" target="_blank" rel="noopener">'+IC.wa+'<span class="b4u-lbl">WhatsApp</span></a>' +
    '<button type="button" class="b4u-btn call" id="b4u-open">'+IC.chat+'<span class="b4u-lbl">Abrir chamado</span></button>' +
    '<button type="button" class="b4u-icobtn" id="b4u-help" title="Reportar um erro ou pedir ajuda" aria-label="Reportar um erro ou pedir ajuda">'+IC.help+'</button>';
  document.body.insertBefore(bar, document.body.firstChild);
  // publica a altura da barra p/ os cabeçalhos internos grudarem logo abaixo dela
  function medirBarra(){ document.documentElement.style.setProperty('--b4u-bar-h', bar.offsetHeight + 'px'); }
  medirBarra();
  window.addEventListener('resize', medirBarra);
  window.addEventListener('load', medirBarra);

  // ---- modal ---------------------------------------------------------------
  var ov = document.createElement('div');
  ov.className = 'b4u-ov';
  document.body.appendChild(ov);

  function fecharModal(){ ov.classList.remove('on'); ov.innerHTML=''; ESQ_ATUAL=''; }

  /* Fechar por clique no fundo ou Esc NÃO pode apagar o que ele escreveu. Só é
     "limpo" o que ainda for igual ao esqueleto pré-preenchido do tipo escolhido. */
  var ESQ_ATUAL = '';
  function modalSujo(){
    var t = ov.querySelector('#b4u-msg'), a = ov.querySelector('#b4u-assunto');
    if(!t) return false;
    return String(t.value||'').trim() !== String(ESQ_ATUAL||'').trim()
        || !!(a && a.value.trim());
  }
  function tentarFechar(){ if(modalSujo()) pedirDescartar(); else fecharModal(); }
  function montarFoot(){
    var foot = ov.querySelector('.b4u-foot'); if(!foot) return;
    foot.innerHTML =
      '<button type="button" class="b4u-btn cancel" id="b4u-cancel">Cancelar</button>' +
      '<button type="button" class="b4u-btn primary" id="b4u-send">Enviar chamado</button>';
    foot.querySelector('#b4u-cancel').addEventListener('click', tentarFechar);
    foot.querySelector('#b4u-send').addEventListener('click', enviar);
  }
  function pedirDescartar(){
    var foot = ov.querySelector('.b4u-foot'); if(!foot){ fecharModal(); return; }
    foot.innerHTML =
      '<button type="button" class="b4u-btn cancel" id="b4u-keep">Continuar escrevendo</button>' +
      '<button type="button" class="b4u-btn primary" id="b4u-discard">Descartar o que escrevi</button>';
    var err = ov.querySelector('#b4u-erro');
    if(err) err.textContent = 'Você escreveu algo neste chamado. Quer mesmo sair sem enviar?';
    foot.querySelector('#b4u-keep').addEventListener('click', function(){
      if(err) err.textContent=''; montarFoot();
      var t = ov.querySelector('#b4u-msg'); if(t) t.focus();
    });
    foot.querySelector('#b4u-discard').addEventListener('click', fecharModal);
  }

  function abrir(opts){
    opts = opts || {};
    var areaSel = opts.area || CFG.area || 'outros';
    var tipoSel = opts.tipo || 'livre';
    if (tiposDaArea(areaSel).indexOf(tipoSel) < 0) tipoSel = tiposDaArea(areaSel)[0];   // tipo válido p/ a área
    ov.innerHTML =
      '<div class="b4u-modal" role="dialog" aria-modal="true" aria-label="Abrir chamado">' +
        '<h3>Abrir um chamado</h3>' +
        '<div class="b4u-sub">Registramos aqui e retornamos em até 48h úteis. Você pode acompanhar em “Meus chamados”.</div>' +
        '<div class="b4u-fld"><label for="b4u-area">Área</label><select id="b4u-area">' +
          AREAS.map(function(a){ return '<option value="'+a[0]+'"'+(a[0]===areaSel?' selected':'')+'>'+esc(a[1])+'</option>'; }).join('') +
        '</select></div>' +
        '<div class="b4u-fld"><label for="b4u-tipo">Tipo de solicitação</label><select id="b4u-tipo">' +
          opcoesTipo(areaSel, tipoSel) +
        '</select></div>' +
        '<div class="b4u-fld"><label for="b4u-assunto">Assunto</label><input id="b4u-assunto" maxlength="120" placeholder="Resumo em uma linha"></div>' +
        '<div class="b4u-fld"><label for="b4u-msg">Mensagem</label><textarea id="b4u-msg" placeholder="Descreva o que você precisa…"></textarea></div>' +
        '<div class="b4u-fld"><label for="b4u-file">Anexo <span style="font-weight:400;color:#6E6256">(opcional · até 10 MB)</span></label>' +
          '<input type="file" id="b4u-file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.doc,.docx,.xls,.xlsx,.csv,.txt,.xml,.ofx,.zip"></div>' +
        '<div class="b4u-fld" id="b4u-tipodoc-wrap" style="display:none">' +
          '<label for="b4u-tipodoc">Tipo do documento</label><select id="b4u-tipodoc">' +
            DOCTIPOS.map(function(d){ return '<option value="'+d[0]+'">'+esc(d[1])+'</option>'; }).join('') +
          '</select>' +
          '<div class="b4u-sub" style="padding:6px 0 0">Enviamos seu arquivo direto para a pasta certa do seu programa.</div>' +
        '</div>' +
        '<div class="b4u-err" id="b4u-erro"></div>' +
        '<div class="b4u-foot">' +
          '<button type="button" class="b4u-btn cancel" id="b4u-cancel">Cancelar</button>' +
          '<button type="button" class="b4u-btn primary" id="b4u-send">Enviar chamado</button>' +
        '</div>' +
      '</div>';
    ov.classList.add('on');
    var selTipo = ov.querySelector('#b4u-tipo');
    var txt = ov.querySelector('#b4u-msg');
    function aplicaSkeleton(force){
      var esq = TIPOS[selTipo.value] ? TIPOS[selTipo.value][1] : '';
      if(force || !txt.value.trim()) txt.value = esq;
      ESQ_ATUAL = esq;                 // referência do que ainda é "vazio", não texto dele
    }
    aplicaSkeleton(true);
    selTipo.addEventListener('change', function(){ aplicaSkeleton(true); txt.focus(); });
    // trocar a ÁREA repovoa os tipos válidos para ela
    ov.querySelector('#b4u-area').addEventListener('change', function(){
      selTipo.innerHTML = opcoesTipo(this.value, selTipo.value);
      aplicaSkeleton(true);
    });
    ov.querySelector('#b4u-cancel').addEventListener('click', tentarFechar);
    ov.addEventListener('click', function(e){ if(e.target===ov) tentarFechar(); });
    ov.querySelector('#b4u-send').addEventListener('click', enviar);
    // o seletor de "tipo do documento" só aparece quando há um arquivo anexado
    var fileEl = ov.querySelector('#b4u-file');
    var tdWrap = ov.querySelector('#b4u-tipodoc-wrap');
    fileEl.addEventListener('change', function(){
      tdWrap.style.display = (fileEl.files && fileEl.files.length) ? 'block' : 'none';
    });
    ov.querySelector('#b4u-assunto').focus();
  }

  function enviar(){
    var cc = idc();
    var erroEl = ov.querySelector('#b4u-erro');
    var btn = ov.querySelector('#b4u-send');
    erroEl.textContent = '';
    if(!cc.id || !cc.codigo){ erroEl.textContent = 'Abra o painel pelo seu link (com ID e código) para enviar um chamado.'; return; }
    var area = ov.querySelector('#b4u-area').value;
    var tipo = ov.querySelector('#b4u-tipo').value;
    var assunto = ov.querySelector('#b4u-assunto').value.trim();
    var msg = ov.querySelector('#b4u-msg').value.trim();
    if(!msg){ erroEl.textContent = 'Escreva a mensagem do chamado.'; return; }
    var fileEl = ov.querySelector('#b4u-file');
    var file = fileEl && fileEl.files && fileEl.files[0];
    if(file && file.size > 10*1024*1024){ erroEl.textContent = 'O anexo tem mais de 10 MB. Envie um arquivo menor.'; return; }
    btn.disabled = true; btn.textContent = 'Enviando…';
    var falhou = function(e){ btn.disabled=false; btn.textContent='Enviar chamado'; erroEl.textContent = msgAmigavel(e); };
    if(file){
      // COM arquivo -> POST (JSONP/GET não comporta base64)
      var reader = new FileReader();
      reader.onload = function(){
        var base64 = String(reader.result||'').split(',')[1] || '';
        var tdEl = ov.querySelector('#b4u-tipodoc');
        var tipoDoc = (tdEl && tdEl.value) ? tdEl.value : 'principal';
        var body = JSON.stringify({ id:cc.id, codigo:cc.codigo, acao:'ticket_anexo',
          area:area, tipo:tipo, assunto:assunto, mensagem:msg, tipo_documento:tipoDoc,
          arquivo_nome:file.name, arquivo_tipo:file.type, arquivo_base64:base64 });
        fetch(api(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body })
          .then(function(r){ return r.json(); })
          .then(function(d){ if(d && d.erro) throw new Error(d.erro); sucesso(); })
          .catch(falhou);
      };
      reader.onerror = function(){ falhou(new Error('Não consegui ler o arquivo.')); };
      reader.readAsDataURL(file);
      return;
    }
    // SEM arquivo -> JSONP como sempre
    var qs = new URLSearchParams({ id:cc.id, codigo:cc.codigo, acao:'ticket',
      area:area, tipo:tipo, assunto:assunto, mensagem:msg });
    jsonp(api()+'?'+qs.toString()).then(function(d){
      if(d && d.erro) throw new Error(d.erro);
      sucesso();
    }).catch(falhou);
  }

  function sucesso(){
    ov.innerHTML =
      '<div class="b4u-modal">' +
        '<div class="b4u-ok">' +
          '<div class="chk">'+IC.chk+'</div>' +
          '<h3>Chamado registrado</h3>' +
          '<p>Recebemos sua solicitação e retornamos em até 48h úteis. Em breve o acompanhamento também chegará por e-mail.</p>' +
          '<div class="b4u-foot" style="position:static;padding:0">' +
            '<button type="button" class="b4u-btn cancel" id="b4u-fecha">Fechar</button>' +
            '<a class="b4u-btn primary" id="b4u-ir-tickets" href="'+esc(linkTickets)+'">Ir para meus chamados</a>' +
          '</div>' +
        '</div>' +
      '</div>';
    ov.querySelector('#b4u-fecha').addEventListener('click', fecharModal);
    // Se já estou em meus chamados, trocar só o hash não recarrega — força o reload
    // para o novo chamado aparecer. Em outra página, navega normalmente.
    ov.querySelector('#b4u-ir-tickets').addEventListener('click', function(e){
      if (/\/meustickets(\.html)?$/i.test(location.pathname)){
        e.preventDefault();
        if (C.id) location.hash = C.id + (C.codigo ? '-'+C.codigo : '');
        location.reload();
      }
    });
  }

  bar.querySelector('#b4u-open').addEventListener('click', function(){ abrir({}); });
  bar.querySelector('#b4u-help').addEventListener('click', function(){ abrir({ area:'outros', tipo:'livre' }); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && ov.classList.contains('on')) tentarFechar(); });

  // ---- Puxar para atualizar (mobile) --------------------------------------
  // Só age quando a página está no topo e o gesto é para baixo; recarrega ao soltar
  // depois do limiar. Não atrapalha a rolagem normal.
  (function(){
    var ind=document.createElement('div'); ind.className='b4u-ptr';
    ind.innerHTML='<span class="ring"></span><span class="txt">Puxe para atualizar</span>';
    document.body.appendChild(ind);
    var y0=null, dist=0, LIM=70, ativo=false;
    function topo(){ return (window.scrollY||document.documentElement.scrollTop||0)<=0; }
    window.addEventListener('touchstart',function(e){
      if(e.touches.length!==1 || !topo() || (ov&&ov.classList.contains('on'))){ y0=null; return; }
      y0=e.touches[0].clientY; ativo=true;
    },{passive:true});
    window.addEventListener('touchmove',function(e){
      if(!ativo||y0===null) return;
      dist=e.touches[0].clientY - y0;
      if(dist<=0){ ind.style.height='0'; return; }
      if(!topo()){ ativo=false; ind.style.height='0'; return; }
      var h=Math.min(dist*0.5, LIM+20); ind.style.height=h+'px';
      ind.querySelector('.txt').textContent = dist>LIM?'Solte para atualizar':'Puxe para atualizar';
    },{passive:true});
    window.addEventListener('touchend',function(){
      if(!ativo){ return; } ativo=false;
      if(dist>LIM){ ind.classList.add('spin'); ind.style.height=(LIM)+'px'; ind.querySelector('.txt').textContent='Atualizando…'; setTimeout(function(){ location.reload(); },150); }
      else { ind.style.height='0'; }
      y0=null; dist=0;
    });
  })();

  window.B4U = { __ready:true, area: CFG.area||'outros', abrirChamado: abrir, meusTickets: linkTickets,
    msgAmigavel: msgAmigavel,
    CACHE_MS: CACHE_MS, cacheChave: cacheChave, cacheLer: cacheLer,
    cacheGravar: cacheGravar, limparCache: limparCache,
    // helper de skeleton: devolve N barrinhas "carregando" (as páginas usam no lugar do spinner)
    skeleton: function(linhas, alt){ var h=alt||16, g=[]; for(var i=0;i<(linhas||3);i++){
      var w=[92,78,85,60][i%4]; g.push('<div class="b4u-skel" style="height:'+h+'px;width:'+w+'%;margin:0 auto 12px"></div>'); }
      return g.join(''); } };
})();

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getIdCodigo(){
  const qs = new URLSearchParams(location.search);
  let id = qs.get('id') || '';
  let codigo = qs.get('codigo') || '';
  if (!id){
    const h = location.hash.replace('#','').trim();
    const comCodigo = h.match(/^(\d+)-(.+)$/);
    const soId = h.match(/^(\d+)$/);
    if (comCodigo) { id = comCodigo[1]; codigo = comCodigo[2]; }
    else if (soId) { id = soId[1]; }
  }
  return { id: id.replace(/\D/g,''), codigo: codigo.trim() };
}

/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Vazia de propósito: ela existia só para escrever frases de espera na tela. Quem
   mostra (e troca) o que aparece durante a espera agora é o b4u-espera.js. A função
   continua aqui porque é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){
  return new Promise((ok,fail)=>{
    const cb = 'cb_'+Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(()=>{ limpa(); fail(new Error('A API não respondeu.')); }, JSONP_TETO);
    function limpa(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { limpa(); ok(d); };
    s.onerror = () => { limpa(); fail(new Error('Não consegui alcançar a API.')); };
    s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
    document.body.appendChild(s);
  });
}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela de
   espera segue correndo por cima, sem anunciar a segunda tentativa: avisar que "ainda
   estamos buscando" no meio da espera assusta e faz recarregar justamente quando a
   resposta já vinha. Erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}

const ICONES = {

  pessoal:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><path d="M16 4.2c1.7.4 3 2 3 3.8s-1.3 3.4-3 3.8M23 20c0-2.8-2.3-5.1-5.4-5.8"/></svg>',
  equiparacao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5Z"/><path d="m9 12 2 2 4-4"/></svg>',
  guias:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="m8.5 15 2 2 4-4"/></svg>',
