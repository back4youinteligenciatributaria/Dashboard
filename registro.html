<html lang="pt-BR">

<style>
/* B4U-DESIGN:INICIO — paleta, cantos e fonte que as 22 páginas dividem.
   Bloco copiado de b4u-design.css (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-design.js`.

   Entra ANTES do <style> da página de propósito — é a camada base. Se esta
   página precisar mesmo de um valor diferente, redeclare o token no `:root`
   dela, que vem depois e vence. */
:root{
  /* ── Superfícies ─────────────────────────────────────────────────────────
     `--canvas` é o bege do fundo da página; `--surface` é o branco do cartão
     que se apoia nele; `--surface-warm` é o branco quebrado das faixas e
     cabeçalhos de tabela, que separam sem precisar de borda. */
  --canvas:#F1E7DC;
  --surface:#FFFFFF;
  --surface-warm:#FBF6EF;

  /* ── Letra ───────────────────────────────────────────────────────────────
     `--ink` é o texto normal, `--ink-2` o secundário, `--muted` o rótulo.
     `--muted` já foi #8A7D70 e reprovava em contraste (3,28:1); #6E6256 dá
     4,85:1 no bege e 5,92:1 no branco, e é a cor de quase todo rótulo do
     sistema — por isso ela precisa passar, e não só quase. */
  --ink:#113D39;
  --ink-2:#3F5854;
  --muted:#6E6256;

  /* ── Traços ──────────────────────────────────────────────────────────────
     `--line` divide o que é do mesmo grupo; `--line-2` fecha o que é caixa. */
  --line:#E4D9C9;
  --line-2:#D6C3AC;

  /* ── Marca ───────────────────────────────────────────────────────────────
     `--brand-teal` é canônico em logo, foco, borda e série de gráfico. Como
     TEXTO ele reprova (4,11:1 no branco, 3,44:1 no receita-soft), e para isso
     existe o `--brand-teal-txt`: o mesmo teal escurecido, 5,54:1 no branco e
     4,54:1 no bege, usado só onde é letra ou fundo de letra. Os dois são a
     mesma cor com dois trabalhos. O 4,54:1 passa, mas passa RASPANDO: quem for
     escurecer o `--canvas` um dia tem de conferir este par antes. */
  --brand-dark:#073034;
  --brand-teal:#0F8C85;
  --brand-euc:#3FA680;
  --brand-teal-txt:#0C756F;

  /* ── SINAL: as quatro cores que querem dizer alguma coisa ────────────────
     Estas quatro NÃO seguem o tema (ver OS QUATRO TEMAS, no fim do arquivo). Se
     "vencido" mudasse de vermelho conforme a pele escolhida, a cor deixaria de
     ser informação e viraria decoração — e quem trabalha nesta tela o dia
     inteiro lê a cor antes de ler a palavra.

     `--amber` tem 2,61:1 no branco: serve de PREENCHIMENTO e de borda, nunca de
     letra. Para letra âmbar existe o `--amber-txt` (5,91:1 no branco).

     ┌── PENDÊNCIA CONHECIDA: `--verde` E `--vermelho` REPROVAM COMO LETRA ────┐
     │                                                                        │
     │ Os dois NÃO têm o par `-txt` que o âmbar tem, e são usados nas duas     │
     │ funções ao mesmo tempo:                                                │
     │                                                                        │
     │     --verde     12 usos como `color`, 11 como `background`, 7 em borda │
     │     --vermelho  41 usos como `color`, 31 como `background`, 41 em borda │
     │                                                                        │
     │ E o lado TEXTO reprova. Medido nos valores atuais:                     │
     │                                                                        │
     │     --verde     #2E9D5F   2,82:1 no bege · 3,44:1 no branco   REPROVA  │
     │     --vermelho  #C0392B   4,46:1 no bege · 5,43:1 no branco   raspando │
     │                                                                        │
     │ O mínimo para texto é 4,5:1. É a mesma falha do `--muted` antigo (que   │
     │ dava 3,28:1), e atinge `.hint.ok` e `.lk.ok`, que são letra e nada      │
     │ mais. Há prova de que alguém já tinha esbarrado nisso sem nomear: o     │
     │ `.det-fbtn.ativo` escreve `color:#0E5B37` à mão — um verde bem mais     │
     │ escuro — em vez de usar o token.                                       │
     │                                                                        │
     │ CONSERTO MEDIDO E NÃO APLICADO (decisão de 10/08/2026):                 │
     │                                                                        │
     │     --verde     #2E9D5F -> #1F7546   (2,82:1 -> 4,66:1 no bege)        │
     │     --vermelho  #C0392B -> #BB3728   (4,46:1 -> 4,66:1 no bege)        │
     │                                                                        │
     │ Matiz e saturação ficam onde estão; só a luminosidade desce, o mínimo   │
     │ para passar com folga. Escurecer é seguro pelo lado do FUNDO: TODAS as  │
     │ regras `background:var(--verde)` / `background:var(--vermelho)` já vêm  │
     │ com `color:#fff` (ou são faixa/pontinho sem texto), e fundo mais escuro │
     │ com letra branca só melhora.                                           │
     │                                                                        │
     │ POR QUE NÃO FOI APLICADO AGORA: mexer nestes dois repinta as 22         │
     │ páginas, inclusive as 8 do cliente. A rodada que centralizou os tokens  │
     │ era de ESTRUTURA — nenhum pixel de cor mudou nela de propósito, para    │
     │ que qualquer diferença que aparecesse em produção tivesse uma causa só. │
     │ Trocar cor é decisão de produto e vai junto da varredura do MODO        │
     │ ESCURO, que já vai ter de abrir os 22 arquivos.                         │
     │                                                                        │
     │ QUANDO FOR FAZER, olhe também o `--verde-2`: várias páginas o declaram  │
     │ valendo #25804C, com a nota "o verde um degrau mais escuro, para virar  │
     │ FUNDO de texto branco". Com o conserto acima, o `--verde` do núcleo     │
     │ fica MAIS ESCURO que o `--verde-2`, e a convenção do sufixo -2 se       │
     │ inverte nesse par. Não dá para resolver daqui: o `--verde-2` mora no    │
     │ `:root` de cada página.                                                │
     └────────────────────────────────────────────────────────────────────────┘

     (Escrito assim, sem dois-pontos colado no nome, de propósito: a
     `tokensCanonicos()` do `_aplica-design.js` varre este bloco com um regex de
     declaração e NÃO pula comentário. Nome de token seguido de dois-pontos aqui
     dentro vira token canônico de mentira, e o `--verde-2` de mentira faria as
     22 páginas aparecerem como "exceção mantida" no terminal. Vale para todo
     comentário deste arquivo: cite o token, nunca o escreva como declaração.) */
  --amber:#E8892E;
  --amber-txt:#8A5A10;
  --vermelho:#C0392B;
  --verde:#2E9D5F;

  /* ── Cantos ──────────────────────────────────────────────────────────────
     Uma escala só, no site inteiro, e mais QUADRADA que redonda.
       4px  campo, selo, célula
       6px  cartão, linha da lista, botão
       8px  bloco grande e modal
     `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é citado
     em mais de cem regras, mas o valor acompanha o resto — pílula virou
     etiqueta. Círculo de verdade (avatar, contador, spinner) continua com
     `border-radius:50%` escrito na regra e não passa por aqui. */
  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-pill:6px;

  /* ── Escala tipográfica ──────────────────────────────────────────────────
     Seis degraus, e o pulo entre eles é de propósito irregular: 11-12-13 é a
     faixa de rótulo, selo e nota de rodapé, onde 1px já muda a hierarquia; 15 é
     o corpo; 19 e 24 são título de bloco e de tela. Um degrau constante (1,2×,
     por exemplo) daria 11-13-16-19-23-28 e gastaria três tamanhos na faixa em
     que o olho não distingue nada.
     ATENÇÃO: o `body{font-size:15px}` das páginas está escrito à mão e NÃO sai
     daqui. Quem mexer na escala não muda o corpo do texto; muda só quem usa
     `var(--fs-N)` — que é rótulo, selo, cabeçalho de tabela e título. */
  --fs-1:11px;
  --fs-2:12px;
  --fs-3:13px;
  --fs-4:15px;
  --fs-5:19px;
  --fs-6:24px;

  /* ── Fonte ───────────────────────────────────────────────────────────────
     Montserrat vem do Google Fonts, declarado no <head> de cada página. O
     `system-ui` é o que aparece enquanto ela não chega — e é o que fica se ela
     não chegar nunca. */
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
/* B4U-DESIGN:FIM */
</style>
<style>
:root{
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,37:1 no canvas).
     Este e o mesmo teal escurecido so para letra e fundo de letra; o --brand-teal
     segue canonico em logo, foco, bordas e preenchimentos. */
  --amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber da 2,61:1 com #fff, o --amber-2 da 4,68:1. Como
     preenchimento de barra, icone ou borda, o --amber original continua valendo. */
  --amber-2:#B05F12;
  --verde-2:#25804C;
  /* Escala de texto e o teal claro: as outras telas ja tinham, esta nao. Sem eles
     o CSS compartilhado da regua de acoes cai no valor herdado e desalinha. */
  --receita-soft:#DBEFEC;
  /* Levantar de cartao clicavel: uma sombra so, igual em todas as telas. */
  --lift:0 8px 20px rgba(17,61,57,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- barra superior (igual às páginas irmãs) ---------- */
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:var(--radius-pill);white-space:nowrap}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd;white-space:nowrap}
.barra a.volta,.barra a.plan{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.barra a.plan{border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:4px 11px}
.save-status{font-size:13px;font-weight:800;padding:6px 13px;border-radius:var(--radius-pill);background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
/* O MESMO indicador aparece em dois lugares: a faixa da barra escura e o rodape
   do modal de cadastro (claro). So o estado neutro precisa de outra tinta — o da
   barra e feito para fundo escuro e sumiria no branco. Vem ANTES dos estados
   coloridos de proposito: mesma especificidade, quem vier depois ganha. */
.save-status.claro{background:var(--surface-warm);color:var(--ink-2)}
/* Branco sobre --amber da 2,61:1 e sobre --verde 3,44:1 — o rotulo do proprio
   status de gravacao some. Um degrau mais escuro na MESMA familia: 4,68:1 e 4,92:1. */
.save-status.saving{background:var(--amber-2);color:#fff}.save-status.ok{background:var(--verde-2);color:#fff}.save-status.err{background:var(--vermelho);color:#fff}

/* ---------- topo: busca + chips ---------- */
.topo{padding:14px 16px 6px}
.linha-busca{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.busca{flex:1;min-width:0;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.btn-novo{flex:none;white-space:nowrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;font-weight:700;border-radius:var(--radius-pill);padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--brand-teal)}
.chip.on{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.chip.falta.on{background:var(--amber);border-color:var(--amber)}
.chip.limpar{border-style:dashed;color:var(--muted)}
.chip .n{background:rgba(0,0,0,.10);border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.dica{font-size:12px;color:var(--muted);padding:8px 16px 0}

/* ---------- ordenação ---------- */
.chips .rot{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px;align-self:center}
.ord-row{margin-top:7px}
.chip .ord{margin-left:5px;font-size:11px;opacity:.9}
.ord-info{font-size:12px;color:var(--muted);font-weight:700;margin-top:7px}
.ord-info b{color:var(--ink-2)}

/* ---------- selo de completude ---------- */
.selo{font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap;letter-spacing:.2px;
  background:#EEF3F1;color:#4a6360;border:1px solid #D9E5E2;cursor:help}
.selo.ok{background:#E6F3EC;color:#1f6b45;border-color:#BFE0CD}
.selo.alerta{background:var(--amber-soft);color:#8a5117;border-color:var(--amber-line)}

/* ---------- cards de resumo (mesmo padrão do certificados.html) ---------- */
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:10px 16px 0}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.rhead{padding:9px 13px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff}
.rcard.incompletos .rhead{background:var(--amber)}
.rcard.semdado .rhead{background:#6B8486}
.rcard.semdado2 .rhead{background:var(--brand-teal-txt)}
.rhead .n{background:rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:2px 9px;font-size:12px}
.rlista{max-height:158px;overflow:auto;padding:5px}
.tk{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px}
.tk:hover{background:var(--surface-warm)}
.tk .d{font-weight:800;white-space:nowrap;color:var(--brand-teal-txt)}
.tk .lb{color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .tp{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.rvazio{color:var(--muted);font-size:12px;padding:9px}
@media(max-width:760px){.resumo{grid-template-columns:1fr}}

/* ---------- lista de clientes ---------- */
.lista{padding:12px 16px 48px;display:flex;flex-direction:column;gap:8px}
.cli{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cli.aberto{border-color:var(--brand-teal);box-shadow:0 5px 20px rgba(7,48,52,.10)}
/* Situação do cliente: faixa lateral colorida para bater o olho na lista fechada
   e ver na hora quem não está ativo — sem precisar abrir o cadastro. */
.cli.sit-inativando,.cli.aberto.sit-inativando{border-left:4px solid var(--amber)}
.cli.sit-inativo,.cli.aberto.sit-inativo{border-left:4px solid var(--vermelho)}
/* ---------- a linha da lista: colunas-chave alinhadas, respiro de lista ----------
   Sete colunas por linha (ID · Nome · CNPJ/CPF · Cidade · Produtos · Início ·
   Situação) e o resto do cadastro no modal. NÃO é <table> de propósito: a grade
   do CSS convive com os cartões e os blocos recolhíveis que já existem aqui, e
   uma tabela obrigaria a reescrever tudo o que pinta a lista.
   O cabeçalho (.lista-cab) repete a MESMA régua de colunas — as duas larguras
   moram na mesma regra justamente para não desalinharem quando alguém mexer. */
.lista-cab,.cli-head{display:grid;
  /* O nome e o que a pessoa procura na lista, e era o primeiro a ser cortado —
     "AJUB - Cirurgia de Cab…" nao identifica ninguem. Ele leva o maior peso; a
     coluna de produtos cede, porque ali o corte ja e explicito, com o "+N". */
  grid-template-columns:60px minmax(0,2.2fr) 142px minmax(0,.9fr) minmax(0,2fr) 96px minmax(0,146px);
  gap:12px;align-items:center}
.lista-cab{padding:2px 14px 0;font-size:var(--fs-1);font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted)}
/* O cabeçalho é O CONTROLE de ordenação da tela: cada rótulo é um botão de
   verdade (Tab chega nele, Enter e Espaço ordenam), o primeiro clique ordena
   A→Z e o segundo inverte. Era isto e mais um <select> "Ordenar por" na régua
   de cima; o dono tirou o select — "deixa se ele clicar em qualquer um dos
   títulos da tabela ele ordena de A a Z ou oposto" —, então este cabeçalho
   passou a ser o único caminho e precisa aguentar o peso: alvo de toque de
   44px (o rótulo tem 11px, o dedo não tem) e presença TAMBÉM abaixo de 900px,
   onde ele sumia junto com a grade e levaria a ordenação embora.
   O 44px é altura de verdade, e não uma sobreposição invisível: um ::after
   esticado avançaria por cima da primeira linha da lista e roubaria o clique
   que abre o cadastro. */
.lista-cab button{font:inherit;color:inherit;background:none;border:0;padding:0 2px;cursor:pointer;
  text-transform:inherit;letter-spacing:inherit;text-align:inherit;
  display:inline-flex;align-items:center;min-height:44px;min-width:44px}
.lista-cab button:hover{color:var(--brand-teal-txt)}
.lista-cab button:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px;border-radius:var(--radius-sm)}
/* A coluna ativa fica em teal escuro e 900: sem isto a única marca da ordem em
   vigor seria a setinha, que tem 9px. */
.lista-cab button[aria-current]{color:var(--brand-teal-txt);font-weight:900}
/* Rótulo "Ordenar" da tira do celular. No desktop ele não existe: `display:none`
   o tira da GRADE, e é por isso que as sete colunas continuam sete. */
.lista-cab .cab-rot{display:none}
/* A última célula guarda DUAS ordens porque a coluna mostra duas coisas: o selo
   de situação e o selo de completude ("3 campos vazios"). "Campos vazios" era a
   única entrada do antigo "Ordenar por" sem coluna própria — e ela é justamente
   a que acha o cadastro mais atrasado. Em vez de sumir, ela virou o segundo
   botão da célula em que o selo já mora. */
.lista-cab .dois{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.cli-head{width:100%;text-align:left;background:none;border:0;padding:12px 14px;
  cursor:pointer;font-family:var(--sans);color:inherit}
.cli-head:hover{background:var(--surface-warm)}
/* O .cli tem overflow:hidden e o contorno global (offset 2px) sairia cortado na
   borda do cartão: aqui ele entra para dentro, senão o foco de teclado some. */
.cli-head:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.c-id{font-size:var(--fs-2);font-weight:700;color:var(--muted);white-space:nowrap}
.c-nome{font-weight:600;font-size:var(--fs-4);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-doc,.c-cid{font-size:var(--fs-3);color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Documento e data em algarismo de largura fixa: uma coluna de CNPJ desalinhado
   é justamente o que se lê errado quando se confere um cadastro atrás do outro. */
.c-doc,.c-data{font-variant-numeric:tabular-nums}
.c-data{font-size:var(--fs-3);color:var(--ink-2);text-align:center;white-space:nowrap}
.c-prod{display:flex;gap:4px;min-width:0;overflow:hidden}
/* Sem max-width e sem reticencias, de proposito: pilula cortada ("Equi…") nao
   identifica produto nenhum, e era pior que mostrar uma a menos. Quem manda no
   corte agora e a CONTAGEM (PROD_TETO), que sempre sobra num "+N" honesto. O
   flex-shrink:0 impede que a coluna aperte as pilulas quando a janela encolhe. */
.c-tag{font-size:var(--fs-1);font-weight:700;color:var(--ink-2);background:var(--surface-warm);
  border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 8px;
  white-space:nowrap;flex-shrink:0}
.c-tag.mais{background:transparent;border-style:dashed;color:var(--muted)}
.c-fim{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
/* Coluna em branco continua dizendo o NOME do que falta ("sem CNPJ", "sem
   produtos") em vez de um vazio mudo — é o sinal de tarefa que a linha fechada
   sempre deu. Classe própria: o `.vazio` da lista sem resultado tem 15px e
   padding de 30px, e já inchou um selo destes num balão de 80px de altura. */
.c-falta{font-size:var(--fs-2);color:var(--muted);font-weight:600}
/* Abaixo de 900px as sete colunas não cabem lado a lado: nome e situação ficam na
   primeira linha da MESMA faixa e o resto desce para uma segunda, menor. Continua
   sendo uma linha clicável só — não vira dois cartões. */
@media(max-width:900px){
  /* O cabeçalho NÃO some mais. Ele sumia porque era só rótulo de coluna, e sem
     colunas não havia o que rotular; hoje ele é o ÚNICO jeito de ordenar a lista
     — o <select id="f-ord"> que morava na régua de cima foi embora —, e
     escondê-lo no celular apagaria a capacidade inteira justamente onde a tela é
     usada de pé, entre uma ligação e outra.

     Ele deixa de ser régua de colunas e vira uma TIRA QUE ROLA DE LADO, o mesmo
     gesto (e as mesmas medidas) do societario-equipe.html. A alternativa —
     deixar os sete títulos QUEBRAREM em várias linhas — foi medida a 390px e
     custava 148px de altura, três fileiras de pílulas empurrando a lista para
     baixo da dobra; a tira custa 46px e não empurra nada.
     O rótulo "Ordenar" na frente existe para a tira não ser lida como mais uma
     fileira de filtros: sem ele, "ID · Nome · CNPJ" logo abaixo de duas caixas
     de filtro é exatamente o que ela parece. */
  .lista-cab{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;
    padding:0 14px 4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .lista-cab::-webkit-scrollbar{display:none}
  .lista-cab .cab-rot{display:block;flex:none;white-space:nowrap;padding-right:2px}
  .lista-cab>[role="columnheader"]{flex:none;display:inline-flex;text-align:left!important}
  .lista-cab button{padding:0 13px;border:1px solid var(--line-2);border-radius:var(--radius-pill);
    background:var(--surface);white-space:nowrap}
  .lista-cab button[aria-current]{border-color:var(--brand-teal);background:var(--receita-soft)}
  /* A célula de duas ordens não quebra dentro da tira: ela é só mais um par de
     pílulas na fila. */
  .lista-cab .dois{flex-wrap:nowrap;gap:6px}
  .cli-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  /* Quebra forçada: sem ela o "resto" subiria para a primeira linha sempre que sobrasse espaço. */
  .cli-head::after{content:"";order:3;flex:0 0 100%;height:0}
  .c-nome{order:1;flex:1 1 auto}
  .c-fim{order:2;flex:none;flex-direction:row;align-items:center;gap:6px}
  .c-id,.c-doc,.c-cid,.c-prod,.c-data{order:4;flex:0 1 auto;font-size:var(--fs-2);color:var(--muted);text-align:left}
  /* Na segunda linha os produtos são mais uma informação entre outras: sem a
     moldura de pilula eles param de empilhar a faixa em três alturas. */
  .c-prod{flex-wrap:wrap;gap:0 8px}
  .c-tag{background:transparent;border-color:transparent;padding:0;font-size:var(--fs-2);
    font-weight:600;color:var(--muted);max-width:none}
}
/* Selo de situação: Ativo (verde discreto) · Em inativação (âmbar) · Inativo
   (vermelho) · sem informação (cinza). É a última coluna da linha. */
.pill{font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap;letter-spacing:.2px;border:1px solid transparent}
.pill.sit-ativo{background:#E6F3EC;color:#1f6b45;border-color:#BFE0CD}
.pill.sit-inativando{background:var(--amber-soft);color:#8A4B12;border-color:var(--amber)}
.pill.sit-inativo{background:#F7E2DF;color:#8E2A1D;border-color:var(--vermelho)}
.pill.sit-sem{background:#EEE9E2;color:var(--muted);border-color:var(--line)}

/* ---------- o cadastro completo (hoje dentro do modal) ----------
   O corpoHTML() é o mesmo de sempre; só mudou onde ele é pintado. Dentro do
   modal ele não precisa mais da moldura que o separava da linha de cima. */
.corpo{border-top:1px solid var(--line);background:var(--surface-warm);padding:13px 13px 16px}
.modal-cad .corpo{border-top:0;background:transparent;padding:0}
.gsec{margin-bottom:13px}
.gsec:last-of-type{margin-bottom:6px}
.gsec h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand-dark);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.gsec h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--brand-teal);flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fld{display:flex;flex-direction:column;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label,.fld>.lbl{font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld>label .req,.fld>.lbl .req{color:var(--amber-txt)}
.fld .cad{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.fld input,.fld select,.fld textarea{font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
.fld textarea{resize:vertical;min-height:42px;line-height:1.35}
.fld select{font-weight:600;cursor:pointer}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand-teal);outline-offset:0}
/* Campo esperado e ainda em branco: fundo avermelhado bem suave + borda um tom
   mais forte. É dica visual para varrer a tela, não erro — some ao preencher. */
.fld.emfalta>input,.fld.emfalta>select,.fld.emfalta>textarea{background:#FDF2EF;border-color:#E7C3BB}
.fld.emfalta>.lbl{color:#8A5A50}
.fld .ro{font-size:13px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:var(--radius-sm);background:#EFE8DE;color:var(--ink-2);
  min-height:38px;word-break:break-word;display:flex;align-items:center;gap:7px;cursor:not-allowed}
.fld .ro .cad-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .ro a{color:var(--brand-teal-txt);text-decoration:none;font-weight:800;flex:none;cursor:pointer}
.rodape{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
.rodape .lk{color:var(--brand-teal-txt);text-decoration:none;font-weight:800;font-size:12px}
.ign{background:var(--amber-soft);border:1px solid var(--amber-line);color:#8a5117;border-radius:var(--radius-sm);padding:8px 11px;font-size:12px;font-weight:700;margin-bottom:10px}
.ign:empty{display:none}

/* ---------- modais (cliente novo e cadastro) ----------
   A MOLDURA — véu, caixa, cabeçalho escuro, rodapé, aviso de "tem coisa por
   gravar" — saiu daqui e mora no b4u-modal.js, que a monta em `b4m-` para os
   sete modais do painel de uma vez. O que fica abaixo é só o que é DESTE
   cadastro: como o formulário se arruma dentro da caixa. */
.modal .grid{grid-template-columns:repeat(2,1fr)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.sec>h2{font-size:13px;font-weight:800;margin:0 0 11px;color:var(--brand-dark);display:flex;align-items:center;gap:8px}
.sec>h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--brand-teal)}
.idcard{background:linear-gradient(135deg,rgba(15,140,133,.12),rgba(63,166,128,.07));border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.idcard .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.idcard .idval{font-size:24px;font-weight:800;color:var(--brand-teal);letter-spacing:1px}
.idcard .nome{font-size:13px;color:var(--ink-2);margin-top:3px}
.prods{display:flex;flex-wrap:wrap;gap:8px}
.prod{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface-warm);border:1px solid var(--line-2);border-radius:var(--radius-pill);padding:8px 13px;cursor:pointer;user-select:none}
.prod input{accent-color:var(--brand-teal);width:16px;height:16px}
.prod.on{background:rgba(15,140,133,.10);border-color:var(--brand-teal);color:var(--brand-dark)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.fld.miss input,.fld.miss select,.fld.miss textarea{border-color:var(--vermelho);background:#fdf3f1}
/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:var(--radius-pill);padding:12px 20px}
.foot{display:flex;gap:10px;align-items:center;margin-top:6px}
.foot .btn--pri{flex:1}
.msg{font-size:13px;font-weight:700;min-height:18px;margin:8px 0}
.msg.err{color:var(--vermelho)}
.ok-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;text-align:center}
.ok-card h1{font-size:19px;margin:6px 0}
.ok-card .big{font-size:24px;font-weight:800;color:var(--brand-teal);letter-spacing:1px}
.ok-links{display:flex;flex-direction:column;gap:8px;margin:15px 0;text-align:left}
.ok-links a{background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;text-decoration:none;color:var(--brand-dark);font-weight:700;font-size:13px}
.avisos{background:var(--amber-soft);border:1px solid var(--amber-line);color:#8a5117;border-radius:var(--radius-sm);padding:11px 13px;font-size:13px;text-align:left;margin:4px 0 12px}

/* ---------- estados ---------- */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:48vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:52ch}
.state code{background:var(--surface-warm);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vazio{padding:30px 16px;text-align:center;color:var(--muted);font-size:15px}
@keyframes fl{0%{background:#FFE79A}100%{background:transparent}}
.flash{animation:fl 1.8s ease}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
/* O título NÃO some mais no telefone: o dono pediu a mesma barra em todas as
   telas da equipe — título e quem está usando, e só. Ele cabia mal quando a
   barra ainda carregava contador, "Planilha ↗" e "← Painel"; hoje esses três
   saem da vista pela folha do b4u-shell.js e sobra espaço de sobra. */
@media(max-width:760px){
  .barra .cnt{display:none}
  .linha-busca{flex-wrap:wrap}
  .busca{flex-basis:100%}
  .btn-novo{flex:1;text-align:center}
}
@media(max-width:600px){.grid,.modal .grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}


/* ---------- revelacao progressiva ---------- */
/* Régua de ações: busca sempre à mão, filtros a um clique, contagem à vista.
   Antes os filtros ficavam todos abertos na tela — quem chegava tinha de ler a
   parede inteira antes de achar o campo de busca, que é o que 9 em 10 usam. */
.barra-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.barra-acoes .campo-busca{flex:1;min-width:200px;font-size:16px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink)}
.barra-acoes .campo-busca:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.btn-filtros{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--ink);font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.btn-filtros:hover{border-color:var(--brand-teal)}
.btn-filtros[aria-expanded="true"]{background:var(--receita-soft);border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.btn-filtros svg{width:15px;height:15px;flex:none}
.cont-filtros{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:var(--radius-pill);background:var(--brand-teal-txt);color:#fff;
  font-size:var(--fs-1);font-weight:800}
/* display:inline-flex ganha do atributo hidden — sem esta linha o selo mostrava
   um "0" permanente ao lado de Filtros. */
.cont-filtros[hidden]{display:none}
.resumo-lista{font-size:var(--fs-3);color:var(--ink-2);white-space:nowrap}
/* ---------- régua de filtros ----------
   Mesma da tela de Tarefas Daily, que virou o padrão da casa. A contagem que o
   chip dava foi para o rótulo da opção ("Sem CNPJ · 12"). */
.topo{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
select.filtro{font-family:var(--sans);font-size:var(--fs-3);color:var(--brand-teal-txt);
  background:var(--surface);border:1px solid var(--brand-teal);border-radius:var(--radius-pill);
  padding:9px 13px;cursor:pointer;font-weight:700;max-width:100%;min-width:0;text-overflow:ellipsis}
select.filtro:focus{outline:2px solid var(--brand-teal);outline-offset:-1px}
select.filtro.corta{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-txt)}
/* "Com pendências" é BOTÃO, não caixa de seleção: a pergunta tem duas respostas
   (com e sem), e uma lista de um item só para marcar seria um clique a mais para
   dizer sim. Ele fala a MESMA língua visual do resto da régua: teal de filtro em
   repouso (igual ao select.filtro e ao .b4f-bt do b4u-filtro.js) e âmbar quando
   está cortando a lista — o mesmo par do `select.filtro.corta` que já estava
   aqui e do `.b4f-nada` do componente. Sem cor nova, sem vocabulário novo.
   A altura acompanha os vizinhos (~37px) de propósito: o botão de 44px ficaria
   um degrau acima das duas caixas ao lado e a régua pareceria desalinhada. */
button.filtro{font-family:var(--sans);font-size:var(--fs-3);font-weight:700;cursor:pointer;
  color:var(--brand-teal-txt);background:var(--surface);border:1px solid var(--brand-teal);
  border-radius:var(--radius-pill);padding:9px 13px;line-height:1.25;max-width:100%;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.filtro:hover{border-color:var(--brand-teal-txt)}
button.filtro:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
button.filtro[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-txt)}
button.filtro[hidden]{display:none}
/* ┌── NÃO ponha as duas caixas na MESMA linha do celular ──────────────────┐
   │ Tentado e desfeito em 11/08/2026. `\.topo>.b4f{flex:1 1 40%}` faz as   │
   │ duas repartirem uma linha e economiza uma linha inteira da régua a     │
   │ 390px — e cria um defeito pior: a segunda caixa passa a nascer a ~200px│
   │ da borda esquerda, e o PAINEL dela (que é `position:absolute` e tem a  │
   │ largura do item mais comprido) precisa de uns 90px de correção para a  │
   │ esquerda para caber. O `posicionar()` do b4u-filtro.js faz essa        │
   │ correção lendo `window.innerWidth` — e, no Chromium com emulação de    │
   │ celular, o innerWidth JÁ VEM INFLADO pelo estouro que o próprio painel │
   │ acabou de causar (390 vira 465). A correção sai de 94px para 10px e o  │
   │ painel fica meio fora da tela, que é justamente onde a pessoa lê e     │
   │ marca as opções.                                                       │
   │ Sem a emulação a conta fecha (left:-94px, painel inteiro dentro), e o  │
   │ mesmo acontece no daily.html e no societario-equipe.html com a segunda │
   │ caixa da linha deles — é comportamento da casa, não desta tela. Mas    │
   │ enquanto for assim, uma linha a mais de régua é troca barata por um    │
   │ painel que pode nascer pela metade num celular de verdade.             │
   │ Se um dia o `posicionar()` medir por `documentElement.clientWidth`     │
   │ (que não infla), esta regra volta a valer.                             │
   └────────────────────────────────────────────────────────────────────────┘ */
.painel-filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
  padding:14px 16px;margin:0 0 14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-warm)}
.painel-filtros[hidden]{display:none}
.lista-mais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.lista-mais button{min-height:44px;padding:0 18px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--brand-teal-txt);
  font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.lista-mais button:hover{border-color:var(--brand-teal);background:var(--receita-soft)}
.lista-mais .btn-todos{background:transparent;color:var(--ink-2);font-weight:600}
/* A contagem desta tela tem quatro números; no celular ela precisa quebrar, senão
   o nowrap do contrato empurra a página para o lado. */
@media(max-width:560px){.resumo-lista{white-space:normal}}
/* Cada grupo de chips ocupa a fileira inteira: Situação e Ordenar por não se misturam. */
.painel-filtros .grupo{width:100%;margin:0}
.btn-limpar{min-height:38px;padding:0 15px;border-radius:var(--radius-pill);border:1px dashed var(--line-2);
  background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:var(--fs-2);cursor:pointer}
.btn-limpar:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
/* Os exemplos por situação continuam inteiros, só que a um clique de distância. */
details.situacao>summary{padding:10px 13px;font-size:var(--fs-3)}
details.situacao>.resumo{padding:0 12px 12px}
/* Quanto da lista está desenhado. Vazio quando tudo cabe no teto — sem linha à toa. */
.dica:empty{display:none}

/* ---------- explicacao recolhida (C.2) ----------
   O dado vem primeiro; a instrucao fica a um clique e lembra a escolha. */
/* ---------- o que nao gravou (C.3) ----------
   A linha (ou o campo) fica marcada e o "tentar de novo" nasce ali mesmo. */
.falhou{outline:2px solid var(--vermelho);outline-offset:-2px}
tr.falhou>td{background:#FBEAE7!important}
.btn-retry{display:block;margin-top:4px;font-family:var(--sans);font-size:11px;font-weight:800;cursor:pointer;
  border:1px solid var(--vermelho);background:var(--vermelho);color:#fff;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap}
.btn-retry:disabled{opacity:.6;cursor:default}
/* O painel passou a ter TRES estados de gravacao, nao dois: gravou, nao gravou e
   NAO SEI. O terceiro nao pode usar o mesmo selo do segundo — o .btn-retry diz
   "nao salvou" e convida a repetir, e nesta hora ninguem sabe se a gravacao
   aconteceu. Repetir uma gravacao que talvez tenha ido e o estrago que este
   caminho todo existe para evitar. Por isso a duvida tem selo proprio: cor de
   aviso, nao de erro, e sem botao nenhum para clicar. */

/* O mesmo aviso por extenso, dentro da ficha. Na lista cabe um ⚠; aqui, com o
   campo à vista e espaço para uma linha, cabe dizer o que aconteceu e o que
   fazer — que é o único jeito de o dado ser corrigido na origem. */

<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a
   célula tem ponto e barra, o Sheets desiste e guarda texto.
   Onde não existe máscara canônica (telefone, inscrição), o valor vai como foi
   digitado: o conserto ali depende do patch do backend. */
function b4uParaPlanilha(valor,coluna){
  const s=b4uTexto(valor).trim();
  const t=b4uIdent(coluna);
  if(!s||!t||!/^\d+$/.test(s))return s;
  const d=b4uDigitos(s);
  if((t.tipo==='doc'||t.tipo==='cnpj')&&d.length===14)return b4uFmtDoc(d);
  if((t.tipo==='doc'||t.tipo==='cpf')&&d.length===11)return b4uFmtDoc(d);
  if(t.tipo==='cep'&&d.length===8)return b4uFmtCep(d);
  return s;
}
/* B4U-TEXTO:FIM */
</script>
</head>

<!-- Cadastro do cliente. Fica FORA do #app de propósito: carregar() repinta o
     #app inteiro, e uma recarga em segundo plano não pode apagar o formulário
     que alguém está preenchendo. -->

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
/* A chave da equipe não é mais fixa: é o código do dia de cada colaborador
   (aba "Colaboradores" da planilha de Contatos), que chega por e-mail no
   index.html. Esta constante ficou vazia de propósito — se voltar a ter valor,
   volta a existir uma senha compartilhada que não expira e não diz quem é quem. */
const CHAVE_PADRAO = '';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}

/* Sem chave na URL não há painel da equipe. A porta é o index.html: a pessoa
   digita o e-mail, recebe o código do dia e volta para CÁ — é para isso que
   serve o `destino`, senão todo login despejaria a pessoa na home da equipe,
   longe do que ela tinha clicado.
   Até 04/08/2026 existia uma chave fixa antiga escrita aqui como padrão: quem
   abrisse a página sem chave nenhuma entrava assim mesmo, sem se identificar.
   A string não se repete neste arquivo de propósito — ele é servido ao
   navegador, e comentário vaza igual a código. */
if (!chaveAtual()) {
  location.replace('index?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}
/* o que vem depois do # é o CÓDIGO do colaborador — vai no log, na coluna "Colaborador" */
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash
// (formato antigo dos atalhos por pessoa). Vira a coluna "Colaborador" da aba log.
function codAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* ---------- busca que entende CNPJ com e sem pontuação (C.1) ---------- */
function soDigitos(s){return b4uDigitos(s);}
/** Compara o texto normalizado e, quando o termo tem 6 dígitos ou mais, também
 *  só os dígitos dos dois lados. */
function casaBusca(alvoTxt,alvoDig,termo){
  const t=normTxt(termo);
  if(!t)return true;
  if(alvoTxt.indexOf(t)>=0)return true;
  const d=soDigitos(termo);
  return d.length>=6&&alvoDig.indexOf(d)>=0;
}
/** Lembra no navegador se a explicação fica aberta — a escolha é de quem usa. */
function ligarDetalhes(el,chave){
  if(!el)return;
  try{if(localStorage.getItem(chave)==='1')el.open=true;}catch(e){}
  el.addEventListener('toggle',()=>{try{localStorage.setItem(chave,el.open?'1':'0');}catch(e){}});
}

/* ---------------- revelação progressiva ---------------- */
/* Filtros recolhidos, com memória. O contador ao lado do botão existe para
   evitar o único efeito colateral ruim de esconder filtro: a pessoa esquece que
   filtrou e acha que os dados sumiram. Por isso, com filtro ativo, o painel
   nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da lista. Dois botões de propósito: "mais 20" para quem lê, "todos" para
   quem vai usar Ctrl+F. Buscar ou filtrar volta o teto ao início — o resultado
   é outro, e continuar de onde parou confundiria. */
const PASSO = 20;
let TETO = PASSO;
function rodapeLista(mostrados, total){
  if(total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todos os ${total}</button>
  </div>`;
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Ficou vazia de propósito: quem cuida da espera na tela agora é o b4u-espera.js.
   As frases que esta função escrevia falavam em demora e em tentar de novo, e era
   lendo isso que a pessoa recarregava justo quando a resposta já vinha. A função
   continua existindo porque ainda é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
   de espera continua correndo por cima, sem avisar da repetição: quem lê "tentando
   de novo" recarrega justo quando a resposta já vinha. Erro só se a segunda falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
/* O JSONP sempre teve teto; este POST não tinha nenhum. Uma resposta perdida
   deixava a promise pendurada para sempre: "Salvando…" eterno na faixa e o aviso
   de "sair sem salvar" pedindo confirmação até o F5. Agora há prazo — e, mais
   importante, quem estoura o prazo sabe QUE TIPO de silêncio foi. */
async function postAcao(obj,ms){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),ms||45000);
  try{
    /* O `JSON.stringify` mora DENTRO do try: fora dele, um valor circular ou um
       getter que estoura sairia sem marca nenhuma — nem `doServidor` nem
       `incerto` — e quem lê a exceção lá na frente não teria como saber que ela
       nunca chegou a virar requisição. */
    const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ctl.signal});
    const d=await r.json();
    /* Erro que o SERVIDOR mandou: ele processou, decidiu e recusou. É o único
       caso em que dá para garantir que não gravou. */
    if(d&&d.erro){ const err=new Error(d.erro); err.doServidor=true; throw err; }
    return d;
  }catch(e){
    /* ---------- "não salvou" é uma AFIRMAÇÃO, e o front não tem como fazê-la ----------
       O servidor GRAVA e só depois responde. Quando a resposta se perde, a
       gravação já aconteceu — e há quatro jeitos de isso ocorrer: o prazo
       estourar, o `r.json()` topar com uma página HTML (cota, tela de
       autorização), o 302 do /exec para o googleusercontent falhar, ou a aba ser
       suspensa com a requisição em voo.
       Em todos, a planilha está certa e a tela dizia "Não foi possível salvar".
       A equipe aprendeu a desconfiar do painel por causa disso.
       Agora a exceção carrega `.incerto`: só o erro VINDO DO SERVIDOR é falha de
       verdade; o resto é silêncio, e silêncio não é resposta. */
    if(e&&e.name==='AbortError'){ const x=new Error('A resposta demorou.'); x.incerto=true; throw x; }
    if(e&&e.doServidor) throw e;
    const x=new Error(String((e&&e.message)||e)); x.incerto=true; throw x;
  }finally{ clearTimeout(t); }
}

/* ---------------- releitura de confirmação ----------------
   `incerto` quer dizer "não sei", e "não sei" é o pior recado que um painel pode
   dar a quem acabou de digitar. Só existe um jeito de saber: PERGUNTAR DE NOVO.
   E perguntar é uma LEITURA — não repete a gravação e não cria cliente nenhum.
   Por isso ela pode rodar sozinha, sem pedir licença.

   Duas escolhas que sustentam a conferência:

   • Compara pelo MESMO funil que converteu o valor na ida (`b4uParaPlanilha`).
     Comparar o que a planilha devolve com o que a tela mostra acusaria diferença
     de MÁSCARA — "00.623.904/0001-73" contra "00623904000173" — como se fosse
     falta de gravação, e a conferência viraria mentira ao contrário.

   • Nada do que volta é pintado. O cadastro aberto continua como está: quem está
     digitando não pode ver o próprio texto ser trocado por causa de uma
     conferência que ele não pediu e não vê acontecer.

   Vale só para a gravação de CAMPO. A criação de cliente (`onboard`) não passa
   por aqui: lá não há linha para reler — o ID nasce no servidor, e procurar
   "algum cliente parecido" é adivinhação numa hora em que errar significa deixar
   dois cadastros e duas pastas no Drive.

   Não existe rota de leitura por linha — esta página tem uma leitura só, a de
   bloco. `relerCliente` é o ponto único onde isso está escrito: no dia em que o
   backend ganhar um `tipo=registro_linha&id=`, muda esta função e mais nada. */
const CONF_ESPERA=3000;   // o servidor grava DENTRO do lock: perguntar antes de ele soltar devolve o valor velho
/* Teto da conferência. O `jsonp()` desta página tem prazo de 45 s e AINDA repete
   uma vez depois de 4 s de pausa: no pior caso a pergunta levaria mais de um
   minuto e meio, com a faixa dizendo "conferindo se gravou…" o tempo todo. Passou
   de 25 s, a conferência desiste e vira dúvida — que é a resposta honesta, e é o
   mesmo que ela diria depois de esperar mais um minuto. */
const CONF_TETO=25000;
function comTeto(p,ms){return Promise.race([p,new Promise((_,f)=>setTimeout(()=>f(new Error('a conferência demorou')),ms))]);}
let CONF_N=0;                 // numera as gravações
const CONF_SEQ=new Map();     // id → número da última gravação disparada neste cadastro
function esperaMs(ms){return new Promise(r=>setTimeout(r,ms));}
async function relerCliente(id){
  const d=await jsonp(API_URL+'?tipo=registro_equipe&chave='+encodeURIComponent(chaveAtual()));
  if(!d||d.erro) throw new Error(String((d&&d.erro)||'releitura vazia'));
  const c=(d.clientes||[]).find(x=>String(x.id)===String(id));
  if(!c) throw new Error('cadastro não encontrado na releitura');
  return c.valores||{};
}
/* 'bateu' | 'nao-bateu' | 'nao-sei'.
   NUNCA devolve 'bateu' por falta de informação: releitura que falhou é dúvida,
   não é confirmação. Um "Salvo ✓" errado custa mais caro que a dúvida. */
async function conferirGravacao(id,campos){
  try{
    await esperaMs(CONF_ESPERA);
    const v=await comTeto(relerCliente(id),CONF_TETO);
    /* Coluna travada NUNCA grava — é a mesma lista que alimenta o "Não gravei:"
       da ficha. Cobrá-la na conferência faria uma gravação inteira e correta ser
       anunciada como perdida por causa de um campo que o servidor recusa de
       propósito, todo dia, desde sempre. */
    const cols=Object.keys(campos).filter(c=>!ehTravada(c)&&Object.prototype.hasOwnProperty.call(v,c));
    if(!cols.length) return 'nao-sei';   // só travadas (ou colunas que sumiram): vazio não é prova
    const igual=c=>String(b4uParaPlanilha(v[c]==null?'':v[c],c)).trim()
                  ===String(campos[c]==null?'':campos[c]).trim();
    return cols.every(igual)?'bateu':'nao-bateu';
  }catch(_){ return 'nao-sei'; }
}
/* normaliza rótulo de coluna igual ao backend (sem acento, minúsculo, sem ?:. no fim) */
function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim().replace(/[?:.]+$/,'');}
/* Um texto de gravação, dois lugares: a faixa da barra (#saveStatus, que continua
   sendo a de sempre) e o rodapé do modal de cadastro. Com o cadastro aberto a
   barra fica atrás do véu — e o indicador não pode sumir justamente na tela em
   que se digita. A classe "claro" só troca a tinta do estado neutro, que foi
   desenhado para fundo escuro. */
function setSave(cl,txt,tit){
  const base='save-status '+(cl||'');
  const barra=document.getElementById('saveStatus');
  if(barra){barra.className=base;barra.textContent=txt||'';barra.title=tit||'';}
  const cad=document.getElementById('saveStatusCad');
  if(cad){cad.className=base+' claro';cad.textContent=txt||'';cad.title=tit||'';}
}
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

const REMOVIDOS=[];

/**
 * Monta os campos a partir dos cabeçalhos vivos.
 * modo 'novo'    -> form de cliente novo: pula as colunas do sistema e injeta UF depois de Cidade.
 * modo 'edicao'  -> cadastro completo: TODAS as colunas (as travadas entram só de leitura).
 */
function montarCampos(headers,modo){
  const campos=[],roles={},edicao=(modo==='edicao');
  const dicas=edicao?Object.assign({},HINTS,HINTS_SISTEMA):HINTS;
  (headers||[]).forEach(h=>{
    const k=norm(h);
    if(!k)return;
    if(REMOVIDOS.indexOf(k)>=0)return;                // coluna aposentada: não vira campo
    if(!edicao&&SKIP.indexOf(k)>=0)return;            // colunas que o sistema gerencia
    const hint=dicas[k]||{s:'Outros'};
    if(hint.role)roles[hint.role]=h;
    campos.push({s:hint.s||'Outros',col:h,t:hint.t||'text',req:!edicao&&!!hint.req,full:!!hint.full,opts:hint.opts,ph:hint.ph||'',max:hint.max,up:!!hint.up});
  });
  if(!edicao){
    roles.uf='UF';
    const uf=Object.assign({},UF_FIELD);
    const iC=campos.findIndex(f=>norm(f.col)==='cidade');
    if(iC>=0)campos.splice(iC+1,0,uf);else campos.push(uf);
  }
  const ord=f=>{const i=SEC_ORDER.indexOf(f.s);return i<0?SEC_ORDER.length:i;};
  const lista=campos.map((f,i)=>(f._i=i,f)).sort((a,b)=>ord(a)-ord(b)||a._i-b._i);
  lista.roles=roles;
  return lista;
}

   Set porque essa marcação acontece fora do modal, sem ninguém para fechar. */
let ABERTOS=new Set(),FILTRO='todos',TERMO='';

/* ===================================================================
   Completude do cadastro — a regra do selo "N campos vazios"
   -------------------------------------------------------------------
   Entram na conta só as colunas EDITÁVEIS do cadastro. Ficam de fora:
   · as travadas (🔒) — o sistema é quem preenche;
   · "Data de fim da contabilidade" — em branco ali quer dizer contrato
     em andamento, não buraco no cadastro;
   · "Ativo" — é situação do cliente, não campo de cadastro;
   · as colunas APOSENTADAS (REMOVIDOS) — já não aparecem no cadastro;
   · toda coluna preenchida por menos de 20% dos clientes (coluna de
     exceção: CNES, obs de aluguel e afins). O corte sai dos próprios
     dados que vieram, então se ajusta sozinho quando a equipe cria uma
     coluna nova ou passa a usar uma que estava parada.
   O selo fica âmbar quando falta mais de um terço dos campos esperados
   (mínimo de 3), que é quando o cadastro deixa de ser "quase pronto".

   Essa MESMA lista (COLS_COMPLETUDE) é a régua do destaque avermelhado dos
   campos em branco lá no cadastro aberto — selo e destaque contam a mesma coisa.
   =================================================================== */
const FORA_DA_CONTA=['data de fim da contabilidade','ativo'];
const PISO_USO=0.2;
let COLS_COMPLETUDE=[],SET_COMPLETUDE=new Set(),LIMIAR_VAZIOS=99;
function calcularCompletude(){
  const base=CLIENTES.length||1;
  COLS_COMPLETUDE=COLUNAS.filter(col=>{
    const k=norm(col);
    if(!k||ehTravada(col)||FORA_DA_CONTA.indexOf(k)>=0||REMOVIDOS.indexOf(k)>=0)return false;
    let preenchidas=0;
    CLIENTES.forEach(c=>{if(valorDe(c,col))preenchidas++;});
    return preenchidas/base>=PISO_USO;
  });
  SET_COMPLETUDE=new Set(COLS_COMPLETUDE);
  LIMIAR_VAZIOS=Math.max(3,Math.ceil(COLS_COMPLETUDE.length/3));
  CLIENTES.forEach(c=>{c._v=null;});
}
/* Campo que "conta": editável, esperado pela régua acima. É o que ganha o
   destaque avermelhado quando está em branco. */
function ehEsperado(col){return !ehTravada(col)&&SET_COMPLETUDE.has(col);}
function vaziasDe(cli){return COLS_COMPLETUDE.filter(col=>!valorDe(cli,col));}
function vaziosDe(cli){if(cli._v==null)cli._v=vaziasDe(cli).length;return cli._v;}
function tituloSelo(cli){
  const f=vaziasDe(cli);
  const tot=COLS_COMPLETUDE.length;
  if(!f.length)return 'Os '+tot+' campos considerados estão preenchidos.';
  return 'Em branco: '+f.slice(0,12).join(', ')+(f.length>12?' e mais '+(f.length-12):'')+' — de '+tot+' campos considerados.';
}
function seloHTML(cli){
  if(!COLS_COMPLETUDE.length)return '';
  const n=vaziosDe(cli);
  const cl=n===0?'ok':(n>=LIMIAR_VAZIOS?'alerta':'');
  const txt=n===0?'cadastro completo':(n+(n===1?' campo vazio':' campos vazios'));
  return `<span class="selo ${cl}" title="${esc(tituloSelo(cli))}">${txt}</span>`;
}

/* ---------------- ordenação ----------------
   Os critérios são os MESMOS do cabeçalho da lista — cada um É uma coluna
   clicável. Esta lista deixou de desenhar um <select> "Ordenar por" na régua

   entradas continuam todas alcançáveis; "campos vazios", a única sem coluna
   própria, virou o segundo botão da célula onde o selo dela já aparece. */
const ORDENS=[
  {k:'id',rot:'ID',asc:'do menor para o maior',desc:'do maior para o menor'},
  {k:'nome',rot:'Nome',asc:'A → Z',desc:'Z → A'},
  {k:'cnpj',rot:'CNPJ / CPF',asc:'do menor para o maior',desc:'do maior para o menor',dep:'cnpj'},
  {k:'cidade',rot:'Cidade',asc:'A → Z',desc:'Z → A',dep:'cidade'},
  {k:'produtos',rot:'Produtos',asc:'A → Z',desc:'Z → A',dep:'produtos'},
  {k:'inicio',rot:'Início da contabilidade',asc:'mais antigo primeiro',desc:'mais novo primeiro',dep:'inicio'},
  {k:'ativo',rot:'Situação',asc:'ativos primeiro',desc:'inativos primeiro',dep:'ativo'},
  {k:'vazios',rot:'Campos vazios',asc:'mais incompleto primeiro',desc:'mais completo primeiro'}
];
let ORDEM='id',DIR='asc';
function ordensVivas(){return ORDENS.filter(o=>!o.dep||COL[o.dep]);}
function porId(a,b){return String(a.id).localeCompare(String(b.id),'pt',{numeric:true});}
/* aceita aaaa-mm-dd e dd/mm/aaaa; texto livre ("a definir") conta como sem data */
function chaveInicio(cli){
  const v=valorDe(cli,COL.inicio);
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return (+m[1])*10000+(+m[2])*100+(+m[3]);
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return (+m[3])*10000+(+m[2])*100+(+m[1]);
  return null;
}
/* Texto sem acento e sem caixa: "Água" e "agua" ficam juntas, que é como quem
   procura na lista espera. */
function cmpTxt(a,b){return normTxt(a).localeCompare(normTxt(b),'pt',{numeric:true});}
/* Documento ordena pelos DÍGITOS: com pontuação, "08.852…" e "08852…" caíam em
   pontos distintos da mesma coluna. */
function cmpDoc(a,b){return soDigitos(a).localeCompare(soDigitos(b),'pt',{numeric:true});}
/* Coluna em branco significa "falta preencher" e vai SEMPRE para o fim, nas duas
   direções: jogá-la para o topo no Z→A esconderia justamente o que se procura.
   Devolve 1/-1 quando já resolveu, ou null quando os dois têm conteúdo. */
function fimSeVazio(a,b){
  const ea=String(a==null?'':a).trim()==='',eb=String(b==null?'':b).trim()==='';
  if(ea&&eb)return 0;
  if(ea)return 1;
  if(eb)return -1;
  return null;
}
function ordenar(arr){
  const d=DIR==='asc'?1:-1;
  return arr.sort((a,b)=>{
    if(ORDEM==='nome'){
      const z=fimSeVazio(a.nome,b.nome);
      if(z!==null)return z||porId(a,b);
      return cmpTxt(a.nome,b.nome)*d||porId(a,b);
    }
    if(ORDEM==='cnpj'||ORDEM==='cidade'||ORDEM==='produtos'){
      const col=COLS_LINHA[ORDEM]||COL[ORDEM];
      const x=valorDe(a,col),y=valorDe(b,col);
      const z=fimSeVazio(x,y);
      if(z!==null)return z||porId(a,b);
      return (ORDEM==='cnpj'?cmpDoc(x,y):cmpTxt(x,y))*d||porId(a,b);
    }
    if(ORDEM==='inicio'){
      const x=chaveInicio(a),y=chaveInicio(b);
      if(x==null&&y==null)return porId(a,b);
      if(x==null)return 1;                       /* sem data fica sempre no fim */
      if(y==null)return -1;
      return (x-y)*d||porId(a,b);
    }
    if(ORDEM==='ativo'){
      /* ativo → em inativação → inativo; sem informação sempre no fim */
      const peso={ativo:0,inativando:1,inativo:2};
      const rank=c=>{const s=situacaoDe(c);return s==='sem'?9:peso[s];};
      const ra=rank(a),rb=rank(b);
      if(ra===9||rb===9)return ra===rb?porId(a,b):ra-rb;
      return (ra-rb)*d||porId(a,b);
    }
    if(ORDEM==='vazios')return (vaziosDe(b)-vaziosDe(a))*d||porId(a,b);
    return porId(a,b)*d;
  });
}
/* Ordem que aponta para coluna que a planilha não tem mais volta para o ID. Não
   desenha nada — o cabeçalho é quem desenha —, mas continua sendo chamada antes
   de cada pintura, porque as colunas vivas mudam a cada carga. */
function normalizarOrdem(){
  if(!ordensVivas().some(o=>o.k===ORDEM)){ORDEM='id';DIR='asc';}
}
function ordemDe(k){return ORDENS.find(o=>o.k===k)||null;}

/* ---------------- cards de resumo ---------------- */
function itemResumo(cli,tp){
  return `<div class="tk" data-goto="${esc(cli.id)}" title="Abrir o cadastro de ${esc(cli.nome||cli.id)}">
    <span class="d">${esc(cli.id)}</span><span class="lb">${esc(cli.nome||'(sem nome)')}</span>
    <span class="tp">${esc(tp)}</span></div>`;
}
function cardResumo(cls,titulo,tit,lista,render){
  return `<div class="rcard ${cls}"><div class="rhead" title="${esc(tit)}"><span>${esc(titulo)}</span><span class="n">${lista.length}</span></div>
    <div class="rlista">${lista.length?lista.slice(0,60).map(render).join(''):'<div class="rvazio">Nada por aqui 🎉</div>'}</div></div>`;
}
function desenharResumo(){
  const el=document.getElementById('resumo');if(!el)return;
  /* cadastro pela metade de cliente inativo não é tarefa de ninguém: fica fora dos cards */
  const base=CLIENTES.filter(c=>ativoDe(c)!==false);
  const incompletos=base.filter(c=>vaziosDe(c)>0).sort((a,b)=>vaziosDe(b)-vaziosDe(a)||porId(a,b));
  const cards=[cardResumo('incompletos','Cadastros mais incompletos',
    'Clientes que não estão marcados como inativos, do mais vazio para o mais completo. Clique para abrir o cadastro.',
    incompletos,c=>itemResumo(c,vaziosDe(c)+' vazios'))];
  if(COL.cnpj)cards.push(cardResumo('semdado','Sem CNPJ ou CPF',
    'Clientes não inativos sem CNPJ/CPF.',
    base.filter(c=>!valorDe(c,COL.cnpj)),c=>itemResumo(c,'sem CNPJ')));
  if(COL.inicio)cards.push(cardResumo('semdado2','Sem data de início',
    'Clientes não inativos sem data de início da contabilidade.',
    base.filter(c=>exigeInicio(c)&&!valorDe(c,COL.inicio)),c=>itemResumo(c,'sem início')));
  el.innerHTML=cards.join('');
}

/* Cliente SÓ de equiparação não tem data de início da contabilidade — não existe
   contabilidade para começar. Cobrar o campo dele enche a lista de "faltando" com
   uma pendência que ninguém pode resolver, e pendência que não se resolve treina
   a equipe a ignorar a lista inteira.
   O teste é sobre os PRODUTOS: se sobra alguma coisa depois de tirar as palavras
   de equiparação, é cliente de contabilidade também e a data volta a ser exigida. */
function soEquiparacao(c){
  const p=normTxt(valorDe(c,COL.produtos)||'');
  if(!p) return false;                       // sem produto declarado não dá para afirmar nada
  // "Equiparação Hospitalar" e "Restituição Tributária" são o mesmo produto com
  // sobrenome — os qualificadores saem junto, senão sobra palavra e o cliente
  // volta a ser cobrado pela data que ele não tem.
  const resto=p.replace(/equipara[cç][aã]o|restitui[cç][aã]o/g,'')
               .replace(/hospitalar|tribut[aá]ria?|previdenci[aá]ria?/g,'')
               .replace(/[^a-z0-9]+/g,'');
  return resto==='';
}
function exigeInicio(c){ return !soEquiparacao(c); }

function ehTravada(col){return TRAVADAS.has(norm(col));}
function valorDe(cli,col){return col?b4uTexto((cli.valores||{})[col]).trim():'';}
/** Acha o nome EXATO da coluna a partir de apelidos normalizados (exato e depois "contém"). */
function colDe(alts){
  for(const a of alts){const c=COLUNAS.find(x=>norm(x)===a);if(c)return c;}
  for(const a of alts){const c=COLUNAS.find(x=>norm(x).indexOf(a)>=0);if(c)return c;}
  return '';
}
function mapearColunas(){
  COL={
    nome:colDe(['nome']),
    ativo:colDe(['ativo']),
    cnpj:colDe(['cnpj ou cpf','cnpj/cpf','cnpj']),
    razao:colDe(['razao social da empresa','razao social']),
    fantasia:colDe(['nome fantasia']),
    cidade:colDe(['cidade']),
    regime:colDe(['regime']),
    produtos:colDe(['produtos back4you','produtos']),
    drive:colDe(['drive']),
    inicio:colDe(['data de inicio da contabilidade'])
  };
  mapearLinha();
}
/* As colunas que a LINHA da lista mostra. O mapa COL já resolve os apelidos de
   cada uma; este segundo passo é a rede de segurança para o dia em que a planilha
   renomear um cabeçalho: sem entrada no mapa, a coluna é procurada de novo pelo
   nome normalizado antes de a linha ficar muda. Resolvido uma vez por carga, e
   não a cada linha desenhada. */
let COLS_LINHA={};
function mapearLinha(){
  const pega=(k,alts)=>COL[k]||colDe(alts);
  COLS_LINHA={
    cnpj:pega('cnpj',['cnpj ou cpf','cnpj/cpf','cnpj','cpf']),
    cidade:pega('cidade',['cidade','municipio']),
    produtos:pega('produtos',['produtos back4you','produtos']),
    inicio:pega('inicio',['data de inicio da contabilidade','inicio da contabilidade','data de inicio'])
  };
}
function simNao(v){const s=normTxt(v);if(!s)return null;
  if(/^(sim|s|true|verdadeiro|1|x|ativo)$/.test(s))return true;
  if(/^(nao|n|false|falso|0|-|inativo)$/.test(s))return false;return null;}

/* ---------------- situação do cliente (coluna "Ativo") ----------------
   A planilha usa três valores: Ativo · Em inativação · Inativo.
   A comparação é normalizada (sem acento, minúscula), então "INATIVO",
   "em inativacao" e afins caem no lugar certo. Vazio ou valor que não
   reconhecemos vira 'sem informação' (cinza) — nunca some da tela. */
const SITUACOES={
  ativo:{rot:'Ativo',dica:'Cliente ativo.'},
  inativando:{rot:'Em inativação',dica:'Cliente em processo de inativação.'},
  inativo:{rot:'Inativo',dica:'Cliente inativo.'},
  sem:{rot:'sem situação',dica:'A coluna Ativo está em branco ou com um valor que não reconheço.'}
};
function situacaoDe(cli){
  const s=normTxt(cli.ativo||valorDe(cli,COL.ativo));
  if(!s)return 'sem';
  if(/inativacao|inativando/.test(s))return 'inativando';              // "Em inativação"
  if(/^(inativo|inativa|nao|n|false|falso|0|-)$/.test(s))return 'inativo';
  if(/^(ativo|ativa|sim|s|true|verdadeiro|1|x)$/.test(s))return 'ativo';
  return 'sem';
}
/* Compatibilidade com quem só quer saber "está ativo?": em inativação e valor
   desconhecido continuam fora do sim/não (null), como era antes. */
function ativoDe(cli){const s=situacaoDe(cli);return s==='ativo'?true:s==='inativo'?false:null;}
function classeSituacao(cli){return 'sit-'+situacaoDe(cli);}

/* ---------------- filtros ---------------- */
const FILTROS=[
  {k:'todos',rot:'Todos',fn:()=>true},
  {k:'ativos',rot:'Ativos',fn:c=>situacaoDe(c)==='ativo',dep:'ativo'},
  {k:'inativando',rot:'Em inativação',fn:c=>situacaoDe(c)==='inativando',dep:'ativo'},
  {k:'inativos',rot:'Inativos',fn:c=>situacaoDe(c)==='inativo',dep:'ativo'},
  {k:'sem_cnpj',rot:'Sem CNPJ',fn:c=>!valorDe(c,COL.cnpj),dep:'cnpj',cls:'falta'},
  {k:'sem_regime',rot:'Sem regime',fn:c=>!valorDe(c,COL.regime),dep:'regime',cls:'falta'},
  {k:'sem_inicio',rot:'Sem data de início da contabilidade',fn:c=>exigeInicio(c)&&!valorDe(c,COL.inicio),dep:'inicio',cls:'falta'},
  {k:'sem_produtos',rot:'Sem produtos',fn:c=>!valorDe(c,COL.produtos),dep:'produtos',cls:'falta'},
  {k:'sem_drive',rot:'Sem pasta no Drive',fn:c=>!valorDe(c,COL.drive),dep:'drive',cls:'falta'}
];
function filtrosVivos(){return FILTROS.filter(f=>!f.dep||COL[f.dep]);}
function fnFiltro(k){const f=FILTROS.find(x=>x.k===k);return f?f.fn:(()=>true);}

/* ================= a régua de três controles =================
   O dono pediu, com estas palavras: "Ativos (status), um filtro checkbox ·
   Produtos, outro filtro checkbox · Com pendências um botão". Os três estados
   abaixo são o que a régua guarda, e os três compõem com E: quem marca "Ativo"
   e "Contabilidade" e liga "Com pendências" está perguntando pelos clientes
   ativos de contabilidade que têm alguma coisa faltando.

   `FILTRO` (o <select> de uma escolha só) NÃO morreu: ele continua sendo o
   caminho de quando o b4u-filtro.js não carrega, e é lá que as nove opções de
   antes continuam inteiras, uma de cada vez. Com o módulo, ele fica em 'todos'
   e quem manda são os três daqui. */
/* null = ainda não decidido. Vira a lista inteira de situações assim que os
   clientes chegam — é o estado com que a tela SEMPRE abriu (nenhum filtro de
   situação), e o padrão não pode mudar por causa de uma troca de controle. */
let F_SIT=null;
/* Vazio quer dizer TODOS (`vazio:'todos'` no componente): são poucos produtos,
   mas marcar todos para dizer "não quero filtrar" continua sendo absurdo. */
let F_PROD=[];
let F_PEND=false;
/* Valor sentinela do item "(sem produtos)" da caixa de Produtos. Ele existe para
   que a opção "Sem produtos" do antigo <select> não se perca: ela era um filtro
   de pendência e continua alcançável, agora dentro da pergunta em que ela cabe. */
const PROD_SEM='__sem__';

/* ---- de onde saem as contagens do rótulo (`Ativo · 12`) ----
   Da carteira depois da BUSCA, e só dela. A contagem responde "quantos sobram se
   eu marcar isto agora", e quem digitou "campinas" está perguntando dentro de
   Campinas — um número que continuasse contando a carteira inteira estaria
   respondendo outra pergunta, bem no momento em que a pessoa mais precisa dele.

   E é SÓ a busca: não é facetada pelas outras caixas nem pelo botão de
