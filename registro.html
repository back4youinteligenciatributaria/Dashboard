<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Guia nova por padrão: link clicado não tira o colaborador de onde ele estava. -->
<base target="_blank">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registros de clientes (equipe) — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Duas origens porque o /exec responde 302 para a segunda: sem isto o aparelho paga
     DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte não pode segurar a primeira pintura: entra como preload e vira folha depois. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"></noscript>
<style>
:root{
  /* Paleta canonica da equipe — a mesma em todas as telas. */
  --canvas:#F1E7DC;--surface:#FFFFFF;--surface-warm:#FBF6EF;
  --ink:#113D39;--ink-2:#3F5854;--muted:#6E6256;--line:#E4D9C9;--line-2:#D6C3AC;
  --brand-dark:#073034;--brand-teal:#0F8C85;--brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,37:1 no canvas).
     Este e o mesmo teal escurecido so para letra e fundo de letra; o --brand-teal
     segue canonico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E;--amber-txt:#8A5A10;--amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber da 2,61:1 com #fff, o --amber-2 da 4,68:1. Como
     preenchimento de barra, icone ou borda, o --amber original continua valendo. */
  --amber-2:#B05F12;
  --vermelho:#C0392B;--verde:#2E9D5F;--verde-2:#25804C;
  /* Raios: so pelos tokens — 10 em campo, 12 padrao, 16 nos blocos grandes, pilula. */
  --radius-sm:10px;--radius:12px;--radius-lg:16px;--radius-pill:999px;
  /* Escala de texto e o teal claro: as outras telas ja tinham, esta nao. Sem eles
     o CSS compartilhado da regua de acoes cai no valor herdado e desalinha. */
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:15px; --fs-5:19px; --fs-6:24px;
  --receita-soft:#DBEFEC;
  /* Levantar de cartao clicavel: uma sombra so, igual em todas as telas. */
  --lift:0 8px 20px rgba(17,61,57,.10);
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- barra superior (igual às páginas irmãs) ---------- */
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:var(--radius-pill);white-space:nowrap}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd;white-space:nowrap}
.barra a.volta,.barra a.plan{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.barra a.plan{border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:4px 11px}
.save-status{font-size:13px;font-weight:800;padding:6px 13px;border-radius:var(--radius-pill);background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
/* Branco sobre --amber da 2,61:1 e sobre --verde 3,44:1 — o rotulo do proprio
   status de gravacao some. Um degrau mais escuro na MESMA familia: 4,68:1 e 4,92:1. */
.save-status.saving{background:var(--amber-2);color:#fff}.save-status.ok{background:var(--verde-2);color:#fff}.save-status.err{background:var(--vermelho);color:#fff}

/* ---------- topo: busca + chips ---------- */
.topo{padding:14px 16px 6px}
.linha-busca{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.busca{flex:1;min-width:0;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.btn-novo{flex:none;white-space:nowrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;font-weight:700;border-radius:var(--radius-pill);padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--brand-teal)}
.chip.on{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.chip.falta.on{background:var(--amber);border-color:var(--amber)}
.chip.limpar{border-style:dashed;color:var(--muted)}
.chip .n{background:rgba(0,0,0,.10);border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.dica{font-size:12px;color:var(--muted);padding:8px 16px 0}

/* ---------- ordenação ---------- */
.chips .rot{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px;align-self:center}
.ord-row{margin-top:7px}
.chip .ord{margin-left:5px;font-size:11px;opacity:.9}
.ord-info{font-size:12px;color:var(--muted);font-weight:700;margin-top:7px}
.ord-info b{color:var(--ink-2)}

/* ---------- selo de completude ---------- */
.selo{font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap;letter-spacing:.2px;
  background:#EEF3F1;color:#4a6360;border:1px solid #D9E5E2;cursor:help}
.selo.ok{background:#E6F3EC;color:#1f6b45;border-color:#BFE0CD}
.selo.alerta{background:var(--amber-soft);color:#8a5117;border-color:var(--amber-line)}

/* ---------- cards de resumo (mesmo padrão do certificados.html) ---------- */
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:10px 16px 0}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.rhead{padding:9px 13px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff}
.rcard.incompletos .rhead{background:var(--amber)}
.rcard.semdado .rhead{background:#6B8486}
.rcard.semdado2 .rhead{background:var(--brand-teal-txt)}
.rhead .n{background:rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:2px 9px;font-size:12px}
.rlista{max-height:158px;overflow:auto;padding:5px}
.tk{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px}
.tk:hover{background:var(--surface-warm)}
.tk .d{font-weight:800;white-space:nowrap;color:var(--brand-teal-txt)}
.tk .lb{color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .tp{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.rvazio{color:var(--muted);font-size:12px;padding:9px}
@media(max-width:760px){.resumo{grid-template-columns:1fr}}

/* ---------- lista de clientes ---------- */
.lista{padding:12px 16px 48px;display:flex;flex-direction:column;gap:8px}
.cli{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cli.aberto{border-color:var(--brand-teal);box-shadow:0 5px 20px rgba(7,48,52,.10)}
/* Situação do cliente: faixa lateral colorida para bater o olho na lista fechada
   e ver na hora quem não está ativo — sem precisar abrir o cadastro. */
.cli.sit-inativando,.cli.aberto.sit-inativando{border-left:4px solid var(--amber)}
.cli.sit-inativo,.cli.aberto.sit-inativo{border-left:4px solid var(--vermelho)}
.cli-head{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;padding:11px 13px;cursor:pointer;font-family:var(--sans);color:inherit;flex-wrap:wrap}
.cli-head:hover{background:var(--surface-warm)}
.cli-id{font-weight:800;color:var(--brand-teal-txt);font-size:13px;white-space:nowrap;min-width:54px}
.cli-nome{font-weight:700;font-size:15px;flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end;flex:2 1 260px;min-width:0}
.mt{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap;max-width:250px;overflow:hidden;text-overflow:ellipsis}
/* O `.vazio` da lista sem resultado (15px, padding de 30px) estava vencendo aqui e
   inchava o selo "sem CNPJ" num balão de 80px de altura. Repete o tamanho do .mt. */
.mt.vazio{color:var(--muted);font-weight:600;background:transparent;border-style:dashed;font-size:11px;padding:2px 9px}
/* Selo de situação: Ativo (verde discreto) · Em inativação (âmbar) · Inativo
   (vermelho) · sem informação (cinza). Aparece na linha fechada da lista. */
.pill{font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap;letter-spacing:.2px;border:1px solid transparent}
.pill.sit-ativo{background:#E6F3EC;color:#1f6b45;border-color:#BFE0CD}
.pill.sit-inativando{background:var(--amber-soft);color:#8A4B12;border-color:var(--amber)}
.pill.sit-inativo{background:#F7E2DF;color:#8E2A1D;border-color:var(--vermelho)}
.pill.sit-sem{background:#EEE9E2;color:var(--muted);border-color:var(--line)}
.chev{flex:none;color:var(--muted);font-size:19px;font-weight:800;transition:transform .15s;line-height:1}
.cli.aberto .chev{transform:rotate(90deg);color:var(--brand-teal-txt)}

/* ---------- dropdown com o cadastro completo ---------- */
.corpo{border-top:1px solid var(--line);background:var(--surface-warm);padding:13px 13px 16px}
.gsec{margin-bottom:13px}
.gsec:last-of-type{margin-bottom:6px}
.gsec h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand-dark);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.gsec h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--brand-teal);flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fld{display:flex;flex-direction:column;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label,.fld>.lbl{font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld>label .req,.fld>.lbl .req{color:var(--amber-txt)}
.fld .cad{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.fld input,.fld select,.fld textarea{font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
.fld textarea{resize:vertical;min-height:42px;line-height:1.35}
.fld select{font-weight:600;cursor:pointer}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand-teal);outline-offset:0}
/* Campo esperado e ainda em branco: fundo avermelhado bem suave + borda um tom
   mais forte. É dica visual para varrer a tela, não erro — some ao preencher. */
.fld.emfalta>input,.fld.emfalta>select,.fld.emfalta>textarea{background:#FDF2EF;border-color:#E7C3BB}
.fld.emfalta>.lbl{color:#8A5A50}
.fld .ro{font-size:13px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:var(--radius-sm);background:#EFE8DE;color:var(--ink-2);
  min-height:38px;word-break:break-word;display:flex;align-items:center;gap:7px;cursor:not-allowed}
.fld .ro .cad-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .ro a{color:var(--brand-teal-txt);text-decoration:none;font-weight:800;flex:none;cursor:pointer}
.rodape{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
.rodape .lk{color:var(--brand-teal-txt);text-decoration:none;font-weight:800;font-size:12px}
.ign{background:var(--amber-soft);border:1px solid var(--amber-line);color:#8a5117;border-radius:var(--radius-sm);padding:8px 11px;font-size:12px;font-weight:700;margin-bottom:10px}
.ign:empty{display:none}

/* ---------- modal de cliente novo ---------- */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:90;background:rgba(7,48,52,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
/* O modal cobre a janela inteira (position:fixed;inset:0), inclusive a faixa dos
   264px onde mora o menu lateral — e o menu é z-index:940. Com os 90 daqui, o
   menu ficava POR CIMA do véu: clicável durante o "Criando… não feche a página",
   que é exatamente o momento em que sair da tela custa um cliente duplicado.
   A regra é escopada em `body.b4s` de propósito: sem o b4u-shell.js a página
   continua com os 90 originais e nada muda. */
body.b4s .modal{z-index:960}
.modal-box{background:var(--canvas);border-radius:var(--radius-lg);width:100%;max-width:860px;overflow:hidden;box-shadow:0 20px 60px rgba(7,48,52,.35)}
.modal-top{position:sticky;top:0;z-index:2;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:10px;padding:13px 16px}
.modal-top b{font-size:15px;font-weight:800}
.modal-top .spacer{flex:1}
.modal-top button{font-family:var(--sans);font-size:19px;font-weight:800;line-height:1;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:var(--radius-pill);width:32px;height:32px;cursor:pointer}
.modal-body{padding:16px}
.modal .grid{grid-template-columns:repeat(2,1fr)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.sec>h2{font-size:13px;font-weight:800;margin:0 0 11px;color:var(--brand-dark);display:flex;align-items:center;gap:8px}
.sec>h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--brand-teal)}
.idcard{background:linear-gradient(135deg,rgba(15,140,133,.12),rgba(63,166,128,.07));border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.idcard .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.idcard .idval{font-size:24px;font-weight:800;color:var(--brand-teal);letter-spacing:1px}
.idcard .nome{font-size:13px;color:var(--ink-2);margin-top:3px}
.prods{display:flex;flex-wrap:wrap;gap:8px}
.prod{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface-warm);border:1px solid var(--line-2);border-radius:var(--radius-pill);padding:8px 13px;cursor:pointer;user-select:none}
.prod input{accent-color:var(--brand-teal);width:16px;height:16px}
.prod.on{background:rgba(15,140,133,.10);border-color:var(--brand-teal);color:var(--brand-dark)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.fld.miss input,.fld.miss select,.fld.miss textarea{border-color:var(--vermelho);background:#fdf3f1}
/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:var(--radius-pill);padding:12px 20px}
.foot{display:flex;gap:10px;align-items:center;margin-top:6px}
.foot .btn--pri{flex:1}
.msg{font-size:13px;font-weight:700;min-height:18px;margin:8px 0}
.msg.err{color:var(--vermelho)}
.ok-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;text-align:center}
.ok-card h1{font-size:19px;margin:6px 0}
.ok-card .big{font-size:24px;font-weight:800;color:var(--brand-teal);letter-spacing:1px}
.ok-links{display:flex;flex-direction:column;gap:8px;margin:15px 0;text-align:left}
.ok-links a{background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;text-decoration:none;color:var(--brand-dark);font-weight:700;font-size:13px}
.avisos{background:var(--amber-soft);border:1px solid var(--amber-line);color:#8a5117;border-radius:var(--radius-sm);padding:11px 13px;font-size:13px;text-align:left;margin:4px 0 12px}

/* ---------- estados ---------- */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:48vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:52ch}
.state code{background:var(--surface-warm);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vazio{padding:30px 16px;text-align:center;color:var(--muted);font-size:15px}
@keyframes fl{0%{background:#FFE79A}100%{background:transparent}}
.flash{animation:fl 1.8s ease}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .barra .tag,.barra .cnt{display:none}
  .cli-meta{justify-content:flex-start;flex-basis:100%;order:3}
  .cli-nome{flex-basis:auto}
  .linha-busca{flex-wrap:wrap}
  .busca{flex-basis:100%}
  .btn-novo{flex:1;text-align:center}
}
@media(max-width:600px){.grid,.modal .grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}


/* ---------- revelacao progressiva ---------- */
/* Régua de ações: busca sempre à mão, filtros a um clique, contagem à vista.
   Antes os filtros ficavam todos abertos na tela — quem chegava tinha de ler a
   parede inteira antes de achar o campo de busca, que é o que 9 em 10 usam. */
.barra-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.barra-acoes .campo-busca{flex:1;min-width:200px;font-size:16px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink)}
.barra-acoes .campo-busca:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.btn-filtros{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--ink);font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.btn-filtros:hover{border-color:var(--brand-teal)}
.btn-filtros[aria-expanded="true"]{background:var(--receita-soft);border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.btn-filtros svg{width:15px;height:15px;flex:none}
.cont-filtros{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
/* A chave da equipe não é mais fixa: é o código do dia de cada colaborador
   (aba "Colaboradores" da planilha de Contatos), que chega por e-mail no
   index.html. Esta constante ficou vazia de propósito — se voltar a ter valor,
   volta a existir uma senha compartilhada que não expira e não diz quem é quem. */
const CHAVE_PADRAO = '';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}

/* Sem chave na URL não há painel da equipe. A porta é o index.html: a pessoa
   digita o e-mail, recebe o código do dia e volta para CÁ — é para isso que
   serve o `destino`, senão todo login despejaria a pessoa na home da equipe,
   longe do que ela tinha clicado.
   Até 04/08/2026 existia uma chave fixa antiga escrita aqui como padrão: quem
   abrisse a página sem chave nenhuma entrava assim mesmo, sem se identificar.
   A string não se repete neste arquivo de propósito — ele é servido ao
   navegador, e comentário vaza igual a código. */
if (!chaveAtual()) {
  location.replace('index.html?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}
/* o que vem depois do # é o CÓDIGO do colaborador — vai no log, na coluna "Colaborador" */
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash
// (formato antigo dos atalhos por pessoa). Vira a coluna "Colaborador" da aba log.
function codAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* ---------- busca que entende CNPJ com e sem pontuação (C.1) ---------- */
function soDigitos(s){return String(s==null?'':s).replace(/\D/g,'');}
/** Compara o texto normalizado e, quando o termo tem 6 dígitos ou mais, também
 *  só os dígitos dos dois lados. */
function casaBusca(alvoTxt,alvoDig,termo){
  const t=normTxt(termo);
  if(!t)return true;
  if(alvoTxt.indexOf(t)>=0)return true;
  const d=soDigitos(termo);
  return d.length>=6&&alvoDig.indexOf(d)>=0;
}
/** Lembra no navegador se a explicação fica aberta — a escolha é de quem usa. */
function ligarDetalhes(el,chave){
  if(!el)return;
  try{if(localStorage.getItem(chave)==='1')el.open=true;}catch(e){}
  el.addEventListener('toggle',()=>{try{localStorage.setItem(chave,el.open?'1':'0');}catch(e){}});
}

/* ---------------- revelação progressiva ---------------- */
/* Filtros recolhidos, com memória. O contador ao lado do botão existe para
   evitar o único efeito colateral ruim de esconder filtro: a pessoa esquece que
   filtrou e acha que os dados sumiram. Por isso, com filtro ativo, o painel
   nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da lista. Dois botões de propósito: "mais 20" para quem lê, "todos" para
   quem vai usar Ctrl+F. Buscar ou filtrar volta o teto ao início — o resultado
   é outro, e continuar de onde parou confundiria. */
const PASSO = 20;
let TETO = PASSO;
function rodapeLista(mostrados, total){
  if(total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todos os ${total}</button>
  </div>`;
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Ficou vazia de propósito: quem cuida da espera na tela agora é o b4u-espera.js.
   As frases que esta função escrevia falavam em demora e em tentar de novo, e era
   lendo isso que a pessoa recarregava justo quando a resposta já vinha. A função
   continua existindo porque ainda é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
   de espera continua correndo por cima, sem avisar da repetição: quem lê "tentando
   de novo" recarrega justo quando a resposta já vinha. Erro só se a segunda falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
async function postAcao(obj){const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});const d=await r.json();if(d&&d.erro)throw new Error(d.erro);return d;}
/* normaliza rótulo de coluna igual ao backend (sem acento, minúsculo, sem ?:. no fim) */
function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim().replace(/[?:.]+$/,'');}

};
/* Colunas que o sistema gerencia: não entram no form de cliente novo, mas aparecem

};

/* Campo sintético UF: NÃO é coluna do Registro (vai só p/ o Config fiscal), mas é obrigatório. */

/* Reserva: se o servidor não devolver os cabeçalhos, a tela ainda tem quais campos

const REMOVIDOS=[];
