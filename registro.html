/**
 * Monta os campos a partir dos cabeçalhos vivos.
 * modo 'novo'    -> form de cliente novo: pula as colunas do sistema e injeta UF depois de Cidade.
 * modo 'edicao'  -> cadastro completo: TODAS as colunas (as travadas entram só de leitura).
 */
function montarCampos(headers,modo){
  const campos=[],roles={},edicao=(modo==='edicao');
  const dicas=edicao?Object.assign({},HINTS,HINTS_SISTEMA):HINTS;
  (headers||[]).forEach(h=>{
    const k=norm(h);
    if(!k)return;
    if(REMOVIDOS.indexOf(k)>=0)return;                // coluna aposentada: não vira campo
    if(!edicao&&SKIP.indexOf(k)>=0)return;            // colunas que o sistema gerencia
    const hint=dicas[k]||{s:'Outros'};
    if(hint.role)roles[hint.role]=h;
    campos.push({s:hint.s||'Outros',col:h,t:hint.t||'text',req:!edicao&&!!hint.req,full:!!hint.full,opts:hint.opts,ph:hint.ph||'',max:hint.max,up:!!hint.up});
  });
  if(!edicao){
    roles.uf='UF';
    const uf=Object.assign({},UF_FIELD);
    const iC=campos.findIndex(f=>norm(f.col)==='cidade');
    if(iC>=0)campos.splice(iC+1,0,uf);else campos.push(uf);
  }
  const ord=f=>{const i=SEC_ORDER.indexOf(f.s);return i<0?SEC_ORDER.length:i;};
  const lista=campos.map((f,i)=>(f._i=i,f)).sort((a,b)=>ord(a)-ord(b)||a._i-b._i);
  lista.roles=roles;
  return lista;
}

/* ===================================================================
   Estado da lista
   =================================================================== */
let COLUNAS=[],TRAVADAS=new Set(),CLIENTES=[],META={},CAMPOS_EDIT=[],COL={};
let ABERTOS=new Set(),FILTRO='todos',TERMO='';

/* ===================================================================
   Completude do cadastro — a regra do selo "N campos vazios"
   -------------------------------------------------------------------
   Entram na conta só as colunas EDITÁVEIS do cadastro. Ficam de fora:
   · as travadas (🔒) — o sistema é quem preenche;
   · "Data de fim da contabilidade" — em branco ali quer dizer contrato
     em andamento, não buraco no cadastro;
   · "Ativo" — é situação do cliente, não campo de cadastro;
   · as colunas APOSENTADAS (REMOVIDOS) — já não aparecem no cadastro;
   · toda coluna preenchida por menos de 20% dos clientes (coluna de
     exceção: CNES, obs de aluguel e afins). O corte sai dos próprios
     dados que vieram, então se ajusta sozinho quando a equipe cria uma
     coluna nova ou passa a usar uma que estava parada.
   O selo fica âmbar quando falta mais de um terço dos campos esperados
   (mínimo de 3), que é quando o cadastro deixa de ser "quase pronto".

   Essa MESMA lista (COLS_COMPLETUDE) é a régua do destaque avermelhado dos
   campos em branco lá no cadastro aberto — selo e destaque contam a mesma coisa.
   =================================================================== */
const FORA_DA_CONTA=['data de fim da contabilidade','ativo'];
const PISO_USO=0.2;
let COLS_COMPLETUDE=[],SET_COMPLETUDE=new Set(),LIMIAR_VAZIOS=99;
function calcularCompletude(){
  const base=CLIENTES.length||1;
  COLS_COMPLETUDE=COLUNAS.filter(col=>{
    const k=norm(col);
    if(!k||ehTravada(col)||FORA_DA_CONTA.indexOf(k)>=0||REMOVIDOS.indexOf(k)>=0)return false;
    let preenchidas=0;
    CLIENTES.forEach(c=>{if(valorDe(c,col))preenchidas++;});
    return preenchidas/base>=PISO_USO;
  });
  SET_COMPLETUDE=new Set(COLS_COMPLETUDE);
  LIMIAR_VAZIOS=Math.max(3,Math.ceil(COLS_COMPLETUDE.length/3));
  CLIENTES.forEach(c=>{c._v=null;});
}
/* Campo que "conta": editável, esperado pela régua acima. É o que ganha o
   destaque avermelhado quando está em branco. */
function ehEsperado(col){return !ehTravada(col)&&SET_COMPLETUDE.has(col);}
function vaziasDe(cli){return COLS_COMPLETUDE.filter(col=>!valorDe(cli,col));}
function vaziosDe(cli){if(cli._v==null)cli._v=vaziasDe(cli).length;return cli._v;}
function tituloSelo(cli){
  const f=vaziasDe(cli);
  const tot=COLS_COMPLETUDE.length;
  if(!f.length)return 'Os '+tot+' campos considerados estão preenchidos.';
  return 'Em branco: '+f.slice(0,12).join(', ')+(f.length>12?' e mais '+(f.length-12):'')+' — de '+tot+' campos considerados.';
}
function seloHTML(cli){
  if(!COLS_COMPLETUDE.length)return '';
  const n=vaziosDe(cli);
  const cl=n===0?'ok':(n>=LIMIAR_VAZIOS?'alerta':'');
  const txt=n===0?'cadastro completo':(n+(n===1?' campo vazio':' campos vazios'));
  return `<span class="selo ${cl}" title="${esc(tituloSelo(cli))}">${txt}</span>`;
}

/* ---------------- ordenação ---------------- */
const ORDENS=[
  {k:'id',rot:'ID',asc:'do menor para o maior',desc:'do maior para o menor'},
  {k:'nome',rot:'Nome',asc:'A → Z',desc:'Z → A'},
  {k:'inicio',rot:'Início da contabilidade',asc:'mais antigo primeiro',desc:'mais novo primeiro',dep:'inicio'},
  {k:'ativo',rot:'Situação',asc:'ativos primeiro',desc:'inativos primeiro',dep:'ativo'},
  {k:'vazios',rot:'Campos vazios',asc:'mais incompleto primeiro',desc:'mais completo primeiro'}
];
let ORDEM='id',DIR='asc';
function ordensVivas(){return ORDENS.filter(o=>!o.dep||COL[o.dep]);}
function porId(a,b){return String(a.id).localeCompare(String(b.id),'pt',{numeric:true});}
/* aceita aaaa-mm-dd e dd/mm/aaaa; texto livre ("a definir") conta como sem data */
function chaveInicio(cli){
  const v=valorDe(cli,COL.inicio);
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return (+m[1])*10000+(+m[2])*100+(+m[3]);
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return (+m[3])*10000+(+m[2])*100+(+m[1]);
  return null;
}
function ordenar(arr){
  const d=DIR==='asc'?1:-1;
  return arr.sort((a,b)=>{
    if(ORDEM==='nome')return normTxt(a.nome).localeCompare(normTxt(b.nome),'pt')*d||porId(a,b);
    if(ORDEM==='inicio'){
      const x=chaveInicio(a),y=chaveInicio(b);
      if(x==null&&y==null)return porId(a,b);
      if(x==null)return 1;                       /* sem data fica sempre no fim */
      if(y==null)return -1;
      return (x-y)*d||porId(a,b);
    }
    if(ORDEM==='ativo'){
      /* ativo → em inativação → inativo; sem informação sempre no fim */
      const peso={ativo:0,inativando:1,inativo:2};
      const rank=c=>{const s=situacaoDe(c);return s==='sem'?9:peso[s];};
      const ra=rank(a),rb=rank(b);
      if(ra===9||rb===9)return ra===rb?porId(a,b):ra-rb;
      return (ra-rb)*d||porId(a,b);
    }
    if(ORDEM==='vazios')return (vaziosDe(b)-vaziosDe(a))*d||porId(a,b);
    return porId(a,b)*d;
  });
}
function desenharOrdem(){
  const box=document.getElementById('ordChips');if(!box)return;
  const vivas=ordensVivas();
  if(!vivas.some(o=>o.k===ORDEM)){ORDEM='id';DIR='asc';}
  box.innerHTML='<span class="rot">Ordenar por</span>'+vivas.map(o=>
    `<button type="button" class="chip ${ORDEM===o.k?'on':''}" data-s="${o.k}">${esc(o.rot)}${ORDEM===o.k?`<span class="ord">${DIR==='asc'?'▲':'▼'}</span>`:''}</button>`).join('');
  const at=vivas.find(o=>o.k===ORDEM)||vivas[0];
  const info=document.getElementById('ordInfo');
  if(info&&at)info.innerHTML='Ordenado por <b>'+esc(at.rot)+'</b> — '+esc(DIR==='asc'?at.asc:at.desc)+'. Clicar de novo no mesmo critério inverte.';
}

/* ---------------- cards de resumo ---------------- */
function itemResumo(cli,tp){
  return `<div class="tk" data-goto="${esc(cli.id)}" title="Abrir o cadastro de ${esc(cli.nome||cli.id)}">
    <span class="d">${esc(cli.id)}</span><span class="lb">${esc(cli.nome||'(sem nome)')}</span>
    <span class="tp">${esc(tp)}</span></div>`;
}
function cardResumo(cls,titulo,tit,lista,render){
  return `<div class="rcard ${cls}"><div class="rhead" title="${esc(tit)}"><span>${esc(titulo)}</span><span class="n">${lista.length}</span></div>
    <div class="rlista">${lista.length?lista.slice(0,60).map(render).join(''):'<div class="rvazio">Nada por aqui 🎉</div>'}</div></div>`;
}
function desenharResumo(){
  const el=document.getElementById('resumo');if(!el)return;
  /* cadastro pela metade de cliente inativo não é tarefa de ninguém: fica fora dos cards */
  const base=CLIENTES.filter(c=>ativoDe(c)!==false);
  const incompletos=base.filter(c=>vaziosDe(c)>0).sort((a,b)=>vaziosDe(b)-vaziosDe(a)||porId(a,b));
  const cards=[cardResumo('incompletos','Cadastros mais incompletos',
    'Clientes que não estão marcados como inativos, do mais vazio para o mais completo. Clique para abrir o cadastro.',
    incompletos,c=>itemResumo(c,vaziosDe(c)+' vazios'))];
  if(COL.cnpj)cards.push(cardResumo('semdado','Sem CNPJ ou CPF',
    'Clientes não inativos sem CNPJ/CPF.',
    base.filter(c=>!valorDe(c,COL.cnpj)),c=>itemResumo(c,'sem CNPJ')));
  if(COL.inicio)cards.push(cardResumo('semdado2','Sem data de início',
    'Clientes não inativos sem data de início da contabilidade.',
    base.filter(c=>exigeInicio(c)&&!valorDe(c,COL.inicio)),c=>itemResumo(c,'sem início')));
  el.innerHTML=cards.join('');
}

/* Cliente SÓ de equiparação não tem data de início da contabilidade — não existe
   contabilidade para começar. Cobrar o campo dele enche a lista de "faltando" com
   uma pendência que ninguém pode resolver, e pendência que não se resolve treina
   a equipe a ignorar a lista inteira.
   O teste é sobre os PRODUTOS: se sobra alguma coisa depois de tirar as palavras
   de equiparação, é cliente de contabilidade também e a data volta a ser exigida. */
function soEquiparacao(c){
  const p=normTxt(valorDe(c,COL.produtos)||'');
  if(!p) return false;                       // sem produto declarado não dá para afirmar nada
  // "Equiparação Hospitalar" e "Restituição Tributária" são o mesmo produto com
  // sobrenome — os qualificadores saem junto, senão sobra palavra e o cliente
  // volta a ser cobrado pela data que ele não tem.
  const resto=p.replace(/equipara[cç][aã]o|restitui[cç][aã]o/g,'')
               .replace(/hospitalar|tribut[aá]ria?|previdenci[aá]ria?/g,'')
               .replace(/[^a-z0-9]+/g,'');
  return resto==='';
}
function exigeInicio(c){ return !soEquiparacao(c); }

function ehTravada(col){return TRAVADAS.has(norm(col));}
function valorDe(cli,col){return col?String((cli.valores||{})[col]||'').trim():'';}
/** Acha o nome EXATO da coluna a partir de apelidos normalizados (exato e depois "contém"). */
function colDe(alts){
  for(const a of alts){const c=COLUNAS.find(x=>norm(x)===a);if(c)return c;}
  for(const a of alts){const c=COLUNAS.find(x=>norm(x).indexOf(a)>=0);if(c)return c;}
  return '';
}
function mapearColunas(){
  COL={
    nome:colDe(['nome']),
    ativo:colDe(['ativo']),
    cnpj:colDe(['cnpj ou cpf','cnpj/cpf','cnpj']),
    razao:colDe(['razao social da empresa','razao social']),
    fantasia:colDe(['nome fantasia']),
    cidade:colDe(['cidade']),
    regime:colDe(['regime']),
    produtos:colDe(['produtos back4you','produtos']),
    drive:colDe(['drive']),
    inicio:colDe(['data de inicio da contabilidade'])
  };
}
function simNao(v){const s=normTxt(v);if(!s)return null;
  if(/^(sim|s|true|verdadeiro|1|x|ativo)$/.test(s))return true;
  if(/^(nao|n|false|falso|0|-|inativo)$/.test(s))return false;return null;}

/* ---------------- situação do cliente (coluna "Ativo") ----------------
   A planilha usa três valores: Ativo · Em inativação · Inativo.
   A comparação é normalizada (sem acento, minúscula), então "INATIVO",
   "em inativacao" e afins caem no lugar certo. Vazio ou valor que não
   reconhecemos vira 'sem informação' (cinza) — nunca some da tela. */
const SITUACOES={
  ativo:{rot:'Ativo',dica:'Cliente ativo.'},
  inativando:{rot:'Em inativação',dica:'Cliente em processo de inativação.'},
  inativo:{rot:'Inativo',dica:'Cliente inativo.'},
  sem:{rot:'sem situação',dica:'A coluna Ativo está em branco ou com um valor que não reconheço.'}
};
function situacaoDe(cli){
  const s=normTxt(cli.ativo||valorDe(cli,COL.ativo));
  if(!s)return 'sem';
  if(/inativacao|inativando/.test(s))return 'inativando';              // "Em inativação"
  if(/^(inativo|inativa|nao|n|false|falso|0|-)$/.test(s))return 'inativo';
  if(/^(ativo|ativa|sim|s|true|verdadeiro|1|x)$/.test(s))return 'ativo';
  return 'sem';
}
/* Compatibilidade com quem só quer saber "está ativo?": em inativação e valor
   desconhecido continuam fora do sim/não (null), como era antes. */
function ativoDe(cli){const s=situacaoDe(cli);return s==='ativo'?true:s==='inativo'?false:null;}
function classeSituacao(cli){return 'sit-'+situacaoDe(cli);}

/* ---------------- filtros ---------------- */
const FILTROS=[
  {k:'todos',rot:'Todos',fn:()=>true},
  {k:'ativos',rot:'Ativos',fn:c=>situacaoDe(c)==='ativo',dep:'ativo'},
  {k:'inativando',rot:'Em inativação',fn:c=>situacaoDe(c)==='inativando',dep:'ativo'},
  {k:'inativos',rot:'Inativos',fn:c=>situacaoDe(c)==='inativo',dep:'ativo'},
  {k:'sem_cnpj',rot:'Sem CNPJ',fn:c=>!valorDe(c,COL.cnpj),dep:'cnpj',cls:'falta'},
  {k:'sem_regime',rot:'Sem regime',fn:c=>!valorDe(c,COL.regime),dep:'regime',cls:'falta'},
  {k:'sem_inicio',rot:'Sem data de início da contabilidade',fn:c=>exigeInicio(c)&&!valorDe(c,COL.inicio),dep:'inicio',cls:'falta'},
  {k:'sem_produtos',rot:'Sem produtos',fn:c=>!valorDe(c,COL.produtos),dep:'produtos',cls:'falta'},
  {k:'sem_drive',rot:'Sem pasta no Drive',fn:c=>!valorDe(c,COL.drive),dep:'drive',cls:'falta'}
];
function filtrosVivos(){return FILTROS.filter(f=>!f.dep||COL[f.dep]);}
function fnFiltro(k){const f=FILTROS.find(x=>x.k===k);return f?f.fn:(()=>true);}
function chaveBusca(cli){
  if(cli._b==null)cli._b=normTxt([cli.id,cli.nome,valorDe(cli,COL.cnpj),valorDe(cli,COL.razao),valorDe(cli,COL.fantasia),valorDe(cli,COL.cidade)].join(' '));
  return cli._b;
}
/* Só os dígitos do ID e do CNPJ/CPF — é o que faz "12345678000190" achar
   "12.345.678/0001-90" (a planilha guarda pontuado). */
function digitosBusca(cli){
  if(cli._bd==null)cli._bd=soDigitos(cli.id+' '+valorDe(cli,COL.cnpj));
  return cli._bd;
}
function visiveis(){
  const fn=fnFiltro(FILTRO),termo=normTxt(TERMO);
  return ordenar(CLIENTES.filter(c=>fn(c)&&(!termo||casaBusca(chaveBusca(c),digitosBusca(c),termo))));
}

/* ---------------- lista ---------------- */
/* A linha fechada mostra só o que pede ação: o campo QUE FALTA (sem CNPJ, sem
   regime, sem produtos), a situação quando NÃO é "Ativo" e o selo de completude.
   O valor preenchido — o CNPJ inteiro, a lista de produtos — é informação, não
   tarefa: some da linha e continua no cadastro (um clique) e no title do
   cabeçalho (passar o mouse). Eram 5 selos por ficha em 110 fichas. */
function metaHTML(cli){
  const its=[];
  const add=(col,rot)=>{if(!col)return;if(valorDe(cli,col))return;
    its.push(`<span class="mt vazio" title="${esc(rot+': em branco')}">${esc('sem '+rot.toLowerCase())}</span>`);};
  add(COL.cnpj,'CNPJ');add(COL.regime,'Regime');add(COL.produtos,'Produtos');
  /* Toda situação que não seja "Ativo" continua na linha fechada — inclusive a
     em branco. "Ativo" é o esperado de 87 dos 110: repeti-lo é ruído. */
  if(COL.ativo||cli.ativo){
    const s=situacaoDe(cli),info=SITUACOES[s];
    if(s!=='ativo')its.push(`<span class="pill sit-${s}" title="${esc(info.dica)}">${esc(info.rot)}</span>`);
  }
  its.push(seloHTML(cli));
  return its.filter(Boolean).join('');
}
/** O que saiu dos selos vira o title da linha: dá para conferir sem abrir nada. */
function tituloCabeca(cli){
  const p=[];
  const add=(col,rot)=>{if(!col)return;const v=valorDe(cli,col);if(v)p.push(rot+': '+v);};
  add(COL.cnpj,'CNPJ');add(COL.regime,'Regime');add(COL.produtos,'Produtos');
  if(COL.ativo||cli.ativo)p.push('Situação: '+SITUACOES[situacaoDe(cli)].rot);
  p.push('Clique para abrir o cadastro.');
  return p.join(' · ');
}
function cabecaHTML(cli){
  return `<button type="button" class="cli-head" aria-expanded="${ABERTOS.has(cli.id)?'true':'false'}" title="${esc(tituloCabeca(cli))}">
      <span class="cli-id">${esc(cli.id)}</span>
      <span class="cli-nome">${esc(cli.nome||'(sem nome)')}</span>
      <span class="cli-meta">${metaHTML(cli)}</span>
      <span class="chev">›</span>
    </button>`;
}
function campoEditHTML(cli,f){
  const col=f.col,v=valorDe(cli,col);
  const rot=`<span class="lbl">${esc(col)}${ehTravada(col)?' <span class="cad">🔒</span>':''}</span>`;
  let ctrl;
  if(ehTravada(col)){
    const link=/^https?:/i.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener" title="abrir">↗</a>`:'';
    ctrl=`<div class="ro" title="${esc(motivoTrava(col))}"><span class="cad-txt">${esc(v||'—')}</span>${link}</div>`;
  }else if(f.t==='select'){
    const opts=(f.opts||['','Sim','Não']).slice();
    /* Valor que o cliente já tem e que não está na lista (sujeira da planilha,
       tipo "Nao" no ISS) entra na lista assim mesmo, logo abaixo do vazio e com
       o aviso "(fora da lista)". A página NUNCA apaga nem troca sozinha: o valor
       gravado continua igual até alguém escolher outro à mão. */
    const fora=!!v&&opts.indexOf(v)<0;
    if(fora)opts.splice(1,0,v);
    ctrl=`<select data-ecol="${esc(col)}">`+opts.map(o=>{
      const rot=o?esc(o)+(fora&&o===v?' (fora da lista)':''):'—';
      return `<option value="${esc(o)}"${o===v?' selected':''}>${rot}</option>`;
    }).join('')+`</select>`;
  }else if(f.t==='textarea'){
    ctrl=`<textarea data-ecol="${esc(col)}" rows="2">${esc(v)}</textarea>`;
  }else if(f.t==='date'&&(!v||/^\d{4}-\d{2}-\d{2}$/.test(v))){
    ctrl=`<input type="date" data-ecol="${esc(col)}" value="${esc(v)}">`;
  }else{
    /* coluna de data com texto livre (ex.: "a definir") continua editável como texto */
    ctrl=`<input type="text" data-ecol="${esc(col)}" value="${esc(v)}"${f.t==='date'?' placeholder="aaaa-mm-dd"':''}>`;
  }
  /* data-esperado marca o campo que conta para a régua de completude: é o que
     ganha (e perde) o destaque avermelhado conforme a pessoa vai preenchendo. */
  const esperado=ehEsperado(col);
  return `<div class="fld ${f.full?'full':''}${esperado&&!v?' emfalta':''}"${esperado?' data-esperado="1"':''}>${rot}${ctrl}</div>`;
}
function corpoHTML(cli){
  const secs=SEC_ORDER.filter(s=>CAMPOS_EDIT.some(f=>f.s===s));
  const blocos=secs.map(sc=>`<div class="gsec"><h3><span class="dot"></span>${esc(sc)}</h3>
      <div class="grid">${CAMPOS_EDIT.filter(f=>f.s===sc).map(f=>campoEditHTML(cli,f)).join('')}</div></div>`).join('');
  const drive=valorDe(cli,COL.drive);
  return `<div class="corpo" data-id="${esc(cli.id)}">
    <div class="ign" id="ign_${esc(cli.id)}"></div>
    ${blocos||'<div class="vazio">Esse cliente não tem colunas para mostrar.</div>'}
    <div class="rodape">
      <span>As alterações salvam sozinhas. Campos com 🔒 são mantidos pelo sistema.</span>
      ${/^https?:/i.test(drive)?`<a class="lk" href="${esc(drive)}" target="_blank" rel="noopener">📁 Pasta no Drive ↗</a>`:''}
      ${META.planilha_url?`<a class="lk" href="${esc(META.planilha_url)}" target="_blank" rel="noopener">Planilha ↗</a>`:''}
    </div>
  </div>`;
}
/* Quantos controles do PAINEL estão pegando agora — vira o selo ao lado do botão
   Filtros (C.5). Só conta o que está escondido lá dentro: a busca fica à vista na
   régua, e um selo por causa dela faria a pessoa procurar o que não sumiu. A
   ordenação entra porque também está no painel e também muda o que aparece. */
function filtrosPainel(){return (FILTRO!=='todos'?1:0)+(ORDEM!=='id'||DIR!=='asc'?1:0);}
function limparFiltros(){
  FILTRO='todos';TERMO='';ORDEM='id';DIR='asc';TETO=PASSO;
  const b=document.getElementById('busca');if(b)b.value='';
  redesenhar();
}
function desenharChips(){
  document.getElementById('chips').innerHTML='<span class="rot">Situação</span>'+filtrosVivos().map(f=>{
    const n=CLIENTES.filter(f.fn).length;
    return `<button type="button" class="chip ${f.cls||''} ${FILTRO===f.k?'on':''}" data-f="${f.k}">${esc(f.rot)}<span class="n">${n}</span></button>`;
  }).join('');
  /* O "Limpar filtros" agora é fixo no rodapé do painel (#btn-limpar) — não é
     mais um chip que aparece e some no meio dos outros treze. */
}
function desenharLista(){
  const arr=visiveis();
  document.getElementById('cnt').textContent=arr.length+' de '+CLIENTES.length+' clientes';
  const el=document.getElementById('lista'),dica=document.getElementById('dica');
  if(!arr.length){
    el.innerHTML=`<div class="vazio">${CLIENTES.length?'Nenhum cliente com esse filtro ou essa busca.':'Nenhum cliente cadastrado ainda.'}</div>`;
    if(dica)dica.textContent='';
    desenharChips();desenharResumoLista();sincronizarURL();
    return;
  }
  /* Teto de 20: a tela abre com o começo da lista, não com as 110 fichas. */
  const n=Math.min(TETO,arr.length);
  el.innerHTML=arr.slice(0,n).map(c=>`<div class="cli ${classeSituacao(c)}${ABERTOS.has(c.id)?' aberto':''}" data-id="${esc(c.id)}">${cabecaHTML(c)}${ABERTOS.has(c.id)?corpoHTML(c):''}</div>`).join('')+
    rodapeLista(n,arr.length);
  if(dica)dica.textContent=arr.length>n?('Mostrando '+n+' de '+arr.length+'.'):'';
  desenharChips();desenharResumoLista();
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
  sincronizarURL();
}
/* A contagem em texto é o que permite recolher chips e cartões sem esconder
   pendência: os números continuam na primeira linha da tela, filtrada ou não. */
function desenharResumoLista(){
  const el=document.getElementById('resumo-lista');if(!el)return;
  const vis=visiveis().length,tot=CLIENTES.length;
  const quantos=fn=>CLIENTES.filter(fn).length;
  const p=[(vis===tot?String(tot):vis+' de '+tot)+' clientes'];
  if(COL.ativo){const a=quantos(c=>situacaoDe(c)==='ativo');if(a)p.push(a+' ativos');}
  if(COL.inicio){const s=quantos(c=>exigeInicio(c)&&!valorDe(c,COL.inicio));if(s)p.push(s+' sem data de início');}
  if(COL.cnpj){const s=quantos(c=>!valorDe(c,COL.cnpj));if(s)p.push(s+' sem CNPJ');}
  if(COL.regime){const s=quantos(c=>!valorDe(c,COL.regime));if(s)p.push(s+' sem regime');}
  el.textContent=p.join(' · ');
}
function redesenhar(){
  desenharChips();desenharOrdem();desenharResumo();desenharLista();
  if(FILTROS_UI)FILTROS_UI.atualizarContador();
}
/* ---------- busca, filtro e ordenação no endereço (C.10) ----------
   F5 volta para a mesma visão; chave, cod e #hash ficam intactos. */
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    set('q',TERMO);
    set('f',FILTRO==='todos'?'':FILTRO);
    set('ord',ORDEM==='id'?'':ORDEM);
    set('dir',DIR==='asc'?'':DIR);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  FILTRO=p.get('f')||'todos';
  ORDEM=p.get('ord')||'id';
  DIR=p.get('dir')==='desc'?'desc':'asc';
  return p.get('q')||'';
}

function clientePorId(id){return CLIENTES.find(c=>String(c.id)===String(id));}
function alternar(id,forcar){
  const cli=clientePorId(id);if(!cli)return;
  const no=document.querySelector(`.cli[data-id="${CSS.escape(String(id))}"]`);if(!no)return;
  const abrir=forcar==null?!ABERTOS.has(id):!!forcar;
  const corpo=no.querySelector('.corpo');
  if(abrir){
    ABERTOS.add(id);no.classList.add('aberto');
    if(!corpo)no.insertAdjacentHTML('beforeend',corpoHTML(cli));
  }else{
    ABERTOS.delete(id);no.classList.remove('aberto');
    if(corpo)corpo.remove();
  }
  const bt=no.querySelector('.cli-head');if(bt)bt.setAttribute('aria-expanded',abrir?'true':'false');
}
function irPara(id){
  const alvo=String(id);let mexeu=false;
  if(!visiveis().some(c=>String(c.id)===alvo)){
    FILTRO='todos';TERMO='';const b=document.getElementById('busca');if(b)b.value='';mexeu=true;
  }
  /* O teto não pode esconder justamente a ficha para onde estamos indo. */
  const pos=visiveis().findIndex(c=>String(c.id)===alvo);
  if(pos>=TETO){TETO=Math.ceil((pos+1)/PASSO)*PASSO;mexeu=true;}
  if(mexeu)redesenhar();
  const no=document.querySelector(`.cli[data-id="${CSS.escape(String(id))}"]`);if(!no)return;
  alternar(id,true);
  no.scrollIntoView({block:'center',behavior:'smooth'});
  no.classList.add('flash');setTimeout(()=>no.classList.remove('flash'),1800);
}

/* ---------------- salvar (auto-save com debounce) ---------------- */
const SUJOS=new Map();   // id -> {timer, colunas:Set}
/* ---------- falhas de gravação (C.3) ----------
   FALHAS = o servidor recusou e o dado só existe na tela. O cadastro fica
   marcado com um "tentar de novo" no topo dele, e fechar a aba pede confirmação. */
const FALHAS=new Map();   // id -> {colunas:Set}
function temPendencia(){return SUJOS.size>0||FALHAS.size>0;}
function marcarFalha(id,falhou){
  const no=document.querySelector('.cli[data-id="'+CSS.escape(String(id))+'"]');
  if(!no)return;
  no.classList.toggle('falhou',!!falhou);
  const cx=no.querySelector('.ign');
  if(cx){
    const antigo=cx.querySelector('.btn-retry');
    if(falhou&&!antigo)cx.insertAdjacentHTML('beforeend',
      '<button type="button" class="btn-retry" data-retry="'+esc(String(id))+'">não salvou — tentar de novo</button>');
    if(!falhou&&antigo)antigo.remove();
  }
  /* o campo que não gravou também fica marcado, para não sobrar dúvida de onde foi */
  const f=FALHAS.get(String(id));
  no.querySelectorAll('[data-ecol]').forEach(el=>{
    el.classList.toggle('falhou',!!(falhou&&f&&f.colunas.has(el.dataset.ecol)));
  });
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
window.addEventListener('beforeunload',e=>{if(temPendencia()){e.preventDefault();e.returnValue='';}});
function agendarSalvar(id,coluna,ms){
  let s=SUJOS.get(id);
  if(!s){s={timer:null,colunas:new Set()};SUJOS.set(id,s);}
  s.colunas.add(coluna);
  clearTimeout(s.timer);
  s.timer=setTimeout(()=>salvar(id),ms==null?700:ms);
  setSave('saving','Alterado…');
}
async function salvar(id){
  const s=SUJOS.get(id);if(!s)return;
  SUJOS.delete(id);
  const cli=clientePorId(id);if(!cli)return;
  const campos={};s.colunas.forEach(c=>campos[c]=cli.valores[c]==null?'':cli.valores[c]);
  const ign=document.getElementById('ign_'+id);
  try{
    setSave('saving','Salvando…');
    const r=await postAcao({acao:'registro_salvar',id:cli.id,cliente:cli.nome||'',cod:codAtual(),campos});
    const ignoradas=(r&&r.ignoradas||[]).filter(Boolean);
    setSave('ok','Salvo ✓ '+horaAgora()+(ignoradas.length?' · '+ignoradas.length+' ignorada'+(ignoradas.length>1?'s':''):''),
      ignoradas.length?('Não gravadas: '+ignoradas.join(', ')):'');
    if(ign)ign.innerHTML=ignoradas.length?('Não gravei: <b>'+ignoradas.map(esc).join('</b>, <b>')+'</b> — coluna travada ou que não existe mais no cadastro.'):'';
    /* o nome pode ter mudado: reflete no cabeçalho e na busca */
    cli.nome=valorDe(cli,COL.nome)||cli.nome;
    if(COL.ativo)cli.ativo=valorDe(cli,COL.ativo);
    cli._b=null;cli._bd=null;cli._v=null;
    FALHAS.delete(String(id));marcarFalha(id,false);
    atualizarCabeca(id);
    desenharChips();desenharResumo();
  }catch(e){
    /* o que não gravou volta para a fila: a próxima tentativa manda tudo de novo */
    const f=FALHAS.get(String(id))||{colunas:new Set()};
    s.colunas.forEach(c=>f.colunas.add(c));
    FALHAS.set(String(id),f);
    marcarFalha(id,true);
    /* A faixa avisa que não salvou e o "tentar de novo" continua ali; o texto da
       exceção fica fora da tela (inclusive do title), é vocabulário nosso. */
    setSave('err','Não foi possível salvar. Tente de novo.');
  }
}
/** Manda de novo o que ficou para trás naquele cadastro. */
function tentarDeNovo(id){
  const f=FALHAS.get(String(id));if(!f)return;
  const s=SUJOS.get(id)||{timer:null,colunas:new Set()};
  f.colunas.forEach(c=>s.colunas.add(c));
  SUJOS.set(id,s);
  FALHAS.delete(String(id));
  salvar(id);
}
function atualizarCabeca(id){
  const cli=clientePorId(id);if(!cli)return;
  const no=document.querySelector(`.cli[data-id="${CSS.escape(String(id))}"]`);if(!no)return;
  const nm=no.querySelector('.cli-nome');if(nm)nm.textContent=cli.nome||'(sem nome)';
  const mt=no.querySelector('.cli-meta');if(mt)mt.innerHTML=metaHTML(cli);
  const bt=no.querySelector('.cli-head');if(bt)bt.title=tituloCabeca(cli);   // o title carrega o que saiu dos selos
  /* a faixa lateral acompanha a mudança de situação sem redesenhar a lista */
  no.classList.remove('sit-ativo','sit-inativando','sit-inativo','sit-sem');
  no.classList.add(classeSituacao(cli));
}

/* ===================================================================
   Cliente novo — o formulário do onboarding, dentro desta página
   =================================================================== */
let NOVO_CAMPOS=[],NOVO_ROLE={},PROX_ID='',criando=false;
const novoVal={};
const prodSel=new Set();

function campoHTML(f,i){
  const id='f_'+i;
  const req=f.req?'<span class="req">*</span>':'';
  let inner;
  if(f.t==='select'){inner=`<select id="${id}" data-col="${esc(f.col)}">${(f.opts||[]).map(o=>`<option value="${esc(o)}">${o?esc(o):'—'}</option>`).join('')}</select>`;}
  else if(f.t==='textarea'){inner=`<textarea id="${id}" data-col="${esc(f.col)}" rows="2" placeholder="${esc(f.ph||'')}"></textarea>`;}
  else{inner=`<input id="${id}" data-col="${esc(f.col)}" type="${f.t==='date'?'date':'text'}" ${f.max?`maxlength="${f.max}"`:''} placeholder="${esc(f.ph||'')}">`;}
  return `<div class="fld ${f.full?'full':''}" data-fld="${esc(f.col)}"><label for="${id}">${esc(f.col)} ${req}</label>${inner}</div>`;
}
function renderNovo(){
  const secs=SEC_ORDER.filter(s=>NOVO_CAMPOS.some(f=>f.s===s));
  let html=`
    <div class="idcard">
      <div class="lbl">Próximo ID previsto</div>
      <div class="idval" id="idprev">${esc(PROX_ID||'…')}</div>
      <div class="nome" id="nomeprev">Nome: <b>—</b></div>
    </div>
    <div class="sec">
      <h2><span class="dot"></span>Produtos Back4you <span class="req" style="color:var(--amber)">*</span></h2>
      <div class="prods" id="prods">${PRODUTOS.map(p=>`<label class="prod"><input type="checkbox" value="${esc(p)}"> ${esc(p)}</label>`).join('')}</div>
      <p class="hint">Os produtos definem quais planilhas serão criadas: <b>Equiparação</b> → planilha de Equiparação · <b>Contabilidade/Controladoria</b> → Fiscal + Contábil + DP · <b>DP pessoa física</b> → DP. INSS e Agora Tem Especialistas não geram planilha por ora.</p>
    </div>`;
  secs.forEach(sc=>{
    // Identificação aberta: sem ela não dá para criar o cliente.
    const aberta = sc==='Identificação';
    const nCampos = NOVO_CAMPOS.filter(f=>f.s===sc).length;
    const nReq = NOVO_CAMPOS.filter(f=>f.s===sc&&f.req).length;
    html+=`<details class="sec" data-sec="${esc(sc)}"${aberta?' open':''}>
      <summary><span class="arw">▶</span><h2><span class="dot"></span>${esc(sc)}</h2>
        <span class="cnt-sec${nReq?' falta':''}" data-cnt="${esc(sc)}">0 de ${nCampos}${nReq?' · '+nReq+' obrigatório'+(nReq>1?'s':''):''}</span>
      </summary>
      <div class="grid">${NOVO_CAMPOS.map((f,i)=>f.s===sc?campoHTML(f,i):'').join('')}</div></details>`;
  });
  html+=blocoContatosNovo();
  html+=`<div class="msg" id="msg"></div>
    <div class="foot"><button class="btn btn--sec btn--pill" id="cancelar" type="button">Cancelar</button><button class="btn btn--pri btn--pill" id="criar" type="button">Criar cliente</button></div>`;
  const body=document.getElementById('modalBody');
  body.innerHTML=html;
  body.querySelectorAll('#prods input').forEach(c=>c.addEventListener('change',e=>{
    const l=e.target.closest('.prod');
    if(e.target.checked){prodSel.add(e.target.value);l.classList.add('on');}else{prodSel.delete(e.target.value);l.classList.remove('on');}
  }));
  body.querySelectorAll('[data-col]').forEach(el=>el.addEventListener('input',e=>{
    let v=e.target.value;const f=NOVO_CAMPOS[+e.target.id.slice(2)];
    if(f&&f.up){v=v.toUpperCase();e.target.value=v;}
    novoVal[e.target.dataset.col]=v;
    e.target.closest('.fld').classList.remove('miss');
    if(e.target.dataset.col===NOVO_ROLE.razao)atualizarNomePrev();
    contarSecoes();
  }));
  ligarContatosNovo();
  contarSecoes();
  document.getElementById('cancelar').addEventListener('click',fecharModal);
  document.getElementById('criar').addEventListener('click',criarCliente);
  atualizarNomePrev();
}
function atualizarNomePrev(){
  const el=document.getElementById('nomeprev');if(!el)return;
  const razao=(novoVal[NOVO_ROLE.razao]||'').trim();
  el.innerHTML='Nome: <b>'+esc((PROX_ID?PROX_ID+' ':'')+(razao||'—'))+'</b>';
}
function abrirModal(){
  NOVO_CAMPOS=montarCampos(COLUNAS.length?COLUNAS:CAMPOS_FALLBACK,'novo');
  NOVO_ROLE=NOVO_CAMPOS.roles||{};
  Object.keys(novoVal).forEach(k=>delete novoVal[k]);
  prodSel.clear();
  document.getElementById('modal').hidden=false;
  document.body.style.overflow='hidden';
  renderNovo();
  if(!PROX_ID){
    jsonp(API_URL+'?tipo=proximo_id&chave='+encodeURIComponent(chaveAtual()))
      .then(d=>{if(d&&!d.erro&&d.id){PROX_ID=d.id;const i=document.getElementById('idprev');if(i)i.textContent=PROX_ID;atualizarNomePrev();}})
      .catch(()=>{});
  }
}
function fecharModal(){
  if(criando)return;
  document.getElementById('modal').hidden=true;
  document.body.style.overflow='';
}
/* Quantos campos de cada seção já têm resposta — é o que deixa fechar sem
   esconder. Falta obrigatório vira vermelho, e aí a seção pede para ser aberta
   antes de a pessoa apertar Criar. */
function contarSecoes(){
  document.querySelectorAll('[data-cnt]').forEach(el=>{
    const sc=el.dataset.cnt;
    const campos=NOVO_CAMPOS.filter(f=>f.s===sc);
    const cheios=campos.filter(f=>String(novoVal[f.col]||'').trim()).length;
    const faltaReq=campos.filter(f=>f.req&&!String(novoVal[f.col]||'').trim()).length;
    el.textContent=cheios+' de '+campos.length+(faltaReq?' · '+faltaReq+' obrigatório'+(faltaReq>1?'s':''):'');
    el.classList.toggle('falta',!!faltaReq);
  });
}

/* ---------- contatos junto com o cliente novo ----------
   O momento em que se sabe quem responde pelo cliente é o do cadastro. Deixar
   para depois é o que produz cliente sem contato nenhum — e cliente sem contato
   não recebe acesso, nem cobrança, nem aviso de vencimento. */
let CT_NOVOS=[{nome:'',email:'',telefone:'',papel:'Principal'}];
function linhaContatoNovo(c,i){
  return `<div class="ct-novo" data-ct="${i}">
    <label class="fld"><span class="lbl">Nome</span><input class="in" data-ctk="nome" value="${esc(c.nome||'')}" placeholder="Nome do contato"></label>
    <label class="fld"><span class="lbl">E-mail</span><input class="in" type="email" data-ctk="email" value="${esc(c.email||'')}" placeholder="email@exemplo.com"></label>
    <label class="fld"><span class="lbl">Telefone</span><input class="in" data-ctk="telefone" value="${esc(c.telefone||'')}" placeholder="55DDD9…"></label>
    <label class="fld"><span class="lbl">Papel</span><select class="in" data-ctk="papel">
      <option${c.papel==='Principal'?' selected':''}>Principal</option>
      <option${c.papel==='Principal'?'':' selected'}>Secundário</option></select></label>
    <button type="button" class="btn btn--mini btn--danger-out" data-ctdel="${i}"${CT_NOVOS.length<2?' style="visibility:hidden"':''}>Remover</button>
  </div>`;
}
function blocoContatosNovo(){
  return `<details class="sec" data-sec="Contatos">
    <summary><span class="arw">▶</span><h2><span class="dot"></span>Contatos</h2>
      <span class="cnt-sec" id="cnt-ct">nenhum</span></summary>
    <div id="ct-lista">${CT_NOVOS.map(linhaContatoNovo).join('')}</div>
    <button type="button" class="btn btn--sec btn--mini" id="ct-add">+ Outro contato</button>
    <p class="hint">Opcional. Quem for <b>Principal</b> acessa todas as áreas do painel; Secundário entra sem área nenhuma marcada e você ajusta depois em Contatos. Linha em branco é ignorada.</p>
  </details>`;
}
function contarContatosNovo(){
  const n=CT_NOVOS.filter(c=>String(c.nome||'').trim()||String(c.email||'').trim()).length;
  const el=document.getElementById('cnt-ct');
  if(el) el.textContent = n? (n+' contato'+(n>1?'s':'')) : 'nenhum';
}
function redesenharContatosNovo(){
  const box=document.getElementById('ct-lista'); if(!box) return;
  box.innerHTML=CT_NOVOS.map(linhaContatoNovo).join('');
  contarContatosNovo();
}
function ligarContatosNovo(){
  const body=document.getElementById('modalBody');
  body.addEventListener('input',e=>{
    const el=e.target; if(!el.dataset||!el.dataset.ctk) return;
    const i=+el.closest('[data-ct]').dataset.ct;
    CT_NOVOS[i][el.dataset.ctk]=el.value; contarContatosNovo();
  });
  body.addEventListener('change',e=>{
    const el=e.target; if(!el.dataset||el.dataset.ctk!=='papel') return;
    const i=+el.closest('[data-ct]').dataset.ct;
    CT_NOVOS[i].papel=el.value;
  });
  body.addEventListener('click',e=>{
    const add=e.target.closest('#ct-add');
    if(add){ CT_NOVOS.push({nome:'',email:'',telefone:'',papel:'Secundário'}); redesenharContatosNovo(); return; }
    const del=e.target.closest('[data-ctdel]');
    if(del){ CT_NOVOS.splice(+del.dataset.ctdel,1); if(!CT_NOVOS.length)CT_NOVOS.push({nome:'',email:'',telefone:'',papel:'Principal'}); redesenharContatosNovo(); }
  });
}
function contatosNovoPayload(){
  return CT_NOVOS
    .filter(c=>String(c.nome||'').trim()||String(c.email||'').trim())
    .map(c=>({ nome:String(c.nome||'').trim(), email:String(c.email||'').trim(),
               telefone:String(c.telefone||'').trim(), papel:c.papel||'Secundário',
               areas: c.papel==='Principal' ? AREAS_CONTATO : [] }));
}
const AREAS_CONTATO=['fiscal','contabil','pessoal','societario','equiparacao','financeiro'];

async function criarCliente(){
  const msg=document.getElementById('msg');msg.className='msg';msg.textContent='';
  let faltou=false;
  NOVO_CAMPOS.filter(f=>f.req).forEach(f=>{
    const el=document.querySelector(`#modalBody [data-fld="${CSS.escape(f.col)}"]`);
    if(!((novoVal[f.col]||'').trim())){if(el)el.classList.add('miss');faltou=true;}
  });
  if(!prodSel.size){document.getElementById('prods').closest('.sec').style.outline='2px solid var(--vermelho)';faltou=true;}
  if(faltou){msg.className='msg err';msg.textContent='Preencha os campos obrigatórios (marcados com *).';
    // Campo obrigatório vazio dentro de seção FECHADA seria um erro invisível: a
    // mensagem apontaria para algo que a pessoa não consegue ver.
    document.querySelectorAll('#modalBody .miss').forEach(el=>{
      const d=el.closest('details.sec'); if(d) d.open=true;
    });
    contarSecoes();
    const alvo=document.querySelector('#modalBody .miss')||document.querySelector('#modalBody .sec');
    if(alvo) alvo.scrollIntoView({block:'center',behavior:'smooth'});
    return;}

  const btn=document.getElementById('criar');btn.disabled=true;btn.textContent='Criando… (até ~1 min)';
  criando=true;
  msg.className='msg';msg.textContent='Criando pastas no Drive e planilhas… não feche a página.';
  setSave('saving','Criando cliente…');
  try{
    const d=await postAcao({acao:'onboard',produtos:[...prodSel],registro:novoVal,
                            contatos:contatosNovoPayload(),cod:codAtual()});
    criando=false;
    setSave('ok','Cliente '+(d.id||'')+' criado ✓ '+horaAgora());
    sucessoNovo(d);
  }catch(e){
    criando=false;
    btn.disabled=false;btn.textContent='Criar cliente';msg.className='msg err';
    setSave('err','Não criou o cliente');
    /* "Failed to fetch": o servidor pode ter concluído mesmo assim (operação longa). */
    const rede=/failed to fetch|networkerror|load failed|não respondeu|alcançar|timeout|rede/i.test(String((e&&e.message)||e));
    msg.innerHTML=rede
      ? 'A resposta não chegou (conexão/tempo). <b>O cliente pode já ter sido criado no servidor</b> — feche, atualize a lista e confira <b>antes</b> de tentar de novo. ⚠️ Não clique em "Criar" de novo às cegas: cada tentativa gera um cliente NOVO (com o próximo ID) e novas pastas.'
      /* O aviso genérico ficou no lugar do texto da exceção: o cadastro pode ter
         ficado pela metade, então o pedido é conferir a lista antes de repetir. */
      : 'Não foi possível criar o cliente. Atualize a lista e confira antes de tentar de novo.';
  }
}
function sucessoNovo(d){
  const pl=d.planilhas||{},links=[];
  if(d.pasta)links.push(`<a href="${esc(d.pasta)}" target="_blank" rel="noopener">📁 Pasta do cliente no Drive</a>`);
  if(pl.fiscal)links.push(`<a href="${esc(pl.fiscal)}" target="_blank" rel="noopener">📊 Planilha Fiscal</a>`);
  if(pl.equiparacao)links.push(`<a href="${esc(pl.equiparacao)}" target="_blank" rel="noopener">📊 Planilha Equiparação</a>`);
  if(pl.pessoal)links.push(`<a href="${esc(pl.pessoal)}" target="_blank" rel="noopener">📊 Planilha Departamento Pessoal</a>`);
  /* Os avisos vêm do servidor e são escritos por nós — mas este é o mesmo canal por
     onde, num dia ruim, sobe o texto de uma exceção do Apps Script. A peneira abaixo
     deixa passar recado de gente e barra vocabulário de máquina: quem cadastrou um
     cliente não precisa ler "TypeError" debaixo de "Atenção". */
  const AVISO_TECNICO = /(exception|error|typeError|referenceerror|undefined|null\b|\bat\s+\w+\.|stack|apps ?script|\.gs\b)/i;
  const avisos=(d.avisos||[]).filter(Boolean)
    .map(a=>String(a))
    .filter(a=>a.length<=200 && !AVISO_TECNICO.test(a));
  document.getElementById('modalBody').innerHTML=`
    <div class="ok-card">
      <div style="font-size:34px">✅</div>
      <h1>Cliente criado!</h1>
      <div class="big">${esc(d.id||'')}</div>
      <div style="color:var(--ink-2);font-size:14px;margin-top:4px">${esc(d.nome||'')}</div>
      <div class="ok-links">${links.join('')||'<span class="hint">Nenhuma planilha gerada (confira os produtos).</span>'}</div>
      ${avisos.length?`<div class="avisos"><b>Atenção:</b><br>${avisos.map(esc).join('<br>')}</div>`:''}
      <p class="hint">Cadastro gravado. Os contatos e e-mails de acesso do cliente são cadastrados à parte, em <b>Contatos</b>.</p>
      <div class="foot" style="margin-top:14px">
        <button class="btn btn--sec btn--pill" id="outro" type="button">Cadastrar outro</button>
        <button class="btn btn--pri btn--pill" id="verCad" type="button">Ver o cadastro de ${esc(d.id||'')}</button>
      </div>
    </div>`;
  PROX_ID='';
  const irVer=()=>{fecharModal();if(clientePorId(d.id))irPara(d.id);else carregar({expandir:d.id});};
  document.getElementById('verCad').addEventListener('click',irVer);
  document.getElementById('outro').addEventListener('click',()=>{carregar({silencioso:true});abrirModal();});
  /* já recarrega a lista por baixo, para o cliente novo estar lá quando fechar */
  carregar({expandir:d.id,silencioso:true});
}

/* ===================================================================
   Eventos
   =================================================================== */
document.addEventListener('click',e=>{
  const rt=e.target.closest('[data-retry]');
  if(rt){e.stopPropagation();rt.textContent='enviando…';rt.disabled=true;tentarDeNovo(rt.dataset.retry);return;}
  if(e.target.closest('#btn-limpar')){limparFiltros();return;}
  /* "mais 20" para quem está lendo, "todos" para quem vai usar Ctrl+F. */
  if(e.target.closest('.btn-mais')){TETO+=PASSO;desenharLista();return;}
  if(e.target.closest('.btn-todos')){TETO=CLIENTES.length;desenharLista();return;}
  const head=e.target.closest('.cli-head');
  if(head){const no=head.closest('.cli');if(no)alternar(no.dataset.id);return;}
  const chip=e.target.closest('.chip[data-f]');
  if(chip){FILTRO=chip.dataset.f;TETO=PASSO;redesenhar();return;}
  const ord=e.target.closest('.chip[data-s]');
  if(ord){const k=ord.dataset.s;
    if(ORDEM===k)DIR=(DIR==='asc'?'desc':'asc');else{ORDEM=k;DIR='asc';}
    TETO=PASSO;                                // outra ordem, outro começo de lista
    desenharOrdem();desenharLista();
    if(FILTROS_UI)FILTROS_UI.atualizarContador();
    return;}   // desenharLista() sincroniza a URL
  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto);return;}
  if(e.target.closest('#btnNovo')){abrirModal();return;}
  if(e.target.closest('#fechaModal')){fecharModal();return;}
  if(e.target.id==='modal'){fecharModal();return;}
});
function anotar(el){
  const corpo=el.closest('.corpo');if(!corpo)return;
  const cli=clientePorId(corpo.dataset.id);if(!cli)return;
  const col=el.dataset.ecol;
  /* o destaque de campo em branco some assim que digita (e volta se apagar),
     na hora, sem esperar o salvamento */
  const fld=el.closest('.fld');
  if(fld&&fld.dataset.esperado==='1')fld.classList.toggle('emfalta',!String(el.value||'').trim());
  /* 'input' e 'change' disparam os dois no mesmo campo — não salva duas vezes à toa */
  if(cli.valores[col]===el.value&&!SUJOS.has(cli.id))return;
  cli.valores[col]=el.value;cli._bd=null;
  if(COL.nome&&col===COL.nome){cli.nome=el.value;atualizarCabeca(cli.id);}
  /* mudou a situação: selo e faixa lateral acompanham na hora */
  if(COL.ativo&&col===COL.ativo){cli.ativo=el.value;atualizarCabeca(cli.id);}
  agendarSalvar(cli.id,col,el.tagName==='SELECT'||el.type==='date'?250:700);
}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.ecol)anotar(e.target);});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.ecol)anotar(e.target);});
/* Atalhos de busca (C.4): "/" foca, Esc limpa. Com o modal aberto, Esc fecha o
   modal — e o atalho não atrapalha quem já está digitando noutro campo. */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!document.getElementById('modal').hidden){fecharModal();return;}
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';TERMO='';TETO=PASSO;desenharLista();}
});

/* ===================================================================
   Carregar
   =================================================================== */
/* A ordem aqui é a da tela: primeiro o que responde (busca, cadastrar, contagem),
   depois o que refina (filtros e ordenação, recolhidos), depois os exemplos, e só
   então as fichas. Os 13 chips e os 3 cartões continuam existindo — deixaram de
   ser pedágio. */
function layout(){
  return `<div class="topo">
    <div class="barra-acoes">
      <input class="busca campo-busca" id="busca" type="search" autocomplete="off" placeholder="Buscar por ID, nome, CNPJ (com ou sem pontos), cidade…  ( / para focar)">
      <button type="button" class="btn-filtros" id="btn-filtros" aria-expanded="false" aria-controls="painel-filtros">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M1.2 2h13.6a.6.6 0 0 1 .46.99L10.4 9.02V13.4a.6.6 0 0 1-.87.54l-2.6-1.3a.6.6 0 0 1-.33-.54V9.02L.74 2.99A.6.6 0 0 1 1.2 2Z"/></svg>
        Filtros <span class="cont-filtros" hidden>0</span>
      </button>
      <button class="btn btn--pri btn--pill btn-novo" id="btnNovo" type="button">+ Novo cliente</button>
      <span class="resumo-lista" id="resumo-lista"></span>
    </div>
    <div id="painel-filtros" class="painel-filtros" hidden>
      <div class="grupo chips" id="chips"></div>
      <div class="grupo chips ord-row" id="ordChips"></div>
      <div class="grupo ord-info" id="ordInfo"></div>
      <button type="button" class="btn-limpar" id="btn-limpar" title="Volta para a visão sem filtro, sem busca e na ordem de ID">Limpar filtros</button>
    </div>
  </div>
  <details class="ajuda" id="ajuda">
    <summary>ⓘ Como funciona esta tela</summary>
    <div class="txt">Clique num cliente para abrir o cadastro completo. O que você editar salva sozinho. Cliente novo nasce pelo botão do topo — ele cria as pastas e as planilhas antes de gravar.<br>O selo <b>campos vazios</b> conta só as colunas editáveis que pelo menos 20% dos clientes preenchem — de fora ficam as 🔒 do sistema, a <b>data de fim da contabilidade</b> (em branco ali é contrato em andamento) e a coluna <b>Ativo</b>. Esses mesmos campos, quando estão em branco, ficam com um <b>fundo avermelhado</b> no cadastro aberto: é só dica visual do que falta preencher. Os cards ignoram quem está inativo.<br>A lista abre com os <b>20 primeiros</b> — os botões no fim dela mostram mais 20 ou todos de uma vez, e filtrar ou buscar recomeça do 20. Os filtros e a ordenação ficam no botão <b>Filtros</b>, que avisa com um número quando algum está pegando.<br>Na linha fechada aparece só o que pede ação: o campo <b>em branco</b> (sem CNPJ, sem regime, sem produtos), os campos vazios e a situação quando <b>não</b> é Ativo — <b>Em inativação</b> em laranja, <b>Inativo</b> em vermelho, cinza quando a coluna Ativo está em branco, cada um com uma faixa na lateral. O que está preenchido fica no cadastro (é só clicar) e no rótulo que aparece ao passar o mouse na linha.</div>
  </details>
  <details class="ajuda situacao" id="det-situacao">
    <summary>Ver quem está em cada situação</summary>
    <div class="resumo" id="resumo"></div>
  </details>
  <div class="dica" id="dica"></div>
  <div class="lista" id="lista"></div>`;
}
async function carregar(op){
  op=op||{};
  if(!op.silencioso)setSave('saving','Carregando…');
  try{
    const d=await jsonp(API_URL+'?tipo=registro_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro)throw new Error(d.erro);
    META=d;
    COLUNAS=d.colunas||[];
    TRAVADAS=new Set((d.travadas||[]).map(norm));
    CLIENTES=(d.clientes||[]).map(c=>Object.assign({},c,{id:String(c.id||''),valores:c.valores||{}}));
    mapearColunas();
    calcularCompletude();
    CAMPOS_EDIT=montarCampos(COLUNAS,'edicao');
    if(op.expandir)ABERTOS.add(String(op.expandir));
    const busca=document.getElementById('busca');
    /* Na primeira carga a visão vem do endereço (C.10); nas recargas em segundo
       plano vale o que já está na tela. */
    const termoAtual=busca?busca.value:lerURL();
    document.getElementById('app').innerHTML=layout();
    ligarDetalhes(document.getElementById('ajuda'),'b4u.registro.ajuda');
    FILTROS_UI=ligarFiltros('registro',filtrosPainel);   // depois do layout: o painel já existe
    const nb=document.getElementById('busca');
    nb.value=op.expandir?'':(termoAtual||'');
    TERMO=nb.value;
    nb.addEventListener('input',e=>{TERMO=e.target.value;TETO=PASSO;desenharLista();});
    const pl=document.getElementById('plan');
    if(d.planilha_url){pl.href=d.planilha_url;pl.hidden=false;}
    redesenhar();
    if(!op.silencioso)setSave('','');
    /* A lista já está pintada: a barra corre até 100% e o overlay sai revelando a
       tela pronta, sem somar espera de verdade. Na recarga em segundo plano não há
       overlay nenhum, e a chamada simplesmente não faz nada. */
    if(window.B4UEspera)B4UEspera.concluir();
    if(op.expandir){irPara(String(op.expandir));}
    else if(!op.silencioso&&window.innerWidth>760)nb.focus();
  }catch(e){
    /* O texto da exceção continua sendo lido para separar falta de acesso de falha
       de carregamento, mas não vai mais para a tela: nome de arquivo do servidor,
       nome de aba de planilha e o parâmetro do endereço são vocabulário nosso. */
    const m=String((e&&e.message)||e);
    setSave('err','Não foi possível carregar.');
    /* recarga em segundo plano não pode derrubar a lista que já está na tela */
    if(op.silencioso&&document.getElementById('lista')){
      if(window.B4UEspera)B4UEspera.concluir();
      return;
    }
    /* O porteiro da equipe só tem duas negativas, e são estas duas que este teste
       procura: "Acesso restrito à equipe." (código do dia errado, de ontem ou de
       ninguém) e "Seu acesso não inclui a área de …" / "…nenhuma das áreas: …"
       (é da equipe, mas esta tela não está nas áreas dele).
       Até 04/08/2026 o teste aqui era /chave/i, e não casava com NENHUMA das duas:
       quem chegava com o código vencido lia a mensagem genérica de falha, como se
       o painel tivesse quebrado, em vez de "peça um acesso novo". Em compensação
       casava com "Falta a chave X na aba Config", que é defeito de configuração
       NOSSO — e esse tem de cair no erro genérico mesmo, não virar "Acesso
       restrito" e mandar a pessoa procurar permissão que ela já tem. Por isso a
       palavra chave saiu daqui. As irmãs restituicao.html e colaborador.html
       usam /restrit/i; aqui a área entra junto porque esta rota é guardada por
       exigirAreaEquipe_. [áa] porque não dependemos do acento chegar inteiro. */
    if(/restrit|[áa]rea/i.test(m)){
      /* Isto não é defeito, é fluxo — por isso não usa a tela de erro genérica:
         ou o código do dia venceu (resolve entrando outra vez pelo painel, que já
         traz a chave junto) ou falta a área (resolve com um responsável). O link
         atende o primeiro caso, que é o de longe mais comum. */
      if(window.B4UEspera)B4UEspera.cancelar();
      document.getElementById('app').innerHTML=`<div class="state"><div style="font-size:36px">🔒</div><h1>Acesso restrito</h1><p>Esta tela é da equipe. Se o seu acesso do dia expirou, entre outra vez pelo painel do colaborador; se ele não inclui esta área, fale com um responsável principal.</p><p><a href="colaborador.html" target="_self">Ir para o painel</a></p></div>`;
    }else if(window.B4UEspera){
      B4UEspera.telaErro(document.getElementById('app'));
    }else{
      document.getElementById('app').innerHTML=
        '<div class="state"><h1>Não conseguimos carregar as informações</h1>'
        +'<p>Houve um erro ao recuperar as informações. Tente novamente em alguns '
        +'minutos. Se o problema continuar, entre em contato com o atendimento.</p></div>';
    }
  }
}
document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());

/* ---------------- menu lateral ----------------
   Montado ANTES de carregar(): a identidade desta tela é a chave, que já está na
   URL desde a primeira linha deste script — não há o que esperar da API. E se a
   busca falhar (inclusive na tela de "Acesso restrito"), o erro pinta dentro do
   #app com o menu inteiro de pé, que é a mesma razão de o erro nunca ser pintado
   no <body>.
   Sem `contexto`: esta página não sabe o NOME de quem está usando (o `cod` é
   código de log, não nome), e um rótulo inventado seria pior que bloco nenhum.
   Os links levam só a chave, como o logo e o "← Painel" já levavam aqui — o
   `cod` continua fora deles, igual ao #volta logo acima. */
if (window.B4UShell) {
  B4UShell.montar({
    perfil: 'equipe',
    ativo: 'registro',
    link: function (pag) { return pag + '?chave=' + encodeURIComponent(chaveAtual()); }
  });
  /* Esta página tem <base target="_blank">, para o colaborador nunca perder a
     tela em que estava ao abrir a planilha. O menu lateral é o contrário disso:
     é navegação DENTRO do painel, e sair pela guia atual é o gesto — a mesma
     exceção que o logo e o "← Painel" já traziam escrita à mão.
     Só marcamos quem ainda não tem alvo próprio: assim o WhatsApp do rodapé do
     menu (que nasce com target="_blank") continua abrindo em guia nova. */
  document.querySelectorAll('.b4s-side a[href]').forEach(function (a) {
    if (!a.getAttribute('target')) a.setAttribute('target', '_self');
  });
}

carregar();
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador.html') {
        try { href = 'colaborador.html?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador.html'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
