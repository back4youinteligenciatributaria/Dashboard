   pendência. Facetar mudaria o número embaixo da mão de quem está escolhendo
   (marcar um produto faria as situações encolherem a cada clique), e a régua
   passaria a exigir leitura em vez de responder. É a mesma conta do
   societario-equipe.html.

   Ela usa `chaveBusca`/`digitosBusca`, que moram lá embaixo, junto do resto da
   busca: são declarações de função e por isso já existem quando esta roda. */
function baseBusca(){
  const termo=normTxt(TERMO);
  if(!termo)return CLIENTES;
  return CLIENTES.filter(c=>casaBusca(chaveBusca(c),digitosBusca(c),termo));
}

/* ---- situações ----
   Só as que EXISTEM nos dados, na ordem em que a equipe fala delas. Listar uma
   situação com zero cliente é oferecer um filtro que só sabe esvaziar a tela. */
const SIT_ORDEM=['ativo','inativando','inativo','sem'];
function contarSit(base){
  const n={};(base||CLIENTES).forEach(c=>{const s=situacaoDe(c);n[s]=(n[s]||0)+1;});return n;
}
/* A tela só pergunta pela situação se ela existir: ou como coluna ("Ativo"), ou
   como campo que a rota manda junto de cada cliente. É a mesma regra do `dep`
   dos filtros de antes — sem a coluna, todo mundo cai em "sem situação" e o
   filtro vira uma pergunta sem resposta. */
function temSituacao(){return !!COL.ativo||CLIENTES.some(c=>c.ativo);}
/* Quais situações a lista OFERECE sai da carteira inteira; quantos clientes cada
   uma tem sai do que a busca deixou. As duas contas são de propósito diferentes:
   opção que sumisse no meio da digitação continuaria filtrando sem estar na tela
   — e, pior, sumiria da lista que define o "todas marcadas" do repouso. Zero
   embaixo da busca é resposta legítima ("nenhum Inativo casa com isso"). */
function itensSit(){
  if(!temSituacao())return [];
  const tem=contarSit(CLIENTES),n=contarSit(baseBusca());
  return SIT_ORDEM.filter(k=>tem[k]>0).map(k=>({v:k,r:SITUACOES[k].rot+' · '+(n[k]||0),c:SITUACOES[k].rot}));
}
/* O conjunto {Ativo} tem nome próprio na casa — é como o dono chamou o controle
   inteiro, e era o rótulo do chip de antes. Sem isto o botão diria "Ativo", no
   singular de UM item de lista, em vez do nome do recorte. Ver a regra 6 do
   b4u-filtro.js. */
/* Sobre a carteira INTEIRA, como a lista de opções: o nome do recorte não pode
   ir e vir conforme o que está digitado na busca. */
function sitEspeciais(){
  const n=contarSit(CLIENTES),esp=[];
  if(n.ativo)esp.push({quando:['ativo'],rot:'Ativos'});
  /* "Ainda na casa" = ativo + em inativação: é a pergunta de quem vai cobrar
     documento de quem ainda não saiu. Só entra quando as duas existem, senão
     seria o mesmo conjunto de {Ativo} com outro nome. */
  if(n.ativo&&n.inativando)esp.push({quando:['ativo','inativando'],rot:'Ainda na casa'});
  return esp;
}
/* Sem NENHUMA situação na lista (planilha sem a coluna "Ativo") não há controle
   na régua, e um filtro sem controle não pode cortar nada — senão a tela abriria
   vazia por causa de uma pergunta que ela nem chegou a fazer. Com a lista cheia,
   `F_SIT` vazio é escolha da pessoa e continua querendo dizer "nada". */
function passaSit(c){return !F_SIT||!SIT_VALS.length||F_SIT.indexOf(situacaoDe(c))>=0;}

/* ---- produtos ----
   A lista sai dos DADOS, nunca da constante PRODUTOS lá de cima: aquela lista é
   o que o formulário de cliente novo oferece, e a carteira tem produto que ela
   não conhece (e deixa de ter produto que ela conhece). Um filtro escrito à mão
   mostraria opção que não casa com ninguém e esconderia a que casa.
   A coluna guarda VÁRIOS produtos por cliente, separados por vírgula ou ponto e
   vírgula — o mesmo corte que a pilula da linha (`produtosHTML`) já faz. */
function produtosDe(cli){
  if(cli._pl==null)cli._pl=valorDe(cli,COLS_LINHA.produtos).split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  return cli._pl;
}
/* Comparação sem acento e sem caixa: a planilha tem "Equiparação" e "equiparacao"
   digitados por pessoas diferentes, e dois itens para o mesmo produto seria a
   lista mentindo. O rótulo que aparece é a PRIMEIRA grafia encontrada. */
function produtosNorm(cli){
  if(cli._pn==null)cli._pn=produtosDe(cli).map(normTxt);
  return cli._pn;
}
/* Dois passos, e são duas perguntas diferentes: QUAIS produtos a caixa oferece
   (a carteira inteira, senão a opção marcada sumiria de baixo do dedo assim que
   a busca não achasse mais nenhum cliente dela) e QUANTOS clientes cada um tem
   agora (o que a busca deixou). */
function itensProd(){
  const mapa=new Map();let temSem=false;
  CLIENTES.forEach(c=>{
    const ps=produtosDe(c);
    if(!ps.length){temSem=true;return;}
    const vistos={};
    ps.forEach(p=>{
      const k=normTxt(p);if(!k||vistos[k])return;vistos[k]=1;   // repetido na mesma célula conta uma vez
      if(!mapa.has(k))mapa.set(k,{rot:p,n:0});
    });
  });
  /* Nenhum produto em lugar nenhum (a planilha perdeu a coluna, ou a carteira
     ainda não tem produto declarado): não há pergunta a fazer, e uma caixa com
     um "(sem produtos) · 66" sozinho seria um controle que só sabe repetir a
     lista inteira. Sem itens, o `montarFiltros()` nem planta o controle. */
  if(!mapa.size)return [];
  let semN=0;
  baseBusca().forEach(c=>{
    const ps=produtosNorm(c);
    if(!ps.length){semN++;return;}
    const vistos={};
    ps.forEach(k=>{
      if(!k||vistos[k])return;vistos[k]=1;
      const e=mapa.get(k);if(e)e.n++;
    });
  });
  const out=[...mapa.values()].sort((a,b)=>cmpTxt(a.rot,b.rot))
    .map(e=>({v:e.rot,r:e.rot+' · '+e.n,c:e.rot}));
  /* "(sem produtos)" é o que restou da opção "Sem produtos" do <select> antigo.
     Vai no fim, como o "— sem área —" do Daily: é a linha de exceção da lista. */
  if(temSem)out.push({v:PROD_SEM,r:'(sem produtos) · '+semN,c:'sem produtos'});
  return out;
}
/* Marcar vários = OU. "Contabilidade + INSS" é "quem tem qualquer um dos dois",
   que é a pergunta que alguém faz; "quem tem os dois ao mesmo tempo" ninguém
   pediu e não caberia na mesma caixa sem um botão de E/OU para decorar. */
function passaProd(c){
  if(!F_PROD.length)return true;
  const ps=produtosNorm(c);
  if(!ps.length)return F_PROD.indexOf(PROD_SEM)>=0;
  return F_PROD.some(v=>v!==PROD_SEM&&ps.indexOf(normTxt(v))>=0);
}

/* ---- pendência ----
   O QUE É PENDÊNCIA NESTA TELA já estava escrito: são os filtros marcados
   `cls:'falta'` na lista FILTROS aí em cima — sem CNPJ, sem regime, sem data de
   início da contabilidade (quando ela é exigível), sem produtos e sem pasta no
   Drive. Eram cinco opções do <select> de Situação, e o botão é a união delas:
   "tem pelo menos uma dessas". A definição continua morando num lugar só, então
   quem acrescentar um filtro `cls:'falta'` amanhã já entra aqui.

   NÃO é "cadastro incompleto" (o selo de campos vazios): esse conta ~40 colunas
   e daria pendência para quase toda a carteira, que é o mesmo que não filtrar.
   O nome `temPendencia` já está tomado nesta página por outra coisa — alteração
   por gravar —, e por isso este se chama `comPendencia`. */
function filtrosFalta(){return filtrosVivos().filter(f=>f.cls==='falta');}
function comPendencia(c){return filtrosFalta().some(f=>f.fn(c));}
function passaPend(c){return !F_PEND||comPendencia(c);}

/* ---- montagem da régua ----
   As duas caixas são CONSTRUÍDAS antes de qualquer uma entrar na página: se o
   módulo estiver lá mas quebrar no meio, o `catch` cai nos controles nativos com
   os marcadores de posição ainda intactos. Construir e plantar de uma em uma
   deixaria a régua pela metade, meio caixa e meio select. É o mesmo desenho do
   `montarFiltros()` do daily.html. */
const CX={sit:null,prod:null};
let SIT_VALS=[];      // as situações da última montagem, na ordem da lista
/* O marcador de posição é SUBSTITUÍDO, não preenchido: a régua é um flex, e um
   <span> em volta viraria um item de flex dimensionado pelo conteúdo — o botão
   por dentro dele nunca encolheria, e um nome de produto comprido botaria
   rolagem lateral na página inteira a 390px. */
function por(cx,no){cx.replaceWith(no);return no;}
function porHTML(cx,html){const t=document.createElement('div');t.innerHTML=html;
  return por(cx,t.firstElementChild);}
/* Situação nova que apareceu na recarga entra marcada SE tudo estava marcado —
   senão o cliente que acabou de virar "Em inativação" sumiria da lista sem
   ninguém ter mexido em filtro nenhum. Seleção parcial é escolha da pessoa e
   fica como está. */
function sincronizarSit(vals){
  const tudo=F_SIT===null||(SIT_VALS.length>0&&SIT_VALS.every(v=>F_SIT.indexOf(v)>=0));
  SIT_VALS=vals.slice();
  if(F_SIT===null||tudo)F_SIT=vals.slice();
}
function montarFiltros(){
  const cxS=document.getElementById('cx-sit'),cxP=document.getElementById('cx-prod');
  if(!cxS||!cxP)return;
  CX.sit=CX.prod=null;
  const iSit=itensSit(),iProd=itensProd();
  sincronizarSit(iSit.map(i=>String(i.v)));
  /* Endereço antigo (?f=ativos, ?f=sem_cnpj) traduzido para os controles novos.
     Só neste caminho: sem o módulo, o `?f=` continua sendo exatamente o que
     sempre foi, e o <select> o mostra inteiro. */
  if(window.B4UFiltro)traduzirFiltroLegado();
  if(window.B4UFiltro)try{
    const fs=iSit.length?B4UFiltro.criar({
      id:'f-sit-cx',rot:'Situação',itens:iSit,marcados:F_SIT,
      /* Nasce cheio, como a tela sempre abriu; zero marcado quer dizer "não me
         mostre nada" e o componente pinta âmbar para avisar. */
      vazio:'nada',rotTodos:'Todas as situações',rotNada:'Nenhuma situação',rotTodas:'Todas',
      rotEspecial:sitEspeciais(),
      aoMudar:m=>{F_SIT=m;TETO=PASSO;redesenhar();}
    }):null;
    const fp=iProd.length?B4UFiltro.criar({
      id:'f-prod-cx',rot:'Produtos',itens:iProd,marcados:F_PROD,
      /* Nasce vazio, e vazio aqui quer dizer TODOS: marcar os produtos todos para
         dizer "não quero filtrar" seria trabalho para dizer nada. */
      vazio:'todos',rotTodos:'Todos os produtos',rotNada:'Nenhum produto',
      aoMudar:m=>{F_PROD=m;TETO=PASSO;redesenhar();}
    }):null;
    CX.sit=fs;CX.prod=fp;
    /* As caixas acabaram de nascer com estas listas: a assinatura sai daqui já
       em dia, senão a primeira pintura remontaria os dois painéis à toa. */
    SIG_CAIXAS=JSON.stringify([iSit,iProd]);
    if(fs)por(cxS,fs.no);else cxS.remove();
    if(fp)por(cxP,fp.no);else cxP.remove();
    return;
  }catch(e){CX.sit=CX.prod=null;}
  /* ── sem o módulo ───────────────────────────────────────────────────────────
     Os controles de hoje, um por filtro, com uma escolha por vez. O <select> de
     Situação volta com a lista INTEIRA de antes — inclusive "Sem CNPJ", "Sem
     regime" e as outras —, então aqui não falta nenhuma pergunta que a tela já
     sabia responder; falta só combinar duas. Quem manda neste caminho é o
     `FILTRO` de sempre. */
  porHTML(cxS,`<select class="filtro" id="f-sit" aria-label="Situação"></select>`);
  porHTML(cxP,`<select class="filtro" id="f-prod-sel" aria-label="Produtos"></select>`);
}
/* As listas mudam (cliente novo, produto novo, situação trocada na recarga em
   segundo plano) e as contagens do rótulo mudam a cada letra digitada na busca.
   Trocar a lista de um filtro REMONTA o painel dele por dentro — com o painel
   ABERTO isso destrói o checkbox que está sob o dedo, o foco cai no <body>, o
   `focusout` do componente vê que o foco saiu e fecha o painel. Daí a
   assinatura: só remonta quando os rótulos MUDARAM de verdade, e eles só mudam
   quando a busca muda ou quando a planilha traz coisa nova. Marcar um checkbox
   não mexe em nenhuma das duas, então o painel fica aberto — que é o ponto de
   ele ser uma caixa de seleção múltipla. É a mesma trava do
   societario-equipe.html, e ela ficou obrigatória no dia em que a contagem
   passou a ser ciente da busca. */
let SIG_CAIXAS='';
function atualizarCaixas(){
  if(!CX.sit&&!CX.prod)return;
  const iSit=itensSit(),iProd=itensProd();
  const sig=JSON.stringify([iSit,iProd]);
  if(sig===SIG_CAIXAS)return;
  SIG_CAIXAS=sig;
  sincronizarSit(iSit.map(i=>String(i.v)));
  if(CX.sit){CX.sit.itens(iSit);CX.sit.rotEspecial(sitEspeciais());CX.sit.marcados(F_SIT);}
  if(CX.prod)CX.prod.itens(iProd);
}
function chaveBusca(cli){
  if(cli._b==null)cli._b=normTxt([cli.id,cli.nome,valorDe(cli,COL.cnpj),valorDe(cli,COL.razao),valorDe(cli,COL.fantasia),valorDe(cli,COL.cidade)].join(' '));
  return cli._b;
}
/* Só os dígitos do ID e do CNPJ/CPF — é o que faz "12345678000190" achar
   "12.345.678/0001-90" (a planilha guarda pontuado). */
function digitosBusca(cli){
  if(cli._bd==null)cli._bd=soDigitos(cli.id+' '+valorDe(cli,COL.cnpj));
  return cli._bd;
}
/* Os quatro recortes compõem com E, e a ordenação vem por último — é o que faz a
   ordem escolhida no cabeçalho SOBREVIVER a filtrar e a buscar: ela não é uma
   propriedade da lista desenhada, é o último passo de quem a monta. */
function visiveis(){
  const fn=fnFiltro(FILTRO),termo=normTxt(TERMO);
  return ordenar(CLIENTES.filter(c=>fn(c)&&passaSit(c)&&passaProd(c)&&passaPend(c)&&
    (!termo||casaBusca(chaveBusca(c),digitosBusca(c),termo))));
}

/* ---------------- lista ---------------- */
/* CNPJ e CPF chegam da planilha ora pontuados, ora crus. A linha mostra sempre
   pontuado, para a coluna inteira ler igual; o que não tem 11 nem 14 dígitos vai
   como está — inventar máscara em documento estranho esconderia o erro de
   digitação de quem cadastrou. */
function fmtDoc(v){return b4uFmtDoc(v);}
/* Data no formato de quem lê: dd/mm/aaaa. Texto livre ("a definir") passa
   inteiro — a planilha aceita, e reescrever viraria data inventada. */
function fmtData(v){
  const s=String(v==null?'':v).trim();
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?(m[3]+'/'+m[2]+'/'+m[1]):s;
}
/* "Produtos Back4you" é uma lista separada por vírgula. Cabem até três pilulas na
   coluna; o resto vira "+N", que continua dizendo que há mais (a lista inteira
   está no title da linha e no cadastro).
   O corte não é só pela CONTAGEM: com nomes longos ("Agora Tem Especialistas"),
   três pilulas viravam três reticências ("Cont…", "Cont…", "I…"), que não dizem
   nada. Por isso há também um orçamento de caracteres — a primeira entra sempre,
   as outras só se ainda couberem. */
/* Duas pilulas INTEIRAS dizem mais que tres cortadas: "Equi…" e "Conta…" nao
   identificam produto nenhum. O que nao cabe vira "+N", que ao menos e honesto. */
const PROD_TETO=2, PROD_LARGURA=26;
function produtosHTML(cli){
  const v=valorDe(cli,COLS_LINHA.produtos);
  const ps=v.split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  if(!ps.length)return '<span class="c-falta">sem produtos</span>';
  const mostrar=[];let sobra=PROD_LARGURA;
  for(const p of ps){
    if(mostrar.length>=PROD_TETO)break;
    if(mostrar.length&&p.length>sobra)break;
    sobra-=p.length+1;mostrar.push(p);
  }
  const resto=ps.length-mostrar.length;
  return mostrar.map(p=>`<span class="c-tag">${esc(p)}</span>`).join('')+
    (resto>0?`<span class="c-tag mais" title="${esc(ps.slice(mostrar.length).join(', '))}">+${resto}</span>`:'');
}
/** O que não cabe nas sete colunas vira o title da linha: dá para conferir sem
 *  abrir nada — inclusive o Regime, que tem chip de filtro mas não tem coluna. */
function tituloCabeca(cli){
  const p=[];
  const add=(col,rot)=>{if(!col)return;const v=valorDe(cli,col);p.push(rot+': '+(v||'em branco'));};
  add(COL.cnpj,'CNPJ');add(COL.regime,'Regime');add(COL.produtos,'Produtos');
  if(COL.ativo||cli.ativo)p.push('Situação: '+SITUACOES[situacaoDe(cli)].rot);
  p.push('Clique para abrir o cadastro.');
  return p.join(' · ');
}
/* A linha da lista: ID · Nome · CNPJ/CPF · Cidade · Produtos · Início · Situação.
   É um role="button" (e não um <button>) porque dentro dele há pilulas e selos com
   title próprio; o teclado é atendido à mão no keydown (Enter e Espaço). */
function cabecaHTML(cli){
  const s=situacaoDe(cli),info=SITUACOES[s];
  const doc=valorDe(cli,COLS_LINHA.cnpj);
  const cid=valorDe(cli,COLS_LINHA.cidade);
  const ini=valorDe(cli,COLS_LINHA.inicio);
  /* Data em branco só vira cobrança para quem tem contabilidade: cliente só de
     equiparação não tem data de início para dar, e cobrá-la todo dia treina a
     equipe a ignorar a coluna inteira. */
  const dataHTML=ini?esc(fmtData(ini))
    :(exigeInicio(cli)?'<span class="c-falta">sem data</span>':'<span class="c-falta">—</span>');
  return `<div class="cli-head" role="button" tabindex="0" aria-haspopup="dialog" title="${esc(tituloCabeca(cli))}">
      <span class="c-id">${esc(cli.id)}</span>
      <span class="c-nome">${esc(cli.nome||'(sem nome)')}</span>
      <span class="c-doc">${b4uIdentHTML(doc,COLS_LINHA.cnpj||'CNPJ ou CPF','sem CNPJ')}</span>
      <span class="c-cid">${cid?esc(cid):'<span class="c-falta">—</span>'}</span>
      <span class="c-prod">${produtosHTML(cli)}</span>
      <span class="c-data">${dataHTML}</span>
      <span class="c-fim"><span class="pill sit-${s}" title="${esc(info.dica)}">${esc(info.rot)}</span>${seloHTML(cli)}</span>
    </div>`;
}
/** Seta da coluna ativa — só ela ganha marca, senão a lista pareceria ordenada
 *  por sete critérios ao mesmo tempo.
 *  O espaço antes da seta é NÃO SEPARÁVEL (\u00A0) de propósito: com espaço
 *  comum, o rótulo que quase preenche a coluna empurrava a seta sozinha para uma
 *  segunda linha, e o cabeçalho ficava com o dobro da altura por causa dela. */
function seta(key){return ORDEM===key?(DIR==='asc'?'\u00A0▲':'\u00A0▼'):'';}
/* O que o PRÓXIMO clique vai fazer, dito por extenso — são as mesmas frases que
   o <select> "Ordenar por" mostrava ("Nome — A → Z", "Situação — inativos
   primeiro"). Elas não se perderam junto com o select: viraram o title e o nome
   acessível do botão da coluna. Sem isso, "clica de novo que inverte" volta a
   ser gesto que ninguém descobre sozinho. */
function tituloOrd(k,rot){
  const o=ordemDe(k);
  if(!o)return 'Ordenar por '+rot;
  const prox=(ORDEM===k&&DIR==='asc')?'desc':'asc';
  return 'Ordenar por '+o.rot+' — '+(prox==='asc'?o.asc:o.desc);
}
/* O cabeçalho das colunas repete a régua da linha (mesma regra de CSS) e, abaixo
   de 900px, vira uma tira que rola de lado com os mesmos títulos — a linha deixa
   de ter sete colunas, mas os títulos continuam sendo o único controle de
   ordenação da tela desde que o "Ordenar por" saiu da régua de cima. Cada rótulo
   é um botão de verdade — por isso ele NÃO é aria-hidden —, a coluna ativa se
   anuncia com aria-sort e a direção aparece na setinha e no destaque do rótulo.
   A ÚLTIMA célula tem dois botões porque a coluna mostra duas coisas: o selo de
   situação e o de completude. Ver a nota do `.lista-cab .dois` na folha.
   O "Ordenar" da frente só existe no celular (a folha o esconde acima de 900px,
   onde a fileira de títulos em cima de sete colunas já se explica sozinha); ele é
   aria-hidden porque o `aria-label` da faixa e o de cada botão já dizem, por
   extenso, que ali se ordena. */
function cabecalhoLista(){
  const bt=(k,rot)=>`<button type="button" data-sort="${esc(k)}"${ORDEM===k?' aria-current="true"':''}`+
    ` title="${esc(tituloOrd(k,rot))}" aria-label="${esc(tituloOrd(k,rot))}">${esc(rot)}${seta(k)}</button>`;
  const cel=(k,rot,estilo)=>
    `<span role="columnheader"${estilo?' style="'+estilo+'"':''}`+
    `${ORDEM===k?` aria-sort="${DIR==='asc'?'ascending':'descending'}"`:''}>`+bt(k,rot)+`</span>`;
  const fim=(ORDEM==='ativo'||ORDEM==='vazios')
    ? ` aria-sort="${DIR==='asc'?'ascending':'descending'}"` : '';
  return `<div class="lista-cab" role="row" aria-label="Títulos das colunas — clique para ordenar">`+
    `<span class="cab-rot" aria-hidden="true">Ordenar</span>`+
    cel('id','ID')+cel('nome','Nome')+cel('cnpj','CNPJ / CPF')+cel('cidade','Cidade')+
    cel('produtos','Produtos')+cel('inicio','Início','text-align:center')+
    `<span role="columnheader" class="dois"${fim}>`+bt('ativo','Situação')+bt('vazios','Vazios')+`</span>`+
    `</div>`;
}
function campoEditHTML(cli,f){
  const col=f.col,v=valorDe(cli,col);
  const rot=`<span class="lbl">${esc(col)}${ehTravada(col)?' <span class="cad">🔒</span>':''}</span>`;
  let ctrl;
  if(ehTravada(col)){
    const link=/^https?:/i.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener" title="abrir">↗</a>`:'';
    ctrl=`<div class="ro" title="${esc(motivoTrava(col))}"><span class="cad-txt">${esc(v||'—')}</span>${link}</div>`;
  }else if(f.t==='select'){
    const opts=(f.opts||['','Sim','Não']).slice();
    /* Valor que o cliente já tem e que não está na lista (sujeira da planilha,
       tipo "Nao" no ISS) entra na lista assim mesmo, logo abaixo do vazio e com
       o aviso "(fora da lista)". A página NUNCA apaga nem troca sozinha: o valor
       gravado continua igual até alguém escolher outro à mão. */
    const fora=!!v&&opts.indexOf(v)<0;
    if(fora)opts.splice(1,0,v);
    ctrl=`<select data-ecol="${esc(col)}">`+opts.map(o=>{
      const rot=o?esc(o)+(fora&&o===v?' (fora da lista)':''):'—';
      return `<option value="${esc(o)}"${o===v?' selected':''}>${rot}</option>`;
    }).join('')+`</select>`;
  }else if(f.t==='textarea'){
    ctrl=`<textarea data-ecol="${esc(col)}" rows="2">${esc(v)}</textarea>`;
  }else if(f.t==='date'&&(!v||/^\d{4}-\d{2}-\d{2}$/.test(v))){
    ctrl=`<input type="date" data-ecol="${esc(col)}" value="${esc(v)}">`;
  }else{
    /* coluna de data com texto livre (ex.: "a definir") continua editável como texto */
    /* Identificador NUNCA vira type="number". O campo numérico do navegador
       recusa o zero à esquerda, engole o que não entende e devolve '' — quem
       digitasse 00623904000173 veria o campo esvaziar sozinho. type="text" com
       inputmode="numeric" dá o teclado de números no celular e não toca no valor. */
    const num=b4uEhIdentificador(col)?' inputmode="numeric"':'';
    ctrl=`<input type="text" data-ecol="${esc(col)}" value="${esc(v)}"${num}${f.t==='date'?' placeholder="aaaa-mm-dd"':''}>`;
  }
  /* data-esperado marca o campo que conta para a régua de completude: é o que
     ganha (e perde) o destaque avermelhado conforme a pessoa vai preenchendo. */
  /* Documento que chegou com dígito faltando avisa aqui dentro, embaixo do
     campo. Na lista o ⚠ diz que tem coisa errada; é na ficha, com o campo à
     vista, que cabe dizer o quê e onde consertar. */
  const est=b4uEstado(v,col);
  const aviso=est.truncado?`<span class="fld-aviso">⚠ ${b4uEsc(b4uAviso(est))}</span>`:'';
  const esperado=ehEsperado(col);
  return `<div class="fld ${f.full?'full':''}${esperado&&!v?' emfalta':''}"${esperado?' data-esperado="1"':''}>${rot}${ctrl}${aviso}</div>`;
}
function corpoHTML(cli){
  const secs=SEC_ORDER.filter(s=>CAMPOS_EDIT.some(f=>f.s===s));
  const blocos=secs.map(sc=>`<div class="gsec"><h3><span class="dot"></span>${esc(sc)}</h3>
      <div class="grid">${CAMPOS_EDIT.filter(f=>f.s===sc).map(f=>campoEditHTML(cli,f)).join('')}</div></div>`).join('');
  const drive=valorDe(cli,COL.drive);
  return `<div class="corpo" data-id="${esc(cli.id)}">
    <div class="ign" id="ign_${esc(cli.id)}"></div>
    ${blocos||'<div class="vazio">Esse cliente não tem colunas para mostrar.</div>'}
    <div class="rodape">
      <span>As alterações salvam sozinhas. Campos com 🔒 são mantidos pelo sistema.</span>
      ${/^https?:/i.test(drive)?`<a class="lk" href="${esc(drive)}" target="_blank" rel="noopener">📁 Pasta no Drive ↗</a>`:''}
      ${META.planilha_url?`<a class="lk" href="${esc(META.planilha_url)}" target="_blank" rel="noopener">Planilha ↗</a>`:''}
    </div>
  </div>`;
}
/* Quantos filtros estão ESTREITANDO a lista agora (C.5). Só conta o que TIRA
   cliente da vista: a busca fica à mostra na régua, e a ordenação não esconde
   ninguém — foi por isso que ela saiu daqui junto com o <select> "Ordenar por".
   Situação só conta quando não está com tudo marcado, que é o repouso. */
function filtrosPainel(){
  return (FILTRO!=='todos'?1:0)+(sitEhPadrao()?0:1)+(F_PROD.length?1:0)+(F_PEND?1:0);
}
/* Volta ao estado de repouso: todas as situações, todos os produtos, sem o corte
   de pendência, sem busca e na ordem de ID. É o mesmo estado com que a tela
   abre, e por isso ele mora numa função só — o "Limpar" e o `irPara()` (que
   desfaz o filtro para alcançar um cliente escondido) precisam do MESMO gesto. */
function zerarFiltros(){
  FILTRO='todos';TERMO='';F_SIT=SIT_VALS.slice();F_PROD=[];F_PEND=false;TETO=PASSO;
  /* Escrever no componente NÃO dispara o `aoMudar` dele (senão a lista seria
     desenhada uma vez por caixa); quem chama redesenha. */
  if(CX.sit)CX.sit.marcados(F_SIT);
  if(CX.prod)CX.prod.marcados(F_PROD);
  const b=document.getElementById('busca');if(b)b.value='';
}
function limparFiltros(){
  zerarFiltros();ORDEM='id';DIR='asc';
  redesenhar();
}
/* Redesenha a RÉGUA inteira: as duas caixas de seleção (quando o módulo está no
   ar), os controles nativos de reserva e o botão de pendência, que é da página
   nos dois caminhos. As contagens saem todas do `baseBusca()` — ver a nota lá em
   cima —, e é por isso que `atualizarCaixas()` é chamado DAQUI e não só do
   `redesenhar()`: digitar na busca chama `desenharLista()` direto, e sem esta
   linha os números do painel congelariam na primeira letra. */
function desenharChips(){
  atualizarCaixas();
  const base=baseBusca();
  const sel=document.getElementById('f-sit');
  if(sel&&sel.tagName==='SELECT'){
    const vivos=filtrosVivos();
    if(!vivos.some(f=>f.k===FILTRO)) FILTRO=vivos.length?vivos[0].k:'todos';
    sel.innerHTML=vivos.map(f=>{
      const n=base.filter(f.fn).length;
      return `<option value="${esc(f.k)}"${f.k===FILTRO?' selected':''}>`+esc(f.rot)+' · '+n+`</option>`;
    }).join('');
    sel.classList.toggle('corta',FILTRO!=='todos');
  }
  const psel=document.getElementById('f-prod-sel');
  if(psel){
    const itens=itensProd();
    psel.hidden=!itens.length;
    const um=F_PROD.length===1?String(F_PROD[0]):'';
    psel.innerHTML=`<option value="">Todos os produtos</option>`+
      itens.map(i=>`<option value="${esc(i.v)}"${String(i.v)===um?' selected':''}>${esc(i.r)}</option>`).join('');
    psel.classList.toggle('corta',!!F_PROD.length);
  }
  desenharPend(base);
}
/* O botão liga/desliga. Some quando nenhuma das colunas de pendência existe —
   um botão que não pode achar nada é pior que botão nenhum.
   A contagem no rótulo é a mesma conta das caixas: sobre o que a busca deixou. */
function desenharPend(base){
  const bt=document.getElementById('f-pend');if(!bt)return;
  const quais=filtrosFalta();
  bt.hidden=!quais.length;
  if(!quais.length)return;
  const n=(base||baseBusca()).filter(comPendencia).length;
  bt.textContent='Com pendências · '+n;
  bt.setAttribute('aria-pressed',String(F_PEND));
  bt.title=(F_PEND?'Mostrando só quem tem pendência. Clique para ver todos.'
                  :'Só os clientes com alguma pendência.')+
    ' Conta como pendência: '+quais.map(f=>f.rot).join(', ')+'.';
}
function desenharLista(){
  const arr=visiveis();
  document.getElementById('cnt').textContent=arr.length+' de '+CLIENTES.length+' clientes';
  const el=document.getElementById('lista'),dica=document.getElementById('dica');
  if(!arr.length){
    el.innerHTML=`<div class="vazio">${CLIENTES.length?'Nenhum cliente com esse filtro ou essa busca.':'Nenhum cliente cadastrado ainda.'}</div>`;
    if(dica)dica.textContent='';
    desenharChips();desenharResumoLista();sincronizarURL();
    return;
  }
  /* Teto de 20: a tela abre com o começo da lista, não com as 110 linhas. */
  const n=Math.min(TETO,arr.length);
  /* A linha não expande mais: o cadastro abre no modal. O que ABERTOS marca aqui
     é só QUAL linha está com o cadastro aberto, para ela ficar acesa na lista. */
  el.innerHTML=cabecalhoLista()+
    arr.slice(0,n).map(c=>`<div class="cli ${classeSituacao(c)}${ABERTOS.has(c.id)?' aberto':''}" data-id="${esc(c.id)}">${cabecaHTML(c)}</div>`).join('')+
    rodapeLista(n,arr.length);
  if(dica)dica.textContent=arr.length>n?('Mostrando '+n+' de '+arr.length+'.'):'';
  desenharChips();desenharResumoLista();
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
  sincronizarURL();
}
/* A contagem em texto é o que permite recolher chips e cartões sem esconder
   pendência: os números continuam na primeira linha da tela, filtrada ou não. */
function desenharResumoLista(){
  const el=document.getElementById('resumo-lista');if(!el)return;
  const vis=visiveis().length,tot=CLIENTES.length;
  const quantos=fn=>CLIENTES.filter(fn).length;
  const p=[(vis===tot?String(tot):vis+' de '+tot)+' clientes'];
  if(COL.ativo){const a=quantos(c=>situacaoDe(c)==='ativo');if(a)p.push(a+' ativos');}
  if(COL.inicio){const s=quantos(c=>exigeInicio(c)&&!valorDe(c,COL.inicio));if(s)p.push(s+' sem data de início');}
  if(COL.cnpj){const s=quantos(c=>!valorDe(c,COL.cnpj));if(s)p.push(s+' sem CNPJ');}
  if(COL.regime){const s=quantos(c=>!valorDe(c,COL.regime));if(s)p.push(s+' sem regime');}
  el.textContent=p.join(' · ');
}
/* `atualizarCaixas()` não está mais aqui: ele mora dentro do `desenharChips()`,
   que é chamado por este e também pelo `desenharLista()` da busca. */
function redesenhar(){
  normalizarOrdem();desenharChips();desenharResumo();desenharLista();
}
/* ---------- busca, filtro e ordenação no endereço (C.10) ----------
   F5 volta para a mesma visão; chave, cod e #hash ficam intactos. */
/* Nada marcado em Situação é um estado LEGÍTIMO ("não me mostre nada") e é
   diferente do padrão. Sem esta marca os dois virariam uma `sit=` vazia no
   endereço, e o F5 desfaria o que a pessoa acabou de fazer. */
const SIT_NADA='__nada__';
function sitEhPadrao(){
  if(!F_SIT||!SIT_VALS.length)return true;      // sem lista não há recorte a guardar
  return F_SIT.length===SIT_VALS.length&&SIT_VALS.every(v=>F_SIT.indexOf(v)>=0);
}
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    set('q',TERMO);
    set('f',FILTRO==='todos'?'':FILTRO);
    set('sit',sitEhPadrao()?'':(F_SIT.length?F_SIT.join(','):SIT_NADA));
    set('prod',F_PROD.join(','));
    set('pend',F_PEND?'1':'');
    set('ord',ORDEM==='id'?'':ORDEM);
    set('dir',DIR==='asc'?'':DIR);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  FILTRO=p.get('f')||'todos';
  const lista=k=>(p.get(k)||'').split(',').map(s=>s.trim()).filter(Boolean);
  const sit=lista('sit');
  /* null = padrão; vira a lista inteira quando as situações forem conhecidas. */
  F_SIT=sit.length?(sit[0]===SIT_NADA?[]:sit):null;
  F_PROD=lista('prod');
  F_PEND=p.get('pend')==='1';
  ORDEM=p.get('ord')||'id';
  DIR=p.get('dir')==='desc'?'desc':'asc';
  return p.get('q')||'';
}
/* O `?f=` de antes continua chegando de links guardados e de F5 em aba antiga.
   Cada valor dele tem tradução nos controles novos, e nenhum é jogado fora
   calado — um filtro que some sem aviso é uma tela que "perdeu" clientes.
     ativos/inativando/inativos -> a caixa Situação, com um item marcado
     sem_produtos               -> a caixa Produtos, no item "(sem produtos)"
     as outras quatro `falta`   -> o botão Com pendências ligado
   A última linha é a única que ALARGA o pedido: "sem CNPJ" vira "com alguma
   pendência", porque o botão tem dois estados e não sabe dizer qual delas. */
const LEGADO_SIT={ativos:'ativo',inativando:'inativando',inativos:'inativo'};
function traduzirFiltroLegado(){
  if(!FILTRO||FILTRO==='todos')return;
  const s=LEGADO_SIT[FILTRO];
  if(s&&SIT_VALS.indexOf(s)>=0)F_SIT=[s];
  else if(FILTRO==='sem_produtos'&&itensProd().some(i=>String(i.v)===PROD_SEM))F_PROD=[PROD_SEM];
  else if(FILTROS.some(f=>f.k===FILTRO&&f.cls==='falta'))F_PEND=true;
  else return;                       // chave que não existe mais: não mexe em nada
  FILTRO='todos';
}

function clientePorId(id){return CLIENTES.find(c=>String(c.id)===String(id));}

/* ===================================================================
   O cadastro no modal
   -------------------------------------------------------------------
   A lista mostra as colunas que a equipe lê de relance; o resto do
   cadastro abre aqui, por cima, sem trocar de página e sem empurrar as
   outras linhas para baixo. O conteúdo é o MESMO corpoHTML() de sempre —
   só mudou onde ele é pintado, então campos, travas, destaque de campo
   vazio e faixa de "não gravei" continuam idênticos.
   =================================================================== */
let CAD_ID='';           // de quem é o cadastro aberto — ou o último que esteve
/* A MOLDURA do cadastro mora no b4u-modal.js: véu e clique fora, Esc, trava da
   rolagem do fundo, foco preso dentro da caixa, o aviso de "tem coisa por
   gravar" e o fechar em dois tempos. O que fica nesta página é o que é DESTE
   cadastro — o que se pinta dentro da caixa e o que se grava. Sem o arquivo, CAD
   é nulo: as fichas não abrem e a lista continua inteira. */
const CAD = window.B4UModal && window.B4UModal.adotar('modalCad', {
  ids:{titulo:'cadTitulo',selo:'cadId',pill:'cadSit',corpo:'cadBody',
       status:'saveStatusCad',aviso:'cadAviso',fechar:'cadFechar',x:'fechaCad'},
  base:{pill:'pill',status:'save-status claro'},
  sujo:()=>temPendencia(),
  /* Ao sair, a gravação que ainda esperava o debounce é DESCARREGADA na hora:
     deixá-lo correndo com o formulário fora da tela é exatamente o jeito de
     perder o que foi digitado. */
  aoFechar:()=>{
    if(SUJOS.size)descarregarPendentes();
    ABERTOS.delete(String(CAD_ID));marcarLinhaAberta();
    document.getElementById('cadBody').innerHTML='';
  },
  /* O foco volta para a linha de onde saiu: quem navega por teclado não é jogado
     de volta para o topo da página. */
  focoVolta:()=>document.querySelector(`.cli[data-id="${CSS.escape(String(CAD_ID))}"] .cli-head`)
});
function cadAberto(){return !!CAD&&CAD.aberto();}
/** Nome, ID e situação no topo do modal — acompanham a edição sem redesenhar nada. */
function atualizarTopoCad(id){
  if(!cadAberto()||String(CAD_ID)!==String(id))return;
  const cli=clientePorId(id);if(!cli)return;
  const s=situacaoDe(cli),info=SITUACOES[s];
  CAD.titulo(cli.nome||'(sem nome)').selo(cli.id).pill({texto:info.rot,classe:'sit-'+s,dica:info.dica});
}
/** Acende na lista a linha do cadastro que está aberto. */
function marcarLinhaAberta(){
  document.querySelectorAll('.cli').forEach(n=>n.classList.toggle('aberto',ABERTOS.has(n.dataset.id)));
}
function abrirCadastro(id){
  const cli=clientePorId(id);if(!cli)return;
  if(!CAD)return;
  CAD_ID=String(cli.id);
  document.getElementById('cadBody').innerHTML=corpoHTML(cli);
  CAD.abrir();
  atualizarTopoCad(CAD_ID);
  /* ABERTOS deixou de expandir a linha, mas continua dizendo QUAL cadastro está
     aberto: é ele que acende a linha e é nele que carregar({expandir}) marca o
     cliente recém-criado antes de a lista existir. */
  ABERTOS.clear();ABERTOS.add(CAD_ID);
  marcarLinhaAberta();
  /* Reabrir não pode apagar o que não gravou: a faixa e o "tentar de novo"
     nascem de novo junto com os campos. */
  if(FALHAS.has(CAD_ID))marcarFalha(CAD_ID,true);
}
/* Grava agora o que estava esperando o debounce. É o salvar() de sempre, só sem
   os 700 ms de espera. */
function descarregarPendentes(){
  Array.from(SUJOS.keys()).forEach(id=>{const s=SUJOS.get(id);if(s)clearTimeout(s.timer);salvar(id);});
}
function fecharCadastro(forcado){if(CAD)CAD.fechar(forcado);}
/* O botão "Salvar alterações" NÃO substitui o autosave: cada edição continua
   chamando agendarSalvar(), e é ele que impede perder texto digitado — foi para
   isso que ele existe nesta tela. O botão ANTECIPA a gravação pendente (mata o
   debounce e salva na hora), reenvia o que falhou e, quando tudo entrou, FECHA o
   cadastro: salvar é o gesto de encerrar, e ficar com a ficha aberta depois de
   confirmar faz a pessoa clicar em Fechar sem saber se gravou.

   Só fecha se gravou MESMO. Falha mantém o cadastro na tela: fechar por cima de
   uma gravação que não foi levaria embora o aviso e a chance de tentar de novo,
   e a pessoa sairia achando que salvou. */
async function salvarAgoraCad(){
  const id=CAD_ID, btn=document.getElementById('cadSalvar');
  if(temPendencia()){
    if(btn){btn.disabled=true;btn.dataset.rot=btn.textContent;btn.textContent='Salvando…';}
    try{
      /* Linha em DÚVIDA não volta para a fila. Tirar o botão "tentar de novo" da
         linha e deixar o botão primário da ficha reenviando a mesma coisa seria
         fechar a porta e deixar a janela aberta: a gravação pode ter entrado, e
         mandar de novo é o que este caminho todo existe para não fazer. Ela fica
         pendente — a ficha não fecha, e o recado diz o que fazer. */
      /* o que falhou antes volta para a fila de sujos antes do disparo */
      if(id&&FALHAS.has(String(id))&&!INCERTOS.has(String(id))){
        const f=FALHAS.get(String(id));
        const su=SUJOS.get(id)||{timer:null,colunas:new Set()};
        f.colunas.forEach(c=>su.colunas.add(c));
        SUJOS.set(id,su);FALHAS.delete(String(id));
      }
      const ids=Array.from(SUJOS.keys());
      ids.forEach(k=>{const su=SUJOS.get(k);if(su)clearTimeout(su.timer);});
      await Promise.all(ids.map(k=>salvar(k)));
    }catch(e){ /* salvar() já registra a falha em FALHAS e avisa na tela */ }
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.rot||'Salvar alterações';}
  }
    /* Sobrou dúvida: a ficha NÃO fecha (o `temPendencia()` abaixo cuida disso) e
       agora ela diz por quê. Sem este recado, o botão pareceria não ter feito
       nada. */
    if(INCERTOS.size) setSave('err','Uma gravação ficou sem confirmação. Recarregue a página para ver se ela entrou — não mande de novo.');
  if(temPendencia())return;            // não gravou: a ficha continua aberta
  fecharCadastro(true);
}
/* ---------- ?abrir=ID: chegar com a ficha já aberta ----------
   O dossiê da pesquisa rápida manda para cá em guia nova quando o colaborador
   clica em "Alterar". Sem isto ele cairia na lista e teria de procurar de novo o
   cliente que já estava na tela — que é exatamente o passo que o botão existe
   para poupar.

   Só na PRIMEIRA carga, e o parâmetro sai do endereço assim que é usado. Se
   ficasse, um F5 reabriria a ficha por cima do que a pessoa estivesse fazendo, e
   o endereço que ela copiasse da barra levaria o colega para dentro de uma ficha
   que ele não pediu.

   Quem faz o trabalho é o irPara(), o MESMO dos cartões de resumo: ele limpa o
   filtro se o cliente estiver escondido, sobe o teto da lista se ele estiver
   além dele, rola até a linha e abre. Reaproveitar em vez de reimplementar é o
   que garante que o link funcione mesmo quando a tela abriu filtrada. */
let JA_ABRIU_PELO_ENDERECO=false;
function abrirPeloEndereco(){
  if(JA_ABRIU_PELO_ENDERECO) return;
  JA_ABRIU_PELO_ENDERECO=true;
  const alvo=(new URLSearchParams(location.search).get('abrir')||'').trim();
  if(!alvo) return;
  try{ const u=new URL(location.href); u.searchParams.delete('abrir');
       history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(e){}
  irPara(alvo);
}
function irPara(id){
  const alvo=String(id);let mexeu=false;
  /* Nenhum dos QUATRO recortes pode esconder o cliente para onde estamos indo —
     é o que faz o `?abrir=ID` do painel do colaborador chegar sempre na ficha
     certa, mesmo que a tela tenha aberto filtrada por um endereço guardado. */
  if(!visiveis().some(c=>String(c.id)===alvo)){zerarFiltros();mexeu=true;}
  /* O teto não pode esconder justamente a ficha para onde estamos indo. */
  const pos=visiveis().findIndex(c=>String(c.id)===alvo);
  if(pos>=TETO){TETO=Math.ceil((pos+1)/PASSO)*PASSO;mexeu=true;}
  if(mexeu)redesenhar();
  const no=document.querySelector(`.cli[data-id="${CSS.escape(String(id))}"]`);if(!no)return;
  no.scrollIntoView({block:'center',behavior:'smooth'});
  no.classList.add('flash');setTimeout(()=>no.classList.remove('flash'),1800);
  /* Enquanto o "Novo cliente" está na tela (inclusive na tela de sucesso, que
     recarrega a lista por baixo), o cadastro NÃO sobe por cima: dois modais
     empilhados roubariam a tela de quem acabou de criar o cliente. Ali quem abre
     é o botão "Ver o cadastro". */
  const novo=document.getElementById('modal');
  if(!novo||novo.hidden)abrirCadastro(id);
}

/* ---------------- salvar (auto-save com debounce) ---------------- */
const SUJOS=new Map();   // id -> {timer, colunas:Set}
/* ---------- falhas de gravação (C.3) ----------
   FALHAS = o servidor recusou e o dado só existe na tela. O cadastro fica
   marcado com um "tentar de novo" no topo dele, e fechar a aba pede confirmação. */
const FALHAS=new Map();   // id -> {colunas:Set}
function temPendencia(){return SUJOS.size>0||FALHAS.size>0;}
/* ---------- o terceiro estado ----------
   Uma gravação que não deu para confirmar NÃO é uma gravação que falhou. As duas
   pedem que o texto digitado não se perca (e por isso as duas entram em FALHAS,
   que é o que segura o aviso de "sair sem gravar"), mas só uma delas autoriza
   repetir. Este conjunto é a diferença: quem está aqui recebe selo de dúvida, sem
   botão, e a instrução de recarregar. */
const INCERTOS=new Set();

/* O selo que a linha ganha quando algo não gravou. Duas formas, porque são dois
   fatos diferentes — e a diferença aparece no que ele OFERECE: o de falha tem
   botão (repetir é seguro, o servidor disse que não gravou); o de dúvida não tem
   botão nenhum, porque a única ação segura ali é recarregar e olhar. */
function seloFalha(id){
  return INCERTOS.has(String(id))
    ? '<span class="ign-duvida">sem confirmação — recarregue a página para ver se gravou</span>'
    : '<button type="button" class="btn-retry" data-retry="'+esc(String(id))+'">não salvou — tentar de novo</button>';
}

function marcarFalha(id,falhou){
  const chave=CSS.escape(String(id));
  /* A LINHA continua marcada na lista mesmo com o cadastro fechado — é o que
     mostra, de longe, que aquele cliente tem coisa que não gravou. */
  const no=document.querySelector('.cli[data-id="'+chave+'"]');
  if(no)no.classList.toggle('falhou',!!falhou);
  /* A faixa e os campos vivem no .corpo, que hoje é pintado dentro do modal:
     procurar pelo .corpo funciona esteja ele onde estiver (e não existe quando o
     cadastro está fechado, que é o caso em que não há o que marcar). */
  const corpo=document.querySelector('.corpo[data-id="'+chave+'"]');
  if(!corpo)return;
  const cx=corpo.querySelector('.ign');
  if(cx){
    /* Trocar, não só inserir. O guarda antigo era `se falhou e ainda não há selo,
       insere` — o que bastava quando havia UM selo só. Com dois, ele congelava o
       primeiro: uma linha que falhou (botão vermelho) e depois ficou em dúvida
       continuaria oferecendo "tentar de novo" embaixo de um texto que pede para NÃO
       repetir; e o contrário — dúvida antes, recusa do servidor depois — esconderia o
       botão justamente quando repetir passou a ser o certo. O selo é redesenhado a
       cada chamada, e some quando não há mais o que marcar. */
    const antigo=cx.querySelector('.btn-retry,.ign-duvida');
    if(falhou&&antigo)antigo.outerHTML=seloFalha(id);
    else if(falhou)cx.insertAdjacentHTML('beforeend',seloFalha(id));
    else if(antigo)antigo.remove();
  }
  /* o campo que não gravou também fica marcado, para não sobrar dúvida de onde foi */
  const f=FALHAS.get(String(id));
  corpo.querySelectorAll('[data-ecol]').forEach(el=>{
    el.classList.toggle('falhou',!!(falhou&&f&&f.colunas.has(el.dataset.ecol)));
  });
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação.
   Quem faz o pedido é a casca do b4u-modal.js, pelo `sujo:()=>temPendencia()` da
   adoção lá em cima — a mesma pergunta valia em sete telas e estava escrita sete
   vezes. */
function agendarSalvar(id,coluna,ms){
  let s=SUJOS.get(id);
  if(!s){s={timer:null,colunas:new Set()};SUJOS.set(id,s);}
  s.colunas.add(coluna);
  clearTimeout(s.timer);
  s.timer=setTimeout(()=>salvar(id),ms==null?700:ms);
  setSave('saving','Alterado…');
}
async function salvar(id){
  const s=SUJOS.get(id);if(!s)return;
  SUJOS.delete(id);
  const cli=clientePorId(id);if(!cli)return;
  const campos={};s.colunas.forEach(c=>campos[c]=b4uParaPlanilha(cli.valores[c],c));
  const ign=document.getElementById('ign_'+id);
  /* Cada gravação recebe um número. A conferência do caso incerto demora alguns
     segundos, e nesse meio-tempo a pessoa pode ter digitado de novo: sem este
     carimbo, a resposta de uma conferência VELHA pintaria "Salvo ✓ (confirmado)"
     por cima de uma gravação nova que ainda está viajando. */
  /* O post voltou? É o que separa "a tela quebrou depois de gravar" de "a exceção
     nem chegou a virar requisição". Sem esta marca, um erro lançado ANTES do post
     — dentro do mesmo try — seria anunciado como gravação bem-sucedida. */
  let respondeu=false;
  const seq=++CONF_N; CONF_SEQ.set(String(id),seq);
  try{
    setSave('saving','Salvando…');
    const r=await postAcao({acao:'registro_salvar',id:cli.id,cliente:cli.nome||'',cod:codAtual(),campos});
    respondeu=true;
    const ignoradas=(r&&r.ignoradas||[]).filter(Boolean);
    setSave('ok','Salvo ✓ '+horaAgora()+(ignoradas.length?' · '+ignoradas.length+' ignorada'+(ignoradas.length>1?'s':''):''),
      ignoradas.length?('Não gravadas: '+ignoradas.join(', ')):'');
    if(ign)ign.innerHTML=ignoradas.length?('Não gravei: <b>'+ignoradas.map(esc).join('</b>, <b>')+'</b> — coluna travada ou que não existe mais no cadastro.'):'';
    /* o nome pode ter mudado: reflete no cabeçalho e na busca */
    cli.nome=valorDe(cli,COL.nome)||cli.nome;
    if(COL.ativo)cli.ativo=valorDe(cli,COL.ativo);
    /* Os produtos do cliente podem ter mudado: as duas caches da caixa de
       Produtos (a lista e a versão normalizada) caem junto com as outras, senão
       a régua continuaria contando o produto antigo. */
    cli._b=null;cli._bd=null;cli._v=null;cli._pl=null;cli._pn=null;
    FALHAS.delete(String(id));INCERTOS.delete(String(id));marcarFalha(id,false);
    /* Gravou tudo: o aviso de "tem coisa por gravar" no rodapé do modal sai, e o
       Fechar volta a ser Fechar. */
    if(!temPendencia()&&CAD)CAD.aviso(false);
    atualizarCabeca(id);
    /* O `desenharChips()` já atualiza as caixas por dentro — a lista de produtos
       e as contagens mudam quando alguém grava. */
    desenharChips();desenharResumo();
  }catch(e){
    /* o que não gravou volta para a fila: a próxima tentativa manda tudo de novo */
    const guardarFalha=()=>{
      const f=FALHAS.get(String(id))||{colunas:new Set()};
      s.colunas.forEach(c=>f.colunas.add(c));
      FALHAS.set(String(id),f);
      marcarFalha(id,true);
    };
    /* Uma resposta que chega depois de outra gravação já ter assumido este
       cadastro não tem mais nada a dizer sobre ele: o que está na tela é o texto
       da gravação nova, e o veredicto desta aqui — sucesso ou fracasso — falaria
       de algo que já não está mais lá. Sai calada, sem tocar na faixa. */
    if(CONF_SEQ.get(String(id))!==seq) return;
    /* TRÊS desfechos, não dois — e a diferença é toda ela sobre o que dá para
       AFIRMAR. */

    /* (1) O servidor leu, decidiu e recusou. Não gravou. O texto é escrito por nós
       ("coluna travada", "cadastro mudou de lugar") e vai para a tela: aqui quem
       lê é da equipe, e esconder o motivo já custou caro neste painel. */
    if(e&&e.doServidor){
      guardarFalha(); INCERTOS.delete(String(id)); marcarFalha(id,true);
      setSave('err','O servidor recusou: '+String((e&&e.message)||e));
      return;
    }
    /* (2) A exceção NÃO veio do postAcao — ele só devolve `doServidor` ou
       `incerto`. Restam dois casos, e o `respondeu` os separa:
       • o post JÁ tinha voltado e quem estourou foi o código de tela que roda
         depois dele — então GRAVOU, e dizer "o servidor recusou" seria inverter o
         fato e ainda oferecer um "tentar de novo" que regravaria o que já está lá;
       • o post NEM chegou a sair (algo estourou antes dele, dentro do mesmo try) —
         aí nada foi gravado e repetir é seguro. */
    if(!e||!e.incerto){
      if(respondeu){
        FALHAS.delete(String(id)); INCERTOS.delete(String(id)); marcarFalha(id,false);
        setSave('ok','Salvo ✓ '+horaAgora()+' · a tela não acompanhou — recarregue para vê-la certa');
      }else{
        guardarFalha(); INCERTOS.delete(String(id)); marcarFalha(id,true);
        setSave('err','Não foi possível salvar. Tente de novo.');
      }
      return;
    }
    /* (3) A resposta se perdeu. A gravação acontece ANTES da resposta, e o front
       não tem como saber se ela aconteceu — então, em vez de decretar, ele vai
       PERGUNTAR.
       A pendência é registrada AGORA, antes de perguntar: a conferência leva até
       28 s, e nesse intervalo `SUJOS` já foi esvaziado. Sem isto, `temPendencia()`
       diria "não há nada por gravar" e o F5 que a mensagem seguinte vai pedir
       sairia sem aviso nenhum, levando o texto junto. Só o SELO no cadastro espera
       — porque o selo é uma afirmação, e ainda não há nada a afirmar. */
    guardarFalha(); marcarFalha(id,false);
    setSave('saving','A resposta não chegou — conferindo se gravou…');
    const r=await conferirGravacao(cli.id,campos);
    if(CONF_SEQ.get(String(id))!==seq) return;   // enquanto conferíamos, outra gravação assumiu o cadastro
    if(r==='bateu'){
      FALHAS.delete(String(id)); INCERTOS.delete(String(id)); marcarFalha(id,false);
      setSave('ok','Salvo ✓ (confirmado) '+horaAgora());
      /* A faixa de "Não gravei: <coluna>" é da gravação ANTERIOR. Deixá-la de pé
         embaixo de um "confirmado" faria esta gravação parecer ter perdido uma
         coluna que ela nem mandou. */
      if(ign)ign.innerHTML='';
      cli.nome=valorDe(cli,COL.nome)||cli.nome;
      if(COL.ativo)cli.ativo=valorDe(cli,COL.ativo);
      cli._b=null;cli._bd=null;cli._v=null;cli._pl=null;cli._pn=null;
      if(!temPendencia()&&CAD)CAD.aviso(false);
      atualizarCabeca(id);
      desenharChips();desenharResumo();
      return;
    }
    if(r==='nao-bateu'){
      /* Única hora em que "mande de novo" é conselho honesto: o cadastro foi lido
         e o valor não está lá. */
      INCERTOS.delete(String(id)); marcarFalha(id,true);
      setSave('err','Não gravou tudo: reli o cadastro e algum campo não está com o que você mandou. Pode mandar de novo.');
      return;
    }
    /* 'nao-sei': a dúvida continua de pé. Selo de dúvida, sem botão — e o pedido é
       recarregar, nunca repetir. */
    INCERTOS.add(String(id)); marcarFalha(id,true);
    setSave('err','Não consegui confirmar se salvou. Recarregue antes de mandar de novo.');
  }
}
/** Manda de novo o que ficou para trás naquele cadastro. */
function tentarDeNovo(id){
  const f=FALHAS.get(String(id));if(!f)return;
  const s=SUJOS.get(id)||{timer:null,colunas:new Set()};
  f.colunas.forEach(c=>s.colunas.add(c));
  SUJOS.set(id,s);
  FALHAS.delete(String(id)); INCERTOS.delete(String(id));
  salvar(id);
}
function atualizarCabeca(id){
  const cli=clientePorId(id);if(!cli)return;
  const no=document.querySelector(`.cli[data-id="${CSS.escape(String(id))}"]`);
  if(no){
    /* Os campos vivem no modal, não mais dentro da linha: repintar a linha inteira
       aqui não tira o foco de ninguém — e assim CNPJ, cidade, produtos e data
       acompanham a edição, não só o nome. Redesenhar a LISTA continua proibido
       durante a digitação. */
    /* Se o foco estava NA linha (é onde ele volta ao fechar o cadastro), ele volta
       para ela depois da repintura: uma gravação que termina meio segundo depois
       não pode jogar quem navega por teclado de volta para o topo da página. */
    const cabeca=no.querySelector('.cli-head');
    const tinhaFoco=!!cabeca&&document.activeElement===cabeca;
    no.innerHTML=cabecaHTML(cli);
    if(tinhaFoco){const nova=no.querySelector('.cli-head');if(nova)nova.focus();}
    /* a faixa lateral acompanha a mudança de situação sem redesenhar a lista */
    no.classList.remove('sit-ativo','sit-inativando','sit-inativo','sit-sem');
    no.classList.add(classeSituacao(cli));
  }
  atualizarTopoCad(id);   // e o topo do modal mostra o nome e a situação novos
}

/* ===================================================================
   Cliente novo — o formulário do onboarding, dentro desta página
   =================================================================== */
let NOVO_CAMPOS=[],NOVO_ROLE={},PROX_ID='',criando=false;
/* O "cliente novo" usa a MESMA casca do cadastro (b4u-modal.js). A diferença é a
   TRAVA: enquanto o servidor cria as pastas no Drive e as planilhas, nem Esc, nem
   o clique no véu, nem o × fecham. Não é zelo — cada tentativa nova gera OUTRO
   cliente, com o próximo ID e pastas novas, e é assim que aparece cliente
   duplicado. A caixa fica em 860px, que é a largura que este formulário sempre
   teve; a do cadastro é mais larga. */
const NOVO = window.B4UModal && window.B4UModal.adotar('modal', {
  ids:{corpo:'modalBody',x:'fechaModal'},
  largura:860,
  travado:()=>criando
});
const novoVal={};
const prodSel=new Set();

function campoHTML(f,i){
  const id='f_'+i;
  const req=f.req?'<span class="req">*</span>':'';
  let inner;
  if(f.t==='select'){inner=`<select id="${id}" data-col="${esc(f.col)}">${(f.opts||[]).map(o=>`<option value="${esc(o)}">${o?esc(o):'—'}</option>`).join('')}</select>`;}
  else if(f.t==='textarea'){inner=`<textarea id="${id}" data-col="${esc(f.col)}" rows="2" placeholder="${esc(f.ph||'')}"></textarea>`;}
  /* Ver campoEditHTML: identificador é texto com teclado numérico, nunca type="number". */
  else{inner=`<input id="${id}" data-col="${esc(f.col)}" type="${f.t==='date'?'date':'text'}"${b4uEhIdentificador(f.col)?' inputmode="numeric"':''} ${f.max?`maxlength="${f.max}"`:''} placeholder="${esc(f.ph||'')}">`;}
  return `<div class="fld ${f.full?'full':''}" data-fld="${esc(f.col)}"><label for="${id}">${esc(f.col)} ${req}</label>${inner}</div>`;
}
function renderNovo(){
  const secs=SEC_ORDER.filter(s=>NOVO_CAMPOS.some(f=>f.s===s));
  let html=`
    <div class="idcard">
      <div class="lbl">Próximo ID previsto</div>
      <div class="idval" id="idprev">${esc(PROX_ID||'…')}</div>
      <div class="nome" id="nomeprev">Nome: <b>—</b></div>
    </div>
    <div class="sec">
      <h2><span class="dot"></span>Produtos Back4you <span class="req" style="color:var(--amber)">*</span></h2>
      <div class="prods" id="prods">${PRODUTOS.map(p=>`<label class="prod"><input type="checkbox" value="${esc(p)}"> ${esc(p)}</label>`).join('')}</div>
      <p class="hint">Os produtos definem quais planilhas serão criadas: <b>Equiparação</b> → planilha de Equiparação · <b>Contabilidade/Controladoria</b> → Fiscal + Contábil + DP · <b>DP pessoa física</b> → DP. INSS e Agora Tem Especialistas não geram planilha por ora.</p>
    </div>`;
  secs.forEach(sc=>{
    // Identificação aberta: sem ela não dá para criar o cliente.
    const aberta = sc==='Identificação';
    const nCampos = NOVO_CAMPOS.filter(f=>f.s===sc).length;
    const nReq = NOVO_CAMPOS.filter(f=>f.s===sc&&f.req).length;
    html+=`<details class="sec" data-sec="${esc(sc)}"${aberta?' open':''}>
      <summary><span class="arw">▶</span><h2><span class="dot"></span>${esc(sc)}</h2>
        <span class="cnt-sec${nReq?' falta':''}" data-cnt="${esc(sc)}">0 de ${nCampos}${nReq?' · '+nReq+' obrigatório'+(nReq>1?'s':''):''}</span>
      </summary>
      <div class="grid">${NOVO_CAMPOS.map((f,i)=>f.s===sc?campoHTML(f,i):'').join('')}</div></details>`;
  });
  html+=blocoContatosNovo();
  html+=`<div class="msg" id="msg"></div>
    <div class="foot"><button class="btn btn--sec btn--pill" id="cancelar" type="button">Cancelar</button><button class="btn btn--pri btn--pill" id="criar" type="button">Criar cliente</button></div>`;
  const body=document.getElementById('modalBody');
  body.innerHTML=html;
  body.querySelectorAll('#prods input').forEach(c=>c.addEventListener('change',e=>{
    const l=e.target.closest('.prod');
    if(e.target.checked){prodSel.add(e.target.value);l.classList.add('on');}else{prodSel.delete(e.target.value);l.classList.remove('on');}
  }));
  body.querySelectorAll('[data-col]').forEach(el=>el.addEventListener('input',e=>{
    let v=e.target.value;const f=NOVO_CAMPOS[+e.target.id.slice(2)];
    if(f&&f.up){v=v.toUpperCase();e.target.value=v;}
    novoVal[e.target.dataset.col]=v;
    e.target.closest('.fld').classList.remove('miss');
    if(e.target.dataset.col===NOVO_ROLE.razao)atualizarNomePrev();
    contarSecoes();
  }));
  ligarContatosNovo();
  contarSecoes();
  document.getElementById('cancelar').addEventListener('click',fecharModal);
  document.getElementById('criar').addEventListener('click',criarCliente);
  atualizarNomePrev();
}
function atualizarNomePrev(){
  const el=document.getElementById('nomeprev');if(!el)return;
  const razao=(novoVal[NOVO_ROLE.razao]||'').trim();
  el.innerHTML='Nome: <b>'+esc((PROX_ID?PROX_ID+' ':'')+(razao||'—'))+'</b>';
}
function abrirModal(){
  if(!NOVO)return;
  NOVO_CAMPOS=montarCampos(COLUNAS.length?COLUNAS:CAMPOS_FALLBACK,'novo');
  NOVO_ROLE=NOVO_CAMPOS.roles||{};
  Object.keys(novoVal).forEach(k=>delete novoVal[k]);
  prodSel.clear();
  renderNovo();
  if(NOVO)NOVO.abrir();
  if(!PROX_ID){
    jsonp(API_URL+'?tipo=proximo_id&chave='+encodeURIComponent(chaveAtual()))
      .then(d=>{if(d&&!d.erro&&d.id){PROX_ID=d.id;const i=document.getElementById('idprev');if(i)i.textContent=PROX_ID;atualizarNomePrev();}})
      .catch(()=>{});
  }
}
function fecharModal(){if(NOVO)NOVO.fechar();}
/* Quantos campos de cada seção já têm resposta — é o que deixa fechar sem
   esconder. Falta obrigatório vira vermelho, e aí a seção pede para ser aberta
   antes de a pessoa apertar Criar. */
function contarSecoes(){
  document.querySelectorAll('[data-cnt]').forEach(el=>{
    const sc=el.dataset.cnt;
    const campos=NOVO_CAMPOS.filter(f=>f.s===sc);
    const cheios=campos.filter(f=>String(novoVal[f.col]||'').trim()).length;
    const faltaReq=campos.filter(f=>f.req&&!String(novoVal[f.col]||'').trim()).length;
    el.textContent=cheios+' de '+campos.length+(faltaReq?' · '+faltaReq+' obrigatório'+(faltaReq>1?'s':''):'');
    el.classList.toggle('falta',!!faltaReq);
  });
}

/* ---------- contatos junto com o cliente novo ----------
   O momento em que se sabe quem responde pelo cliente é o do cadastro. Deixar
   para depois é o que produz cliente sem contato nenhum — e cliente sem contato
   não recebe acesso, nem cobrança, nem aviso de vencimento. */
let CT_NOVOS=[{nome:'',email:'',telefone:'',papel:'Principal'}];
function linhaContatoNovo(c,i){
  return `<div class="ct-novo" data-ct="${i}">
    <label class="fld"><span class="lbl">Nome</span><input class="in" data-ctk="nome" value="${esc(c.nome||'')}" placeholder="Nome do contato"></label>
    <label class="fld"><span class="lbl">E-mail</span><input class="in" type="email" data-ctk="email" value="${esc(c.email||'')}" placeholder="email@exemplo.com"></label>
    <label class="fld"><span class="lbl">Telefone</span><input class="in" data-ctk="telefone" value="${esc(c.telefone||'')}" placeholder="55DDD9…"></label>
    <label class="fld"><span class="lbl">Papel</span><select class="in" data-ctk="papel">
      <option${c.papel==='Principal'?' selected':''}>Principal</option>
      <option${c.papel==='Principal'?'':' selected'}>Secundário</option></select></label>
    <button type="button" class="btn btn--mini btn--danger-out" data-ctdel="${i}"${CT_NOVOS.length<2?' style="visibility:hidden"':''}>Remover</button>
  </div>`;
}
function blocoContatosNovo(){
  return `<details class="sec" data-sec="Contatos">
    <summary><span class="arw">▶</span><h2><span class="dot"></span>Contatos</h2>
      <span class="cnt-sec" id="cnt-ct">nenhum</span></summary>
    <div id="ct-lista">${CT_NOVOS.map(linhaContatoNovo).join('')}</div>
    <button type="button" class="btn btn--sec btn--mini" id="ct-add">+ Outro contato</button>
    <p class="hint">Opcional. Quem for <b>Principal</b> acessa todas as áreas do painel; Secundário entra sem área nenhuma marcada e você ajusta depois em Contatos. Linha em branco é ignorada.</p>
  </details>`;
}
function contarContatosNovo(){
  const n=CT_NOVOS.filter(c=>String(c.nome||'').trim()||String(c.email||'').trim()).length;
  const el=document.getElementById('cnt-ct');
  if(el) el.textContent = n? (n+' contato'+(n>1?'s':'')) : 'nenhum';
}
function redesenharContatosNovo(){
  const box=document.getElementById('ct-lista'); if(!box) return;
  box.innerHTML=CT_NOVOS.map(linhaContatoNovo).join('');
  contarContatosNovo();
}
function ligarContatosNovo(){
  const body=document.getElementById('modalBody');
  body.addEventListener('input',e=>{
    const el=e.target; if(!el.dataset||!el.dataset.ctk) return;
    const i=+el.closest('[data-ct]').dataset.ct;
    CT_NOVOS[i][el.dataset.ctk]=el.value; contarContatosNovo();
  });
  body.addEventListener('change',e=>{
    const el=e.target; if(!el.dataset||el.dataset.ctk!=='papel') return;
    const i=+el.closest('[data-ct]').dataset.ct;
    CT_NOVOS[i].papel=el.value;
  });
  body.addEventListener('click',e=>{
    const add=e.target.closest('#ct-add');
    if(add){ CT_NOVOS.push({nome:'',email:'',telefone:'',papel:'Secundário'}); redesenharContatosNovo(); return; }
    const del=e.target.closest('[data-ctdel]');
    if(del){ CT_NOVOS.splice(+del.dataset.ctdel,1); if(!CT_NOVOS.length)CT_NOVOS.push({nome:'',email:'',telefone:'',papel:'Principal'}); redesenharContatosNovo(); }
  });
}
function contatosNovoPayload(){
  return CT_NOVOS
    .filter(c=>String(c.nome||'').trim()||String(c.email||'').trim())
    .map(c=>({ nome:String(c.nome||'').trim(), email:String(c.email||'').trim(),
               telefone:String(c.telefone||'').trim(), papel:c.papel||'Secundário',
               areas: c.papel==='Principal' ? AREAS_CONTATO : [] }));
}
const AREAS_CONTATO=['fiscal','contabil','pessoal','societario','equiparacao','financeiro'];

async function criarCliente(){
  const msg=document.getElementById('msg');msg.className='msg';msg.textContent='';
  let faltou=false;
  NOVO_CAMPOS.filter(f=>f.req).forEach(f=>{
    const el=document.querySelector(`#modalBody [data-fld="${CSS.escape(f.col)}"]`);
    if(!((novoVal[f.col]||'').trim())){if(el)el.classList.add('miss');faltou=true;}
  });
  if(!prodSel.size){document.getElementById('prods').closest('.sec').style.outline='2px solid var(--vermelho)';faltou=true;}
  if(faltou){msg.className='msg err';msg.textContent='Preencha os campos obrigatórios (marcados com *).';
    // Campo obrigatório vazio dentro de seção FECHADA seria um erro invisível: a
    // mensagem apontaria para algo que a pessoa não consegue ver.
    document.querySelectorAll('#modalBody .miss').forEach(el=>{
      const d=el.closest('details.sec'); if(d) d.open=true;
    });
    contarSecoes();
    const alvo=document.querySelector('#modalBody .miss')||document.querySelector('#modalBody .sec');
    if(alvo) alvo.scrollIntoView({block:'center',behavior:'smooth'});
    return;}

  const btn=document.getElementById('criar');btn.disabled=true;btn.textContent='Criando… (até ~1 min)';
  criando=true;
  /* O post voltou? Dentro deste try roda coisa ANTES dele (montar o payload,
     descarregar a fila), e uma exceção lá não pode ser anunciada como "já criado".
     Ver o uso lá embaixo, no último ramo do catch. */
  let respondeu=false;
  msg.className='msg';msg.textContent='Criando pastas no Drive e planilhas… não feche a página.';
  setSave('saving','Criando cliente…');
  try{
    const regTexto={};Object.keys(novoVal).forEach(c=>regTexto[c]=b4uParaPlanilha(novoVal[c],c));
    /* Prazo próprio: este é o único POST da página que cria pastas no Drive e
       copia planilhas, e o botão já avisa "até ~1 min". Com os 45 s de todo mundo,
       um onboarding normal estouraria o prazo e cairia no aviso de dúvida — que é
       o pior lugar para mandar alguém, porque o conselho de lá é não repetir. */
    const d=await postAcao({acao:'onboard',produtos:[...prodSel],registro:regTexto,
                            contatos:contatosNovoPayload(),cod:codAtual()},180000);
    respondeu=true;
    criando=false;
    setSave('ok','Cliente '+(d.id||'')+' criado ✓ '+horaAgora());
    sucessoNovo(d);
  }catch(e){
    criando=false;
    btn.disabled=false;btn.textContent='Criar cliente';msg.className='msg err';
    /* Quem separa os dois casos NÃO é mais uma lista de palavras farejada no texto
       da exceção. Aquele regex tinha de adivinhar "failed to fetch", "load failed",
       "NetworkError" — cada navegador escreve o seu, e o que ele não reconhecia
       caía no aviso errado: "tente de novo" na rota que, a cada clique às cegas,
       cria OUTRO cliente, com outro ID e outras pastas no Drive.
       Agora quem responde é o `.incerto`, marcado lá no postAcao, onde a diferença
       de fato existe: resposta do servidor × silêncio. */
    if(e&&e.incerto){
      setSave('err','Não sei se o cliente foi criado');
      /* Aqui NÃO há releitura de confirmação, e é de propósito. Conferir uma
         gravação de campo é comparar o valor mandado com o valor lido. Aqui não há
         valor nem linha: o ID nasce no servidor, e procurar "um cliente parecido"
         na lista é adivinhação — se a busca errar para menos, o painel manda criar
         de novo e o estrago é justamente o que este aviso existe para evitar. */
      msg.innerHTML='A resposta não chegou. <b>O cliente pode já ter sido criado no servidor</b> — feche, atualize a lista e confira <b>antes</b> de mandar de novo. ⚠️ Não clique em "Criar" às cegas: cada tentativa gera um cliente NOVO (com o próximo ID) e novas pastas.';
    }else if(e&&e.doServidor){
      /* Recusa do servidor: ele leu, decidiu e parou. O motivo vai junto, porque
         quem lê é da equipe e costuma ser algo que ela mesma resolve (ID em uso,
         produto sem modelo).
         Mas nem a recusa autoriza repetir às cegas AQUI: o onboarding cria pastas
         no Drive e copia planilhas ANTES de chegar ao fim, e um erro no meio do
         caminho deixa o cadastro pela metade — não em branco. */
      setSave('err','Não criou o cliente');
      msg.innerHTML='O servidor recusou: <b>'+esc(String((e&&e.message)||e))+'</b><br>O cadastro pode ter ficado pela metade — atualize a lista e confira antes de criar de novo.';
    }else if(respondeu){
      /* Sobrou o que NÃO veio do postAcao — ele só devolve `doServidor` ou
         `incerto`. Com o post JÁ respondido, isto estourou no `sucessoNovo(d)`, que
         monta a tela de sucesso e recarrega a lista: o cliente ESTÁ criado, com
         pastas e planilhas. Deixar a mensagem de recusa aqui mandaria alguém criar
         o mesmo cliente uma segunda vez por causa de um erro de pintura. */
      setSave('ok','Cliente criado ✓ '+horaAgora());
      msg.className='msg';   // não é erro: o cadastro existe
      msg.innerHTML='<b>O cliente foi criado.</b> A tela de confirmação é que não conseguiu ser montada — atualize a lista para ver o cadastro novo. Não clique em "Criar" de novo.';
    }else{
      /* O post nem chegou a sair: estourou ao montar o cadastro ou os contatos,
         aqui no navegador. Nada foi criado, e corrigir e repetir é seguro. */
      setSave('err','Não criou o cliente');
      msg.innerHTML='Não consegui montar o cadastro para enviar. Nada foi criado — confira os campos e tente de novo.';
    }
  }
}
function sucessoNovo(d){
  const pl=d.planilhas||{},links=[];
  if(d.pasta)links.push(`<a href="${esc(d.pasta)}" target="_blank" rel="noopener">📁 Pasta do cliente no Drive</a>`);
  if(pl.fiscal)links.push(`<a href="${esc(pl.fiscal)}" target="_blank" rel="noopener">📊 Planilha Fiscal</a>`);
  if(pl.equiparacao)links.push(`<a href="${esc(pl.equiparacao)}" target="_blank" rel="noopener">📊 Planilha Equiparação</a>`);
  if(pl.pessoal)links.push(`<a href="${esc(pl.pessoal)}" target="_blank" rel="noopener">📊 Planilha Departamento Pessoal</a>`);
  /* Os avisos vêm do servidor e são escritos por nós — mas este é o mesmo canal por
     onde, num dia ruim, sobe o texto de uma exceção do Apps Script. A peneira abaixo
     deixa passar recado de gente e barra vocabulário de máquina: quem cadastrou um
     cliente não precisa ler "TypeError" debaixo de "Atenção". */
  const AVISO_TECNICO = /(exception|error|typeError|referenceerror|undefined|null\b|\bat\s+\w+\.|stack|apps ?script|\.gs\b)/i;
  const avisos=(d.avisos||[]).filter(Boolean)
    .map(a=>String(a))
    .filter(a=>a.length<=200 && !AVISO_TECNICO.test(a));
  document.getElementById('modalBody').innerHTML=`
    <div class="ok-card">
      <div style="font-size:34px">✅</div>
      <h1>Cliente criado!</h1>
      <div class="big">${esc(d.id||'')}</div>
      <div style="color:var(--ink-2);font-size:14px;margin-top:4px">${esc(d.nome||'')}</div>
      <div class="ok-links">${links.join('')||'<span class="hint">Nenhuma planilha gerada (confira os produtos).</span>'}</div>
      ${avisos.length?`<div class="avisos"><b>Atenção:</b><br>${avisos.map(esc).join('<br>')}</div>`:''}
      <p class="hint">Cadastro gravado. Os contatos e e-mails de acesso do cliente são cadastrados à parte, em <b>Contatos</b>.</p>
      <div class="foot" style="margin-top:14px">
        <button class="btn btn--sec btn--pill" id="outro" type="button">Cadastrar outro</button>
        <button class="btn btn--pri btn--pill" id="verCad" type="button">Ver o cadastro de ${esc(d.id||'')}</button>
      </div>
    </div>`;
  PROX_ID='';
  const irVer=()=>{fecharModal();if(clientePorId(d.id))irPara(d.id);else carregar({expandir:d.id});};
  document.getElementById('verCad').addEventListener('click',irVer);
  document.getElementById('outro').addEventListener('click',()=>{carregar({silencioso:true});abrirModal();});
  /* já recarrega a lista por baixo, para o cliente novo estar lá quando fechar */
  carregar({expandir:d.id,silencioso:true});
}

/* ===================================================================
   Eventos
   =================================================================== */
document.addEventListener('click',e=>{
  const rt=e.target.closest('[data-retry]');
  if(rt){e.stopPropagation();rt.textContent='enviando…';rt.disabled=true;tentarDeNovo(rt.dataset.retry);return;}
  if(e.target.closest('#btn-limpar')){limparFiltros();return;}
  /* Liga/desliga o corte de pendência. É botão e não caixa de seleção: a
     pergunta tem duas respostas, e o estado ligado se anuncia no aria-pressed e
     no âmbar — a mesma língua do resto da régua. */
  if(e.target.closest('#f-pend')){F_PEND=!F_PEND;TETO=PASSO;redesenhar();return;}
  /* "mais 20" para quem está lendo, "todos" para quem vai usar Ctrl+F. */
  if(e.target.closest('.btn-mais')){TETO+=PASSO;desenharLista();return;}
  if(e.target.closest('.btn-todos')){TETO=CLIENTES.length;desenharLista();return;}
  /* Salvar agora. Fechar, × e clique no véu não estão aqui: quem cuida deles é
     a casca do b4u-modal.js, que precisa passar pelo aviso de "tem coisa por
     gravar" antes de deixar sair. */
  if(e.target.closest('#cadSalvar')){salvarAgoraCad();return;}
  const head=e.target.closest('.cli-head');
  if(head){const no=head.closest('.cli');if(no)abrirCadastro(no.dataset.id);return;}
  /* ORDENAR TÍTULOS AZ ZA — o gesto todo mora aqui. Coluna nova sempre começa em
     A→Z; a mesma coluna de novo inverte. É o ÚNICO caminho de ordenação da tela
     desde que o <select> "Ordenar por" saiu da régua, e ele vale igual no
     celular, onde o cabeçalho vira a tira que rola de lado.
     Escreve no MESMO estado de sempre (ORDEM/DIR, e daí o ?ord=/?dir=), então o
     F5 volta na mesma ordem. O `desenharLista()` do fim é quem sincroniza o
     endereço — e ele ordena o resultado dos filtros e da busca, nunca a lista
     desenhada, que é o que faz a ordem sobreviver aos dois. */
  const th=e.target.closest('[data-sort]');
  if(th){const k=th.dataset.sort;
    if(ORDEM===k)DIR=(DIR==='asc'?'desc':'asc');else{ORDEM=k;DIR='asc';}
    TETO=PASSO;                                // outra ordem, outro começo de lista
    normalizarOrdem();desenharLista();
      return;}   // desenharLista() sincroniza a URL

  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto);return;}
  if(e.target.closest('#btnNovo')){abrirModal();return;}
});
function anotar(el){
  const corpo=el.closest('.corpo');if(!corpo)return;
  const cli=clientePorId(corpo.dataset.id);if(!cli)return;
  const col=el.dataset.ecol;
  /* o destaque de campo em branco some assim que digita (e volta se apagar),
     na hora, sem esperar o salvamento */
  const fld=el.closest('.fld');
  if(fld&&fld.dataset.esperado==='1')fld.classList.toggle('emfalta',!String(el.value||'').trim());
  /* 'input' e 'change' disparam os dois no mesmo campo — não salva duas vezes à toa */
  if(cli.valores[col]===el.value&&!SUJOS.has(cli.id))return;
  cli.valores[col]=el.value;cli._bd=null;
  /* A coluna de produtos é travada e não deveria chegar aqui — mas a trava vem
     da planilha, e o dia em que ela sair a caixa de Produtos não pode continuar
     lendo a lista antiga desta cache. */
  if(COLS_LINHA.produtos&&col===COLS_LINHA.produtos){cli._pl=null;cli._pn=null;}
  if(COL.nome&&col===COL.nome){cli.nome=el.value;atualizarCabeca(cli.id);}
  /* mudou a situação: selo e faixa lateral acompanham na hora */
  if(COL.ativo&&col===COL.ativo){cli.ativo=el.value;atualizarCabeca(cli.id);}
  agendarSalvar(cli.id,col,el.tagName==='SELECT'||el.type==='date'?250:700);
}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.ecol)anotar(e.target);});
/* Os dois <select> abaixo só existem quando o b4u-filtro.js não carregou — com
   ele, quem responde é o `aoMudar` de cada caixa. */
document.addEventListener('change',e=>{
  if(e.target.id==='f-sit'){ FILTRO=e.target.value; TETO=PASSO; redesenhar(); return; }
  if(e.target.id==='f-prod-sel'){ F_PROD=e.target.value?[e.target.value]:[]; TETO=PASSO; redesenhar(); return; }
  if(e.target.dataset&&e.target.dataset.ecol)anotar(e.target);});
/* Atalhos de busca (C.4): "/" foca, Esc limpa. Com um modal aberto, Esc fecha o
   modal — e o atalho não atrapalha quem já está digitando noutro campo. */
/* Esc com modal aberto NÃO chega aqui: a casca do b4u-modal.js escuta na captura,
   fecha o modal de cima da pilha e corta a propagação — senão o mesmo Esc que
   fecha o cadastro limparia também a busca da lista por baixo. */
document.addEventListener('keydown',e=>{
  /* A linha da lista é um role="button": sem isto, Enter e Espaço não abririam o
     cadastro para quem navega por teclado — e a tela ficaria só para o mouse. */
  const linha=e.target&&e.target.closest&&e.target.closest('.cli-head');
  if(linha&&(e.key==='Enter'||e.key===' '||e.key==='Spacebar')){
    e.preventDefault();
    const no=linha.closest('.cli');if(no)abrirCadastro(no.dataset.id);
    return;
  }
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';TERMO='';TETO=PASSO;desenharLista();}
});

/* ===================================================================
   Carregar
   =================================================================== */
/* A ordem aqui é a da tela: primeiro o que responde (busca, cadastrar, contagem),
   depois o que refina (filtros e ordenação, recolhidos), depois os exemplos, e só
   então as fichas. Os 13 chips e os 3 cartões continuam existindo — deixaram de
   ser pedágio. */
function layout(){
  /* A régua tem TRÊS controles, e o dono disse quais: "Ativos (status), um filtro
     checkbox · Produtos, outro filtro checkbox · Com pendências um botão". Os
     dois primeiros saem daqui como marcador de posição e são trocados pelo
     `montarFiltros()`, porque quem os desenha depende de o b4u-filtro.js ter
     carregado. O "Ordenar por" que ficava aqui saiu: ordenar agora é clicar no
     título da coluna. */
  return `<div class="topo">
    <input class="busca campo-busca" id="busca" type="search" autocomplete="off" placeholder="Buscar por ID, nome, CNPJ, cidade…  ( / para focar)">
    <span id="cx-sit"></span>
    <span id="cx-prod"></span>
    <button type="button" class="filtro" id="f-pend" aria-pressed="false">Com pendências</button>
    <button type="button" class="btn-limpar" id="btn-limpar" title="Volta para a visão sem filtro, sem busca e na ordem de ID">Limpar</button>
    <button class="btn btn--pri btn--pill btn-novo" id="btnNovo" type="button">+ Novo cliente</button>
    <span class="resumo-lista" id="resumo-lista"></span>
  </div>
  <div class="dica" id="dica"></div>
  <div class="lista" id="lista"></div>`;
}
async function carregar(op){
  op=op||{};
  if(!op.silencioso)setSave('saving','Carregando…');
  try{
    const d=await jsonp(API_URL+'?tipo=registro_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro)throw new Error(d.erro);
    META=d;
    /* Quem está usando, para o botão da barra. ESTA ROTA AINDA NÃO MANDA O NOME:
       só `tipo=equipe` (colaborador) e `tipo=daily_equipe` trazem um `eu`, e o
       `?cod=` da URL é código de log, não nome — batizar o botão com ele seria
       inventar. Então o botão fica com o rótulo genérico "Minha conta" e o painel
       diz, sem rodeio, que não identificou quem está usando; o seletor de
       aparência, que é o motivo de o botão existir, funciona igual.
       A leitura de `d.eu` já está escrita: no dia em que `registro_equipe` passar a
       devolver `eu:{nome}` — o servidor já resolve o colaborador pela chave, em
       `exigirEquipe_` — o nome aparece aqui sem tocar nesta tela. */
    if(window.B4UShell) B4UShell.usuario({nome:(d.eu&&d.eu.nome)||''});
    COLUNAS=d.colunas||[];
    TRAVADAS=new Set((d.travadas||[]).map(norm));
    CLIENTES=(d.clientes||[]).map(c=>Object.assign({},c,{id:String(c.id||''),valores:c.valores||{}}));
    mapearColunas();
    calcularCompletude();
    CAMPOS_EDIT=montarCampos(COLUNAS,'edicao');
    if(op.expandir)ABERTOS.add(String(op.expandir));
    const busca=document.getElementById('busca');
    /* Na primeira carga a visão vem do endereço (C.10); nas recargas em segundo
       plano vale o que já está na tela. */
    const termoAtual=busca?busca.value:lerURL();
    document.getElementById('app').innerHTML=layout();
    const nb=document.getElementById('busca');
    nb.value=op.expandir?'':(termoAtual||'');
    TERMO=nb.value;
    nb.addEventListener('input',e=>{TERMO=e.target.value;TETO=PASSO;desenharLista();});
    /* A régua é montada DEPOIS de o #app ser repintado (os marcadores de posição
       acabaram de nascer) e ANTES do primeiro desenho da lista, que já lê o
       estado dos três controles. */
    montarFiltros();
    const pl=document.getElementById('plan');
    if(d.planilha_url){pl.href=d.planilha_url;pl.hidden=false;}
    redesenhar();
    if(!op.silencioso)setSave('','');
    /* A lista já está pintada: a barra corre até 100% e o overlay sai revelando a
       tela pronta, sem somar espera de verdade. Na recarga em segundo plano não há
       overlay nenhum, e a chamada simplesmente não faz nada. */
    if(window.B4UEspera)B4UEspera.concluir();
    abrirPeloEndereco();          // ?abrir=ID — ver o comentário na função
    if(op.expandir){irPara(String(op.expandir));}
    else if(!op.silencioso&&window.innerWidth>760)nb.focus();
  }catch(e){
    /* O texto da exceção continua sendo lido para separar falta de acesso de falha
       de carregamento, mas não vai mais para a tela: nome de arquivo do servidor,
       nome de aba de planilha e o parâmetro do endereço são vocabulário nosso. */
    const m=String((e&&e.message)||e);
    setSave('err','Não foi possível carregar.');
