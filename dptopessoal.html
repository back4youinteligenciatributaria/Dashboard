<!-- A fonte deixa de bloquear a primeira pintura: o esqueleto aparece antes dela. -->

<style>
/* B4U-DESIGN:INICIO — paleta, cantos e fonte que as 22 páginas dividem.
   Bloco copiado de b4u-design.css (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-design.js`.

   Entra ANTES do <style> da página de propósito — é a camada base. Se esta
   página precisar mesmo de um valor diferente, redeclare o token no `:root`
   dela, que vem depois e vence. */
:root{
  /* ── Superfícies ─────────────────────────────────────────────────────────
     `--canvas` é o bege do fundo da página; `--surface` é o branco do cartão
     que se apoia nele; `--surface-warm` é o branco quebrado das faixas e
     cabeçalhos de tabela, que separam sem precisar de borda. */
  --canvas:#F1E7DC;
  --surface:#FFFFFF;
  --surface-warm:#FBF6EF;

  /* ── Letra ───────────────────────────────────────────────────────────────
     `--ink` é o texto normal, `--ink-2` o secundário, `--muted` o rótulo.
     `--muted` já foi #8A7D70 e reprovava em contraste (3,28:1); #6E6256 dá
     4,85:1 no bege e 5,92:1 no branco, e é a cor de quase todo rótulo do
     sistema — por isso ela precisa passar, e não só quase. */
  --ink:#113D39;
  --ink-2:#3F5854;
  --muted:#6E6256;

  /* ── Traços ──────────────────────────────────────────────────────────────
     `--line` divide o que é do mesmo grupo; `--line-2` fecha o que é caixa. */
  --line:#E4D9C9;
  --line-2:#D6C3AC;

  /* ── Marca ───────────────────────────────────────────────────────────────
     `--brand-teal` é canônico em logo, foco, borda e série de gráfico. Como
     TEXTO ele reprova (4,11:1 no branco, 3,44:1 no receita-soft), e para isso
     existe o `--brand-teal-txt`: o mesmo teal escurecido, 5,54:1 no branco e
     4,54:1 no bege, usado só onde é letra ou fundo de letra. Os dois são a
     mesma cor com dois trabalhos. O 4,54:1 passa, mas passa RASPANDO: quem for
     escurecer o `--canvas` um dia tem de conferir este par antes. */
  --brand-dark:#073034;
  --brand-teal:#0F8C85;
  --brand-euc:#3FA680;
  --brand-teal-txt:#0C756F;

  /* ── SINAL: as quatro cores que querem dizer alguma coisa ────────────────
     Estas quatro NÃO seguem o tema (ver OS QUATRO TEMAS, no fim do arquivo). Se
     "vencido" mudasse de vermelho conforme a pele escolhida, a cor deixaria de
     ser informação e viraria decoração — e quem trabalha nesta tela o dia
     inteiro lê a cor antes de ler a palavra.

     `--amber` tem 2,61:1 no branco: serve de PREENCHIMENTO e de borda, nunca de
     letra. Para letra âmbar existe o `--amber-txt` (5,91:1 no branco).

     ┌── PENDÊNCIA CONHECIDA: `--verde` E `--vermelho` REPROVAM COMO LETRA ────┐
     │                                                                        │
     │ Os dois NÃO têm o par `-txt` que o âmbar tem, e são usados nas duas     │
     │ funções ao mesmo tempo:                                                │
     │                                                                        │
     │     --verde     12 usos como `color`, 11 como `background`, 7 em borda │
     │     --vermelho  41 usos como `color`, 31 como `background`, 41 em borda │
     │                                                                        │
     │ E o lado TEXTO reprova. Medido nos valores atuais:                     │
     │                                                                        │
     │     --verde     #2E9D5F   2,82:1 no bege · 3,44:1 no branco   REPROVA  │
     │     --vermelho  #C0392B   4,46:1 no bege · 5,43:1 no branco   raspando │
     │                                                                        │
     │ O mínimo para texto é 4,5:1. É a mesma falha do `--muted` antigo (que   │
     │ dava 3,28:1), e atinge `.hint.ok` e `.lk.ok`, que são letra e nada      │
     │ mais. Há prova de que alguém já tinha esbarrado nisso sem nomear: o     │
     │ `.det-fbtn.ativo` escreve `color:#0E5B37` à mão — um verde bem mais     │
     │ escuro — em vez de usar o token.                                       │
     │                                                                        │
     │ CONSERTO MEDIDO E NÃO APLICADO (decisão de 10/08/2026):                 │
     │                                                                        │
     │     --verde     #2E9D5F -> #1F7546   (2,82:1 -> 4,66:1 no bege)        │
     │     --vermelho  #C0392B -> #BB3728   (4,46:1 -> 4,66:1 no bege)        │
     │                                                                        │
     │ Matiz e saturação ficam onde estão; só a luminosidade desce, o mínimo   │
     │ para passar com folga. Escurecer é seguro pelo lado do FUNDO: TODAS as  │
     │ regras `background:var(--verde)` / `background:var(--vermelho)` já vêm  │
     │ com `color:#fff` (ou são faixa/pontinho sem texto), e fundo mais escuro │
     │ com letra branca só melhora.                                           │
     │                                                                        │
     │ POR QUE NÃO FOI APLICADO AGORA: mexer nestes dois repinta as 22         │
     │ páginas, inclusive as 8 do cliente. A rodada que centralizou os tokens  │
     │ era de ESTRUTURA — nenhum pixel de cor mudou nela de propósito, para    │
     │ que qualquer diferença que aparecesse em produção tivesse uma causa só. │
     │ Trocar cor é decisão de produto e vai junto da varredura do MODO        │
     │ ESCURO, que já vai ter de abrir os 22 arquivos.                         │
     │                                                                        │
     │ QUANDO FOR FAZER, olhe também o `--verde-2`: várias páginas o declaram  │
     │ valendo #25804C, com a nota "o verde um degrau mais escuro, para virar  │
     │ FUNDO de texto branco". Com o conserto acima, o `--verde` do núcleo     │
     │ fica MAIS ESCURO que o `--verde-2`, e a convenção do sufixo -2 se       │
     │ inverte nesse par. Não dá para resolver daqui: o `--verde-2` mora no    │
     │ `:root` de cada página.                                                │
     └────────────────────────────────────────────────────────────────────────┘

     (Escrito assim, sem dois-pontos colado no nome, de propósito: a
     `tokensCanonicos()` do `_aplica-design.js` varre este bloco com um regex de
     declaração e NÃO pula comentário. Nome de token seguido de dois-pontos aqui
     dentro vira token canônico de mentira, e o `--verde-2` de mentira faria as
     22 páginas aparecerem como "exceção mantida" no terminal. Vale para todo
     comentário deste arquivo: cite o token, nunca o escreva como declaração.) */
  --amber:#E8892E;
  --amber-txt:#8A5A10;
  --vermelho:#C0392B;
  --verde:#2E9D5F;

  /* ── Cantos ──────────────────────────────────────────────────────────────
     Uma escala só, no site inteiro, e mais QUADRADA que redonda.
       4px  campo, selo, célula
       6px  cartão, linha da lista, botão
       8px  bloco grande e modal
     `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é citado
     em mais de cem regras, mas o valor acompanha o resto — pílula virou
     etiqueta. Círculo de verdade (avatar, contador, spinner) continua com
     `border-radius:50%` escrito na regra e não passa por aqui. */
  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-pill:6px;

  /* ── Escala tipográfica ──────────────────────────────────────────────────
     Seis degraus, e o pulo entre eles é de propósito irregular: 11-12-13 é a
     faixa de rótulo, selo e nota de rodapé, onde 1px já muda a hierarquia; 15 é
     o corpo; 19 e 24 são título de bloco e de tela. Um degrau constante (1,2×,
     por exemplo) daria 11-13-16-19-23-28 e gastaria três tamanhos na faixa em
     que o olho não distingue nada.
     ATENÇÃO: o `body{font-size:15px}` das páginas está escrito à mão e NÃO sai
     daqui. Quem mexer na escala não muda o corpo do texto; muda só quem usa
     `var(--fs-N)` — que é rótulo, selo, cabeçalho de tabela e título. */
  --fs-1:11px;
  --fs-2:12px;
  --fs-3:13px;
  --fs-4:15px;
  --fs-5:19px;
  --fs-6:24px;

  /* ── Fonte ───────────────────────────────────────────────────────────────
     Montserrat vem do Google Fonts, declarado no <head> de cada página. O
     `system-ui` é o que aparece enquanto ela não chega — e é o que fica se ela
     não chegar nunca. */
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
/* B4U-DESIGN:FIM */
</style>
<style>
:root{
/* Cantos: uma escala só, no site inteiro, e mais QUADRADA que redonda.
     4px  campo, selo, célula
     6px  cartão, linha da lista, botão
     8px  bloco grande e modal
   `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é
   citado em mais de cem regras, mas o valor agora acompanha o resto —
   pílula virou etiqueta. Círculo de verdade (avatar, contador, spinner)
   continua com border-radius:50% escrito na regra, e não passa por aqui. */
  --receita:var(--brand-teal); --receita-soft:#DBEFEC;
  /* #A7715D pinta ponto e preenchimento; como TEXTO sobre o creme ele dá 3,20:1.
     O --andamento-txt é o mesmo tom escurecido só para letra: 5,26:1. Mesmo par e
     mesma correção do --sinal/--sinal-txt do fiscal e do guias. */
  --andamento:#A7715D; --andamento-soft:#F1E1D8; --andamento-txt:#8A4B33;
  --aguardando:var(--muted); --aguardando-soft:#EDE7DD;
  /* Escala de padding — três degraus no lugar dos valores avulsos que havia aqui. */
  --pad-sm: 14px 16px;
  --pad:    18px 20px;
  --pad-lg: 24px 26px;
  --lift:   0 8px 20px rgba(17,61,57,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:var(--fs-4);line-height:1.55;-webkit-font-smoothing:antialiased}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:var(--radius-sm)}
/* Campo com menos de 16px faz o Safari ampliar a página inteira ao focar. Só os campos. */
input,select,textarea{font-size:16px}
/* Uma amostra de cor só — antes cada lugar tinha o seu tamanho. */
.sw{width:10px;height:10px;border-radius:var(--radius-sm);flex-shrink:0;display:inline-block}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}

header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:var(--b4u-bar-h,0px);z-index:30}
.bar{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:var(--fs-5);letter-spacing:-.02em;line-height:1}
.logo .b{color:var(--brand-dark)} .logo .y{color:var(--brand-teal)}
/* Razão social + CNPJ é o que confirma "esta é a minha empresa": 15px em teal
   puro dá 4,11:1. Escurecido, 5,54:1. */
.brand-sub{font-size:var(--fs-4);color:var(--brand-teal-txt);font-weight:700;margin-top:2px}
.voltar{display:inline-block;font-size:var(--fs-1);font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:4px}
.voltar:hover{color:var(--brand-teal-txt)}
.spacer{flex:1}
/* 11px sobre o verde claro: teal puro dá 3,44:1. Escurecido, 4,64:1. */
.badge-topo{font-size:var(--fs-1);font-weight:700;color:var(--brand-teal-txt);background:var(--receita-soft);padding:5px 12px;border-radius:var(--radius-pill)}
.picker{display:flex;align-items:center;gap:8px}
.picker .lbl{font-size:var(--fs-1);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.picker select{
  font-family:var(--sans);font-weight:600;color:var(--ink);min-height:44px;
  border:1px solid var(--line-2);border-radius:var(--radius-pill);padding:7px 14px;background:var(--surface);cursor:pointer;
}

.busca{margin:28px 0 24px}
.busca input{
  width:100%;font-family:var(--sans);padding:12px 16px;border-radius:var(--radius-pill);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
}
.busca input::placeholder{color:var(--muted)}
.busca input:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
/* retorno da busca: quantos resultados, para quê, e como limpar */
.busca-info{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:11px 6px 0;font-size:var(--fs-2);color:var(--muted)}
.busca-info.on{display:flex}
.busca-info b{color:var(--ink);font-weight:700}
.busca-limpar{background:none;border:0;padding:0;font-family:inherit;font-size:var(--fs-2);font-weight:700;
  color:var(--brand-teal-txt);cursor:pointer;text-decoration:underline}
.busca-vazio{display:none;margin:14px 0 0;padding:22px 20px;text-align:center;background:var(--surface);
  border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--muted);font-size:var(--fs-3)}
.busca-vazio.on{display:block}
.busca-vazio b{color:var(--ink);font-weight:700}
.busca-dica{display:block;margin-top:6px;font-size:var(--fs-2)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:30px 0 14px}
/* Título de seção e texto corrido tinham os mesmos 15px: não havia hierarquia. */
.sec-head h2{font-size:var(--fs-5);font-weight:700;letter-spacing:-.01em}
.sec-head p{font-size:var(--fs-3);color:var(--muted)}

/* ════════ Topo: quanto custa a folha deste mês ════════
   O primeiro bloco da página tem de responder "quanto?" — antes ele dizia só a
   competência e o número de funcionários, e o valor aparecia na terceira seção. */
.heroi{margin:22px 0 0;padding:var(--pad-lg);border:none;border-radius:var(--radius-lg);color:#fff;
  /* O gradiente da marca clareia no canto de baixo: medido a 390px, o branco cai para
     4,38:1 justamente na última linha. O véu escuro devolve o contraste sem trocar a cor. */
  background:linear-gradient(180deg,rgba(7,48,52,0) 45%,rgba(7,48,52,.22) 100%),
             linear-gradient(124deg,var(--brand-dark) 0%,var(--brand-teal) 100%);
  box-shadow:0 18px 38px -18px rgba(6,48,51,.6)}
/* 11px maiúsculo sobre o lado claro do gradiente não pode ser branco a 82% (3,7:1). */
.heroi .lbl{font-size:var(--fs-1);letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:#fff}
.heroi-v{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1.04;margin-top:8px;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media(min-width:720px){.heroi-v{font-size:56px}}
@media(max-width:420px){.heroi-v{font-size:34px}}
.heroi-v .quando{font-size:var(--fs-5);font-weight:700;letter-spacing:-.01em}
/* branco a 90% sobre o lado claro do gradiente dá 4,24:1 a 390px — texto corrido
   de 15px precisa de 4,5. Branco cheio; a hierarquia fica no <b>, não na opacidade.
   Sem font-weight: o link do Montserrat não traz o 500 e o navegador sintetizava
   o peso, engrossando o traço na marra. Mesmo peso do contábil e da equiparação. */
.heroi-sub{font-size:var(--fs-4);color:#fff;margin-top:10px;line-height:1.5;max-width:54ch}
.heroi-sub b{color:#fff;font-weight:800}
.heroi-pe{font-size:var(--fs-3);color:#fff;font-weight:600;margin-top:14px;max-width:60ch}

/* Tarja de cache: o que está na tela é do último acesso e já está sendo atualizado. */
.tarja-atualizando{font-size:var(--fs-2);font-weight:600;color:var(--brand-dark);
  background:var(--receita-soft);border-radius:var(--radius-pill);padding:6px 14px;margin:14px 0 0;
  display:inline-flex;align-items:center;gap:8px}
.tarja-atualizando.falhou{background:#FCEFE0;color:#8A5A10}

.caixinhas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.caixinha{padding:var(--pad);display:flex;flex-direction:column;gap:8px}
.caixinha h4{font-size:var(--fs-3);font-weight:700}
.caixinha textarea{
  width:100%;min-height:84px;font-family:var(--sans);color:var(--ink);
  border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:9px 11px;background:var(--surface-warm);resize:vertical;
}
.caixinha textarea:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.caixinha .status{font-size:var(--fs-1);color:var(--muted);min-height:14px}
.caixinha .status.salvando{color:var(--andamento-txt)}
.caixinha .status.salvo{color:var(--brand-teal-txt);font-weight:600}
.caixinha .status.erro{color:#8B2E22;font-weight:600}

.processo-card{padding:var(--pad);margin-bottom:14px}
.processo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.processo-head h3{font-size:var(--fs-4);font-weight:700}
.status-chip{font-size:var(--fs-1);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-sm);white-space:nowrap}
.status-concluido{background:var(--receita-soft);color:var(--brand-teal-txt)}
.status-andamento{background:var(--andamento-soft);color:var(--andamento-txt)}
.status-vencida{background:#F3DEDB;color:#8B2E22}
.status-gozada{background:var(--receita-soft);color:var(--brand-teal-txt)}
.status-aVencer,.status-avencer{background:var(--andamento-soft);color:var(--andamento-txt)}

.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.etapa{position:relative;padding-bottom:16px}
.etapa:last-child{padding-bottom:0}
.etapa::before{content:'';position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--aguardando);border:2px solid var(--surface)}
.etapa.concluido::before{background:var(--receita)}
.etapa.andamento::before{background:var(--andamento);box-shadow:0 0 0 3px var(--andamento-soft)}
.etapa-nome{font-size:var(--fs-3);font-weight:600}
.etapa-meta{font-size:var(--fs-2);color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.etapa-status{font-size:var(--fs-1);font-weight:700;padding:1px 7px;border-radius:var(--radius-sm)}
.etapa-status.concluido{background:var(--receita-soft);color:var(--brand-teal-txt)}
.etapa-status.andamento{background:var(--andamento-soft);color:var(--andamento-txt)}
.etapa-status.aguardando{background:var(--aguardando-soft);color:var(--aguardando)}

.lista{padding:8px 24px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .nome{font-size:var(--fs-3);font-weight:600}
.item .cat{font-size:var(--fs-1);color:var(--muted);margin-top:2px}
.item a{font-size:var(--fs-2);font-weight:700;color:var(--brand-teal-txt);text-decoration:none;white-space:nowrap}
.item a:hover{color:var(--brand-dark)}
.item .em-breve{font-size:var(--fs-1);font-weight:600;color:var(--muted);white-space:nowrap}

.grupo-cat{border-top:1px solid var(--line)}
.grupo-cat:first-child{border-top:none}
.grupo-cat-btn{
  width:100%;display:flex;align-items:center;gap:10px;padding:14px 0;
  background:none;border:none;cursor:pointer;font-family:var(--sans);color:var(--ink);text-align:left;
}
.grupo-cat-nome{font-size:var(--fs-4);font-weight:700;flex:1}
.grupo-cat-conta{font-size:var(--fs-1);font-weight:700;color:var(--muted);background:var(--surface-warm);border-radius:var(--radius-sm);padding:2px 9px}
.grupo-cat-btn .seta{color:var(--muted);font-size:var(--fs-3);transition:transform .2s}
.grupo-cat-body{padding:0 0 10px 4px}
.grupo-cat-body .item{padding:10px 0 10px 10px;border-top:1px solid var(--line)}
.grupo-cat-body .item:first-child{border-top:none}
.venc{display:inline-block;font-size:var(--fs-1);font-weight:600;margin-top:3px}
.venc.venc-ok{color:var(--muted)}
.venc.venc-atencao{color:var(--andamento-txt)}
.venc.venc-vencido{color:#8B2E22;font-weight:700}

table.func{width:100%;border-collapse:collapse;font-size:var(--fs-3)}

<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a
   célula tem ponto e barra, o Sheets desiste e guarda texto.
   Onde não existe máscara canônica (telefone, inscrição), o valor vai como foi
   digitado: o conserto ali depende do patch do backend. */
function b4uParaPlanilha(valor,coluna){
  const s=b4uTexto(valor).trim();
  const t=b4uIdent(coluna);
  if(!s||!t||!/^\d+$/.test(s))return s;
  const d=b4uDigitos(s);
  if((t.tipo==='doc'||t.tipo==='cnpj')&&d.length===14)return b4uFmtDoc(d);
  if((t.tipo==='doc'||t.tipo==='cpf')&&d.length===11)return b4uFmtDoc(d);
  if(t.tipo==='cep'&&d.length===8)return b4uFmtCep(d);
  return s;
}
/* B4U-TEXTO:FIM */
</script>

  // ---- Puxar para atualizar (mobile) --------------------------------------
  // Só age quando a página está no topo e o gesto é para baixo; recarrega ao soltar

  (function(){

    /* Com uma folha aberta o gesto não é "atualizar", é rolar o que está dentro dela.

       porque ele tem FORMULÁRIO (os contatos): puxar para baixo com a folha aberta

    function folhaAberta(){

             !!(window.B4UCliente && window.B4UCliente.aberto && window.B4UCliente.aberto());
    }
    window.addEventListener('touchstart',function(e){
      if(e.touches.length!==1 || !topo() || folhaAberta()){ y0=null; return; }

    },{passive:true});

  </div>

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
const TIPO = 'pessoal';
const TITULO_PAGINA = 'Departamento Pessoal';
const CATEGORIA_MODELOS = 'Departamento Pessoal';

const CAIXINHAS = [
  {campo:'controle_ponto',   titulo:'Controle de ponto ou confirmação de jornada'},
  {campo:'faltas_atrasos',   titulo:'Faltas, atrasos ou afastamentos'},
  {campo:'vales_beneficios', titulo:'Vales e benefícios já pagos referentes ao mês atual'},
  {campo:'horas_extras',     titulo:'Horas extras, adicionais e bônus'},
  {campo:'outros',           titulo:'Outros'},
];

function normTxt(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Atalhos de teclado: "/" foca a busca, "Esc" limpa. Fica quieto quando a pessoa
   já está digitando em outro campo (input, textarea, select ou área editável). */
const ATALHOS_LIGADOS = {};
function atalhosDeBusca(idCampo, aoLimpar, aoFocar){
  if(ATALHOS_LIGADOS[idCampo]) return;            // não empilhar listeners em re-render
  ATALHOS_LIGADOS[idCampo] = true;
  document.addEventListener('keydown', ev=>{
    const campo = document.getElementById(idCampo); if(!campo) return;
    const alvo = ev.target, tag = (alvo && alvo.tagName || '').toLowerCase();
    const digitando = tag==='input' || tag==='textarea' || tag==='select' || (alvo && alvo.isContentEditable);
    if(ev.key==='/' && !digitando && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
      ev.preventDefault();
      if(aoFocar) aoFocar();                      // abre o painel de filtros, se houver
      const det = campo.closest && campo.closest('details');
      if(det && !det.open) det.open = true;       // e o bloco recolhido que a contém
      campo.focus(); campo.select && campo.select(); return;
    }
    if(ev.key==='Escape' && (alvo===campo || (!digitando && campo.value))){
      if(!campo.value){ campo.blur(); return; }
      campo.value=''; if(aoLimpar) aoLimpar();
    }
  });
}

function getIdCodigo(){
  const qs = new URLSearchParams(location.search);
  let id = qs.get('id') || '';
  let codigo = qs.get('codigo') || '';
  if (!id){
    const h = location.hash.replace('#','').trim();
    const comCodigo = h.match(/^(\d+)-(.+)$/);
    const soId = h.match(/^(\d+)$/);
    if (comCodigo) { id = comCodigo[1]; codigo = comCodigo[2]; }
    else if (soId) { id = soId[1]; }
  }
  return { id: id.replace(/\D/g,''), codigo: codigo.trim() };
}

/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Vazia de propósito: ela existia só para escrever frases de espera na tela. Quem
   mostra (e troca) o que aparece durante a espera agora é o b4u-espera.js. A função
   continua aqui porque é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){
  return new Promise((ok,fail)=>{
    const cb = 'cb_'+Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(()=>{ limpa(); fail(new Error('A API não respondeu.')); }, JSONP_TETO);
    function limpa(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { limpa(); ok(d); };
    s.onerror = () => { limpa(); fail(new Error('Não consegui alcançar a API.')); };
    s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
    document.body.appendChild(s);
  });
}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela de
   espera segue correndo por cima, sem anunciar a segunda tentativa: avisar que "ainda
   estamos buscando" no meio da espera assusta e faz recarregar justamente quando a
   resposta já vinha. Erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}

let IDENTIDADE = { id: '', codigo: '' };

async function carregarTipo(tipo){
  const { id, codigo } = IDENTIDADE;
  if (API_URL){
    // Só a nossa categoria de modelos: a rota filtra no servidor (se ignorar o
    // parâmetro, vem tudo e o filtro daqui continua valendo — nada quebra).
    const cat = tipo === 'modelos' ? '&categoria=' + encodeURIComponent(CATEGORIA_MODELOS) : '';
    const url = API_URL + '?id=' + encodeURIComponent(id) + '&codigo=' + encodeURIComponent(codigo) + '&tipo=' + tipo + cat;
    const d = await jsonp(url);
    if (d.erro) throw new Error(d.erro);
    return d;
  }
  const arq = tipo === 'modelos' ? 'demo_modelos.json' : `demo_${TIPO}.json`;
  const r = await fetch(arq);
  if (!r.ok) throw new Error(`Sem API configurada e sem ${arq} ao lado deste arquivo.`);
  return r.json();
}

/* Aceita AAAA-MM-DD, AAAA-MM-DD HH:MM:SS e dd/mm/aaaa. Devolve [ano,mes,dia] (strings) ou null. */
function partesData(v){
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);   // ISO, com ou sem hora
  if (m) return [m[1], m[2], m[3]];
  m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);      // dd/mm/aaaa
  if (m) return [m[3], m[2], m[1]];
  return null;
}

function dBR(iso){
  const p = partesData(iso);
  return p ? `${p[2]}/${p[1]}/${p[0]}` : '';
}

function brl(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

function classeStatus(status){
  const n = normTxt(status);
  if (n.includes('conclu')) return 'concluido';
  if (n.includes('andament')) return 'andamento';
  return 'aguardando';
}

function classeStatusFerias(status){
  const n = normTxt(status);
  if (n.includes('venc') && !n.includes('avenc')) return 'vencida';
  if (n.includes('goz')) return 'gozada';
  return 'aVencer';
}

function mesAtualISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesLongo = c => { const [a,m]=c.split('-'); return MESES[+m-1]+' '+a; };
/* "jun 2026" é etiqueta de sistema. Para falar com o dono da empresa o mês vai por
   extenso — é assim que ele diz em voz alta ("a folha de junho"). */
const MESES_EXT = ['janeiro','fevereiro','março','abril','maio','junho','julho',
                   'agosto','setembro','outubro','novembro','dezembro'];
const mesNome   = c => MESES_EXT[+String(c).split('-')[1]-1] || '';
const mesExtenso= c => { const [a,m]=String(c).split('-'); return (MESES_EXT[+m-1]||'') + ' de ' + a; };

/** Janela rolante de competências pra escolher no seletor: 12 meses pra trás e
    2 pra frente a partir de hoje — cobre histórico de folha e permite editar
    as caixinhas de meses futuros também, se for o caso. */
function janelaCompetencias(){
  const hoje = new Date();
  const lista = [];
  for (let i=-12;i<=2;i++){
    const d = new Date(hoje.getFullYear(), hoje.getMonth()+i, 1);
    lista.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  return lista;
}

let DADOS_ATUAIS = null;

/* Mapa de áreas que o cliente tem, na MESMA fonte que a barra do topo usa
   (b4u_disp_<id>, gravado só pela home): o menu lateral não pode oferecer uma porta
   que ele não consegue abrir. Sem o registro — primeira visita, antes de a home
   responder — devolve null, e aí o menu mostra tudo, que é o comportamento de hoje.
   As três linhas estão duplicadas de propósito: a `disponiveisSalvos()` do bloco
   compartilhado vive dentro de um IIFE e o window.B4U não a exporta. */
function areasContratadas(id){
  try{ const o=JSON.parse(localStorage.getItem('b4u_disp_'+id)||'null');
       return (o && (o.disponiveis||o)) || null; }catch(e){ return null; }
}

/* Menu lateral: navegação ENTRE páginas, e só isso. Ele NÃO substitui o <header>
   desta página — o #comp da Competência continua morando lá dentro, porque é a única
   forma de mudar o mês da folha e das 5 caixinhas de autosave, e trocar de mês passa
   por salvarPendentes() antes de redesenhar.
   Montamos de dentro do render() porque a razão social só existe depois do payload.
   O caminho do cache chama render() duas vezes: o módulo ignora a segunda montagem de
   propósito, e a guarda abaixo evita repetir o resto do trabalho. */
function montarMenu(M){
  /* O painel "meus dados" (o botão com o nome, na barra) mostra a empresa aberta.
     A razão social e o CNPJ só existem depois do payload desta página — o bloco
     compartilhado já semeou o painel com o que estava guardado no aparelho, e aqui
     entregamos a versão fresca. Fica ANTES da guarda do menu de propósito: o painel
     não depende do b4u-shell.js ter carregado. */
  if (window.B4UCliente) B4UCliente.atualizar({ empresa: (M && M.config) || null });
  if(!window.B4UShell || B4UShell.montado()) return;
  const cfg = (M && M.config) || {};
  const nome = cfg.razao_social || '';
  const cnpj = cfg.cnpj ? 'CNPJ ' + b4uIdentHTML(cfg.cnpj,'CNPJ') : ((M && M.id) ? 'cliente ' + esc(b4uTexto(M.id)) : '');
  // O href do WhatsApp vem do bloco compartilhado, que o publica em `window.B4U_WA`
  // — o número continua tendo um dono só. Antes líamos o `href` do botão verde da
  // barra, e o botão verde saiu de lá (virou item do painel "meus dados"): sem esta
  // troca o `wa` chega vazio e o rodapé "Falar com a gente" do menu lateral não é
  // desenhado — o WhatsApp sumiria do painel inteiro. O DOM fica de reserva, para
  // quando o b4u-cliente.js não carregar e o botão verde voltar para a barra.
  const waEl = document.querySelector('.b4u-bar .b4u-btn.wa');
  const wa = (typeof window.B4U_WA === 'string' && window.B4U_WA) || (waEl ? waEl.getAttribute('href') : '');
  B4UShell.montar({
    perfil:'cliente',
    ativo:'pessoal',
    // Sem nome não inventamos um: o bloco de contexto simplesmente não aparece.
    contexto: nome ? { rot:'Empresa', nome:esc(nome), sub:cnpj } : null,
    // A identidade viaja como hash, como no resto da página: o #id-codigo é a
    // credencial da sessão e vem depois de qualquer query, nunca antes.
    link:function(pag){
      return pag + (IDENTIDADE.id ? '#'+IDENTIDADE.id+(IDENTIDADE.codigo?'-'+IDENTIDADE.codigo:'') : '');
    },
    disp: areasContratadas(IDENTIDADE.id),
    wa: wa || null
  });
  /* A barra do topo perde o logo e os atalhos (agora quem os diz é o menu) e ganha o
     botão da gaveta — em tela estreita ela deixa de quebrar em duas linhas. Quem
     publica a altura em --b4u-bar-h é o medirBarra(), que só escuta resize e load:
     sem este aviso o <header> continuaria grudando na altura antiga e abriria um vão. */
  try{ window.dispatchEvent(new Event('resize')); }catch(e){}
}

  try{ const salvo=localStorage.getItem('b4u_dp_comp_'+M.id); if(salvo && janela.includes(salvo)) compInicial=salvo; }catch(e){}  // lembrar onde parou

  app.appendChild(el(`

    <div class="card folha-mes" id="folha-mes"></div>

  appendAll(wrap, `
    <div class="sec-head"><div><h2>O que acontece todo mês (e quem faz)</h2><p>Você só precisa se preocupar com as linhas marcadas “você”.</p></div></div>

  appendAll(wrap, `

  appendAll(wrap, `

  desenharFerias(M.ferias || []);
  desenharDocumentos(M.documentos || []);
  desenharModelos(modelos);
  desenharSolicitacoes();
  desenharObrigacoesDP(M);

  memorizarSecoes();
  document.getElementById('busca').addEventListener('input', e => filtrar(e.target.value));
  atalhosDeBusca('busca', () => filtrar(''));
  document.getElementById('comp').addEventListener('change', e => {

/* O que acontece todo mês — e QUEM faz.
   Antes isto era uma lista de siglas (eSocial, DCTFWeb, DIRF) explicadas com outras
   expressões técnicas ("eventos periódicos", "competência anterior"), e nenhuma
   dizia se ele paga, assina ou só fica sabendo. Agora a linha começa pela AÇÃO e
   traz o responsável escrito — o cliente lê só as marcadas "você". A sigla, quando
   sobrevive, vira nota de rodapé para quem já conhece o nome. */
const OBRIGACOES_DP = [
  {acao:'Você paga os salários',            prazo:'até o 5º dia útil',  quem:'voce'},
  {acao:'Nós enviamos a sua folha ao governo', prazo:'dia 15',          quem:'nos', nota:'sistema eSocial'},
  {acao:'Você paga o FGTS da equipe',       prazo:'dia 20',             quem:'voce', nota:'guia na Agenda de pagamentos'},
  {acao:'Você paga o INSS da equipe',       prazo:'dia 20',             quem:'voce'},
  {acao:'Nós entregamos os informes de rendimento dos seus funcionários', prazo:'fevereiro', quem:'nos'},
  {acao:'Você paga a 1ª parcela do 13º',    prazo:'até 30/11',          quem:'voce'}
];
function desenharObrigacoesDP(M){
  const box=document.getElementById('obrigacoes-dp'); if(!box) return;
  const linha = o => `<div class="obr-item">
      <div class="obr-info">
        <div class="obr-nome">${esc(o.acao)}</div>
        <div class="obr-obs">${esc(o.prazo)}${o.nota?' · '+esc(o.nota):''}</div>
      </div>
      <span class="obr-tag ${o.quem==='voce'?'voce':'nos'}">${o.quem==='voce'?'você':'back4you'}</span>
    </div>`;
  // Datas próprias deste cliente (aba que o colaborador edita), quando existirem:
  // aqui não dá para afirmar de quem é a vez, então a etiqueta continua neutra.
  const doCliente = (M.obrigacoes||[]).filter(o=>o && o.nome).map(o=>{
    const p = o.data ? partesData(o.data) : null;
    return `<div class="obr-item">
      <div class="obr-info">
        <div class="obr-nome">${esc(o.nome)}</div>
        <div class="obr-obs">${p?dBR(o.data):''}${o.obs?(p?' · ':'')+esc(o.obs):''}</div>
      </div>
      <span class="obr-tag cli">da sua empresa</span>
    </div>`;
  }).join('');
  /* O calendário fixo é igual todo mês e para todo cliente: é informativo, e eram
     seis linhas empurrando a página para baixo. Recolhe, e o rótulo já diz quantas
     são com ele — a conta não pode ficar atrás de um clique. O que tem data DESTA
     empresa continua à vista: prazo com data é justamente o que nunca recolhe. */
  const nVoce = OBRIGACOES_DP.filter(o=>o.quem==='voce').length;
  box.innerHTML = `<div class="card" style="padding:8px 20px">
    ${doCliente}
    <div class="${doCliente?'dropdown-sec':''}">
      <button class="dropdown-btn" id="btn-obrig" aria-expanded="false">
        <span class="nome">Ver o calendário de todo mês — ${nVoce} ${nVoce===1?'linha é':'linhas são'} com você</span>
        <span class="conta">${OBRIGACOES_DP.length}</span>
        <span class="seta">▾</span>
      </button>
      <div class="dropdown-body" id="body-obrig">${OBRIGACOES_DP.map(linha).join('')}</div>
    </div>
  </div>`;
  const btn = document.getElementById('btn-obrig');
  if (btn) btn.addEventListener('click', () => {
    const body = document.getElementById('body-obrig');
    const abrir = body.style.display !== 'block';
    body.style.display = abrir ? 'block' : 'none';
    btn.setAttribute('aria-expanded', abrir);
    btn.querySelector('.seta').style.transform = abrir ? 'rotate(180deg)' : '';
  });
}

/** Tudo que muda com a competência selecionada: folha do mês, desligamentos
    daquele mês e as 5 caixinhas (que carregam/salvam nessa competência). */
function desenharMes(M, comp){
  const folhaMes = (M.folha||[]).filter(f=>f.competencia===comp);
  const totalBruto = folhaMes.reduce((s,f)=>s+Number(f.salario_bruto||0),0);
  const totalLiquido = folhaMes.reduce((s,f)=>s+Number(f.salario_liquido||0),0);
  const totalDescontos = folhaMes.reduce((s,f)=>s+Number(f.descontos||0),0);

  /* Herói: quanto custa a folha deste mês, em reais, antes de qualquer tabela. */
  const lbl = document.getElementById('heroi-lbl');
  const hv  = document.getElementById('heroi-v');
  const hs  = document.getElementById('heroi-sub');
  const hp  = document.getElementById('heroi-pe');
  if (lbl) lbl.textContent = 'Sua folha de ' + mesExtenso(comp);
  if (hv && hs && hp){
    if (folhaMes.length){
      hv.innerHTML = `${esc(brl(totalBruto))} <span class="quando">em salários</span>`;
      hs.innerHTML = `${folhaMes.length} ${folhaMes.length===1?'pessoa':'pessoas'} · <b>${esc(brl(totalLiquido))}</b> líquido a pagar · ${esc(brl(totalDescontos))} de descontos`;
      hp.textContent = 'Folha calculada. Se faltou alguma hora extra, falta ou vale, avise abaixo\u00A0↓';
    } else {
      // Nada de "sem lançamento": o vazio aqui é a nossa fila, não uma pendência dele.
      hv.innerHTML = `<span class="quando">Ainda não fechamos a folha de ${esc(mesNome(comp))}</span>`;
      hs.textContent = 'Normalmente fica pronta até o dia 5. Nada travado do seu lado.';
      hp.textContent = 'Se faltou alguma hora extra, falta ou vale, avise abaixo\u00A0↓';
    }
  }
  const cxt = document.getElementById('cx-titulo');
  if (cxt) cxt.textContent = `O que aconteceu com a sua equipe em ${mesNome(comp)}?`;

  document.getElementById('folha-mes').innerHTML = folhaMes.length ? `
    <div class="folha-mes-resumo">
      <div class="bloco"><span class="lbl">Funcionários na folha</span><div class="v">${folhaMes.length}</div></div>
      <div class="bloco"><span class="lbl">Total bruto</span><div class="v">${brl(totalBruto)}</div></div>
      <div class="bloco"><span class="lbl">Total líquido</span><div class="v">${brl(totalLiquido)}</div></div>
    </div>
    <div class="table-scroll"><table class="func">
      <thead><tr><th>Nome</th><th>Bruto</th><th>Descontos</th><th>Bonificações</th><th>Líquido</th></tr></thead>
      <tbody>
        ${folhaMes.map(f=>`<tr>
          <td data-label="Funcionário">${esc(f.nome||'—')}</td>
          <td data-label="Bruto" class="num">${brl(f.salario_bruto)}</td>
          <td data-label="Descontos" class="num">${Number(f.descontos)>0 ? brl(f.descontos) : '—'}</td>
          <td data-label="Bonificações" class="num">${Number(f.bonificacoes)>0 ? brl(f.bonificacoes) : '—'}</td>
          <td data-label="Líquido" class="num liq">${brl(f.salario_liquido)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  ` : `<div class="vazio">Ainda não fechamos a folha de ${esc(mesNome(comp))} — normalmente fica pronta até o dia 5. Nada travado do seu lado.</div>`;

  const [ano, mes] = comp.split('-').map(Number);
  const desligadosMes = (M.funcionarios||[]).filter(f=>{
    if (!f.data_desligamento) return false;
    const [a,m] = String(f.data_desligamento).split('-').map(Number);
    return a===ano && m===mes;
  });
  document.getElementById('desligamentos-mes').innerHTML = desligadosMes.length ? `
    <div class="card lista">${desligadosMes.map(f=>`
      <div class="item"><div class="nome">${esc(f.nome_completo)}</div><span class="status-chip status-vencida">Desligado em ${dBR(f.data_desligamento)}</span></div>
    `).join('')}</div>` : '';

  desenharCaixinhas(M.informado || [], comp);
}

/** Resumo de cada tipo de solicitação, pra exibir na lista de "em aberto". */
function resumoSolicitacao(s){
  switch (s.tipo) {
    case 'Solicitações Férias':      return `${s.funcionario||'—'} · ${dBR(s.periodo_inicio)}${s.periodo_fim?'–'+dBR(s.periodo_fim):''}`;
    case 'Solicitações Admissão':    return `${s.nome_candidato||'—'} · ${s.cargo||''}`;
    case 'Solicitações Desligamento':return `${s.funcionario||'—'} · ${s.motivo||''}`;
    case 'Prévia de Admissão':       return `${s.cargo_cogitado||'—'}${s.faixa_salarial?' · '+s.faixa_salarial:''}`;
    case 'Prévia de Desligamento':   return `${s.funcionario||'—'}${s.motivo_cogitado?' · '+s.motivo_cogitado:''}`;
    default: return '—';
  }
}
const TIPO_CURTO = {
  'Solicitações Férias':'Férias', 'Solicitações Admissão':'Admissão', 'Solicitações Desligamento':'Desligamento',
  'Prévia de Admissão':'Prévia admissão', 'Prévia de Desligamento':'Prévia desligamento',
};

/** Solicitações em aberto ficam sempre visíveis, independente do mês selecionado.
    As concluídas ficam escondidas atrás de um dropdown. */
function desenharSolicitacoesStatus(solicitacoes){
  const box = document.getElementById('solicitacoes-status');
  if (!solicitacoes.length){ box.innerHTML = '<div class="vazio">Nenhuma solicitação registrada ainda.</div>'; return; }

  const concluidas = solicitacoes.filter(s => normTxt(s.status).includes('conclu'));
  const abertas = solicitacoes.filter(s => !normTxt(s.status).includes('conclu'));

  const linha = s => `<div class="solic-item">
      <div><span class="tipo">${esc(TIPO_CURTO[s.tipo]||s.tipo)}</span><span class="desc">${esc(resumoSolicitacao(s))}</span>
        <div class="data">${dBR(s.data_solicitacao) || ''} ${s.status?'· '+esc(s.status):''}</div></div>
    </div>`;

  const abertasHtml = abertas.length
    ? abertas.map(linha).join('')
    : '<div class="vazio">Nenhuma solicitação em aberto no momento.</div>';

  const concluidasHtml = concluidas.length ? `
    <div class="dropdown-sec">
      <button class="dropdown-btn" id="btn-concluidas" aria-expanded="false">
        <span class="nome">Solicitações concluídas</span>
        <span class="conta">${concluidas.length}</span>
        <span class="seta">▾</span>
      </button>
      <div class="dropdown-body" id="body-concluidas">${concluidas.map(linha).join('')}</div>
    </div>` : '';

  box.innerHTML = abertasHtml + concluidasHtml;

  const btn = document.getElementById('btn-concluidas');
  if (btn) btn.addEventListener('click', () => {
    const body = document.getElementById('body-concluidas');
    const abrir = body.style.display !== 'block';
    body.style.display = abrir ? 'block' : 'none';
    btn.setAttribute('aria-expanded', abrir);
    btn.querySelector('.seta').style.transform = abrir ? 'rotate(180deg)' : '';
  });
}

/* Não perder o que o cliente digitou.
   O debounce de 3s era o ÚNICO gatilho: quem escrevia "Fulano faltou dias 12 e 13" e
   tocava em Início perdia o texto — e o status dizia "Digitando…", que não avisa risco
   nenhum. Agora o rascunho fica guardado POR COMPETÊNCIA (trocar de mês não descarta) e
   é descarregado ao sair do campo, ao esconder a aba e ao trocar de competência. */
const RASCUNHOS = {};   // 'AAAA-MM|campo' -> texto ainda não confirmado pelo servidor
const TIMERS    = {};   // 'AAAA-MM|campo' -> timer do debounce
let COMP_ATUAL  = '';   // competência desenhada na tela agora
const chaveCx = (comp, campo) => comp + '|' + campo;

function agendarSalvar(comp, campo, valor){
  const k = chaveCx(comp, campo);
  RASCUNHOS[k] = valor;
  clearTimeout(TIMERS[k]);
  TIMERS[k] = setTimeout(()=>salvarCaixinha(comp, campo), 3000);
}
function salvarJa(comp, campo){
  const k = chaveCx(comp, campo);
  if (!TIMERS[k]) return;                 // nada esperando: já foi
  clearTimeout(TIMERS[k]); TIMERS[k] = null;
  salvarCaixinha(comp, campo);
}
/** Descarrega tudo o que estiver esperando o debounce. */
function salvarPendentes(){
  Object.keys(TIMERS).forEach(k => { const p = k.split('|'); salvarJa(p[0], p[1]); });
}
/* A aba sumindo (trocar de app no celular, bloquear a tela) é justamente quando o
   navegador congela a página — é aqui que o texto se perderia calado. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') salvarPendentes();
});

/** As 5 caixinhas editáveis da competência selecionada. */
function desenharCaixinhas(informado, comp){
  COMP_ATUAL = comp;
  const linhaAtual = informado.find(i => i.competencia === comp) || {};

  const box = document.getElementById('caixinhas');
  box.innerHTML = CAIXINHAS.map(c => {
    const k = chaveCx(comp, c.campo);
    const pend = RASCUNHOS[k] !== undefined;                 // rascunho vence o que veio da planilha
    const valor = pend ? RASCUNHOS[k] : (linhaAtual[c.campo] || '');
    return `
    <div class="card caixinha">
      <h4>${c.titulo}</h4>
      <textarea id="cx-${c.campo}" placeholder="Escreva aqui...">${esc(valor)}</textarea>
      <div class="status${pend?' salvando':''}" id="cx-status-${c.campo}">${pend?'Salvando o que você escreveu…':''}</div>
    </div>`;
  }).join('');

  CAIXINHAS.forEach(c => {
    const area = document.getElementById('cx-' + c.campo);
    const statusEl = document.getElementById('cx-status-' + c.campo);
    area.addEventListener('input', () => {
      statusEl.textContent = 'Digitando… (salva sozinho quando você sair do campo)';
      statusEl.className = 'status';
      agendarSalvar(comp, c.campo, area.value);
    });
    // Sair do campo é o gesto que antecede trocar de tela: não dá para esperar 3s.
    area.addEventListener('blur', () => salvarJa(comp, c.campo));
  });
}

/** Mantém M.informado em dia depois de salvar — senão trocar de competência e voltar
    redesenharia as caixinhas com o texto ANTIGO, que é a mesma perda por outro caminho. */
function guardarInformado(comp, campo, valor){
  if (!DADOS_ATUAIS) return;
  const lista = DADOS_ATUAIS.informado = DADOS_ATUAIS.informado || [];
  let linha = lista.find(i => i.competencia === comp);
  if (!linha){ linha = { competencia: comp }; lista.push(linha); }
  linha[campo] = valor;
}

async function salvarCaixinha(comp, campo, ehRetentativa){
  const k = chaveCx(comp, campo);
  const valor = RASCUNHOS[k];
  if (valor === undefined) return;                  // já salvo
  TIMERS[k] = null;
  // Só escreve status se a competência do texto ainda é a que está na tela.
  const st = () => (comp === COMP_ATUAL) ? document.getElementById('cx-status-' + campo) : null;
  const el0 = st();
  if (el0){ el0.textContent = 'Salvando…'; el0.className = 'status salvando'; }
  try {
    if (!API_URL) throw new Error('Sem API configurada neste modo de demonstração.');
    const qs = new URLSearchParams({ id: IDENTIDADE.id, codigo: IDENTIDADE.codigo, acao: 'salvar_info_mensal', competencia: comp, campo, valor });
    const d = await jsonp(API_URL + '?' + qs.toString());
    if (d.erro) throw new Error(d.erro);
    if (RASCUNHOS[k] === valor) delete RASCUNHOS[k];  // pode ter digitado mais durante o envio
    guardarInformado(comp, campo, valor);
    const el1 = st();
    if (el1 && RASCUNHOS[k] === undefined){
      el1.textContent = 'Salvo às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      el1.className = 'status salvo';
    }
  } catch (e) {
    /* O texto continua na tela e no rascunho — a frase tem de dizer isso, senão ele
       acha que perdeu e digita tudo de novo. E como ela promete outra tentativa,
       a tentativa existe de verdade (uma, 8s depois). */
    const el2 = st();
    if (el2){
      el2.textContent = 'Não salvei ainda. Seu texto está aqui; vou tentar de novo sozinho.';
      el2.className = 'status erro';
    }
    if (!ehRetentativa) TIMERS[k] = setTimeout(()=>salvarCaixinha(comp, campo, true), 8000);
  }
}

function desenharAdmissoes(admissoes){
  const box = document.getElementById('admissoes');
  if (!admissoes.length){
    box.innerHTML = '<div class="card"><div class="vazio">Nenhuma admissão ou desligamento em aberto no momento.</div></div>';
    return;
  }
  const ordenadas = admissoes.slice().sort((a,b)=>{
    const aConcluido = classeStatus(a.etapas[a.etapas.length-1].status) === 'concluido';
    const bConcluido = classeStatus(b.etapas[b.etapas.length-1].status) === 'concluido';
    return (aConcluido === bConcluido) ? 0 : (aConcluido ? 1 : -1);
  });

  box.innerHTML = ordenadas.map(p=>{
    const ultima = p.etapas[p.etapas.length-1];
    const concluido = classeStatus(ultima.status) === 'concluido';
    return `<div class="card processo-card" data-busca="${esc(normTxt(p.processo))}">
      <div class="processo-head">
        <h3>${esc(p.processo)}</h3>
        <span class="status-chip status-${concluido?'concluido':'andamento'}">${concluido?'Concluído':'Em andamento'}</span>
      </div>
      <div class="timeline">
        ${p.etapas.map(e=>{
          const cl = classeStatus(e.status);
          return `<div class="etapa ${cl}">
            <div class="etapa-nome">${esc(e.nome)}</div>
            <div class="etapa-meta">
              ${e.data ? `<span>${dBR(e.data)}</span>` : ''}
              <span class="etapa-status ${cl}">${esc(e.status)}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

/* Teto da lista. Dois botões de propósito: "mais 20" para quem está lendo, "todos"
   para quem vai usar Ctrl+F. O texto diz sempre o número real. */
const PASSO = 20;
let TETO_FUNC = PASSO;
function rodapeLista(mostrados, total){
  if (total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todos os ${total}</button>
  </div>`;
}
/* O teto esconde por CSS; as linhas continuam TODAS no DOM. A busca desta página
   varre o DOM e promete achar funcionário — cortar de verdade a faria mentir a
   partir do 21º nome. Enquanto se busca, quem casa aparece e o teto cala a boca. */
function aplicarTetoFunc(){
  const tb = document.querySelector('#tabela-func tbody'); if (!tb) return;
  const campo = document.getElementById('busca');
  const pe = document.getElementById('func-mais');
  const linhas = Array.from(tb.querySelectorAll('tr[data-busca]'));
  if (campo && campo.value.trim()){ if (pe) pe.innerHTML = ''; return; }
  linhas.forEach((tr,k)=> tr.style.display = k < TETO_FUNC ? '' : 'none');
  const n = Math.min(TETO_FUNC, linhas.length);
  if (pe) pe.innerHTML = rodapeLista(n, linhas.length);
}

function desenharFuncionarios(funcionarios){
  const tb = document.querySelector('#tabela-func tbody');
  const resumo = document.getElementById('func-resumo');
  const conta = document.getElementById('func-conta');
  if (conta) conta.textContent = funcionarios.length;
  if (!funcionarios.length){
    tb.innerHTML = '<tr><td colspan="4" class="vazio">Nenhum funcionário cadastrado ainda.</td></tr>';
    if (resumo) resumo.textContent = '';
    /* Sem ninguém no cadastro não há o que recolher — e um botão que abre o vazio
       seria um clique para não ver nada. O aviso aparece direto. */
    const b = document.getElementById('btn-func'), corpo = document.getElementById('body-func');
    if (b) b.style.display = 'none';
    if (corpo) corpo.style.display = 'block';
    return;
  }
  tb.innerHTML = funcionarios.map(f=>{
    const desligado = normTxt(f.status) === 'desligado' || f.data_desligamento;
    return `<tr data-busca="${esc(normTxt(f.nome_completo))} ${esc(normTxt(f.cargo))}">
      <td>${esc(f.nome_completo||'—')}</td>
      <td>${esc(f.cargo||'—')}</td>
      <td>${dBR(f.data_admissao)||'—'}</td>
      <td><span class="status-chip status-${desligado?'vencida':'concluido'}">${desligado?'Desligado':'Ativo'}</span></td>
    </tr>`;
  }).join('');

  const ativos = funcionarios.filter(f => !(normTxt(f.status) === 'desligado' || f.data_desligamento)).length;
  if (resumo) resumo.textContent = `${funcionarios.length} no cadastro · ${ativos} ${ativos===1?'ativo':'ativos'}`;

  TETO_FUNC = PASSO;
  aplicarTetoFunc();

  const btn = document.getElementById('btn-func');
  if (btn) btn.addEventListener('click', () => {
    const body = document.getElementById('body-func');
    const abrir = body.style.display !== 'block';
    body.style.display = abrir ? 'block' : 'none';
    btn.setAttribute('aria-expanded', abrir);
    btn.querySelector('.seta').style.transform = abrir ? 'rotate(180deg)' : '';
  });
  const pe = document.getElementById('func-mais');
  if (pe) pe.addEventListener('click', ev=>{
    if (ev.target.closest('.btn-mais')) { TETO_FUNC += PASSO; aplicarTetoFunc(); return; }
    if (ev.target.closest('.btn-todos')){ TETO_FUNC = funcionarios.length; aplicarTetoFunc(); return; }
  });
}

const hoje = new Date(); hoje.setHours(0,0,0,0);

function vencimentoInfo(iso){
  const p = partesData(iso);
  if (!p) return '';
  const venc = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  const dias = Math.round((venc - hoje) / 864e5);
  let classe = 'venc-ok', texto;
  if (dias < 0){ classe = 'venc-vencido'; texto = `Venceu há ${-dias}d`; }
  else if (dias <= 60){ classe = 'venc-atencao'; texto = `Vence em ${dias}d`; }
  else { texto = `Vence ${dBR(iso)}`; }
  return `<span class="venc ${classe}">${texto}</span>`;
}

}

/* ---------------- busca ----------------
   Cada seção é um par (cabeçalho, caixa). Quando nada bate dentro dela, o
   cabeçalho some junto com a caixa — senão o título fica sobre um vazio e dá a
   impressão de que os dados sumiram. O contador diz quantos resultados vieram e
   oferece o "limpar". */
const SECOES_BUSCA = [
  {head:'sec-admissoes',  box:'admissoes'},
  {head:'sec-func',       box:'box-func'},
  {head:'sec-ferias',     box:'ferias'},
  {head:'sec-documentos', box:'documentos'},
  {head:'sec-modelos',    box:'modelos'}
];
/* O seletor precisa incluir #modelos — o placeholder promete buscar "modelo". */
const SEL_BUSCA = '#admissoes [data-busca], #tabela-func [data-busca], #ferias [data-busca], #documentos [data-busca], #modelos [data-busca]';

/* Bloco recolhido que a busca alcança: abre sozinho quando há resultado dentro dele
   e volta a fechar quando a busca é limpa. */
function abrirSeBuscar(idBtn, idBody, alvo){
  const btn = document.getElementById(idBtn), body = document.getElementById(idBody);
  if (!btn || !body || btn.style.display === 'none') return;   // bloco sem botão não recolhe
  const tem = !!alvo && Array.from(body.querySelectorAll('[data-busca]')).some(el=>el.style.display !== 'none');
  if (tem){
    body.style.display = 'block';
    btn.setAttribute('aria-expanded','true');
    btn.querySelector('.seta').style.transform = 'rotate(180deg)';
  } else if (!alvo){
    body.style.display = 'none';
    btn.setAttribute('aria-expanded','false');
    btn.querySelector('.seta').style.transform = '';
  }
}

/* Guarda como cada seção aparece SEM busca (algumas já nascem escondidas). */
function memorizarSecoes(){
  SECOES_BUSCA.forEach(s=>{
    const head = document.getElementById(s.head), box = document.getElementById(s.box);
    if (head) head.dataset.disp = head.style.display || '';
    if (box)  box.dataset.disp  = box.style.display  || '';
  });
}

function filtrar(termo){
  const alvo = normTxt(termo);
  let achados = 0;
  document.querySelectorAll(SEL_BUSCA).forEach(el=>{
    const bate = !alvo || el.dataset.busca.includes(alvo);
    el.style.display = bate ? '' : 'none';
    if (alvo && bate) achados++;
  });

  // Os dropdowns abrem sozinhos quando a busca acha algo lá dentro — senão a página
  // diria "3 resultados" e a tela não mostraria nenhum.
  abrirSeBuscar('btn-modelos', 'body-modelos', alvo);
  abrirSeBuscar('btn-func',    'body-func',    alvo);

  SECOES_BUSCA.forEach(s=>{
    const head = document.getElementById(s.head), box = document.getElementById(s.box);
    if (!head || !box) return;
    const itens = box.querySelectorAll('[data-busca]');
    const visiveis = Array.from(itens).filter(el=>el.style.display !== 'none').length;
    const esconder = !!alvo && (itens.length === 0 || visiveis === 0);
    head.style.display = esconder ? 'none' : (head.dataset.disp || '');
    box.style.display  = esconder ? 'none' : (box.dataset.disp  || '');
  });

  // Depois do filtro: com busca o teto sai da frente, sem busca ele volta.
  aplicarTetoFunc();

  mostrarResumoBusca(termo, achados);
}

function mostrarResumoBusca(termo, achados){
  const info = document.getElementById('busca-info');
  const vazio = document.getElementById('busca-vazio');
  const campo = document.getElementById('busca');
  const t = String(termo || '').trim();
  if (!info || !vazio) return;
  if (!t){ info.className = 'busca-info'; info.innerHTML = ''; vazio.className = 'busca-vazio'; vazio.innerHTML = ''; return; }

  info.className = 'busca-info on';
  info.innerHTML = `<span><b>${achados}</b> ${achados === 1 ? 'resultado' : 'resultados'} para <b>${esc(t)}</b></span>
    <span>·</span><button type="button" class="busca-limpar" id="busca-limpar">limpar</button>`;
  const btn = document.getElementById('busca-limpar');
  if (btn) btn.addEventListener('click', ()=>{ if (campo){ campo.value = ''; campo.focus(); } filtrar(''); });

  if (achados){ vazio.className = 'busca-vazio'; vazio.innerHTML = ''; return; }
  vazio.className = 'busca-vazio on';
  vazio.innerHTML = `Nada encontrado para <b>${esc(t)}</b>.
    <span class="busca-dica">Seus dados continuam aqui — só a busca não achou nada com esse termo.</span>`;
}

function el(h){ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; }
function appendAll(parent, h){
  const t = document.createElement('template'); t.innerHTML = h.trim();
  Array.from(t.content.children).forEach(n => parent.appendChild(n));
}

/* Em subpágina, sem login volta direto para o index (que trata código expirado / áreas
   da pessoa). Com login, só o MIOLO vira a mensagem padrão de erro — a barra de cima
   fica na tela (Início e WhatsApp). A mensagem é sempre a mesma, sem dizer o que
   falhou: o motivo é vocabulário nosso e, na tela do cliente, só vira medo. */
function erro(){
  var ic=getIdCodigo(), id=ic.id, codigo=ic.codigo;
  if(!id||!codigo){ location.replace('index'+(id?('#'+id+(codigo?'-'+codigo:'')):(location.hash||''))); return; }
  var alvo=document.getElementById('app')||document.body;
  if(window.B4UEspera) B4UEspera.telaErro(alvo);
  else alvo.innerHTML='<div class="state"><h1>Não conseguimos carregar as informações</h1>'
    +'<p>Houve um erro ao recuperar as informações. Tente novamente em alguns minutos. '
    +'Se o problema continuar, entre em contato com o atendimento.</p></div>';
}

/* A espera inteira — barra, porcentagem e frases — mora no b4u-espera.js, que começa
   sozinho pelo atributo do <body>. Este nome fica porque há chamadas espalhadas. */
function pararEspera(){
  /* Tirar o atributo antes de concluir: a espera automática só começa no
     DOMContentLoaded, e o painel pintado a partir do cache fica pronto ANTES disso.
     Sem esta linha o overlay subiria por cima de uma tela já montada. */
  if (document.body) document.body.removeAttribute('data-b4u-espera');
  if (window.B4UEspera) B4UEspera.concluir();
}

/* Tarja discreta do cache: diz que o que está na tela veio do último acesso.
   Fica logo abaixo do herói — nunca por cima do número. */
function tarja(texto, falhou){
  const slot = document.getElementById('tarja-slot'); if(!slot) return;
  slot.innerHTML = texto ? `<div class="tarja-atualizando${falhou?' falhou':''}">${esc(texto)}</div>` : '';
}
function horaCache(ts){ return ts ? new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : 'antes'; }

/* Os modelos são a ÚLTIMA seção da página e ainda ficam atrás de um botão fechado:
   não faz sentido a página inteira esperar por uma segunda execução do Apps Script.
   Pintamos com a rota principal e buscamos os modelos depois. */
function carregarModelos(){
  return carregarTipo('modelos').then(r => r.modelos || []).catch(()=>[]);
}

(async function(){
  const { id, codigo } = getIdCodigo();
  IDENTIDADE = { id, codigo };
  // Sem ID e código no endereço não há o que pedir: erro() devolve a pessoa ao index.
  if (!id || !codigo) return erro();

  let pintadoDoCache = false, tsCache = 0;
  /* A segunda visita não recomeça do esqueleto: pintamos com o último payload (6h de
     validade) e atualizamos por baixo. Se a atualização falhar, o que está na tela
     continua — apagar dado bom por causa de uma rede ruim é pior que dado de 1h atrás. */
  if (API_URL && id && window.B4U && B4U.cacheLer){
    const bruto = B4U.cacheLer(TIPO, id);
    if (bruto){
      try{
        /* Pintar PRIMEIRO, encerrar a espera depois — a mesma ordem das irmãs
           (guias, equiparação, fiscal). Se este render tropeçar num cache velho ou de
           outro formato, o erro cai no catch abaixo com a espera ainda de pé: a barra
           continua correndo enquanto a busca de verdade acontece, em vez de o overlay
           sair na frente e descobrir a tela pela metade. */
        render(bruto, null); pararEspera(); tarja('Atualizando…');
        pintadoDoCache = true; tsCache = bruto.atualizado_em ? new Date(bruto.atualizado_em).getTime() : 0;
      }catch(err){ /* cache velho ou de outro formato: ignora e busca de novo */ }
    }
  }

  try {
    const dados = await carregarTipo(TIPO);
    if (API_URL && id && window.B4U && B4U.cacheGravar) B4U.cacheGravar(TIPO, id, dados);
    render(dados, null); pararEspera(); tarja('');   // mesma ordem: o conteúdo aparece, aí a barra corre até o fim
  } catch (e) {
    if (pintadoDoCache){ tarja('Não consegui atualizar agora — mostrando os dados de '+horaCache(tsCache)+'.', true); }
    else { return erro(); }
  }
  // Modelos entram quando chegarem; a busca em curso é reaplicada sobre eles.
  carregarModelos().then(ms => {
    desenharModelos(ms);
    const campo = document.getElementById('busca');
    if (campo && campo.value.trim()) filtrar(campo.value);
  });
})();
</script>
