  if (M.mesesFluxo.length > 1) appendAll(wrap, blocoMeses(M));

  wrap.appendChild(el('<footer>' +
    '<span>' + (DEMO ? 'Dados de exemplo — empresa fictícia' :
      'Atualizado em ' + esc(new Date(M.atualizado_em || Date.now()).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}))) + '</span>' +
    '<span>Dúvida em algum número? Fale com a gente pelo WhatsApp.</span>' +
  '</footer>'));

  ligarSairDemo();
  desenharTabelaMeses();
  /* Delegado no bloco: a tabela é redesenhada a cada clique, e botão redesenhado
     perde o listener que estava preso nele. */
  const bm = document.getElementById('bloco-meses');
  if (bm) bm.addEventListener('click', e => {
    if (e.target.closest('.btn-mais')){ TETO_MESES += PASSO_MESES; desenharTabelaMeses(); return; }
    if (e.target.closest('.btn-todos')){ TETO_MESES = LINHAS_MESES.length; desenharTabelaMeses(); }
  });
  /* Com chart.js no <head> com defer, ele executa DEPOIS deste script: numa pintura
     síncrona (cache) ainda não existe. Em vez de trocar o gráfico por "indisponível"
     à toa, esperamos o defer terminar e desenhamos. */
  const desenhar = () => { try { graficoEvolucao(M); } catch(e){ console.warn('Gráfico principal indisponível:', e); } };
  if (!temChart() && document.readyState === 'loading') document.addEventListener('DOMContentLoaded', desenhar, { once:true });
  else desenhar();
  desenharAoAbrir('bloco-dre',     () => graficoCascata(M));
  desenharAoAbrir('bloco-balanco', () => graficoBalanco(M));
  desenharAoAbrir('bloco-meses',   () => graficoMeses(M));
}

/* ─────────────────────── tabela em cascata (DRE) ─────────────────────── */
function celulaValor(v, def){
  if (v == null) return '<td class="v zero">—</td>';
  const cls = 'v' + (v < 0 ? ' saida' : (v === 0 ? ' zero' : ''));
  return '<td class="' + cls + '">' + esc(brl0(v)) + '</td>';
}
function blocoDRE(M){
  const D = M.dre, meses = M.mesesFluxo.length ? M.mesesFluxo : M.meses;
  const baseAV = acumular(D,'receita_bruta', meses) || 0;
  const linhas = DRE.filter(def => D[def.k]);
  const corpo = linhas.map(def => {
    const acum = acumular(D, def.k, meses);
    const av = (baseAV && acum != null) ? (acum / baseAV * 100) : null;
    return '<tr class="n' + def.nivel + (def.tipo === 'total' ? ' total' : '') + (def.destaque ? ' destaque' : '') + '">' +
      '<td class="conta"><span class="c-nome">' + esc(def.nome) + '</span>' +
        '<span class="c-tec" title="' + esc('Nome contábil: ' + def.tec) + '">' + esc(def.tec) + '</span></td>' +
      celulaValor(acum, def) +
      '<td class="av">' + (av == null ? '—' : pctBR(av,1)) + '</td>' +
      meses.map(m => celulaValor(V(D, def.k, m), def)).join('') +
    '</tr>';
  }).join('');

  const rbAcum = baseAV;
  const llAcum = acumular(D,'lucro_liquido', meses);
  const resumo = 'faturou ' + brlCurto(rbAcum) + ' no período · ' +
    ((llAcum||0) >= 0 ? 'sobraram ' : 'faltaram ') + brlCurto(Math.abs(llAcum||0));

  const extrasDRE = (M.extras||[]).filter(l => Object.keys(l.valores).length);
  return '<details class="bloco" id="bloco-dre">' +
    '<summary><div class="bloco-t"><b>De onde veio e para onde foi o dinheiro</b>' +
      '<span>' + esc(resumo) + '</span></div>' + (DEMO ? SELO : '') + IC_CHEV + '</summary>' +
    '<div class="bloco-body">' +
      '<div class="bloco-nota">Esta é a <b>DRE</b> — o nome técnico de "conta do mês". Ela começa no faturamento ' +
        'e vai descontando, em degraus, tudo o que a empresa gastou, até chegar no que sobrou. ' +
        'Valores com <b>−</b> são saídas.</div>' +
      '<div class="graf-titulo">Os degraus do mês' + selo() + '</div>' +
      '<div class="graf-sub">' + esc(M.ultimo ? mesExtenso(M.ultimo) : '') + ' — do faturamento até o que sobrou.</div>' +
      '<div class="cbox"><canvas id="g-cascata" role="img" aria-label="Do faturamento até o resultado do mês"></canvas></div>' +
      '<div class="leg" id="g-cascata-lg"></div>' +
      '<div class="graf-titulo" style="margin-top:26px">Linha por linha</div>' +
      '<div class="graf-sub">Acumulado do período e depois mês a mês. Arraste a tabela para o lado para ver todos os meses.</div>' +
      '<div class="tab-rol"><table class="tab">' +
        '<thead><tr>' +
          '<th class="conta">Conta</th><th>Acumulado</th>' +
          '<th title="Análise vertical: quanto essa linha representa do faturamento total do período.">% do faturamento</th>' +
          meses.map(m => '<th>' + esc(mesCurtoLbl(m)) + '</th>').join('') +
        '</tr></thead><tbody>' + corpo + '</tbody>' +
      '</table></div>' +
      '<div class="tab-legenda">Os valores com <b>−</b> na frente são saídas de dinheiro. ' +
        'A coluna <b>% do faturamento</b> mostra o peso de cada linha sobre tudo o que a empresa faturou no período.</div>' +
      (M.sinalCorrigido ? '<div class="aviso"><span class="ai">⚠︎</span><div>Algumas linhas de custo ou despesa vieram da planilha com sinal positivo. ' +
        'Para as contas fecharem, o painel as tratou como <b>saída</b>.</div></div>' : '') +
      (extrasDRE.length ? '<details class="como" style="margin-top:16px"><summary>' + IC_CHEV_MINI +
        'Outras ' + extrasDRE.length + ' linha(s) da planilha que não entram nesta estrutura</summary>' +
        '<div class="formula">' + extrasDRE.map(l => esc(l.nome)).join(' · ') + '</div></details>' : '') +
    '</div></details>';
}

/* ─────────────────────── Balanço Patrimonial ─────────────────────── */
function tabelaBP(estrutura, S, mes, total){
  const linhas = estrutura.filter(def => S[def.k]);
  if (!linhas.length) return '';
  return '<div class="tab-rol"><table class="tab"><thead><tr>' +
      '<th class="conta">Conta</th><th>Saldo</th>' +
      '<th title="Análise vertical: quanto essa conta representa do total.">% do total</th>' +
    '</tr></thead><tbody>' +
    linhas.map(def => {
      const v = V(S, def.k, mes);
      const av = (total && v != null) ? (v / total * 100) : null;
      return '<tr class="n' + def.nivel + (def.tipo === 'total' ? ' total' : '') + (def.tipo === 'sub' ? ' total' : '') + '">' +
        '<td class="conta"><span class="c-nome">' + esc(def.nome) + '</span>' +
          '<span class="c-tec" title="' + esc('Nome contábil: ' + def.tec) + '">' + esc(def.tec) + '</span></td>' +
        celulaValor(v, def) +
        '<td class="av">' + (av == null ? '—' : pctBR(av,0)) + '</td>' +
      '</tr>';
    }).join('') + '</tbody></table></div>';
}
function blocoBalanco(M){
  const m = M.ultimoBP;
  const ativo = V(M.ativo,'ativo',m), passivoPL = V(M.passivo,'passivo_pl',m);
  const pc = V(M.passivo,'passivo_circulante',m), pnc = V(M.passivo,'passivo_nao_circulante',m);
  const pl = V(M.passivo,'pl',m);
  const deve = (pc||0) + (pnc||0);
  const dif = (ativo != null && passivoPL != null) ? (ativo - passivoPL) : null;
  const fecha = dif != null && Math.abs(dif) <= Math.max(1, Math.abs(ativo||0) * 0.005);
  const resumo = 'tem ' + brlCurto(ativo||0) + ' · deve ' + brlCurto(deve) + ' · dos sócios ' + brlCurto(pl||0);

  return '<details class="bloco" id="bloco-balanco">' +
    '<summary><div class="bloco-t"><b>O que a empresa tem e o que ela deve</b>' +
      '<span>' + esc(resumo) + '</span></div>' + (DEMO ? SELO : '') + IC_CHEV + '</summary>' +
    '<div class="bloco-body">' +
      '<div class="bloco-nota">Isto é o <b>Balanço Patrimonial</b> — uma fotografia da empresa em ' +
        esc(m ? mesExtenso(m) : '') + '. De um lado, tudo o que ela tem (o <b>Ativo</b>). ' +
        'Do outro, de quem é esse dinheiro: parte é de terceiros (o que ela <b>deve</b>) e parte é dos sócios ' +
        '(o <b>Patrimônio Líquido</b>). Os dois lados têm de dar o mesmo valor.</div>' +
      '<div class="cbox-baixo"><canvas id="g-balanco" role="img" aria-label="Ativo comparado a passivo e patrimônio líquido"></canvas></div>' +
      '<div class="leg" id="g-balanco-lg"></div>' +
      (dif == null ? '' : (fecha
        ? '<div class="tab-legenda" style="margin-top:12px">✓ Os dois lados fecham no mesmo valor — o balanço está consistente.</div>'
        : '<div class="aviso"><span class="ai">⚠︎</span><div><b>Os dois lados não fecharam.</b> ' +
          'Há uma diferença de ' + esc(brl0(Math.abs(dif))) + ' entre o que a empresa tem e a soma do que ela deve com o que é dos sócios. ' +
          'Nossa equipe contábil revisa isso — se este número for para alguma decisão, confirme com a gente antes.</div></div>')) +
      '<div class="graf-titulo" style="margin-top:26px">O que a empresa tem</div>' +
      '<div class="graf-sub">Saldos em ' + esc(m ? mesExtenso(m) : '') + '.</div>' +
      tabelaBP(BP_ATIVO, M.ativo, m, ativo) +
      '<div class="graf-titulo" style="margin-top:22px">O que ela deve e o que é dos sócios</div>' +
      '<div class="graf-sub">Mesma data, o outro lado da fotografia.</div>' +
      tabelaBP(BP_PASSIVO, M.passivo, m, passivoPL) +
    '</div></details>';
}

/* ─────────────────────── Indicadores ─────────────────────── */
function calcularIndicadores(M){
  const D = M.dre, m = M.ultimo, ant = M.anterior, b = M.ultimoBP, bAnt = M.antBP;
  const f = (fn, mes, mesBP) => { try { return fn(mes, mesBP); } catch(e){ return null; } };
  const margemLiquida = (mm) => { const rb = V(D,'receita_bruta',mm), ll = V(D,'lucro_liquido',mm);
    return (rb && ll != null) ? ll/rb*100 : null; };
  const margemBruta = (mm) => { const rb = V(D,'receita_bruta',mm), lb = V(D,'lucro_bruto',mm);
    return (rb && lb != null) ? lb/rb*100 : null; };
  const pesoDespesas = (mm) => { const rb = V(D,'receita_bruta',mm), dp = V(D,'despesas',mm);
    return (rb && dp != null) ? Math.abs(dp)/rb*100 : null; };
  const liquidez = (mm) => { const ac = V(M.ativo,'ativo_circulante',mm), pc = V(M.passivo,'passivo_circulante',mm);
    return (ac != null && pc) ? ac/pc : null; };
  const endividamento = (mm) => { const at = V(M.ativo,'ativo',mm),
    pc = V(M.passivo,'passivo_circulante',mm), pnc = V(M.passivo,'passivo_nao_circulante',mm);
    return (at && (pc != null || pnc != null)) ? ((pc||0)+(pnc||0))/at*100 : null; };

  const rb = V(D,'receita_bruta',m), ll = V(D,'lucro_liquido',m), lb = V(D,'lucro_bruto',m), dp = V(D,'despesas',m);
  const ac = b ? V(M.ativo,'ativo_circulante',b) : null, pc = b ? V(M.passivo,'passivo_circulante',b) : null;
  const at = b ? V(M.ativo,'ativo',b) : null, pnc = b ? V(M.passivo,'passivo_nao_circulante',b) : null;

  return [
    { k:'margem_liq', nome:'Quanto sobra de cada R$ 100', curto:'margem', tec:'Margem líquida', pol:1, unidade:'%',
      valor:f(margemLiquida,m), antes:ant?f(margemLiquida,ant):null, quando: ant ? mesExtenso(ant) : '',
      leitura: v => v == null ? '' : (v >= 15 ? 'Folga confortável.' : v >= 5 ? 'Sobra apertada, mas positiva.' : v >= 0 ? 'Sobra muito pequena — qualquer imprevisto vira prejuízo.' : 'O mês fechou no vermelho.'),
      formula:'quanto sobrou no mês ÷ faturamento total × 100',
      conta: (ll != null && rb) ? '(' + brl0(ll) + ' ÷ ' + brl0(rb) + ') × 100 = ' + pctBR(ll/rb*100,1) : '' },
    { k:'margem_bruta', nome:'Sobra depois só dos custos', curto:'margem bruta', tec:'Margem bruta', pol:1, unidade:'%',
      valor:f(margemBruta,m), antes:ant?f(margemBruta,ant):null, quando: ant ? mesExtenso(ant) : '',
      leitura: v => v == null ? '' : 'É o que sobra antes de pagar a estrutura da empresa (aluguel, administração, impostos fora da nota).',
      formula:'sobra depois dos custos ÷ faturamento total × 100',
      conta: (lb != null && rb) ? '(' + brl0(lb) + ' ÷ ' + brl0(rb) + ') × 100 = ' + pctBR(lb/rb*100,1) : '' },
    { k:'peso_despesas', nome:'Peso das despesas', curto:'despesas', tec:'Despesas sobre a receita', pol:-1, unidade:'%',
      valor:f(pesoDespesas,m), antes:ant?f(pesoDespesas,ant):null, quando: ant ? mesExtenso(ant) : '',
      leitura: v => v == null ? '' : 'De cada R$ 100 faturados, ' + numBR(v,0) + ' vão para manter a empresa de pé. Quanto menor, melhor.',
      formula:'despesas para manter a empresa ÷ faturamento total × 100',
      conta: (dp != null && rb) ? '(' + brl0(Math.abs(dp)) + ' ÷ ' + brl0(rb) + ') × 100 = ' + pctBR(Math.abs(dp)/rb*100,1) : '' },
    { k:'liquidez', nome:'Fôlego para as contas do ano', curto:'fôlego de caixa', tec:'Liquidez corrente', pol:1, unidade:'x',
      valor:f(liquidez,b), antes:bAnt?f(liquidez,bAnt):null, quando: bAnt ? mesExtenso(bAnt) : '',
      leitura: v => v == null ? '' : (v >= 1.5 ? 'Para cada R$ 1 a pagar nos próximos 12 meses, a empresa tem R$ ' + numBR(v,2) + ' a receber. Situação folgada.'
        : v >= 1 ? 'Para cada R$ 1 a pagar, há R$ ' + numBR(v,2) + ' a receber. Dá, mas sem folga.'
        : 'Para cada R$ 1 a pagar no curto prazo, há só R$ ' + numBR(v,2) + '. Atenção ao caixa.'),
      formula:'o que a empresa tem de curto prazo ÷ o que ela deve de curto prazo',
      conta: (ac != null && pc) ? brl0(ac) + ' ÷ ' + brl0(pc) + ' = ' + numBR(ac/pc,2) : '' },
    { k:'endividamento', nome:'Quanto do que ela tem é de terceiros', curto:'endividamento', tec:'Endividamento', pol:-1, unidade:'%',
      valor:f(endividamento,b), antes:bAnt?f(endividamento,bAnt):null, quando: bAnt ? mesExtenso(bAnt) : '',
      leitura: v => v == null ? '' : (v < 50 ? 'A maior parte do que a empresa tem é dos sócios. Dívida sob controle.'
        : v < 80 ? 'Boa parte do que a empresa tem ainda é de terceiros (bancos, fornecedores, impostos).'
        : 'Quase tudo o que a empresa tem já está comprometido com terceiros.'),
      formula:'(o que deve no curto prazo + o que deve no longo prazo) ÷ tudo o que a empresa tem × 100',
      conta: (at && (pc != null || pnc != null)) ? '(' + brl0(pc||0) + ' + ' + brl0(pnc||0) + ') ÷ ' + brl0(at) + ' × 100 = ' + pctBR(((pc||0)+(pnc||0))/at*100,1) : '' }
  ].filter(i => i.valor != null);
}
function formatarIndicador(i){
  if (i.valor == null) return '—';
  if (i.unidade === '%') return pctBR(i.valor,1);
  if (i.unidade === 'x') return numBR(i.valor,2);
  return brl(i.valor);
}
function blocoIndicadores(M){
  const inds = calcularIndicadores(M);
  if (!inds.length) return '';
  const resumo = inds.slice(0,3).map(i => (i.curto || i.nome) + ' ' + formatarIndicador(i)).join(' · ');
  return '<details class="bloco" id="bloco-indicadores">' +
    '<summary><div class="bloco-t"><b>Os números que resumem a saúde da empresa</b>' +
      '<span>' + esc(resumo) + '</span></div>' + (DEMO ? SELO : '') + IC_CHEV + '</summary>' +
    '<div class="bloco-body">' +
      '<div class="bloco-nota">Cada quadro abaixo tem um <b>"como calculamos"</b>. Abra para ver a conta ' +
        'em português, com os números do mês. Nada aqui é caixa-preta.</div>' +
      '<div class="ind-grid">' + inds.map(i =>
        '<div class="ind">' +
          '<span class="lbl" title="' + esc('Nome técnico: ' + i.tec) + '">' + esc(i.nome) + '</span>' +
          '<div class="ind-v num">' + esc(formatarIndicador(i)) + '</div>' +
          htmlDelta(i.valor, i.antes, i.pol, i.quando) +
          '<div class="ind-s">' + esc(i.leitura(i.valor)) + '</div>' +
          '<details class="como"><summary>' + IC_CHEV_MINI + 'Como calculamos</summary>' +
            '<div class="formula">' + esc(i.tec) + ' = ' + esc(i.formula) +
              (i.conta ? '<code>' + esc(i.conta) + '</code>' : '') +
            '</div>' +
          '</details>' +
        '</div>').join('') + '</div>' +
    '</div></details>';
}

/* ─────────────────────── Evolução mês a mês ─────────────────────── */
/* Teto da tabela. A lista de meses só cresce: dois anos de escrituração já são
   24 linhas iguais, e no celular a rolagem não acaba. O corte é pelo FIM — os
   meses recentes são a resposta; os antigos é que ficam a um clique. */
const PASSO_MESES = 20;
let TETO_MESES = PASSO_MESES, LINHAS_MESES = [];
function rodapeLista(mostrados, total){
  if (total <= mostrados) return '';
  const faltam = total - mostrados;
  return '<div class="lista-mais">' +
    '<button type="button" class="btn-mais">Mostrar mais ' + Math.min(PASSO_MESES, faltam) + '</button>' +
    '<button type="button" class="btn-todos">Mostrar todos os ' + total + '</button>' +
  '</div>';
}
function linhaMesHTML(l){
  return '<tr>' +
    '<td class="conta"><span class="c-nome">' + esc(mesExtenso(l.m)) + '</span></td>' +
    '<td class="v">' + (l.rl == null ? '—' : esc(brl0(l.rl))) + '</td>' +
    '<td class="v saida">' + (l.saidas == null ? '—' : esc(brl0(-Math.abs(l.saidas)))) + '</td>' +
    '<td class="v" style="font-weight:800;color:' + ((l.ll||0) >= 0 ? 'var(--g-ok-txt)' : 'var(--g-enc-txt)') + '">' +
      (l.ll == null ? '—' : esc(brl0(l.ll))) + '</td>' +
    '<td class="av">' + (l.mg == null ? '—' : pctBR(l.mg,1)) + '</td>' +
  '</tr>';
}
function desenharTabelaMeses(){
  const corpo = document.getElementById('tab-meses-corpo');
  const pe = document.getElementById('tab-meses-pe');
  if (!corpo || !pe) return;
  const total = LINHAS_MESES.length, n = Math.min(TETO_MESES, total);
  corpo.innerHTML = LINHAS_MESES.slice(total - n).map(linhaMesHTML).join('');
  pe.innerHTML = (total > n ? '<div class="tab-legenda">Mostrando os <b>' + n + '</b> meses mais recentes, de ' +
      total + '.</div>' : '') + rodapeLista(n, total);
}
function blocoMeses(M){
  const D = M.dre, meses = M.mesesFluxo;
  const linhas = meses.map(m => {
    const rl = V(D,'receita_liquida',m), ll = V(D,'lucro_liquido',m);
    const custos = V0(D,'custos',m), desp = V0(D,'despesas',m);
    const saidas = (rl != null && ll != null) ? (rl - ll) : (Math.abs(custos) + Math.abs(desp));
    const base = V(D,'receita_bruta',m) || rl;         // mesma base do resto do painel
    const mg = (base && ll != null) ? ll/base*100 : null;
    return { m, rl, ll, saidas, mg };
  });
  const comLL = linhas.filter(l => l.ll != null);
  let melhor = null, pior = null;
  comLL.forEach(l => { if (!melhor || l.ll > melhor.ll) melhor = l; if (!pior || l.ll < pior.ll) pior = l; });
  const resumo = meses.length + ' meses' +
    (melhor ? ' · melhor foi ' + mesCurtoLbl(melhor.m) + ' (' + brlCurto(melhor.ll) + ')' : '') +
    (pior && melhor && pior.m !== melhor.m ? ' · pior foi ' + mesCurtoLbl(pior.m) + ' (' + brlCurto(pior.ll) + ')' : '');

  LINHAS_MESES = linhas;
  TETO_MESES = PASSO_MESES;
  return '<details class="bloco" id="bloco-meses">' +
    '<summary><div class="bloco-t"><b>Mês a mês, lado a lado</b>' +
      '<span>' + esc(resumo) + '</span></div>' + (DEMO ? SELO : '') + IC_CHEV + '</summary>' +
    '<div class="bloco-body">' +
      '<div class="bloco-nota">Aqui dá para ver o padrão: em que meses a empresa fatura mais, ' +
        'em que meses gasta mais e como o que sobra se comporta ao longo do ano.</div>' +
      '<div class="graf-titulo">Para onde foi o dinheiro' + selo() + '</div>' +
      '<div class="graf-sub">Cada barra é tudo o que saiu no mês, separado por tipo de gasto.</div>' +
      '<div class="cbox"><canvas id="g-meses" role="img" aria-label="Custos e despesas por mês"></canvas></div>' +
      '<div class="leg" id="g-meses-lg"></div>' +
      '<div class="tab-rol" style="margin-top:20px"><table class="tab"><thead><tr>' +
        '<th class="conta">Mês</th><th>Entrou</th><th>Saiu</th><th>Sobrou</th><th>Margem</th>' +
      '</tr></thead><tbody id="tab-meses-corpo"></tbody></table></div>' +
      '<div id="tab-meses-pe"></div>' +
    '</div></details>';
}

/* ═══════════════════════════ GRÁFICOS ═══════════════════════════
   Regras seguidas aqui, sem exceção:
   · NUNCA dois eixos y. Quando duas séries têm unidades diferentes, ou vão
     em gráficos separados, ou uma delas vira número/tabela.
   · Nada de pizza/rosca para comparar 2 fatias ou valores próximos.
   · Parte-de-um-todo (Ativo × Passivo+PL) = barra empilhada horizontal.
   · Grade recessiva, marcas finas, eixo em R$ abreviado, tudo em pt-BR.
   · Legenda em HTML sempre que houver 2 séries ou mais.                    */
function tooltipBase(extra){
  return Object.assign({
    backgroundColor:PAL.petroleo, padding:11, cornerRadius:6, displayColors:false,
    titleFont:{family:'Montserrat', size:12, weight:'700'},
    bodyFont:{family:'Montserrat', size:12}, bodySpacing:4,
    footerFont:{family:'Montserrat', size:11, weight:'600'}
  }, extra||{});
}
/* Grade recessiva, com a linha do zero um pouco mais firme (leitura de negativos). */
const gradeY = { color: c => (c.tick && c.tick.value === 0) ? PAL.line2 : PAL.grade, drawTicks:false };
/* Marca d'água diagonal: nenhum gráfico de exemplo sai daqui parecendo dado real. */
const PLUG_EXEMPLO = {
  id:'marcaExemplo',
  afterDatasetsDraw(chart){
    if (!DEMO || !chart.chartArea) return;
    const A = chart.chartArea, ctx = chart.ctx;
    ctx.save();
    ctx.beginPath(); ctx.rect(A.left, A.top, A.right-A.left, A.bottom-A.top); ctx.clip();
    ctx.translate((A.left+A.right)/2, (A.top+A.bottom)/2);
    ctx.rotate(-22 * Math.PI/180);
    ctx.font = '800 15px Montserrat, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(176,95,18,.13)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const passoX = 240, passoY = 88, larg = A.right-A.left, alt = A.bottom-A.top;
    const nx = Math.ceil(larg/passoX)+2, ny = Math.ceil(alt/passoY)+2;
    for (let i = -nx; i <= nx; i++) for (let j = -ny; j <= ny; j++)
      ctx.fillText('EXEMPLO', i*passoX + (j%2 ? passoX/2 : 0), j*passoY);
    ctx.restore();
  }
};
function semGrafico(idCanvas, msg){
  const cv = document.getElementById(idCanvas); if (!cv) return;
  const caixa = cv.parentElement; if (!caixa) return;
  caixa.style.height = 'auto';
  caixa.innerHTML = '<div class="sem-grafico">' + esc(msg) + '</div>';
}
function legenda(id, itens){
  const lg = document.getElementById(id); if (!lg) return;
  lg.innerHTML = itens.map(it => '<span class="leg-item"><i class="leg-sw' + (it.linha ? ' linha' : '') + '"' +
    (it.linha ? ' style="border-top-color:' + it.cor + '"' : ' style="background:' + it.cor + '"') + '></i>' +
    esc(it.nome) + (it.valor ? ' <b>' + esc(it.valor) + '</b>' : '') + '</span>').join('');
}

/* 1 — "Como foi cada mês": barras (entrou) + linha (sobrou). MESMA unidade,
       MESMO eixo. É o jeito honesto de mostrar as duas coisas juntas. */
function graficoEvolucao(M){
  const D = M.dre, meses = M.mesesFluxo.length ? M.mesesFluxo : M.meses;
  if (!temChart()) return semGrafico('g-evolucao','Não consegui carregar o gráfico agora. Os números continuam completos nas tabelas abaixo.');
  if (meses.length < 2){
    return semGrafico('g-evolucao','Ainda há só um mês de contabilidade no painel — um gráfico de um ponto só não diz nada. ' +
      'A partir do segundo mês fechado, a linha do tempo aparece aqui.');
  }
  const entrou  = meses.map(m => V(D,'receita_liquida',m));
  const sobrou  = meses.map(m => V(D,'lucro_liquido',m));
  const cv = document.getElementById('g-evolucao'); if (!cv) return;
  new Chart(cv, {
    data:{ labels: meses.map(mesCurtoLbl), datasets:[
      { type:'bar', label:'Entrou', data:entrou, backgroundColor:COR.entra, borderWidth:0, maxBarThickness:42, order:2 },
      { type:'line', label:'Sobrou', data:sobrou, borderColor:COR.resultado, backgroundColor:COR.resultado,
        borderWidth:2.5, tension:0, pointRadius:3, pointHoverRadius:6, pointBackgroundColor:'#fff',
        pointBorderColor:COR.resultado, pointBorderWidth:2, order:1 }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:500},
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ display:false },
        tooltip: tooltipBase({ callbacks:{
          title: it => mesExtenso(meses[it[0].dataIndex]),
          label: c => ' ' + (c.dataset.label === 'Entrou' ? 'Entrou (sem impostos): ' : 'Sobrou no fim: ') +
            (c.parsed.y == null ? '—' : brl(c.parsed.y)),
          footer: it => { const i = it[0].dataIndex, e = entrou[i], s = sobrou[i];
            return (e && s != null) ? 'Margem: ' + pctBR(s/e*100,1) : ''; }
        } }) },
      scales:{
        x:{ grid:{ display:false }, border:{ color:PAL.line },
          ticks:{ color:PAL.muted, font:FONTE, maxRotation:0, autoSkip:true, maxTicksLimit:12 } },
        y:{ grid:gradeY, border:{ display:false },
          ticks:{ color:PAL.muted, font:FONTE, maxTicksLimit:5, padding:8, callback:v => brlCurto(v) } }
      }
    },
    plugins:[PLUG_EXEMPLO]
  });
  const totE = entrou.reduce((s,v)=>s+(v||0),0), totS = sobrou.reduce((s,v)=>s+(v||0),0);
  legenda('g-evolucao-lg', [
    { cor:COR.entra, nome:'Entrou (barras)', valor: brlCurto(totE) + ' no período' },
    { cor:COR.resultado, nome:'Sobrou (linha)', valor: brlCurto(totS) + ' no período', linha:true }
  ]);
}

/* 2 — Cascata da DRE: do faturamento até o que sobrou, em degraus.
       Barras flutuantes ([início, fim]) — waterfall de verdade, sem gambiarra. */
function graficoCascata(M){
  const D = M.dre, m = M.ultimo;
  if (!temChart() || !m) return semGrafico('g-cascata','O detalhe mês a mês está na tabela logo abaixo.');
  const rb = V(D,'receita_bruta',m), ded = V0(D,'deducoes',m), cus = V0(D,'custos',m),
        des = V0(D,'despesas',m), ll = V(D,'lucro_liquido',m);
  if (rb == null || ll == null) return semGrafico('g-cascata','A tabela abaixo mostra as linhas que temos deste mês.');
  const outros = ll - (rb + ded + cus + des);       // juros, desgaste, IR e o que mais houver
  const passos = [
    { rot:'Faturou',  tipo:'total', valor: rb, expl:'Tudo o que a empresa faturou no mês.' },
    { rot:'Impostos', tipo:'sai',   valor: ded, expl:'Impostos que saem direto da nota, cancelamentos e devoluções.' },
    { rot:'Custos',   tipo:'sai',   valor: cus, expl:'O que foi preciso gastar para entregar o serviço.' },
    { rot:'Despesas', tipo:'sai',   valor: des, expl:'O que mantém a empresa de pé: administração, taxas, estrutura.' },
    { rot:'Outros',   tipo:'mix',   valor: outros, expl:'Juros, rendimentos, desgaste de bens e imposto sobre o lucro.' },
    { rot:'Sobrou',   tipo:'total', valor: ll, expl:'O que ficou no fim do mês.' }
  ];
  let acc = 0;
  const dados = [], cores = [];
  passos.forEach(p => {
    if (p.tipo === 'total'){ dados.push([0, p.valor]); acc = p.valor; }
    else { dados.push([acc, acc + p.valor]); acc += p.valor; }
    cores.push(p.tipo === 'total' ? (p.valor < 0 ? PAL.ruim : COR.resultado)
      : (p.valor < 0 ? COR.sai : COR.entra));
  });
  const cv = document.getElementById('g-cascata'); if (!cv) return;
  new Chart(cv, {
    type:'bar',
    data:{ labels: passos.map(p => p.rot), datasets:[{ label:'Degraus do mês', data:dados,
      backgroundColor:cores, borderWidth:0, maxBarThickness:56 }] },
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:500},
      plugins:{ legend:{ display:false },
        tooltip: tooltipBase({ callbacks:{
          title: it => passos[it[0].dataIndex].rot,
          label: c => { const p = passos[c.dataIndex];
            return ' ' + (p.tipo === 'total' ? brl(p.valor) : (p.valor < 0 ? '− ' : '+ ') + brl(Math.abs(p.valor))); },
          footer: it => passos[it[0].dataIndex].expl
        } }) },
      scales:{
        x:{ grid:{ display:false }, border:{ color:PAL.line },
          ticks:{ color:PAL.muted, font:{family:'Montserrat', size:10, weight:'700'}, maxRotation:0, autoSkip:false } },
        y:{ grid:gradeY, border:{ display:false },
          ticks:{ color:PAL.muted, font:FONTE, maxTicksLimit:5, padding:8, callback:v => brlCurto(v) } }
      }
    },
    plugins:[PLUG_EXEMPLO]
  });
  const temSaida = passos.some(p => p.tipo !== 'total' && p.valor < 0);
  const temEntrada = passos.some(p => p.tipo !== 'total' && p.valor > 0);
  legenda('g-cascata-lg', [{ cor:COR.resultado, nome:'Ponto de partida e de chegada' }]
    .concat(temSaida ? [{ cor:COR.sai, nome:'O que saiu' }] : [])
    .concat(temEntrada ? [{ cor:COR.entra, nome:'O que entrou' }] : []));
}

/* 3 — Balanço: parte-de-um-todo -> barra EMPILHADA HORIZONTAL (nunca pizza).
       As duas barras dividem a mesma escala: dá para ver de olho se fecham. */
function graficoBalanco(M){
  const m = M.ultimoBP;
  if (!temChart() || !m) return semGrafico('g-balanco','As tabelas abaixo trazem os saldos conta a conta.');
  const ac = V0(M.ativo,'ativo_circulante',m), anc = V0(M.ativo,'ativo_nao_circulante',m);
  const pc = V0(M.passivo,'passivo_circulante',m), pnc = V0(M.passivo,'passivo_nao_circulante',m),
        pl = V0(M.passivo,'pl',m);
  const L = ['O que tem', 'De quem é'];
  const ds = [
    { label:'Curto prazo (até 12 meses)', data:[ac, null],  cor:COR.entra },
    { label:'Longo prazo',                data:[anc, null], cor:PAL.escuro },
    { label:'Deve em até 12 meses',       data:[null, pc],  cor:COR.sai },
    { label:'Deve depois de 12 meses',    data:[null, pnc], cor:COR.despesa },
    { label:'É dos sócios',               data:[null, pl],  cor:COR.outros }
  ];
  const cv = document.getElementById('g-balanco'); if (!cv) return;
  new Chart(cv, {
    type:'bar',
    data:{ labels:L, datasets: ds.map(d => ({ label:d.label, data:d.data, backgroundColor:d.cor,
      borderWidth:0, barThickness:34 })) },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:{duration:500},
      plugins:{ legend:{ display:false },
        tooltip: tooltipBase({ callbacks:{
          title: it => it[0].label === 'O que tem' ? 'Tudo o que a empresa tem' : 'De quem é esse dinheiro',
          label: c => c.parsed.x == null ? '' : ' ' + c.dataset.label + ': ' + brl(c.parsed.x) } }) },
      scales:{
        x:{ stacked:true, beginAtZero:true, grid:gradeY, border:{ display:false },
          ticks:{ color:PAL.muted, font:FONTE, maxTicksLimit:4, callback:v => brlCurto(v) } },
        y:{ stacked:true, grid:{ display:false }, border:{ color:PAL.line },
          ticks:{ color:PAL.muted, font:{family:'Montserrat', size:12, weight:'700'} } }
      }
    },
    plugins:[PLUG_EXEMPLO]
  });
  legenda('g-balanco-lg', ds.filter(d => (d.data[0]||d.data[1])).map(d => ({
    cor:d.cor, nome:d.label, valor: brlCurto(d.data[0] != null ? d.data[0] : d.data[1]) })));
}

/* 4 — "Para onde foi o dinheiro": empilhada só onde há decomposição real
       de um total (custos + despesas + outras saídas = tudo o que saiu). */
function graficoMeses(M){
  const D = M.dre, meses = M.mesesFluxo;
  if (!temChart() || meses.length < 2) return semGrafico('g-meses','A tabela abaixo mostra mês a mês.');
  const abs = (k,m) => Math.max(0, -V0(D,k,m));
  const custos = meses.map(m => abs('custos',m));
  const desp   = meses.map(m => abs('despesas',m));
  const outras = meses.map((m,i) => {
    const rl = V(D,'receita_liquida',m), ll = V(D,'lucro_liquido',m);
    if (rl == null || ll == null) return 0;
    return Math.max(0, (rl - ll) - custos[i] - desp[i]);
  });
  const cv = document.getElementById('g-meses'); if (!cv) return;
  const ds = [
    { label:'Custos', data:custos, cor:COR.sai },
    { label:'Despesas', data:desp, cor:COR.despesa },
    { label:'Juros, desgaste e IR', data:outras, cor:COR.outros }
  ];
  new Chart(cv, {
    type:'bar',
    data:{ labels: meses.map(mesCurtoLbl), datasets: ds.map(d => ({ label:d.label, data:d.data,
      backgroundColor:d.cor, borderWidth:0, stack:'s', maxBarThickness:42 })) },
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:500},
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ display:false },
        tooltip: tooltipBase({ callbacks:{
          title: it => mesExtenso(meses[it[0].dataIndex]),
          label: c => ' ' + c.dataset.label + ': ' + brl(c.parsed.y),
          footer: it => { const i = it[0].dataIndex;
            const total = it.reduce((s,x)=>s+(x.parsed.y||0),0), ll = V(D,'lucro_liquido',meses[i]);
            return 'Saiu no mês: ' + brl(total) + (ll != null ? '\nSobrou: ' + brl(ll) : ''); }
        } }) },
      scales:{
        x:{ stacked:true, grid:{ display:false }, border:{ color:PAL.line },
          ticks:{ color:PAL.muted, font:FONTE, maxRotation:0, autoSkip:true, maxTicksLimit:12 } },
        y:{ stacked:true, beginAtZero:true, grid:gradeY, border:{ display:false },
          ticks:{ color:PAL.muted, font:FONTE, maxTicksLimit:5, padding:8, callback:v => brlCurto(v) } }
      }
    },
    plugins:[PLUG_EXEMPLO]
  });
  legenda('g-meses-lg', ds.map((d,i) => ({ cor:d.cor, nome:d.label,
    valor: brlCurto(d.data.reduce((s,v)=>s+v,0)) })));
}

/* Em subpágina, sem login volta ao index; com id+código mostra aviso amigável. */
function erro(e){
  var ic = getIdCodigo(), id = ic.id, codigo = ic.codigo;
  var amigavel = (window.B4U && B4U.msgAmigavel) ? B4U.msgAmigavel(e) : '';
  if (!id || !codigo){ location.replace('index.html' + (id ? ('#'+id+(codigo?'-'+codigo:'')) : (location.hash||''))); return; }
  var volta = 'index.html#' + id + (codigo ? ('-'+codigo) : '');
  document.body.innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;'
   +'font-family:\'Montserrat\',system-ui,-apple-system,sans-serif;background:#F1E7DC;color:#113D39">'
   +'<div style="max-width:440px;text-align:center;background:#FFFFFF;border:1px solid #E4D9C9;'
   +'border-radius:16px;padding:32px 28px;box-shadow:0 6px 24px rgba(7,48,52,.06)">'
   +'<div style="font-size:24px;line-height:1;margin-bottom:10px">📄</div>'
   +'<h2 style="margin:0 0 8px;font-size:19px">Não foi possível carregar suas informações agora.</h2>'
   +'<p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#3F5854">'+(amigavel||'Se você acredita que isto é um erro, fale com o nosso atendimento que resolvemos rápido.')+'</p>'
   +'<a href="https://wa.me/5511937173906" target="_blank" rel="noopener" style="display:inline-block;background:#0C756F;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;font-size:15px">Falar com o atendimento</a>'
   +'<div style="margin-top:14px"><a href="'+volta+'" style="color:#0C756F;font-size:13px;text-decoration:none">Voltar ao início</a></div>'
   +'</div></div>';
}

/* "sem link de contabil" (Indice.gs) e parentes: não é erro do cliente —
   é a planilha que ainda não existe. Vai para o estado vazio. */
const RE_SEM_PLANILHA = /sem\s+link\s+de\s+cont|link\s+de\s+cont[aá]bil|planilha\s+de\s+cont|sem\s+planilha|n[ãa]o\s+configurad/i;

async function carregar(){
  const { id, codigo } = getIdCodigo();
  IDENTIDADE = { id, codigo };
  if (DEMO) return dadosExemplo();
  if (!id) throw new Error('Informe o ID do cliente no final do endereço.');
  if (!codigo) throw new Error('Informe também o código de acesso, no formato #482913-CODIGO.');
  const url = API_URL + '?id=' + encodeURIComponent(id) + '&codigo=' + encodeURIComponent(codigo) + '&tipo=contabil';
  const d = await jsonp(url);
  if (d && d.erro) throw new Error(d.erro);
  return d;
}

/* Olhar a mesma frase por 45s é lido como "travou" — e ele recarrega, jogando fora o
   pedido que já estava a caminho. Trocar o texto é barato e compra paciência. */
var _tEspera = [
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Estamos buscando os seus dados na planilha…'; }, 4000),
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Está demorando mais que o normal — continuamos tentando.'; }, 10000),
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Quase lá — a primeira abertura do dia é a mais lenta.'; }, 20000)
];
function pararEspera(){ _tEspera.forEach(clearTimeout); }

/* Tarja discreta do cache: diz que o que está na tela veio do último acesso. */
function tarja(texto, falhou){
  const slot = document.getElementById('tarja-slot'); if (!slot) return;
  slot.innerHTML = texto ? '<div class="tarja-atualizando' + (falhou?' falhou':'') + '">' + esc(texto) + '</div>' : '';
}
function horaCache(ts){ return ts ? new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : 'antes'; }

/* O estado vazio e o modo exemplo desenham a página inteira; só o painel COM dados
   é que pode ser pintado do cache e redesenhado por baixo. */
function mostrar(M){ if (!M.temDados){ estadoVazio(M); return false; } render(M); return true; }

(async function(){
  const ic = getIdCodigo();
  let pintadoDoCache = false, tsCache = 0;
  /* A segunda visita não recomeça do esqueleto. No modo exemplo não há cache: os
     números são fictícios e vêm prontos da própria página. */
  if (!DEMO && ic.id && window.B4U && B4U.cacheLer){
    const bruto = B4U.cacheLer('contabil', ic.id);
    if (bruto){
      try {
        IDENTIDADE = ic;
        const Mc = preparar(bruto);
        if (Mc.temDados){ tsCache = bruto.atualizado_em || 0;
          pararEspera(); render(Mc); tarja('Atualizando…'); pintadoDoCache = true; }
      } catch(err){ /* cache velho ou de outro formato: ignora e busca de novo */ }
    }
  }
  try {
    const raw = await carregar();
    if (!DEMO && ic.id && window.B4U && B4U.cacheGravar) B4U.cacheGravar('contabil', ic.id, raw);
    const M = preparar(raw);
    /* Hoje `temDados:false` é a resposta de todo cliente — é o caminho NORMAL,
       e tem de ser digno: estado vazio explicando, nunca tela de erro. */
    pararEspera();
    if (mostrar(M)) tarja('');
  } catch (e) {
    pararEspera();
    const msg = (e && e.message) || String(e);
    if (RE_SEM_PLANILHA.test(msg)){ estadoVazio(null); return; }
    if (pintadoDoCache){ tarja('Não consegui atualizar agora — mostrando os dados de '+horaCache(tsCache)+'.', true); return; }
    erro(e);
  }
})();
