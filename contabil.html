<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contábil — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- São DUAS origens porque o /exec responde 302 para a segunda: sem isto o aparelho
     paga DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte deixa de bloquear a primeira pintura: o esqueleto aparece antes dela. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"></noscript>
<!-- chart.js sai do meio do corpo: com defer ele executa antes do DOMContentLoaded,
     muito antes de o JSONP responder, e não atrasa a primeira pintura. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<style>
:root{
  /* PALETA CANÔNICA — igual nas outras páginas do cliente. Não redeclare tons aqui. */
  --canvas:#F1E7DC; --surface:#FFFFFF; --surface-warm:#FBF6EF;
  --ink:#113D39; --ink-2:#3F5854; --muted:#6E6256; --line:#E4D9C9; --line-2:#D6C3AC;
  --brand-dark:#073034; --brand-teal:#0F8C85; --brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,44:1 no receita-soft).
     Este é o mesmo teal escurecido só para texto e fundo de texto; o --brand-teal
     continua canônico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E; --amber-txt:#8A5A10; --vermelho:#C0392B; --verde:#2E9D5F;
  /* Escala tipográfica — 6 passos, sem meio pixel. */
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:15px; --fs-5:19px; --fs-6:24px;
  /* Raios — 12 padrão, 16 para caixas grandes, 999 só para pílulas. */
  --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-pill:999px;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  --receita:var(--brand-teal); --receita-soft:#DBEFEC;
  --g-ok:#2E9D5F;  --g-ok-soft:#E7F4EC;  --g-ok-txt:#16713E;
  --g-and:#E8892E; --g-and-soft:#FCEEDF; --g-and-txt:#9A5410;
  --g-enc:#C0392B; --g-enc-soft:#F7E4E1; --g-enc-txt:#96271B;
  /* Slots categóricos — ordem fixa, já validada por contraste. */
  --slot1:#009488; --slot2:#B4530F; --slot3:#6B4FA0; --slot4:#7A8B3D;
  /* Escala de padding — três degraus no lugar dos 37 valores avulsos que havia aqui. */
  --pad-sm: 14px 16px;
  --pad:    18px 20px;
  --pad-lg: 24px 26px;
  --lift:   0 8px 20px rgba(17,61,57,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:var(--fs-4);line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lbl{font-size:var(--fs-1);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:4px}
/* Campo com menos de 16px faz o Safari ampliar a página inteira ao focar. Só os campos. */
input,select,textarea{font-size:16px}
/* Uma amostra de cor só — a mesma medida em todas as páginas do painel. */
.sw,.leg-sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}
/* Tarja de cache: o que está na tela é do último acesso e já está sendo atualizado. */
.tarja-atualizando{font-size:var(--fs-2);font-weight:600;color:var(--brand-dark);
  background:var(--receita-soft);border-radius:var(--radius-pill);padding:6px 14px;margin:14px 0 0;
  display:inline-flex;align-items:center;gap:8px}
.tarja-atualizando.falhou{background:#FCEFE0;color:#8A5A10}

header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:var(--b4u-bar-h,0px);z-index:30}
.bar{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:var(--fs-5);letter-spacing:-.02em;line-height:1}
.logo .b{color:var(--brand-dark)} .logo .y{color:var(--brand-teal)}
/* Razão social + CNPJ é o que confirma "esta é a minha empresa": 15px em teal
   puro dá 4,11:1. Escurecido, 5,54:1. */
.brand-sub{font-size:var(--fs-4);color:var(--brand-teal-txt);font-weight:700;margin-top:2px}
.spacer{flex:1}
/* 11px sobre o verde claro: teal puro dá 3,44:1. Escurecido, 4,64:1. */
.badge-topo{font-size:var(--fs-1);font-weight:700;color:var(--brand-teal-txt);background:var(--receita-soft);padding:5px 12px;border-radius:var(--radius-pill)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:32px 0 14px}
.sec-head h2{font-size:var(--fs-5);font-weight:700;letter-spacing:-.01em}
.sec-head p{font-size:var(--fs-3);color:var(--muted)}

/* ════════ Selo de EXEMPLO — permanente enquanto o modo estiver ativo ════════ */
.selo{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-1);font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-pill);background:#FCEEDF;color:var(--amber-txt);
  /* O --amber-txt era #B05F12 e dava 4,10:1 em 11px sobre este creme. Agora ele É o
     mesmo âmbar escurecido (#8A5A10) que o societário já usava: 5,19:1. */
  border:1px solid #F0D9A8;white-space:nowrap;vertical-align:middle}
/* Véu de 20% sobre o lado claro do gradiente deixa o branco em 3,03:1. Placa sólida,
   como no herói do societário: 14,18:1 — e o selo passa a saltar, que é o ponto. */
.heroi .selo{background:#fff;color:var(--brand-dark);border-color:#fff}
.faixa-demo{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;max-width:1180px;margin:0 auto;
  padding:10px 24px 12px;color:#6B5326;font-size:var(--fs-2);line-height:1.45}
header.demo{background:#FFF6E9;border-bottom-color:#F0D9A8}
.faixa-demo b{color:#5A4413;font-weight:800}
.faixa-demo .fd-txt{flex:1;min-width:200px}
.faixa-btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-family:var(--sans);
  font-size:var(--fs-2);font-weight:700;padding:8px 14px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap}
.faixa-btn:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
@media(max-width:640px){.faixa-demo{padding:9px 14px 11px}}

/* ════════ Topo: número-herói + fila de indicadores ════════ */
.heroi{margin:24px 0 0;padding:var(--pad-lg);border:none;border-radius:var(--radius-lg);color:#fff;
  /* O gradiente da marca clareia no canto de baixo: medido a 390px, o branco cai para
     4,38:1 justamente na última linha. O véu escuro devolve o contraste sem trocar a cor. */
  background:linear-gradient(180deg,rgba(7,48,52,0) 45%,rgba(7,48,52,.22) 100%),
             linear-gradient(124deg,var(--brand-dark) 0%,var(--brand-teal) 100%);
  box-shadow:0 18px 38px -18px rgba(6,48,51,.6)}
/* 11px maiúsculo sobre o lado claro do gradiente não pode ser branco a 82% (3,7:1). */
.heroi .lbl{color:#fff}
.heroi-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.heroi-v{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1.04;margin-top:8px;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media(min-width:720px){.heroi-v{font-size:56px}}
@media(max-width:420px){.heroi-v{font-size:34px}}
.heroi-v.neg{color:#FFC9C2}
/* branco a 90% sobre o lado claro do gradiente dá 4,24:1 a 390px — texto corrido
   de 15px precisa de 4,5. Branco cheio; a hierarquia fica no <b>, não na opacidade. */
.heroi-sub{font-size:var(--fs-4);color:#fff;margin-top:10px;line-height:1.5;max-width:54ch}
.heroi-sub b{color:#fff;font-weight:800}
.heroi-pe{font-size:var(--fs-2);color:#fff;margin-top:14px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-top:14px}
.tile{padding:var(--pad)}
.tile .v{font-size:clamp(15px,4.2vw,24px);font-weight:800;letter-spacing:-.02em;margin-top:7px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .s{font-size:var(--fs-2);color:var(--muted);margin-top:4px;line-height:1.45}
.tile-ok .v{color:var(--g-ok-txt)}
.tile-ruim .v{color:var(--g-enc-txt)}
@media(max-width:640px){.tiles{grid-template-columns:1fr 1fr;gap:10px}.tile{padding:14px 12px}}
@media(max-width:359px){.tiles{grid-template-columns:1fr}}

/* seta de variação — a COR segue a polaridade do indicador, não o sinal do número */
.delta{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-2);font-weight:700;margin-top:5px;
  font-variant-numeric:tabular-nums}
.delta.bom{color:var(--g-ok-txt)} .delta.ruim{color:var(--g-enc-txt)} .delta.neutro{color:var(--muted)}
.delta i{font-style:normal;font-size:var(--fs-1)}

/* ════════ Blocos recolhidos ════════ */
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);margin-top:12px;overflow:hidden}
.bloco>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:var(--pad);min-height:44px}
.bloco>summary::-webkit-details-marker{display:none}
.bloco>summary::marker{content:''}
.bloco>summary:hover{background:var(--surface-warm)}
.bloco>summary:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.bloco[open]>summary{background:var(--surface-warm);border-bottom:1px solid var(--line)}
.bloco-t{flex:1;min-width:0}
.bloco-t b{display:block;font-size:var(--fs-4);font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.bloco-t span{display:block;font-size:var(--fs-2);color:var(--muted);margin-top:2px;line-height:1.45}
.chev{flex-shrink:0;width:20px;height:20px;color:var(--muted);transition:transform .22s ease}
.bloco[open]>summary .chev{transform:rotate(180deg)}
.bloco-body{padding:var(--pad)}
.bloco-nota{font-size:var(--fs-2);color:var(--ink-2);line-height:1.55;background:var(--surface-warm);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:14px}
.bloco-nota b{color:var(--ink)}
@media(max-width:640px){.bloco>summary{padding:15px 15px;gap:10px}.bloco-body{padding:14px 15px 18px}}

/* ════════ Gráficos ════════ */
.chart{padding:var(--pad)}
.graf-titulo{font-size:var(--fs-4);font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.graf-sub{font-size:var(--fs-2);color:var(--muted);margin-bottom:14px;line-height:1.45}
.cbox-alto{position:relative;height:300px}
.cbox{position:relative;height:230px}
.cbox-baixo{position:relative;height:150px}
@media(max-width:640px){.cbox-alto{height:250px}.cbox{height:210px}}
.leg{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px}
.leg-item{display:flex;align-items:center;gap:8px;font-size:var(--fs-2);color:var(--ink-2);font-weight:600}

.leg-sw.linha{height:0;border-top:3px solid var(--brand-dark);border-radius:0}
.leg-item b{color:var(--ink);font-variant-numeric:tabular-nums}
.sem-grafico{font-size:var(--fs-3);color:var(--muted);background:var(--surface-warm);border:1px dashed var(--line-2);
  border-radius:var(--radius-sm);padding:18px;text-align:center;line-height:1.6}

/* ════════ Tabelas (DRE e Balanço) ════════ */
.tab-rol{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius)}
table.tab{width:100%;border-collapse:collapse;font-size:var(--fs-3);background:var(--surface)}
table.tab th,table.tab td{padding:9px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
table.tab thead th{position:sticky;top:0;background:var(--surface-warm);z-index:2;font-size:var(--fs-1);
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;border-top:none}
table.tab th.conta,table.tab td.conta{text-align:left;white-space:normal;min-width:190px;position:sticky;left:0;
  background:var(--surface);z-index:1}
table.tab thead th.conta{background:var(--surface-warm);z-index:3}
table.tab tbody tr:hover td{background:var(--surface-warm)}
table.tab tbody tr:hover td.conta{background:var(--surface-warm)}
.c-nome{font-weight:600;color:var(--ink);display:block;line-height:1.35}
.c-tec{display:block;font-size:var(--fs-1);color:var(--muted);font-weight:600;margin-top:1px}
tr.n1 td.conta{padding-left:26px} tr.n2 td.conta{padding-left:40px}
tr.n1 .c-nome,tr.n2 .c-nome{font-weight:400;color:var(--ink-2)}
tr.total td{font-weight:800;background:#FAF5EE}
tr.total td.conta{background:#FAF5EE}
tr.total .c-nome{font-weight:800;color:var(--ink)}
tr.destaque td{background:var(--receita-soft);border-top:2px solid var(--brand-teal)}
tr.destaque td.conta{background:var(--receita-soft)}
tr.destaque .c-nome{color:var(--brand-dark)}
td.v{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
td.v.saida{color:var(--slot2)}
td.v.zero{color:var(--line-2)}
td.av{font-variant-numeric:tabular-nums;color:var(--muted);font-size:var(--fs-2)}
.tab-legenda{font-size:var(--fs-2);color:var(--muted);margin-top:10px;line-height:1.5}
@media(max-width:640px){table.tab th,table.tab td{padding:8px 9px}table.tab th.conta,table.tab td.conta{min-width:158px}}
/* Dois botões de propósito: "mais 20" para quem lê de cima para baixo, "todos"
   para quem vai usar Ctrl+F ou imprimir. Um só obrigaria a escolher entre
   paciência e controle. */
.lista-mais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.lista-mais button{min-height:44px;padding:0 18px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--brand-teal-txt);
  font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.lista-mais button:hover{border-color:var(--brand-teal);background:var(--receita-soft)}
.lista-mais .btn-todos{background:transparent;color:var(--ink-2);font-weight:600}

/* barra de proporção (parte-de-um-todo) */
.prop{display:flex;height:16px;border-radius:var(--radius-pill);overflow:hidden;background:#EFE6D6;border:1px solid var(--line)}
.prop i{display:block;height:100%}

/* ════════ Indicadores ════════ */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
.ind{padding:var(--pad);background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius)}
.ind-v{font-size:var(--fs-6);font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.ind-s{font-size:var(--fs-2);color:var(--ink-2);margin-top:6px;line-height:1.5}
.como{margin-top:11px;border-top:1px dashed var(--line-2);padding-top:9px}
.como>summary{list-style:none;cursor:pointer;font-size:var(--fs-2);font-weight:700;color:var(--brand-teal-txt);
  display:flex;align-items:center;gap:6px}
.como>summary::-webkit-details-marker{display:none}
.como>summary::marker{content:''}
.como>summary:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}
.como[open]>summary .chev-mini{transform:rotate(180deg)}
.chev-mini{width:14px;height:14px;transition:transform .2s}
.formula{margin-top:8px;font-size:var(--fs-2);color:var(--ink-2);line-height:1.65}
.formula code{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:9px 11px;margin:6px 0;font-family:var(--sans);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:normal;overflow-wrap:anywhere}

/* ════════ Estados ════════ */
/* a bolinha de carregar saiu: quem espera agora é o esqueleto no formato da página */
.espera{margin-top:18px;text-align:center;font-size:var(--fs-3);color:var(--muted);min-height:1.4em}
.vazio-card{margin-top:26px;padding:var(--pad-lg);border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line)}
.vazio-ico{width:56px;height:56px;border-radius:var(--radius);background:var(--receita-soft);color:var(--brand-teal);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.vazio-ico svg{width:30px;height:30px}
.vazio-card h2{font-size:var(--fs-5);font-weight:800;letter-spacing:-.01em}
.vazio-card p{font-size:var(--fs-4);color:var(--ink-2);line-height:1.6;margin-top:8px;max-width:56ch}
.vazio-lista{list-style:none;margin:18px 0 0;display:grid;gap:9px}
.vazio-lista li{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-3);color:var(--ink-2);line-height:1.5}
.vazio-lista .mk{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--receita-soft);color:var(--brand-teal-txt);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-1);font-weight:800;margin-top:1px}
.vazio-acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-family:var(--sans);font-weight:700;
  font-size:var(--fs-3);padding:12px 20px;border-radius:var(--radius-pill);text-decoration:none;transition:background .15s}
.btn.primario{background:var(--brand-teal-txt);color:#fff} .btn.primario:hover{background:var(--brand-dark)}
.btn.secundario{background:var(--canvas);color:var(--ink-2);border:1px solid var(--line-2)}
.btn.secundario:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:var(--pad-sm);margin-top:14px;background:#FFF6E9;
  border:1px solid #F0D9A8;border-radius:var(--radius-sm);color:#6B5326;font-size:var(--fs-2);line-height:1.55}
.aviso .ai{font-size:var(--fs-4);line-height:1.2;color:var(--amber-txt);flex-shrink:0}
.aviso b{color:#5A4413}

footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-2);color:var(--muted);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:640px){
  /* No celular a escala inteira encolhe de uma vez, pelos tokens. */
  :root{--pad-sm:12px 13px;--pad:15px 16px;--pad-lg:18px 18px}
  .wrap{padding:0 14px 60px}
  .sec-head{margin:22px 0 10px}
  /* razão social + CNPJ do cliente não podem virar 11px: ficam menores que o texto ao lado */
  .brand-sub{font-size:var(--fs-3)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<script src="config.js"></script>
</head>
<body>
<!--B4U:START-->
<style id="b4u-oculta-chamado">/* Abertura de chamado oculta por ora. O "?" (#b4u-help) abre ESTE MESMO modal:
   deixá-lo visível era uma porta de serviço para um recurso que decidimos segurar. */ #b4u-open,#ac-abrir,#b4u-help{display:none!important}</style>
<script>window.B4U = { area:'contabil' };</script>
<!-- ═══════════ back4you · cabeçalho + chamados (compartilhado) ═══════════
     Bloco único, autocontido e com prefixo .b4u- (não conflita com o CSS da
     página). Cole logo depois de <body>, e ANTES dele defina:
        <script>window.B4U = { area:'fiscal' };</script>
     area = área padrão do chamado desta página
        (fiscal | dpto_pessoal | contabil | societario | equiparacao | outros)
     home:true  -> esconde o botão "Início" (usar só no index).

    var t = ov.querySelector('#b4u-msg'), a = ov.querySelector('#b4u-assunto');

  function tentarFechar(){ if(modalSujo()) pedirDescartar(); else fecharModal(); }
  function montarFoot(){
    var foot = ov.querySelector('.b4u-foot'); if(!foot) return;

  function pedirDescartar(){
    var foot = ov.querySelector('.b4u-foot'); if(!foot){ fecharModal(); return; }

      '<button type="button" class="b4u-btn cancel" id="b4u-keep">Continuar escrevendo</button>' +
      '<button type="button" class="b4u-btn primary" id="b4u-discard">Descartar o que escrevi</button>';
    var err = ov.querySelector('#b4u-erro');
    if(err) err.textContent = 'Você escreveu algo neste chamado. Quer mesmo sair sem enviar?';
    foot.querySelector('#b4u-keep').addEventListener('click', function(){
      if(err) err.textContent=''; montarFoot();

  }

  function abrir(opts){
    opts = opts || {};
    var areaSel = opts.area || CFG.area || 'outros';
    var tipoSel = opts.tipo || 'livre';
    if (tiposDaArea(areaSel).indexOf(tipoSel) < 0) tipoSel = tiposDaArea(areaSel)[0];   // tipo válido p/ a área
    ov.innerHTML =
      '<div class="b4u-modal" role="dialog" aria-modal="true" aria-label="Abrir chamado">' +

            DOCTIPOS.map(function(d){ return '<option value="'+d[0]+'">'+esc(d[1])+'</option>'; }).join('') +

        '</div>' +
        '<div class="b4u-err" id="b4u-erro"></div>' +
        '<div class="b4u-foot">' +
          '<button type="button" class="b4u-btn cancel" id="b4u-cancel">Cancelar</button>' +
          '<button type="button" class="b4u-btn primary" id="b4u-send">Enviar chamado</button>' +
        '</div>' +
      '</div>';
    ov.classList.add('on');
    var selTipo = ov.querySelector('#b4u-tipo');
    var txt = ov.querySelector('#b4u-msg');
    function aplicaSkeleton(force){
      var esq = TIPOS[selTipo.value] ? TIPOS[selTipo.value][1] : '';
      if(force || !txt.value.trim()) txt.value = esq;
      ESQ_ATUAL = esq;                 // referência do que ainda é "vazio", não texto dele
    }
    aplicaSkeleton(true);
    selTipo.addEventListener('change', function(){ aplicaSkeleton(true); txt.focus(); });
    // trocar a ÁREA repovoa os tipos válidos para ela
    ov.querySelector('#b4u-area').addEventListener('change', function(){

    ov.querySelector('#b4u-cancel').addEventListener('click', tentarFechar);
    ov.addEventListener('click', function(e){ if(e.target===ov) tentarFechar(); });
    ov.querySelector('#b4u-send').addEventListener('click', enviar);
    // o seletor de "tipo do documento" só aparece quando há um arquivo anexado
    var fileEl = ov.querySelector('#b4u-file');

  function enviar(){
    var cc = idc();
    var erroEl = ov.querySelector('#b4u-erro');
    var btn = ov.querySelector('#b4u-send');
    erroEl.textContent = '';
    if(!cc.id || !cc.codigo){ erroEl.textContent = 'Abra o painel pelo seu link (com ID e código) para enviar um chamado.'; return; }
    var area = ov.querySelector('#b4u-area').value;

    var assunto = ov.querySelector('#b4u-assunto').value.trim();
    var msg = ov.querySelector('#b4u-msg').value.trim();
    if(!msg){ erroEl.textContent = 'Escreva a mensagem do chamado.'; return; }
    var fileEl = ov.querySelector('#b4u-file');
    var file = fileEl && fileEl.files && fileEl.files[0];
    if(file && file.size > 10*1024*1024){ erroEl.textContent = 'O anexo tem mais de 10 MB. Envie um arquivo menor.'; return; }
    btn.disabled = true; btn.textContent = 'Enviando…';
    var falhou = function(e){ btn.disabled=false; btn.textContent='Enviar chamado'; erroEl.textContent = msgAmigavel(e); };
    if(file){
      // COM arquivo -> POST (JSONP/GET não comporta base64)
      var reader = new FileReader();
      reader.onload = function(){
        var base64 = String(reader.result||'').split(',')[1] || '';
        var tdEl = ov.querySelector('#b4u-tipodoc');
        var tipoDoc = (tdEl && tdEl.value) ? tdEl.value : 'principal';
        var body = JSON.stringify({ id:cc.id, codigo:cc.codigo, acao:'ticket_anexo',
          area:area, tipo:tipo, assunto:assunto, mensagem:msg, tipo_documento:tipoDoc,
          arquivo_nome:file.name, arquivo_tipo:file.type, arquivo_base64:base64 });
        fetch(api(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body })
          .then(function(r){ return r.json(); })
          .then(function(d){ if(d && d.erro) throw new Error(d.erro); sucesso(); })
          .catch(falhou);
      };
      reader.onerror = function(){ falhou(new Error('Não consegui ler o arquivo.')); };
      reader.readAsDataURL(file);
      return;
    }
    // SEM arquivo -> JSONP como sempre
    var qs = new URLSearchParams({ id:cc.id, codigo:cc.codigo, acao:'ticket',
      area:area, tipo:tipo, assunto:assunto, mensagem:msg });
    jsonp(api()+'?'+qs.toString()).then(function(d){
      if(d && d.erro) throw new Error(d.erro);
      sucesso();
    }).catch(falhou);

  function sucesso(){
    ov.innerHTML =
      '<div class="b4u-modal">' +
        '<div class="b4u-ok">' +
          '<div class="chk">'+IC.chk+'</div>' +

            '<a class="b4u-btn primary" id="b4u-ir-tickets" href="'+esc(linkTickets)+'">Ir para meus chamados</a>' +
          '</div>' +
        '</div>' +
      '</div>';
    ov.querySelector('#b4u-fecha').addEventListener('click', fecharModal);
    // Se já estou em meus chamados, trocar só o hash não recarrega — força o reload
    // para o novo chamado aparecer. Em outra página, navega normalmente.
    ov.querySelector('#b4u-ir-tickets').addEventListener('click', function(e){
      if (/meustickets\.html/i.test(location.pathname)){
        e.preventDefault();
        if (C.id) location.hash = C.id + (C.codigo ? '-'+C.codigo : '');
        location.reload();
      }
    });
  }

  bar.querySelector('#b4u-open').addEventListener('click', function(){ abrir({}); });
  bar.querySelector('#b4u-help').addEventListener('click', function(){ abrir({ area:'outros', tipo:'livre' }); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && ov.classList.contains('on')) tentarFechar(); });

  // ---- Puxar para atualizar (mobile) --------------------------------------
  // Só age quando a página está no topo e o gesto é para baixo; recarrega ao soltar
  // depois do limiar. Não atrapalha a rolagem normal.
  (function(){
    var ind=document.createElement('div'); ind.className='b4u-ptr';
    ind.innerHTML='<span class="ring"></span><span class="txt">Puxe para atualizar</span>';
    document.body.appendChild(ind);
    var y0=null, dist=0, LIM=70, ativo=false;
    function topo(){ return (window.scrollY||document.documentElement.scrollTop||0)<=0; }
    window.addEventListener('touchstart',function(e){
      if(e.touches.length!==1 || !topo() || (ov&&ov.classList.contains('on'))){ y0=null; return; }
      y0=e.touches[0].clientY; ativo=true;
    },{passive:true});
    window.addEventListener('touchmove',function(e){
      if(!ativo||y0===null) return;
      dist=e.touches[0].clientY - y0;
      if(dist<=0){ ind.style.height='0'; return; }
      if(!topo()){ ativo=false; ind.style.height='0'; return; }
      var h=Math.min(dist*0.5, LIM+20); ind.style.height=h+'px';
      ind.querySelector('.txt').textContent = dist>LIM?'Solte para atualizar':'Puxe para atualizar';
    },{passive:true});
    window.addEventListener('touchend',function(){
      if(!ativo){ return; } ativo=false;
      if(dist>LIM){ ind.classList.add('spin'); ind.style.height=(LIM)+'px'; ind.querySelector('.txt').textContent='Atualizando…'; setTimeout(function(){ location.reload(); },150); }
      else { ind.style.height='0'; }
      y0=null; dist=0;
    });
  })();

  window.B4U = { __ready:true, area: CFG.area||'outros', abrirChamado: abrir, meusTickets: linkTickets,
    msgAmigavel: msgAmigavel,
    CACHE_MS: CACHE_MS, cacheChave: cacheChave, cacheLer: cacheLer,
    cacheGravar: cacheGravar, limparCache: limparCache,
    // helper de skeleton: devolve N barrinhas "carregando" (as páginas usam no lugar do spinner)
    skeleton: function(linhas, alt){ var h=alt||16, g=[]; for(var i=0;i<(linhas||3);i++){
      var w=[92,78,85,60][i%4]; g.push('<div class="b4u-skel" style="height:'+h+'px;width:'+w+'%;margin:0 auto 12px"></div>'); }
      return g.join(''); } };
})();

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbxJ63h8C5A6lgDgd_xp9XIPk3uaa0ks04CD1hQTptcZNTDfGwQadPej5xResVknzshe/exec';

/* ══════════════════════════════════════════════════════════════════════════
   PAINEL CONTÁBIL DO CLIENTE — DRE + Balanço Patrimonial
   --------------------------------------------------------------------------
   ATENÇÃO (07/2026): ainda NÃO existe planilha contábil para nenhum cliente.
   A rota `&tipo=contabil` agora é PRÓPRIA (Contabil.gs · montarContabil_) e devolve
   o cabeçalho + `temDados:false` — antes ela caía no montarFiscal e a página baixava
   todas as notas do ano para desenhar "ainda não há DRE". Três mundos a atender:

     1) A planilha existe e a rota devolve DRE/Balanço  -> painel completo.
     2) A rota responde `temDados:false` (hoje, todos os clientes) ou o cliente
        está no índice "sem link de contabil" -> ESTADO VAZIO explicando, sem
        gráfico zerado e sem erro feio.
     3) A equipe quer mostrar ao cliente como vai ficar -> MODO EXEMPLO
        (?demo=1), com selo permanente em tudo o que é dado fictício.

   CONTRATO ESPERADO de ?tipo=contabil (o normalizador abaixo é tolerante:
   aceita as variações prováveis de quem for montar a planilha):

   {
     id, atualizado_em,
     temDados,                            // false = "ainda não"; decide sozinho
     config: { razao_social, cnpj, regime, ... },
     empresa: [ ... ],                    // aba Empresa, quando houver — não usada aqui
     contabil: {                          // ou tudo direto na raiz
       meses: ['2026-01','2026-02', ...], // opcional — deduzido das linhas
       dre: [                             // linhas da DRE (ordem livre)
         { conta:'Receita Bruta', valores:{ '2026-01':512624, '2026-02':... } },
         { conta:'(-) Custos',    valores:{ ... } }, ...
       ],
       balanco: {                         // ou array com campo bloco:'ativo'
         ativo:   [ { conta:'Caixa e Equivalentes', valores:{...} }, ... ],
         passivo: [ { conta:'Fornecedores a Pagar', valores:{...} }, ... ]
       }
     }
   }

   CONVENÇÃO DE SINAL (a lição nº 1 da referência): deduções, custos, despesas
   e provisões chegam NEGATIVOS. Se vierem positivos, o normalizador inverte —
   senão as margens estouram 100% (foi exatamente o bug dos dados demo da
   Nucont, com margem líquida de 194%).
   ══════════════════════════════════════════════════════════════════════════ */

/* Paleta dos gráficos.
   SEMÂNTICA fixa (encoding por significado, não por ordem de série):
     entra/receita = slot1 · sai/custos = slot2 · despesas = slot3 ·
     outros = slot4 · resultado/total = petróleo.
   Os 4 slots categóricos estão na ordem validada. */
const PAL = { petroleo:'#113D39', escuro:'#073034', muted:'#6E6256',
  line:'#E4D9C9', line2:'#D6C3AC', grade:'#EDE4D6',
  slot1:'#009488', slot2:'#B4530F', slot3:'#6B4FA0', slot4:'#7A8B3D',
  ok:'#2E9D5F', okTxt:'#16713E', ruim:'#C0392B', ruimTxt:'#96271B', amberTxt:'#B05F12' };
const COR = { entra:PAL.slot1, sai:PAL.slot2, despesa:PAL.slot3, outros:PAL.slot4, resultado:PAL.escuro };
const FONTE = { family:'Montserrat', size:11 };
/* chart.js está no <head> com defer: executa DEPOIS deste script inline, e muito
   antes de o JSONP responder. Por isso a checagem é uma função, avaliada na hora de
   desenhar — um `const` aqui em cima diria "não tem gráfico" para sempre. */
const temChart = () => typeof Chart !== 'undefined';

/* ───────────────────────── utilitários ───────────────────────── */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v == null || v === '') return 0;
  let s = String(v).trim().replace(/\s/g,'').replace(/^R\$/i,'');
  let neg = /^\(.*\)$/.test(s) || /^-/.test(s);          // (1.234,56) = negativo, como na DRE
  s = s.replace(/[()\-]/g,'');
  if (s.indexOf(',') > -1) s = s.replace(/\./g,'').replace(',','.');   // 1.234,56 -> 1234.56
  const n = parseFloat(s);
  if (!isFinite(n)) return 0;
  return neg ? -n : n;
};
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
/* Sem centavos — em tabela de 13 colunas o centavo só atrapalha a leitura. */
const brl0 = v => { const n = Math.round(Number(v)||0);
  return (n<0 ? '−' : '') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{maximumFractionDigits:0}); };
/* Reais abreviado para eixos: "R$ 120 mil", "R$ 1,2 mi". Nunca notação científica. */
function brlCurto(v){
  const n = Number(v)||0, a = Math.abs(n), s = n<0 ? '−' : '';
  const f = (x,d) => x.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d});
  if (a >= 1e9) return s+'R$ '+f(a/1e9,1)+' bi';
  if (a >= 1e6) return s+'R$ '+f(a/1e6,1)+' mi';
  if (a >= 1e3) return s+'R$ '+f(a/1e3, a<1e4?1:0)+' mil';
  return s+'R$ '+f(a,0);
}
const pctBR = (v,casas) => (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:casas==null?1:casas,maximumFractionDigits:casas==null?1:casas}) + '%';
const numBR = (v,casas) => (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:casas==null?2:casas,maximumFractionDigits:casas==null?2:casas});
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MES_LONGO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesExtenso = k => { const p = String(k).split('-'); return (MES_LONGO[(+p[1]||1)-1]||'') + ' de ' + p[0]; };
const mesCurtoLbl = k => { const p = String(k).split('-'); return (MES_CURTO[(+p[1]||1)-1]||'') + '/' + String(p[0]).slice(2); };
const normTxt = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[()=±+]/g,' ').replace(/[^a-z0-9%\/ ]/g,' ').replace(/\s+/g,' ').trim();
const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
function appendAll(parent, h){
  const t = document.createElement('template'); t.innerHTML = h.trim();
  Array.from(t.content.children).forEach(n => parent.appendChild(n));
}
/* Desenha só quando o bloco abre — canvas 0x0 dentro de <details> fechado não renderiza. */
function desenharAoAbrir(idBloco, fn){
  const d = document.getElementById(idBloco); if (!d) return;
  const roda = () => { if (d.dataset.drawn) return; d.dataset.drawn = '1';
    try { fn(); } catch(e){ console.warn('Gráfico indisponível:', e); } };
  if (d.open) roda();
  d.addEventListener('toggle', () => { if (d.open) roda(); });
}

/* ───────────── identidade (id + código na URL) e transporte ───────────── */
function getIdCodigo(){
  const qs = new URLSearchParams(location.search);
  let id = qs.get('id') || '';
  let codigo = qs.get('codigo') || '';
  const h = location.hash.replace('#','').trim();
  if (!id){
    const comCodigo = h.match(/^(\d+)-(.+)$/);
    const soId = h.match(/^(\d+)$/);
    if (comCodigo) { id = comCodigo[1]; codigo = comCodigo[2]; }
    else if (soId) { id = soId[1]; }
  }
  return { id: id.replace(/\D/g,''), codigo: codigo.trim() };
}
/* Modo exemplo: ?demo=1 na busca OU "&demo" depois do hash (#123-COD&demo). */
function querDemo(){
  const qs = new URLSearchParams(location.search);
  const v = (qs.get('demo') || '').toLowerCase();
  if (v === '1' || v === 'sim' || v === 'true') return true;
  return /(^|[&?])demo(=1|=sim|=true)?($|&)/i.test(location.hash || '');
}
function urlComDemo(ligar){
  const u = new URL(location.href);
  u.searchParams.delete('demo');
  u.hash = (u.hash || '').replace(/([&?])demo(=[^&]*)?/ig,'').replace(/[&?]$/,'');
  if (ligar) u.searchParams.set('demo','1');
  return u.toString();
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
function jsonpAviso(txt){
  const p = document.getElementById('espera-txt')
       || document.querySelector('#app .state p')
       || document.querySelector('.state p');
  if(p) p.textContent = txt;
}
function jsonpTentativa(url){
  return new Promise((ok,fail)=>{
    const cb = 'cb_'+Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(()=>{ limpa(); fail(new Error('A API não respondeu.')); }, JSONP_TETO);
    function limpa(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { limpa(); ok(d); };
    s.onerror = () => { limpa(); fail(new Error('Não consegui alcançar a API.')); };
    s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
    document.body.appendChild(s);
  });
}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. Enquanto
   espera, a tela diz que ainda estamos buscando — erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    if(typeof pararEspera === 'function'){ try{ pararEspera(); }catch(_){} }
    jsonpAviso('Ainda estou buscando — tentando de novo…');
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}

/* ═════════════════ NORMALIZAÇÃO DO QUE VEM DA API ═════════════════ */
const RE_MES = /^(\d{4})[-\/]?(\d{2})$/;
function chaveMes(v){
  const s = String(v==null?'':v).trim();
  let m = s.match(RE_MES);
  if (m) return m[1] + '-' + m[2];
  m = s.match(/^(\d{2})[-\/](\d{4})$/);                    // MM/AAAA
  if (m) return m[2] + '-' + m[1];
  m = s.match(/^(\d{4})-(\d{2})-\d{2}/);                   // AAAA-MM-DD
  if (m) return m[1] + '-' + m[2];
  return '';
}
/* Uma linha da planilha -> { nome, valores:{ 'AAAA-MM': número } }. Aceita
   valores num sub-objeto (valores/meses/periodos) ou direto na própria linha. */
function lerLinha(item, nomeChave){
  if (item == null) return null;
  const nome = String(nomeChave != null ? nomeChave
    : (item.conta || item.linha || item.nome || item.descricao || item.rotulo || '')).trim();
  const valores = {};
  const fonte = item.valores || item.meses || item.periodos || item.competencias || item;
  if (Array.isArray(fonte)){
    fonte.forEach(v => { const k = chaveMes(v && (v.competencia || v.mes || v.periodo)); if (k) valores[k] = num(v.valor != null ? v.valor : v.total); });
  } else if (typeof fonte === 'object'){
    Object.keys(fonte).forEach(kk => { const k = chaveMes(kk); if (k) valores[k] = num(fonte[kk]); });
  }
  if (!nome && !Object.keys(valores).length) return null;
  return { nome, valores };
}
function listaDeLinhas(bruto, nomeChave){
  if (!bruto) return [];
  if (Array.isArray(bruto)) return bruto.map(x => lerLinha(x)).filter(Boolean);
  if (typeof bruto === 'object'){
    return Object.keys(bruto).map(k => lerLinha(bruto[k], k)).filter(Boolean);
  }
  return [];
}
/* Casa a linha com uma das linhas canônicas. Sem chute: só bate o que é igual
   depois de normalizar — o que não bate vira "outra linha da planilha". */
function casar(nome, dicionario){
  const n = normTxt(nome);
  if (!n) return '';
  if (dicionario[n]) return dicionario[n];
  const semPrefixo = n.replace(/^(total( de| do| da)?|sub total|subtotal)\s+/,'');
  return dicionario[semPrefixo] || '';
}

const VAZIO_CONTABIL = { meses:[], dre:{}, ativo:{}, passivo:{}, extras:[],
  sinalCorrigido:false, temDRE:false, temBP:false, temDados:false };

function normalizarContabil(raw){
  /* A rota diz explicitamente se há contabilidade. Quando ela diz que não, é não:
     nada de adivinhar pela ausência de campos — era esse chute que fazia um payload
     de outra rota passar por "planilha contábil vazia". */
  if (raw && raw.temDados === false) return Object.assign({}, VAZIO_CONTABIL);
  const C = (raw && (raw.contabil || raw.contabilidade)) || raw || {};
  const linhasDRE = listaDeLinhas(C.dre || C.DRE || C.demonstrativo || C.resultado);
  let brutoBal = C.balanco || C.balanço || C.balancete || C.bp || null;
  let linhasAtivo = [], linhasPassivo = [], sobrasBal = [];
  if (Array.isArray(brutoBal)){
    brutoBal.map(x => ({ raw:x, l:lerLinha(x) })).forEach(o => {
      if (!o.l) return;
      const bloco = normTxt(o.raw && (o.raw.bloco || o.raw.grupo || o.raw.lado) || '');
      if (bloco.indexOf('ativo') === 0) linhasAtivo.push(o.l);
      else if (bloco) linhasPassivo.push(o.l);
      else sobrasBal.push(o.l);
    });
    /* Sem campo "bloco": decide pelo próprio nome da conta. */
    sobrasBal.forEach(l => {
      if (casar(l.nome, ATIVO_POR_NOME)) linhasAtivo.push(l);
      else if (casar(l.nome, PASSIVO_POR_NOME)) linhasPassivo.push(l);
    });
  } else if (brutoBal && typeof brutoBal === 'object'){
    linhasAtivo   = listaDeLinhas(brutoBal.ativo || brutoBal.ativos);
    linhasPassivo = listaDeLinhas(brutoBal.passivo || brutoBal.passivos ||
      (brutoBal.passivo_pl || brutoBal.passivo_e_pl));
    if (brutoBal.patrimonio_liquido || brutoBal.pl){
      linhasPassivo = linhasPassivo.concat(listaDeLinhas(brutoBal.patrimonio_liquido || brutoBal.pl));
    }
  }

  /* meses presentes em qualquer linha, em ordem */
  const setMeses = {};
  [].concat(linhasDRE, linhasAtivo, linhasPassivo).forEach(l =>
    Object.keys(l.valores).forEach(k => { setMeses[k] = true; }));
  (C.meses || C.competencias || []).forEach(m => { const k = chaveMes(m); if (k) setMeses[k] = true; });
  const meses = Object.keys(setMeses).sort();

  /* linha canônica -> série por mês (com o sinal já arrumado) */
  function montarBloco(linhas, dicionario, estrutura){
    const serie = {}, extras = [];
    let sinalCorrigido = false;
    const porK = {};
    linhas.forEach(l => {
      const k = casar(l.nome, dicionario);
      if (!k){ if (Object.keys(l.valores).length) extras.push(l); return; }
      porK[k] = porK[k] || { valores:{} };
      Object.keys(l.valores).forEach(m => { porK[k].valores[m] = (porK[k].valores[m]||0) + l.valores[m]; });
    });
    estrutura.forEach(def => {
      const achou = porK[def.k];
      if (!achou) return;
      const s = {};
      meses.forEach(m => {
        let v = achou.valores[m];
        if (v == null) return;
        if (def.sinal === -1 && v > 0){ v = -v; sinalCorrigido = true; }   // custo/despesa sempre negativo
        s[m] = v;
      });
      if (Object.keys(s).length) serie[def.k] = s;
    });
    return { serie, extras, sinalCorrigido };
  }

  const dreB   = montarBloco(linhasDRE,   DRE_POR_NOME,     DRE);
  const ativoB = montarBloco(linhasAtivo, ATIVO_POR_NOME,   BP_ATIVO);
  const passB  = montarBloco(linhasPassivo, PASSIVO_POR_NOME, BP_PASSIVO);

  derivarDRE(dreB.serie, meses);
  derivarBalanco(ativoB.serie, passB.serie, meses);

  /* `temDados:true` sem linha nenhuma continua sendo estado vazio — a promessa do
     backend não desenha gráfico. Quem confirma é o conteúdo. */
  const temDRE = meses.length > 0 && !!(dreB.serie.receita_bruta || dreB.serie.receita_liquida || dreB.serie.lucro_liquido);
  const temBP  = meses.length > 0 && !!(ativoB.serie.ativo || passB.serie.passivo_pl);
  return {
    meses, dre:dreB.serie, ativo:ativoB.serie, passivo:passB.serie,
    extras: [].concat(dreB.extras, ativoB.extras, passB.extras),
    sinalCorrigido: dreB.sinalCorrigido, temDRE, temBP,
    temDados: temDRE || temBP
  };
}

/* Preenche o que a planilha não trouxer, na ordem em que uma linha depende da
   outra. As fórmulas são as da PARTE II, com a convenção de sinal arrumada. */
function derivarDRE(S, meses){
  const g = (k,m) => (S[k] && S[k][m] != null) ? S[k][m] : null;
  const soma = (m, ks) => { let t = 0, achou = false;
    ks.forEach(k => { const v = g(k,m); if (v != null){ t += v; achou = true; } });
    return achou ? t : null; };
  const por = (k,m,v) => { if (v == null || !isFinite(v)) return; S[k] = S[k] || {}; if (S[k][m] == null) S[k][m] = v; };
  meses.forEach(m => {
    por('deducoes',        m, soma(m, ['cancelamentos','impostos_receita']));
    por('custos',          m, soma(m, ['custos_variaveis','custos_pessoal','depreciacao_custo','outros_custos']));
    por('despesas',        m, soma(m, ['desp_ga','desp_pessoal','desp_trib','desp_outras']));
    por('result_fin',      m, soma(m, ['rec_fin','desp_fin']));
    // Receita Líquida = Receita Bruta + Deduções (deduções negativas)
    if (g('receita_liquida',m) == null && g('receita_bruta',m) != null)
      por('receita_liquida', m, g('receita_bruta',m) + (g('deducoes',m)||0));
    // e o caminho inverso: só a líquida na planilha? deduz a bruta
    if (g('receita_bruta',m) == null && g('receita_liquida',m) != null)
      por('receita_bruta', m, g('receita_liquida',m) - (g('deducoes',m)||0));
    // Lucro Bruto = Receita Líquida + Custos
    if (g('lucro_bruto',m) == null && g('receita_liquida',m) != null)
      por('lucro_bruto', m, g('receita_liquida',m) + (g('custos',m)||0));
    // EBITDA = Lucro Bruto + Despesas − Depreciação que está dentro dos custos
    if (g('ebitda',m) == null && g('lucro_bruto',m) != null)
      por('ebitda', m, g('lucro_bruto',m) + (g('despesas',m)||0) - (g('depreciacao_custo',m)||0));
    // EBIT = EBITDA + Depreciação e Amortização
    if (g('ebit',m) == null && g('ebitda',m) != null)
      por('ebit', m, g('ebitda',m) + (g('dep_amort',m)||0));
    // LAIR = EBIT + Resultado Financeiro + Outras
    if (g('lair',m) == null && g('ebit',m) != null)
      por('lair', m, g('ebit',m) + (g('result_fin',m)||0) + (g('outras_rd',m)||0));
    // Lucro Líquido = LAIR + Provisão IR/CSLL (negativa)
    if (g('lucro_liquido',m) == null && g('lair',m) != null)
      por('lucro_liquido', m, g('lair',m) + (g('provisao_ir',m)||0));
  });
}
function derivarBalanco(A, P, meses){
  const gr = (S,k,m) => (S[k] && S[k][m] != null) ? S[k][m] : null;
  const somaS = (S,m,ks) => { let t = 0, achou = false;
    ks.forEach(k => { const v = gr(S,k,m); if (v != null){ t += v; achou = true; } });
    return achou ? t : null; };
  const porS = (S,k,m,v) => { if (v == null || !isFinite(v)) return; S[k] = S[k] || {}; if (S[k][m] == null) S[k][m] = v; };
  meses.forEach(m => {
    porS(A,'ativo_circulante', m, somaS(A,m,['caixa','clientes','estoque','adiant_forn','outros_ativos_op','mutuos','antecip_div','outros_ativos_nao_op']));
    porS(A,'ativo_nao_circulante', m, somaS(A,m,['imobilizado','mutuos_nc','outros_anc']));
    porS(A,'ativo', m, somaS(A,m,['ativo_circulante','ativo_nao_circulante']));
    porS(P,'passivo_circulante', m, somaS(P,m,['passivos_fin','fornecedores','obrig_fiscais','obrig_trab','prov_trab','adiant_cli','outros_passivos_op']));
    porS(P,'passivo_nao_circulante', m, somaS(P,m,['emprestimos','mutuos_pnc','outros_pnc']));
    porS(P,'pl', m, somaS(P,m,['capital_social','lucros_acum','lucros_distrib','outros_pl','resultado_exerc']));
    porS(P,'passivo_pl', m, somaS(P,m,['passivo_circulante','passivo_nao_circulante','pl']));
  });
}

/* ═════════════════════════ DADOS DE EXEMPLO ═════════════════════════
   Empresa FICTÍCIA. Sai no MESMO formato do contrato acima, de propósito:
   o modo exemplo passa pelo mesmo normalizador e pelas mesmas telas, então
   o que a equipe mostra é exatamente o que o cliente vai ver quando a
   planilha existir. Números coerentes (custos e despesas negativos, balanço
   fechando Ativo = Passivo + PL) — nada de margem de 194%. */
function dadosExemplo(){
  const hoje = new Date();
  const meses = [];
  for (let i = 12; i >= 1; i--){
    const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
    meses.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  const saz = [1.00,0.96,1.04,1.08,1.02,0.88,0.93,1.01,1.10,1.06,1.12,1.15];
  const w = i => ((i*37) % 11 - 5) / 1000;          // variação determinística, ±0,5 p.p.
  const dre = {}, ativo = {}, passivo = {};
  const põe = (obj,k,m,v) => { obj[k] = obj[k] || {}; obj[k][m] = Math.round(v); };

  meses.forEach((m,i) => {
    const rb = 430000 * saz[i] * (1 + 0.012*i);
    const impostos      = -rb * (0.1147 + w(i));
    const cancelamentos = -rb * 0.004;
    const rl  = rb + impostos + cancelamentos;
    const cmv        = -rb * (0.381 + w(i+3));
    const cPessoal   = -rb * (0.142 + w(i+5));
    const deprec     = -rb * 0.010;
    const custos     = cmv + cPessoal + deprec;
    const lb  = rl + custos;
    const dGA        = -rb * (0.093 + w(i+1));
    const dPessoal   = -rb * (0.061 + w(i+7));
    const dTrib      = -rb * 0.021;
    const dOutras    = -rb * (0.028 + w(i+9));
    const despesas   = dGA + dPessoal + dTrib + dOutras;
    const ebitda = lb + despesas - deprec;
    const amort  = -rb * 0.002;
    const depAmort = deprec + amort;
    const ebit = ebitda + depAmort;
    const recFin  =  rb * 0.004;
    const despFin = -rb * 0.009;
    const resFin  = recFin + despFin;
    const outras  =  rb * 0.003;
    const lair = ebit + resFin + outras;
    const provIR = 0;                       // Simples Nacional: o imposto já saiu do faturamento
    const ll = lair + provIR;

    põe(dre,'receita_bruta',m,rb);          põe(dre,'cancelamentos',m,cancelamentos);
    põe(dre,'impostos_receita',m,impostos);  põe(dre,'cmv',m,cmv);
    põe(dre,'custos_pessoal',m,cPessoal);    põe(dre,'depreciacao_custo',m,deprec);
    põe(dre,'desp_ga',m,dGA);                põe(dre,'desp_pessoal',m,dPessoal);
    põe(dre,'desp_trib',m,dTrib);            põe(dre,'desp_outras',m,dOutras);
    põe(dre,'dep_amort',m,depAmort);         põe(dre,'rec_fin',m,recFin);
    põe(dre,'desp_fin',m,despFin);           põe(dre,'outras_rd',m,outras);
    põe(dre,'provisao_ir',m,provIR);
    // as linhas de fechamento vão explícitas: é o que uma planilha real traria
    põe(dre,'receita_liquida',m,rl);  põe(dre,'custos',m,custos);   põe(dre,'lucro_bruto',m,lb);
    põe(dre,'despesas',m,despesas);   põe(dre,'ebitda',m,ebitda);   põe(dre,'ebit',m,ebit);
    põe(dre,'result_fin',m,resFin);   põe(dre,'lair',m,lair);       põe(dre,'lucro_liquido',m,ll);

    /* Balanço: saldos de fechamento. Montado na ordem em que a contabilidade
       de verdade acontece — o patrimônio cresce com o lucro que fica na
       empresa, e o CAIXA é o que fecha a conta. Assim o balanço BATE por
       construção (Ativo = Passivo + PL), sem número forçado. */
    const clientes = rb * 0.52;
    const estoque  = 21000 + i * 380;
    const adiantF  = 7400;
    const outrosOp = 12500;
    const imob     = 412000 - i * 3300;
    const outrosNC = 31000;
    const fornec   = rb * 0.16;
    const oFiscais = rb * 0.09;
    const oTrab    = rb * 0.11;
    const provTrab = 84000 + i * 900;
    const pFin     = 38000;
    const outrosPO = 24000;
    const emprest  = 214000 - i * 4200;
    const capital  = 150000;
    const somaAte = filtro => meses.slice(0,i+1).filter(filtro).reduce((s,mm) => s + (dre.lucro_liquido[mm]||0), 0);
    const resTotal  = somaAte(() => true);                                  // tudo o que a janela acumulou
    const resExerc  = somaAte(mm => mm.slice(0,4) === m.slice(0,4));        // só o ano corrente
    const lucrosAcum = 180000 + (resTotal - resExerc);                      // anos anteriores viram lucro acumulado
    const distrib    = -Math.round(resTotal * 0.6);                         // os sócios retiram 60% do lucro
    const pl = capital + Math.round(lucrosAcum) + Math.round(resExerc) + distrib;
    const passivoSemPL = Math.round(fornec)+Math.round(oFiscais)+Math.round(oTrab)+provTrab+pFin+outrosPO+emprest;
    const naoCaixa = Math.round(clientes)+estoque+adiantF+outrosOp+imob+outrosNC;
    const caixa = pl + passivoSemPL - naoCaixa;                             // o caixa fecha o balanço

    põe(ativo,'caixa',m,caixa);            põe(ativo,'clientes',m,clientes);
    põe(ativo,'estoque',m,estoque);        põe(ativo,'adiant_forn',m,adiantF);
    põe(ativo,'outros_ativos_op',m,outrosOp);
    põe(ativo,'imobilizado',m,imob);       põe(ativo,'outros_anc',m,outrosNC);
    põe(passivo,'fornecedores',m,fornec);   põe(passivo,'obrig_fiscais',m,oFiscais);
    põe(passivo,'obrig_trab',m,oTrab);      põe(passivo,'prov_trab',m,provTrab);
    põe(passivo,'passivos_fin',m,pFin);     põe(passivo,'outros_passivos_op',m,outrosPO);
    põe(passivo,'emprestimos',m,emprest);   põe(passivo,'capital_social',m,capital);
    põe(passivo,'lucros_acum',m,lucrosAcum); põe(passivo,'lucros_distrib',m,distrib);
    põe(passivo,'resultado_exerc',m,resExerc);
  });

  /* devolve no formato do contrato — conta -> { 'AAAA-MM': valor } */
  const paraLinhas = (serie, estrutura) => estrutura.filter(d => serie[d.k]).map(d => ({ conta:d.tec, valores:serie[d.k] }));
  return {
    id: IDENTIDADE.id || '000000',
    atualizado_em: new Date().toISOString(),
    exemplo: true,
    config: { razao_social:'Clínica Exemplo Ltda (empresa fictícia)', cnpj:'00.000.000/0001-00', regime:'Simples Nacional' },
    contabil: { meses, dre: paraLinhas(dre, DRE),
      balanco: { ativo: paraLinhas(ativo, BP_ATIVO), passivo: paraLinhas(passivo, BP_PASSIVO) } }
  };
}

/* ═══════════════ PREPARO PARA A TELA ═══════════════ */
const V  = (S,k,m) => (S && S[k] && S[k][m] != null) ? S[k][m] : null;
const V0 = (S,k,m) => { const x = V(S,k,m); return x == null ? 0 : x; };
function acumular(S, k, meses){
  let t = 0, achou = false;
  meses.forEach(m => { const x = V(S,k,m); if (x != null){ t += x; achou = true; } });
  return achou ? t : null;
}
function preparar(raw){
  const N = normalizarContabil(raw);
  const cfg = (raw && raw.config) || {};
  const meses = N.meses;
  const comMovimento = meses.filter(m => V(N.dre,'receita_bruta',m) != null || V(N.dre,'lucro_liquido',m) != null);
  const mesesBP = meses.filter(m => V(N.ativo,'ativo',m) != null || V(N.passivo,'passivo_pl',m) != null);
  const ultimo   = comMovimento.length ? comMovimento[comMovimento.length-1] : (meses[meses.length-1] || '');
  const anterior = comMovimento.length > 1 ? comMovimento[comMovimento.length-2] : '';
  const ultimoBP = mesesBP.length ? mesesBP[mesesBP.length-1] : '';
  const antBP    = mesesBP.length > 1 ? mesesBP[mesesBP.length-2] : '';
  return {
    id: (raw && raw.id) || IDENTIDADE.id, cfg, atualizado_em: raw && raw.atualizado_em,
    exemplo: !!(raw && raw.exemplo),
    meses, mesesFluxo: comMovimento, mesesBP, ultimo, anterior, ultimoBP, antBP,
    dre: N.dre, ativo: N.ativo, passivo: N.passivo, extras: N.extras,
    sinalCorrigido: N.sinalCorrigido, temDRE: N.temDRE, temBP: N.temBP, temDados: N.temDados
  };
}

/* Variação contra o mês anterior. A COR segue a POLARIDADE do indicador
   (despesa subindo é ruim, receita subindo é boa), nunca o sinal do número. */
function htmlDelta(atual, anterior, polaridade, quando, sufixo){
  if (atual == null || anterior == null || !isFinite(anterior) || anterior === 0) return '';
  const d = (atual - anterior) / Math.abs(anterior);
  if (!isFinite(d)) return '';
  const quase = Math.abs(d) < 0.005;
  const bom = d > 0 ? polaridade > 0 : polaridade < 0;
  const classe = quase || polaridade === 0 ? 'neutro' : (bom ? 'bom' : 'ruim');
  const seta = quase ? '=' : (d > 0 ? '▲' : '▼');
  const txt = quase ? 'estável' : pctBR(Math.abs(d*100), 1);
  const t = 'Comparado com ' + (quando || 'o mês anterior') + (sufixo ? ' · ' + sufixo : '');
  return '<div class="delta ' + classe + '" title="' + esc(t) + '"><i>' + seta + '</i>' + txt + '</div>';
}
