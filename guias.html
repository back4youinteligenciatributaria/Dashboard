    const marc=vencimentosDoMes(M,ano,mes); const itens=Array.from(marc.values()).flat();
    const total=itens.reduce((s,x)=>s+(x.valor||0),0);
    document.getElementById('cal-titulo').textContent=mesLongo(compDe(new Date(ano,mes,1)));
    document.getElementById('cal-total').textContent=!itens.length?'sem guias neste mês':(total>0?brl(total):'valores a apurar');
    document.getElementById('cal-prev').innerHTML=dentro(prevD.getFullYear())?miniGradeHTML(prevD.getFullYear(),prevD.getMonth(),vencimentosDoMes(M,prevD.getFullYear(),prevD.getMonth()),false):'';
    document.getElementById('cal-atual').innerHTML=miniGradeHTML(ano,mes,marc,true);
    document.getElementById('cal-next').innerHTML=dentro(nextD.getFullYear())?miniGradeHTML(nextD.getFullYear(),nextD.getMonth(),vencimentosDoMes(M,nextD.getFullYear(),nextD.getMonth()),false):'';
    const agenda=Array.from(marc.entries()).sort((a,b)=>a[0]-b[0]).map(([dia,items])=>items.map(it=>{
      const vh=it.valor===null?'<span style="color:var(--muted)">a apurar</span>':`<b class="num${it.est?' estimativa':''}">${brl(it.valor)}${it.est?' (estimativa)':''}</b>`;
      const refTxt=it.ref?` <span style="color:var(--muted);font-weight:400">de ${compRefTexto(it.ref,ano)}</span>`:'';
      return '<div class="row"><span>'+String(dia).padStart(2,'0')+' · '+esc(it.descricao)+refTxt+'</span>'+vh+'</div>'; }).join('')).join('');
    document.getElementById('cal-agenda').innerHTML=agenda||'<div class="empty">Nenhuma guia neste mês.</div>';
    document.getElementById('cal-prev-btn').disabled = !dentro(new Date(ano,mes-1,1).getFullYear());
    document.getElementById('cal-next-btn').disabled = !dentro(new Date(ano,mes+1,1).getFullYear());
  }
  document.getElementById('cal-prev-btn').addEventListener('click',()=>{ const d=new Date(calCentro.ano,calCentro.mes-1,1); if(dentro(d.getFullYear())){calCentro={ano:d.getFullYear(),mes:d.getMonth()};renderCarrossel();} });
  document.getElementById('cal-next-btn').addEventListener('click',()=>{ const d=new Date(calCentro.ano,calCentro.mes+1,1); if(dentro(d.getFullYear())){calCentro={ano:d.getFullYear(),mes:d.getMonth()};renderCarrossel();} });

  function trocarFiltro(f){ GUIAS_FILTRO=f;
    document.getElementById('gf-pend').classList.toggle('on', f==='pendentes');
    document.getElementById('gf-todas').classList.toggle('on', f==='todas');
    sincronizarURL(); renderGuias(M); }
  document.getElementById('gf-pend').addEventListener('click',()=>trocarFiltro('pendentes'));
  document.getElementById('gf-todas').addEventListener('click',()=>trocarFiltro('todas'));

  // O bloco de provisionamento nasce fechado: desenhar dentro de um container sem
  // altura dá gráfico de 0px. Desenha na primeira abertura, uma vez só.
  // Se o Chart.js (CDN) falhar, o painel continua aparecendo (sem os gráficos), nunca redireciona.
  const detProv=document.getElementById('det-prov'); let provFeito=false;
  function desenharProv(){ if(provFeito) return; provFeito=true;
    try{ desenharEstimativas(M); }catch(e){ if(window.console&&console.warn) console.warn('Gráficos de provisão indisponíveis:', e); } }
  detProv.addEventListener('toggle',()=>{ if(detProv.open) desenharProv(); });
  if(detProv.open) desenharProv();

  renderCarrossel();
  renderGuias(M);
}

/* ---- Lista de guias com controle de pago/agendado ---- */
/* A aba escolhida vive no endereço: dar F5 (ou voltar do link da guia) devolvia
   sempre "Em aberto", mesmo para quem tinha acabado de pedir "Todas". */
const GUIAS_FILTROS_OK=['pendentes','todas'];
function lerFiltroURL(){ const f=String(new URLSearchParams(location.search).get('g')||'').trim().toLowerCase();
  return GUIAS_FILTROS_OK.indexOf(f)>=0?f:'pendentes'; }
function sincronizarURL(){
  try{ const u=new URL(location.href);
    if(GUIAS_FILTRO==='pendentes') u.searchParams.delete('g'); else u.searchParams.set('g',GUIAS_FILTRO);
    history.replaceState(null,'',u.pathname+u.search+u.hash);   // o #id-codigo continua intacto
  }catch(e){}
}
let GUIAS_FILTRO=lerFiltroURL();
// CHAVE de 2 partes (regra|competência) — casa com a aba Agenda pré-preenchida da planilha
// fiscal. Não inclui o vencimento (que varia com feriados), então status + LINK da guia
// batem sempre com a linha da Agenda que o colaborador preencheu.
function chaveGuia(c){ return (c.id_regra||'')+'|'+(c.competencia_ref||''); }
/* Monta a lista completa de guias (sem o filtro de aba), já com o status da agenda. */
function guiasDe(M){
  const anoAtual=hoje.getFullYear();
  return (M.cal||[]).filter(c=>c.vencimento).map(c=>{
    const vd=M.valorDe?M.valorDe(c):{v:0,est:false}; const ch=chaveGuia(c); const st=(M.agenda||{})[ch]||{status:'',por:'',link:'',venc:''};
    const ov=(st.venc&&/^\d{4}-\d{2}-\d{2}/.test(st.venc))?String(st.venc).slice(0,10):'';   // vencimento forçado na planilha (override)
    return {venc:ov||c.vencimento, ajustada:!!ov, desc:c.descricao, ref:c.competencia_ref, valor:vd.v, est:vd.est, chave:ch, status:st.status||'', por:st.por||'', link:st.link||''};
  }).filter(g=>{
    // Guia de ano anterior NÃO some na virada do ano: fica na lista (e na aba "Todas")
    // enquanto não estiver paga. Uma guia de dez/2025 em aberto continua visível em 2026.
    if(+String(g.venc).slice(0,4)>=anoAtual) return true;
    return (g.status||'').toLowerCase()!=='paga';
  }).sort((a,b)=>String(a.venc).localeCompare(b.venc));
}
function guiaVencida(g){ return (g.status||'').toLowerCase()!=='paga' && String(g.venc)<compDeDia(hoje); }

function renderGuias(M){
  const box=document.getElementById('guias-lista'); if(!box) return;
  let lista=guiasDe(M);
  if(GUIAS_FILTRO==='pendentes') lista=lista.filter(g=>(g.status||'').toLowerCase()!=='paga');
  const grupos={}; lista.forEach(g=>{ const mk=String(g.venc).slice(0,7); (grupos[mk]=grupos[mk]||[]).push(g); });
  const meses=Object.keys(grupos).sort();
  box.innerHTML = meses.length ? meses.map(mk=>`
    <div class="guias-bloco">
      <div class="guias-mestit">${mesLongo(mk)}</div>
      ${grupos[mk].map(g=>cardGuia(g)).join('')}
    </div>`).join('') : `<div class="card"><div class="vazio" style="padding:20px;text-align:center;color:var(--muted)">Nenhuma guia ${GUIAS_FILTRO==='pendentes'?'em aberto':''} por aqui.</div></div>`;
  box.querySelectorAll('[data-marca]').forEach(b=> b.addEventListener('click',()=>marcarGuiaUI(M,b.dataset.chave,b.dataset.marca,b)));
  renderHeroi(M);
}

/* Rolar até a lista SEM mexer no endereço: `href="#sec-guias"` trocava o fragmento
   e levava embora o `#id-codigo` — o cliente perdia o acesso ao dar F5. */
function irParaGuias(e){ if(e) e.preventDefault();
  const alvo=document.getElementById('sec-guias'); if(alvo) alvo.scrollIntoView({block:'start'}); }

/* Dias inteiros entre hoje e um vencimento "AAAA-MM-DD" (positivo = ainda vai vencer). */
function diasAte(venc){ const d=dParse(String(venc).slice(0,10)); d.setHours(0,0,0,0);
  return Math.round((d-hoje)/86400000); }
function textoPrazo(n){ return n<0?('há '+(-n)+(n===-1?' dia':' dias')) : n===0?'hoje' : n===1?'amanhã' : ('em '+n+' dias'); }
/* Une descrições em linguagem de gente: "FGTS, INSS e ISS". */
function listar(itens){ const a=itens.filter(Boolean);
  return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]; }

/* Vence "agora" o que cai nos próximos 15 dias. Mais longe que isso, a resposta
   honesta para "tenho alguma coisa vencendo?" é "não" — e o herói diz isso. */
const DIAS_PROXIMO = 15;

/* O herói responde a única pergunta que o cliente traz ao abrir esta página.
   Três estados: tem vencidas (faixa vermelha acima) · tem algo vencendo · nada agora. */
function renderHeroi(M){
  const faixa=document.getElementById('faixa-vencidas');
  const box=document.getElementById('heroi'); if(!box) return;
  const abertas=guiasDe(M).filter(g=>(g.status||'').toLowerCase()!=='paga');
  const vencidas=abertas.filter(guiaVencida);
  const futuras=abertas.filter(g=>!guiaVencida(g));

  // ---- estado "vencidas": faixa vermelha ACIMA de tudo ----
  if(faixa){
    if(vencidas.length){
      const tv=vencidas.reduce((s,g)=>s+(g.valor>0?g.valor:0),0);
      const n=vencidas.length;
      faixa.innerHTML=`<span class="fv-txt">${n} ${n>1?'guias venceram':'guia venceu'} e ainda `+
        `${n>1?'não foram marcadas como pagas':'não foi marcada como paga'} — <b>${tv>0?brl(tv):'valor a apurar'}</b>.</span>`+
        `<a href="#" id="fv-ver">Ver quais ↓</a>`;
      faixa.hidden=false;
      const lk=faixa.querySelector('#fv-ver'); if(lk) lk.addEventListener('click',irParaGuias);
    } else { faixa.hidden=true; faixa.innerHTML=''; }
  }

  // ---- estado "nada vencendo agora" ----
  const prox=futuras[0];
  const prazo=prox?diasAte(prox.venc):null;
  if(!prox || prazo>DIAS_PROXIMO){
    const quando=prox?(String(prox.venc).slice(8,10)+'/'+String(prox.venc).slice(5,7)):'';
    box.innerHTML=`<div class="lbl">Agenda de pagamentos</div>
      <div class="heroi-v">Nada vencendo agora</div>
      <div class="heroi-sub">${prox?`A próxima guia é só em <b>${esc(quando)}</b>.`:'Você não tem nenhuma guia em aberto por aqui.'}</div>
      <button type="button" class="heroi-ir" id="hr-ver">Ver a lista de guias ↓</button>`;
    box.querySelector('#hr-ver').addEventListener('click',irParaGuias);
    return;
  }

  // ---- estado "vencendo": tudo que cai no mesmo dia entra no mesmo número ----
  const doDia=futuras.filter(g=>g.venc===prox.venc);
  const total=doDia.reduce((s,g)=>s+(g.valor>0?g.valor:0),0);
  const algumEst=doDia.some(g=>g.est&&g.valor>0);
  const dia=String(prox.venc).slice(8,10)+'/'+String(prox.venc).slice(5,7);
  const nomes=listar([...new Set(doDia.map(g=>g.desc).filter(Boolean))]);
  const refs=[...new Set(doDia.map(g=>g.ref).filter(Boolean))];
  const refTxt=refs.length===1?compRefLongo(refs[0]):'';
  box.innerHTML=`<div class="lbl">Seu próximo pagamento</div>
    <div class="heroi-v">${total>0?brl(total):'a apurar'} <span class="quando">· vence ${esc(dia)} (${esc(textoPrazo(prazo))})</span></div>
    <div class="heroi-sub">${esc(nomes)}${refTxt?' de '+esc(refTxt):''}${algumEst?' <span style="opacity:.85">(valor estimado)</span>':''}</div>
    <button type="button" class="heroi-ir" id="hr-ver">Ver a lista de guias ↓</button>`;
  box.querySelector('#hr-ver').addEventListener('click',irParaGuias);
}
function cardGuia(g){
  const st=(g.status||'').toLowerCase();
  const cls= st==='paga'?'paga': st==='agendada'?'agendada':'apagar';
  const rot= st==='paga'?'Paga': st==='agendada'?'Agendada':'A pagar';
  const dia=String(g.venc).slice(8,10)+'/'+String(g.venc).slice(5,7);
  const vencida = guiaVencida(g);
  return `<div class="guia-card ${cls}${vencida?' vencida':''}">
    <div class="guia-venc"><b>${dia}</b>${vencida?'<span class="gv-tag">vencida</span>':''}</div>
    <div class="guia-info"><div class="guia-desc">${esc(g.desc)}</div>
      <div class="guia-meta">${g.ref&&compRefLongo(g.ref)?('impostos de '+esc(compRefLongo(g.ref))+' · '):''}${g.valor>0?brl(g.valor)+(g.est?' (estim.)':''):'a apurar'}${g.por?(' · por '+esc(g.por)):''}${g.ajustada?' · <span title="vencimento definido manualmente na planilha">data ajustada</span>':''}</div>
      ${g.link?`<a class="guia-baixar" href="${esc(g.link)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:var(--fs-2);font-weight:600;color:var(--brand-teal-txt);text-decoration:none">📄 Baixar guia</a>`:''}</div>
    <div class="guia-acoes">
      <span class="guia-status ${cls}">${rot}</span>
      <!-- "Agendar"/"Paga" não diziam quem faz o quê (nós agendamos? ele?), e clicar
           num botão já ativo limpava o status em silêncio. Agora o rótulo é a frase
           dele, e desmarcar está escrito no próprio botão. -->
      <div class="guia-btns">
        <button data-marca="Agendada" data-chave="${g.chave}" class="${st==='agendada'?'on':''}">${st==='agendada'?'✓ Já agendei · desfazer':'Já agendei no banco'}</button>
        <button data-marca="Paga" data-chave="${g.chave}" class="${st==='paga'?'on':''}">${st==='paga'?'✓ Já paguei · desfazer':'Já paguei'}</button>
      </div>
    </div>
  </div>`;
}
function compDeDia(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* Aviso inline dentro do próprio cartão da guia (a casa não usa alert/confirm/prompt).
   O código curto ao lado é para o atendimento; a frase é para ele. */
function avisoGuia(card,msg,cod){
  if(!card) return;
  let box=card.querySelector('.guia-aviso');
  if(!msg){ if(box) box.remove(); return; }
  if(!box){ box=document.createElement('div'); box.className='guia-aviso'; box.setAttribute('role','alert'); card.appendChild(box); }
  box.textContent=msg+' ';   // espaço antes do código: sem ele o leitor de tela junta as duas palavras
  if(cod){ const c=document.createElement('span'); c.className='cod-erro'; c.textContent=cod; box.appendChild(c); }
}
async function marcarGuiaUI(M,chave,marca,btn){
  const atual=(M.agenda||{})[chave]; const novo=(atual&&atual.status===marca)?'':marca;
  const {id,codigo}=getIdCodigo();
  const card=btn?btn.closest('.guia-card'):null;
  const botoes=card?Array.from(card.querySelectorAll('[data-marca]')):[];
  const rotulo=btn?btn.textContent:'';
  // Sinal imediato: o botão fica em "Marcando…" e trava enquanto a chamada não volta.
  avisoGuia(card,'');
  botoes.forEach(b=>{ b.disabled=true; });
  if(btn){ btn.classList.add('marcando'); btn.textContent='Marcando…'; }
  try{
    const d=await jsonp(API_URL+'?id='+encodeURIComponent(id)+'&codigo='+encodeURIComponent(codigo)+'&acao=marcar_guia&chave='+encodeURIComponent(chave)+'&status='+encodeURIComponent(novo));
    if(d&&d.erro) throw new Error(d.erro);
    M.agenda=M.agenda||{};
    if(novo){ M.agenda[chave]=Object.assign({}, M.agenda[chave], {status:novo,por:(d&&d.por)||'',em:(d&&d.em)||''}); } else { delete M.agenda[chave]; }
    renderGuias(M);   // redesenha tudo — os botões voltam ao normal já com o status novo
  }catch(e){
    botoes.forEach(b=>{ b.disabled=false; });
    if(btn){ btn.classList.remove('marcando'); btn.textContent=rotulo; }
    // e.message é vocabulário nosso ("A API não respondeu"): nunca vai para a tela dele.
    avisoGuia(card,'Não consegui registrar o pagamento agora. Tente de novo em alguns segundos — a guia continua marcada como estava.','GUI-01');
  }
}



/* ---- estimativas (provisionamento) ---- */
/* Soma a coluna por n meses a partir de ref. Mês FECHADO (tem dado) usa o valor real;
   mês ABERTO usa a MÉDIA dos últimos meses com movimento (M.media) e marca est=true.
   Assim os trimestrais usam o cálculo real nos meses fechados + média nos abertos. */
function valorAcumuladoColuna(M,ref,coluna,n){ const [a,m]=ref.split('-').map(Number); let total=0, est=false;
  for(let i=0;i<n;i++){ const c=compDe(new Date(a,m-1-i,1)); const r=M.porComp[c];
    if(r) total+=num(getM(r,coluna)); else { total+=M.media(coluna); est=true; } }
  return {v:Math.round(total*100)/100, est:est}; }
/* Desembolso por tributo no mês de vencimento — genérico por regime: para cada
   tributo visível, acha a regra cuja metrica_fonte inclui a coluna "a pagar" dele
   e a guia que vence neste mês (respeitando acumula_meses). Serve Presumido (ISS/
   PIS/COFINS/CSLL/IRPJ) e Simples (DAS) sem hard-code de id de regra. */
function desembolsoPorTributoNoMes(M,ano,mes){
  const out={}; M.tribs.forEach(t=>out[t.pag]={v:0,est:false});
  M.tribs.forEach(t=>{
    const reg=(M.regras||[]).find(r=>String(r.metrica_fonte||'').split('|').map(s=>s.trim()).includes(t.pag));
    if(!reg) return;
    const guia=M.cal.find(c=>{ if(c.id_regra!==reg.id)return false; const d=dParse(c.vencimento); return d.getFullYear()===ano&&d.getMonth()===mes; });
    if(!guia) return;
    out[t.pag]=valorAcumuladoColuna(M,guia.competencia_ref,t.pag,Math.max(1,num(reg.acumula_meses)||1));
  });
  return out;
}
function desenharEstimativas(M){
  const opts={responsive:true,maintainAspectRatio:false,animation:{duration:500},cutout:'60%',
    plugins:{legend:{display:false},tooltip:{backgroundColor:PAL.petroleo,padding:10,cornerRadius:6,bodyFont:{family:'Montserrat',size:12},callbacks:{label:c=>' '+c.label+': '+brl(c.parsed)}}}};
  // Próximos 3 meses de VENCIMENTO (a partir do mês seguinte ao atual): ago/set/out quando estamos em julho.
  for(let i=0;i<3;i++){ const d=new Date(hoje.getFullYear(),hoje.getMonth()+1+i,1); const comp=compDe(d);
    const porTrib=desembolsoPorTributoNoMes(M,d.getFullYear(),d.getMonth());
    const dados=M.tribs.map(t=>{ const o=porTrib[t.pag]||{v:0,est:false}; return {n:t.n,c:t.c,v:o.v,est:o.est}; });
    const total=dados.reduce((s,x)=>s+x.v,0); const algumEst=dados.some(x=>x.est&&x.v>0);
    document.getElementById('est-t-'+i).textContent=mesLongo(comp);
    document.getElementById('est-s-'+i).innerHTML=(algumEst?'estimativa · ':'')+'provisionar <span class="estimativa">'+brl(total)+'</span>';
    const lg=document.getElementById('est-lg-'+i), cbox=document.getElementById('est-'+i).closest('.cbox');
    if(total<=0){ if(cbox) cbox.style.display='none'; lg.innerHTML='<div class="prov-vazio">Sem guias a provisionar neste mês.</div>'; continue; }
    lg.innerHTML=dados.map(x=>`<div class="pie-legend-row"><i class="sw" style="background:${x.c}"></i><span>${x.n}${x.est&&x.v>0?' <span style="color:var(--muted);font-weight:400">· estim.</span>':''}</span><b class="num ${x.v>0?'estimativa':''}">${x.v>0?brl(x.v):'—'}</b></div>`).join('');
    // Donut de uma fatia só é um anel maciço: não compara nada (é o caso de todo cliente
    // do Simples, que só tem DAS). Com menos de duas fatias o valor vale mais como texto
    // — e a linha da legenda logo abaixo já é exatamente isso.
    const visiveis=dados.filter(x=>x.v>0);
    if(visiveis.length<2){ if(cbox) cbox.style.display='none'; continue; }
    if(cbox) cbox.style.display='';
    // sem o fio branco entre as fatias, duas cores vizinhas se fundem numa mancha só
    // try por gráfico: se o CDN do Chart.js cair, os outros meses ainda desenham a legenda
    try{
      new Chart(document.getElementById('est-'+i),{type:'doughnut',data:{labels:dados.map(x=>x.n),datasets:[{data:dados.map(x=>x.v),backgroundColor:dados.map(x=>x.c),borderColor:'#fff',borderWidth:1.5}]},options:opts});
    }catch(e){ if(cbox) cbox.style.display='none'; if(window.console&&console.warn) console.warn('Gráfico indisponível:',e); }
  }
}

// Sem login (falta id/código) volta ao index; com login, mostra aviso amigável e não redireciona
// (assim uma falha momentânea de dados/gráfico nunca "expulsa" o cliente do painel).
function erro(e){
  var ic=getIdCodigo(), id=ic.id, codigo=ic.codigo;
  var amigavel=(window.B4U&&B4U.msgAmigavel)?B4U.msgAmigavel(e):'';
  if(!id||!codigo){ location.replace('index.html'+(id?('#'+id+(codigo?'-'+codigo:'')):(location.hash||''))); return; }
  var volta='index.html#'+id+(codigo?('-'+codigo):'');
  document.body.innerHTML=
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;'
   +'font-family:\'Montserrat\',system-ui,-apple-system,sans-serif;background:#F1E7DC;color:#113D39">'
   +'<div style="max-width:440px;text-align:center;background:#FFFFFF;border:1px solid #E4D9C9;'
   +'border-radius:var(--radius-lg);padding:32px 28px;box-shadow:0 6px 24px rgba(7,48,52,.06)">'
   +'<div style="font-size:var(--fs-6);line-height:1;margin-bottom:10px">📄</div>'
   +'<h2 style="margin:0 0 8px;font-size:var(--fs-5)">Não foi possível carregar suas informações agora.</h2>'
   +'<p style="margin:0 0 20px;font-size:var(--fs-4);line-height:1.5;color:#3F5854">'+(amigavel||'Se você acredita que isto é um erro, fale com o nosso atendimento que resolvemos rápido.')+'</p>'
   +'<a href="https://wa.me/5511937173906" target="_blank" rel="noopener" style="display:inline-block;background:#0C756F;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:var(--radius-pill);font-size:var(--fs-4)">Falar com o atendimento</a>'
   +'<div style="margin-top:14px"><a href="'+volta+'" style="color:#0C756F;font-size:var(--fs-3);text-decoration:none">Voltar ao início</a></div>'
   +'</div></div>';
}

/* Olhar a mesma frase por 45s é lido como "travou" — e ele recarrega, jogando fora o
   pedido que já estava a caminho. Trocar o texto é barato e compra paciência. */
var _tEspera = [
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Estamos buscando os seus dados na planilha…'; }, 4000),
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Está demorando mais que o normal — continuamos tentando.'; }, 10000),
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Quase lá — a primeira abertura do dia é a mais lenta.'; }, 20000)
];
function pararEspera(){ _tEspera.forEach(clearTimeout); }

/* Tarja discreta do cache: diz que o que está na tela veio do último acesso.
   Fica dentro do .wrap, logo abaixo do herói — nunca por cima do número. */
function tarja(texto,falhou){
  const slot=document.getElementById('tarja-slot'); if(!slot) return;
  slot.innerHTML = texto ? `<div class="tarja-atualizando${falhou?' falhou':''}">${esc(texto)}</div>` : '';
}

(async function(){
  const {id}=getIdCodigo();
  let pintadoDoCache=false, tsCache=0;
  /* A segunda visita não recomeça do esqueleto: pintamos com o último payload (6h de
     validade) e atualizamos por baixo. Se a atualização falhar, o que está na tela
     continua — apagar dado bom por causa de uma rede ruim é pior que dado de 1h atrás. */
  if(API_URL && id && window.B4U && B4U.cacheLer){
    const bruto=B4U.cacheLer('guias',id);
    if(bruto){
      try{
        const Mc=preparar(bruto);
        if(Mc.empresa.length){ Mc.atualizado_em=bruto.atualizado_em; tsCache=bruto.atualizado_em||0;
          pararEspera(); render(Mc); tarja('Atualizando…'); pintadoDoCache=true; }
      }catch(err){ /* cache velho ou de outro formato: simplesmente ignora e busca de novo */ }
    }
  }
  try{
    const raw=await carregar();
    const M=preparar(raw); M.atualizado_em=raw.atualizado_em;
    if(!M.empresa.length){
      if(pintadoDoCache){ tarja('Não consegui atualizar agora — mostrando os dados de '+horaCache(tsCache)+'.',true); return; }
      return erro(new Error('A planilha deste cliente não tem nenhum mês na aba Empresa.'));
    }
    if(API_URL && id && window.B4U && B4U.cacheGravar) B4U.cacheGravar('guias',id,raw);
    pararEspera(); render(M); tarja('');
  } catch(e){
    if(pintadoDoCache){ tarja('Não consegui atualizar agora — mostrando os dados de '+horaCache(tsCache)+'.',true); return; }
    erro(e);
  }
})();
function horaCache(ts){ return ts ? new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : 'antes'; }
</script>
