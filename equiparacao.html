<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equiparação hospitalar — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- São DUAS origens porque o /exec responde 302 para a segunda: sem isto o aparelho
     paga DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte deixa de bloquear a primeira pintura: o esqueleto aparece antes dela. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"></noscript>
<!-- chart.js sai do meio do corpo: com defer ele executa antes do DOMContentLoaded,
     muito antes de o JSONP responder, e não atrasa a primeira pintura. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<style>
:root{
  /* PALETA CANÔNICA — igual nas 7 páginas do cliente. Não redeclare tons aqui. */
  --canvas:#F1E7DC; --surface:#FFFFFF; --surface-warm:#FBF6EF;
  --ink:#113D39; --ink-2:#3F5854; --muted:#6E6256; --line:#E4D9C9; --line-2:#D6C3AC;
  --brand-dark:#073034; --brand-teal:#0F8C85; --brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,44:1 no receita-soft).
     Este é o mesmo teal escurecido só para texto e fundo de texto; o --brand-teal
     continua canônico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E; --amber-txt:#8A5A10; --vermelho:#C0392B; --verde:#2E9D5F;
  /* Escala tipográfica — 6 passos, sem meio pixel. */
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:15px; --fs-5:19px; --fs-6:24px;
  /* Raios — 12 padrão, 16 para caixas grandes, 999 só para pílulas. */
  --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-pill:999px;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  --receita:var(--brand-teal); --receita-soft:#DBEFEC;
  /* Situação do pedido — cores de STATUS. Nunca aparecem sozinhas: sempre com rótulo. */
  --g-ok:#2E9D5F;  --g-ok-soft:#E7F4EC;  --g-ok-txt:#16713E;
  --g-and:#E8892E; --g-and-soft:#FCEEDF; --g-and-txt:#9A5410;
  --g-neu:#6B4FA0; --g-neu-soft:#EFEAF6; --g-neu-txt:#4F3A78;
  --g-enc:#C0392B; --g-enc-soft:#F7E4E1; --g-enc-txt:#96271B;
  --andamento:var(--g-and); --andamento-soft:var(--g-and-soft);
  --neutro:var(--g-neu); --neutro-soft:var(--g-neu-soft);
  --encerrado:var(--g-enc); --encerrado-soft:var(--g-enc-soft);
  /* Slots categóricos (IRPJ, CSLL…) — ordem fixa, já validada. */
  --slot1:#009488; --slot2:#B4530F; --slot3:#6B4FA0; --slot4:#7A8B3D;
  /* Escala de padding — três degraus no lugar dos 49 valores avulsos que havia aqui. */
  --pad-sm: 14px 16px;
  --pad:    18px 20px;
  --pad-lg: 24px 26px;
  --lift:   0 8px 20px rgba(17,61,57,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:var(--fs-4);line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lbl{font-size:var(--fs-1);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:4px}
/* Campo com menos de 16px faz o Safari ampliar a página inteira ao focar. Só os campos. */
input,select,textarea{font-size:16px}
/* Uma amostra de cor só — antes eram quatro tamanhos diferentes na mesma tela. */
.sw,.leg-sw,.heroi-legs i,.duo .k i{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}
/* Tarja de cache: o que está na tela é do último acesso e já está sendo atualizado. */
.tarja-atualizando{font-size:var(--fs-2);font-weight:600;color:var(--brand-dark);
  background:var(--receita-soft);border-radius:var(--radius-pill);padding:6px 14px;margin:14px 0 0;
  display:inline-flex;align-items:center;gap:8px}
.tarja-atualizando.falhou{background:#FCEFE0;color:#8A5A10}

header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:var(--b4u-bar-h,0px);z-index:30}
.bar{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:var(--fs-5);letter-spacing:-.02em;line-height:1}
.logo .b{color:var(--brand-dark)} .logo .y{color:var(--brand-teal)}
/* Razão social + CNPJ é o que confirma "esta é a minha empresa": 15px em teal
   puro dá 4,11:1. Escurecido, 5,54:1. */
.brand-sub{font-size:var(--fs-4);color:var(--brand-teal-txt);font-weight:700;margin-top:2px}
.voltar{display:inline-block;font-size:var(--fs-1);font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:4px}
.voltar:hover{color:var(--brand-teal-txt)}
.spacer{flex:1}
/* 11px sobre o verde claro: teal puro dá 3,44:1. Escurecido, 4,64:1. */
.badge-topo{font-size:var(--fs-1);font-weight:700;color:var(--brand-teal-txt);background:var(--receita-soft);padding:5px 12px;border-radius:var(--radius-pill)}

.docs-chave{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:28px 0 0}
.doc-chave-card{display:flex;align-items:center;gap:14px;padding:var(--pad);text-decoration:none;color:inherit;
  transition:border-color .15s,transform .15s,box-shadow .15s}
/* Cartão clicável tem de responder ao toque — este aqui abria um documento e não levantava nada. */
.doc-chave-card:hover{border-color:var(--brand-teal);transform:translateY(-2px);box-shadow:var(--lift)}
.doc-chave-icone{flex-shrink:0;width:40px;height:40px;border-radius:var(--radius-sm);background:var(--receita-soft);color:var(--brand-teal);display:flex;align-items:center;justify-content:center}
.doc-chave-icone svg{width:22px;height:22px}
.doc-chave-nome{font-size:var(--fs-3);font-weight:700;line-height:1.3}
.doc-chave-abrir{font-size:var(--fs-2);font-weight:600;color:var(--brand-teal-txt);margin-top:2px}
.docs-chave--destaque{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:32px}
.docs-chave--destaque .doc-chave-card{padding:26px 24px;background:linear-gradient(180deg,rgba(7,48,52,0) 45%,rgba(7,48,52,.22) 100%),linear-gradient(124deg,var(--brand-dark) 0%,var(--brand-teal) 100%);border:none;box-shadow:0 14px 30px -12px rgba(6,48,51,.45)}
.docs-chave--destaque .doc-chave-icone{width:52px;height:52px;background:rgba(255,255,255,.16);color:#fff}
.docs-chave--destaque .doc-chave-icone svg{width:26px;height:26px}
.docs-chave--destaque .doc-chave-nome{font-size:var(--fs-4);color:#fff}
.docs-chave--destaque .doc-chave-abrir{font-size:var(--fs-2);color:rgba(255,255,255,.85)}

.stat{padding:var(--pad);border-radius:var(--radius)}
.stat .v{font-size:var(--fs-6);font-weight:800;letter-spacing:-.02em;margin-top:6px}
.stat .s{font-size:var(--fs-2);color:var(--muted);margin-top:4px}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:32px 0 14px}
.sec-head h2{font-size:var(--fs-5);font-weight:700;letter-spacing:-.01em}
.sec-head p{font-size:var(--fs-3);color:var(--muted)}

.chart{padding:var(--pad)}
.chart h3{font-size:var(--fs-4);font-weight:700;margin-bottom:2px}
.chart .sub{font-size:var(--fs-2);color:var(--muted);margin-bottom:14px}
.cbox{position:relative;height:220px}

@media(max-width:640px){
  .wrap{padding:0 14px 60px}
  .tiles>*,.docs-chave>*{min-width:0}
  /* No celular a escala inteira encolhe de uma vez, pelos tokens. */
  :root{--pad-sm:12px 13px;--pad:15px 16px;--pad-lg:18px 18px}
  .sec-head{margin:22px 0 10px}
  /* razão social + CNPJ do cliente não podem virar 11px: ficam menores que o texto ao lado */
  .brand-sub{font-size:var(--fs-3)}
}

.status-chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-1);font-weight:700;padding:3px 9px;border-radius:var(--radius-sm);white-space:nowrap}
.status-andamento{background:var(--g-and-soft);color:var(--g-and-txt)}
.status-concluido{background:var(--g-ok-soft);color:var(--g-ok-txt)}
.status-neutro{background:var(--g-neu-soft);color:var(--g-neu-txt)}
.status-encerrado{background:var(--g-enc-soft);color:var(--g-enc-txt)}

.lista{padding:8px 24px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .nome{font-size:var(--fs-3);font-weight:600}
.item .cat{font-size:var(--fs-1);color:var(--muted);margin-top:2px}
.item a{font-size:var(--fs-2);font-weight:700;color:var(--brand-teal-txt);text-decoration:none;white-space:nowrap}
.item a:hover{color:var(--brand-dark)}

.vazio{color:var(--muted);font-size:var(--fs-3);padding:24px 20px;text-align:center;line-height:1.7}
.vazio a{color:var(--brand-teal-txt);font-weight:700;text-decoration:none}
.vazio a:hover{text-decoration:underline}
.aviso-estimativa{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;margin-bottom:16px;background:#FFF6E9;border:1px solid #F0D9A8;color:#6B5326;font-size:var(--fs-3);line-height:1.55}
.aviso-estimativa .ae-ico{font-size:var(--fs-5);line-height:1;color:var(--amber-txt);flex-shrink:0;margin-top:1px}
.aviso-estimativa b{color:#5A4413}

/* a bolinha de carregar saiu: quem espera agora é o esqueleto no formato da página */
.espera{margin-top:18px;text-align:center;font-size:var(--fs-3);color:var(--muted);min-height:1.4em}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-2);color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* ════════ Dropdowns (accordion nativo <details>) ════════ */
.acc{display:flex;flex-direction:column;gap:10px;margin-top:2px}
.acc-item{background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:var(--radius);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.acc-item.andamento{border-left-color:var(--g-and)}
.acc-item.concluido{border-left-color:var(--g-ok)}
.acc-item.neutro{border-left-color:var(--g-neu)}
.acc-item.encerrado{border-left-color:var(--g-enc)}
.acc-item[open]{box-shadow:0 12px 30px -14px rgba(6,48,51,.35)}
.acc-item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:13px;padding:var(--pad-sm);min-height:44px}
.acc-item>summary::-webkit-details-marker{display:none}
.acc-item>summary:hover{background:var(--surface-warm)}
.acc-item>summary:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.acc-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.acc-head-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-head-title{font-size:var(--fs-4);font-weight:800;color:var(--ink);letter-spacing:-.01em}
.acc-head-sub{font-size:var(--fs-2);color:var(--muted);font-weight:400}
.acc-head-sub b{color:var(--ink-2);font-weight:700}
.acc-val{flex-shrink:0;text-align:right;display:flex;flex-direction:column;gap:0}
.acc-val .v{font-size:var(--fs-5);font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.acc-val .k{font-size:var(--fs-1);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.acc-item.concluido .acc-val .v{color:var(--g-ok-txt)}
.chev{flex-shrink:0;width:18px;height:18px;color:var(--muted);transition:transform .22s ease}
.acc-item[open] .chev{transform:rotate(180deg)}
.acc-body{padding:4px 18px 16px;border-top:1px solid var(--line)}
.acc-expl{font-size:var(--fs-2);color:var(--ink-2);line-height:1.55;background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;margin:14px 0 6px}
.mini{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:none}
.mini-l{display:flex;align-items:baseline;gap:9px;min-width:0;flex-wrap:wrap}
.mini-l b{font-size:var(--fs-4);font-weight:800;color:var(--ink)}
.mini-trib{font-size:var(--fs-1);font-weight:700;color:var(--brand-teal-txt);background:var(--receita-soft);padding:2px 9px;border-radius:var(--radius-pill)}
.mini-num{display:block;width:100%;font-size:var(--fs-1);color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mini-r{text-align:right;flex-shrink:0}
.mini-r .v{font-size:var(--fs-4);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mini-r .k{font-size:var(--fs-1);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* ── "detalhamento completo": cada PER/DCOMP num dropdown próprio ── */
.pacc{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pitem{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.pitem.andamento{border-left-color:var(--g-and)}
.pitem.concluido{border-left-color:var(--g-ok)}
.pitem.neutro{border-left-color:var(--g-neu)}
.pitem.encerrado{border-left-color:var(--g-enc)}
.pitem>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:var(--pad-sm);min-height:44px}
.pitem>summary::-webkit-details-marker{display:none}
.pitem>summary:hover{background:var(--surface-warm)}
.pitem>summary:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.pitem-main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pitem-title{font-size:var(--fs-3);font-weight:800;color:var(--ink);letter-spacing:-.01em}
.pitem-val{flex-shrink:0;font-size:var(--fs-3);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.pitem.concluido .pitem-val{color:var(--g-ok-txt)}
.pitem>summary .chev{width:16px;height:16px}
.pitem[open]>summary .chev{transform:rotate(180deg)}
.pitem-body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.pitem-num{font-size:var(--fs-1);color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:-.01em;word-break:break-all;margin:10px 0 12px}
.pcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.pcard-grid>div{font-size:var(--fs-3);font-weight:700;color:var(--ink);min-width:0}
.pcard-grid>div span{display:block;font-size:var(--fs-1);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:2px}
.pcard-grid .num{font-variant-numeric:tabular-nums}
.pcard-expl{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line-2);font-size:var(--fs-2);color:var(--ink-2);line-height:1.5}


/* alerta de pagamento recente (±30 dias) */
.alerta-pgto{display:flex;align-items:center;gap:14px;margin:20px 0 2px;padding:var(--pad-sm);border-radius:var(--radius-lg);
  background:linear-gradient(120deg,#E7F6EF,#F4FBF7);border:1px solid #C6E6D6;box-shadow:0 14px 30px -16px rgba(31,157,87,.6)}
.alerta-pgto-ico{width:40px;height:40px;border-radius:var(--radius);background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alerta-pgto-ico svg{width:22px;height:22px}
.alerta-pgto-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.alerta-pgto-txt b{font-size:var(--fs-4);font-weight:800;color:#0E5B37;letter-spacing:-.01em}
.alerta-pgto-txt span{font-size:var(--fs-2);color:var(--ink-2)}
.alerta-pgto-btn{flex-shrink:0;border:0;cursor:pointer;font-family:var(--sans);font-weight:800;font-size:var(--fs-3);
  padding:11px 20px;border-radius:var(--radius-pill);background:var(--g-ok-txt);color:#fff;transition:background .15s,transform .1s;white-space:nowrap;min-height:44px}
.alerta-pgto-btn:hover{background:#0E5B37;transform:translateY(-1px)}

/* mini-rows (Pedidos por situação): agora com datas e clicáveis */
.mini{cursor:pointer;border-radius:var(--radius-sm);padding-inline:6px;transition:background .12s}
.mini:hover{background:var(--surface-warm)}
.mini:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.mini-datas{display:block;width:100%;font-size:var(--fs-1);color:var(--muted);margin-top:3px}
.mini-datas .prev{color:var(--g-and-txt);font-weight:700}
.mini-datas .pago{color:var(--g-ok-txt);font-weight:700}

/* pill "pago" nas situações concluídas recentes */
.pill-pago{font-size:var(--fs-1);font-weight:800;padding:3px 9px;border-radius:var(--radius-pill);background:var(--g-ok-txt);color:#fff;white-space:nowrap}

/* filtros + busca do detalhamento */
.det-filtros{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:14px}
.det-busca{position:relative;flex:1 1 220px;min-width:170px}
.det-busca svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
/* Mesmo campo de busca das outras 12 páginas (15px, 12/16, pílula) — só o recuo
   à esquerda muda, para caber a lupa. */
.det-busca input{width:100%;font-family:var(--sans);font-size:var(--fs-4);padding:12px 16px 12px 40px;border:1px solid var(--line-2);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink)}
.det-busca input:focus{outline:2px solid var(--brand-teal);outline-offset:1px;border-color:transparent}
.det-sel{font-family:var(--sans);font-size:var(--fs-2);font-weight:600;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink);cursor:pointer}
.det-sel:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.det-limpar{font-family:var(--sans);font-size:var(--fs-2);font-weight:700;padding:10px 14px;border:1px solid var(--line-2);border-radius:var(--radius-pill);background:none;color:var(--ink-2);cursor:pointer}
.det-limpar:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.det-count{font-size:var(--fs-1);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 2px}
.det-barra{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:14px}
.det-fbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:var(--fs-2);font-weight:700;padding:10px 14px;border:1px solid var(--line-2);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink-2);cursor:pointer}
.det-fbtn svg{width:15px;height:15px}
.det-fbtn:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.det-fbtn.ativo{border-color:var(--verde);background:#EAF7EF;color:#0E5B37}
.det-fbadge{display:none;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-pill);background:var(--g-ok-txt);color:#fff;font-size:var(--fs-1);font-weight:800;line-height:18px;text-align:center}
.det-fbtn.ativo .det-fbadge{display:inline-block}
.det-painel{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:10px;padding:12px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface-warm)}
.det-painel[hidden]{display:none}
.det-painel .det-busca{flex:1 1 220px}

.chart-full{margin-bottom:16px}

/* ════════ Topo: número-herói + fila de indicadores ════════ */
.heroi{margin:24px 0 0;padding:var(--pad-lg);border:none;border-radius:var(--radius-lg);color:#fff;
  /* O gradiente da marca clareia no canto de baixo: medido a 390px, o branco cai para
     4,38:1 justamente na última linha. O véu escuro devolve o contraste sem trocar a cor. */
  background:linear-gradient(180deg,rgba(7,48,52,0) 45%,rgba(7,48,52,.22) 100%),
             linear-gradient(124deg,var(--brand-dark) 0%,var(--brand-teal) 100%);
  box-shadow:0 18px 38px -18px rgba(6,48,51,.6)}

.heroi .lbl{color:#fff}
.heroi-v{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1.04;margin-top:8px;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media(min-width:720px){.heroi-v{font-size:56px}}
@media(max-width:420px){.heroi-v{font-size:34px}}
/* branco a 90% sobre o lado claro do gradiente dá 4,24:1 a 390px — texto corrido
   de 15px precisa de 4,5. Branco cheio; a hierarquia fica no <b>, não na opacidade. */
.heroi-sub{font-size:var(--fs-4);color:#fff;margin-top:10px;line-height:1.5;max-width:52ch}
.heroi-sub b{color:#fff;font-weight:800}

.heroi-legs .l-rec{background:#8FE3B4}
.heroi-legs .l-fal{background:rgba(255,255,255,.30)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-top:14px}
.tile{padding:var(--pad)}
.tile .v{font-size:clamp(15px,4.2vw,24px);font-weight:800;letter-spacing:-.02em;margin-top:7px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow-wrap:normal}
.tile .s{font-size:var(--fs-2);color:var(--muted);margin-top:4px;line-height:1.45}

/* ════════ Blocos recolhidos — detalhe só se o cliente pedir ════════ */
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);margin-top:12px;overflow:hidden}
.bloco>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:var(--pad);min-height:44px}

.bloco>summary::marker{content:''}
.bloco>summary:hover{background:var(--surface-warm)}

.bloco-t{flex:1;min-width:0}
.bloco-t b{display:block;font-size:var(--fs-4);font-weight:800;letter-spacing:-.01em;color:var(--ink)}

.bloco>summary .chev{width:20px;height:20px}
.bloco[open]>summary .chev{transform:rotate(180deg)}
.bloco-body{padding:var(--pad)}
.bloco-body>.acc{margin-top:14px}
.bloco-nota{font-size:var(--fs-2);color:var(--ink-2);line-height:1.55;background:var(--surface-warm);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:14px}
@media(max-width:640px){.bloco>summary{padding:15px 15px}.bloco-body{padding:14px 15px 18px}}

/* ════════ Gráficos: alturas por tipo ════════ */
.cbox-alto{position:relative;height:300px}
.cbox-fino{position:relative;height:34px;margin:6px 0 2px}

/* legenda em HTML (controlamos traço/hachura, não só a cor) */

.leg-item{display:flex;align-items:center;gap:9px;font-size:var(--fs-2);color:var(--ink-2);font-weight:600}

.leg-sw.solida{background:rgba(46,157,95,.28);border:2px solid var(--g-ok)}
.leg-sw.tracejada{border:2px dashed var(--g-and);
  background:repeating-linear-gradient(45deg,rgba(232,137,46,.28) 0 3px,transparent 3px 6px)}

.leg-item b{color:var(--ink);font-variant-numeric:tabular-nums}

.duo .v{font-size:var(--fs-5);font-weight:800;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.duo .p{font-size:var(--fs-2);color:var(--muted);margin-top:3px}
.duo .k i{margin-right:6px;vertical-align:middle}
.prop{display:flex;height:16px;border-radius:var(--radius-pill);overflow:hidden;background:#EFE6D6;border:1px solid var(--line)}
.prop i{display:block;height:100%}

.leg-fil{cursor:pointer;border:0;background:none;font-family:var(--sans);text-align:left;padding:0}

<script>
(function(){

  ];
  // tipo -> [rótulo, esqueleto de mensagem]
  var TIPOS = {
    livre:            ['Chamado livre', ''],
    solicitar_nf:     ['Solicitar nota fiscal', 'Solicito a emissão de uma nota fiscal.\n\nTomador (cliente):\nValor:\nDescrição do serviço:\nData desejada:'],
    duvida:           ['Tirar uma dúvida', 'Minha dúvida é:\n\n'],

    previa_admissao:  ['Prévia de admissão', 'Estou avaliando uma contratação (prévia, ainda sem formalizar).\n\nCargo cogitado:\nFaixa salarial:\nObservações:'],
    contratacao:      ['Formalizar admissão', 'Quero formalizar uma contratação.\n\nNome do colaborador:\nCargo:\nSalário:\nData de início:\nObservações:'],
    previa_rescisao:  ['Prévia de rescisão', 'Estou avaliando desligar um colaborador (prévia).\n\nColaborador:\nMotivo:\nObservações:'],
    rescisao:         ['Formalizar desligamento', 'Quero formalizar um desligamento.\n\nColaborador:\nMotivo:\nData prevista:\nAviso (trabalhado/indenizado):\nObservações:']
  };
  var ORDEM_TIPOS = ['livre','solicitar_nf','duvida','ferias','previa_admissao','contratacao','previa_rescisao','rescisao'];
  // Tipo do DOCUMENTO anexado -> define para qual PASTA (programa) o arquivo vai.
  // As chaves batem com o backend (COLUNA_POR_TIPO_DOC); a pasta vem do Site Links.
  var DOCTIPOS = [
    ['principal','Documentos recebidos (geral)'],
    ['extratos','Extratos bancários'],
    ['notas','Notas fiscais e comprovantes'],
    ['outros','Outros']
  ];
  // O tipo de solicitação DEPENDE da área (não faz sentido pedir férias em Equiparação).
  var TIPOS_POR_AREA = {
    fiscal:       ['livre','solicitar_nf','duvida'],
    dpto_pessoal: ['livre','ferias','previa_admissao','contratacao','previa_rescisao','rescisao','duvida'],
    contabil:     ['livre','duvida'],
    societario:   ['livre','duvida'],
    equiparacao:  ['livre','duvida'],
    outros:       ['livre','duvida']
  };
  function tiposDaArea(area){ return TIPOS_POR_AREA[area] || TIPOS_POR_AREA.outros; }
  function opcoesTipo(area, sel){
    return tiposDaArea(area).map(function(t){
      return '<option value="'+t+'"'+(t===sel?' selected':'')+'>'+esc(TIPOS[t][0])+'</option>';
    }).join('');
  }

  // ---- id/código a partir da URL (?id=&codigo= ou #id-codigo) -------------
  function idc(){
    var qs = new URLSearchParams(location.search);
    var id = qs.get('id')||'', cod = qs.get('codigo')||'';
    if(!id){
      var h = (location.hash||'').replace('#','').trim();
      var m = h.match(/^(\d+)-(.+)$/); var s = h.match(/^(\d+)$/);
      if(m){ id=m[1]; cod=m[2]; } else if(s){ id=s[1]; }
    }
    return { id:String(id).replace(/\D/g,''), codigo:String(cod).trim() };
  }
  /* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
     e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
     chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
     deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
  var JSONP_TETO = 45000, JSONP_PAUSA = 4000;

  /* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
     salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
     queima tentativa — repetir qualquer um desses lança em duplicidade. */
  function jsonpRepetivel(url){
    return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
  }
  function jsonpAviso(txt){
    var p = document.getElementById('espera-txt')
         || document.querySelector('#app .state p')
         || document.querySelector('.state p');
    if(p) p.textContent = txt;
  }
  function jsonpTentativa(url){
    return new Promise(function(ok,fail){
      var cb='b4ucb_'+Math.random().toString(36).slice(2);
      var s=document.createElement('script');
      var t=setTimeout(function(){ limpa(); fail(new Error('A API não respondeu.')); }, JSONP_TETO);
      function limpa(){ clearTimeout(t); try{delete window[cb];}catch(e){window[cb]=undefined;} s.remove(); }
      window[cb]=function(d){ limpa(); ok(d); };
      s.onerror=function(){ limpa(); fail(new Error('Não consegui alcançar a API.')); };
      s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
      document.body.appendChild(s);
    });
  }
  /* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
     deixou o cache quente no servidor, então a segunda costuma voltar rápido. Enquanto
     espera, a tela diz que ainda estamos buscando — erro só se a segunda também falhar. */
  function jsonp(url){
    return jsonpTentativa(url).catch(function(e){
      if(!jsonpRepetivel(url)) throw e;
      if(typeof pararEspera === 'function'){ try{ pararEspera(); }catch(_){} }
      jsonpAviso('Ainda estou buscando — tentando de novo…');
      return new Promise(function(r){ setTimeout(r, JSONP_PAUSA); })
        .then(function(){ return jsonpTentativa(url); });
    });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* Traduz qualquer erro para uma frase que o cliente entende — e que não o culpa.
     `e.message` NUNCA vai para a tela: ele é vocabulário nosso, não dele. */
  function msgAmigavel(e){
    var m = String((e && e.message) || e || '');
    if (/API|alcançar|respondeu|network|timeout|Failed to fetch/i.test(m))
      return 'Não consegui falar com o sistema agora. Confira a sua internet e tente de '
           + 'novo em alguns segundos — nada do que você digitou foi perdido.';
    if (/restrito|acesso|código|senha|contato/i.test(m))
      return 'Este link não está mais valendo. Peça um novo acesso para a gente que '
           + 'reenviamos na hora.';
    return 'Deu um problema do nosso lado, não seu. A equipe já foi avisada. Se for '
         + 'urgente, chame no WhatsApp.';
  }

  /* A segunda visita não precisa recomeçar do esqueleto. Guardamos o último payload por
     6h e pintamos com ele na hora, com tarja de "atualizando"; quando a resposta chega,
     redesenhamos. Dado financeiro no aparelho dele — por isso prazo curto e limpeza no
     logout (B4U.limparCache), junto do aparelho confiável. */
  var CACHE_MS = 6 * 60 * 60 * 1000;
  function cacheChave(tipo, id){ return 'b4u_pl_' + tipo + '_' + id; }
  function cacheLer(tipo, id){
    try {
      var o = JSON.parse(localStorage.getItem(cacheChave(tipo, id)) || 'null');
      if (!o || (Date.now() - o.ts) > CACHE_MS) return null;
      return o.raw;
    } catch (e) { return null; }
  }
  function cacheGravar(tipo, id, raw){
    try { localStorage.setItem(cacheChave(tipo, id),
          JSON.stringify({ ts: Date.now(), raw: raw })); } catch (e) {}
  }
  function limparCache(){
    /* Sai o payload e sai também o b4u_disp_ (quais áreas o cliente tem): num aparelho
       compartilhado, a barra do próximo não pode herdar o mapa de painéis do anterior. */
    try { Object.keys(localStorage).forEach(function (k) {

  }

  var IC = {

    guias:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="m8.5 15 2 2 4-4"/></svg>',
    pessoal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><path d="M16 4.2c1.7.4 3 2 3 3.8s-1.3 3.4-3 3.8M23 20c0-2.8-2.3-5.1-5.4-5.8"/></svg>',
    fiscal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>',
    equiparacao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5Z"/><path d="m9 12 2 2 4-4"/></svg>'
  };

  var C = idc();
  var linkHome = 'index.html' + (C.id ? '#'+C.id+(C.codigo?'-'+C.codigo:'') : '');
  var linkTickets = 'meustickets.html' + (C.id ? '#'+C.id+(C.codigo?'-'+C.codigo:'') : '');
  var waHref = 'https://wa.me/'+WA+'?text='+encodeURIComponent('Olá, sou cliente back4you'+(C.id?' (ID '+C.id+')':'')+'.');

  // ---- links de área na própria barra --------------------------------------
  /* Do fiscal para a agenda não havia caminho: era voltar para a home e pagar outra
     chamada à API. Os links saem do `disponiveis` que a HOME já recebeu e gravou no
     aparelho (b4u_disp_<id>) — assim respeitam PAINEIS_OCULTOS e o acesso da pessoa
     sem esta página perguntar nada. Sem esse registro, só a agenda, que quem tem
     fiscal ou pessoal sempre tem. */
  var AREAS_LINK = [
    ['guias.html',       'Agenda',       'guias',       IC.guias],
    ['fiscal.html',      'Fiscal',       'fiscal',      IC.fiscal],
    ['dptopessoal.html', 'Pessoal',      'pessoal',     IC.pessoal],
    ['equiparacao.html', 'Equiparação',  'equiparacao', IC.equiparacao]
  ];
  function disponiveisSalvos(){
    try { var o = JSON.parse(localStorage.getItem('b4u_disp_'+C.id)||'null');
          return (o && (o.disponiveis || o)) || null; } catch(e){ return null; }
  }
  function linksDeArea(){
    var disp = disponiveisSalvos();
    var aqui = (location.pathname.split('/').pop()||'').toLowerCase();
    return AREAS_LINK.filter(function(a){
      if (a[0].toLowerCase() === aqui) return false;                       // não linkar a página atual
      if (a[2] === 'guias') return !disp || !!(disp.fiscal || disp.pessoal);
      return !!(disp && disp[a[2]]);
    }).slice(0, 2)                                                          // 2 links: a barra ainda tem 3 botões fixos
     .map(function(a){
       return '<a class="b4u-btn ghost" href="'+esc(a[0]+(C.id?('#'+C.id+(C.codigo?'-'+C.codigo:'')):''))+'" '+
              'title="'+esc(a[1])+'">'+a[3]+'<span class="b4u-lbl">'+esc(a[1])+'</span></a>';
     }).join('');
  }

  // ---- barra fixa ----------------------------------------------------------
  var bar = document.createElement('div');
  bar.className = 'b4u-bar';
  bar.innerHTML =
    '<a class="b4u-logo" href="'+esc(linkHome)+'"><span>back</span><span class="y">4you</span></a>' +
    (CFG.home ? '' :
      '<a class="b4u-btn ghost" href="'+esc(linkHome)+'">'+IC.home+'<span class="b4u-lbl">Início</span></a>') +
    (CFG.home ? '' : linksDeArea()) +
    '<a class="b4u-btn wa" href="'+esc(waHref)+'" target="_blank" rel="noopener">'+IC.wa+'<span class="b4u-lbl">WhatsApp</span></a>' +
    '<button type="button" class="b4u-btn call" id="b4u-open">'+IC.chat+'<span class="b4u-lbl">Abrir chamado</span></button>' +
    '<button type="button" class="b4u-icobtn" id="b4u-help" title="Reportar um erro ou pedir ajuda" aria-label="Reportar um erro ou pedir ajuda">'+IC.help+'</button>';
  document.body.insertBefore(bar, document.body.firstChild);
  // publica a altura da barra p/ os cabeçalhos internos grudarem logo abaixo dela
  function medirBarra(){ document.documentElement.style.setProperty('--b4u-bar-h', bar.offsetHeight + 'px'); }
  medirBarra();
  window.addEventListener('resize', medirBarra);
  window.addEventListener('load', medirBarra);

  // ---- modal ---------------------------------------------------------------
  var ov = document.createElement('div');
  ov.className = 'b4u-ov';
  document.body.appendChild(ov);

  function fecharModal(){ ov.classList.remove('on'); ov.innerHTML=''; ESQ_ATUAL=''; }

  /* Fechar por clique no fundo ou Esc NÃO pode apagar o que ele escreveu. Só é
     "limpo" o que ainda for igual ao esqueleto pré-preenchido do tipo escolhido. */
  var ESQ_ATUAL = '';
  function modalSujo(){
    var t = ov.querySelector('#b4u-msg'), a = ov.querySelector('#b4u-assunto');
    if(!t) return false;
    return String(t.value||'').trim() !== String(ESQ_ATUAL||'').trim()
        || !!(a && a.value.trim());
  }
  function tentarFechar(){ if(modalSujo()) pedirDescartar(); else fecharModal(); }
  function montarFoot(){
    var foot = ov.querySelector('.b4u-foot'); if(!foot) return;
    foot.innerHTML =
      '<button type="button" class="b4u-btn cancel" id="b4u-cancel">Cancelar</button>' +
      '<button type="button" class="b4u-btn primary" id="b4u-send">Enviar chamado</button>';
    foot.querySelector('#b4u-cancel').addEventListener('click', tentarFechar);
    foot.querySelector('#b4u-send').addEventListener('click', enviar);
  }
  function pedirDescartar(){
    var foot = ov.querySelector('.b4u-foot'); if(!foot){ fecharModal(); return; }
    foot.innerHTML =
      '<button type="button" class="b4u-btn cancel" id="b4u-keep">Continuar escrevendo</button>' +
      '<button type="button" class="b4u-btn primary" id="b4u-discard">Descartar o que escrevi</button>';
    var err = ov.querySelector('#b4u-erro');
    if(err) err.textContent = 'Você escreveu algo neste chamado. Quer mesmo sair sem enviar?';
    foot.querySelector('#b4u-keep').addEventListener('click', function(){
      if(err) err.textContent=''; montarFoot();
      var t = ov.querySelector('#b4u-msg'); if(t) t.focus();
    });
    foot.querySelector('#b4u-discard').addEventListener('click', fecharModal);
  }

  function abrir(opts){
    opts = opts || {};
    var areaSel = opts.area || CFG.area || 'outros';
    var tipoSel = opts.tipo || 'livre';
    if (tiposDaArea(areaSel).indexOf(tipoSel) < 0) tipoSel = tiposDaArea(areaSel)[0];   // tipo válido p/ a área
    ov.innerHTML =
      '<div class="b4u-modal" role="dialog" aria-modal="true" aria-label="Abrir chamado">' +
        '<h3>Abrir um chamado</h3>' +
        '<div class="b4u-sub">Registramos aqui e retornamos em até 48h úteis. Você pode acompanhar em “Meus chamados”.</div>' +
        '<div class="b4u-fld"><label for="b4u-area">Área</label><select id="b4u-area">' +
          AREAS.map(function(a){ return '<option value="'+a[0]+'"'+(a[0]===areaSel?' selected':'')+'>'+esc(a[1])+'</option>'; }).join('') +
        '</select></div>' +
        '<div class="b4u-fld"><label for="b4u-tipo">Tipo de solicitação</label><select id="b4u-tipo">' +
          opcoesTipo(areaSel, tipoSel) +
        '</select></div>' +
        '<div class="b4u-fld"><label for="b4u-assunto">Assunto</label><input id="b4u-assunto" maxlength="120" placeholder="Resumo em uma linha"></div>' +
        '<div class="b4u-fld"><label for="b4u-msg">Mensagem</label><textarea id="b4u-msg" placeholder="Descreva o que você precisa…"></textarea></div>' +
        '<div class="b4u-fld"><label for="b4u-file">Anexo <span style="font-weight:400;color:#6E6256">(opcional · até 10 MB)</span></label>' +
          '<input type="file" id="b4u-file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.doc,.docx,.xls,.xlsx,.csv,.txt,.xml,.ofx,.zip"></div>' +
        '<div class="b4u-fld" id="b4u-tipodoc-wrap" style="display:none">' +
          '<label for="b4u-tipodoc">Tipo do documento</label><select id="b4u-tipodoc">' +
            DOCTIPOS.map(function(d){ return '<option value="'+d[0]+'">'+esc(d[1])+'</option>'; }).join('') +
          '</select>' +
          '<div class="b4u-sub" style="padding:6px 0 0">Enviamos seu arquivo direto para a pasta certa do seu programa.</div>' +
        '</div>' +
        '<div class="b4u-err" id="b4u-erro"></div>' +
        '<div class="b4u-foot">' +
          '<button type="button" class="b4u-btn cancel" id="b4u-cancel">Cancelar</button>' +
          '<button type="button" class="b4u-btn primary" id="b4u-send">Enviar chamado</button>' +
        '</div>' +
      '</div>';
    ov.classList.add('on');
    var selTipo = ov.querySelector('#b4u-tipo');
    var txt = ov.querySelector('#b4u-msg');
    function aplicaSkeleton(force){
      var esq = TIPOS[selTipo.value] ? TIPOS[selTipo.value][1] : '';
      if(force || !txt.value.trim()) txt.value = esq;
      ESQ_ATUAL = esq;                 // referência do que ainda é "vazio", não texto dele
    }
    aplicaSkeleton(true);
    selTipo.addEventListener('change', function(){ aplicaSkeleton(true); txt.focus(); });
    // trocar a ÁREA repovoa os tipos válidos para ela
    ov.querySelector('#b4u-area').addEventListener('change', function(){
      selTipo.innerHTML = opcoesTipo(this.value, selTipo.value);
      aplicaSkeleton(true);
    });
    ov.querySelector('#b4u-cancel').addEventListener('click', tentarFechar);
    ov.addEventListener('click', function(e){ if(e.target===ov) tentarFechar(); });
    ov.querySelector('#b4u-send').addEventListener('click', enviar);
    // o seletor de "tipo do documento" só aparece quando há um arquivo anexado
    var fileEl = ov.querySelector('#b4u-file');
    var tdWrap = ov.querySelector('#b4u-tipodoc-wrap');
    fileEl.addEventListener('change', function(){
      tdWrap.style.display = (fileEl.files && fileEl.files.length) ? 'block' : 'none';
    });
    ov.querySelector('#b4u-assunto').focus();
  }

  function enviar(){
    var cc = idc();
    var erroEl = ov.querySelector('#b4u-erro');
    var btn = ov.querySelector('#b4u-send');
    erroEl.textContent = '';
    if(!cc.id || !cc.codigo){ erroEl.textContent = 'Abra o painel pelo seu link (com ID e código) para enviar um chamado.'; return; }
    var area = ov.querySelector('#b4u-area').value;
    var tipo = ov.querySelector('#b4u-tipo').value;
    var assunto = ov.querySelector('#b4u-assunto').value.trim();
    var msg = ov.querySelector('#b4u-msg').value.trim();
    if(!msg){ erroEl.textContent = 'Escreva a mensagem do chamado.'; return; }
    var fileEl = ov.querySelector('#b4u-file');
    var file = fileEl && fileEl.files && fileEl.files[0];
    if(file && file.size > 10*1024*1024){ erroEl.textContent = 'O anexo tem mais de 10 MB. Envie um arquivo menor.'; return; }
    btn.disabled = true; btn.textContent = 'Enviando…';
    var falhou = function(e){ btn.disabled=false; btn.textContent='Enviar chamado'; erroEl.textContent = msgAmigavel(e); };
    if(file){
      // COM arquivo -> POST (JSONP/GET não comporta base64)
      var reader = new FileReader();
      reader.onload = function(){
        var base64 = String(reader.result||'').split(',')[1] || '';
        var tdEl = ov.querySelector('#b4u-tipodoc');
        var tipoDoc = (tdEl && tdEl.value) ? tdEl.value : 'principal';
        var body = JSON.stringify({ id:cc.id, codigo:cc.codigo, acao:'ticket_anexo',

          arquivo_nome:file.name, arquivo_tipo:file.type, arquivo_base64:base64 });
        fetch(api(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body })
          .then(function(r){ return r.json(); })
          .then(function(d){ if(d && d.erro) throw new Error(d.erro); sucesso(); })
          .catch(falhou);
      };
      reader.onerror = function(){ falhou(new Error('Não consegui ler o arquivo.')); };
      reader.readAsDataURL(file);
      return;
    }
    // SEM arquivo -> JSONP como sempre
    var qs = new URLSearchParams({ id:cc.id, codigo:cc.codigo, acao:'ticket',
      area:area, tipo:tipo, assunto:assunto, mensagem:msg });
    jsonp(api()+'?'+qs.toString()).then(function(d){
      if(d && d.erro) throw new Error(d.erro);
      sucesso();
    }).catch(falhou);
  }

  function sucesso(){
    ov.innerHTML =
      '<div class="b4u-modal">' +
        '<div class="b4u-ok">' +
          '<div class="chk">'+IC.chk+'</div>' +
          '<h3>Chamado registrado</h3>' +
          '<p>Recebemos sua solicitação e retornamos em até 48h úteis. Em breve o acompanhamento também chegará por e-mail.</p>' +
          '<div class="b4u-foot" style="position:static;padding:0">' +
            '<button type="button" class="b4u-btn cancel" id="b4u-fecha">Fechar</button>' +
            '<a class="b4u-btn primary" id="b4u-ir-tickets" href="'+esc(linkTickets)+'">Ir para meus chamados</a>' +
          '</div>' +
        '</div>' +
      '</div>';
    ov.querySelector('#b4u-fecha').addEventListener('click', fecharModal);
    // Se já estou em meus chamados, trocar só o hash não recarrega — força o reload
    // para o novo chamado aparecer. Em outra página, navega normalmente.
    ov.querySelector('#b4u-ir-tickets').addEventListener('click', function(e){
      if (/meustickets\.html/i.test(location.pathname)){
        e.preventDefault();
        if (C.id) location.hash = C.id + (C.codigo ? '-'+C.codigo : '');
        location.reload();
      }
    });
  }

  bar.querySelector('#b4u-open').addEventListener('click', function(){ abrir({}); });
  bar.querySelector('#b4u-help').addEventListener('click', function(){ abrir({ area:'outros', tipo:'livre' }); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && ov.classList.contains('on')) tentarFechar(); });

  // ---- Puxar para atualizar (mobile) --------------------------------------
  // Só age quando a página está no topo e o gesto é para baixo; recarrega ao soltar
  // depois do limiar. Não atrapalha a rolagem normal.
  (function(){
    var ind=document.createElement('div'); ind.className='b4u-ptr';
    ind.innerHTML='<span class="ring"></span><span class="txt">Puxe para atualizar</span>';
    document.body.appendChild(ind);
    var y0=null, dist=0, LIM=70, ativo=false;
    function topo(){ return (window.scrollY||document.documentElement.scrollTop||0)<=0; }
    window.addEventListener('touchstart',function(e){
      if(e.touches.length!==1 || !topo() || (ov&&ov.classList.contains('on'))){ y0=null; return; }
      y0=e.touches[0].clientY; ativo=true;
    },{passive:true});
    window.addEventListener('touchmove',function(e){
      if(!ativo||y0===null) return;
      dist=e.touches[0].clientY - y0;
      if(dist<=0){ ind.style.height='0'; return; }
      if(!topo()){ ativo=false; ind.style.height='0'; return; }
      var h=Math.min(dist*0.5, LIM+20); ind.style.height=h+'px';
      ind.querySelector('.txt').textContent = dist>LIM?'Solte para atualizar':'Puxe para atualizar';
    },{passive:true});
    window.addEventListener('touchend',function(){
      if(!ativo){ return; } ativo=false;
      if(dist>LIM){ ind.classList.add('spin'); ind.style.height=(LIM)+'px'; ind.querySelector('.txt').textContent='Atualizando…'; setTimeout(function(){ location.reload(); },150); }
      else { ind.style.height='0'; }
      y0=null; dist=0;
    });
  })();

  window.B4U = { __ready:true, area: CFG.area||'outros', abrirChamado: abrir, meusTickets: linkTickets,
    msgAmigavel: msgAmigavel,
    CACHE_MS: CACHE_MS, cacheChave: cacheChave, cacheLer: cacheLer,
    cacheGravar: cacheGravar, limparCache: limparCache,
    // helper de skeleton: devolve N barrinhas "carregando" (as páginas usam no lugar do spinner)
    skeleton: function(linhas, alt){ var h=alt||16, g=[]; for(var i=0;i<(linhas||3);i++){
      var w=[92,78,85,60][i%4]; g.push('<div class="b4u-skel" style="height:'+h+'px;width:'+w+'%;margin:0 auto 12px"></div>'); }
      return g.join(''); } };
})();

/* Atalhos de teclado: "/" foca a busca, "Esc" limpa. Fica quieto quando a pessoa
   já está digitando em outro campo (input, textarea, select ou área editável). */
const ATALHOS_LIGADOS = {};
function atalhosDeBusca(idCampo, aoLimpar, aoFocar){
  if(ATALHOS_LIGADOS[idCampo]) return;            // não empilhar listeners em re-render
  ATALHOS_LIGADOS[idCampo] = true;
  document.addEventListener('keydown', ev=>{
    const campo = document.getElementById(idCampo); if(!campo) return;
    const alvo = ev.target, tag = (alvo && alvo.tagName || '').toLowerCase();
    const digitando = tag==='input' || tag==='textarea' || tag==='select' || (alvo && alvo.isContentEditable);
    if(ev.key==='/' && !digitando && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
      ev.preventDefault();
      if(aoFocar) aoFocar();                      // abre o painel de filtros, se houver
      const det = campo.closest && campo.closest('details');
      if(det && !det.open) det.open = true;       // e o bloco recolhido que a contém
      campo.focus(); campo.select && campo.select(); return;
    }
    if(ev.key==='Escape' && (alvo===campo || (!digitando && campo.value))){
      if(!campo.value){ campo.blur(); return; }
      campo.value=''; if(aoLimpar) aoLimpar();
    }
  });
}
const brl = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});

/* Reais abreviado para eixos e rótulos: "R$ 120 mil", "R$ 1,2 mi". Nunca notação científica. */
function brlCurto(v){
  const n = Number(v)||0, a = Math.abs(n), s = n<0 ? '-' : '';
  const f = (x,d) => x.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d});
  if (a >= 1e9) return s+'R$ '+f(a/1e9,1)+' bi';
  if (a >= 1e6) return s+'R$ '+f(a/1e6,1)+' mi';
  if (a >= 1e3) return s+'R$ '+f(a/1e3, a<1e4?1:0)+' mil';
  return s+'R$ '+f(a,0);
}

/* Hachura diagonal para o que ainda é "previsto" — diferencia sem depender só da cor. */
function hachura(ctx, cor, alfa){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 8;
    const x = c.getContext('2d'); if (!x || !ctx) return cor;
    x.strokeStyle = cor; x.globalAlpha = (alfa == null ? 0.5 : alfa); x.lineWidth = 2;
    x.beginPath();
    x.moveTo(0,8); x.lineTo(8,0);
    x.moveTo(-2,2); x.lineTo(2,-2);
    x.moveTo(6,10); x.lineTo(10,6);
    x.stroke();
    return ctx.createPattern(c,'repeat') || cor;
  } catch(e){ return cor; }
}
const dBR = s => {
  if(!s) return '—';
  if (s instanceof Date) return isNaN(s.getTime()) ? '—'
    : String(s.getDate()).padStart(2,'0')+'/'+String(s.getMonth()+1).padStart(2,'0')+'/'+s.getFullYear();
  const str = String(s).trim();
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);   // AAAA-MM-DD (com ou sem hora)
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})/);      // dd/mm/aaaa
  if (m) return `${m[1]}/${m[2]}/${m[3]}`;
  return str;
};

function getIdCodigo(){
  const qs = new URLSearchParams(location.search);
  let id = qs.get('id') || '';
  let codigo = qs.get('codigo') || '';
  if (!id){
    const h = location.hash.replace('#','').trim();
    const comCodigo = h.match(/^(\d+)-(.+)$/);
    const soId = h.match(/^(\d+)$/);
    if (comCodigo) { id = comCodigo[1]; codigo = comCodigo[2]; }
    else if (soId) { id = soId[1]; }
  }
  return { id: id.replace(/\D/g,''), codigo: codigo.trim() };
}

/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
function jsonpAviso(txt){
  const p = document.getElementById('espera-txt')
       || document.querySelector('#app .state p')
       || document.querySelector('.state p');
  if(p) p.textContent = txt;
}
function jsonpTentativa(url){
  return new Promise((ok,fail)=>{
    const cb = 'cb_'+Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(()=>{ limpa(); fail(new Error('A API não respondeu.')); }, JSONP_TETO);
    function limpa(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { limpa(); ok(d); };
    s.onerror = () => { limpa(); fail(new Error('Não consegui alcançar a API.')); };
    s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
    document.body.appendChild(s);
  });
}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. Enquanto
   espera, a tela diz que ainda estamos buscando — erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    if(typeof pararEspera === 'function'){ try{ pararEspera(); }catch(_){} }
    jsonpAviso('Ainda estou buscando — tentando de novo…');
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}

/* Aceita muitas grafias de competência trimestral e normaliza para
   "2º Trimestre de 2024". Ex.: "Trim2/2024", "2Trim 2024", "2tri 24",
   "1º TRIM/2023", "T2/2024", "2º trimestre de 2024". */
function prepararCompetencia(c){
  const raw = String(c == null ? '' : c).trim();
  const s = raw.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let tri = 0, ano = 0;
  // trimestre: dígito 1-4 antes OU depois de trimestre/trim/tri/t
  let m = s.match(/([1-4])\s*[oº°ª]?\s*(?:trimestre|trim|tri|t)\b/)
       || s.match(/(?:trimestre|trim|tri|t)\.?\s*[oº°ª]?\s*[\/:\-]?\s*([1-4])\b/);
  if (m) tri = Number(m[1]);
  // ano: 4 dígitos preferencial; senão 2 dígitos -> 20xx
  const a4 = s.match(/\b(19|20)(\d{2})\b/);
  if (a4) ano = Number(a4[1] + a4[2]);
  else { const a2 = s.match(/(?:^|[^\d])(\d{2})(?!\d)/); if (a2) ano = 2000 + Number(a2[1]); }
  if (!tri || !ano) return { tri: 0, ano: 0, ord: 0, label: raw || '—' };
  return { tri, ano, ord: ano * 4 + tri, label: `${tri}º Trimestre de ${ano}` };
}

/** Algumas planilhas trazem o código de arrecadação da Receita (número) em vez do
    nome do tributo — ex.: 2089/2372 no lucro presumido, 3373/6012 no ajuste anual
    do lucro real, 5993/2484 na estimativa mensal do lucro real. Traduz pro nome;
    se já vier como texto ("IRPJ"/"CSLL"), passa direto. */
const CODIGO_TRIBUTO = {
  '2089':'IRPJ', '2372':'CSLL',
  '3373':'IRPJ', '6012':'CSLL',
  '5993':'IRPJ', '2484':'CSLL',
};
function normalizarTributo(v){
  const s = String(v==null ? '' : v).trim();
  return CODIGO_TRIBUTO[s] || s || 'Outro';
}

function preparar(raw){
  const pedidos = (raw.pedidos||[]).map(p => {
    // Critério de verdade: se tem data_pagamento, foi aprovado e será (ou já foi) pago —
    // isso vale mais que o texto de 'status', que pode dizer só "Análise concluída"
    // (ambíguo por definição da própria Receita) mesmo quando já se sabe o resultado.
    const concluido = !!p.data_pagamento;
    const info = STATUS_INFO[p.status] || {grupo:'neutro', txt:''};
    return {
      ...p,
      tributo: normalizarTributo(p.tributo),
      _comp: prepararCompetencia(p.competencia),
      _concluido: concluido,
      _grupo: concluido ? 'concluido' : info.grupo,
      _explicacao: concluido
        ? 'Crédito reconhecido pela Receita Federal — valor aprovado e em pagamento (ou já pago).'
        : info.txt,
    };
  }).sort((a,b) => a._comp.ord - b._comp.ord || String(a.tributo).localeCompare(String(b.tributo)));
  return { cfg: raw.config||{}, id: raw.id, pedidos, documentos: raw.documentos||[], memoria: raw.memoria||null, atualizado_em: raw.atualizado_em };
}

/* As três perguntas do cliente: quanto já recebi, quanto ainda vem, quando.
   "Recebido" = pagamento com data já passada. "A receber" = aprovado com data marcada
   no futuro. "Em análise" = ainda sem data, valor corrigido pela SELIC. */
function resumoCliente(P){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const pagos = [], agendados = [], analise = [], encerrados = [];
  let recebido = 0, aReceber = 0, emAnalise = 0, encerrado = 0;
  (P||[]).forEach(p => {
    const d = p.data_pagamento ? parseData(p.data_pagamento) : null;
    if (d && d <= hoje){ pagos.push(p); recebido += valorPedido(p); }
    else if (d){ agendados.push(p); aReceber += valorPedido(p); }
    // cancelado, retificado ou não admitido: não traz dinheiro e não pode entrar na soma
    // (o retificado, em especial, já foi substituído por outro pedido — contaria duas vezes)
    else if (p._grupo === 'encerrado'){ encerrados.push(p); encerrado += num(p.valor_atualizado); }
    else { analise.push(p); emAnalise += num(p.valor_atualizado); }
  });
  const datasFuturas = agendados.map(p => parseData(p.data_pagamento)).filter(Boolean).sort((a,b)=>a-b);
  return { hoje, pagos, agendados, analise, encerrados, recebido, aReceber, emAnalise, encerrado,
    aindaVem: aReceber + emAnalise,
    totalEsperado: recebido + aReceber + emAnalise,
    totalPedido: (P||[]).reduce((s,p)=>s+num(p.valor_atualizado),0),
    proxima: datasFuturas.length ? datasFuturas[0] : null };
}

/* Converte 'AAAA-MM-DD' (ou algo que o Date entenda) num Date local. */
function parseData(s){
  if (!s) return null;
  const str = String(s).trim();
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);   // AAAA-MM-DD [HH:MM:SS]
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})/);      // dd/mm/aaaa
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(str); return isNaN(d.getTime()) ? null : d;
}
/* Dias corridos do envio até o pagamento (se houver) ou até hoje. */
function diasCorridos(p){
  const ini = parseData(p.data_transmissao);
  const fim = p.data_pagamento ? parseData(p.data_pagamento) : new Date();
  if (!ini || !fim) return null;
  return Math.max(0, (fim - ini) / 86400000);
}
/* Humaniza uma quantidade de dias: "23 dias", "8 meses", "1 ano e 3 meses". */
function humanizarDias(d){
  if (d == null) return '—';
  d = Math.round(d);
  if (d < 1) return 'menos de 1 dia';
  if (d < 45) return d === 1 ? '1 dia' : d + ' dias';
  const m = Math.round(d / 30.44);
  if (m < 12) return m === 1 ? '1 mês' : m + ' meses';
  const a = Math.floor(m / 12), r = m % 12;
  let s = a === 1 ? '1 ano' : a + ' anos';
  if (r) s += ' e ' + (r === 1 ? '1 mês' : r + ' meses');
  return s;
}

/* Dropdown 1 — PER/DCOMPs agrupados por situação padronizada.
   Só entram os status oficiais da Receita (STATUS_INFO) que realmente existem. */
function construirResumoStatus(M){
  const box = document.getElementById('pedidos-status');
  if (!box) return;

  const grupos = {};
  M.pedidos.forEach(p => {
    if (!STATUS_INFO[p.status] && !p._concluido) return;  // situações padronizadas + qualquer pedido já pago/creditado
    (grupos[p.status] = grupos[p.status] || []).push(p);
  });
  const chaves = Object.keys(grupos);
  if (!chaves.length){
    box.outerHTML = '<div class="card"><div class="vazio">Assim que os PER/DCOMPs receberem uma situação oficial da Receita, o resumo por situação aparece aqui.</div></div>';
    return;
  }

  // grupo visual de um status (verde só se todos daquele status já foram pagos)
  const grupoDe = st => {
    const itens = grupos[st];
    const canon = (STATUS_INFO[st] || {}).grupo || 'neutro';
    return itens.every(p => p._concluido) ? 'concluido' : canon;
  };
  chaves.sort((a,b) => {
    const d = GRUPO_ORDEM_VIS.indexOf(grupoDe(a)) - GRUPO_ORDEM_VIS.indexOf(grupoDe(b));
    if (d) return d;
    return grupos[b].length - grupos[a].length || a.localeCompare(b);
  });

  box.innerHTML = chaves.map(st => {
    const itens = grupos[st];
    const g = grupoDe(st);
    const concluido = g === 'concluido';
    const n = itens.length;
    const valorDe = p => concluido ? (num(p.valor_aprovado) || num(p.valor_atualizado)) : num(p.valor_atualizado);
    const valor = itens.reduce((s,p) => s + valorDe(p), 0);
    const tempos = itens.map(diasCorridos).filter(x => x != null);
    const media = tempos.length ? tempos.reduce((a,b)=>a+b,0) / tempos.length : null;
    const tempoLbl = concluido ? 'tempo médio até o pagamento' : 'tempo médio desde o envio';
    const expl = (STATUS_INFO[st] || {}).txt || '';
    const kLabel = concluido ? 'aprovado' : 'atualizado';

    const itensOrd = itens.slice().sort((a,b) => a._comp.ord - b._comp.ord || String(a.tributo).localeCompare(String(b.tributo)));
    const mini = itensOrd.map(p => {
      const ip = infoPagamento(p);
      const rec = pagamentoRecente(p);
      return `
      <div class="mini" data-key="${esc(p.numero_per_dcomp)}" role="button" tabindex="0" title="Abrir este PER/DCOMP no detalhamento">
        <div class="mini-l">
          <b>${p._comp.label}</b>
          <span class="mini-trib">${esc(p.tributo)}</span>
          ${rec ? '<span class="pill-pago">✓ pago</span>' : ''}
          <span class="mini-num">${esc(p.numero_per_dcomp)}</span>
          <span class="mini-datas">Transmissão ${dBR(p.data_transmissao)} · <span class="${ip.cls}">${ip.txt}</span></span>
        </div>
        <div class="mini-r"><div class="v">${brl(valorDe(p))}</div><div class="k">${kLabel}</div></div>
      </div>`;
    }).join('');

    return `
      <details class="acc-item ${g}">
        <summary>
          <span class="acc-dot" style="background:${GRUPO_COR[g]}"></span>
          <span class="acc-head-main">
            <span class="acc-head-title">${esc(st)}</span>
            <span class="acc-head-sub"><b>${n} PER/DCOMP</b> · ${tempoLbl}: <b>${humanizarDias(media)}</b></span>
          </span>
          <span class="acc-val"><span class="v num">${brl(valor)}</span><span class="k">${kLabel}</span></span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="acc-body">
          ${expl ? `<div class="acc-expl">${expl}</div>` : ''}
          ${mini}
        </div>
      </details>`;
  }).join('');

  // clicar numa linha (PER/DCOMP específico) abre o pedido correspondente no detalhamento
  box.addEventListener('click', e => {
    const row = e.target.closest('.mini[data-key]'); if (row) irParaPedido(row.dataset.key);
  });
  box.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('.mini[data-key]'); if (row){ e.preventDefault(); irParaPedido(row.dataset.key); }
  });
}

/* Filtrar, dar F5 e perder tudo é o jeito mais rápido de fazer alguém desistir do
   filtro. A visão vai para a QUERY; o #id-codigo é a credencial da sessão e não
   pode ser tocado — por isso mexemos só em searchParams e recolocamos o hash. */
function sincronizarURLDet(){
  try{
    const u = new URL(location.href);
    const set = (k,v) => { if (v) u.searchParams.set(k,v); else u.searchParams.delete(k); };
    set('q',   FILTRO.busca);
    set('ano', FILTRO.ano);
    set('sit', FILTRO.situacao);
    set('pag', FILTRO.pagamento);
    set('ord', ORDEM === 'comp' ? '' : ORDEM);
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  }catch(e){}
}
function lerURLDet(){
  try{
    const p = new URLSearchParams(location.search);
    FILTRO.busca     = p.get('q')   || '';
    FILTRO.ano       = p.get('ano') || '';
    FILTRO.situacao  = p.get('sit') || '';
    FILTRO.pagamento = p.get('pag') || '';
    const o = p.get('ord') || '';
    if (['pgto','valor-desc','valor-asc'].indexOf(o) >= 0) ORDEM = o;
  }catch(e){}
  return !!(FILTRO.busca || FILTRO.ano || FILTRO.situacao || FILTRO.pagamento);
}
let DETPEDIDOS = [];
let ORDEM = 'comp';   // 'comp' | 'pgto' | 'valor-desc' | 'valor-asc'
function valorPedido(p){ return p._concluido ? (num(p.valor_aprovado) || num(p.valor_atualizado)) : num(p.valor_atualizado); }
function ordenarDet(arr){
  const a = arr.slice();
  if (ORDEM === 'valor-desc') a.sort((x,y)=> valorPedido(y) - valorPedido(x));
  else if (ORDEM === 'valor-asc') a.sort((x,y)=> valorPedido(x) - valorPedido(y));
  else if (ORDEM === 'pgto') a.sort((x,y)=>{ const dx=parseData(x.data_pagamento), dy=parseData(y.data_pagamento); if(!dx&&!dy) return 0; if(!dx) return 1; if(!dy) return -1; return dy - dx; });
  else a.sort((x,y)=> x._comp.ord - y._comp.ord || String(x.tributo).localeCompare(String(y.tributo)));
  return a;
}
function filtrosAtivos(){ return ['busca','ano','situacao','pagamento'].filter(k => FILTRO[k]).length; }

/* Pagamento dentro da janela de ±30 dias de hoje (passado recente OU previsto próximo). */
function pagamentoRecente(p){
  if (!p.data_pagamento) return false;
  const d = parseData(p.data_pagamento); if (!d) return false;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dias = (d - hoje) / 86400000;
  return dias >= -30 && dias <= 30;
}
/* Rótulo de pagamento: "Pago em…" (passado) ou "Pagamento previsto…" (futuro). */
function infoPagamento(p){
  if (!p.data_pagamento) return { txt:'Pagamento a definir', cls:'' };
  const d = parseData(p.data_pagamento); const hoje = new Date(); hoje.setHours(0,0,0,0);
  if (d && d > hoje) return { txt:'Pagamento previsto ' + dBR(p.data_pagamento), cls:'prev', futuro:true };
  return { txt:'Pago em ' + dBR(p.data_pagamento), cls:'pago' };
}
function passaFiltro(p){
  if (FILTRO.ano && String(p._comp.ano) !== FILTRO.ano) return false;
  if (FILTRO.situacao){
    const t = FILTRO.situacao;
    if (t.slice(0,2) === 'g:' && p._grupo !== t.slice(2)) return false;
    if (t.slice(0,2) === 's:' && p.status !== t.slice(2)) return false;
  }
  if (FILTRO.pagamento === 'com' && !p.data_pagamento) return false;
  if (FILTRO.pagamento === 'sem' && p.data_pagamento) return false;
  if (FILTRO.pagamento === 'recente' && !pagamentoRecente(p)) return false;
  if (FILTRO.busca){
    const q = normTxt(FILTRO.busca);
    const hay = normTxt([p.numero_per_dcomp, p._comp.label, p.tributo, p.status].join(' '));
    if (!hay.includes(q)) return false;
  }
  return true;
}

     dizer quantos existem faria o cliente achar que perdeu pedido. */

  if (cont) cont.textContent = (arr.length === DETPEDIDOS.length

      : `${arr.length} de ${DETPEDIDOS.length} PER/DCOMP`)
    + (arr.length > n ? ` · mostrando ${n}` : '');

/* Deep-link para um PER/DCOMP específico: limpa filtros, abre e destaca o pedido. */
function irParaPedido(numero){
  Object.assign(FILTRO, { busca:'', ano:'', situacao:'', pagamento:'' });
  /* O teto não pode esconder justamente o pedido para onde estamos indo — o
     clique vem do resumo por situação e tem de chegar na linha certa. */
  const pos = ordenarDet(DETPEDIDOS.filter(passaFiltro))
    .findIndex(p => String(p.numero_per_dcomp) === String(numero));
  TETO = pos >= 0 ? Math.max(PASSO, Math.ceil((pos + 1) / PASSO) * PASSO) : PASSO;
  const outer = document.getElementById('det-outer'); if (outer) abrirDetalhesAte(outer);
  sincronizarControles();
  renderListaDetalhe();
  const alvo = document.querySelector('#det-lista .pitem[data-key="' + String(numero).replace(/"/g,'\\"') + '"]');
  if (alvo){
    alvo.open = true;
    alvo.classList.remove('flash'); void alvo.offsetWidth; alvo.classList.add('flash');
    alvo.scrollIntoView({ behavior:'smooth', block:'center' });

  }
}

/* Linha vertical marcando HOJE, com etiqueta. */
const PLUG_HOJE = {
  id:'linhaHoje',
  afterDatasetsDraw(chart){
    const i = chart.$hojeIdx;
    if (i == null || !chart.chartArea) return;
    const s = chart.scales.x, n = (chart.data.labels||[]).length;
    if (!s || !n) return;
    const a0 = Math.max(0, Math.min(n-1, Math.floor(i)));
    const a1 = Math.max(0, Math.min(n-1, a0+1));
    const p0 = s.getPixelForValue(a0), p1 = s.getPixelForValue(a1);
    const x = (a1 === a0) ? p0 : p0 + (i - a0) * (p1 - p0);
    const A = chart.chartArea, ctx = chart.ctx;
    if (x < A.left || x > A.right) return;
    ctx.save();
    ctx.setLineDash([5,4]); ctx.lineWidth = 1.5; ctx.strokeStyle = '#9C8E7E';
    ctx.beginPath(); ctx.moveTo(x, A.top); ctx.lineTo(x, A.bottom); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '700 11px Montserrat, system-ui, sans-serif';
    const t = 'hoje', w = ctx.measureText(t).width + 14;
    let bx = Math.min(Math.max(x - w/2, A.left), A.right - w);
    ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#D6C3AC'; ctx.lineWidth = 1;
    const by = A.top - 23, h = 18, r = 5;
    ctx.beginPath();
    ctx.moveTo(bx+r, by); ctx.arcTo(bx+w, by, bx+w, by+h, r); ctx.arcTo(bx+w, by+h, bx, by+h, r);
    ctx.arcTo(bx, by+h, bx, by, r); ctx.arcTo(bx, by, bx+w, by, r); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6E6256'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t, bx + w/2, by + h/2 + .5);
    ctx.restore();
  }
};

/* Rótulo direto do valor já aprovado, na ponta da barra verde. */
const PLUG_ROTULO_APROVADO = {

      if (!dentro && x + w > A.right) x = Math.max(A.left + 4, A.right - w);

};

/* Desenha só quando o bloco abre — canvas 0x0 dentro de <details> fechado não renderiza. */
function desenharAoAbrir(idBloco, fn){
  const d = document.getElementById(idBloco); if (!d) return;
  const roda = () => { if (d.dataset.drawn) return; d.dataset.drawn = '1';
    try { fn(); } catch(e){ console.warn('Gráfico indisponível:', e); } };
  if (d.open) roda();
  d.addEventListener('toggle', () => { if (d.open) roda(); });
}

/* chart.js está no <head> com defer: executa antes do DOMContentLoaded, mas DEPOIS
   deste script. Quando a tela é pintada pelo cache — que é síncrono — ele ainda não
   chegou. Em vez de perder os gráficos em silêncio, guardamos o desenho para quando
   ele chegar. Se o CDN falhar de vez, o try{}catch de cada gráfico cobre. */
let _grafPendente = null, _grafEsperando = false;
function desenharGraficos(M){
  if (typeof Chart === 'undefined'){
    _grafPendente = M;
    if (document.readyState === 'loading' && !_grafEsperando){
      _grafEsperando = true;
      document.addEventListener('DOMContentLoaded', () => {
        _grafEsperando = false;
        const alvo = _grafPendente; _grafPendente = null;
        if (alvo && typeof Chart !== 'undefined') desenharGraficos(alvo);
      }, { once:true });
    }
    return;
  }
  _grafPendente = null;
  graficoQuandoEntra(M);                                     // o único visível de saída
  blocoDeOndeVem(document.getElementById('tributos-bloco'), tributosDosPedidos(M.pedidos));
  desenharAoAbrir('bloco-situacoes', () => graficoSituacoes(M));
  desenharAoAbrir('bloco-anos',      () => graficoAnos(M));
}

/* ───────── 1. "Quando o dinheiro entra" — acumulado no tempo ───────── */
function mesChave(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function mesesEntre(k1, k2){
  const [a1,m1] = k1.split('-').map(Number), [a2,m2] = k2.split('-').map(Number);
  return (a2-a1)*12 + (m2-m1);
}
function serieDePagamentos(P){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const soma = {}, futuro = {};
  P.forEach(p => {
    if (!p.data_pagamento) return;
    const d = parseData(p.data_pagamento); if (!d) return;
    const k = mesChave(d);
    soma[k] = (soma[k]||0) + valorPedido(p);
    if (d > hoje) futuro[k] = true;
  });
  const chaves = Object.keys(soma).sort();
  if (!chaves.length) return null;
  const hojeK = mesChave(hoje);
  let ini = chaves[0], fim = chaves[chaves.length-1];
  // estica até o mês de hoje só se ele estiver perto — senão o eixo fica cheio de meses vazios
  if (hojeK < ini && mesesEntre(hojeK, ini) <= 12) ini = hojeK;
  if (hojeK > fim && mesesEntre(fim, hojeK) <= 12) fim = hojeK;
  const lista = []; let [ay,am] = ini.split('-').map(Number);
  const [fy,fm] = fim.split('-').map(Number);
  for (let g=0; g<600 && (ay<fy || (ay===fy && am<=fm)); g++){
    lista.push(ay+'-'+String(am).padStart(2,'0'));
    am++; if (am>12){ am=1; ay++; }
  }
  const mensal = lista.map(k => soma[k]||0);
  let acc = 0; const acum = mensal.map(v => (acc += v));
  let corte = -1;
  lista.forEach((k,i) => { if (k <= hojeK && !futuro[k]) corte = i; });
  const idxHoje = lista.indexOf(hojeK);
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
  return { lista, mensal, acum, corte, meses: chaves.length,
    hojeIdx: idxHoje >= 0 ? idxHoje + (hoje.getDate()-1)/diasNoMes : null,
    recebido: mensal.reduce((s,v,i)=> s + (i<=corte ? v : 0), 0),
    previsto: mensal.reduce((s,v,i)=> s + (i> corte ? v : 0), 0) };
}

function graficoQuandoEntra(M){
  const card = document.getElementById('card-tempo'); if (!card) return;
  const cv = document.getElementById('c5'); if (!cv) return;
  const S = serieDePagamentos(M.pedidos);
  const R = resumoCliente(M.pedidos);

  // Menos de dois meses com dado: um número diz mais do que um gráfico de um ponto só.
  if (!S || S.meses < 2){
    const unico = S ? S.lista[S.lista.findIndex((k,i)=>S.mensal[i]>0)] : null;
    const recebeu = S && S.corte >= 0 && S.recebido > 0;
    card.innerHTML = `
      <h3>Quando o dinheiro entra</h3>
