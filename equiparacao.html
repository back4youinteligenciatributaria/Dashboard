      <div class="tiles" style="margin-top:6px">
        <div class="card stat tile ${recebeu ? 'tile-ok' : 'tile-prev'}">
          <span class="lbl">${unico ? (recebeu ? 'Pagamento recebido' : 'Pagamento previsto') : 'Nenhuma data ainda'}</span>
          <div class="v num">${brl(unico ? (S.recebido + S.previsto) : R.emAnalise)}</div>
          <div class="s">${unico ? `em ${esc(mesExtenso(unico))}` : 'a Receita ainda não marcou data para nenhum pedido'}</div>
        </div>
      </div>`;
    return;
  }

  const rotulos = S.lista.map(k => { const [a,m] = k.split('-'); return MES_CURTO[(+m)-1]+'/'+a.slice(2); });
  const ctx = cv.getContext ? cv.getContext('2d') : null;
  const datasets = [];
  if (S.corte >= 0){
    datasets.push({ label:'Já recebido', data: S.acum.map((v,i)=> i<=S.corte ? v : null),
      borderColor:PAL.ok, backgroundColor:PAL.okSoft, fill:'origin', borderWidth:2.5, tension:0,
      pointRadius:3, pointHoverRadius:6, pointBackgroundColor:PAL.ok, pointBorderColor:'#fff', pointBorderWidth:1.5 });
  }
  if (S.corte < S.lista.length-1){
    datasets.push({ label:'Ainda previsto', data: S.acum.map((v,i)=> i>=Math.max(0,S.corte) ? v : null),
      borderColor:PAL.and, backgroundColor:hachura(ctx, PAL.and, .45), fill:'origin',
      borderWidth:2.5, borderDash:[7,5], tension:0,
      pointRadius:3, pointHoverRadius:6, pointStyle:'rectRot', pointBackgroundColor:'#fff',
      pointBorderColor:PAL.and, pointBorderWidth:2 });
  }
  const primeiroComValor = i => {
    for (let d=0; d<datasets.length; d++){ if (datasets[d].data[i] != null) return d; }
    return -1;
  };

  try {
    const ch = new Chart(cv, {
      type:'line',
      data:{ labels:rotulos, datasets },
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:500},
        interaction:{ mode:'index', intersect:false },
        layout:{ padding:{ top:27 } },   // espaço para a etiqueta "hoje" ficar acima da área do gráfico
        plugins:{
          legend:{ display:false },
          tooltip: tooltipBase({
            filter: it => it.parsed && it.parsed.y != null && it.datasetIndex === primeiroComValor(it.dataIndex),
            callbacks:{
              title: it => mesExtenso(S.lista[it[0].dataIndex]) + (it[0].dataIndex > S.corte ? ' · previsto' : ''),
              label: c => {
                const linhas = [];
                const entrou = S.mensal[c.dataIndex];
                if (entrou > 0) linhas.push((c.dataIndex > S.corte ? ' Deve entrar no mês: ' : ' Entrou no mês: ') + brl(entrou));
                else linhas.push(' Nada previsto para este mês');
                linhas.push(' Total acumulado: ' + brl(S.acum[c.dataIndex]));
                return linhas;
              }
            }
          })
        },
        scales:{
          x:{ grid:{ display:false }, border:{ color:PAL.line },
            ticks:{ color:PAL.muted, font:FONTE, maxRotation:0, autoSkip:true, maxTicksLimit:9 } },
          y:{ beginAtZero:true, grid:{ color:PAL.grade, drawTicks:false }, border:{ display:false },
            ticks:{ color:PAL.muted, font:FONTE, maxTicksLimit:5, padding:8, callback:v => brlCurto(v) } }
        }
      },
      plugins:[PLUG_HOJE]
    });
    ch.$hojeIdx = S.hojeIdx;
    ch.update('none');
  } catch(e){ console.warn('Gráfico "Quando o dinheiro entra" indisponível:', e); }

  const lg = document.getElementById('c5-lg');
  if (lg) lg.innerHTML =
    (S.recebido > 0 ? `<span class="leg-item"><i class="leg-sw solida"></i>Já recebido <b>${brl(S.recebido)}</b></span>` : '') +
    (S.previsto > 0 ? `<span class="leg-item"><i class="leg-sw tracejada"></i>Ainda previsto (linha tracejada) <b>${brl(S.previsto)}</b></span>` : '') +
    (S.hojeIdx != null ? `<span class="leg-item" style="color:var(--muted)">A linha pontilhada em pé marca hoje.</span>` : '');
}

/* ───────── 2. "Como está cada pedido" — barra empilhada horizontal ───────── */
function graficoSituacoes(M){
  const P = M.pedidos;
  const porGrupo = {};
  P.forEach(p => { porGrupo[p._grupo] = (porGrupo[p._grupo]||0) + valorPedido(p); });
  const gs = GRUPO_ORDEM_VIS.filter(g => porGrupo[g]);
  const total = gs.reduce((s,g)=>s+porGrupo[g], 0) || 1;
  const cv = document.getElementById('c1');
  if (cv) try {
    new Chart(cv, {
      type:'bar',
      data:{ labels:[''], datasets: gs.map(g => ({
        label: GRUPO_NOME[g], data:[porGrupo[g]], backgroundColor: GRUPO_COR[g], borderWidth:0,
        barPercentage:1, categoryPercentage:1 })) },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:{duration:500},
        layout:{ padding:0 },
        plugins:{ legend:{ display:false },
          tooltip: tooltipBase({ callbacks:{ title:()=>[],
            label: c => ' ' + c.dataset.label + ': ' + brl(c.parsed.x)
              + ' (' + Math.round(c.parsed.x/total*100) + '%)' } }) },
        // min/max fixos: sem isso o Chart.js arredonda a escala e a barra não fecha a largura
        scales:{ x:{ stacked:true, display:false, grid:{display:false}, min:0, max:total },
                 y:{ stacked:true, display:false, grid:{display:false} } },
        onHover:(e,els)=>{ if(e.native&&e.native.target) e.native.target.style.cursor = els.length?'pointer':'default'; },
        onClick:(e,els)=>{ if(els.length) filtrarDetalhe({ situacao:'g:'+gs[els[0].datasetIndex] }); }
      }
    });
  } catch(e){ console.warn('Gráfico "Como está cada pedido" indisponível:', e); }

  const lg = document.getElementById('c1-lg');
  if (lg){
    lg.innerHTML = gs.map(g => `
      <button type="button" class="leg-fil" data-g="${g}" title="Ver só estes pedidos — ${esc(GRUPO_LEIGO[g]||'')}">
        <span class="leg-item"><i class="leg-sw chapada" style="background:${GRUPO_COR[g]}"></i>${esc(GRUPO_NOME[g])} <b>${brl(porGrupo[g])}</b></span>
      </button>`).join('');
    lg.querySelectorAll('.leg-fil').forEach(b =>
      b.addEventListener('click', () => filtrarDetalhe({ situacao:'g:'+b.dataset.g })));
  }
}

/* ───────── 3. "Ano a ano" — empilhada horizontal, aprovado + o que falta ───────── */
function graficoAnos(M){
  const P = M.pedidos;
  const porAno = {};
  P.forEach(p => {
    if (!p._concluido && p._grupo === 'encerrado') return;   // mesma conta do topo da página
    const ano = p._comp.ano || 0;
    porAno[ano] = porAno[ano] || { total:0, aprovado:0 };
    porAno[ano].total += valorPedido(p);
    if (p._concluido) porAno[ano].aprovado += valorPedido(p);
  });
  const anos = Object.keys(porAno).sort();
  const totalGeral = anos.reduce((s,a)=>s+porAno[a].total, 0);
  const aprovGeral = anos.reduce((s,a)=>s+porAno[a].aprovado, 0);

  const cv = document.getElementById('c4');
  if (cv){
    const caixa = cv.parentElement;
    if (caixa) caixa.style.height = Math.max(120, anos.length*44 + 46) + 'px';
    const ctx = cv.getContext ? cv.getContext('2d') : null;
    try {
      new Chart(cv, {
        type:'bar',
        data:{ labels: anos.map(a => a === '0' ? 'sem ano' : a), datasets:[
          { label:'Já aprovado', data: anos.map(a => porAno[a].aprovado),
            backgroundColor: PAL.ok, borderWidth:0, barThickness:22 },
          { label:'Ainda com a Receita', data: anos.map(a => Math.max(0, porAno[a].total - porAno[a].aprovado)),
            backgroundColor: hachura(ctx, PAL.and, .5), borderColor: PAL.and, borderWidth:1, barThickness:22 }
        ]},
        options:{
          indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:{duration:500},
          layout:{ padding:{ right:14 } },
          plugins:{ legend:{ display:false },
            tooltip: tooltipBase({ mode:'index', intersect:false, callbacks:{
              label: c => ' ' + c.dataset.label + ': ' + brl(c.parsed.x),
              footer: it => 'Total do ano: ' + brl(porAno[anos[it[0].dataIndex]].total) } }) },
          scales:{
            x:{ stacked:true, beginAtZero:true, grid:{ color:PAL.grade, drawTicks:false }, border:{display:false},
              ticks:{ color:PAL.muted, font:FONTE, maxTicksLimit:4, callback:v => brlCurto(v) } },
            y:{ stacked:true, grid:{ display:false }, border:{ color:PAL.line },
              ticks:{ color:PAL.muted, font:{family:'Montserrat', size:12, weight:'700'} } }
          },
          onHover:(e,els)=>{ if(e.native&&e.native.target) e.native.target.style.cursor = els.length?'pointer':'default'; },
          onClick:(e,els)=>{ if(els.length) filtrarDetalhe({ ano:String(anos[els[0].index]) }); }
        },
        plugins:[PLUG_ROTULO_APROVADO]
      });
    } catch(e){ console.warn('Gráfico "Ano a ano" indisponível:', e); }
  }

  const lg = document.getElementById('c4-lg');
  if (lg) lg.innerHTML =
    `<span class="leg-item"><i class="leg-sw chapada" style="background:${PAL.ok}"></i>Já aprovado <b>${brl(aprovGeral)}</b></span>` +
    `<span class="leg-item"><i class="leg-sw tracejada"></i>Ainda com a Receita <b>${brl(Math.max(0, totalGeral - aprovGeral))}</b></span>`;
}

/* ───────── 4. "De onde vem o crédito" — dois valores + barra de proporção ───────── */
function tributosDosPedidos(P){
  const soma = {};
  (P||[]).forEach(p => {
    if (!p._concluido && p._grupo === 'encerrado') return;   // não entra na conta do que há a receber
    soma[p.tributo] = (soma[p.tributo]||0) + valorPedido(p);
  });
  return Object.keys(soma).sort((a,b)=>soma[b]-soma[a]).map(nome => ({ nome, valor: soma[nome] }));
}
const EXPL_TRIBUTO = {
  IRPJ:'Imposto de Renda da Pessoa Jurídica — o imposto de renda da empresa.',
  CSLL:'Contribuição Social sobre o Lucro Líquido — uma contribuição cobrada sobre o lucro.'
};
function blocoDeOndeVem(alvo, itens){
  if (!alvo) return;
  itens = (itens||[]).filter(i => i.valor > 0);
  if (!itens.length){ alvo.innerHTML = '<div class="det-vazio">Ainda não há valores separados por imposto.</div>'; return; }
  const total = itens.reduce((s,i)=>s+i.valor, 0) || 1;
  const parte = i => Math.round(i.valor/total*100);
  alvo.innerHTML = `
    <div class="duo">${itens.map((it,i)=>`
      <div>
        <div class="k"><i class="leg-sw chapada" style="margin-right:7px;background:${SLOTS[i%4]}"></i>${esc(it.nome)}</div>
        <div class="v num">${brl(it.valor)}</div>
        <div class="p"${EXPL_TRIBUTO[it.nome] ? ` title="${esc(EXPL_TRIBUTO[it.nome])}"` : ''}>${parte(it)}% do crédito</div>
      </div>`).join('')}
    </div>
    <div class="prop" role="img" aria-label="Divisão do crédito: ${esc(itens.map(it=>it.nome+' '+parte(it)+'%').join(', '))}">
      ${itens.map((it,i)=>`<i style="width:${(it.valor/total*100).toFixed(1)}%;background:${SLOTS[i%4]}"></i>`).join('')}
    </div>
    <div class="leg"><span class="leg-item" style="color:var(--muted)">A barra mostra o peso de cada imposto no total de ${brl(total)}.</span></div>`;
}

/* ───────── Estimativa (memória de cálculo) — só quando não há pedido enviado ───────── */
function desenharMemoria(M){
  const MEM = M.memoria; if (!MEM || !(MEM.periodos||[]).length) return;
  blocoDeOndeVem(document.getElementById('tributos-bloco'), [
    { nome:'IRPJ', valor:num(MEM.total_irpj) },
    { nome:'CSLL', valor:num(MEM.total_csll) }
  ]);
  desenharAoAbrir('bloco-tributos', () => {
    const per = MEM.periodos.slice().sort((a,b)=>prepararCompetencia(a.ref).ord - prepararCompetencia(b.ref).ord);
    const rotulo = p => { const c = prepararCompetencia(p.ref); return c.ord ? `${c.tri}T/${String(c.ano).slice(2)}` : (p.ref || '—'); };
    const cv = document.getElementById('mc1');
    if (cv) new Chart(cv, {
      type:'bar',
      data:{ labels: per.map(rotulo), datasets:[
        { label:'IRPJ', data: per.map(p=>num(p.credito_irpj)), backgroundColor:SLOTS[0], borderWidth:0, stack:'s', maxBarThickness:44 },
        { label:'CSLL', data: per.map(p=>num(p.credito_csll)), backgroundColor:SLOTS[1], borderWidth:0, stack:'s', maxBarThickness:44 }
      ]},
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:500},
        interaction:{ mode:'index', intersect:false },
        plugins:{ legend:{ display:false },
          tooltip: tooltipBase({ callbacks:{
            label: c => ' ' + c.dataset.label + ': ' + brl(c.parsed.y),
            footer: it => 'Total do trimestre: ' + brl(it.reduce((s,i)=>s+(i.parsed.y||0),0)) } }) },
        scales:{
          x:{ stacked:true, grid:{display:false}, border:{color:PAL.line}, ticks:{ color:PAL.muted, font:FONTE, maxRotation:0, autoSkip:true } },
          y:{ stacked:true, beginAtZero:true, grid:{ color:PAL.grade, drawTicks:false }, border:{display:false},
            ticks:{ color:PAL.muted, font:FONTE, maxTicksLimit:5, callback:v => brlCurto(v) } }
        }
      }
    });
    const lg = document.getElementById('mc1-lg');
    if (lg) lg.innerHTML =
      `<span class="leg-item"><i class="leg-sw chapada" style="background:${SLOTS[0]}"></i>IRPJ <b>${brl(MEM.total_irpj)}</b></span>` +
      `<span class="leg-item"><i class="leg-sw chapada" style="background:${SLOTS[1]}"></i>CSLL <b>${brl(MEM.total_csll)}</b></span>`;
  });
}

async function carregarModelos(){
  if (API_URL){
    const { id, codigo } = IDENTIDADE;
    const url = API_URL + '?id=' + encodeURIComponent(id) + '&codigo=' + encodeURIComponent(codigo) + '&tipo=modelos';
    const d = await jsonp(url);
    return (d && d.modelos) || [];
  }
  const r = await fetch('demo_modelos.json');
  if (!r.ok) return [];
  const d = await r.json();
  return d.modelos || [];
}

function normTxt(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }

/** Junta os documentos específicos deste cliente (Relatório de Adequação Jurídica etc.)
    com os modelos genéricos da categoria Equiparação (Modelo de emissão de NF etc.). */
let DESTACADOS = [];
function desenharDocumentos(M, modelos){
  const box = document.getElementById('documentos-equip');
  if (!box) return;
  const doCategoria = (modelos||[]).filter(m => normTxt(m.categoria) === normTxt('Equiparação'));
  const todos = [...(M.documentos||[]), ...doCategoria]
    .filter(d => d.link && String(d.link).trim())
    .filter(d => DESTACADOS.indexOf(d.documento) < 0);   // já aparecem como cartão em destaque
  if (!todos.length){
    // se tudo já está em destaque acima, a seção inteira sai de cena
    const sec = document.getElementById('secao-docs');
    if (DESTACADOS.length && sec){ sec.remove(); return; }
    box.innerHTML = '<div class="vazio" style="padding:16px 0;text-align:center;color:var(--muted)">Nenhum documento cadastrado ainda.</div>'; return;
  }
  box.innerHTML = todos.map(d=>{
    const nome = esc(d.documento);
    const link = esc(String(d.link).trim());
    return `<div class="item">
      <div><div class="nome">${nome}</div>${d.categoria?`<div class="cat">Modelo padrão</div>`:''}</div>
      <a href="${link}" target="_blank" rel="noopener">Abrir ↗</a>
    </div>`;
  }).join('');
}

// Em subpágina, sem login volta ao index; com id+código mostra aviso amigável em vez de redirecionar.
function erro(e){
  var ic=getIdCodigo(), id=ic.id, codigo=ic.codigo;
  var amigavel=(window.B4U&&B4U.msgAmigavel)?B4U.msgAmigavel(e):'';
  if(!id||!codigo){ location.replace('index.html'+(id?('#'+id+(codigo?'-'+codigo:'')):(location.hash||''))); return; }
  var volta='index.html#'+id+(codigo?('-'+codigo):'');
  document.body.innerHTML=
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;'
   +'font-family:\'Montserrat\',system-ui,-apple-system,sans-serif;background:#F1E7DC;color:#113D39">'
   +'<div style="max-width:440px;text-align:center;background:#FFFFFF;border:1px solid #E4D9C9;'
   +'border-radius:var(--radius-lg);padding:32px 28px;box-shadow:0 6px 24px rgba(7,48,52,.06)">'
   +'<div style="font-size:var(--fs-6);line-height:1;margin-bottom:10px">📄</div>'
   +'<h2 style="margin:0 0 8px;font-size:var(--fs-5)">Não foi possível carregar suas informações agora.</h2>'
   +'<p style="margin:0 0 20px;font-size:var(--fs-4);line-height:1.5;color:#3F5854">'+(amigavel||'Se você acredita que isto é um erro, fale com o nosso atendimento que resolvemos rápido.')+'</p>'
   +'<a href="https://wa.me/5511937173906" target="_blank" rel="noopener" style="display:inline-block;background:#0C756F;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:var(--radius-pill);font-size:var(--fs-4)">Falar com o atendimento</a>'
   +'<div style="margin-top:14px"><a href="'+volta+'" style="color:#0C756F;font-size:var(--fs-3);text-decoration:none">Voltar ao início</a></div>'
   +'</div></div>';
}

/* Olhar a mesma frase por 45s é lido como "travou" — e ele recarrega, jogando fora o
   pedido que já estava a caminho. Trocar o texto é barato e compra paciência. */
var _tEspera = [
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Estamos buscando os seus dados na planilha…'; }, 4000),
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Está demorando mais que o normal — continuamos tentando.'; }, 10000),
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Quase lá — a primeira abertura do dia é a mais lenta.'; }, 20000)
];
function pararEspera(){ _tEspera.forEach(clearTimeout); }

/* Tarja discreta do cache: diz que o que está na tela veio do último acesso.
   Fica dentro do .wrap, no topo — nunca por cima do número. */
function tarja(texto, falhou){
  const slot = document.getElementById('tarja-slot'); if(!slot) return;
  slot.innerHTML = texto ? `<div class="tarja-atualizando${falhou?' falhou':''}">${esc(texto)}</div>` : '';
}
function horaCache(ts){ return ts ? new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : 'antes'; }

(async function(){
  const ic = getIdCodigo();
  let pintadoDoCache = false, tsCache = 0;
  /* A segunda visita não recomeça do esqueleto: pintamos com o último payload (6h de
     validade) e atualizamos por baixo. Se a atualização falhar, o que está na tela
     continua — apagar dado bom por causa de uma rede ruim é pior que dado de 1h atrás. */
  if (API_URL && ic.id && window.B4U && B4U.cacheLer){
    const bruto = B4U.cacheLer('equiparacao', ic.id);
    if (bruto){
      try {
        IDENTIDADE = ic;
        const Mc = preparar(bruto);
        tsCache = bruto.atualizado_em || 0;
        pararEspera(); render(Mc); tarja('Atualizando…'); pintadoDoCache = true;
      } catch(err){ /* cache velho ou de outro formato: ignora e busca de novo */ }
    }
  }
  try {
    const raw = await carregar();
    if (API_URL && ic.id && window.B4U && B4U.cacheGravar) B4U.cacheGravar('equiparacao', ic.id, raw);
    const M = preparar(raw);
    pararEspera(); render(M); tarja('');
    carregarModelos().then(modelos => desenharDocumentos(M, modelos)).catch(()=>desenharDocumentos(M, []));
  } catch (e) {
    pararEspera();
    if (pintadoDoCache){ tarja('Não consegui atualizar agora — mostrando os dados de '+horaCache(tsCache)+'.', true); return; }
    erro(e);
  }
})();
</script>
