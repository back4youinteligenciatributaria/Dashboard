  /* O rodapé é onde a tela CONFESSA. `ausentes` são as colunas que o recorte
     pediu e a planilha não tem — sem esta linha, quem escreveu o recorte com um
     acento errado procura o defeito na permissão e no cache, que é onde ele
     não está. */
  const pe = [];
  if (META.aba) pe.push('Aba <b>'+esc(META.aba)+'</b>, cabeçalho na linha '+esc(META.cabecalho_linha||'?'));
  if (META.planilha_url) pe.push('<a href="'+esc(META.planilha_url)+'" rel="noopener">abrir a planilha ↗</a>');
  if (META.ausentes && META.ausentes.length)
    pe.push('<span style="color:var(--amber-txt);font-weight:800">Declaradas no recorte e ausentes na planilha: '+
            esc(META.ausentes.join(', '))+'</span>');
  if (META.validacoes_erro)
    pe.push('<span style="color:var(--amber-txt)">Não consegui ler as listas de opções: os campos ficaram de texto livre.</span>');
  document.getElementById('rodape').innerHTML = pe.join(' · ');

  desenhar();

  /* ?abrir=ID — o link que vem do painel do colaborador já com a ficha aberta. */
  const abrir = (new URLSearchParams(location.search).get('abrir')||'').trim();
  if (abrir) abrirFicha(abrir);
}

function carregar(){
  const v = visAtual();
  if (v) {
    return jsonp(API_URL+'?tipo=recorte_montar&v='+encodeURIComponent(v)+
                 '&chave='+encodeURIComponent(chaveAtual()))
      .then(d=>{ if (d && d.erro) throw new Error(d.erro); aplicar(d); })
      .catch(mostrarErro);
  }
  const r = recorteAtual();
  if (!r) {
    /* Sem `?r=` a página não tem assunto. Em vez de uma tela vazia, ela pergunta
       ao servidor QUAIS recortes esta pessoa pode abrir e oferece os links —
       o que também é o menu, enquanto não houver um no b4u-shell.js. */
    return jsonp(API_URL+'?tipo=recorte_lista&chave='+encodeURIComponent(chaveAtual()))
      .then(d=>{
        if (d && d.erro) throw new Error(d.erro);
        const its = (d&&d.recortes)||[];
        const criar = '<div class="vazio">Criar</div>' +
          '<a class="cli" data-vis="criar" role="button" tabindex="0" style="cursor:pointer">' +
          '<span class="l1"><span class="nm">＋ Criar uma visualização do zero</span></span>' +
          '<span class="resumo">Escolha qualquer coluna das 341 — por categoria, ou a categoria inteira — ' +
          'e os filtros fixos que valem sempre nela.</span></a>' +
          '<a class="cli" data-vis="novavar" role="button" tabindex="0" style="cursor:pointer">' +
          '<span class="l1"><span class="nm">＋ Criar uma variável nova</span></span>' +
          '<span class="resumo">A coluna que você precisa ainda não existe? Ela nasce no fim do Registro, ' +
          'vazia, com a variável de mala direta e a categoria já preenchidas.</span></a>';
        document.getElementById('conteudo').innerHTML = criar + (its.length
          ? '<div class="vazio">Escolha um recorte:</div>' + its.map(x=>
              '<a class="cli" href="?r='+encodeURIComponent(x.id)+'&chave='+encodeURIComponent(chaveAtual())+'" target="_self">'+
              '<span class="l1"><span class="nm">'+esc(x.rotulo)+'</span>'+
              '<span class="id">'+x.colunas+' colunas'+(x.pode_gravar?'':' · só leitura')+'</span></span>'+
              '<span class="resumo">'+esc(x.sobre||'')+'</span></a>').join('')
          : '<div class="vazio">Nenhum recorte disponível para o seu acesso.</div>');
        document.getElementById('cnt').textContent = '';
        document.getElementById('tag').textContent = 'Recortes do Registro';
        /* E as visualizações logo abaixo, na mesma página: quem chega aqui
           está escolhendo o que abrir, e a tela salva por ele é tão "o que
           abrir" quanto as declaradas em código.

           ESTA PÁGINA É O "+" DO MENU. Desde 09/2026 o menu lateral já traz os
           recortes e as visualizações DA PESSOA; quem cai aqui de propósito
           veio pelo "+", isto é, veio buscar uma que ainda não é dele. Por isso
           o bloco das públicas ganhou a linha que faltava: sem ela, a pessoa
           abre a visualização de outro, mexe, e descobre que não consegue
           salvar — porque não é dela. Dizer "Duplicar" ANTES do clique é a
           diferença entre uma prateleira e uma parede. */
        return jsonp(API_URL+'?tipo=vis_lista&chave='+encodeURIComponent(chaveAtual()))
          .then(w=>{
            if (!w || w.erro) return;
            const bloco = (titulo, lista, nota) => lista.length
              ? '<div class="vazio">'+titulo+(nota?'<br><span style="font-weight:400;opacity:.75">'+nota+'</span>':'')+'</div>'
                + lista.map(x=>
                  '<a class="cli" href="?v='+encodeURIComponent(x.id)+'&chave='+encodeURIComponent(chaveAtual())+'" target="_self">'+
                  '<span class="l1"><span class="nm">'+esc(x.nome)+'</span>'+
                  '<span class="id">'+x.colunas+' colunas'+(x.publico?' · pública':'')+'</span></span>'+
                  '<span class="resumo">'+esc(x.filtro_sobre|| (x.meu ? 'sua' : 'de '+x.dono))+'</span></a>').join('')
              : '';
            /* "da equipe" no título não é enfeite: a sua própria visualização
               pública aparece em "Minhas" e NÃO se repete aqui embaixo. Sem a
               palavra, quem tornou a dele pública procura nesta lista e acha
               que a publicação não pegou. */
            document.getElementById('conteudo').innerHTML +=
              bloco('Minhas visualizações', (w.minhas)||[],
                    'As suas — inclusive as que você tornou públicas.') +
              bloco('Públicas da equipe', (w.publicas)||[],
                    'De outras pessoas. Abra para usar; para mexer sem estragar a de quem fez, use <b>Duplicar</b> lá dentro.');
          })
          .catch(()=>{});
      })
      .catch(mostrarErro);
  }
  return jsonp(API_URL+'?tipo=recorte_montar&recorte='+encodeURIComponent(r)+
               '&chave='+encodeURIComponent(chaveAtual()))
    .then(d=>{ if (d && d.erro) throw new Error(d.erro); aplicar(d); })
    .catch(mostrarErro);
}
function mostrarErro(e){
  const el = document.getElementById('avisoErro');
  el.hidden = false;
  el.textContent = String((e&&e.message)||e);
  document.getElementById('conteudo').innerHTML = '';
}

/* ---------------- régua ---------------- */
let TB = null;
document.getElementById('busca').addEventListener('input', e=>{
  BUSCA = e.target.value;
  /* 123 linhas × 40 colunas é uma tabela de ~5.000 células: redesenhar a cada
     tecla é o que faz a busca "engasgar" em quem digita rápido. */
  clearTimeout(TB); TB = setTimeout(desenhar, 160);
});
document.getElementById('modoFichas').addEventListener('click', ()=>trocarModo('fichas'));
document.getElementById('modoGrade') .addEventListener('click', ()=>trocarModo('grade'));
function trocarModo(m, semDesenhar){
  MODO = m;
  document.getElementById('modoFichas').classList.toggle('on', m==='fichas');
  document.getElementById('modoGrade') .classList.toggle('on', m==='grade');
  try{ localStorage.setItem('b4u.recorte.modo', m); }catch(_){}
  if (!semDesenhar && REC) desenhar();
}
/* O modo é lembrado, mas NÃO desenha aqui: quando esta linha roda ainda não
   chegou payload nenhum, e desenhar sem dados pintaria "nenhum cliente". */
try{ const m=localStorage.getItem('b4u.recorte.modo'); if(m) trocarModo(m, true); }catch(_){}

document.getElementById('volta').href = 'colaborador?chave='+encodeURIComponent(chaveAtual());
document.getElementById('logo-home').href = 'colaborador?chave='+encodeURIComponent(chaveAtual());

/* ---------------- menu lateral ----------------
   Montado ANTES de carregar(): a identidade desta tela é a chave, que já está na
   URL desde a primeira linha deste script — não há o que esperar da API. E se a
   busca falhar, o erro pinta dentro do #app com o menu inteiro de pé, que é a
   mesma razão de o erro nunca ser pintado no <body>.
   Sem `ativo`: esta página serve a vários recortes e nenhum deles é uma entrada
   do menu — marcar uma entrada errada é pior do que não marcar nenhuma. */
/* SEM `ativo`, DE PROPÓSITO — e isto mudou em 09/2026.
   Antes havia um `MENU_DE = { documentos:'documentos', equiparacao:'restituicao' }`
   para acender à mão as duas entradas fixas que estes recortes tinham no menu.
   As duas entradas não existem mais: a seção "Visualizações de dados" do
   b4u-shell.js lista TODOS os recortes e as visualizações da pessoa, e acende
   sozinha o que casa com o `?r=` / `?v=` da URL. Mandar `ativo` daqui hoje só
   poderia acender a entrada errada. */

if (window.B4UShell) {
  B4UShell.montar({
    perfil:'equipe',
    ativo: '',
    link: function(pag){ return pag + '?chave=' + encodeURIComponent(chaveAtual()); }
  });
  B4UShell.usuario();
}

carregar();
</script>
</body>
</html>
