<script>
/* ══════════════════════════════════════════════════════════════════════════
   b4u-recorte.html — O ESQUELETO DE TELA DE RECORTE DA ABA "Registro"
   --------------------------------------------------------------------------
   COMO SE USA

     b4u-recorte.html?r=<id do recorte>&chave=<a chave do dia>

   O `<id do recorte>` é o `id` de um objeto declarado no `_recortes_()` do
   `11_Recorte.gs`. Não existe nada para escrever AQUI quando nasce um recorte
   novo: esta página é genérica, e o que muda de uma tela para outra é o
   servidor que responde. Sem `?r=`, ela pergunta ao servidor quais recortes
   esta pessoa pode abrir e oferece os links.

   --------------------------------------------------------------------------
   POR QUE ESTA PÁGINA EXISTE

   Quase tudo passou a morar na planilha "Registro Clientes". Cada vez que uma
   equipe precisava olhar um punhado dessas colunas, nascia um HTML novo de 150
   KB — e os três que existem (licenças, certificados, documentos) são o MESMO
   programa com listas de coluna diferentes: uma lista, um filtro, uma ficha que
   abre, campos que gravam sozinhos, um log.

   Então virou um só. As três coisas que o pedido nomeou são as três partes
   deste arquivo, e cada uma é independente da outra:

     1. ESCOLHER QUAIS VARIÁVEIS MOSTRAR  → `montarSeletorColunas()` / `VIS`
     2. MOSTRAR EM MODAL                  → `abrirFicha()`
     3. MOSTRAR EM PLANILHA FILTRÁVEL     → `desenharGrade()`

   --------------------------------------------------------------------------
   A ESCOLHA DE COLUNAS TEM DUAS CAMADAS, E ISSO NÃO É REDUNDÂNCIA

   O SERVIDOR decide quais colunas VIAJAM (o `colunas` do recorte, no
   11_Recorte.gs). É a trava: coluna que não está no recorte não entra no
   payload, não aparece em lugar nenhum, e não é aceita na gravação — nem por
   engano de código desta página.

   A PESSOA decide quais das colunas que chegaram ela quer OLHAR (o `VIS` daqui,
   guardado no navegador dela). É conforto: com 40 colunas na tela, quem foi
   conferir uma passa os olhos por 39.

   Trocar uma pela outra estraga as duas. Se o servidor mandasse tudo e a tela
   escondesse, "esconder" seria `display:none` sobre uma senha que já chegou no
   aparelho. Se a pessoa não pudesse escolher, a tela ficaria ilegível no dia em
   que o recorte crescer para 40 colunas — e cresce.

   --------------------------------------------------------------------------
   A LISTA DE COLUNAS VISÍVEIS É POR PESSOA E POR RECORTE, e mora no navegador

   `localStorage`, e não uma coluna de configuração na planilha. Duas razões: é
   preferência de OLHAR (ninguém precisa que o time inteiro concorde), e uma
   preferência gravada no servidor seria mais uma escrita por clique numa
   planilha que já é o gargalo de todas as telas.

   O que isso custa: quem trocar de computador começa no padrão. É o preço
   certo — a alternativa (perguntar ao servidor antes de desenhar) atrasaria a
   primeira pintura de toda tela para guardar a escolha de sete pessoas.

   --------------------------------------------------------------------------
   SE UM DOS ARQUIVOS COMPARTILHADOS NÃO CARREGAR

   Nada aqui é obrigatório. `B4UFiltro` ausente → os filtros e o seletor de
   colunas somem, a tela mostra tudo e a busca continua. `B4UModal` ausente → a
   ficha não abre e a lista continua inteira. `B4UGravar` ausente → grava
   direto, e o selo na linha continua avisando. `B4UShell` ausente → a página
   perde o menu lateral e mais nada. Todas as chamadas passam por `window.X &&`.
   ══════════════════════════════════════════════════════════════════════════ */

/* A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
   é reserva: se o config.js não carregar, a página continua de pé. */
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';

/* A chave da equipe é o código do dia de cada colaborador. Vazia de propósito:
   se voltar a ter valor, volta a existir uma senha compartilhada que não expira
   e não diz quem é quem. */
const CHAVE_PADRAO = '';
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();
  return q || (location.hash||'').replace(/^#/,'').trim();}
function recorteAtual(){return (new URLSearchParams(location.search).get('r')||'').trim().toLowerCase();}

/* Sem chave na URL não há painel da equipe. A porta é o index.html, e o
   `destino` é o que faz a pessoa VOLTAR para cá depois de se identificar —
   senão todo login a despejaria na home da equipe, longe do que ela clicou. */
if (!chaveAtual()) {
  location.replace('index?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}

/* O `esc` delega para o `b4uEsc` do bloco B4U-TEXTO quando ele existe. Não é
   capricho: aquele bloco converte NÚMERO para texto sem notação científica
   antes de escapar, e é o que impede um CNPJ que a planilha entregou como
   6.23904e+11 de aparecer assim na tela. Sem o bloco, a reserva abaixo faz o
   escape simples — a tela vive, e o identificador é que fica feio. */
function esc(s){
  if (window.b4uEsc) return b4uEsc(s);
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function normCol(s){return normTxt(s).replace(/\s+/g,' ').replace(/[?:.]+$/,'');}
function soDigitos(s){return String(s==null?'':s).replace(/\D/g,'');}
/* CSS.escape não existe em navegador antigo, e é usado num seletor de atributo
   que recebe ID de cliente. Sem a reserva, um ID com ponto derrubaria o selo. */
function selEsc(s){ return (window.CSS && CSS.escape) ? CSS.escape(String(s)) : String(s).replace(/["\\]/g,'\\$&'); }

/* ---------------- JSONP: a leitura ----------------
   O /exec responde 302 e o navegador não deixa ler o corpo de um fetch
   cross-origin sem CORS — por isso a leitura é por <script>, e não por fetch.
   Prazo e UMA repetição: a primeira chamada do dia acorda o Apps Script e às
   vezes estoura sozinha. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;
function jsonpTentativa(url){
  return new Promise((ok,fail)=>{
    const cb='cb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);
    function limpa(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=d=>{limpa();ok(d);};
    s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.body.appendChild(s);
  });
}
function jsonp(url){
  return jsonpTentativa(url).catch(()=>
    new Promise(r=>setTimeout(r,JSONP_PAUSA)).then(()=>jsonpTentativa(url)));
}

/* ---------------- POST: a gravação ----------------
   "Não salvou" é uma AFIRMAÇÃO, e o front não tem como fazê-la: o servidor
   GRAVA e só depois responde. Quando a resposta se perde, a gravação já
   aconteceu. Por isso a exceção sai marcada:

     doServidor  o servidor leu, decidiu e RECUSOU. Não gravou. Repetir é seguro.
     incerto     a resposta se perdeu. PODE ter gravado. Não se repete às cegas:
                 oferece-se RECARREGAR.

   O b4u-gravar.js lê essas duas marcas para escolher o botão do recado. */
async function postAcao(obj,ms){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),ms||120000);
  try{
    const body=JSON.stringify(Object.assign({chave:chaveAtual(),cod:respAtual()},obj));
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ctl.signal});
    const d=await r.json();
    if(d&&d.erro){ const err=new Error(d.erro); err.doServidor=true; throw err; }
    return d;
  }catch(e){
    if(e&&e.name==='AbortError'){ const x=new Error('A resposta demorou.'); x.incerto=true; throw x; }
    if(e&&e.doServidor) throw e;
    const x=new Error(String((e&&e.message)||e)); x.incerto=true; throw x;
  }finally{ clearTimeout(t); }
}

/* ══════════════════════════════════════════════════════════════════════════
   ESTADO
   Um lugar só. Toda função de desenho lê daqui e de mais nada — é o que permite
   redesenhar a tela inteira depois de qualquer mudança sem descobrir, meia hora
   depois, que o filtro e a grade discordavam sobre quantas linhas existiam.
   ══════════════════════════════════════════════════════════════════════════ */
let REC       = null;        // o descritor do recorte (rótulo, pode_gravar…)
/* AS SEÇÕES. A unidade de permissão, de recorte de coluna e de gravação — e não
   uma divisória de layout. Uma seção que a pessoa não pode LER não chega aqui:
   o servidor não a põe no payload. `SEC_DE` responde "de qual seção é esta
   coluna?", que é a pergunta que decide por qual porta o campo grava. Sem esse
   mapa a tela adivinharia por nome de coluna — e adivinhação de nome é o que
   manda uma senha pela porta das licenças no dia em que alguém renomear um
   cabeçalho na planilha. */
let SECOES    = [];
let SEC_DE    = new Map();   // normCol(coluna) → a seção dela
let DO_REC    = [];          // as colunas DO recorte — as que dá para escolher e editar
let IDENT     = [];          // ID, Nome, Ativo, CNPJ… — contexto, sempre só leitura
let LINHAS    = [];          // [{id,row,valores,nome_cliente,ativo,drive}]
let VALID     = {};          // coluna → {opcoes, estrito, multi}
let ESPELHADA = new Set();   // vem do cadastro por fórmula: nunca editável
let SIGILOSA  = new Set();   // senha: mascarada, fora da busca e fora do log
let DATA      = new Set();
let LINK      = new Set();
let META      = {};          // aba, planilha_url, cabecalho_linha, ausentes…

let VIS   = [];              // as colunas VISÍVEIS — a escolha desta pessoa
let MODO  = 'fichas';        // 'fichas' | 'grade'
let BUSCA = '';
/* O FILTRO É POR COLUNA, e o conjunto guarda os valores QUE PASSAM. Coluna que
   não está no mapa não filtra nada — e é isso, e não um `Set` com tudo dentro,
   que faz "destravar o filtro" ser uma operação e não uma reconstrução: apagar
   a chave devolve a coluna ao estado de repouso sem depender de a lista de
   valores de hoje ser a mesma de quando a pessoa filtrou. */
const F_COL = new Map();     // coluna → Set de valores que passam
let ORD = { col:'', dir:'' }; // ordenação: coluna e 'asc' | 'desc'
/* Sujos e falhas são por CLIENTE E SEÇÃO ('0012|licencas'): duas seções da mesma
   linha viajam por portas diferentes, então uma pode falhar enquanto a outra
   entra. Uma chave só por cliente marcaria a linha inteira de vermelho por
   causa de um lote que nem era o que a pessoa estava editando. */
const SUJOS  = new Map();    // 'id|secao' → { coluna: valor } ainda não confirmado
const FALHAS = new Map();    // 'id|secao' → mensagem da última recusa
const ENVIANDO = new Map();  // 'id|coluna' → nome do arquivo em voo
const ERROS_CEL = new Map(); // 'id|coluna' → recado de erro do envio
function chaveLote(id, sec){ return id + '|' + sec; }
function chaveCel(id, col){ return id + '|' + normCol(col); }

/* ---------------- a escolha de colunas, guardada ----------------
   Chave por RECORTE: quem escolheu cinco colunas no fiscal não quer as mesmas
   cinco no societário — são listas diferentes de perguntas diferentes.
   Tudo em try/catch: navegador em janela anônima ou com armazenamento bloqueado
   lança no ACESSO ao localStorage, não na leitura — e uma tela que não abre por
   causa de uma preferência é uma tela pior do que uma sem preferência. */
function chaveVis(){ return 'b4u.recorte.' + (recorteAtual()||'?') + '.cols'; }
function lerVis(){
  try{ const s=localStorage.getItem(chaveVis()); return s?JSON.parse(s):null; }catch(_){ return null; }
}
function salvarVis(){ try{ localStorage.setItem(chaveVis(), JSON.stringify(VIS)); }catch(_){} }
/* O padrão de quem nunca escolheu: TUDO o que o recorte tem.
   Não "as seis primeiras": um recorte é declarado por alguém que já decidiu o
   que interessa, e começar escondendo parte disso faria a pessoa concluir que a
   coluna não existe. Quem quiser menos, tira. */
function visPadrao(){ return DO_REC.slice(); }

/* ══════════════════════════════════════════════════════════════════════════
   O QUE CADA CAMPO É
   Uma função só, porque a ficha (modal) e a planilha (grade) precisam responder
   à MESMA pergunta sobre a MESMA coluna. Duas cópias divergiriam no primeiro
   campo novo — e divergir aqui quer dizer um campo editável num lugar e travado
   no outro, para o mesmo dado.
   ══════════════════════════════════════════════════════════════════════════ */
/* De qual seção é esta coluna. `null` para as de identificação, que não são de
   seção nenhuma — são o contexto da linha. */
function secaoDe(col){ return SEC_DE.get(normCol(col)) || null; }

function editavel(col){
  if (IDENT.indexOf(col) > -1) return false;       // identificação é contexto, não cadastro
  if (ESPELHADA.has(normCol(col))) return false;   // fórmula do cadastro: escrever destrói a IMPORTRANGE
  /* A PERMISSÃO É DA SEÇÃO, não da tela. É esta linha que faz o societário ver
     o alvará destravado e a senha do certificado travada na MESMA ficha — que é
     o desenho da tela de documentos desde 09/2026, e a razão de as seções
     existirem. */
  var sec = secaoDe(col);
  return !!(sec && sec.pode_gravar);
}
function tipoDe(col){
  const v = VALID[col];
  if (v && v.multi) return 'multi';
  if (v && v.opcoes && v.opcoes.length) return v.estrito ? 'select' : 'lista';
  if (DATA.has(normCol(col)))     return 'date';
  if (LINK.has(normCol(col)))     return 'url';
  if (SIGILOSA.has(normCol(col))) return 'senha';
  return 'text';
}
/* Coluna longa merece a largura toda da ficha. É heurística de LAYOUT, e por
   isso pode errar sem consequência — ao contrário de tudo o mais aqui. */
function ehLonga(col){ return /observ|descri|resumo|pend|contatos|cnaes|hist/.test(normCol(col)); }
/* aaaa-mm-dd → dd/mm/aaaa. O que não casar com o formato sai como veio: uma
   célula com "a confirmar" escrito à mão não pode virar "NaN/NaN/NaN". */
function fmtBR(iso){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? (m[3]+'/'+m[2]+'/'+m[1]) : String(iso||'');
}

/* ---------------- o campo, em HTML ----------------
   `data-col` e `data-id` são o contrato entre o desenho e a gravação: o ouvinte
   de `change` é UM só, no documento, e descobre por eles qual coluna de qual
   cliente mudou. Sem isso seriam ~5.000 ouvintes numa grade de 123 linhas por
   40 colunas, e cada redesenho os recriaria todos. */
function campoHTML(id, col, valor, classe){
  const ed = editavel(col);
  const t  = tipoDe(col);
  const at = 'data-id="'+esc(id)+'" data-col="'+esc(col)+'" class="'+classe+'"';
  const v  = esc(valor==null?'':valor);

  if (!ed) {
    /* Só leitura vira TEXTO, não campo desabilitado. Um input cinzento convida
       ao clique e não responde — e a pessoa conclui que a tela travou. Link
       continua sendo link: é o que ela veio abrir. */
    if (t==='url' && valor) return '<a class="'+classe+' cel-ro" href="'+esc(valor)+'" rel="noopener">abrir ↗</a>';
    if (t==='senha' && valor) return '<span class="'+classe+' cel-ro">••••••</span>';
    /* CNPJ/CPF/CEP que chegou da planilha com dígito faltando (a célula virou
       número e comeu o zero da frente) aparece COMO VEIO, com o sublinhado
       âmbar e o ⚠ do bloco B4U-TEXTO. Inventar o zero deixaria um CNPJ
       inexistente com cara de certo. */
    if (window.b4uIdent && b4uIdent(col))
      return '<span class="'+classe+' cel-ro">'+b4uIdentHTML(valor,col,'—')+'</span>';
    /* Data só-leitura sai em dd/mm/aaaa. O aaaa-mm-dd é o formato em que o
       servidor entrega (e o que o <input type="date"> exige), não o formato em
       que alguém lê um vencimento. Quem edita continua vendo o calendário do
       navegador; quem só olha, vê a data como se escreve. */
    if (t==='date' && valor) return '<span class="'+classe+' cel-ro">'+esc(fmtBR(valor))+'</span>';
    return '<span class="'+classe+' cel-ro">'+(v||'—')+'</span>';
  }

  if (t==='select' || t==='lista') {
    const opts = (VALID[col].opcoes||[]).slice();
    /* O valor que ESTÁ na célula e não está na lista continua aparecendo. Sumir
       com ele faria o próximo `change` de qualquer outro campo da linha gravar
       um valor que ninguém escolheu — que é como um dado some sem culpado. */
    if (valor && opts.indexOf(valor) < 0) opts.unshift(valor);
    if (t==='select') {
      /* estrito: a PLANILHA recusa o que não está na lista. Oferecer texto livre
         aqui é reproduzir o defeito que o 9_Validacoes.gs veio matar — a pessoa
         digita, a célula rejeita, e ela conclui que o painel está quebrado. */
      return '<select '+at+'>' + opts.map(o=>
        '<option value="'+esc(o)+'"'+(String(o)===String(valor)?' selected':'')+'>'+(esc(o)||'—')+'</option>'
      ).join('') + '</select>';
    }
    /* não estrito: menu E texto livre no mesmo controle nativo. O <datalist> faz
       isso sem uma linha de JavaScript, e sem inventar um combo. */
    const dl = 'dl_'+Math.random().toString(36).slice(2);
    return '<input '+at+' list="'+dl+'" value="'+v+'">' +
      '<datalist id="'+dl+'">'+opts.map(o=>'<option value="'+esc(o)+'">').join('')+'</datalist>';
  }
  if (t==='date')  return '<input '+at+' type="date" value="'+v+'">';
  if (t==='url')   return celDoc(id, col, valor, classe);
  if (t==='senha') return '<input '+at+' type="password" value="'+v+'" autocomplete="new-password">';
  if (t==='multi') {
    /* BURACO DECLARADO, e de propósito. `multi` é gravado numa célula só, unido
       por " · " (ver o catálogo em b4u-registro-campos.js). Um controle de
       verdade para isso é uma lista de checkboxes que sabe montar e desmontar a
       string — trabalho que vale a pena fazer UMA vez, quando o primeiro recorte
       com coluna multi existir. Até lá: texto livre com as opções no `title`,
       que grava certo se a pessoa escrever certo. */
    return '<input '+at+' type="text" value="'+v+'" title="Separe por &quot; · &quot;. Opções: '+
      esc((VALID[col].opcoes||[]).join(' · '))+'">';
  }
  if (classe === 'in' && ehLonga(col)) return '<textarea '+at+'>'+v+'</textarea>';
  return '<input '+at+' type="text" value="'+v+'">';
}

/* ══════════════════════════════════════════════════════════════════════════
   A COLUNA DE DOCUMENTO — Abrir / Enviar
   O motor de envio (gradeUploadLink_) sempre foi genérico, e as rotas já
   existem no Roteador com o porteiro de cada seção (`licenca_upload`,
   `cert_upload`). A seção viaja com `acao_upload` só quando a pessoa PODE
   gravar aquele bloco: um botão "Enviar" para quem o servidor vai recusar não é
   uma tela mais completa, é uma tela que mente.
   ══════════════════════════════════════════════════════════════════════════ */
const DOC_MAX = 10 * 1024 * 1024;   // o mesmo teto do backend (GRADE_UPLOAD_MAX_BYTES)

function celDoc(id, col, valor, classe){
  const k    = chaveCel(id, col);
  const sec  = secaoDe(col);
  const sobe = !!(sec && sec.acao_upload);
  const env  = ENVIANDO.get(k);
  const err  = ERROS_CEL.get(k);
  const v    = esc(valor==null?'':valor);

  let dentro = '';
  if (env) {
    dentro = '<span class="doc-spin" aria-hidden="true"></span>' +
             '<span class="doc-obs">enviando '+esc(env)+'…</span>';
  } else {
    if (valor) dentro += '<a class="doc-bt doc-ir" href="'+v+'" rel="noopener">abrir ↗</a>';
    if (sobe)  dentro += '<label class="doc-bt doc-env" title="Enviar o documento para a pasta do cliente">'+
                         (valor?'trocar':'enviar')+
                         '<input type="file" hidden data-up-id="'+esc(id)+'" data-up-col="'+esc(col)+'"></label>';
    if (!valor && !sobe) dentro += '<span class="doc-obs cel-ro">—</span>';
    /* O "⋯" revela o endereço cru. Colar link ainda acontece (documento que já
       está em outra pasta, link de portal), só deixou de ser o estado padrão. */
    dentro += '<button type="button" class="doc-mais" data-url-id="'+esc(id)+'" data-url-col="'+esc(col)+'" '+
              'title="Ver e editar o endereço">⋯</button>' +
              '<input class="in doc-url" hidden data-id="'+esc(id)+'" data-col="'+esc(col)+'" '+
              'type="url" value="'+v+'" placeholder="https://…">';
  }
  if (err) dentro += '<span class="doc-erro">'+esc(err)+'</span>';
  return '<span class="doc '+classe+'" data-doc-id="'+esc(id)+'" data-doc-col="'+esc(col)+'">'+dentro+'</span>';
}

/* Repinta UMA célula, e não a tela: repintar tudo no meio de um envio levaria
   embora o foco de quem já está digitando noutro campo da mesma linha. */
function repintarCel(id, col){
  const l = LINHAS.find(x=>x.id===id); if (!l) return;
  document.querySelectorAll('[data-doc-id="'+selEsc(id)+'"][data-doc-col="'+selEsc(col)+'"]')
    .forEach(no=>{ no.outerHTML = celDoc(id, col, l.valores[col], no.classList.contains('in')?'in':'cel-in'); });
}

function lerBase64(file){
  return new Promise((ok,fail)=>{
    const fr = new FileReader();
    /* Falha AQUI é do navegador lendo o disco: nada saiu daqui, e é o único erro
       deste caminho sobre o qual dá para afirmar "não subiu". Marcado, para não
       cair na peneira de erro de servidor lá embaixo. */
    fr.onerror = ()=>{ const x=new Error('Não consegui ler o arquivo.'); x.local=true; fail(x); };
    fr.onload  = ()=>{ const t=String(fr.result||''); ok(t.slice(t.indexOf(',')+1)); };
    fr.readAsDataURL(file);
  });
}

async function enviarDocumento(id, col, file){
  const sec = secaoDe(col);
  if (!sec || !sec.acao_upload) return;
  const k = chaveCel(id, col);
  if (file.size > DOC_MAX) {
    ERROS_CEL.set(k, 'O arquivo tem '+(file.size/1048576).toFixed(1)+' MB e o limite é 10 MB.');
    return repintarCel(id, col);
  }
  const l = LINHAS.find(x=>x.id===id) || {valores:{}};
  ERROS_CEL.delete(k); ENVIANDO.set(k, file.name); repintarCel(id, col);
  try {
    const b64 = await lerBase64(file);
    /* A porta é a da SEÇÃO da coluna: documento de licença sobe pela rota das
       licenças, arquivo de certificado pela dos certificados. Cada uma com o
       seu porteiro, e as duas gravando na pasta "Societário e Jurídico" DO
       CLIENTE. */
    const d = await postAcao({ acao: sec.acao_upload, id: id, coluna: col,
      cliente: l.valores && l.valores['Nome'] || '',
      arquivo_nome: file.name,
      arquivo_tipo: file.type || 'application/octet-stream',
      arquivo_base64: b64 });
    /* Resposta sem `url` NÃO apaga o link que já estava lá. */
    if (d && d.url && l.valores) l.valores[col] = d.url;
  } catch (e) {
    /* Quem responde é a MARCA da exceção, nunca o texto dela. Enviar de novo às
       cegas duplicaria o documento na pasta do cliente — por isso este caminho
       jamais diz "tente de novo": ele manda RECARREGAR e conferir. */
    if (e && e.local)        ERROS_CEL.set(k, 'Não consegui ler o arquivo. Escolha de novo.');
    else if (e && e.incerto) ERROS_CEL.set(k, 'Não consegui confirmar se subiu. Recarregue antes de mandar de novo — o documento pode já estar na pasta.');
    else                     ERROS_CEL.set(k, 'O servidor recusou: ' + String((e&&e.message)||e));
  } finally {
    ENVIANDO.delete(k);
    repintarCel(id, col);
  }
}

/* Os dois ouvintes da coluna de documento, no documento — mesma razão do
   `change` de campo: uma grade repinta o tempo todo, e ouvinte pendurado em nó
   repintado morre com ele. */
document.addEventListener('change', e=>{
  const no = e.target;
  if (!no || !no.dataset || !no.dataset.upCol) return;
  const f = no.files && no.files[0];
  if (f) enviarDocumento(no.dataset.upId, no.dataset.upCol, f);
  no.value = '';        // escolher o MESMO arquivo de novo tem de disparar de novo
});
document.addEventListener('click', e=>{
  const bt = e.target.closest && e.target.closest('[data-url-col]');
  if (!bt) return;
  const cx = bt.closest('.doc'); if (!cx) return;
  const inp = cx.querySelector('.doc-url');
  if (inp) { inp.hidden = !inp.hidden; if (!inp.hidden) inp.focus(); }
});

/* ══════════════════════════════════════════════════════════════════════════
   GRAVAÇÃO — a tela não espera, e o que falha aparece
   Uma gravação por CLIENTE (chave 'rec:<id>'), e a última manda: duas gravações
   da mesma linha em voo terminam fora de ordem com facilidade, e a resposta da
   anterior falaria de um estado que já não está na tela.
   ══════════════════════════════════════════════════════════════════════════ */
let TIMER = null;
function marcarSujo(id, col, valor){
  /* O LOTE É POR SEÇÃO. Cada seção tem a sua rota e o seu porteiro; juntar os
     campos das duas num lote só obrigaria a existir uma porta com permissão de
     UNIÃO — que é justamente a que não pode existir (ver 10_Documentos.gs).
     Quase sempre é um lote (mexeu numa seção); dois é quem editou o alvará e a
     senha na mesma abertura. */
  const sec = secaoDe(col);
  if (!sec) return;                       // coluna de identificação: não grava
  const k = chaveLote(id, sec.id);
  if (!SUJOS.has(k)) SUJOS.set(k, {});
  /* MESMO FUNIL NA IDA E NA VOLTA. `b4uParaPlanilha` tira a máscara do que é
     identificador (00.623.904/0001-73 → 00623904000173) e deixa o resto como
     está. Gravar o valor mascarado faria a busca do painel deixar de achar o
     cliente pelo CNPJ no dia seguinte. */
  SUJOS.get(k)[col] = window.b4uParaPlanilha ? b4uParaPlanilha(valor, col) : valor;
  FALHAS.delete(k);
  pintarSelo(id);
  /* Espera curta antes de mandar: quem corrige três campos seguidos da mesma
     seção manda UMA gravação, não três — e três seriam três leituras da planilha
     inteira dentro do lock, uma esperando a outra. */
  clearTimeout(TIMER);
  TIMER = setTimeout(()=>{ Array.from(SUJOS.keys()).forEach(gravarLote); }, 700);
}

function gravarLote(k){
  const campos = SUJOS.get(k);
  if (!campos || !Object.keys(campos).length) return;
  SUJOS.delete(k);
  const corte = k.lastIndexOf('|');
  const id  = k.slice(0, corte), sid = k.slice(corte + 1);
  const sec = SECOES.find(x=>x.id===sid);
  if (!sec) return;
  const linha = LINHAS.find(l=>l.id===id) || {};
  /* O que o recado nomeia quando falha. Senha nunca aparece por extenso — nem
     num recado de erro, que é justamente o texto que fica na tela mais tempo. */
  const itens = Object.keys(campos).map(c =>
    c + ' → ' + (SIGILOSA.has(normCol(c)) ? '(alterado)' : (campos[c] || '(vazio)')));

  const envio = () => postAcao({ acao:'recorte_salvar', recorte:recorteAtual(),
                                 secao:sec.id, id:id, campos:campos,
                                 cliente:linha.nome_cliente||'' })
    .then(d => {
      /* O servidor devolve o que IGNOROU (coluna fora da seção, célula com
         fórmula). Ignorada NÃO foi gravada, e chamar isso de sucesso é a mentira
         mais cara que um painel conta. */
      if (d && d.ignoradas && d.ignoradas.length) {
        const e = new Error('Não gravei: ' + d.ignoradas.join(', ') +
          (d.travadas && d.travadas.length ? ' — a célula tem fórmula na planilha.' : ''));
        e.doServidor = true;
        throw e;
      }
      Object.keys(campos).forEach(c => { if (linha.valores) linha.valores[c] = campos[c]; });
      FALHAS.delete(k); pintarSelo(id);
      return d;
    });

  const aoFalhar = e => { FALHAS.set(k, String((e&&e.message)||e)); pintarSelo(id); };

  if (window.B4UGravar) {
    /* Uma gravação por chave, e a última manda: duas gravações do MESMO lote em
       voo ao mesmo tempo terminam fora de ordem com facilidade, e a resposta da
       anterior falaria de um estado que já não está na tela. Como a chave leva a
       seção, o lote de licenças e o de acessos do mesmo cliente não se
       atropelam — que é o que `Promise.allSettled` resolve na tela antiga. */
    B4UGravar.enviar({
      chave: 'rec:' + k,
      titulo: (linha.nome_cliente||id) + ' — ' + sec.rotulo,
      itens: itens,
      envio: envio,
      aoOk: ()=>{ FALHAS.delete(k); pintarSelo(id); },
      aoDesfazer: ()=>aoFalhar(new Error('A gravação não foi confirmada.'))
    });
  } else {
    envio().catch(aoFalhar);
  }
  pintarSelo(id);
}

/* O selo é da LINHA e soma os lotes dela: quem olha a lista quer saber se aquele
   cliente tem coisa por gravar, não em qual das duas seções. Ele é desenhado a
   partir do ESTADO, e por isso sobrevive a filtro, a busca e à troca de modo —
   que é justamente quando um selo pintado "na mão" some. */
function pintarSelo(id){
  const meus = k => k.slice(0, k.lastIndexOf('|')) === id;
  const falhou = Array.from(FALHAS.keys()).filter(meus);
  const indo   = Array.from(SUJOS.keys()).filter(meus);
  document.querySelectorAll('[data-selo="'+selEsc(id)+'"]').forEach(no=>{
    if (falhou.length)    no.innerHTML = '<span class="selo err" title="'+esc(FALHAS.get(falhou[0]))+'">não gravou</span>';
    else if (indo.length) no.innerHTML = '<span class="selo vai">gravando…</span>';
    else                  no.innerHTML = '';
  });
}

/* UM ouvinte, no documento. Ver o comentário de `campoHTML`. */
document.addEventListener('change', e=>{
  const no = e.target;
  if (!no || !no.dataset || !no.dataset.col || !no.dataset.id) return;
  marcarSujo(no.dataset.id, no.dataset.col, no.value);
});

/* ══════════════════════════════════════════════════════════════════════════
   1) ESCOLHER QUAIS VARIÁVEIS MOSTRAR
   É a MESMA caixa de seleção múltipla dos filtros (b4u-filtro.js), sobre outra
   lista. Não foi escrito um seletor próprio de propósito: escolher colunas e
   filtrar por valor são a mesma pergunta — "quais destes?" — e um segundo widget
   com o mesmo desenho é a primeira coisa a divergir do primeiro.
   ══════════════════════════════════════════════════════════════════════════ */
function montarSeletorColunas(){
  const alvo = document.getElementById('filtros');
  if (!window.B4UFiltro) return;                     // sem o arquivo: mostra tudo, e a tela vive
  const f = B4UFiltro.criar({
    id:'f-cols', rot:'Colunas',
    itens: DO_REC.map(c=>({v:c, r:c})),
    marcados: VIS.slice(),
    /* `vazio:'nada'` porque a caixa NASCE com tudo marcado: desmarcar tudo é um
       gesto deliberado, e a resposta certa é obedecer e avisar — não cair
       calado em "todas", que desfaria o que a pessoa acabou de fazer. */
    vazio:'nada',
    rotTodos:'Todas as colunas', rotNada:'Nenhuma coluna', rotTodas:'Todas',
    aoMudar: m => {
      /* A ordem é a do RECORTE, nunca a ordem em que a pessoa clicou: quem
         declarou o recorte pensou nas colunas nessa sequência, e uma tela que
         reordena sozinha conforme os cliques nunca fica igual duas vezes. */
      VIS = DO_REC.filter(c=>m.indexOf(c)>-1);
      salvarVis();
      /* COLUNA QUE SAI DA TELA PERDE O FILTRO DELA. A alternativa — guardar e
         reaplicar quando ela voltar — deixaria linhas sumindo por causa de uma
         regra que não está em lugar nenhum da tela. Um filtro que a pessoa não
         consegue ver é um filtro que ela não consegue desfazer. */
      Array.from(F_COL.keys()).forEach(c => { if (VIS.indexOf(c) < 0) F_COL.delete(c); });
      if (ORD.col && VIS.indexOf(ORD.col) < 0) ORD = { col:'', dir:'' };
      fecharFiltro();
      desenhar();
    }
  });
  alvo.appendChild(f.no);
}

/* ---------------- o funil ----------------
   Uma função, e ela é a ÚNICA que decide quem aparece. Filtro escrito duas vezes
   (uma para as fichas, outra para a grade) é a discordância mais comum deste
   tipo de tela: o contador diz 12 e a planilha mostra 14. */
function filtradas(){
  const termo = normTxt(BUSCA), dig = soDigitos(BUSCA);
  let out = LINHAS.filter(l=>{
    if (termo || dig) {
      /* A busca varre a identificação e as colunas VISÍVEIS — nunca as
         sigilosas: procurar por um pedaço de senha e receber o cliente certo é
         um jeito de descobrir a senha sem nunca vê-la. */
      const alvo = IDENT.concat(VIS).filter(c=>!SIGILOSA.has(normCol(c)))
        .map(c=>l.valores[c]||'').join(' ') + ' ' + l.id + ' ' + (l.nome_cliente||'');
      const casa = (termo && normTxt(alvo).includes(termo)) ||
                   (dig && dig.length>=3 && soDigitos(alvo).includes(dig));
      if (!casa) return false;
    }
    for (const [col, passam] of F_COL) {
      if (VIS.indexOf(col) < 0) continue;            // coluna escondida não filtra (e o mapa já foi limpo)
      /* A CÉLULA VAZIA É UM VALOR, não uma exceção. No painel ela aparece como
         "(em branco)" e se marca e desmarca como qualquer outro — que é como o
         Sheets faz, e é o que permite pedir "só os que faltam preencher" sem
         inventar um filtro especial para isso. A versão anterior deixava a
         vazia passar por todo filtro, e com isso "Regime: Simples" trazia junto
         os trinta clientes sem regime nenhum. */
      if (!passam.has(String(l.valores[col]==null?'':l.valores[col]).trim())) return false;
    }
    return true;
  });

  /* A ORDENAÇÃO É DA TELA, nunca da planilha. Ninguém reordena 122 linhas de uma
     aba que outras seis rotas leem por posição — e o `row` de cada linha
     continua sendo o da planilha, que é por onde a gravação acha o cliente. */
  if (ORD.col && VIS.indexOf(ORD.col) > -1) {
    const c = ORD.col, sinal = (ORD.dir === 'desc' ? -1 : 1);
    out = out.slice().sort((a, b) => {
      const x = String(a.valores[c]==null?'':a.valores[c]).trim();
      const y = String(b.valores[c]==null?'':b.valores[c]).trim();
      /* VAZIO VAI PARA O FIM NOS DOIS SENTIDOS. Invertendo a ordem, quem pediu
         "os maiores primeiro" receberia uma tela de células em branco — e
         concluiria, de novo, que o painel perdeu o dado. */
      if (!x && !y) return 0;
      if (!x) return 1;
      if (!y) return -1;
      return sinal * cmpVal(x, y);
    });
  }
  return out;
}

/* Compara duas células. Número com número compara como número (senão "10" vem
   antes de "9"); o resto vai no localeCompare pt-BR, que é o que põe "Ângela"
   ao lado de "Angela" em vez de no fim do alfabeto. */
function cmpVal(x, y){
  const nx = Number(String(x).replace(/\./g,'').replace(',','.'));
  const ny = Number(String(y).replace(/\./g,'').replace(',','.'));
  if (isFinite(nx) && isFinite(ny) && /\d/.test(x) && /\d/.test(y) &&
      !/[a-zA-Z]/.test(x) && !/[a-zA-Z]/.test(y)) return nx - ny;
  return String(x).localeCompare(String(y), 'pt-BR', { sensitivity:'base', numeric:true });
}

/* ══════════════════════════════════════════════════════════════════════════
   O FUNIL DA COLUNA — filtrar e ordenar de dentro do cabeçalho

   Antes isto era uma fileira de fichinhas na régua, limitada a seis colunas e
   montada a partir das OPÇÕES DE VALIDAÇÃO da planilha. Duas coisas erradas de
   uma vez: a pessoa tinha de casar o rótulo do botão com o nome da coluna do
   outro lado da tela, e a lista oferecia valores que ninguém usa enquanto
   escondia os que estão lá e não passaram por validação nenhuma.

   Agora a lista sai do QUE ESTÁ NA COLUNA — valor por valor, com a contagem de
   linhas de cada um, como no Sheets. É a diferença entre "o que era para ter" e
   "o que tem", e numa tela de conferência quem manda é a segunda.
   ══════════════════════════════════════════════════════════════════════════ */

/* Os valores distintos de uma coluna, com quantas linhas têm cada um.
   Sobre TODAS as linhas, não sobre as filtradas: uma lista que encolhe conforme
   se filtra é uma lista da qual não dá para voltar — desmarcou demais, o valor
   some do painel e não há como remarcá-lo. */
function valoresDaColuna(col){
  const conta = new Map();
  LINHAS.forEach(l => {
    const v = String(l.valores[col]==null ? '' : l.valores[col]).trim();
    conta.set(v, (conta.get(v)||0) + 1);
  });
  return Array.from(conta.keys())
    .sort((a,b)=>{ if(!a) return 1; if(!b) return -1; return cmpVal(a,b); })
    .map(v => ({ v: v, n: conta.get(v) }));
}

const FUNIL_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 2.6h12.8L9.4 8.7v4.7L6.6 11.6V8.7z"/></svg>';

let FIL = null;   // { col, no }  — o painel aberto, se houver

function fecharFiltro(){
  if (!FIL) return;
  FIL.no.remove();
  document.querySelectorAll('.th-f[aria-expanded="true"], .chip .abrir[aria-expanded="true"]')
    .forEach(b => b.setAttribute('aria-expanded','false'));
  FIL = null;
}

function abrirFiltro(col, ancora){
  const jaEra = FIL && FIL.col === col;
  fecharFiltro();
  if (jaEra) return;                      // clicar de novo no mesmo funil FECHA

  const vals = valoresDaColuna(col);
  /* Lê o estado NA HORA, e não uma cópia feita ao abrir. A versão anterior
     capturava o `Set` na abertura, e como cada clique redesenha a lista, o
     redesenho remarcava a caixa que a pessoa acabara de desmarcar — o filtro
     entrava na tabela e o painel dizia que não. */
  const marcado = v => { const p = F_COL.get(col); return !p || p.has(v); };

  const no = document.createElement('div');
  no.className = 'gfil';
  no.setAttribute('role','dialog');
  no.setAttribute('aria-label','Filtrar e ordenar por ' + col);
  no.innerHTML =
    '<button type="button" class="gfil-i' + (ORD.col===col && ORD.dir==='asc' ?' on':'') + '" data-ord="asc">Classificar A → Z</button>' +
    '<button type="button" class="gfil-i' + (ORD.col===col && ORD.dir==='desc'?' on':'') + '" data-ord="desc">Classificar Z → A</button>' +
    '<div class="gfil-sep"></div>' +
    '<input class="gfil-busca" type="search" placeholder="Buscar nesta coluna…" autocomplete="off">' +
    '<div class="gfil-topo"><button type="button" data-todos>Selecionar tudo</button>' +
      '<button type="button" data-nada>Limpar</button>' +
      '<span class="gfil-cnt"></span></div>' +
    '<div class="gfil-lista"></div>' +
    '<div class="gfil-pe"><button type="button" class="gfil-i" data-tirar>Tirar o filtro desta coluna</button></div>';

  const lista = no.querySelector('.gfil-lista');
  const cnt   = no.querySelector('.gfil-cnt');
  const busca = no.querySelector('.gfil-busca');

  function desenharLista(){
    const t = normTxt(busca.value);
    /* A BUSCA ESCONDE, NÃO DESMARCA. Quem digita "simples" e clica em "Limpar"
       está pedindo para limpar o que está VENDO — mas o que não está à vista
       continua valendo, e é por isso que `visiveis()` existe e os dois botões
       do topo operam só sobre ela. Limpar os trezentos escondidos junto seria
       apagar uma escolha que a pessoa não viu acontecer. */
    const its = vals.filter(o => !t || normTxt(o.v || 'em branco').includes(t));
    lista.innerHTML = its.length ? its.map(o =>
      '<label><input type="checkbox" data-v="' + esc(o.v) + '"' + (marcado(o.v)?' checked':'') + '>' +
      '<span class="r' + (o.v?'':' gfil-b') + '">' + (o.v ? esc(o.v) : '(em branco)') + '</span>' +
      '<span class="n">' + o.n + '</span></label>').join('')
      : '<div class="gfil-vazio">Nenhum valor com esse texto.</div>';
    const n = vals.filter(o => marcado(o.v)).length;
    cnt.textContent = n + ' de ' + vals.length;
  }
  function visiveis(){ return Array.from(lista.querySelectorAll('input[data-v]')).map(i => i.dataset.v); }

  /* Grava a escolha. TUDO MARCADO = SEM FILTRO: a chave sai do mapa, o funil
     apaga e o chip some. Guardar um Set com todos os valores "daria no mesmo"
     hoje e mentiria amanhã — no dia em que um cliente novo trouxer um valor que
     não estava na lista, ele seria filtrado para fora por uma escolha que
     ninguém fez. */
  function aplicar(){
    const vis = new Set(visiveis());
    const marcadosVis = new Set(Array.from(lista.querySelectorAll('input[data-v]:checked')).map(i => i.dataset.v));
    const antes = F_COL.get(col);
    const novo = new Set();
    vals.forEach(o => {
      /* Valor À VISTA: manda o checkbox. Valor que a BUSCA ESCONDEU: fica como
         estava — e "como estava", quando ainda não havia filtro, é passando.
         Sem esta última linha, digitar "A1" e desmarcar um item apagaria em
         silêncio todos os outros valores da coluna. */
      if (vis.has(o.v)) { if (marcadosVis.has(o.v)) novo.add(o.v); }
      else if (!antes || antes.has(o.v)) novo.add(o.v);
    });
    if (novo.size >= vals.length) F_COL.delete(col); else F_COL.set(col, novo);
    desenhar();
  }

  no.addEventListener('change', e => {
    if (e.target.matches('input[data-v]')) { aplicar(); desenharLista(); }
  });
  busca.addEventListener('input', desenharLista);
  no.addEventListener('click', e => {
    const bt = e.target.closest('button'); if (!bt) return;
    if (bt.dataset.ord)   { ORD = (ORD.col===col && ORD.dir===bt.dataset.ord) ? {col:'',dir:''} : {col:col, dir:bt.dataset.ord}; fecharFiltro(); desenhar(); return; }
    if (bt.hasAttribute('data-todos')) { lista.querySelectorAll('input[data-v]').forEach(i => i.checked = true);  aplicar(); desenharLista(); return; }
    if (bt.hasAttribute('data-nada'))  { lista.querySelectorAll('input[data-v]').forEach(i => i.checked = false); aplicar(); desenharLista(); return; }
    if (bt.hasAttribute('data-tirar')) { F_COL.delete(col); fecharFiltro(); desenhar(); return; }
  });

  desenharLista();
  document.body.appendChild(no);

  /* Encaixe: abaixo da âncora, sem sair da janela. `position:fixed` calculado a
     partir do `getBoundingClientRect()` — ver o comentário do `.gfil` no CSS
     sobre por que ele não pode ser filho do cabeçalho. */
  const r = ancora.getBoundingClientRect();
  const larg = Math.min(320, window.innerWidth - 16);
  no.style.left = Math.max(8, Math.min(r.left, window.innerWidth - larg - 8)) + 'px';
  no.style.top  = Math.round(r.bottom + 2) + 'px';
  no.querySelector('.gfil-lista').style.maxHeight =
    Math.max(120, window.innerHeight - r.bottom - 140) + 'px';

  ancora.setAttribute('aria-expanded','true');
  FIL = { col: col, no: no, t: Date.now() };
  /* `preventScroll` — sem ele, dar foco ao campo de busca faz o navegador rolar
     o painel para dentro da vista, esse rolar dispara o `scroll` de captura logo
     abaixo, e o painel se fecha sozinho no mesmo gesto que o abriu. */
  busca.focus({ preventScroll: true });
}

/* Fechar: Esc, clique fora, e rolagem. Rolar é o caso que se esquece — o painel
   é `fixed` e a grade rola por baixo dele, então sem isto ele ficaria parado
   apontando para a coluna errada. */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && FIL) fecharFiltro(); });
document.addEventListener('mousedown', e => {
  if (!FIL) return;
  if (e.target.closest && (e.target.closest('.gfil') || e.target.closest('.th-f') || e.target.closest('.chip'))) return;
  fecharFiltro();
}, true);
window.addEventListener('scroll', e => {
  if (!FIL) return;
  /* DUAS EXCEÇÕES, e as duas custaram um painel que piscava e sumia:
     1. a rolagem DE DENTRO do painel é a pessoa correndo a lista de valores —
        fechar aí é fechar no meio do gesto de usar;
     2. os primeiros milésimos depois de abrir. Dar foco ao campo de busca faz o
        navegador rolar, e esse rolar chega aqui como se fosse a pessoa. */
  if (e.target && e.target.nodeType === 1 && e.target.closest && e.target.closest('.gfil')) return;
  if (Date.now() - FIL.t < 300) return;
  fecharFiltro();
}, true);

document.addEventListener('click', e => {
  const f = e.target.closest('.th-f, .chip .abrir');
  if (f && f.dataset.fcol) { e.preventDefault(); abrirFiltro(f.dataset.fcol, f); return; }
  const x = e.target.closest('.chip .x');
  if (x) { if (x.dataset.fcol) F_COL.delete(x.dataset.fcol); else ORD = {col:'',dir:''}; fecharFiltro(); desenhar(); return; }
  const t = e.target.closest('.chips .tudo');
  if (t) { F_COL.clear(); ORD = {col:'',dir:''}; fecharFiltro(); desenhar(); }
});

/* ---------------- os filtros ativos, por extenso ----------------
   Vale nos DOIS modos, e é o único sinal no modo Fichas — que não tem cabeçalho
   onde acender funil nenhum. */
function pintarChips(){
  const alvo = document.getElementById('chips');
  const its = [];
  if (ORD.col) its.push('<span class="chip ord"><span>Ordenado por ' + esc(ORD.col) +
    ' ' + (ORD.dir==='desc'?'↓':'↑') + '</span><button class="x" title="Tirar a ordenação" aria-label="Tirar a ordenação">×</button></span>');
  F_COL.forEach((passam, col) => {
    if (VIS.indexOf(col) < 0) return;
    const total = valoresDaColuna(col).length;
    its.push('<span class="chip">' +
      '<button class="abrir" data-fcol="' + esc(col) + '" aria-expanded="false" aria-haspopup="dialog" ' +
        'title="Abrir o filtro de ' + esc(col) + '">' + esc(col) + ': ' + passam.size + ' de ' + total + '</button>' +
      '<button class="x" data-fcol="' + esc(col) + '" title="Tirar este filtro" aria-label="Tirar o filtro de ' + esc(col) + '">×</button></span>');
  });
  if (its.length > 1) its.push('<button type="button" class="tudo">limpar tudo</button>');
  alvo.innerHTML = its.join('');
}

/* ══════════════════════════════════════════════════════════════════════════
   2) MOSTRAR EM MODAL — a ficha de um cliente
   A moldura (véu, Esc, foco preso, aviso de "tem coisa por gravar") é do
   b4u-modal.js. Daqui para dentro é só o CONTEÚDO — e é essa fronteira que
   impede aquele arquivo de virar um catálogo de exceções.

   Usa `criar()`, e não `adotar()`: as sete fichas do painel foram adotadas
   porque já tinham o <div class="modal"> escrito à mão e dezenas de ids
   apontando para dentro dele. Esta nasce agora, sem id nenhum para preservar —
   é exatamente o caso para o qual o `criar()` foi escrito e nunca usado.
   ══════════════════════════════════════════════════════════════════════════ */
let FICHA = null;
function abrirFicha(id){
  const l = LINHAS.find(x=>x.id===id);
  if (!l || !window.B4UModal) return;

  const cabeca = IDENT.map(c=>
    '<div class="mfld"><span class="lbl">'+esc(c)+'</span>'+
    campoHTML(id,c,l.valores[c],'in')+'</div>').join('');

  /* UM BLOCO POR SEÇÃO, na ordem em que o recorte as declarou. Não é divisória
     de layout: é a mesma fronteira que decide o porteiro e a porta de gravação,
     e mostrá-la é o que explica por que metade dos campos está travada e a
     outra metade não.

     Dentro de cada bloco, as colunas do recorte na ordem declarada, respeitando
     a escolha da pessoa em "Colunas". A ficha mostra o que ela escolheu ver — e
     não "tudo, porque aqui cabe": duas telas com listas diferentes para o mesmo
     recorte é o começo de a pessoa não confiar em nenhuma das duas. */
  const campo = c =>
    '<div class="mfld'+(ehLonga(c)?' full':'')+'">'+
      '<span class="lbl">'+esc(c)+(editavel(c)?'':' <span class="lock" title="Só leitura">🔒</span>')+'</span>'+
      campoHTML(id,c,l.valores[c],'in')+
    '</div>';

  const blocos = SECOES.map(sec=>{
    const cols = VIS.filter(c=>{ const x=secaoDe(c); return x && x.id===sec.id; });
    if (!cols.length) return '';
    return '<div class="banda">'+
             '<span class="t">'+esc(sec.rotulo)+'</span>'+
             '<span class="s">'+esc(sec.sobre||'')+'</span>'+
             /* O aviso vive na FAIXA, dito uma vez — e não repetido em vinte e um
                cadeados, um por campo. O cadeado do rótulo continua lá para quem
                chegar direto num campo, mas quem explica é isto aqui. */
             (sec.pode_gravar ? '' : '<span class="aviso">você não edita esta seção</span>')+
             '<span class="s" style="flex:0 0 auto">'+cols.length+' de '+(sec.colunas||[]).length+'</span>'+
           '</div>'+
           '<div class="msec"><div class="msec-campos">'+cols.map(campo).join('')+'</div></div>';
  }).join('');

  const html =
    '<div class="msec"><div class="msec-tit">Identificação<span class="n">só leitura</span></div>'+
      '<div class="msec-campos">'+cabeca+'</div></div>'+
    (blocos || '<div class="dica">Nenhuma coluna marcada em <b>Colunas</b>.</div>')+
    (l.drive ? '<div class="dica" style="margin-top:10px"><a href="'+esc(l.drive)+'" rel="noopener">Pasta do cliente no Drive ↗</a></div>' : '');

  if (!FICHA) {
    FICHA = B4UModal.criar({
      id:'modalRec', largura:'880px', status:true,
      avisoSujo:'Ainda não gravei o que você mudou. Espere um instante — ou clique de novo em Fechar para sair assim mesmo.',
      acoes:[{id:'recFechar', rot:'Fechar', tipo:'sec'}],
      /* `sujo` é sobre a TELA (é ele que liga o beforeunload). A ficha grava
         sozinha, então fechá-la não perde nada que já não esteja em voo — por
         isso não há `perdeAoFechar` separado aqui. */
      sujo: ()=> SUJOS.size>0
    });
  }
  FICHA.titulo(l.nome_cliente || id);
  FICHA.selo(id);
  /* `corpo()` é GETTER — devolve o nó, não o preenche. A casca é dona da
     moldura e nunca do conteúdo (é a regra 2 do b4u-modal.js), então quem
     escreve aqui dentro é esta página. */
  FICHA.corpo().innerHTML = html;
  FICHA.abrir();
}

/* ══════════════════════════════════════════════════════════════════════════
   3) MOSTRAR EM PLANILHA FILTRÁVEL
   ══════════════════════════════════════════════════════════════════════════ */
function desenharGrade(){
  const linhas = filtradas();
  /* O CABEÇALHO DE CADA COLUNA passa a ser um controle: rótulo, seta de
     ordenação e funil. O funil fica visível sempre (fraco), e não só no hover:
     um botão que só aparece quando o mouse passa por cima é um botão que quem
     não sabe que ele existe nunca descobre — e no toque não existe hover. */
  const th = '<th class="fix1">ID</th><th class="fix2">Cliente</th>' +
    VIS.map(c=>{
      const filtrada = F_COL.has(c);
      const seta = (ORD.col===c) ? '<span class="th-ord" aria-hidden="true">'+(ORD.dir==='desc'?'↓':'↑')+'</span>' : '';
      return '<th'+(filtrada?' class="filtrado"':'')+'>'+
        '<div class="th-in">'+
          '<span class="th-rot">'+esc(c)+'</span>'+ seta +
          '<button type="button" class="th-f'+(filtrada?' on':'')+'" data-fcol="'+esc(c)+'" '+
            'aria-haspopup="dialog" aria-expanded="false" '+
            'title="'+(filtrada?'Filtro ativo — clique para mudar':'Filtrar e ordenar')+'" '+
            'aria-label="'+(filtrada?'Filtro ativo em ':'Filtrar e ordenar ')+esc(c)+'">'+FUNIL_SVG+'</button>'+
        '</div></th>';
    }).join('');
  const tr = linhas.map(l=>
    '<tr>'+
      '<td class="fix1"><button class="bt" data-abrir="'+esc(l.id)+'" type="button" '+
        'title="Abrir a ficha deste cliente">'+esc(l.id)+'</button></td>'+
      '<td class="fix2">'+esc(l.nome_cliente||'')+'<span data-selo="'+esc(l.id)+'"></span></td>'+
      VIS.map(c=>'<td>'+campoHTML(l.id,c,l.valores[c],'cel-in')+'</td>').join('')+
    '</tr>').join('');
  document.getElementById('conteudo').innerHTML = linhas.length
    ? '<div class="grade-wrap"><table class="grade"><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div>'
    : '<div class="vazio">Nenhum cliente com esses filtros.</div>';
  linhas.forEach(l=>pintarSelo(l.id));
}

/* O que o CARTÃO mostra de um valor. Não é o valor cru: uma URL de 120
   caracteres empurra as outras duas colunas para fora da linha e não diz nada
   além de "tem" — que é justamente o que interessa saber de longe. Data sai em
   dd/mm/aaaa, e senha nunca sai. */
function resumoValor(col, v){
  const t = String(v==null?'':v).trim();
  if (!t) return '—';
  if (SIGILOSA.has(normCol(col))) return '••••••';
  if (LINK.has(normCol(col)))     return 'tem';
  if (DATA.has(normCol(col)))     return fmtBR(t);
  return t.length > 42 ? t.slice(0,40) + '…' : t;
}

function desenharFichas(){
  const linhas = filtradas();
  /* O cartão mostra as TRÊS primeiras colunas visíveis e quantas faltam
     preencher. Três porque é o que cabe numa linha sem quebrar no celular, e
     porque o cartão é um ÍNDICE — quem quer o resto abre a ficha. */
  const amostra = VIS.slice(0,3);
  const html = linhas.map(l=>{
    const faltam = VIS.filter(c=>!String(l.valores[c]||'').trim()).length;
    const resumo = amostra.map(c=>
      '<span>'+esc(c)+': <b>'+esc(resumoValor(c, l.valores[c]))+'</b></span>').join('') +
      (faltam ? '<span class="falta">'+faltam+' em branco</span>' : '');
    return '<button class="cli" type="button" data-abrir="'+esc(l.id)+'">'+
      '<span class="l1"><span class="id">'+esc(l.id)+'</span>'+
      '<span class="nm">'+esc(l.nome_cliente||'(sem nome)')+'</span>'+
      '<span data-selo="'+esc(l.id)+'"></span></span>'+
      '<span class="resumo">'+resumo+'</span></button>';
  }).join('');
  document.getElementById('conteudo').innerHTML = html || '<div class="vazio">Nenhum cliente com esses filtros.</div>';
  linhas.forEach(l=>pintarSelo(l.id));
}

function desenhar(){
  (MODO==='grade' ? desenharGrade : desenharFichas)();
  pintarChips();
  const n = filtradas().length;
  document.getElementById('cnt').textContent =
    n + (n===1?' cliente':' clientes') + (n!==LINHAS.length ? ' de '+LINHAS.length+' (filtrados)' : '') +
    ' · ' + VIS.length + '/' + DO_REC.length + ' colunas' +
    (SECOES.length > 1 ? ' em ' + SECOES.length + ' seções' : '');
}

/* Abrir a ficha: UM ouvinte, pelo `data-abrir`. Vale para o cartão e para o
   botão de ID da grade, sem que os dois precisem saber um do outro. */
document.addEventListener('click', e=>{
  const no = e.target.closest && e.target.closest('[data-abrir]');
  if (no) abrirFicha(no.getAttribute('data-abrir'));
});

/* ══════════════════════════════════════════════════════════════════════════
   CARGA
   ══════════════════════════════════════════════════════════════════════════ */
function aplicar(d){
  REC    = d.recorte || {rotulo:'Recorte', pode_gravar:false};
  /* As seções que CHEGARAM. Uma que a pessoa não pode ler não está aqui — o
     servidor não a pôs no payload, e isso não é `display:none`: a coluna nem
     viajou. */
  SECOES = d.secoes || [];
  SEC_DE = new Map();
  SECOES.forEach(sec => (sec.colunas||[]).forEach(c => SEC_DE.set(normCol(c), sec)));
  DO_REC = d.do_recorte || [];
  IDENT  = d.identificacao || [];
  LINHAS = d.linhas || [];
  VALID  = d.validacoes || {};
  ESPELHADA = new Set((d.espelhadas||[]).map(normCol));
  SIGILOSA  = new Set((d.sigilosas ||[]).map(normCol));
  DATA      = new Set((d.datas     ||[]).map(normCol));
  LINK      = new Set((d.links     ||[]).map(normCol));
  META   = d;

  document.title = REC.rotulo + ' — back4you';
  document.getElementById('tag').textContent = REC.rotulo;
  document.getElementById('sobre').textContent  = REC.sobre || '';

  /* A escolha guardada é FILTRADA pelo que o recorte tem HOJE. Sem isso, uma
     coluna tirada do recorte no servidor continuaria na lista de alguém para
     sempre — e apareceria como uma coluna vazia que ninguém consegue explicar. */
  const guardada = lerVis();
  VIS = guardada ? DO_REC.filter(c=>guardada.indexOf(c)>-1) : visPadrao();
  if (!guardada) salvarVis();

  /* A faixa de permissão nomeia AS SEÇÕES, não a tela. "Você não pode editar"
     seria falso para o societário, que edita as licenças e não os acessos — e
     um aviso que a pessoa sabe estar errado é um aviso que ela deixa de ler. */
  const travadas = SECOES.filter(s=>!s.pode_gravar);
  if (travadas.length) {
    const el = document.getElementById('avisoLeitura');
    el.hidden = false;
    el.textContent = travadas.length === SECOES.length
      ? 'Aqui você vê, mas não edita. Os campos vêm travados.'
      : 'Você vê, mas não edita: ' + travadas.map(s=>s.rotulo).join(' · ') +
        '. Os campos dessa parte vêm travados.';
  }

  montarSeletorColunas();

  /* O rodapé é onde a tela CONFESSA. `ausentes` são as colunas que o recorte
     pediu e a planilha não tem — sem esta linha, quem escreveu o recorte com um
     acento errado procura o defeito na permissão e no cache, que é onde ele
     não está. */
  const pe = [];
  if (META.aba) pe.push('Aba <b>'+esc(META.aba)+'</b>, cabeçalho na linha '+esc(META.cabecalho_linha||'?'));
  if (META.planilha_url) pe.push('<a href="'+esc(META.planilha_url)+'" rel="noopener">abrir a planilha ↗</a>');
  if (META.ausentes && META.ausentes.length)
    pe.push('<span style="color:var(--amber-txt);font-weight:800">Declaradas no recorte e ausentes na planilha: '+
            esc(META.ausentes.join(', '))+'</span>');
  if (META.validacoes_erro)
    pe.push('<span style="color:var(--amber-txt)">Não consegui ler as listas de opções: os campos ficaram de texto livre.</span>');
  document.getElementById('rodape').innerHTML = pe.join(' · ');

  desenhar();

  /* ?abrir=ID — o link que vem do painel do colaborador já com a ficha aberta. */
  const abrir = (new URLSearchParams(location.search).get('abrir')||'').trim();
  if (abrir) abrirFicha(abrir);
}

function carregar(){
  const r = recorteAtual();
  if (!r) {
    /* Sem `?r=` a página não tem assunto. Em vez de uma tela vazia, ela pergunta
       ao servidor QUAIS recortes esta pessoa pode abrir e oferece os links —
       o que também é o menu, enquanto não houver um no b4u-shell.js. */
    return jsonp(API_URL+'?tipo=recorte_lista&chave='+encodeURIComponent(chaveAtual()))
      .then(d=>{
        if (d && d.erro) throw new Error(d.erro);
        const its = (d&&d.recortes)||[];
        document.getElementById('conteudo').innerHTML = its.length
          ? '<div class="vazio">Escolha um recorte:</div>' + its.map(x=>
              '<a class="cli" href="?r='+encodeURIComponent(x.id)+'&chave='+encodeURIComponent(chaveAtual())+'" target="_self">'+
              '<span class="l1"><span class="nm">'+esc(x.rotulo)+'</span>'+
              '<span class="id">'+x.colunas+' colunas'+(x.pode_gravar?'':' · só leitura')+'</span></span>'+
              '<span class="resumo">'+esc(x.sobre||'')+'</span></a>').join('')
          : '<div class="vazio">Nenhum recorte disponível para o seu acesso.</div>';
        document.getElementById('cnt').textContent = '';
        document.getElementById('tag').textContent = 'Recortes do Registro';
      })
      .catch(mostrarErro);
  }
  return jsonp(API_URL+'?tipo=recorte_montar&recorte='+encodeURIComponent(r)+
               '&chave='+encodeURIComponent(chaveAtual()))
    .then(d=>{ if (d && d.erro) throw new Error(d.erro); aplicar(d); })
    .catch(mostrarErro);
}
function mostrarErro(e){
  const el = document.getElementById('avisoErro');
  el.hidden = false;
  el.textContent = String((e&&e.message)||e);
  document.getElementById('conteudo').innerHTML = '';
}

/* ---------------- régua ---------------- */
let TB = null;
document.getElementById('busca').addEventListener('input', e=>{
  BUSCA = e.target.value;
  /* 123 linhas × 40 colunas é uma tabela de ~5.000 células: redesenhar a cada
     tecla é o que faz a busca "engasgar" em quem digita rápido. */
  clearTimeout(TB); TB = setTimeout(desenhar, 160);
});
document.getElementById('modoFichas').addEventListener('click', ()=>trocarModo('fichas'));
document.getElementById('modoGrade') .addEventListener('click', ()=>trocarModo('grade'));
function trocarModo(m, semDesenhar){
  MODO = m;
  document.getElementById('modoFichas').classList.toggle('on', m==='fichas');
  document.getElementById('modoGrade') .classList.toggle('on', m==='grade');
  try{ localStorage.setItem('b4u.recorte.modo', m); }catch(_){}
  if (!semDesenhar && REC) desenhar();
}
/* O modo é lembrado, mas NÃO desenha aqui: quando esta linha roda ainda não
   chegou payload nenhum, e desenhar sem dados pintaria "nenhum cliente". */
try{ const m=localStorage.getItem('b4u.recorte.modo'); if(m) trocarModo(m, true); }catch(_){}

document.getElementById('volta').href = 'colaborador?chave='+encodeURIComponent(chaveAtual());
document.getElementById('logo-home').href = 'colaborador?chave='+encodeURIComponent(chaveAtual());

/* ---------------- menu lateral ----------------
   Montado ANTES de carregar(): a identidade desta tela é a chave, que já está na
   URL desde a primeira linha deste script — não há o que esperar da API. E se a
   busca falhar, o erro pinta dentro do #app com o menu inteiro de pé, que é a
   mesma razão de o erro nunca ser pintado no <body>.
   Sem `ativo`: esta página serve a vários recortes e nenhum deles é uma entrada
   do menu — marcar uma entrada errada é pior do que não marcar nenhuma. */
/* Qual entrada do menu este recorte ACENDE. A maioria não acende nenhuma — são
   telas que não estão no menu, e marcar uma entrada errada é pior do que não
   marcar nenhuma: a pessoa passa a achar que está noutro lugar. O `documentos`
   está aqui porque ele TEM entrada própria, e chegar nele com o menu apagado
   faria a tela parecer solta. */
const MENU_DE = { documentos: 'documentos' };

if (window.B4UShell) {
  B4UShell.montar({
    perfil:'equipe',
    ativo: MENU_DE[recorteAtual()] || '',
    link: function(pag){ return pag + '?chave=' + encodeURIComponent(chaveAtual()); }
  });
  B4UShell.usuario();
}

carregar();
</script>
