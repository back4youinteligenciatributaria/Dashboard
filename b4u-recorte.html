<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Guia nova por padrão: link clicado não tira o colaborador de onde ele estava. -->
<base target="_blank">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recorte do Registro (esqueleto) — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Duas origens porque o /exec responde 302 para a segunda: sem isto o aparelho paga
     DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"></noscript>
<style>
/* B4U-DESIGN:INICIO — paleta, cantos e fonte que as 22 páginas dividem.
   Bloco copiado de b4u-design.css (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-design.js`.

   Entra ANTES do <style> da página de propósito — é a camada base. Se esta
   página precisar mesmo de um valor diferente, redeclare o token no `:root`
   dela, que vem depois e vence. */
:root{
  /* ── Superfícies ─────────────────────────────────────────────────────────
     `--canvas` é o bege do fundo da página; `--surface` é o branco do cartão
     que se apoia nele; `--surface-warm` é o branco quebrado das faixas e
     cabeçalhos de tabela, que separam sem precisar de borda. */
  --canvas:#F1E7DC;
  --surface:#FFFFFF;
  --surface-warm:#FBF6EF;

  /* ── Letra ───────────────────────────────────────────────────────────────
     `--ink` é o texto normal, `--ink-2` o secundário, `--muted` o rótulo.
     `--muted` já foi #8A7D70 e reprovava em contraste (3,28:1); #6E6256 dá
     4,85:1 no bege e 5,92:1 no branco, e é a cor de quase todo rótulo do
     sistema — por isso ela precisa passar, e não só quase. */
  --ink:#113D39;
  --ink-2:#3F5854;
  --muted:#6E6256;

  /* ── Traços ──────────────────────────────────────────────────────────────
     `--line` divide o que é do mesmo grupo; `--line-2` fecha o que é caixa. */
  --line:#E4D9C9;
  --line-2:#D6C3AC;

  /* ── Marca ───────────────────────────────────────────────────────────────
     `--brand-teal` é canônico em logo, foco, borda e série de gráfico. Como
     TEXTO ele reprova (4,11:1 no branco, 3,44:1 no receita-soft), e para isso
     existe o `--brand-teal-txt`: o mesmo teal escurecido, 5,54:1 no branco e
     4,54:1 no bege, usado só onde é letra ou fundo de letra. Os dois são a
     mesma cor com dois trabalhos. O 4,54:1 passa, mas passa RASPANDO: quem for
     escurecer o `--canvas` um dia tem de conferir este par antes. */
  --brand-dark:#073034;
  --brand-teal:#0F8C85;
  --brand-euc:#3FA680;
  --brand-teal-txt:#0C756F;

  /* ── SINAL: as quatro cores que querem dizer alguma coisa ────────────────
     Estas quatro NÃO seguem o tema (ver OS QUATRO TEMAS, no fim do arquivo). Se
     "vencido" mudasse de vermelho conforme a pele escolhida, a cor deixaria de
     ser informação e viraria decoração — e quem trabalha nesta tela o dia
     inteiro lê a cor antes de ler a palavra.

     `--amber` tem 2,61:1 no branco: serve de PREENCHIMENTO e de borda, nunca de
     letra. Para letra âmbar existe o `--amber-txt` (5,91:1 no branco).

     ┌── PENDÊNCIA CONHECIDA: `--verde` E `--vermelho` REPROVAM COMO LETRA ────┐
     │                                                                        │
     │ Os dois NÃO têm o par `-txt` que o âmbar tem, e são usados nas duas     │
     │ funções ao mesmo tempo:                                                │
     │                                                                        │
     │     --verde     12 usos como `color`, 11 como `background`, 7 em borda │
     │     --vermelho  41 usos como `color`, 31 como `background`, 41 em borda │
     │                                                                        │
     │ E o lado TEXTO reprova. Medido nos valores atuais:                     │
     │                                                                        │
     │     --verde     #2E9D5F   2,82:1 no bege · 3,44:1 no branco   REPROVA  │
     │     --vermelho  #C0392B   4,46:1 no bege · 5,43:1 no branco   raspando │
     │                                                                        │
     │ O mínimo para texto é 4,5:1. É a mesma falha do `--muted` antigo (que   │
     │ dava 3,28:1), e atinge `.hint.ok` e `.lk.ok`, que são letra e nada      │
     │ mais. Há prova de que alguém já tinha esbarrado nisso sem nomear: o     │
     │ `.det-fbtn.ativo` escreve `color:#0E5B37` à mão — um verde bem mais     │
     │ escuro — em vez de usar o token.                                       │
     │                                                                        │
     │ CONSERTO MEDIDO E NÃO APLICADO (decisão de 10/08/2026):                 │
     │                                                                        │
     │     --verde     #2E9D5F -> #1F7546   (2,82:1 -> 4,66:1 no bege)        │
     │     --vermelho  #C0392B -> #BB3728   (4,46:1 -> 4,66:1 no bege)        │
     │                                                                        │
     │ Matiz e saturação ficam onde estão; só a luminosidade desce, o mínimo   │
     │ para passar com folga. Escurecer é seguro pelo lado do FUNDO: TODAS as  │
     │ regras `background:var(--verde)` / `background:var(--vermelho)` já vêm  │
     │ com `color:#fff` (ou são faixa/pontinho sem texto), e fundo mais escuro │
     │ com letra branca só melhora.                                           │
     │                                                                        │
     │ POR QUE NÃO FOI APLICADO AGORA: mexer nestes dois repinta as 22         │
     │ páginas, inclusive as 8 do cliente. A rodada que centralizou os tokens  │
     │ era de ESTRUTURA — nenhum pixel de cor mudou nela de propósito, para    │
     │ que qualquer diferença que aparecesse em produção tivesse uma causa só. │
     │ Trocar cor é decisão de produto e vai junto da varredura do MODO        │
     │ ESCURO, que já vai ter de abrir os 22 arquivos.                         │
     │                                                                        │
     │ QUANDO FOR FAZER, olhe também o `--verde-2`: várias páginas o declaram  │
     │ valendo #25804C, com a nota "o verde um degrau mais escuro, para virar  │
     │ FUNDO de texto branco". Com o conserto acima, o `--verde` do núcleo     │
     │ fica MAIS ESCURO que o `--verde-2`, e a convenção do sufixo -2 se       │
     │ inverte nesse par. Não dá para resolver daqui: o `--verde-2` mora no    │
     │ `:root` de cada página.                                                │
     └────────────────────────────────────────────────────────────────────────┘

     (Escrito assim, sem dois-pontos colado no nome, de propósito: a
     `tokensCanonicos()` do `_aplica-design.js` varre este bloco com um regex de
     declaração e NÃO pula comentário. Nome de token seguido de dois-pontos aqui
     dentro vira token canônico de mentira, e o `--verde-2` de mentira faria as
     22 páginas aparecerem como "exceção mantida" no terminal. Vale para todo
     comentário deste arquivo: cite o token, nunca o escreva como declaração.) */
  --amber:#E8892E;
  --amber-txt:#8A5A10;
  --vermelho:#C0392B;
  --verde:#2E9D5F;

  /* ── Cantos ──────────────────────────────────────────────────────────────
     Uma escala só, no site inteiro, e mais QUADRADA que redonda.
       4px  campo, selo, célula
       6px  cartão, linha da lista, botão
       8px  bloco grande e modal
     `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é citado
     em mais de cem regras, mas o valor acompanha o resto — pílula virou
     etiqueta. Círculo de verdade (avatar, contador, spinner) continua com
     `border-radius:50%` escrito na regra e não passa por aqui. */
  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-pill:6px;

  /* ── Escala tipográfica ──────────────────────────────────────────────────
     Seis degraus, e o pulo entre eles é de propósito irregular: 11-12-13 é a
     faixa de rótulo, selo e nota de rodapé, onde 1px já muda a hierarquia; 15 é
     o corpo; 19 e 24 são título de bloco e de tela. Um degrau constante (1,2×,
     por exemplo) daria 11-13-16-19-23-28 e gastaria três tamanhos na faixa em
     que o olho não distingue nada.
     ATENÇÃO: o `body{font-size:15px}` das páginas está escrito à mão e NÃO sai
     daqui. Quem mexer na escala não muda o corpo do texto; muda só quem usa
     `var(--fs-N)` — que é rótulo, selo, cabeçalho de tabela e título. */
  --fs-1:11px;
  --fs-2:12px;
  --fs-3:13px;
  --fs-4:15px;
  --fs-5:19px;
  --fs-6:24px;

  /* ── Fonte ───────────────────────────────────────────────────────────────
     Montserrat vem do Google Fonts, declarado no <head> de cada página. O
     `system-ui` é o que aparece enquanto ela não chega — e é o que fica se ela
     não chegar nunca. */
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
/* B4U-DESIGN:FIM */
</style>
<style>
:root{
  /* SÓ o que NÃO existe no b4u-design.css. Tudo o mais (paleta, cantos, fonte,
     escala de corpo) vem do bloco canônico logo acima — e declarar aqui um
     token que já existe lá seria congelar esta página no valor de hoje: o
     `:root` da página vem DEPOIS e vence, então mexer no arquivo canônico
     deixaria de mudar um pixel aqui. O `node _aplica-design.js` avisa quando
     isso acontece; se ele avisar sobre esta página, apague o token daqui.
     Os três abaixo são a faixa de aviso âmbar e o vermelho de recusa, que hoje
     só esta tela usa com nome próprio. No dia em que uma segunda tela precisar
     dos mesmos, o lugar deles é o b4u-design.css, não uma segunda cópia. */
  --amber-soft:#FDF3E6;
  --amber-line:#F2D2A8;
  --danger:#A4303F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45}
#app{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
a{color:var(--brand-teal-txt)}
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}

/* ---------- A BARRA ESCURA DO TOPO ----------
   Os mesmos valores das outras vinte páginas, e isso NÃO é decoração: o
   `b4u-shell.js` pendura o botão "Minha conta" no primeiro `.b4u-bar`,
   `.barra` ou `.topo` que achar, e o desenha em #cfe6e2 sobre um fundo
   translúcido branco — cores calculadas para fundo ESCURO ("a barra é escura em
   todas as nove", diz o comentário dele).

   Esta página nasceu chamando de `.barra` a régua de filtros, que fica no bege:
   o botão caiu ali e apareceu lavado, ilegível. Não era um problema de contraste
   a resolver com uma cor nova — era a página usando o nome de outra coisa. A
   régua virou `.regua`, e a barra voltou a ser a barra. */
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;
  box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}
.barra .logo .y{color:var(--brand-teal)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);
  padding:5px 11px;border-radius:var(--radius-pill);white-space:nowrap}
.barra .spacer{flex:1}
.barra a.volta{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}

/* ---------- o que a tela é, em uma linha ---------- */
.sobre{margin:0 2px 12px;color:var(--muted);font-size:var(--fs-2)}
.sobre:empty{display:none}

/* ---------- a régua de filtros ----------
   Ela nunca estoura: quebra de linha. */
.regua{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.regua .busca{flex:1 1 220px;min-width:160px;padding:7px 11px;border:1px solid var(--line);
  border-radius:var(--radius-pill);background:var(--surface);font-family:var(--sans);font-size:var(--fs-3)}
/* A CONTAGEM NÃO MORA NA RÉGUA, e isso não é gosto: a folha do b4u-shell.js
   esconde `.barra .cnt` com `!important` — decisão do dono em 10/08/2026, "a
   barra da equipe fica com título e quem está usando, e só". Um contador com o
   nome `cnt` dentro da `.barra` nasceria invisível, e quem fosse procurar o
   defeito passaria a tarde no CSS desta página, onde ele não está. Então ele
   virou a LEGENDA da lista, logo acima dela, que é onde uma legenda vai. */
.legenda{font-size:var(--fs-2);color:var(--muted);font-weight:700;margin:0 2px 8px}
.bt{font-family:var(--sans);font-size:var(--fs-2);font-weight:800;padding:6px 12px;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink-2)}
.bt:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.bt.on{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
/* O par Fichas/Planilha é UM controle, não dois botões soltos: encostados, com
   um só marcado, ele se lê como chave de duas posições — que é o que é. */
.modos{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-pill);overflow:hidden;background:var(--surface)}
.modos .bt{border:0;border-radius:0}
.modos .bt+.bt{border-left:1px solid var(--line)}

/* ---------- avisos ---------- */
.faixa{border-radius:var(--radius-sm);padding:9px 12px;font-size:var(--fs-2);font-weight:700;margin-bottom:10px}
.faixa.leitura{background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-txt)}
.faixa.erro{background:#FBEDEE;border:1px solid #E9C3C8;color:var(--danger)}
.faixa:empty{display:none}

/* ---------- modo FICHAS: um cartão por cliente ---------- */
.cli{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 13px;margin-bottom:7px;text-decoration:none;color:inherit;cursor:pointer;width:100%;text-align:left;font-family:var(--sans)}
.cli:hover{border-color:var(--brand-teal)}
.cli .l1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.cli .id{font-size:var(--fs-1);font-weight:900;color:var(--muted);letter-spacing:.04em}
.cli .nm{font-size:var(--fs-3);font-weight:800;color:var(--brand-dark)}
.cli .resumo{margin-top:4px;font-size:var(--fs-2);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.cli .resumo b{color:var(--ink-2);font-weight:700}
.cli .falta{color:var(--amber-txt);font-weight:800}

/* ---------- modo PLANILHA ----------
   A rolagem é do CONTAINER, nunca do <body>: dez pontos do painel leem
   window.scrollY, e uma tabela de 40 colunas empurrando a página para o lado
   quebraria o menu lateral e o puxar-para-atualizar junto. */
.grade-wrap{overflow:auto;max-height:70vh;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table.grade{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:var(--fs-2)}
table.grade th,table.grade td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.grade thead th{position:sticky;top:0;z-index:3;background:var(--surface-warm);
  font-size:var(--fs-1);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--brand-dark);text-align:left}
/* As duas primeiras colunas ficam presas: rolando quarenta colunas para a
   direita, sem elas ninguém sabe mais de qual cliente é a linha. */
table.grade th.fix1,table.grade td.fix1{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
table.grade th.fix2,table.grade td.fix2{position:sticky;left:74px;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
table.grade thead th.fix1,table.grade thead th.fix2{z-index:4;background:var(--surface-warm)}
table.grade tbody tr:hover td{background:#FBF8F3}
.cel-in{width:100%;min-width:130px;max-width:280px;border:1px solid transparent;border-radius:var(--radius-sm);
  padding:3px 6px;background:none;font-family:var(--sans);font-size:var(--fs-2);color:var(--ink)}
.cel-in:hover{border-color:var(--line)}
.cel-in:focus{border-color:var(--brand-teal);background:var(--surface);outline:none}
.cel-ro{color:var(--muted)}

/* ---------- O FUNIL NO CABEÇALHO ----------
   O filtro mora NA COLUNA, como no Sheets e no Excel. Enquanto ele era uma
   fichinha na régua, a pessoa tinha de casar o rótulo do botão com o nome da
   coluna lá do outro lado da tela — e com trinta colunas isso não se faz. */
table.grade thead th{padding:0}
.th-in{display:flex;align-items:center;gap:6px;padding:5px 8px}
.th-rot{overflow:hidden;text-overflow:ellipsis}
.th-ord{flex:none;font-size:10px;color:var(--brand-teal-txt)}
.th-f{flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;padding:0;border:0;border-radius:var(--radius-sm);
  background:none;color:var(--muted);cursor:pointer;opacity:.35}
.th-f svg{width:11px;height:11px;fill:currentColor}
.th-f:hover{opacity:1;color:var(--brand-dark);background:rgba(0,0,0,.06)}
/* O ESTADO ATIVO É O PONTO DA MUDANÇA. Um funil que fica igual filtrando ou não
   transforma "sumiu um cliente" num mistério — e o primeiro palpite de quem não
   vê o filtro é que o painel perdeu dado. Então: funil cheio, na cor da marca,
   opacidade total, e a coluna inteira ganha um fundo levemente tingido. */
.th-f.on{opacity:1;color:var(--brand-teal-txt);background:#E7F2F0}
table.grade thead th.filtrado{background:#EAF4F1;box-shadow:inset 0 -2px 0 var(--brand-teal)}

/* ---------- o painel do funil ----------
   Vive no <body> com `position:fixed`, e não dentro do <th>. A grade rola dentro
   de um container com `overflow:auto`: um painel filho do cabeçalho seria
   RECORTADO pela borda da tabela, e apareceria pela metade justamente nas
   colunas da direita, que são as que mais precisam de rolagem. */
.gfil{position:fixed;z-index:80;min-width:250px;max-width:min(320px,92vw);
  background:var(--surface);border:1px solid var(--line-2,#D8CBB8);border-radius:var(--radius);
  box-shadow:0 12px 30px rgba(7,48,52,.18);padding:6px;display:flex;flex-direction:column;
  font-size:var(--fs-2)}
.gfil-i{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:var(--fs-2);font-weight:700;color:var(--ink-2);
  padding:7px 9px;border-radius:var(--radius-sm)}
.gfil-i:hover{background:var(--surface-warm)}
.gfil-i.on{color:var(--brand-teal-txt);background:#EAF4F1}
.gfil-sep{height:1px;background:var(--line);margin:5px 2px}
.gfil-busca{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:var(--radius-sm);
  font-family:var(--sans);font-size:var(--fs-2);margin:2px 0 6px}
.gfil-topo{display:flex;align-items:center;gap:8px;padding:0 9px 6px;font-size:var(--fs-1);color:var(--muted)}
.gfil-topo button{border:0;background:none;padding:0;cursor:pointer;font-family:var(--sans);
  font-size:var(--fs-1);font-weight:800;color:var(--brand-teal-txt);text-decoration:underline}
.gfil-cnt{margin-left:auto;white-space:nowrap}
.gfil-lista{overflow:auto;min-height:40px}
.gfil-lista label{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:var(--radius-sm);cursor:pointer}
.gfil-lista label:hover{background:var(--surface-warm)}
.gfil-lista input{flex:none;accent-color:var(--brand-teal);margin:0}
.gfil-lista .r{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
/* `gfil-b` e não `vazio`: a página já tem um `.vazio` (o estado "nenhum cliente
   com esses filtros") com `padding:40px` e `text-align:center`, e um `.r.vazio`
   herdava os dois — a linha "(em branco)" saía centralizada e com quatro dedos
   de espaço em volta. É a mesma armadilha que o b4u-modal.js resolve com o
   prefixo `b4m-`: nome curto e genérico em folha compartilhada sempre encontra
   um homônimo. */
.gfil-lista .r.gfil-b{font-style:italic;color:var(--muted)}
.gfil-lista .n{flex:none;color:var(--muted);font-size:var(--fs-1);font-weight:700}
.gfil-vazio{padding:10px;color:var(--muted);font-size:var(--fs-1);text-align:center}
.gfil-pe{border-top:1px solid var(--line);margin-top:5px;padding-top:5px}

/* ---------- os filtros ativos, por extenso ----------
   O funil resolve para quem está OLHANDO aquela coluna. Esta linha resolve para
   quem não está: com trinta colunas e rolagem lateral, o funil aceso pode estar
   fora da tela — e no modo Fichas não existe cabeçalho nenhum. Sem ela, "122
   clientes" virando "9" não teria explicação à vista. */

.b4u-trunc{text-decoration:underline dotted var(--amber,#E8892E);text-underline-offset:2px;cursor:help}
.b4u-trunc-m{color:var(--amber-txt,#8A5A10);font-size:.85em;margin-left:3px;vertical-align:1px}
/* Só para leitor de tela: o ⚠ é aria-hidden, e sem isto quem não vê a tela não
   ficaria sabendo que o número está incompleto. */
.b4u-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* O mesmo aviso por extenso, dentro da ficha. Na lista cabe um ⚠; aqui, com o
   campo à vista e espaço para uma linha, cabe dizer o que aconteceu e o que
   fazer — que é o único jeito de o dado ser corrigido na origem. */
.fld-aviso{display:block;margin-top:4px;font-size:var(--fs-1,11px);line-height:1.35;
  color:var(--amber-txt,#8A5A10);font-weight:600}
</style>
<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a
   célula tem ponto e barra, o Sheets desiste e guarda texto.
   Onde não existe máscara canônica (telefone, inscrição), o valor vai como foi
   digitado: o conserto ali depende do patch do backend. */
function b4uParaPlanilha(valor,coluna){
  const s=b4uTexto(valor).trim();
  const t=b4uIdent(coluna);
  if(!s||!t||!/^\d+$/.test(s))return s;
  const d=b4uDigitos(s);
  if((t.tipo==='doc'||t.tipo==='cnpj')&&d.length===14)return b4uFmtDoc(d);
  if((t.tipo==='doc'||t.tipo==='cpf')&&d.length===11)return b4uFmtDoc(d);
  if(t.tipo==='cep'&&d.length===8)return b4uFmtCep(d);
  return s;
}
/* B4U-TEXTO:FIM */
</script>
