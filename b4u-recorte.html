         regra que não está em lugar nenhum da tela. Um filtro que a pessoa não
         consegue ver é um filtro que ela não consegue desfazer. */
      Array.from(F_COL.keys()).forEach(c => { if (VIS.indexOf(c) < 0) F_COL.delete(c); });
      if (ORD.col && VIS.indexOf(ORD.col) < 0) ORD = { col:'', dir:'' };
      fecharFiltro();
      desenhar();
    }
  });
  alvo.appendChild(f.no);
}

/* ---------------- o funil ----------------
   Uma função, e ela é a ÚNICA que decide quem aparece. Filtro escrito duas vezes
   (uma para as fichas, outra para a grade) é a discordância mais comum deste
   tipo de tela: o contador diz 12 e a planilha mostra 14. */
function filtradas(){
  const termo = normTxt(BUSCA), dig = soDigitos(BUSCA);
  let out = LINHAS.filter(l=>{
    if (termo || dig) {
      /* A busca varre a identificação e as colunas VISÍVEIS — nunca as
         sigilosas: procurar por um pedaço de senha e receber o cliente certo é
         um jeito de descobrir a senha sem nunca vê-la. */
      const alvo = IDENT.concat(VIS).filter(c=>!SIGILOSA.has(normCol(c)))
        .map(c=>l.valores[c]||'').join(' ') + ' ' + l.id + ' ' + (l.nome_cliente||'');
      const casa = (termo && normTxt(alvo).includes(termo)) ||
                   (dig && dig.length>=3 && soDigitos(alvo).includes(dig));
      if (!casa) return false;
    }
    for (const [col, passam] of F_COL) {
      if (VIS.indexOf(col) < 0) continue;            // coluna escondida não filtra (e o mapa já foi limpo)
      /* A CÉLULA VAZIA É UM VALOR, não uma exceção. No painel ela aparece como
         "(em branco)" e se marca e desmarca como qualquer outro — que é como o
         Sheets faz, e é o que permite pedir "só os que faltam preencher" sem
         inventar um filtro especial para isso. A versão anterior deixava a
         vazia passar por todo filtro, e com isso "Regime: Simples" trazia junto
         os trinta clientes sem regime nenhum. */
      if (!passam.has(String(l.valores[col]==null?'':l.valores[col]).trim())) return false;
    }
    return true;
  });

  /* A ORDENAÇÃO É DA TELA, nunca da planilha. Ninguém reordena 122 linhas de uma
     aba que outras seis rotas leem por posição — e o `row` de cada linha
     continua sendo o da planilha, que é por onde a gravação acha o cliente. */
  if (ORD.col && VIS.indexOf(ORD.col) > -1) {
    const c = ORD.col, sinal = (ORD.dir === 'desc' ? -1 : 1);
    out = out.slice().sort((a, b) => {
      const x = String(a.valores[c]==null?'':a.valores[c]).trim();
      const y = String(b.valores[c]==null?'':b.valores[c]).trim();
      /* VAZIO VAI PARA O FIM NOS DOIS SENTIDOS. Invertendo a ordem, quem pediu
         "os maiores primeiro" receberia uma tela de células em branco — e
         concluiria, de novo, que o painel perdeu o dado. */
      if (!x && !y) return 0;
      if (!x) return 1;
      if (!y) return -1;
      return sinal * cmpVal(x, y);
    });
  }
  return out;
}

/* Compara duas células. Número com número compara como número (senão "10" vem
   antes de "9"); o resto vai no localeCompare pt-BR, que é o que põe "Ângela"
   ao lado de "Angela" em vez de no fim do alfabeto. */
function cmpVal(x, y){
  const nx = Number(String(x).replace(/\./g,'').replace(',','.'));
  const ny = Number(String(y).replace(/\./g,'').replace(',','.'));
  if (isFinite(nx) && isFinite(ny) && /\d/.test(x) && /\d/.test(y) &&
      !/[a-zA-Z]/.test(x) && !/[a-zA-Z]/.test(y)) return nx - ny;
  return String(x).localeCompare(String(y), 'pt-BR', { sensitivity:'base', numeric:true });
}

/* ══════════════════════════════════════════════════════════════════════════
   O FUNIL DA COLUNA — filtrar e ordenar de dentro do cabeçalho

   Antes isto era uma fileira de fichinhas na régua, limitada a seis colunas e
   montada a partir das OPÇÕES DE VALIDAÇÃO da planilha. Duas coisas erradas de
   uma vez: a pessoa tinha de casar o rótulo do botão com o nome da coluna do
   outro lado da tela, e a lista oferecia valores que ninguém usa enquanto
   escondia os que estão lá e não passaram por validação nenhuma.

   Agora a lista sai do QUE ESTÁ NA COLUNA — valor por valor, com a contagem de
   linhas de cada um, como no Sheets. É a diferença entre "o que era para ter" e
   "o que tem", e numa tela de conferência quem manda é a segunda.
   ══════════════════════════════════════════════════════════════════════════ */

/* Os valores distintos de uma coluna, com quantas linhas têm cada um.
   Sobre TODAS as linhas, não sobre as filtradas: uma lista que encolhe conforme
   se filtra é uma lista da qual não dá para voltar — desmarcou demais, o valor
   some do painel e não há como remarcá-lo. */
function valoresDaColuna(col){
  const conta = new Map();
  LINHAS.forEach(l => {
    const v = String(l.valores[col]==null ? '' : l.valores[col]).trim();
    conta.set(v, (conta.get(v)||0) + 1);
  });
  /* "(em branco)" PRIMEIRO, e não no fim do alfabeto. Ele é a opção mais pedida
     desta lista — "quais faltam preencher?" é a pergunta que traz alguém a esta
     tela —, e no fim de uma lista de trezentos valores ela exigia rolar até o
     fundo para ser achada. Na ORDENAÇÃO da tabela o vazio continua indo para o
     fim: lá ele é ausência de dado, aqui é uma escolha. */
  return Array.from(conta.keys())
    .sort((a,b)=>{ if(!a) return -1; if(!b) return 1; return cmpVal(a,b); })
    .map(v => ({ v: v, n: conta.get(v) }));
}

const FUNIL_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 2.6h12.8L9.4 8.7v4.7L6.6 11.6V8.7z"/></svg>';

let FIL = null;   // { col, no }  — o painel aberto, se houver

function fecharFiltro(){
  if (!FIL) return;
  FIL.no.remove();
  document.querySelectorAll('.th-f[aria-expanded="true"], .chip .abrir[aria-expanded="true"]')
    .forEach(b => b.setAttribute('aria-expanded','false'));
  FIL = null;
}

function abrirFiltro(col, ancora){
  const jaEra = FIL && FIL.col === col;
  fecharFiltro();
  if (jaEra) return;                      // clicar de novo no mesmo funil FECHA

  const vals = valoresDaColuna(col);
  /* Lê o estado NA HORA, e não uma cópia feita ao abrir. A versão anterior
     capturava o `Set` na abertura, e como cada clique redesenha a lista, o
     redesenho remarcava a caixa que a pessoa acabara de desmarcar — o filtro
     entrava na tabela e o painel dizia que não. */
  const marcado = v => { const p = F_COL.get(col); return !p || p.has(v); };

  const no = document.createElement('div');
  no.className = 'gfil';
  no.setAttribute('role','dialog');
  no.setAttribute('aria-label','Filtrar e ordenar por ' + col);
  no.innerHTML =
    '<button type="button" class="gfil-i' + (ORD.col===col && ORD.dir==='asc' ?' on':'') + '" data-ord="asc">Classificar A → Z</button>' +
    '<button type="button" class="gfil-i' + (ORD.col===col && ORD.dir==='desc'?' on':'') + '" data-ord="desc">Classificar Z → A</button>' +
    '<div class="gfil-sep"></div>' +
    /* O mesmo que o arrasto faz, para quem não arrasta. Desabilitado nas pontas
       em vez de escondido: some­ndo, o painel da primeira coluna teria um item a
       menos que o das outras e os itens dançariam de lugar a cada abertura. */
    '<button type="button" class="gfil-i" data-mover="-1"' + (VIS.indexOf(col) <= 0 ? ' disabled style="opacity:.4;cursor:default"' : '') + '>← Mover para a esquerda</button>' +
    '<button type="button" class="gfil-i" data-mover="1"'  + (VIS.indexOf(col) >= VIS.length-1 ? ' disabled style="opacity:.4;cursor:default"' : '') + '>Mover para a direita →</button>' +
    '<div class="gfil-sep"></div>' +
    '<input class="gfil-busca" type="search" placeholder="Buscar nesta coluna…" autocomplete="off">' +
    '<div class="gfil-topo"><button type="button" data-todos>Selecionar tudo</button>' +
      '<button type="button" data-nada>Limpar</button>' +
      '<span class="gfil-cnt"></span></div>' +
    '<div class="gfil-lista"></div>' +
    '<div class="gfil-pe"><button type="button" class="gfil-i" data-tirar>Tirar o filtro desta coluna</button></div>';

  const lista = no.querySelector('.gfil-lista');
  const cnt   = no.querySelector('.gfil-cnt');
  const busca = no.querySelector('.gfil-busca');

  function desenharLista(){
    const t = normTxt(busca.value);
    /* A BUSCA ESCONDE, NÃO DESMARCA. Quem digita "simples" e clica em "Limpar"
       está pedindo para limpar o que está VENDO — mas o que não está à vista
       continua valendo, e é por isso que `visiveis()` existe e os dois botões
       do topo operam só sobre ela. Limpar os trezentos escondidos junto seria
       apagar uma escolha que a pessoa não viu acontecer. */
    const its = vals.filter(o => !t || normTxt(o.v || 'em branco').includes(t));
    lista.innerHTML = its.length ? its.map(o =>
      '<label><input type="checkbox" data-v="' + esc(o.v) + '"' + (marcado(o.v)?' checked':'') + '>' +
      '<span class="r' + (o.v?'':' gfil-b') + '">' + (o.v ? esc(o.v) : '(em branco)') + '</span>' +
      '<span class="n">' + o.n + '</span></label>').join('')
      : '<div class="gfil-vazio">Nenhum valor com esse texto.</div>';
    const n = vals.filter(o => marcado(o.v)).length;
    cnt.textContent = n + ' de ' + vals.length;
  }
  function visiveis(){ return Array.from(lista.querySelectorAll('input[data-v]')).map(i => i.dataset.v); }

  /* Grava a escolha. TUDO MARCADO = SEM FILTRO: a chave sai do mapa, o funil
     apaga e o chip some. Guardar um Set com todos os valores "daria no mesmo"
     hoje e mentiria amanhã — no dia em que um cliente novo trouxer um valor que
     não estava na lista, ele seria filtrado para fora por uma escolha que
     ninguém fez. */
  function aplicar(){
    const vis = new Set(visiveis());
    const marcadosVis = new Set(Array.from(lista.querySelectorAll('input[data-v]:checked')).map(i => i.dataset.v));
    const antes = F_COL.get(col);
    const novo = new Set();
    vals.forEach(o => {
      /* Valor À VISTA: manda o checkbox. Valor que a BUSCA ESCONDEU: fica como
         estava — e "como estava", quando ainda não havia filtro, é passando.
         Sem esta última linha, digitar "A1" e desmarcar um item apagaria em
         silêncio todos os outros valores da coluna. */
      if (vis.has(o.v)) { if (marcadosVis.has(o.v)) novo.add(o.v); }
      else if (!antes || antes.has(o.v)) novo.add(o.v);
    });
    if (novo.size >= vals.length) F_COL.delete(col); else F_COL.set(col, novo);
    desenhar();
  }

  no.addEventListener('change', e => {
    if (e.target.matches('input[data-v]')) { aplicar(); desenharLista(); }
  });
  busca.addEventListener('input', desenharLista);
  no.addEventListener('click', e => {
    const bt = e.target.closest('button'); if (!bt) return;
    if (bt.dataset.ord)   { ORD = (ORD.col===col && ORD.dir===bt.dataset.ord) ? {col:'',dir:''} : {col:col, dir:bt.dataset.ord}; fecharFiltro(); desenhar(); return; }
    if (bt.dataset.mover) { passoColuna(col, Number(bt.dataset.mover)); return; }
    if (bt.hasAttribute('data-todos')) { lista.querySelectorAll('input[data-v]').forEach(i => i.checked = true);  aplicar(); desenharLista(); return; }
    if (bt.hasAttribute('data-nada'))  { lista.querySelectorAll('input[data-v]').forEach(i => i.checked = false); aplicar(); desenharLista(); return; }
    if (bt.hasAttribute('data-tirar')) { F_COL.delete(col); fecharFiltro(); desenhar(); return; }
  });

  desenharLista();

  /* ENCAIXE — o painel NUNCA pode ficar com um pedaço fora da janela.
     A versão anterior colava ele sempre abaixo do cabeçalho e limitava a lista a
     "o que sobra até o rodapé". Numa tabela que começa no meio da página, ou num
     notebook baixo, "o que sobra" era negativo: o painel nascia com os botões do
     fim — inclusive "Tirar o filtro desta coluna" — abaixo da borda da tela, e
     não havia como clicar neles nem rolar até eles, porque ele é `fixed`.

     Agora ele é MEDIDO antes de ser posicionado (por isso entra invisível), e
     então decide: cabe abaixo, cabe acima, ou não cabe em nenhum dos dois e a
     LISTA encolhe até caber — nessa ordem. Os botões de cima e de baixo são o
     que menos pode sumir; a lista rola. */
  no.style.visibility = 'hidden';
  no.style.left = '0px';
  no.style.top  = '0px';
  document.body.appendChild(no);

  const r = ancora.getBoundingClientRect();
  const lista2 = no.querySelector('.gfil-lista');
  const MARGEM = 10;
  const abaixo = window.innerHeight - r.bottom - MARGEM;
  const acima  = r.top - MARGEM;

  let alt = no.offsetHeight;
  if (alt > abaixo && alt > acima) {
    /* Não cabe inteiro nem de um lado nem do outro: a lista cede o espaço. O
       piso de 90px é para ela não virar uma fresta de um item e meio. */
    const espaco = Math.max(abaixo, acima);
    const semLista = alt - lista2.offsetHeight;
    lista2.style.maxHeight = Math.max(90, espaco - semLista) + 'px';
    alt = no.offsetHeight;
  }
  const top = (alt <= abaixo || abaixo >= acima) ? (r.bottom + 2) : (r.top - alt - 2);
  no.style.top  = Math.round(Math.max(MARGEM, Math.min(top, window.innerHeight - alt - MARGEM))) + 'px';
  no.style.left = Math.round(Math.max(MARGEM,
    Math.min(r.left, window.innerWidth - no.offsetWidth - MARGEM))) + 'px';
  no.style.visibility = '';

  ancora.setAttribute('aria-expanded','true');
  FIL = { col: col, no: no, t: Date.now() };
  /* `preventScroll` — sem ele, dar foco ao campo de busca faz o navegador rolar
     o painel para dentro da vista, esse rolar dispara o `scroll` de captura logo
     abaixo, e o painel se fecha sozinho no mesmo gesto que o abriu. */
  busca.focus({ preventScroll: true });
}

/* Fechar: Esc, clique fora, e rolagem. Rolar é o caso que se esquece — o painel
   é `fixed` e a grade rola por baixo dele, então sem isto ele ficaria parado
   apontando para a coluna errada. */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && FIL) fecharFiltro(); });
document.addEventListener('mousedown', e => {
  if (!FIL) return;
  if (e.target.closest && (e.target.closest('.gfil') || e.target.closest('.th-f') || e.target.closest('.chip'))) return;
  fecharFiltro();
}, true);
window.addEventListener('scroll', e => {
  if (!FIL) return;
  /* DUAS EXCEÇÕES, e as duas custaram um painel que piscava e sumia:
     1. a rolagem DE DENTRO do painel é a pessoa correndo a lista de valores —
        fechar aí é fechar no meio do gesto de usar;
     2. os primeiros milésimos depois de abrir. Dar foco ao campo de busca faz o
        navegador rolar, e esse rolar chega aqui como se fosse a pessoa. */
  if (e.target && e.target.nodeType === 1 && e.target.closest && e.target.closest('.gfil')) return;
  if (Date.now() - FIL.t < 300) return;
  fecharFiltro();
}, true);

document.addEventListener('click', e => {
  const f = e.target.closest('.th-f, .chip .abrir');
  if (f && f.dataset.fcol) { e.preventDefault(); abrirFiltro(f.dataset.fcol, f); return; }
  const x = e.target.closest('.chip .x');
  if (x) { if (x.dataset.fcol) F_COL.delete(x.dataset.fcol); else ORD = {col:'',dir:''}; fecharFiltro(); desenhar(); return; }
  const t = e.target.closest('.chips .tudo');
  if (t) { F_COL.clear(); ORD = {col:'',dir:''}; fecharFiltro(); desenhar(); return; }
  const rst = e.target.closest('.chips .restaurar');
  if (rst) restaurarLayout();
});

/* ══════════════════════════════════════════════════════════════════════════
   REDIMENSIONAR E REORDENAR — a visualização é de cada um

   Três gestos no mesmo cabeçalho, e o que os separa é ONDE se pega:
     o rótulo (texto)      arrasta a coluna para outro lugar
     a faixa de 7px        muda a largura
     o funil               filtra e ordena
   Sem essa divisão, tentar filtrar arrastaria a coluna sem querer — que é o
   defeito clássico de cabeçalho que faz tudo.

   Nada disto toca a planilha. Largura, altura e ordem são de quem está olhando,
   e quem olha a mesma tela ao lado continua vendo a dele.
   ══════════════════════════════════════════════════════════════════════════ */

let REDIM = null;

/* Pointer Events, e não mousedown/mousemove: o mesmo código atende dedo e
   caneta, e o `setPointerCapture` mantém o arrasto vivo quando o cursor sai da
   alça — que acontece sempre, porque arrastar rápido deixa o ponteiro na frente
   do elemento que está sendo redimensionado. */
document.addEventListener('pointerdown', e => {
  const c = e.target.closest && e.target.closest('.col-h');
  const r = e.target.closest && e.target.closest('.row-h');
  if (!c && !r) return;
  e.preventDefault();
  fecharFiltro();
  const tab = (c || r).closest('table.grade');
  if (c) {
    const col = c.dataset.larg;
    REDIM = { tipo:'col', col: col, x0: e.clientX, w0: largDe(col),
              alvo: tab.querySelector('col[data-col="' + (window.CSS && CSS.escape ? CSS.escape(col) : col) + '"]') };
    document.body.classList.add('redim');
  } else {
    REDIM = { tipo:'lin', y0: e.clientY, h0: ALT, tab: tab };
    document.body.classList.add('redim-v');
  }
  try { (c||r).setPointerCapture(e.pointerId); } catch(_) {}
});

document.addEventListener('pointermove', e => {
  if (!REDIM) return;
  if (REDIM.tipo === 'col') {
    /* 48px de piso: uma coluna de 0px some da tela e leva junto a alça de
       arrastar — não haveria como trazê-la de volta a não ser restaurando tudo. */
    const w = Math.max(48, Math.round(REDIM.w0 + (e.clientX - REDIM.x0)));
    LARG[REDIM.col] = w;
    if (REDIM.alvo) REDIM.alvo.style.width = w + 'px';
  } else {
    const h = Math.max(28, Math.min(220, Math.round(REDIM.h0 + (e.clientY - REDIM.y0))));
    ALT = h;
    if (REDIM.tab) { REDIM.tab.style.setProperty('--lh', h + 'px'); REDIM.tab.classList.toggle('alto', h >= 46); }
  }
});

document.addEventListener('pointerup', () => {
  if (!REDIM) return;
  const eraLinha = REDIM.tipo === 'lin';
  REDIM = null;
  document.body.classList.remove('redim', 'redim-v');
  salvarLayout();
  /* Só agora a tela é redesenhada, e só quando foi ALTURA — a quebra de linha
     muda o que cabe em cada célula. Redesenhar durante o arrasto seria montar
     uma tabela nova por quadro; redesenhar depois de mudar largura não é
     preciso, porque a largura já está no <col>. */
  if (eraLinha) desenhar(); else pintarChips();
});

/* ---------------- mudar a coluna de lugar ----------------
   Arrastar e soltar do próprio navegador (`draggable`), e não um arrasto feito
   à mão com pointer: o navegador já resolve o gesto de largar, o cancelar com
   Esc e o comportamento no toque, e a marca de destino é a única coisa que
   falta desenhar. */
let ARRASTA = null;

function limparAlvos(){
  document.querySelectorAll('th.alvo-e, th.alvo-d').forEach(t => t.classList.remove('alvo-e','alvo-d'));
}

document.addEventListener('dragstart', e => {
  const r = e.target.closest && e.target.closest('.th-rot');
  if (!r || !r.dataset.col) return;
  ARRASTA = r.dataset.col;
  fecharFiltro();
  try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ARRASTA); } catch(_) {}
  const th = r.closest('th'); if (th) th.classList.add('arrastando');
});

document.addEventListener('dragover', e => {
  if (!ARRASTA) return;
  const th = e.target.closest && e.target.closest('th[data-col]');
  if (!th || th.dataset.col === ARRASTA) return;
  e.preventDefault();                       // sem isto o navegador recusa a soltura
  try { e.dataTransfer.dropEffect = 'move'; } catch(_) {}
  limparAlvos();
  const r = th.getBoundingClientRect();
  /* Metade esquerda = entra ANTES desta coluna; metade direita = depois. É o que
     torna possível levar uma coluna para o fim da tabela. */
  th.classList.add(e.clientX < r.left + r.width / 2 ? 'alvo-e' : 'alvo-d');
});

document.addEventListener('drop', e => {
  if (!ARRASTA) return;
  const th = e.target.closest && e.target.closest('th[data-col]');
  if (!th || th.dataset.col === ARRASTA) return;
  e.preventDefault();
  const r = th.getBoundingClientRect();
  moverColuna(ARRASTA, th.dataset.col, e.clientX < r.left + r.width / 2);
});

document.addEventListener('dragend', () => {
  ARRASTA = null;
  limparAlvos();
  document.querySelectorAll('th.arrastando').forEach(t => t.classList.remove('arrastando'));
});

/** Tira `col` de onde está e põe antes (ou depois) de `destino`.
 *  A remoção acontece ANTES de procurar o destino, senão o índice do destino
 *  estaria deslocado de um sempre que a coluna vinha da esquerda dele. */
function moverColuna(col, destino, antes){
  const i = VIS.indexOf(col);
  if (i < 0 || col === destino) return;
  VIS.splice(i, 1);
  const j = VIS.indexOf(destino);
  if (j < 0) { VIS.splice(i, 0, col); return; }   // destino sumiu no meio do gesto: desfaz
  VIS.splice(antes ? j : j + 1, 0, col);
  salvarVis();
  fecharFiltro();
  desenhar();
}

/** Um passo para a esquerda ou para a direita. É o caminho de TECLADO para a
 *  mesma coisa: quem não usa mouse não arrasta, e sem isto reordenar seria um
 *  recurso só para quem tem as duas mãos livres. Mora no painel do funil. */
function passoColuna(col, passo){
  const i = VIS.indexOf(col), j = i + passo;
  if (i < 0 || j < 0 || j >= VIS.length) return;
  VIS.splice(j, 0, VIS.splice(i, 1)[0]);
  salvarVis();
  fecharFiltro();
  desenhar();
}

/* ---------------- os filtros ativos, por extenso ----------------
   Vale nos DOIS modos, e é o único sinal no modo Fichas — que não tem cabeçalho
   onde acender funil nenhum. */
function pintarChips(){
  const alvo = document.getElementById('chips');
  const its = [];
  if (ORD.col) its.push('<span class="chip ord"><span>Ordenado por ' + esc(ORD.col) +
    ' ' + (ORD.dir==='desc'?'↓':'↑') + '</span><button class="x" title="Tirar a ordenação" aria-label="Tirar a ordenação">×</button></span>');
  F_COL.forEach((passam, col) => {
    if (VIS.indexOf(col) < 0) return;
    const total = valoresDaColuna(col).length;
    its.push('<span class="chip">' +
      '<button class="abrir" data-fcol="' + esc(col) + '" aria-expanded="false" aria-haspopup="dialog" ' +
        'title="Abrir o filtro de ' + esc(col) + '">' + esc(col) + ': ' + passam.size + ' de ' + total + '</button>' +
      '<button class="x" data-fcol="' + esc(col) + '" title="Tirar este filtro" aria-label="Tirar o filtro de ' + esc(col) + '">×</button></span>');
  });
  if (its.length > 1) its.push('<button type="button" class="tudo">limpar tudo</button>');
  /* Largura, altura e ordem não são FILTRO — não escondem linha nenhuma —, mas
     é aqui que a pessoa procura "o que eu mexi nesta tela". O rótulo diz o que
     ele desfaz, para ninguém clicar achando que limpa os filtros. */
  if (layoutTocado())
    its.push('<button type="button" class="restaurar" title="Volta a largura, a altura e a ordem das colunas ao padrão. Não mexe nos filtros.">↺ restaurar largura e ordem</button>');
  alvo.innerHTML = its.join('');
}

/* ══════════════════════════════════════════════════════════════════════════
   2) MOSTRAR EM MODAL — a ficha de um cliente
   A moldura (véu, Esc, foco preso, aviso de "tem coisa por gravar") é do
   b4u-modal.js. Daqui para dentro é só o CONTEÚDO — e é essa fronteira que
   impede aquele arquivo de virar um catálogo de exceções.

   Usa `criar()`, e não `adotar()`: as sete fichas do painel foram adotadas
   porque já tinham o <div class="modal"> escrito à mão e dezenas de ids
   apontando para dentro dele. Esta nasce agora, sem id nenhum para preservar —
   é exatamente o caso para o qual o `criar()` foi escrito e nunca usado.
   ══════════════════════════════════════════════════════════════════════════ */
let FICHA = null;
async function abrirFicha(id){
  const l = LINHAS.find(x=>x.id===id);
  if (!l || !window.B4UModal) return;

  /* A ficha se organiza pela ÁRVORE (categoria › subcategoria da aba
     "Variáveis"), e não mais pelas seções do recorte. Duas razões:

     1. É a mesma divisão que a pessoa usou para ESCOLHER as colunas no
        construtor. Escolher por "Departamento pessoal › Folha e benefícios" e
        reencontrar tudo espalhado em "Outras colunas (leitura)" é a tela
        contradizendo o caminho que a própria pessoa acabou de fazer.
     2. Visualização montada do zero não tem seção nenhuma do catálogo — todas
        as colunas caíam num bloco só chamado "Outras colunas", que não
        organiza nada.

     O QUE A SEÇÃO EXPLICAVA E A CATEGORIA NÃO EXPLICA é a permissão de
     gravação: a fronteira do porteiro é a seção, não a categoria. Por isso o
     aviso de "você não edita" desceu para o nível do BLOCO calculado campo a
     campo (`editavel`), em vez de vir declarado pela seção — e o cadeado de
     cada rótulo continua onde estava.

     Se a árvore não vier (rota fora do ar, aba "Variáveis" ainda não semeada),
     a ficha volta a se organizar pelas seções. Ficha que não abre é pior do que
     ficha organizada do jeito antigo. */
  let ARVF = null;
  try { ARVF = (await arvoreVariaveis()).arvore; } catch (_) { ARVF = null; }

  const cabeca = IDENT.map(c=>
    '<div class="mfld"><span class="lbl">'+esc(c)+'</span>'+
    campoHTML(id,c,l.valores[c],'in')+'</div>').join('');

  /* UM BLOCO POR SEÇÃO, na ordem em que o recorte as declarou. Não é divisória
     de layout: é a mesma fronteira que decide o porteiro e a porta de gravação,
     e mostrá-la é o que explica por que metade dos campos está travada e a
     outra metade não.

     Dentro de cada bloco, as colunas do recorte na ordem declarada, respeitando
     a escolha da pessoa em "Colunas". A ficha mostra o que ela escolheu ver — e
     não "tudo, porque aqui cabe": duas telas com listas diferentes para o mesmo
     recorte é o começo de a pessoa não confiar em nenhuma das duas. */
  const campo = c =>
    '<div class="mfld'+(ehLonga(c)?' full':'')+'">'+
      '<span class="lbl">'+esc(c)+(editavel(c)?'':' <span class="lock" title="Só leitura">🔒</span>')+'</span>'+
      campoHTML(id,c,l.valores[c],'in')+
    '</div>';

  /* O aviso vive na FAIXA, dito uma vez — e não repetido em vinte e um
     cadeados, um por campo. O cadeado do rótulo continua lá para quem chegar
     direto num campo, mas quem explica é isto aqui. */
  const banda = (titulo, sub, cols, total) =>
    '<div class="banda">'+
      '<span class="t">'+esc(titulo)+'</span>'+
      '<span class="s">'+esc(sub||'')+'</span>'+
      (cols.some(editavel) ? '' : '<span class="aviso">você não edita este bloco</span>')+
      '<span class="s" style="flex:0 0 auto">'+cols.length+(total?' de '+total:'')+'</span>'+
    '</div>'+
    '<div class="msec"><div class="msec-campos">'+cols.map(campo).join('')+'</div></div>';

  let blocos = '';
  if (ARVF) {
    const usados = new Set();
    ARVF.forEach(cat => cat.subs.forEach(sub => {
      const dentro = new Set(sub.colunas.map(x => normCol(x.coluna)));
      const cols = VIS.filter(c => dentro.has(normCol(c)));
      if (!cols.length) return;
      cols.forEach(c => usados.add(normCol(c)));
      const titulo = (sub.subcategoria && sub.subcategoria !== '—' && sub.subcategoria !== cat.categoria)
        ? cat.categoria + ' › ' + sub.subcategoria : cat.categoria;
      blocos += banda(titulo, '', cols, sub.colunas.length);
    }));
    /* Coluna que a árvore não conhece ainda existe na tela: criada na planilha
       hoje de manhã e ainda não catalogada. Ela não pode sumir da ficha por
       causa disso — some do lugar certo, não da tela. */
    const sobra = VIS.filter(c => !usados.has(normCol(c)));
    if (sobra.length) blocos += banda('Ainda sem categoria', 'rode "recatalogar" para dar categoria e tipo a estas', sobra);
  } else {
    blocos = SECOES.map(sec=>{
      const cols = VIS.filter(c=>{ const x=secaoDe(c); return x && x.id===sec.id; });
      if (!cols.length) return '';
      return banda(sec.rotulo, sec.sobre||'', cols, (sec.colunas||[]).length);
    }).join('');
  }

  const html =
    '<div class="msec"><div class="msec-tit">Identificação<span class="n">só leitura</span></div>'+
      '<div class="msec-campos">'+cabeca+'</div></div>'+
    (blocos || '<div class="dica">Nenhuma coluna marcada em <b>Colunas</b>.</div>')+
    (l.drive ? '<div class="dica" style="margin-top:10px"><a href="'+esc(l.drive)+'" rel="noopener">Pasta do cliente no Drive ↗</a></div>' : '');

  if (!FICHA) {
    FICHA = B4UModal.criar({
      id:'modalRec', largura:'880px', status:true,
      avisoSujo:'Ainda não gravei o que você mudou. Espere um instante — ou clique de novo em Fechar para sair assim mesmo.',
      acoes:[{id:'recFechar', rot:'Fechar', tipo:'sec'}],
      /* `sujo` é sobre a TELA (é ele que liga o beforeunload). A ficha grava
         sozinha, então fechá-la não perde nada que já não esteja em voo — por
         isso não há `perdeAoFechar` separado aqui. */
      sujo: ()=> SUJOS.size>0
    });
  }
  FICHA.titulo(l.nome_cliente || id);
  FICHA.selo(id);
  /* `corpo()` é GETTER — devolve o nó, não o preenche. A casca é dona da
     moldura e nunca do conteúdo (é a regra 2 do b4u-modal.js), então quem
     escreve aqui dentro é esta página. */
  FICHA.corpo().innerHTML = html;
  FICHA.abrir();
}

/* ══════════════════════════════════════════════════════════════════════════
   3) MOSTRAR EM PLANILHA FILTRÁVEL
   ══════════════════════════════════════════════════════════════════════════ */
/* A barra é repintada junto com a tela porque o "alterado" nasce de mexer em
   coluna, filtro ou ordenação — as três coisas que mandam redesenhar. */
function desenharGrade(){
  const linhas = filtradas();
  /* O CABEÇALHO DE CADA COLUNA passa a ser um controle: rótulo, seta de
     ordenação e funil. O funil fica visível sempre (fraco), e não só no hover:
     um botão que só aparece quando o mouse passa por cima é um botão que quem
     não sabe que ele existe nunca descobre — e no toque não existe hover. */
  /* O <colgroup> é quem manda na largura com `table-layout:fixed`. Uma tag só
     por coluna, e o arrasto mexe no `style.width` dela — sem redesenhar a
     tabela inteira a cada pixel, que com 122 linhas × 31 colunas seria uma
     tabela nova por quadro de animação. */
  const cg = '<colgroup>' +
    '<col data-col="__id" style="width:'+largDe('__id')+'px">' +
    '<col data-col="__nome" style="width:'+largDe('__nome')+'px">' +
    VIS.map(c=>'<col data-col="'+esc(c)+'" style="width:'+largDe(c)+'px">').join('') +
    '</colgroup>';

  const alcaC = c => '<span class="col-h" data-larg="'+esc(c)+'" title="Arraste para mudar a largura"></span>';

  const th = '<th class="fix1">ID'+alcaC('__id')+'</th>' +
             '<th class="fix2">Cliente'+alcaC('__nome')+'</th>' +
    VIS.map(c=>{
      const filtrada = F_COL.has(c);
      const seta = (ORD.col===c) ? '<span class="th-ord" aria-hidden="true">'+(ORD.dir==='desc'?'↓':'↑')+'</span>' : '';
      return '<th data-col="'+esc(c)+'"'+(filtrada?' class="filtrado"':'')+'>'+
        '<div class="th-in">'+
          '<span class="th-rot" draggable="true" data-col="'+esc(c)+'" '+
            'title="Arraste para mudar a coluna de lugar">'+esc(c)+'</span>'+ seta +
          '<button type="button" class="th-f'+(filtrada?' on':'')+'" data-fcol="'+esc(c)+'" '+
            'aria-haspopup="dialog" aria-expanded="false" '+
            'title="'+(filtrada?'Filtro ativo — clique para mudar':'Filtrar e ordenar')+'" '+
            'aria-label="'+(filtrada?'Filtro ativo em ':'Filtrar e ordenar ')+esc(c)+'">'+FUNIL_SVG+'</button>'+
        '</div>'+ alcaC(c) +'</th>';
    }).join('');
  /* A alça de ALTURA mora na coluna de ID: é a única sempre visível (fixa à
     esquerda), então dá para puxar a altura com a tabela rolada para qualquer
     lado. Ela muda a altura de TODAS as linhas, e não da linha puxada — altura
     por linha numa tela de conferência não serve para nada, e o que se quer ao
     aumentar é ler a observação inteira sem abrir a ficha. O title diz isso. */
  const tr = linhas.map(l=>
    '<tr>'+
      '<td class="fix1"><button class="bt" data-abrir="'+esc(l.id)+'" type="button" '+
        'title="Abrir a ficha deste cliente">'+esc(l.id)+'</button>'+
        '<span class="row-h" title="Arraste para mudar a altura de todas as linhas"></span></td>'+
      '<td class="fix2">'+esc(l.nome_cliente||'')+'<span data-selo="'+esc(l.id)+'"></span></td>'+
      VIS.map(c=>'<td>'+campoHTML(l.id,c,l.valores[c],'cel-in')+'</td>').join('')+
    '</tr>').join('');
  document.getElementById('conteudo').innerHTML = linhas.length
    ? '<div class="grade-wrap"><table class="grade'+(ALT >= 46 ? ' alto' : '')+'" style="--lh:'+ALT+'px">'+
      cg+'<thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div>'
    : '<div class="vazio">Nenhum cliente com esses filtros.</div>';
  linhas.forEach(l=>pintarSelo(l.id));
}

/* O que o CARTÃO mostra de um valor. Não é o valor cru: uma URL de 120
   caracteres empurra as outras duas colunas para fora da linha e não diz nada
   além de "tem" — que é justamente o que interessa saber de longe. Data sai em
   dd/mm/aaaa. A senha SAI, inteira: é o cartão que a pessoa abre para copiar
   a credencial e entrar no portal do cliente. */
function resumoValor(col, v){
  const t = String(v==null?'':v).trim();
  if (!t) return '—';
  if (LINK.has(normCol(col)))     return 'tem';
  if (DATA.has(normCol(col)))     return fmtBR(t);
  return t.length > 42 ? t.slice(0,40) + '…' : t;
}

function desenharFichas(){
  const linhas = filtradas();
  /* O cartão mostra as TRÊS primeiras colunas visíveis e quantas faltam
     preencher. Três porque é o que cabe numa linha sem quebrar no celular, e
     porque o cartão é um ÍNDICE — quem quer o resto abre a ficha. */
  const amostra = VIS.slice(0,3);
  const html = linhas.map(l=>{
    const faltam = VIS.filter(c=>!String(l.valores[c]||'').trim()).length;
    const resumo = amostra.map(c=>
      '<span>'+esc(c)+': <b>'+esc(resumoValor(c, l.valores[c]))+'</b></span>').join('') +
      (faltam ? '<span class="falta">'+faltam+' em branco</span>' : '');
    return '<button class="cli" type="button" data-abrir="'+esc(l.id)+'">'+
      '<span class="l1"><span class="id">'+esc(l.id)+'</span>'+
      '<span class="nm">'+esc(l.nome_cliente||'(sem nome)')+'</span>'+
      '<span data-selo="'+esc(l.id)+'"></span></span>'+
      '<span class="resumo">'+resumo+'</span></button>';
  }).join('');
  document.getElementById('conteudo').innerHTML = html || '<div class="vazio">Nenhum cliente com esses filtros.</div>';
  linhas.forEach(l=>pintarSelo(l.id));
}

function desenhar(){
  (MODO==='grade' ? desenharGrade : desenharFichas)();
  pintarChips();
  /* A barra da visualização é repintada junto: o rótulo "alterado" nasce de
     mexer em coluna, filtro ou ordenação — as três coisas que já mandam
     redesenhar. Pendurá-lo aqui é o que faz ele aparecer e sumir sozinho, sem
     um ouvinte por controle. */
  if (typeof pintarVisBar === 'function') pintarVisBar();
  const n = filtradas().length;
  document.getElementById('cnt').textContent =
    n + (n===1?' cliente':' clientes') + (n!==LINHAS.length ? ' de '+LINHAS.length+' (filtrados)' : '') +
    ' · ' + VIS.length + '/' + DO_REC.length + ' colunas' +
    (SECOES.length > 1 ? ' em ' + SECOES.length + ' seções' : '');
}

/* Abrir a ficha: UM ouvinte, pelo `data-abrir`. Vale para o cartão e para o
   botão de ID da grade, sem que os dois precisem saber um do outro. */
document.addEventListener('click', e=>{
  const no = e.target.closest && e.target.closest('[data-abrir]');
  if (no) abrirFicha(no.getAttribute('data-abrir'));
});

/* ══════════════════════════════════════════════════════════════════════════
   CARGA
   ══════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════
   VISUALIZAÇÕES — salvar esta tela do jeito que ela está
   ══════════════════════════════════════════════════════════════════════════
   A pessoa JÁ escolhe colunas, filtra e ordena aqui. "Salvar como" só pega o
   estado vivo e dá um nome a ele — é o caminho mais curto entre "deixei do
   jeito que eu gosto" e "quero isso amanhã de novo". Nenhuma tela nova. */

/* O que uma visualização guarda, tirado do estado da tela neste instante. */
function estadoDaTela(herdar){
  /* O pré-filtro da tela de ORIGEM entra por padrão. Quem salva a partir da
     Equiparação está vendo 79 clientes e espera 79 amanhã; nascer com 122
     seria entregar outra coisa. `herdar=false` é o "quero desfiltrar" — a
     pergunta é feita uma vez, na hora de criar. */
  let herdado = (herdar === false) ? [] :
    ((REC && REC.filtro) ? (Array.isArray(REC.filtro) ? REC.filtro.slice() : [REC.filtro]) : []);
  /* A FRASE vai junto do filtro. Sem ela a legenda da visualização nova viraria
     «Produtos Back4you contém "equipar"» — mecanicamente correto e ilegível,
     com a palavra pela metade parecendo erro de digitação de alguém. */
  if (herdado.length && REC && REC.filtro_sobre && !REC.visualizacao) {
    herdado = herdado.map((f, i) => i === 0 ? Object.assign({}, f, { sobre: REC.filtro_sobre }) : f);
  }
  const filtro = herdado;
  /* Só filtro de valor único vira filtro salvo. Marcar 3 de 40 valores numa
     coluna é exploração, não regra — e salvar isso produziria uma visualização
     que ninguém consegue explicar seis meses depois. O servidor entende
     `igual`, `contem`, `diferente` e `preenchido`; a tela salva o `igual`. */
  F_COL.forEach((set, col) => { if (set && set.size === 1) {
    const v = Array.from(set)[0];
    filtro.push(v ? { coluna: col, igual: v } : { coluna: col, preenchido: false });
  }});
  return {
    colunas: VIS.slice(),
    filtro: filtro,
    ordem: ORD && ORD.col ? { coluna: ORD.col, direcao: ORD.dir || 'asc' } : null
  };
}

/* Igual ao que está salvo? Compara o que a visualização GUARDA — colunas,
   filtro e ordenação —, e não largura nem altura de linha: essas são conforto
   de cada aparelho e nunca viajaram. */
function telaAlterada(){
  const v = REC && REC.visualizacao;
  if (!v || !VIS_SALVA) return false;
  const a = estadoDaTela(), b = VIS_SALVA;   // a visualização já É o filtro dela: herda de si mesma
  return JSON.stringify([a.colunas, a.filtro, a.ordem]) !==
         JSON.stringify([b.colunas, b.filtro, b.ordem]);
}
let VIS_SALVA = null;   // o estado com que a visualização foi aberta

function pintarVisBar(){
  const no = document.getElementById('visbar');
  if (!no) return;
  const v = REC && REC.visualizacao;
  const b = [];
  if (v) {
    b.push('<span class="dono">' + (v.meu ? 'Sua visualização' : 'De ' + esc(v.dono)) +
           (v.publico ? ' · pública' : '') + '</span>');
    if (telaAlterada()) b.push('<span class="sujo">alterado</span>');
    if (v.meu) {
      b.push('<button class="vb forte" data-vis="salvar">Salvar</button>');
      b.push('<button class="vb" data-vis="renomear">Renomear</button>');
      b.push('<button class="vb" data-vis="publico">' +
             (v.publico ? 'Tornar particular' : 'Tornar pública') + '</button>');
      b.push('<button class="vb" data-vis="excluir">Excluir</button>');
    }
    b.push('<button class="vb" data-vis="duplicar">Duplicar</button>');
  } else {
    b.push('<button class="vb" data-vis="nova">＋ Salvar como visualização</button>');
  }
  /* FILTROS FIXOS aparece SEMPRE, inclusive em recorte do catálogo que não tem
     filtro nenhum — é onde a pessoa descobre que dá para pôr um. Escondê-lo
     quando não há filtro faria a funcionalidade existir só para quem já sabe
     que ela existe. */
  b.push('<button class="vb" data-vis="fixos">Filtros fixos' +
         (REC && REC.filtro && (Array.isArray(REC.filtro) ? REC.filtro.length : 1)
            ? ' <b>· ' + (Array.isArray(REC.filtro) ? REC.filtro.length : 1) + '</b>' : '') + '</button>');
  b.push('<button class="vb" data-vis="lista">Minhas visualizações</button>');
  /* Só reescreve quando MUDA. `pintarVisBar` roda a cada `desenhar()`, e
     `desenhar()` roda a cada tecla da busca, cada filtro, cada ordenação —
     reescrever o HTML ali destrói e recria os botões debaixo do cursor. O
     efeito para quem usa: o foco do teclado se perde, e um clique que começou
     antes do redesenho não termina em lugar nenhum. */
  const html = b.join('');
  if (no.__html !== html) { no.innerHTML = html; no.__html = html; }
  no.hidden = false;
}

/* ═══════════════════════════════════════════════════════════════════════════
   O CONSTRUTOR DE VISUALIZAÇÃO — escolher colunas e filtros fixos
   ═══════════════════════════════════════════════════════════════════════════

   Até 03/09/2026 só dava para criar visualização A PARTIR de um recorte: abrir
   Equiparação, mexer nas colunas, "salvar como". Quem quisesse cruzar duas
   colunas de DP com uma de cobrança não tinha por onde começar — as duas nunca
   aparecem na mesma tela.

   Agora a árvore vem do servidor (`tipo=variaveis`, a aba "Variáveis"), com as
   341 colunas por categoria e subcategoria, e JÁ FILTRADA pela permissão de
   quem está olhando: coluna que a pessoa não pode ler não é oferecida, porque
   oferecer uma coluna que voltaria vazia é pior do que não oferecer.

   FILTRO FIXO NÃO É O FILTRO DA RÉGUA, e a diferença é a razão de o botão
   existir. A régua (o funil de cada coluna) é o que ESTA pessoa está olhando
   agora; some ao recarregar e não vai para lugar nenhum. O filtro fixo é uma
   propriedade da VISUALIZAÇÃO: viaja com ela, vale para quem a abrir, e no
   servidor ele é PORTA e não vitrine — a linha que ele esconde também não pode
   ser gravada por aquela tela (ver gradeFiltroPassa_ no 3_Motor).

   MARCAR CATEGORIA MARCA TUDO QUE ESTÁ EMBAIXO. Sem isso, montar uma
   visualização de "Departamento pessoal inteiro" seriam 53 cliques — e ninguém
   faz 53 cliques; a pessoa desiste e volta a pedir a planilha por e-mail.
   ═══════════════════════════════════════════════════════════════════════════ */

let ARV = null;   // { arvore, fixas, total, tipos } — uma leitura por sessão de tela
async function arvoreVariaveis(){
  if (ARV) return ARV;
  const d = await jsonp(API_URL+'?tipo=variaveis&chave='+encodeURIComponent(chaveAtual()));
  if (!d || d.erro) throw new Error((d && d.erro) || 'Não consegui ler o catálogo de colunas.');
  ARV = d;
  return ARV;
}

/** As seis de identificação (GRADE_IDENT) entram em TODO recorte de graça, pelo
 *  servidor. Oferecê-las na árvore não acrescenta nada e produz a coluna
 *  DUPLICADA: quem marcou "Identificação" inteira via ID e Nome duas vezes na
 *  grade — uma da lista fixa, outra da escolha. Some da árvore, e a legenda do
 *  contador diz que elas vêm sempre. */
function ehFixa(col){
  const k = normCol(col);
  return ((ARV && ARV.fixas) || []).some(f => normCol(f) === k);
}

/** Toda coluna, achatada, na ordem da planilha. `semFixas` tira as seis de
 *  identificação — e a distinção importa: elas não são ESCOLHÍVEIS (entram
 *  sempre), mas são perfeitamente FILTRÁVEIS. "Produtos Back4you contém
 *  equiparação" é o filtro fixo mais usado da casa, e tirá-lo da lista de
 *  filtros por tabela deixou a Equiparação abrir com a coluna do próprio filtro
 *  em branco. Árvore de marcar: sem as fixas. Lista de filtro: com. */
function colunasTodas(semFixas){
  const out = [];
  ((ARV && ARV.arvore) || []).forEach(c => c.subs.forEach(s => s.colunas.forEach(x => {
    if (semFixas && ehFixa(x.coluna)) return;
    out.push(Object.assign({ categoria: c.categoria, subcategoria: s.subcategoria }, x));
  })));
  return out;
}
function colunasPlanas(){ return colunasTodas(true); }
function metaDaColuna(col){
  const k = normCol(col);
  return colunasTodas(false).find(x => normCol(x.coluna) === k) || null;
}

const COND = [
  { id:'contem',     rot:'contém',            valor:true  },
  { id:'igual',      rot:'é igual a',         valor:true  },
  { id:'diferente',  rot:'é diferente de',    valor:true  },
  { id:'preenchido', rot:'está preenchido',   valor:false },
  { id:'vazio',      rot:'está vazio',        valor:false }
];

/** {coluna, contem|igual|diferente|preenchido} -> a linha que a tela edita. */
function filtroParaLinha(f){
  if (!f || !f.coluna) return null;
  if (f.contem    != null) return { coluna:f.coluna, cond:'contem',    valor:String(f.contem) };
  if (f.igual     != null) return { coluna:f.coluna, cond:'igual',     valor:String(f.igual) };
  if (f.diferente != null) return { coluna:f.coluna, cond:'diferente', valor:String(f.diferente) };
  if (f.preenchido === false) return { coluna:f.coluna, cond:'vazio',  valor:'' };
  return { coluna:f.coluna, cond:'preenchido', valor:'' };
}
function linhaParaFiltro(l){
  if (!l || !l.coluna) return null;
  if (l.cond === 'preenchido') return { coluna:l.coluna, preenchido:true };
  if (l.cond === 'vazio')      return { coluna:l.coluna, preenchido:false };
  /* Condição de valor SEM valor não vira filtro. Guardá-la produziria uma
     visualização que esconde tudo (ninguém "contém" a string vazia de um jeito
     útil) e a pessoa acharia que a tela quebrou. */
  if (!String(l.valor||'').trim()) return null;
  const o = { coluna:l.coluna }; o[l.cond] = l.valor; return o;
}

let MODAL_CRIAR = null, CRIA = null;

/**
 * op.titulo   · op.confirmar · op.nome · op.colunas[] · op.filtro[]
 * op.soFiltro true = a caixa abre só com os filtros fixos (o botão da barra)
 * op.aoSalvar (estado) => Promise
 */
async function abrirConstrutor(op){
  await arvoreVariaveis();
  CRIA = {
    nome: op.nome || '',
    sel: new Set((op.colunas||[]).map(normCol)),
    ordemSel: (op.colunas||[]).slice(),
    linhas: (op.filtro||[]).map(filtroParaLinha).filter(Boolean),
    busca: '',
    soFiltro: !!op.soFiltro,
    aoSalvar: op.aoSalvar
  };
  if (!MODAL_CRIAR) {
    MODAL_CRIAR = B4UModal.criar({
      id:'modalCriar', largura:'760px',
      acoes:[{id:'criaOk', rot:'Criar', tipo:'pri'}, {id:'criaNao', rot:'Cancelar', tipo:'sec'}]
    });
  }
  MODAL_CRIAR.titulo(op.titulo || 'Nova visualização');
  const box = MODAL_CRIAR.corpo().closest('.b4m-box') || document;
  const ok = box.querySelector('#criaOk'), nao = box.querySelector('#criaNao');
  ok.textContent = op.confirmar || 'Criar';
  ok.onclick = () => salvarConstrutor(ok);
  nao.onclick = () => MODAL_CRIAR.fechar(true);
  pintarConstrutor();
  MODAL_CRIAR.abrir();
  const f = MODAL_CRIAR.corpo().querySelector('#criaNome, .cfiltro select');
  if (f) f.focus();
}

function contaSel(){ return CRIA.sel.size; }

function pintarConstrutor(){
  const c = MODAL_CRIAR.corpo();
  const planas = colunasPlanas();
  const b = CRIA.busca ? normCol(CRIA.busca) : '';

  let h = '';
  if (!CRIA.soFiltro) {
    h += '<label class="vlab">Nome</label>' +
         '<input class="vinp" id="criaNome" maxlength="80" placeholder="Ex.: Clientes sem certificado válido" value="'+esc(CRIA.nome)+'">';
  }

  /* ── FILTROS FIXOS ── vem ANTES das colunas de propósito: é a pergunta
     "quais clientes?", e ela precede "quais informações deles?". */
  h += '<div class="csec">Filtros fixos'
     +  '<span class="cdica">Valem sempre nesta visualização, para quem abrir. '
     +  'Diferente do funil de cada coluna, que é só o que você está olhando agora.</span></div>';
  const paraFiltro = colunasTodas(false);
  h += '<div id="cfiltros">';
  if (!CRIA.linhas.length) h += '<div class="cvazio">Sem filtro fixo — a tela mostra todos os clientes.</div>';
  CRIA.linhas.forEach((l, i) => {
    const meta = metaDaColuna(l.coluna);
    const cond = COND.find(x => x.id === l.cond) || COND[0];
    h += '<div class="cfiltro" data-i="'+i+'">'
       +   '<select data-f="coluna">' + optsColuna(l.coluna, paraFiltro) + '</select>'
       +   '<select data-f="cond">' + COND.map(x =>
             '<option value="'+x.id+'"'+(x.id===l.cond?' selected':'')+'>'+x.rot+'</option>').join('') + '</select>'
       +   (cond.valor ? campoValor(meta, l.valor) : '<span class="cnada">—</span>')
       +   '<button type="button" class="cx" data-f="tirar" title="Tirar este filtro">✕</button>'
       + '</div>';
  });
  h += '</div><button type="button" class="cadd" data-f="mais">＋ acrescentar filtro</button>';

  if (!CRIA.soFiltro) {
    h += '<div class="csec">Colunas <span class="ccont'+(contaSel()>60?' ruim':'')+'">'
       +  contaSel()+' de 60</span>'
       +  '<span class="cdica">Marcar a categoria marca tudo que está embaixo. '
       +  'As seis de identificação (ID, Nome, Ativo, CNPJ, Produtos, Cidade) entram sempre.</span></div>';
    h += '<input class="vinp cbusca" id="criaBusca" placeholder="Buscar coluna…" value="'+esc(CRIA.busca)+'">';
    h += '<div class="carv">';
    (ARV.arvore||[]).forEach(cat => {
      const subs = cat.subs.map(s => ({
        sub: s,
        cols: s.colunas.filter(x => !ehFixa(x.coluna) &&
                                   (!b || normCol(x.coluna).indexOf(b) >= 0 ||
                                    normCol(s.subcategoria).indexOf(b) >= 0 ||
                                    normCol(cat.categoria).indexOf(b) >= 0))
      })).filter(x => x.cols.length);
      if (!subs.length) return;
      const todas = subs.reduce((a,x)=>a.concat(x.cols),[]);
      const nMarc = todas.filter(x => CRIA.sel.has(normCol(x.coluna))).length;
      h += '<div class="ccat">'
         +   '<label class="clin forte"><input type="checkbox" data-c="cat" data-nome="'+esc(cat.categoria)+'"'
         +     (nMarc===todas.length?' checked':'') + (nMarc&&nMarc<todas.length?' data-meio="1"':'') + '>'
         +     '<span>'+esc(cat.categoria)+'</span><span class="cqt">'+nMarc+'/'+todas.length+'</span></label>';
      subs.forEach(x => {
        const m = x.cols.filter(y => CRIA.sel.has(normCol(y.coluna))).length;
        h += '<div class="csub">'
           +   '<label class="clin media"><input type="checkbox" data-c="sub" data-nome="'+esc(cat.categoria)+'||'+esc(x.sub.subcategoria)+'"'
           +     (m===x.cols.length?' checked':'') + '>'
           +     '<span>'+esc(x.sub.subcategoria)+'</span><span class="cqt">'+m+'/'+x.cols.length+'</span></label>';
        x.cols.forEach(y => {
          h += '<label class="clin"><input type="checkbox" data-c="col" data-nome="'+esc(y.coluna)+'"'
             +   (CRIA.sel.has(normCol(y.coluna))?' checked':'') + '>'
             +   '<span>'+esc(y.coluna)+'</span><span class="ctipo">'+esc(y.tipo)+(y.pode_gravar?'':' · leitura')+'</span></label>';
        });
        h += '</div>';
      });
      h += '</div>';
    });
    h += '</div>';
  }

  c.innerHTML = h;
}

function optsColuna(sel, planas){
  let ultima = '', h = '<option value="">— escolha a coluna —</option>';
  planas.forEach(x => {
    const grupo = x.categoria + ' · ' + x.subcategoria;
    if (grupo !== ultima) { if (ultima) h += '</optgroup>'; h += '<optgroup label="'+esc(grupo)+'">'; ultima = grupo; }
    h += '<option value="'+esc(x.coluna)+'"'+(normCol(x.coluna)===normCol(sel||'')?' selected':'')+'>'+esc(x.coluna)+'</option>';
  });
  return h + (ultima ? '</optgroup>' : '');
}

/** Coluna de lista vira menu suspenso, e não caixa de texto: digitar
 *  "protocolado" onde a planilha guarda "PROTOCOLADO" produziria um filtro que
 *  não acha ninguém e não explica por quê. */
function campoValor(meta, valor){
  if (meta && meta.opcoes && meta.opcoes.length) {
    return '<select data-f="valor"><option value="">—</option>' +
      meta.opcoes.map(o => '<option'+(String(o)===String(valor)?' selected':'')+'>'+esc(o)+'</option>').join('') +
      '</select>';
  }
  return '<input data-f="valor" value="'+esc(valor||'')+'" placeholder="valor">';
}

/* Um ouvinte só, no corpo do modal. Os nós são reescritos a cada mudança; ouvir
   em cada caixinha deixaria ouvintes órfãos a cada repintura. */
document.addEventListener('change', e => {
  if (!MODAL_CRIAR || !CRIA || !MODAL_CRIAR.corpo().contains(e.target)) return;
  const t = e.target, c = t.getAttribute('data-c'), f = t.getAttribute('data-f');

  if (c) {
    const marcar = t.checked;
    const alvo = [];
    if (c === 'col') alvo.push(t.getAttribute('data-nome'));
    else {
      const nome = t.getAttribute('data-nome');
      (ARV.arvore||[]).forEach(cat => cat.subs.forEach(s => s.colunas.forEach(x => {
        if (ehFixa(x.coluna)) return;
        if (c === 'cat' && cat.categoria === nome) alvo.push(x.coluna);
        if (c === 'sub' && (cat.categoria+'||'+s.subcategoria) === nome) alvo.push(x.coluna);
      })));
    }
    alvo.forEach(nome => { if (marcar) CRIA.sel.add(normCol(nome)); else CRIA.sel.delete(normCol(nome)); });
    /* A ordem guardada é a da PLANILHA, e não a dos cliques: é a ordem em que
       a pessoa já conhece as colunas, e não muda se ela desmarcar e remarcar. */
    CRIA.ordemSel = colunasPlanas().filter(x => CRIA.sel.has(normCol(x.coluna))).map(x => x.coluna);
    pintarConstrutor();
    return;
  }
  if (f === 'coluna' || f === 'cond' || f === 'valor') {
    const linha = t.closest('.cfiltro'); const i = +linha.getAttribute('data-i');
    if (f === 'coluna') { CRIA.linhas[i].coluna = t.value; CRIA.linhas[i].valor = ''; }
    if (f === 'cond')   CRIA.linhas[i].cond = t.value;
    if (f === 'valor')  { CRIA.linhas[i].valor = t.value; return; }   // digitar não repinta
    pintarConstrutor();
  }
});
document.addEventListener('input', e => {
  if (!MODAL_CRIAR || !CRIA || !MODAL_CRIAR.corpo().contains(e.target)) return;
  if (e.target.id === 'criaNome') { CRIA.nome = e.target.value; return; }   // não repinta: perderia o cursor
  if (e.target.getAttribute('data-f') === 'valor') {
    const linha = e.target.closest('.cfiltro'); CRIA.linhas[+linha.getAttribute('data-i')].valor = e.target.value; return;
  }
  if (e.target.id === 'criaBusca') {
    clearTimeout(window.__cb); const v = e.target.value;
    window.__cb = setTimeout(() => { CRIA.busca = v; pintarConstrutor();
      const n = MODAL_CRIAR.corpo().querySelector('#criaBusca'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 200);
  }
});
document.addEventListener('click', e => {
  if (!MODAL_CRIAR || !CRIA || !MODAL_CRIAR.corpo().contains(e.target)) return;
  const b = e.target.closest('[data-f]'); if (!b) return;
  if (b.getAttribute('data-f') === 'mais')  { CRIA.linhas.push({coluna:'', cond:'igual', valor:''}); pintarConstrutor(); }
  if (b.getAttribute('data-f') === 'tirar') { CRIA.linhas.splice(+b.closest('.cfiltro').getAttribute('data-i'), 1); pintarConstrutor(); }
});

async function salvarConstrutor(bt){
  const nomeEl = MODAL_CRIAR.corpo().querySelector('#criaNome');
  if (nomeEl) CRIA.nome = nomeEl.value;
  const filtro = CRIA.linhas.map(linhaParaFiltro).filter(Boolean);
  const est = { nome: (CRIA.nome||'').trim(), colunas: CRIA.ordemSel.slice(), filtro: filtro };

  if (!CRIA.soFiltro) {
    if (!est.nome)            return mostrarErro(new Error('Dê um nome à visualização — é por ele que você vai achá-la.'));
    if (!est.colunas.length)  return mostrarErro(new Error('Escolha ao menos uma coluna.'));
    if (est.colunas.length>60) return mostrarErro(new Error('São '+est.colunas.length+' colunas. O limite é 60 — acima disso a tela deixa de ser legível.'));
  }
  bt.disabled = true; const rot = bt.textContent; bt.textContent = 'Salvando…';
  try { await CRIA.aoSalvar(est); }
  catch (err) { mostrarErro(err); }
  finally { bt.disabled = false; bt.textContent = rot; }
}


/* ═══════════════════════════════════════════════════════════════════════════
   CRIAR UMA VARIÁVEL — a coluna nasce daqui
   ═══════════════════════════════════════════════════════════════════════════

   A coluna nasce no FIM da aba Registro, vazia, com a variável de mala direta
   escrita na linha 1 e a linha correspondente na aba "Variáveis". Os três
   passos que antes eram manuais — e o que sempre se esquecia era o da linha 1,
   que não dá erro: só desloca todas as variáveis dali para a direita.

   A VARIÁVEL É MOSTRADA ANTES DE CRIAR, e não depois. Ela é contrato com a mala
   direta: quem está criando precisa ver `{ID.cobranca.mensalidade.diadecorte}`
   e poder desistir, em vez de descobrir o nome quando for montar o documento.
   ═══════════════════════════════════════════════════════════════════════════ */

let MODAL_VAR = null, NOVAVAR = null;

function slugVar(s){
  return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'');
}
function variavelPrevista(){
  return '{' + ['ID', slugVar(NOVAVAR.categoria), slugVar(NOVAVAR.subcategoria), slugVar(NOVAVAR.coluna)]
    .filter(Boolean).join('.') + '}';
}
function categoriasConhecidas(){
  return ((ARV && ARV.arvore) || []).map(c => c.categoria).filter(c => c !== 'Sem categoria');
}
function subsDe(cat){
  const c = ((ARV && ARV.arvore) || []).find(x => x.categoria === cat);
  return c ? c.subs.map(s => s.subcategoria).filter(s => s && s !== '—') : [];
}

async function abrirNovaVariavel(){
  await arvoreVariaveis();
  NOVAVAR = { coluna:'', categoria: categoriasConhecidas()[0] || '', subcategoria:'',
              tipo:'texto', opcoes:'', dica:'' };
  if (!MODAL_VAR) {
    MODAL_VAR = B4UModal.criar({
      id:'modalVar', largura:'620px',
      acoes:[{id:'varOk', rot:'Criar coluna', tipo:'pri'}, {id:'varNao', rot:'Cancelar', tipo:'sec'}]
    });
  }
  MODAL_VAR.titulo('Criar uma variável');
  const box = MODAL_VAR.corpo().closest('.b4m-box') || document;
  box.querySelector('#varOk').onclick  = () => gravarNovaVariavel(box.querySelector('#varOk'));
  box.querySelector('#varNao').onclick = () => MODAL_VAR.fechar(true);
  pintarNovaVariavel();
  MODAL_VAR.abrir();
  const f = MODAL_VAR.corpo().querySelector('#nvCol'); if (f) f.focus();
}

function pintarNovaVariavel(){
  const cats = categoriasConhecidas(), subs = subsDe(NOVAVAR.categoria);
  const precisaOpcoes = ['lista','lista múltipla','sim/não'].indexOf(NOVAVAR.tipo) >= 0;
  const c = MODAL_VAR.corpo();
  c.innerHTML =
    '<label class="vlab">Nome da coluna <span style="font-weight:400;color:var(--muted)">— é o cabeçalho na planilha, e não muda depois sem quebrar as telas</span></label>' +
    '<input class="vinp" id="nvCol" maxlength="90" value="'+esc(NOVAVAR.coluna)+'" placeholder="Ex.: Dia de corte da mensalidade">' +

    '<div class="nv2">' +
      '<div><label class="vlab">Categoria</label>' +
        '<select class="vinp" id="nvCat">' +
          cats.map(x=>'<option'+(x===NOVAVAR.categoria?' selected':'')+'>'+esc(x)+'</option>').join('') +
          '<option value="__nova"'+(cats.indexOf(NOVAVAR.categoria)<0?' selected':'')+'>＋ criar uma categoria nova…</option>' +
        '</select>' +
        (cats.indexOf(NOVAVAR.categoria)<0
          ? '<input class="vinp" id="nvCatNova" style="margin-top:6px" placeholder="nome da categoria" value="'+esc(NOVAVAR.categoria)+'">' : '') +
      '</div>' +
      '<div><label class="vlab">Subcategoria <span style="font-weight:400;color:var(--muted)">(opcional)</span></label>' +
        '<select class="vinp" id="nvSub">' +
          '<option value="">— nenhuma —</option>' +
          subs.map(x=>'<option'+(x===NOVAVAR.subcategoria?' selected':'')+'>'+esc(x)+'</option>').join('') +
          '<option value="__nova"'+(NOVAVAR.subcategoria && subs.indexOf(NOVAVAR.subcategoria)<0?' selected':'')+'>＋ criar uma subcategoria nova…</option>' +
        '</select>' +
        (NOVAVAR.subcategoria && subs.indexOf(NOVAVAR.subcategoria)<0
          ? '<input class="vinp" id="nvSubNova" style="margin-top:6px" placeholder="nome da subcategoria" value="'+esc(NOVAVAR.subcategoria)+'">' : '') +
      '</div>' +
    '</div>' +

    '<label class="vlab" style="margin-top:14px">Tipo</label>' +
    '<select class="vinp" id="nvTipo">' +
      ((ARV && ARV.tipos) || ['texto']).map(t=>'<option'+(t===NOVAVAR.tipo?' selected':'')+'>'+esc(t)+'</option>').join('') +
    '</select>' +

    (precisaOpcoes
      ? '<label class="vlab" style="margin-top:14px">Opções — uma por linha</label>' +
        '<textarea class="vinp" id="nvOpc" rows="5" placeholder="Sim&#10;Não&#10;Não se aplica">'+esc(NOVAVAR.opcoes)+'</textarea>' +
        (NOVAVAR.tipo === 'lista múltipla'
          ? '<div class="vresumo">Escolha múltipla guarda as opções na mesma célula, unidas por " · " — por isso a planilha NÃO ganha menu suspenso nesta coluna: um menu de valor único recusaria justamente o que a tela grava.</div>'
          : '<div class="vresumo">A planilha vai passar a recusar qualquer valor fora desta lista nesta coluna.</div>')
      : '') +

    '<label class="vlab" style="margin-top:14px">Dica <span style="font-weight:400;color:var(--muted)">(opcional — aparece embaixo do campo)</span></label>' +
    '<input class="vinp" id="nvDica" maxlength="140" value="'+esc(NOVAVAR.dica)+'">' +

    '<div class="nvprev">A variável de mala direta vai ser <b>'+esc(variavelPrevista())+'</b>' +
      '<br>A coluna nasce <b>no fim</b> da aba Registro e <b>vazia</b> — nenhum dado existente se move.</div>';
}

document.addEventListener('input', e => {
  if (!MODAL_VAR || !NOVAVAR || !MODAL_VAR.corpo().contains(e.target)) return;
  const id = e.target.id;
  if (id === 'nvCol')     { NOVAVAR.coluna = e.target.value; return atualizarPrev(); }
  if (id === 'nvCatNova') { NOVAVAR.categoria = e.target.value; return atualizarPrev(); }
  if (id === 'nvSubNova') { NOVAVAR.subcategoria = e.target.value; return atualizarPrev(); }
  if (id === 'nvOpc')     { NOVAVAR.opcoes = e.target.value; return; }
  if (id === 'nvDica')    { NOVAVAR.dica = e.target.value; return; }
});
/* Só a frase da variável se repinta a cada tecla. Redesenhar a caixa inteira
   tiraria o cursor do campo em que a pessoa está digitando. */
function atualizarPrev(){
  const n = MODAL_VAR.corpo().querySelector('.nvprev b');
  if (n) n.textContent = variavelPrevista();
}
document.addEventListener('change', e => {
  if (!MODAL_VAR || !NOVAVAR || !MODAL_VAR.corpo().contains(e.target)) return;
  const id = e.target.id, v = e.target.value;
  if (id === 'nvCat')  { NOVAVAR.categoria = (v === '__nova') ? '' : v; NOVAVAR.subcategoria = ''; return pintarNovaVariavel(); }
  if (id === 'nvSub')  { NOVAVAR.subcategoria = (v === '__nova') ? ' ' : v; return pintarNovaVariavel(); }
  if (id === 'nvTipo') { NOVAVAR.tipo = v; return pintarNovaVariavel(); }
});

async function gravarNovaVariavel(bt){
  const c = MODAL_VAR.corpo();
  const pega = id => { const n = c.querySelector('#'+id); return n ? n.value : ''; };
  NOVAVAR.coluna = pega('nvCol').trim();
  if (c.querySelector('#nvCatNova')) NOVAVAR.categoria = pega('nvCatNova').trim();
  if (c.querySelector('#nvSubNova')) NOVAVAR.subcategoria = pega('nvSubNova').trim();
  NOVAVAR.opcoes = pega('nvOpc'); NOVAVAR.dica = pega('nvDica').trim();

  const opcoes = NOVAVAR.opcoes.split('\n').map(x=>x.trim()).filter(Boolean);
  bt.disabled = true; const rot = bt.textContent; bt.textContent = 'Criando…';
  try {
    const d = await postAcao({
      acao:'variavel_criar', coluna:NOVAVAR.coluna, categoria:NOVAVAR.categoria,
      subcategoria:NOVAVAR.subcategoria.trim(), tipo:NOVAVAR.tipo,
      opcoes: JSON.stringify(opcoes), dica:NOVAVAR.dica
    });
    ARV = null;                                    // a árvore mudou: releitura na próxima
    if (window.B4UShell && B4UShell.esquecerAtalhos) B4UShell.esquecerAtalhos();
    MODAL_VAR.fechar(true);
    const el = document.getElementById('avisoErro');
    if (el) { el.hidden = false; el.style.borderColor = 'var(--verde,#2e7d32)';
      el.textContent = 'Criei a coluna "' + d.coluna + '" no fim do Registro' +
        (d.variavel ? ', com a variável ' + d.variavel : '') + '. Ela já aparece no construtor.'; }
  } catch (err) { mostrarErro(err); }
  finally { bt.disabled = false; bt.textContent = rot; }
}


/* O DIÁLOGO DE VISUALIZAÇÃO — e por que não é `prompt()`.
   A primeira versão usava `prompt()` e `confirm()` nativos. Três problemas, e
   o terceiro só apareceu ao usar: (1) não dá para explicar nada dentro deles —
   a decisão "manter o filtro?" precisa mostrar QUAL filtro e quantos clientes
   ficam de fora; (2) o navegador desenha do jeito dele, no meio do nada, sem
   relação com a tela; (3) diálogo nativo TRAVA a página inteira, incluindo
   qualquer automação — e foi assim que o teste desta tela parou na primeira
   tentativa. O projeto já tem moldura de modal (b4u-modal.js); usar a dele é
   de graça e é o que faz esta tela parecer com as outras. */
let MODAL_VIS = null;
function perguntarVis(op){
  return new Promise(resolve => {
    if (!window.B4UModal) { resolve(null); return; }   // sem modal, não inventa prompt
    if (!MODAL_VIS) {
      MODAL_VIS = B4UModal.criar({
        id:'modalVis', largura:'520px',
        acoes:[{id:'visOk', rot:'Salvar', tipo:'pri'}, {id:'visNao', rot:'Cancelar', tipo:'sec'}],
        /* Fechar pelo × ou pelo Esc também resolve a promessa. Sem isto, quem
           desiste pelo × deixa um `await` pendurado para sempre — e o próximo
           clique em "Salvar como" abriria um modal que responde à promessa
           errada. */
        aoFechar: () => { if (MODAL_VIS._resolve) { const r = MODAL_VIS._resolve; MODAL_VIS._resolve = null; r(null); } }
      });
    }
    MODAL_VIS.titulo(op.titulo);
    MODAL_VIS.corpo().innerHTML = op.html;
    const box = MODAL_VIS.corpo().closest('.b4m-box') || document;
    const ok  = box.querySelector('#visOk'), nao = box.querySelector('#visNao');
    ok.textContent = op.confirmar || 'Salvar';
    MODAL_VIS._resolve = resolve;
    const fim = valor => {
      MODAL_VIS._resolve = null;      // antes do fechar: o aoFechar não deve resolver de novo
      MODAL_VIS.fechar(true);
      resolve(valor);
    };
    ok.onclick  = () => fim(op.ler ? op.ler(MODAL_VIS.corpo()) : true);
    nao.onclick = () => fim(null);
    MODAL_VIS.abrir();
    const foco = MODAL_VIS.corpo().querySelector('input,textarea');
    if (foco) { foco.focus(); foco.select && foco.select(); 
      foco.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); ok.click(); } }; }
  });
}

document.addEventListener('click', async e => {
  const bt = e.target.closest && e.target.closest('[data-vis]');
  if (!bt) return;
  const acao = bt.getAttribute('data-vis');
  visBotaoAtivo = bt;
  const v = REC && REC.visualizacao;

  if (acao === 'lista') { location.href = 'b4u-recorte?chave=' + encodeURIComponent(chaveAtual()); return; }

  /* DO ZERO — sem partir de recorte nenhum. É o caminho de quem quer cruzar
     duas colunas de DP com uma de cobrança: elas não aparecem juntas em tela
     nenhuma do catálogo, então não havia de onde "salvar como". */
  /* CRIAR VARIÁVEL. Fica ao lado de "criar visualização" porque é a mesma
     pergunta uma casa antes: a pessoa foi montar a tela e descobriu que a
     coluna que ela precisa não existe. Mandá-la abrir a planilha e voltar é
     onde a ideia morre. */
  if (acao === 'novavar') {
    try { return await abrirNovaVariavel(); } catch (err) { return mostrarErro(err); }
  }

  if (acao === 'criar') {
    try {
      return await abrirConstrutor({
        titulo: 'Nova visualização', confirmar: 'Criar',
        aoSalvar: est => visGravarEstado(est)
      });
    } catch (err) { return mostrarErro(err); }
  }

  /* FILTROS FIXOS. Em visualização MINHA, edita no lugar. Em recorte do
     catálogo (ou na visualização de outra pessoa), o filtro aparece editável
     mas mexer não muda a tela de todo mundo: vira uma visualização sua, já com
     as colunas que estão na tela e o filtro que você acabou de montar.
     O catálogo continua sendo CÓDIGO porque é ele que carrega permissão — e o
     filtro do recorte também trava a GRAVAÇÃO, não só a exibição. */
  if (acao === 'fixos') {
    const meu = !!(v && v.meu);
    const atual = (REC && REC.filtro) ? (Array.isArray(REC.filtro) ? REC.filtro : [REC.filtro]) : [];
    try {
      return await abrirConstrutor({
        titulo:    meu ? 'Filtros fixos desta visualização' : 'Filtros fixos — vira uma visualização sua',
        confirmar: meu ? 'Salvar' : 'Criar minha visualização',
        soFiltro:  meu,
        nome:      meu ? (v.nome || '') : ((REC && REC.rotulo ? REC.rotulo : 'Minha visualização') + ' (com meu filtro)'),
        colunas:   VIS.slice(),
        filtro:    atual,
        aoSalvar:  est => meu
          ? visGravarEstado({ nome: v.nome, colunas: VIS.slice(), filtro: est.filtro,
                              ordem: estadoDaTela().ordem }, { id: v.id, publico: v.publico })
          : visGravarEstado(est)
      });
    } catch (err) { return mostrarErro(err); }
  }

  if (acao === 'nova' || acao === 'duplicar') {
    const sugestao = acao === 'duplicar' && v ? (v.nome + ' (cópia)')
                   : ((REC && REC.rotulo) || 'Minha visualização');
    /* A caixa de criar MOSTRA o que vai ser salvo. "Salvar como visualização"
       sem dizer o que está sendo salvo é a pessoa descobrindo depois que
       guardou 40 colunas quando queria 6. */
    const herdado = (REC && REC.filtro && REC.filtro_sobre)
      /* O texto inteiro num <span>: o `.vlin` é flex, e cada nó solto viraria
         uma COLUNA — a frase saía quebrada em três pedaços lado a lado. */
      ? '<label class="vlin"><input type="checkbox" id="visHerda" checked>' +
        '<span>Manter o filtro desta tela — <b>' + esc(REC.filtro_sobre) + '</b>' +
        ((REC.fora_do_filtro||0) ? '. ' + REC.fora_do_filtro + ' clientes ficam de fora.' : '') +
        '</span></label>'
      : '';
    const est = estadoDaTela();
    const r = await perguntarVis({
      titulo: acao === 'duplicar' ? 'Duplicar visualização' : 'Salvar como visualização',
      confirmar: 'Criar',
      html: '<label class="vlab">Nome</label>' +
            '<input class="vinp" id="visNome" value="' + esc(sugestao) + '" maxlength="80">' +
            '<div class="vresumo">Vai guardar <b>' + VIS.length + ' colunas</b>' +
            (est.ordem ? ', ordenado por <b>' + esc(est.ordem.coluna) + '</b>' : ', sem ordenação') +
            '. Largura de coluna e altura de linha continuam só no seu navegador.</div>' +
            herdado,
      ler: c => ({ nome: (c.querySelector('#visNome').value||'').trim(),
                   herdar: !c.querySelector('#visHerda') || c.querySelector('#visHerda').checked })
    });
    if (!r || !r.nome) return;
    return visGravar({ nome: r.nome }, r.herdar);      // sem id = cria
  }
  if (!v || !v.meu) return;

  if (acao === 'salvar')   return visGravar({ id: v.id, nome: v.nome, publico: v.publico });
  if (acao === 'publico')  return visGravar({ id: v.id, nome: v.nome, publico: !v.publico });

  if (acao === 'renomear') {
    const r = await perguntarVis({
      titulo: 'Renomear visualização', confirmar: 'Renomear',
      html: '<label class="vlab">Nome</label>' +
            '<input class="vinp" id="visNome" value="' + esc(v.nome) + '" maxlength="80">',
      ler: c => ({ nome: (c.querySelector('#visNome').value||'').trim() })
    });
    if (!r || !r.nome || r.nome === v.nome) return;
    return visGravar({ id: v.id, nome: r.nome, publico: v.publico });
  }

  if (acao === 'excluir') {
    const r = await perguntarVis({
      titulo: 'Apagar visualização', confirmar: 'Apagar',
      html: '<div class="vresumo">Apagar <b>' + esc(v.nome) + '</b>?' +
            (v.publico ? ' Ela é pública — quem a estiver usando perde o atalho.' : '') +
            ' Isso não apaga nenhum dado de cliente: visualização é só uma forma de olhar.</div>'
    });
    if (!r) return;
    try {
      await postAcao({ acao: 'vis_excluir', id: v.id });
      if (window.B4UShell && B4UShell.esquecerAtalhos) B4UShell.esquecerAtalhos();
      location.href = 'b4u-recorte?chave=' + encodeURIComponent(chaveAtual());
    } catch (err) { mostrarErro(err); }
  }
});

/** Grava um estado montado PELO CONSTRUTOR (e não lido da tela aberta).
 *  Sempre navega para a visualização: mudar coluna ou filtro fixo muda QUAIS
 *  clientes e quais campos o servidor manda — repintar com o payload velho
 *  mostraria a tela antiga com o nome novo, que é a pior mentira possível. */
async function visGravarEstado(est, extra){
  const d = await postAcao(Object.assign({
    acao: 'vis_salvar',
    nome: est.nome,
    colunas: JSON.stringify(est.colunas),
    filtro:  JSON.stringify(est.filtro || []),
    ordem:   JSON.stringify(est.ordem || null)
  }, extra || {}));
  if (window.B4UShell && B4UShell.esquecerAtalhos) B4UShell.esquecerAtalhos();
  if (MODAL_CRIAR) MODAL_CRIAR.fechar(true);
  location.href = '?v=' + encodeURIComponent(d.id) + '&chave=' + encodeURIComponent(chaveAtual());
}

let visBotaoAtivo = null;   // o botão que a pessoa apertou nesta gravação
async function visGravar(extra, herdar){
  const est = estadoDaTela(herdar);
  /* O botão que a pessoa APERTOU, e não o primeiro que casa com o seletor.
     Antes era `querySelector('[data-vis="salvar"], [data-vis="nova"]')`: clicar
     em "Tornar pública" escrevia "Salvando…" no botão Salvar, ao lado. */
  const bt = visBotaoAtivo;
  if (bt) { bt.disabled = true; bt.dataset.rot = bt.textContent; bt.textContent = 'Salvando…'; }
  try {
    const d = await postAcao(Object.assign({
      acao: 'vis_salvar',
      colunas: JSON.stringify(est.colunas),
      filtro:  JSON.stringify(est.filtro),
      ordem:   JSON.stringify(est.ordem)
    }, extra));
    /* Criar leva para a visualização nova; salvar fica onde está e só atualiza
       o rótulo de "alterado". Recarregar quem só salvou perderia a rolagem e o
       lugar da leitura por nada. */
    if (!extra.id) {
      if (window.B4UShell && B4UShell.esquecerAtalhos) B4UShell.esquecerAtalhos();
      location.href = '?v=' + encodeURIComponent(d.id) + '&chave=' + encodeURIComponent(chaveAtual());
      return;
    }
    /* O menu lateral guarda a lista por aba. Renomear ou tornar pública sem
       avisá-lo deixaria o atalho com o nome velho até a pessoa fechar a aba. */
    if (window.B4UShell && B4UShell.esquecerAtalhos) B4UShell.esquecerAtalhos();
    VIS_SALVA = est;
    REC.visualizacao.nome = d.nome; REC.visualizacao.publico = d.publico;
    document.getElementById('tag').textContent = d.nome;
    document.title = d.nome + ' — back4you';
  } catch (err) {
    /* Sem `alert`: a faixa de erro da própria tela já existe e não trava nada. */
    mostrarErro(new Error('Não consegui salvar a visualização: ' +
      ((err && err.message) || err)));
  } finally {
    /* SEMPRE devolve o botão ao normal, e invalida o cache de HTML da barra
       antes. Sem isto, uma gravação que falha deixa "Salvando…" para sempre:
       o `pintarVisBar` gera o MESMO html de antes do clique, o cache diz "não
       mudou" e não reescreve — e o botão que eu havia mexido na mão fica preso.
       Otimização que compara HTML precisa saber que alguém mexeu no DOM fora
       dela. */
    const barra = document.getElementById('visbar');
    if (barra) barra.__html = null;
    visBotaoAtivo = null;
    pintarVisBar();
  }
}

/* A legenda do filtro do RECORTE — o que o SERVIDOR decidiu não mandar. Não
   confundir com a régua de filtros da tela, que é escolha de quem está
   olhando: este aqui a pessoa não desliga, e por isso precisa estar escrito.
   `filtro_ignorado` aparece porque coluna com nome errado no catálogo faz o
   servidor mostrar TODO MUNDO — e um filtro que silenciosamente não filtra é
   pior do que filtro nenhum, já que a legenda promete o contrário. */
function pintarFiltroDoRecorte(){
  const no = document.getElementById('recfiltro');
  if (!no) return;
  const sobre = (REC && REC.filtro_sobre) || '';
  const fora  = (REC && REC.fora_do_filtro) || 0;
  const ruins = (META && META.filtro_ignorado) || [];
  /* `ausentes` são colunas que o recorte PEDIU e a planilha não tem. O servidor
     já as devolvia e ninguém as mostrava — foi assim que as cinco colunas de
     prazo da equiparação sumiram da tela sem ninguém notar: a seção continuava
     lá, com o status e o link, e só o prazo não existia. Coluna pedida e não
     encontrada é ou erro de digitação no catálogo, ou coluna apagada da
     planilha; as duas precisam aparecer para alguém. */
  const faltando = (META && META.ausentes) || [];
  if (!sobre && !ruins.length && !faltando.length) { no.hidden = true; no.innerHTML = ''; return; }
  let html = '';
  if (sobre) {
    html = 'Mostrando <b>' + esc(sobre) + '</b>' +
           (fora ? ' · ' + fora + ' cliente' + (fora > 1 ? 's' : '') + ' fora desta lista' : '');
  }
  if (ruins.length) {
    html += (html ? ' · ' : '') +
      '<b>filtro ignorado</b>: não existe a coluna ' + ruins.map(esc).join(', ');
  }
  if (faltando.length) {
    html += (html ? ' · ' : '') + '<b>' + faltando.length + ' coluna' +
      (faltando.length > 1 ? 's' : '') + ' do recorte não existe' +
      (faltando.length > 1 ? 'm' : '') + ' na planilha</b>: ' +
      faltando.slice(0, 6).map(esc).join(', ') + (faltando.length > 6 ? '…' : '');
  }
  no.innerHTML = html;
  no.hidden = false;
}

function aplicar(d){
  REC    = d.recorte || {rotulo:'Recorte', pode_gravar:false};
  /* As seções que CHEGARAM. Uma que a pessoa não pode ler não está aqui — o
     servidor não a pôs no payload, e isso não é `display:none`: a coluna nem
     viajou. */
  SECOES = d.secoes || [];
  SEC_DE = new Map();
  SECOES.forEach(sec => (sec.colunas||[]).forEach(c => SEC_DE.set(normCol(c), sec)));
  DO_REC = d.do_recorte || [];
  IDENT  = d.identificacao || [];
  LINHAS = d.linhas || [];
  VALID  = d.validacoes || {};
  ESPELHADA = new Set((d.espelhadas||[]).map(normCol));
  SIGILOSA  = new Set((d.sigilosas ||[]).map(normCol));
  DATA      = new Set((d.datas     ||[]).map(normCol));
  LINK      = new Set((d.links     ||[]).map(normCol));
  META   = d;

  document.title = REC.rotulo + ' — back4you';
  document.getElementById('tag').textContent = REC.rotulo;
  document.getElementById('sobre').textContent  = REC.sobre || '';
  pintarFiltroDoRecorte();

  /* A ORDENAÇÃO INICIAL da visualização. `ORD` é definido aqui, ANTES de o
     `lerVis()` abaixo montar a lista de colunas, porque a ordenação é parte do
     que a pessoa salvou — abrir a tela desordenada e deixá-la ordenar de novo
     seria salvar uma coisa e entregar outra. */
  if (REC.ordem_inicial && REC.ordem_inicial.coluna) {
    ORD = { col: REC.ordem_inicial.coluna, dir: REC.ordem_inicial.direcao || 'asc' };
  }
  /* O filtro salvo da visualização já veio aplicado PELO SERVIDOR (linhas que
     não passam nem viajam). O `F_COL` daqui é o filtro que a pessoa mexe na
     tela — começa vazio, e é isso que faz o botão "tirar filtro" da régua não
     prometer desfazer algo que ele não desfaz. */

  /* A escolha guardada é FILTRADA pelo que o recorte tem HOJE. Sem isso, uma
     coluna tirada do recorte no servidor continuaria na lista de alguém para
     sempre — e apareceria como uma coluna vazia que ninguém consegue explicar. */
  const guardada = lerVis();
  /* Filtra pela guardada, e NÃO pela ordem do recorte. Era
     `DO_REC.filter(c => guardada.indexOf(c) > -1)`, que devolvia as colunas
     certas na ordem errada — e com isso a ordem que a pessoa arrastou durava
     até o F5. O `filter` sobre a guardada preserva a ordem dela e joga fora a
     coluna que saiu do recorte desde a última visita. */
  /* Numa VISUALIZAÇÃO, quem manda na primeira abertura é o que foi salvo, e
     não o `localStorage` — a pessoa abriu a tela DELA para ver a tela dela.
     O localStorage continua valendo para largura, altura e para o rascunho de
     quem mexeu e ainda não salvou. */
  if (REC.visualizacao && !guardada) VIS = DO_REC.slice();
  else VIS = guardada ? guardada.filter(c => DO_REC.indexOf(c) > -1) : visPadrao();
  if (!guardada) salvarVis();
  lerLayout();
  if (REC.visualizacao) VIS_SALVA = estadoDaTela();
  pintarVisBar();

  /* A faixa de permissão nomeia AS SEÇÕES, não a tela. "Você não pode editar"
     seria falso para o societário, que edita as licenças e não os acessos — e
     um aviso que a pessoa sabe estar errado é um aviso que ela deixa de ler. */
  const travadas = SECOES.filter(s=>!s.pode_gravar);
  if (travadas.length) {
    const el = document.getElementById('avisoLeitura');
    el.hidden = false;
    el.textContent = travadas.length === SECOES.length
      ? 'Aqui você vê, mas não edita. Os campos vêm travados.'
      : 'Você vê, mas não edita: ' + travadas.map(s=>s.rotulo).join(' · ') +
        '. Os campos dessa parte vêm travados.';
  }

  montarSeletorColunas();
