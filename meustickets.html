<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus chamados — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- São DUAS origens porque o /exec responde 302 para a segunda: sem isto o aparelho
     paga DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte deixa de bloquear a primeira pintura: o esqueleto aparece antes dela. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"></noscript>
<style>
:root{
  /* PALETA CANÔNICA — igual nas 7 páginas do cliente. Não redeclare tons aqui. */
  --canvas:#F1E7DC; --surface:#FFFFFF; --surface-warm:#FBF6EF;
  --ink:#113D39; --ink-2:#3F5854; --muted:#6E6256; --line:#E4D9C9; --line-2:#D6C3AC;
  --brand-dark:#073034; --brand-teal:#0F8C85; --brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,44:1 no receita-soft).
     Este é o mesmo teal escurecido só para texto e fundo de texto; o --brand-teal
     continua canônico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E; --amber-txt:#8A5A10; --vermelho:#C0392B; --verde:#2E9D5F;
  --receita-soft:#DBEFEC;
  /* Escala tipográfica — 6 passos, sem meio pixel. */
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:15px; --fs-5:19px; --fs-6:24px;
  /* Raios — 12 padrão, 16 para caixas grandes, 999 só para pílulas. */
  --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-pill:999px;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  /* Escala de padding — os mesmos três degraus das outras páginas do cliente. */
  --pad-sm: 14px 16px;
  --pad:    18px 20px;
  --pad-lg: 24px 26px;
  --lift:   0 8px 20px rgba(17,61,57,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);min-height:100vh;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:4px}
/* Campo com menos de 16px faz o Safari ampliar a página inteira ao focar. Só os campos. */
input,select,textarea{font-size:16px}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 24px 60px;flex:1}
@media(max-width:640px){
  /* No celular a escala inteira encolhe de uma vez, pelos tokens. */
  :root{--pad-sm:12px 13px;--pad:15px 16px;--pad-lg:18px 18px}
  .wrap{padding:0 14px 60px}
}
/* Chamado é texto corrido: linha de 1180px cansa. Quem limita a leitura é o CONTEÚDO,
   não o .wrap — assim a goteira continua igual à das outras sete páginas. */
.wrap>*{max-width:70ch}

/* Cabeçalho: a página não tinha nenhum. O cliente entrava aqui e perdia a marca no
   topo e o caminho de volta — saía do produto sem sair do produto. */
header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:var(--b4u-bar-h,0px);z-index:30}
.bar{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:var(--fs-5);letter-spacing:-.02em;line-height:1}
.logo .b{color:var(--brand-dark)} .logo .y{color:var(--brand-teal)}
/* Razão social + CNPJ é o que confirma "esta é a minha empresa": 15px em teal
   puro dá 4,11:1. Escurecido, 5,54:1. */
.brand-sub{font-size:var(--fs-4);color:var(--brand-teal-txt);font-weight:700;margin-top:2px}
.voltar{display:inline-block;font-size:var(--fs-1);font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:4px;min-height:44px;line-height:44px}
.voltar:hover{color:var(--brand-teal-txt)}
@media(max-width:640px){.bar{padding:12px 14px;gap:10px}}

.cab{margin:24px 0 22px}
.cab h1{font-size:var(--fs-5);font-weight:800;letter-spacing:-.01em}
.cab p{font-size:var(--fs-3);color:var(--muted);margin-top:6px;line-height:1.5}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--pad);margin-bottom:14px}
.tk .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tk .area{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--brand-teal-txt);background:var(--surface-warm);border:1px solid var(--line);
  padding:3px 9px;border-radius:var(--radius-pill)}
.tk .badge{font-size:var(--fs-1);font-weight:700;padding:3px 10px;border-radius:var(--radius-pill)}
.tk .badge.aberto{background:#FFF1DC;color:#9A6B10;border:1px solid #F0D9AE}
.tk .badge.respondido{background:#E5F0FF;color:#25518F;border:1px solid #C9DEF7}
.tk .badge.concluido{background:#E7F4EC;color:#2E7D4F;border:1px solid #CBE7D4}
.tk .badge.cancelado{background:#F3E3E1;color:#8B2E22;border:1px solid #E4C9C4}
.tk.cancelada{opacity:.72}
.tk .data{font-size:var(--fs-2);color:var(--muted);margin-left:auto}
.tk h2{font-size:var(--fs-4);font-weight:700;margin:2px 0 4px}
.tk .quem{font-size:var(--fs-2);color:var(--muted);margin-bottom:7px}
.tk .quem b{color:var(--ink-2);font-weight:600}
.tk-anexo{display:inline-block;margin-top:10px;font-size:var(--fs-2);font-weight:600;color:var(--brand-teal-txt);text-decoration:none;background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 11px}
.tk-anexo:hover{border-color:var(--brand-teal)}
.tk-acoes{margin-top:12px;display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.btn-cancelar{background:none;border:1px solid var(--line-2);color:#8B2E22;font-weight:600;font-size:var(--fs-2);
  padding:8px 13px;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit}
.btn-cancelar:hover{background:#F7EEEC;border-color:#E4C9C4}
.confirma{font-size:var(--fs-2);color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.confirma .sim{background:#8B2E22;color:#fff;border:0}.confirma .sim:hover{background:#742418}
.confirma .nao{background:var(--surface-warm)}
.confirma button{font-weight:600;font-size:var(--fs-2);padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--line-2);font-family:inherit;color:var(--ink-2)}
.antigos{margin-top:20px}
.antigos-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 18px;cursor:pointer;
  font-family:inherit;font-size:var(--fs-3);font-weight:700;color:var(--ink)}
.antigos-btn:hover{background:var(--surface-warm)}
.antigos-btn .conta{margin-left:auto;font-size:var(--fs-2);font-weight:700;color:var(--muted);background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 9px}
.antigos-btn .seta{transition:transform .2s;color:var(--muted)}
.antigos-btn[aria-expanded="true"] .seta{transform:rotate(180deg)}
.antigos-body{display:none;margin-top:12px}
.antigos-body.on{display:block}
/* Teto da lista — dois botões de propósito: "mais 20" para quem lê, "todos" para
   quem vai usar Ctrl+F. Abrir "Chamados antigos" despejava os 31 de uma vez. */
.lista-mais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.lista-mais button{min-height:44px;padding:0 18px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--brand-teal-txt);
  font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.lista-mais button:hover{border-color:var(--brand-teal);background:var(--receita-soft)}
.lista-mais .btn-todos{background:transparent;color:var(--ink-2);font-weight:600}
.tk .msg{font-size:var(--fs-3);color:var(--ink-2);line-height:1.55;white-space:pre-wrap}
.tk .resp{margin-top:12px;padding:12px 14px;background:var(--surface-warm);
  border:1px solid var(--line);border-radius:var(--radius-sm)}
.tk .resp .lbl{font-size:var(--fs-1);font-weight:700;color:var(--brand-teal-txt);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.tk .resp .txt{font-size:var(--fs-3);color:var(--ink);line-height:1.55;white-space:pre-wrap}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  min-height:50vh;text-align:center;padding:0 24px;margin:0 auto}
.state h1{font-size:var(--fs-5);font-weight:700}
.state p{color:var(--muted);font-size:var(--fs-4);max-width:46ch;line-height:1.5}
.state code{background:var(--surface-warm);padding:2px 6px;border-radius:4px;border:1px solid var(--line);font-size:var(--fs-3)}
.state .cta{margin-top:8px;display:inline-flex;align-items:center;gap:7px;background:var(--brand-teal-txt);
  color:#fff;text-decoration:none;font-weight:600;font-size:var(--fs-3);padding:11px 16px;border-radius:var(--radius-sm)}
.spin{width:26px;height:26px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.espera{margin-top:18px;text-align:center;font-size:var(--fs-3);color:var(--muted);min-height:1.4em}
/* Tarja de cache: o que está na tela é do último acesso e já está sendo atualizado. */
.tarja-atualizando{font-size:var(--fs-2);font-weight:600;color:var(--brand-dark);
  background:var(--receita-soft);border-radius:var(--radius-pill);padding:6px 14px;margin:14px 0 0;
  display:inline-flex;align-items:center;gap:8px}
.tarja-atualizando.falhou{background:#FCEFE0;color:#8A5A10}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{padding:18px 24px;text-align:center;font-size:var(--fs-2);color:var(--muted)}
</style>
<script src="config.js"></script>
<!-- A tela de espera mora num arquivo só (b4u-espera.js): antes cada página tinha a
     sua frase parada, e frases diferentes envelheciam de jeitos diferentes. -->
<script src="b4u-espera.js" charset="utf-8"></script>
<!-- O menu lateral (navegação ENTRE páginas) também mora num arquivo só. Ele NÃO
     substitui o <header> desta página: o "← Voltar ao início" continua lá, porque
     abaixo de 1100px o menu é gaveta e o caminho de volta não pode depender de
     abrir gaveta nenhuma. Se este arquivo não carregar, a página fica como era: a
     chamada é protegida por `window.B4UShell &&`. -->
<script src="b4u-shell.js" charset="utf-8"></script>
<style>
/* Identificador que chegou da planilha com dígito faltando. O número aparece
   como veio — inventar o zero deixaria um CNPJ inexistente com cara de certo —
   e ganha um sublinhado pontilhado âmbar mais o ⚠. O title diz quantos dígitos
   vieram, quantos deveriam vir e onde consertar. Cor só de aviso: âmbar, não
   vermelho, porque o cadastro não está errado, está incompleto na origem. */
.b4u-trunc{text-decoration:underline dotted var(--amber,#E8892E);text-underline-offset:2px;cursor:help}
.b4u-trunc-m{color:var(--amber-txt,#8A5A10);font-size:.85em;margin-left:3px;vertical-align:1px}
/* Só para leitor de tela: o ⚠ é aria-hidden, e sem isto quem não vê a tela não
   ficaria sabendo que o número está incompleto. */
.b4u-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* O mesmo aviso por extenso, dentro da ficha. Na lista cabe um ⚠; aqui, com o
   campo à vista e espaço para uma linha, cabe dizer o que aconteceu e o que
   fazer — que é o único jeito de o dado ser corrigido na origem. */
.fld-aviso{display:block;margin-top:4px;font-size:var(--fs-1,11px);line-height:1.35;
  color:var(--amber-txt,#8A5A10);font-weight:600}
</style>
<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a

   digitado: o conserto ali depende do patch do backend. */

    ov.querySelector('#b4u-cancel').addEventListener('click', tentarFechar);
    ov.addEventListener('click', function(e){ if(e.target===ov) tentarFechar(); });
    ov.querySelector('#b4u-send').addEventListener('click', enviar);
    // o seletor de "tipo do documento" só aparece quando há um arquivo anexado
    var fileEl = ov.querySelector('#b4u-file');

  function enviar(){
    var cc = idc();
    var erroEl = ov.querySelector('#b4u-erro');
    var btn = ov.querySelector('#b4u-send');
    erroEl.textContent = '';
    if(!cc.id || !cc.codigo){ erroEl.textContent = 'Abra o painel pelo seu link (com ID e código) para enviar um chamado.'; return; }
    var area = ov.querySelector('#b4u-area').value;
    var tipo = ov.querySelector('#b4u-tipo').value;
    var assunto = ov.querySelector('#b4u-assunto').value.trim();
    var msg = ov.querySelector('#b4u-msg').value.trim();
    if(!msg){ erroEl.textContent = 'Escreva a mensagem do chamado.'; return; }
    var fileEl = ov.querySelector('#b4u-file');

    if(file && file.size > 10*1024*1024){ erroEl.textContent = 'O anexo tem mais de 10 MB. Envie um arquivo menor.'; return; }
    btn.disabled = true; btn.textContent = 'Enviando…';
    var falhou = function(e){ btn.disabled=false; btn.textContent='Enviar chamado'; erroEl.textContent = msgAmigavel(e); };
    if(file){
      // COM arquivo -> POST (JSONP/GET não comporta base64)
      var reader = new FileReader();
      reader.onload = function(){
        var base64 = String(reader.result||'').split(',')[1] || '';
        var tdEl = ov.querySelector('#b4u-tipodoc');

          arquivo_nome:file.name, arquivo_tipo:file.type, arquivo_base64:base64 });
        fetch(api(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body })
          .then(function(r){ return r.json(); })
          .then(function(d){ if(d && d.erro) throw new Error(d.erro); sucesso(); })
          .catch(falhou);
      };
      reader.onerror = function(){ falhou(new Error('Não consegui ler o arquivo.')); };
      reader.readAsDataURL(file);

    }
    // SEM arquivo -> JSONP como sempre

  function sucesso(){
    ov.innerHTML =

  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && ov.classList.contains('on')) tentarFechar(); });

  // ---- Puxar para atualizar (mobile) --------------------------------------
  // Só age quando a página está no topo e o gesto é para baixo; recarrega ao soltar
  // depois do limiar. Não atrapalha a rolagem normal.
  (function(){
    var ind=document.createElement('div'); ind.className='b4u-ptr';
    ind.innerHTML='<span class="ring"></span><span class="txt">Puxe para atualizar</span>';

    function topo(){ return (window.scrollY||document.documentElement.scrollTop||0)<=0; }
    window.addEventListener('touchstart',function(e){
      if(e.touches.length!==1 || !topo() || (ov&&ov.classList.contains('on'))){ y0=null; return; }
      y0=e.touches[0].clientY; ativo=true;
    },{passive:true});
    window.addEventListener('touchmove',function(e){
      if(!ativo||y0===null) return;

      if(!topo()){ ativo=false; ind.style.height='0'; return; }

      ind.querySelector('.txt').textContent = dist>LIM?'Solte para atualizar':'Puxe para atualizar';
    },{passive:true});
    window.addEventListener('touchend',function(){
      if(!ativo){ return; } ativo=false;
      if(dist>LIM){ ind.classList.add('spin'); ind.style.height=(LIM)+'px'; ind.querySelector('.txt').textContent='Atualizando…'; setTimeout(function(){ location.reload(); },150); }
      else { ind.style.height='0'; }

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';

const AREA_LABEL = {
  fiscal:'Fiscal', dpto_pessoal:'Departamento Pessoal', contabil:'Contábil',
  societario:'Societário', equiparacao:'Equiparação', outros:'Outros'
};
const TIPO_LABEL = {
  livre:'Chamado livre', solicitar_nf:'Solicitar nota fiscal', duvida:'Dúvida', ferias:'Solicitar férias',
  previa_admissao:'Prévia de admissão', contratacao:'Formalizar admissão',
  previa_rescisao:'Prévia de rescisão', rescisao:'Formalizar desligamento'
};

function getIdCodigo(){
  const qs = new URLSearchParams(location.search);
  let id = qs.get('id')||'', codigo = qs.get('codigo')||'';
  if(!id){
    const h = location.hash.replace('#','').trim();
    const m = h.match(/^(\d+)-(.+)$/), s = h.match(/^(\d+)$/);
    if(m){ id=m[1]; codigo=m[2]; } else if(s){ id=s[1]; }
  }
  return { id:id.replace(/\D/g,''), codigo:codigo.trim() };
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Vazia de propósito: quem fala com a pessoa durante a espera agora é o
   b4u-espera.js, por cima da página. Continua existindo porque é chamada
   de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){
  return new Promise((ok,fail)=>{
    const cb='cb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const t=setTimeout(()=>{ limpa(); fail(new Error('A API não respondeu.')); },JSONP_TETO);
    function limpa(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb]=d=>{ limpa(); ok(d); };
    s.onerror=()=>{ limpa(); fail(new Error('Não consegui alcançar a API.')); };
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.body.appendChild(s);
  });
}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
   de espera continua de pé durante a segunda tentativa: encerrá-la aqui descobria o
   esqueleto no meio da busca. Erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function classeStatus(st){
  const s = (st||'').toString().toLowerCase();
  if(s.indexOf('cancel')>=0) return 'cancelado';
  if(s.indexOf('conclu')>=0 || s.indexOf('fechad')>=0) return 'concluido';
  if(s.indexOf('respond')>=0 || s.indexOf('andamento')>=0) return 'respondido';
  return 'aberto';
}
const ROT_STATUS = { concluido:'Concluído', cancelado:'Cancelado', respondido:'Respondido', aberto:'Aberto' };
function dataBonita(v){
  if(!v) return '';
  const d = new Date(v);
  if(!isNaN(d)) return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
  return esc(v);
}
function idadeDias(v){ const d = new Date(v); return isNaN(d) ? 0 : (Date.now() - d.getTime())/864e5; }

let TICKETS = [];

/* Teto da lista de chamados antigos. Dois botões de propósito: "mais 20" para quem
   está lendo, "todos" para quem vai usar Ctrl+F ou imprimir. Os abertos não passam
   por aqui: quem tem chamado em aberto veio ver justamente esse. */
const PASSO = 20;
let ANTIGOS = [], TETO_ANTIGOS = PASSO;
function rodapeLista(mostrados, total){
  if(total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todos os ${total}</button>
  </div>`;
}
function desenharAntigos(){
  const body = document.getElementById('antigos-body'); if(!body) return;
  const n = Math.min(TETO_ANTIGOS, ANTIGOS.length);
  body.innerHTML = ANTIGOS.slice(0, n).map(cardTicket).join('') + rodapeLista(n, ANTIGOS.length);
  /* Redesenhar troca os cartões: quem pode ser cancelado tem de reganhar o botão. */
  body.querySelectorAll('.btn-cancelar').forEach(b=> b.addEventListener('click', ()=> pedirCancelamento(b)));
  const mais = body.querySelector('.btn-mais');
  if(mais) mais.addEventListener('click', ()=>{ TETO_ANTIGOS += PASSO; desenharAntigos(); });
  const todos = body.querySelector('.btn-todos');
  if(todos) todos.addEventListener('click', ()=>{ TETO_ANTIGOS = ANTIGOS.length; desenharAntigos(); });
}

function cardTicket(t){
  const cls = classeStatus(t.status);
  const rotStatus = ROT_STATUS[cls] || 'Aberto';
  const area = AREA_LABEL[(t.area||'').toLowerCase()] || (t.area||'—');
  const tipo = TIPO_LABEL[(t.tipo||'').toLowerCase()] || t.tipo || '';
  const podeCancelar = (cls==='aberto' || cls==='respondido') && t._row;
  return `<div class="tk ${cls==='cancelado'?'cancelada':''}" data-row="${t._row||''}">
    <div class="top">
      <span class="area">${esc(area)}</span>
      <span class="badge ${cls}">${rotStatus}</span>
      <span class="data">${dataBonita(t.timestamp)}</span>
    </div>
    <h2>${esc(t.assunto || tipo || 'Chamado')}</h2>
    ${t.solicitante ? `<div class="quem">Aberto por <b>${esc(t.solicitante)}</b></div>`:''}
    ${tipo && t.assunto ? `<div class="msg" style="font-size:var(--fs-2);color:var(--muted);margin-bottom:6px">${esc(tipo)}</div>`:''}
    <div class="msg">${esc(t.mensagem||'')}</div>
    ${t.anexo ? `<a class="tk-anexo" href="${esc(t.anexo)}" target="_blank" rel="noopener">📎 Ver anexo</a>`:''}
    ${t.resposta ? `<div class="resp"><div class="lbl">Resposta da back4you</div><div class="txt">${esc(t.resposta)}</div></div>`:''}
    ${podeCancelar ? `<div class="tk-acoes"><button type="button" class="btn-cancelar" data-row="${t._row}">Cancelar chamado</button></div>`:''}
  </div>`;
}

function render(tickets){
  TICKETS = tickets || [];
  const app = document.getElementById('app');
  if(!TICKETS.length){
    app.innerHTML = `
      <div id="tarja-slot"></div>
      <div class="cab"><h1>Meus chamados</h1><p>Aqui ficam todas as solicitações que você abriu, de qualquer área.</p></div>
      <div class="state" style="min-height:34vh">
        <h1>Nenhum chamado ainda</h1>
        <p>Quando você abrir um chamado por qualquer painel, ele aparece aqui com o andamento.</p>
        <a class="cta" href="#" onclick="window.B4U&&window.B4U.abrirChamado({});return false;">Abrir um chamado</a>
      </div>`;
    return;
  }
  // "antigos" = já tratados (concluído/cancelado ou respondido) e com mais de 30 dias
  const ehTratado = t => { const c = classeStatus(t.status); return c==='concluido' || c==='cancelado' || !!t.resposta; };
  const antigos = TICKETS.filter(t => ehTratado(t) && idadeDias(t.timestamp) > 30);
  const recentes = TICKETS.filter(t => !(ehTratado(t) && idadeDias(t.timestamp) > 30));

  app.innerHTML = `
    <div id="tarja-slot"></div>
    <div class="cab"><h1>Meus chamados</h1><p>${recentes.length} chamado(s) em aberto ou recentes. Retornamos em até 48h úteis; respostas aparecem abaixo de cada um.</p></div>
    <div id="lista">${recentes.map(cardTicket).join('') || '<div class="state" style="min-height:20vh"><p>Nenhum chamado recente — os anteriores estão em “Chamados antigos”.</p></div>'}</div>
    ${antigos.length ? `
      <div class="antigos">
        <button type="button" class="antigos-btn" id="antigos-btn" aria-expanded="false">
          Chamados antigos<span class="conta">${antigos.length}</span><span class="seta">▾</span>
        </button>
        <div class="antigos-body" id="antigos-body"></div>
      </div>`:''}`;

  const ab = document.getElementById('antigos-btn');
  if(ab) ab.addEventListener('click', ()=>{
    const body = document.getElementById('antigos-body');
    const open = body.classList.toggle('on');
    ab.setAttribute('aria-expanded', open?'true':'false');
  });
  app.querySelectorAll('.btn-cancelar').forEach(b=> b.addEventListener('click', ()=> pedirCancelamento(b)));
  /* Depois do bind acima, para os antigos ligarem os seus próprios botões uma vez só. */
  ANTIGOS = antigos; TETO_ANTIGOS = PASSO;
  desenharAntigos();
}

/** Confirmação inline (sem popup nativo) antes de cancelar. */
function pedirCancelamento(btn){
  const acoes = btn.closest('.tk-acoes');
  const row = btn.dataset.row;
  acoes.innerHTML = `<span class="confirma">Cancelar mesmo este chamado?
    <button type="button" class="sim">Sim, cancelar</button>
    <button type="button" class="nao">Voltar</button></span>`;
  acoes.querySelector('.nao').addEventListener('click', ()=>{
    acoes.innerHTML = `<button type="button" class="btn-cancelar" data-row="${row}">Cancelar chamado</button>`;
    acoes.querySelector('.btn-cancelar').addEventListener('click', e=> pedirCancelamento(e.target));
  });
  acoes.querySelector('.sim').addEventListener('click', ()=> cancelarChamado(row, acoes));
}

async function cancelarChamado(row, acoes){
  acoes.innerHTML = `<span class="confirma">Cancelando…</span>`;
  const { id, codigo } = getIdCodigo();
  try{
    const d = await jsonp(API_URL+'?id='+encodeURIComponent(id)+'&codigo='+encodeURIComponent(codigo)+'&acao=cancelar_ticket&linha='+encodeURIComponent(row));
    if(d.erro) throw new Error(d.erro);
    // recarrega a lista para refletir o novo status
    const r = await jsonp(API_URL+'?id='+encodeURIComponent(id)+'&codigo='+encodeURIComponent(codigo)+'&tipo=meus_tickets');
    // o cache tem de acompanhar: senão o F5 traz o chamado cancelado de volta "aberto"
    if(window.B4U && B4U.cacheGravar) B4U.cacheGravar('tickets', id, { tickets:r.tickets||[], _ts:Date.now() });
    render(r.tickets || []);
  }catch(e){
    /* O chamado continua como estava — dizer isso é o que ele precisa saber. O motivo
       técnico da falha é assunto nosso e nunca entra nesta faixa. */
    acoes.innerHTML = `<span class="confirma" style="color:#8B2E22">Não consegui cancelar agora — o chamado continua aberto. Tente de novo em alguns minutos.</span>`;
  }
}

function erro(e){
  // Sem login (sem id/codigo) -> volta para o index. Com id+codigo -> mensagem padrão, sem redirecionar.
  var ic=getIdCodigo(), id=ic.id, codigo=ic.codigo;
  if(!id||!codigo){ location.replace('index.html'+(id?('#'+id+(codigo?'-'+codigo:'')):(location.hash||''))); return; }
  /* Uma mensagem só, igual em todo o painel. Texto de exceção, nome de aba e afins são
     vocabulário nosso: na tela do cliente viram susto e ligação para o atendimento.
     A única exceção é o acesso vencido ou inválido — não é falha do sistema e o conserto
     está na mão dele, então continua sendo dito com todas as letras. */
  var m = String((e && e.message) || e || '');
  var op = /restrito|acesso|c[oó]digo|senha/i.test(m)
    ? { titulo: 'Este link não está mais valendo',
        texto:  'Peça um novo acesso para a gente que reenviamos na hora.' }
    : null;
  /* A espera liga sozinha no DOMContentLoaded, pelo atributo do <body>: se o erro
     aparecer antes disso, o overlay subiria por cima da mensagem e a esconderia. */
  if (document.body) document.body.removeAttribute('data-b4u-espera');
  /* Pinta dentro do #app, não no <body>: assim a barra do topo continua na tela e ele
     segue com o botão de WhatsApp e o caminho de volta ao início à mão. */
  var alvo = document.getElementById('app') || document.body;
  if (window.B4UEspera) B4UEspera.telaErro(alvo, op);
  else alvo.innerHTML =
      '<div class="state"><h1>'+(op ? op.titulo : 'Não conseguimos carregar as informações')+'</h1>'
    + '<p>'+(op ? op.texto : 'Houve um erro ao recuperar as informações. Tente novamente em '
    + 'alguns minutos. Se o problema continuar, entre em contato com o atendimento.')+'</p></div>';
}

/* A espera agora é do b4u-espera.js: uma barra que anda até o dado chegar. As frases
   que ficavam aqui avisavam que estava demorando, e quem lê isso entende "vai dar
   errado" e recarrega a página justamente quando a resposta já vinha a caminho.
   Os dois nomes continuam: há chamadas espalhadas por toda a página. */
function comecarEspera(){ if (window.B4UEspera) B4UEspera.iniciar({ perfil:'cliente' }); }
function pararEspera(){ if (window.B4UEspera) B4UEspera.concluir(); }

/* Tarja discreta do cache: diz que o que está na tela veio do último acesso. */
function tarja(texto, falhou){
  const slot = document.getElementById('tarja-slot'); if(!slot) return;
  slot.innerHTML = texto ? `<div class="tarja-atualizando${falhou?' falhou':''}">${esc(texto)}</div>` : '';
}
function horaCache(ts){ return ts ? new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : 'antes'; }

/* Mapa de áreas que o cliente tem, na MESMA fonte que a barra do topo usa
   (b4u_disp_<id>, gravado só pela home): o menu lateral não pode oferecer uma porta
   que ele não consegue abrir. Sem o registro — primeira visita, antes de a home
   responder — devolve null, e aí o menu mostra tudo, que é o comportamento de hoje.
   As três linhas são cópia das do bloco compartilhado de propósito: lá elas vivem
   dentro de um IIFE e o window.B4U não as exporta. */
function areasContratadas(id){
  try{ const o=JSON.parse(localStorage.getItem('b4u_disp_'+id)||'null');
       return (o && (o.disponiveis||o)) || null; }catch(e){ return null; }
}

/* Quem está do outro lado da tela é a EMPRESA, e esta rota não traz o nome dela: o
   `tipo=meus_tickets` devolve chamados, não cadastro. Quem traz é o payload fiscal
   (`config.razao_social`), que a home guarda no cache compartilhado — a mesma saída
   que a home usa quando ainda não buscou o payload. Sem esse cache devolvemos null e
   o menu simplesmente não mostra o bloco: melhor um menu sem contexto do que um nome
   inventado na tela de quem paga a conta. */
function contextoEmpresa(id){
  try{
    const raw = (window.B4U && B4U.cacheLer) ? B4U.cacheLer('fiscal', id) : null;
    const cfg = (raw && raw.config) || {};
    const nome = String(cfg.razao_social||'').trim();
    if(!nome) return null;
    // Mesma regra do cabeçalho das irmãs: CNPJ quando há, o número do cliente quando não.
    return { rot:'Empresa', nome: esc(nome),
             sub: cfg.cnpj ? 'CNPJ '+b4uIdentHTML(cfg.cnpj,'CNPJ') : esc('cliente '+b4uTexto(id)) };
  }catch(e){ return null; }
}

(async function(){
  const { id, codigo } = getIdCodigo();
  /* O cabeçalho é estático (aparece já no esqueleto); o que depende do endereço
     entra aqui, antes da primeira pintura — sem esperar a API. */
  const volta = 'index.html' + (id ? '#'+id+(codigo?'-'+codigo:'') : '');
  const lv = document.getElementById('tk-voltar'); if(lv) lv.href = volta;
  const sub = document.getElementById('tk-sub');
  if(sub && id) sub.textContent = 'Meus chamados · cliente ' + id;

  /* erro() já tira a tela de espera da frente: não precisa encerrá-la antes. */
  if(!id || !codigo){ return erro(new Error('acesso: informe o ID e o código no final do endereço.')); }

  /* Menu lateral: navegação ENTRE páginas, e só isso. Montado AQUI, antes da busca,
     porque a identidade já está no endereço e não depende da API — se a busca falhar,
     o erro pinta dentro do #app com o menu inteiro de pé, pela mesma razão de o erro
     nunca ser pintado no <body>. Depois do desvio acima de propósito: sem id/código a
     página vai embora para a home, e montar um menu para ela seria trabalho jogado
     fora. A identidade viaja como hash, igual ao "← Voltar ao início" logo acima —
     a query vem antes do '#', nunca depois, senão vira parte do fragmento e contamina
     o código de acesso. */
  if(window.B4UShell){
    // O mesmo href que a barra já montou (com o ID no texto): o número do WhatsApp
    // continua tendo um dono só, e é o bloco compartilhado.
    const wa = document.querySelector('.b4u-bar .b4u-btn.wa');
    B4UShell.montar({
      perfil: 'cliente',
      ativo: 'tickets',
      contexto: contextoEmpresa(id),
      link: pag => pag + (id ? '#'+id+(codigo?'-'+codigo:'') : ''),
      disp: areasContratadas(id),
      wa: wa ? wa.getAttribute('href') : null
    });
    /* A barra do topo perde o logo e os atalhos (agora quem os diz é o menu) e ganha
       o botão da gaveta. Quem publica a altura em --b4u-bar-h é o medirBarra(), que
       só escuta resize e load: sem este aviso o <header> continuaria grudando na
       altura antiga e abriria um vão acima do "← Voltar ao início". */
    try{ window.dispatchEvent(new Event('resize')); }catch(e){}
  }

  /* A segunda visita não recomeça do esqueleto: pintamos com a última lista (6h de
     validade) e atualizamos por baixo. Se a atualização falhar, o que está na tela
     continua — sumir com os chamados por causa de uma rede ruim assusta à toa. */
  let pintadoDoCache = false, tsCache = 0;
  if(window.B4U && B4U.cacheLer){
    const bruto = B4U.cacheLer('tickets', id);
    if(bruto && bruto.tickets && bruto.tickets.length){
      /* Encerrar a espera só DEPOIS de pintar: se o render tropeçar num cache velho,
         a barra continua correndo em vez de descobrir um esqueleto vazio.
         O overlay só nasce no DOMContentLoaded (quem o liga é o atributo do <body>) e
         esta pintura acontece antes disso: sem tirar o atributo, ele subiria por cima
         de uma lista que já está pronta na frente da pessoa. */
      try{ tsCache = bruto._ts || 0; render(bruto.tickets);
           document.body.removeAttribute('data-b4u-espera'); pararEspera();
           tarja('Atualizando…'); pintadoDoCache = true; }
      catch(err){ /* cache de outro formato: ignora e busca de novo */ }
    }
  }
  try{
    const url = API_URL + '?id='+encodeURIComponent(id)+'&codigo='+encodeURIComponent(codigo)+'&tipo=meus_tickets';
    const d = await jsonp(url);
    if(d.erro) throw new Error(d.erro);
    // a rota não carimba hora; guardamos a nossa para a tarja saber o que dizer
    if(window.B4U && B4U.cacheGravar) B4U.cacheGravar('tickets', id, { tickets:d.tickets||[], _ts:Date.now() });
    render(d.tickets || []); pararEspera(); tarja('');
  }catch(e){
    /* Sem pararEspera() aqui: se a lista do cache está na tela, a espera nem chegou a
       subir; e no caminho de erro quem tira o overlay é a própria tela de erro. */
    if(pintadoDoCache){ tarja('Não consegui atualizar agora — mostrando a lista de '+horaCache(tsCache)+'.', true); return; }
    erro(e);
  }
})();
</script>
