/* chart.js está no <head> com defer: quando pintamos do cache, o painel chega à tela
   antes de ele executar. Esperar o script é melhor do que desistir do gráfico. */
function quandoChartPronto(cb){
  if(typeof Chart!=='undefined' || document.readyState==='complete'){ cb(); return; }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',cb,{once:true}); return; }
  window.addEventListener('load',cb,{once:true});
}

/* ---- ano + competência: lembrar onde o cliente parou ---- */
function lerEscolha(id){
  try{ const s=String(localStorage.getItem('b4u_fisc_comp_'+id)||'');
    if(!s) return {ano:'',comp:''};
    const p=s.split('|');                       // formato novo "AAAA|AAAA-MM"; antigo era só "AAAA-MM"
    return p.length>1?{ano:p[0],comp:p[1]}:{ano:s.slice(0,4),comp:s};
  }catch(e){ return {ano:'',comp:''}; }
}
function gravarEscolha(id,ano,comp){ try{ localStorage.setItem('b4u_fisc_comp_'+id,(ano||'')+'|'+(comp||'')); }catch(e){} }

/* Troca o ANO das notas: novo pedido à API com &ano=AAAA. A espera é local (o seletor),
   nunca a tela inteira — o painel do ano atual continua legível enquanto o outro vem. */
async function trocarAno(M,ano){
  ano=String(ano||'').trim();
  if(!/^\d{4}$/.test(ano) || ano===ANO_SEL) return;
  if(!API_URL){ ANO_SEL=ano; render(M); return; }
  const anterior=ANO_SEL;
  esperandoAno(true,ano);
  const cache=(window.B4U&&B4U.cacheLer)?B4U.cacheLer(chaveCache(ano),IDENTIDADE.id):null;
  let doCache=null;
  if(cache){ try{ const Mc=aplicarPayload(cache,ano); if(Mc.empresa.length){ render(Mc); tarja('atualizando'); doCache=Mc; } }catch(e){} }
  try{
    const d=await jsonp(urlFiscal(IDENTIDADE.id,IDENTIDADE.codigo,ano));
    if(d.erro) throw new Error(d.erro);
    if(window.B4U&&B4U.cacheGravar) B4U.cacheGravar(chaveCache(ano),IDENTIDADE.id,d);
    const M2=aplicarPayload(d,ano);
    gravarEscolha(M2.id,ano,'');                 // ano novo: o mês volta ao padrão daquele ano
    render(M2); tarja('');
  }catch(e){
    // Com o ano pedido já na tela (veio do cache), não voltamos atrás: seria trocar o
    // painel debaixo do cliente. Só avisamos que os números podem não ser os últimos.
    if(doCache){
      tarja('falhou', new Date(doCache.atualizado_em||Date.now()).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}));
      return;
    }
    ANO_SEL=anterior;
    esperandoAno(false);
    const box=document.getElementById('ano-erro');
    if(box){ box.hidden=false; box.textContent=(window.B4U&&B4U.msgAmigavel)?B4U.msgAmigavel(e):'Não consegui buscar esse ano agora.'; }
    const sel=document.getElementById('ano'); if(sel) sel.value=anterior;
  }
}
function esperandoAno(on,ano){
  const cx=document.getElementById('ano-espera'), tx=document.getElementById('ano-espera-txt');
  const sa=document.getElementById('ano'), sc=document.getElementById('comp');
  if(cx){ cx.hidden=!on; if(tx&&on) tx.textContent='buscando '+ano+'…'; }
  if(sa) sa.disabled=!!on;
  if(sc) sc.disabled=!!on;
  const er=document.getElementById('ano-erro'); if(er&&on){ er.hidden=true; er.textContent=''; }
}
/* Tarja de "estamos atualizando": o painel na tela é do cache, os dados novos vêm a caminho. */
function tarja(modo,quando){
  const box=document.getElementById('tarja'); if(!box) return;
  if(modo==='atualizando'){ box.innerHTML='<div class="tarja-atualizando">Atualizando…</div>'; return; }
  if(modo==='falhou'){ box.innerHTML='<div class="tarja-atualizando">Não consegui atualizar agora — mostrando os dados de '+esc(quando||'antes')+'.</div>'; return; }
  box.innerHTML='';
}

/* Junta as pendências do fiscal (notas sem centro no ano; meses com lucro apurado
   sem distribuição informada), mostra um banner no topo e grava um resumo em
   localStorage para a HOME exibir o alerta com botão. */
function computarPendencias(M){
  const anoAtual=String(compDe(hoje)).slice(0,4);
  // As notas do payload são de UM ano: varremos o ano que está na tela, não outro.
  const anoVisto=ANO_SEL||anoAtual;
  let semCentroN=0;
  ['prestadas','tomadas'].forEach(tab=>{ notasDoAno_(M,anoVisto,tab).forEach(x=>{ if(semCentro(x.nf)&&!notaInativa(x.nf)) semCentroN++; }); });
  let lucroSemDist=0;
  (M.empresa||[]).forEach(r=>{ const c=String(r.competencia||''); if(c.slice(0,4)!==anoVisto) return;
    const lucro=num(getM(r,'Apuração de lucro do mês (R$)')); const div=num(getM(r,'Dividendos distribuídos (R$)'));
    if(lucro>0 && div<=0) lucroSemDist++; });
  const V=M.voc;
  const itens=[];
  if(semCentroN>0) itens.push({titulo:semCentroN+(semCentroN>1?' notas sem '+V.um:' nota sem '+V.um),
    detalhe:V.aviso, area:'fiscal', pend:true});
  if(lucroSemDist>0) itens.push({titulo:lucroSemDist+(lucroSemDist>1?' meses com lucro sem distribuição informada':' mês com lucro sem distribuição informada'),
    detalhe:'Informe quanto foi distribuído de lucros/dividendos.', area:'fiscal'});
  // banner no topo do fiscal
  const box=document.getElementById('pend-topo');
  if(box){ box.innerHTML = itens.length ? `<div class="pend-banner">
      <div class="pend-b-ico">!</div>
      <div class="pend-b-txt"><b>${itens.length>1?'Algumas pendências':'Uma pendência'} para resolver</b>
        <span>${itens.map(i=>esc(i.titulo)).join(' · ')}</span></div>
      ${semCentroN>0?`<button type="button" class="pend-b-btn" onclick="irParaPendencias()">${esc(V.acao)} ↓</button>`:''}
    </div>` : ''; }
  // Resumo para a home (mesmo domínio => localStorage compartilhado). Só quando estamos
  // olhando o ano corrente: com o cliente em 2025 este resumo apagaria o alerta de 2026.
  if(anoVisto===anoAtual){
    try{ localStorage.setItem('b4u_pend_'+M.id, JSON.stringify({itens:itens, ts:Date.now()})); }catch(e){}
  }
}
function toggleTabs(){ document.getElementById('tab-prest').classList.toggle('on',NF_TAB==='prestadas'); document.getElementById('tab-tom').classList.toggle('on',NF_TAB==='tomadas'); }

/** Imposto CHEIO do mês (antes da retenção) = a pagar + retido. Não usamos a coluna
    "Devido" da planilha porque ela ignora parcelas que entram no "a pagar" (o adicional
    de IRPJ, por exemplo): na tela a conta "imposto do mês − já retido = sobra para
    pagar" tem de fechar sempre, senão o cliente refaz a subtração e desconfia. */
function devidoDe(M,r,t){ return num(getM(r,t.pag)) + (t.ret?num(getM(r,t.ret)):0); }

function pintarMes(M,comp){
  const de=document.getElementById('div-editor'); if(de){ de.innerHTML=''; de.dataset.open=''; } // fecha o editor de dividendos ao trocar de mês
  const r=M.porComp[comp]; const i=M.empresa.findIndex(x=>x.competencia===comp); const ant=i>0?M.empresa[i-1]:null;
  const tot=num(getM(r,'Total (R$)')), imp=M.impostos(r), ret=M.retido(r), liq=num(getM(r,'Resultado Líquido (R$)'));
  const carga=tot?imp/tot:0; const totAnt=ant?num(getM(ant,'Total (R$)')):null; const dif=(ant&&totAnt)?(tot/totAnt-1):null; const nfs=num(getM(r,'Nº NFs'));

  desenharGuiasDoMes(M,comp);

  // tributos visíveis: regime + "vazio some"
  const visiveis=M.tribs.filter(t=>temMetrica(r,t.pag));
  const dev=visiveis.reduce((s,t)=>s+devidoDe(M,r,t),0);
  /* O maior número da página era o FATURAMENTO, sem rótulo, logo abaixo de "os impostos
     desta competência vencem em…" — o cliente lia R$ 241 mil e achava que ia pagar isso.
     Agora o número grande é o imposto do mês, e o faturamento vira linha de apoio. */
  document.getElementById('hero').innerHTML=`<div class="hero">
    <div class="hero-main"><span class="lbl">Total de impostos de ${esc(mesNome(comp))}</span>
      <div class="hero-v num">${brl2(dev)}</div>
      <p class="hero-sub">Sobre o que você faturou em ${esc(mesNome(comp))}. As guias vencem a partir de ${esc(mesNome(mesSeguinteComp(comp)))}.</p>
      <div class="hero-apoio">
        <span>A pagar (já descontado o que foi retido): <b>${brl(imp)}</b></span>
        <span>Faturamento do mês: <b>${brl(tot)}</b> · ${nfs} ${nfs===1?'nota':'notas'}${dif===null?'':`<span class="selo ${dif>=0?'up':'down'}">${dif>=0?'+':''}${(dif*100).toFixed(1).replace('.',',')}% que em ${esc(mesNome(ant.competencia))}</span>`}</span>
      </div>
    </div>
    <div class="card relacao"><div class="relacao-head"><h2>Impostos de ${esc(mesNome(comp))}</h2></div>
      <div class="table-scroll"><table class="imp"><thead><tr><th>Tributo</th><th>Imposto do mês</th>${M.reg.retencao?'<th>Já retido por quem te pagou</th>':''}<th>Sobra para você pagar</th></tr></thead>
      <tbody>${visiveis.map(t=>`<tr><td>${t.n}</td><td class="num" data-c="Imposto do mês">${brl(devidoDe(M,r,t))}</td>${M.reg.retencao?`<td class="num" data-c="Já retido">${t.ret?brl(num(getM(r,t.ret))):'—'}</td>`:''}<td class="num" data-c="Sobra para pagar">${brl(num(getM(r,t.pag)))}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="num" data-c="Imposto do mês">${brl(dev)}</td>${M.reg.retencao?`<td class="num" data-c="Já retido">${brl(ret)}</td>`:''}<td class="num" data-c="Sobra para pagar">${brl(imp)}</td></tr></tfoot></table></div>
      <a class="btn" href="#rateio">Ver ${esc(M.voc.titulo.toLowerCase())} ↓</a></div></div>`;

  const prov=provisaoDoMes(M,comp);
  const lucroAp=num(getM(r,'Apuração de lucro do mês (R$)'));
  const divid=num(getM(r,'Dividendos distribuídos (R$)'));
  const semDiv = lucroAp>0 && divid<=0;
  document.getElementById('tiles').innerHTML=`<div class="tiles">
    ${M.reg.retencao?`<div class="card tile"><span class="lbl">Retido na fonte</span><div class="v num">${brl(ret)}</div><div class="s">${ret?'já pago por quem te contratou':'nenhuma retenção no mês'}</div></div>`:''}
    <div class="card tile"><span class="lbl">Carga efetiva</span><div class="v num">${pct(carga)}</div><div class="s">sobre o faturamento bruto</div></div>
    <div class="card tile"><span class="lbl">Resultado líquido</span><div class="v num" style="color:#0C756F">${brl(liq)}</div><div class="s">depois dos impostos</div></div>
    <button type="button" id="card-div" class="card tile card-click${semDiv?' div-alerta':''}"><span class="lbl">Dividendos distribuídos</span><div class="v num">${divid>0?brl(divid):'—'}</div><div class="s">${semDiv?'⚠ nenhuma distribuição informada':(divid>0?('de '+brl(lucroAp)+' de lucro apurado'):'nenhum valor informado')}</div><span class="tile-cta">${divid>0?'Editar distribuição':'Informar distribuição'} →</span></button></div>`;
  const cd=document.getElementById('card-div'); if(cd) cd.addEventListener('click',()=>abrirEditorDividendos(M,comp));

  /* "Provisão" é palavra de contador. O que o cliente precisa saber é que este dinheiro
     não é dele: tem de ficar guardado até a data da guia do trimestre. */
  document.getElementById('prov').innerHTML=prov?(()=>{ const dias=prov.venc?Math.round((dParse(prov.venc)-hoje)/864e5):null;
    const dataExt=prov.venc?dParse(prov.venc).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}):'';
    const quando=prov.venc?('vence em '+dataExt+(dias===null?'':(dias>1?' · faltam '+dias+' dias':(dias===1?' · falta 1 dia':(dias===0?' · é hoje':' · já venceu'))))):'ainda sem data de guia';
    return `<div class="card prov-compact"><div class="prov-compact-head"><span class="lbl">Guarde este valor: imposto do trimestre (IRPJ + CSLL)</span>
      <span class="prov-compact-venc">${esc(quando)}</span></div>
      <div class="prov-compact-meses">${prov.meses.map(x=>`<div class="pmes ${x.apurado?'':'futuro'}"><span class="pmes-label">${capitaliza(mesNome(x.comp))} · ${x.apurado?'já apurado':'ainda é estimativa'}</span><span class="pmes-v num ${x.apurado?'':'est'}">${brl(x.v)}</span></div>`).join('')}</div>
      <div class="prov-compact-total"><span>Total do ${prov.tri}º trimestre de ${prov.ano}</span><b class="num">${brl(prov.total)}</b></div></div>`; })():'';

  desenharRateio(M,comp,tot);
  NF_TETO=PASSO;                                  // mês novo, lista nova: o teto volta ao início
  desenharNotas(M,comp);
  IND_SUJO=true;                                  // o bloco de indicadores só é remontado quando aberto
  const detInd=document.getElementById('bloco-ind');
  if(detInd&&detInd.open) pintarIndicadores(M,comp);

  pintarGraficosDoMes(M,comp);
}

/** Parte gráfica do mês (roda depois da primeira pintura, e a cada troca de mês). */
function pintarGraficosDoMes(M,comp){
  if(!CHARTS) return;
  const r=M.porComp[comp]; const imp=M.impostos(r);
  const visiveis=M.tribs.filter(t=>temMetrica(r,t.pag));
  CHARTS.c1.data.datasets[0].backgroundColor=M.empresa.map(r2=>r2.competencia===comp?PAL.iss:'#D9CDBB'); CHARTS.c1.update('none');
  CHARTS.c3.data.labels=visiveis.map(t=>t.n); CHARTS.c3.data.datasets[0].data=visiveis.map(t=>num(getM(r,t.pag)));
  CHARTS.c3.data.datasets[0].backgroundColor=visiveis.map(t=>t.c);
  document.getElementById('c3sub').textContent=mesNome(comp)+' · total '+brl(imp);
  document.getElementById('c3-lg').innerHTML=visiveis.map(t=>`<div class="pie-legend-row"><i class="sw" style="background:${t.c}"></i><span>${t.n}</span><b class="num">${brl(num(getM(r,t.pag)))}</b></div>`).join('');
  // Rosca de uma fatia só não é gráfico — é um círculo. Com um tributo, fica a linha de texto.
  const cx=document.getElementById('cbox-c3'); if(cx) cx.style.display=visiveis.length>=2?'':'none';
  if(visiveis.length>=2) CHARTS.c3.update();
}

/* Guias que rateiam por centro (aparecem em "Guias do mês", clicáveis). As demais
   (INSS, FGTS, IRRF sobre dividendos — não proporcionais à receita) vão para "Outras guias". */
const GUIA_RATEAVEL=new Set(['ISS a Pagar (R$)','PIS a pagar (R$)','COFINS a pagar (R$)','CSLL a pagar (R$)','IR a pagar (R$)',
  'TOMADAS: ISS a pagar (R$)','TOMADAS: PIS a pagar (R$)','TOMADAS: COFINS a pagar (R$)','TOMADAS: CSLL a pagar (R$)','TOMADAS: IR a pagar (R$)',
  'IRRF Dividendos (R$)','DAS a Pagar (R$)']);   // IRRF e DAS rateiam por centro
function guiaEhRateavel(reg){ const f=String((reg||{}).metrica_fonte||'').trim(); if(!f) return false;
  return f.split('|').map(s=>s.trim()).filter(Boolean).every(k=>GUIA_RATEAVEL.has(k)); }
function corDaCategoria(cat){ cat=String(cat||'').toLowerCase();
  if(cat.indexOf('pessoal')>-1) return PAL.inss; if(cat.indexOf('federal')>-1) return PAL.irpj; return PAL.couro; }

/** Quebra o valor de uma guia por centro, somando os mesmos meses que valorDe usaria
    (respeita acumula_meses, ex.: o trimestre do IRPJ), a partir do rateio autoritativo. */
function detalheGuiaPorCentro(M,item){
  const reg=M.regraDe[item.id_regra]||{}; const fonte=String(reg.metrica_fonte||'').trim(); if(!fonte) return [];
  const chaves=fonte.split('|').map(s=>s.trim()).filter(Boolean); const n=Math.max(1,num(reg.acumula_meses)||1);
  const ref=String(item.competencia_ref||''); if(!/^\d{4}-\d{2}$/.test(ref)) return [];
  const [a,m]=ref.split('-').map(Number); const porCentro={};
  for(let i=0;i<n;i++){ const c=compDe(new Date(a,m-1-i,1));
    rateioParaComp(M,c).forEach(x=>{ if(!x.centro) return; const v=chaves.reduce((s,k)=>s+num(x[k]),0); porCentro[x.centro]=(porCentro[x.centro]||0)+v; }); }
  return Object.entries(porCentro).map(([centro,v])=>({centro,v:Math.round(v*100)/100})).filter(x=>x.v>0.004).sort((a,b)=>b.v-a.v);
}

function desenharGuiasDoMes(M,comp){
  const itens=M.cal.filter(c=>c.competencia_ref===comp).map(c=>({...c,...M.valorDe(c)}));
  const fiscais=itens.filter(it=>guiaEhRateavel(M.regraDe[it.id_regra])).sort((a,b)=>b.v-a.v);
  const outras=itens.filter(it=>!guiaEhRateavel(M.regraDe[it.id_regra]) && it.v>0 && String((M.regraDe[it.id_regra]||{}).periodicidade)!=='Anual').sort((a,b)=>b.v-a.v);

  const V=M.voc;
  const box=document.getElementById('guias-mes');
  /* "Fechada" era lido como "já paga". O rótulo agora fala do VALOR, não do pagamento —
     e a legenda diz, sem rodeio, que marcar pagamento é na agenda. */
  box.innerHTML=fiscais.length?`<div class="card guias-card"><div class="relacao-head"><h2>Guias de ${esc(mesNome(comp))}</h2><span class="head-nota">quanto é de cada ${esc(V.um)}: toque em "ver a divisão"</span></div>
    ${fiscais.map(it=>{ const status=it.v<=0?'aberto':(it.est?'estimativa':'fechada'); const rot={fechada:'Valor final',estimativa:'Ainda é estimativa',aberto:'Sem valor ainda'}[status];
      const det=it.v>0?detalheGuiaPorCentro(M,it):[];
      return `<div class="guia-row"><div class="guia-main"><span class="guia-status status-${status}">${rot}</span><span class="guia-nome">${esc(it.descricao)}</span>
        <span class="guia-valor num ${status==='estimativa'?'estimativa':''}">${it.v>0?brl(it.v):'—'}${status==='estimativa'?' (est.)':''}</span>
        ${det.length?`<button class="guia-toggle" onclick="const d=this.closest('.guia-row').querySelector('.guia-detalhe');const a=d.classList.toggle('aberto');this.classList.toggle('on',a);this.firstChild.textContent=a?'ocultar':'ver a divisão'"><span>ver a divisão</span><span class="car">▾</span></button>`:''}</div>
        ${det.length?`<div class="guia-detalhe">${det.map(d=>`<div class="guia-detalhe-row"><span>${esc(d.centro)}</span><b class="num">${brl(d.v)}</b></div>`).join('')}</div>`:''}</div>`;}).join('')}
    <p class="guias-nota">Nenhuma guia desta lista está paga — aqui só mostramos o valor. Marcar como agendada ou paga é na <b>Agenda de pagamentos</b>.</p></div>`:'';

  const ob=document.getElementById('outras');
  ob.innerHTML=outras.length?`<div class="card outras"><h4>Outras guias de ${esc(mesNome(comp))}</h4><div class="lbl" style="margin:-4px 0 8px;text-transform:none;letter-spacing:0">não entram na divisão por ${esc(V.um)} (folha e retenções)</div>
    ${outras.map(it=>`<div class="outras-row"><i class="sw" style="background:${corDaCategoria(it.categoria)}"></i><span>${esc(it.descricao)}</span><b class="num">${brl(it.v)}</b></div>`).join('')}</div>`:'';
}

let RAT_ULT={linhas:[],tot:0};      // último rateio pintado (o gráfico é desenhado depois do texto)
function desenharRateio(M,comp,tot){
  const V=M.voc;
  const linhas=rateioParaComp(M,comp).filter(x=>num(x['Total (R$)'])>0||num(x['Nº NFs'])>0||M.impostos(x)>0)
    .sort((a,b)=>num(b['Total (R$)'])-num(a['Total (R$)']));
  RAT_ULT={linhas,tot};
  const tb=document.querySelector('#rat tbody');
  tb.innerHTML=linhas.map(x=>{ const nid=x.centro==='Não identificado'; const t=num(x['Total (R$)']); const sh=tot?t/tot:0;
    return `<tr class="${nid?'nid':''}"${nid?` onclick="irParaPendencias()" style="cursor:pointer" title="Ver as notas que faltam definir"`:''}><td><b style="font-weight:${nid?800:600}">${esc(x.centro)}${nid?` <span style="font-weight:600;text-decoration:underline;color:var(--alerta)">${esc(V.acao.toLowerCase())} ↓</span>`:''}</b><div class="share"><i style="width:${(sh*100).toFixed(1)}%"></i></div></td>
      <td class="r num">${x['Nº NFs']}</td><td class="r num">${brl(t)}<div style="font-size:var(--fs-1);color:var(--muted)">${pct(sh)}</div></td>
      <td class="r num">${brl(M.impostos(x))}</td>${M.reg.retencao?`<td class="r num">${brl(M.retido(x))}</td>`:''}<td class="r num">${brl(num(x['Resultado Líquido (R$)']))}</td></tr>`;
  }).join('')||`<tr><td colspan="6" style="color:var(--muted)">${esc(V.vazio)} neste mês.</td></tr>`;

  const nidRow=linhas.find(x=>x.centro==='Não identificado'); const shareNid=nidRow&&tot?num(nidRow['Total (R$)'])/tot:0;
  const nReais=linhas.filter(x=>x.centro!=='Não identificado').length;
  document.getElementById('rat-sub').textContent=`${nReais} ${nReais===1?V.um:V.um+'s'} com nota em ${mesNome(comp)}.`;
  document.getElementById('alerta').innerHTML=shareNid>0.001?`<div class="alert clicavel" role="button" tabindex="0" onclick="irParaPendencias()" onkeydown="if(event.key==='Enter')irParaPendencias()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.5 15 14H1L8 1.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6v3.5M8 11.5v.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <div><b>${pct(shareNid)} do que você faturou em ${esc(mesNome(comp))} ainda não tem ${esc(V.um)} definido.</b>
      ${esc(V.aviso)} <span style="font-weight:600;text-decoration:underline">${esc(V.acao)} ↓</span></div></div>`:'';

  pintarGraficoRateio(M);
}
/** Anel de participação + legenda (cor SEMPRE pela posição do centro, igual aos chips). */
function pintarGraficoRateio(M){
  if(!CHARTS) return;
  const {linhas}=RAT_ULT;
  document.getElementById('c5-lg').innerHTML=linhas.map(x=>`<div class="pie-legend-row"><i class="sw" style="background:${centroCor(M,x.centro)}"></i><span>${esc(x.centro)}</span><b class="num">${brl(num(x['Total (R$)']))}</b></div>`).join('');
  // Uma fatia só não é anel: a lista de valores acima já diz tudo.
  const cx=document.getElementById('cbox-c5'); if(cx) cx.style.display=linhas.length>=2?'':'none';
  if(linhas.length<2) return;
  CHARTS.c5.data.labels=linhas.map(x=>x.centro); CHARTS.c5.data.datasets[0].data=linhas.map(x=>num(x['Total (R$)']));
  CHARTS.c5.data.datasets[0].backgroundColor=linhas.map(x=>centroCor(M,x.centro)); CHARTS.c5.update();
}

/* ---- Notas do mês + editor de centro ---- */
function centroCor(M,centro){ if(centro==='Não identificado') return PAL.vinho;
  const reais=(M.centros||[]).filter(c=>c!=='Não identificado'); const i=reais.indexOf(centro);
  return CENTRO_PAL[(i<0?0:i)%CENTRO_PAL.length]; }
function chipsCentro(M,nf){
  const V=M.voc, dica='Ver as notas que faltam definir';
  const w=pesosNF(nf); const ent=Object.entries(w).filter(([,p])=>p>0.0005).sort((a,b)=>b[1]-a[1]);
  if(!ent.length) return `<span class="chip-c nid" onclick="irParaPendencias()" style="cursor:pointer" title="${esc(dica)}">${esc(V.vazio)}</span>`;
  return ent.map(([c,p])=>{ const nid=c==='Não identificado';
    return `<span class="chip-c ${nid?'nid':''}"${nid?` onclick="irParaPendencias()" style="cursor:pointer" title="${esc(dica)}"`:''}><i class="sw" style="background:${centroCor(M,c)}"></i>${esc(c)} · ${pct(p)}</span>`; }).join('');
}
function semCentro(nf){ const w=pesosNF(nf); return (w['Não identificado']||0)>0.005; }
function notaInativa(nf){ return !!(nf && (nf.ativa===false || /cancel|substit/i.test(nf.situacao||''))); }

function notasDoAno_(M,ano,tab){
  const out=[];
  Object.keys(M.nfs||{}).forEach(c=>{ if(String(c).slice(0,4)!==String(ano)) return;
    ((M.nfs[c]||{})[tab]||[]).forEach((nf,oi)=>out.push({nf,oi,comp:c})); });
  return out;
}

function desenharNotas(M,comp){
  const prest=NF_TAB==='prestadas';
  const ano=String(comp).slice(0,4);
  const anoMode=NF_ANO;                                   // busca/lista em todas as competências do ano
  let todas;
  if(anoMode) todas=notasDoAno_(M,ano,NF_TAB).sort((a,b)=>String(a.comp).localeCompare(b.comp)||(''+a.nf.nf).localeCompare(''+b.nf.nf));
  else { const pack=M.nfs[comp]||{prestadas:[],tomadas:[]}; todas=(pack[NF_TAB]||[]).map((nf,oi)=>({nf,oi,comp})); }
  const nPend=todas.filter(x=>semCentro(x.nf) && !notaInativa(x.nf)).length;
  let lista=todas;
  if(NF_PEND) lista=lista.filter(x=>semCentro(x.nf) && !notaInativa(x.nf));
  // busca sem acento: "joao" acha "João"
  if(NF_BUSCA) lista=lista.filter(x=>normTxt(x.nf.nf+' '+x.nf.contraparte+' '+(x.nf.tipo||'')+' '+(x.nf.descricao||'')+' '+(x.nf.observacao||'')).includes(NF_BUSCA));
  lista=ordenarNotas(lista);

  const V=M.voc;
  const escopo=anoMode?`no ano de ${ano}`:('em '+mesNome(comp));
  // A contagem fica na régua, em texto, mesmo com a tabela cortada em 20: é o que
  // permite recolher os filtros sem esconder pendência.
  document.getElementById('nf-resumo').innerHTML=`${lista.length===todas.length?todas.length:lista.length+' de '+todas.length} notas que você ${prest?'emitiu':'recebeu'} ${escopo}${nPend?` · <b style="color:var(--sinal-txt)">${nPend} sem ${esc(V.um)}</b>`:''}`;
  const pb=document.getElementById('nf-pend'); pb.classList.toggle('on',NF_PEND); pb.textContent=NF_PEND?'Mostrar todas':('Só as sem '+V.um);
  const ab=document.getElementById('nf-ano'); if(ab){ ab.classList.toggle('on',NF_ANO); ab.textContent=NF_ANO?'Só este mês':'No ano todo'; }
  if(FILTROS_UI) FILTROS_UI.atualizarContador();

  const thead=document.querySelector('#nf-tabela thead');
  const th=(campo,rot,cls)=>{
    const on=NF_ORD.campo===campo;
    const seta=on?(NF_ORD.dir>0?'▲':'▼'):'↕';
    return `<th class="ord${on?' on':''}${cls?' '+cls:''}" data-ord="${campo}" role="button" tabindex="0"
      aria-sort="${on?(NF_ORD.dir>0?'ascending':'descending'):'none'}" title="Ordenar por ${esc(rot)}">${esc(rot)}<span class="seta">${seta}</span></th>`;
  };
  thead.innerHTML=`<tr><th>NF</th>${th('data',anoMode?'Mês':'Data')}${th('nome',prest?'Cliente':'Fornecedor')}${th('valor','Valor','r')}<th>${esc(V.um.charAt(0).toUpperCase()+V.um.slice(1))}</th><th class="r"></th></tr>`;
  thead.querySelectorAll('th.ord').forEach(h=>{
    const trocar=()=>{ const c=h.dataset.ord;
      if(NF_ORD.campo===c){ NF_ORD.dir=-NF_ORD.dir; } else { NF_ORD.campo=c; NF_ORD.dir = c==='nome' ? 1 : -1; }
      desenharNotas(M,comp); };
    h.addEventListener('click',trocar);
    h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); trocar(); } });
  });
  const tb=document.querySelector('#nf-tabela tbody');
  const mais=document.getElementById('nf-mais');
  if(!lista.length){ const onde=anoMode?' no ano.':' neste mês.';
    if(mais) mais.innerHTML='';
    tb.innerHTML=`<tr><td colspan="6" style="color:var(--muted)">${esc(NF_BUSCA?'Nenhuma nota encontrada'+onde:(NF_PEND?('Nenhuma nota sem '+V.um+onde):('Nenhuma nota '+(prest?'emitida':'recebida')+onde)))}</td></tr>`; return; }
  // Teto de 20: um mês com 100 notas despejava a lista inteira, e a tabela virava a
  // página. Os números do mês, o alerta e a busca continuam acima, sem clique.
  const total=lista.length;
  const n=Math.min(NF_TETO,total);
  const corte=lista.slice(0,n);
  tb.innerHTML=corte.map(({nf,oi,comp:c})=>{
    const gid=`${c}-${NF_TAB}-${oi}`; const inativa=notaInativa(nf); const pend=semCentro(nf)&&!inativa;
    const sit=(nf.situacao||'').trim();
    const badge=sit?`<span class="nf-sit ${/cancel/i.test(sit)?'cancel':'subst'}">${esc(sit)}${nf.substituidaPor?(' → NF '+esc(nf.substituidaPor)):''}</span>`:'';
    const temDet = !!(nf.descricao || nf.observacao);
    const dataCel = anoMode ? `<span class="nf-comp">${esc(mesLabel(c))}</span>` : esc((nf.data||'').slice(8)+'/'+(nf.data||'').slice(5,7));
    return `<tr id="nfrow-${gid}" class="${inativa?'nf-inativa':''}"><td class="num">${esc(nf.nf)}</td><td class="num">${dataCel}</td>
      <td><div class="nf-cp">${esc(nf.contraparte)}${badge}</div><div class="nf-tipo">${esc(nf.tipo||'')}</div>
        ${temDet?`<button class="nf-expand" data-exp="${gid}" aria-expanded="false"><span class="mais">＋</span> detalhes</button>
        <div class="nf-detalhe" id="det-${gid}">
          ${nf.descricao?`<div class="nf-desc"><span class="det-lbl">Descrição</span>${esc(nf.descricao)}</div>`:''}
          ${nf.observacao?`<div class="nf-obs"><span class="det-lbl">Observação</span>${esc(nf.observacao)}</div>`:''}
        </div>`:''}</td>
      <td class="r num">${brl(num(nf.valorBruto))}</td><td><div class="chips" id="chips-${gid}">${inativa?'<span style="font-size:var(--fs-1);color:var(--muted)">fora do cálculo</span>':chipsCentro(M,nf)}</div></td>
      <td class="r">${inativa?'':`<button class="btn-edit ${pend?'pend':''}" data-gid="${gid}" data-idx="${oi}" data-comp="${c}">${esc(pend?V.acao:('Trocar de '+V.um))}</button>`}</td></tr>
    <tr class="editor-row" id="editor-${gid}"><td colspan="6"></td></tr>`;
  }).join('');
  tb.querySelectorAll('.btn-edit').forEach(b=>b.addEventListener('click',()=>abrirEditor(M,b.dataset.comp,NF_TAB,+b.dataset.idx,b.dataset.gid)));
  tb.querySelectorAll('.nf-expand').forEach(b=>b.addEventListener('click',()=>{
    const det=document.getElementById('det-'+b.dataset.exp); const ab=det.classList.toggle('aberto');
    b.setAttribute('aria-expanded',ab);
  }));
  if(mais){
    mais.innerHTML=rodapeLista(n,total);
    const bm=mais.querySelector('.btn-mais');
    if(bm) bm.addEventListener('click',()=>{ NF_TETO=n+PASSO; desenharNotas(M,comp); });
    const bt2=mais.querySelector('.btn-todos');
    if(bt2) bt2.addEventListener('click',()=>{ NF_TETO=total; desenharNotas(M,comp); });
  }
}

const EDIT_STATE={};
function abrirEditor(M,comp,tab,idx,gid){
  const nf=M.nfs[comp][tab][idx]; const row=document.getElementById('editor-'+gid); const cell=row.querySelector('td');
  const aberto=row.classList.contains('aberto');
  document.querySelectorAll('.editor-row.aberto').forEach(r=>{ if(r!==row){r.classList.remove('aberto');r.querySelector('td').innerHTML='';} });
  if(aberto){ row.classList.remove('aberto'); cell.innerHTML=''; return; }
  row.classList.add('aberto');
  // estado de edição: partir do rateio atual da NF
  const w=pesosNF(nf); const bruto=num(nf.valorBruto);
  const st={ modo: Object.values(nf.centros||{}).some(v=>typeof v==='number')?'valor':'igual',
             sel:{} }; // sel[centro] = {on:bool, valor:number}
  centrosReais(M).forEach(c=>{ st.sel[c]={on:(w[c]||0)>0.0005, valor: round2((w[c]||0)*bruto)}; });
  EDIT_STATE[gid]={nf,comp,tab,idx,bruto,st,gid};
  renderEditor(M,gid);
}
function round2(v){ return Math.round(v*100)/100; }
function centrosReais(M){ return M.centros.filter(c=>c!=='Não identificado'); }
function renderEditor(M,gid){
  const E=EDIT_STATE[gid]; const {bruto,st}=E; const cell=document.getElementById('editor-'+gid).querySelector('td');
  const V=M.voc;
  const modos=[['igual','Dividir igual'],['pct','Por %'],['valor','Por valor (R$)']];
  const rows=centrosReais(M).map(c=>{ const s=st.sel[c]; const cor=centroCor(M,c);
    let inputHtml='';
    if(st.modo==='igual') inputHtml=`<span style="font-size:var(--fs-2);color:var(--muted);text-align:right">${s.on?pct(1/Math.max(1,contarOn(st))):'—'}</span>`;
    /* Campo de TEXTO com inputmode decimal, igual ao de dividendos logo acima nesta
       página: com type="number" o navegador recusa a vírgula, devolve '' e o valor
       digitado virava zero — a nota inteira ia parar em "Não identificado". */
    else if(st.modo==='pct') inputHtml=`<input class="ed-num" type="text" inputmode="decimal" data-c="${esc(c)}" data-f="pct" aria-label="Percentual de ${esc(c)}" ${s.on?'':'disabled'} value="${s.on?fmtNum(s.valor/bruto*100):''}">`;
    else inputHtml=`<input class="ed-num" type="text" inputmode="decimal" data-c="${esc(c)}" data-f="valor" aria-label="Valor de ${esc(c)}" ${s.on?'':'disabled'} value="${s.on?fmtNum(s.valor):''}">`;
    return `<div class="ed-row"><i class="sw" style="background:${cor}"></i><label><input type="checkbox" data-c="${esc(c)}" data-f="on" ${s.on?'checked':''}> ${esc(c)}</label>${inputHtml}</div>`;
  }).join('');
  const {somaValor,somaPct,estado,txt}=resumoEditor(M,gid);
  cell.innerHTML=`<div class="editor">
    <div class="editor-modos">${modos.map(([k,l])=>`<button class="tab ${st.modo===k?'on':''}" data-modo="${k}">${l}</button>`).join('')}
      <span style="flex:1"></span>
      <button class="tab" data-act="todos" title="Divide igual entre todos">Todos</button>
      <button class="tab" data-act="limpar">Limpar</button></div>
    ${rows}
    <div class="ed-foot"><span class="ed-sum ${estado}">${txt}</span>
      <div class="ed-actions"><button class="btn-ghost" data-act="cancel">Cancelar</button><button class="btn-save" data-act="save" ${estado==='err'?'disabled':''}>Salvar</button></div></div>
    <div style="font-size:var(--fs-2);color:var(--muted);margin-top:8px">Sem ninguém marcado, a nota fica <b>${esc(V.vazio.toLowerCase())}</b>. "Todos" divide igual entre todos.</div>
  </div>`;
  // listeners
  cell.querySelectorAll('[data-modo]').forEach(b=>b.addEventListener('click',()=>{ st.modo=b.dataset.modo; renderEditor(M,gid); }));
  cell.querySelector('[data-act="todos"]').addEventListener('click',()=>{ st.modo='igual'; centrosReais(M).forEach(c=>st.sel[c].on=true); renderEditor(M,gid); });
  cell.querySelector('[data-act="limpar"]').addEventListener('click',()=>{ centrosReais(M).forEach(c=>{st.sel[c].on=false;}); renderEditor(M,gid); });
  cell.querySelectorAll('input[data-f="on"]').forEach(inp=>inp.addEventListener('change',()=>{ st.sel[inp.dataset.c].on=inp.checked; renderEditor(M,gid); }));
  cell.querySelectorAll('input[data-f="pct"]').forEach(inp=>inp.addEventListener('input',()=>{ st.sel[inp.dataset.c].valor=round2((numBR(inp.value)/100)*bruto); atualizarResumo(M,gid); }));
  cell.querySelectorAll('input[data-f="valor"]').forEach(inp=>inp.addEventListener('input',()=>{ st.sel[inp.dataset.c].valor=round2(numBR(inp.value)); atualizarResumo(M,gid); }));
  cell.querySelector('[data-act="cancel"]').addEventListener('click',()=>{ document.getElementById('editor-'+gid).classList.remove('aberto'); cell.innerHTML=''; delete EDIT_STATE[gid]; });
  cell.querySelector('[data-act="save"]').addEventListener('click',()=>confirmarSalvar(M,gid));
}
function contarOn(st){ return Object.values(st.sel).filter(s=>s.on).length; }
function resumoEditor(M,gid){
  const E=EDIT_STATE[gid]; const {bruto,st}=E; const on=Object.entries(st.sel).filter(([,s])=>s.on);
  if(st.modo==='igual'){ const n=on.length; return {somaValor:bruto,somaPct:n?1:0,estado:n?'ok':'warn',
    txt:n?`Dividido igual entre ${n} · ${pct(1/n)} para cada`:('Ninguém marcado → '+M.voc.vazio.toLowerCase())}; }
  const somaValor=on.reduce((s,[,x])=>s+num(x.valor),0); const somaPct=bruto?somaValor/bruto:0; const dif=round2(bruto-somaValor);
  let estado='ok', txt=`Alocado ${brl(somaValor)} de ${brl(bruto)} · ${pct(somaPct)}`;
  if(!on.length){ estado='warn'; txt='Ninguém marcado → '+M.voc.vazio.toLowerCase(); }
  else if(somaValor-bruto>0.01){ estado='err'; txt=`Passou do valor da nota em ${brl(somaValor-bruto)}`; }
  else if(dif>0.01){ estado='warn'; txt=`Faltam ${brl(dif)} (${pct(dif/bruto)}) — o resto fica sem ${M.voc.um}`; }
  return {somaValor,somaPct,estado,txt};
}
function atualizarResumo(M,gid){ const cell=document.getElementById('editor-'+gid).querySelector('td'); const {estado,txt}=resumoEditor(M,gid);
  const sp=cell.querySelector('.ed-sum'); if(sp){ sp.className='ed-sum '+estado; sp.textContent=txt; }
  const save=cell.querySelector('[data-act="save"]'); if(save) save.disabled=(estado==='err'); }

/* monta o mapa de centros que será gravado (true = igual; número = valor absoluto) */
function montarCentrosParaSalvar(gid){
  const {bruto,st}=EDIT_STATE[gid]; const map={};
  const on=Object.entries(st.sel).filter(([,s])=>s.on);
  if(st.modo==='igual'){ on.forEach(([c])=>map[c]=true); }
  else { on.forEach(([c,s])=>{ if(num(s.valor)>0) map[c]=round2(num(s.valor)); }); }
  return map;
}
function confirmarSalvar(M,gid){
  const E=EDIT_STATE[gid]; const map=montarCentrosParaSalvar(gid); const bruto=E.bruto;
  const w=pesosNFmap(map,bruto); const ent=Object.entries(w).filter(([,p])=>p>0.0005).sort((a,b)=>b[1]-a[1]);
  const resumo=(ent.length?ent:[[M.voc.vazio,1]]).map(([c,p])=>`<div><span>${esc(c)}</span><b>${pct(p)} · ${brl(p*bruto)}</b></div>`).join('');
  document.getElementById('modal-titulo').textContent=M.voc.de+'?';
  document.getElementById('modal-texto').innerHTML=`A nota <b>${esc(E.nf.nf)}</b>, de ${brl(bruto)}, passa a ser dividida assim:`;
  document.getElementById('modal-resumo').innerHTML=resumo;
  const bg=document.getElementById('modal-bg'); bg.classList.add('on');
  const conf=document.getElementById('modal-confirmar'), canc=document.getElementById('modal-cancelar');
  const fechar=()=>{ bg.classList.remove('on'); conf.onclick=null; canc.onclick=null; };
  canc.onclick=fechar;
  conf.onclick=async()=>{ conf.disabled=true; conf.textContent='Salvando…';
    try{ await salvarCentros(M,E,map); fechar(); }
    /* O erro do sistema não vai para a tela: ele diz o que sobreviveu e o que fazer. */
    catch(err){ document.getElementById('modal-texto').innerHTML='<span style="color:var(--alerta)">Não consegui salvar essa divisão agora. Seus valores continuam na tela — tente de novo.</span>'; }
    finally{ conf.disabled=false; conf.textContent='Sim, salvar'; }
  };
}
function pesosNFmap(map,bruto){ const nomes=Object.keys(map); const t=nomes.filter(k=>map[k]===true); const nums=nomes.filter(k=>typeof map[k]==='number');
  const p={}; if(!t.length&&!nums.length){p['Não identificado']=1;return p;} t.forEach(k=>p[k]=1/t.length); nums.forEach(k=>p[k]=(p[k]||0)+(bruto?num(map[k])/bruto:0)); return p; }

async function salvarCentros(M,E,map){
  if(API_URL){
    const qs=new URLSearchParams({ id:IDENTIDADE.id, codigo:IDENTIDADE.codigo, acao:'atualizar_centro',
      competencia:E.comp, tipo_nf:E.tab, nf:E.nf.nf, centros:JSON.stringify(map) });
    const d=await jsonp(API_URL+'?'+qs.toString()); if(d.erro) throw new Error(d.erro);
    // substitui os números autoritativos desta competência pelos que o Fechamento recalculou
    if(d.rateio){ M.rateioAPI=(M.rateioAPI||[]).filter(x=>x.competencia!==E.comp).concat(d.rateio); }
    if(d.empresa){ Object.assign(M.porComp[E.comp]||{}, d.empresa); }
  }
  // aplica localmente (na demonstração é a fonte; em produção é prévia até o backend confirmar)
  E.nf.centros=map;
  const gid=E.gid||`${E.comp}-${E.tab}-${E.idx}`; const row=document.getElementById('editor-'+gid); if(row){row.classList.remove('aberto');row.querySelector('td').innerHTML='';}
  delete EDIT_STATE[gid];
  // atualiza SÓ o que depende do rateio, sem recarregar a página nem re-renderizar o painel todo
  if(E.comp===SEL){
    const r=M.porComp[E.comp]; const tot=num(getM(r,'Total (R$)'));
    desenharRateio(M,E.comp,tot);      // tabela de rateio + gráfico de participação + alerta de pendências
    desenharGuiasDoMes(M,E.comp);      // quebra "por centro" das guias
    desenharNotas(M,E.comp);           // chips e contagem de pendências
  } else {
    const chips=document.getElementById('chips-'+gid); if(chips) chips.innerHTML=chipsCentro(M,E.nf);
  }
}

/* ═══════════════════ INDICADORES (dashboards comparativos) ═══════════════════
   Bloco recolhido — o painel já é denso, então nada disto aparece sem o cliente pedir.
   Regras de gráfico aplicadas aqui:
   • NUNCA dois eixos y no mesmo gráfico. Reais e percentual viram gráficos separados
     (ou um número). Alinhar duas escalas diferentes inventa uma correlação que não existe.
   • Séries categóricas na ordem fixa já validada (SLOT). Status (bom/atenção/ruim)
     sempre com rótulo ou ícone junto — cor nunca sozinha.
   • Polaridade: a cor da seta segue o INDICADOR (faturamento subindo é bom, imposto
     subindo é ruim), não o sinal da variação.
   • Sem dado → estado vazio honesto, nunca um gráfico zerado.
   • Cada card tem "Como calculamos": a fórmula em português e os componentes com valor. */
const SLOT=['#009488','#B4530F','#6B4FA0','#7A8B3D'];
const SLOT_SOFT=['rgba(0,148,136,.34)','rgba(180,83,15,.34)'];   // mesma cor, só mais clara: destaque do mês escolhido
const AREA_SOFT='rgba(0,148,136,.14)';                            // preenchimento sob a linha do acumulado
const ST={bom:'#2E9D5F',atencao:'#E8892E',ruim:'#C0392B'};
const SIMPLES_LIMITE=4800000, SIMPLES_SUBLIMITE=3600000;   // teto e sublimite anuais (LC 123/2006)
const FONTE_IND={family:'Montserrat',size:11};
const IND={charts:null};

/* Reais abreviado para eixo/rótulo: "R$ 120 mil", "R$ 1,2 mi". Nunca notação científica. */
function brlCurto(v){
  const n=Number(v)||0, a=Math.abs(n), s=n<0?'-':'';
  const f=(x,d)=>x.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d});
  if(a>=1e9) return s+'R$ '+f(a/1e9,1)+' bi';
  if(a>=1e6) return s+'R$ '+f(a/1e6,1)+' mi';
  if(a>=1e3) return s+'R$ '+f(a/1e3,a<1e4?1:0)+' mil';
  return s+'R$ '+f(a,0);
}
const mesExtenso=c=>{const [a,m]=String(c).split('-'); return (MESES_L[+m-1]||'')+' de '+a;};
const compMenos=(c,k)=>{const [a,m]=String(c).split('-').map(Number); return compDe(new Date(a,m-1-k,1));};
const ehSimples=M=>/simples/i.test(String((M.cfg||{}).regime||''));
const ppTxt=d=>(Math.abs(d)*100).toFixed(1).replace('.',',')+' p.p.';
const relTxt=d=>(Math.abs(d)*100).toFixed(1).replace('.',',')+'%';

/** Um mês do painel virado indicador. Mês sem fechamento vira null (não zero):
    "zero" e "ainda não fechamos" são coisas diferentes e não podem virar a mesma barra. */
function linhaInd(M,c){
  const r=M.porComp[c];
  const receita=r?num(getM(r,'Total (R$)')):0;
  // Só há "imposto" se a planilha traz a coluna do tributo do regime. Sem coluna,
  // o certo é dizer que não temos — e não estampar R$ 0,00 / carga de 0%.
  const temImp=!!r&&M.tribs.some(t=>temMetrica(r,t.pag));
  const imposto=temImp?M.impostos(r):null;
  const tem=!!r&&(receita>0||(imposto||0)>0);
  return {comp:c, tem,
    receita: tem?receita:null,
    imposto: tem?imposto:null,
    carga: (tem&&receita>0&&imposto!=null)?imposto/receita:null,
    liquido: (r&&temMetrica(r,'Resultado Líquido (R$)'))?num(getM(r,'Resultado Líquido (R$)')):null};
}
/* Colunas possíveis da folha de salários no fechamento (insumo do Fator R). getM compara
   sem diferenciar maiúsculas/espaços. Se nenhuma existir, o Fator R fica em estado vazio —
   não estimamos folha a partir de FGTS/INSS nem de nada parecido. */
const COLS_FOLHA=['Folha de salários (R$)','Folha (R$)','Folha de pagamento (R$)','Total da folha (R$)'];
function folhaDoMes(M,c){
  const r=M.porComp[c]; if(!r) return null;
  for(const k of COLS_FOLHA) if(temMetrica(r,k)) return num(getM(r,k));
  return null;
}

/** Modelo dos indicadores para a competência escolhida: janela de 13 meses,
    acumulado do ano (e do mesmo período do ano anterior) e a base móvel de 12 meses. */
function modeloInd(M,comp){
  const jan=[]; for(let i=12;i>=0;i--) jan.push(linhaInd(M,compMenos(comp,i)));
  const p=jan.findIndex(x=>x.tem);
  const S=p<0?[]:jan.slice(p);                       // corta os meses vazios do começo da janela
  S.forEach((x,i)=>{ const base=i>0?S[i-1]:linhaInd(M,compMenos(x.comp,1));
    x.cresc=(x.receita!=null&&base.receita!=null&&base.receita>0)?(x.receita/base.receita-1):null; });
  const comDado=S.filter(x=>x.tem);
  const mediaRec=comDado.length?comDado.reduce((s,x)=>s+x.receita,0)/comDado.length:null;
  const cargas=comDado.filter(x=>x.carga!=null);
  const mediaCarga=cargas.length?cargas.reduce((s,x)=>s+x.carga,0)/cargas.length:null;
  const melhor=comDado.slice().sort((a,b)=>b.receita-a.receita)[0]||null;
  const ano=Number(String(comp).slice(0,4)), mesN=Number(String(comp).slice(5,7));
  const serieAno=[], serieAnoAnt=[];
  for(let m=1;m<=mesN;m++){ const mm=String(m).padStart(2,'0');
    serieAno.push(linhaInd(M,ano+'-'+mm)); serieAnoAnt.push(linhaInd(M,(ano-1)+'-'+mm)); }
  const soma=(arr,k)=>arr.reduce((s,x)=>s+(x[k]||0),0);
  // imposto acumulado só existe se ALGUM mês trouxe imposto — senão fica null (sem dado)
  const somaImp=arr=>arr.some(x=>x.imposto!=null)?soma(arr,'imposto'):null;
  const fecha=(o)=>{ o.carga=(o.receita>0&&o.imposto!=null)?o.imposto/o.receita:null; return o; };
  const acum=fecha({lista:serieAno, meses:serieAno.filter(x=>x.tem).length,
    receita:soma(serieAno,'receita'), imposto:somaImp(serieAno)});
  const acumAnt=fecha({meses:serieAnoAnt.filter(x=>x.tem).length,
    receita:soma(serieAnoAnt,'receita'), imposto:somaImp(serieAnoAnt)});
  const r12=[]; for(let i=11;i>=0;i--) r12.push(linhaInd(M,compMenos(comp,i)));
  const doze={lista:r12, meses:r12.filter(x=>x.tem).length, receita:soma(r12,'receita')};
  return {comp, S, comDado, atual:linhaInd(M,comp), ant:linhaInd(M,compMenos(comp,1)),
    anoAnt:linhaInd(M,compMenos(comp,12)), mediaRec, mediaCarga, melhor, acum, acumAnt, doze, ano, mesN};
}

/** Fator R = folha de 12 meses ÷ faturamento de 12 meses. Só vira número com os 12
    meses completos dos DOIS lados; menos que isso é estado vazio, nunca estimativa. */
function fatorRInd(M,D){
  const meses=D.doze.lista.map(x=>({comp:x.comp, receita:x.receita, folha:folhaDoMes(M,x.comp)}));
  const comFolha=meses.filter(x=>x.folha!=null);
  const folha12=comFolha.reduce((s,x)=>s+x.folha,0);
  const cheio=comFolha.length===12 && D.doze.meses===12 && D.doze.receita>0;
  return {mesesFolha:comFolha.length, mesesReceita:D.doze.meses, folha12, receita12:D.doze.receita,
    fator: cheio?folha12/D.doze.receita:null};
}

/** Variação com POLARIDADE. tipo 'rel' = variação percentual; tipo 'pp' = pontos
    percentuais (comparar dois percentuais em % relativo confunde: 10% → 11,5% não é "subiu 15%"). */
function badgeVar(atual, base, pol, refTxt, tipo){
  const ref=refTxt?(' '+refTxt):'';
  if(atual==null) return '';                    // o próprio número já está como "—": não há o que comparar
  if(base==null) return `<span class="ind-var sem">sem base para comparar</span>`;
  let d, txt;
  if(tipo==='pp'){ d=atual-base; txt=ppTxt(d); }
  else {
    if(Math.abs(base)<1e-9) return `<span class="ind-var sem">sem base para comparar</span>`;
    d=(atual-base)/Math.abs(base); txt=relTxt(d);
  }
  if(Math.abs(d)<0.0005) return `<span class="ind-var igual">= <em>igual${ref?(' a'+ref):''}</em></span>`;
  const estado=((d>0)===(pol>0))?'bom':'ruim';
  return `<span class="ind-var ${estado}">${d>0?'▲':'▼'} ${txt} <em>${estado==='bom'?'melhor':'pior'}${ref?(' que'+ref):''}</em></span>`;
}
function indTile(lbl,valor,badge,sub){
  return `<div class="ind-tile"><span class="lbl">${esc(lbl)}</span><div class="v num">${valor}</div>`+
    (badge||'')+(sub?`<div class="s">${sub}</div>`:'')+`</div>`;
}
function comoBox(formula,linhas,fonte){
  return `<details class="como"><summary>Como calculamos <span class="car">▾</span></summary>
    <div class="como-body"><p class="como-f">${formula}</p>
      ${linhas.map(l=>`<div class="como-l"><span>${l[0]}</span><b>${l[1]}</b></div>`).join('')}
      <p class="como-fonte">${fonte}</p></div></details>`;
}
function semSerie(txt){ return `<div class="ind-vazio">${txt}</div>`; }
const FONTE_PADRAO='Vem do fechamento mensal da sua planilha fiscal — os mesmos números das seções acima desta página. Meses ainda não fechados não entram na conta.';

/* ---------- o HTML do bloco (refeito a cada troca de competência) ---------- */
function htmlIndicadores(M,comp){
  const D=modeloInd(M,comp);
  if(!D.S.length) return semSerie('<b>Ainda não temos meses fechados para comparar.</b><br>Assim que o primeiro mês for fechado, os indicadores aparecem aqui.');
  const nomeMes=mesExtenso(comp);
  const refAnt=D.ant.tem?MESES_L[+D.ant.comp.slice(5,7)-1]:'';
  const partes=[cardFaturamento(M,D,nomeMes,refAnt), cardImpostos(M,D,nomeMes,refAnt),
                cardAcumulado(M,D), cardComparativo(M,D)];
  if(ehSimples(M)){ partes.push(cardLimiteSimples(M,D)); partes.push(cardFatorR(M,D)); }
  return partes.join('');
}

function cardFaturamento(M,D,nomeMes,refAnt){
  const a=D.atual, temSerie=D.comDado.length>=2;
  const tiles=[
    indTile('Faturamento de '+nomeMes, a.receita==null?'—':brl(a.receita),
      badgeVar(a.receita,D.ant.receita,1,refAnt,'rel'),
      a.receita==null?'este mês ainda não foi fechado':'soma das notas emitidas no mês'),
    indTile('Média dos meses exibidos', D.mediaRec==null?'—':brl(D.mediaRec), '',
      D.comDado.length+(D.comDado.length===1?' mês com movimento':' meses com movimento')),
    indTile('Melhor mês da série', D.melhor?brl(D.melhor.receita):'—', '',
      D.melhor?('foi em '+mesExtenso(D.melhor.comp)):'ainda sem histórico')
  ].join('');
  const graficos=temSerie?`<div class="charts">
      <div class="ind-chart"><h4>Faturamento mês a mês</h4>
        <div class="sub">Em reais. O mês escolhido no topo da página aparece em destaque.</div>
        <div class="cbox"><canvas id="ind1"></canvas></div></div>
      <div class="ind-chart"><h4>Crescimento de um mês para o outro</h4>
        <div class="sub">Em percentual, cada mês comparado com o mês anterior. Acima da linha do zero, cresceu.</div>
        <div class="legend"><span><i style="background:${ST.bom}"></i>▲ cresceu</span><span><i style="background:${ST.ruim}"></i>▼ caiu</span></div>
        <div class="cbox"><canvas id="ind2"></canvas></div></div>
    </div>`
    :semSerie('<b>Ainda não dá para desenhar a evolução.</b><br>Com um mês fechado só temos o número acima — o gráfico aparece a partir do segundo mês.');
  const como=comoBox(
    'Faturamento do mês = soma do valor bruto de todas as notas emitidas na competência.<br>Crescimento = (faturamento do mês − faturamento do mês anterior) ÷ faturamento do mês anterior.',
    [['Faturamento de '+nomeMes, a.receita==null?'sem fechamento':brl(a.receita)],
     ['Faturamento de '+(D.ant.tem?mesExtenso(D.ant.comp):'mês anterior'), D.ant.receita==null?'sem fechamento':brl(D.ant.receita)],
     ['Diferença', (a.receita!=null&&D.ant.receita!=null)?brl(a.receita-D.ant.receita):'—'],
     ['Crescimento', (a.receita!=null&&D.ant.receita)?((a.receita>=D.ant.receita?'+':'−')+relTxt(a.receita/D.ant.receita-1)):'—']],
    FONTE_PADRAO);
  return `<div class="card ind-card"><div class="ind-h"><b>Faturamento e crescimento</b>
    <span>Quanto a empresa faturou em cada mês e o quanto isso mudou de um mês para o outro.</span></div>
    <div class="ind-tiles">${tiles}</div>${graficos}${como}</div>`;
}

function cardImpostos(M,D,nomeMes,refAnt){
  const a=D.atual, r=M.porComp[D.comp];
  const temImposto=D.S.some(x=>x.imposto!=null);
  const temSerie=D.comDado.length>=2 && temImposto;
  const visiveis=r?M.tribs.filter(t=>temMetrica(r,t.pag)):[];
  const tiles=[
    indTile('Impostos de '+nomeMes, a.imposto==null?'—':brl(a.imposto),
      badgeVar(a.imposto,D.ant.imposto,-1,refAnt,'rel'),
      a.imposto==null?'ainda não temos a apuração deste mês':'total a pagar desta competência'),
    indTile('Carga tributária', a.carga==null?'—':pct(a.carga),
      badgeVar(a.carga,D.ant.carga,-1,refAnt,'pp'),
      a.carga==null?'depende do imposto apurado':'quanto do faturamento virou imposto'),
    indTile('Média da carga', D.mediaCarga==null?'—':pct(D.mediaCarga), '',
      D.mediaCarga==null?'sem meses com carga calculada':'nos meses exibidos abaixo')
  ].join('');
  const graficos=temSerie?`<div class="charts">
      <div class="ind-chart"><h4>Impostos mês a mês</h4>
        <div class="sub">Em reais, o total a pagar de cada competência.</div>
        <div class="cbox"><canvas id="ind3"></canvas></div></div>
      <div class="ind-chart"><h4>Carga tributária mês a mês</h4>
        <div class="sub">Em percentual do faturamento. Fica em um gráfico separado de propósito: reais e percentual no mesmo desenho fazem parecer que um explica o outro.</div>
        <div class="legend"><span><i style="background:${SLOT[1]}"></i>carga do mês</span><span><i style="background:repeating-linear-gradient(90deg,${PAL.muted} 0 3px,transparent 3px 6px)"></i>média do período (linha tracejada)</span></div>
        <div class="cbox"><canvas id="ind4"></canvas></div></div>
    </div>`
    :semSerie(temImposto
      ? '<b>Ainda não dá para desenhar a evolução da carga.</b><br>Ela aparece assim que houver um segundo mês fechado.'
      : '<b>Ainda não temos os impostos apurados nesta planilha.</b><br>Sem o valor do tributo do seu regime não dá para calcular carga tributária — e preferimos não mostrar um gráfico zerado no lugar.');
  const linhas=visiveis.map(t=>[esc(t.n)+' a pagar', brl(num(getM(r,t.pag)))]);
  linhas.push(['Total de impostos', a.imposto==null?'—':brl(a.imposto)]);
  linhas.push(['Faturamento do mês', a.receita==null?'—':brl(a.receita)]);
  linhas.push(['Carga tributária', a.carga==null?'—':pct(a.carga)]);
  const como=comoBox('Carga tributária = total de impostos a pagar do mês ÷ faturamento do mês.',
    linhas, FONTE_PADRAO+' O que os tomadores já retiveram na fonte está descontado do "a pagar".');
  return `<div class="card ind-card"><div class="ind-h"><b>Impostos e carga tributária</b>
    <span>Quanto saiu em imposto e qual fatia do que você faturou isso representa.</span></div>
    <div class="ind-tiles">${tiles}</div>${graficos}${como}</div>`;
}

function cardAcumulado(M,D){
  const A=D.acum, B=D.acumAnt, ateMes=MESES_L[D.mesN-1], temAnt=B.meses>0;
  const semAno=`<span class="ind-var sem">não temos ${D.ano-1} na planilha</span>`;
  const tiles=[
    indTile('Faturamento no ano', brl(A.receita),
      temAnt?badgeVar(A.receita,B.receita,1,String(D.ano-1),'rel'):semAno,
      'de janeiro a '+ateMes+' · '+A.meses+(A.meses===1?' mês fechado':' meses fechados')),
    indTile('Impostos no ano', A.imposto==null?'—':brl(A.imposto),
      temAnt?badgeVar(A.imposto,B.imposto,-1,String(D.ano-1),'rel'):'',
      A.imposto==null?'ainda não temos os impostos deste período':'mesmo período'),
    indTile('Carga do ano', A.carga==null?'—':pct(A.carga),
      temAnt?badgeVar(A.carga,B.carga,-1,String(D.ano-1),'pp'):'', 'imposto ÷ faturamento acumulados')
  ].join('');
  const temSerie=A.lista.filter(x=>x.tem).length>=2;
  const comImp=A.imposto!=null;
  const grafico=temSerie?`<div class="ind-chart"><h4>Como o ano vai somando</h4>
      <div class="sub">${comImp?'Faturamento e imposto acumulados desde janeiro. Os dois estão em reais, na mesma escala — por isso cabem no mesmo gráfico.':'Faturamento acumulado desde janeiro. O imposto não entra porque ainda não temos a apuração nesta planilha.'}</div>
      ${comImp?`<div class="legend"><span><i style="background:${SLOT[0]}"></i>faturamento acumulado</span><span><i style="background:${SLOT[1]}"></i>imposto acumulado</span></div>`:''}
      <div class="cbox"><canvas id="ind5"></canvas></div></div>`
    :semSerie('<b>O acumulado deste ano ainda tem um mês só.</b><br>A curva aparece quando houver dois ou mais meses fechados em '+D.ano+'.');
  const como=comoBox(
    'Acumulado do ano = soma dos meses já fechados, de janeiro até '+ateMes+'.<br>Carga do ano = impostos acumulados ÷ faturamento acumulado.',
    [['Meses fechados em '+D.ano, String(A.meses)],
     ['Faturamento acumulado', brl(A.receita)],
     ['Impostos acumulados', A.imposto==null?'não temos esse dado':brl(A.imposto)],
     ['Carga do ano', A.carga==null?'—':pct(A.carga)],
     ['Mesmo período de '+(D.ano-1), temAnt?(brl(B.receita)+' faturados'):'não temos esse ano na planilha']],
    FONTE_PADRAO);
  return `<div class="card ind-card"><div class="ind-h"><b>No ano até agora</b>
    <span>O ano somado até ${esc(ateMes)} — e como ele se compara com o mesmo período do ano passado.</span></div>
    <div class="ind-tiles">${tiles}</div>${grafico}${como}</div>`;
}

function cardComparativo(M,D){
  const a=D.atual, ant=D.ant, aa=D.anoAnt;
  const cab=[mesExtenso(D.comp), ant.tem?mesExtenso(ant.comp):'mês anterior',
             aa.tem?mesExtenso(aa.comp):('mesmo mês em '+(D.ano-1))];
  // data-c leva o nome da coluna para dentro da célula: no celular a tabela vira
  // um cartão por indicador e cada valor continua sabendo a que período pertence.
  const linha=(rot,fmt,pol,tipo,k)=>{
    const va=a[k];
    const cel=(v,rotCol)=> v==null
      ? `<td data-c="${esc(rotCol)}"><span class="cmp-c"><span class="ind-var sem">ainda não temos</span></span></td>`
      : `<td data-c="${esc(rotCol)}"><span class="cmp-c"><span class="cmp-v">${fmt(v)}</span>${badgeVar(va,v,pol,'',tipo)}</span></td>`;
    return `<tr><td>${rot}</td><td data-c="${esc(cab[0])}"><span class="cmp-c"><span class="cmp-v">${va==null?'—':fmt(va)}</span></span></td>${cel(ant[k],cab[1])}${cel(aa[k],cab[2])}</tr>`;
  };
  const corpo=[linha('Faturamento',brl,1,'rel','receita'),
               linha('Impostos a pagar',brl,-1,'rel','imposto'),
               linha('Carga tributária',pct,-1,'pp','carga'),
               linha('Resultado líquido',brl,1,'rel','liquido')].join('');
  const como=comoBox(
    'Cada seta compara o mês escolhido com a coluna onde ela está.<br>A cor segue o indicador, não o sinal: faturamento subindo é bom (verde); imposto e carga subindo é ruim (vermelho).',
    [['Mês escolhido', mesExtenso(D.comp)],
     ['Mês anterior', ant.tem?mesExtenso(ant.comp):'sem fechamento'],
     ['Mesmo mês do ano anterior', aa.tem?mesExtenso(aa.comp):'não temos esse mês na planilha'],
     ['Carga tributária', 'comparada em pontos percentuais (p.p.), não em variação relativa']],
    FONTE_PADRAO+' "Resultado líquido" é o que sobra do faturamento depois dos impostos do mês.');
  return `<div class="card ind-card"><div class="ind-h"><b>Comparativo período a período</b>
    <span>O mesmo indicador contra o mês anterior e contra o mesmo mês do ano passado. As setas comparam ${esc(mesExtenso(D.comp))} com a coluna em que estão.</span></div>
    <div class="table-scroll" style="margin-top:14px"><table class="cmp">
      <thead><tr><th>Indicador</th><th>${esc(cab[0])}</th><th>${esc(cab[1])}</th><th>${esc(cab[2])}</th></tr></thead>
      <tbody>${corpo}</tbody></table></div>${como}</div>`;
}

function cardLimiteSimples(M,D){
  const cheio=D.doze.meses===12;
  const base=cheio?D.doze.receita:D.acum.receita;
  const rotBase=cheio?'faturamento dos últimos 12 meses':('faturamento acumulado de '+D.ano);
  if(!(base>0)) return `<div class="card ind-card"><div class="ind-h"><b>Limite do Simples Nacional</b>
    <span>Quanto do teto anual de faturamento já foi usado.</span></div>
    ${semSerie('<b>Ainda não temos faturamento para medir o limite.</b><br>Ele aparece assim que houver meses fechados.')}</div>`;
  const uso=base/SIMPLES_LIMITE, usoSub=base/SIMPLES_SUBLIMITE;
  const st=uso>=1?'ruim':(uso>=0.8?'atencao':'bom');
  const rot={bom:'✓ Dentro do limite',atencao:'⚠ Perto do teto',ruim:'✕ Acima do teto'}[st];
  const cor={bom:ST.bom,atencao:ST.atencao,ruim:ST.ruim}[st];
  const aviso=cheio?'':semSerie('Temos '+D.doze.meses+' dos 12 meses na planilha, então esta medida usa o acumulado de '+D.ano+'. Com os 12 meses completos ela passa a ser o cálculo oficial (RBT12).');
  const como=comoBox('Uso do limite = '+rotBase+' ÷ R$ 4.800.000,00 (teto anual do Simples Nacional).',
    [[rotBase.charAt(0).toUpperCase()+rotBase.slice(1), brl(base)],
     ['Teto anual do Simples', brl(SIMPLES_LIMITE)],
     ['Sublimite de ICMS/ISS', brl(SIMPLES_SUBLIMITE)],
     ['Uso do teto', pct(uso)],
     ['Uso do sublimite', pct(usoSub)],
     ['Quanto ainda cabe no teto', brl(Math.max(0,SIMPLES_LIMITE-base))]],
    'Teto e sublimite são os valores da Lei Complementar 123/2006. Empresa aberta no meio do ano tem limite proporcional aos meses de atividade — nesse caso, use este número como referência e confirme com a gente.');
  return `<div class="card ind-card"><div class="ind-h"><b>Limite do Simples Nacional</b>
    <span>Quanto do teto anual de faturamento já foi usado. Passar do teto tira a empresa do regime.</span></div>
    <div class="ind-tiles">
      ${indTile('Faturamento na base',brl(base),'',rotBase)}
      ${indTile('Uso do teto',pct(uso),`<span class="selo-status ${st}">${rot}</span>`,'de '+brl(SIMPLES_LIMITE)+' por ano')}
      ${uso>=1
        ? indTile('Passou do teto em',brl(base-SIMPLES_LIMITE),'','fale com a gente: o desenquadramento tem regras de prazo')
        : indTile('Ainda cabe',brl(SIMPLES_LIMITE-base),'','antes de estourar o teto')}
    </div>
    <div class="meter">
      <div class="meter-bar"><i class="meter-fill" style="width:${Math.min(100,uso*100).toFixed(1)}%;background:${cor}"></i><i class="meter-mark" style="left:${(SIMPLES_SUBLIMITE/SIMPLES_LIMITE*100).toFixed(1)}%"></i></div>
      <div class="meter-legs"><span>R$ 0</span><span>teto ${brlCurto(SIMPLES_LIMITE)}</span></div>
      <div class="meter-nota">O traço vertical marca o sublimite de ICMS/ISS (${brlCurto(SIMPLES_SUBLIMITE)}): passar dele muda a forma de recolher esses dois impostos, mas não tira a empresa do Simples.</div>
    </div>${aviso}${como}</div>`;
}

function cardFatorR(M,D){
  const F=fatorRInd(M,D);
  const explica=`O Fator R decide em qual anexo do Simples a empresa é tributada: <b>28% ou mais</b> vai para o
    <b>Anexo III</b>, de alíquotas menores; <b>abaixo de 28%</b> cai no <b>Anexo V</b>, que costuma pagar bem mais
    sobre o mesmo faturamento. Ele compara o gasto com folha (salários, pró-labore e encargos) com o faturamento,
    sempre nos últimos 12 meses.`;
  if(F.fator==null){
    const detalhe=F.mesesFolha===0
      ? 'Ainda não temos o valor da folha de salários dentro da planilha fiscal — a folha é apurada no Departamento Pessoal e não chega até aqui.'
      : ('Temos folha em '+F.mesesFolha+' dos 12 meses e faturamento em '+F.mesesReceita+'. O Fator R só faz sentido com os 12 meses completos dos dois lados, então preferimos não estimar.');
    return `<div class="card ind-card"><div class="ind-h"><b>Fator R</b><span>${explica}</span></div>
      ${semSerie('<b>Ainda não temos os dados para calcular o seu Fator R.</b><br>'+detalhe+' Quando a folha passar a vir nesta planilha, o indicador liga sozinho — você não precisa fazer nada.')}
      ${comoBox('Fator R = folha dos últimos 12 meses ÷ faturamento dos últimos 12 meses.',
        [['Faturamento dos últimos 12 meses', F.mesesReceita===12?brl(F.receita12):(F.mesesReceita+' de 12 meses na planilha')],
         ['Folha dos últimos 12 meses', F.mesesFolha===12?brl(F.folha12):'não temos esse dado aqui'],
         ['Corte que muda de anexo','28%']],
        'Anexo III e Anexo V são tabelas de alíquota do Simples Nacional. Trocar de anexo muda quanto se paga de imposto sobre o mesmo faturamento — por isso o Fator R merece acompanhamento mês a mês.')}</div>`;
  }
  const ok=F.fator>=0.28, st=ok?'bom':'atencao', rot=ok?'✓ Anexo III':'⚠ Anexo V';
  return `<div class="card ind-card"><div class="ind-h"><b>Fator R</b><span>${explica}</span></div>
    <div class="ind-tiles">
      ${indTile('Fator R (12 meses)',pct(F.fator),`<span class="selo-status ${st}">${rot}</span>`, ok?'acima do corte de 28%':'abaixo do corte de 28%')}
      ${indTile('Folha de 12 meses',brl(F.folha12),'','salários, pró-labore e encargos')}
      ${indTile('Faturamento de 12 meses',brl(F.receita12),'','base do cálculo')}
    </div>
    <div class="meter">
      <div class="meter-bar"><i class="meter-fill" style="width:${Math.min(100,F.fator*100).toFixed(1)}%;background:${ok?ST.bom:ST.atencao}"></i><i class="meter-mark" style="left:28%"></i></div>
      <div class="meter-legs"><span>0%</span><span>100%</span></div>
      <div class="meter-nota">O traço vertical marca o corte de 28%: a partir dele a empresa é tributada pelo Anexo III.</div>
    </div>
    ${comoBox('Fator R = folha dos últimos 12 meses ÷ faturamento dos últimos 12 meses.',
      [['Folha dos últimos 12 meses', brl(F.folha12)],
       ['Faturamento dos últimos 12 meses', brl(F.receita12)],
       ['Fator R', pct(F.fator)],
       ['Corte que muda de anexo','28%'],
       ['Anexo aplicável', ok?'Anexo III':'Anexo V']],
      'Anexo III e Anexo V são tabelas de alíquota do Simples Nacional. Ficar logo abaixo dos 28% costuma valer uma conversa: às vezes ajustar o pró-labore muda o anexo e reduz o imposto dentro da lei.')}</div>`;
}

/* ---------- gráficos do bloco (criados só com o bloco aberto) ---------- */
function destruirIndCharts(){
  if(!IND.charts) return;
  Object.keys(IND.charts).forEach(k=>{ try{ IND.charts[k].destroy(); }catch(e){} });
  IND.charts=null;
}
function eixoInd(fmtY){
  return {x:{grid:{display:false},border:{color:PAL.line},
      ticks:{color:PAL.muted,font:FONTE_IND,maxRotation:0,autoSkip:true,maxTicksLimit:8}},
    y:{beginAtZero:true,grid:{color:'#EDE4D6',drawTicks:false},border:{display:false},
      ticks:{color:PAL.muted,font:FONTE_IND,maxTicksLimit:5,padding:6,callback:fmtY}}};
}
function tipInd(comps,fmt,rotulo){
  return {backgroundColor:PAL.petroleo,padding:10,cornerRadius:6,
    titleFont:{family:'Montserrat',size:12,weight:'600'},bodyFont:FONTE_IND,
    displayColors:true,boxWidth:8,boxHeight:8,
    callbacks:{title:it=>mesExtenso(comps[it[0].dataIndex]),
      label:c=>' '+(c.dataset.label||rotulo)+': '+(c.parsed.y==null?'sem fechamento':fmt(c.parsed.y))}};
}
function desenharIndCharts(M,comp){
  destruirIndCharts();
  if(typeof Chart==='undefined') return;
  const D=modeloInd(M,comp);
  const comps=D.S.map(x=>x.comp), labels=comps.map(mesLabel);
  const ch={};
  try{
    const e1=document.getElementById('ind1');
    if(e1) ch.ind1=new Chart(e1,{type:'bar',
      data:{labels,datasets:[{label:'Faturamento',data:D.S.map(x=>x.receita),
        backgroundColor:D.S.map(x=>x.comp===comp?SLOT[0]:SLOT_SOFT[0]),
        borderRadius:{topLeft:4,topRight:4},maxBarThickness:26,borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,animation:{duration:450},
        plugins:{legend:{display:false},tooltip:tipInd(comps,brl,'Faturamento')},
        scales:eixoInd(v=>brlCurto(v))}});

    const e2=document.getElementById('ind2');
    if(e2) ch.ind2=new Chart(e2,{type:'bar',
      data:{labels,datasets:[{label:'Crescimento',data:D.S.map(x=>x.cresc==null?null:x.cresc*100),
        backgroundColor:D.S.map(x=>x.cresc==null?'rgba(0,0,0,0)':(x.cresc>=0?ST.bom:ST.ruim)),
        borderRadius:3,maxBarThickness:26,borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,animation:{duration:450},
        plugins:{legend:{display:false},
          tooltip:tipInd(comps,v=>(v>=0?'+':'−')+relTxt(v/100),'Crescimento')},
        scales:{x:eixoInd(v=>v).x,
          y:{grid:{color:c=>(c.tick&&c.tick.value===0)?'#C7B9A4':'#EDE4D6',drawTicks:false},
            border:{display:false},
            ticks:{color:PAL.muted,font:FONTE_IND,maxTicksLimit:5,padding:6,
              callback:v=>(v>0?'+':'')+Math.round(v)+'%'}}}}});

    const e3=document.getElementById('ind3');
    if(e3) ch.ind3=new Chart(e3,{type:'bar',
      data:{labels,datasets:[{label:'Impostos',data:D.S.map(x=>x.imposto),
        backgroundColor:D.S.map(x=>x.comp===comp?SLOT[1]:SLOT_SOFT[1]),
        borderRadius:{topLeft:4,topRight:4},maxBarThickness:26,borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,animation:{duration:450},
        plugins:{legend:{display:false},tooltip:tipInd(comps,brl,'Impostos')},
        scales:eixoInd(v=>brlCurto(v))}});

    const e4=document.getElementById('ind4');
    if(e4) ch.ind4=new Chart(e4,{type:'line',
      data:{labels,datasets:[
        {type:'line',label:'Carga do mês',data:D.S.map(x=>x.carga==null?null:x.carga*100),
          borderColor:SLOT[1],backgroundColor:SLOT[1],borderWidth:2,tension:.25,
          pointRadius:3,pointHoverRadius:6,spanGaps:false},
        {type:'line',label:'Média do período',data:D.S.map(()=>D.mediaCarga==null?null:D.mediaCarga*100),
          borderColor:PAL.muted,backgroundColor:PAL.muted,borderWidth:1.5,borderDash:[6,4],
          pointRadius:0,pointHoverRadius:0,tension:0}]},
      options:{responsive:true,maintainAspectRatio:false,animation:{duration:450},
        interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:false},tooltip:tipInd(comps,v=>relTxt(v/100),'Carga')},
        scales:{x:eixoInd(v=>v).x,
          y:{beginAtZero:true,grid:{color:'#EDE4D6',drawTicks:false},border:{display:false},
            ticks:{color:PAL.muted,font:FONTE_IND,maxTicksLimit:5,padding:6,
              callback:v=>(Math.round(v*10)/10).toLocaleString('pt-BR')+'%'}}}}});

    const e5=document.getElementById('ind5');
    if(e5){
      const A=D.acum.lista, compsA=A.map(x=>x.comp), labelsA=compsA.map(mesLabel);
      let accR=0, accI=0;
      const accRec=A.map(x=>{ accR+=x.receita||0; return accR; });
      const accImp=A.map(x=>{ accI+=x.imposto||0; return accI; });
      const comImp=D.acum.imposto!=null;      // sem apuração de imposto, a linha some (não vira uma reta em zero)
      ch.ind5=new Chart(e5,{type:'line',
        data:{labels:labelsA,datasets:[
          // order maior = desenhado antes (atrás): a área do faturamento não pode
          // lavar a cor da linha de imposto, que é mais fina e passa por dentro dela.
          {type:'line',label:'Faturamento acumulado',data:accRec,borderColor:SLOT[0],order:2,
            backgroundColor:AREA_SOFT,fill:'origin',borderWidth:2,tension:.2,pointRadius:3,pointHoverRadius:6,
            pointBackgroundColor:SLOT[0],pointBorderColor:'#fff',pointBorderWidth:1.5},
          {type:'line',label:'Imposto acumulado',data:comImp?accImp:accImp.map(()=>null),borderColor:SLOT[1],order:1,
            backgroundColor:'rgba(0,0,0,0)',borderWidth:2,tension:.2,pointRadius:3,pointHoverRadius:6,
            pointBackgroundColor:SLOT[1],pointBorderColor:'#fff',pointBorderWidth:1.5}]},
        options:{responsive:true,maintainAspectRatio:false,animation:{duration:450},
          interaction:{mode:'index',intersect:false},
          plugins:{legend:{display:false},tooltip:tipInd(compsA,brl,'Acumulado')},
          scales:eixoInd(v=>brlCurto(v))}});
    }
  }catch(e){ if(window.console&&console.warn) console.warn('Indicadores: gráfico indisponível.',e); }
  IND.charts=Object.keys(ch).length?ch:null;
}

function pintarIndicadores(M,comp){
  const box=document.getElementById('ind-body'); if(!box) return;
  destruirIndCharts();
  box.innerHTML=htmlIndicadores(M,comp);
  IND_SUJO=false;
  const det=document.getElementById('bloco-ind');
  if(det&&det.open) desenharIndCharts(M,comp);
}

(async function(){
  const ic=getIdCodigo(); IDENTIDADE=ic;
  const salvo=lerEscolha(ic.id);
  let doCache=null;
  /* Segunda visita não recomeça do esqueleto: pintamos com o último payload guardado
     (6h) e revalidamos em paralelo, com tarja discreta. Se a rede falhar, o cliente
     continua vendo os números — com a data deles à mostra, nunca um erro em branco. */
  if(API_URL && ic.id && ic.codigo && window.B4U && B4U.cacheLer){
    const raw=B4U.cacheLer(chaveCache(salvo.ano||anoCorrente()), ic.id);
    if(raw){ try{
      const Mc=aplicarPayload(raw, salvo.ano||raw.ano||'');
      if(Mc.empresa.length){ render(Mc); tarja('atualizando'); doCache=Mc; }
    }catch(e){ doCache=null; } }
  }
  try{
    const raw=await carregar();
    if(window.B4U && B4U.cacheGravar && API_URL) B4U.cacheGravar(chaveCache(raw.ano), IDENTIDADE.id, raw);
    const M=aplicarPayload(raw, '');
    if(!M.empresa.length) return erro('A planilha deste cliente não tem nenhum mês na aba Empresa.');
    render(M); tarja('');
    // Ele parou em outro ano: buscamos esse ano em seguida, sem tirar o painel da tela.
    if(salvo.ano && salvo.ano!==ANO_SEL && ANOS.indexOf(salvo.ano)>-1) trocarAno(M,salvo.ano);
  } catch(e){
    if(doCache){                                     // com dados na tela, a falha vira tarja, não tela de erro
      pararEspera();
      tarja('falhou', new Date(doCache.atualizado_em||Date.now()).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}));
      return;
    }
    // o texto técnico fica no console (para nós); a tela recebe a frase amigável
    if(window.console&&console.warn) console.warn('Fiscal:',e);
    erro();
  }
})();
