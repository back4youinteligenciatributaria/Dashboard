<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Societário — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- São DUAS origens porque o /exec responde 302 para a segunda: sem isto o aparelho
     paga DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte deixa de bloquear a primeira pintura: o esqueleto aparece antes dela. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"></noscript>
<style>
:root{
  /* PALETA CANÔNICA — igual nas 7 páginas do cliente. Não redeclare tons aqui. */
  --canvas:#F1E7DC; --surface:#FFFFFF; --surface-warm:#FBF6EF;
  --ink:#113D39; --ink-2:#3F5854; --muted:#6E6256; --line:#E4D9C9; --line-2:#D6C3AC;
  --brand-dark:#073034; --brand-teal:#0F8C85; --brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,44:1 no receita-soft).
     Este é o mesmo teal escurecido só para texto e fundo de texto; o --brand-teal
     continua canônico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E; --amber-txt:#8A5A10; --vermelho:#C0392B; --verde:#2E9D5F;
  /* Escala tipográfica — 6 passos, sem meio pixel. */
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:15px; --fs-5:19px; --fs-6:24px;
  /* Raios — 12 padrão, 16 para caixas grandes, 999 só para pílulas. */
  --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-pill:999px;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  --brand-eucalipto2:var(--brand-euc);
  --receita:var(--brand-teal); --receita-soft:#DBEFEC;
  /* #A7715D pinta ponto e preenchimento; como TEXTO sobre o creme ele dá 3,20:1.
     O --andamento-txt é o mesmo tom escurecido só para letra: 5,26:1. Mesmo par e
     mesma correção do --sinal/--sinal-txt do fiscal e do guias. */
  --andamento:#A7715D; --andamento-soft:#F1E1D8; --andamento-txt:#8A4B33;
  --aguardando:var(--muted); --aguardando-soft:#EDE7DD;
  /* Escala de padding — três degraus no lugar dos valores avulsos que havia aqui. */
  --pad-sm: 14px 16px;
  --pad:    18px 20px;
  --pad-lg: 24px 26px;
  --lift:   0 8px 20px rgba(17,61,57,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:var(--fs-4);line-height:1.55;-webkit-font-smoothing:antialiased}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:var(--radius-sm)}
/* Campo com menos de 16px faz o Safari ampliar a página inteira ao focar. Só os campos. */
input,select,textarea{font-size:16px}
/* Uma amostra de cor só — antes cada lugar tinha o seu tamanho. */
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}
/* Esta página não tinha NENHUM ajuste de celular: ficava com 24px de respiro lateral
   numa tela de 390px. */
@media(max-width:640px){
  :root{--pad-sm:12px 13px;--pad:15px 16px;--pad-lg:18px 18px}
  .wrap{padding:0 14px 60px}
  .bar{padding:12px 14px;gap:10px}
  /* razão social + CNPJ do cliente não podem virar 11px: ficam menores que o texto ao lado */
  .brand-sub{font-size:var(--fs-3)}
  .sec-head{margin:24px 0 10px}
  .lista{padding:8px 16px}
  .item{flex-wrap:wrap}
  footer{flex-direction:column;gap:4px}
}

header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:var(--b4u-bar-h,0px);z-index:30}
.bar{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:var(--fs-5);letter-spacing:-.02em;line-height:1}
.logo .b{color:var(--brand-dark)} .logo .y{color:var(--brand-teal)}
/* Razão social + CNPJ é o que confirma "esta é a minha empresa": 15px em teal
   puro dá 4,11:1. Escurecido, 5,54:1. */
.brand-sub{font-size:var(--fs-4);color:var(--brand-teal-txt);font-weight:700;margin-top:2px}
.voltar{display:inline-block;font-size:var(--fs-1);font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:4px}
.voltar:hover{color:var(--brand-teal-txt)}
.spacer{flex:1}
/* 11px sobre o verde claro: teal puro dá 3,44:1. Escurecido, 4,64:1. */
.badge-topo{font-size:var(--fs-1);font-weight:700;color:var(--brand-teal-txt);background:var(--receita-soft);padding:5px 12px;border-radius:var(--radius-pill)}

.busca{margin:28px 0 24px}
.busca input{
  width:100%;font-family:var(--sans);padding:12px 16px;border-radius:var(--radius-pill);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
}
.busca input::placeholder{color:var(--muted)}
.busca input:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
/* retorno da busca: quantos resultados, para quê, e como limpar */
.busca-info{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:11px 6px 0;font-size:var(--fs-2);color:var(--muted)}
.busca-info.on{display:flex}
.busca-info b{color:var(--ink);font-weight:700}
.busca-limpar{background:none;border:0;padding:0;font-family:inherit;font-size:var(--fs-2);font-weight:700;
  color:var(--brand-teal-txt);cursor:pointer;text-decoration:underline}
.busca-vazio{display:none;margin:14px 0 0;padding:22px 20px;text-align:center;background:var(--surface);
  border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--muted);font-size:var(--fs-3)}
.busca-vazio.on{display:block}
.busca-vazio b{color:var(--ink);font-weight:700}
.busca-dica{display:block;margin-top:6px;font-size:var(--fs-2)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:30px 0 14px}
/* Título de seção e texto corrido tinham os mesmos 15px: não havia hierarquia. */
.sec-head h2{font-size:var(--fs-5);font-weight:700;letter-spacing:-.01em}
.sec-head p{font-size:var(--fs-3);color:var(--muted)}

/* ════════ Topo: em que pé está o processo, e com quem está a bola ════════
   O primeiro elemento da página era um campo de busca vazio. Quem entra aqui
   quer saber se anda alguma coisa e se a vez é dele. */
.heroi{margin:22px 0 0;padding:var(--pad-lg);border:none;border-radius:var(--radius-lg);color:#fff;
  /* O gradiente da marca clareia no canto de baixo: medido a 390px, o branco cai para
     4,38:1 justamente na última linha. O véu escuro devolve o contraste sem trocar a cor. */
  background:linear-gradient(180deg,rgba(7,48,52,0) 45%,rgba(7,48,52,.22) 100%),
             linear-gradient(124deg,var(--brand-dark) 0%,var(--brand-teal) 100%);
  box-shadow:0 18px 38px -18px rgba(6,48,51,.6)}
/* 11px maiúsculo sobre o lado claro do gradiente não pode ser branco a 82% (3,7:1). */
.heroi .lbl{font-size:var(--fs-1);letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:#fff}
.heroi-v{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:8px;overflow-wrap:anywhere}
@media(min-width:720px){.heroi-v{font-size:40px}}
/* branco a 90% sobre o lado claro do gradiente dá 4,24:1 a 390px — texto corrido
   de 15px precisa de 4,5. Branco cheio; a hierarquia fica no <b>, não na opacidade.
   Sem font-weight: o link do Montserrat não traz o 500 e o navegador sintetizava
   o peso, engrossando o traço na marra. Mesmo peso do contábil e da equiparação. */
.heroi-sub{font-size:var(--fs-4);color:#fff;margin-top:10px;line-height:1.5;max-width:60ch}
.heroi-sub b{color:#fff;font-weight:800}
.heroi-pe{font-size:var(--fs-4);color:#fff;font-weight:600;margin-top:14px;max-width:60ch;line-height:1.5}
/* Quando a vez é DELE, a frase não pode ter o mesmo peso de "está na Junta". */
.heroi-pe.voce{background:#FCEFE0;color:#8A5A10;border:1px solid #E7C79A;
  border-radius:var(--radius);padding:12px 14px;font-weight:800;display:inline-block}

/* Tarja de cache: o que está na tela é do último acesso e já está sendo atualizado. */
.tarja-atualizando{font-size:var(--fs-2);font-weight:600;color:var(--brand-dark);
  background:var(--receita-soft);border-radius:var(--radius-pill);padding:6px 14px;margin:14px 0 0;
  display:inline-flex;align-items:center;gap:8px}
.tarja-atualizando.falhou{background:#FCEFE0;color:#8A5A10}

.processo-card{padding:var(--pad);margin-bottom:14px}
.processo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.processo-head h3{font-size:var(--fs-4);font-weight:700}
.status-chip{font-size:var(--fs-1);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-sm);white-space:nowrap}
.status-concluido{background:var(--receita-soft);color:var(--brand-teal-txt)}
.status-andamento{background:var(--andamento-soft);color:var(--andamento-txt)}

/* stepper horizontal (linha do tempo resumida) */
.stepper{margin:0 0 16px}
.stepper-topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.stepper-cap{font-size:var(--fs-2);color:var(--muted)}
.stepper-pct{font-size:var(--fs-3);font-weight:800;color:var(--brand-teal-txt)}
.stepper-track{height:6px;background:var(--line);border-radius:var(--radius-pill);overflow:hidden}
.stepper-fill{height:100%;background:linear-gradient(90deg,var(--brand-teal),var(--brand-eucalipto2));border-radius:var(--radius-pill);transition:width .4s}
.stepper-passos{display:flex;align-items:center;gap:6px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.st-passo{display:flex;align-items:center;gap:6px;flex-shrink:0}
.st-dot{width:10px;height:10px;border-radius:50%;background:var(--aguardando);flex-shrink:0}
.st-dot.concluido{background:var(--receita)}
.st-dot.andamento{background:var(--andamento);box-shadow:0 0 0 3px var(--andamento-soft)}
.st-lbl{font-size:var(--fs-1);color:var(--ink-2);white-space:nowrap}
.st-linha{width:16px;height:2px;background:var(--line-2);flex-shrink:0}
@media(max-width:600px){.st-lbl{max-width:110px;overflow:hidden;text-overflow:ellipsis}}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.etapa{position:relative;padding-bottom:16px}
.etapa:last-child{padding-bottom:0}
.etapa::before{content:'';position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--aguardando);border:2px solid var(--surface)}
.etapa.concluido::before{background:var(--receita)}
.etapa.andamento::before{background:var(--andamento);box-shadow:0 0 0 3px var(--andamento-soft)}
.etapa-nome{font-size:var(--fs-3);font-weight:600}
.etapa-meta{font-size:var(--fs-2);color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.etapa-status{font-size:var(--fs-1);font-weight:700;padding:1px 7px;border-radius:var(--radius-sm)}
.etapa-status.concluido{background:var(--receita-soft);color:var(--brand-teal-txt)}
.etapa-status.andamento{background:var(--andamento-soft);color:var(--andamento-txt)}
.etapa-status.aguardando{background:var(--aguardando-soft);color:var(--aguardando)}
/* Com quem está a bola nesta etapa. A linha "com você" não se distingue só pela cor:
   ela tem texto próprio, fundo e borda — e some quando não dá para saber. */
.etapa-resp{font-size:var(--fs-2);font-weight:700;color:var(--ink-2);margin-top:4px}
.etapa-resp.voce{display:inline-block;color:#8A5A10;background:#FCEFE0;border:1px solid #E7C79A;
  border-radius:var(--radius-sm);padding:3px 9px;font-weight:800}
/* Cartão clicável levanta — mesma regra das outras páginas do cliente. */
.processo-card.recolhido{padding:0;transition:transform .12s,box-shadow .12s,border-color .12s}
.processo-card.recolhido:hover{transform:translateY(-2px);box-shadow:var(--lift);border-color:var(--brand-teal)}
.processo-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 22px;background:none;border:none;cursor:pointer;font-family:var(--sans);color:var(--ink);text-align:left}
.processo-toggle .lado{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.processo-toggle h3{font-size:var(--fs-4);font-weight:700}
.processo-toggle .conta{font-size:var(--fs-1);color:var(--muted)}
.processo-toggle .seta{color:var(--muted);font-size:var(--fs-3);transition:transform .2s}
.processo-toggle[aria-expanded="true"] .seta{transform:rotate(90deg)}
.processo-corpo{padding:0 22px 20px}
.etapa-datas{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}

.lista{padding:8px 24px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .nome{font-size:var(--fs-3);font-weight:600}
.item .cat{font-size:var(--fs-1);color:var(--muted);margin-top:2px}
.item a{font-size:var(--fs-2);font-weight:700;color:var(--brand-teal-txt);text-decoration:none;white-space:nowrap}
.item a:hover{color:var(--brand-dark)}
.item .em-breve{font-size:var(--fs-1);font-weight:600;color:var(--muted);white-space:nowrap}

.grupo-cat{border-top:1px solid var(--line)}
.grupo-cat:first-child{border-top:none}
.grupo-cat-btn{
  width:100%;display:flex;align-items:center;gap:10px;padding:14px 0;
  background:none;border:none;cursor:pointer;font-family:var(--sans);color:var(--ink);text-align:left;
}
.grupo-cat-nome{font-size:var(--fs-4);font-weight:700;flex:1}
.grupo-cat-conta{font-size:var(--fs-1);font-weight:700;color:var(--muted);background:var(--surface-warm);border-radius:var(--radius-sm);padding:2px 9px}
.grupo-cat-btn .seta{color:var(--muted);font-size:var(--fs-3);transition:transform .2s}
.grupo-cat-body{padding:0 0 10px 4px}
.grupo-cat-body .item{padding:10px 0 10px 10px;border-top:1px solid var(--line)}
.grupo-cat-body .item:first-child{border-top:none}
.venc{display:inline-block;font-size:var(--fs-1);font-weight:600;margin-top:3px}
.venc.venc-ok{color:var(--muted)}
.venc.venc-atencao{color:var(--andamento-txt)}
.venc.venc-vencido{color:#8B2E22;font-weight:700}

.vazio{color:var(--muted);font-size:var(--fs-3);padding:16px 0;text-align:center}

footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:var(--fs-2);color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<script src="config.js"></script>
</head>
<body>
<!--B4U:START-->
<style id="b4u-oculta-chamado">/* Abertura de chamado oculta por ora. O "?" (#b4u-help) abre ESTE MESMO modal:
   deixá-lo visível era uma porta de serviço para um recurso que decidimos segurar. */ #b4u-open,#ac-abrir,#b4u-help{display:none!important}</style>
<script>window.B4U = { area:'societario' };</script>
<!-- ═══════════ back4you · cabeçalho + chamados (compartilhado) ═══════════
     Bloco único, autocontido e com prefixo .b4u- (não conflita com o CSS da
     página). Cole logo depois de <body>, e ANTES dele defina:
        <script>window.B4U = { area:'fiscal' };</script>
     area = área padrão do chamado desta página
        (fiscal | dpto_pessoal | contabil | societario | equiparacao | outros)
     home:true  -> esconde o botão "Início" (usar só no index).
     Para reaproveitar em todas as páginas, mantenha este bloco IDÊNTICO. ─── -->
<style>
.b4u-bar{position:sticky;top:0;z-index:900;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 18px;background:var(--brand-dark);color:#fff;box-shadow:0 2px 12px rgba(7,48,52,.20);
  font-family:'Montserrat',system-ui,-apple-system,sans-serif}
/* min-height nos três: no celular a barra inteira ficava com ~34px de alto e o dedo
   errava o alvo. 44px é o mínimo que a mão acerta de primeira. */
.b4u-bar .b4u-logo{font-weight:800;font-size:var(--fs-5);letter-spacing:-.02em;margin-right:auto;
  color:#fff;text-decoration:none;display:inline-flex;align-items:center;line-height:1;min-height:44px}
.b4u-bar .b4u-logo .y{color:var(--brand-euc)}
.b4u-btn{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;min-height:44px;
  font-family:inherit;font-weight:600;font-size:var(--fs-3);padding:8px 13px;border-radius:var(--radius-sm);
  text-decoration:none;transition:background .15s,transform .08s;line-height:1;white-space:nowrap}
.b4u-btn svg{width:16px;height:16px;flex-shrink:0}
.b4u-btn .b4u-lbl{color:inherit;text-transform:none;letter-spacing:normal;font-size:var(--fs-3)}
.b4u-btn:active{transform:translateY(1px)}
.b4u-btn.ghost{background:rgba(255,255,255,.10);color:#fff}
.b4u-btn.ghost:hover{background:rgba(255,255,255,.18)}
/* Branco sobre o verde do WhatsApp dá 1,98:1 — ilegível no sol. Verde-escuro: 7,23:1.
   É o botão que ele usa para pedir socorro; não pode ser o mais difícil de ler. */
.b4u-btn.wa{background:#25D366;color:#06302b}
.b4u-btn.wa:hover{background:#20bd5a}
.b4u-btn.call{background:var(--brand-teal-txt);color:#fff}
.b4u-btn.call:hover{background:#0A5F5A}
.b4u-icobtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  padding:0;border:0;cursor:pointer;border-radius:var(--radius-sm);background:rgba(255,255,255,.10);color:#fff;
  transition:background .15s}
.b4u-icobtn:hover{background:rgba(255,255,255,.18)}
.b4u-icobtn svg{width:17px;height:17px}
@media(max-width:640px){
  .b4u-bar{gap:7px;padding:9px 12px}
  /* display:none tira o nome da árvore de acessibilidade e o leitor anuncia
     "link, link, botão". Some da TELA, continua existindo para quem ouve. */
  .b4u-btn .b4u-lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  /* sem rótulo o botão fica só com o ícone de 16px: 11px de folga dava 38px de
     largura. 14px fecha os 44px nos dois eixos. */
  .b4u-btn{padding:9px 14px}
}
.b4u-ov{position:fixed;inset:0;z-index:1000;background:rgba(7,48,52,.45);
  display:none;align-items:flex-end;justify-content:center;
  font-family:'Montserrat',system-ui,-apple-system,sans-serif}
.b4u-ov.on{display:flex}
@media(min-width:640px){.b4u-ov{align-items:center;padding:24px}}
.b4u-modal{position:relative;z-index:1010;background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@media(min-width:640px){.b4u-modal{border-radius:var(--radius-lg)}}
.b4u-modal h3{font-size:var(--fs-5);font-weight:800;padding:18px 20px 3px;letter-spacing:-.01em}
.b4u-modal .b4u-sub{font-size:var(--fs-2);color:#6E6256;padding:0 20px 10px;line-height:1.5}
.b4u-fld{padding:7px 20px}
.b4u-fld label{display:block;font-size:var(--fs-2);font-weight:700;color:var(--ink-2);margin-bottom:5px}
.b4u-fld select,.b4u-fld input,.b4u-fld textarea{width:100%;font-family:inherit;font-size:16px;
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-warm);color:var(--ink)}
.b4u-fld textarea{min-height:120px;resize:vertical;line-height:1.5}

      selTipo.innerHTML = opcoesTipo(this.value, selTipo.value);
      aplicaSkeleton(true);
    });
    ov.querySelector('#b4u-cancel').addEventListener('click', tentarFechar);
    ov.addEventListener('click', function(e){ if(e.target===ov) tentarFechar(); });
    ov.querySelector('#b4u-send').addEventListener('click', enviar);
    // o seletor de "tipo do documento" só aparece quando há um arquivo anexado
    var fileEl = ov.querySelector('#b4u-file');
    var tdWrap = ov.querySelector('#b4u-tipodoc-wrap');
    fileEl.addEventListener('change', function(){
      tdWrap.style.display = (fileEl.files && fileEl.files.length) ? 'block' : 'none';
    });
    ov.querySelector('#b4u-assunto').focus();
  }

  function enviar(){
    var cc = idc();
    var erroEl = ov.querySelector('#b4u-erro');
    var btn = ov.querySelector('#b4u-send');
    erroEl.textContent = '';
    if(!cc.id || !cc.codigo){ erroEl.textContent = 'Abra o painel pelo seu link (com ID e código) para enviar um chamado.'; return; }
    var area = ov.querySelector('#b4u-area').value;
    var tipo = ov.querySelector('#b4u-tipo').value;
    var assunto = ov.querySelector('#b4u-assunto').value.trim();
    var msg = ov.querySelector('#b4u-msg').value.trim();
    if(!msg){ erroEl.textContent = 'Escreva a mensagem do chamado.'; return; }
    var fileEl = ov.querySelector('#b4u-file');
    var file = fileEl && fileEl.files && fileEl.files[0];
    if(file && file.size > 10*1024*1024){ erroEl.textContent = 'O anexo tem mais de 10 MB. Envie um arquivo menor.'; return; }
    btn.disabled = true; btn.textContent = 'Enviando…';
    var falhou = function(e){ btn.disabled=false; btn.textContent='Enviar chamado'; erroEl.textContent = msgAmigavel(e); };
    if(file){
      // COM arquivo -> POST (JSONP/GET não comporta base64)
      var reader = new FileReader();
      reader.onload = function(){
        var base64 = String(reader.result||'').split(',')[1] || '';
        var tdEl = ov.querySelector('#b4u-tipodoc');
        var tipoDoc = (tdEl && tdEl.value) ? tdEl.value : 'principal';
        var body = JSON.stringify({ id:cc.id, codigo:cc.codigo, acao:'ticket_anexo',
          area:area, tipo:tipo, assunto:assunto, mensagem:msg, tipo_documento:tipoDoc,
          arquivo_nome:file.name, arquivo_tipo:file.type, arquivo_base64:base64 });
        fetch(api(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body })
          .then(function(r){ return r.json(); })
          .then(function(d){ if(d && d.erro) throw new Error(d.erro); sucesso(); })
          .catch(falhou);
      };
      reader.onerror = function(){ falhou(new Error('Não consegui ler o arquivo.')); };
      reader.readAsDataURL(file);
      return;
    }
    // SEM arquivo -> JSONP como sempre
    var qs = new URLSearchParams({ id:cc.id, codigo:cc.codigo, acao:'ticket',
      area:area, tipo:tipo, assunto:assunto, mensagem:msg });
    jsonp(api()+'?'+qs.toString()).then(function(d){
      if(d && d.erro) throw new Error(d.erro);
      sucesso();
    }).catch(falhou);
  }

  function sucesso(){

      '<div class="b4u-modal">' +

          '<div class="b4u-foot" style="position:static;padding:0">' +
            '<button type="button" class="b4u-btn cancel" id="b4u-fecha">Fechar</button>' +
            '<a class="b4u-btn primary" id="b4u-ir-tickets" href="'+esc(linkTickets)+'">Ir para meus chamados</a>' +
          '</div>' +
        '</div>' +
      '</div>';
    ov.querySelector('#b4u-fecha').addEventListener('click', fecharModal);
    // Se já estou em meus chamados, trocar só o hash não recarrega — força o reload
    // para o novo chamado aparecer. Em outra página, navega normalmente.
    ov.querySelector('#b4u-ir-tickets').addEventListener('click', function(e){
      if (/meustickets\.html/i.test(location.pathname)){
        e.preventDefault();
        if (C.id) location.hash = C.id + (C.codigo ? '-'+C.codigo : '');
        location.reload();
      }
    });
  }

  bar.querySelector('#b4u-open').addEventListener('click', function(){ abrir({}); });
  bar.querySelector('#b4u-help').addEventListener('click', function(){ abrir({ area:'outros', tipo:'livre' }); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && ov.classList.contains('on')) tentarFechar(); });

  // ---- Puxar para atualizar (mobile) --------------------------------------
  // Só age quando a página está no topo e o gesto é para baixo; recarrega ao soltar
  // depois do limiar. Não atrapalha a rolagem normal.
  (function(){
    var ind=document.createElement('div'); ind.className='b4u-ptr';
    ind.innerHTML='<span class="ring"></span><span class="txt">Puxe para atualizar</span>';
    document.body.appendChild(ind);
    var y0=null, dist=0, LIM=70, ativo=false;
    function topo(){ return (window.scrollY||document.documentElement.scrollTop||0)<=0; }
    window.addEventListener('touchstart',function(e){
      if(e.touches.length!==1 || !topo() || (ov&&ov.classList.contains('on'))){ y0=null; return; }
      y0=e.touches[0].clientY; ativo=true;
    },{passive:true});
    window.addEventListener('touchmove',function(e){
      if(!ativo||y0===null) return;
      dist=e.touches[0].clientY - y0;
      if(dist<=0){ ind.style.height='0'; return; }
      if(!topo()){ ativo=false; ind.style.height='0'; return; }
      var h=Math.min(dist*0.5, LIM+20); ind.style.height=h+'px';
      ind.querySelector('.txt').textContent = dist>LIM?'Solte para atualizar':'Puxe para atualizar';
    },{passive:true});
    window.addEventListener('touchend',function(){
      if(!ativo){ return; } ativo=false;
      if(dist>LIM){ ind.classList.add('spin'); ind.style.height=(LIM)+'px'; ind.querySelector('.txt').textContent='Atualizando…'; setTimeout(function(){ location.reload(); },150); }
      else { ind.style.height='0'; }
      y0=null; dist=0;
    });
  })();

  window.B4U = { __ready:true, area: CFG.area||'outros', abrirChamado: abrir, meusTickets: linkTickets,
    msgAmigavel: msgAmigavel,
    CACHE_MS: CACHE_MS, cacheChave: cacheChave, cacheLer: cacheLer,

    // helper de skeleton: devolve N barrinhas "carregando" (as páginas usam no lugar do spinner)
    skeleton: function(linhas, alt){ var h=alt||16, g=[]; for(var i=0;i<(linhas||3);i++){
      var w=[92,78,85,60][i%4]; g.push('<div class="b4u-skel" style="height:'+h+'px;width:'+w+'%;margin:0 auto 12px"></div>'); }
      return g.join(''); } };
})();

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
const TIPO = 'societario';
const TITULO_PAGINA = 'Societário';
// Equiparação é a única categoria reservada — aparece só no equiparacao.html.
// Qualquer outra categoria (Paciente, Alvarás, Contratos, o que o time escrever)
// é livre e aparece aqui, agrupada.
const CATEGORIA_EXCLUIDA = 'Equiparação';

function normTxt(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Atalhos de teclado: "/" foca a busca, "Esc" limpa. Fica quieto quando a pessoa
   já está digitando em outro campo (input, textarea, select ou área editável). */
const ATALHOS_LIGADOS = {};
function atalhosDeBusca(idCampo, aoLimpar, aoFocar){
  if(ATALHOS_LIGADOS[idCampo]) return;            // não empilhar listeners em re-render
  ATALHOS_LIGADOS[idCampo] = true;
  document.addEventListener('keydown', ev=>{
    const campo = document.getElementById(idCampo); if(!campo) return;
    const alvo = ev.target, tag = (alvo && alvo.tagName || '').toLowerCase();
    const digitando = tag==='input' || tag==='textarea' || tag==='select' || (alvo && alvo.isContentEditable);
    if(ev.key==='/' && !digitando && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
      ev.preventDefault();
      if(aoFocar) aoFocar();                      // abre o painel de filtros, se houver
      const det = campo.closest && campo.closest('details');
      if(det && !det.open) det.open = true;       // e o bloco recolhido que a contém
      campo.focus(); campo.select && campo.select(); return;
    }
    if(ev.key==='Escape' && (alvo===campo || (!digitando && campo.value))){
      if(!campo.value){ campo.blur(); return; }
      campo.value=''; if(aoLimpar) aoLimpar();
    }
  });
}

function getIdCodigo(){
  const qs = new URLSearchParams(location.search);
  let id = qs.get('id') || '';
  let codigo = qs.get('codigo') || '';
  if (!id){
    const h = location.hash.replace('#','').trim();
    const comCodigo = h.match(/^(\d+)-(.+)$/);
    const soId = h.match(/^(\d+)$/);
    if (comCodigo) { id = comCodigo[1]; codigo = comCodigo[2]; }
    else if (soId) { id = soId[1]; }
  }
  return { id: id.replace(/\D/g,''), codigo: codigo.trim() };
}

/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
function jsonpAviso(txt){
  const p = document.getElementById('espera-txt')
       || document.querySelector('#app .state p')
       || document.querySelector('.state p');
  if(p) p.textContent = txt;
}
function jsonpTentativa(url){
  return new Promise((ok,fail)=>{
    const cb = 'cb_'+Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(()=>{ limpa(); fail(new Error('A API não respondeu.')); }, JSONP_TETO);
    function limpa(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { limpa(); ok(d); };
    s.onerror = () => { limpa(); fail(new Error('Não consegui alcançar a API.')); };
    s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
    document.body.appendChild(s);
  });
}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. Enquanto
   espera, a tela diz que ainda estamos buscando — erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    if(typeof pararEspera === 'function'){ try{ pararEspera(); }catch(_){} }
    jsonpAviso('Ainda estou buscando — tentando de novo…');
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}

let IDENTIDADE = { id: '', codigo: '' };

async function carregarTipo(tipo){
  const { id, codigo } = IDENTIDADE;
  if (API_URL){
    const url = API_URL + '?id=' + encodeURIComponent(id) + '&codigo=' + encodeURIComponent(codigo) + '&tipo=' + tipo;
    const d = await jsonp(url);
    if (d.erro) throw new Error(d.erro);
    return d;
  }
  const arq = tipo === 'modelos' ? 'demo_modelos.json' : `demo_${TIPO}.json`;
  const r = await fetch(arq);
  if (!r.ok) throw new Error(`Sem API configurada e sem ${arq} ao lado deste arquivo.`);
  return r.json();
}

function dBR(iso){
  if (!iso) return '';
  const s = String(iso).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s; // texto livre (ex.: "set/2025") — mostra exatamente como o colaborador escreveu
  return `${m[3]}/${m[2]}/${m[1]}`;
}

function classeStatus(status){
  const n = normTxt(status);
  if (n.includes('conclu')) return 'concluido';
  if (n.includes('andament')) return 'andamento';
  return 'aguardando';
}

function periodoEtapa(e){
  // Mostra a data que EXISTIR (início e/ou finalização), cada uma independente.
  // Se estiver vazia, simplesmente não aparece (sem erro). MESTRA: data_inicio / data_fim.
  const ini = String(e.data_inicio || e.inicio || e.data || '').trim();
  const fim = String(e.data_fim || e.data_finalizacao || e.finalizacao || e.fim || '').trim();
  const partes = [];
  if (ini) partes.push('Início ' + dBR(ini));
  if (fim) partes.push('Fim ' + dBR(fim));
  return partes.join(' · ');
}

/* Com quem está a bola nesta etapa. Sai do STATUS que vem da planilha (Aguardando /
   Em andamento / Concluído / Não se aplica) cruzado com o NOME da etapa, que é quem
   nomeia o órgão. Quando nada disso é conclusivo devolvemos null e a linha não
   aparece — chutar "está com a gente" é pior do que não dizer nada. */
const ORGAO_FORA = /cart[oó]rio|conselho|cremes|cremer|crm|prefeitura|receita|caixa|cef|banco/;
function responsavelEtapa(e){
  const st = normTxt(e && e.status);
  const nm = normTxt(e && e.nome);
  if (!st) return null;
  if (/conclu|finaliz|encerrad|nao se aplica/.test(st)) return null;   // etapa fechada: ninguém deve nada
  if (/assinatur|assinar|com o cliente|aguardando cliente|com voce|do cliente/.test(st + ' ' + nm))
    return { txt:'Com você — precisamos da sua assinatura', voce:true };
  if (/junta|juce/.test(nm)) return { txt:'Com a Junta Comercial' };
  if (ORGAO_FORA.test(nm)) return null;            // outro órgão: sabemos que não é conosco, mas não o nome certo
  if (/andament/.test(st)) return { txt:'Com a back4you' };
  return null;                                     // "Aguardando" sem órgão conhecido
}

/* `indices` desenha só as etapas pedidas (a corrente, que fica fora do dropdown).
   Sem ele, a linha do tempo inteira, como sempre foi. */
function timelineHTML(p, indices){
  // Observações (livres e internas) por etapa NÃO aparecem para o cliente.
  const todas = p.etapas || [];
  const lista = indices ? indices.map(i=>todas[i]).filter(Boolean) : todas;
  return `<div class="timeline">
    ${lista.map((e)=>{
      const cl = classeStatus(e.status);
      const per = periodoEtapa(e);
      const r = responsavelEtapa(e);
      return `<div class="etapa ${cl}">
        <div class="etapa-nome">${esc(e.nome)}</div>
        <div class="etapa-meta">
          ${per ? `<span class="etapa-datas">${esc(per)}</span>` : ''}
          <span class="etapa-status ${cl}">${esc(e.status || '—')}</span>
        </div>
        ${r ? `<div class="etapa-resp${r.voce?' voce':''}">${esc(r.txt)}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

/** Índice da etapa que está valendo agora: a em andamento; senão a primeira que
    ainda não concluiu; senão a última. */
function indiceEtapaAtual(p){
  const et = p.etapas || [];
  let i = et.findIndex(e => classeStatus(e.status) === 'andamento');
  if (i < 0) i = et.findIndex(e => classeStatus(e.status) !== 'concluido');
  if (i < 0) i = et.length - 1;
  return i;
}

/* Herói: em que etapa está o processo e com quem está a bola. Um processo parado
   há 40 dias na Junta e um esperando a assinatura DELE eram visualmente idênticos. */
function desenharHeroi(alteracoes){
  const lbl = document.getElementById('heroi-lbl');
  const hv  = document.getElementById('heroi-v');
  const hs  = document.getElementById('heroi-sub');
  const hp  = document.getElementById('heroi-pe');
  if (!lbl || !hv || !hs || !hp) return;
  hp.className = 'heroi-pe';

  const andando = (alteracoes||[]).filter(p => !p.concluido);
  if (!andando.length){
    lbl.textContent = '';
    hv.textContent  = 'Nenhum processo em andamento';
    hs.textContent  = 'Nada da sua empresa está tramitando. Seus documentos e contratos estão logo abaixo.';
    hp.textContent  = '';
    return;
  }

  const p = andando[0];
  const et = p.etapas || [];
  lbl.textContent = andando.length > 1 ? 'Seus processos em andamento' : 'Seu processo em andamento';
  hv.textContent  = p.processo || 'Processo em andamento';

  if (et.length){
    const i = indiceEtapaAtual(p);
    const atual = et[i] || {};
    const desde = String(atual.data_inicio || atual.inicio || atual.data || '').trim();
    hs.innerHTML = `Etapa ${i+1} de ${et.length} — <b>${esc(atual.nome || '—')}</b>` +
                   (desde ? `, desde ${esc(dBR(desde))}` : '') + '.';
    const r = responsavelEtapa(atual);
    if (r && r.voce){
      hp.className = 'heroi-pe voce';
      hp.textContent = 'Está com você — precisamos da sua assinatura para seguir.';
    } else if (r && /Junta/.test(r.txt)){
      hp.textContent = 'Está com a Junta Comercial. Você não precisa fazer nada agora — avisamos assim que sair.';
    } else if (r){
      hp.textContent = 'Está com a back4you. Você não precisa fazer nada agora — avisamos assim que andar.';
    } else {
      hp.textContent = '';        // sem saber de quem é a vez, não prometemos nada
    }
  } else {
    hs.textContent = p.status_geral || 'Em andamento.';
    hp.textContent = '';
  }
}

/* Barra de progresso horizontal (linha do tempo resumida): etapa 1 → 2 → 3. */
function stepperHTML(p){
  const n = (p.etapas||[]).length; if(!n) return '';
  const done = p.etapas.filter(e=>classeStatus(e.status)==='concluido').length;
  const emAnd = p.etapas.some(e=>classeStatus(e.status)==='andamento');
  const dots = p.etapas.map((e,i)=>{ const cl=classeStatus(e.status);
    return `<span class="st-passo"><span class="st-dot ${cl}"></span><span class="st-lbl">${esc(e.nome)}</span></span>`;
  }).join('<span class="st-linha"></span>');
  const pct = Math.round((done/n)*100);
  return `<div class="stepper">
    <div class="stepper-topo"><span class="stepper-cap">${done} de ${n} etapa${n>1?'s':''} concluída${done===1?'':'s'}${emAnd&&done<n?' · 1 em andamento':''}</span><b class="stepper-pct">${pct}%</b></div>
    <div class="stepper-track"><div class="stepper-fill" style="width:${Math.max(3,pct)}%"></div></div>
    <div class="stepper-passos">${dots}</div>
  </div>`;
}

function desenharAlteracoes(alteracoes){
  const box = document.getElementById('alteracoes');
  if (!alteracoes.length){
    box.innerHTML = '<div class="card"><div class="vazio">Nenhuma alteração societária em aberto no momento.</div></div>';
    return;
  }
  // Em andamento primeiro; concluídos vão para o fim (e entram recolhidos).
  const ordenadas = alteracoes.slice().sort((a,b)=>
    (a.concluido === b.concluido) ? 0 : (a.concluido ? 1 : -1));

  box.innerHTML = ordenadas.map(p=>{
    const nEt = (p.etapas||[]).length;
    // Observações do processo NÃO aparecem para o cliente (nem no texto de busca).
    const busca = normTxt(p.processo) + ' ' + normTxt(p.status_geral||'');
    if (p.concluido){
      // processo inteiro concluído -> recolhido, com opção de expandir
      return `<div class="card processo-card recolhido" data-busca="${busca}">
        <button class="processo-toggle" data-proc aria-expanded="false">
          <span class="lado">
            <span class="status-chip status-concluido">${esc(p.status_geral||'Concluído')}</span>
            <h3>${esc(p.processo)}</h3>
            <span class="conta">${nEt} etapa${nEt>1?'s':''}</span>
          </span>
          <span class="seta">▸</span>
        </button>
        <div class="processo-corpo" style="display:none">${timelineHTML(p)}</div>
      </div>`;
    }
    /* Só a etapa CORRENTE fica aberta: é ela que responde "em que pé está" e é ela
       que carrega o "precisamos da sua assinatura". As outras entram no dropdown —
       seis etapas abertas de uma vez eram a parede desta tela. O status geral e o
       stepper ficam fora, sempre à vista. */
    const et = p.etapas || [];
    const i = indiceEtapaAtual(p);
    /* Pendência dentro de bloco recolhido não existe: se outra etapa também está com
       o cliente, o dropdown nasce aberto. */
    const abre = et.some((e,k)=>{ if(k===i) return false; const r = responsavelEtapa(e); return !!(r && r.voce); });
    return `<div class="card processo-card" data-busca="${busca}">
      <div class="processo-head">
        <h3>${esc(p.processo)}</h3>
        <span class="status-chip status-andamento">${esc(p.status_geral||'Em andamento')}</span>
      </div>
      ${stepperHTML(p)}
      ${et.length ? timelineHTML(p, [i]) : ''}
      ${et.length > 1 ? `<div class="grupo-cat">
        <button class="grupo-cat-btn" data-etapas aria-expanded="${abre}">
          <span class="grupo-cat-nome">Ver todas as etapas</span>
          <span class="grupo-cat-conta">${et.length}</span>
          <span class="seta"${abre?' style="transform:rotate(180deg)"':''}>▾</span>
        </button>
        <div class="grupo-cat-body" style="display:${abre?'block':'none'}">${timelineHTML(p)}</div>
      </div>` : ''}
    </div>`;
  }).join('');

  box.onclick = (ev)=>{
    const proc = ev.target.closest('[data-proc]');
    if (proc){
      const corpo = proc.parentElement.querySelector('.processo-corpo');
      const abrir = corpo.style.display === 'none';
      corpo.style.display = abrir ? 'block' : 'none';
      proc.setAttribute('aria-expanded', abrir);
      return;
    }
    const eta = ev.target.closest('[data-etapas]');
    if (eta){
      const corpo = eta.parentElement.querySelector('.grupo-cat-body');
      const abrir = corpo.style.display === 'none';
      corpo.style.display = abrir ? 'block' : 'none';
      eta.setAttribute('aria-expanded', abrir);
      eta.querySelector('.seta').style.transform = abrir ? 'rotate(180deg)' : '';
      return;
    }
  };
}

const hoje = new Date(); hoje.setHours(0,0,0,0);

// Aceita AAAA-MM-DD, AAAA-MM-DD HH:MM:SS e dd/mm/aaaa. Se não reconhecer, devolve null
// (o chamador não mostra selo — nunca "NaN"). Espelha a tolerância de dBR().
function parseVenc(iso){
  const s = String(iso||'').trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);   // ISO, com ou sem hora
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);      // dd/mm/aaaa
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  return null;
}

function vencimentoInfo(iso){
  if (!iso) return '';
  const venc = parseVenc(iso);
  if (!venc || isNaN(venc)) return '';   // data não interpretável -> sem selo (nunca "NaN")
  const dias = Math.round((venc - hoje) / 864e5);
  let classe = 'venc-ok', texto;
  if (dias < 0){ classe = 'venc-vencido'; texto = `Venceu há ${-dias}d`; }
  else if (dias <= 60){ classe = 'venc-atencao'; texto = `Vence em ${dias}d`; }
  else { texto = `Vence ${dBR(iso)}`; }
  return `<span class="venc ${classe}">${texto}</span>`;
}

/* Certificados e licenças — SÓ os vencimentos (nunca logins/senhas).
 * Fonte: a aba "Documentos" da planilha do cliente (qualquer documento que tenha
 * "vencimento" preenchido: Alvará Sanitário, Certificado e-CNPJ, Regularidade CRM…).
 * Os logins ficam na aba interna "Acessos", que NÃO vem para o painel. */

/** `modelos === null` = ainda vindo (a página não espera por eles para pintar). */
function desenharModelos(modelos){
  const box = document.getElementById('modelos');
  if (!box) return;
  if (modelos === null){
    box.innerHTML = '<div style="padding:8px 0">' +
      ((window.B4U && B4U.skeleton) ? B4U.skeleton(2, 14) : '') + '</div>';
    return;
  }
  const visiveis = modelos.filter(m => normTxt(m.categoria) !== normTxt(CATEGORIA_EXCLUIDA));
  if (!visiveis.length){ box.innerHTML = '<div class="vazio">Nenhum modelo cadastrado ainda.</div>'; return; }

  // Agrupa preservando a ordem de primeira aparição de cada categoria.

  visiveis.forEach(m=>{
    const cat = String(m.categoria||'Outros').trim();
    if (!grupos.has(cat)) grupos.set(cat, []);

  box.innerHTML = Array.from(grupos.entries()).map(([cat, itens], i)=>{
    const catId = 'cat-' + i;
    return `<div class="grupo-cat" data-busca="${normTxt(cat)} ${itens.map(m=>normTxt(m.documento)).join(' ')}">
      <button class="grupo-cat-btn" aria-expanded="false" onclick="
        const body=document.getElementById('${catId}'); const abrir=body.style.display!=='block';
        body.style.display = abrir?'block':'none'; this.setAttribute('aria-expanded', abrir);
        this.querySelector('.seta').style.transform = abrir?'rotate(180deg)':'';
      ">
        <span class="grupo-cat-nome">${esc(cat)}</span>
        <span class="grupo-cat-conta">${itens.length}</span>
        <span class="seta">▾</span>
      </button>
      <div class="grupo-cat-body" id="${catId}" style="display:none">
        ${itens.map(m=>{
          const link = m.link && String(m.link).trim();
          return `<div class="item" data-busca="${normTxt(m.documento)}">
            <div class="nome">${esc(m.documento)}</div>
            ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Abrir ↗</a>` : `<span class="em-breve">Em breve</span>`}
          </div>`;
        }).join('')}

/* ---------------- busca ----------------
   Cada seção é um par (cabeçalho, caixa). Quando nada bate dentro dela, o
   cabeçalho some junto com a caixa — senão o título fica sobre um vazio e dá a
   impressão de que os dados sumiram. O contador diz quantos resultados vieram e
   oferece o "limpar". */
const SECOES_BUSCA = [
  {head:'sec-venc',       box:'vencimentos'},
  {head:'sec-alteracoes', box:'alteracoes'},
  {head:'sec-documentos', box:'documentos'},
  {head:'sec-modelos',    box:'modelos'}
];
/* Só os itens contam como resultado; o .grupo-cat dos modelos é embalagem. */
const SEL_BUSCA = '#documentos [data-busca], #alteracoes [data-busca], #vencimentos [data-busca], #modelos .item[data-busca]';

/* Bloco recolhido que a busca alcança: abre sozinho quando há resultado dentro dele
   e volta a fechar quando a busca é limpa. */
function abrirSeBuscar(idBtn, idBody, alvo){
  const btn = document.getElementById(idBtn), body = document.getElementById(idBody);
  if (!btn || !body) return;
  const tem = !!alvo && Array.from(body.querySelectorAll('[data-busca]')).some(el=>el.style.display !== 'none');
  if (tem){
    body.style.display = 'block';
    btn.setAttribute('aria-expanded','true');
    btn.querySelector('.seta').style.transform = 'rotate(180deg)';
  } else if (!alvo){
    body.style.display = 'none';
    btn.setAttribute('aria-expanded','false');
    btn.querySelector('.seta').style.transform = '';
  }
}

/* Guarda como cada seção aparece SEM busca (vencimentos já nasce escondida). */
function memorizarSecoes(){
  SECOES_BUSCA.forEach(s=>{
    const head = document.getElementById(s.head), box = document.getElementById(s.box);
    if (head) head.dataset.disp = head.style.display || '';
    if (box)  box.dataset.disp  = box.style.display  || '';
  });
}

function filtrar(termo){
  const alvo = normTxt(termo);
  let achados = 0;

  // Documentos, processos e vencimentos — mostrar/esconder simples.
  document.querySelectorAll(SEL_BUSCA).forEach(el=>{
    const bate = !alvo || el.dataset.busca.includes(alvo);
    el.style.display = bate ? '' : 'none';
    if (alvo && bate) achados++;
  });

  // Modelos — agrupados: some o grupo inteiro se nada bater, e abre sozinho
  // o grupo que tiver resultado (fecha de novo se a busca for limpa).
  document.querySelectorAll('#modelos .grupo-cat').forEach(grupo=>{
    const bate = !alvo || grupo.dataset.busca.includes(alvo);
    grupo.style.display = bate ? '' : 'none';
    const body = grupo.querySelector('.grupo-cat-body');
    const btn = grupo.querySelector('.grupo-cat-btn');
    // grupo que bateu só pelo nome da categoria também conta como resultado
    if (alvo && bate && !Array.from(grupo.querySelectorAll('.item[data-busca]')).some(el=>el.style.display !== 'none')) achados++;
    if (bate && alvo){
      body.style.display = 'block';
      btn.setAttribute('aria-expanded', 'true');
      btn.querySelector('.seta').style.transform = 'rotate(180deg)';
    } else if (!alvo){
      body.style.display = 'none';
      btn.setAttribute('aria-expanded', 'false');
      btn.querySelector('.seta').style.transform = '';
    }
  });

  // Documentos recolhidos: a busca abre o bloco quando acha algo lá dentro — senão
  // ela diria "3 resultados" e a tela não mostraria nenhum.
  abrirSeBuscar('btn-docs', 'body-docs', alvo);

  SECOES_BUSCA.forEach(s=>{
    const head = document.getElementById(s.head), box = document.getElementById(s.box);
    if (!head || !box) return;
    const itens = box.querySelectorAll('[data-busca]');
    const visiveis = Array.from(itens).filter(el=>el.style.display !== 'none').length;
    const esconder = !!alvo && (itens.length === 0 || visiveis === 0);
    head.style.display = esconder ? 'none' : (head.dataset.disp || '');
    box.style.display  = esconder ? 'none' : (box.dataset.disp  || '');
  });

  mostrarResumoBusca(termo, achados);
  sincronizarURL(String(termo || '').trim());
}

/* ---------- a busca sobrevive ao F5 ----------
   O `#id-codigo` do endereço é a CREDENCIAL da sessão: mexemos só na query e
   devolvemos o hash intacto — sobrescrevê-lo derruba o acesso do cliente. */
let TERMO_URL = '';
function lerURL(){
  try { TERMO_URL = new URLSearchParams(location.search).get('q') || ''; }
  catch(e){ TERMO_URL = ''; }
}
function sincronizarURL(termo){
  try {
    const u = new URL(location.href);
    if (termo) u.searchParams.set('q', termo); else u.searchParams.delete('q');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  } catch(e){}
}

function mostrarResumoBusca(termo, achados){
  const info = document.getElementById('busca-info');
  const vazio = document.getElementById('busca-vazio');
  const campo = document.getElementById('busca');
  const t = String(termo || '').trim();
  if (!info || !vazio) return;
  if (!t){ info.className = 'busca-info'; info.innerHTML = ''; vazio.className = 'busca-vazio'; vazio.innerHTML = ''; return; }

  info.className = 'busca-info on';
  info.innerHTML = `<span><b>${achados}</b> ${achados === 1 ? 'resultado' : 'resultados'} para <b>${esc(t)}</b></span>
    <span>·</span><button type="button" class="busca-limpar" id="busca-limpar">limpar</button>`;
  const btn = document.getElementById('busca-limpar');
  if (btn) btn.addEventListener('click', ()=>{ if (campo){ campo.value = ''; campo.focus(); } filtrar(''); });

  if (achados){ vazio.className = 'busca-vazio'; vazio.innerHTML = ''; return; }
  vazio.className = 'busca-vazio on';
  vazio.innerHTML = `Nada encontrado para <b>${esc(t)}</b>.
    <span class="busca-dica">Seus dados continuam aqui — só a busca não achou nada com esse termo.</span>`;
}

function el(h){ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; }
function appendAll(parent, h){
  const t = document.createElement('template'); t.innerHTML = h.trim();
  Array.from(t.content.children).forEach(n => parent.appendChild(n));
}

// Sem login (id/codigo) volta ao index; com login, mostra aviso amigável (sem loop de redirecionamento).
function erro(e){
  var ic=getIdCodigo(), id=ic.id, codigo=ic.codigo;

  var volta='index.html#'+id+(codigo?('-'+codigo):'');
  document.body.innerHTML=
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;'
   +'font-family:\'Montserrat\',system-ui,-apple-system,sans-serif;background:#F1E7DC;color:#113D39">'
   +'<div style="max-width:440px;text-align:center;background:#FFFFFF;border:1px solid #E4D9C9;'
   +'border-radius:var(--radius-lg);padding:32px 28px;box-shadow:0 6px 24px rgba(7,48,52,.06)">'
   +'<div style="font-size:var(--fs-6);line-height:1;margin-bottom:10px">📄</div>'
   +'<h2 style="margin:0 0 8px;font-size:var(--fs-5)">Não foi possível carregar suas informações agora.</h2>'
   +'<p style="margin:0 0 20px;font-size:var(--fs-4);line-height:1.5;color:#3F5854">'+(amigavel||'Se você acredita que isto é um erro, fale com o nosso atendimento que resolvemos rápido.')+'</p>'
   +'<a href="https://wa.me/5511937173906" target="_blank" rel="noopener" style="display:inline-block;background:#0C756F;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:var(--radius-pill);font-size:var(--fs-4)">Falar com o atendimento</a>'
   +'<div style="margin-top:14px"><a href="'+volta+'" style="color:#0C756F;font-size:var(--fs-3);text-decoration:none">Voltar ao início</a></div>'
   +'</div></div>';
}

/* Olhar a mesma frase por 45s é lido como "travou" — e ele recarrega, jogando fora o
   pedido que já estava a caminho. Trocar o texto é barato e compra paciência. */
var _tEspera = [
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Estamos buscando os seus dados na planilha…'; }, 4000),
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Está demorando mais que o normal — continuamos tentando.'; }, 10000),
  setTimeout(function(){ var p=document.getElementById('espera-txt');
    if(p) p.textContent = 'Quase lá — a primeira abertura do dia é a mais lenta.'; }, 20000)
];
function pararEspera(){ _tEspera.forEach(clearTimeout); }

/* Tarja discreta do cache: diz que o que está na tela veio do último acesso.
   Fica logo abaixo do herói — nunca por cima do estado do processo. */
function tarja(texto, falhou){
  const slot = document.getElementById('tarja-slot'); if(!slot) return;
  slot.innerHTML = texto ? `<div class="tarja-atualizando${falhou?' falhou':''}">${esc(texto)}</div>` : '';
}
function horaCache(ts){ return ts ? new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : 'antes'; }

/* Os modelos são a última seção da página e são iguais para todo cliente: não faz
   sentido a página inteira esperar por uma segunda execução do Apps Script. */
function carregarModelos(){
  return carregarTipo('modelos').then(r => r.modelos || []).catch(()=>[]);
}

(async function(){
  const { id, codigo } = getIdCodigo();
  IDENTIDADE = { id, codigo };
  if (!id || !codigo) return erro(new Error('Informe o ID e o código de acesso no final do endereço.'));
  lerURL();

  let pintadoDoCache = false, tsCache = 0;
  /* A segunda visita não recomeça do esqueleto: pintamos com o último payload (6h de
     validade) e atualizamos por baixo. Se a atualização falhar, o que está na tela
     continua — apagar dado bom por causa de uma rede ruim é pior que dado de 1h atrás. */
  if (API_URL && id && window.B4U && B4U.cacheLer){
    const bruto = B4U.cacheLer(TIPO, id);
    if (bruto){
      try{
        pararEspera(); render(bruto, null); tarja('Atualizando…');
        pintadoDoCache = true; tsCache = bruto.atualizado_em ? new Date(bruto.atualizado_em).getTime() : 0;
      }catch(err){ /* cache velho ou de outro formato: ignora e busca de novo */ }
    }
  }

  try {
    const dados = await carregarTipo(TIPO);
    if (API_URL && id && window.B4U && B4U.cacheGravar) B4U.cacheGravar(TIPO, id, dados);
    pararEspera(); render(dados, null); tarja('');
  } catch (e) {
    if (pintadoDoCache){ tarja('Não consegui atualizar agora — mostrando os dados de '+horaCache(tsCache)+'.', true); }
    else { return erro(e); }
  }
  // Modelos entram quando chegarem; a busca em curso é reaplicada sobre eles.
  carregarModelos().then(ms => {
    desenharModelos(ms);
    const campo = document.getElementById('busca');
    if (campo && campo.value.trim()) filtrar(campo.value);
  });
})();
</script>
</body>
</html>
