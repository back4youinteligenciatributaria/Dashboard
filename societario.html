  const campoBusca = document.getElementById('busca');
  if (TERMO_URL){ campoBusca.value = TERMO_URL; filtrar(TERMO_URL); }
}

function periodoEtapa(e){
  // Mostra a data que EXISTIR (início e/ou finalização), cada uma independente.
  // Se estiver vazia, simplesmente não aparece (sem erro). MESTRA: data_inicio / data_fim.
  const ini = String(e.data_inicio || e.inicio || e.data || '').trim();
  const fim = String(e.data_fim || e.data_finalizacao || e.finalizacao || e.fim || '').trim();
  const partes = [];
  if (ini) partes.push('Início ' + dBR(ini));
  if (fim) partes.push('Fim ' + dBR(fim));
  return partes.join(' · ');
}

/* Com quem está a bola nesta etapa. Sai do STATUS que vem da planilha (Aguardando /
   Em andamento / Concluído / Não se aplica) cruzado com o NOME da etapa, que é quem
   nomeia o órgão. Quando nada disso é conclusivo devolvemos null e a linha não
   aparece — chutar "está com a gente" é pior do que não dizer nada. */
const ORGAO_FORA = /cart[oó]rio|conselho|cremes|cremer|crm|prefeitura|receita|caixa|cef|banco/;
function responsavelEtapa(e){
  const st = normTxt(e && e.status);
  const nm = normTxt(e && e.nome);
  if (!st) return null;
  if (/conclu|finaliz|encerrad|nao se aplica/.test(st)) return null;   // etapa fechada: ninguém deve nada
  if (/assinatur|assinar|com o cliente|aguardando cliente|com voce|do cliente/.test(st + ' ' + nm))
    return { txt:'Com você — precisamos da sua assinatura', voce:true };
  if (/junta|juce/.test(nm)) return { txt:'Com a Junta Comercial' };
  if (ORGAO_FORA.test(nm)) return null;            // outro órgão: sabemos que não é conosco, mas não o nome certo
  if (/andament/.test(st)) return { txt:'Com a back4you' };
  return null;                                     // "Aguardando" sem órgão conhecido
}

/* `indices` desenha só as etapas pedidas (a corrente, que fica fora do dropdown).
   Sem ele, a linha do tempo inteira, como sempre foi. */
function timelineHTML(p, indices){
  // Observações (livres e internas) por etapa NÃO aparecem para o cliente.
  const todas = p.etapas || [];
  const lista = indices ? indices.map(i=>todas[i]).filter(Boolean) : todas;
  return `<div class="timeline">
    ${lista.map((e)=>{
      const cl = classeStatus(e.status);
      const per = periodoEtapa(e);
      const r = responsavelEtapa(e);
      return `<div class="etapa ${cl}">
        <div class="etapa-nome">${esc(e.nome)}</div>
        <div class="etapa-meta">
          ${per ? `<span class="etapa-datas">${esc(per)}</span>` : ''}
          <span class="etapa-status ${cl}">${esc(e.status || '—')}</span>
        </div>
        ${r ? `<div class="etapa-resp${r.voce?' voce':''}">${esc(r.txt)}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

/** Índice da etapa que está valendo agora: a em andamento; senão a primeira que
    ainda não concluiu; senão a última. */
function indiceEtapaAtual(p){
  const et = p.etapas || [];
  let i = et.findIndex(e => classeStatus(e.status) === 'andamento');
  if (i < 0) i = et.findIndex(e => classeStatus(e.status) !== 'concluido');
  if (i < 0) i = et.length - 1;
  return i;
}

/* Herói: em que etapa está o processo e com quem está a bola. Um processo parado
   há 40 dias na Junta e um esperando a assinatura DELE eram visualmente idênticos. */
function desenharHeroi(alteracoes){
  const lbl = document.getElementById('heroi-lbl');
  const hv  = document.getElementById('heroi-v');
  const hs  = document.getElementById('heroi-sub');
  const hp  = document.getElementById('heroi-pe');
  if (!lbl || !hv || !hs || !hp) return;
  hp.className = 'heroi-pe';

  const andando = (alteracoes||[]).filter(p => !p.concluido);
  if (!andando.length){
    lbl.textContent = '';
    hv.textContent  = 'Nenhum processo em andamento';
    hs.textContent  = 'Nada da sua empresa está tramitando. Seus documentos e contratos estão logo abaixo.';
    hp.textContent  = '';
    return;
  }

  const p = andando[0];
  const et = p.etapas || [];
  lbl.textContent = andando.length > 1 ? 'Seus processos em andamento' : 'Seu processo em andamento';
  hv.textContent  = p.processo || 'Processo em andamento';

  if (et.length){
    const i = indiceEtapaAtual(p);
    const atual = et[i] || {};
    const desde = String(atual.data_inicio || atual.inicio || atual.data || '').trim();
    hs.innerHTML = `Etapa ${i+1} de ${et.length} — <b>${esc(atual.nome || '—')}</b>` +
                   (desde ? `, desde ${esc(dBR(desde))}` : '') + '.';
    const r = responsavelEtapa(atual);
    if (r && r.voce){
      hp.className = 'heroi-pe voce';
      hp.textContent = 'Está com você — precisamos da sua assinatura para seguir.';
    } else if (r && /Junta/.test(r.txt)){
      hp.textContent = 'Está com a Junta Comercial. Você não precisa fazer nada agora — avisamos assim que sair.';
    } else if (r){
      hp.textContent = 'Está com a back4you. Você não precisa fazer nada agora — avisamos assim que andar.';
    } else {
      hp.textContent = '';        // sem saber de quem é a vez, não prometemos nada
    }
  } else {
    hs.textContent = p.status_geral || 'Em andamento.';
    hp.textContent = '';
  }
}

/* Barra de progresso horizontal (linha do tempo resumida): etapa 1 → 2 → 3.
   As etapas que chegam aqui são só as que se APLICAM a este processo — a MESTRA
   marca Sim/Não em cada uma das 14 do catálogo, e o backend não manda as de "Não".
   Então "3 de 7" quer dizer 3 das 7 que este processo realmente tem, e não 3 de um
   catálogo que inclui coisa que nunca vai acontecer aqui. */
function stepperHTML(p){
  const n = (p.etapas||[]).length; if(!n) return '';
  const done = p.etapas.filter(e=>classeStatus(e.status)==='concluido').length;
  const emAnd = p.etapas.some(e=>classeStatus(e.status)==='andamento');
  /* Previsão: vem calculada da MESTRA, em dias úteis, só das etapas aplicáveis e
     descontando feriados. É ESTIMATIVA e a tela diz isso com todas as letras —
     prazo de órgão público não se promete, e o cliente que lê "conclusão em 12/09"
     sem a palavra "prevista" cobra a data. */
  const prev = String(p.previsao||'').trim();
  const dots = p.etapas.map((e,i)=>{ const cl=classeStatus(e.status);
    return `<span class="st-passo"><span class="st-dot ${cl}"></span><span class="st-lbl">${esc(e.nome)}</span></span>`;
  }).join('<span class="st-linha"></span>');
  const pct = Math.round((done/n)*100);
  return `<div class="stepper">
    <div class="stepper-topo"><span class="stepper-cap">${done} de ${n} etapa${n>1?'s':''} concluída${done===1?'':'s'}${emAnd&&done<n?' · 1 em andamento':''}${prev?` · previsão: ${esc(dBR(prev))}`:''}</span><b class="stepper-pct">${pct}%</b></div>
    <div class="stepper-track"><div class="stepper-fill" style="width:${Math.max(3,pct)}%"></div></div>
    <div class="stepper-passos">${dots}</div>
    ${prev?`<p class="stepper-cap" style="margin:7px 0 0">Previsão estimada em dias úteis, considerando as etapas deste processo e os feriados. Prazos de cartório, junta comercial e conselho podem variar — avisamos a cada passo.</p>`:''}
  </div>`;
}

function desenharAlteracoes(alteracoes){
  const box = document.getElementById('alteracoes');
  if (!alteracoes.length){
    box.innerHTML = '<div class="card"><div class="vazio">Nenhuma alteração societária em aberto no momento.</div></div>';
    return;
  }
  // Em andamento primeiro; concluídos vão para o fim (e entram recolhidos).
  const ordenadas = alteracoes.slice().sort((a,b)=>
    (a.concluido === b.concluido) ? 0 : (a.concluido ? 1 : -1));

  box.innerHTML = ordenadas.map(p=>{
    const nEt = (p.etapas||[]).length;
    // Observações do processo NÃO aparecem para o cliente (nem no texto de busca).
    const busca = normTxt(p.processo) + ' ' + normTxt(p.status_geral||'');
    if (p.concluido){
      // processo inteiro concluído -> recolhido, com opção de expandir
      return `<div class="card processo-card recolhido" data-busca="${busca}">
        <button class="processo-toggle" data-proc aria-expanded="false">
          <span class="lado">
            <span class="status-chip status-concluido">${esc(p.status_geral||'Concluído')}</span>
            <h3>${esc(p.processo)}</h3>
            <span class="conta">${nEt} etapa${nEt>1?'s':''}</span>
          </span>
          <span class="seta">▸</span>
        </button>
        <div class="processo-corpo" style="display:none">${timelineHTML(p)}</div>
      </div>`;
    }
    /* Só a etapa CORRENTE fica aberta: é ela que responde "em que pé está" e é ela
       que carrega o "precisamos da sua assinatura". As outras entram no dropdown —
       seis etapas abertas de uma vez eram a parede desta tela. O status geral e o
       stepper ficam fora, sempre à vista. */
    const et = p.etapas || [];
    const i = indiceEtapaAtual(p);
    /* Pendência dentro de bloco recolhido não existe: se outra etapa também está com
       o cliente, o dropdown nasce aberto. */
    const abre = et.some((e,k)=>{ if(k===i) return false; const r = responsavelEtapa(e); return !!(r && r.voce); });
    return `<div class="card processo-card" data-busca="${busca}">
      <div class="processo-head">
        <h3>${esc(p.processo)}</h3>
        <span class="status-chip status-andamento">${esc(p.status_geral||'Em andamento')}</span>
      </div>
      ${stepperHTML(p)}
      ${et.length ? timelineHTML(p, [i]) : ''}
      ${et.length > 1 ? `<div class="grupo-cat">
        <button class="grupo-cat-btn" data-etapas aria-expanded="${abre}">
          <span class="grupo-cat-nome">Ver todas as etapas</span>
          <span class="grupo-cat-conta">${et.length}</span>
          <span class="seta"${abre?' style="transform:rotate(180deg)"':''}>▾</span>
        </button>
        <div class="grupo-cat-body" style="display:${abre?'block':'none'}">${timelineHTML(p)}</div>
      </div>` : ''}
    </div>`;
  }).join('');

  box.onclick = (ev)=>{
    const proc = ev.target.closest('[data-proc]');
    if (proc){
      const corpo = proc.parentElement.querySelector('.processo-corpo');
      const abrir = corpo.style.display === 'none';
      corpo.style.display = abrir ? 'block' : 'none';
      proc.setAttribute('aria-expanded', abrir);
      return;
    }
    const eta = ev.target.closest('[data-etapas]');
    if (eta){
      const corpo = eta.parentElement.querySelector('.grupo-cat-body');
      const abrir = corpo.style.display === 'none';
      corpo.style.display = abrir ? 'block' : 'none';
      eta.setAttribute('aria-expanded', abrir);
      eta.querySelector('.seta').style.transform = abrir ? 'rotate(180deg)' : '';
      return;
    }
  };
}

const hoje = new Date(); hoje.setHours(0,0,0,0);

// Aceita AAAA-MM-DD, AAAA-MM-DD HH:MM:SS e dd/mm/aaaa. Se não reconhecer, devolve null
// (o chamador não mostra selo — nunca "NaN"). Espelha a tolerância de dBR().
function parseVenc(iso){
  const s = String(iso||'').trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);   // ISO, com ou sem hora
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);      // dd/mm/aaaa
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  return null;
}

function vencimentoInfo(iso){
  if (!iso) return '';
  const venc = parseVenc(iso);
  if (!venc || isNaN(venc)) return '';   // data não interpretável -> sem selo (nunca "NaN")
  const dias = Math.round((venc - hoje) / 864e5);
  let classe = 'venc-ok', texto;
  if (dias < 0){ classe = 'venc-vencido'; texto = `Venceu há ${-dias}d`; }
  else if (dias <= 60){ classe = 'venc-atencao'; texto = `Vence em ${dias}d`; }
  else { texto = `Vence ${dBR(iso)}`; }
  return `<span class="venc ${classe}">${texto}</span>`;
}

/* Certificados e licenças — SÓ os vencimentos (nunca logins/senhas).
 * Fonte: a aba "Documentos" da planilha do cliente (qualquer documento que tenha
 * "vencimento" preenchido: Alvará Sanitário, Certificado e-CNPJ, Regularidade CRM…).
 * Os logins ficam na aba interna "Acessos", que NÃO vem para o painel. */
function desenharVencimentos(M){
  const itens = (M.documentos||[])
    .filter(d => d.vencimento && String(d.vencimento).trim())
    .map(d => ({ nome: d.documento, venc: d.vencimento }));
  if (!itens.length) return;
  document.getElementById('sec-venc').style.display = '';
  const box = document.getElementById('vencimentos'); box.style.display = '';
  box.innerHTML = itens.map(it=>`<div class="item" data-busca="${normTxt(it.nome)}">
      <div><div class="nome">${esc(it.nome)}</div></div>
      ${vencimentoInfo(it.venc)}
    </div>`).join('');
}

/* Arquivo morto: 23 linhas de documento entre o processo e os modelos. Recolhe, com
   a conta no rótulo. Nenhum vencimento se perde aqui — TODO documento com data já
   aparece inteiro em "Certificados e licenças", acima e sempre aberto. */
function desenharDocumentos(documentos){
  const box = document.getElementById('documentos');
  const comLink = (documentos||[]).filter(d => d.link && String(d.link).trim());
  if (!comLink.length){ box.innerHTML = '<div class="vazio">Nenhum documento cadastrado ainda.</div>'; return; }
  const itens = comLink.map(d=>{
    return `<div class="item" data-busca="${normTxt(d.documento)}">
      <div><div class="nome">${esc(d.documento)}</div>${vencimentoInfo(d.vencimento)}</div>
      <a href="${esc(d.link)}" target="_blank" rel="noopener">Abrir ↗</a>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="grupo-cat">
    <button class="grupo-cat-btn" id="btn-docs" aria-expanded="false">
      <span class="grupo-cat-nome">Ver os documentos da sua empresa</span>
      <span class="grupo-cat-conta">${comLink.length}</span>
      <span class="seta">▾</span>
    </button>
    <div class="grupo-cat-body" id="body-docs" style="display:none">${itens}</div>
  </div>`;
  const btn = document.getElementById('btn-docs');
  if (btn) btn.addEventListener('click', ()=>{
    const body = document.getElementById('body-docs');
    const abrir = body.style.display !== 'block';
    body.style.display = abrir ? 'block' : 'none';
    btn.setAttribute('aria-expanded', abrir);
    btn.querySelector('.seta').style.transform = abrir ? 'rotate(180deg)' : '';
  });
}

/** `modelos === null` = ainda vindo (a página não espera por eles para pintar). */
function desenharModelos(modelos){
  const box = document.getElementById('modelos');
  if (!box) return;
  if (modelos === null){
    box.innerHTML = '<div style="padding:8px 0">' +
      ((window.B4U && B4U.skeleton) ? B4U.skeleton(2, 14) : '') + '</div>';
    return;
  }
  const visiveis = modelos.filter(m => normTxt(m.categoria) !== normTxt(CATEGORIA_EXCLUIDA));
  if (!visiveis.length){ box.innerHTML = '<div class="vazio">Nenhum modelo cadastrado ainda.</div>'; return; }

  // Agrupa preservando a ordem de primeira aparição de cada categoria.
  const grupos = new Map();
  visiveis.forEach(m=>{
    const cat = String(m.categoria||'Outros').trim();
    if (!grupos.has(cat)) grupos.set(cat, []);
    grupos.get(cat).push(m);
  });

  box.innerHTML = Array.from(grupos.entries()).map(([cat, itens], i)=>{
    const catId = 'cat-' + i;
    return `<div class="grupo-cat" data-busca="${normTxt(cat)} ${itens.map(m=>normTxt(m.documento)).join(' ')}">
      <button class="grupo-cat-btn" aria-expanded="false" onclick="
        const body=document.getElementById('${catId}'); const abrir=body.style.display!=='block';
        body.style.display = abrir?'block':'none'; this.setAttribute('aria-expanded', abrir);
        this.querySelector('.seta').style.transform = abrir?'rotate(180deg)':'';
      ">
        <span class="grupo-cat-nome">${esc(cat)}</span>
        <span class="grupo-cat-conta">${itens.length}</span>
        <span class="seta">▾</span>
      </button>
      <div class="grupo-cat-body" id="${catId}" style="display:none">
        ${itens.map(m=>{
          const link = m.link && String(m.link).trim();
          return `<div class="item" data-busca="${normTxt(m.documento)}">
            <div class="nome">${esc(m.documento)}</div>
            ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Abrir ↗</a>` : `<span class="em-breve">Em breve</span>`}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

/* ---------------- busca ----------------
   Cada seção é um par (cabeçalho, caixa). Quando nada bate dentro dela, o
   cabeçalho some junto com a caixa — senão o título fica sobre um vazio e dá a
   impressão de que os dados sumiram. O contador diz quantos resultados vieram e
   oferece o "limpar". */
const SECOES_BUSCA = [
  {head:'sec-venc',       box:'vencimentos'},
  {head:'sec-alteracoes', box:'alteracoes'},
  {head:'sec-documentos', box:'documentos'},
  {head:'sec-modelos',    box:'modelos'}
];
/* Só os itens contam como resultado; o .grupo-cat dos modelos é embalagem. */
const SEL_BUSCA = '#documentos [data-busca], #alteracoes [data-busca], #vencimentos [data-busca], #modelos .item[data-busca]';

/* Bloco recolhido que a busca alcança: abre sozinho quando há resultado dentro dele
   e volta a fechar quando a busca é limpa. */
function abrirSeBuscar(idBtn, idBody, alvo){
  const btn = document.getElementById(idBtn), body = document.getElementById(idBody);
  if (!btn || !body) return;
  const tem = !!alvo && Array.from(body.querySelectorAll('[data-busca]')).some(el=>el.style.display !== 'none');
  if (tem){
    body.style.display = 'block';
    btn.setAttribute('aria-expanded','true');
    btn.querySelector('.seta').style.transform = 'rotate(180deg)';
  } else if (!alvo){
    body.style.display = 'none';
    btn.setAttribute('aria-expanded','false');
    btn.querySelector('.seta').style.transform = '';
  }
}

/* Guarda como cada seção aparece SEM busca (vencimentos já nasce escondida). */
function memorizarSecoes(){
  SECOES_BUSCA.forEach(s=>{
    const head = document.getElementById(s.head), box = document.getElementById(s.box);
    if (head) head.dataset.disp = head.style.display || '';
    if (box)  box.dataset.disp  = box.style.display  || '';
  });
}

function filtrar(termo){
  const alvo = normTxt(termo);
  let achados = 0;

  // Documentos, processos e vencimentos — mostrar/esconder simples.
  document.querySelectorAll(SEL_BUSCA).forEach(el=>{
    const bate = !alvo || el.dataset.busca.includes(alvo);
    el.style.display = bate ? '' : 'none';
    if (alvo && bate) achados++;
  });

  // Modelos — agrupados: some o grupo inteiro se nada bater, e abre sozinho
  // o grupo que tiver resultado (fecha de novo se a busca for limpa).
  document.querySelectorAll('#modelos .grupo-cat').forEach(grupo=>{
    const bate = !alvo || grupo.dataset.busca.includes(alvo);
    grupo.style.display = bate ? '' : 'none';
    const body = grupo.querySelector('.grupo-cat-body');
    const btn = grupo.querySelector('.grupo-cat-btn');
    // grupo que bateu só pelo nome da categoria também conta como resultado
    if (alvo && bate && !Array.from(grupo.querySelectorAll('.item[data-busca]')).some(el=>el.style.display !== 'none')) achados++;
    if (bate && alvo){
      body.style.display = 'block';
      btn.setAttribute('aria-expanded', 'true');
      btn.querySelector('.seta').style.transform = 'rotate(180deg)';
    } else if (!alvo){
      body.style.display = 'none';
      btn.setAttribute('aria-expanded', 'false');
      btn.querySelector('.seta').style.transform = '';
    }
  });

  // Documentos recolhidos: a busca abre o bloco quando acha algo lá dentro — senão
  // ela diria "3 resultados" e a tela não mostraria nenhum.
  abrirSeBuscar('btn-docs', 'body-docs', alvo);

  SECOES_BUSCA.forEach(s=>{
    const head = document.getElementById(s.head), box = document.getElementById(s.box);
    if (!head || !box) return;
    const itens = box.querySelectorAll('[data-busca]');
    const visiveis = Array.from(itens).filter(el=>el.style.display !== 'none').length;
    const esconder = !!alvo && (itens.length === 0 || visiveis === 0);
    head.style.display = esconder ? 'none' : (head.dataset.disp || '');
    box.style.display  = esconder ? 'none' : (box.dataset.disp  || '');
  });

  mostrarResumoBusca(termo, achados);
  sincronizarURL(String(termo || '').trim());
}

/* ---------- a busca sobrevive ao F5 ----------
   O `#id-codigo` do endereço é a CREDENCIAL da sessão: mexemos só na query e
   devolvemos o hash intacto — sobrescrevê-lo derruba o acesso do cliente. */
let TERMO_URL = '';
function lerURL(){
  try { TERMO_URL = new URLSearchParams(location.search).get('q') || ''; }
  catch(e){ TERMO_URL = ''; }
}
function sincronizarURL(termo){
  try {
    const u = new URL(location.href);
    if (termo) u.searchParams.set('q', termo); else u.searchParams.delete('q');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  } catch(e){}
}

function mostrarResumoBusca(termo, achados){
  const info = document.getElementById('busca-info');
  const vazio = document.getElementById('busca-vazio');
  const campo = document.getElementById('busca');
  const t = String(termo || '').trim();
  if (!info || !vazio) return;
  if (!t){ info.className = 'busca-info'; info.innerHTML = ''; vazio.className = 'busca-vazio'; vazio.innerHTML = ''; return; }

  info.className = 'busca-info on';
  info.innerHTML = `<span><b>${achados}</b> ${achados === 1 ? 'resultado' : 'resultados'} para <b>${esc(t)}</b></span>
    <span>·</span><button type="button" class="busca-limpar" id="busca-limpar">limpar</button>`;
  const btn = document.getElementById('busca-limpar');
  if (btn) btn.addEventListener('click', ()=>{ if (campo){ campo.value = ''; campo.focus(); } filtrar(''); });

  if (achados){ vazio.className = 'busca-vazio'; vazio.innerHTML = ''; return; }
  vazio.className = 'busca-vazio on';
  vazio.innerHTML = `Nada encontrado para <b>${esc(t)}</b>.
    <span class="busca-dica">Seus dados continuam aqui — só a busca não achou nada com esse termo.</span>`;
}

function el(h){ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; }
function appendAll(parent, h){
  const t = document.createElement('template'); t.innerHTML = h.trim();
  Array.from(t.content.children).forEach(n => parent.appendChild(n));
}

// Sem login (id/codigo) volta ao index; com login, mostra a mensagem padrão do painel
// (sem loop de redirecionamento).
function erro(e){
  var ic=getIdCodigo(), id=ic.id, codigo=ic.codigo;
  if(!id||!codigo){ location.replace('index'+(id?('#'+id+(codigo?'-'+codigo:'')):(location.hash||''))); return; }
  /* Uma mensagem só, igual em todo o painel. Texto de exceção, nome de aba e afins são
     vocabulário nosso: na tela do cliente viram susto e ligação para o atendimento.
     A única exceção é o acesso vencido ou inválido — não é falha do sistema e o conserto
     está na mão dele, então continua sendo dito com todas as letras. */
  var m = String((e && e.message) || e || '');
  var op = /restrito|acesso|c[oó]digo|senha/i.test(m)
    ? { titulo: 'Este link não está mais valendo',
        texto:  'Peça um novo acesso para a gente que reenviamos na hora.' }
    : null;
  /* A espera liga sozinha no DOMContentLoaded, pelo atributo do <body>: se o erro
     aparecer antes disso, o overlay subiria por cima da mensagem e a esconderia. */
  if (document.body) document.body.removeAttribute('data-b4u-espera');
  /* Pinta dentro do #app, não no <body>: assim a barra do topo continua na tela e ele
     segue com o botão de WhatsApp e o caminho de volta ao início à mão. */
  var alvo = document.getElementById('app') || document.body;
  if (window.B4UEspera) B4UEspera.telaErro(alvo, op);
  else alvo.innerHTML =
      '<div class="state"><h1>'+(op ? op.titulo : 'Não conseguimos carregar as informações')+'</h1>'
    + '<p>'+(op ? op.texto : 'Houve um erro ao recuperar as informações. Tente novamente em '
    + 'alguns minutos. Se o problema continuar, entre em contato com o atendimento.')+'</p></div>';
}

/* A espera agora é do b4u-espera.js: uma barra que anda até o dado chegar. As frases
   que ficavam aqui avisavam que estava demorando, e quem lê isso entende "vai dar
   errado" e recarrega a página justamente quando a resposta já vinha a caminho.
   Os dois nomes continuam: há chamadas espalhadas por toda a página. */
function comecarEspera(){ if (window.B4UEspera) B4UEspera.iniciar({ perfil:'cliente' }); }
function pararEspera(){ if (window.B4UEspera) B4UEspera.concluir(); }

/* Tarja discreta do cache: diz que o que está na tela veio do último acesso.
   Fica logo abaixo do herói — nunca por cima do estado do processo. */
function tarja(texto, falhou){
  const slot = document.getElementById('tarja-slot'); if(!slot) return;
  slot.innerHTML = texto ? `<div class="tarja-atualizando${falhou?' falhou':''}">${esc(texto)}</div>` : '';
}
function horaCache(ts){ return ts ? new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : 'antes'; }

/* Os modelos são a última seção da página e são iguais para todo cliente: não faz
   sentido a página inteira esperar por uma segunda execução do Apps Script. */
function carregarModelos(){
  return carregarTipo('modelos').then(r => r.modelos || []).catch(()=>[]);
}

(async function(){
  const { id, codigo } = getIdCodigo();
  IDENTIDADE = { id, codigo };
  if (!id || !codigo) return erro(new Error('Informe o ID e o código de acesso no final do endereço.'));
  lerURL();

  let pintadoDoCache = false, tsCache = 0;
  /* A segunda visita não recomeça do esqueleto: pintamos com o último payload (6h de
     validade) e atualizamos por baixo. Se a atualização falhar, o que está na tela
     continua — apagar dado bom por causa de uma rede ruim é pior que dado de 1h atrás. */
  if (API_URL && id && window.B4U && B4U.cacheLer){
    const bruto = B4U.cacheLer(TIPO, id);
    if (bruto){
      /* Encerrar a espera só DEPOIS de pintar: se o render tropeçar num cache velho,
         a barra continua correndo em vez de descobrir um esqueleto vazio.
         O overlay só nasce no DOMContentLoaded (quem o liga é o atributo do <body>) e
         esta pintura acontece antes disso — sem tirar o atributo, ele subiria por cima
         de um painel que já está pronto na frente da pessoa. */
      try{
        render(bruto, null);
        document.body.removeAttribute('data-b4u-espera'); pararEspera();
        tarja('Atualizando…');
        pintadoDoCache = true; tsCache = bruto.atualizado_em ? new Date(bruto.atualizado_em).getTime() : 0;
      }catch(err){ /* cache velho ou de outro formato: ignora e busca de novo */ }
    }
  }

  try {
    const dados = await carregarTipo(TIPO);
    if (API_URL && id && window.B4U && B4U.cacheGravar) B4U.cacheGravar(TIPO, id, dados);
    render(dados, null); pararEspera(); tarja('');
  } catch (e) {
    if (pintadoDoCache){ tarja('Não consegui atualizar agora — mostrando os dados de '+horaCache(tsCache)+'.', true); }
    else { return erro(e); }
  }
  // Modelos entram quando chegarem; a busca em curso é reaplicada sobre eles.
  carregarModelos().then(ms => {
    desenharModelos(ms);
    const campo = document.getElementById('busca');
    if (campo && campo.value.trim()) filtrar(campo.value);
  });
})();
</script>
