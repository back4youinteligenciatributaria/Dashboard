<style>
/* B4U-DESIGN:INICIO — paleta, cantos e fonte que as 22 páginas dividem.
   Bloco copiado de b4u-design.css (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-design.js`.

   Entra ANTES do <style> da página de propósito — é a camada base. Se esta
   página precisar mesmo de um valor diferente, redeclare o token no `:root`
   dela, que vem depois e vence. */
:root{
  /* ── Superfícies ─────────────────────────────────────────────────────────
     `--canvas` é o bege do fundo da página; `--surface` é o branco do cartão
     que se apoia nele; `--surface-warm` é o branco quebrado das faixas e
     cabeçalhos de tabela, que separam sem precisar de borda. */
  --canvas:#F1E7DC;
  --surface:#FFFFFF;
  --surface-warm:#FBF6EF;

  /* ── Letra ───────────────────────────────────────────────────────────────
     `--ink` é o texto normal, `--ink-2` o secundário, `--muted` o rótulo.
     `--muted` já foi #8A7D70 e reprovava em contraste (3,28:1); #6E6256 dá
     4,85:1 no bege e 5,92:1 no branco, e é a cor de quase todo rótulo do
     sistema — por isso ela precisa passar, e não só quase. */
  --ink:#113D39;
  --ink-2:#3F5854;
  --muted:#6E6256;

  /* ── Traços ──────────────────────────────────────────────────────────────
     `--line` divide o que é do mesmo grupo; `--line-2` fecha o que é caixa. */
  --line:#E4D9C9;
  --line-2:#D6C3AC;

  /* ── Marca ───────────────────────────────────────────────────────────────
     `--brand-teal` é canônico em logo, foco, borda e série de gráfico. Como
     TEXTO ele reprova (4,11:1 no branco, 3,44:1 no receita-soft), e para isso
     existe o `--brand-teal-txt`: o mesmo teal escurecido, 5,54:1 no branco e
     4,54:1 no bege, usado só onde é letra ou fundo de letra. Os dois são a
     mesma cor com dois trabalhos. O 4,54:1 passa, mas passa RASPANDO: quem for
     escurecer o `--canvas` um dia tem de conferir este par antes. */
  --brand-dark:#073034;
  --brand-teal:#0F8C85;
  --brand-euc:#3FA680;
  --brand-teal-txt:#0C756F;

  /* ── SINAL: as quatro cores que querem dizer alguma coisa ────────────────
     Estas quatro NÃO seguem o tema (ver OS QUATRO TEMAS, no fim do arquivo). Se
     "vencido" mudasse de vermelho conforme a pele escolhida, a cor deixaria de
     ser informação e viraria decoração — e quem trabalha nesta tela o dia
     inteiro lê a cor antes de ler a palavra.

     `--amber` tem 2,61:1 no branco: serve de PREENCHIMENTO e de borda, nunca de
     letra. Para letra âmbar existe o `--amber-txt` (5,91:1 no branco).

     ┌── PENDÊNCIA CONHECIDA: `--verde` E `--vermelho` REPROVAM COMO LETRA ────┐
     │                                                                        │
     │ Os dois NÃO têm o par `-txt` que o âmbar tem, e são usados nas duas     │
     │ funções ao mesmo tempo:                                                │
     │                                                                        │
     │     --verde     12 usos como `color`, 11 como `background`, 7 em borda │
     │     --vermelho  41 usos como `color`, 31 como `background`, 41 em borda │
     │                                                                        │
     │ E o lado TEXTO reprova. Medido nos valores atuais:                     │
     │                                                                        │
     │     --verde     #2E9D5F   2,82:1 no bege · 3,44:1 no branco   REPROVA  │
     │     --vermelho  #C0392B   4,46:1 no bege · 5,43:1 no branco   raspando │
     │                                                                        │
     │ O mínimo para texto é 4,5:1. É a mesma falha do `--muted` antigo (que   │
     │ dava 3,28:1), e atinge `.hint.ok` e `.lk.ok`, que são letra e nada      │
     │ mais. Há prova de que alguém já tinha esbarrado nisso sem nomear: o     │
     │ `.det-fbtn.ativo` escreve `color:#0E5B37` à mão — um verde bem mais     │
     │ escuro — em vez de usar o token.                                       │
     │                                                                        │
     │ CONSERTO MEDIDO E NÃO APLICADO (decisão de 10/08/2026):                 │
     │                                                                        │
     │     --verde     #2E9D5F -> #1F7546   (2,82:1 -> 4,66:1 no bege)        │
     │     --vermelho  #C0392B -> #BB3728   (4,46:1 -> 4,66:1 no bege)        │
     │                                                                        │
     │ Matiz e saturação ficam onde estão; só a luminosidade desce, o mínimo   │
     │ para passar com folga. Escurecer é seguro pelo lado do FUNDO: TODAS as  │
     │ regras `background:var(--verde)` / `background:var(--vermelho)` já vêm  │
     │ com `color:#fff` (ou são faixa/pontinho sem texto), e fundo mais escuro │
     │ com letra branca só melhora.                                           │
     │                                                                        │
     │ POR QUE NÃO FOI APLICADO AGORA: mexer nestes dois repinta as 22         │
     │ páginas, inclusive as 8 do cliente. A rodada que centralizou os tokens  │
     │ era de ESTRUTURA — nenhum pixel de cor mudou nela de propósito, para    │
     │ que qualquer diferença que aparecesse em produção tivesse uma causa só. │
     │ Trocar cor é decisão de produto e vai junto da varredura do MODO        │
     │ ESCURO, que já vai ter de abrir os 22 arquivos.                         │
     │                                                                        │
     │ QUANDO FOR FAZER, olhe também o `--verde-2`: várias páginas o declaram  │
     │ valendo #25804C, com a nota "o verde um degrau mais escuro, para virar  │
     │ FUNDO de texto branco". Com o conserto acima, o `--verde` do núcleo     │
     │ fica MAIS ESCURO que o `--verde-2`, e a convenção do sufixo -2 se       │
     │ inverte nesse par. Não dá para resolver daqui: o `--verde-2` mora no    │
     │ `:root` de cada página.                                                │
     └────────────────────────────────────────────────────────────────────────┘

     (Escrito assim, sem dois-pontos colado no nome, de propósito: a
     `tokensCanonicos()` do `_aplica-design.js` varre este bloco com um regex de
     declaração e NÃO pula comentário. Nome de token seguido de dois-pontos aqui
     dentro vira token canônico de mentira, e o `--verde-2` de mentira faria as
     22 páginas aparecerem como "exceção mantida" no terminal. Vale para todo
     comentário deste arquivo: cite o token, nunca o escreva como declaração.) */
  --amber:#E8892E;
  --amber-txt:#8A5A10;
  --vermelho:#C0392B;
  --verde:#2E9D5F;

  /* ── Cantos ──────────────────────────────────────────────────────────────
     Uma escala só, no site inteiro, e mais QUADRADA que redonda.
       4px  campo, selo, célula
       6px  cartão, linha da lista, botão
       8px  bloco grande e modal
     `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é citado
     em mais de cem regras, mas o valor acompanha o resto — pílula virou
     etiqueta. Círculo de verdade (avatar, contador, spinner) continua com
     `border-radius:50%` escrito na regra e não passa por aqui. */
  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-pill:6px;

  /* ── Escala tipográfica ──────────────────────────────────────────────────
     Seis degraus, e o pulo entre eles é de propósito irregular: 11-12-13 é a
     faixa de rótulo, selo e nota de rodapé, onde 1px já muda a hierarquia; 15 é
     o corpo; 19 e 24 são título de bloco e de tela. Um degrau constante (1,2×,
     por exemplo) daria 11-13-16-19-23-28 e gastaria três tamanhos na faixa em
     que o olho não distingue nada.
     ATENÇÃO: o `body{font-size:15px}` das páginas está escrito à mão e NÃO sai
     daqui. Quem mexer na escala não muda o corpo do texto; muda só quem usa
     `var(--fs-N)` — que é rótulo, selo, cabeçalho de tabela e título. */
  --fs-1:11px;
  --fs-2:12px;
  --fs-3:13px;
  --fs-4:15px;
  --fs-5:19px;
  --fs-6:24px;

  /* ── Fonte ───────────────────────────────────────────────────────────────
     Montserrat vem do Google Fonts, declarado no <head> de cada página. O
     `system-ui` é o que aparece enquanto ela não chega — e é o que fica se ela
     não chegar nunca. */
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
/* B4U-DESIGN:FIM */
</style>
<style>
:root{
/* Cantos: uma escala só, no site inteiro, e mais QUADRADA que redonda.
     4px  campo, selo, célula
     6px  cartão, linha da lista, botão
     8px  bloco grande e modal
   `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é
   citado em mais de cem regras, mas o valor agora acompanha o resto —
   pílula virou etiqueta. Círculo de verdade (avatar, contador, spinner)
   continua com border-radius:50% escrito na regra, e não passa por aqui. */
  --brand-eucalipto2:var(--brand-euc);
  --receita:var(--brand-teal); --receita-soft:#DBEFEC;
  /* #A7715D pinta ponto e preenchimento; como TEXTO sobre o creme ele dá 3,20:1.
     O --andamento-txt é o mesmo tom escurecido só para letra: 5,26:1. Mesmo par e
     mesma correção do --sinal/--sinal-txt do fiscal e do guias. */
  --andamento:#A7715D; --andamento-soft:#F1E1D8; --andamento-txt:#8A4B33;
  --aguardando:var(--muted); --aguardando-soft:#EDE7DD;
  /* Escala de padding — três degraus no lugar dos valores avulsos que havia aqui. */
  --pad-sm: 14px 16px;
  --pad:    18px 20px;
  --pad-lg: 24px 26px;
  --lift:   0 8px 20px rgba(17,61,57,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:var(--fs-4);line-height:1.55;-webkit-font-smoothing:antialiased}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:var(--radius-sm)}
/* Campo com menos de 16px faz o Safari ampliar a página inteira ao focar. Só os campos. */
input,select,textarea{font-size:16px}
/* Uma amostra de cor só — antes cada lugar tinha o seu tamanho. */
.sw{width:10px;height:10px;border-radius:var(--radius-sm);flex-shrink:0;display:inline-block}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}
/* Esta página não tinha NENHUM ajuste de celular: ficava com 24px de respiro lateral
   numa tela de 390px. */
@media(max-width:640px){
  :root{
--pad-sm:12px 13px;--pad:15px 16px;--pad-lg:18px 18px
}
  .wrap{padding:0 14px 60px}
  .bar{padding:12px 14px;gap:10px}
  /* razão social + CNPJ do cliente não podem virar 11px: ficam menores que o texto ao lado */
  .brand-sub{font-size:var(--fs-3)}
  .sec-head{margin:24px 0 10px}
  .lista{padding:8px 16px}
  .item{flex-wrap:wrap}
  footer{flex-direction:column;gap:4px}
}

header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:var(--b4u-bar-h,0px);z-index:30}
.bar{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:var(--fs-5);letter-spacing:-.02em;line-height:1}
.logo .b{color:var(--brand-dark)} .logo .y{color:var(--brand-teal)}
/* Razão social + CNPJ é o que confirma "esta é a minha empresa": 15px em teal
   puro dá 4,11:1. Escurecido, 5,54:1. */
.brand-sub{font-size:var(--fs-4);color:var(--brand-teal-txt);font-weight:700;margin-top:2px}
.voltar{display:inline-block;font-size:var(--fs-1);font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:4px}
.voltar:hover{color:var(--brand-teal-txt)}
.spacer{flex:1}
/* 11px sobre o verde claro: teal puro dá 3,44:1. Escurecido, 4,64:1. */
.badge-topo{font-size:var(--fs-1);font-weight:700;color:var(--brand-teal-txt);background:var(--receita-soft);padding:5px 12px;border-radius:var(--radius-pill)}

.busca{margin:28px 0 24px}
.busca input{
  width:100%;font-family:var(--sans);padding:12px 16px;border-radius:var(--radius-pill);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
}
.busca input::placeholder{color:var(--muted)}
.busca input:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
/* retorno da busca: quantos resultados, para quê, e como limpar */
.busca-info{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:11px 6px 0;font-size:var(--fs-2);color:var(--muted)}
.busca-info.on{display:flex}
.busca-info b{color:var(--ink);font-weight:700}
.busca-limpar{background:none;border:0;padding:0;font-family:inherit;font-size:var(--fs-2);font-weight:700;
  color:var(--brand-teal-txt);cursor:pointer;text-decoration:underline}
.busca-vazio{display:none;margin:14px 0 0;padding:22px 20px;text-align:center;background:var(--surface);
  border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--muted);font-size:var(--fs-3)}
.busca-vazio.on{display:block}
.busca-vazio b{color:var(--ink);font-weight:700}
.busca-dica{display:block;margin-top:6px;font-size:var(--fs-2)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:30px 0 14px}
/* Título de seção e texto corrido tinham os mesmos 15px: não havia hierarquia. */
.sec-head h2{font-size:var(--fs-5);font-weight:700;letter-spacing:-.01em}
.sec-head p{font-size:var(--fs-3);color:var(--muted)}

/* ════════ Topo: em que pé está o processo, e com quem está a bola ════════
   O primeiro elemento da página era um campo de busca vazio. Quem entra aqui
   quer saber se anda alguma coisa e se a vez é dele. */
.heroi{margin:22px 0 0;padding:var(--pad-lg);border:none;border-radius:var(--radius-lg);color:#fff;
  /* O gradiente da marca clareia no canto de baixo: medido a 390px, o branco cai para
     4,38:1 justamente na última linha. O véu escuro devolve o contraste sem trocar a cor. */
  background:linear-gradient(180deg,rgba(7,48,52,0) 45%,rgba(7,48,52,.22) 100%),
             linear-gradient(124deg,var(--brand-dark) 0%,var(--brand-teal) 100%);
  box-shadow:0 18px 38px -18px rgba(6,48,51,.6)}
/* 11px maiúsculo sobre o lado claro do gradiente não pode ser branco a 82% (3,7:1). */
.heroi .lbl{font-size:var(--fs-1);letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:#fff}
.heroi-v{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:8px;overflow-wrap:anywhere}
@media(min-width:720px){.heroi-v{font-size:40px}}
/* branco a 90% sobre o lado claro do gradiente dá 4,24:1 a 390px — texto corrido
   de 15px precisa de 4,5. Branco cheio; a hierarquia fica no <b>, não na opacidade.
   Sem font-weight: o link do Montserrat não traz o 500 e o navegador sintetizava
   o peso, engrossando o traço na marra. Mesmo peso do contábil e da equiparação. */
.heroi-sub{font-size:var(--fs-4);color:#fff;margin-top:10px;line-height:1.5;max-width:60ch}
.heroi-sub b{color:#fff;font-weight:800}
.heroi-pe{font-size:var(--fs-4);color:#fff;font-weight:600;margin-top:14px;max-width:60ch;line-height:1.5}
/* Quando a vez é DELE, a frase não pode ter o mesmo peso de "está na Junta". */
.heroi-pe.voce{background:#FCEFE0;color:#8A5A10;border:1px solid #E7C79A;
  border-radius:var(--radius);padding:12px 14px;font-weight:800;display:inline-block}

/* Tarja de cache: o que está na tela é do último acesso e já está sendo atualizado. */
.tarja-atualizando{font-size:var(--fs-2);font-weight:600;color:var(--brand-dark);
  background:var(--receita-soft);border-radius:var(--radius-pill);padding:6px 14px;margin:14px 0 0;
  display:inline-flex;align-items:center;gap:8px}
.tarja-atualizando.falhou{background:#FCEFE0;color:#8A5A10}

.processo-card{padding:var(--pad);margin-bottom:14px}
.processo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.processo-head h3{font-size:var(--fs-4);font-weight:700}
.status-chip{font-size:var(--fs-1);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-sm);white-space:nowrap}
.status-concluido{background:var(--receita-soft);color:var(--brand-teal-txt)}
.status-andamento{background:var(--andamento-soft);color:var(--andamento-txt)}

/* stepper horizontal (linha do tempo resumida) */
.stepper{margin:0 0 16px}
.stepper-topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.stepper-cap{font-size:var(--fs-2);color:var(--muted)}
.stepper-pct{font-size:var(--fs-3);font-weight:800;color:var(--brand-teal-txt)}
.stepper-track{height:6px;background:var(--line);border-radius:var(--radius-pill);overflow:hidden}
.stepper-fill{height:100%;background:linear-gradient(90deg,var(--brand-teal),var(--brand-eucalipto2));border-radius:var(--radius-pill);transition:width .4s}
.stepper-passos{display:flex;align-items:center;gap:6px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.st-passo{display:flex;align-items:center;gap:6px;flex-shrink:0}
.st-dot{width:10px;height:10px;border-radius:50%;background:var(--aguardando);flex-shrink:0}
.st-dot.concluido{background:var(--receita)}
.st-dot.andamento{background:var(--andamento);box-shadow:0 0 0 3px var(--andamento-soft)}
.st-lbl{font-size:var(--fs-1);color:var(--ink-2);white-space:nowrap}
.st-linha{width:16px;height:2px;background:var(--line-2);flex-shrink:0}
@media(max-width:600px){.st-lbl{max-width:110px;overflow:hidden;text-overflow:ellipsis}}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.etapa{position:relative;padding-bottom:16px}
.etapa:last-child{padding-bottom:0}
.etapa::before{content:'';position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--aguardando);border:2px solid var(--surface)}
.etapa.concluido::before{background:var(--receita)}
.etapa.andamento::before{background:var(--andamento);box-shadow:0 0 0 3px var(--andamento-soft)}
.etapa-nome{font-size:var(--fs-3);font-weight:600}
.etapa-meta{font-size:var(--fs-2);color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.etapa-status{font-size:var(--fs-1);font-weight:700;padding:1px 7px;border-radius:var(--radius-sm)}
.etapa-status.concluido{background:var(--receita-soft);color:var(--brand-teal-txt)}
.etapa-status.andamento{background:var(--andamento-soft);color:var(--andamento-txt)}
.etapa-status.aguardando{background:var(--aguardando-soft);color:var(--aguardando)}
/* Com quem está a bola nesta etapa. A linha "com você" não se distingue só pela cor:
   ela tem texto próprio, fundo e borda — e some quando não dá para saber. */
.etapa-resp{font-size:var(--fs-2);font-weight:700;color:var(--ink-2);margin-top:4px}
.etapa-resp.voce{display:inline-block;color:#8A5A10;background:#FCEFE0;border:1px solid #E7C79A;
  border-radius:var(--radius-sm);padding:3px 9px;font-weight:800}
/* Cartão clicável levanta — mesma regra das outras páginas do cliente. */
.processo-card.recolhido{padding:0;transition:transform .12s,box-shadow .12s,border-color .12s}
.processo-card.recolhido:hover{transform:translateY(-2px);box-shadow:var(--lift);border-color:var(--brand-teal)}
.processo-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 22px;background:none;border:none;cursor:pointer;font-family:var(--sans);color:var(--ink);text-align:left}
.processo-toggle .lado{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.processo-toggle h3{font-size:var(--fs-4);font-weight:700}
.processo-toggle .conta{font-size:var(--fs-1);color:var(--muted)}
.processo-toggle .seta{color:var(--muted);font-size:var(--fs-3);transition:transform .2s}

<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a
   célula tem ponto e barra, o Sheets desiste e guarda texto.
   Onde não existe máscara canônica (telefone, inscrição), o valor vai como foi
   digitado: o conserto ali depende do patch do backend. */
function b4uParaPlanilha(valor,coluna){
  const s=b4uTexto(valor).trim();
  const t=b4uIdent(coluna);
  if(!s||!t||!/^\d+$/.test(s))return s;
  const d=b4uDigitos(s);
  if((t.tipo==='doc'||t.tipo==='cnpj')&&d.length===14)return b4uFmtDoc(d);
  if((t.tipo==='doc'||t.tipo==='cpf')&&d.length===11)return b4uFmtDoc(d);
  if(t.tipo==='cep'&&d.length===8)return b4uFmtCep(d);
  return s;
}
/* B4U-TEXTO:FIM */
</script>

@keyframes b4uspin{to{transform:rotate(360deg)}}
</style>
<script>
(function(){
  var CFG = window.B4U || {};
  if (CFG.__ready) return;

  var WA = '5511937173906';                        // +55 11 93717-3906
  var API_FALLBACK = 'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
  function api(){ try{ if(typeof API_URL==='string' && API_URL) return API_URL; }catch(e){} return API_FALLBACK; }

  var AREAS = [
    ['fiscal','Fiscal'], ['dpto_pessoal','Departamento Pessoal'], ['contabil','Contábil'],
    ['societario','Societário'], ['equiparacao','Equiparação'], ['outros','Outros / reportar erro']
  ];
  // tipo -> [rótulo, esqueleto de mensagem]
  var TIPOS = {
    livre:            ['Chamado livre', ''],
    solicitar_nf:     ['Solicitar nota fiscal', 'Solicito a emissão de uma nota fiscal.\n\nTomador (cliente):\nValor:\nDescrição do serviço:\nData desejada:'],
    duvida:           ['Tirar uma dúvida', 'Minha dúvida é:\n\n'],
    ferias:           ['Solicitar férias', 'Solicito a programação de férias.\n\nColaborador:\nInício desejado:\nDias:\nObservações:'],
    previa_admissao:  ['Prévia de admissão', 'Estou avaliando uma contratação (prévia, ainda sem formalizar).\n\nCargo cogitado:\nFaixa salarial:\nObservações:'],
    contratacao:      ['Formalizar admissão', 'Quero formalizar uma contratação.\n\nNome do colaborador:\nCargo:\nSalário:\nData de início:\nObservações:'],
    previa_rescisao:  ['Prévia de rescisão', 'Estou avaliando desligar um colaborador (prévia).\n\nColaborador:\nMotivo:\nObservações:'],
    rescisao:         ['Formalizar desligamento', 'Quero formalizar um desligamento.\n\nColaborador:\nMotivo:\nData prevista:\nAviso (trabalhado/indenizado):\nObservações:']
  };
  var ORDEM_TIPOS = ['livre','solicitar_nf','duvida','ferias','previa_admissao','contratacao','previa_rescisao','rescisao'];
  // Tipo do DOCUMENTO anexado -> define para qual PASTA (programa) o arquivo vai.
  // As chaves batem com o backend (COLUNA_POR_TIPO_DOC); a pasta vem do Site Links.
  var DOCTIPOS = [
    ['principal','Documentos recebidos (geral)'],
    ['extratos','Extratos bancários'],
    ['notas','Notas fiscais e comprovantes'],
    ['outros','Outros']
  ];
  // O tipo de solicitação DEPENDE da área (não faz sentido pedir férias em Equiparação).
  var TIPOS_POR_AREA = {
    fiscal:       ['livre','solicitar_nf','duvida'],
    dpto_pessoal: ['livre','ferias','previa_admissao','contratacao','previa_rescisao','rescisao','duvida'],
    contabil:     ['livre','duvida'],
    societario:   ['livre','duvida'],
    equiparacao:  ['livre','duvida'],
    outros:       ['livre','duvida']
  };
  function tiposDaArea(area){ return TIPOS_POR_AREA[area] || TIPOS_POR_AREA.outros; }
  function opcoesTipo(area, sel){
    return tiposDaArea(area).map(function(t){
      return '<option value="'+t+'"'+(t===sel?' selected':'')+'>'+esc(TIPOS[t][0])+'</option>';
    }).join('');
  }

  // ---- id/código a partir da URL (?id=&codigo= ou #id-codigo) -------------
  function idc(){
    var qs = new URLSearchParams(location.search);
    var id = qs.get('id')||'', cod = qs.get('codigo')||'';
    if(!id){
      var h = (location.hash||'').replace('#','').trim();
      var m = h.match(/^(\d+)-(.+)$/); var s = h.match(/^(\d+)$/);
      if(m){ id=m[1]; cod=m[2]; } else if(s){ id=s[1]; }
    }
    return { id:String(id).replace(/\D/g,''), codigo:String(cod).trim() };
  }
  /* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
     e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
     chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
     deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
  var JSONP_TETO = 45000, JSONP_PAUSA = 4000;

  /* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
     salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
     queima tentativa — repetir qualquer um desses lança em duplicidade. */
  function jsonpRepetivel(url){
    return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
  }
  /* Vazia de propósito: ela existia só para escrever frases de espera na tela.
     Quem mostra (e troca) o que aparece durante a espera agora é o b4u-espera.js.
     A função continua aqui porque é chamada de outros pontos. */
  function jsonpAviso(){}
  function jsonpTentativa(url){
    return new Promise(function(ok,fail){
      var cb='b4ucb_'+Math.random().toString(36).slice(2);
      var s=document.createElement('script');
      var t=setTimeout(function(){ limpa(); fail(new Error('A API não respondeu.')); }, JSONP_TETO);
      function limpa(){ clearTimeout(t); try{delete window[cb];}catch(e){window[cb]=undefined;} s.remove(); }
      window[cb]=function(d){ limpa(); ok(d); };
      s.onerror=function(){ limpa(); fail(new Error('Não consegui alcançar a API.')); };
      s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
      document.body.appendChild(s);
    });
  }
  /* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
     deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
     de espera segue correndo por cima, sem anunciar a segunda tentativa: avisar que
     "ainda estamos buscando" no meio da espera assusta e faz recarregar justamente
     quando a resposta já vinha. Erro só se a segunda também falhar. */
  function jsonp(url){
    return jsonpTentativa(url).catch(function(e){
      if(!jsonpRepetivel(url)) throw e;
      return new Promise(function(r){ setTimeout(r, JSONP_PAUSA); })
        .then(function(){ return jsonpTentativa(url); });
    });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* Traduz qualquer erro para uma frase que o cliente entende — e que não o culpa.
     `e.message` NUNCA vai para a tela: ele é vocabulário nosso, não dele. */
  function msgAmigavel(e){
    var m = String((e && e.message) || e || '');
    if (/API|alcançar|respondeu|network|timeout|Failed to fetch/i.test(m))
      return 'Não consegui falar com o sistema agora. Confira a sua internet e tente de '
           + 'novo em alguns segundos — nada do que você digitou foi perdido.';
    if (/restrito|acesso|código|senha|contato/i.test(m))
      return 'Este link não está mais valendo. Peça um novo acesso para a gente que '
           + 'reenviamos na hora.';
    return 'Deu um problema do nosso lado, não seu. A equipe já foi avisada. Se for '
         + 'urgente, chame no WhatsApp.';
  }

  /* A segunda visita não precisa recomeçar do esqueleto. Guardamos o último payload por
     6h e pintamos com ele na hora, com tarja de "atualizando"; quando a resposta chega,
     redesenhamos. Dado financeiro no aparelho dele — por isso prazo curto e limpeza no
     logout (B4U.limparCache), junto do aparelho confiável. */
  var CACHE_MS = 6 * 60 * 60 * 1000;
  function cacheChave(tipo, id){ return 'b4u_pl_' + tipo + '_' + id; }
  function cacheLer(tipo, id){
    try {
      var o = JSON.parse(localStorage.getItem(cacheChave(tipo, id)) || 'null');
      if (!o || (Date.now() - o.ts) > CACHE_MS) return null;
      return o.raw;
    } catch (e) { return null; }
  }
  function cacheGravar(tipo, id, raw){
    try { localStorage.setItem(cacheChave(tipo, id),
          JSON.stringify({ ts: Date.now(), raw: raw })); } catch (e) {}
  }
  function limparCache(){
    /* Sai o payload e sai também o b4u_disp_ (quais áreas o cliente tem): num aparelho
       compartilhado, a barra do próximo não pode herdar o mapa de painéis do anterior. */
    try { Object.keys(localStorage).forEach(function (k) {
          if (k.indexOf('b4u_pl_') === 0 || k.indexOf('b4u_disp_') === 0) localStorage.removeItem(k); }); } catch (e) {}
  }

  var IC = {
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.1.3.7 1.1 1.4 1.7.9.8 1.6 1 1.9 1.2.3.1.5.1.6-.1.2-.2.7-.8.9-1 .2-.3.4-.2.6-.1.2.1 1.5.7 1.7.9.3.1.4.2.5.3.1.2.1.7-.1 1.3Z"/></svg>',
    // Uma pessoa só, não duas: o botão é sobre QUEM ESTÁ LOGADO, e o ícone de duas
    // pessoas já quer dizer "Departamento Pessoal" nesta mesma barra.
    eu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.6-3.7 3.7-6 7.5-6s6.9 2.3 7.5 6"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-6.5A8 8 0 1 1 21 12Z"/></svg>',
    help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.8 2.8 0 0 1 5.4 1c0 1.8-2.6 2.2-2.6 3.9"/><path d="M12 17.4h.01"/></svg>',
    chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 13 4 4L19 7"/></svg>',
    guias:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="m8.5 15 2 2 4-4"/></svg>',
    pessoal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><path d="M16 4.2c1.7.4 3 2 3 3.8s-1.3 3.4-3 3.8M23 20c0-2.8-2.3-5.1-5.4-5.8"/></svg>',
    fiscal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>',
    equiparacao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5Z"/><path d="m9 12 2 2 4-4"/></svg>'
  };

  var C = idc();
  var linkHome = 'index' + (C.id ? '#'+C.id+(C.codigo?'-'+C.codigo:'') : '');
  var linkTickets = 'meustickets' + (C.id ? '#'+C.id+(C.codigo?'-'+C.codigo:'') : '');
  var waHref = 'https://wa.me/'+WA+'?text='+encodeURIComponent('Olá, sou cliente back4you'+(C.id?' (ID '+C.id+')':'')+'.');
  /* O href do WhatsApp passa a ter um PUBLICADOR, não só um lugar na tela.
     O botão verde saiu da barra (o lugar dele agora é dentro do painel "meus dados"),
     e quem lia esse href pelo DOM ficaria de mãos vazias: o rodapé "Falar com a gente"
     do menu lateral, nas oito páginas, é montado com ele — sem href, o rodapé
     simplesmente não nasce, e o WhatsApp some do painel inteiro. Publicado aqui, o
     número continua tendo UM dono só (este bloco) e continua alcançável mesmo com a
     barra redesenhada. Quem lê deve preferir esta variável e deixar o DOM de reserva. */
  window.B4U_WA = waHref;

  // ---- links de área na própria barra --------------------------------------
  /* Do fiscal para a agenda não havia caminho: era voltar para a home e pagar outra
     chamada à API. Os links saem do `disponiveis` que a HOME já recebeu e gravou no
     aparelho (b4u_disp_<id>) — assim respeitam PAINEIS_OCULTOS e o acesso da pessoa
     sem esta página perguntar nada. Sem esse registro, só a agenda, que quem tem
     fiscal ou pessoal sempre tem. */
  var AREAS_LINK = [
    ['fiscal',      'Fiscal',       'fiscal',      IC.fiscal],
    ['dptopessoal', 'Pessoal',      'pessoal',     IC.pessoal],
    ['equiparacao', 'Equiparação',  'equiparacao', IC.equiparacao]
  ];
  function disponiveisSalvos(){
    try { var o = JSON.parse(localStorage.getItem('b4u_disp_'+C.id)||'null');
          return (o && (o.disponiveis || o)) || null; } catch(e){ return null; }
  }
  function linksDeArea(){
    var disp = disponiveisSalvos();
    var aqui = (location.pathname.split('/').pop()||'').toLowerCase().replace(/\.html?$/,'');
    /* Sem tirar o .html, quem entra por um link antigo (/fiscal.html) não casa
       com 'fiscal' da lista e a barra oferece um atalho para a página em que a
       pessoa já está. As duas formas de endereço continuam valendo. */
    return AREAS_LINK.filter(function(a){
      if (a[0].toLowerCase() === aqui) return false;                       // não linkar a página atual
      return !!(disp && disp[a[2]]);
    }).slice(0, 2)                                                          // 2 links: a barra ainda tem 3 botões fixos
     .map(function(a){
       /* b4u-nav: é esta classe que a folha do b4u-shell.js esconde quando o menu
          lateral está montado — o menu já diz isto, e melhor (sem o corte em 2).
          Não pode ser `.b4u-btn.ghost` sozinha: ela também veste botões que ficam. */
       return '<a class="b4u-btn ghost b4u-nav" href="'+esc(a[0]+(C.id?('#'+C.id+(C.codigo?'-'+C.codigo:'')):''))+'" '+
              'title="'+esc(a[1])+'">'+a[3]+'<span class="b4u-lbl">'+esc(a[1])+'</span></a>';
     }).join('');
  }

  // ---- quem está logado, para o botão do nome -------------------------------
  /* O nome de quem entrou vem no payload `tipo=links`, que só a HOME pede — e ela o
     guarda no cache compartilhado. As outras sete páginas leem daqui, do mesmo jeito
     que já leem o `b4u_disp_` para saber quais áreas oferecer. Sem registro (primeira
     visita num aparelho novo), devolve null: o botão nasce com o rótulo genérico e
     vira o nome quando a página souber dele. A empresa vem do payload fiscal, que é
     onde mora a razão social — a mesma fonte que o menu lateral já usa. */
  function pessoaGuardada(){
    try{ var r = cacheLer('links', C.id); return (r && r.pessoa) || null; }catch(e){ return null; }
  }
  function empresaGuardada(){
    try{ var r = cacheLer('fiscal', C.id); return (r && r.config) || null; }catch(e){ return null; }
  }
  /* O botão do nome só entra se o painel estiver de pé: sem o b4u-cliente.js ele seria
     um enfeite que não abre nada. Nesse caso a barra continua com o botão verde do
     WhatsApp, exatamente como era antes — ninguém fica sem o caminho do socorro. */
  var temEu = !!(window.B4UCliente && window.B4UCliente.ligar);

  // ---- barra fixa ----------------------------------------------------------
  var bar = document.createElement('div');
  bar.className = 'b4u-bar';
  bar.innerHTML =
    '<a class="b4u-logo" href="'+esc(linkHome)+'"><span>back</span><span class="y">4you</span></a>' +
    (CFG.home ? '' :
      // b4u-nav: mesma marca dos links de área — o menu lateral esconde este atalho
      // porque ele virou o item "Início" de lá. Escondido, nunca removido.
      '<a class="b4u-btn ghost b4u-nav" href="'+esc(linkHome)+'">'+IC.home+'<span class="b4u-lbl">Início</span></a>') +
    (CFG.home ? '' : linksDeArea()) +
    /* O nome de quem está logado, no lugar do WhatsApp. Enquanto o payload não chega,
       o rótulo é "Meus dados": é verdade em qualquer estado, não pisca duas vezes como
       um "carregando…" que aparece e sai, e não deixa um botão em branco na barra —
       o mesmo princípio que o menu lateral já segue no item "Início". O nome completo
       vai no title (e no aria-label), porque o rótulo corta com reticências e no
       celular ele nem aparece. As classes são as de sempre: min-height 44px, rótulo
       escondido abaixo de 640px, altura da barra idêntica à de antes. */
    (temEu
      ? '<button type="button" class="b4u-btn ghost b4uc-eu" id="b4u-eu" aria-haspopup="dialog" aria-expanded="false" title="Meus dados, contatos e acessos">'+IC.eu+'<span class="b4u-lbl" id="b4u-eu-nome">Meus dados</span></button>'
      : '<a class="b4u-btn wa" href="'+esc(waHref)+'" target="_blank" rel="noopener">'+IC.wa+'<span class="b4u-lbl">WhatsApp</span></a>') +
    '<button type="button" class="b4u-btn call" id="b4u-open">'+IC.chat+'<span class="b4u-lbl">Abrir chamado</span></button>' +
    '<button type="button" class="b4u-icobtn" id="b4u-help" title="Reportar um erro ou pedir ajuda" aria-label="Reportar um erro ou pedir ajuda">'+IC.help+'</button>';
  document.body.insertBefore(bar, document.body.firstChild);
  // publica a altura da barra p/ os cabeçalhos internos grudarem logo abaixo dela
  function medirBarra(){ document.documentElement.style.setProperty('--b4u-bar-h', bar.offsetHeight + 'px'); }
  medirBarra();
  window.addEventListener('resize', medirBarra);
  window.addEventListener('load', medirBarra);

  /* O painel "meus dados" recebe o que este bloco já sabe: identidade, WhatsApp, a
     forma de falar com a API (o jsonp daqui, com repetição e teto de 45s) e o que
     estiver guardado do último payload. Cada página completa o resto com
     `B4UCliente.atualizar()` quando a resposta dela chega. */
  if (temEu) window.B4UCliente.ligar({
    botao:   bar.querySelector('#b4u-eu'),
    rotulo:  bar.querySelector('#b4u-eu-nome'),
    id:      C.id,
    codigo:  C.codigo,
    wa:      waHref,
    api:     api(),
    jsonp:   jsonp,
    pessoa:  pessoaGuardada(),
    empresa: empresaGuardada()
  });

  // ---- modal ---------------------------------------------------------------
  var ov = document.createElement('div');
  ov.className = 'b4u-ov';
  document.body.appendChild(ov);

  function fecharModal(){ ov.classList.remove('on'); ov.innerHTML=''; ESQ_ATUAL=''; }

  /* Fechar por clique no fundo ou Esc NÃO pode apagar o que ele escreveu. Só é
     "limpo" o que ainda for igual ao esqueleto pré-preenchido do tipo escolhido. */
  var ESQ_ATUAL = '';
  function modalSujo(){
    var t = ov.querySelector('#b4u-msg'), a = ov.querySelector('#b4u-assunto');
    if(!t) return false;
    return String(t.value||'').trim() !== String(ESQ_ATUAL||'').trim()
        || !!(a && a.value.trim());
  }
  function tentarFechar(){ if(modalSujo()) pedirDescartar(); else fecharModal(); }
  function montarFoot(){
    var foot = ov.querySelector('.b4u-foot'); if(!foot) return;
    foot.innerHTML =
      '<button type="button" class="b4u-btn cancel" id="b4u-cancel">Cancelar</button>' +
      '<button type="button" class="b4u-btn primary" id="b4u-send">Enviar chamado</button>';
    foot.querySelector('#b4u-cancel').addEventListener('click', tentarFechar);
    foot.querySelector('#b4u-send').addEventListener('click', enviar);
  }
  function pedirDescartar(){
    var foot = ov.querySelector('.b4u-foot'); if(!foot){ fecharModal(); return; }
    foot.innerHTML =
      '<button type="button" class="b4u-btn cancel" id="b4u-keep">Continuar escrevendo</button>' +
      '<button type="button" class="b4u-btn primary" id="b4u-discard">Descartar o que escrevi</button>';
    var err = ov.querySelector('#b4u-erro');
    if(err) err.textContent = 'Você escreveu algo neste chamado. Quer mesmo sair sem enviar?';
    foot.querySelector('#b4u-keep').addEventListener('click', function(){
      if(err) err.textContent=''; montarFoot();
      var t = ov.querySelector('#b4u-msg'); if(t) t.focus();
    });
    foot.querySelector('#b4u-discard').addEventListener('click', fecharModal);
  }

  function abrir(opts){
    opts = opts || {};
    var areaSel = opts.area || CFG.area || 'outros';
    var tipoSel = opts.tipo || 'livre';
    if (tiposDaArea(areaSel).indexOf(tipoSel) < 0) tipoSel = tiposDaArea(areaSel)[0];   // tipo válido p/ a área
    ov.innerHTML =
      '<div class="b4u-modal" role="dialog" aria-modal="true" aria-label="Abrir chamado">' +
        '<h3>Abrir um chamado</h3>' +
        '<div class="b4u-sub">Registramos aqui e retornamos em até 48h úteis. Você pode acompanhar em “Meus chamados”.</div>' +
        '<div class="b4u-fld"><label for="b4u-area">Área</label><select id="b4u-area">' +
          AREAS.map(function(a){ return '<option value="'+a[0]+'"'+(a[0]===areaSel?' selected':'')+'>'+esc(a[1])+'</option>'; }).join('') +
        '</select></div>' +

  function enviar(){

  // ---- Puxar para atualizar (mobile) --------------------------------------
  // Só age quando a página está no topo e o gesto é para baixo; recarrega ao soltar
  // depois do limiar. Não atrapalha a rolagem normal.
  (function(){
    var ind=document.createElement('div'); ind.className='b4u-ptr';
    ind.innerHTML='<span class="ring"></span><span class="txt">Puxe para atualizar</span>';
    document.body.appendChild(ind);

    function topo(){ return (window.scrollY||document.documentElement.scrollTop||0)<=0; }
    /* Com uma folha aberta o gesto não é "atualizar", é rolar o que está dentro dela.
       O modal de chamado já era contado aqui; o painel "meus dados" entrou junto
       porque ele tem FORMULÁRIO (os contatos): puxar para baixo com a folha aberta

    function folhaAberta(){

             !!(window.B4UCliente && window.B4UCliente.aberto && window.B4UCliente.aberto());

      if(e.touches.length!==1 || !topo() || folhaAberta()){ y0=null; return; }
      y0=e.touches[0].clientY; ativo=true;
    },{passive:true});
    window.addEventListener('touchmove',function(e){
      if(!ativo||y0===null) return;
      dist=e.touches[0].clientY - y0;
      if(dist<=0){ ind.style.height='0'; return; }
      if(!topo()){ ativo=false; ind.style.height='0'; return; }
      var h=Math.min(dist*0.5, LIM+20); ind.style.height=h+'px';
      ind.querySelector('.txt').textContent = dist>LIM?'Solte para atualizar':'Puxe para atualizar';
    },{passive:true});
    window.addEventListener('touchend',function(){
      if(!ativo){ return; } ativo=false;
      if(dist>LIM){ ind.classList.add('spin'); ind.style.height=(LIM)+'px'; ind.querySelector('.txt').textContent='Atualizando…'; setTimeout(function(){ location.reload(); },150); }
      else { ind.style.height='0'; }

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
const TIPO = 'societario';
const TITULO_PAGINA = 'Societário';
// Equiparação é a única categoria reservada — aparece só no equiparacao.html.
// Qualquer outra categoria (Paciente, Alvarás, Contratos, o que o time escrever)
// é livre e aparece aqui, agrupada.
const CATEGORIA_EXCLUIDA = 'Equiparação';

function normTxt(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Atalhos de teclado: "/" foca a busca, "Esc" limpa. Fica quieto quando a pessoa
   já está digitando em outro campo (input, textarea, select ou área editável). */
const ATALHOS_LIGADOS = {};
function atalhosDeBusca(idCampo, aoLimpar, aoFocar){
  if(ATALHOS_LIGADOS[idCampo]) return;            // não empilhar listeners em re-render
  ATALHOS_LIGADOS[idCampo] = true;
  document.addEventListener('keydown', ev=>{
    const campo = document.getElementById(idCampo); if(!campo) return;
    const alvo = ev.target, tag = (alvo && alvo.tagName || '').toLowerCase();
    const digitando = tag==='input' || tag==='textarea' || tag==='select' || (alvo && alvo.isContentEditable);
    if(ev.key==='/' && !digitando && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
      ev.preventDefault();
      if(aoFocar) aoFocar();                      // abre o painel de filtros, se houver
      const det = campo.closest && campo.closest('details');
      if(det && !det.open) det.open = true;       // e o bloco recolhido que a contém
      campo.focus(); campo.select && campo.select(); return;
    }
    if(ev.key==='Escape' && (alvo===campo || (!digitando && campo.value))){
      if(!campo.value){ campo.blur(); return; }
      campo.value=''; if(aoLimpar) aoLimpar();
    }
  });
}

function getIdCodigo(){
  const qs = new URLSearchParams(location.search);
  let id = qs.get('id') || '';
  let codigo = qs.get('codigo') || '';
  if (!id){
    const h = location.hash.replace('#','').trim();
    const comCodigo = h.match(/^(\d+)-(.+)$/);
    const soId = h.match(/^(\d+)$/);
    if (comCodigo) { id = comCodigo[1]; codigo = comCodigo[2]; }
    else if (soId) { id = soId[1]; }
  }
  return { id: id.replace(/\D/g,''), codigo: codigo.trim() };
}

/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Vazia de propósito: quem fala com a pessoa durante a espera agora é o
   b4u-espera.js, por cima da página. Continua existindo porque é chamada
   de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){
  return new Promise((ok,fail)=>{
    const cb = 'cb_'+Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(()=>{ limpa(); fail(new Error('A API não respondeu.')); }, JSONP_TETO);
    function limpa(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { limpa(); ok(d); };
    s.onerror = () => { limpa(); fail(new Error('Não consegui alcançar a API.')); };
    s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
    document.body.appendChild(s);
  });
}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
   de espera continua de pé durante a segunda tentativa: encerrá-la aqui descobria o
   esqueleto no meio da busca. Erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}

let IDENTIDADE = { id: '', codigo: '' };

async function carregarTipo(tipo){
  const { id, codigo } = IDENTIDADE;
  if (API_URL){
    const url = API_URL + '?id=' + encodeURIComponent(id) + '&codigo=' + encodeURIComponent(codigo) + '&tipo=' + tipo;
    const d = await jsonp(url);
    if (d.erro) throw new Error(d.erro);
    return d;
  }
  const arq = tipo === 'modelos' ? 'demo_modelos.json' : `demo_${TIPO}.json`;
  const r = await fetch(arq);
  if (!r.ok) throw new Error(`Sem API configurada e sem ${arq} ao lado deste arquivo.`);
  return r.json();
}

function dBR(iso){
  if (!iso) return '';
  const s = String(iso).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s; // texto livre (ex.: "set/2025") — mostra exatamente como o colaborador escreveu
  return `${m[3]}/${m[2]}/${m[1]}`;
}

function classeStatus(status){
  const n = normTxt(status);
  if (n.includes('conclu')) return 'concluido';
  if (n.includes('andament')) return 'andamento';
  return 'aguardando';
}

/* Mapa de áreas que o cliente tem, na MESMA fonte que a barra do topo usa
   (b4u_disp_<id>, gravado só pela home): o menu lateral não pode oferecer uma porta
   que ele não consegue abrir. Sem o registro — primeira visita, antes de a home
   responder — devolve null, e aí o menu mostra tudo, que é o comportamento de hoje.
   As três linhas estão duplicadas de propósito: a versão do bloco compartilhado vive
   dentro de um IIFE e o window.B4U não a exporta. */
function areasContratadas(id){
  try{ const o=JSON.parse(localStorage.getItem('b4u_disp_'+id)||'null');
       return (o && (o.disponiveis||o)) || null; }catch(e){ return null; }
}

/* Menu lateral: navegação ENTRE páginas, e só isso. Ele NÃO substitui o <header>
   desta página — o herói de estado do processo, a busca e o badge de área continuam
   morando lá dentro, porque é ali que a página responde "anda alguma coisa e a vez é
   minha?", que é a primeira pergunta de quem abre o Societário.
   Montamos de dentro do render() porque a razão social só existe depois do payload.
   O render roda duas vezes no caminho do cache quente: o módulo ignora a segunda
   chamada de propósito, e a guarda abaixo evita repetir o resto do trabalho. */
function montarMenu(M){
  /* O painel "meus dados" (o botão com o nome, na barra) mostra a empresa aberta.
     A razão social e o CNPJ só existem depois do payload desta página — o bloco
     compartilhado já semeou o painel com o que estava guardado no aparelho, e aqui
     entregamos a versão fresca. Fica ANTES da guarda do menu de propósito: o painel
     não depende do b4u-shell.js ter carregado. */
  if (window.B4UCliente) B4UCliente.atualizar({ empresa: (M && M.config) || null });
  if(!window.B4UShell || B4UShell.montado()) return;
  const cfg = M.config || {};
  const sub = cfg.cnpj ? 'CNPJ ' + b4uIdentHTML(cfg.cnpj,'CNPJ') : (M.id ? 'cliente ' + esc(b4uTexto(M.id)) : '');
  // O href do WhatsApp vem do bloco compartilhado, que o publica em `window.B4U_WA`
  // — o número continua tendo um dono só. Antes líamos o `href` do botão verde da
  // barra, e o botão verde saiu de lá (virou item do painel "meus dados"): sem esta
  // troca o `wa` chega vazio e o rodapé "Falar com a gente" do menu lateral não é
  // desenhado — o WhatsApp sumiria do painel inteiro. O DOM fica de reserva, para
  // quando o b4u-cliente.js não carregar e o botão verde voltar para a barra.
  const waEl = document.querySelector('.b4u-bar .b4u-btn.wa');
  const wa = (typeof window.B4U_WA === 'string' && window.B4U_WA) || (waEl ? waEl.getAttribute('href') : '');
  B4UShell.montar({
    perfil:'cliente',
    ativo:'societario',
    contexto:{ rot:'Empresa', nome:esc(cfg.razao_social||''), sub:sub },
    /* A identidade viaja como hash, como no resto da página: o #id-codigo é a
       credencial da sessão e vem depois de qualquer query, nunca antes — sobrescrever
       o hash derruba o acesso do cliente. */
    link:function(pag){
      return pag + (IDENTIDADE.id ? '#'+IDENTIDADE.id+(IDENTIDADE.codigo?'-'+IDENTIDADE.codigo:'') : '');
    },
    disp: areasContratadas(IDENTIDADE.id),
    wa: wa || null
  });
  /* A barra do topo perde o logo e os atalhos (agora quem os diz é o menu) e ganha o
     botão da gaveta. Quem publica a altura em --b4u-bar-h é o medirBarra(), que só
     escuta resize e load: sem este aviso o <header>, que gruda em top:var(--b4u-bar-h),
     continuaria preso à altura antiga e abriria um vão. */
  try{ window.dispatchEvent(new Event('resize')); }catch(e){}
}

function render(M, modelos){
  const app = document.getElementById('app');
  app.innerHTML = '';

  app.appendChild(el(`
    <header><div class="bar">
      <div>
        <div class="logo"><span class="b">back</span><span class="y">4you</span></div>
        <div class="brand-sub">${(M.config && M.config.razao_social) || TITULO_PAGINA} · ${(M.config && M.config.cnpj) ? 'CNPJ ' + b4uIdentHTML(M.config.cnpj,'CNPJ') : 'cliente ' + esc(b4uTexto(M.id))}</div>
      </div>
      <div class="spacer"></div>
      <span class="badge-topo">${TITULO_PAGINA}</span>

  /* Antes do resto: o menu recua o corpo, e o stepper de etapas mede a própria
     largura para saber se precisa rolar na horizontal — medido largo e desenhado
     estreito, ele nasce com os pontos cortados. */
  montarMenu(M);

  const wrap = el('<div class="wrap"></div>');
  app.appendChild(wrap);

  /* Estado do processo ANTES de tudo. Antes o primeiro elemento da página era um
     campo de busca vazio, e o cliente tinha de rolar para descobrir se andava algo. */
  appendAll(wrap, `
    <div class="heroi">
      <span class="lbl" id="heroi-lbl"></span>

    <div class="busca">
      <input type="search" id="busca" placeholder="Buscar documento, modelo ou processo… (tecle /)" aria-label="Buscar no painel">
      <div class="busca-info" id="busca-info" role="status" aria-live="polite"></div>

  appendAll(wrap, `

  wrap.appendChild(el(`<footer>
      <span>Atualizado em ${new Date(M.atualizado_em||Date.now()).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</span>
    </footer>`));

  desenharHeroi(M.alteracoes || []);
  desenharVencimentos(M);
  desenharAlteracoes(M.alteracoes || []);

  memorizarSecoes();
  document.getElementById('busca').addEventListener('input', e => filtrar(e.target.value));
  atalhosDeBusca('busca', () => filtrar(''));
