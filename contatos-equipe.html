function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da lista. Dois botões de propósito: "mais 20" para quem lê, "todos" para
   quem vai usar Ctrl+F. Buscar ou filtrar volta o teto ao início — o resultado
   é outro, e continuar de onde parou confundiria. */
const PASSO = 20;
let TETO = PASSO;
function rodapeLista(mostrados, total){
  if(total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todos os ${total}</button>
  </div>`;
}

/* ---------------- agrupamento ---------------- */
function nomeCli(id){const n=NOME[String(id)];return n?n:'';}
function agrupar(){
  const map=new Map();
  CLIENTES.forEach(c=>map.set(String(c.id),{id:String(c.id),nome:c.nome||'',contatos:[],orfa:false}));
  CONTATOS.forEach(c=>{
    const id=String(c.cliente_id==null?'':c.cliente_id);
    if(!map.has(id))map.set(id,{id:id,nome:nomeCli(id),contatos:[],orfa:true});
    map.get(id).contatos.push(c);
  });
  GRUPOS=Array.from(map.values());
  GRUPOS.forEach(g=>g.contatos.sort((a,b)=>
    (a.papel==='Principal'?0:1)-(b.papel==='Principal'?0:1) ||
    normTxt(a.nome||a.email).localeCompare(normTxt(b.nome||b.email),'pt')));
  GRUPOS.sort((a,b)=>String(a.id).localeCompare(String(b.id),'pt',{numeric:true}));
}
function grupoDe(id){return GRUPOS.find(g=>g.id===String(id));}
function contatoDe(row){return CONTATOS.find(c=>String(c.row)===String(row));}

/* ---------------- sinais ---------------- */
function temPrincipal(g){return g.contatos.some(c=>c.papel==='Principal');}
function faltaPrincipal(g){return g.contatos.length>0&&!temPrincipal(g);}
function nSemEmail(g){return g.contatos.filter(c=>!String(c.email||'').trim()).length;}
function nSemTel(g){return g.contatos.filter(c=>!String(c.telefone||'').trim()).length;}

/* ---------------- filtros e busca ---------------- */
function passaArea(g){return !AREA||g.contatos.some(c=>c.areas&&c.areas[AREA]);}
function passaSit(g,f){
  const k=f==null?FILTRO:f;
  if(k==='sem_principal')return faltaPrincipal(g);
  if(k==='sem_email')return nSemEmail(g)>0;
  if(k==='sem_tel')return nSemTel(g)>0;
  if(k==='sem_contato')return g.contatos.length===0;
  if(k==='nunca_acessou')return g.contatos.some(c=>String(c.email||'').trim()&&nuncaAcessou(c));
  return true;
}
/* Último acesso do contato (aba "log de acessos" — Acessos.gs).
   Vem como 'dd/MM/aaaa HH:mm'. Sem registro = a pessoa nunca entrou no painel:
   é o sinal mais acionável desta tela, então vira selo vermelho. */
const hojeZero=(()=>{const d=new Date();d.setHours(0,0,0,0);return d;})();
function diasDesde(br){
  const m=String(br||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return null;
  return Math.round((hojeZero-new Date(+m[3],+m[2]-1,+m[1]))/864e5);
}
function nuncaAcessou(c){ return !String(c.ultimo_acesso||'').trim(); }
function seloAcesso(c){
  const q=String(c.ultimo_acesso||'').trim();
  if(!String(c.email||'').trim()) return '';          // sem e-mail nem faz sentido cobrar acesso
  if(!q) return '<span class="acs nunca" title="Este contato nunca entrou no painel">nunca acessou</span>';
  const d=diasDesde(q), via=String(c.acesso_via||'').trim();
  const cl=(d!=null&&d>90)?' antigo':'';
  const rot=(d===0)?'acessou hoje':(d===1?'acessou ontem':(d!=null?`há ${d} dias`:q));
  return `<span class="acs${cl}" title="Último acesso: ${esc(q)}${via?' · via '+esc(via):''}">${esc(rot)}</span>`;
}

function bateContato(c,t){
  if(!t)return false;
  return casaBusca(normTxt([c.nome,c.email,c.telefone].join(' ')),soDigitos(c.telefone),t);
}
function bateCliente(g,t){
  if(!t)return false;
  return casaBusca(normTxt(g.id+' '+g.nome),soDigitos(g.id),t);
}
function passaBusca(g,t){return !t||bateCliente(g,t)||g.contatos.some(c=>bateContato(c,t));}

/* ---------------- ordenação da lista ----------------
   A lista tem dois níveis: o cartão é o CLIENTE e as linhas dentro dele são os
   CONTATOS. Por isso a coluna "Cliente" ordena os cartões e as outras quatro
   ordenam as linhas dentro de cada cartão — que é o que o cabeçalho está em
   cima de fato. Os mesmos critérios viram chips "Ordenar por" no painel de
   filtros: abaixo de 900px o cabeçalho some, e sem eles a ordenação sumiria
   junto. */
const ORDENS=[
  {k:'cliente',rot:'Cliente',asc:'do menor ID para o maior',desc:'do maior ID para o menor'},
  {k:'nome',rot:'Nome',asc:'A → Z',desc:'Z → A'},
  {k:'email',rot:'E-mail',asc:'A → Z',desc:'Z → A'},
  {k:'papel',rot:'Papel',asc:'Principal primeiro',desc:'Secundário primeiro'},
  {k:'areas',rot:'Áreas',asc:'A → Z',desc:'Z → A'}
];
/* Texto sem acento e sem caixa: "Água" e "agua" ficam juntas. */
function cmpTxt(a,b){return normTxt(a).localeCompare(normTxt(b),'pt',{numeric:true});}
/** O que a coluna vale para ordenar. Devolve '' quando está em branco — e vazio
 *  vai sempre para o fim, nas duas direções. */
function valOrdCt(c){
  if(SORT.key==='nome')return String(c.nome||'');
  if(SORT.key==='email')return String(c.email||'');
  if(SORT.key==='papel')return c.papel==='Principal'?'0':'1';
  if(SORT.key==='areas'){
    /* Principal enxerga tudo — é o que a coluna escreve, e é por isso que ele
       ordena por esse texto e não por uma lista de áreas que ele não tem. */
    if(c.papel==='Principal')return 'todas as áreas';
    return AREAS.filter(a=>c.areas&&c.areas[a[0]]).map(a=>a[1]).join(', ');
  }
  return '';
}
/* Coluna em branco quer dizer "falta preencher": ela vai SEMPRE para o fim, nas
   duas direções. Jogá-la para o topo no Z→A esconderia justamente o contato sem
   nome ou sem e-mail, que é o que a tela existe para cobrar. */
function cmpCt(a,b){
  const va=valOrdCt(a),vb=valOrdCt(b);
  const ea=va.trim()==='',eb=vb.trim()==='';
  if(ea&&eb)return 0;
  if(ea)return 1;
  if(eb)return -1;
  const r=cmpTxt(va,vb);
  return SORT.dir==='desc'?-r:r;
}
/** A ordem de sempre dentro do cartão: Principal primeiro, depois por nome. */
function ordemPadraoCt(a,b){
  return (a.papel==='Principal'?0:1)-(b.papel==='Principal'?0:1) ||
         cmpTxt(a.nome||a.email,b.nome||b.email);
}
/** Os contatos de um cartão na ordem de agora. Devolve uma CÓPIA: g.contatos é
 *  o que a gravação e o "adicionar contato" mexem, e reordenar o vetor original
 *  faria a lista brigar com quem está editando. */
function contatosOrdenados(g){
  if(SORT.key==='cliente')return g.contatos;
  return g.contatos.slice().sort((a,b)=>cmpCt(a,b)||ordemPadraoCt(a,b));
}
/* t chega normalizado (normTxt) — casaBusca normaliza de novo sem efeito colateral,
   e os dígitos são os mesmos antes e depois da normalização. */
function visiveis(){
  const t=normTxt(TERMO);
  /* Ordena o que SOBROU do filtro e da busca — nunca a lista crua. */
  const arr=GRUPOS.filter(g=>passaArea(g)&&passaSit(g)&&passaBusca(g,t));
  const porId=(a,b)=>String(a.id).localeCompare(String(b.id),'pt',{numeric:true});
  if(SORT.key==='cliente')
    return arr.sort((a,b)=>SORT.dir==='desc'?-porId(a,b):porId(a,b));
  /* Ordenando por coluna de contato, o cartão vale pelo seu PRIMEIRO contato na
     ordem escolhida: é ele que aparece logo abaixo do cabeçalho do cliente.
     Cartão sem contato nenhum não tem valor para comparar e cai no fim, nas duas
     direções — como qualquer célula vazia. */
  return arr.sort((a,b)=>{
    const ca=contatosOrdenados(a)[0],cb=contatosOrdenados(b)[0];
    if(!ca&&!cb)return porId(a,b);
    if(!ca)return 1;
    if(!cb)return -1;
    return cmpCt(ca,cb)||porId(a,b);
  });
}

/* destaca o trecho encontrado sem quebrar acentos */
function hl(txt,t){
  const s=String(txt==null?'':txt);
  if(!t)return esc(s);
  let n='';const map=[];
  for(let i=0;i<s.length;i++){
    const c=s[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    for(let j=0;j<c.length;j++){n+=c[j];map.push(i);}
  }
  const i0=n.indexOf(t);
  if(i0<0)return esc(s);
  const a=map[i0],b=(i0+t.length<map.length?map[i0+t.length]:s.length);
  return esc(s.slice(0,a))+'<mark>'+esc(s.slice(a,b))+'</mark>'+esc(s.slice(b));
}

/* ---------------- HTML ---------------- */
function areasHTML(c){
  const pr=c.papel==='Principal';
  const chips=AREAS.map(a=>`<button type="button" class="achip${(pr||c.areas[a[0]])?' on':''}${pr?' trava':''}" data-a="${a[0]}"${pr?' disabled':''}>${a[1]}</button>`).join('');
  /* O rótulo "ÁREAS" que vinha na frente saiu: hoje os chips moram numa seção da
     ficha que já se chama assim, e a mesma palavra duas vezes seguidas confunde. */
  return chips+(pr?'<span class="nota">Principal enxerga todas as áreas</span>':'');
}
function btnRemover(c){return `<button class="btn btn--mini btn--danger-out" type="button" data-del="${esc(c.row)}">Remover</button>`;}
/* Três estados no SIM/NÃO: sim, não e "ninguém respondeu ainda".
   Vazio não é "não" — é pergunta em aberto, e é isso que deixa a tela poder
   cobrar depois sem acusar quem nunca foi perguntado. */
function triSel(v){ return v===true?'sim':(v===false?'nao':''); }
function perfilHTML(c){
  const p=c.perfil||{};
  const socio=triSel(p.socio), medico=triSel(p.medico);
  const tri=(k,rot,val)=>`<label class="cp"><span>${rot}</span><select class="in" data-p="${k}">
      <option value=""${val===''?' selected':''}>—</option>
      <option value="sim"${val==='sim'?' selected':''}>Sim</option>
      <option value="nao"${val==='nao'?' selected':''}>Não</option></select></label>`;
  return `<div class="perfil">
    ${tri('socio','Sócio?',socio)}
    ${tri('medico','Médico?',medico)}
    <label class="cp larga"><span>Função</span><input class="in" data-p="funcao" value="${esc(p.funcao||'')}"
      placeholder="sócio investidor, secretária, concierge…"></label>
    ${medico==='sim'?`<label class="cp"><span>CRM</span><input class="in" data-p="crm" value="${esc(p.crm||'')}" placeholder="CRM/UF 00000"></label>`:''}
    ${socio==='sim'?`<label class="cp larga"><span>Endereço pessoal</span><input class="in" data-p="endereco" value="${esc(p.endereco||'')}" placeholder="rua, nº, cidade"></label>`:''}
    ${(!p.funcao&&!socio&&!medico)?`<span class="sn-falta">sem informação de quem é a pessoa</span>`:''}
  </div>`;
}

/* ---------------- a linha da lista (só leitura) ----------------
   Cinco colunas por contato: Cliente · Nome · E-mail · Papel · Áreas. O resto da
   ficha abre no modal. Nenhum campo aqui: a lista fica limpa e ninguém altera sem
   querer. */
/* Duas áreas inteiras dizem mais que três cortadas: quem manda no corte é a
   CONTAGEM, e o que sobra vira um "+N" honesto (com a lista completa no title). */
const AREA_TETO=2, AREA_LARGURA=22;
function areasLinha(c){
  /* Principal enxerga tudo — seis pílulas para dizer "todas" seria a coluna
     inteira repetindo o que a pílula de papel ao lado já disse. */
  if(c.papel==='Principal')return '<span class="c-tag">todas as áreas</span>';
  const ns=AREAS.filter(a=>c.areas&&c.areas[a[0]]).map(a=>a[1]);
  if(!ns.length)return '<span class="c-falta">sem áreas</span>';
  const mostrar=[];let sobra=AREA_LARGURA;
  for(const n of ns){
    if(mostrar.length>=AREA_TETO)break;
    if(mostrar.length&&n.length>sobra)break;
    sobra-=n.length+1;mostrar.push(n);
  }
  const resto=ns.length-mostrar.length;
  return mostrar.map(n=>`<span class="c-tag">${esc(n)}</span>`).join('')+
    (resto>0?`<span class="c-tag mais" title="${esc(ns.slice(mostrar.length).join(', '))}">+${resto}</span>`:'');
}
/* Situação do contato para a faixa lateral: sem e-mail (âmbar, não há como dar
   acesso) e nunca acessou (vermelho, tem e-mail e nunca entrou). */
function situacaoCt(c){
  if(!String(c.email||'').trim())return 'semmail';
  if(nuncaAcessou(c))return 'nunca';
  return '';
}
/* Na lista entra só o selo que PEDE AÇÃO — "nunca acessou" e o acesso antigo.
   Um "acessou hoje" verde em cada linha viraria ruído e apagaria justamente o
   vermelho que a tela existe para mostrar. O selo completo, com data e "via",
   continua inteiro dentro da ficha. */
function seloAcessoLinha(c){
  const q=String(c.ultimo_acesso||'').trim();
  if(!String(c.email||'').trim())return '';
  if(!q)return '<span class="acs nunca" title="Este contato nunca entrou no painel">nunca acessou</span>';
  const d=diasDesde(q);
  if(d!=null&&d>90)return `<span class="acs antigo" title="Último acesso: ${esc(q)}">há ${d} dias</span>`;
  return '';
}
/** O que não coube nas cinco colunas vira o title da linha: dá para conferir sem
 *  abrir nada — telefone, quem é a pessoa e o último acesso por extenso. */
function tituloLinha(c,g){
  /* Nome e e-mail entram inteiros aqui porque são justamente os dois que a
     coluna corta com reticências quando são longos. */
  const p=['Nome: '+(String(c.nome||'').trim()||'em branco')];
  p.push('E-mail: '+(String(c.email||'').trim()||'em branco'));
  p.push('Cliente: '+((g.id||'sem ID')+(g.nome?' · '+g.nome:'')));
  p.push('Telefone: '+(String(c.telefone||'').trim()||'em branco'));
  const pf=c.perfil||{};
  if(pf.funcao)p.push('Função: '+pf.funcao);
  if(pf.socio===true)p.push('Sócio');
  if(pf.medico===true)p.push('Médico'+(pf.crm?' · CRM '+pf.crm:''));
  if(String(c.email||'').trim())p.push('Último acesso: '+(String(c.ultimo_acesso||'').trim()||'nunca'));
  p.push('Clique para abrir a ficha do contato.');
  return p.join(' · ');
}
/* O miolo vem separado do invólucro porque salvar repinta só o miolo: trocar a
   linha inteira tiraria o foco de quem chegou nela pelo teclado. */
function linhaConteudo(c,g){
  const email=String(c.email||'').trim();
  const pr=c.papel==='Principal';
  return `<span class="c-cli">${esc(g.id||'—')}</span>
    <span class="c-nome">${c.nome?esc(c.nome):'<span class="c-falta">sem nome</span>'}</span>
    <span class="c-mail">${email?`<span class="t">${esc(email)}</span>`:'<span class="c-falta">sem e-mail</span>'}${seloAcessoLinha(c)}</span>
    <span class="c-papel"><span class="pill ${pr?'papel-pri':'papel-sec'}" title="${pr?'Principal enxerga todas as áreas.':'Secundário enxerga só as áreas marcadas.'}">${pr?'Principal':'Secundário'}</span></span>
    <span class="c-areas">${areasLinha(c)}</span>`;
}
/* role="button" e não <button> porque dentro da linha há pílulas e selos com
   title próprio; o teclado é atendido à mão no keydown (Enter e Espaço). */
function linhaHTML(c,g,t){
  const sit=situacaoCt(c);
  return `<div class="ctl${sit?' ct-'+sit:''}${bateContato(c,t)?' match':''}${String(CAD_ROW)===String(c.row)?' aberto':''}"
    role="button" tabindex="0" aria-haspopup="dialog" data-row="${esc(c.row)}" title="${esc(tituloLinha(c,g))}"
    >${linhaConteudo(c,g)}</div>`;
}
/** Seta da coluna ativa — só ela ganha marca, senão a lista pareceria ordenada
 *  por cinco critérios ao mesmo tempo.
 *  O espaço antes da seta é NÃO SEPARÁVEL (\u00A0) de propósito: com espaço
 *  comum, o rótulo que quase preenche a coluna empurrava a seta sozinha para uma
 *  segunda linha, e o cabeçalho ficava com o dobro da altura por causa dela. */
function seta(key){return SORT.key===key?(SORT.dir==='asc'?'\u00A0▲':'\u00A0▼'):'';}
/* O cabeçalho de colunas repete a régua da linha (mesma regra de CSS) e some
   abaixo de 900px, onde a linha deixa de ser cinco colunas. Cada rótulo é um
   botão que ordena — por isso ele NÃO é mais aria-hidden: aqui não é enfeite, e
   a coluna ativa se anuncia com aria-sort. */
function cabecalhoLista(){
  const bt=(k,rot)=>{
    const at=SORT.key===k;
    return `<span role="columnheader"${at?` aria-sort="${SORT.dir==='asc'?'ascending':'descending'}"`:''}>`+
      `<button type="button" data-sort="${esc(k)}" title="Ordenar por ${esc(rot)}">${esc(rot)}${seta(k)}</button></span>`;
  };
  return `<div class="lista-cab" role="row">`+
    bt('cliente','Cliente')+bt('nome','Nome')+bt('email','E-mail')+
    bt('papel','Papel')+bt('areas','Áreas')+`</div>`;
}

/* ---------------- a ficha do contato (corpo do modal) ----------------
   O agrupamento por assunto que a linha já tinha (campos de contato, quem é a
   pessoa, áreas, acesso) vira a divisão em seções — é a mesma informação, e já
   estava resolvida. O invólucro continua sendo o .ctt com data-row: é nele que
   toda a máquina de gravação se apoia. */
function fichaHTML(c){
  const pr=c.papel==='Principal';
  const semMail=!String(c.email||'').trim(),semTel=!String(c.telefone||'').trim();
  const g=grupoDe(c.cliente_id)||{id:String(c.cliente_id==null?'':c.cliente_id),nome:nomeCli(c.cliente_id)};
  const acesso=[
    c.codigo?`<span class="ro">código de hoje <b>${esc(c.codigo)}</b><button class="lk" type="button" data-copy="${esc(c.codigo)}">copiar</button></span>`:'',
    c.link?`<span class="ro">link de acesso <button class="lk" type="button" data-copy="${esc(c.link)}">copiar</button>
      <a class="lk" href="${esc(c.link)}" target="_blank" rel="noopener">abrir ↗</a></span>`:'',
    seloAcesso(c)
  ].filter(Boolean).join('');
  return `<div class="ctt" data-row="${esc(c.row)}">
    <div class="ign"></div>
    <div class="sec"><h2><span class="dot"></span>Contato</h2>
      <div class="fld"><label>Cliente</label>
        <div class="cli-ro">${esc(g.id||'sem ID')}${g.nome?' · '+esc(g.nome):''}</div></div>
      <div class="campos">
        <label class="cp"><span>Nome</span><input class="in" data-k="nome" value="${esc(c.nome||'')}" placeholder="Nome do contato"></label>
        <label class="cp"><span>E-mail</span><input class="in${semMail?' falho':''}" data-k="email" type="email" value="${esc(c.email||'')}" placeholder="email@exemplo.com"></label>
        <label class="cp"><span>Telefone / WhatsApp</span><input class="in${semTel?' falho':''}" data-k="telefone" value="${esc(c.telefone||'')}" placeholder="55DDD9…"></label>
        <label class="cp"><span>Papel</span><select class="in" data-k="papel">
          <option${pr?' selected':''}>Principal</option><option${pr?'':' selected'}>Secundário</option></select></label>
      </div>
    </div>
    <div class="sec"><h2><span class="dot"></span>Quem é a pessoa</h2>${perfilHTML(c)}</div>
    <div class="sec"><h2><span class="dot"></span>Áreas que esse contato enxerga</h2>
      <div class="areas-linha" data-areas>${areasHTML(c)}</div></div>
    <div class="sec"><h2><span class="dot"></span>Acesso</h2>
      <div class="rodape">${acesso||'<span class="dica-in">Sem e-mail não há código nem link de acesso para este contato.</span>'}</div>
      <span class="dica-in">Código e link são gerados pelo sistema: dá para copiar, não para editar.</span>
    </div>
    <div class="sec"><h2><span class="dot"></span>Remover contato</h2>
      <span class="rm" data-rm>${btnRemover(c)}</span>
      <span class="dica-in">Remover apaga o contato da planilha — a tela pergunta antes de fazer.</span>
    </div>
  </div>`;
}
/* A ficha de contato NOVO é a mesma ficha com as seções que ainda cabem: o
   cliente (que aqui se escolhe), os campos e as áreas. Os ids são os de sempre —
   é o que deixa resolverCliente(), validarCliModal() e adicionarContato()
   continuarem exatamente como estavam. */
function fichaNovaHTML(){
  return `<div class="sec"><h2><span class="dot"></span>Cliente</h2>
      <div class="fld">
        <label for="m-cli">Cliente</label>
        <input id="m-cli" list="dl-clientes" autocomplete="off" placeholder="Digite o ID ou o nome — ex.: 250033 · Padaria">
        <div class="hint" id="m-cli-hint"></div>
      </div>
    </div>
    <div class="sec"><h2><span class="dot"></span>Contato</h2>
      <div class="campos">
        <div class="fld"><label for="m-nome">Nome</label><input id="m-nome" placeholder="Nome do contato"></div>
        <div class="fld"><label for="m-email">E-mail</label><input id="m-email" type="email" placeholder="email@exemplo.com"></div>
        <div class="fld"><label for="m-tel">Telefone / WhatsApp</label><input id="m-tel" placeholder="55DDD9…"></div>
        <div class="fld"><label for="m-papel">Papel</label><select id="m-papel"><option>Secundário</option><option>Principal</option></select></div>
      </div>
    </div>
    <div class="sec"><h2><span class="dot"></span>Áreas que esse contato enxerga</h2>
      <div class="areas-linha" id="m-areas"></div></div>`;
}
function cabecalhoHTML(g,t){
  const n=g.contatos.length;
  const sinais=[];
  if(n===0)sinais.push('<span class="sn cinza">sem contato</span>');
  else if(!temPrincipal(g))sinais.push('<span class="sn alerta">falta Principal</span>');
  const se=nSemEmail(g),st=nSemTel(g);
  if(se)sinais.push(`<span class="sn amb">${se} sem e-mail</span>`);
  if(st)sinais.push(`<span class="sn cinza">${st} sem telefone</span>`);
  if(g.orfa)sinais.push('<span class="sn cinza">fora do Site Links</span>');
  return `<span class="chev">${ABERTOS.has(g.id)?'▾':'▸'}</span>
    <span class="cid">${g.id?hl(g.id,t):'sem ID'}</span>
    <span class="cnome">${g.nome?hl(g.nome,t):'<i>sem nome no Site Links</i>'}</span>
    <span class="sinais">${sinais.join('')}</span>
    <span class="qtd">${n} ${n===1?'contato':'contatos'}</span>`;
}
/* A linha da lista é o CONTATO, não o cliente: um cliente tem vários. O
   agrupamento por cliente continua sendo o cartão, com o cabeçalho que abre e
   fecha; dentro dele ficam o cabeçalho de colunas e as linhas de contato. */
function grupoHTML(g,t){
  const aberto=ABERTOS.has(g.id);
  const cts=contatosOrdenados(g);
  const corpo=aberto?`<div class="cli-b">
      ${cts.length?cabecalhoLista()+cts.map(c=>linhaHTML(c,g,t)).join('')
        :'<div class="vazio">Nenhum contato cadastrado para este cliente.</div>'}
      <div class="add-linha">
        <button class="btn btn--mini btn--pri" type="button" data-add="${esc(g.id)}">+ Adicionar contato</button>
        <span class="dica-in">Clique num contato para abrir a ficha e editar.</span>
      </div></div>`:'';
  return `<div class="cli${aberto?' on':''}" data-cli="${esc(g.id)}">
    <button class="cli-h" type="button" data-toggle="${esc(g.id)}">${cabecalhoHTML(g,t)}</button>${corpo}</div>`;
}

/* ---------------- desenho ---------------- */
/* Quantos filtros estão pegando agora — vira o selo ao lado do botão Filtros (C.5).
   Só conta o que está ESCONDIDO no painel: a busca fica à vista na régua, e um
   selo dizendo "1 filtro" por causa dela faria a pessoa procurar o que não sumiu. */
function filtrosPainel(){
  return (FILTRO!=='todos'?1:0)+(AREA?1:0)+(SORT.key!=='cliente'||SORT.dir!=='asc'?1:0);
}
function limparFiltros(){
  FILTRO='todos';AREA='';TERMO='';TETO=PASSO;SORT={key:'cliente',dir:'asc'};
  const b=document.getElementById('busca');if(b)b.value='';
  ABERTOS.clear();
  redesenhar();
}
function desenharChips(){
  const porArea=GRUPOS.filter(passaArea);
  const cSit=(k)=>porArea.filter(g=>passaSit(g,k)).length;
  const c=(k,rot,n,extra)=>`<button class="chip ${extra||''} ${FILTRO===k?'on':''}" data-f="${k}">${rot}<span class="n">${n}</span></button>`;
  document.getElementById('chipsSit').innerHTML=
    '<span class="rot">Situação</span>'+
    c('todos','Todos',cSit('todos'))+
    c('sem_principal','Sem contato Principal',cSit('sem_principal'),'alerta')+
    c('sem_email','Sem e-mail',cSit('sem_email'),'falta')+
    c('sem_tel','Sem telefone',cSit('sem_tel'))+
    c('sem_contato','Sem nenhum contato',cSit('sem_contato'))+
    c('nunca_acessou','Nunca acessou',cSit('nunca_acessou'),'alerta');

  const porSit=GRUPOS.filter(g=>passaSit(g));
  const nArea=k=>porSit.filter(g=>g.contatos.some(x=>x.areas&&x.areas[k])).length;
  /* O "Limpar filtros" agora é fixo no rodapé do painel (#btn-limpar) — não é
     mais um chip que aparece e some no meio dos outros treze. */
  document.getElementById('chipsArea').innerHTML=
    '<span class="rot">Área</span>'+
    `<button class="chip ${AREA===''?'on':''}" data-area="">Todas<span class="n">${porSit.length}</span></button>`+
    AREAS.map(a=>`<button class="chip ${AREA===a[0]?'on':''}" data-area="${a[0]}">${a[1]}<span class="n">${nArea(a[0])}</span></button>`).join('');
}
/* Ordenar por: os mesmos cinco critérios do cabeçalho da lista, em chip. Abaixo
   de 900px o cabeçalho some, e sem estes chips a ordenação sumiria junto — no
   celular ela é justamente o jeito de achar quem está sem e-mail. */
function desenharOrdem(){
  const box=document.getElementById('chipsOrd');if(!box)return;
  box.innerHTML='<span class="rot">Ordenar por</span>'+ORDENS.map(o=>
    `<button type="button" class="chip ${SORT.key===o.k?'on':''}" data-s="${esc(o.k)}">${esc(o.rot)}`+
    (SORT.key===o.k?`<span class="ord">${SORT.dir==='asc'?'▲':'▼'}</span>`:'')+`</button>`).join('');
  const info=document.getElementById('ordInfo');if(!info)return;
  const o=ORDENS.find(x=>x.k===SORT.key);
  info.innerHTML=o
    ?('Ordenado por <b>'+esc(o.rot)+'</b> — '+esc(SORT.dir==='asc'?o.asc:o.desc)+'. Clicar de novo no mesmo critério inverte.')
    :'';
}
function desenharResumo(){
  const semP=GRUPOS.filter(faltaPrincipal);
  const semC=GRUPOS.filter(g=>g.contatos.length===0);
  const semE=[],semT=[];
  GRUPOS.forEach(g=>g.contatos.forEach(c=>{
    if(!String(c.email||'').trim())semE.push({g:g,c:c});
    if(!String(c.telefone||'').trim())semT.push({g:g,c:c});
  }));
  /* title= completa o que a coluna estreita ainda cortar: o nome do cliente é o
     único jeito de reconhecer a linha, não pode ficar em "…". */
  const itemCli=g=>`<div class="tk" data-goto="${esc(g.id)}" title="${esc(g.nome||'')}"><span class="d">${esc(g.id||'—')}</span>
    <span class="lb">${esc(g.nome||'(sem nome)')}</span><span class="tp">${g.contatos.length} ct</span></div>`;
  const itemCtt=x=>`<div class="tk" data-goto="${esc(x.g.id)}" data-ctt="${esc(x.c.row)}" title="${esc(x.g.nome||'')}"><span class="d">${esc(x.g.id||'—')}</span>
    <span class="lb">${esc(x.c.nome||x.c.email||'(sem nome)')}</span><span class="tp">${esc(x.g.nome||'')}</span></div>`;
  const card=(cls,titulo,lista,render)=>`<div class="rcard ${cls}">
    <div class="rhead"><span>${titulo}</span><span class="n">${lista.length}</span></div>
    <div class="rlista">${lista.length?lista.slice(0,80).map(render).join(''):'<div class="rvazio">Nada por aqui 🎉</div>'}</div></div>`;
  document.getElementById('resumo').innerHTML=
    card('semp','Clientes sem contato Principal',semP,itemCli)+
    card('semmail','Contatos sem e-mail',semE,itemCtt)+
    card('semtel','Contatos sem telefone',semT,itemCtt)+
    card('semct','Clientes sem nenhum contato',semC,itemCli);
}
function desenharLista(){
  const t=normTxt(TERMO);
  const arr=visiveis();
  const total=Math.min(arr.length,MAX_CLI);     // MAX_CLI segue como trava dura de desenho
  const n=Math.min(TETO,total);
  const corte=arr.slice(0,n);
  document.getElementById('lista').innerHTML=
    (corte.map(g=>grupoHTML(g,t)).join('')||'<div class="vazio">Nenhum cliente com esse filtro ou busca.</div>')+
    rodapeLista(n,total);
  /* A contagem completa vive na régua (#resumo-lista); aqui fica só o quanto da
     lista está desenhado e o que a pessoa precisa saber antes de clicar. */
  document.getElementById('dica').innerHTML=
    (total>n?`Mostrando <b>${n} de ${arr.length}</b>. `:'')+
    (arr.length>MAX_CLI?`Desenho no máximo ${MAX_CLI} — refine a busca. `:'')+
    'Clique no cliente para ver os contatos e no contato para abrir a ficha — a lista é só leitura. '+
    'Os filtros e a ordenação ficam no botão Filtros; no computador dá para ordenar clicando no cabeçalho de colunas.';
  desenharContagem();
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
}
/* A contagem em texto é o que permite recolher chips e cartões sem esconder
   pendência: os números continuam na primeira linha da tela, filtrada ou não. */
function desenharResumoLista(){
  const el=document.getElementById('resumo-lista');if(!el)return;
  const vis=visiveis().length;
  const semP=GRUPOS.filter(faltaPrincipal).length;
  const semE=CONTATOS.filter(c=>!String(c.email||'').trim()).length;
  const p=[(vis===GRUPOS.length?String(GRUPOS.length):vis+' de '+GRUPOS.length)+' clientes',
           CONTATOS.length+' contatos'];
  if(semP)p.push(semP+' sem contato principal');
  if(semE)p.push(semE+' sem e-mail');
  el.textContent=p.join(' · ');
}
function atualizarCabecalho(id){
  const g=grupoDe(id);if(!g)return;
  const el=document.querySelector('.cli[data-cli="'+CSS.escape(String(id))+'"] .cli-h');
  if(el)el.innerHTML=cabecalhoHTML(g,normTxt(TERMO));
}
/* A linha da lista acompanha o que se edita na ficha, sem redesenhar a lista
   (redesenhar tiraria o foco de quem está digitando). Só o miolo é trocado: o
   invólucro continua o mesmo nó, então quem chegou nela pelo teclado não perde
   o lugar quando uma gravação termina meio segundo depois. */
function atualizarLinha(row){
  const c=contatoDe(row);if(!c)return;
  const g=grupoDe(c.cliente_id);if(!g)return;
  const no=document.querySelector('.ctl[data-row="'+CSS.escape(String(row))+'"]');
  if(!no)return;
  no.innerHTML=linhaConteudo(c,g);
  no.title=tituloLinha(c,g);
  /* a faixa lateral acompanha a mudança de situação sem redesenhar a lista */
  no.classList.remove('ct-nunca','ct-semmail');
  const sit=situacaoCt(c);if(sit)no.classList.add('ct-'+sit);
}
/* Contador do topo com os MESMOS números da dica de baixo: "X de Y" (C.5).
   Fica separado de propósito: depois de salvar atualizamos só ele, sem redesenhar
   a lista (redesenhar tiraria o foco de quem está digitando). */
function desenharContagem(){
  const arr=visiveis();
  const nCt=arr.reduce((s,g)=>s+g.contatos.length,0);
  document.getElementById('cnt').textContent=
    arr.length+' de '+GRUPOS.length+' clientes · '+nCt+' de '+CONTATOS.length+' contatos';
}
function redesenhar(){
  desenharChips();desenharOrdem();desenharResumo();desenharLista();desenharResumoLista();
  if(FILTROS_UI)FILTROS_UI.atualizarContador();
  sincronizarURL();
}
/* ---------- busca e filtros no endereço (C.10) ----------
   F5 volta para a mesma visão; chave, cod e #hash ficam intactos. */
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    set('q',TERMO);
    set('f',FILTRO==='todos'?'':FILTRO);
    set('area',AREA);
    set('ord',SORT.key==='cliente'?'':SORT.key);
    set('dir',SORT.dir==='asc'?'':SORT.dir);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  FILTRO=p.get('f')||'todos';
  AREA=p.get('area')||'';
  /* ?ord= só vale se for um critério que existe: link antigo (ou editado à mão)
     não pode deixar a lista ordenada por nada. */
  const k=p.get('ord')||'cliente';
  SORT={key:ORDENS.some(o=>o.k===k)?k:'cliente',dir:p.get('dir')==='desc'?'desc':'asc'};
  TERMO=p.get('q')||'';
}

/* ---------------- salvar (auto, com debounce) ---------------- */
const SUJOS=new Map();   // row -> timer
/* ---------- falhas de gravação (C.3) ----------
   FALHAS = o servidor recusou e o dado só existe na tela. O contato fica marcado
   com um "tentar de novo" no rodapé dele, e fechar a aba pede confirmação. */
const FALHAS=new Set();
function temPendencia(){return SUJOS.size>0||FALHAS.size>0;}
function marcarFalha(row,falhou){
  const chave=CSS.escape(String(row));
  /* A LINHA continua marcada na lista mesmo com a ficha fechada — é o que mostra,
     de longe, que aquele contato tem coisa que não gravou. */
  const li=document.querySelector('.ctl[data-row="'+chave+'"]');
  if(li)li.classList.toggle('falhou',!!falhou);
  /* A faixa e o "tentar de novo" vivem no .ctt, que hoje é pintado dentro da
     ficha: procurar por ele funciona esteja onde estiver (e ele não existe com a
     ficha fechada, que é justamente o caso em que não há o que marcar). */
  const cx=document.querySelector('.ctt[data-row="'+chave+'"]');
  if(!cx)return;
  const ign=cx.querySelector('.ign');if(!ign)return;
  const antigo=ign.querySelector('.btn-retry');
  if(falhou&&!antigo)ign.insertAdjacentHTML('beforeend',
    'Não consegui gravar este contato. O que você digitou continua aqui.'+
    '<button type="button" class="btn-retry" data-retry="'+esc(String(row))+'">não salvou — tentar de novo</button>');
  if(!falhou&&antigo)ign.innerHTML='';
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
window.addEventListener('beforeunload',e=>{if(temPendencia()){e.preventDefault();e.returnValue='';}});
/* O MESMO indicador em dois lugares: a faixa da barra escura (a de sempre) e o
   rodapé da ficha. Com a ficha aberta a barra fica atrás do véu — e o indicador
   não pode sumir justamente na tela em que se digita. A classe "claro" só troca
   a tinta do estado neutro, que foi desenhado para fundo escuro. */
function setSave(cl,txt){
  const base='save-status '+(cl||'');
  const barra=document.getElementById('saveStatus');
  if(barra){barra.className=base;barra.textContent=txt||'';}
  const cad=document.getElementById('saveStatusCad');
  if(cad){cad.className=base+' claro';cad.textContent=txt||'';}
}
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function areasSel(c){return AREAS.filter(a=>c.areas[a[0]]).map(a=>a[0]);}
function agendarSalvar(row,ms){
  const c=contatoDe(row);if(!c)return;
  if(!String(c.nome||'').trim()&&!String(c.email||'').trim()){
    clearTimeout(SUJOS.get(String(row)));SUJOS.delete(String(row));
    setSave('err','Não salvou: informe ao menos nome ou e-mail.');return;
  }
  clearTimeout(SUJOS.get(String(row)));
  SUJOS.set(String(row),setTimeout(()=>salvarContato(row),ms==null?700:ms));
  setSave('saving','Salvando…');
}
/* O perfil vive no mesmo objeto do contato. Trocar "Médico?" para Sim precisa
   redesenhar a linha (o campo de CRM passa a existir), e por isso este caminho é
   separado do dos outros campos. */
function aplicarPerfil(el){
  const box=el.closest('.ctt'); if(!box) return null;
  const c=contatoDe(box.dataset.row); if(!c) return null;
  c.perfil=c.perfil||{};
  const k=el.dataset.p;
  c.perfil[k]= (k==='socio'||k==='medico') ? (el.value===''?null:el.value==='sim') : el.value;
  if(k==='socio'||k==='medico'){
    if(c.perfil.medico!==true) c.perfil.crm='';
    if(c.perfil.socio!==true)  c.perfil.endereco='';
    const alvo=box.querySelector('.perfil');
    if(alvo) alvo.outerHTML=perfilHTML(c);
  }
  return c;
}
function perfilDe(c){
  const p=c.perfil||{};
  return { socio:p.socio, medico:p.medico, funcao:p.funcao||'',
           crm:p.crm||'', endereco:p.endereco||'' };
}

async function salvarContato(row){
  const k=String(row);
  clearTimeout(SUJOS.get(k));SUJOS.delete(k);
  const c=contatoDe(row);if(!c)return;
  const nome=String(c.nome||'').trim(),email=String(c.email||'').trim();
  if(!nome&&!email){setSave('err','Não salvou: informe ao menos nome ou e-mail.');return;}
  try{
    setSave('saving','Salvando…');
    await postAcao({
      acao:'contato_salvar',row:c.row,cliente_id:c.cliente_id,
      nome:nome,email:email,telefone:String(c.telefone||'').trim(),
      papel:c.papel,areas:areasSel(c),perfil:perfilDe(c),email_atual:c._email0||'',
      cliente:nomeCli(c.cliente_id),cod:respAtual()
    });
    c._email0=email;                       // a linha agora é este e-mail
    FALHAS.delete(k);marcarFalha(k,false);
    setSave('ok','Salvo ✓ '+horaAgora());
    /* Gravou tudo: o aviso de "tem coisa por gravar" no rodapé da ficha sai, e o
       Fechar volta a ser Fechar. */
    if(!temPendencia()){CAD_AVISADO=false;avisoCad(false);}
    atualizarLinha(k);atualizarTopoCad(k);
    atualizarCabecalho(c.cliente_id);desenharChips();desenharResumo();desenharContagem();desenharResumoLista();
  }catch(e){
    /* Aviso curto e sem detalhe técnico: o contato fica marcado como falha e o
       "tentar de novo" reenvia os mesmos campos — é isso que importa saber. */
    FALHAS.add(k);marcarFalha(k,true);
    setSave('err','Não foi possível salvar. Tente de novo.');
  }
}
async function flushPendentes(){
  const rows=Array.from(SUJOS.keys());
  for(const r of rows){await salvarContato(r);}
}
/* Grava agora o que estava esperando o debounce. É o salvarContato() de sempre,
   só sem os 700 ms de espera. */
function descarregarPendentes(){
  Array.from(SUJOS.keys()).forEach(r=>{clearTimeout(SUJOS.get(r));salvarContato(r);});
}

/* ===================================================================
   A ficha do contato no modal
   -------------------------------------------------------------------
   A lista mostra as cinco colunas que a equipe lê de relance; o resto do
   contato abre aqui, por cima, sem trocar de página e sem empurrar as
   outras linhas para baixo. Os campos são os MESMOS de sempre (data-k,
   data-p, data-a) — só mudou onde eles são pintados, então autosave,
   troca de papel, chips de área e marca de falha continuam idênticos.
   É a mesma ficha que cria contato novo: dois modais para o mesmo
   formulário seria pior que o que existia antes.
   =================================================================== */
let CAD_ROW='';          // row do contato aberto
let CAD_NOVO=false;      // a ficha aberta é a de criar contato?
let CAD_AVISADO=false;   // já avisamos que tem coisa por gravar? (fechar em 2 tempos)
function elCad(){return document.getElementById('modal');}
function cadAberto(){const m=elCad();return !!m&&!m.hidden;}
/** Aviso de "tem alteração por gravar" no rodapé; o botão passa a dizer que sai assim mesmo. */
function avisoCad(mostrar){
  const a=document.getElementById('cadAviso');if(a)a.hidden=!mostrar;
  const b=document.getElementById('m-cancelar');if(b)b.textContent=mostrar?'Fechar assim mesmo':'Fechar';
}
/** Nome, cliente e papel no topo da ficha — acompanham a edição sem redesenhar nada. */
function atualizarTopoCad(row){
  if(!cadAberto()||CAD_NOVO||String(CAD_ROW)!==String(row))return;
  const c=contatoDe(row);if(!c)return;
  const t=document.getElementById('m-titulo');
  if(t)t.textContent=c.nome||c.email||'(sem nome)';
  /* Só o ID do cliente no cabeçalho, como no registro.html: o nome da empresa é
     longo e, num celular, empurrava para fora justamente o nome da PESSOA, que é
     quem a ficha identifica. A razão social continua inteira no campo Cliente,
     logo abaixo, e no title daqui. */
  const i=document.getElementById('m-id');
  if(i){i.textContent=String(c.cliente_id||'');i.title=nomeCli(c.cliente_id)||'';}
  const p=document.getElementById('m-pill');
  if(p){
    const pr=c.papel==='Principal';
    p.hidden=false;p.className='pill '+(pr?'papel-pri':'papel-sec');
    p.title=pr?'Principal enxerga todas as áreas.':'Secundário enxerga só as áreas marcadas.';
    p.textContent=pr?'Principal':'Secundário';
  }
}
/** Acende na lista a linha cuja ficha está aberta. */
function marcarLinhaAberta(){
  document.querySelectorAll('.ctl').forEach(n=>
    n.classList.toggle('aberto',!CAD_NOVO&&!!CAD_ROW&&String(n.dataset.row)===String(CAD_ROW)));
}
function abrirFicha(row){
  const c=contatoDe(row);if(!c)return;
  const m=elCad();if(!m)return;
  CAD_ROW=String(c.row);CAD_NOVO=false;CAD_AVISADO=false;
  document.getElementById('m-body').innerHTML=fichaHTML(c);
  const msg=document.getElementById('m-msg');if(msg){msg.className='msg';msg.textContent='';}
  document.getElementById('m-add').textContent='Salvar alterações';
  m.hidden=false;
  /* Enquanto a ficha está aberta a página atrás não rola — senão o dedo no
     celular arrasta a lista por baixo do véu e some com a referência. */
  document.body.style.overflow='hidden';
  atualizarTopoCad(CAD_ROW);
  avisoCad(false);
  marcarLinhaAberta();
  /* Reabrir não pode apagar o que não gravou: a faixa e o "tentar de novo"
     nascem de novo junto com os campos. */
  if(FALHAS.has(CAD_ROW))marcarFalha(CAD_ROW,true);
  const cx=m.querySelector('.modal-box');if(cx)cx.focus();
}
/* Fechar com alteração por gravar avisa antes, em dois tempos como o resto da
   casa (nunca uma caixa do navegador): o primeiro Fechar/Esc/clique no véu
   explica, o segundo sai. Ao sair assim mesmo a gravação pendente é DESCARREGADA
   na hora — deixar o debounce correndo com a ficha fora da tela é exatamente o
   jeito de perder o que foi digitado. */
function fecharFicha(forcado){
  const m=elCad();if(!m||m.hidden)return;
  /* A ficha de contato NOVO não tem autosave: não há o que perder ao fechá-la, e
     um aviso ali falaria da gravação de OUTRO contato — susto sem sentido. */
  if(!forcado&&!CAD_NOVO&&temPendencia()&&!CAD_AVISADO){CAD_AVISADO=true;avisoCad(true);return;}
  if(SUJOS.size)descarregarPendentes();
  m.hidden=true;
  document.body.style.overflow='';
  const row=CAD_ROW;CAD_ROW='';CAD_NOVO=false;CAD_AVISADO=false;
  avisoCad(false);
  document.getElementById('m-body').innerHTML='';
  marcarLinhaAberta();
  /* O foco volta para a linha de onde saiu: quem navega por teclado não é jogado
     de volta para o topo da página. */
  const no=row?document.querySelector('.ctl[data-row="'+CSS.escape(String(row))+'"]'):null;
  if(no)no.focus();
}
/* O botão "Salvar alterações" NÃO substitui o autosave: cada edição continua
   chamando agendarSalvar(), e é ele que impede perder texto digitado — foi para
   isso que ele existe nesta tela. O botão ANTECIPA a gravação pendente (mata o
   debounce e salva na hora), reenvia o que falhou e, quando tudo entrou, FECHA a
   ficha: salvar é o gesto de encerrar, e ficar com a ficha aberta depois de
   confirmar faz a pessoa clicar em Fechar sem saber se gravou.

   Só fecha se gravou MESMO. Falha mantém a ficha na tela: fechar por cima de uma
   gravação que não foi levaria embora o aviso e a chance de tentar de novo, e a
   pessoa sairia achando que salvou. */
async function salvarAgoraCad(){
  const btn=document.getElementById('m-add');
  /* Nome e e-mail os dois em branco: o servidor não aceita, o autosave já
     recusou e não há pendência nenhuma para disparar. Fechar aqui levaria embora
     o único aviso de que aquele contato não entrou. */
  if(CAD_ROW){
    const c=contatoDe(CAD_ROW);
    if(c&&!String(c.nome||'').trim()&&!String(c.email||'').trim()){
      setSave('err','Não salvou: informe ao menos nome ou e-mail.');return;
    }
  }
  if(temPendencia()){
    if(btn){btn.disabled=true;btn.dataset.rot=btn.textContent;btn.textContent='Salvando…';}
    try{
      /* O que falhou antes volta para a fila junto com o que está pendente: aqui
         a gravação é sempre do contato inteiro, então reenviar é chamar
         salvarContato() de novo com os mesmos campos. */
      const rows=new Set();
      SUJOS.forEach((t,r)=>{clearTimeout(t);rows.add(r);});
      FALHAS.forEach(r=>rows.add(r));
      for(const r of rows){await salvarContato(r);}
    }catch(e){ /* salvarContato() já registra a falha em FALHAS e avisa na tela */ }
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.rot||'Salvar alterações';}
  }
  if(temPendencia())return;            // não gravou: a ficha continua aberta
  CAD_AVISADO=false;avisoCad(false);
  fecharFicha(true);
}

/* ---------------- adicionar / remover ---------------- */
function preencherDatalist(){
  document.getElementById('dl-clientes').innerHTML=
    CLIENTES.map(c=>`<option value="${esc(c.id+' · '+(c.nome||''))}"></option>`).join('');
}
function resolverCliente(txt){
  const s=String(txt||'').trim();
  if(!s)return '';
  const idPart=s.split('·')[0].trim();
  if(Object.prototype.hasOwnProperty.call(NOME,idPart))return idPart;
  if(Object.prototype.hasOwnProperty.call(NOME,s))return s;
  const n=normTxt(s);
  const exato=CLIENTES.filter(c=>normTxt(c.id+' · '+c.nome)===n||normTxt(c.nome)===n);
  if(exato.length===1)return String(exato[0].id);
  const parcial=CLIENTES.filter(c=>normTxt(c.id+' '+c.nome).includes(n));
  if(parcial.length===1)return String(parcial[0].id);
  return '';
}
function validarCliModal(){
  const el=document.getElementById('m-cli'),h=document.getElementById('m-cli-hint');
  const id=resolverCliente(el.value);
  if(!el.value.trim()){h.className='hint';h.textContent='Comece a digitar o ID ou o nome.';return '';}
  if(id){h.className='hint ok';h.textContent='✓ '+id+(nomeCli(id)?' · '+nomeCli(id):'');}
  else{h.className='hint err';h.textContent='Não achei esse cliente — escolha um da lista.';}
  return id;
}
function pintarAreasModal(){
  const pr=document.getElementById('m-papel').value==='Principal';
  document.getElementById('m-areas').innerHTML=
    AREAS.map(a=>`<button type="button" class="achip${(pr||MODAL_AREAS[a[0]])?' on':''}${pr?' trava':''}" data-ma="${a[0]}"${pr?' disabled':''}>${a[1]}</button>`).join('')+
    (pr?'<span class="nota">Principal enxerga todas as áreas</span>':'');
}
/* Contato novo: a MESMA ficha, com as seções que ainda cabem. Aberta a partir de
   um cliente, o campo Cliente já vem preenchido e travado e o foco vai direto
   para o Nome; pelo botão geral, o foco vai para o Cliente. */
function abrirModal(idCliente){
  MODAL_AREAS={};
  const m=elCad();if(!m)return;
  CAD_ROW='';CAD_NOVO=true;CAD_AVISADO=false;
  document.getElementById('m-body').innerHTML=fichaNovaHTML();
  const cli=document.getElementById('m-cli');
  cli.value=idCliente?(idCliente+(nomeCli(idCliente)?' · '+nomeCli(idCliente):'')):'';
  cli.readOnly=!!idCliente;
  document.getElementById('m-titulo').textContent='Novo contato';
  const mid=document.getElementById('m-id');
  mid.textContent=idCliente||'';mid.title=(idCliente&&nomeCli(idCliente))||'';
  const p=document.getElementById('m-pill');if(p)p.hidden=true;
  document.getElementById('m-papel').value='Secundário';
  const msg=document.getElementById('m-msg');msg.className='msg';msg.textContent='';
  /* O botão do rodapé é o mesmo; só o rótulo diz qual é o gesto de encerrar. */
  document.getElementById('m-add').textContent='Adicionar contato';
  avisoCad(false);
  /* Aqui ainda não existe contato nenhum: um "Salvo ✓ 17:58" herdado da gravação
     de OUTRO contato diria que este já entrou. O indicador desta ficha começa
     vazio e quem fala é o #m-msg. E o botão de sair é "Cancelar", que é o gesto
     de desistir de criar — não o de fechar uma ficha que já existe. */
  const st=document.getElementById('saveStatusCad');
  if(st){st.className='save-status claro';st.textContent='';}
  document.getElementById('m-cancelar').textContent='Cancelar';
  validarCliModal();
  pintarAreasModal();
  m.hidden=false;
  document.body.style.overflow='hidden';
  marcarLinhaAberta();
  setTimeout(()=>{const f=document.getElementById(idCliente?'m-nome':'m-cli');if(f)f.focus();},40);
}
/* Nome antigo mantido: é o que adicionarContato() e os atalhos já chamavam. */
function fecharModal(){fecharFicha(true);}
async function adicionarContato(btn){
  const msg=document.getElementById('m-msg');
  const id=validarCliModal();
  if(!id){msg.className='msg err';msg.textContent='Escolha o cliente.';return;}
  const nome=document.getElementById('m-nome').value.trim();
  const email=document.getElementById('m-email').value.trim();
  if(!nome&&!email){msg.className='msg err';msg.textContent='Informe ao menos nome ou e-mail.';return;}
  const papel=document.getElementById('m-papel').value;
  const areas=papel==='Principal'?AREAS.map(a=>a[0]):AREAS.filter(a=>MODAL_AREAS[a[0]]).map(a=>a[0]);
  btn.disabled=true;msg.className='msg';msg.textContent='Salvando…';
  try{
    await flushPendentes();
    await postAcao({
      acao:'contato_salvar',cliente_id:id,nome:nome,email:email,
      telefone:document.getElementById('m-tel').value.trim(),
      papel:papel,areas:areas,
      perfil:{ socio:null, medico:null, funcao:'', crm:'', endereco:'' },
      cliente:nomeCli(id),cod:respAtual()
    });
    fecharModal();
    ABERTOS.add(String(id));
    setSave('ok','Contato adicionado ✓ '+horaAgora());
    await carregar(false);
    irPara(id);
  /* As checagens que a pessoa resolve ("Escolha o cliente", "Informe ao menos nome
     ou e-mail") ficam lá em cima e continuam falando por si. O que sobra aqui é
     falha nossa: aviso curto, sem o texto da exceção — que antes vinha inteiro
     para dentro do modal. */
  }catch(e){msg.className='msg err';msg.textContent='Não foi possível salvar. Tente de novo.';}
  finally{btn.disabled=false;}
}
function pedirConfirmacao(row){
  const c=contatoDe(row);if(!c)return;
  const box=document.querySelector('.ctt[data-row="'+CSS.escape(String(row))+'"] [data-rm]');
  if(!box)return;
  const quem=c.nome||c.email||'este contato';
  box.innerHTML=`<span class="conf">Remover ${esc(quem)}?</span>
    <button class="btn btn--mini btn--danger" type="button" data-delok="${esc(row)}">Sim, remover</button>
    <button class="btn btn--mini" type="button" data-delno="${esc(row)}">Cancelar</button>`;
}
function cancelarConfirmacao(row){
  const c=contatoDe(row);if(!c)return;
  const box=document.querySelector('.ctt[data-row="'+CSS.escape(String(row))+'"] [data-rm]');
  if(box)box.innerHTML=btnRemover(c);
}
async function removerContato(row){
  const c=contatoDe(row);if(!c)return;
  const box=document.querySelector('.ctt[data-row="'+CSS.escape(String(row))+'"] [data-rm]');
  if(box)box.innerHTML='<span class="conf">Removendo…</span>';
  const id=c.cliente_id;
  try{
    await flushPendentes();
    await postAcao({acao:'contato_remover',row:c.row,email:c.email,cliente:nomeCli(id),cod:respAtual()});
    setSave('ok','Contato removido ✓ '+horaAgora());
    /* O contato deixou de existir: a ficha aberta é a dele e não pode continuar
       na tela por cima de uma lista que já não o tem. */
    FALHAS.delete(String(row));
    if(String(CAD_ROW)===String(row))fecharFicha(true);
    await carregar(false);   // as linhas de todo mundo mudam: recarrega tudo
  }catch(e){
    /* Aviso curto e sem detalhe técnico; o botão de remover volta ao lugar para
       quem quiser tentar de novo. */
    setSave('err','Não foi possível remover. Tente de novo.');
    if(box)box.innerHTML=btnRemover(c);
  }
}

/* ---------------- navegação ---------------- */
function irPara(id){
  const alvo=String(id);
  const achar=()=>document.querySelector('.cli[data-cli="'+CSS.escape(alvo)+'"]');
  ABERTOS.add(alvo);
  if(!achar()||!visiveis().some(g=>g.id===alvo)){
    FILTRO='todos';AREA='';TERMO='';
    const b=document.getElementById('busca');if(b)b.value='';
  }
  /* O teto não pode esconder justamente o cliente para onde estamos indo. */
  const pos=visiveis().findIndex(g=>g.id===alvo);
  if(pos>=TETO)TETO=Math.ceil((pos+1)/PASSO)*PASSO;
  redesenhar();
  const el=achar();if(!el)return;
  el.scrollIntoView({block:'center',behavior:'smooth'});
  el.classList.add('destaque');setTimeout(()=>el.classList.remove('destaque'),2600);
}
function aplicarBusca(){
  const t=normTxt(TERMO);
  TETO=PASSO;            // resultado novo, teto novo
  ABERTOS.clear();
  if(t){
    const arr=visiveis();
    if(arr.length<=LIMITE_AUTO)arr.forEach(g=>ABERTOS.add(g.id));
  }
  redesenhar();
}

/* ---------------- eventos ---------------- */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='busca'){TERMO=el.value;aplicarBusca();return;}
  if(el.id==='m-cli'){validarCliModal();return;}
  if(el.dataset&&el.dataset.p){ const c=aplicarPerfil(el); if(c){agendarSalvar(c.row);atualizarLinha(c.row);} return; }
  if(!el.dataset||!el.dataset.k||el.dataset.k==='papel')return;
  const ctt=el.closest('.ctt');if(!ctt)return;
  const c=contatoDe(ctt.dataset.row);if(!c)return;
  c[el.dataset.k]=el.value;
  el.classList.toggle('falho',(el.dataset.k==='email'||el.dataset.k==='telefone')&&!el.value.trim());
  agendarSalvar(c.row);
  /* A linha da lista e o topo da ficha acompanham a digitação na hora, sem
     esperar a gravação: é o mesmo dado, e ver o nome mudar num lugar e não no
     outro faz duvidar de qual dos dois é o verdadeiro. */
  atualizarLinha(c.row);atualizarTopoCad(c.row);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='m-papel'){pintarAreasModal();return;}
  if(el.dataset&&el.dataset.p){ const c=aplicarPerfil(el); if(c){agendarSalvar(c.row,150);atualizarLinha(c.row);} return; }
  if(!el.dataset||!el.dataset.k)return;
  const ctt=el.closest('.ctt');if(!ctt)return;
  const c=contatoDe(ctt.dataset.row);if(!c)return;
  if(el.dataset.k==='papel'){
    trocarPapel(c,el.value);
    const box=ctt.querySelector('[data-areas]');if(box)box.innerHTML=areasHTML(c);
  }else{
    c[el.dataset.k]=el.value;
  }
  agendarSalvar(c.row,150);   // saiu do campo: grava logo
  atualizarLinha(c.row);atualizarTopoCad(c.row);
});
function trocarPapel(c,novo){
  if(novo==='Principal'){
    if(c.papel!=='Principal')c._prev=Object.assign({},c.areas);
    c.papel='Principal';
    AREAS.forEach(a=>c.areas[a[0]]=true);
  }else{
    c.papel='Secundário';
    if(c._prev){AREAS.forEach(a=>c.areas[a[0]]=!!c._prev[a[0]]);c._prev=null;}
  }
}
document.addEventListener('click',e=>{
  const rt=e.target.closest('[data-retry]');
  if(rt){rt.textContent='enviando…';rt.disabled=true;salvarContato(rt.dataset.retry);return;}
  const cp=e.target.closest('[data-copy]');
  if(cp){copiar(cp.dataset.copy,cp);return;}
  const ac=e.target.closest('.achip[data-a]');
  if(ac&&!ac.disabled){
    const ctt=ac.closest('.ctt');const c=contatoDe(ctt.dataset.row);if(!c)return;
    const k=ac.dataset.a;
    c.areas[k]=!c.areas[k];
    ac.classList.toggle('on',!!c.areas[k]);
    agendarSalvar(c.row,400);
    atualizarLinha(c.row);
    return;
  }
  const ma=e.target.closest('.achip[data-ma]');
  if(ma&&!ma.disabled){
    const k=ma.dataset.ma;MODAL_AREAS[k]=!MODAL_AREAS[k];
    ma.classList.toggle('on',!!MODAL_AREAS[k]);return;
  }
  const tg=e.target.closest('[data-toggle]');
  if(tg){
    const id=tg.dataset.toggle;
    if(ABERTOS.has(id))ABERTOS.delete(id);else ABERTOS.add(id);
    const g=grupoDe(id),el=tg.closest('.cli');
    if(g&&el){el.outerHTML=grupoHTML(g,normTxt(TERMO));FALHAS.forEach(k=>marcarFalha(k,true));}
    else desenharLista();
    return;
  }
  /* A linha só abre a ficha — nada nela edita, e é isso que deixa a lista poder
     ser lida sem medo de alterar alguma coisa sem querer. */
  const li=e.target.closest('.ctl[data-row]');
  if(li){abrirFicha(li.dataset.row);return;}
  const ad=e.target.closest('[data-add]');
  if(ad){abrirModal(ad.dataset.add);return;}
  const dl=e.target.closest('[data-del]');
  if(dl){pedirConfirmacao(dl.dataset.del);return;}
  const ok=e.target.closest('[data-delok]');
  if(ok){removerContato(ok.dataset.delok);return;}
  const no=e.target.closest('[data-delno]');
  if(no){cancelarConfirmacao(no.dataset.delno);return;}
  const cf=e.target.closest('.chip[data-f]');
  if(cf){FILTRO=cf.dataset.f;TETO=PASSO;redesenhar();return;}
  const ca=e.target.closest('.chip[data-area]');
  if(ca){AREA=ca.dataset.area;TETO=PASSO;redesenhar();return;}
  /* Ordenar: os dois caminhos — o cabeçalho da lista e os chips "Ordenar por" do
     painel — mexem no MESMO estado e no mesmo ?ord=/?dir=, para o F5 voltar
     igual. Abaixo de 900px o cabeçalho some e sobram os chips. A busca, os
     filtros e os cartões abertos ficam onde estão: só a ordem muda. */
  const ord=e.target.closest('.chip[data-s],[data-sort]');
  if(ord){const k=ord.dataset.s||ord.dataset.sort;
    if(SORT.key===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.key=k;SORT.dir='asc';}
    TETO=PASSO;                                // outra ordem, outro começo de lista
    desenharOrdem();desenharLista();desenharResumoLista();sincronizarURL();
    if(FILTROS_UI)FILTROS_UI.atualizarContador();
    return;}
  if(e.target.closest('#btn-limpar')){limparFiltros();return;}
  if(e.target.closest('.btn-mais')){TETO+=PASSO;desenharLista();return;}
  if(e.target.closest('.btn-todos')){TETO=MAX_CLI;desenharLista();return;}
  const tk=e.target.closest('.tk[data-goto]');
  /* Nos cartões de contato o item aponta para uma pessoa, não só para o cliente:
     leva até o cliente na lista e abre a ficha de quem estava faltando. */
  if(tk){irPara(tk.dataset.goto);if(tk.dataset.ctt)abrirFicha(tk.dataset.ctt);return;}
  if(e.target.closest('#novo')){abrirModal('');return;}
  /* "Abrir todos" só abre o que está desenhado: com 114 fichas na tela ele deixa
     de ser atalho e vira armadilha — quem quer tudo primeiro pede "mostrar todos". */
  if(e.target.closest('#abrirTodos')){
    document.querySelectorAll('#lista .cli[data-cli]').forEach(el=>ABERTOS.add(el.dataset.cli));
    desenharLista();return;
  }
  if(e.target.closest('#fecharTodos')){ABERTOS.clear();desenharLista();return;}
  /* Rodapé da ficha: o botão é um só e o gesto depende do modo — criar contato
     novo ou antecipar a gravação do que está aberto. */
  const salvar=e.target.closest('#m-add');
  if(salvar){if(CAD_NOVO)adicionarContato(salvar);else salvarAgoraCad();return;}
  /* Fechar, o × do topo e o clique no véu. Vêm depois dos botões de propósito:
     antes deles, um clique no botão contaria como clique fora. */
  if(e.target.closest('#m-cancelar')||e.target.closest('#m-x')||e.target.id==='modal'){fecharFicha();return;}
});
/* Atalhos de busca (C.4): "/" foca, Esc limpa. Com o modal aberto, Esc fecha o
   modal — e o atalho não atrapalha quem já está digitando noutro campo. */
document.addEventListener('keydown',e=>{
  /* A ficha é o modal de cima: com ela aberta, Esc é dela antes de tudo. */
  if(e.key==='Escape'&&cadAberto()){e.preventDefault();fecharFicha();return;}
  /* A linha da lista é um role="button": sem isto, Enter e Espaço não abririam a
     ficha para quem navega por teclado — e a tela ficaria só para o mouse. */
  const linha=e.target&&e.target.closest&&e.target.closest('.ctl[data-row]');
  if(linha&&(e.key==='Enter'||e.key===' '||e.key==='Spacebar')){
    e.preventDefault();abrirFicha(linha.dataset.row);return;
  }
  /* Com a ficha aberta os atalhos da lista ficam parados: o "/" mandaria o foco
     para o campo de busca atrás do véu, e a pessoa passaria a digitar num campo
     que não está vendo. */
  if(cadAberto())return;
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';TERMO='';aplicarBusca();}
});

/* ---------------- copiar ---------------- */
function copiar(txt,btn){
  const original=btn.textContent;
  const feito=()=>{btn.textContent='copiado ✓';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent=original;btn.classList.remove('ok');},1400);};
  const manual=()=>{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');feito();}catch(err){btn.textContent='copie manualmente';}
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(feito).catch(manual);
  else manual();
}

/* ---------------- carregar ---------------- */
/* A ordem aqui é a da tela: primeiro o que responde (busca, contagem), depois o
   que refina (filtros), depois o exemplo, e só então as fichas. Os 13 chips e os
   4 cartões continuam existindo — deixaram de ser pedágio. */
function layout(){
  return `<div class="wrap">
    <div class="topo">
      <div class="barra-acoes">
        <input class="busca campo-busca" id="busca" type="search" placeholder="Buscar por ID, cliente, contato, e-mail, CNPJ ou telefone…  ( / para focar)" value="${esc(TERMO)}">

}
async function carregar(primeira){
  try{
    const d=await jsonp(API_URL+'?tipo=contatos_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro)throw new Error(d.erro);
    CONTATOS=(d.contatos||[]).map(c=>Object.assign(
      {nome:'',email:'',telefone:'',papel:'Secundário',codigo:'',link:'',ultimo_acesso:'',acesso_via:''},c,
      {cliente_id:String(c.cliente_id==null?'':c.cliente_id),areas:Object.assign({},c.areas||{}),
       // e-mail como estava na planilha quando carregamos: o backend usa isso para
       // conferir que a linha ainda é este contato antes de gravar (linhas sobem
       // quando alguém remove um contato noutra aba do navegador).
       _email0:String(c.email==null?'':c.email).trim()}));
    CLIENTES=(d.clientes||[]).map(c=>({id:String(c.id),nome:String(c.nome||'')}));
    NOME={};CLIENTES.forEach(c=>NOME[c.id]=c.nome);
    agrupar();
    if(primeira){
      lerURL();document.getElementById('app').innerHTML=layout();   // a visão vem do endereço (C.10)
      FILTROS_UI=ligarFiltros('contatos-equipe',filtrosPainel);     // depois do layout: o painel já existe
    }
    preencherDatalist();
    if(primeira&&TERMO)aplicarBusca();else redesenhar();
    /* A lista já está pintada: a barra corre até 100% e o overlay sai revelando a
       tela pronta. Nas recargas (primeira=false) não há overlay e isto é um
       no-op — a lista se atualiza sem piscar nada por cima. */
    if (window.B4UEspera) B4UEspera.concluir();
  }catch(e){
    if(primeira){
      /* Uma mensagem só, igual em todo o painel. Aqui saía o texto da exceção e um
         pedido para conferir a chave e a publicação do sistema — vocabulário nosso,
         escrito na tela de quem só queria ver os contatos. */
      if (window.B4UEspera) B4UEspera.telaErro(document.getElementById('app'));
      else document.getElementById('app').innerHTML =
        '<div class="state"><h1>Não conseguimos carregar as informações</h1>'
        + '<p>Houve um erro ao recuperar as informações. Tente novamente em alguns '
        + 'minutos. Se o problema continuar, entre em contato com o atendimento.</p></div>';
    }else{
      /* Recarga em segundo plano: a lista na tela continua válida, então basta um
         aviso curto na faixa de status — sem detalhe técnico. */
      setSave('err','Não foi possível carregar.');
    }
  }
}
document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());

/* ---------------- menu lateral ----------------
   Montado ANTES de carregar(): a identidade desta tela é a chave, que já está na
   URL desde a primeira linha deste script — não há o que esperar da API. E se a
   busca falhar, o erro pinta dentro do #app com o menu inteiro de pé, que é a
   mesma razão de o erro nunca ser pintado no <body>.
   Sem `contexto`: esta página não sabe o NOME de quem está usando (o `cod` é
   código de log, não nome), e um rótulo inventado seria pior que bloco nenhum.
   Os links levam só a chave, exatamente como o "← Painel" da linha acima. */
if (window.B4UShell) {
  B4UShell.montar({
    perfil: 'equipe',
    ativo: 'contatos',
    link: function (pag) { return pag + '?chave=' + encodeURIComponent(chaveAtual()); }
  });
  /* Esta página tem <base target="_blank">, para o colaborador nunca perder a
     tela em que estava ao abrir um link do contato. O menu lateral segue a MESMA
     regra: o dono decidiu que tudo abre em guia nova, sem exceção, e o próprio
     B4UShell já marca os links do menu com target="_blank" rel="noopener".
     As duas exceções continuam sendo o logo (#logo-home) e o "← Painel"
     (#volta), escritos à mão com target="_self": eles são o gesto de VOLTAR. */
}

carregar(true);
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador.html') {
        try { href = 'colaborador.html?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador.html'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
