<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Guia nova por padrão: link clicado não tira o colaborador de onde ele estava. -->
<base target="_blank">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contatos (equipe) — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Duas origens porque o /exec responde 302 para a segunda: sem isto o aparelho paga
     DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte não pode segurar a primeira pintura: entra como preload e vira folha depois. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"></noscript>
<style>
:root{
  /* Paleta canonica da equipe — a mesma em todas as telas. */
  --canvas:#F1E7DC;--surface:#FFFFFF;--surface-warm:#FBF6EF;
  --ink:#113D39;--ink-2:#3F5854;--muted:#6E6256;--line:#E4D9C9;--line-2:#D6C3AC;
  --brand-dark:#073034;--brand-teal:#0F8C85;--brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,37:1 no canvas).
     Este e o mesmo teal escurecido so para letra e fundo de letra; o --brand-teal
     segue canonico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E;--amber-txt:#8A5A10;--amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber da 2,61:1 com #fff, o --amber-2 da 4,68:1. Como
     preenchimento de barra, icone ou borda, o --amber original continua valendo. */
  --amber-2:#B05F12;
  --vermelho:#C0392B;--verde:#2E9D5F;--verde-2:#25804C;
  /* Raios: so pelos tokens — 10 em campo, 12 padrao, 16 nos blocos grandes, pilula. */
  --radius-sm:10px;--radius:12px;--radius-lg:16px;--radius-pill:999px;
  /* Escala de texto e o teal claro: as outras telas ja tinham, esta nao. Sem eles
     o CSS compartilhado da regua de acoes cai no valor herdado e desalinha. */
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:15px; --fs-5:19px; --fs-6:24px;
  --receita-soft:#DBEFEC;
  /* Levantar de cartao clicavel: uma sombra so, igual em todas as telas. */
  --lift:0 8px 20px rgba(17,61,57,.10);
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- barra ---------- */
.barra{position:sticky;top:0;z-index:60;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:var(--radius-pill)}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd;white-space:nowrap}
.barra a.volta{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600}
.save-status{font-size:13px;font-weight:800;padding:6px 13px;border-radius:var(--radius-pill);background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
/* Branco sobre --amber da 2,61:1 e sobre --verde 3,44:1 — o rotulo do proprio
   status de gravacao some. Um degrau mais escuro na MESMA familia: 4,68:1 e 4,92:1. */
.save-status.saving{background:var(--amber-2);color:#fff}
.save-status.ok{background:var(--verde-2);color:#fff}
.save-status.err{background:var(--vermelho);color:#fff}

/* ---------- topo ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 80px}
.topo{position:sticky;top:52px;z-index:45;background:var(--canvas);padding:12px 0 8px}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.grupo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grupo .rot{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px}
.busca{flex:1;min-width:230px;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.chip{font-size:13px;font-weight:700;border-radius:var(--radius-pill);padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--brand-teal)}
.chip.on{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.chip .n{background:rgba(0,0,0,.10);border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.chip.alerta.on{background:var(--vermelho);border-color:var(--vermelho)}
.chip.falta.on{background:var(--amber);border-color:var(--amber)}
.chip.limpar{border-style:dashed;color:var(--muted)}
/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:var(--radius-pill);padding:12px 20px}
.dica{font-size:12px;color:var(--muted);padding:0 0 8px}

/* ---------- revelacao progressiva ---------- */
/* Régua de ações: busca sempre à mão, filtros a um clique, contagem à vista.
   Antes os filtros ficavam todos abertos na tela — quem chegava tinha de ler a
   parede inteira antes de achar o campo de busca, que é o que 9 em 10 usam. */
.barra-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.barra-acoes .campo-busca{flex:1;min-width:200px;font-size:16px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink)}
.barra-acoes .campo-busca:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.btn-filtros{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--ink);font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.btn-filtros:hover{border-color:var(--brand-teal)}
.btn-filtros[aria-expanded="true"]{background:var(--receita-soft);border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.btn-filtros svg{width:15px;height:15px;flex:none}
.cont-filtros{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:var(--radius-pill);background:var(--brand-teal-txt);color:#fff;
  font-size:var(--fs-1);font-weight:800}
/* display:inline-flex ganha do atributo hidden — sem esta linha o selo mostrava
   um "0" permanente ao lado de Filtros. */
.cont-filtros[hidden]{display:none}
.resumo-lista{font-size:var(--fs-3);color:var(--ink-2);white-space:nowrap}
.painel-filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
  padding:14px 16px;margin:0 0 14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-warm)}
.painel-filtros[hidden]{display:none}
.lista-mais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.lista-mais button{min-height:44px;padding:0 18px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--brand-teal-txt);
  font:inherit;font-weight:700;font-size:var(--fs-3);cursor:pointer}
.lista-mais button:hover{border-color:var(--brand-teal);background:var(--receita-soft)}
.lista-mais .btn-todos{background:transparent;color:var(--ink-2);font-weight:600}
/* A contagem desta tela tem quatro números; no celular ela precisa quebrar, senão
   o nowrap do contrato empurra a página para o lado. */
@media(max-width:560px){.resumo-lista{white-space:normal}}
/* Cada grupo de chips ocupa a fileira inteira: Situação e Área não se misturam. */
.painel-filtros .grupo{width:100%}
.btn-limpar{min-height:38px;padding:0 15px;border-radius:var(--radius-pill);border:1px dashed var(--line-2);
  background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:var(--fs-2);cursor:pointer}
.btn-limpar:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
/* "Abrir todos" é da lista, não da régua — e só mexe no que está desenhado. */
.acoes-lista{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 10px}
.acoes-lista .dica{padding:0;flex:1;min-width:170px}
/* Os exemplos por situação continuam inteiros, só que a um clique de distância. */
details.situacao{margin:0 0 12px}
details.situacao>summary{padding:10px 13px;font-size:var(--fs-3)}
details.situacao>.resumo{padding:0 12px 12px}

/* ---------- resumo ---------- */
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 0 14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.rhead{padding:9px 13px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff}
.rcard.semp .rhead{background:var(--vermelho)}
.rcard.semmail .rhead{background:var(--amber)}
.rcard.semtel .rhead{background:var(--brand-teal-txt)}
.rcard.semct .rhead{background:#6B8486}
.rhead .n{background:rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:2px 9px;font-size:12px}
/* Altura em múltiplo de linha + folga embaixo: antes a última linha aparecia pela
   metade, cortada pela borda do cartão, e parecia defeito de dado. */
.rlista{max-height:236px;overflow:auto;padding:5px 5px 9px}
.tk{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px}
.tk:hover{background:var(--surface-warm)}
.tk .d{font-weight:800;white-space:nowrap;color:var(--brand-teal-txt)}
/* Nome cortado no meio ("AJUB - CIRURGIA DE CABEÇA E P…") não serve para
   reconhecer ninguém: aqui ele quebra a linha em vez de sumir. */
.tk .lb{color:var(--ink-2);flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.tk .tp{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
/* A terceira coluna também é nome de cliente ("Padaria Sao…"): quebra em vez de
   virar reticências. O "2 ct" dos outros cartões é curto e não sente diferença. */
.tk .tp{max-width:40%;white-space:normal;text-align:right;line-height:1.35;overflow-wrap:anywhere}
.rvazio{color:var(--muted);font-size:12px;padding:9px}

/* ---------- lista de clientes ---------- */
.lista{display:flex;flex-direction:column;gap:8px}
.cli{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.cli.on{border-color:var(--brand-teal);box-shadow:0 3px 14px rgba(7,48,52,.08)}
.cli-h{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--surface);border:0;
  font-family:var(--sans);font-size:15px;color:var(--ink);padding:11px 13px;cursor:pointer;flex-wrap:wrap}
.cli-h:hover{background:var(--surface-warm)}
.cli.on .cli-h{background:var(--surface-warm);border-bottom:1px solid var(--line)}
.chev{color:var(--brand-teal-txt);font-size:12px;width:12px;flex:none}
.cid{font-weight:800;font-size:13px;color:#fff;background:var(--brand-teal-txt);border-radius:var(--radius-sm);padding:3px 9px;white-space:nowrap}
.cnome{font-weight:700;font-size:13px;flex:1;min-width:120px;line-height:1.25}
.cnome i{color:var(--muted);font-weight:600}
.sinais{display:flex;gap:5px;flex-wrap:wrap}
.sn{font-size:11px;font-weight:800;letter-spacing:.2px;border-radius:var(--radius-pill);padding:3px 9px;white-space:nowrap}
.sn.alerta{background:#F7DFDC;color:var(--vermelho);border:1px solid #E0BDB8}
.sn.amb{background:var(--amber-soft);color:#8a5117;border:1px solid var(--amber-line)}
.sn.cinza{background:#EEE9E2;color:var(--muted);border:1px solid var(--line)}
.qtd{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.cli-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;background:var(--canvas)}
.vazio{font-size:13px;color:var(--muted);padding:6px 2px}
.add-linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dica-in{font-size:11px;color:var(--muted)}

/* ---------- contato ---------- */
.ctt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;display:flex;flex-direction:column;gap:8px}
.ctt.match{border-color:var(--brand-teal);box-shadow:inset 3px 0 0 var(--brand-teal)}
.campos{display:grid;grid-template-columns:1.2fr 1.4fr .9fr .8fr;gap:8px}
.cp{display:flex;flex-direction:column;gap:3px;min-width:0}
.cp>span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.in{font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
.in:focus{outline:2px solid var(--brand-teal);outline-offset:0}
.in.falho{border-color:var(--amber);background:#FFFCF7}
.areas-linha{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.rot-a{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:2px}
.achip{font-family:var(--sans);font-size:12px;font-weight:700;border-radius:var(--radius-pill);padding:4px 11px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--muted)}
.achip:hover{border-color:var(--brand-teal);color:var(--ink)}
.achip.on{background:#E1F0EE;border-color:#9ecfca;color:#0b6c66}
.achip.trava{cursor:default;opacity:.85}
.achip.trava:hover{border-color:#9ecfca}
.nota{font-size:11px;color:var(--muted);font-style:italic;margin-left:4px}
.acs{font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:3px 9px;white-space:nowrap;
  background:#E6F3EC;color:#1f6b45;border:1px solid #CBE6D8}
.acs.nunca{background:#F8E3DF;color:var(--vermelho);border-color:#F0C9C1}
.acs.antigo{background:var(--amber-soft);color:#8a5117;border-color:#F0D6B4}
.rodape{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.ro{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ro b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px 8px;color:var(--ink)}
.lk{font-family:var(--sans);font-size:11px;font-weight:800;color:var(--brand-teal-txt);background:none;border:0;border-bottom:1px dashed var(--brand-teal-txt);
  cursor:pointer;padding:0;text-decoration:none}
.lk.ok{color:var(--verde);border-color:var(--verde)}
.rodape .sp{flex:1}
.rm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.conf{font-size:12px;font-weight:700;color:var(--vermelho)}
mark{background:#FFF3B0;color:inherit;border-radius:var(--radius-sm);padding:0 2px}
.cli.destaque{box-shadow:0 0 0 3px #FFF3B0;transition:box-shadow .4s ease}

/* ---------- estados / modal ---------- */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:50vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:52ch}
.state code{background:var(--surface-warm);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(7,48,52,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:18px}
.modal.on{display:flex}
.modal-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.modal-card h2{font-size:19px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fld label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fld input,.fld select{font-family:var(--sans);font-size:15px;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
.fld input:focus,.fld select:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.fld input[readonly]{background:var(--surface-warm);color:var(--ink-2)}
.hint{font-size:12px;font-weight:700;color:var(--muted);min-height:16px}
.hint.ok{color:var(--verde)}.hint.err{color:var(--vermelho)}
.msg{font-size:13px;font-weight:700}
.msg.err{color:var(--vermelho)}
.acoes-modal{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
@media(max-width:820px){.campos{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.campos{grid-template-columns:1fr}.resumo{grid-template-columns:1fr}.barra .tag{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}


/* ---------- explicacao recolhida (C.2) ----------
   O dado vem primeiro; a instrucao fica a um clique e lembra a escolha. */
details.ajuda{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:8px 0}
details.ajuda>summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:12px;font-weight:800;color:var(--ink-2)}
details.ajuda>summary::-webkit-details-marker{display:none}
details.ajuda>summary::after{content:" \25BE";color:var(--muted)}
details.ajuda[open]>summary::after{content:" \25B4"}
details.ajuda>.txt{padding:0 12px 11px;font-size:12px;color:var(--muted);line-height:1.55}
details.ajuda>.txt b{color:var(--ink-2)}
/* ---------- o que nao gravou (C.3) ----------
   A linha (ou o campo) fica marcada e o "tentar de novo" nasce ali mesmo. */
.falhou{outline:2px solid var(--vermelho);outline-offset:-2px}
tr.falhou>td{background:#FBEAE7!important}
.btn-retry{display:block;margin-top:4px;font-family:var(--sans);font-size:11px;font-weight:800;cursor:pointer;
  border:1px solid var(--vermelho);background:var(--vermelho);color:#fff;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap}
.btn-retry:disabled{opacity:.6;cursor:default}
/* ---------- padroes compartilhados (B.10 e B.12) ---------- */
/* Foco de teclado sempre visivel — quem navega por Tab precisa ver onde esta. */
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}
/* A barra nunca estoura: quebra de linha e o contador some no celular. */
.barra{flex-wrap:wrap}
@media(max-width:560px){.barra .cnt{display:none}}

/* ---- quem é a pessoa (sócio / médico / função) ----
   Fica numa segunda linha, abaixo dos campos de contato, porque é informação de
   CADASTRO e não de acesso: quem abre esta tela quase sempre vem mexer em e-mail,
   telefone ou permissão. CRM e endereço só aparecem quando a resposta os torna
   possíveis — campo que não se aplica atrapalha mais do que ajuda. */
.perfil{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:8px;
  padding-top:8px;border-top:1px dashed var(--linha,#E4D9C9)}
.perfil .cp{min-width:140px}
.perfil .cp.larga{flex:1 1 240px}
.perfil .sn-falta{align-self:center;font-size:11px;color:#8A7D70}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="barra">
  <a class="logo" id="logo-home" href="colaborador.html" target="_self" title="Voltar para o painel do colaborador">back<span class="y">4you</span></a>
  <span class="tag">👥 Contatos · equipe</span>
  <span class="spacer"></span>
  <span class="save-status" id="saveStatus"></span>
  <span class="cnt" id="cnt"></span>
  <a class="volta" id="volta" href="colaborador.html" target="_self">← Painel</a>
</div>
<div id="app"><div class="state"><div class="spin"></div><p>Carregando contatos…</p></div></div>

<div class="modal" id="modal"><div class="modal-card">
  <h2 id="m-titulo">Novo contato</h2>
  <div class="fld">
    <label for="m-cli">Cliente</label>
    <input id="m-cli" list="dl-clientes" autocomplete="off" placeholder="Digite o ID ou o nome — ex.: 250033 · Padaria">
    <datalist id="dl-clientes"></datalist>
    <div class="hint" id="m-cli-hint"></div>
  </div>
  <div class="fld"><label for="m-nome">Nome</label><input id="m-nome" placeholder="Nome do contato"></div>
  <div class="fld"><label for="m-email">E-mail</label><input id="m-email" type="email" placeholder="email@exemplo.com"></div>
  <div class="fld"><label for="m-tel">Telefone / WhatsApp</label><input id="m-tel" placeholder="55DDD9…"></div>
  <div class="fld"><label for="m-papel">Papel</label><select id="m-papel"><option>Secundário</option><option>Principal</option></select></div>
  <div class="fld"><label>Áreas que esse contato enxerga</label>
    <div class="areas-linha" id="m-areas"></div></div>
  <div class="acoes-modal">
    <button class="btn btn--pri" id="m-add" type="button">Adicionar contato</button>
    <button class="btn btn--sec" id="m-cancelar" type="button">Cancelar</button>
    <span class="msg" id="m-msg"></span>
  </div>
</div></div>

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
/* A chave da equipe não é mais fixa: é o código do dia de cada colaborador
   (aba "Colaboradores" da planilha de Contatos), que chega por e-mail no
   index.html. Esta constante ficou vazia de propósito — se voltar a ter valor,
   volta a existir uma senha compartilhada que não expira e não diz quem é quem. */
const CHAVE_PADRAO = '';
const AREAS=[['fiscal','Fiscal'],['contabil','Contábil'],['pessoal','Pessoal'],['societario','Societário'],['equiparacao','Equiparação'],['financeiro','Financeiro']];
const MAX_CLI=400;          // teto de clientes desenhados de uma vez
const LIMITE_AUTO=25;       // até quantos clientes a busca abre sozinha

function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}

/* Sem chave na URL não há painel da equipe. A porta é o index.html: a pessoa
   digita o e-mail, recebe o código do dia e volta para CÁ — é para isso que
   serve o `destino`, senão todo login despejaria a pessoa na home da equipe,
   longe do que ela tinha clicado.
   Até 04/08/2026 existia uma chave fixa ('b4u-equipe-2026') escrita aqui como
   padrão: quem abrisse a página sem chave nenhuma entrava assim mesmo. */
if (!chaveAtual()) {
  location.replace('index.html?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}
/* o que vem depois do # é o CÓDIGO do colaborador — vai no log de auditoria */
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash
// (formato antigo dos atalhos por pessoa). Vira a coluna "Colaborador" da aba log.
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* ---------- busca que entende número com e sem pontuação (C.1) ---------- */
function soDigitos(s){return String(s==null?'':s).replace(/\D/g,'');}
/** Compara o texto normalizado e, quando o termo tem 6 dígitos ou mais, também
 *  só os dígitos dos dois lados — assim "12345678000190" acha "12.345.678/0001-90"
 *  e "5511998887777" acha "(11) 99888-7777". */
function casaBusca(alvoTxt,alvoDig,termo){
  const t=normTxt(termo);
  if(!t)return true;
  if(alvoTxt.indexOf(t)>=0)return true;
  const d=soDigitos(termo);
  return d.length>=6&&alvoDig.indexOf(d)>=0;
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
function jsonpAviso(txt){
  const p = document.getElementById('espera-txt')
       || document.querySelector('#app .state p')
       || document.querySelector('.state p');
  if(p) p.textContent = txt;
}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. Enquanto
   espera, a tela diz que ainda estamos buscando — erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    if(typeof pararEspera === 'function'){ try{ pararEspera(); }catch(_){} }
    jsonpAviso('Ainda estou buscando — tentando de novo…');
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
async function postAcao(obj){const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});const d=await r.json();if(d&&d.erro)throw new Error(d.erro);return d;}

/* ---------------- estado ---------------- */
let CONTATOS=[],CLIENTES=[],NOME={},GRUPOS=[];
let ABERTOS=new Set();
let FILTRO='todos';   // todos | sem_principal | sem_email | sem_tel | sem_contato
let AREA='';          // '' = todas
let TERMO='';
let MODAL_AREAS={};

/* ---------------- revelação progressiva ---------------- */
/* Filtros recolhidos, com memória. O contador ao lado do botão existe para
   evitar o único efeito colateral ruim de esconder filtro: a pessoa esquece que
   filtrou e acha que os dados sumiram. Por isso, com filtro ativo, o painel
   nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da lista. Dois botões de propósito: "mais 20" para quem lê, "todos" para
   quem vai usar Ctrl+F. Buscar ou filtrar volta o teto ao início — o resultado
   é outro, e continuar de onde parou confundiria. */
const PASSO = 20;
let TETO = PASSO;
function rodapeLista(mostrados, total){
  if(total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todos os ${total}</button>
  </div>`;
}

/* ---------------- agrupamento ---------------- */
function nomeCli(id){const n=NOME[String(id)];return n?n:'';}
function agrupar(){
  const map=new Map();
  CLIENTES.forEach(c=>map.set(String(c.id),{id:String(c.id),nome:c.nome||'',contatos:[],orfa:false}));
  CONTATOS.forEach(c=>{
    const id=String(c.cliente_id==null?'':c.cliente_id);
    if(!map.has(id))map.set(id,{id:id,nome:nomeCli(id),contatos:[],orfa:true});
    map.get(id).contatos.push(c);
  });
  GRUPOS=Array.from(map.values());
  GRUPOS.forEach(g=>g.contatos.sort((a,b)=>
    (a.papel==='Principal'?0:1)-(b.papel==='Principal'?0:1) ||
    normTxt(a.nome||a.email).localeCompare(normTxt(b.nome||b.email),'pt')));
  GRUPOS.sort((a,b)=>String(a.id).localeCompare(String(b.id),'pt',{numeric:true}));
}
function grupoDe(id){return GRUPOS.find(g=>g.id===String(id));}
function contatoDe(row){return CONTATOS.find(c=>String(c.row)===String(row));}

/* ---------------- sinais ---------------- */
function temPrincipal(g){return g.contatos.some(c=>c.papel==='Principal');}
function faltaPrincipal(g){return g.contatos.length>0&&!temPrincipal(g);}
function nSemEmail(g){return g.contatos.filter(c=>!String(c.email||'').trim()).length;}
function nSemTel(g){return g.contatos.filter(c=>!String(c.telefone||'').trim()).length;}

/* ---------------- filtros e busca ---------------- */
function passaArea(g){return !AREA||g.contatos.some(c=>c.areas&&c.areas[AREA]);}
function passaSit(g,f){
  const k=f==null?FILTRO:f;
  if(k==='sem_principal')return faltaPrincipal(g);
  if(k==='sem_email')return nSemEmail(g)>0;
  if(k==='sem_tel')return nSemTel(g)>0;
  if(k==='sem_contato')return g.contatos.length===0;
  if(k==='nunca_acessou')return g.contatos.some(c=>String(c.email||'').trim()&&nuncaAcessou(c));
  return true;
}
/* Último acesso do contato (aba "log de acessos" — Acessos.gs).
   Vem como 'dd/MM/aaaa HH:mm'. Sem registro = a pessoa nunca entrou no painel:
   é o sinal mais acionável desta tela, então vira selo vermelho. */
const hojeZero=(()=>{const d=new Date();d.setHours(0,0,0,0);return d;})();
function diasDesde(br){
  const m=String(br||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return null;
  return Math.round((hojeZero-new Date(+m[3],+m[2]-1,+m[1]))/864e5);
}
function nuncaAcessou(c){ return !String(c.ultimo_acesso||'').trim(); }
function seloAcesso(c){
  const q=String(c.ultimo_acesso||'').trim();
  if(!String(c.email||'').trim()) return '';          // sem e-mail nem faz sentido cobrar acesso
  if(!q) return '<span class="acs nunca" title="Este contato nunca entrou no painel">nunca acessou</span>';
  const d=diasDesde(q), via=String(c.acesso_via||'').trim();
  const cl=(d!=null&&d>90)?' antigo':'';
  const rot=(d===0)?'acessou hoje':(d===1?'acessou ontem':(d!=null?`há ${d} dias`:q));
  return `<span class="acs${cl}" title="Último acesso: ${esc(q)}${via?' · via '+esc(via):''}">${esc(rot)}</span>`;
}

function bateContato(c,t){
  if(!t)return false;
  return casaBusca(normTxt([c.nome,c.email,c.telefone].join(' ')),soDigitos(c.telefone),t);
}
function bateCliente(g,t){
  if(!t)return false;
  return casaBusca(normTxt(g.id+' '+g.nome),soDigitos(g.id),t);
}
function passaBusca(g,t){return !t||bateCliente(g,t)||g.contatos.some(c=>bateContato(c,t));}
/* t chega normalizado (normTxt) — casaBusca normaliza de novo sem efeito colateral,
   e os dígitos são os mesmos antes e depois da normalização. */
function visiveis(){const t=normTxt(TERMO);return GRUPOS.filter(g=>passaArea(g)&&passaSit(g)&&passaBusca(g,t));}

/* destaca o trecho encontrado sem quebrar acentos */
function hl(txt,t){
  const s=String(txt==null?'':txt);
  if(!t)return esc(s);
  let n='';const map=[];
  for(let i=0;i<s.length;i++){
    const c=s[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    for(let j=0;j<c.length;j++){n+=c[j];map.push(i);}
  }
  const i0=n.indexOf(t);
  if(i0<0)return esc(s);
  const a=map[i0],b=(i0+t.length<map.length?map[i0+t.length]:s.length);
  return esc(s.slice(0,a))+'<mark>'+esc(s.slice(a,b))+'</mark>'+esc(s.slice(b));
}

/* ---------------- HTML ---------------- */
function areasHTML(c){
  const pr=c.papel==='Principal';
  const chips=AREAS.map(a=>`<button type="button" class="achip${(pr||c.areas[a[0]])?' on':''}${pr?' trava':''}" data-a="${a[0]}"${pr?' disabled':''}>${a[1]}</button>`).join('');
  return `<span class="rot-a">Áreas</span>${chips}`+(pr?'<span class="nota">Principal enxerga todas as áreas</span>':'');
}
function btnRemover(c){return `<button class="btn btn--mini btn--danger-out" type="button" data-del="${esc(c.row)}">Remover</button>`;}
/* Três estados no SIM/NÃO: sim, não e "ninguém respondeu ainda".
   Vazio não é "não" — é pergunta em aberto, e é isso que deixa a tela poder
   cobrar depois sem acusar quem nunca foi perguntado. */
function triSel(v){ return v===true?'sim':(v===false?'nao':''); }
function perfilHTML(c){
  const p=c.perfil||{};
  const socio=triSel(p.socio), medico=triSel(p.medico);
  const tri=(k,rot,val)=>`<label class="cp"><span>${rot}</span><select class="in" data-p="${k}">
      <option value=""${val===''?' selected':''}>—</option>
      <option value="sim"${val==='sim'?' selected':''}>Sim</option>
      <option value="nao"${val==='nao'?' selected':''}>Não</option></select></label>`;
  return `<div class="perfil">
    ${tri('socio','Sócio?',socio)}
    ${tri('medico','Médico?',medico)}
    <label class="cp larga"><span>Função</span><input class="in" data-p="funcao" value="${esc(p.funcao||'')}"
      placeholder="sócio investidor, secretária, concierge…"></label>
    ${medico==='sim'?`<label class="cp"><span>CRM</span><input class="in" data-p="crm" value="${esc(p.crm||'')}" placeholder="CRM/UF 00000"></label>`:''}
    ${socio==='sim'?`<label class="cp larga"><span>Endereço pessoal</span><input class="in" data-p="endereco" value="${esc(p.endereco||'')}" placeholder="rua, nº, cidade"></label>`:''}
    ${(!p.funcao&&!socio&&!medico)?`<span class="sn-falta">sem informação de quem é a pessoa</span>`:''}
  </div>`;
}

function contatoHTML(c,t){
  const pr=c.papel==='Principal';
  const semMail=!String(c.email||'').trim(),semTel=!String(c.telefone||'').trim();
  return `<div class="ctt${bateContato(c,t)?' match':''}" data-row="${esc(c.row)}">
    <div class="campos">
      <label class="cp"><span>Nome</span><input class="in" data-k="nome" value="${esc(c.nome||'')}" placeholder="Nome do contato"></label>
      <label class="cp"><span>E-mail</span><input class="in${semMail?' falho':''}" data-k="email" type="email" value="${esc(c.email||'')}" placeholder="email@exemplo.com"></label>
      <label class="cp"><span>Telefone / WhatsApp</span><input class="in${semTel?' falho':''}" data-k="telefone" value="${esc(c.telefone||'')}" placeholder="55DDD9…"></label>
      <label class="cp"><span>Papel</span><select class="in" data-k="papel">
        <option${pr?' selected':''}>Principal</option><option${pr?'':' selected'}>Secundário</option></select></label>
    </div>
    ${perfilHTML(c)}
    <div class="areas-linha" data-areas>${areasHTML(c)}</div>
    <div class="rodape">
      ${c.codigo?`<span class="ro">código de hoje <b>${esc(c.codigo)}</b><button class="lk" type="button" data-copy="${esc(c.codigo)}">copiar</button></span>`:''}
      ${c.link?`<span class="ro">link de acesso <button class="lk" type="button" data-copy="${esc(c.link)}">copiar</button>
        <a class="lk" href="${esc(c.link)}" target="_blank" rel="noopener">abrir ↗</a></span>`:''}
      ${seloAcesso(c)}
      <span class="sp"></span>
      <span class="rm" data-rm>${btnRemover(c)}</span>
    </div>
  </div>`;
}
function cabecalhoHTML(g,t){
  const n=g.contatos.length;
  const sinais=[];
  if(n===0)sinais.push('<span class="sn cinza">sem contato</span>');
  else if(!temPrincipal(g))sinais.push('<span class="sn alerta">falta Principal</span>');
  const se=nSemEmail(g),st=nSemTel(g);
  if(se)sinais.push(`<span class="sn amb">${se} sem e-mail</span>`);
  if(st)sinais.push(`<span class="sn cinza">${st} sem telefone</span>`);
  if(g.orfa)sinais.push('<span class="sn cinza">fora do Site Links</span>');
  return `<span class="chev">${ABERTOS.has(g.id)?'▾':'▸'}</span>
    <span class="cid">${g.id?hl(g.id,t):'sem ID'}</span>
    <span class="cnome">${g.nome?hl(g.nome,t):'<i>sem nome no Site Links</i>'}</span>
    <span class="sinais">${sinais.join('')}</span>
    <span class="qtd">${n} ${n===1?'contato':'contatos'}</span>`;
}
function grupoHTML(g,t){
  const aberto=ABERTOS.has(g.id);
  const corpo=aberto?`<div class="cli-b">
      ${g.contatos.map(c=>contatoHTML(c,t)).join('')||'<div class="vazio">Nenhum contato cadastrado para este cliente.</div>'}
      <div class="add-linha">
        <button class="btn btn--mini btn--pri" type="button" data-add="${esc(g.id)}">+ Adicionar contato</button>
        <span class="dica-in">O que você digitar aqui grava direto na planilha.</span>
      </div></div>`:'';
  return `<div class="cli${aberto?' on':''}" data-cli="${esc(g.id)}">
    <button class="cli-h" type="button" data-toggle="${esc(g.id)}">${cabecalhoHTML(g,t)}</button>${corpo}</div>`;
}

/* ---------------- desenho ---------------- */
/* Quantos filtros estão pegando agora — vira o selo ao lado do botão Filtros (C.5).
   Só conta o que está ESCONDIDO no painel: a busca fica à vista na régua, e um
   selo dizendo "1 filtro" por causa dela faria a pessoa procurar o que não sumiu. */
function filtrosPainel(){
  return (FILTRO!=='todos'?1:0)+(AREA?1:0);
}
function limparFiltros(){
  FILTRO='todos';AREA='';TERMO='';TETO=PASSO;
  const b=document.getElementById('busca');if(b)b.value='';
  ABERTOS.clear();
  redesenhar();
}
function desenharChips(){
  const porArea=GRUPOS.filter(passaArea);
  const cSit=(k)=>porArea.filter(g=>passaSit(g,k)).length;
  const c=(k,rot,n,extra)=>`<button class="chip ${extra||''} ${FILTRO===k?'on':''}" data-f="${k}">${rot}<span class="n">${n}</span></button>`;
  document.getElementById('chipsSit').innerHTML=
    '<span class="rot">Situação</span>'+
    c('todos','Todos',cSit('todos'))+
    c('sem_principal','Sem contato Principal',cSit('sem_principal'),'alerta')+
    c('sem_email','Sem e-mail',cSit('sem_email'),'falta')+
    c('sem_tel','Sem telefone',cSit('sem_tel'))+
    c('sem_contato','Sem nenhum contato',cSit('sem_contato'))+
    c('nunca_acessou','Nunca acessou',cSit('nunca_acessou'),'alerta');

  const porSit=GRUPOS.filter(g=>passaSit(g));
  const nArea=k=>porSit.filter(g=>g.contatos.some(x=>x.areas&&x.areas[k])).length;
  /* O "Limpar filtros" agora é fixo no rodapé do painel (#btn-limpar) — não é
     mais um chip que aparece e some no meio dos outros treze. */
  document.getElementById('chipsArea').innerHTML=
    '<span class="rot">Área</span>'+
    `<button class="chip ${AREA===''?'on':''}" data-area="">Todas<span class="n">${porSit.length}</span></button>`+
    AREAS.map(a=>`<button class="chip ${AREA===a[0]?'on':''}" data-area="${a[0]}">${a[1]}<span class="n">${nArea(a[0])}</span></button>`).join('');
}
function desenharResumo(){
  const semP=GRUPOS.filter(faltaPrincipal);
  const semC=GRUPOS.filter(g=>g.contatos.length===0);
  const semE=[],semT=[];
  GRUPOS.forEach(g=>g.contatos.forEach(c=>{
    if(!String(c.email||'').trim())semE.push({g:g,c:c});
    if(!String(c.telefone||'').trim())semT.push({g:g,c:c});
  }));
  /* title= completa o que a coluna estreita ainda cortar: o nome do cliente é o
     único jeito de reconhecer a linha, não pode ficar em "…". */
  const itemCli=g=>`<div class="tk" data-goto="${esc(g.id)}" title="${esc(g.nome||'')}"><span class="d">${esc(g.id||'—')}</span>
    <span class="lb">${esc(g.nome||'(sem nome)')}</span><span class="tp">${g.contatos.length} ct</span></div>`;
  const itemCtt=x=>`<div class="tk" data-goto="${esc(x.g.id)}" title="${esc(x.g.nome||'')}"><span class="d">${esc(x.g.id||'—')}</span>
    <span class="lb">${esc(x.c.nome||x.c.email||'(sem nome)')}</span><span class="tp">${esc(x.g.nome||'')}</span></div>`;
  const card=(cls,titulo,lista,render)=>`<div class="rcard ${cls}">
    <div class="rhead"><span>${titulo}</span><span class="n">${lista.length}</span></div>
    <div class="rlista">${lista.length?lista.slice(0,80).map(render).join(''):'<div class="rvazio">Nada por aqui 🎉</div>'}</div></div>`;
  document.getElementById('resumo').innerHTML=
    card('semp','Clientes sem contato Principal',semP,itemCli)+
    card('semmail','Contatos sem e-mail',semE,itemCtt)+
    card('semtel','Contatos sem telefone',semT,itemCtt)+
    card('semct','Clientes sem nenhum contato',semC,itemCli);
}
function desenharLista(){
  const t=normTxt(TERMO);
  const arr=visiveis();
  const total=Math.min(arr.length,MAX_CLI);     // MAX_CLI segue como trava dura de desenho
  const n=Math.min(TETO,total);
  const corte=arr.slice(0,n);
  document.getElementById('lista').innerHTML=
    (corte.map(g=>grupoHTML(g,t)).join('')||'<div class="vazio">Nenhum cliente com esse filtro ou busca.</div>')+
    rodapeLista(n,total);
  /* A contagem completa vive na régua (#resumo-lista); aqui fica só o quanto da
     lista está desenhado e o que a pessoa precisa saber antes de clicar. */
  document.getElementById('dica').innerHTML=
    (total>n?`Mostrando <b>${n} de ${arr.length}</b>. `:'')+
    (arr.length>MAX_CLI?`Desenho no máximo ${MAX_CLI} — refine a busca. `:'')+
    'Clique no cliente para abrir. Código e link são fórmulas da planilha: dá para copiar, não para editar.';
  desenharContagem();
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
}
/* A contagem em texto é o que permite recolher chips e cartões sem esconder
   pendência: os números continuam na primeira linha da tela, filtrada ou não. */
function desenharResumoLista(){
  const el=document.getElementById('resumo-lista');if(!el)return;
  const vis=visiveis().length;
  const semP=GRUPOS.filter(faltaPrincipal).length;
  const semE=CONTATOS.filter(c=>!String(c.email||'').trim()).length;
  const p=[(vis===GRUPOS.length?String(GRUPOS.length):vis+' de '+GRUPOS.length)+' clientes',
           CONTATOS.length+' contatos'];
  if(semP)p.push(semP+' sem contato principal');
  if(semE)p.push(semE+' sem e-mail');
  el.textContent=p.join(' · ');
}
function atualizarCabecalho(id){
  const g=grupoDe(id);if(!g)return;
  const el=document.querySelector('.cli[data-cli="'+CSS.escape(String(id))+'"] .cli-h');
  if(el)el.innerHTML=cabecalhoHTML(g,normTxt(TERMO));
}
/* Contador do topo com os MESMOS números da dica de baixo: "X de Y" (C.5).
   Fica separado de propósito: depois de salvar atualizamos só ele, sem redesenhar
   a lista (redesenhar tiraria o foco de quem está digitando). */
function desenharContagem(){
  const arr=visiveis();
  const nCt=arr.reduce((s,g)=>s+g.contatos.length,0);
  document.getElementById('cnt').textContent=
    arr.length+' de '+GRUPOS.length+' clientes · '+nCt+' de '+CONTATOS.length+' contatos';
}
function redesenhar(){
  desenharChips();desenharResumo();desenharLista();desenharResumoLista();
  if(FILTROS_UI)FILTROS_UI.atualizarContador();
  sincronizarURL();
}
/* ---------- busca e filtros no endereço (C.10) ----------
   F5 volta para a mesma visão; chave, cod e #hash ficam intactos. */
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    set('q',TERMO);
    set('f',FILTRO==='todos'?'':FILTRO);
    set('area',AREA);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  FILTRO=p.get('f')||'todos';
  AREA=p.get('area')||'';
  TERMO=p.get('q')||'';
}

/* ---------------- salvar (auto, com debounce) ---------------- */
const SUJOS=new Map();   // row -> timer
/* ---------- falhas de gravação (C.3) ----------
   FALHAS = o servidor recusou e o dado só existe na tela. O contato fica marcado
   com um "tentar de novo" no rodapé dele, e fechar a aba pede confirmação. */
const FALHAS=new Set();
function temPendencia(){return SUJOS.size>0||FALHAS.size>0;}
function marcarFalha(row,falhou){
  const cx=document.querySelector('.ctt[data-row="'+CSS.escape(String(row))+'"]');
  if(!cx)return;
  cx.classList.toggle('falhou',!!falhou);
  const rod=cx.querySelector('.rodape');if(!rod)return;
  const antigo=rod.querySelector('.btn-retry');
  if(falhou&&!antigo)rod.insertAdjacentHTML('afterbegin',
    '<button type="button" class="btn-retry" data-retry="'+esc(String(row))+'">não salvou — tentar de novo</button>');
  if(!falhou&&antigo)antigo.remove();
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
window.addEventListener('beforeunload',e=>{if(temPendencia()){e.preventDefault();e.returnValue='';}});
function setSave(cl,txt){const el=document.getElementById('saveStatus');el.className='save-status '+(cl||'');el.textContent=txt||'';}
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function areasSel(c){return AREAS.filter(a=>c.areas[a[0]]).map(a=>a[0]);}
function agendarSalvar(row,ms){
  const c=contatoDe(row);if(!c)return;
  if(!String(c.nome||'').trim()&&!String(c.email||'').trim()){
    clearTimeout(SUJOS.get(String(row)));SUJOS.delete(String(row));
    setSave('err','Não salvou: informe ao menos nome ou e-mail.');return;
  }
  clearTimeout(SUJOS.get(String(row)));
  SUJOS.set(String(row),setTimeout(()=>salvarContato(row),ms==null?700:ms));
  setSave('saving','Salvando…');
}
/* O perfil vive no mesmo objeto do contato. Trocar "Médico?" para Sim precisa
   redesenhar a linha (o campo de CRM passa a existir), e por isso este caminho é
   separado do dos outros campos. */
function aplicarPerfil(el){
  const box=el.closest('.ctt'); if(!box) return null;
  const c=contatoDe(box.dataset.row); if(!c) return null;
  c.perfil=c.perfil||{};
  const k=el.dataset.p;
  c.perfil[k]= (k==='socio'||k==='medico') ? (el.value===''?null:el.value==='sim') : el.value;
  if(k==='socio'||k==='medico'){
    if(c.perfil.medico!==true) c.perfil.crm='';
    if(c.perfil.socio!==true)  c.perfil.endereco='';
    const alvo=box.querySelector('.perfil');
    if(alvo) alvo.outerHTML=perfilHTML(c);
  }
  return c;
}
function perfilDe(c){
  const p=c.perfil||{};
  return { socio:p.socio, medico:p.medico, funcao:p.funcao||'',
           crm:p.crm||'', endereco:p.endereco||'' };
}

async function salvarContato(row){
  const k=String(row);
  clearTimeout(SUJOS.get(k));SUJOS.delete(k);
  const c=contatoDe(row);if(!c)return;
  const nome=String(c.nome||'').trim(),email=String(c.email||'').trim();
  if(!nome&&!email){setSave('err','Não salvou: informe ao menos nome ou e-mail.');return;}
  try{
    setSave('saving','Salvando…');
    await postAcao({
      acao:'contato_salvar',row:c.row,cliente_id:c.cliente_id,
      nome:nome,email:email,telefone:String(c.telefone||'').trim(),
      papel:c.papel,areas:areasSel(c),perfil:perfilDe(c),email_atual:c._email0||'',
      cliente:nomeCli(c.cliente_id),cod:respAtual()
    });
    c._email0=email;                       // a linha agora é este e-mail
    FALHAS.delete(k);marcarFalha(k,false);
    setSave('ok','Salvo ✓ '+horaAgora());
    atualizarCabecalho(c.cliente_id);desenharChips();desenharResumo();desenharContagem();desenharResumoLista();
  }catch(e){
    FALHAS.add(k);marcarFalha(k,true);
    setSave('err','Não salvou: '+(e.message||e));
  }
}
async function flushPendentes(){
  const rows=Array.from(SUJOS.keys());
  for(const r of rows){await salvarContato(r);}
}

/* ---------------- adicionar / remover ---------------- */
function preencherDatalist(){
  document.getElementById('dl-clientes').innerHTML=
    CLIENTES.map(c=>`<option value="${esc(c.id+' · '+(c.nome||''))}"></option>`).join('');
}
function resolverCliente(txt){
  const s=String(txt||'').trim();
  if(!s)return '';
  const idPart=s.split('·')[0].trim();
  if(Object.prototype.hasOwnProperty.call(NOME,idPart))return idPart;
  if(Object.prototype.hasOwnProperty.call(NOME,s))return s;
  const n=normTxt(s);
  const exato=CLIENTES.filter(c=>normTxt(c.id+' · '+c.nome)===n||normTxt(c.nome)===n);
  if(exato.length===1)return String(exato[0].id);
  const parcial=CLIENTES.filter(c=>normTxt(c.id+' '+c.nome).includes(n));
  if(parcial.length===1)return String(parcial[0].id);
  return '';
}
function validarCliModal(){
  const el=document.getElementById('m-cli'),h=document.getElementById('m-cli-hint');
  const id=resolverCliente(el.value);
  if(!el.value.trim()){h.className='hint';h.textContent='Comece a digitar o ID ou o nome.';return '';}
  if(id){h.className='hint ok';h.textContent='✓ '+id+(nomeCli(id)?' · '+nomeCli(id):'');}
  else{h.className='hint err';h.textContent='Não achei esse cliente — escolha um da lista.';}
  return id;
}
function pintarAreasModal(){
  const pr=document.getElementById('m-papel').value==='Principal';
  document.getElementById('m-areas').innerHTML=
    AREAS.map(a=>`<button type="button" class="achip${(pr||MODAL_AREAS[a[0]])?' on':''}${pr?' trava':''}" data-ma="${a[0]}"${pr?' disabled':''}>${a[1]}</button>`).join('')+
    (pr?'<span class="nota">Principal enxerga todas as áreas</span>':'');
}
function abrirModal(idCliente){
  MODAL_AREAS={};
  const cli=document.getElementById('m-cli');
  cli.value=idCliente?(idCliente+(nomeCli(idCliente)?' · '+nomeCli(idCliente):'')):'';
  cli.readOnly=!!idCliente;
  document.getElementById('m-titulo').textContent=idCliente?('Novo contato · '+idCliente+(nomeCli(idCliente)?' · '+nomeCli(idCliente):'')):'Novo contato';
  ['m-nome','m-email','m-tel'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('m-papel').value='Secundário';
  document.getElementById('m-msg').textContent='';
  validarCliModal();
  pintarAreasModal();
  document.getElementById('modal').classList.add('on');
  setTimeout(()=>document.getElementById(idCliente?'m-nome':'m-cli').focus(),40);
}
function fecharModal(){document.getElementById('modal').classList.remove('on');}
async function adicionarContato(btn){
  const msg=document.getElementById('m-msg');
  const id=validarCliModal();
  if(!id){msg.className='msg err';msg.textContent='Escolha o cliente.';return;}
  const nome=document.getElementById('m-nome').value.trim();
  const email=document.getElementById('m-email').value.trim();
  if(!nome&&!email){msg.className='msg err';msg.textContent='Informe ao menos nome ou e-mail.';return;}
  const papel=document.getElementById('m-papel').value;
  const areas=papel==='Principal'?AREAS.map(a=>a[0]):AREAS.filter(a=>MODAL_AREAS[a[0]]).map(a=>a[0]);
  btn.disabled=true;msg.className='msg';msg.textContent='Salvando…';
  try{
    await flushPendentes();
    await postAcao({
      acao:'contato_salvar',cliente_id:id,nome:nome,email:email,
      telefone:document.getElementById('m-tel').value.trim(),
      papel:papel,areas:areas,
      perfil:{ socio:null, medico:null, funcao:'', crm:'', endereco:'' },
      cliente:nomeCli(id),cod:respAtual()
    });
    fecharModal();
    ABERTOS.add(String(id));
    setSave('ok','Contato adicionado ✓ '+horaAgora());
    await carregar(false);
    irPara(id);
  }catch(e){msg.className='msg err';msg.textContent=e.message||e;}
  finally{btn.disabled=false;}
}
function pedirConfirmacao(row){
  const c=contatoDe(row);if(!c)return;
  const box=document.querySelector('.ctt[data-row="'+CSS.escape(String(row))+'"] [data-rm]');
  if(!box)return;
  const quem=c.nome||c.email||'este contato';
  box.innerHTML=`<span class="conf">Remover ${esc(quem)}?</span>
    <button class="btn btn--mini btn--danger" type="button" data-delok="${esc(row)}">Sim, remover</button>
    <button class="btn btn--mini" type="button" data-delno="${esc(row)}">Cancelar</button>`;
}
function cancelarConfirmacao(row){
  const c=contatoDe(row);if(!c)return;
  const box=document.querySelector('.ctt[data-row="'+CSS.escape(String(row))+'"] [data-rm]');
  if(box)box.innerHTML=btnRemover(c);
}
async function removerContato(row){
  const c=contatoDe(row);if(!c)return;
  const box=document.querySelector('.ctt[data-row="'+CSS.escape(String(row))+'"] [data-rm]');
  if(box)box.innerHTML='<span class="conf">Removendo…</span>';
  const id=c.cliente_id;
  try{
    await flushPendentes();
    await postAcao({acao:'contato_remover',row:c.row,email:c.email,cliente:nomeCli(id),cod:respAtual()});
    setSave('ok','Contato removido ✓ '+horaAgora());
    await carregar(false);   // as linhas de todo mundo mudam: recarrega tudo
  }catch(e){
    setSave('err','Não removi: '+(e.message||e));
    if(box)box.innerHTML=btnRemover(c);
  }
}

/* ---------------- navegação ---------------- */
function irPara(id){
  const alvo=String(id);
  const achar=()=>document.querySelector('.cli[data-cli="'+CSS.escape(alvo)+'"]');
  ABERTOS.add(alvo);
  if(!achar()||!visiveis().some(g=>g.id===alvo)){
    FILTRO='todos';AREA='';TERMO='';
    const b=document.getElementById('busca');if(b)b.value='';
  }
  /* O teto não pode esconder justamente o cliente para onde estamos indo. */
  const pos=visiveis().findIndex(g=>g.id===alvo);
  if(pos>=TETO)TETO=Math.ceil((pos+1)/PASSO)*PASSO;
  redesenhar();
  const el=achar();if(!el)return;
  el.scrollIntoView({block:'center',behavior:'smooth'});
  el.classList.add('destaque');setTimeout(()=>el.classList.remove('destaque'),2600);
}
function aplicarBusca(){
  const t=normTxt(TERMO);
  TETO=PASSO;            // resultado novo, teto novo
  ABERTOS.clear();
  if(t){
    const arr=visiveis();
    if(arr.length<=LIMITE_AUTO)arr.forEach(g=>ABERTOS.add(g.id));
  }
  redesenhar();
}

/* ---------------- eventos ---------------- */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='busca'){TERMO=el.value;aplicarBusca();return;}
  if(el.id==='m-cli'){validarCliModal();return;}
  if(el.dataset&&el.dataset.p){ const c=aplicarPerfil(el); if(c) agendarSalvar(c.row); return; }
  if(!el.dataset||!el.dataset.k||el.dataset.k==='papel')return;
  const ctt=el.closest('.ctt');if(!ctt)return;
  const c=contatoDe(ctt.dataset.row);if(!c)return;
  c[el.dataset.k]=el.value;
  el.classList.toggle('falho',(el.dataset.k==='email'||el.dataset.k==='telefone')&&!el.value.trim());
  agendarSalvar(c.row);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='m-papel'){pintarAreasModal();return;}
  if(el.dataset&&el.dataset.p){ const c=aplicarPerfil(el); if(c) agendarSalvar(c.row,150); return; }
  if(!el.dataset||!el.dataset.k)return;
  const ctt=el.closest('.ctt');if(!ctt)return;
  const c=contatoDe(ctt.dataset.row);if(!c)return;
  if(el.dataset.k==='papel'){
    trocarPapel(c,el.value);
    const box=ctt.querySelector('[data-areas]');if(box)box.innerHTML=areasHTML(c);
  }else{
    c[el.dataset.k]=el.value;
  }
  agendarSalvar(c.row,150);   // saiu do campo: grava logo
});
function trocarPapel(c,novo){
  if(novo==='Principal'){
    if(c.papel!=='Principal')c._prev=Object.assign({},c.areas);
    c.papel='Principal';
    AREAS.forEach(a=>c.areas[a[0]]=true);
  }else{
    c.papel='Secundário';
    if(c._prev){AREAS.forEach(a=>c.areas[a[0]]=!!c._prev[a[0]]);c._prev=null;}
  }
}
document.addEventListener('click',e=>{
  const rt=e.target.closest('[data-retry]');
  if(rt){rt.textContent='enviando…';rt.disabled=true;salvarContato(rt.dataset.retry);return;}
  const cp=e.target.closest('[data-copy]');
  if(cp){copiar(cp.dataset.copy,cp);return;}
  const ac=e.target.closest('.achip[data-a]');
  if(ac&&!ac.disabled){
    const ctt=ac.closest('.ctt');const c=contatoDe(ctt.dataset.row);if(!c)return;
    const k=ac.dataset.a;
    c.areas[k]=!c.areas[k];
    ac.classList.toggle('on',!!c.areas[k]);
    agendarSalvar(c.row,400);
    return;
  }
  const ma=e.target.closest('.achip[data-ma]');
  if(ma&&!ma.disabled){
    const k=ma.dataset.ma;MODAL_AREAS[k]=!MODAL_AREAS[k];
    ma.classList.toggle('on',!!MODAL_AREAS[k]);return;
  }
  const tg=e.target.closest('[data-toggle]');
  if(tg){
    const id=tg.dataset.toggle;
    if(ABERTOS.has(id))ABERTOS.delete(id);else ABERTOS.add(id);
    const g=grupoDe(id),el=tg.closest('.cli');
    if(g&&el){el.outerHTML=grupoHTML(g,normTxt(TERMO));FALHAS.forEach(k=>marcarFalha(k,true));}
    else desenharLista();
    return;
  }
  const ad=e.target.closest('[data-add]');
  if(ad){abrirModal(ad.dataset.add);return;}
  const dl=e.target.closest('[data-del]');
  if(dl){pedirConfirmacao(dl.dataset.del);return;}
  const ok=e.target.closest('[data-delok]');
  if(ok){removerContato(ok.dataset.delok);return;}
  const no=e.target.closest('[data-delno]');
  if(no){cancelarConfirmacao(no.dataset.delno);return;}
  const cf=e.target.closest('.chip[data-f]');
  if(cf){FILTRO=cf.dataset.f;TETO=PASSO;redesenhar();return;}
  const ca=e.target.closest('.chip[data-area]');
  if(ca){AREA=ca.dataset.area;TETO=PASSO;redesenhar();return;}
  if(e.target.closest('#btn-limpar')){limparFiltros();return;}
  if(e.target.closest('.btn-mais')){TETO+=PASSO;desenharLista();return;}
  if(e.target.closest('.btn-todos')){TETO=MAX_CLI;desenharLista();return;}
  const tk=e.target.closest('.tk[data-goto]');
  if(tk){irPara(tk.dataset.goto);return;}
  if(e.target.closest('#novo')){abrirModal('');return;}
  /* "Abrir todos" só abre o que está desenhado: com 114 fichas na tela ele deixa
     de ser atalho e vira armadilha — quem quer tudo primeiro pede "mostrar todos". */
  if(e.target.closest('#abrirTodos')){
    document.querySelectorAll('#lista .cli[data-cli]').forEach(el=>ABERTOS.add(el.dataset.cli));
    desenharLista();return;
  }
  if(e.target.closest('#fecharTodos')){ABERTOS.clear();desenharLista();return;}
  if(e.target.id==='m-add'){adicionarContato(e.target);return;}
  if(e.target.id==='m-cancelar'||e.target.id==='modal'){fecharModal();return;}
});
/* Atalhos de busca (C.4): "/" foca, Esc limpa. Com o modal aberto, Esc fecha o
   modal — e o atalho não atrapalha quem já está digitando noutro campo. */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('modal').classList.contains('on')){fecharModal();return;}
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';TERMO='';aplicarBusca();}
});

/* ---------------- copiar ---------------- */
function copiar(txt,btn){
  const original=btn.textContent;
  const feito=()=>{btn.textContent='copiado ✓';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent=original;btn.classList.remove('ok');},1400);};
  const manual=()=>{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');feito();}catch(err){btn.textContent='copie manualmente';}
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(feito).catch(manual);
  else manual();
}

async function carregar(primeira){
  try{
    const d=await jsonp(API_URL+'?tipo=contatos_equipe&chave='+encodeURIComponent(chaveAtual()));
    if(d&&d.erro)throw new Error(d.erro);
    CONTATOS=(d.contatos||[]).map(c=>Object.assign(
      {nome:'',email:'',telefone:'',papel:'Secundário',codigo:'',link:'',ultimo_acesso:'',acesso_via:''},c,
      {cliente_id:String(c.cliente_id==null?'':c.cliente_id),areas:Object.assign({},c.areas||{}),
       // e-mail como estava na planilha quando carregamos: o backend usa isso para
       // conferir que a linha ainda é este contato antes de gravar (linhas sobem
       // quando alguém remove um contato noutra aba do navegador).
       _email0:String(c.email==null?'':c.email).trim()}));
    CLIENTES=(d.clientes||[]).map(c=>({id:String(c.id),nome:String(c.nome||'')}));
    NOME={};CLIENTES.forEach(c=>NOME[c.id]=c.nome);
    agrupar();
    if(primeira){
      lerURL();document.getElementById('app').innerHTML=layout();   // a visão vem do endereço (C.10)
      FILTROS_UI=ligarFiltros('contatos-equipe',filtrosPainel);     // depois do layout: o painel já existe
    }
    preencherDatalist();
    if(primeira&&TERMO)aplicarBusca();else redesenhar();
  }catch(e){
    if(primeira){
      document.getElementById('app').innerHTML=`<div class="state"><h1>Não consegui carregar</h1>
        <p>${esc(e.message||e)}</p>
        <p>Confira a <code>chave</code> no endereço e se o Web App foi republicado com <code>EquipeContatos.gs</code>.</p></div>`;
    }else{
      setSave('err','Não consegui recarregar: '+(e.message||e));
    }
  }
}
document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());
carregar(true);

<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador.html') {
        try { href = 'colaborador.html?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador.html'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
