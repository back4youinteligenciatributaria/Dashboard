<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
/* A chave da equipe não é mais fixa: é o código do dia de cada colaborador
   (aba "Colaboradores" da planilha de Contatos), que chega por e-mail no
   index.html. Esta constante ficou vazia de propósito — se voltar a ter valor,
   volta a existir uma senha compartilhada que não expira e não diz quem é quem. */
const CHAVE_PADRAO = '';
const AREAS=[['fiscal','Fiscal'],['contabil','Contábil'],['pessoal','Pessoal'],['societario','Societário'],['equiparacao','Equiparação'],['financeiro','Financeiro']];
const MAX_CLI=400;          // teto de clientes desenhados de uma vez
const LIMITE_AUTO=25;       // até quantos clientes a busca abre sozinha

function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');return q?q.trim():CHAVE_PADRAO;}

/* Sem chave na URL não há painel da equipe. A porta é o index.html: a pessoa
   digita o e-mail, recebe o código do dia e volta para CÁ — é para isso que
   serve o `destino`, senão todo login despejaria a pessoa na home da equipe,
   longe do que ela tinha clicado.
   Até 04/08/2026 existia uma chave fixa antiga escrita aqui como padrão: quem
   abrisse a página sem chave nenhuma entrava assim mesmo, sem se identificar.
   A string não se repete neste arquivo de propósito — ele é servido ao
   navegador, e comentário vaza igual a código. */
if (!chaveAtual()) {
  location.replace('index?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}
/* o que vem depois do # é o CÓDIGO do colaborador — vai no log de auditoria */
// Código do colaborador: aceita ?cod= (vindo do painel) e também o #hash
// (formato antigo dos atalhos por pessoa). Vira a coluna "Colaborador" da aba log.
function respAtual(){const q=(new URLSearchParams(location.search).get('cod')||'').trim();if(q)return q;try{return decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();}catch(e){return (location.hash||'').replace(/^#/,'').trim();}}
function esc(s){return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* ---------- busca que entende número com e sem pontuação (C.1) ---------- */
function soDigitos(s){return b4uDigitos(s);}
/** Compara o texto normalizado e, quando o termo tem 6 dígitos ou mais, também
 *  só os dígitos dos dois lados — assim "12345678000190" acha "12.345.678/0001-90"
 *  e "5511998887777" acha "(11) 99888-7777". */
function casaBusca(alvoTxt,alvoDig,termo){
  const t=normTxt(termo);
  if(!t)return true;
  if(alvoTxt.indexOf(t)>=0)return true;
  const d=soDigitos(termo);
  return d.length>=6&&alvoDig.indexOf(d)>=0;
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Vazia de propósito. Ela existia só para trocar o texto da espera por frases que
   falavam em lentidão e em nova tentativa — quem lia aquilo entendia "vai dar
   errado" e recarregava a página bem quando a resposta já vinha chegando. Quem
   cuida do que a pessoa lê enquanto espera agora é o b4u-espera.js. A função fica
   no lugar porque é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
   de espera continua correndo por cima durante a segunda tentativa — de propósito:
   a pessoa não precisa saber que houve retentativa, só que ainda estamos
   trabalhando. Erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
/* O JSONP sempre teve teto; este POST não tinha nenhum. Uma resposta perdida
   deixava a promise pendurada para sempre: "Salvando…" eterno na faixa e o aviso
   de "sair sem salvar" pedindo confirmação até o F5. Agora há prazo — e, mais
   importante, quem estoura o prazo sabe QUE TIPO de silêncio foi. */
async function postAcao(obj,ms){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),ms||45000);
  try{
    /* O `JSON.stringify` mora DENTRO do try: fora dele, um valor circular ou um
       getter que estoura sairia sem marca nenhuma — nem `doServidor` nem
       `incerto` — e quem lê a exceção lá na frente não teria como saber que ela
       nunca chegou a virar requisição. */
    const body=JSON.stringify(Object.assign({chave:chaveAtual()},obj));
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ctl.signal});
    const d=await r.json();
    /* Erro que o SERVIDOR mandou: ele processou, decidiu e recusou. É o único
       caso em que dá para garantir que não gravou. */
    if(d&&d.erro){ const err=new Error(d.erro); err.doServidor=true; throw err; }
    return d;
  }catch(e){
    /* ---------- "não salvou" é uma AFIRMAÇÃO, e o front não tem como fazê-la ----------
       O servidor GRAVA e só depois responde. Quando a resposta se perde, a
       gravação já aconteceu — e há quatro jeitos de isso ocorrer: o prazo
       estourar, o `r.json()` topar com uma página HTML (cota, tela de
       autorização), o 302 do /exec para o googleusercontent falhar, ou a aba ser
       suspensa com a requisição em voo.
       Em todos, a planilha está certa e a tela dizia "Não foi possível salvar".
       A equipe aprendeu a desconfiar do painel por causa disso.
       Agora a exceção carrega `.incerto`: só o erro VINDO DO SERVIDOR é falha de
       verdade; o resto é silêncio, e silêncio não é resposta. */
    if(e&&e.name==='AbortError'){ const x=new Error('A resposta demorou.'); x.incerto=true; throw x; }
    if(e&&e.doServidor) throw e;
    const x=new Error(String((e&&e.message)||e)); x.incerto=true; throw x;
  }finally{ clearTimeout(t); }
}

/* ---------------- releitura de confirmação ----------------
   `incerto` quer dizer "não sei", e "não sei" é o pior recado que um painel pode
   dar a quem acabou de digitar. Só existe um jeito de saber: PERGUNTAR DE NOVO.
   E perguntar é uma LEITURA — não repete a gravação e não cria contato nenhum.
   Por isso ela pode rodar sozinha, sem pedir licença.

   Vale só para o contato QUE JÁ EXISTE, achado pela `row`. Contato novo não tem
   row para reler, e remoção não tem valor para comparar: os dois continuam com o
   aviso de recarregar, que é o conselho certo para rota que cria e para rota que
   apaga.

   O que se compara: nome, e-mail, telefone, papel e as áreas. Telefone entra por
   DÍGITOS — a planilha guarda o que quiser de parênteses e traço, e cobrar a
   pontuação faria uma gravação inteira e correta ser anunciada como perdida.
   Perfil fica de fora: é objeto aninhado (médico, sócio, CRM, endereço), e o que
   o servidor devolve ali não tem forma garantida. Um campo a menos na conferência
   custa uma dúvida; um campo comparado errado custa um "não gravou" mentiroso.

   Nada do que volta é pintado. A ficha continua exatamente como está: quem está
   digitando não pode ver o próprio texto ser trocado por causa de uma conferência
   que ele não pediu e não vê acontecer.

   Não existe rota de leitura por linha — esta página tem uma leitura só, a de
   bloco. `relerContato` é o ponto único onde isso está escrito: no dia em que o
   backend ganhar um `tipo=contato_linha&row=`, muda esta função e mais nada. */
const CONF_ESPERA=3000;   // o servidor grava DENTRO do lock: perguntar antes de ele soltar devolve o valor velho
/* Teto da conferência. O `jsonp()` desta página tem prazo de 45 s e AINDA repete
   uma vez depois de 4 s de pausa: no pior caso a pergunta levaria mais de um
   minuto e meio, com a faixa dizendo "conferindo se gravou…" o tempo todo. Passou
   de 25 s, a conferência desiste e vira dúvida — que é a resposta honesta, e é o
   mesmo que ela diria depois de esperar mais um minuto. */
const CONF_TETO=25000;
function comTeto(p,ms){return Promise.race([p,new Promise((_,f)=>setTimeout(()=>f(new Error('a conferência demorou')),ms))]);}
let CONF_N=0;                 // numera as gravações
const CONF_SEQ=new Map();     // row → número da última gravação disparada neste contato
function esperaMs(ms){return new Promise(r=>setTimeout(r,ms));}
async function relerContato(row){
  const d=await jsonp(API_URL+'?tipo=contatos_equipe&chave='+encodeURIComponent(chaveAtual()));
  if(!d||d.erro) throw new Error(String((d&&d.erro)||'releitura vazia'));
  const c=(d.contatos||[]).find(x=>String(x.row)===String(row));
  if(!c) throw new Error('contato não encontrado na releitura');
  return c;
}
/* A `row` NÃO é identidade estável. Quando alguém remove um contato noutra aba,
   todas as linhas abaixo sobem — é por isso que a própria gravação manda
   `email_atual`, para o backend conferir que a linha ainda é este contato.
   A releitura precisa da mesma desconfiança: sem ela, a conferência leria OUTRA
   pessoa naquela row, veria tudo diferente e anunciaria "não gravou — pode mandar
   de novo" com base em uma linha que não é a nossa. Identidade duvidosa vira
   dúvida, não veredicto. */
function mesmaLinha(c,ref,mandado){
  if(String(c.cliente_id||'')!==String(ref.cliente_id||'')) return false;
  const e=String(c.email||'').trim().toLowerCase();
  const antes=String(ref._email0||'').trim().toLowerCase();
  const agora=String(mandado.email||'').trim().toLowerCase();
  /* Depois da gravação o e-mail da linha é o novo; antes dela, o antigo. Qualquer
     um dos dois confirma que é a mesma pessoa. */
  if(e&&(e===agora||e===antes)) return true;
  /* Linha SEM e-mail. Dois jeitos de chegar aqui, e os dois são a mesma pessoa:
     o contato nunca teve e-mail, ou esta gravação acabou de APAGAR o que ele
     tinha — e foi este segundo caso que, sem esta linha, condenava toda gravação
     que limpa o e-mail a virar dúvida eterna, com selo, pendência presa e aviso de
     "sair sem gravar" grudado até o F5, numa gravação que deu certo. */
  if(!e&&(!agora||!antes)) return String(c.nome||'').trim()===String(mandado.nome||'').trim();
  return false;
}
/* 'bateu' | 'nao-bateu' | 'nao-sei'.
   NUNCA devolve 'bateu' por falta de informação: releitura que falhou é dúvida,
   não é confirmação. Um "Salvo ✓" errado custa mais caro que a dúvida. */
async function conferirGravacao(ref,mandado){
  try{
    await esperaMs(CONF_ESPERA);
    const c=await comTeto(relerContato(ref.row),CONF_TETO);
    if(!mesmaLinha(c,ref,mandado)) return 'nao-sei';   // a row já é de outra pessoa: nada aqui prova nada
    const txt=v=>String(v==null?'':v).trim();
    if(txt(c.nome)!==txt(mandado.nome)) return 'nao-bateu';
    if(txt(c.email).toLowerCase()!==txt(mandado.email).toLowerCase()) return 'nao-bateu';
    if(b4uDigitos(txt(c.telefone))!==b4uDigitos(txt(mandado.telefone))) return 'nao-bateu';
    if(txt(c.papel)!==txt(mandado.papel)) return 'nao-bateu';
    const la=AREAS.filter(a=>(c.areas||{})[a[0]]).map(a=>a[0]).join(',');
    if(la!==(mandado.areas||[]).join(',')) return 'nao-bateu';
    return 'bateu';
  }catch(_){ return 'nao-sei'; }
}

/* ---------------- estado ---------------- */
let CONTATOS=[],CLIENTES=[],NOME={},GRUPOS=[];
let ABERTOS=new Set();
let FILTRO='todos';   // todos | sem_principal | sem_email | sem_tel | sem_contato
let AREA='';          // '' = todas
let TERMO='';
/* Ordenação da lista. 'cliente' é o padrão e reproduz a ordem de sempre: os
   cartões por ID e, dentro deles, Principal primeiro e depois por nome. */
let SORT={key:'cliente',dir:'asc'};
let MODAL_AREAS={};
/* Perfil do contato NOVO ("quem é a pessoa"), no mesmo formato que o backend
   grava: socio/medico em três estados (true, false e null = ninguém respondeu) e
   os quatro de texto. Vive fora do DOM porque o bloco se redesenha quando a
   resposta muda — o CRM, o endereço e a qualificação nascem e somem com ela. */
let MODAL_PERFIL={socio:null,medico:null,funcao:'',crm:'',endereco:'',qualificacao:''};

/* ---------------- revelação progressiva ---------------- */
/* Filtros recolhidos, com memória. O contador ao lado do botão existe para
   evitar o único efeito colateral ruim de esconder filtro: a pessoa esquece que
   filtrou e acha que os dados sumiram. Por isso, com filtro ativo, o painel
   nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da lista. Dois botões de propósito: "mais 20" para quem lê, "todos" para
   quem vai usar Ctrl+F. Buscar ou filtrar volta o teto ao início — o resultado
   é outro, e continuar de onde parou confundiria. */
const PASSO = 20;
let TETO = PASSO;
function rodapeLista(mostrados, total){
  if(total <= mostrados) return '';
  const faltam = total - mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO, faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todos os ${total}</button>
  </div>`;
}

/* ---------------- agrupamento ---------------- */
function nomeCli(id){const n=NOME[String(id)];return n?n:'';}
function agrupar(){
  const map=new Map();
  CLIENTES.forEach(c=>map.set(String(c.id),{id:String(c.id),nome:c.nome||'',contatos:[],orfa:false}));
  CONTATOS.forEach(c=>{
    const id=String(c.cliente_id==null?'':c.cliente_id);
    if(!map.has(id))map.set(id,{id:id,nome:nomeCli(id),contatos:[],orfa:true});
    map.get(id).contatos.push(c);
  });
  GRUPOS=Array.from(map.values());
  GRUPOS.forEach(g=>g.contatos.sort((a,b)=>
    (a.papel==='Principal'?0:1)-(b.papel==='Principal'?0:1) ||
    normTxt(a.nome||a.email).localeCompare(normTxt(b.nome||b.email),'pt')));
  GRUPOS.sort((a,b)=>String(a.id).localeCompare(String(b.id),'pt',{numeric:true}));
}
function grupoDe(id){return GRUPOS.find(g=>g.id===String(id));}
function contatoDe(row){return CONTATOS.find(c=>String(c.row)===String(row));}

/* ---------------- sinais ---------------- */
function temPrincipal(g){return g.contatos.some(c=>c.papel==='Principal');}
function faltaPrincipal(g){return g.contatos.length>0&&!temPrincipal(g);}
function nSemEmail(g){return g.contatos.filter(c=>!String(c.email||'').trim()).length;}
function nSemTel(g){return g.contatos.filter(c=>!String(c.telefone||'').trim()).length;}

/* ---------------- filtros e busca ---------------- */
function passaArea(g){return !AREA||g.contatos.some(c=>c.areas&&c.areas[AREA]);}
function passaSit(g,f){
  const k=f==null?FILTRO:f;
  if(k==='sem_principal')return faltaPrincipal(g);
  if(k==='sem_email')return nSemEmail(g)>0;
  if(k==='sem_tel')return nSemTel(g)>0;
  if(k==='sem_contato')return g.contatos.length===0;
  if(k==='nunca_acessou')return g.contatos.some(c=>String(c.email||'').trim()&&nuncaAcessou(c));
  return true;
}
/* Último acesso do contato (aba "log de acessos" — Acessos.gs).
   Vem como 'dd/MM/aaaa HH:mm'. Sem registro = a pessoa nunca entrou no painel:
   é o sinal mais acionável desta tela, então vira selo vermelho. */
const hojeZero=(()=>{const d=new Date();d.setHours(0,0,0,0);return d;})();
function diasDesde(br){
  const m=String(br||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return null;
  return Math.round((hojeZero-new Date(+m[3],+m[2]-1,+m[1]))/864e5);
}
function nuncaAcessou(c){ return !String(c.ultimo_acesso||'').trim(); }
function seloAcesso(c){
  const q=String(c.ultimo_acesso||'').trim();
  if(!String(c.email||'').trim()) return '';          // sem e-mail nem faz sentido cobrar acesso
  if(!q) return '<span class="acs nunca" title="Este contato nunca entrou no painel">nunca acessou</span>';
  const d=diasDesde(q), via=String(c.acesso_via||'').trim();
  const cl=(d!=null&&d>90)?' antigo':'';
  const rot=(d===0)?'acessou hoje':(d===1?'acessou ontem':(d!=null?`há ${d} dias`:q));
  return `<span class="acs${cl}" title="Último acesso: ${esc(q)}${via?' · via '+esc(via):''}">${esc(rot)}</span>`;
}

function bateContato(c,t){
  if(!t)return false;
  return casaBusca(normTxt([c.nome,c.email,c.telefone].join(' ')),soDigitos(c.telefone),t);
}
function bateCliente(g,t){
  if(!t)return false;
  return casaBusca(normTxt(g.id+' '+g.nome),soDigitos(g.id),t);
}
function passaBusca(g,t){return !t||bateCliente(g,t)||g.contatos.some(c=>bateContato(c,t));}

/* ---------------- ordenação da lista ----------------
   A lista tem dois níveis: o cartão é o CLIENTE e as linhas dentro dele são os
   CONTATOS. Por isso a coluna "Cliente" ordena os cartões e as outras quatro
   ordenam as linhas dentro de cada cartão — que é o que o cabeçalho está em
   cima de fato. Os mesmos critérios viram chips "Ordenar por" no painel de
   filtros: abaixo de 900px o cabeçalho some, e sem eles a ordenação sumiria
   junto. */
const ORDENS=[
  {k:'cliente',rot:'Cliente',asc:'do menor ID para o maior',desc:'do maior ID para o menor'},
  {k:'nome',rot:'Nome',asc:'A → Z',desc:'Z → A'},
  {k:'email',rot:'E-mail',asc:'A → Z',desc:'Z → A'},
  {k:'papel',rot:'Papel',asc:'Principal primeiro',desc:'Secundário primeiro'},
  {k:'areas',rot:'Áreas',asc:'A → Z',desc:'Z → A'}
];
/* Texto sem acento e sem caixa: "Água" e "agua" ficam juntas. */
function cmpTxt(a,b){return normTxt(a).localeCompare(normTxt(b),'pt',{numeric:true});}
/** O que a coluna vale para ordenar. Devolve '' quando está em branco — e vazio
 *  vai sempre para o fim, nas duas direções. */
function valOrdCt(c){
  if(SORT.key==='nome')return String(c.nome||'');
  if(SORT.key==='email')return String(c.email||'');
  if(SORT.key==='papel')return c.papel==='Principal'?'0':'1';
  if(SORT.key==='areas'){
    /* Principal enxerga tudo — é o que a coluna escreve, e é por isso que ele
       ordena por esse texto e não por uma lista de áreas que ele não tem. */
    if(c.papel==='Principal')return 'todas as áreas';
    return AREAS.filter(a=>c.areas&&c.areas[a[0]]).map(a=>a[1]).join(', ');
  }
  return '';
}
/* Coluna em branco quer dizer "falta preencher": ela vai SEMPRE para o fim, nas
   duas direções. Jogá-la para o topo no Z→A esconderia justamente o contato sem
   nome ou sem e-mail, que é o que a tela existe para cobrar. */
function cmpCt(a,b){
  const va=valOrdCt(a),vb=valOrdCt(b);
  const ea=va.trim()==='',eb=vb.trim()==='';
  if(ea&&eb)return 0;
  if(ea)return 1;
  if(eb)return -1;
  const r=cmpTxt(va,vb);
  return SORT.dir==='desc'?-r:r;
}
/** A ordem de sempre dentro do cartão: Principal primeiro, depois por nome. */
function ordemPadraoCt(a,b){
  return (a.papel==='Principal'?0:1)-(b.papel==='Principal'?0:1) ||
         cmpTxt(a.nome||a.email,b.nome||b.email);
}
/** Os contatos de um cartão na ordem de agora. Devolve uma CÓPIA: g.contatos é
 *  o que a gravação e o "adicionar contato" mexem, e reordenar o vetor original
 *  faria a lista brigar com quem está editando. */
function contatosOrdenados(g){
  if(SORT.key==='cliente')return g.contatos;
  return g.contatos.slice().sort((a,b)=>cmpCt(a,b)||ordemPadraoCt(a,b));
}
/* t chega normalizado (normTxt) — casaBusca normaliza de novo sem efeito colateral,
   e os dígitos são os mesmos antes e depois da normalização. */
function visiveis(){
  const t=normTxt(TERMO);
  /* Ordena o que SOBROU do filtro e da busca — nunca a lista crua. */
  const arr=GRUPOS.filter(g=>passaArea(g)&&passaSit(g)&&passaBusca(g,t));
  const porId=(a,b)=>String(a.id).localeCompare(String(b.id),'pt',{numeric:true});
  if(SORT.key==='cliente')
    return arr.sort((a,b)=>SORT.dir==='desc'?-porId(a,b):porId(a,b));
  /* Ordenando por coluna de contato, o cartão vale pelo seu PRIMEIRO contato na
     ordem escolhida: é ele que aparece logo abaixo do cabeçalho do cliente.
     Cartão sem contato nenhum não tem valor para comparar e cai no fim, nas duas
     direções — como qualquer célula vazia. */
  return arr.sort((a,b)=>{
    const ca=contatosOrdenados(a)[0],cb=contatosOrdenados(b)[0];
    if(!ca&&!cb)return porId(a,b);
    if(!ca)return 1;
    if(!cb)return -1;
    return cmpCt(ca,cb)||porId(a,b);
  });
}

/* destaca o trecho encontrado sem quebrar acentos */
function hl(txt,t){
  const s=String(txt==null?'':txt);
  if(!t)return esc(s);
  let n='';const map=[];
  for(let i=0;i<s.length;i++){
    const c=s[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    for(let j=0;j<c.length;j++){n+=c[j];map.push(i);}
  }
  const i0=n.indexOf(t);
  if(i0<0)return esc(s);
  const a=map[i0],b=(i0+t.length<map.length?map[i0+t.length]:s.length);
  return esc(s.slice(0,a))+'<mark>'+esc(s.slice(a,b))+'</mark>'+esc(s.slice(b));
}

/* ---------------- HTML ---------------- */
function areasHTML(c){
  const pr=c.papel==='Principal';
  const chips=AREAS.map(a=>`<button type="button" class="achip${(pr||c.areas[a[0]])?' on':''}${pr?' trava':''}" data-a="${a[0]}"${pr?' disabled':''}>${a[1]}</button>`).join('');
  /* O rótulo "ÁREAS" que vinha na frente saiu: hoje os chips moram numa seção da
     ficha que já se chama assim, e a mesma palavra duas vezes seguidas confunde. */
  return chips+(pr?'<span class="nota">Principal enxerga todas as áreas</span>':'');
}
function btnRemover(c){return `<button class="btn btn--mini btn--danger-out" type="button" data-del="${esc(c.row)}">Remover</button>`;}
/* Três estados no SIM/NÃO: sim, não e "ninguém respondeu ainda".
   Vazio não é "não" — é pergunta em aberto, e é isso que deixa a tela poder
   cobrar depois sem acusar quem nunca foi perguntado. */
function triSel(v){ return v===true?'sim':(v===false?'nao':''); }
/* Qualificação do sócio: as do quadro societário que aparecem quase sempre.
   A lista é atalho, não regra — a planilha do cliente pode trazer uma escrita
   que ninguém previu, e nesse caso o valor gravado entra como PRIMEIRA opção,
   já selecionado. É o mesmo jeito das outras telas que leem select de planilha:
   a tela nunca troca nem apaga sozinha o que a equipe escreveu; o valor só muda
   quando alguém escolhe outro à mão. */
const QUALIFICACOES=['Sócio-Administrador','Sócio','Administrador','Sócio Gerente','Diretor','Presidente','Sócio Ostensivo','Titular (EI)','Outro'];
function qualifOpcoes(val){
  const bruto=String(val==null?'':val).trim();
  const opts=QUALIFICACOES.slice();
  if(bruto&&opts.indexOf(bruto)<0)opts.unshift(bruto);   // comparação exata: preservar o texto como está
  return `<option value=""${bruto?'':' selected'}>—</option>`+
    opts.map(o=>`<option value="${esc(o)}"${o===bruto?' selected':''}>${esc(o)}</option>`).join('');
}
function perfilHTML(c){
  const p=c.perfil||{};
  const socio=triSel(p.socio), medico=triSel(p.medico);
  const tri=(k,rot,val)=>`<label class="cp"><span>${rot}</span><select class="in" data-p="${k}">
      <option value=""${val===''?' selected':''}>—</option>
      <option value="sim"${val==='sim'?' selected':''}>Sim</option>
      <option value="nao"${val==='nao'?' selected':''}>Não</option></select></label>`;
  return `<div class="perfil">
    ${tri('socio','Sócio?',socio)}
    ${tri('medico','Médico?',medico)}
    <label class="cp larga"><span>Função</span><input class="in" data-p="funcao" value="${esc(p.funcao||'')}"
      placeholder="sócio investidor, secretária, concierge…"></label>
    ${medico==='sim'?`<label class="cp"><span>CRM</span><input class="in" data-p="crm" value="${esc(p.crm||'')}" placeholder="CRM/UF 00000"></label>`:''}
    ${socio==='sim'?`<label class="cp larga"><span>Endereço pessoal</span><input class="in" data-p="endereco" value="${esc(p.endereco||'')}" placeholder="rua, nº, cidade"></label>`:''}
    ${socio==='sim'?`<label class="cp larga"><span>Qualificação do sócio</span><select class="in" data-p="qualificacao">${qualifOpcoes(p.qualificacao)}</select></label>`:''}
    ${(!p.funcao&&!socio&&!medico)?`<span class="sn-falta">sem informação de quem é a pessoa</span>`:''}
  </div>`;
}

/* ---------------- o mesmo perfil, no contato NOVO ----------------
   Os seis campos que o backend já grava (CONTATO_PERFIL: sócio, médico, função,
   CRM, endereço pessoal, qualificação do sócio) faltavam no formulário de criar: dava para responder
   "quem é a pessoa" só depois de o contato existir, abrindo a ficha de novo.
   O desenho é o mesmo do formulário de editar — os `<label class="cp">` do
   perfilHTML acima —, mudam só os `id`/`data-mp`, que é o que separa este bloco
   (estado em MODAL_PERFIL) do da ficha (estado no próprio contato).
   Duas regras do servidor valem aqui, e não é enfeite:
     - CRM só existe para quem é médico; endereço pessoal e qualificação, só para
       quem é sócio;
     - responder diferente de "Sim" ESCONDE o campo e LIMPA o valor, porque é
       exatamente o que o contatoSalvar_ faz com ele ("guardar o valor de quem
       respondeu não deixaria dado órfão que ninguém revisa"). A tela não pode
       prometer guardar o que o servidor vai apagar.
   O "sem informação de quem é a pessoa" da ficha fica de fora: ali é cobrança de
   um cadastro antigo, aqui seria acusar um formulário que a pessoa acabou de
   abrir e ainda está preenchendo. */
function perfilNovoHTML(){
  const p=MODAL_PERFIL||{};
  const socio=triSel(p.socio), medico=triSel(p.medico);
  const tri=(k,rot,val)=>`<label class="cp" for="m-${k}"><span>${rot}</span><select class="in" id="m-${k}" data-mp="${k}">
      <option value=""${val===''?' selected':''}>—</option>
      <option value="sim"${val==='sim'?' selected':''}>Sim</option>
      <option value="nao"${val==='nao'?' selected':''}>Não</option></select></label>`;
  return tri('socio','Sócio?',socio)+tri('medico','Médico?',medico)+
    `<label class="cp larga" for="m-funcao"><span>Função</span><input class="in" id="m-funcao" data-mp="funcao"
      value="${esc(p.funcao||'')}" placeholder="sócio investidor, secretária, concierge…"></label>`+
    (medico==='sim'?`<label class="cp" for="m-crm"><span>CRM</span><input class="in" id="m-crm" data-mp="crm"
      value="${esc(p.crm||'')}" placeholder="CRM/UF 00000"></label>`:'')+
    (socio==='sim'?`<label class="cp larga" for="m-endereco"><span>Endereço pessoal</span><input class="in" id="m-endereco" data-mp="endereco"
      value="${esc(p.endereco||'')}" placeholder="rua, nº, cidade"></label>`:'')+
    (socio==='sim'?`<label class="cp larga" for="m-qualificacao"><span>Qualificação do sócio</span><select class="in" id="m-qualificacao"
      data-mp="qualificacao">${qualifOpcoes(p.qualificacao)}</select></label>`:'');
}
function pintarPerfilModal(){
  const el=document.getElementById('m-perfil');
  if(el) el.innerHTML=perfilNovoHTML();
}
function aplicarPerfilModal(el){
  /* O `input` de um <select> chega antes do `change`, e o redesenho abaixo troca
     o próprio <select> de lugar: sem esta guarda o `change` seguinte chegaria de
     um nó que já saiu da tela e repintaria o bloco uma segunda vez. */
  if(!el.isConnected) return;
  const k=el.dataset.mp;
  MODAL_PERFIL[k]=(k==='socio'||k==='medico')?(el.value===''?null:el.value==='sim'):el.value;
  /* A trava roda a CADA mudança, e não só quando o SIM/NÃO muda: o `change` de um
     campo de texto só chega quando ele perde o foco, e isso pode acontecer DEPOIS
     de o bloco ter se redesenhado sem ele. Era assim que um endereço recém-digitado
     voltava para dentro de alguém que acabara de deixar de ser sócio — e a tela
     ficava prometendo guardar o que o servidor apaga na hora de gravar. */
  if(MODAL_PERFIL.medico!==true) MODAL_PERFIL.crm='';
  if(MODAL_PERFIL.socio!==true){ MODAL_PERFIL.endereco=''; MODAL_PERFIL.qualificacao=''; }
  if(k==='socio'||k==='medico') pintarPerfilModal();
}
/* O objeto `perfil` que vai no acao=contato_salvar, no formato do
   _perfilEscrever_: null vira coluna vazia, true vira SIM, false vira NÃO, e os
   quatro de texto vão como texto. É o mesmo que o perfilDe() manda na edição. */
function perfilModal(){
  const p=MODAL_PERFIL||{};
  return { socio:p.socio, medico:p.medico, funcao:p.funcao||'',
           crm:p.crm||'', endereco:p.endereco||'', qualificacao:p.qualificacao||'' };
}

/* ---------------- a linha da lista (só leitura) ----------------
   Cinco colunas por contato: Cliente · Nome · E-mail · Papel · Áreas. O resto da
   ficha abre no modal. Nenhum campo aqui: a lista fica limpa e ninguém altera sem
   querer. */
/* Duas áreas inteiras dizem mais que três cortadas: quem manda no corte é a
   CONTAGEM, e o que sobra vira um "+N" honesto (com a lista completa no title). */
const AREA_TETO=2, AREA_LARGURA=22;
function areasLinha(c){
  /* Principal enxerga tudo — seis pílulas para dizer "todas" seria a coluna
     inteira repetindo o que a pílula de papel ao lado já disse. */
  if(c.papel==='Principal')return '<span class="c-tag">todas as áreas</span>';
  const ns=AREAS.filter(a=>c.areas&&c.areas[a[0]]).map(a=>a[1]);
  if(!ns.length)return '<span class="c-falta">sem áreas</span>';
  const mostrar=[];let sobra=AREA_LARGURA;
  for(const n of ns){
    if(mostrar.length>=AREA_TETO)break;
    if(mostrar.length&&n.length>sobra)break;
    sobra-=n.length+1;mostrar.push(n);
  }
  const resto=ns.length-mostrar.length;
  return mostrar.map(n=>`<span class="c-tag">${esc(n)}</span>`).join('')+
    (resto>0?`<span class="c-tag mais" title="${esc(ns.slice(mostrar.length).join(', '))}">+${resto}</span>`:'');
}
/* Situação do contato para a faixa lateral: sem e-mail (âmbar, não há como dar
   acesso) e nunca acessou (vermelho, tem e-mail e nunca entrou). */
function situacaoCt(c){
  if(!String(c.email||'').trim())return 'semmail';
  if(nuncaAcessou(c))return 'nunca';
  return '';
}
/* Na lista entra só o selo que PEDE AÇÃO — "nunca acessou" e o acesso antigo.
   Um "acessou hoje" verde em cada linha viraria ruído e apagaria justamente o
   vermelho que a tela existe para mostrar. O selo completo, com data e "via",
   continua inteiro dentro da ficha. */
function seloAcessoLinha(c){
  const q=String(c.ultimo_acesso||'').trim();
  if(!String(c.email||'').trim())return '';
  if(!q)return '<span class="acs nunca" title="Este contato nunca entrou no painel">nunca acessou</span>';
  const d=diasDesde(q);
  if(d!=null&&d>90)return `<span class="acs antigo" title="Último acesso: ${esc(q)}">há ${d} dias</span>`;
  return '';
}
/** O que não coube nas cinco colunas vira o title da linha: dá para conferir sem
 *  abrir nada — telefone, quem é a pessoa e o último acesso por extenso. */
function tituloLinha(c,g){
  /* Nome e e-mail entram inteiros aqui porque são justamente os dois que a
     coluna corta com reticências quando são longos. */
  const p=['Nome: '+(String(c.nome||'').trim()||'em branco')];
  p.push('E-mail: '+(String(c.email||'').trim()||'em branco'));
  p.push('Cliente: '+((g.id||'sem ID')+(g.nome?' · '+g.nome:'')));
  p.push('Telefone: '+(String(c.telefone||'').trim()||'em branco'));
  const pf=c.perfil||{};
  if(pf.funcao)p.push('Função: '+pf.funcao);
  if(pf.socio===true)p.push('Sócio');
  if(pf.medico===true)p.push('Médico'+(pf.crm?' · CRM '+pf.crm:''));
  if(String(c.email||'').trim())p.push('Último acesso: '+(String(c.ultimo_acesso||'').trim()||'nunca'));
  p.push('Clique para abrir a ficha do contato.');
  return p.join(' · ');
}
/* O miolo vem separado do invólucro porque salvar repinta só o miolo: trocar a
   linha inteira tiraria o foco de quem chegou nela pelo teclado. */
function linhaConteudo(c,g){
  const email=String(c.email||'').trim();
  const pr=c.papel==='Principal';
  return `<span class="c-cli">${esc(g.id||'—')}</span>
    <span class="c-nome">${c.nome?esc(c.nome):'<span class="c-falta">sem nome</span>'}</span>
    <span class="c-mail">${email?`<span class="t">${esc(email)}</span>`:'<span class="c-falta">sem e-mail</span>'}${seloAcessoLinha(c)}</span>
    <span class="c-papel"><span class="pill ${pr?'papel-pri':'papel-sec'}" title="${pr?'Principal enxerga todas as áreas.':'Secundário enxerga só as áreas marcadas.'}">${pr?'Principal':'Secundário'}</span></span>
    <span class="c-areas">${areasLinha(c)}</span>`;
}
/* role="button" e não <button> porque dentro da linha há pílulas e selos com
   title próprio; o teclado é atendido à mão no keydown (Enter e Espaço). */
function linhaHTML(c,g,t){
  const sit=situacaoCt(c);
  return `<div class="ctl${sit?' ct-'+sit:''}${bateContato(c,t)?' match':''}${String(CAD_ROW)===String(c.row)?' aberto':''}"
    role="button" tabindex="0" aria-haspopup="dialog" data-row="${esc(c.row)}" title="${esc(tituloLinha(c,g))}"
    >${linhaConteudo(c,g)}</div>`;
}
/** Seta da coluna ativa — só ela ganha marca, senão a lista pareceria ordenada
 *  por cinco critérios ao mesmo tempo.
 *  O espaço antes da seta é NÃO SEPARÁVEL (\u00A0) de propósito: com espaço
 *  comum, o rótulo que quase preenche a coluna empurrava a seta sozinha para uma
 *  segunda linha, e o cabeçalho ficava com o dobro da altura por causa dela. */
function seta(key){return SORT.key===key?(SORT.dir==='asc'?'\u00A0▲':'\u00A0▼'):'';}
/* O cabeçalho de colunas repete a régua da linha (mesma regra de CSS) e some
   abaixo de 900px, onde a linha deixa de ser cinco colunas. Cada rótulo é um
   botão que ordena — por isso ele NÃO é mais aria-hidden: aqui não é enfeite, e
   a coluna ativa se anuncia com aria-sort. */
function cabecalhoLista(){
  const bt=(k,rot)=>{
    const at=SORT.key===k;
    return `<span role="columnheader"${at?` aria-sort="${SORT.dir==='asc'?'ascending':'descending'}"`:''}>`+
      `<button type="button" data-sort="${esc(k)}" title="Ordenar por ${esc(rot)}">${esc(rot)}${seta(k)}</button></span>`;
  };
  return `<div class="lista-cab" role="row">`+
    bt('cliente','Cliente')+bt('nome','Nome')+bt('email','E-mail')+
    bt('papel','Papel')+bt('areas','Áreas')+`</div>`;
}

/* ---------------- a ficha do contato (corpo do modal) ----------------
   O agrupamento por assunto que a linha já tinha (campos de contato, quem é a
   pessoa, áreas, acesso) vira a divisão em seções — é a mesma informação, e já
   estava resolvida. O invólucro continua sendo o .ctt com data-row: é nele que

function fichaHTML(c){

  const semMail=!String(c.email||'').trim(),semTel=!String(c.telefone||'').trim();
  const g=grupoDe(c.cliente_id)||{id:String(c.cliente_id==null?'':c.cliente_id),nome:nomeCli(c.cliente_id)};

    c.link?`<span class="ro">link de acesso <button class="lk" type="button" data-copy="${esc(c.link)}">copiar</button>
      <a class="lk" href="${esc(c.link)}" target="_blank" rel="noopener">abrir ↗</a></span>`:'',

  return `<div class="ctt" data-row="${esc(c.row)}">
    <div class="ign"></div>

      <div class="fld"><label>Cliente</label>
        <div class="cli-ro">${esc(g.id||'sem ID')}${g.nome?' · '+esc(g.nome):''}</div></div>
      <div class="campos">
        <label class="cp"><span>Nome</span><input class="in" data-k="nome" value="${esc(c.nome||'')}" placeholder="Nome do contato"></label>
        <label class="cp"><span>E-mail</span><input class="in${semMail?' falho':''}" data-k="email" type="email" value="${esc(c.email||'')}" placeholder="email@exemplo.com"></label>
        <label class="cp"><span>Telefone / WhatsApp</span><input class="in${semTel?' falho':''}" data-k="telefone" inputmode="numeric" value="${esc(c.telefone||'')}" placeholder="55DDD9…"></label>
        <label class="cp"><span>Papel</span><select class="in" data-k="papel">
          <option${pr?' selected':''}>Principal</option><option${pr?'':' selected'}>Secundário</option></select></label>
      </div>
    </div>
    <div class="sec"><h2><span class="dot"></span>Quem é a pessoa</h2>${perfilHTML(c)}</div>
    <div class="sec"><h2><span class="dot"></span>Áreas que esse contato enxerga</h2>
      <div class="areas-linha" data-areas>${areasHTML(c)}</div></div>
    <div class="sec"><h2><span class="dot"></span>Acesso</h2>
      <div class="rodape">${acesso||'<span class="dica-in">Sem e-mail não há código nem link de acesso para este contato.</span>'}</div>
      <span class="dica-in">Código e link são gerados pelo sistema: dá para copiar, não para editar.</span>
    </div>
    <div class="sec"><h2><span class="dot"></span>Remover contato</h2>
      <span class="rm" data-rm>${btnRemover(c)}</span>
      <span class="dica-in">Remover apaga o contato da planilha — a tela pergunta antes de fazer.</span>
    </div>
  </div>`;
}
/* A ficha de contato NOVO é a mesma ficha com as seções que ainda cabem: o
   cliente (que aqui se escolhe), os campos, quem é a pessoa e as áreas. Ficam de
   fora só as duas que não existem antes de o contato existir — o acesso (código
   e link são gerados na gravação) e o remover. Os ids são os de sempre — é o que
   deixa resolverCliente(), validarCliModal() e adicionarContato() continuarem
   exatamente como estavam. */
function fichaNovaHTML(){
  return `<div class="sec"><h2><span class="dot"></span>Cliente</h2>
      <div class="fld">
        <label for="m-cli">Cliente</label>
        <input id="m-cli" list="dl-clientes" autocomplete="off" placeholder="Digite o ID ou o nome — ex.: 250033 · Padaria">
