<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#073034">
<title>Diagnóstico da sua PJ médica | Back4you</title>
<meta name="description" content="Diagnóstico gratuito da sua empresa médica: impostos, cadastro na Receita, dívida ativa, lucro e acompanhamento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Identidade do painel Back4you */
:root{
  --canvas:#F1E7DC; --surface:#FFFFFF; --warm:#FBF6EF;
  --ink:#113D39; --ink-2:#3F5854; --muted:#6E6256;
  --line:#E4D9C9; --line-2:#D6C3AC;
  --dark:#073034; --teal:#0F8C85; --euc:#3FA680; --teal-txt:#0C756F; --teal-soft:#DCEFEC;
  --amber:#E8892E; --amber-txt:#8A5A10; --amber-soft:#FBEBD8;
  --red:#C0392B; --red-soft:#F8E1DD; --green:#2E9D5F; --green-soft:#E1F2E8;
  --sans:'Montserrat',system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
.topbar{background:var(--dark);color:#fff;padding:12px 16px}
.topbar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo i{font-style:normal;color:var(--euc)}
.topbar small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;text-align:right}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 48px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 6px}
.progress>i{display:block;height:100%;background:var(--teal);transition:width .4s ease}
.stepinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:14px}
.stepinfo b{color:var(--teal-txt)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 18px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:26px;line-height:1.2;margin:4px 0 12px;letter-spacing:-.01em}
h2{font-size:21px;line-height:1.25;margin:0 0 10px}
h3{font-size:16px;margin:24px 0 10px}
h1 b,h2 b{color:var(--teal-txt)}
.tone-bad h2 b{color:var(--red)} .tone-warn h2 b{color:var(--amber-txt)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-txt)}
.lead{color:var(--ink-2);margin:0 0 14px}
.small{font-size:12px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.pills span{background:var(--warm);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600}

.bubble{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.bubble .av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.bubble .msg{background:var(--warm);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:10px 13px}
.bubble .msg p{margin:0 0 6px}.bubble .msg p:last-child{margin:0}
.insights{display:grid;gap:8px;margin:0 0 16px}
.ins{border-radius:8px;padding:10px 12px;font-size:14px;border-left:4px solid var(--teal);background:var(--teal-soft)}
.ins.warn{border-color:var(--amber);background:var(--amber-soft)}
.ins.bad{border-color:var(--red);background:var(--red-soft)}
.ins.good{border-color:var(--green);background:var(--green-soft)}
.ins small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.tip{border-left:3px solid var(--amber);background:var(--warm);border-radius:6px;padding:9px 12px;font-size:13px;margin:0 0 16px}
.tip b.tt{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-txt)}

.field{margin-bottom:15px}
.field>label,.field>.lbl{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.hint{display:block;color:var(--muted);font-size:12.5px;margin:-2px 0 6px}
.hint.autonote{color:var(--teal-txt);font-weight:600}
.auto{display:inline-block;font-size:10.5px;font-weight:700;color:var(--teal-txt);background:var(--teal-soft);border-radius:5px;padding:2px 7px;margin-left:6px;vertical-align:middle;letter-spacing:.02em}
select,input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
select:focus,input:focus{outline:2px solid var(--teal);outline-offset:1px}
.field.hide{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;font-size:14px;cursor:pointer;background:#fff;user-select:none}
.chips input{accent-color:var(--teal);width:16px;height:16px;margin:0}
.chips label.on{border-color:var(--teal);background:var(--teal-soft);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin:6px 0 14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--teal)}

.actions{display:flex;gap:10px;align-items:center;margin-top:18px}
button,.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:8px;padding:13px 18px;cursor:pointer;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--teal);color:#fff;flex:1}
.btn-primary:hover{background:var(--teal-txt)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);padding:13px 8px}
.btn-outline{background:#fff;color:var(--teal-txt);border:1px solid var(--teal)}

/* CNPJ */
.cnpjbox{background:var(--warm);border:1px solid var(--line);border-radius:10px;padding:13px}
.cnpjbox .opt{font-weight:400;color:var(--muted);font-size:13px}
.cnpjrow{display:flex;gap:8px}
.cnpjrow input{flex:1;min-width:0;padding:11px 10px}
.cnpjrow .btn{padding:11px 12px;flex:none}
.cnpjmsg{font-size:14px;margin:10px 0 0;display:flex;align-items:center;gap:8px}
.cnpjmsg.err{color:var(--red)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;display:inline-block;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.empcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-top:10px;display:flex;flex-direction:column;gap:2px}
.empcard b{font-size:15px}
.empcard.ok{border-color:var(--green)}
.empcard .actions{margin-top:10px}
.emp-ok{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.05em}
.linkbtn{background:none;border:0;padding:6px 0 0;color:var(--teal-txt);font-size:13px;font-weight:700;text-decoration:underline;align-self:flex-start;cursor:pointer}
.live{display:grid;gap:6px;margin-top:10px}
.live .ins{font-size:13.5px}
.live .ins.loading{display:flex;align-items:center;gap:8px;background:#fff;border-color:var(--line-2);color:var(--muted)}

/* resultado */
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:5px;margin-bottom:8px}
.tone-ok .badge{background:var(--green-soft);color:var(--green)}
.tone-warn .badge{background:var(--amber-soft);color:var(--amber-txt)}
.tone-bad .badge{background:var(--red-soft);color:var(--red)}
.empline{font-size:12.5px;color:var(--muted);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.scorebox{display:flex;gap:16px;align-items:center;margin:14px 0}
.gauge{flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c,var(--teal)) calc(var(--p)*1%),var(--line) 0)}
.gauge>div{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1}
.gauge b{font-size:26px}.gauge small{display:block;font-size:10px;color:var(--muted)}
.pillars{flex:1;display:grid;gap:6px}
.pillar{font-size:12.5px}
.pillar div{display:flex;justify-content:space-between}
.pillar .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:2px}
.pillar .bar i{display:block;height:100%}
.hl{background:var(--dark);color:#fff;border-radius:10px;padding:16px 18px;margin:14px 0 8px}
.hl small{display:block;font-size:12px;opacity:.8;letter-spacing:.02em}
.hl strong{display:block;font-size:30px;line-height:1.15;margin:2px 0 4px;color:#fff}
.hl span{display:block;font-size:13.5px;opacity:.92}
.hl .row{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
.hl .row div{min-width:120px}
.hl .row b{display:block;font-size:19px}
.est{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.est div{background:var(--warm);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
.est small{display:block;color:var(--muted);font-size:11.5px}
.est strong{display:block;font-size:17px;color:var(--teal-txt);margin-top:2px}
@media (max-width:440px){.est{grid-template-columns:1fr}}
.opp{border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;background:#fff}
.opp h4{margin:0 0 4px;font-size:15px}
.opp p{margin:0 0 6px;font-size:14px;color:var(--ink-2)}
ul.alerts{list-style:none;padding:0;margin:0}
ul.alerts li{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:8px;font-size:14px;background:#fff}
ul.alerts li>b{display:block;margin-bottom:1px}
ul.alerts li>span.atx{display:block;color:var(--ink-2)}
ul.alerts li.a-bad{border-left:4px solid var(--red)}
ul.alerts li.a-warn{border-left:4px solid var(--amber)}
ul.alerts li.a-info{border-left:4px solid var(--teal)}
ul.alerts li.ghost{border-left:4px solid var(--line-2);background:var(--warm)}
.blur{filter:blur(6px);user-select:none;-webkit-user-select:none;pointer-events:none}
.lock-note{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin:2px 0 0}
.rf{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0}
.rf dl{margin:0}
.rf dl div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.rf dl div:last-child{border-bottom:0}
.rf dt{color:var(--muted);flex:none}
.rf dd{margin:0;text-align:right;font-weight:600}
.rf dd.ok{color:var(--green)} .rf dd.warn{color:var(--amber-txt)} .rf dd.bad{color:var(--red)}
.sim dl{margin:6px 0}
.sim dl div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sim dl div:last-child{border-bottom:0}
.sim dt{color:var(--muted)} .sim dd{margin:0;font-weight:700;text-align:right}
.sim .good dd{color:var(--green)} .sim .bad dd{color:var(--red)}
ol.nsteps{margin:0;padding:0;list-style:none;counter-reset:n}
ol.nsteps li{counter-increment:n;position:relative;padding:8px 0 8px 36px;font-size:14.5px;border-bottom:1px solid var(--line)}
ol.nsteps li:last-child{border-bottom:0}
ol.nsteps li:before{content:counter(n);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp td:nth-child(2),.cmp td:nth-child(3){white-space:nowrap}
.y{color:var(--green);font-weight:700}.n{color:var(--red);font-weight:700}.m{color:var(--amber-txt);font-weight:700}
.unlock{margin-top:22px;border:2px solid var(--teal);border-radius:12px;padding:16px 14px 4px;background:linear-gradient(180deg,var(--teal-soft),#fff 120px)}
.unlock h3{margin:0 0 4px;font-size:18px;color:var(--teal-txt)}
ul.checks{padding:0;margin:8px 0 14px;list-style:none}
ul.checks li{padding:5px 0 5px 26px;position:relative;font-size:14px}
ul.checks li:before{content:"";position:absolute;left:4px;top:10px;width:11px;height:6px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg)}
.cta-box{background:var(--dark);color:#fff;border-radius:12px;padding:18px;margin-top:22px}
.cta-box p{margin:0 0 12px}
.cta-box b{color:#fff}
.cta-box .btn{background:var(--euc);color:#fff;width:100%}
.disclaimer{font-size:11.5px;color:var(--muted);margin-top:14px}
footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:20px}

/* prévia do painel */
.pn{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--canvas);margin:8px 0;position:relative}
.pn .pn-top{background:var(--dark);color:#fff;padding:9px 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pn .pn-top small{font-size:10px;font-weight:600;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.pn .pn-head{background:#fff;padding:10px 12px;border-bottom:1px solid var(--line)}
.pn .pn-head b{display:block;font-size:15px}
.pn .pn-head b i{font-style:normal;color:var(--teal)}
.pn .pn-head span{font-size:11px;color:var(--muted)}
.pn .upd{display:inline-block;background:var(--teal-soft);color:var(--teal-txt);font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px;margin-top:4px}
.pn-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.pn-tabs button{flex:none;font-size:12px;padding:6px 10px;border:1px solid var(--line-2);background:#fff;color:var(--ink);border-radius:6px}
.pn-tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.pn-body{padding:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.kpi.hi{background:var(--teal-soft);border-color:#bfe0dc}
.kpi small{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.kpi b{display:block;font-size:17px;margin:2px 0}
.kpi span{font-size:11px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:22px;margin-top:5px}
.spark i{flex:1;background:var(--c,#8fcfc9);border-radius:2px 2px 0 0;min-height:3px}
.spark i.cur{background:var(--cc,var(--teal))}
.pn-tbl{background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden}
.pn-tbl .t{padding:8px 10px;background:var(--warm);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pn-tbl .t b{display:block;font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink)}
.pn-tbl div.r{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-top:1px solid var(--line);font-size:12.5px}
.pn-tbl div.r span{color:var(--muted);font-size:11px;display:block}
.pn-tbl div.r em{font-style:normal;color:var(--muted);font-size:11.5px;white-space:nowrap}
.pn-tbl div.r strong{white-space:nowrap}
.pn-note{font-size:11px;color:var(--muted);padding:8px 10px 2px}
.pn.locked .pn-body,.pn.locked .pn-tabs{filter:blur(4px);pointer-events:none}
.pn .lockover{position:absolute;inset:auto 12px 14px 12px;background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 18px rgba(7,48,52,.12)}

/* busca por nome */
.nomes{margin-top:10px;display:grid;gap:6px}
.nomes p{margin:2px 0}
.nome-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;font-weight:400;font-size:14px;color:var(--ink);width:100%}
.nome-item b{font-size:14px}
.nome-item:hover,.nome-item:focus{border-color:var(--teal);background:var(--teal-soft)}
.ins .cn-det{display:block;margin-top:6px;font-size:.86em;line-height:1.5}

/* ================= Conversa (estilo WhatsApp, cores Back4you) ================= */
:root{--wa-bg:#ECE3D6;--wa-me:#D3EDE6;--wa-foot:#F5EEE5;--wa-time:#7C8B88}
body.chat{overflow:hidden}
.wa{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--wa-bg);
  background-image:radial-gradient(rgba(7,48,52,.05) 1.2px,transparent 1.3px),radial-gradient(rgba(15,140,133,.05) 1.2px,transparent 1.3px);
  background-size:22px 22px,22px 22px;background-position:0 0,11px 11px;box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(7,48,52,.12)}
.wa-top{flex:none;display:flex;align-items:center;gap:11px;background:var(--dark);color:#fff;padding:10px 14px;min-height:60px}
.wa-av{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:-.02em}
.wa-av i{font-style:normal;color:var(--euc)}
.wa-id{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.wa-id b{font-size:17px}
.wa-id small{font-size:13px;opacity:.8}
.wa-etapa{flex:none;font-size:12.5px;opacity:.85;text-align:right;max-width:40%;line-height:1.3}
.wa-prog{flex:none;height:3px;background:rgba(7,48,52,.12)}
.wa-prog i{display:block;height:100%;width:0;background:var(--euc);transition:width .5s ease}
.wa-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 10px 14px;-webkit-overflow-scrolling:touch}
.wa-day,.wa-sec{text-align:center;margin:6px 0 10px}
.wa-day span{display:inline-block;background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;border-radius:7px;padding:4px 10px;box-shadow:0 1px .5px rgba(0,0,0,.08)}
.wa-sec span{display:inline-flex;align-items:center;gap:6px;background:#FBEFC8;color:#6B5A2E;font-size:13px;border-radius:7px;padding:6px 10px;max-width:88%;line-height:1.35}
.wm{display:flex;margin:3px 0;animation:pop .18s ease-out}
.wm.bot{justify-content:flex-start}
.wm.me{justify-content:flex-end;flex-direction:column;align-items:flex-end}
.wm .wb{position:relative;max-width:84%;background:#fff;border-radius:9px;padding:8px 11px 21px;font-size:16.5px;line-height:1.45;box-shadow:0 1px .6px rgba(0,0,0,.12);overflow-wrap:anywhere}
.wm.bot .wb{border-top-left-radius:2px}
.wm.me .wb{background:var(--wa-me);border-top-right-radius:2px;padding-right:12px;min-width:92px}
.wm .wb p{margin:0 0 6px}.wm .wb p:last-of-type{margin-bottom:0}
.wm .wb .t{position:absolute;right:8px;bottom:3px;font-size:12px;color:var(--wa-time);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.wm .wb .ck{color:#2A9AD8}
.wm .wb .hint{display:block;font-size:14.5px;color:var(--muted);margin-top:3px}
.wm .wb .nota{display:block;font-size:14.5px;color:var(--teal-txt);font-weight:600;margin-top:5px;background:var(--teal-soft);border-radius:6px;padding:4px 7px}
.wm .wb small.tag{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-txt);margin-bottom:2px}
.wm .wb small.tag.ok{color:var(--green)}

<script>
/* ============================================================
   Leitor de SQLite pela internet (requisições HTTP Range).
   Lê só as páginas necessárias de tabelas WITHOUT ROWID.
   Usado pela dívida ativa (PGFN) e pela busca por nome.
   ============================================================ */
window.B4Y_SQL = (function () {
  "use strict";
  var files = {};

  function get(url, start, len, ms) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms || 8000);
    return fetch(url, { headers: { Range: "bytes=" + start + "-" + (start + len - 1) }, signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        clearTimeout(t);
        if (r.status === 206) return r.arrayBuffer().then(function (b) { return { bytes: new Uint8Array(b) }; });
        if (r.status === 200) return r.arrayBuffer().then(function (b) { return { full: new Uint8Array(b) }; });
        throw new Error("http_" + r.status);
      });
  }
  // abre o arquivo tentando cada endereço base, na ordem
  function abrir(bases, nome, ms) {
    var chave = bases.join("|") + "|" + nome;
    if (files[chave]) return files[chave];
    var i = 0;
    function tenta() {
      if (i >= bases.length) return Promise.reject(new Error("indisponivel"));
      var url = bases[i++] + nome;
      return get(url, 0, 4096, ms).then(function (res) {
        var b = res.full || res.bytes;
        if (String.fromCharCode.apply(null, b.subarray(0, 15)) !== "SQLite format 3") throw new Error("nao_sqlite");
        var ps = (b[16] << 8) | b[17]; if (ps === 1) ps = 65536;
        var f = { url: url, ps: ps, full: res.full || null, pages: {}, pend: {}, ms: ms || 8000, raizes: {} };
        if (!f.full && ps === 4096) f.pages[1] = b;
        return f;
      }).catch(function () { return tenta(); });
    }
    files[chave] = tenta().catch(function (e) { delete files[chave]; throw e; });
    return files[chave];
  }
  function page(f, n) {
    if (f.full) return Promise.resolve(f.full.subarray((n - 1) * f.ps, n * f.ps));
    if (f.pages[n]) return Promise.resolve(f.pages[n]);
    if (f.pend[n]) return f.pend[n];
    f.pend[n] = get(f.url, (n - 1) * f.ps, f.ps, f.ms).then(function (res) {
      delete f.pend[n];
      if (res.full) { f.full = res.full; return f.full.subarray((n - 1) * f.ps, n * f.ps); }
      f.pages[n] = res.bytes; return res.bytes;
    }, function (e) { delete f.pend[n]; throw e; });
    return f.pend[n];
  }

  /* ---------- formato ---------- */
  function u16(b, o) { return (b[o] << 8) | b[o + 1]; }
  function u32(b, o) { return ((b[o] << 24) >>> 0) + (b[o + 1] << 16) + (b[o + 2] << 8) + b[o + 3]; }
  function varint(b, o) {
    var v = 0;
    for (var i = 0; i < 8; i++) { var x = b[o + i]; v = v * 128 + (x & 127); if (x < 128) return [v, i + 1]; }
    return [v * 256 + b[o + 8], 9];
  }
  function int(b, o, n) { var v = 0; for (var i = 0; i < n; i++) v = v * 256 + b[o + i]; return b[o] & 128 ? v - Math.pow(2, 8 * n) : v; }
  var TAM = [0, 1, 2, 3, 4, 6, 8, 8, 0, 0];
  var dec = new TextDecoder();
  function registro(b, o) {
    var h = varint(b, o), fim = o + h[0], p = o + h[1], tipos = [];
    while (p < fim) { var t = varint(b, p); tipos.push(t[0]); p += t[1]; }
    var out = [], d = fim;
    tipos.forEach(function (t) {
      if (t === 0) out.push(null);
      else if (t === 8) out.push(0);
      else if (t === 9) out.push(1);
      else if (t === 7) { out.push(new DataView(b.buffer, b.byteOffset + d, 8).getFloat64(0)); d += 8; }
      else if (t < 7) { out.push(int(b, d, TAM[t])); d += TAM[t]; }
      else { var len = (t - (t % 2 ? 13 : 12)) / 2; out.push(t % 2 ? dec.decode(b.subarray(d, d + len)) : null); d += len; }
    });
    return out;
  }
  function celulas(b, n) {
    var h = n === 1 ? 100 : 0, tipo = b[h], qtd = u16(b, h + 3), interior = tipo === 2 || tipo === 5;
    var ini = h + (interior ? 12 : 8), cs = [];
    for (var i = 0; i < qtd; i++) cs.push(u16(b, ini + 2 * i));
    return { tipo: tipo, cs: cs, direita: interior ? u32(b, h + 8) : 0 };
  }
  function tabela(f, n, out) {
    return page(f, n).then(function (b) {
      var p = celulas(b, n);
      if (p.tipo === 13) {
        p.cs.forEach(function (o) { var s = varint(b, o), r = varint(b, o + s[1]); out.push(registro(b, o + s[1] + r[1])); });
        return out;
      }
      var filhos = p.cs.map(function (o) { return u32(b, o); }).concat([p.direita]);
      return filhos.reduce(function (pr, c) { return pr.then(function () { return tabela(f, c, out); }); }, Promise.resolve()).then(function () { return out; });
    });
  }
  function raiz(f, nomeTabela) {
    if (f.raizes[nomeTabela]) return Promise.resolve(f.raizes[nomeTabela]);
    return tabela(f, 1, []).then(function (linhas) {
      var d = linhas.filter(function (l) { return l[0] === "table" && l[1] === nomeTabela; })[0];
      if (!d) throw new Error("sem_tabela_" + nomeTabela);
      f.raizes[nomeTabela] = d[3]; return d[3];
    });
  }
  // percorre a árvore de uma tabela WITHOUT ROWID e devolve as linhas com lo <= 1ª coluna < hi
  // (se hi for null, só a igualdade com lo). limite = para cedo quando já achou o suficiente.
  function faixa(f, n, lo, hi, out, limite) {
    if (out.length >= limite) return Promise.resolve(out);
    var dentro = hi == null ? function (k) { return k === lo; } : function (k) { return k >= lo && k < hi; };
    var passou = hi == null ? function (k) { return k > lo; } : function (k) { return k >= hi; };
    return page(f, n).then(function (b) {
      var p = celulas(b, n);
      if (p.tipo === 10) {
        for (var i = 0; i < p.cs.length && out.length < limite; i++) {
          var s = varint(b, p.cs[i]), r = registro(b, p.cs[i] + s[1]);
          if (dentro(r[0])) out.push(r); else if (passou(r[0])) break;
        }
        return out;
      }
      if (p.tipo !== 2) throw new Error("pagina_inesperada");
      var ant = null, fila = [], parar = false;
      for (var j = 0; j < p.cs.length && !parar; j++) {
        var o = p.cs[j], filho = u32(b, o), s2 = varint(b, o + 4), rec = registro(b, o + 4 + s2[1]), k = rec[0];
        if ((ant === null || !passou(ant)) && !(k < lo)) fila.push({ pg: filho });
        if (dentro(k)) fila.push({ rec: rec });
        if (passou(k)) parar = true;
        ant = k;
      }
      if (!parar) fila.push({ pg: p.direita });
      // adianta o download das próximas páginas em paralelo (até 12)
      fila.filter(function (it) { return it.pg; }).slice(0, 12).forEach(function (it) { page(f, it.pg).catch(function () {}); });
      return fila.reduce(function (pr, it) {
        return pr.then(function () {
          if (out.length >= limite) return;
          if (it.rec) { out.push(it.rec); return; }
          return faixa(f, it.pg, lo, hi, out, limite);
        });
      }, Promise.resolve()).then(function () { return out; });
    });
  }
  function buscar(bases, arquivo, tabela, lo, hi, limite, ms) {
    return abrir(bases, arquivo, ms).then(function (f) {
      return raiz(f, tabela).then(function (r) { return faixa(f, r, lo, hi, [], limite || 1e9); });
    });
  }
  return { buscar: buscar };
})();

/* ============================================================
   Busca de empresas de saúde pelo NOME (base própria, feita com
   ferramentas/montar_busca_nomes.py a partir dos dados abertos da Receita).
   ============================================================ */
window.B4Y_NOMES = (function () {
  "use strict";
  var STOP = ("LTDA ME EPP EIRELI SA S A SS SOCIEDADE SIMPLES LIMITADA UNIPESSOAL SLU EMPRESARIA DE DA DO DAS DOS E EM PARA COM " +
    "SERVICOS SERVICO MEDICOS MEDICO MEDICA MEDICAS MEDICINA CLINICA CLINICAS CONSULTORIO CONSULTORIOS " +
    "SAUDE CENTRO INSTITUTO ASSISTENCIA ATENDIMENTO ESPECIALIDADES ESPECIALIZADA ESPECIALIZADOS HOSPITALAR DR DRA DRS DRAS").split(" ");
  var STOPSET = {}; STOP.forEach(function (w) { STOPSET[w] = 1; });
  var idxP = null;

  function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim(); }
  function prefixoDeStop(t) { return t.length < 5 && STOP.some(function (w) { return w.indexOf(t) === 0; }); }
  function cfg() {
    var c = (window.CONFIG && window.CONFIG.nomes) || {}, pg = (window.CONFIG && window.CONFIG.pgfn) || {};
    return { bases: c.bases || pg.bases || ["https://painel.back4you.com.br/"], indice: c.indice || "nomes_saude_indice.json", timeout: c.timeout || 8000 };
  }
  function indice() {
    if (idxP) return idxP;
    var c = cfg(), i = 0;
    function tenta() {
      if (i >= c.bases.length) return Promise.reject(new Error("sem_indice"));
      var base = c.bases[i++];
      return fetch(base + c.indice).then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
        .then(function (j) { j._bases = [base].concat(c.bases.filter(function (b) { return b !== base; })); return j; })
        .catch(function () { return tenta(); });
    }
    idxP = tenta().catch(function (e) { idxP = null; throw e; });
    return idxP;
  }
  function erro(cod) { var e = new Error(cod); e.codigo = cod; return e; }

  function buscar(q) {
    var toks = norm(q).split(" ").filter(function (t) { return t.length >= 2; });
    var chaves = toks.filter(function (t) { return !STOPSET[t] && !prefixoDeStop(t); }).sort(function (a, b) { return b.length - a.length; });
    if (!chaves.length) return Promise.reject(erro("generico"));
    if (chaves[0].length < 3) return Promise.reject(erro("curto"));
    // busca pelas 2 palavras mais longas ao mesmo tempo: se uma delas for rara, a lista vem completa
    var usar = chaves.filter(function (t) { return t.length >= 3; }).slice(0, 2), LIM = 1200;
    var inicio = norm(q).split(" ")[0] || "";
    return indice().then(function (idx) {
      var tarefas = [];
      usar.forEach(function (chave) {
        var lo = chave, hi = chave + "\x7f";
        idx.partes.filter(function (p) { return p.de < hi && p.ate >= lo; }).forEach(function (p) {
          tarefas.push(window.B4Y_SQL.buscar(idx._bases, p.arquivo, idx.tabela || "nome", lo, hi, LIM, cfg().timeout));
        });
      });
      return Promise.all(tarefas).then(function (lotes) {
        var vistos = {}, lista = [], muitos = false;
        lotes.forEach(function (rows) {
          if (rows.length >= LIM) muitos = true;
          rows.forEach(function (r) {
            if (vistos[r[1]]) return; vistos[r[1]] = 1;
            var nomeN = norm(r[2] + " " + r[3]), palavras = (nomeN + " " + norm(r[4])).split(" "), pontos = 0, ok = true;
            if (inicio && (norm(r[2]).indexOf(inicio) === 0 || norm(r[3]).indexOf(inicio) === 0)) pontos += 1;
            toks.forEach(function (t) {
              if (palavras.indexOf(t) >= 0) pontos += 2;
              else if (palavras.some(function (w) { return w.indexOf(t) === 0; })) pontos += 1;
              else ok = false;
            });
            if (!ok) return;
            var c = String(r[1]); while (c.length < 14) c = "0" + c;
            lista.push({ cnpj: c, razao: r[2], fantasia: r[3], local: r[4], pontos: pontos, matriz: c.slice(8, 12) === "0001" });
          });
        });
        lista.sort(function (a, b) { return (b.pontos - a.pontos) || (b.matriz - a.matriz) || (a.razao.length - b.razao.length); });
        return { itens: lista.slice(0, 8), total: lista.length, muitos: muitos && lista.length > 8, base: idx.base };
      });
    });
  }
  return { buscar: buscar, norm: norm };
})();

/* ============================================================
   Consulta ao CNES (Cadastro Nacional de Estabelecimentos de Saúde)
   pelo CNPJ, na base feita com ferramentas/montar_cnes.py.
   Junta matriz e filiais (mesma raiz de 8 dígitos).
   ============================================================ */
window.B4Y_CNES = (function () {
  "use strict";
  var idxP = null;
  // se o índice não trouxer a tabela de tipos
  var CAT_PADRAO = { 22: "consultorio", 36: "clinica", 4: "clinica", 39: "sadt", 5: "hospital", 7: "hospital", 15: "hospital", 62: "hospital_dia", 20: "urgencia", 21: "urgencia", 73: "urgencia" };
  var NOME_COD = { 1: "Posto de saúde", 2: "Unidade básica de saúde", 40: "Unidade móvel", 43: "Farmácia", 60: "Cooperativa ou empresa de profissionais de saúde",
    61: "Centro de parto normal", 70: "Centro de atenção psicossocial", 74: "Polo academia da saúde", 77: "Atenção domiciliar (home care)" };
  var SERV = { 121: "diagnóstico por imagem", 122: "exames por métodos gráficos", 142: "endoscopia", 146: "videolaparoscopia", 148: "hospital-dia",
    145: "laboratório clínico", 120: "anatomia patológica", 144: "coleta de exames", 131: "oftalmologia", 116: "cardiologia", 155: "ortopedia",
    126: "fisioterapia", 132: "oncologia", 150: "cirurgia vascular", 151: "medicina nuclear", 169: "urologia", 124: "endocrinologia",
    117: "cirurgia reparadora", 118: "cirurgia torácica", 105: "neurologia", 107: "saúde auditiva", 160: "telessaúde", 140: "urgência e emergência",

          { id: "estrategia", label: "Já te apresentaram formas legais de pagar menos imposto?", options: [["aplicamos", "Sim, e aplicamos"], ["naoaplicamos", "Sim, mas não aplicamos"], ["nunca", "Nunca"]] },

    exits: {
      pf: {
        rota: "nutrir", cta: "Quero entender",
        bot: "<p>Este diagnóstico é para quem já tem empresa.</p><p>Uma dica: só como pessoa física, o IR chega a <b>27,5%</b>. Deixe seu contato e mostramos como fica com uma PJ.</p>",

            ctaText: "Quer saber <b>quanto você pagaria</b> com uma PJ?", waText: "Olá! Atendo como pessoa física e quero entender como abrir minha PJ." };

    /* ---------- dados da Receita → respostas ---------- */
    applyCnpj: function (e, H) {
      var ans = {}, notes = {};
      if (e.natCod === "2062") { ans.sociedade = "ltda"; notes.sociedade = "Receita: " + (e.natDesc || "Sociedade Empresária Limitada") + "."; }
      else if (e.natCod === "2305") { ans.sociedade = "slu"; notes.sociedade = "Receita: " + e.natDesc + "."; }
      else if (NAT_SS.indexOf(e.natCod) >= 0) { ans.sociedade = "ss"; notes.sociedade = "Receita: " + e.natDesc + "."; }
      var ult = (e.regimes || [])[0];
      if (e.simples === true) { ans.regime = "simples"; notes.regime = "Receita: empresa no Simples Nacional."; }
      else if (ult && /PRESUMIDO/.test(ult.forma)) { ans.regime = "presumido"; notes.regime = "Receita: Lucro Presumido na última declaração (" + ult.ano + ")."; }
      else if (ult && /REAL/.test(ult.forma)) { ans.regime = "real"; notes.regime = "Receita: Lucro Real na última declaração (" + ult.ano + ")."; }
      else if (e.simples === false) notes.regime = "Receita: fora do Simples. Presumido ou Real?";
      var n = H.anos(e.abertura);
      if (n != null) { ans.tempo = n < 1 ? "menos1" : n < 3 ? "1a3" : n < 5 ? "3a5" : "5mais"; notes.tempo = "Aberta em " + H.dataBR(e.abertura) + "."; }
      if (e.socios) { ans.socios = String(Math.min(5, e.socios)); notes.socios = "Receita: " + e.socios + (e.socios === 1 ? " sócio" : " sócios") + " no cadastro."; }
      return { answers: ans, notes: notes };
    },
    applyPgfn: function (r, H) {
      if (!r.total) return { answers: { divida: "nao" }, notes: { divida: "PGFN: nada na dívida ativa da União." } };
      return { answers: { divida: "sim" }, notes: { divida: "PGFN: dívida ativa de " + H.brlK(r.total) + "." } };
    },

    applyCnes: function (r, H, e) {
      var ans = {}, notes = {};
      if (!r.encontrado) return { notes: { local: "CNES: nenhum estabelecimento cadastrado neste CNPJ." } };
      if (r.coworking) notes.local = "CNES: consultório em coworking.";
      else if (!r.desativado) {
        ans.local = "propria";
        notes.local = "CNES: cadastro como " + r.tipo.nome.toLowerCase() + (r.unidades > 1 ? " (" + r.unidades + " unidades)" : "") + ". Se também atende em outros lugares, marque \"Nos dois\".";
      }
      if (r.lic) {
        ans.licenca = r.licStatus === "vencida" ? "nao" : "sim";
        notes.licenca = "CNES: licença " + (r.licStatus === "vencida" ? "vencida em " : r.licStatus === "vencendo" ? "vence em " : "válida até ") + H.dataBR(r.lic) + (r.licParcial ? ", parcial (com restrições)" : "") + ".";
      } else notes.licenca = "CNES: sem data de validade da licença.";
      var soc = e && e.socios;
      if (r.med && soc && r.med > soc) {
        ans.quem = "socios_mais";
        notes.quem = "CNES: " + r.med + " médicos cadastrados. Na Receita, " + soc + (soc === 1 ? " sócio." : " sócios.");
      }
      if (r.v2 && r.medExternos > 0) {
        ans.terceiriza = ["medicos"];
        notes.terceiriza = "CNES: " + plural(r.medExternos, "médico contratado", "médicos contratados") + " como PJ, autônomo ou cooperado. Marque o que mais houver.";
      }
      var at = cnesAtiv(r);
      if (at.length) {
        ans.atividades = at;
      }
      return { answers: ans, notes: notes };
    },

    /* ---------- avisos ao vivo, logo abaixo da empresa ---------- */
    liveCnpj: function (a, c) {
      var e = c.emp, H = c.H, out = [];
      if (!e) return out;
      if (e.situacao && !/ativa/i.test(e.situacao)) out.push({ id: "rf_sit", mais: true, level: "bad", tag: "Receita", html: "CNPJ com situação <b>" + H.esc(e.situacao.toLowerCase()) + "</b>" + (e.motivo && !/sem motivo/i.test(e.motivo) ? " (" + H.esc(e.motivo.toLowerCase()) + ")" : "") + ". Isso trava notas e certidões." });
      if (e.mei) out.push({ id: "rf_mei", mais: true, level: "bad", tag: "Receita", html: "A empresa aparece como <b>MEI</b>. Atividade médica não pode ser MEI." });
      if (e.cnae && !/^86/.test(e.cnae)) out.push({ id: "rf_cnae", mais: true, level: "warn", tag: "Receita", html: "A atividade principal <b>não é da área da saúde</b> (" + H.esc(e.cnaeDesc) + ")." });
      if (NAT_SS.indexOf(e.natCod) >= 0) out.push({ id: "rf_ss", level: "", tag: "Receita", html: "<b>Sociedade simples</b>. Combina com atuação pessoal dos sócios (ISS fixo). Com estrutura de empresa, pode perder benefícios." });
      if (e.regimes && e.regimes.length) {
        var anosP = e.regimes.filter(function (r) { return /PRESUMIDO/.test(r.forma); }).map(function (r) { return r.ano; }).sort();
        if (anosP.length) out.push({ id: "rf_pres", level: "", tag: "Receita", html: "Lucro Presumido declarado em <b>" + anosP.join(", ") + "</b>." });
      }
      var g = c.pg;
      if (g && g.total > 0) {
        var ab = (g.cats.c || 0) + (g.cats.p || 0) + (g.cats.j || 0) + (g.cats.r || 0);
        out.push({ id: "pgfn", mais: true, level: ab > 0 ? "bad" : "warn", tag: "Dívida ativa (PGFN)", html: "Identificamos <b>débitos na PGFN acima de " + H.brlK(acima(g.total)) + "</b>, em " + g.inscricoes + (g.inscricoes === 1 ? " inscrição" : " inscrições") +
          (ab > 0 ? ", parte em aberto." : ", negociados ou suspensos.") + " Dá para negociar." });
      } else if (g) {
        out.push({ id: "pgfn0", level: "good", tag: "Dívida ativa (PGFN)", html: "<b>Nenhuma dívida ativa</b> na União. Ótimo!" });
      }
      var n = c.cn;
      if (n && n.encontrado) {
        var eq = [];
        if (n.prof) eq.push("<b>" + n.prof + (n.prof === 1 ? " profissional" : " profissionais") + "</b>" + (n.med && n.med < n.prof ? " (" + n.med + (n.med === 1 ? " médico" : " médicos") + ")" : n.med && n.med === n.prof ? (n.med === 1 ? ", médico" : ", todos médicos") : ""));
        if (n.equip) eq.push("<b>" + n.equip + (n.equip === 1 ? " equipamento" : " equipamentos") + "</b>");
        var det = [];
        var sl = cnesSalas(n), md = cnesMedicos(n), cv = cnesConv(n), fu = cnesFunc(n);
        if (sl) det.push("<b>Salas:</b> " + sl);
        if (md) det.push("<b>Médicos:</b> " + md + (n.especialidades.length ? " (" + H.esc(n.especialidades.slice(0, 3).join(", ")) + ")" : ""));
        else if (n.v2 && n.especialidades.length) det.push("<b>Especialidades:</b> " + H.esc(n.especialidades.slice(0, 3).join(", ")));
        if (cv) det.push("<b>Atende:</b> " + cv);
        if (n.v2 && n.servicos.length) det.push("<b>Serviços:</b> " + lista(n.servicos.slice(0, 3).map(function (x) { return x.nome; })));
        if (fu) det.push("<b>Funciona:</b> " + fu);
        if (n.v2 && n.coworking) det.push("<b>Em coworking</b>");
        var pl = ansPlanos(n);
        if (pl) det.push("<b>Planos (ANS):</b> " + pl + (n.planos.nomes.length ? " (" + H.esc(n.planos.nomes.join(", ")) + ")" : ""));
        out.push({ id: "cnes", mais: n.desativado, level: n.desativado ? "warn" : "", tag: "CNES", html: (n.desativado ? "Cadastro <b>desativado</b>. " : "") + "<b>" + H.esc(n.tipo.nome) + "</b>" +
          (n.unidades > 1 ? " (" + n.unidades + " unidades)" : "") + (eq.length ? " com " + eq.join(" e ") : "") + "." +
          (det.length ? '<span class="cn-det">' + det.join("<br>") + "</span>" : "") });
        if (n.licStatus === "vencida") out.push({ id: "lic_venc", mais: true, level: "bad", tag: "Licença sanitária", html: "No CNES, a licença <b>venceu em " + H.dataBR(n.lic) + "</b>. Vale conferir e manter os prazos sob controle." });
        else if (n.licStatus === "vencendo") out.push({ id: "lic_vence", mais: true, level: "warn", tag: "Licença sanitária", html: "No CNES, a licença <b>vence em " + H.dataBR(n.lic) + "</b>. Hora de preparar a renovação." });
        if (n.acreditacao) out.push({ id: "acred", level: "good", tag: "Acreditação", html: "Estabelecimento <b>acreditado</b> (" + H.esc(n.acreditacao) + ")." });
        if (n.licParcial && n.licStatus !== "vencida" && n.licStatus !== "vencendo") out.push({ id: "lic_parc", mais: true, level: "warn", tag: "Licença sanitária", html: "No CNES, a licença é <b>parcial, com restrições</b>. Vale saber o que falta para a licença total." });
      } else if (n) {
        out.push({ id: "cnes0", level: "", tag: "CNES", html: "Não achei <b>cadastro no CNES</b> para este CNPJ. Quem atende em espaço próprio precisa ter." });
      }
      return out;
    },

    /* ---------- o que já percebemos (entre as etapas) ---------- */
    insights: function (prev, a, c) {
      var P = perfil(a, c), out = [];
      if (prev === "estrutura") {
        if (P.modo === "empresarial") out.push({ level: "", tag: "Seu perfil", html: "<b>Estrutura de empresa</b>: equipe, terceiros e custos." + (P.proc ? " Com procedimentos, <b>combina com a redução de IR e CSLL</b>." : "") });
        if (P.modo === "pessoal") out.push({ level: "", tag: "Seu perfil", html: "<b>Atuação pessoal dos sócios</b>. Esse perfil <b>combina com o ISS fixo</b>." });
        if (P.modo === "misto") out.push({ level: "", tag: "Seu perfil", html: "Perfil <b>misto</b>: os sócios atendem pessoalmente, mas com estrutura. Vou olhar os dois caminhos." });
      }
      return out;
    },

    /* ---------- migalhas: achados que aparecem no meio da conversa ---------- */
    migalhas: function (a, c) {
      var H = c.H, P = perfil(a, c), f = c.feito || {}, out = [], cn = c.cn, CN = cn && cn.encontrado ? cn : null, g = c.pg;
      function m(id, level, tag, html, mais) { out.push({ id: id, level: level, tag: tag, html: html, mais: mais !== false }); }
      // empresa
      if (f.empresa) {
        if (a.pj === "ambos") m("pf", "warn", "Anotei", "Atender também como <b>pessoa física</b> pode custar até <b>27,5% de IR</b> nessa parte.");
        if (a.regime === "simples" && ACIMA30.indexOf(a.fat) >= 0) m("simples30", "warn", "Anotei", "No <b>Simples acima de R$ 30 mil por mês</b>, outro regime costuma sair mais barato.");
        if (a.regime === "naosei") m("regime", "warn", "Anotei", "Sem saber o regime, fica difícil saber <b>se você paga o imposto certo</b>.");
      }
      // dia a dia
      if (f.rotina) {
        if (P.faltaCnae.length) m("cnae", "warn", "Algo não bate", "O CNPJ <b>não tem atividade (CNAE)</b> para: " + P.faltaCnae.map(function (x) { return ATIV_TXT[x].toLowerCase(); }).join(", ") + ".");
        if (P.proc && semSalaProc(cn)) m("sala", "warn", "Algo não bate", "Você faz procedimentos, mas o <b>CNES não mostra sala</b> de cirurgia ou de pequena cirurgia.");
        if (CN && CN.v2 && a.quem === "socios" && CN.medExternos > 0) m("medext", "warn", "Algo não bate", "Você disse que só os sócios atendem, mas o CNES tem <b>" + plural(CN.medExternos, "médico contratado", "médicos contratados") + "</b>.");
      }
      // estrutura
      if (f.estrutura) {
        if (P.ss && P.modo === "empresarial") m("ss_emp", "bad", "Algo não bate", "<b>Sociedade simples com estrutura de empresa.</b> Esse formato pode perder a redução de IR e CSLL.");
        if (P.ltda && P.modo === "pessoal") m("ltda_pes", "warn", "Algo não bate", "<b>LTDA com atuação pessoal.</b> Em muitas cidades, o ISS fixo é negado para LTDA.");
        if (CN && CN.licStatus === "vencida" && a.licenca === "sim") m("lic_nb", "warn", "Algo não bate", "Você marcou a licença em dia, mas <b>no CNES ela venceu em " + H.dataBR(CN.lic) + "</b>.");
        if (CN && CN.estrutura && P.modo === "pessoal") m("cnes_estr", "warn", "Algo não bate", "No CNES, a empresa aparece como <b>" + H.esc(CN.tipo.nome.toLowerCase()) + "</b>" + (CN.prof ? ", com " + CN.prof + " profissionais" : "") + ". Vale conferir se a atuação é só pessoal.");
        if (cn && !cn.encontrado && (a.local === "propria" || a.local === "ambos")) m("sem_cnes", "warn", "CNES", "Você atende em espaço próprio, mas <b>não achei cadastro no CNES</b>.");
        if (!CN && (a.licenca === "nao" || a.licenca === "naosei")) m("lic", "warn", "Anotei", "Licença sanitária <b>sem controle</b>. Ela pesa na redução de IR e CSLL.");
      }
      // dinheiro
      var K = calcular(a, c);
      if (f.procedimentos && K.eq) m("eq", "good", "Oportunidade", "Pela redução de IR e CSLL, pode haver <b>até " + H.brlK(K.eq.hi * 12) + " por ano</b>" +
        (K.retroHi > 0 ? " e <b>até " + H.brlK(K.retroHi) + "</b> para recuperar do passado" : "") + (K.eq.ss ? ", depois de ajustar a estrutura" : "") + ".");
      if (f.procedimentos && a.equip === "sim" && a.notas === "generico") m("notas", "warn", "Atenção", "Nota com só \"serviços médicos\" <b>enfraquece a redução</b> que você já usa.");
      if (f.iss && K.iss) m("iss", "warn", "Oportunidade", "O ISS pode estar custando <b>até " + H.brlK(K.iss.hi * 12) + " por ano</b>. Com o seu perfil, vale avaliar o ISS fixo.");
      if (f.iss && P.ss && a.iss === "percentual" && a.mesmaprof === "sim") m("iss_ss", "bad", "Algo não bate", "<b>Sociedade de médicos, atuação pessoal e ISS em %.</b> Esse é o perfil típico do ISS fixo.");
      if (f.simples && K.simples) m("simples", "warn", "Oportunidade", "Fora do Simples, a conta pode cair <b>até " + H.brlK(K.simples.hi * 12) + " por ano</b>.");
      // regularidade
      if (f.regularidade) {
        if (a.certidao === "nao" || a.certidao === "asvezes") m("cnd", "bad", "Atenção", "Sem certidão em dia, a empresa pode <b>perder contratos com hospitais e convênios</b>.");
        if (a.notificacao === "sim") m("notif", "bad", "Atenção", "Notificação tem <b>prazo para responder</b>. Se passar, a multa pode chegar a <b>75%</b>.");
        if (a.divida === "sim" && !(g && g.total > 0)) m("divida", "bad", "Anotei", "Imposto em atraso gera <b>multa e juros todo mês</b>. Dá para negociar.");
        if (a.guias === "nodia") m("guias", "warn", "Anotei", "Guia chegando <b>no dia</b> aumenta o risco de <b>multa de até 20%</b>.");
      }
      // retiradas
      if (f.retiradas) {
        var d = K.dist;
        if (d && d.retMes > 0) m("ret_mes", "bad", "Atenção", "Com esse lucro, há <b>IR retido todo mês</b>: cerca de " + H.brlK(d.retMes) + " por ano.");
        else if (d && d.evitavel > 0 && a.distribuicao !== "planejada") m("ret", "warn", "Oportunidade", "Distribuindo o lucro de uma vez, <b>" + H.brlK(d.retAno) + " por ano</b> ficariam retidos na fonte. Com planejamento, dá para evitar.");
        if (a.prolabore !== "fixo") m("prolab", "warn", "Anotei", "Retirar \"quando precisa\", sem pró-labore definido, <b>mistura as contas</b> e esconde o lucro real.");
        if (d && d.aliq > 0) m("irpfm", "warn", "Atenção", "Com essa renda, você pode entrar no <b>IRPF mínimo</b>, de até 10%.");
        if (a.lucro === "naosei") m("lucro", "warn", "Anotei", "Não saber o <b>lucro do mês</b> é o primeiro ponto a resolver.");
      }
      // acompanhamento
      if (f.acompanhamento) {
        var pontos = [["anual", "soproblema", "nunca"].indexOf(a.conversa) >= 0, a.acesso === "nao", a.relatorio === "nao", a.centro === "nao",
          a.resposta === "demora", a.estrategia === "nunca" || a.estrategia === "naoaplicamos", a.reforma === "nao"].filter(Boolean).length;
        if (pontos >= 2) m("acomp", pontos >= 4 ? "bad" : "warn", "Acompanhamento", "Achei <b>" + pontos + " pontos</b> para melhorar no acompanhamento da sua contabilidade.");
        else if (pontos === 0) m("acomp_ok", "good", "Acompanhamento", "Seu acompanhamento está <b>bem estruturado</b>. Bom sinal!", false);
      }
      return out;
    },

    /* ---------- análise completa ---------- */
    analisar: function (a, c) {
      var H = c.H, K = calcular(a, c), P = K.P, e = c.emp, g = c.pg;
      var al = [], pen = { imp: 0, cad: 0, reg: 0, ret: 0, ges: 0 };
      function add(p, v, level, title, text) { if (p) pen[p] += v; if (title) al.push({ level: level, title: title, text: text }); }
      var pgAberto = g ? (g.cats.c || 0) + (g.cats.p || 0) + (g.cats.j || 0) + (g.cats.r || 0) : 0;

      // cadastro e estrutura
      if (e && e.situacao && !/ativa/i.test(e.situacao)) add("cad", 45, "bad", "CNPJ " + H.esc(e.situacao.toLowerCase()) + " na Receita", (e.motivo && !/sem motivo/i.test(e.motivo) ? "Motivo: <b>" + H.esc(e.motivo.toLowerCase()) + "</b>. " : "") + "Trava notas e certidões. <b>Regularize antes de tudo.</b>");
      if (e && e.mei) add("cad", 40, "bad", "Empresa como MEI", "Atividade médica <b>não pode ser MEI</b>. É preciso mudar o enquadramento.");
      if (e && e.cnae && !/^86/.test(e.cnae)) add("cad", 15, "warn", "Atividade principal fora da saúde", "O CNAE principal é <b>" + H.esc(e.cnaeDesc) + "</b>. Isso afeta benefícios e o ISS.");
      if (P.faltaCnae.length) add("cad", Math.min(30, 10 * P.faltaCnae.length), "warn", "CNPJ sem atividade para o que você faz", "Faltam CNAEs para: <b>" + P.faltaCnae.map(function (x) { return ATIV_TXT[x]; }).join(", ") + "</b>. Nota sem CNAE correspondente pode gerar <b>autuação</b> e travar benefícios.");
      if (P.ss && P.modo === "empresarial") add("cad", 30, "bad", "Sociedade simples com estrutura de empresa", "Esse formato <b>perde a redução de IR e CSLL</b> e pode ter o ISS fixo questionado. Vale ajustar a estrutura.");
      if (P.ss && a.mesmaprof === "nao") add("cad", 15, "warn", "Sociedade simples com sócios de outras profissões", "O ISS fixo costuma exigir <b>sócios da mesma profissão</b>.");
      if (P.ltda && P.modo === "pessoal" && a.iss !== "fixo") add("cad", 5, "info", "LTDA com atuação pessoal", "Em muitas cidades, o ISS fixo é negado para LTDA. <b>Vale comparar os formatos.</b>");
      if (a.sociedade === "naosei") add("cad", 10, "info", "Tipo de empresa desconhecido", "Está no <b>cartão CNPJ</b>, em \"natureza jurídica\".");
      var cn = c.cn, CN = cn && cn.encontrado ? cn : null, organizado = "Mantenha tudo <b>organizado, arquivado e com prazos controlados</b>, com alguém te ajudando a gerir.";

    try { var p = JSON.parse(de64url(m[1])); return p && p.a ? p : null; } catch (e) { return null; }
  }
  function modoRelatorio(p) {
    document.body.classList.remove("chat");
    state.answers = p.a; state.exit = p.x || null; state.lead = { nome: p.n || "", email: "", tel: "" };
    state.relatorio = p;
    frame('<div class="carregando"><span class="spin"></span><p>Carregando o seu <b>diagnóstico completo</b>…</p><p class="small">Estamos consultando de novo a Receita, a dívida ativa e o CNES.</p></div>');
    var emp = p.c ? consultarCnpj(p.c).catch(function () {
      return empresaDaLista({ cnpj: p.c, razao: p.r || "", fantasia: p.f || "", local: p.l || "" });
    }) : Promise.resolve(null);
    emp.then(function (e) {
      if (!e) return;
      state.empresa = e;
      return Promise.all([iniciaPgfn(e), iniciaCnes(e)]);
    }).catch(function () {}).then(function () {
      state.R = state.exit ? D.exits[state.exit].result(state.answers, ctx()) : D.analisar(state.answers, ctx());
      state.screen = "result";
      renderResult(); top();
      track("relatorio_aberto", { dias: p.t ? Math.floor((Date.now() - p.t) / 864e5) : null });
    });
  }
  function render() {
    if (state.screen === "result") renderResult();
    else iniciaChat();
  }
  var rel = lerRelatorio();
  if (rel) { modoRelatorio(rel); return; }
  render();
})();
