<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Guia nova por padrão: link clicado não tira o colaborador de onde ele estava. -->
<base target="_blank">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendário de clientes ativos — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Duas origens porque o /exec responde 302 para a segunda: sem isto o aparelho paga
     DNS+TLS duas vezes antes do primeiro byte de dado. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- A fonte não pode segurar a primeira pintura: entra como preload e vira folha depois. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"></noscript>
<style>
:root{
  /* Paleta canonica da equipe — a mesma em todas as telas. */
  --canvas:#F1E7DC;--surface:#FFFFFF;--surface-warm:#FBF6EF;
  --ink:#113D39;--ink-2:#3F5854;--muted:#6E6256;--line:#E4D9C9;--line-2:#D6C3AC;
  --brand-dark:#073034;--brand-teal:#0F8C85;--brand-euc:#3FA680;
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,37:1 no canvas).
     Este e o mesmo teal escurecido so para letra e fundo de letra; o --brand-teal
     segue canonico em logo, foco, bordas e preenchimentos. */
  --brand-teal-txt:#0C756F;
  --amber:#E8892E;--amber-txt:#8A5A10;--amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber da 2,61:1 com #fff, o --amber-2 da 4,68:1. Como
     preenchimento de barra, icone ou borda, o --amber original continua valendo. */
  --amber-2:#B05F12;
  --vermelho:#C0392B;--verde:#2E9D5F;--verde-2:#25804C;
  /* Raios: so pelos tokens — 10 em campo, 12 padrao, 16 nos blocos grandes, pilula. */
  --radius-sm:10px;--radius:12px;--radius-lg:16px;--radius-pill:999px;
  /* Levantar de cartao clicavel: uma sombra so, igual em todas as telas. */
  --lift:0 8px 20px rgba(17,61,57,.10);
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.barra{position:sticky;top:0;z-index:50;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:var(--radius-pill)}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd}.barra a.volta{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding:18px 20px 80px}
.toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-pill);padding:3px;margin-bottom:12px}
.toggle button{font-family:var(--sans);font-size:13px;font-weight:700;border:none;background:none;color:var(--ink-2);padding:8px 16px;border-radius:var(--radius-pill);cursor:pointer}
.toggle button.on{background:var(--brand-teal-txt);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-family:var(--sans);line-height:1.5;font-size:13px;font-weight:700;border-radius:var(--radius-pill);padding:6px 12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip.on{background:var(--brand-euc);border-color:var(--brand-euc);color:#fff}
.busca{width:100%;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.resumo-top{background:linear-gradient(135deg,rgba(15,140,133,.12),rgba(63,166,128,.07));border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0 14px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.resumo-top .big{font-size:24px;font-weight:800;color:var(--brand-teal);line-height:1}
.resumo-top .lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:var(--radius-pill);padding:12px 20px}
.dica{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- revelacao progressiva ---------- */
/* Régua de ações: busca sempre à mão, filtros a um clique, contagem à vista.
   Antes os nove chips de produto e de atalho ficavam abertos acima do calendário —
   quem chegava lia a fileira inteira antes de olhar o número que veio buscar. */
.barra-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.barra-acoes .campo-busca{flex:1;min-width:200px;font-size:16px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink)}
.barra-acoes .campo-busca:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.btn-filtros{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--ink);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.btn-filtros:hover{border-color:var(--brand-teal)}
.btn-filtros[aria-expanded="true"]{background:#EAF4F1;border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.btn-filtros svg{width:15px;height:15px;flex:none}
.cont-filtros{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:var(--radius-pill);background:var(--brand-teal-txt);color:#fff;
  font-size:11px;font-weight:800}
/* display:inline-flex ganha do atributo hidden — sem esta linha o selo mostrava
   um "0" permanente ao lado de Filtros. */
.cont-filtros[hidden]{display:none}
.resumo-lista{font-size:13px;color:var(--ink-2);white-space:nowrap}
/* Três números não cabem numa linha só no celular; sem isto o nowrap do contrato
   empurraria a página para o lado. */
@media(max-width:560px){.resumo-lista{white-space:normal}}
.painel-filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
  padding:14px 16px;margin:0 0 14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-warm)}
.painel-filtros[hidden]{display:none}
/* Cada grupo ocupa a fileira inteira: Produto e Atalhos não se misturam. */
.painel-filtros .grupo{width:100%;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.painel-filtros .grupo .rot{font-size:11px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted);margin-right:2px}
.btn-limpar{min-height:38px;padding:0 15px;border-radius:var(--radius-pill);border:1px dashed var(--line-2);
  background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.btn-limpar:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.lista-mais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.lista-mais button{min-height:44px;padding:0 18px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--brand-teal-txt);
  font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.lista-mais button:hover{border-color:var(--brand-teal);background:#EAF4F1}
.lista-mais .btn-todos{background:transparent;color:var(--ink-2);font-weight:600}
/* Dentro do dropdown o rodapé é rodapé mesmo: encostado na borda, fora das duas
   colunas da lista, senão ele viraria mais um item no meio dos clientes. */
.drop .lista-mais{margin:0;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-warm)}
/* calendário */
.legenda{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;margin:2px 2px 12px;flex-wrap:wrap}
/* Amostra de cor: uma classe só no painel inteiro (§7) — antes cada tela tinha
   o seu tamanho. O fio branco fica só aqui, porque o passo mais claro da rampa
   é quase a cor do fundo e sem borda a legenda começaria do nada. */
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}
.legenda .sw{border:1px solid var(--line)}
.legenda .sep{opacity:.6}
.ano{margin-bottom:16px}
.ano-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 7px}
.ano-n{font-size:19px;font-weight:800;letter-spacing:.01em}
.ano-meta{font-size:12px;color:var(--muted);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.mcard{font-family:var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:9px 4px 8px;min-height:64px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center;transition:transform .12s ease,box-shadow .12s ease}
/* Cartão clicável levanta sempre igual (--lift), como nas telas irmãs. */
.mcard:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.mcard:focus-visible{outline:2px solid var(--brand-dark);outline-offset:2px}
.m-nome{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.m-n{font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.m-d{font-size:11px;font-weight:700;line-height:1.2}
.m-d.up{color:#2E7D52}.m-d.dn{color:var(--vermelho)}
.mcard.n0{background:var(--surface-warm);color:var(--muted);border-style:dashed}
.mcard.n1{background:#E4F1ED;border-color:#D3E7E1}
.mcard.n2{background:#C2E2D9;border-color:#AFD8CD}
.mcard.n3{background:#8FCCBF;border-color:#7CC0B2}
.mcard.n4{background:var(--brand-euc);border-color:#379473;color:#fff}
.mcard.n5{background:var(--brand-teal-txt);border-color:#0A625D;color:#fff}
.mcard.n4 .m-d,.mcard.n5 .m-d{color:#fff;opacity:.9}
.mcard.atual{outline:2px solid var(--amber);outline-offset:-2px}
.mcard.sel{border-color:var(--brand-dark);box-shadow:0 0 0 3px rgba(7,48,52,.22)}
.mcard.futuro{background:transparent;border:1px dashed var(--line-2);color:#C6BAAB;cursor:default}
.mcard.futuro:hover{transform:none;box-shadow:none}
.drop{margin-top:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:0 6px 20px rgba(7,48,52,.10);overflow:hidden}
.d-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-warm);border-bottom:1px solid var(--line)}
.d-h b{font-size:15px;text-transform:capitalize}
.d-cnt{font-size:12px;color:var(--muted);font-weight:700}
.d-x{margin-left:auto;border:none;background:none;font-size:19px;line-height:1;color:var(--muted);cursor:pointer;font-family:var(--sans);padding:0 4px}
.d-x:hover{color:var(--ink)}
.d-lista{max-height:360px;overflow:auto;padding:8px 14px 12px}
@media(min-width:780px){.d-lista{columns:2;column-gap:26px}}
.d-item{padding:6px 0;border-bottom:1px dashed var(--line);break-inside:avoid}
.d-linha{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.d-prod{font-size:11px;color:var(--muted);margin-top:1px}
/* entradas e saídas do mês, dentro do dropdown */
.d-mov{display:flex;gap:16px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px dashed var(--line);background:#FCFAF6}
.mv{flex:1 1 210px;min-width:190px}
.mv-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.mv.ent .mv-h{color:#2E7D52}.mv.sai .mv-h{color:var(--vermelho)}
.mv-h span{background:rgba(0,0,0,.06);border-radius:var(--radius-pill);padding:1px 7px;margin-left:5px;font-size:11px;color:var(--ink-2)}
.mv-l{display:flex;flex-direction:column;gap:2px}
.mv-i{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.mv-q{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px;white-space:nowrap}
/* chips de atalho + painel que eles abrem */
.chips.atalhos{margin-top:-3px}
.chip .n{background:rgba(0,0,0,.10);border-radius:var(--radius-pill);padding:1px 7px;margin-left:5px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
/* Branco sobre --amber da 2,61:1: o rotulo do filtro ativo some justamente quando
   ele esta ligado. --amber-2, mesma familia um degrau mais escura: 4,68:1. */
.chip.atalho.on{background:var(--amber-2);border-color:var(--amber-2);color:#fff}
.painel{margin-top:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:0 6px 20px rgba(7,48,52,.10);overflow:hidden}
/* +entraram / −saíram na tampa do card do mês */
.m-d b{font-weight:800}
.m-d .up{color:#2E7D52}.m-d .dn{color:var(--vermelho)}
.mcard.n4 .m-d b,.mcard.n5 .m-d b{color:#fff}
@media(max-width:1000px){.cal{grid-template-columns:repeat(6,1fr)}}
@media(max-width:560px){.cal{grid-template-columns:repeat(4,1fr)}}
@media(max-width:360px){.cal{grid-template-columns:repeat(3,1fr)}}
/* por cliente */
.cli{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cli-main{flex:1;min-width:220px}
.cli-nome{font-weight:700;font-size:15px}
.cli-prod{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pchip{font-size:11px;font-weight:700;border-radius:var(--radius-sm);padding:2px 7px;background:#EAF4F1;color:#0c6b64;border:1px solid #cfe6e2}
.cli-datas{text-align:right;font-size:13px;color:var(--ink-2);white-space:nowrap}
.bdg{font-size:11px;font-weight:800;border-radius:var(--radius-sm);padding:3px 8px;display:inline-block}
.bdg.ativo{background:#E7F4EC;color:#2E7D52}
.bdg.enc{background:#F2ECE4;color:var(--muted)}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:46vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:48ch}.state code{background:var(--surface-warm);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}

/* ---------- padroes compartilhados (B.10 e B.12) ---------- */
/* Foco de teclado sempre visivel — quem navega por Tab precisa ver onde esta. */
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}
/* A barra nunca estoura: quebra de linha e o contador some no celular. */
.barra{flex-wrap:wrap}
@media(max-width:560px){.barra .cnt{display:none}}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="barra">
  <a class="logo" id="logo-home" href="colaborador.html" target="_self" title="Voltar para o painel do colaborador">back<span class="y">4you</span></a>
  <span class="tag">Calendário de clientes ativos</span>
  <span class="spacer"></span>
  <span class="cnt" id="cnt"></span>
  <a class="volta" id="volta" href="colaborador.html" target="_self">← Painel</a>
</div>
<div id="app"><div class="state"><div class="spin"></div><p>Carregando registros…</p></div></div>

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
const CHAVE_PADRAO='b4u-equipe-2026';
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MES_LONGO=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const INICIO_ANO=2025, INICIO_MES=5;   // maio/2025
const MAX_ANOS=15;                     // trava de segurança contra data estranha
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');const h=(location.hash||'').replace('#','').trim();return q||h||CHAVE_PADRAO;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
function jsonpAviso(txt){
  const p = document.getElementById('espera-txt')
       || document.querySelector('#app .state p')
       || document.querySelector('.state p');
  if(p) p.textContent = txt;
}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. Enquanto
   espera, a tela diz que ainda estamos buscando — erro só se a segunda também falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    if(typeof pararEspera === 'function'){ try{ pararEspera(); }catch(_){} }
    jsonpAviso('Ainda estou buscando — tentando de novo…');
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}

function parseYM(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  let m=s.match(/^(\d{4})-(\d{1,2})/);if(m)return idxYM(+m[1],+m[2]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return idxYM(+m[3],+m[2]);
  m=s.toLowerCase().match(/([a-zç]{3})[a-zç.]*\/?\s*(\d{4})/);if(m){const mi=MES.indexOf(m[1]);if(mi>=0)return idxYM(+m[2],mi+1);}
  return null;
}
function idxYM(y,mo){return y*12+(mo-1);}
function labelIdx(idx){const y=Math.floor(idx/12),mo=idx%12;return MES[mo]+'/'+y;}
function labelLongo(idx){const y=Math.floor(idx/12),mo=idx%12;return MES_LONGO[mo]+' de '+y;}

let CLIENTES=[],PRODUTOS=[],VIEW='calendario',PROD='',ENDIDX=0,STARTIDX=0,CALSTART=0,MESES_DADOS={},TERMO='';
let ENTRADAS={},SAIDAS={},ATALHO='';
/* ---------- visão no endereço (C.10) ----------
   F5 (ou mandar o link) volta para a mesma aba, produto, atalho e busca.
   Mexemos só nesses parâmetros — chave e #hash ficam intactos. */
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    set('q',TERMO);
    set('view',VIEW==='calendario'?'':VIEW);
    set('prod',PROD);
    set('atalho',ATALHO);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  VIEW=p.get('view')==='cliente'?'cliente':'calendario';
  PROD=p.get('prod')||'';
  ATALHO=p.get('atalho')||'';
  TERMO=p.get('q')||'';
}
function carregar(){
  return jsonp(API_URL+'?tipo=ativos_equipe&chave='+encodeURIComponent(chaveAtual()))
    .then(d=>{if(d.erro)throw new Error(d.erro);
      CLIENTES=(d.clientes||[]).map(c=>{
        const pi=parseYM(c.inicio), pf=parseYM(c.fim);
        /* fimIdx  = ÚLTIMA COMPETÊNCIA em que o cliente foi atendido (ele conta
                     como ativo nesse mês).
           saidaIdx = o mês em que ele DEIXA de contar — o seguinte.
           Os dois são coisas diferentes e antes estavam no mesmo número: a baixa
           aparecia no último mês trabalhado, competindo com a própria presença
           dele na lista daquele mês. Última competência jul/26 significa ativo em
           julho e −1 em agosto. */
        return {id:c.id,nome:c.nome,produtos:c.produtos,prodList:String(c.produtos||'').split(',').map(x=>x.trim()).filter(Boolean),
                iniIdx:pi,fimIdx:pf,saidaIdx:(pf==null?null:pf+1),inicio:c.inicio,fim:c.fim};
      });
      PRODUTOS=d.produtos||[];
      const now=new Date();ENDIDX=idxYM(now.getFullYear(),now.getMonth()+1);STARTIDX=idxYM(INICIO_ANO,INICIO_MES);
      CALSTART=calcularInicioCalendario();
      lerURL();                       // a visão vem do endereço (C.10)
      render();})
    .catch(e=>{document.getElementById('app').innerHTML=`<div class="state"><h1>Não consegui carregar</h1><p>${esc(e.message||e)}</p><p>Confira a <code>chave</code> e se o Web App foi republicado com <code>EquipeAtivos.gs</code>.</p></div>`;});
}
const PROD_PANEL=['Contabilidade','Controladoria'];   // universo do painel (só estes)
function noUniverso(c){return c.prodList.some(p=>PROD_PANEL.indexOf(p)>=0);}
function combinaProduto(c){ if(!noUniverso(c))return false; if(!PROD)return true; return c.prodList.indexOf(PROD)>=0; }
function ativoEm(c,M){return c.iniIdx!=null && c.iniIdx<=M && (c.fimIdx==null || M<=c.fimIdx);}
// primeiro mês com movimento: menor início do universo (ignora datas antes de 2000), nunca depois da competência
function calcularInicioCalendario(){
  const piso=idxYM(2000,1);
  let menor=STARTIDX;
  CLIENTES.filter(noUniverso).forEach(c=>{ if(c.iniIdx!=null&&c.iniIdx>=piso&&c.iniIdx<menor)menor=c.iniIdx; });
  const limite=idxYM(Math.floor(ENDIDX/12)-(MAX_ANOS-1),1);
  if(menor<limite)menor=limite;
  if(menor>ENDIDX)menor=ENDIDX;
  return menor;
}
function anoIni(){return Math.floor(CALSTART/12);}
function anoFim(){return Math.floor(ENDIDX/12);}

const RAMPA=['var(--surface-warm)','#E4F1ED','#C2E2D9','#8FCCBF','var(--brand-euc)','var(--brand-teal)'];
function nivel(q,max){ if(!q)return 0; const r=q/(max||1); return r>0.85?5:r>0.65?4:r>0.45?3:r>0.25?2:1; }
function porNome(a,b){return normTxt(a.nome||a.id).localeCompare(normTxt(b.nome||b.id));}

/* ---------- atalhos ----------
   Três perguntas que o calendário não responde de bate-pronto. A regra de
   competência é a mesma da página: entrou no mês do início; a última competência
   ainda conta como ativo e a baixa cai no mês SEGUINTE. "Últimos 3 meses" = a
   competência atual e as duas anteriores; "últimos 12" segue a mesma ideia.
   "Sem data de início" é o caso que nunca aparece em contagem nenhuma — por
   isso passa despercebido. */
const ATALHOS=[
  {k:'ent3',rot:'Entraram nos últimos 3 meses',
   fn:c=>c.iniIdx!=null&&c.iniIdx>=ENDIDX-2&&c.iniIdx<=ENDIDX,
   ord:(a,b)=>(b.iniIdx-a.iniIdx)||porNome(a,b),
   quando:c=>'entrou em '+labelIdx(c.iniIdx),
   vazio:'Ninguém entrou nas últimas três competências.'},
  /* A janela vai até ENDIDX+1 de propósito: quem tem a competência atual como
     última já está de saída, e some da contagem no mês que vem. É a informação
     mais útil da lista — e some dela se a janela parar na competência de hoje. */
  {k:'sai12',rot:'Saídas dos últimos 12 meses',
   fn:c=>c.saidaIdx!=null&&c.saidaIdx>=ENDIDX-11&&c.saidaIdx<=ENDIDX+1,
   ord:(a,b)=>(b.saidaIdx-a.saidaIdx)||porNome(a,b),
   quando:c=>(c.saidaIdx>ENDIDX?'sai em ':'saiu em ')+labelIdx(c.saidaIdx)+
             ' · última competência '+labelIdx(c.fimIdx),
   vazio:'Nenhuma saída nas últimas doze competências.'},
  {k:'semini',rot:'Sem data de início',
   fn:c=>c.iniIdx==null,
   ord:porNome,
   quando:()=>'fora de toda contagem',
   vazio:'Todo mundo tem data de início 🎉'}
];
function contarAtalho(a){return CLIENTES.filter(c=>combinaProduto(c)&&a.fn(c)).length;}
function viewAtalho(termo){
  const a=ATALHOS.find(x=>x.k===ATALHO);
  if(!a)return '';
  const alvo=normTxt(termo);
  const arr=CLIENTES.filter(c=>combinaProduto(c)&&a.fn(c)&&(!alvo||normTxt((c.id||'')+' '+(c.nome||'')).includes(alvo))).sort(a.ord);
  const itens=arr.map(c=>{
    const linha=(c.id?esc(c.id)+' · ':'')+esc(c.nome||'(sem nome)');
    const prod=c.produtos?`<div class="d-prod">${esc(c.produtos)}</div>`:'';
    return `<div class="d-item"><div class="d-linha">${linha}<span class="mv-q">${esc(a.quando(c))}</span></div>${prod}</div>`;
  }).join('')||`<div class="dica" style="padding:4px 0">${esc(alvo?'Nada com essa busca.':a.vazio)}</div>`;
  return `<div class="painel"><div class="d-h"><b>${esc(a.rot)}</b><span class="d-cnt">${arr.length} ${arr.length===1?'cliente':'clientes'}</span></div><div class="d-lista">${itens}</div></div>`;
}

/* ---------- revelação progressiva ----------
   Filtros recolhidos, com memória. O contador ao lado do botão existe para evitar
   o único efeito colateral ruim de esconder filtro: a pessoa esquece que filtrou e
   acha que os dados sumiram. Por isso, com filtro ativo, o painel nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da lista. Dois botões de propósito: "mais 20" para quem lê, "todos" para
   quem vai usar Ctrl+F. Buscar ou filtrar volta o teto ao início — o resultado é
   outro, e continuar de onde parou confundiria. */
const PASSO=20;
function rodapeLista(mostrados,total){
  if(total<=mostrados)return '';
  const faltam=total-mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO,faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todos os ${total}</button>
  </div>`;
}

/* ---------- limpar filtros (C.5) ----------
   Quantos filtros estão pegando agora — vira o selo ao lado do botão Filtros. Só
   conta o que ficou ESCONDIDO no painel: a busca segue à vista na régua, e um selo
   por causa dela faria a pessoa procurar o que não sumiu. A visão (calendário /
   por cliente) também fica de fora: é a aba em que a pessoa está, não um filtro. */
function filtrosPainel(){return (PROD?1:0)+(ATALHO?1:0);}
function limparFiltros(){PROD='';ATALHO='';TERMO='';render();}
/* A contagem em texto é o que permite recolher os chips sem esconder número: o
   total, o ativo da competência e quem está fora de toda contagem continuam na
   primeira linha da tela, com o painel aberto ou fechado. */
function desenharResumoLista(){
  const el=document.getElementById('resumo-lista');if(!el)return;
  const universo=CLIENTES.filter(noUniverso).length;
  const vis=CLIENTES.filter(combinaProduto).length;
  const ativos=CLIENTES.filter(c=>combinaProduto(c)&&ativoEm(c,ENDIDX)).length;
  const semIni=CLIENTES.filter(c=>combinaProduto(c)&&c.iniIdx==null).length;
  const p=[(vis===universo?String(universo):vis+' de '+universo)+' clientes',
           ativos+' ativos em '+labelIdx(ENDIDX)];
  if(semIni)p.push(semIni+' sem data de início');
  el.textContent=p.join(' · ');
}

function render(){
  /* Chip é <button>, não <span>: com clique num <span> quem navega por teclado nunca
     chega no filtro. O aria-pressed conta o estado que a classe "on" só pinta. */
  const opProd=['<button type="button" class="chip'+(!PROD?' on':'')+'" data-prod="" aria-pressed="'+(!PROD)+'">Ambos</button>']
    .concat(PROD_PANEL.map(p=>`<button type="button" class="chip${p===PROD?' on':''}" data-prod="${esc(p)}" aria-pressed="${p===PROD}">${esc(p)}</button>`)).join('');
  const universo=CLIENTES.filter(noUniverso).length;
  const ativosAgora=CLIENTES.filter(c=>combinaProduto(c)&&ativoEm(c,ENDIDX)).length;
  document.getElementById('cnt').textContent=universo+' clientes (contab./controlad.)';
  const opAtalho=ATALHOS.map(a=>`<button type="button" class="chip atalho${a.k===ATALHO?' on':''}" data-atalho="${a.k}" aria-pressed="${a.k===ATALHO}" title="${esc(a.rot)}">${esc(a.rot)}<span class="n">${contarAtalho(a)}</span></button>`).join('');
  const ph=ATALHO?'Buscar nesta lista (nome ou ID)…'
    :(VIEW==='calendario'?'Buscar cliente (nome ou ID) ou um ano (ex.: 2025)…':'Buscar cliente por nome…');
  /* A ordem é a da tela: primeiro a busca e a contagem, depois o resumo e o
     calendário — que é a resposta e por isso NUNCA recolhe. Os chips de produto e
     de atalho, que antes vinham antes de tudo, agora esperam no painel. */
  document.getElementById('app').innerHTML=`<div class="wrap">
    <div class="toggle">
      <button data-view="calendario" class="${VIEW==='calendario'?'on':''}">Calendário</button>
      <button data-view="cliente" class="${VIEW==='cliente'?'on':''}">Por cliente</button>
    </div>
    <div class="barra-acoes">
      <input class="busca campo-busca" id="busca" type="search" placeholder="${ph}" value="${esc(TERMO)}">
      <button type="button" class="btn-filtros" id="btn-filtros" aria-expanded="false" aria-controls="painel-filtros">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M1.2 2h13.6a.6.6 0 0 1 .46.99L10.4 9.02V13.4a.6.6 0 0 1-.87.54l-2.6-1.3a.6.6 0 0 1-.33-.54V9.02L.74 2.99A.6.6 0 0 1 1.2 2Z"/></svg>
        Filtros <span class="cont-filtros" hidden>0</span>
      </button>
      <span class="resumo-lista" id="resumo-lista"></span>
    </div>
    <div id="painel-filtros" class="painel-filtros" hidden>
      <div class="grupo"><span class="rot">Produto</span>${opProd}</div>
      <div class="grupo"><span class="rot">Atalhos</span>${opAtalho}</div>
      <button type="button" class="btn-limpar" id="btn-limpar" title="Volta para a visão sem produto, sem atalho e sem busca">Limpar filtros</button>
    </div>
    <div class="resumo-top">
      <div><div class="lbl">Ativos em ${labelIdx(ENDIDX)} · ${PROD?esc(PROD):'contab./controlad.'}</div><div class="big">${ativosAgora}</div></div>
      <div><div class="lbl">Competência</div><div class="dica">1º mês com movimento: ${labelIdx(CALSTART)} · até ${labelIdx(ENDIDX)}. Sem data de fim = ativo em andamento.</div></div>
    </div>
    <div id="conteudo" style="margin-top:12px"></div>
  </div>`;
  /* render() refaz o #app inteiro, então o botão de Filtros é sempre um elemento
     novo: religar aqui é o que mantém a memória do painel valendo entre um chip e
     outro. A escolha mora no localStorage, não no DOM, e sobrevive ao F5 — com uma
     exceção de propósito: enquanto houver produto ou atalho ligado o painel volta
     aberto, porque filtro que mexe no que a pessoa vê não pode ficar escondido. */
  FILTROS_UI=ligarFiltros('clientes-ativos',filtrosPainel);
  if(FILTROS_UI)FILTROS_UI.atualizarContador();
  desenharResumoLista();
  document.querySelectorAll('.toggle button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.view===VIEW&&!ATALHO)return;VIEW=b.dataset.view;ATALHO='';TERMO='';render();}));
  document.querySelectorAll('.chip[data-prod]').forEach(c=>c.addEventListener('click',()=>{PROD=c.dataset.prod;render();}));
  document.querySelectorAll('.chip[data-atalho]').forEach(c=>c.addEventListener('click',()=>{ATALHO=(ATALHO===c.dataset.atalho?'':c.dataset.atalho);TERMO='';render();}));
  const bl=document.getElementById('btn-limpar');
  if(bl)bl.addEventListener('click',limparFiltros);
  const inp=document.getElementById('busca');
  inp.addEventListener('input',e=>desenhar(e.target.value));
  desenhar(TERMO);
  if(TERMO){inp.focus();try{inp.setSelectionRange(TERMO.length,TERMO.length);}catch(_){}}
  sincronizarURL();
}
function desenhar(termo){
  TERMO=termo||'';
  sincronizarURL();
  const cont=document.getElementById('conteudo');
  cont.innerHTML = ATALHO ? viewAtalho(TERMO) : (VIEW==='calendario' ? viewCalendario(TERMO) : viewCliente(TERMO));
  if(!ATALHO&&VIEW==='calendario')cont.querySelectorAll('.mcard[data-m]').forEach(b=>b.addEventListener('click',()=>alternarMes(b)));
}

/* ---------- calendário ---------- */
function viewCalendario(termo){
  const bruto=String(termo||'').trim();
  const anoFiltro=/^(19|20)\d{2}$/.test(bruto)?+bruto:null;
  const alvo=anoFiltro?'':normTxt(bruto);
  const lista=CLIENTES.filter(c=>combinaProduto(c)&&(!alvo||normTxt((c.id||'')+' '+(c.nome||'')).includes(alvo)));
  const a0=anoIni(),a1=anoFim();
  MESES_DADOS={};ENTRADAS={};SAIDAS={};
  /* entrou = mês do início da contabilidade.
     saiu   = o mês SEGUINTE à última competência (saidaIdx). O mês da última
              competência ainda tem o cliente na lista de ativos; a baixa é o
              primeiro mês em que ele não está mais lá — que é onde a equipe
              espera ver o −1. */
  lista.forEach(c=>{
    if(c.iniIdx!=null)(ENTRADAS[c.iniIdx]=ENTRADAS[c.iniIdx]||[]).push(c);
    if(c.saidaIdx!=null)(SAIDAS[c.saidaIdx]=SAIDAS[c.saidaIdx]||[]).push(c);
  });
  let max=0;
  for(let y=a0;y<=a1;y++)for(let mo=0;mo<12;mo++){
    const M=idxYM(y,mo+1);
    if(M>ENDIDX)continue;                       // mês no futuro: sem dados
    const arr=lista.filter(c=>ativoEm(c,M));
    MESES_DADOS[M]=arr;
    if(arr.length>max)max=arr.length;
  }
  if(alvo&&!lista.length)return `<div class="dica">Nenhum cliente encontrado para “${esc(bruto)}”.</div>`;
  const anos=[];
  for(let y=a1;y>=a0;y--){ if(anoFiltro&&y!==anoFiltro)continue; anos.push(y); }
  if(!anos.length)return `<div class="dica">Sem movimento em ${esc(bruto)}. Anos com dados: ${a0} a ${a1}.</div>`;
  const aviso=alvo?`<div class="dica" style="margin:-4px 2px 10px">Contagem filtrada por “${esc(bruto)}” — ${lista.length} ${lista.length===1?'cliente':'clientes'}.</div>`:'';
  return legendaHtml()+aviso+anos.map(y=>anoHtml(y,max)).join('');
}
function legendaHtml(){
  const sw=RAMPA.map(c=>`<i class="sw" style="background:${c}"></i>`).join('');
  return `<div class="legenda"><span>Menos</span>${sw}<span>Mais</span><span class="sep">·</span><span>clique no mês para ver os ativos, quem entrou e quem saiu</span><span class="sep">·</span><span><b style="color:#2E7D52">+</b> entraram <b style="color:var(--vermelho)">−</b> saíram no mês</span></div>`;
}
function anoHtml(y,max){
  const cards=[];let pico=0,picoM=-1,soma=0,qtd=0;
  for(let mo=0;mo<12;mo++){
    const M=idxYM(y,mo+1);
    const arr=MESES_DADOS[M];
    if(!arr){cards.push(`<div class="mcard futuro"><span class="m-nome">${MES[mo]}</span><span class="m-n">·</span></div>`);continue;}
    const q=arr.length;
    if(q>pico){pico=q;picoM=mo;}
    soma+=q;qtd++;
    const ant=MESES_DADOS[M-1];
    const ent=(ENTRADAS[M]||[]).length,sai=(SAIDAS[M]||[]).length;
    /* a linha miúda passa a mostrar o movimento DO mês (+entraram / −saíram).
       o saldo contra o mês anterior não é a mesma conta — quem sai em março só
       some do total de abril — então ele fica no title, sem sumir. */
    let dHtml='';
    if(ent||sai)dHtml=`<span class="m-d">${ent?`<b class="up">+${ent}</b>`:''}${ent&&sai?' ':''}${sai?`<b class="dn">−${sai}</b>`:''}</span>`;
    let tit=labelLongo(M)+' — '+q+' ativo(s)';
    if(ent||sai)tit+=' · entraram '+ent+', saíram '+sai;
    if(ant){const d=q-ant.length;tit+=' · saldo '+(d>0?'+':'')+d+' sobre '+MES[(mo+11)%12];}
    cards.push(`<button type="button" class="mcard n${nivel(q,max)}${M===ENDIDX?' atual':''}" data-m="${M}" aria-expanded="false" title="${esc(tit)}"><span class="m-nome">${MES[mo]}</span><span class="m-n">${q}</span>${dHtml}</button>`);
  }
  const meta=pico?`pico ${pico} em ${MES[picoM]} · média ${Math.round(soma/qtd)}`:'sem movimento';
  return `<div class="ano" data-ano="${y}"><div class="ano-h"><span class="ano-n">${y}</span><span class="ano-meta">${meta}</span></div><div class="cal">${cards.join('')}</div><div class="drop" hidden></div></div>`;
}
function fecharTudo(cont){
  if(!cont)return;
  cont.querySelectorAll('.drop').forEach(d=>{d.hidden=true;d.innerHTML='';});
  cont.querySelectorAll('.mcard.sel').forEach(b=>{b.classList.remove('sel');b.setAttribute('aria-expanded','false');});
}
/* Teto dentro do dropdown: um mês de pico traz mais de cem clientes, e a lista
   virava um rolo de duas colunas dentro do cartão. Abre com 20 e o total continua
   escrito no cabeçalho do mês — o corte é do desenho, não da contagem. */
let TETO_DROP=PASSO;
function montarDrop(drop,btn,M){
  drop.innerHTML=dropHtml(M);
  const cont=document.getElementById('conteudo');
  const x=drop.querySelector('.d-x');
  if(x)x.addEventListener('click',()=>{fecharTudo(cont);btn.focus();});
  const mais=drop.querySelector('.btn-mais');
  if(mais)mais.addEventListener('click',()=>{TETO_DROP+=PASSO;montarDrop(drop,btn,M);});
  const todos=drop.querySelector('.btn-todos');
  if(todos)todos.addEventListener('click',()=>{TETO_DROP=(MESES_DADOS[M]||[]).length;montarDrop(drop,btn,M);});
}
function alternarMes(btn){
  const cont=document.getElementById('conteudo');
  const jaAberto=btn.classList.contains('sel');
  fecharTudo(cont);
  if(jaAberto)return;
  const drop=btn.closest('.ano').querySelector('.drop');
  TETO_DROP=PASSO;            // mês novo (ou busca nova, que refaz o calendário): teto novo
  montarDrop(drop,btn,+btn.dataset.m);
  drop.hidden=false;
  btn.classList.add('sel');btn.setAttribute('aria-expanded','true');
}
function movHtml(M){
  const ent=(ENTRADAS[M]||[]).slice().sort(porNome);
  const sai=(SAIDAS[M]||[]).slice().sort(porNome);
  if(!ent.length&&!sai.length)return '';
  const linha=c=>`<span class="mv-i">${(c.id?esc(c.id)+' · ':'')+esc(c.nome||'(sem nome)')}</span>`;
  const bloco=(cls,rot,tit,arr)=>arr.length
    ? `<div class="mv ${cls}"><div class="mv-h" title="${esc(tit)}">${rot}<span>${arr.length}</span></div><div class="mv-l">${arr.map(linha).join('')}</div></div>`
    : '';
  return `<div class="d-mov">${bloco('ent','Entraram','Início da contabilidade neste mês.',ent)}${bloco('sai','Saíram','Primeiro mês sem eles — a última competência atendida foi a anterior, e nela ainda contam como ativos.',sai)}</div>`;
}
function dropHtml(M){
  const arr=(MESES_DADOS[M]||[]).slice().sort(porNome);
  const n=Math.min(TETO_DROP,arr.length);
  const itens=arr.slice(0,n).map(c=>{
    const linha=(c.id?esc(c.id)+' · ':'')+esc(c.nome||'(sem nome)');
    const prod=c.produtos?`<div class="d-prod">${esc(c.produtos)}</div>`:'';
    return `<div class="d-item"><div class="d-linha">${linha}</div>${prod}</div>`;
  }).join('')||'<div class="dica">Nenhum cliente ativo nesta competência.</div>';
  return `<div class="d-h"><b>${esc(labelLongo(M))}</b><span class="d-cnt">${arr.length} ${arr.length===1?'cliente ativo':'clientes ativos'}</span><button class="d-x" type="button" aria-label="Fechar">×</button></div>${movHtml(M)}<div class="d-lista">${itens}</div>${rodapeLista(n,arr.length)}`;
}

/* ---------- por cliente ---------- */
function fmtData(idx){return idx==null?'—':labelIdx(idx);}
function viewCliente(termo){
  const alvo=normTxt(termo);
  const arr=CLIENTES.filter(c=>combinaProduto(c)&&(!alvo||normTxt(c.nome+' '+c.id).includes(alvo)))
    .sort((a,b)=>normTxt(a.nome).localeCompare(normTxt(b.nome)));
  if(!arr.length)return '<div class="dica">Nenhum cliente encontrado.</div>';
  return arr.map(c=>{
    const ativo = c.iniIdx!=null && (c.fimIdx==null || c.fimIdx>=ENDIDX) && c.iniIdx<=ENDIDX;
    let meses=0;for(let M=CALSTART;M<=ENDIDX;M++)if(ativoEm(c,M))meses++;
    const prod=c.prodList.map(p=>`<span class="pchip">${esc(p)}</span>`).join('')||'<span class="pchip" style="background:#F2ECE4;color:var(--muted);border-color:var(--line)">—</span>';
    /* "encerrou jul/26" era ambíguo: julho é a última competência ATENDIDA, não o
       mês em que ele some da contagem. Agora os dois aparecem — e quem está no
       último mês ganha aviso, porque some da lista na virada. */
    const fimTxt = c.iniIdx==null ? '<span class="bdg enc">sem data de início</span>'
      : (c.fimIdx==null ? '<span class="bdg ativo">Ativo</span>'
      : (c.fimIdx>=ENDIDX ? '<span class="bdg ativo">Ativo</span> <span class="bdg enc">último mês · sai em '+fmtData(c.saidaIdx)+'</span>'
      : ('última competência '+fmtData(c.fimIdx)+' · saiu em '+fmtData(c.saidaIdx))));
    return `<div class="cli"><div class="cli-main">
        <div class="cli-nome">${esc(c.nome||c.id)}</div>
        <div class="cli-prod">${prod}</div>
      </div>
      <div class="cli-datas">
        <div>início: <b>${fmtData(c.iniIdx)}</b></div>
        <div style="margin-top:3px">${fimTxt}</div>
        <div class="dica" style="margin-top:3px">${meses} ${meses===1?'mês':'meses'} na competência</div>
      </div></div>`;
  }).join('');
}

/* Atalhos de busca (C.4): "/" foca, Esc limpa a busca (e fecha o mês aberto).
   Não atrapalha quem já está digitando noutro campo. */
document.addEventListener('keydown',e=>{
  const b=document.getElementById('busca');
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando&&b){e.preventDefault();b.focus();b.select();return;}
  if(e.key!=='Escape')return;
  if(b&&b.value&&(a===b||!digitando)){e.preventDefault();b.value='';desenhar('');return;}
  fecharTudo(document.getElementById('conteudo'));
});
document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());
carregar();

<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador.html') {
        try { href = 'colaborador.html?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador.html'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
