<style>
/* B4U-DESIGN:INICIO — paleta, cantos e fonte que as 22 páginas dividem.
   Bloco copiado de b4u-design.css (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-design.js`.

   Entra ANTES do <style> da página de propósito — é a camada base. Se esta
   página precisar mesmo de um valor diferente, redeclare o token no `:root`
   dela, que vem depois e vence. */
:root{
  /* ── Superfícies ─────────────────────────────────────────────────────────
     `--canvas` é o bege do fundo da página; `--surface` é o branco do cartão
     que se apoia nele; `--surface-warm` é o branco quebrado das faixas e
     cabeçalhos de tabela, que separam sem precisar de borda. */
  --canvas:#F1E7DC;
  --surface:#FFFFFF;
  --surface-warm:#FBF6EF;

  /* ── Letra ───────────────────────────────────────────────────────────────
     `--ink` é o texto normal, `--ink-2` o secundário, `--muted` o rótulo.
     `--muted` já foi #8A7D70 e reprovava em contraste (3,28:1); #6E6256 dá
     4,85:1 no bege e 5,92:1 no branco, e é a cor de quase todo rótulo do
     sistema — por isso ela precisa passar, e não só quase. */
  --ink:#113D39;
  --ink-2:#3F5854;
  --muted:#6E6256;

  /* ── Traços ──────────────────────────────────────────────────────────────
     `--line` divide o que é do mesmo grupo; `--line-2` fecha o que é caixa. */
  --line:#E4D9C9;
  --line-2:#D6C3AC;

  /* ── Marca ───────────────────────────────────────────────────────────────
     `--brand-teal` é canônico em logo, foco, borda e série de gráfico. Como
     TEXTO ele reprova (4,11:1 no branco, 3,44:1 no receita-soft), e para isso
     existe o `--brand-teal-txt`: o mesmo teal escurecido, 5,54:1 no branco e
     4,54:1 no bege, usado só onde é letra ou fundo de letra. Os dois são a
     mesma cor com dois trabalhos. O 4,54:1 passa, mas passa RASPANDO: quem for
     escurecer o `--canvas` um dia tem de conferir este par antes. */
  --brand-dark:#073034;
  --brand-teal:#0F8C85;
  --brand-euc:#3FA680;
  --brand-teal-txt:#0C756F;

  /* ── SINAL: as quatro cores que querem dizer alguma coisa ────────────────
     Estas quatro NÃO seguem o tema (ver OS QUATRO TEMAS, no fim do arquivo). Se
     "vencido" mudasse de vermelho conforme a pele escolhida, a cor deixaria de
     ser informação e viraria decoração — e quem trabalha nesta tela o dia
     inteiro lê a cor antes de ler a palavra.

     `--amber` tem 2,61:1 no branco: serve de PREENCHIMENTO e de borda, nunca de
     letra. Para letra âmbar existe o `--amber-txt` (5,91:1 no branco).

     ┌── PENDÊNCIA CONHECIDA: `--verde` E `--vermelho` REPROVAM COMO LETRA ────┐
     │                                                                        │
     │ Os dois NÃO têm o par `-txt` que o âmbar tem, e são usados nas duas     │
     │ funções ao mesmo tempo:                                                │
     │                                                                        │
     │     --verde     12 usos como `color`, 11 como `background`, 7 em borda │
     │     --vermelho  41 usos como `color`, 31 como `background`, 41 em borda │
     │                                                                        │
     │ E o lado TEXTO reprova. Medido nos valores atuais:                     │
     │                                                                        │
     │     --verde     #2E9D5F   2,82:1 no bege · 3,44:1 no branco   REPROVA  │
     │     --vermelho  #C0392B   4,46:1 no bege · 5,43:1 no branco   raspando │
     │                                                                        │
     │ O mínimo para texto é 4,5:1. É a mesma falha do `--muted` antigo (que   │
     │ dava 3,28:1), e atinge `.hint.ok` e `.lk.ok`, que são letra e nada      │
     │ mais. Há prova de que alguém já tinha esbarrado nisso sem nomear: o     │
     │ `.det-fbtn.ativo` escreve `color:#0E5B37` à mão — um verde bem mais     │
     │ escuro — em vez de usar o token.                                       │
     │                                                                        │
     │ CONSERTO MEDIDO E NÃO APLICADO (decisão de 10/08/2026):                 │
     │                                                                        │
     │     --verde     #2E9D5F -> #1F7546   (2,82:1 -> 4,66:1 no bege)        │
     │     --vermelho  #C0392B -> #BB3728   (4,46:1 -> 4,66:1 no bege)        │
     │                                                                        │
     │ Matiz e saturação ficam onde estão; só a luminosidade desce, o mínimo   │
     │ para passar com folga. Escurecer é seguro pelo lado do FUNDO: TODAS as  │
     │ regras `background:var(--verde)` / `background:var(--vermelho)` já vêm  │
     │ com `color:#fff` (ou são faixa/pontinho sem texto), e fundo mais escuro │
     │ com letra branca só melhora.                                           │
     │                                                                        │
     │ POR QUE NÃO FOI APLICADO AGORA: mexer nestes dois repinta as 22         │
     │ páginas, inclusive as 8 do cliente. A rodada que centralizou os tokens  │
     │ era de ESTRUTURA — nenhum pixel de cor mudou nela de propósito, para    │
     │ que qualquer diferença que aparecesse em produção tivesse uma causa só. │
     │ Trocar cor é decisão de produto e vai junto da varredura do MODO        │
     │ ESCURO, que já vai ter de abrir os 22 arquivos.                         │
     │                                                                        │
     │ QUANDO FOR FAZER, olhe também o `--verde-2`: várias páginas o declaram  │
     │ valendo #25804C, com a nota "o verde um degrau mais escuro, para virar  │
     │ FUNDO de texto branco". Com o conserto acima, o `--verde` do núcleo     │
     │ fica MAIS ESCURO que o `--verde-2`, e a convenção do sufixo -2 se       │
     │ inverte nesse par. Não dá para resolver daqui: o `--verde-2` mora no    │
     │ `:root` de cada página.                                                │
     └────────────────────────────────────────────────────────────────────────┘

     (Escrito assim, sem dois-pontos colado no nome, de propósito: a
     `tokensCanonicos()` do `_aplica-design.js` varre este bloco com um regex de
     declaração e NÃO pula comentário. Nome de token seguido de dois-pontos aqui
     dentro vira token canônico de mentira, e o `--verde-2` de mentira faria as
     22 páginas aparecerem como "exceção mantida" no terminal. Vale para todo
     comentário deste arquivo: cite o token, nunca o escreva como declaração.) */
  --amber:#E8892E;
  --amber-txt:#8A5A10;
  --vermelho:#C0392B;
  --verde:#2E9D5F;

  /* ── Cantos ──────────────────────────────────────────────────────────────
     Uma escala só, no site inteiro, e mais QUADRADA que redonda.
       4px  campo, selo, célula
       6px  cartão, linha da lista, botão
       8px  bloco grande e modal
     `--radius-pill` deixou de ser cápsula (999px): o nome fica porque é citado
     em mais de cem regras, mas o valor acompanha o resto — pílula virou
     etiqueta. Círculo de verdade (avatar, contador, spinner) continua com
     `border-radius:50%` escrito na regra e não passa por aqui. */
  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-pill:6px;

  /* ── Escala tipográfica ──────────────────────────────────────────────────
     Seis degraus, e o pulo entre eles é de propósito irregular: 11-12-13 é a
     faixa de rótulo, selo e nota de rodapé, onde 1px já muda a hierarquia; 15 é
     o corpo; 19 e 24 são título de bloco e de tela. Um degrau constante (1,2×,
     por exemplo) daria 11-13-16-19-23-28 e gastaria três tamanhos na faixa em
     que o olho não distingue nada.
     ATENÇÃO: o `body{font-size:15px}` das páginas está escrito à mão e NÃO sai
     daqui. Quem mexer na escala não muda o corpo do texto; muda só quem usa
     `var(--fs-N)` — que é rótulo, selo, cabeçalho de tabela e título. */
  --fs-1:11px;
  --fs-2:12px;
  --fs-3:13px;
  --fs-4:15px;
  --fs-5:19px;
  --fs-6:24px;

  /* ── Fonte ───────────────────────────────────────────────────────────────
     Montserrat vem do Google Fonts, declarado no <head> de cada página. O
     `system-ui` é o que aparece enquanto ela não chega — e é o que fica se ela
     não chegar nunca. */
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
/* B4U-DESIGN:FIM */
</style>
<style>
:root{
  /* O teal da marca reprova como TEXTO (4,11:1 no branco, 3,37:1 no canvas).
     Este e o mesmo teal escurecido so para letra e fundo de letra; o --brand-teal
     segue canonico em logo, foco, bordas e preenchimentos. */
  --amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  /* Sufixo -2 = a mesma tinta um degrau mais escura, para quando ela vira FUNDO de
     texto branco: o --amber da 2,61:1 com #fff, o --amber-2 da 4,68:1. Como
     preenchimento de barra, icone ou borda, o --amber original continua valendo. */
  --amber-2:#B05F12;
  --verde-2:#25804C;
  /* Levantar de cartao clicavel: uma sombra so, igual em todas as telas. */
  --lift:0 8px 20px rgba(17,61,57,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.barra{position:sticky;top:0;z-index:50;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:800;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:var(--radius-pill)}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd}.barra a.volta{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600}
.save-status{font-size:13px;font-weight:800;padding:6px 13px;border-radius:var(--radius-pill);background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
/* O MESMO indicador aparece em dois lugares: a faixa da barra escura e o rodapé
   do modal da ficha (claro). Só o estado neutro precisa de outra tinta — o da
   barra é feito para fundo escuro e sumiria no branco. Vem ANTES dos estados
   coloridos de propósito: mesma especificidade, quem vier depois ganha. */
.save-status.claro{background:var(--surface-warm);color:var(--ink-2)}
/* Branco sobre --amber da 2,61:1 e sobre --verde 3,44:1 — o rotulo do proprio
   status de gravacao some. Um degrau mais escuro na MESMA familia: 4,68:1 e 4,92:1. */
.save-status.saving{background:var(--amber-2);color:#fff}
.save-status.ok{background:var(--verde-2);color:#fff}
.save-status.err{background:var(--vermelho);color:#fff}
@media(max-width:560px){.barra .cnt{display:none}}
.wrap{max-width:1000px;margin:0 auto;padding:18px 20px 80px}
.topo{position:sticky;top:52px;z-index:40;background:var(--canvas);padding:12px 0 10px}
.busca{flex:1;min-width:220px;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:var(--radius-pill);padding:12px 20px}
.dica{font-size:12px;color:var(--muted);margin-top:7px}
/* filtros e ordenação — mesmo padrão de chips já usado em certificados.html */
.linha-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.grupo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grupo .rot{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font-size:13px;font-weight:700;border-radius:var(--radius-pill);padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--brand-teal)}
.chip:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.chip.on{background:var(--brand-teal-txt);border-color:var(--brand-teal-txt);color:#fff}
.chip .n{background:rgba(0,0,0,.10);border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.chip.alerta.on{background:var(--vermelho);border-color:var(--vermelho)}
.chip.falta.on{background:var(--amber);border-color:var(--amber)}
.chip.feito.on{background:var(--verde);border-color:var(--verde)}
.chip .seta{margin-left:5px;font-size:11px;opacity:.9}
.vazio-filtro{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);font-size:13px}
/* no celular cada faixa de chips vira uma tira que rola de lado, para o topo
   não engolir a tela */
@media(max-width:620px){
  .linha-filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:7px}
  .linha-filtros::-webkit-scrollbar{display:none}
  .grupo{flex-wrap:nowrap}
  .chip,.grupo .rot{white-space:nowrap}
}

/* ---------- revelacao progressiva ---------- */
/* Régua de ações: busca sempre à mão, filtros a um clique, contagem à vista.
   Antes as três fileiras de chips (status, atalhos e ordenação) ficavam abertas
   entre a busca e o primeiro processo — o colaborador abre esta tela vinte vezes
   por dia e relia a parede inteira toda vez. */
.barra-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.barra-acoes .campo-busca{flex:1;min-width:200px;font-size:16px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink)}
.barra-acoes .campo-busca:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
/* ---------- régua de filtros: DUAS caixas de seleção múltipla ----------
   As três fileiras de chips viraram um <select> só (status + atalhos + ordenação
   misturados), e agora esse <select> virou duas CAIXAS DE SELEÇÃO (b4u-filtro.js)
   mais a ordenação por cabeçalho de coluna. O pedido do dono foi literal:
   "Ativos (status), um filtro checkbox · Situação do processo checkbox · aplicar
   'ordenar títulos AZ ZA' sem ter a ordenação no filtro lá em cima".

   Por que DUAS e não uma: no <select> único, Status Geral e Atalhos gravavam na
   MESMA variável e só um pegava por vez — escolher "Parados há +30 dias" apagava
   calado a escolha de status. São perguntas diferentes ("em que status está?" e
   "o que está faltando aqui?") e agora cada uma tem sua caixa, com as duas
   valendo ao mesmo tempo.

   Por que os ATALHOS viraram a segunda caixa e não botões liga/desliga soltos na
   régua: são cinco perguntas, e cinco botões a mais numa régua que a 390px já
   quebra em três linhas transformariam a primeira coisa da tela numa parede —
   exatamente o que a revelação progressiva tinha acabado de desfazer. Numa caixa
   eles ocupam um botão só, ganham a mesma linha "Todas / Nenhuma" das outras e
   passam a ser COMBINÁVEIS ("parados OU sem responsável" = o que precisa de mim
   hoje), coisa que nem os chips nem o <select> sabiam fazer.

   A CONTAGEM continua no rótulo de cada linha do painel ("!! Parados há +30 dias
   · 7") e continua sendo a contagem sobre o que a BUSCA deixou — não sobre a
   planilha inteira. A URGÊNCIA também continua: os marcadores de texto !! / ! / ✓
   acompanharam o rótulo para dentro do painel, e ali eles funcionam pelo mesmo
   motivo que funcionavam no <option> — não dependem de cor. A regra está escrita
   junto do MARCA, no script. */
select.filtro{font-family:var(--sans);font-size:var(--fs-3);color:var(--brand-teal-txt);
  background:var(--surface);border:1px solid var(--brand-teal);border-radius:var(--radius-pill);
  padding:9px 13px;cursor:pointer;font-weight:700;max-width:100%;min-width:0;text-overflow:ellipsis}
select.filtro:focus{outline:2px solid var(--brand-teal);outline-offset:-1px}
/* Filtro que ESCONDE processo se anuncia: âmbar, para "estou vendo tudo?" ter
   resposta sem abrir nada. O estado neutro fica no teal de sempre. */
select.filtro.corta{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-txt)}
/* O MESMO âmbar na caixa de seleção. Estas duas regras alcançam por fora as
   classes do b4u-filtro.js, e é a única coisa desta página que faz isso — está
   aqui porque "filtro que esconde processo se anuncia" é uma decisão DESTA tela
   (a linha logo acima), e o componente, que serve várias, não tem como saber
   disso. A classe `.corta` quem põe é esta página, no nó raiz que o componente
   devolve (`f.no`); nada aqui depende do que ele faz por dentro, só do prefixo
   público `b4f-`. Se um dia o prefixo mudar, o filtro perde o âmbar e continua
   funcionando — que é a falha certa para uma regra de aparência.
   A especificidade precisa de DOIS nomes: a folha do componente entra num
   <style> criado por JS, no fim do <head>, e vence o empate. */
.b4f.corta>.b4f-bt{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-txt)}
.b4f.corta>.b4f-bt:hover{border-color:var(--amber-txt)}
.btn-filtros{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--ink);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.btn-filtros:hover{border-color:var(--brand-teal)}
.btn-filtros[aria-expanded="true"]{background:#EAF4F1;border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.btn-filtros svg{width:15px;height:15px;flex:none}
.cont-filtros{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:var(--radius-pill);background:var(--brand-teal-txt);color:#fff;
  font-size:11px;font-weight:800}
/* display:inline-flex ganha do atributo hidden — sem esta linha o selo mostrava
   um "0" permanente ao lado de Filtros. */
.cont-filtros[hidden]{display:none}
.resumo-lista{font-size:13px;color:var(--ink-2);white-space:nowrap}
/* A contagem desta tela tem até quatro números; abaixo do desktop ela precisa
   quebrar, senão o nowrap do contrato empurra a página para o lado. */
@media(max-width:820px){.resumo-lista{white-space:normal}}
.painel-filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
  padding:14px 16px;margin:0 0 14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-warm)}
.painel-filtros[hidden]{display:none}
/* Cada fileira ocupa a largura toda: status, atalhos e ordenação não se misturam. */
.painel-filtros .linha-filtros{width:100%;margin-top:0}
.btn-limpar{min-height:38px;padding:0 15px;border-radius:var(--radius-pill);border:1px dashed var(--line-2);
  background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.btn-limpar:hover{border-color:var(--brand-teal);color:var(--brand-teal-txt)}
.lista-mais{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.lista-mais button{min-height:44px;padding:0 18px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--brand-teal-txt);
  font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.lista-mais button:hover{border-color:var(--brand-teal);background:#EAF4F1}
.lista-mais .btn-todos{background:transparent;color:var(--ink-2);font-weight:600}
/* ---------- a lista de processos: só leitura ----------
   SETE colunas por linha (ID · Cliente · Processo · Etapa atual · Tempo · Última
   movimentação · Situação) e TODA a edição dentro do modal. Nenhum input,
   select ou textarea na linha: "a lista fica limpa e ninguém altera sem
   querer". NÃO é <table> de propósito — a grade do CSS convive com os chips,
   o rodapé de teto e o cartão que a tela já tinha.
   O cabeçalho (.lista-cab) repete a MESMA régua de colunas: as duas larguras
   moram na mesma regra justamente para não desalinharem quando alguém mexer.

   A coluna TEMPO nasceu junto da ordenação por cabeçalho. Ela é a ordem PADRÃO
   da tela (mais tempo em aberto primeiro) e era a única das cinco ordens do
   antigo #f-ord que não tinha coluna nenhuma — a lista abria ordenada por um
   número que não estava escrito em lugar algum, e depois de clicar em qualquer
   outro cabeçalho não havia como voltar. O dado já existia: é o mesmo ⏱ que a
   ficha mostra e que o title da linha sempre disse. */
.lista{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.proc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.proc.aberto{border-color:var(--brand-teal);box-shadow:0 5px 20px rgba(7,48,52,.10)}
/* Faixa lateral só onde ela quer dizer "aja hoje": processo em aberto e sem
   nenhuma data de etapa mexida nos últimos 30 dias. Pintar faixa em toda
   situação faria a lista inteira virar faixa — e faixa em tudo não avisa nada. */
.proc.sit-parado,.proc.aberto.sit-parado{border-left:4px solid var(--vermelho)}
.lista-cab,.proc-h{display:grid;
  /* O cliente é o que a pessoa procura na lista e leva o maior peso — nome
     cortado ("AJUB - Cirurgia de Cab…") não identifica ninguém. Processo e
     etapa vêm logo atrás; tempo, movimentação e situação têm largura fixa para
     não dançarem de linha para linha.
     Os pesos mudaram quando a coluna Tempo entrou: 2.2/1.9/1.6 com uma coluna
     fixa a mais tirava 56px do NOME, que é justamente quem não pode encolher.
     Com 2.4/1.7/1.4 o nome perde 26px em vez de 56 e quem cede é a descrição do
     processo, que já vive de reticências honestas. */
  grid-template-columns:62px minmax(0,2.4fr) minmax(0,1.7fr) minmax(0,1.4fr) 88px 118px minmax(0,128px);
  gap:12px;align-items:center}
.lista-cab{padding:0 14px;font-size:11px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted)}
/* O cabeçalho ORDENA: cada rótulo é um <button> de verdade (Tab chega nele,
   Enter e Espaço ordenam), como no certificados.html. Foi para cá a ordenação
   que morava no <select id="f-ord"> da régua — o dono pediu "ordenar títulos AZ
   ZA sem ter a ordenação no filtro lá em cima".
   min-height:44px é o alvo de toque: o rótulo tem 11px e sem isto a área
   clicável teria 14px de altura, o que num celular é um erro de mira garantido.
   Ele estica a faixa do cabeçalho para 44px, e é o preço combinado. */
.lista-cab button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  text-transform:inherit;letter-spacing:inherit;text-align:inherit;
  min-height:44px;display:inline-flex;align-items:center;gap:0}
.lista-cab button:hover{color:var(--brand-teal-txt)}
.lista-cab button:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px;border-radius:var(--radius-sm)}
/* A coluna ativa se anuncia por escrito (aria-sort) e por desenho (▲/▼), e a
   seta é a única marca — cabeçalho com seis setas diria que a lista está
   ordenada por seis critérios ao mesmo tempo. */
.lista-cab [aria-sort] button{color:var(--brand-teal-txt)}
/* Rótulo "Ordenar" da tira do celular. No desktop ele não existe: display:none
   tira o elemento da grade, e é por isso que as sete colunas continuam sete. */
.lista-cab .cab-rot{display:none}
.proc-h{width:100%;text-align:left;background:none;border:0;padding:12px 14px;
  cursor:pointer;font-family:var(--sans);color:inherit}
.proc-h:hover{background:var(--surface-warm)}
/* O .proc tem overflow:hidden e o contorno global (offset 2px) sairia cortado
   na borda do cartão: aqui ele entra para dentro, senão o foco de teclado some. */
.proc-h:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.c-id{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.c-nome{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-proc,.c-etapa{font-size:13px;color:var(--ink-2);min-width:0;display:flex;align-items:center;gap:6px}
.c-proc .txt,.c-etapa .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Pílula da lista: nunca corta o próprio texto — "B4Y - 0…" não é código de
   processo nenhum, e "3/7" pela metade não é contagem. Quem cede é o texto ao
   lado, que tem reticências honestas. */
.c-tag{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface-warm);
  border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 8px;
  white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
/* Data em algarismo de largura fixa: uma coluna de datas desalinhada é
   justamente o que se lê errado ao conferir um processo atrás do outro. */
.c-mov{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;
  color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
/* Tempo: só a MAIOR unidade ("2 anos", "5 meses", "18 dias"). A duração por
   extenso ("1 ano e 2 meses") não cabe em 88px e, cortada, vira mentira — e ela
   continua inteira no title da linha e no ⏱ da ficha, que é onde se confere.
   O "~" na frente é o mesmo de sempre: início estimado no dia 1 do mês. */
.c-dur{display:flex;justify-content:center;font-size:13px;color:var(--ink-2);
  white-space:nowrap;font-variant-numeric:tabular-nums}
/* "há N dias" só nasce em quem está parado — é o sinal que pede ação hoje. */
.c-mov .parado{font-size:11px;font-weight:800;color:var(--amber-txt)}
.c-fim{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
/* Coluna em branco continua dizendo o NOME do que falta ("sem data", "sem
   etapas") em vez de um vazio mudo — é o sinal de tarefa da linha fechada. */
.c-falta{font-size:12px;color:var(--muted);font-weight:600}
/* Selo de situação: Concluído (verde) · Em andamento (âmbar) · Parado
   (vermelho) · Aguardando e Não se aplica (cinza) · sem status (cinza claro).
   É a última coluna da linha. */
.pill{font-size:11px;font-weight:800;border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap;letter-spacing:.2px;border:1px solid transparent}
.pill.sit-conc{background:#E6F3EC;color:#1f6b45;border-color:#BFE0CD}
.pill.sit-and{background:var(--amber-soft);color:#8A4B12;border-color:var(--amber-line)}
.pill.sit-parado{background:#F7E2DF;color:#8E2A1D;border-color:var(--vermelho)}
.pill.sit-agu{background:#EEF3F1;color:#4a6360;border-color:#D9E5E2}
.pill.sit-na{background:#F2ECE4;color:var(--muted);border-color:var(--line)}
.pill.sit-sem{background:#EEE9E2;color:var(--muted);border-color:var(--line)}
/* Abaixo de 900px as sete colunas não cabem lado a lado: cliente e situação
   ficam na primeira linha da MESMA faixa e o resto desce para uma segunda,
   menor. Continua sendo uma linha clicável só — não vira dois cartões. */
@media(max-width:900px){
  /* O cabeçalho NÃO some mais. Ele sumia porque era só rótulo de coluna, e sem
     colunas não havia o que rotular; agora ele é o único jeito de ordenar a
     lista — o <select id="f-ord"> que existia na régua foi embora —, e escondê-lo
     no celular apagaria a capacidade inteira justamente onde a tela é usada de pé,
     no corredor do cartório. Então ele deixa de ser régua e vira uma TIRA que
     rola de lado, o mesmo gesto que os chips desta página já tinham a 620px.
     O rótulo "Ordenar" na frente existe para a tira não ser lida como mais uma
     fileira de filtros: sem ele, "ID · Cliente · Processo" ao lado de duas caixas
     de filtro é exatamente o que parece. */
  .lista-cab{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;
    padding:0 0 2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .lista-cab::-webkit-scrollbar{display:none}
  .lista-cab .cab-rot{display:block;flex:none;white-space:nowrap;padding-right:2px}
  .lista-cab>[role="columnheader"]{flex:none;text-align:left!important}
  .lista-cab button{border:1px solid var(--line-2);border-radius:var(--radius-pill);
    background:var(--surface);padding:0 13px;white-space:nowrap;min-height:44px}
  .lista-cab [aria-sort] button{border-color:var(--brand-teal);background:#EAF4F1}
  .proc-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  /* Quebra forçada: sem ela o "resto" subiria para a primeira linha sempre que sobrasse espaço. */
  .proc-h::after{content:"";order:3;flex:0 0 100%;height:0}
  .c-nome{order:1;flex:1 1 auto}
  .c-fim{order:2;flex:none;flex-direction:row;align-items:center;gap:6px}
  .c-id,.c-proc,.c-etapa,.c-dur,.c-mov{order:4;flex:0 1 auto;font-size:12px;color:var(--muted);text-align:left}
  .c-mov{flex-direction:row;align-items:baseline;gap:6px}
  .c-dur{justify-content:flex-start}
}
.bdg{font-size:11px;font-weight:700;border-radius:var(--radius-sm);padding:3px 8px}
.bdg.and{background:var(--amber-soft);color:#9A5B12;border:1px solid var(--amber-line)}
.bdg.ok{background:#E7F4EC;color:#2E7D52}
.bdg.agu{background:#EEF1F0;color:#5B6B67;border:1px solid var(--line)}
.bdg.na{background:#F2ECE4;color:var(--muted)}
.bdg.dur{background:var(--brand-dark);color:#fff;border:1px solid var(--brand-dark);font-size:11px;font-weight:800}
.bdg.dur.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.bdg.dur.na{background:#F2ECE4;border:1px solid var(--line);color:var(--muted);font-weight:700}
/* O editor é o MESMO de sempre; só mudou onde ele é pintado. Dentro do modal
   ele não precisa mais da moldura que o separava da linha de cima, e some a
   regra que o escondia até a linha abrir — no modal ele é o conteúdo. */
.editor{padding:0;background:transparent}
/* Resumo do processo no alto da ficha: os mesmos badges (⏱ duração, status,
   etapas ok, código) que antes ficavam na linha da lista e que a lista de
   leitura não comporta mais. */
.pmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
/* Faixa do "não gravou" dentro da ficha — o botão de tentar de novo nasce aqui. */
.ign:empty{display:none}
.ign{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fld input,.fld select,.fld textarea{font-family:var(--sans);font-size:15px;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);width:100%}
.fld textarea{resize:vertical;min-height:52px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.sub{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sub::after{content:"";flex:1;height:1px;background:var(--line)}
.log{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--ink-2);max-height:190px;overflow:auto}
.log.vazio{color:var(--muted);font-style:italic}
.addobs{display:flex;gap:8px;margin-top:7px;align-items:flex-start}
.addobs textarea{flex:1;min-height:40px}
.etapa{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0;margin-bottom:10px;overflow:hidden}
.etapa.aberta{border-color:var(--line-2)}
.etapa-h{width:100%;display:flex;gap:9px;align-items:center;flex-wrap:wrap;text-align:left;background:none;border:0;padding:11px 12px;font-family:var(--sans);color:var(--ink);cursor:pointer}
.etapa-h:hover{background:var(--surface-warm)}
.etapa-h:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.etapa-chev{flex:none;width:12px;color:var(--brand-euc);font-weight:900;font-size:13px}
.etapa-titulo{flex:1;min-width:130px;font-size:15px;font-weight:800;color:var(--ink);line-height:1.25}
.etapa.vazia .etapa-titulo{font-size:13px;font-weight:700;color:var(--muted)}
.etapa-datas{font-size:12px;font-weight:600;color:var(--muted)}
.etapa-body{display:none;padding:12px;border-top:1px solid var(--line)}
.etapa.aberta .etapa-body{display:block}
/* ── Aplicável Sim/Não ──────────────────────────────────────────────────────
   O catálogo de etapas é o MESMO em todo processo; o que muda é quais delas
   existem naquele. Antes isso se dizia deixando a célula do nome vazia — um
   silêncio que também era o jeito de dizer "ainda não cheguei nessa etapa", e
   os dois casos ficavam iguais na tela. Agora tem resposta: Sim/Não.
   Etapa "Não" não some da ficha (some seria fingir que o catálogo é outro):
   fica apagada e fechada, e não vai ao cliente, não entra no prazo estimado
   nem conta no % concluído. */
.etapa-cab{display:flex;align-items:center;gap:8px;padding-right:11px}
.etapa-cab .etapa-h{flex:1;min-width:0}
.apl{flex:none;display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius-pill);overflow:hidden;background:var(--surface)}
.apl button{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:6px 10px;background:none;border:0;cursor:pointer;line-height:1}
.apl button:hover{background:var(--surface-warm)}
.apl button:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.apl button[aria-pressed="true"]{background:var(--brand-euc);color:#fff}
.apl button[data-v="Não"][aria-pressed="true"]{background:var(--muted)}
.etapa.nao{opacity:.6}
.etapa.nao .etapa-titulo{text-decoration:line-through;color:var(--muted)}
.etapa.nao .etapa-body{display:none}
/* Faixa de prazo: o que a MESTRA calculou. É leitura — nenhum destes números
   tem campo, porque quem manda neles é a fórmula da planilha. */
.prazo{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
.prazo i{font-style:normal;display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:800;color:var(--ink-2);background:var(--surface-warm);border:1px solid var(--line);border-radius:var(--radius-pill);padding:5px 11px}
.prazo i s{text-decoration:none;font-weight:600;color:var(--muted)}
.prazo i.atrasado{background:#fbe3e3;border-color:#f0c9c9;color:#b3261e}
.prazo i.atencao{background:#fff1d6;border-color:#f0dcae;color:#8a5800}
.prazo i.noprazo{background:#e7f5ee;border-color:#c9e6d6;color:#1b6b3e}
/* Voltar ao nome do catálogo. O nome da etapa é editável — mudar "Registro na Junta
   Comercial" para "Registro na JUCERJA" é informação de verdade — mas quem editou
   sem querer, ou editou e se arrependeu, tem um caminho de uma tecla de volta. */
.e-padrao{flex:none;font-family:var(--sans);font-size:11px;font-weight:800;color:var(--brand-euc);background:none;border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:8px 9px;cursor:pointer;white-space:nowrap}
.e-padrao:hover{background:var(--surface-warm)}
.e-padrao[hidden]{display:none}
.etapa.livre .etapa-n{background:var(--muted)}
/* O catálogo dentro do modal de processo novo. Perguntar "quais destas se aplicam"
   na hora de criar é o que faz a marcação acontecer: perguntar depois, na ficha,
   deixava a resposta para um segundo momento que muita linha nunca teve. */
.cat{border:1px solid var(--line);border-radius:var(--radius-sm);max-height:34vh;overflow:auto}
.cat-l{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line)}
.cat-l:last-child{border-bottom:0}
.cat-l.nao{opacity:.5}
.cat-n{flex:none;width:20px;text-align:right;font-size:11px;font-weight:800;color:var(--muted)}
.cat-l input{flex:1;min-width:0;font-family:var(--sans);font-size:13px;padding:6px 8px;border:1px solid transparent;border-radius:var(--radius-sm);background:none;color:var(--ink);width:auto}
.cat-l input:hover{border-color:var(--line-2)}
.cat-l input:focus{outline:2px solid var(--brand-teal);outline-offset:-1px;background:var(--surface)}
.cat-l.nao input{text-decoration:line-through;color:var(--muted)}
.cat-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.cat-topo label{margin:0}
.cat-pe{display:flex;gap:6px;align-items:center;margin-top:7px}
.etapa-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.etapa-n{flex:none;font-size:11px;font-weight:800;color:#fff;background:var(--brand-euc);border-radius:var(--radius-sm);padding:3px 7px;white-space:nowrap}
/* Deixou de ser sticky: quem segura o indicador de gravação e os botões agora é
   o rodapé fixo do modal, que já está sempre à vista. Sticky aqui se ancorava na
   JANELA, não no painel, e subia por cima do menu lateral. */
.barra-salvar{background:transparent;border-top:1px solid var(--line);padding-top:10px;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;font-weight:600}
.msg.ok{color:#2E7D52}.msg.err{color:var(--vermelho)}
.autosave{font-size:13px;font-weight:600;color:var(--muted)}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:50vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:48ch}.state code{background:var(--surface-warm);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(7,48,52,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:18px}
.modal.on{display:flex}
.modal-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal-card h2{font-size:19px;margin-bottom:12px}
/* ---------- a ficha do processo (modal) ----------
   O modal cobre a janela inteira (position:fixed;inset:0), inclusive a faixa
   dos 264px onde mora o menu lateral — e o menu é z-index:940. Com os 80 do
   .modal desta página o menu ficava POR CIMA do véu: clicável enquanto alguém
   preenchia a ficha, e um clique distraído trocava de página com o formulário
   aberto. O b4u-shell.js já sobe o .modal para 960 quando carrega; esta regra
   garante o mesmo quando ele não carregou (aí o `body.b4s` não existe). */
.modal-cad[hidden]{display:none}
.modal-cad{display:flex;align-items:flex-start;justify-content:center;
  background:rgba(7,48,52,.55);padding:20px 12px;overflow:auto;z-index:960}
/* A ficha tem rodapé fixo: a caixa é uma coluna com altura de tela, o miolo
   rola e o rodapé (status + salvar + fechar) fica sempre à vista. */
.modal-cad .modal-box{background:var(--canvas);border-radius:var(--radius-lg);width:100%;
  max-width:920px;overflow:hidden;box-shadow:0 20px 60px rgba(7,48,52,.35);
  display:flex;flex-direction:column;max-height:calc(100vh - 72px);margin:36px auto}
.modal-cad .modal-body{flex:1;min-height:0;overflow:auto;padding:16px}
.modal-cad .modal-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;

<script charset="utf-8">
/* B4U-TEXTO:INICIO — identificador é TEXTO, nunca número.
   Bloco copiado de _b4u-texto.js (fonte canônica, com a explicação completa).
   Não edite aqui: edite lá e rode `node _aplica-texto.js`.

   Em uma frase: a planilha converte para número toda célula que só tem dígito,
   e 00.623.904/0001-73 chega no painel como 623904000173 — dois zeros a menos,
   calado. Estas funções são a fronteira: todo identificador passa por elas antes
   de ir para a tela e antes de voltar para a planilha. Elas NÃO completam o zero
   que sumiu (isso esconderia erro de cadastro): mostram o número como veio e
   sinalizam que falta dígito. O conserto definitivo é formatar a coluna como
   Texto na planilha e ler com getDisplayValues() no backend. */
/* String de verdade, sem notação científica.
   `String()` só recorre a expoente a partir de 1e21 — abaixo disso ela já
   devolve o número por extenso, e é o que esta função faz na esmagadora maioria
   das vezes. Acima, "6.2e+21" não é só feio: `soDigitos()` extrai "62" mais o
   expoente e a busca passa a achar cliente errado. Aí o BigInt reescreve por
   extenso.

   O caminho `toLocaleString('fullwide', …)`, que é a receita que se acha por aí,
   está ERRADO aqui: 'fullwide' não é locale nenhum, o motor cai no locale do
   navegador e, num pt-BR, 1234.5 volta como "1234,5". Como esta função também
   atende o `esc()` da página inteira, isso trocaria a vírgula decimal em todo
   valor em dinheiro da tela. */
function b4uTexto(v){
  if(v==null)return '';
  if(typeof v==='number'){
    if(!isFinite(v))return '';
    const s=String(v);
    if(!/e/i.test(s))return s;
    if(Number.isInteger(v)){try{return BigInt(v).toString();}catch(_){}}
    return s;
  }
  if(v instanceof Date){
    /* Data em coluna de identificador é a planilha tendo interpretado errado.
       Devolve ISO em vez de "Tue Aug 04 2026 ...", que ninguém consegue ler. */
    const p=n=>String(n).padStart(2,'0');
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v);
}

function b4uDigitos(v){return b4uTexto(v).replace(/\D/g,'');}

function b4uEsc(s){
  return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Normalização de nome de coluna: sem acento, sem caixa, sem pontuação. Os nomes
   reais vêm do backend em tempo de execução e mudam sozinhos quando alguém
   renomeia a coluna na planilha — comparar string crua quebraria no primeiro
   "CNPJ/CPF" que virasse "CNPJ ou CPF". */
function b4uNorm(s){
  return b4uTexto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/* Que tipo de identificador é esta coluna, e quantos dígitos ele deveria ter.
   `tam` null = comprimento variável (telefone, inscrição): dá para garantir que
   é texto, não dá para dizer que está faltando dígito. */
const B4U_IDENT=[
  {re:/\bcnpj\b.*\bcpf\b|\bcpf\b.*\bcnpj\b/, tipo:'doc',   tam:[11,14], rot:'CNPJ ou CPF'},
  {re:/\bcnpj\b/,                            tipo:'cnpj',  tam:[14],    rot:'CNPJ'},
  {re:/\bcpf\b/,                             tipo:'cpf',   tam:[11],    rot:'CPF'},
  {re:/\bcep\b/,                             tipo:'cep',   tam:[8],     rot:'CEP'},
  {re:/\bpis\b|\bnit\b|\bpasep\b/,           tipo:'pis',   tam:[11],    rot:'PIS/NIT'},
  /* CNES: sete dígitos, e uma boa parte começa com zero. É número de cadastro,
     nunca quantidade — a planilha come o zero dele igual come o do CNPJ. */
  {re:/\bcnes\b/,                            tipo:'cnes',  tam:[7],     rot:'CNES'},
  {re:/\bmatricula\b/,                       tipo:'gen',   tam:null,    rot:'matrícula'},
  {re:/\binscricao\b|\bcadastro municipal\b|\bregistro na junta\b/, tipo:'gen', tam:null, rot:'inscrição'},
  {re:/\btelefone\b|\bcelular\b|\bwhatsapp\b|\bfone\b/, tipo:'tel', tam:null, rot:'telefone'},
  {re:/\bagencia\b|\bconta\b/,               tipo:'gen',   tam:null,    rot:'conta'}
];
function b4uIdent(coluna){
  const n=b4uNorm(coluna);
  for(const d of B4U_IDENT)if(d.re.test(n))return d;
  return null;
}
function b4uEhIdentificador(coluna){return !!b4uIdent(coluna);}

/* O diagnóstico de um valor: veio inteiro, veio truncado, ou não dá para dizer.
   `truncado` só é true quando o valor é SÓ DÍGITO e mais curto do que o tipo
   pede — que é exatamente a assinatura de zero comido pela planilha. Valor com
   pontuação ("00.623.904/0001-73") chegou como texto e está a salvo; valor de
   comprimento livre nunca é acusado. */
function b4uEstado(valor,coluna){
  const s=b4uTexto(valor).trim();
  const d=b4uDigitos(s);
  const tipo=b4uIdent(coluna);
  const tam=tipo&&tipo.tam;
  if(!s||!tam)return {vazio:!s,truncado:false,digitos:d,tipo:tipo,completo:!!s};
  const completo=tam.indexOf(d.length)>=0;
  /* Só acusa quando é dígito puro: pontuado veio como texto e está íntegro. */
  const soDigito=/^\d+$/.test(s);
  const esperado=tam[tam.length-1];
  return {
    vazio:false,
    completo:completo,
    truncado:!completo&&soDigito&&d.length>0&&d.length<esperado,
    digitos:d,
    tipo:tipo,
    esperado:tam
  };
}

/* Máscara só quando o número está inteiro. Documento curto vai como veio: pôr
   máscara em 12 dígitos produziria "62.390.400/017" — um CNPJ que não existe,
   com aparência de CNPJ que existe. */
function b4uFmtDoc(v){
  const d=b4uDigitos(v);
  if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  return b4uTexto(v);
}
function b4uFmtCep(v){
  const d=b4uDigitos(v);
  return d.length===8?d.replace(/(\d{5})(\d{3})/,'$1-$2'):b4uTexto(v);
}
function b4uFmt(valor,coluna){
  const t=b4uIdent(coluna);
  if(!t)return b4uTexto(valor);
  if(t.tipo==='cep')return b4uFmtCep(valor);
  if(t.tipo==='doc'||t.tipo==='cnpj'||t.tipo==='cpf')return b4uFmtDoc(valor);
  return b4uTexto(valor);
}

/* A frase que explica o estrago, no title do valor marcado. Ela precisa dizer
   três coisas em uma linha: quantos dígitos vieram, quantos deveriam vir, e que
   o conserto é na planilha — senão a marca vira enfeite e ninguém age. */
function b4uAviso(e){
  const rot=(e.tipo&&e.tipo.rot)||'identificador';
  const alvo=e.esperado.join(' ou ');
  const faltam=e.esperado[e.esperado.length-1]-e.digitos.length;
  return rot+' chegou com '+e.digitos.length+' dígito'+(e.digitos.length>1?'s':'')+
    ', e deveria ter '+alvo+': a planilha guardou a célula como número e comeu '+
    faltam+' zero'+(faltam>1?'s':'')+' à esquerda. Para consertar, formate a coluna '+
    'como Texto na planilha e digite o número inteiro de novo.';
}

/* O valor pronto para a tela: já mascarado, e marcado quando está truncado.
   `vazio` é o que aparece no lugar do branco ("sem CNPJ") — a lista diz o que
   falta em vez de deixar buraco. */
function b4uIdentHTML(valor,coluna,vazio){
  const e=b4uEstado(valor,coluna);
  if(e.vazio)return vazio?'<span class="c-falta">'+b4uEsc(vazio)+'</span>':'';
  const txt=b4uEsc(b4uFmt(valor,coluna));
  if(!e.truncado)return txt;
  return '<span class="b4u-trunc" title="'+b4uEsc(b4uAviso(e))+'">'+txt+
         '<span class="b4u-trunc-m" aria-hidden="true">⚠</span>'+
         '<span class="b4u-sr"> (faltam dígitos)</span></span>';
}

/* Volta para a planilha em forma que o Sheets NÃO consegue reinterpretar como
   número. Enquanto a coluna não estiver formatada como Texto, gravar
   "00623904000173" faz a planilha comer os zeros de novo — desta vez com o
   usuário assistindo, logo depois de ele ter digitado certo. Com a máscara, a
   célula tem ponto e barra, o Sheets desiste e guarda texto.
   Onde não existe máscara canônica (telefone, inscrição), o valor vai como foi
   digitado: o conserto ali depende do patch do backend. */
function b4uParaPlanilha(valor,coluna){
  const s=b4uTexto(valor).trim();
  const t=b4uIdent(coluna);
  if(!s||!t||!/^\d+$/.test(s))return s;
  const d=b4uDigitos(s);
  if((t.tipo==='doc'||t.tipo==='cnpj')&&d.length===14)return b4uFmtDoc(d);
  if((t.tipo==='doc'||t.tipo==='cpf')&&d.length===11)return b4uFmtDoc(d);
  if(t.tipo==='cep'&&d.length===8)return b4uFmtCep(d);
  return s;
}
/* B4U-TEXTO:FIM */
</script>

<script>
// A URL vive em config.js — um arquivo só, em vez de dezesseis. A cópia abaixo
// é reserva: se o config.js não carregar, a página continua de pé.
const API_URL = (typeof window.B4U_API === 'string' && window.B4U_API) ||
  'https://script.google.com/macros/s/AKfycbzQOB0KNgwM4A5ea4lsRQ4MFAyKfnwh86eGre1RagBtLNqLouZp9-KTHK4A3FNpX5GS/exec';
/* A chave da equipe não é mais fixa: é o código do dia de cada colaborador
   (aba "Colaboradores" da planilha de Contatos), que chega por e-mail no
   index.html. Esta constante ficou vazia de propósito — se voltar a ter valor,
   volta a existir uma senha compartilhada que não expira e não diz quem é quem. */
const CHAVE_PADRAO = '';
const STATUS=['','Aguardando','Em andamento','Concluído','Não se aplica'];
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');const h=(location.hash||'').replace('#','').trim();return q||h||CHAVE_PADRAO;}

/* Sem chave na URL não há painel da equipe. A porta é o index.html: a pessoa
   digita o e-mail, recebe o código do dia e volta para CÁ — é para isso que
   serve o `destino`, senão todo login despejaria a pessoa na home da equipe,
   longe do que ela tinha clicado.
   Até 04/08/2026 existia uma chave fixa antiga escrita aqui como padrão: quem
   abrisse a página sem chave nenhuma entrava assim mesmo, sem se identificar.
   A string não se repete neste arquivo de propósito — ele é servido ao
   navegador, e comentário vaza igual a código. */
if (!chaveAtual()) {
  location.replace('index?destino=' + encodeURIComponent(
    location.pathname.split('/').pop() + location.search + location.hash));
}
// Código do colaborador (?cod=) — vira a coluna "Colaborador" da aba log.
// Aqui o hash já é fallback da chave, então só lemos o parâmetro.
function codAtual(){return (new URLSearchParams(location.search).get('cod')||'').trim();}
function esc(s){return b4uTexto(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/** Lembra no navegador se a explicação fica aberta — a escolha é de quem usa. */
function ligarDetalhes(el,chave){
  if(!el)return;
  try{if(localStorage.getItem(chave)==='1')el.open=true;}catch(e){}
  el.addEventListener('toggle',()=>{try{localStorage.setItem(chave,el.open?'1':'0');}catch(e){}});
}
/* O servidor termina o serviço: o log mostra execuções de 15s, 17s e 23s completando
   e gravando o cache. Quem desistia cedo era o front, com teto de 20s — a resposta
   chegava e era jogada fora, e a pessoa lia "a API não respondeu" numa chamada que
   deu certo. 45s cobre a cauda longa da primeira abertura do dia. */
const JSONP_TETO = 45000, JSONP_PAUSA = 4000;

/* Só leitura repete. Toda escrita nossa viaja com `acao=` (ticket, marcar_guia,
   salvar_contatos, confiar_aparelho…) e o login por e-mail dispara código novo ou
   queima tentativa — repetir qualquer um desses lança em duplicidade. */
function jsonpRepetivel(url){
  return !/[?&]acao=[^&]/.test(url) && !/[?&]tipo=(login_email_|entrar_token)/.test(url);
}
/* Ficou vazia de propósito: quem cuida da espera na tela agora é o b4u-espera.js.
   As frases que esta função escrevia falavam em demora e em tentar de novo, e era
   lendo isso que a pessoa recarregava justo quando a resposta já vinha. A função
   continua existindo porque ainda é chamada de outros pontos. */
function jsonpAviso(){}
function jsonpTentativa(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},JSONP_TETO);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
/* Uma repetição, nunca mais que uma. A primeira execução provavelmente terminou e
   deixou o cache quente no servidor, então a segunda costuma voltar rápido. A tela
   de espera continua correndo por cima, sem avisar da repetição: quem lê "tentando
   de novo" recarrega justo quando a resposta já vinha. Erro só se a segunda falhar. */
function jsonp(url){
  return jsonpTentativa(url).catch(e=>{
    if(!jsonpRepetivel(url)) throw e;
    return new Promise(r=>setTimeout(r, JSONP_PAUSA)).then(()=>jsonpTentativa(url));
  });
}
/* O JSONP sempre teve teto; este POST não tinha nenhum. Uma resposta perdida
   deixava a promise pendurada para sempre: "Salvando…" eterno na ficha e o aviso
   de "sair sem salvar" pedindo confirmação até o F5. Agora há prazo — e, mais
   importante, quem estoura o prazo sabe QUE TIPO de silêncio foi. */
async function postAcao(obj,ms){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),ms||45000);
  try{
    /* O `JSON.stringify` mora DENTRO do try: fora dele, um valor circular ou um
       getter que estoura sairia sem marca nenhuma — nem `doServidor` nem
       `incerto` — e quem lê a exceção lá na frente não teria como saber que ela
       nunca chegou a virar requisição. */
    const body=JSON.stringify(Object.assign({chave:chaveAtual(),cod:codAtual()},obj));
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ctl.signal});
    const d=await r.json();
    /* Erro que o SERVIDOR mandou: ele processou, decidiu e recusou. É o único
       caso em que dá para garantir que não gravou. */
    if(d&&d.erro){ const err=new Error(d.erro); err.doServidor=true; throw err; }
    return d;
  }catch(e){
    /* ---------- "não salvou" é uma AFIRMAÇÃO, e o front não tem como fazê-la ----------
       O servidor GRAVA e só depois responde. Quando a resposta se perde, a
       gravação já aconteceu — e há quatro jeitos de isso ocorrer: o prazo
       estourar, o `r.json()` topar com uma página HTML (cota, tela de
       autorização), o 302 do /exec para o googleusercontent falhar, ou a aba ser
       suspensa com a requisição em voo.
       Em todos, a planilha está certa e a tela dizia "Não foi possível salvar".
       A equipe aprendeu a desconfiar do painel por causa disso.
       Agora a exceção carrega `.incerto`: só o erro VINDO DO SERVIDOR é falha de
       verdade; o resto é silêncio, e silêncio não é resposta. */
    if(e&&e.name==='AbortError'){ const x=new Error('A resposta demorou.'); x.incerto=true; throw x; }
    if(e&&e.doServidor) throw e;
    const x=new Error(String((e&&e.message)||e)); x.incerto=true; throw x;
  }finally{ clearTimeout(t); }
}

/* ---------------- releitura de confirmação ----------------
   `incerto` quer dizer "não sei", e "não sei" é o pior recado que um painel pode
   dar a quem acabou de digitar. Só existe um jeito de saber: PERGUNTAR DE NOVO.
   E perguntar é uma LEITURA — não repete a gravação e não cria processo nenhum.
   Por isso ela pode rodar sozinha, sem pedir licença.

   Vale só para `soc_salvar`, o processo que JÁ EXISTE, achado pela `row`. As
   outras três rotas ficam de fora porque nelas não há valor mandado para
   comparar: `soc_novo` cria a linha (não há row antes da resposta),
   `soc_nova_etapa` cria colunas na MESTRA e `soc_obs_*` ACRESCENTA ao histórico —
   mandar de novo escreveria a mesma observação duas vezes. Nas três, o silêncio
   manda recarregar, que é o único conselho seguro.

   Nada do que volta é pintado. A ficha continua exatamente como está: quem está
   digitando não pode ver o próprio texto ser trocado por causa de uma conferência
   que ele não pediu e não vê acontecer.

   Não existe rota de leitura por linha — esta página tem uma leitura só, a de
   bloco. `relerProcesso` é o ponto único onde isso está escrito: no dia em que o
   backend ganhar um `tipo=societario_linha&row=`, muda esta função e mais nada. */
const CONF_ESPERA=3000;   // o servidor grava DENTRO do lock: perguntar antes de ele soltar devolve o valor velho
/* Teto da conferência. O `jsonp()` desta página tem prazo de 45 s e AINDA repete
   uma vez depois de 4 s de pausa: no pior caso a pergunta levaria mais de um
   minuto e meio, com a faixa dizendo "conferindo se gravou…" o tempo todo. Passou
   de 25 s, a conferência desiste e vira dúvida — que é a resposta honesta, e é o
   mesmo que ela diria depois de esperar mais um minuto. */
const CONF_TETO=25000;
function comTeto(p,ms){return Promise.race([p,new Promise((_,f)=>setTimeout(()=>f(new Error('a conferência demorou')),ms))]);}
let CONF_N=0;                 // numera as gravações
const CONF_SEQ=new Map();     // row → número da última gravação disparada neste processo
function esperaMs(ms){return new Promise(r=>setTimeout(r,ms));}
async function relerProcesso(row){
  const d=await jsonp(API_URL+'?tipo=societario_equipe&chave='+encodeURIComponent(chaveAtual()));
  if(!d||d.erro) throw new Error(String((d&&d.erro)||'releitura vazia'));
  const p=(d.processos||[]).find(x=>String(x.row)===String(row));
  if(!p) throw new Error('processo não encontrado na releitura');
  return p;
}
/* 'bateu' | 'nao-bateu' | 'nao-sei'.
   NUNCA devolve 'bateu' por falta de informação: releitura que falhou é dúvida,
   não é confirmação. Um "Salvo ✓" errado custa mais caro que a dúvida.
   Confere o cabeçalho do processo e as etapas que a ficha mandou — cada etapa
   pelo seu `n`, nunca pela posição, porque a lista da tela mostra só até a última
   etapa preenchida e a da planilha vem inteira. */
/* Data de etapa é campo de TEXTO LIVRE ("05/08/2026", "set/2025", "Não localizado")
   e a planilha devolve o que quiser: se a célula estiver formatada como data, o
   "05/08/2026" digitado volta como "2026-08-05" — ou com hora junto. Comparar letra
   por letra transformaria uma gravação perfeita em "não gravou".
   Então as duas pontas passam pelo `parseDataFlex`, que é o MESMO tradutor que a
   página já usa para desenhar duração e etiquetas. Quando os dois lados são data,
   vale o dia; quando pelo menos um não é data, volta a valer o texto — que é o
   comportamento certo para "Não localizado". */
/* A planilha devolve NÚMERO onde o campo é texto: um código de processo "1042"
   volta como 1042, e `"1042" !== 1042` acusaria falta de gravação numa gravação
   perfeita — na única mensagem do sistema que convida a repetir. Quando os dois
   Quando os dois lados são numéricos, vale o NÚMERO. Isso inclui "0042" contra 42,
   e é de propósito: quando a célula não está formatada como Texto, o Sheets come o
   zero à esquerda TODA vez. Cobrar o zero faria a conferência dizer "não gravou,
   pode mandar de novo" para sempre, sobre uma gravação que entrou e vai continuar
   entrando exatamente assim. Zero comido é assunto de formatação da coluna, não de
   gravação perdida. */
function mesmoTexto(a,b){
  const sa=String(a==null?'':a).trim(), sb=String(b==null?'':b).trim();
  if(sa===sb) return true;
  if(!sa||!sb) return false;
  const na=Number(sa), nb=Number(sb);
  return Number.isFinite(na)&&Number.isFinite(nb)&&na===nb;
}
function mesmaData(a,b){
  const sa=String(a==null?'':a).trim(), sb=String(b==null?'':b).trim();
  if(sa===sb) return true;
  const pa=parseDataFlex(sa), pb=parseDataFlex(sb);
  if(!pa||!pb) return false;
  return pa.rot===pb.rot;
}
async function conferirGravacao(row,dados){
  try{
    await esperaMs(CONF_ESPERA);
    const p=await comTeto(relerProcesso(row),CONF_TETO);
    if(!mesmoTexto(p.nome,dados.nome)) return 'nao-bateu';
    if(!mesmoTexto(p.codigo_processo,dados.codigo_processo)) return 'nao-bateu';
    if(!mesmoTexto(p.processo,dados.processo)) return 'nao-bateu';
    if(!mesmoTexto(p.status_geral,dados.status_geral)) return 'nao-bateu';
    if(p.data_inicio_processo!==undefined&&!mesmaData(p.data_inicio_processo,dados.data_inicio_processo)) return 'nao-bateu';
    /* Os extras (responsável, UF, órgão, protocolo) só entram na conferência
       quando a releitura os traz. Cobrar um campo que o payload não devolve seria
       transformar um buraco no formato da resposta em "não gravou". */
    const ex=p.extras, exM=dados.extras||{};
    if(ex&&typeof ex==='object'){
      for(const k2 of Object.keys(exM)){
        if(ex[k2]===undefined) continue;
        if(!mesmoTexto(ex[k2],exM[k2])) return 'nao-bateu';
      }
    }
    const lidas=p.etapas||[];
    for(const e of (dados.etapas||[])){
      const a=lidas.find(x=>+x.n===+e.n);
      if(!a) return 'nao-bateu';
      if(a.aplicavel!==undefined&&!mesmoTexto(a.aplicavel,e.aplicavel)) return 'nao-bateu';
      if(!mesmoTexto(a.nome,e.nome)) return 'nao-bateu';
      if(!mesmoTexto(a.status,e.status)) return 'nao-bateu';
      if(!mesmaData(a.data_inicio,e.data_inicio)) return 'nao-bateu';
      if(!mesmaData(a.data_fim,e.data_fim)) return 'nao-bateu';
    }
    return 'bateu';
  }catch(_){ return 'nao-sei'; }
}
/* Status que já está gravado e não está na lista ("Aguardando documentação do
   cliente", "Exigência") entra na lista assim mesmo, logo abaixo do vazio e com
   o aviso "(fora da lista)". Sem isso o select nascia em "—" e o primeiro
   autosave apagava o que a equipe tinha escrito: a tela NUNCA troca nem apaga
   sozinha, o valor só muda quando alguém escolhe outro à mão. */
function selectHTML(cls,val){
  const bruto=String(val==null?'':val).trim();
  const opts=STATUS.slice();
  const fora=!!bruto&&!opts.some(o=>normTxt(o)===normTxt(bruto));
  if(fora)opts.splice(1,0,bruto);
  return `<select class="${cls}">`+opts.map(o=>{
    const rot=o?esc(o)+(fora&&o===bruto?' (fora da lista)':''):'—';
    return `<option value="${esc(o)}"${normTxt(o)===normTxt(bruto)?' selected':''}>${rot}</option>`;
  }).join('')+`</select>`;
}
function bdgStatus(s){const n=normTxt(s);let cl='agu';if(/conclu|finaliz|encerr/.test(n))cl='ok';else if(/andamento/.test(n))cl='and';else if(/nao se aplica|não se aplica/.test(n))cl='na';return `<span class="bdg ${cl}">${esc(s||'—')}</span>`;}

/* ===== duração do processo =====
   A planilha é mista: a data pode vir como yyyy-MM-dd (célula Data) ou como texto
   livre ("03/2026", "março/2026", "mar/26", "2026"). Quando só temos mês/ano (ou só o
   ano), estimamos o dia 1 e marcamos o resultado com "~". */
const MESES_ABREV={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const RE_CONCLUIDO=/conclu|finaliz|encerrad/;
function pad2(n){return String(n).padStart(2,'0');}
function ano4(a){return a<100?2000+a:a;}
function fmtData(d){return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();}
function parseDataFlex(v){
  const bruto=String(v==null?'':v).trim();
  const t=normTxt(bruto);
  if(!t)return null;
  let m;
  // yyyy-MM-dd (com ou sem hora)
  m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return {d:new Date(+m[1],+m[2]-1,+m[3]),est:false,rot:pad2(+m[3])+'/'+pad2(+m[2])+'/'+m[1],orig:bruto};
  // dd/mm/aaaa
  m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){const a=ano4(+m[3]);return {d:new Date(a,+m[2]-1,+m[1]),est:false,rot:pad2(+m[1])+'/'+pad2(+m[2])+'/'+a,orig:bruto};}
  // mm/aaaa
  m=t.match(/^(\d{1,2})[\/.-](\d{4})$/);
  if(m&&+m[1]>=1&&+m[1]<=12)return {d:new Date(+m[2],+m[1]-1,1),est:true,rot:pad2(+m[1])+'/'+m[2],orig:bruto};
  // mm/aa
  m=t.match(/^(\d{1,2})[\/.-](\d{2})$/);
  if(m&&+m[1]>=1&&+m[1]<=12){const a=ano4(+m[2]);return {d:new Date(a,+m[1]-1,1),est:true,rot:pad2(+m[1])+'/'+a,orig:bruto};}
  // nome do mês + ano: "março/2026", "mar 26", "março de 2026"
  const tn=t.replace(/\s+de\s+/g,'/').replace(/[\s.\-]+/g,'/');
  m=tn.match(/^([a-z]{3,9})\/?(\d{2,4})$/);
  if(m){const mm=MESES_ABREV[m[1].slice(0,3)];if(mm){const a=ano4(+m[2]);return {d:new Date(a,mm-1,1),est:true,rot:pad2(mm)+'/'+a,orig:bruto};}}
  // só o ano
  m=t.match(/^(\d{4})$/);
  if(m)return {d:new Date(+m[1],0,1),est:true,rot:'01/'+m[1],orig:bruto};
  return null;
}
function fmtDuracao(dias){
  const d=Math.max(0,Math.round(dias));
  if(d===0)return 'hoje';
  if(d<30)return d===1?'1 dia':d+' dias';
  const anos=Math.floor(d/365),resto=d-anos*365,meses=Math.floor(resto/30),rd=resto-meses*30;
  const partes=[];
  if(anos)partes.push(anos===1?'1 ano':anos+' anos');
  if(meses)partes.push(meses===1?'1 mês':meses+' meses');
  if(!anos&&rd)partes.push(rd===1?'1 dia':rd+' dias');
  if(!partes.length)partes.push(anos===1?'1 ano':anos+' anos');
  return partes.join(' e ');
}
/* "Não" é resposta, não ausência: a etapa marcada assim não faz parte deste
   processo e portanto não conta em lugar nenhum — nem na duração, nem no
   "3/7 etapas ok", nem na etapa atual. Sem esta função cada uma dessas contas
   teria de lembrar da marcação por conta própria, e uma delas ia esquecer. */
function aplicavelDe(e){return /^\s*n[ãa]o\s*$/i.test(String((e&&e.aplicavel)||'Sim'))?'Não':'Sim';}
function etapaVale(e){return !!e&&aplicavelDe(e)==='Sim';}
function etapasOrdenadas(p){return (p.etapas||[]).filter(etapaVale).slice().sort((a,b)=>(+a.n||0)-(+b.n||0));}
function primeiroInicio(p){for(const e of etapasOrdenadas(p)){const r=parseDataFlex(e.data_inicio);if(r)return r;}return null;}
function ultimoFim(p){const arr=etapasOrdenadas(p).reverse();for(const e of arr){const r=parseDataFlex(e.data_fim);if(r)return r;}return null;}
function procConcluido(p){
  if(RE_CONCLUIDO.test(normTxt(p.status_geral)))return true;
  const nomeadas=(p.etapas||[]).filter(e=>etapaVale(e)&&String(e.nome||'').trim());
  return nomeadas.length>0&&nomeadas.every(e=>RE_CONCLUIDO.test(normTxt(e.status)));
}
function calcDuracao(p){
  const ini=primeiroInicio(p);
  if(!ini)return null;                       // sem data de início não dá para medir
  const concluido=procConcluido(p);
  const fimR=concluido?ultimoFim(p):null;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const fim=fimR?fimR.d:hoje;
  return {ini,fimR,fim,hoje,concluido,dias:Math.max(0,Math.round((fim-ini.d)/86400000)),estimado:!!(ini.est||(fimR&&fimR.est))};
}
function duracaoHTML(p){
  const c=calcDuracao(p);
  if(!c)return `<span class="bdg dur na" title="Nenhuma etapa tem data de início preenchida.">⏱ sem data de início</span>`;
  const dicas=[];
  /* O tooltip mostra o texto de origem para explicar de onde saiu a estimativa —
     mas sem dizer "planilha": de onde o dado vem é vocabulário nosso, e este balão
     também aparece em tela que o cliente pode estar vendo por cima do ombro. */
  if(c.ini.est)dicas.push('início estimado no dia 1 de '+c.ini.rot+' (informado como: '+c.ini.orig+')');
  if(c.fimR&&c.fimR.est)dicas.push('fim estimado no dia 1 de '+c.fimR.rot+' (informado como: '+c.fimR.orig+')');
  dicas.push('De '+fmtData(c.ini.d)+' até '+(c.fimR?fmtData(c.fim):'hoje, '+fmtData(c.hoje)));
  const rotulo=(c.estimado?'~':'')+fmtDuracao(c.dias)+(c.concluido?' (concluído)':' (em andamento)');
  return `<span class="bdg dur ${c.concluido?'ok':''}" title="${esc(dicas.join(' · '))}">⏱ ${esc(rotulo)}</span>`;
}
/* última movimentação = maior data (início ou fim) entre todas as etapas */
function ultimaMov(p){
  let melhor=null;
  for(const e of etapasOrdenadas(p)){
    for(const v of [e.data_inicio,e.data_fim]){
      const r=parseDataFlex(v);
      if(r&&(!melhor||r.d>melhor.d))melhor=r;
    }
  }
  return melhor;
}
function diasDesde(d){const h=new Date();h.setHours(0,0,0,0);return Math.floor((h-d)/86400000);}
function metaHTML(p){
  const nEt=(p.etapas||[]).filter(e=>etapaVale(e)&&e.nome).length;
  const nOk=(p.etapas||[]).filter(e=>etapaVale(e)&&e.nome&&RE_CONCLUIDO.test(normTxt(e.status))).length;
  return duracaoHTML(p)+bdgStatus(p.status_geral)+`<span class="bdg agu">${nOk}/${nEt} etapas ok</span>`+(p.codigo_processo?`<span class="bdg na">${esc(p.codigo_processo)}</span>`:'');
}

let PROCS=[];
/* O catálogo padrão de etapas, como a PLANILHA o define (aba "Etapas Padrão").
   Nada aqui é uma lista escrita à mão: acrescentar uma etapa ao catálogo é mexer
   na planilha, e esta tela passa a oferecê-la sem deploy nenhum. */
let CATALOGO=[];
/* O nome que o catálogo dá à etapa N. Vazio = a etapa N é um espaço LIVRE: existe
   como coluna na planilha, com fórmula alcançando, mas o nome é de quem usar. */
function padraoDe(n){const c=CATALOGO.find(x=>+x.n===+n);return c?String(c.nome||'').trim():'';}
/* Espaço livre é o que o catálogo NÃO nomeia. Sem catálogo carregado, porém,
   `!padraoDe(n)` diria que as 18 são livres — e o "+ Adicionar etapa" passaria a
   oferecer uma etapa do catálogo, com nome em branco, como se fosse nova. Sem
   catálogo não se sabe o que é livre, e não saber é resposta melhor que chutar. */
function temCatalogo(){return CATALOGO.length>0;}
function ehLivre(n){return temCatalogo()&&!padraoDe(n);}
function carregar(){
  return jsonp(API_URL+'?tipo=societario_equipe&chave='+encodeURIComponent(chaveAtual()))
    .then(d=>{if(d.erro)throw new Error(d.erro);
      /* Quantas etapas existem é a PLANILHA quem diz: o servidor conta os blocos
         "Etapa N" do cabeçalho. Hoje são as 14 do catálogo padrão; se um dia a
         MESTRA ganhar um bloco 15, esta tela desenha os 15 sem deploy nenhum. */
      /* Quem está usando, para o botão da barra. ESTA ROTA AINDA NÃO MANDA O NOME:
         só `tipo=equipe` (colaborador) e `tipo=daily_equipe` trazem um `eu`, e o
         `?cod=` da URL é código de log, não nome — batizar o botão com ele seria
         inventar. Então o botão fica com o rótulo genérico "Minha conta" e o painel
         diz, sem rodeio, que não identificou quem está usando; o seletor de
         aparência, que é o motivo de o botão existir, funciona igual.
         A leitura de `d.eu` já está escrita: no dia em que `societario_equipe` passar a
         devolver `eu:{nome}` — o servidor já resolve o colaborador pela chave, em
         `exigirEquipe_` — o nome aparece aqui sem tocar nesta tela. */
      if(window.B4UShell) B4UShell.usuario({nome:(d.eu&&d.eu.nome)||''});
      CATALOGO=Array.isArray(d.catalogo)?d.catalogo:[];
      /* Antes a ficha revelava só até a última etapa PREENCHIDA, porque as etapas
         eram texto livre e mostrar dez campos vazios não dizia nada. Com o catálogo
         fixo o contrário é que vale: as do catálogo aparecem sempre, e é a marcação
         Sim/Não que diz quais valem — inclusive as que ainda não começaram. Só os
         espaços livres não usados ficam de fora, atrás do "+ Adicionar etapa". */
      PROCS=d.processos||[];render();
      /* A lista já está pintada: a barra corre até 100% e o overlay sai revelando
         a tela pronta, sem somar espera de verdade. */
      if(window.B4UEspera)B4UEspera.concluir();})
    /* Uma mensagem só, sem detalhe técnico. O que estava aqui apontava arquivo do
       servidor e parâmetro do endereço — vocabulário nosso, que na tela de quem usa
       só assusta. Quem conserta é a equipe, pelo log; a pessoa pode tentar de novo. */
    .catch(function(){
      if(window.B4UEspera)B4UEspera.telaErro(document.getElementById('app'));
      else document.getElementById('app').innerHTML=
        '<div class="state"><h1>Não conseguimos carregar as informações</h1>'
        +'<p>Houve um erro ao recuperar as informações. Tente novamente em alguns '
        +'minutos. Se o problema continuar, entre em contato com o atendimento.</p></div>';
    });
}
/* ===== filtros, ordenação e busca =====
   Os três combinam: o chip de situação e a ordenação sempre trabalham em cima do
   que a busca deixou passar. Nada disso mexe no salvamento: redesenhar a lista
   fecha o editor aberto, exatamente como a busca já fazia antes — e o autosave
   captura os campos no evento "change" (que dispara no blur, antes do clique),
   então nada digitado se perde. */
const PARADO_DIAS=30;

/* ---------- revelação progressiva ----------
   Filtros recolhidos, com memória. O contador ao lado do botão existe para evitar
   o único efeito colateral ruim de esconder filtro: a pessoa esquece que filtrou e
   acha que os processos sumiram. Por isso, com filtro ativo, o painel nasce ABERTO. */
function ligarFiltros(pagina, contarAtivos){
  const bt = document.getElementById('btn-filtros');
  const pn = document.getElementById('painel-filtros');
  if(!bt || !pn) return;
  const chave = 'b4u_filtros_' + pagina;
  const abrir = (v, persistir) => { pn.hidden = !v; bt.setAttribute('aria-expanded', String(v));
                       if(persistir){ try{ localStorage.setItem(chave, v?'1':'0'); }catch(e){} } };
  let inicial = false;
  try{ inicial = localStorage.getItem(chave) === '1'; }catch(e){}
  /* Abrir por causa de filtro ativo NÃO é escolha da pessoa — e por isso não pode
     virar preferência. Antes esta abertura automática era gravada junto: bastava
     entrar uma vez por um link com filtro para o painel passar a nascer aberto
     para sempre, sem ninguém ter pedido. Só o clique persiste. */
  const forcado = !!(contarAtivos && contarAtivos() > 0);
  abrir(inicial || forcado, false);
  bt.addEventListener('click', ()=> abrir(pn.hidden, true));
  return { atualizarContador(){
    const n = contarAtivos ? contarAtivos() : 0;
    const c = bt.querySelector('.cont-filtros');
    if(c){ c.textContent = n; c.hidden = n === 0; }
  }};
}
let FILTROS_UI=null;

/* Teto da lista. Dois botões de propósito: "mais 20" para quem lê, "todos" para
   quem vai usar Ctrl+F. Buscar, filtrar ou reordenar volta o teto ao início — o
   resultado é outro, e continuar de onde parou confundiria. */
const PASSO=20;
let TETO=PASSO;
function rodapeLista(mostrados,total){
  if(total<=mostrados)return '';
  const faltam=total-mostrados;
  return `<div class="lista-mais">
    <button type="button" class="btn-mais">Mostrar mais ${Math.min(PASSO,faltam)}</button>
    <button type="button" class="btn-todos">Mostrar todos os ${total}</button>
  </div>`;
}

let BUSCA='';
/* ---------- o estado dos filtros ----------
   Eram uma variável só (`FILTRO`, uma string) porque o controle era um <select>
   de escolha única. Agora são DUAS listas, uma por caixa, e o que mudou não é só
   o tipo: escolher um status deixou de apagar o atalho escolhido antes.

   Dentro de uma caixa, marcar dois é OU ("parado OU sem responsável"); entre as
   duas caixas é E ("em andamento E parado"). É a mesma leitura do daily.html —
   cada caixa estreita, e dentro dela os marcados se somam. Lista vazia quer
   dizer "não estou filtrando por aqui" (`vazio:'todos'` no componente): as duas
   nascem vazias, e ninguém chega ao vazio desmarcando o último de uma lista que
   nasceu cheia, então não há o que avisar. */
let F_STATUS=[];   // chaves de status geral (chaveStatus); K_SEM = "sem status"
let F_ATALHO=[];   // atalhos: aberto · concluido · parado · semdata · semresp
/* "Sem status" é um valor de filtro como os outros, e precisa de um valor que
   caiba na URL e nunca colida com um status de verdade. `chaveStatus` devolve
   texto sem acento e em minúsculo, então uma planilha teria de trazer
   literalmente "--sem--" na coluna Status Geral para haver conflito. */
const K_SEM='--sem--';
const stkDe=r=>r.stk||K_SEM;

let SORT={k:'dur',dir:'desc'};   // padrão: mais tempo em aberto no topo
/* ---------- ordenar pelo cabeçalho da coluna ----------
   Uma entrada por COLUNA da lista, na ordem em que elas aparecem. O <select
   id="f-ord"> que ficava na régua acabou — "aplicar ordenar títulos AZ ZA sem
   ter a ordenação no filtro lá em cima" —, e as cinco ordens que ele oferecia
   estão todas aqui: Tempo, Última movimentação, ID, Cliente e Status geral.
   Duas colunas que ele NÃO sabia ordenar (Processo e Etapa atual) ganharam a
   ordem de brinde, porque agora o critério é a coluna e não uma lista à parte.

   `rot` é o que está escrito no cabeçalho — o rótulo da ordem e o rótulo da
   coluna passaram a ser a mesma palavra, que é o ponto do gesto. */
const ORD_COLS=[
  {k:'id',    rot:'ID'},
  {k:'nome',  rot:'Cliente'},
  {k:'proc',  rot:'Processo'},
  {k:'etapa', rot:'Etapa atual'},
  {k:'dur',   rot:'Tempo',        est:'text-align:center'},
  {k:'mov',   rot:'Movimentação', est:'text-align:center'},
  {k:'status',rot:'Situação',     est:'text-align:right'}
];
/* O que cada direção QUER DIZER, para o title do botão dizer o que o próximo
   clique faz. São as mesmas frases que ficavam nas opções do #f-ord. */
const DIR_ROT={dur:['menor duração','maior duração'],mov:['movimentação mais antiga','movimentação mais recente'],id:['ID crescente','ID decrescente'],nome:['A → Z','Z → A'],proc:['A → Z','Z → A'],etapa:['A → Z','Z → A'],status:['em andamento primeiro','concluídos por último']};
/* Usado só para decidir se a direção precisa ir para a URL: `?dir=` some quando
   é a de repouso daquele critério. O CLIQUE no cabeçalho não usa isto — ver o
   comentário no ouvinte, lá embaixo: primeiro clique sempre sobe (A→Z). */
function dirPadrao(k){return (k==='dur'||k==='mov')?'desc':'asc';}
function rotOrd(k){const o=ORD_COLS.find(x=>x.k===k);return o?o.rot:k;}
/* chave única do status: sem acento, sem caixa e sem espaço sobrando —
   assim "Concluído" e "concluido " viram a mesma opção. */
function chaveStatus(s){return normTxt(s).replace(/\s+/g,' ');}
function pesoStatus(k){
  if(!k)return 5;                              // sem status vai depois de tudo
  if(/andamento/.test(k))return 0;
  if(/aguard|pendente|analis|protocol|exig/.test(k))return 1;
  if(RE_CONCLUIDO.test(k))return 4;
  if(/nao se aplica|cancel|desist|arquiv/.test(k))return 3;
  return 2;
}
/* calculado uma vez por desenho e reaproveitado em filtro, contagem e ordem */
function resumoProc(p){
  const c=calcDuracao(p),mov=ultimaMov(p);
  return {
    conc:procConcluido(p),
    dias:c?c.dias:null,
    mov:mov?mov.d.getTime():null,
    paradoDias:mov?diasDesde(mov.d):null,
    semResp:!String((p.extras&&p.extras.responsavel)||'').trim(),
    stk:chaveStatus(p.status_geral)
  };
}
/* lista de status montada a partir dos dados, na ordem que a equipe usa */
function statusDisponiveis(){
  const mapa=new Map();
  PROCS.forEach(p=>{
    const bruto=String(p.status_geral==null?'':p.status_geral).replace(/\s+/g,' ').trim();
    const k=chaveStatus(bruto);
    if(!k)return;                              // vazio tem o chip "Sem status"
    const it=mapa.get(k)||{k,rot:bruto,vars:new Map()};
    it.vars.set(bruto,(it.vars.get(bruto)||0)+1);
    mapa.set(k,it);
  });
  // o chip mostra a grafia mais usada na planilha (empate: a que tem maiúscula/acento)
  const nota=v=>(v!==v.toLowerCase()?1:0)+(/[áâãàéêíóôõúüç]/i.test(v)?1:0);
  return [...mapa.values()].map(it=>{
    let melhor=it.rot,mc=-1;
    it.vars.forEach((c,v)=>{if(c>mc||(c===mc&&nota(v)>nota(melhor))){melhor=v;mc=c;}});
    return {k:it.k,rot:melhor};
  }).sort((a,b)=>pesoStatus(a.k)-pesoStatus(b.k)||a.rot.localeCompare(b.rot,'pt'));
}
function passaBusca(p,alvo){
  return !alvo||normTxt(p.id+' '+p.nome+' '+p.codigo_processo+' '+p.processo+' '+p.status_geral).includes(alvo);
}
/* UM atalho, sozinho. Continua existindo como função de um valor só porque é ela
   que responde "quantos processos casam com esta linha do painel?" — a contagem
   de cada rótulo — e porque o resumo em texto lá de cima conta os parados por
   ela. Os valores de status saíram daqui (têm caixa própria agora); o que sobrou
   são as cinco perguntas. */
function passaFiltro(p,r,f){
  switch(f){
    case 'todos':return true;
    case 'aberto':return !r.conc;
    case 'concluido':return r.conc;
    // parado = ainda em aberto e sem nenhuma data de etapa nos últimos 30 dias.
    // Quem não tem data nenhuma cai em "Sem datas", não aqui.
    case 'parado':return !r.conc&&r.paradoDias!=null&&r.paradoDias>PARADO_DIAS;
    case 'semdata':return r.mov==null;
    case 'semresp':return r.semResp;
    default:return true;
  }
}
/* Cada caixa estreita por si; lista vazia não estreita nada. Dentro da caixa os
   marcados se SOMAM (é "ou"): marcar "Parados" e "Sem responsável" pede as duas
   pilhas de uma vez, que é a pergunta de quem senta para trabalhar — e era
