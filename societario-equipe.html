/* ===================================================================
   A ficha do processo, no modal
   -------------------------------------------------------------------
   A lista mostra as colunas que a equipe lê de relance; o processo
   inteiro abre aqui, por cima, sem trocar de página e sem empurrar as
   outras linhas para baixo. O conteúdo é o MESMO editorHTML() de
   sempre — e ele continua morando num #ed-<row>, então coletar(),
   agendarSalvar(), addObs() e addEtapa() não mudaram uma linha.
   =================================================================== */
let FICHA_ROW='';        // de qual processo é a ficha aberta
let CAD_AVISADO=false;   // já avisamos que tem coisa por gravar? (fechar em 2 tempos)
function elCad(){return document.getElementById('modalCad');}
function cadAberto(){const m=elCad();return !!m&&!m.hidden;}
/** Aviso de "tem alteração por gravar" no rodapé; o botão passa a dizer que sai assim mesmo. */
function avisoCad(mostrar){
  const a=document.getElementById('cadAviso');if(a)a.hidden=!mostrar;
  const b=document.getElementById('cadFechar');if(b)b.textContent=mostrar?'Fechar assim mesmo':'Fechar';
}
/** Cliente, ID e situação no topo da ficha — acompanham a edição sem redesenhar nada. */
function atualizarTopoCad(row){
  if(!cadAberto()||String(FICHA_ROW)!==String(row))return;
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  const s=situacaoDe(p,resumoProc(p)),info=SITUACOES[s];
  const t=document.getElementById('cadTitulo');if(t)t.textContent=p.nome||'(sem nome)';
  const i=document.getElementById('cadId');
  if(i)i.textContent=String(p.id||'')+(String(p.codigo_processo||'').trim()?' · '+p.codigo_processo:'');
  const q=document.getElementById('cadSit');
  if(q){q.className='pill sit-'+s;q.title=info.dica;q.textContent=rotuloSituacao(p,s);}
}
/** Acende na lista a linha da ficha que está aberta. */
function marcarLinhaAberta(){
  document.querySelectorAll('.proc').forEach(n=>n.classList.toggle('aberto',String(n.dataset.row)===String(FICHA_ROW)));
}
/* O nome ficou: `abrirEditor` é chamado de outros pontos (o processo recém-criado
   abre por ele) e o que ele faz continua sendo o mesmo — mostrar o editor daquele
   processo. Só um por vez, agora por construção: só existe uma ficha. */
function abrirEditor(row){
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  const m=elCad();if(!m)return;
  FICHA_ROW=String(p.row);CAD_AVISADO=false;
  document.getElementById('cadBody').innerHTML=
    `<div class="editor" id="ed-${esc(String(p.row))}" data-row="${esc(String(p.row))}">${editorHTML(p)}</div>`;
  m.hidden=false;
  /* Enquanto a ficha está aberta a página atrás não rola — o mesmo gesto do modal
     de processo novo. */
  document.body.style.overflow='hidden';
  atualizarTopoCad(FICHA_ROW);
  avisoCad(false);
  marcarLinhaAberta();
  /* Reabrir não pode apagar o que não gravou: a faixa e o "tentar de novo" nascem
     de novo junto com os campos. */
  if(FALHAS.has(String(p.row)))marcarFalha(p.row,true);
  const cx=m.querySelector('.modal-box');if(cx)cx.focus();
}
function reabrir(row){
  const ed=document.getElementById('ed-'+row);const p=PROCS.find(x=>x.row==row);
  if(!ed||!p)return;
  ed.innerHTML=editorHTML(p);
  if(FALHAS.has(String(row)))marcarFalha(row,true);   // repintar não apaga o que não gravou
}
/* Fechar com alteração por gravar avisa antes, em dois tempos como o resto da casa
   (nunca uma caixa do navegador): o primeiro Fechar/Esc/clique no véu explica, o
   segundo sai. Ao sair assim mesmo a gravação pendente é DESCARREGADA na hora —
   deixar o debounce correndo com a ficha fora da tela é exatamente o jeito de
   perder o que foi digitado. */
function fecharFicha(){
  const m=elCad();if(!m||m.hidden)return;
  if(temPendencia()&&!CAD_AVISADO){CAD_AVISADO=true;avisoCad(true);return;}
  if(PEND_DADOS.size)descarregarPendentes();
  m.hidden=true;
  document.body.style.overflow='';
  const row=FICHA_ROW;FICHA_ROW='';CAD_AVISADO=false;
  avisoCad(false);
  marcarLinhaAberta();
  document.getElementById('cadBody').innerHTML='';
  /* O foco volta para a linha de onde saiu: quem navega por teclado não é jogado
     de volta para o topo da página. */
  const no=document.querySelector('.proc[data-row="'+row+'"] .proc-h');
  if(no)no.focus();
}
/* O botão "Salvar alterações" NÃO substitui o autosave: cada mudança de campo
   continua chamando agendarSalvar(), e é ele que impede perder texto digitado —
   foi para isso que ele existe nesta tela. O botão ANTECIPA a gravação pendente
   (mata o debounce e salva na hora), espera a que já está no ar, reenvia o que
   falhou e, quando tudo entrou, FECHA a ficha: salvar é o gesto de encerrar, e
   ficar com a ficha aberta depois de confirmar faz a pessoa clicar em Fechar sem
   saber se gravou.

   Só fecha se gravou MESMO. Falha mantém a ficha na tela: fechar por cima de uma
   gravação que não foi levaria embora o aviso e a chance de tentar de novo, e a
   pessoa sairia achando que salvou. */
async function salvarAgoraCad(){
  const btn=document.getElementById('cadSalvar');
  if(temPendencia()){
    if(btn){btn.disabled=true;btn.dataset.rot=btn.textContent;btn.textContent='Salvando…';}
    try{
      /* o que está no debounce e o que falhou antes entram juntos na mesma leva */
      const alvos=new Map();
      PEND_DADOS.forEach((d,k)=>alvos.set(k,d));
      FALHAS.forEach((d,k)=>{if(!alvos.has(k))alvos.set(k,d);});
      alvos.forEach((d,k)=>{clearTimeout(saveTimers[k]);PEND_DADOS.delete(k);FALHAS.delete(k);});
      const disparos=[];
      alvos.forEach((d,k)=>disparos.push(disparar(k,d)));
      /* e o que JÁ estava viajando quando a pessoa clicou também é esperado —
         senão o botão terminava antes da resposta e a ficha não fechava nunca. */
      EMVOO.forEach(pr=>disparos.push(pr));
      await Promise.all(disparos);
    }catch(e){ /* salvarAuto() já registra a falha em FALHAS e avisa na tela */ }
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.rot||'Salvar alterações';}
  }
  if(temPendencia())return;            // não gravou: a ficha continua aberta
  CAD_AVISADO=false;avisoCad(false);
  fecharFicha();
}

function coletar(row){
  const ed=document.getElementById('ed-'+row);
  const etapas=[...ed.querySelectorAll('.etapa')].map(el=>({n:+el.dataset.n,nome:el.querySelector('.e-nome').value.trim(),status:el.querySelector('.e-status').value,data_inicio:el.querySelector('.e-ini').value.trim(),data_fim:el.querySelector('.e-fim').value.trim()}));
  return {nome:ed.querySelector('.f-nome').value.trim(),codigo_processo:ed.querySelector('.f-cod').value.trim(),processo:ed.querySelector('.f-proc').value.trim(),status_geral:ed.querySelector('.f-stg').value,extras:{responsavel:ed.querySelector('.f-e34').value.trim(),uf:ed.querySelector('.f-e35').value.trim(),orgao:ed.querySelector('.f-e36').value.trim(),protocolo:ed.querySelector('.f-e37').value.trim(),dias:ed.querySelector('.f-dias').value.trim()},etapas};
}
let saveTimers={};
/* ---------- pendências e falhas de gravação (C.3) ----------
   PENDENTES = alteração ainda no debounce ou já viajando. FALHAS = o servidor
   recusou e o dado só existe na tela. Nos dois casos fechar a aba pede
   confirmação, e a falha deixa o processo marcado com um "tentar de novo". */
const PENDENTES=new Set();
const FALHAS=new Map();   // row -> dados que não foram gravados
/* O que está esperando o debounce, capturado no momento em que a pessoa mexeu.
   O botão "Salvar alterações" e o Fechar precisam poder disparar ESSES dados sem
   esperar os 450 ms — e sem depender de a ficha ainda estar na tela. */
const PEND_DADOS=new Map();   // row -> dados capturados por agendarSalvar
/* Gravações já disparadas. O botão espera por elas antes de decidir se fecha:
   sem isto, clicar em Salvar durante um autosave em voo terminava antes da
   resposta e a ficha ficava aberta como se nada tivesse entrado. */
const EMVOO=new Map();        // row -> promessa da gravação em andamento
function temPendencia(){return PENDENTES.size>0||FALHAS.size>0;}
function disparar(row,dados){
  const k=String(row);
  const pr=salvarAuto(row,dados);
  EMVOO.set(k,pr);
  const solta=()=>{if(EMVOO.get(k)===pr)EMVOO.delete(k);};
  pr.then(solta,solta);
  return pr;
}
/* Grava agora o que estava esperando o debounce. É o salvarAuto() de sempre, só
   sem os 450 ms de espera. */
function descarregarPendentes(){
  Array.from(PEND_DADOS.keys()).forEach(k=>{
    const d=PEND_DADOS.get(k);
    clearTimeout(saveTimers[k]);PEND_DADOS.delete(k);
    if(d)disparar(k,d);
  });
}
function marcarFalha(row,falhou){
  /* A LINHA continua marcada na lista mesmo com a ficha fechada — é o que mostra,
     de longe, que aquele processo tem coisa que não gravou. */
  const cx=document.querySelector('.proc[data-row="'+row+'"]');
  if(cx)cx.classList.toggle('falhou',!!falhou);
  /* A faixa e o botão vivem no editor, que hoje é pintado dentro do modal: achar
     o #ed-<row> funciona esteja ele onde estiver — e ele não existe quando a
     ficha está fechada, que é justamente o caso em que não há o que marcar. */
  const ed=document.getElementById('ed-'+row);
  const ign=ed&&ed.querySelector('.ign');
  if(!ign)return;
  const antigo=ign.querySelector('.btn-retry');
  if(falhou&&!antigo)ign.insertAdjacentHTML('beforeend',
    '<button type="button" class="btn-retry" data-retry="'+esc(String(row))+'">não salvou — tentar de novo</button>');
  if(!falhou&&antigo)antigo.remove();
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
window.addEventListener('beforeunload',e=>{if(temPendencia()){e.preventDefault();e.returnValue='';}});
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function setMsg(row,cls,txt){
  const cl='save-status '+(/ok/.test(cls)?'ok':/err/.test(cls)?'err':'saving');
  const el=document.getElementById('saveStatus');   // status VISÍVEL no topo (barra fixa)
  if(el){el.className=cl;el.textContent=txt;}
  /* O mesmo recado no rodapé da ficha: com o modal aberto a barra do topo fica
     atrás do véu, e "não foi possível salvar" atrás do véu é aviso que ninguém lê. */
  const ec=document.getElementById('saveStatusCad');
  if(ec){ec.className=cl+' claro';ec.textContent=txt;}
}
function agendarSalvar(row){
  const dados=coletar(row);                       // captura AGORA (mesmo que feche a ficha depois)
  setMsg(row,'autosave','Alterado…');
  PENDENTES.add(String(row));
  PEND_DADOS.set(String(row),dados);              // o botão "Salvar alterações" antecipa ESTES dados
  clearTimeout(saveTimers[row]);
  saveTimers[row]=setTimeout(()=>disparar(row,dados),450);
}
async function salvarAuto(row,dados){
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  setMsg(row,'autosave','Salvando…');
  PENDENTES.add(String(row));
  PEND_DADOS.delete(String(row));                 // daqui para a frente está no ar, não mais no debounce
  try{
    await postAcao(Object.assign({acao:'soc_salvar',row:p.row,id:p.id},dados));
    Object.assign(p,{nome:dados.nome,codigo_processo:dados.codigo_processo,processo:dados.processo,status_geral:dados.status_geral,extras:dados.extras});
    dados.etapas.forEach(e=>{const alvo=p.etapas[e.n-1];if(alvo){alvo.nome=e.nome;alvo.status=e.status;alvo.data_inicio=e.data_inicio;alvo.data_fim=e.data_fim;}});
    setMsg(row,'msg ok','Salvo ✓ '+horaAgora());
    atualizarLinha(row);
    PENDENTES.delete(String(row));FALHAS.delete(String(row));marcarFalha(row,false);
    /* Gravou tudo: o aviso de "tem coisa por gravar" no rodapé da ficha sai, e o
       Fechar volta a ser Fechar. */
    if(!temPendencia()){CAD_AVISADO=false;avisoCad(false);}
    try{atualizarChips();}catch(_){}   // contagem dos chips em dia; a lista fica como está
  }catch(e){
    PENDENTES.delete(String(row));
    FALHAS.set(String(row),dados);
    marcarFalha(row,true);
    /* A linha fica marcada e o "tentar de novo" continua ali; o texto da exceção
       não entra na tela — é vocabulário de quem mantém o painel, não de quem usa. */
    setMsg(row,'msg err','Não foi possível salvar. Tente de novo.');
  }
}
/* Depois de gravar, a linha da lista acompanha o que mudou — cliente, processo,
   etapa atual, movimentação e situação — sem redesenhar a lista inteira. Os campos
   vivem no modal, então repintar a linha aqui não tira o foco de ninguém; e se o
   foco estava NA linha (é onde ele volta ao fechar a ficha), ele volta para ela
   depois da repintura, em vez de ser jogado para o topo da página. */
function atualizarLinha(row){
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  const r=resumoProc(p);
  const no=document.querySelector('.proc[data-row="'+row+'"]');
  if(no){
    const cab=no.querySelector('.proc-h');
    const tinhaFoco=!!cab&&document.activeElement===cab;
    no.innerHTML=cabecaHTML(p,r);
    if(tinhaFoco){const nova=no.querySelector('.proc-h');if(nova)nova.focus();}
    /* a faixa lateral acompanha a mudança de situação sem redesenhar a lista */
    SIT_CLASSES.forEach(c=>no.classList.remove(c));
    no.classList.add('sit-'+situacaoDe(p,r));
  }
  /* e a ficha aberta mostra o cliente, o código e a situação novos — mais o resumo
     de badges (⏱ duração, status, etapas ok) que mora no alto dela. */
  atualizarTopoCad(row);
  const ed=document.getElementById('ed-'+row);
  const meta=ed&&ed.querySelector('.pmeta');
  if(meta)meta.innerHTML=metaHTML(p);
}
async function addObs(row,btn,tipo,n){
  const p=PROCS.find(x=>x.row==row);const ed=document.getElementById('ed-'+row);
  const ta=tipo==='geral'?ed.querySelector('[data-gobs]'):ed.querySelector(`[data-etobs="${n}"]`);
  const texto=ta.value.trim();if(!texto){ta.focus();return;}
  btn.disabled=true;const txtOrig=btn.textContent;btn.textContent='…';
  try{
    const acao=tipo==='geral'?'soc_obs_geral':'soc_obs_etapa';
    const d=await postAcao(Object.assign({acao,row:p.row,id:p.id,texto},tipo==='etapa'?{n}:{}));
    if(tipo==='geral'){p.observacoes_internas=d.valor;const log=ed.querySelector('[data-glog]');log.textContent=d.valor;log.classList.remove('vazio');}
    else{p.etapas[n-1].obs_interna=d.valor;const log=ed.querySelector(`[data-etlog="${n}"]`);log.textContent=d.valor;log.classList.remove('vazio');}
    ta.value='';ta.scrollIntoView({block:'nearest'});
  /* O texto digitado continua no campo, então basta tentar de novo — sem despejar
     a exceção na tela. */
  }catch(e){setMsg(p.row,'msg err','Não foi possível salvar a observação. Tente de novo.');}
  btn.disabled=false;btn.textContent=txtOrig;
}
function addEtapa(row){const p=PROCS.find(x=>x.row==row);if(p._visN>=10)return;p._visN++;reabrir(row);}

// modal novo processo
function abrirNovo(){document.getElementById('n-stg').innerHTML=STATUS.filter(Boolean).map(o=>`<option${o==='Em andamento'?' selected':''}>${o}</option>`).join('');['n-id','n-nome','n-cod','n-proc'].forEach(i=>document.getElementById(i).value='');document.getElementById('n-msg').textContent='';document.getElementById('modal').classList.add('on');}
function fecharNovo(){document.getElementById('modal').classList.remove('on');}
async function criarNovo(btn){
  const id=document.getElementById('n-id').value.trim(),proc=document.getElementById('n-proc').value.trim();
  const msg=document.getElementById('n-msg');
  if(!id||!proc){msg.className='msg err';msg.textContent='Informe ID e Processo.';return;}
  btn.disabled=true;msg.className='msg';msg.textContent='Criando…';
  try{
    const d=await postAcao({acao:'soc_novo',id,nome:document.getElementById('n-nome').value.trim(),codigo_processo:document.getElementById('n-cod').value.trim(),processo:proc,status_geral:document.getElementById('n-stg').value});
    fecharNovo();FILTRO='todos';BUSCA='';SORT={k:'dur',dir:dirPadrao('dur')};TETO=PASSO;
    sincronizarURL();                                        // limpa o endereço ANTES de recarregar
    await carregar();   // o processo novo não pode nascer escondido por um filtro
    garantirVisivel(d.row);   // nem atrás do teto
    const el=document.querySelector(`.proc[data-row="${d.row}"]`);if(el){el.scrollIntoView({block:'center'});abrirEditor(d.row);}
  /* O que está no formulário não se perde: a pessoa corrige ou tenta de novo, e o
     motivo técnico fica no log do servidor, não na tela dela. */
  }catch(e){msg.className='msg err';msg.textContent='Não foi possível criar o processo. Tente de novo.';}
  btn.disabled=false;
}

// eventos (delegação)
document.addEventListener('click',e=>{
  const rt=e.target.closest('[data-retry]');
  if(rt){
    e.stopPropagation();
    const k=rt.dataset.retry,d=FALHAS.get(k);
    if(d){rt.textContent='enviando…';rt.disabled=true;disparar(k,d);}
    return;
  }
  /* Rodapé da ficha: salvar agora, fechar, e o × do topo. Vêm antes do teste do
     véu, senão o clique no botão contaria como clique fora. */
  if(e.target.closest('#cadSalvar')){salvarAgoraCad();return;}
  if(e.target.closest('#cadFechar')||e.target.closest('#fechaCad')){fecharFicha();return;}
  if(e.target.id==='modalCad'){fecharFicha();return;}
  const cf=e.target.closest('.chip[data-f]');
  if(cf){FILTRO=cf.dataset.f;TETO=PASSO;desenhar();return;}
  const co=e.target.closest('.chip[data-ord]');
  if(co){const k=co.dataset.ord;if(SORT.k===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.k=k;SORT.dir=dirPadrao(k);}TETO=PASSO;desenhar();return;}
  if(e.target.closest('#limparF')||e.target.closest('#btn-limpar')){limparFiltros();return;}
  if(e.target.closest('.btn-mais')){crescerTeto(TETO+PASSO);return;}
  if(e.target.closest('.btn-todos')){crescerTeto(PROCS.length);return;}
  const et=e.target.closest('[data-etapa-toggle]');if(et){alternarEtapa(et);return;}
  const tg=e.target.closest('[data-toggle]');if(tg){abrirEditor(tg.dataset.toggle);return;}
  /* De qual processo é este botão: o editor deixou de morar dentro da linha
     (.proc) e passou a ser o miolo do modal, então quem carrega o row agora é o
     próprio #ed-<row>. Procurar pela linha aqui devolvia null e o clique não
     chegava a salvar nada. */
  const ag=e.target.closest('[data-addgeral]');if(ag){addObs(rowDoEditor(ag),ag,'geral');return;}
  const ae=e.target.closest('[data-addet]');if(ae){addObs(rowDoEditor(ae),ae,'etapa',+ae.dataset.addet);return;}
  const at=e.target.closest('[data-addetapa]');if(at){addEtapa(rowDoEditor(at));return;}
  if(e.target.id==='n-criar')criarNovo(e.target);
  if(e.target.id==='n-cancelar')fecharNovo();
  if(e.target.id==='modal')fecharNovo();
});
/* De qual processo é este campo. O editor é o #ed-<row> que a ficha pinta, e é
   ele que carrega o data-row — a linha da lista não o contém mais. */
function rowDoEditor(el){const ed=el&&el.closest&&el.closest('.editor');return ed?ed.dataset.row:'';}
// SALVAMENTO AUTOMÁTICO: qualquer alteração num campo do editor salva sozinha.
document.addEventListener('change',e=>{
  const ed=e.target.closest('.editor');if(!ed)return;
  const f=e.target;if(!f.matches||!f.matches('input,select,textarea'))return;
  if(f.matches('[data-gobs],[data-etobs]'))return;   // as observações têm botão próprio (log com data)
  if(f.closest('.etapa'))sincronizarEtapa(f);
  if(ed.dataset.row)agendarSalvar(ed.dataset.row);
});
// enquanto digita, o cabeçalho recolhido da etapa acompanha nome/datas
document.addEventListener('input',e=>{
  const f=e.target;
  if(f&&f.matches&&f.matches('.etapa .e-nome,.etapa .e-ini,.etapa .e-fim'))sincronizarEtapa(f);
});

/* Atalhos de busca (C.4): "/" foca, Esc limpa. Com o modal aberto, Esc fecha o
   modal — e o atalho não atrapalha quem já está digitando noutro campo. */
document.addEventListener('keydown',e=>{
  /* A ficha é o modal de cima: com ela aberta, Esc é dela antes de tudo. */
  if(e.key==='Escape'&&cadAberto()){e.preventDefault();fecharFicha();return;}
  const modal=document.getElementById('modal');
  if(e.key==='Escape'&&modal&&modal.classList.contains('on')){fecharNovo();return;}
  /* A linha da lista é um role="button": sem isto, Enter e Espaço não abririam a
     ficha para quem navega por teclado — e a tela ficaria só para o mouse. */
  const linha=e.target&&e.target.closest&&e.target.closest('.proc-h');
  if(linha&&(e.key==='Enter'||e.key===' '||e.key==='Spacebar')){
    e.preventDefault();
    abrirEditor(linha.dataset.toggle);
    return;
  }
  /* Com a ficha aberta o teclado é dela: sem esta linha, um "/" distraído mandava
     o foco para a busca ATRÁS do véu, onde a pessoa digitava sem ver. */
  if(cadAberto())return;
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';BUSCA='';TETO=PASSO;desenhar();}
});

document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());

/* ---------------- menu lateral ----------------
   Montado ANTES de carregar(): a identidade desta tela é a chave, que já está na
   URL desde a primeira linha deste script — não há o que esperar da API. E se a
   busca falhar, o erro pinta dentro do #app com o menu inteiro de pé, que é a
   mesma razão de o erro nunca ser pintado no <body>.
   Sem `contexto`: esta página não sabe o NOME de quem está usando (o `cod` é
   código de log, não nome), e um rótulo inventado seria pior que bloco nenhum.
   Os links levam só a chave, exatamente como o "← Painel" da linha acima — e aqui
   `chaveAtual()` já aceita a chave vinda do #hash, então quem entrou pelo atalho
   antigo continua navegando pelo menu sem perder o acesso. */
if (window.B4UShell) {
  B4UShell.montar({
    perfil: 'equipe',
    ativo: 'societario',
    link: function (pag) { return pag + '?chave=' + encodeURIComponent(chaveAtual()); }
  });
  /* Esta página tem <base target="_blank">, para o colaborador nunca perder a
     tela em que estava ao abrir um documento. O menu lateral é o contrário
     disso: é navegação DENTRO do painel, e sair pela guia atual é o gesto — a
     mesma exceção que o logo e o "← Painel" já traziam escrita à mão.
     Só marcamos quem ainda não tem alvo próprio: assim o WhatsApp do rodapé do
     menu (que nasce com target="_blank") continua abrindo em guia nova. */
  document.querySelectorAll('.b4s-side a[href]').forEach(function (a) {
    if (!a.getAttribute('target')) a.setAttribute('target', '_self');
  });
}

carregar();
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador.html') {
        try { href = 'colaborador.html?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador.html'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
