   justamente o que o <select> de escolha única não sabia responder. */
function passaStatus(r){
  return !F_STATUS.length||F_STATUS.indexOf(stkDe(r))>=0;
}
function passaAtalho(p,r){
  return !F_ATALHO.length||F_ATALHO.some(f=>passaFiltro(p,r,f));
}
function passaTudo(p,r){return passaStatus(r)&&passaAtalho(p,r);}
function valorOrd(p,r,k){
  if(k==='dur')return r.dias;
  if(k==='mov')return r.mov;
  if(k==='id')return String(p.id==null?'':p.id).trim()||null;
  if(k==='nome')return String(p.nome||'').trim()||null;
  /* Processo ordena pelo que está ESCRITO na coluna: o código primeiro (é ele
     que o olho corre, "B4Y - 040") e a descrição em seguida, para os sem código
     não se embaralharem entre os com código. */
  if(k==='proc')return (String(p.codigo_processo||'').trim()+' '+String(p.processo||'').trim()).trim()||null;
  /* Etapa atual ordena pelo NOME da etapa — é o título que está na célula. A
     contagem "3/7" ao lado dele é de outra pergunta (quanto falta), e ordenar
     por ela faria a coluna dizer uma coisa e a ordem outra. */
  if(k==='etapa'){const e=etapaAtual(p);return e?String(e.nome||'').trim()||null:null;}
  if(k==='status')return r.stk?pesoStatus(r.stk)+'|'+r.stk:null;
  return null;
}
function ordenar(itens){
  const dir=SORT.dir==='asc'?1:-1;
  return itens.map((it,i)=>({it,i,v:valorOrd(it.p,it.r,SORT.k)}))
    .sort((a,b)=>{
      const na=a.v==null,nb=b.v==null;
      if(na!==nb)return na?1:-1;                // sem informação sempre no fim
      if(!na){
        const c=(typeof a.v==='number'&&typeof b.v==='number')
          ?a.v-b.v
          :String(a.v).localeCompare(String(b.v),'pt',{numeric:true,sensitivity:'base'});
        if(c)return c*dir;
      }
      return String(a.it.p.id).localeCompare(String(b.it.p.id),'pt',{numeric:true})||a.i-b.i;
    })
    .map(x=>x.it);
}
function baseBusca(){
  const alvo=normTxt(BUSCA);
  return PROCS.filter(p=>passaBusca(p,alvo)).map(p=>({p,r:resumoProc(p)}));
}
/* ---------- busca, filtro e ordenação no endereço (C.10) ----------
   F5 volta para a mesma visão; chave, cod e #hash ficam intactos. */
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    /* Uma ocorrência do parâmetro por valor marcado (`st=a&st=b`), e não uma
       lista separada por vírgula: um status escrito na planilha pode ter vírgula
       ("Aguardando análise, com exigência") e o separador comeria o valor no
       caminho de volta. `append` deixa a codificação com o navegador. */
    const lista=(k,arr)=>{u.searchParams.delete(k);arr.forEach(v=>u.searchParams.append(k,v));};
    set('q',BUSCA);
    lista('st',F_STATUS);
    lista('at',F_ATALHO);
    /* O `?f=` de uma escolha só morreu com o <select>. Ele continua sendo LIDO
       (links guardados no navegador de alguém, ou colados num ticket, continuam
       abrindo a tela filtrada) — mas some do endereço na primeira sincronização,
       para não ficar um parâmetro morto contradizendo os novos. */
    set('f','');
    set('ord',SORT.k==='dur'?'':SORT.k);
    set('dir',SORT.dir===dirPadrao(SORT.k)?'':SORT.dir);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  BUSCA=p.get('q')||'';
  F_STATUS=p.getAll('st');
  F_ATALHO=p.getAll('at');
  /* Compatibilidade com o endereço antigo, de quando havia um filtro só:
     `f=st:<chave>` era um status, `f=semstatus` era o status em branco e o resto
     eram atalhos. Só vale quando não veio nenhum parâmetro novo — quem escreveu
     `st=`/`at=` disse o que queria, e um `f=` esquecido na mesma URL não pode
     falar por cima. */
  if(!p.has('st')&&!p.has('at')){
    const leg=p.get('f')||'';
    if(leg&&leg!=='todos'){
      if(leg.slice(0,3)==='st:')F_STATUS=[leg.slice(3)];
      else if(leg==='semstatus')F_STATUS=[K_SEM];
      else F_ATALHO=[leg];
    }
  }
  SORT.k=p.get('ord')||'dur';
  SORT.dir=p.get('dir')||dirPadrao(SORT.k);
}
/** Uma opção da lista, com a contagem no rótulo quando ela existe. */
function opt(v,rot,sel,n){
  return `<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>`+
         esc(rot)+(n!=null?' · '+n:'')+`</option>`;
}
/* Repintar sem roubar o foco: quando o CONJUNTO de valores é o mesmo, só o rótulo
   muda (a contagem) e o <select> continua sendo o mesmo elemento, com o mesmo
   foco — quem está escolhendo pelo teclado não perde o lugar no meio do gesto. Só
   recria as opções quando a lista de valores mudou de verdade (um status novo
   digitado na planilha, por exemplo).
   `g` é o rótulo do <optgroup>; itens seguidos com o mesmo `g` entram juntos. */
function pintarSelect(el,itens,sel){
  if(!el)return;
  const sig=itens.map(i=>(i.g||'')+'\u0001'+i.v).join('\u0002');
  if(el._sig!==sig||el.options.length!==itens.length){
    let html='',g='';
    itens.forEach(it=>{
      const gr=it.g||'';
      if(gr!==g){if(g)html+='</optgroup>';if(gr)html+=`<optgroup label="${esc(gr)}">`;g=gr;}
      html+=opt(it.v,it.rot,sel,it.n);
    });
    if(g)html+='</optgroup>';
    el.innerHTML=html;
    el._sig=sig;
  }else{
    itens.forEach((it,i)=>{el.options[i].textContent=it.rot+(it.n!=null?' · '+it.n:'');});
  }
  el.value=String(sel);
}
/* ---------- marcador de urgência no rótulo ----------
   O chip dizia a urgência com COR: vermelho em "Parados", âmbar no que falta,
   verde no que acabou. <option> não pinta, e a cor sozinha nunca serviu a quem
   não a enxerga — daltônico, leitor de tela, impressão em preto e branco. O
   marcador devolve a mesma informação em TEXTO, e desta vez para todo mundo.

   Um símbolo por NÍVEL, nunca um por item: quem vê "!!" duas vezes sabe que as
   duas pedem a mesma coisa, sem legenda.
     !!  pede ação agora        (era o vermelho)
     !   falta dado, olhe       (era o âmbar)
     ✓   acabou, nada a fazer   (era o verde)

   Por que NÃO "⚠": no macOS e no iOS o U+26A0 vira emoji colorido — a mesma cor
   que estamos tirando, agora fora do nosso controle e maior que a letra. "!!" e
   "!" são ASCII: existem em toda fonte, nunca viram emoji, e a intensidade se lê
   sem manual. O "✓" (U+2713, não o U+2714 "✔", esse é emoji) é texto em todo
   sistema. Nenhum deles é lido em voz alta como "triângulo preto apontando para
   cima" — e, se o leitor de tela pular a pontuação, o rótulo já diz por extenso
   o que o marcador resume. */
const MARCA={acao:'!!',olho:'!',feito:'✓'};
function marca(nivel,rot){return (MARCA[nivel]||'')+' '+rot;}
/* ---------- as duas listas de opções ----------
   A contagem de cada linha é feita sobre o que a BUSCA deixou (`base`), NUNCA
   sobre a planilha inteira: ela responde "quantos sobram se eu marcar isto
   agora". E é só a busca — não é facetada pela outra caixa. Facetar mudaria o
   número embaixo da mão de quem está escolhendo (marcar um status faria a
   contagem dos atalhos encolher a cada clique), e a régua passaria a exigir
   leitura em vez de responder. É a mesma conta que o <select> fazia. */
function itensStatus(base){
  const conta=k=>base.filter(x=>stkDe(x.r)===k).length;
  /* Os valores de Status Geral saem da planilha e nunca tiveram cor no chip:
     nenhum marcador aqui, senão estaríamos inventando urgência que a tela nunca
     disse. "Sem status" tem — era âmbar, como todo campo em branco. */
  const out=statusDisponiveis().map(s=>({v:s.k,r:s.rot+' · '+conta(s.k),c:s.rot}));
  const n=conta(K_SEM);
  /* "Sem status" só entra quando existe (ou quando está marcado, senão sumiria
     de baixo do dedo). É a mesma regra que o <optgroup> seguia — uma linha
     permanente marcando "· 0" seria ruído no topo de toda abertura da tela. */
  if(n||F_STATUS.indexOf(K_SEM)>=0)
    out.push({v:K_SEM,r:marca('olho','Sem status')+' · '+n,c:marca('olho','Sem status')});
  return out;
}
function itensAtalho(base){
  const conta=f=>base.filter(x=>passaFiltro(x.p,x.r,f)).length;
  /* O rótulo do painel leva a contagem; o rótulo CURTO (o do botão fechado) não,
     porque ali ele disputa 240px com o "+N" — e o número já está por extenso no
     resumo da régua ("12 de 50 processos"). O MARCADOR vai nos dois: ele é o que
     diz a urgência sem depender de cor, e um botão fechado dizendo só "Parados
     +30 dias" teria perdido justamente o que o !! carrega. */
  const li=(v,rot,n)=>({v,r:rot+' · '+n,c:rot});
  return [
    li('aberto',   'Em aberto',                                     conta('aberto')),
    li('concluido',marca('feito','Concluídos'),                     conta('concluido')),
    li('parado',   marca('acao','Parados há +'+PARADO_DIAS+' dias'),conta('parado')),
    li('semdata',  marca('olho','Sem datas'),                       conta('semdata')),
    li('semresp',  marca('olho','Sem responsável'),                 conta('semresp'))
  ];
}
/* Trocar a lista de um filtro REMONTA o painel dele por dentro. Com o painel
   ABERTO isso destrói o checkbox que está sob o dedo, o foco cai no <body>, o
   `focusout` do componente vê que o foco saiu e fecha o painel — ou seja, cada
   clique fecharia a lista que a pessoa acabou de abrir para marcar três coisas.
   Daí a assinatura: só remonta quando os rótulos MUDARAM de verdade, e eles só
   mudam quando a busca muda (é dela que saem as contagens) ou quando a planilha
   traz um status novo. Marcar um checkbox não mexe em nenhuma das duas, então o
   painel fica aberto — que é o ponto de ele ser uma caixa de seleção múltipla. */
function aplicarItens(f,itens){
  if(!f)return;
  const sig=itens.map(i=>i.v+'\u0001'+i.r+'\u0001'+(i.c||'')).join('\u0002');
  if(f._sig===sig)return;
  f._sig=sig;
  f.itens(itens);
}
function desenharChips(base){
  if(CX_STATUS||CX_ATALHO){
    if(CX_STATUS){aplicarItens(CX_STATUS,itensStatus(base));
      CX_STATUS.no.classList.toggle('corta',F_STATUS.length>0);}
    if(CX_ATALHO){aplicarItens(CX_ATALHO,itensAtalho(base));
      CX_ATALHO.no.classList.toggle('corta',F_ATALHO.length>0);}
    return;
  }
  desenharSelectLegado(base);
}
/* ---------- sem o b4u-filtro.js ----------
   O <select> único de antes, com os mesmos dois <optgroup> e a mesma escolha de
   uma por vez. Ele lê e escreve as MESMAS duas listas — só que sempre com no
   máximo um valor —, então tudo o que vem depois (a lista, o resumo, a URL) não
   precisa saber por qual caminho a régua foi desenhada. */
function selLegado(){
  if(F_STATUS.length===1)return F_STATUS[0]===K_SEM?'semstatus':'st:'+F_STATUS[0];
  if(F_ATALHO.length===1)return F_ATALHO[0];
  return 'todos';
}
function desenharSelectLegado(base){
  const el=document.getElementById('f-filtro');if(!el)return;
  const conta=f=>base.filter(x=>passaFiltro(x.p,x.r,f)).length;
  const semStatus=base.filter(x=>stkDe(x.r)===K_SEM).length;
  const itens=[{v:'todos',rot:'Todos os processos',n:base.length}];
  statusDisponiveis().forEach(s=>itens.push({g:'Status geral',v:'st:'+s.k,rot:s.rot,
    n:base.filter(x=>stkDe(x.r)===s.k).length}));
  if(semStatus||F_STATUS.indexOf(K_SEM)>=0)itens.push({g:'Status geral',v:'semstatus',rot:marca('olho','Sem status'),n:semStatus});
  itens.push({g:'Atalhos',v:'aberto',rot:'Em aberto',n:conta('aberto')});
  itens.push({g:'Atalhos',v:'concluido',rot:marca('feito','Concluídos'),n:conta('concluido')});
  itens.push({g:'Atalhos',v:'parado',rot:marca('acao','Parados há +'+PARADO_DIAS+' dias'),n:conta('parado')});
  itens.push({g:'Atalhos',v:'semdata',rot:marca('olho','Sem datas'),n:conta('semdata')});
  itens.push({g:'Atalhos',v:'semresp',rot:marca('olho','Sem responsável'),n:conta('semresp')});
  const sel=selLegado();
  pintarSelect(el,itens,sel);
  el.classList.toggle('corta',sel!=='todos');
}
/** O que o <select> de reserva escolheu, traduzido para as duas listas. */
function aplicarLegado(v){
  if(v==='todos'){F_STATUS=[];F_ATALHO=[];}
  else if(v==='semstatus'){F_STATUS=[K_SEM];F_ATALHO=[];}
  else if(v.slice(0,3)==='st:'){F_STATUS=[v.slice(3)];F_ATALHO=[];}
  else {F_STATUS=[];F_ATALHO=[v];}
}
/* ---------- a régua ----------
   O marcador de posição é SUBSTITUÍDO, não preenchido — a régua é um flex, e um
   <span> em volta vira um item de flex dimensionado pelo conteúdo: o filtro por
   dentro dele nunca encolhe, e uma razão social inteira no rótulo estica o botão
   até estourar a tela do celular. É a mesma armadilha (e a mesma solução) do
   daily.html. */
function por(cx,no){cx.replaceWith(no);return no;}
function porHTML(cx,html){const t=document.createElement('div');t.innerHTML=html;
  return por(cx,t.firstElementChild);}
let CX_STATUS=null,CX_ATALHO=null;
function montarFiltros(){
  const cxS=document.getElementById('cx-status'),cxA=document.getElementById('cx-atalho');
  if(!cxS||!cxA)return;
  CX_STATUS=CX_ATALHO=null;
  /* As duas são CONSTRUÍDAS antes de qualquer uma entrar na página: se o módulo
     estiver lá mas quebrar no meio, o catch cai no <select> com os dois
     marcadores de posição ainda intactos. Plantar de uma em uma deixaria a régua
     pela metade, meia caixa e meio select. */
  if(window.B4UFiltro) try{
    const base=baseBusca();
    const fs=B4UFiltro.criar({
      id:'f-status', rot:'Situação do processo',
      itens:itensStatus(base), marcados:F_STATUS,
      /* Nasce vazia, e vazia quer dizer TODAS. A tela sempre abriu mostrando o
         que existe, e marcar uma a uma as situações da planilha só para dizer
         "não quero filtrar" seria o contrário do que a régua faz. */
      vazio:'todos', rotTodos:'Todas as situações', rotNada:'Nenhuma situação',
      aoMudar:m=>{F_STATUS=m;TETO=PASSO;desenhar();}
    });
    const fa=B4UFiltro.criar({
      id:'f-atalho', rot:'Atalhos',
      itens:itensAtalho(base), marcados:F_ATALHO,
      /* "Sem atalho" e não "Todos": com tudo marcado o resultado é a lista
         inteira (em aberto ∪ concluídos já é tudo), então as duas pontas dizem a
         mesma verdade — nenhuma pergunta está estreitando a lista. */
      vazio:'todos', rotTodos:'Sem atalho', rotNada:'Sem atalho',
      aoMudar:m=>{F_ATALHO=m;TETO=PASSO;desenhar();}
    });
    CX_STATUS=fs;CX_ATALHO=fa;
    por(cxS,fs.no);por(cxA,fa.no);
    return;
  }catch(e){CX_STATUS=CX_ATALHO=null;}
  porHTML(cxS,`<select class="filtro" id="f-filtro" aria-label="Filtrar por status ou atalho"></select>`);
  cxA.remove();
}
// contagens da régua depois de um salvamento, sem tocar na lista (o editor aberto continua aberto)
/* A guarda é o #lista, e não mais o #f-filtro: com o b4u-filtro.js no ar não
   existe elemento com aquele id, e a função viraria um no-op calado — as
   contagens da régua congelariam depois do primeiro salvamento. É a MESMA falha
   que esta função já teve uma vez, quando guardava no #chipsStatus que tinha
   deixado de existir. O #lista é pintado pelo render() e não some depois. */
function atualizarChips(){
  if(!document.getElementById('lista'))return;
  desenharChips(baseBusca());desenharResumoLista();
}
/* ---------- limpar filtros (C.5) ----------
   Quantos filtros estão pegando agora — uma caixa que estreita conta um. Era o
   selo ao lado do botão "Filtros"; com a régua à vista o selo não é mais preciso
   (o próprio botão âmbar diz que está cortando), mas a conta continua de pé e o
   contrato é o mesmo das telas irmãs. Só conta o que TIRA processo da lista: a
   busca está à mostra, e a ordenação não esconde ninguém. */
function filtrosPainel(){return (F_STATUS.length?1:0)+(F_ATALHO.length?1:0);}
function limparFiltros(){
  F_STATUS=[];F_ATALHO=[];BUSCA='';TETO=PASSO;
  /* Escrever no componente NÃO dispara o `aoMudar` dele (é o contrato), senão a
     lista seria desenhada três vezes; quem redesenha é a linha de baixo. */
  if(CX_STATUS)CX_STATUS.marcados([]);
  if(CX_ATALHO)CX_ATALHO.marcados([]);
  const b=document.getElementById('busca');if(b)b.value='';
  desenhar();
}
/* A contagem em texto é o que garante que nenhum número dependa de abrir a lista
   suspensa: parados e sem responsável continuam na primeira linha da tela,
   contados sobre a planilha inteira — não sobre o que o filtro deixou. */
function desenharResumoLista(){
  const el=document.getElementById('resumo-lista');if(!el)return;
  const todos=PROCS.map(p=>({p,r:resumoProc(p)}));
  const alvo=normTxt(BUSCA);
  const vis=todos.filter(x=>passaBusca(x.p,alvo)&&passaTudo(x.p,x.r)).length;
  const abertos=todos.filter(x=>!x.r.conc).length;
  const parados=todos.filter(x=>passaFiltro(x.p,x.r,'parado')).length;
  const semResp=todos.filter(x=>x.r.semResp).length;
  const p=[(vis===PROCS.length?String(PROCS.length):vis+' de '+PROCS.length)+' processos',
           abertos+' em aberto'];
  if(parados)p.push(parados+' parados há +'+PARADO_DIAS+' dias');
  if(semResp)p.push(semResp+' sem responsável');
  el.textContent=p.join(' · ');
}
function vazioHTML(){
  const filtrando=F_STATUS.length>0||F_ATALHO.length>0||!!BUSCA.trim();
  return `<div class="vazio-filtro"><div>${filtrando?'Nenhum processo com esse filtro.':'Nenhum processo cadastrado ainda.'}</div>`+
    (filtrando?`<button type="button" class="btn btn--mini" id="limparF">Limpar filtro e busca</button>`:'')+
    `</div>`;
}
function render(){
  lerURL();                                   // a visão vem do endereço (C.10)
  const app=document.getElementById('app');
  /* A ordem é a da tela: busca, filtros, "novo processo" e a contagem primeiro;
     depois a lista, que é a resposta e por isso nunca recolhe. */
  app.innerHTML=`<div class="wrap">
    <div class="topo">
      <div class="barra-acoes">
        <input class="busca campo-busca" id="busca" type="search" value="${esc(BUSCA)}" placeholder="Buscar por ID, nome, código, processo ou status…  ( / para focar)">
        <span id="cx-status"></span>
        <span id="cx-atalho"></span>
        <button type="button" class="btn-limpar" id="btn-limpar" title="Volta para a visão sem filtro e sem busca">Limpar</button>
        <button class="btn btn--pri btn--pill" id="novo">+ Novo processo</button>
        <span class="resumo-lista" id="resumo-lista"></span>
      </div>
    </div>
    <div class="lista" id="lista"></div></div>`;
  /* O painel recolhido saiu de cena — os filtros agora estão sempre à vista na
     régua. A chamada fica de pé porque o contrato é o mesmo em todas as telas:
     sem #btn-filtros nem #painel-filtros no HTML, ligarFiltros devolve undefined
     e nada mais acontece. */
  FILTROS_UI=ligarFiltros('societario-equipe',filtrosPainel);
  /* ANTES do desenhar(): é ele quem troca os marcadores de posição pelas caixas
     (ou pelo <select> de reserva), e o desenhar() já conta com uma coisa ou
     outra existindo para pintar os rótulos e as contagens. */
  montarFiltros();
  desenhar();
  document.getElementById('busca').addEventListener('input',e=>{BUSCA=e.target.value;TETO=PASSO;desenhar();});
  document.getElementById('novo').addEventListener('click',abrirNovo);
}
function desenhar(){
  const base=baseBusca();
  const arr=ordenar(base.filter(x=>passaTudo(x.p,x.r)));
  desenharChips(base);
  /* Quem estava com o dedo num cabeçalho continua nele. O #lista inteiro é
     repintado a cada desenho, então o <button> clicado deixa de existir e o foco
     cairia no <body> — a pessoa que ordena pelo teclado perderia o lugar a cada
     Enter, justamente no controle que se usa duas vezes seguidas (A→Z, Z→A). */
  const focoOrd=(document.activeElement&&document.activeElement.dataset)
    ?document.activeElement.dataset.sort:null;
  const lista=document.getElementById('lista');
  /* O teto corta o DESENHO, nunca a contagem: os totais de cima seguem falando da
     lista inteira (arr.length), com ou sem rodapé. */
  const n=Math.min(TETO,arr.length);
  if(lista)lista.innerHTML=arr.length
    ?(cabecalhoLista()+arr.slice(0,n).map(x=>linhaHTML(x.p,x.r)).join('')+rodapeLista(n,arr.length))
    :vazioHTML();
  const cnt=document.getElementById('cnt');
  if(cnt)cnt.textContent=arr.length+' de '+PROCS.length+' processos';
  desenharResumoLista();
  if(FILTROS_UI)FILTROS_UI.atualizarContador();
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
  /* As caixas da régua sobrevivem ao redesenho (moram fora do #lista e só são
     remontadas quando os rótulos mudam). O cabeçalho não: ele é repintado junto
     com a lista, e por isso o foco volta à mão. */
  if(focoOrd){
    const bt=document.querySelector('.lista-cab [data-sort="'+focoOrd+'"]');
    if(bt)bt.focus();
  }
  revelarColunaAtiva();
  sincronizarURL();
}
/* No celular o cabeçalho é uma tira que rola de lado, e a coluna ativa pode
   nascer FORA do pedaço visível: a ordem padrão é "Tempo", que é a quinta, e a
   tira abriria mostrando "Ordenar · ID · Cliente · Processo" sem marca nenhuma —
   isto é, parecendo que a lista não está ordenada por nada.
   Mexe só no scroll da TIRA. `scrollIntoView` levaria a página junto e jogaria a
   primeira linha da lista para fora da tela a cada redesenho. */
function revelarColunaAtiva(){
  const cab=document.querySelector('.lista-cab');
  if(!cab||cab.scrollWidth<=cab.clientWidth+1)return;
  const at=cab.querySelector('[aria-sort]');if(!at)return;
  const r=at.getBoundingClientRect(),c=cab.getBoundingClientRect();
  if(r.left<c.left)cab.scrollLeft+=r.left-c.left-10;
  else if(r.right>c.right)cab.scrollLeft+=r.right-c.right+10;
}
/* Estender o teto não fecha mais a ficha que a pessoa está preenchendo: ela vive
   no modal, fora do #lista, e redesenhar a lista não a toca. O que o redesenho
   precisa refazer é só a marca de qual linha está aberta — quem faz isso é o
   próprio linhaHTML(), lendo FICHA_ROW. */
function crescerTeto(novo){TETO=novo;desenhar();}
/* O processo recém-criado não pode nascer atrás do teto — ele entra sem datas e a
   ordem padrão (mais tempo em aberto primeiro) joga quem não tem data para o fim. */
function garantirVisivel(row){
  const arr=ordenar(baseBusca().filter(x=>passaTudo(x.p,x.r)));
  const pos=arr.findIndex(x=>String(x.p.row)===String(row));
  if(pos>=TETO){TETO=Math.ceil((pos+1)/PASSO)*PASSO;desenhar();}
}
/* ===================================================================
   A linha da lista — só leitura
   -------------------------------------------------------------------
   Sete colunas que respondem "preciso agir neste processo?": de quem é,
   que processo é, em que etapa está, há quanto tempo ele corre, quando
   andou pela última vez e como está a situação. Nenhum campo aqui dentro:
   tudo o que se edita (inclusive as observações datadas) abre no modal,
   ao clicar. Cada rótulo do cabeçalho ordena a lista por aquela coluna.
   =================================================================== */
/* Situação do processo: uma família só por linha, na mesma ordem de urgência dos
   chips. "Parado" tem família própria — e ganha de "em andamento" — porque é o
   único estado que pede ação HOJE; é o mesmo critério do chip "Parados há +30
   dias", para a lista não dizer uma coisa e o filtro outra. */
const SITUACOES={
  parado:{rot:'Parado',dica:'Em aberto e sem nenhuma data de etapa mexida nos últimos '+PARADO_DIAS+' dias.'},
  and:{rot:'Em andamento',dica:'Status Geral em andamento.'},
  agu:{rot:'Aguardando',dica:'Status Geral aguardando alguma coisa (análise, protocolo, exigência…).'},
  na:{rot:'Não se aplica',dica:'Processo que não segue: cancelado, arquivado ou fora de escopo.'},
  conc:{rot:'Concluído',dica:'Status Geral concluído, ou todas as etapas nomeadas concluídas.'},
  sem:{rot:'sem status',dica:'Status Geral em branco.'}
};
function situacaoDe(p,r){
  if(r.conc)return 'conc';
  if(/nao se aplica|cancel|desist|arquiv/.test(r.stk))return 'na';
  if(r.paradoDias!=null&&r.paradoDias>PARADO_DIAS)return 'parado';
  if(!r.stk)return 'sem';
  if(/andamento/.test(r.stk))return 'and';
  return 'agu';
}
/* A pílula nunca corta o próprio texto. Quando a grafia que a equipe escreveu
   cabe, é ELA que aparece — é o vocabulário de quem usa. Quando não cabe, entra
   o rótulo curto da família, e o texto inteiro continua no title da linha e na
   ficha. Cortar daria "Aguardando docum…", que não é status nenhum. */
const SIT_LARGURA=18;
function rotuloSituacao(p,s){
  const bruto=String(p.status_geral==null?'':p.status_geral).replace(/\s+/g,' ').trim();
  if(s!=='parado'&&s!=='sem'&&bruto&&bruto.length<=SIT_LARGURA)return bruto;
  return SITUACOES[s].rot;
}
/* Etapa atual = a primeira etapa NOMEADA que ainda não está concluída — é ela
   que responde "onde o processo está". Com todas concluídas mostramos a última:
   é onde ele terminou, e a coluna Situação já diz que acabou. */
function etapasNomeadas(p){return etapasOrdenadas(p).filter(e=>String(e.nome||'').trim());}
function etapaAtual(p){
  const ns=etapasNomeadas(p);
  if(!ns.length)return null;
  return ns.find(e=>!RE_CONCLUIDO.test(normTxt(e.status)))||ns[ns.length-1];
}
function celulaEtapa(p){
  const ns=etapasNomeadas(p);
  if(!ns.length)return '<span class="c-falta">sem etapas</span>';
  const nOk=ns.filter(e=>RE_CONCLUIDO.test(normTxt(e.status))).length;
  const e=etapaAtual(p);
  return `<span class="c-tag" title="${nOk} de ${ns.length} etapas concluídas">${nOk}/${ns.length}</span>`+
    `<span class="txt">${esc(String(e.nome).trim())}</span>`;
}
function celulaProcesso(p){
  const cod=String(p.codigo_processo||'').trim();
  const txt=String(p.processo||'').trim();
  return (cod?`<span class="c-tag">${esc(cod)}</span>`:'')+
    (txt?`<span class="txt">${esc(txt)}</span>`:(cod?'':'<span class="c-falta">sem descrição</span>'));
}
function celulaMov(p,r){
  const mov=ultimaMov(p);
  if(!mov)return '<span class="c-falta">sem data</span>';
  const parado=!r.conc&&r.paradoDias!=null&&r.paradoDias>PARADO_DIAS;
  return `<span>${esc(mov.rot)}</span>`+(parado?`<span class="parado">há ${r.paradoDias} dias</span>`:'');
}
/* A duração reduzida à MAIOR unidade. `fmtDuracao` devolve "1 ano e 2 meses",
   que é a frase certa dentro da ficha e não cabe numa coluna de 88px — cortada
   com reticências ela viraria "1 ano e…", que não é duração nenhuma. Aqui vale a
   ordem de grandeza, que é o que se compara correndo o olho pela coluna; o texto
   inteiro continua no title da linha e no ⏱ da ficha. */
function fmtDuracaoCurta(dias){
  const d=Math.max(0,Math.round(dias));
  if(d===0)return 'hoje';
  if(d<30)return d===1?'1 dia':d+' dias';
  const anos=Math.floor(d/365);
  if(anos)return anos===1?'1 ano':anos+' anos';
  const meses=Math.max(1,Math.floor(d/30));
  return meses===1?'1 mês':meses+' meses';
}
function celulaDur(p){
  const c=calcDuracao(p);
  if(!c)return '<span class="c-falta">sem início</span>';
  /* Sem title próprio de propósito: o title da LINHA já diz "Duração: ~1 ano e 2
     meses (em andamento)", e um title na célula esconderia o da linha justo em
     cima da coluna que mais convida o mouse. */
  return `<span>${esc((c.estimado?'~':'')+fmtDuracaoCurta(c.dias))}</span>`;
}
/* O que não coube nas sete colunas vai para o title da linha — dá para conferir
   sem abrir nada, inclusive a duração ⏱ por extenso. */
function tituloLinha(p,r){
  const t=[];
  if(String(p.codigo_processo||'').trim())t.push('Código: '+p.codigo_processo);
  t.push('Processo: '+(String(p.processo||'').trim()||'em branco'));
  t.push('Status geral: '+(String(p.status_geral||'').trim()||'em branco'));
  const c=calcDuracao(p);
  t.push('Duração: '+(c?(c.estimado?'~':'')+fmtDuracao(c.dias)+(c.concluido?' (concluído)':' (em andamento)'):'sem data de início'));
  const mov=ultimaMov(p);
  t.push('Última movimentação: '+(mov?mov.rot+(r.paradoDias!=null?' (há '+r.paradoDias+' dias)':''):'nenhuma'));
  const e=etapaAtual(p);
  if(e)t.push('Etapa atual: '+String(e.nome).trim()+(String(e.status||'').trim()?' — '+e.status:''));
  t.push('Responsável: '+(String((p.extras&&p.extras.responsavel)||'').trim()||'em branco'));
  t.push('Clique para abrir o processo.');
  return t.join(' · ');
}
/* É um role="button" (e não um <button>) porque dentro dele há pílulas com title
   próprio; o teclado é atendido à mão no keydown (Enter e Espaço). Fica separado
   do invólucro porque é ele, sozinho, que é repintado depois de cada gravação. */
function cabecaHTML(p,r){
  const s=situacaoDe(p,r),info=SITUACOES[s];
  return `<div class="proc-h" role="button" tabindex="0" aria-haspopup="dialog" data-toggle="${esc(String(p.row))}" title="${esc(tituloLinha(p,r))}">
      <span class="c-id">${esc(p.id)}</span>
      <span class="c-nome">${esc(p.nome||'(sem nome)')}</span>
      <span class="c-proc">${celulaProcesso(p)}</span>
      <span class="c-etapa">${celulaEtapa(p)}</span>
      <span class="c-dur">${celulaDur(p)}</span>
      <span class="c-mov">${celulaMov(p,r)}</span>
      <span class="c-fim"><span class="pill sit-${s}" title="${esc(info.dica)}">${esc(rotuloSituacao(p,s))}</span></span>
    </div>`;
}
const SIT_CLASSES=['sit-parado','sit-and','sit-agu','sit-na','sit-conc','sit-sem'];
function linhaHTML(p,r){
  return `<div class="proc sit-${situacaoDe(p,r)}${String(FICHA_ROW)===String(p.row)?' aberto':''}" data-row="${esc(String(p.row))}">${cabecaHTML(p,r)}</div>`;
}
/* Seta da coluna ativa — só ela ganha marca, senão a lista pareceria ordenada
   por sete critérios ao mesmo tempo. O espaço antes da seta é NÃO SEPARÁVEL
   (\u00A0) de propósito: com espaço comum, "Etapa atual" quase preenchendo a
   coluna empurrava a seta sozinha para uma segunda linha, e o cabeçalho ficava
   com o dobro da altura por causa dela. */
function seta(k){return SORT.k===k?(SORT.dir==='asc'?'\u00A0▲':'\u00A0▼'):'';}
/* O cabeçalho das colunas repete a régua da linha (mesma regra de CSS). Cada
   rótulo é um BOTÃO que ordena — por isso ele deixou de ser aria-hidden: aqui
   não é enfeite, é o único controle de ordenação da tela desde que o <select
   id="f-ord"> saiu da régua. A coluna ativa se anuncia com aria-sort, e o title
   de cada botão diz o que o PRÓXIMO clique faz, com as mesmas palavras que as
   opções do #f-ord traziam ("maior duração", "A → Z"…).

   Abaixo de 900px ele não some: vira uma tira que rola de lado (ver o CSS). */
function cabecalhoLista(){
  const bt=o=>{
    const at=SORT.k===o.k;
    /* Clicar numa coluna nova sobe (A→Z); clicar na ativa inverte. Então o title
       promete o contrário do que está valendo quando ela já é a ativa. */
    const par=DIR_ROT[o.k]||['crescente','decrescente'];
    const prox=at?(SORT.dir==='asc'?1:0):0;
    return `<span role="columnheader"${o.est?' style="'+o.est+'"':''}`+
      `${at?` aria-sort="${SORT.dir==='asc'?'ascending':'descending'}"`:''}>`+
      `<button type="button" data-sort="${esc(o.k)}" `+
      `title="Ordenar por ${esc(o.rot)} — ${esc(par[prox])}">${esc(o.rot)}${seta(o.k)}</button></span>`;
  };
  return `<div class="lista-cab" role="row">`+
    `<span class="cab-rot" aria-hidden="true">Ordenar</span>`+
    ORD_COLS.map(bt).join('')+`</div>`;
}
function rotuloData(v){
  const bruto=String(v==null?'':v).trim();
  if(!bruto)return '';
  const r=parseDataFlex(bruto);
  return r?r.rot:bruto;   // não deu para ler? mostra como está na planilha
}
function resumoDatasEtapa(ini,fim){
  const bits=[];
  const a=rotuloData(ini),b=rotuloData(fim);
  if(a)bits.push('início '+a);
  if(b)bits.push('fim '+b);
  return bits.join(' · ');
}
/* O nome da etapa vem do catálogo (aba "Etapas Padrão" da MESTRA) e é editável:
   especificar qual junta, qual conselho, qual município é informação de verdade, e
   proibir isso empurraria a informação para a observação, onde ninguém filtra.
   O que o catálogo garante não é o texto idêntico, é a POSIÇÃO: a etapa 6 é a
   etapa 6 em todo processo, com ou sem o nome da junta no fim. O `↺ padrão` ao
   lado devolve o nome do catálogo para quem editou sem querer. */
function etapaHTML(p,e){
  const log=e.obs_interna||'';
  const nome=String(e.nome||'').trim();
  const apl=aplicavelDe(e);
  const na=apl==='Não';
  const pad=padraoDe(e.n);
  const livre=!pad;         // fora do catálogo: nome livre, definido neste processo
  const vazia=!nome&&!na;   // sem nome ainda: abre para alguém escrever
  return `<div class="etapa${na?' nao':''}${livre?' livre':''}${vazia?' vazia aberta':''}" data-n="${e.n}">
    <div class="etapa-cab">
    <button type="button" class="etapa-h" data-etapa-toggle="${e.n}" aria-expanded="${vazia?'true':'false'}">
      <span class="etapa-chev" aria-hidden="true">${vazia?'▾':'▸'}</span>
      <span class="etapa-n">Etapa ${e.n}</span>
      <span class="etapa-titulo">${esc(nome||(livre?'Etapa nova — dê um nome':'Etapa sem nome'))}</span>
      ${na?'':bdgStatus(e.status)}
      <span class="etapa-datas">${na?'não se aplica a este processo':esc(resumoDatasEtapa(e.data_inicio,e.data_fim))}</span>
    </button>
    <span class="apl" role="group" aria-label="A etapa ${e.n} se aplica a este processo?">
      <button type="button" data-apl="${e.n}" data-v="Sim" aria-pressed="${na?'false':'true'}">Sim</button>
      <button type="button" data-apl="${e.n}" data-v="Não" aria-pressed="${na?'true':'false'}">Não</button>
    </span>
    </div>
    <div class="etapa-body">
    <input type="hidden" class="e-apl" value="${apl}">
    <div class="etapa-top">
      <input class="e-nome" title="${livre?'Etapa fora do catálogo: o nome vale só para este processo.':'Vem do catálogo padrão. Dá para especificar (a junta, o conselho, o município) — o botão ao lado devolve o nome padrão.'}" style="flex:1;font-weight:700;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--radius-sm)" value="${esc(e.nome)}" placeholder="${livre?'Nome desta etapa':'Nome da etapa'}">
      ${pad?`<button type="button" class="e-padrao" data-padrao="${e.n}" title="Voltar ao nome do catálogo: ${esc(pad)}"${pad===nome?' hidden':''}>↺ padrão</button>`:''}</div>
    <div class="grid2">
      <div class="fld"><label>Status</label>${selectHTML('e-status',e.status)}</div>
      <div class="fld"><label>Data início</label><input class="e-ini" value="${esc(e.data_inicio)}" placeholder="dd/mm/aaaa ou set/2025"></div>
      <div class="fld"><label>Data finalização</label><input class="e-fim" value="${esc(e.data_fim)}" placeholder="dd/mm/aaaa"></div>
    </div>
    <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Observações internas da etapa</label>
    <div class="log ${log?'':'vazio'}" data-etlog="${e.n}">${log?esc(log):'Sem observações.'}</div>
    <div class="addobs"><textarea data-etobs="${e.n}" placeholder="Nova observação (entra com a data de hoje)"></textarea>
      <button class="btn btn--mini btn--pri" data-addet="${e.n}">Adicionar</button></div>
    </div>
  </div>`;
}
// abre/fecha a etapa. O corpo só some por CSS: os inputs continuam no DOM, então
// coletar()/salvar continuam funcionando igual.
function alternarEtapa(btn){
  const bloco=btn.closest('.etapa');if(!bloco)return;
  /* Etapa marcada "Não" não abre: não há o que preencher numa etapa que este
     processo não tem. Quem quiser mexer marca "Sim" primeiro — e aí ela abre. */
  if(bloco.classList.contains('nao'))return;
  const aberta=bloco.classList.toggle('aberta');
  btn.setAttribute('aria-expanded',aberta?'true':'false');
  const ch=btn.querySelector('.etapa-chev');if(ch)ch.textContent=aberta?'▾':'▸';
  if(aberta){const inp=bloco.querySelector('.e-nome');if(inp&&!inp.value.trim())inp.focus();}
}
// mantém o cabeçalho da etapa em dia enquanto o usuário digita
function sincronizarEtapa(campo){
  const bloco=campo.closest('.etapa');if(!bloco)return;
  const v=cls=>{const el=bloco.querySelector(cls);return el?el.value:'';};
  const nome=v('.e-nome').trim();
  const pad=padraoDe(bloco.dataset.n);
  const tit=bloco.querySelector('.etapa-titulo');
  if(tit)tit.textContent=nome||(pad?'Etapa sem nome':'Etapa nova — dê um nome');
  bloco.classList.toggle('vazia',!nome);
  const bp=bloco.querySelector('.e-padrao');if(bp)bp.hidden=(pad===nome);
  /* Voltar de "Não" para "Sim" reencontra um cabeçalho SEM badge — ele não é
     desenhado enquanto a etapa não se aplica. Então ou troca o que existe, ou
     coloca o que falta; senão o status ficava invisível até recarregar. */
  const bdg=bloco.querySelector('.etapa-h .bdg');
  if(bdg)bdg.outerHTML=bdgStatus(v('.e-status'));
  else{const dt0=bloco.querySelector('.etapa-datas');if(dt0)dt0.insertAdjacentHTML('beforebegin',bdgStatus(v('.e-status')));}
  const dt=bloco.querySelector('.etapa-datas');if(dt)dt.textContent=resumoDatasEtapa(v('.e-ini'),v('.e-fim'));
}
/* Marcar "Não" NÃO apaga nada: status, datas e histórico continuam na planilha,
   intactos. O que muda é o significado — esta etapa não faz parte deste processo.
   Voltar para "Sim" devolve tudo como estava, e é por isso que a marcação pode
   ser desfeita sem medo. */
function marcarAplicavel(btn){
  const bloco=btn.closest('.etapa');if(!bloco)return;
  const v=btn.dataset.v==='Não'?'Não':'Sim';
  const inp=bloco.querySelector('.e-apl');if(!inp||inp.value===v)return;
  inp.value=v;
  bloco.querySelectorAll('.apl button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v?'true':'false'));
  const nao=v==='Não';
  bloco.classList.toggle('nao',nao);
  if(nao){
    bloco.classList.remove('aberta');
    const h=bloco.querySelector('.etapa-h');if(h)h.setAttribute('aria-expanded','false');
    const ch=bloco.querySelector('.etapa-chev');if(ch)ch.textContent='▸';
    const bd=bloco.querySelector('.etapa-h .bdg');if(bd)bd.remove();
    const dt=bloco.querySelector('.etapa-datas');if(dt)dt.textContent='não se aplica a este processo';
  }else{
    sincronizarEtapa(inp);
  }
  /* O PROCS é atualizado AQUI, e não só quando a gravação volta. A marcação
     Sim/Não é a única coisa da ficha que o `coletar()` lê de um input escondido:
     se o PROCS ficasse para trás, qualquer redesenho da ficha (reabrir, revelar
     etapa) devolveria o valor antigo à tela — e o `coletar()` seguinte gravaria
     esse valor antigo por cima do novo, na coluna que alimenta o "% concluído". */
  const ed=btn.closest('.editor');
  if(ed&&ed.dataset.row){
    const p=PROCS.find(x=>String(x.row)===String(ed.dataset.row));
    const et=p&&(p.etapas||[]).find(x=>+x.n===+bloco.dataset.n);
    if(et)et.aplicavel=v;
    agendarSalvar(ed.dataset.row);
  }
}
/* O que a MESTRA calculou para este processo: prazo em dias úteis das etapas
   marcadas "Sim", data prevista e situação. Vem pronto da planilha e entra aqui
   como LEITURA — nenhum destes números tem campo, porque quem manda neles é a
   fórmula. Ficha sem data de início não mostra faixa nenhuma: previsão sem ponto
   de partida seria chute com cara de conta. */
function prazoHTML(p){
  const c=p.calc||{};
  const val=x=>String(x==null?'':x).trim();
  const sit=val(c.situacao);
  const cls=/atrasad/i.test(sit)?'atrasado':/aten/i.test(sit)?'atencao':/no prazo/i.test(sit)?'noprazo':'';
  const bits=[];
  if(val(c.aplicaveis))bits.push(`<i><s>etapas</s> ${esc(val(c.concluidas)||'0')}/${esc(val(c.aplicaveis))}`
    +(val(c.pct)?` · ${esc(val(c.pct))}%`:'')+`</i>`);
  if(val(c.prazo_estimado))bits.push(`<i><s>prazo estimado</s> ${esc(val(c.prazo_estimado))} dias úteis</i>`);
  if(val(c.previsao))bits.push(`<i class="${cls}"><s>previsão</s> ${esc(rotuloData(c.previsao))}`
    +(sit&&sit!=='—'?` · ${esc(sit)}`:'')+`</i>`);
  else if(sit&&sit!=='—')bits.push(`<i class="${cls}">${esc(sit)}</i>`);
  if(val(c.dias_andamento))bits.push(`<i><s>em andamento há</s> ${esc(val(c.dias_andamento))} dias</i>`);
  if(val(c.dias_totais))bits.push(`<i><s>levou</s> ${esc(val(c.dias_totais))} dias</i>`);
  if(!bits.length)return '';
  return `<div class="prazo" title="Calculado pela MESTRA em dias úteis, a partir da data de início e das etapas marcadas Sim, descontando os feriados.">${bits.join('')}</div>`;
}
/* O que a ficha mostra: as do catálogo sempre, e um espaço LIVRE só quando ele
   está em uso (tem nome ou está marcado "Sim") ou quando alguém acabou de pedir.
   Mostrar os quatro livres vazios em toda ficha seria a parede de campos que a
   revelação progressiva existia para evitar; escondê-los sempre seria não ter
   como acrescentar etapa. O botão no fim é a diferença entre os dois. */
function etapasVisiveis(p){
  const rev=p._revelados||(p._revelados=new Set());
  return (p.etapas||[]).filter(Boolean).slice().sort((a,b)=>(+a.n||0)-(+b.n||0))
    .filter(e=>!ehLivre(e.n)||String(e.nome||'').trim()||aplicavelDe(e)==='Sim'||rev.has(+e.n));
}
function proximaLivre(p){
  const vis=new Set(etapasVisiveis(p).map(e=>+e.n));
  const e=(p.etapas||[]).filter(Boolean).slice().sort((a,b)=>(+a.n||0)-(+b.n||0))
    .find(x=>ehLivre(x.n)&&!vis.has(+x.n));
  return e?+e.n:0;
}
/* Acrescentar etapa = ocupar um dos espaços livres que a planilha JÁ TEM, com as
   colunas construídas e as fórmulas alcançando. Não cria coluna nenhuma: criar
   coluna no meio de uma planilha de 127 colunas com fórmula em cima é a operação
   que quebra calado — a banda deixa de ser contígua e as contas param de somar a
   etapa nova sem avisar ninguém.
   Nada é gravado até a etapa ganhar um nome: o `coletar()` manda "Não" para
   etapa sem nome, então revelar e desistir não deixa rastro na planilha.

   O bloco novo é INSERIDO no lugar dele; a ficha não é redesenhada. Redesenhar
   parecia mais simples e custava caro: o `editorHTML` monta tudo a partir do
   PROCS, que só recebe os valores quando a gravação VOLTA — e os textos de
   observação nunca chegam lá, porque têm botão próprio. Quem tivesse digitado
   meia página de observação e clicasse aqui perderia o texto, sem nada de onde
   tirá-lo de volta. */
function addEtapaLivre(row){
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  const n=proximaLivre(p);
  const av=document.getElementById('av-livre');
  if(!temCatalogo()){
    if(av)av.textContent='O catálogo de etapas não veio da planilha, então não dá para '
      +'saber quais espaços estão livres. Recarregue a página; se continuar, confira a aba '
      +'"Etapas Padrão" da MESTRA.';
    return;
  }
  if(!n){
    if(av)av.textContent='Os espaços livres deste processo já estão todos em uso. '
      +'Para ter mais, acrescente as colunas da etapa na MESTRA (e a linha dela na aba Etapas Padrão).';
    return;
  }
  if(av)av.textContent='';
  (p._revelados||(p._revelados=new Set())).add(n);
  const e=(p.etapas||[]).find(x=>+x.n===n);
  if(!e)return;
  e.aplicavel='Sim';                      // foi pedida, então se aplica
  const caixa=document.querySelector('#ed-'+row+' [data-etapas]');
  if(!caixa)return;
  /* No lugar certo: os espaços livres não são revelados em ordem, e um bloco 15
     empilhado depois de um 16 já revelado deixaria a ficha fora de ordem. */
  const depois=[...caixa.querySelectorAll('.etapa')].find(el=>+el.dataset.n>n);
  const html=etapaHTML(p,e);
  if(depois)depois.insertAdjacentHTML('beforebegin',html);
  else caixa.insertAdjacentHTML('beforeend',html);
  const bloco=caixa.querySelector('.etapa[data-n="'+n+'"]');
  if(bloco){
    bloco.classList.add('aberta');
    const h=bloco.querySelector('.etapa-h');if(h)h.setAttribute('aria-expanded','true');
    const ch=bloco.querySelector('.etapa-chev');if(ch)ch.textContent='▾';
    const inp=bloco.querySelector('.e-nome');if(inp)inp.focus();
  }
}
/* Devolve o nome do catálogo. Especificar ("Registro na JUCERJA") é informação de
   verdade e por isso o campo é editável; isto é só o caminho de volta para quem
   editou sem querer. */
function voltarPadrao(btn){
  const bloco=btn.closest('.etapa'), ed=btn.closest('.editor');
  if(!bloco)return;
  const nome=padraoDe(bloco.dataset.n);if(!nome)return;
  const inp=bloco.querySelector('.e-nome');if(!inp)return;
  inp.value=nome;
  sincronizarEtapa(inp);
  if(ed&&ed.dataset.row)agendarSalvar(ed.dataset.row);
}
function editorHTML(p){
  const etv=etapasVisiveis(p);
  const glog=p.observacoes_internas||'';
  /* O resumo em badges (⏱ duração, status geral, etapas ok, código) abre a ficha:
     é a mesma informação que a linha da lista não comporta mais, montada pela
     mesma metaHTML() de sempre. Logo acima dela mora a faixa do "não gravou". */
  return `<div class="ign"></div>
    <div class="pmeta">${metaHTML(p)}</div>
    <div class="sub">O processo</div>
    <div class="grid2">
      <div class="fld"><label>Nome / razão social</label><input class="f-nome" value="${esc(p.nome)}"></div>
      <div class="fld"><label>Código Processo</label><input class="f-cod" value="${esc(p.codigo_processo)}"></div>
    </div>
    <div class="fld"><label>Processo</label><textarea class="f-proc">${esc(p.processo)}</textarea></div>
    <div class="grid2">
      <div class="fld"><label>Status Geral</label>${selectHTML('f-stg',p.status_geral)}</div>
      <div class="fld"><label>Data de início do processo</label><input class="f-ini" value="${esc(p.data_inicio_processo||'')}" placeholder="dd/mm/aaaa"></div>
    </div>
    ${prazoHTML(p)}

    <div class="sub">Observações internas (geral)</div>
    <div class="log ${glog?'':'vazio'}" data-glog>${glog?esc(glog):'Sem observações.'}</div>
    <div class="addobs"><textarea data-gobs placeholder="Nova observação (entra com a data de hoje)"></textarea>
      <button class="btn btn--mini btn--pri" data-addgeral>Adicionar</button></div>

    <div class="sub">Etapas <span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)">— as do catálogo padrão. Marque Sim/Não em cada uma.</span></div>
    <div data-etapas>${etv.map(e=>etapaHTML(p,e)).join('')}</div>
    <button class="btn btn--mini" data-addlivre>+ Adicionar etapa fora do catálogo</button>
    <div id="av-livre" style="margin-top:6px;font-size:var(--fs-2);color:var(--vermelho);font-weight:700"></div>

    <div class="sub">Campos internos</div>
    <div class="grid2">
      <div class="fld"><label>Responsável</label><input class="f-e34" value="${esc(p.extras.responsavel)}"></div>
      <div class="fld"><label>UF / cidade</label><input class="f-e35" value="${esc(p.extras.uf)}"></div>
      <div class="fld"><label>Órgão</label><input class="f-e36" value="${esc(p.extras.orgao)}"></div>
      <div class="fld"><label>Protocolo</label><input class="f-e37" value="${esc(p.extras.protocolo)}"></div>
    </div>

    <div class="barra-salvar">
      <span class="autosave">✓ Salva automaticamente — o status aparece no rodapé desta ficha e na barra do topo. As observações datadas entram pelo botão <b>Adicionar</b>.</span>
    </div>`;
}
/* ===================================================================
   A ficha do processo, no modal
   -------------------------------------------------------------------
   A lista mostra as colunas que a equipe lê de relance; o processo
   inteiro abre aqui, por cima, sem trocar de página e sem empurrar as
   outras linhas para baixo. O conteúdo é o MESMO editorHTML() de
   sempre — e ele continua morando num #ed-<row>, então coletar(),
   agendarSalvar() e addObs() não mudaram uma linha.
   =================================================================== */
let FICHA_ROW='';        // de qual processo é a ficha aberta
let CAD_AVISADO=false;   // já avisamos que tem coisa por gravar? (fechar em 2 tempos)
function elCad(){return document.getElementById('modalCad');}
function cadAberto(){const m=elCad();return !!m&&!m.hidden;}
/** Aviso de "tem alteração por gravar" no rodapé; o botão passa a dizer que sai assim mesmo. */
function avisoCad(mostrar){
  const a=document.getElementById('cadAviso');if(a)a.hidden=!mostrar;
  const b=document.getElementById('cadFechar');if(b)b.textContent=mostrar?'Fechar assim mesmo':'Fechar';
}
/** Cliente, ID e situação no topo da ficha — acompanham a edição sem redesenhar nada. */
function atualizarTopoCad(row){
  if(!cadAberto()||String(FICHA_ROW)!==String(row))return;
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  const s=situacaoDe(p,resumoProc(p)),info=SITUACOES[s];
  const t=document.getElementById('cadTitulo');if(t)t.textContent=p.nome||'(sem nome)';
  const i=document.getElementById('cadId');
  if(i)i.textContent=String(p.id||'')+(String(p.codigo_processo||'').trim()?' · '+p.codigo_processo:'');
  const q=document.getElementById('cadSit');
  if(q){q.className='pill sit-'+s;q.title=info.dica;q.textContent=rotuloSituacao(p,s);}
}
/** Acende na lista a linha da ficha que está aberta. */
function marcarLinhaAberta(){
  document.querySelectorAll('.proc').forEach(n=>n.classList.toggle('aberto',String(n.dataset.row)===String(FICHA_ROW)));
}
/* O nome ficou: `abrirEditor` é chamado de outros pontos (o processo recém-criado
   abre por ele) e o que ele faz continua sendo o mesmo — mostrar o editor daquele
   processo. Só um por vez, agora por construção: só existe uma ficha. */
function abrirEditor(row){
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  const m=elCad();if(!m)return;
  FICHA_ROW=String(p.row);CAD_AVISADO=false;
  document.getElementById('cadBody').innerHTML=
    `<div class="editor" id="ed-${esc(String(p.row))}" data-row="${esc(String(p.row))}">${editorHTML(p)}</div>`;
  m.hidden=false;
  /* Enquanto a ficha está aberta a página atrás não rola — o mesmo gesto do modal
     de processo novo. */
  document.body.style.overflow='hidden';
  atualizarTopoCad(FICHA_ROW);
  avisoCad(false);
  marcarLinhaAberta();
  /* Reabrir não pode apagar o que não gravou: a faixa e o "tentar de novo" nascem
     de novo junto com os campos. */
  if(FALHAS.has(String(p.row)))marcarFalha(p.row,true);
  const cx=m.querySelector('.modal-box');if(cx)cx.focus();
}
/* Fechar com alteração por gravar avisa antes, em dois tempos como o resto da casa
   (nunca uma caixa do navegador): o primeiro Fechar/Esc/clique no véu explica, o
   segundo sai. Ao sair assim mesmo a gravação pendente é DESCARREGADA na hora —
   deixar o debounce correndo com a ficha fora da tela é exatamente o jeito de
   perder o que foi digitado. */
function fecharFicha(){
  const m=elCad();if(!m||m.hidden)return;
  if(temPendencia()&&!CAD_AVISADO){CAD_AVISADO=true;avisoCad(true);return;}
  if(PEND_DADOS.size)descarregarPendentes();
  m.hidden=true;
  document.body.style.overflow='';
  const row=FICHA_ROW;FICHA_ROW='';CAD_AVISADO=false;
  avisoCad(false);
  marcarLinhaAberta();
  document.getElementById('cadBody').innerHTML='';
  /* O foco volta para a linha de onde saiu: quem navega por teclado não é jogado
     de volta para o topo da página. */
  const no=document.querySelector('.proc[data-row="'+row+'"] .proc-h');
  if(no)no.focus();
}
/* O botão "Salvar alterações" NÃO substitui o autosave: cada mudança de campo
   continua chamando agendarSalvar(), e é ele que impede perder texto digitado —
   foi para isso que ele existe nesta tela. O botão ANTECIPA a gravação pendente
   (mata o debounce e salva na hora), espera a que já está no ar, reenvia o que
   falhou e, quando tudo entrou, FECHA a ficha: salvar é o gesto de encerrar, e
   ficar com a ficha aberta depois de confirmar faz a pessoa clicar em Fechar sem
   saber se gravou.

   Só fecha se gravou MESMO. Falha mantém a ficha na tela: fechar por cima de uma
   gravação que não foi levaria embora o aviso e a chance de tentar de novo, e a
   pessoa sairia achando que salvou. */
/* Deixou de ser `async`: não há mais `await` aqui dentro. O corpo inteiro
   roda de uma vez e a ficha fecha no mesmo quadro do clique. */
function salvarAgoraCad(){
  const btn=document.getElementById('cadSalvar');
  if(temPendencia()){
    if(btn){btn.disabled=true;btn.dataset.rot=btn.textContent;btn.textContent='Salvando…';}
    try{
      /* o que está no debounce e o que falhou antes entram juntos na mesma leva */
      const alvos=new Map();
      PEND_DADOS.forEach((d,k)=>alvos.set(k,d));
      /* Linha em DÚVIDA não volta para a fila. Tirar o botão "tentar de novo" da
         linha e deixar o botão primário da ficha reenviando a mesma coisa seria
         fechar a porta e deixar a janela aberta: a gravação pode ter entrado, e
         mandar de novo é o que este caminho todo existe para não fazer. Ela fica
         pendente — a ficha não fecha, e o recado diz o que fazer. */
      FALHAS.forEach((d,k)=>{if(!alvos.has(k)&&!INCERTOS.has(String(k)))alvos.set(k,d);});
      alvos.forEach((d,k)=>{clearTimeout(saveTimers[k]);PEND_DADOS.delete(k);FALHAS.delete(k);});
      const disparos=[];
      alvos.forEach((d,k)=>disparos.push(disparar(k,d)));
      /* e o que JÁ estava viajando quando a pessoa clicou também é esperado —
         senão o botão terminava antes da resposta e a ficha não fechava nunca. */
      EMVOO.forEach(pr=>disparos.push(pr));
      /* Sem `await`: cada gravação cuida do próprio desfecho, inclusive do
         recado. O `catch` só evita "unhandled rejection" no console — o
         tratamento de verdade está dentro de cada uma. */
      Promise.all(disparos).catch(()=>{});
    }catch(e){ /* salvarAuto() já registra a falha em FALHAS e avisa na tela */ }
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.rot||'Salvar alterações';}
  }
    /* Sobrou dúvida: a ficha NÃO fecha (o `temPendencia()` abaixo cuida disso) e
       agora ela diz por quê. Sem este recado, o botão pareceria não ter feito
       nada. */
    if(INCERTOS.size) setMsg(0,'msg err','Uma gravação ficou sem confirmação. Recarregue a página para ver se ela entrou — não mande de novo.');
  /* A FICHA NÃO ESPERA MAIS. Antes ela só fechava quando tudo tinha
     voltado do servidor, e não fechava se algo falhasse — segundos por
     ficha, numa tela em que se abre dezenas. O que ocupa esse lugar
     agora é o `avisarFalha()`: antes a ficha ficava aberta para contar a
     má notícia; agora a má notícia vai atrás de quem precisa dela.
     Fechar a ABA com gravação em voo continua pedindo confirmação — é o
     `sujo:()=>temPendencia()`, que não mudou. */
  CAD_AVISADO=false;avisoCad(false);
  fecharFicha();
}

function coletar(row){
  const ed=document.getElementById('ed-'+row);
  /* "dias" saiu do payload: virou fórmula na planilha (última finalização menos a
     data de início) e mandar valor para lá apagaria a fórmula daquela linha. */
  /* Etapa SEM NOME não se aplica — vale aqui e no modal de processo novo, e é o
     que impede um espaço livre recém-revelado, que ninguém chegou a batizar, de
     entrar na planilha como "Sim". Ele contaria no prazo estimado e no
     "Nº de etapas aplicáveis", e derrubaria o % concluído de um processo inteiro
     por causa de uma etapa que não existe. */
  const etapas=[...ed.querySelectorAll('.etapa')].map(el=>{
    const nome=el.querySelector('.e-nome').value.trim();
    const apl=(el.querySelector('.e-apl')||{}).value||'Sim';
    return {n:+el.dataset.n,aplicavel:nome?apl:'Não',nome:nome,
            status:el.querySelector('.e-status').value,
            data_inicio:el.querySelector('.e-ini').value.trim(),
            data_fim:el.querySelector('.e-fim').value.trim()};
  });
  return {nome:ed.querySelector('.f-nome').value.trim(),codigo_processo:ed.querySelector('.f-cod').value.trim(),processo:ed.querySelector('.f-proc').value.trim(),status_geral:ed.querySelector('.f-stg').value,data_inicio_processo:ed.querySelector('.f-ini').value.trim(),extras:{responsavel:ed.querySelector('.f-e34').value.trim(),uf:ed.querySelector('.f-e35').value.trim(),orgao:ed.querySelector('.f-e36').value.trim(),protocolo:ed.querySelector('.f-e37').value.trim()},etapas};
}
let saveTimers={};
/* ---------- pendências e falhas de gravação (C.3) ----------
   PENDENTES = alteração ainda no debounce ou já viajando. FALHAS = o servidor
   recusou e o dado só existe na tela. Nos dois casos fechar a aba pede
   confirmação, e a falha deixa o processo marcado com um "tentar de novo". */
const PENDENTES=new Set();
const FALHAS=new Map();   // row -> dados que não foram gravados
/* O que está esperando o debounce, capturado no momento em que a pessoa mexeu.
   O botão "Salvar alterações" e o Fechar precisam poder disparar ESSES dados sem
   esperar os 450 ms — e sem depender de a ficha ainda estar na tela. */
const PEND_DADOS=new Map();   // row -> dados capturados por agendarSalvar
/* Gravações já disparadas. O botão espera por elas antes de decidir se fecha:
   sem isto, clicar em Salvar durante um autosave em voo terminava antes da
   resposta e a ficha ficava aberta como se nada tivesse entrado. */
const EMVOO=new Map();        // row -> promessa da gravação em andamento
function temPendencia(){return PENDENTES.size>0||FALHAS.size>0;}
function disparar(row,dados){
  const k=String(row);
  const pr=salvarAuto(row,dados);
  EMVOO.set(k,pr);
  const solta=()=>{if(EMVOO.get(k)===pr)EMVOO.delete(k);};
  pr.then(solta,solta);
  return pr;
}
/* Grava agora o que estava esperando o debounce. É o salvarAuto() de sempre, só
   sem os 450 ms de espera. */
function descarregarPendentes(){
  Array.from(PEND_DADOS.keys()).forEach(k=>{
    const d=PEND_DADOS.get(k);
    clearTimeout(saveTimers[k]);PEND_DADOS.delete(k);
    if(d)disparar(k,d);
  });
}
/* ---------- o terceiro estado ----------
   Uma gravação que não deu para confirmar NÃO é uma gravação que falhou. As duas
   pedem que o texto digitado não se perca (e por isso as duas entram em FALHAS,
   que é o que segura o aviso de "sair sem gravar"), mas só uma delas autoriza
   repetir. Este conjunto é a diferença: quem está aqui recebe selo de dúvida, sem
   botão, e a instrução de recarregar. */
const INCERTOS=new Set();

/* O selo que a linha ganha quando algo não gravou. Duas formas, porque são dois
   fatos diferentes — e a diferença aparece no que ele OFERECE: o de falha tem
   botão (repetir é seguro, o servidor disse que não gravou); o de dúvida não tem
   botão nenhum, porque a única ação segura ali é recarregar e olhar. */
function seloFalha(id){
  return INCERTOS.has(String(id))
    ? '<span class="ign-duvida">sem confirmação — recarregue a página para ver se gravou</span>'
    : '<button type="button" class="btn-retry" data-retry="'+esc(String(id))+'">não salvou — tentar de novo</button>';
}

/* ---------- o recado, para quem NÃO está com a ficha aberta ----------
   O selo na linha continua sendo a marca de longe: é ele que mostra, varrendo a
   lista, quais linhas têm coisa por gravar. Mas ele só é visto por quem está
   olhando a lista — e desde que a ficha passou a fechar sem esperar, quase
   ninguém está. O recado é a mesma notícia indo atrás de quem precisa dela.

   NADA DE LÓGICA NOVA AQUI. As duas ofertas saem do que esta página JÁ decidiu:
   `INCERTOS` é a dúvida (a gravação pode ter entrado, e repetir gravaria duas
   vezes), o resto é recusa. Só muda quem é avisado.

   Ele lê o estado com cuidado de propósito: as seis telas guardam a falha em
   formatos diferentes (Map de campos, Map de colunas, Set de linhas, objeto de
   dados), e um adaptador que aceita os quatro é mais seguro do que seis funções
   parecidas que ninguém vai reler juntas. */
function avisarFalha(id,falhou,motivo){
  /* TUDO PROTEGIDO, e não por precaução vaga: uma exceção aqui sobe pelo
     `marcarFalha()` e cai dentro do `catch` que estava tratando a falha de
     gravação — o recado quebrado engoliria o registro da falha, e o que não
     gravou passaria a não estar marcado em lugar nenhum. É a mesma regra do
     `_dailyLog_` no backend: quem acompanha a gravação não pode derrubá-la.
     (Aconteceu de verdade no Licenças, e foi o teste que pegou.) */
  try{ avisarFalha_(id,falhou,motivo); }catch(e){}
}
function avisarFalha_(id,falhou,motivo){
  if(!window.B4UGravar||typeof B4UGravar.falhou!=='function') return;
  const k=String(id), ch='soc:'+k;
  if(!falhou) return B4UGravar.resolvida(ch);
  const duvida=(typeof INCERTOS!=='undefined')&&!!(INCERTOS&&INCERTOS.has&&INCERTOS.has(k));
  /* Como a linha se chama para quem lê. O id sozinho não diz nada a quem está
     olhando a tela de longe; o nome do cliente diz tudo. */
  let nome='';
  try{
    /* Cada tela chama sua lista de um jeito — LINHAS nas de ficha, CLIENTES no
       Registro, CONTATOS nos Contatos, PROCS no Societário. Procurar em todas as
       que existirem custa nada e evita seis versões desta função; a que não
       existe na página nem chega a ser olhada (o `typeof` não estoura em nome não
       declarado, que é o motivo de ele estar aqui em vez de um `try` só). */
    const fontes=[
      typeof LINHAS  !=='undefined'&&LINHAS,
      typeof CLIENTES!=='undefined'&&CLIENTES,
      typeof CONTATOS!=='undefined'&&CONTATOS,
      typeof PROCS   !=='undefined'&&PROCS
    ];
    for(const L of fontes){
      if(!L||!L.find) continue;
      const l=L.find(x=>x&&(String(x.id)===k||String(x.row)===k));
      if(!l) continue;
      nome=l.nome_cliente||l.razao||l.nome||l.cliente||l.id||'';
      if(nome) break;
    }
  }catch(e){}
  /* O QUE não entrou. Os quatro formatos, na ordem em que aparecem nas telas. */
  let itens=[];
  try{
    const f=(FALHAS&&FALHAS.get)?FALHAS.get(k):null;
    const s=f&&(f.campos||f.colunas||f);
    if(s instanceof Set) itens=Array.from(s);
    else if(s&&typeof s==='object') itens=Object.keys(s);
  }catch(e){}
  if(!itens.length&&'') itens=[''];
  B4UGravar.falhou({
    chave:ch, duvida:duvida,
    titulo:nome||('Linha '+k),
    itens:itens, motivo:motivo||'',
    /* Dúvida não ganha botão de repetir — é a regra que o selo desta tela já
       segue. E página sem `tentarDeNovo` não ganha botão nenhum: oferecer sem
       ter o que chamar é pior do que não oferecer. */
    aoRepetir:(duvida||typeof tentarDeNovo!=='function')?null:()=>tentarDeNovo(k)
  });
}
function marcarFalha(row,falhou,motivo){
  avisarFalha(row,falhou,motivo);
  /* A LINHA continua marcada na lista mesmo com a ficha fechada — é o que mostra,
     de longe, que aquele processo tem coisa que não gravou. */
  const cx=document.querySelector('.proc[data-row="'+row+'"]');
  if(cx)cx.classList.toggle('falhou',!!falhou);
  /* A faixa e o botão vivem no editor, que hoje é pintado dentro do modal: achar
     o #ed-<row> funciona esteja ele onde estiver — e ele não existe quando a
     ficha está fechada, que é justamente o caso em que não há o que marcar. */
  const ed=document.getElementById('ed-'+row);
  const ign=ed&&ed.querySelector('.ign');
  if(!ign)return;
  /* Trocar, não só inserir. O guarda antigo era `se falhou e ainda não há selo,
     insere` — o que bastava quando havia UM selo só. Com dois, ele congelava o
     primeiro: uma linha que falhou (botão vermelho) e depois ficou em dúvida
     continuaria oferecendo "tentar de novo" embaixo de um texto que pede para NÃO
     repetir; e o contrário — dúvida antes, recusa do servidor depois — esconderia o
     botão justamente quando repetir passou a ser o certo. O selo é redesenhado a
     cada chamada, e some quando não há mais o que marcar. */
  const antigo=ign.querySelector('.btn-retry,.ign-duvida');
  if(falhou&&antigo)antigo.outerHTML=seloFalha(row);
  else if(falhou)ign.insertAdjacentHTML('beforeend',seloFalha(row));
  else if(antigo)antigo.remove();
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
window.addEventListener('beforeunload',e=>{if(temPendencia()){e.preventDefault();e.returnValue='';}});
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function setMsg(row,cls,txt){
  const cl='save-status '+(/ok/.test(cls)?'ok':/err/.test(cls)?'err':'saving');
  const el=document.getElementById('saveStatus');   // status VISÍVEL no topo (barra fixa)
  if(el){el.className=cl;el.textContent=txt;}
  /* O mesmo recado no rodapé da ficha: com o modal aberto a barra do topo fica
     atrás do véu, e "não foi possível salvar" atrás do véu é aviso que ninguém lê. */
  const ec=document.getElementById('saveStatusCad');
  if(ec){ec.className=cl+' claro';ec.textContent=txt;}
}
function agendarSalvar(row){
  const dados=coletar(row);                       // captura AGORA (mesmo que feche a ficha depois)
  setMsg(row,'autosave','Alterado…');
  PENDENTES.add(String(row));
  PEND_DADOS.set(String(row),dados);              // o botão "Salvar alterações" antecipa ESTES dados
  clearTimeout(saveTimers[row]);
  saveTimers[row]=setTimeout(()=>disparar(row,dados),450);
}
async function salvarAuto(row,dados){
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  setMsg(row,'autosave','Salvando…');
  PENDENTES.add(String(row));
  PEND_DADOS.delete(String(row));                 // daqui para a frente está no ar, não mais no debounce
  /* Cada gravação recebe um número. A conferência do caso incerto demora alguns
     segundos, e nesse meio-tempo a pessoa pode ter digitado de novo: sem este
     carimbo, a resposta de uma conferência VELHA pintaria "Salvo ✓ (confirmado)"
     por cima de uma gravação nova que ainda está viajando. */
  /* O post voltou? É o que separa "a tela quebrou depois de gravar" de "a exceção
     nem chegou a virar requisição". Sem esta marca, um erro lançado ANTES do post
     — dentro do mesmo try — seria anunciado como gravação bem-sucedida. */
  let respondeu=false;
  const seq=++CONF_N; CONF_SEQ.set(String(row),seq);
  try{
    await postAcao(Object.assign({acao:'soc_salvar',row:p.row,id:p.id},dados));
    respondeu=true;
    Object.assign(p,{nome:dados.nome,codigo_processo:dados.codigo_processo,processo:dados.processo,status_geral:dados.status_geral,extras:dados.extras});
    dados.etapas.forEach(e=>{const alvo=p.etapas[e.n-1];if(alvo){alvo.nome=e.nome;alvo.status=e.status;alvo.data_inicio=e.data_inicio;alvo.data_fim=e.data_fim;alvo.aplicavel=e.aplicavel;}});
    setMsg(row,'msg ok','Salvo ✓ '+horaAgora());
    atualizarLinha(row);
    PENDENTES.delete(String(row));FALHAS.delete(String(row));INCERTOS.delete(String(row));marcarFalha(row,false);
    /* Gravou tudo: o aviso de "tem coisa por gravar" no rodapé da ficha sai, e o
       Fechar volta a ser Fechar. */
    if(!temPendencia()){CAD_AVISADO=false;avisoCad(false);}
    try{atualizarChips();}catch(_){}   // contagem dos chips em dia; a lista fica como está
  }catch(e){
    const k=String(row);
    /* `PENDENTES.delete` NÃO vem mais aqui em cima. Ele e o `FALHAS.set` eram
       grudados de propósito: entre um e outro, `temPendencia()` fica falso e o
       aviso de "sair sem gravar" desliga. Antes essa janela era de milésimos;
       com a conferência ela iria a 28 segundos — bem em cima do F5 que a própria
       mensagem seguinte manda dar. Cada saída abaixo fecha a sua. */

    /* Uma resposta que chega depois de outra gravação já ter assumido este
       processo não tem mais nada a dizer sobre ele: o que está na tela é o texto
       da gravação nova, e o veredicto desta aqui — sucesso ou fracasso — falaria
       de algo que já não está mais lá. */
    if(CONF_SEQ.get(k)!==seq){ PENDENTES.delete(k); return; }
    /* TRÊS desfechos, não dois — e a diferença é toda ela sobre o que dá para
       AFIRMAR. */

    /* (1) O servidor leu, decidiu e recusou. Não gravou. O texto é escrito por nós
       ("a linha mudou de lugar", "etapa que não existe") e vai para a tela: aqui
       quem lê é da equipe, e esconder o motivo já custou caro neste painel. */
    if(e&&e.doServidor){
      FALHAS.set(k,dados); PENDENTES.delete(k); INCERTOS.delete(k); marcarFalha(row,true);
      setMsg(row,'msg err','O servidor recusou: '+String((e&&e.message)||e));
      return;
    }
    /* (2) A exceção NÃO veio do postAcao — ele só devolve `doServidor` ou
       `incerto`. Restam dois casos, e o `respondeu` os separa:
       • o post JÁ tinha voltado e quem estourou foi o código de tela que roda
         depois dele — então GRAVOU, e dizer "o servidor recusou" seria inverter o
         fato e ainda oferecer um "tentar de novo" que regravaria o que já está lá;
       • o post NEM chegou a sair (algo estourou antes dele, dentro do mesmo try) —
         aí nada foi gravado e repetir é seguro. */
    if(!e||!e.incerto){
      if(respondeu){
        PENDENTES.delete(k); FALHAS.delete(k); INCERTOS.delete(k); marcarFalha(row,false);
        setMsg(row,'msg ok','Salvo ✓ '+horaAgora()+' · a tela não acompanhou — recarregue para vê-la certa');
      }else{
        FALHAS.set(k,dados); PENDENTES.delete(k); INCERTOS.delete(k); marcarFalha(row,true);
        setMsg(row,'msg err','Não foi possível salvar. Tente de novo.');
      }
      return;
    }
    /* (3) A resposta se perdeu. A gravação acontece ANTES da resposta, e o front
       não tem como saber se ela aconteceu — então, em vez de decretar, ele vai
       PERGUNTAR. A pendência troca de mão sem passar pelo vazio: entra em FALHAS
       antes de sair de PENDENTES. Só o SELO espera — porque o selo é uma
       afirmação, e ainda não há nada a afirmar. */
    FALHAS.set(k,dados); PENDENTES.delete(k);
    setMsg(row,'autosave','A resposta não chegou — conferindo se gravou…');
    const r=await conferirGravacao(row,dados);
    if(CONF_SEQ.get(k)!==seq) return;   // enquanto conferíamos, outra gravação assumiu o processo
    if(r==='bateu'){
      Object.assign(p,{nome:dados.nome,codigo_processo:dados.codigo_processo,processo:dados.processo,status_geral:dados.status_geral,extras:dados.extras});
      dados.etapas.forEach(e2=>{const alvo=p.etapas[e2.n-1];if(alvo){alvo.nome=e2.nome;alvo.status=e2.status;alvo.data_inicio=e2.data_inicio;alvo.data_fim=e2.data_fim;alvo.aplicavel=e2.aplicavel;}});
      setMsg(row,'msg ok','Salvo ✓ (confirmado) '+horaAgora());
      atualizarLinha(row);
      FALHAS.delete(k); INCERTOS.delete(k); marcarFalha(row,false);
      if(!temPendencia()){CAD_AVISADO=false;avisoCad(false);}
      try{atualizarChips();}catch(_){}
      return;
    }
    if(r==='nao-bateu'){
      /* Única hora em que "mande de novo" é conselho honesto: o processo foi lido
         e o valor não está lá. */
      INCERTOS.delete(k); marcarFalha(row,true);
      setMsg(row,'msg err','Não gravou tudo: reli o processo e algum campo não está com o que você mandou. Pode mandar de novo.');
      return;
    }
    /* 'nao-sei': a dúvida continua de pé. Selo de dúvida, sem botão — e o pedido é
       recarregar, nunca repetir. */
    INCERTOS.add(k); marcarFalha(row,true);
    setMsg(row,'msg err','Não consegui confirmar se salvou. Recarregue antes de mandar de novo.');
  }
}
/* Depois de gravar, a linha da lista acompanha o que mudou — cliente, processo,
   etapa atual, movimentação e situação — sem redesenhar a lista inteira. Os campos
   vivem no modal, então repintar a linha aqui não tira o foco de ninguém; e se o
   foco estava NA linha (é onde ele volta ao fechar a ficha), ele volta para ela
   depois da repintura, em vez de ser jogado para o topo da página. */
function atualizarLinha(row){
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  const r=resumoProc(p);
  const no=document.querySelector('.proc[data-row="'+row+'"]');
  if(no){
    const cab=no.querySelector('.proc-h');
    const tinhaFoco=!!cab&&document.activeElement===cab;
    no.innerHTML=cabecaHTML(p,r);
    if(tinhaFoco){const nova=no.querySelector('.proc-h');if(nova)nova.focus();}
    /* a faixa lateral acompanha a mudança de situação sem redesenhar a lista */
    SIT_CLASSES.forEach(c=>no.classList.remove(c));
    no.classList.add('sit-'+situacaoDe(p,r));
  }
  /* e a ficha aberta mostra o cliente, o código e a situação novos — mais o resumo
     de badges (⏱ duração, status, etapas ok) que mora no alto dela. */
  atualizarTopoCad(row);
  const ed=document.getElementById('ed-'+row);
  const meta=ed&&ed.querySelector('.pmeta');
  if(meta)meta.innerHTML=metaHTML(p);
}
async function addObs(row,btn,tipo,n){
  const p=PROCS.find(x=>x.row==row);const ed=document.getElementById('ed-'+row);
  const ta=tipo==='geral'?ed.querySelector('[data-gobs]'):ed.querySelector(`[data-etobs="${n}"]`);
  const texto=ta.value.trim();if(!texto){ta.focus();return;}
  btn.disabled=true;const txtOrig=btn.textContent;btn.textContent='…';
  try{
    const acao=tipo==='geral'?'soc_obs_geral':'soc_obs_etapa';
    const d=await postAcao(Object.assign({acao,row:p.row,id:p.id,texto},tipo==='etapa'?{n}:{}));
    if(tipo==='geral'){p.observacoes_internas=d.valor;const log=ed.querySelector('[data-glog]');log.textContent=d.valor;log.classList.remove('vazio');}
    else{p.etapas[n-1].obs_interna=d.valor;const log=ed.querySelector(`[data-etlog="${n}"]`);log.textContent=d.valor;log.classList.remove('vazio');}
    ta.value='';ta.scrollIntoView({block:'nearest'});
  /* Observação ACRESCENTA ao histórico — ela não substitui nada. Mandar de novo
     depois de um silêncio deixa o mesmo texto duas vezes no log interno, com duas
     datas, e ninguém depois sabe qual das duas foi a de verdade. Por isso o caso
     incerto aqui manda recarregar, nunca repetir. O que foi digitado continua no
     campo nos dois caminhos. */
  }catch(e){
    setMsg(p.row,'msg err', (e&&e.incerto)
      ? 'Não consegui confirmar se a observação entrou. Recarregue antes de mandar de novo.'
      : (e&&e.doServidor)
      ? 'O servidor recusou: '+String((e&&e.message)||e)
      /* Estourou depois do post, ao escrever o log na tela: a observação ENTROU.
         Repetir escreveria o mesmo texto duas vezes no histórico. */
      : 'A observação foi gravada, mas a tela não acompanhou. Recarregue para vê-la — não mande de novo.');
  }
  btn.disabled=false;btn.textContent=txtOrig;
}
/* Acrescentar etapa virou ocupar um ESPAÇO LIVRE — colunas que a planilha já tem
   prontas, com as fórmulas já alcançando (ver addEtapaLivre e addEtapaNovo). A
   rota `soc_nova_etapa`, que criava colunas de verdade, não é mais chamada por
   nenhuma tela: as colunas dela nasciam DEPOIS das bandas, fora do alcance das
   fórmulas, e painel e planilha passavam a discordar em silêncio. Precisando de
   mais que os espaços livres, o caminho é a planilha — acrescentar as colunas nas
   bandas e a linha na aba "Etapas Padrão" — e este painel enxerga sozinho, porque
   o laço lê enquanto existir "Etapa N". */

/* ===== O catálogo dentro do modal de processo novo ===================== */
let NOVO_LIVRES=[];      // espaços livres que alguém pediu nesta criação
/* Quantos blocos de etapa a planilha tem — inclusive os livres, que o catálogo
   não menciona porque eles não têm nome. Sai dos processos já carregados; quem
   diz é a planilha, nunca um número escrito aqui. */
function tetoEtapas(){
  /* O MAIOR Nº do catálogo, não quantos ele tem: se uma etapa cair do catálogo
     (Nº digitado como texto na planilha, por exemplo), o comprimento encolhe e o
     "+ Etapa" passaria a oferecer como livre um número que é do catálogo. */
  let t=0;
  for(const c of CATALOGO) t=Math.max(t,+c.n||0);
  for(const p of PROCS) t=Math.max(t,+p.etapas_max||0);
  return t;
}
function catLinhaHTML(n,nome){
  return `<div class="cat-l" data-n="${n}">
    <span class="cat-n">${n}</span>
    <span class="apl" role="group" aria-label="A etapa ${n} se aplica a este processo?">
      <button type="button" data-napl="${n}" data-v="Sim" aria-pressed="true">Sim</button>
      <button type="button" data-napl="${n}" data-v="Não" aria-pressed="false">Não</button>
    </span>
    <input class="n-et-nome" value="${esc(nome)}" placeholder="Nome desta etapa">
    <input type="hidden" class="n-et-apl" value="Sim">
  </div>`;
}
/* Redesenha preservando o que já foi marcado e digitado: acrescentar uma etapa
   não pode apagar as respostas das outras treze. */
function desenharEtapasNovo(){
  const el=document.getElementById('n-etapas');if(!el)return;
  if(!CATALOGO.length){
    el.innerHTML='<div style="padding:10px;font-size:13px;color:var(--muted)">O catálogo de '
      +'etapas não veio da planilha. O processo é criado assim mesmo e as etapas podem ser '
      +'marcadas depois, na ficha.</div>';
    return;
  }
  const antes={};
  el.querySelectorAll('.cat-l').forEach(l=>{antes[l.dataset.n]={
    nome:l.querySelector('.n-et-nome').value, apl:l.querySelector('.n-et-apl').value};});
  el.innerHTML=CATALOGO.map(c=>catLinhaHTML(c.n,c.nome))
    .concat(NOVO_LIVRES.map(n=>catLinhaHTML(n,''))).join('');
  el.querySelectorAll('.cat-l').forEach(l=>{
    const a=antes[l.dataset.n];if(!a)return;
    l.querySelector('.n-et-nome').value=a.nome;
    l.querySelector('.n-et-apl').value=a.apl;
    pintarLinhaNovo(l,a.apl);
  });
}
function pintarLinhaNovo(l,v){
  l.classList.toggle('nao',v==='Não');
  l.querySelectorAll('.apl button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v?'true':'false'));
}
function marcarNovo(btn){
  const l=btn.closest('.cat-l');if(!l)return;
  const v=btn.dataset.v==='Não'?'Não':'Sim';
  const inp=l.querySelector('.n-et-apl');if(!inp)return;
  inp.value=v;pintarLinhaNovo(l,v);
}
function todasNovo(v){
  document.querySelectorAll('#n-etapas .cat-l').forEach(l=>{
    const inp=l.querySelector('.n-et-apl');if(!inp)return;
    inp.value=v;pintarLinhaNovo(l,v);
  });
}
/* Etapa fora do catálogo = ocupar um dos espaços livres que a planilha já tem
   pronto. Não cria coluna nenhuma. */
function addEtapaNovo(){
  const av=document.getElementById('n-av-livre');
  const usados=CATALOGO.map(c=>+c.n).concat(NOVO_LIVRES);
  for(let n=1;n<=tetoEtapas();n++){
    if(usados.indexOf(n)>-1)continue;
    NOVO_LIVRES.push(n);desenharEtapasNovo();
    if(av)av.textContent='';
    const inp=document.querySelector('#n-etapas .cat-l[data-n="'+n+'"] .n-et-nome');
    if(inp)inp.focus();
    return;
  }
  if(av)av.textContent='Os espaços livres da planilha já estão todos na lista. Para ter mais, '
    +'acrescente as colunas na MESTRA e a linha na aba Etapas Padrão.';
}
function etapasDoNovo(){
  /* Manda TODAS as linhas, inclusive as marcadas "Não" — filtrar por nome fazia o
     "Não" de uma etapa sem nome se perder no caminho, e a linha nova nascia com o
     "Sim" que o copyTo tinha deixado: o oposto do que a pessoa pediu.
     A regra é a mesma do coletar(): sem nome, não se aplica. */
  return [...document.querySelectorAll('#n-etapas .cat-l')].map(l=>{
    const nome=l.querySelector('.n-et-nome').value.trim();
    return {n:+l.dataset.n, nome:nome,
            aplicavel:nome?l.querySelector('.n-et-apl').value:'Não'};
  });
}

// modal novo processo
function abrirNovo(){document.getElementById('n-stg').innerHTML=STATUS.filter(Boolean).map(o=>`<option${o==='Em andamento'?' selected':''}>${o}</option>`).join('');['n-id','n-nome','n-cod','n-proc','n-ini'].forEach(i=>document.getElementById(i).value='');document.getElementById('n-msg').textContent='';
  NOVO_LIVRES=[];desenharEtapasNovo();
  const av=document.getElementById('n-av-livre');if(av)av.textContent='';
  document.getElementById('modal').classList.add('on');}
function fecharNovo(){document.getElementById('modal').classList.remove('on');}
async function criarNovo(btn){
  const id=document.getElementById('n-id').value.trim(),proc=document.getElementById('n-proc').value.trim();
  const msg=document.getElementById('n-msg');
  if(!id||!proc){msg.className='msg err';msg.textContent='Informe ID e Processo.';return;}
  btn.disabled=true;msg.className='msg';msg.textContent='Criando…';
  try{
    const d=await postAcao({acao:'soc_novo',id,nome:document.getElementById('n-nome').value.trim(),codigo_processo:document.getElementById('n-cod').value.trim(),processo:proc,status_geral:document.getElementById('n-stg').value,data_inicio_processo:document.getElementById('n-ini').value.trim(),etapas:etapasDoNovo()});
    fecharNovo();F_STATUS=[];F_ATALHO=[];BUSCA='';SORT={k:'dur',dir:dirPadrao('dur')};TETO=PASSO;
    /* As caixas acompanham o estado limpo. O `carregar()` logo abaixo repinta a
       tela inteira e monta caixas novas, mas escrever aqui mantém a régua
       coerente também no caminho em que ele falha. */
    if(CX_STATUS)CX_STATUS.marcados([]);
    if(CX_ATALHO)CX_ATALHO.marcados([]);
    sincronizarURL();                                        // limpa o endereço ANTES de recarregar
    await carregar();   // o processo novo não pode nascer escondido por um filtro
    garantirVisivel(d.row);   // nem atrás do teto
    const el=document.querySelector(`.proc[data-row="${d.row}"]`);if(el){el.scrollIntoView({block:'center'});abrirEditor(d.row);}
  /* O que está no formulário não se perde em nenhum dos dois caminhos.
     Esta rota CRIA uma linha na MESTRA. Clicar de novo depois de um silêncio deixa
