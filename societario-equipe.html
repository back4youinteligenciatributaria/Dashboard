<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Guia nova por padrão: link clicado não tira o colaborador de onde ele estava. -->
<base target="_blank">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Societário (equipe) — back4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta canonica da equipe — a mesma em todas as telas. */
  --canvas:#F1E7DC;--surface:#FFFFFF;--surface-warm:#FBF6EF;
  --ink:#113D39;--ink-2:#3F5854;--muted:#6E6256;--line:#E4D9C9;--line-2:#D6C3AC;
  --brand-dark:#073034;--brand-teal:#0F8C85;--brand-euc:#3FA680;
  --amber:#E8892E;--amber-txt:#B05F12;--amber-soft:#FCEFE0;--amber-line:#F0D6B4;
  --vermelho:#C0392B;--verde:#2E9D5F;--verde-2:#25804C;
  /* Raios: 12 padrao, 16 nos blocos grandes, 999px so em pilula, 10px em campo. */
  --radius:12px;--radius-lg:16px;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.barra{position:sticky;top:0;z-index:50;background:var(--brand-dark);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:0 2px 12px rgba(7,48,52,.2)}
.barra .logo{font-weight:900;font-size:19px}.barra .logo .y{color:var(--brand-euc)}
.barra .tag{font-size:12px;font-weight:700;color:#cfe6e2;background:rgba(255,255,255,.10);padding:5px 11px;border-radius:999px}
.barra .spacer{flex:1}.barra .cnt{font-size:12px;color:#bcd}.barra a.volta{color:#cfe6e2;text-decoration:none;font-size:13px;font-weight:600}
.save-status{font-size:13px;font-weight:800;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.14);color:#e7f2f0;white-space:nowrap;transition:background .15s}
.save-status:empty{display:none}
.save-status.saving{background:var(--amber);color:#fff}
.save-status.ok{background:var(--verde);color:#fff}
.save-status.err{background:var(--vermelho);color:#fff}
@media(max-width:560px){.barra .cnt{display:none}}
.wrap{max-width:1000px;margin:0 auto;padding:18px 20px 80px}
.topo{position:sticky;top:52px;z-index:40;background:var(--canvas);padding:12px 0 10px}
.linha-topo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.busca{flex:1;min-width:220px;font-family:var(--sans);font-size:15px;padding:12px 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.busca:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
/* ---------- botao (B.8): uma base, tres papeis ---------- */
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:10px;transition:border-color .12s,transform .1s}
.btn:hover{border-color:var(--brand-teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--pri{background:var(--brand-teal);border-color:var(--brand-teal);color:#fff}
.btn--pri:hover{background:#0C7871;border-color:#0C7871}
.btn--sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--danger{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn--danger:hover{background:#A33327;border-color:#A33327}
.btn--danger-out{background:var(--surface);color:var(--vermelho);border-color:var(--line-2)}
.btn--danger-out:hover{border-color:var(--vermelho)}
.btn--mini{padding:6px 11px;font-size:12px}
.btn--pill{border-radius:999px;padding:12px 20px}
.dica{font-size:12px;color:var(--muted);margin-top:7px}
/* filtros e ordenação — mesmo padrão de chips já usado em certificados.html */
.linha-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.grupo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grupo .rot{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font-size:13px;font-weight:700;border-radius:999px;padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--brand-teal)}
.chip:focus-visible{outline:2px solid var(--brand-teal);outline-offset:1px}
.chip.on{background:var(--brand-teal);border-color:var(--brand-teal);color:#fff}
.chip .n{background:rgba(0,0,0,.10);border-radius:999px;padding:1px 7px;margin-left:6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
.chip.alerta.on{background:var(--vermelho);border-color:var(--vermelho)}
.chip.falta.on{background:var(--amber);border-color:var(--amber)}
.chip.feito.on{background:var(--verde);border-color:var(--verde)}
.chip .seta{margin-left:5px;font-size:11px;opacity:.9}
.vazio-filtro{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);font-size:13px}
/* no celular cada faixa de chips vira uma tira que rola de lado, para o topo
   não engolir a tela */
@media(max-width:620px){
  .linha-filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:7px}
  .linha-filtros::-webkit-scrollbar{display:none}
  .grupo{flex-wrap:nowrap}
  .chip,.grupo .rot{white-space:nowrap}
}
.lista{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.proc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.proc-h{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;cursor:pointer}
.proc-h:hover{background:var(--surface-warm)}
.pid{font-size:11px;font-weight:800;color:#fff;background:var(--brand-teal);border-radius:10px;padding:3px 8px;white-space:nowrap;margin-top:1px}
.pmain{flex:1;min-width:0}
.pnome{font-size:15px;font-weight:700;line-height:1.3}
.pproc{font-size:12px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bdg{font-size:11px;font-weight:700;border-radius:10px;padding:3px 8px}
.bdg.and{background:var(--amber-soft);color:#9A5B12;border:1px solid var(--amber-line)}
.bdg.ok{background:#E7F4EC;color:#2E7D52}
.bdg.agu{background:#EEF1F0;color:#5B6B67;border:1px solid var(--line)}
.bdg.na{background:#F2ECE4;color:var(--muted)}
.bdg.dur{background:var(--brand-dark);color:#fff;border:1px solid var(--brand-dark);font-size:11px;font-weight:800}
.bdg.dur.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.bdg.dur.na{background:#F2ECE4;border:1px solid var(--line);color:var(--muted);font-weight:700}
.chev{color:var(--line-2);font-weight:900;font-size:19px;margin-top:2px}
.editor{border-top:1px solid var(--line);padding:15px;display:none;background:var(--surface-warm)}
.proc.open .editor{display:block}
.proc.open .chev{color:var(--brand-teal);transform:rotate(90deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fld input,.fld select,.fld textarea{font-family:var(--sans);font-size:15px;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.fld textarea{resize:vertical;min-height:52px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.sub{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sub::after{content:"";flex:1;height:1px;background:var(--line)}
.log{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2);max-height:190px;overflow:auto}
.log.vazio{color:var(--muted);font-style:italic}
.addobs{display:flex;gap:8px;margin-top:7px;align-items:flex-start}
.addobs textarea{flex:1;min-height:40px}
.etapa{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;margin-bottom:10px;overflow:hidden}
.etapa.aberta{border-color:var(--line-2)}
.etapa-h{width:100%;display:flex;gap:9px;align-items:center;flex-wrap:wrap;text-align:left;background:none;border:0;padding:11px 12px;font-family:var(--sans);color:var(--ink);cursor:pointer}
.etapa-h:hover{background:var(--surface-warm)}
.etapa-h:focus-visible{outline:2px solid var(--brand-teal);outline-offset:-2px}
.etapa-chev{flex:none;width:12px;color:var(--brand-euc);font-weight:900;font-size:13px}
.etapa-titulo{flex:1;min-width:130px;font-size:15px;font-weight:800;color:var(--ink);line-height:1.25}
.etapa.vazia .etapa-titulo{font-size:13px;font-weight:700;color:var(--muted)}
.etapa-datas{font-size:12px;font-weight:600;color:var(--muted)}
.etapa-body{display:none;padding:12px;border-top:1px solid var(--line)}
.etapa.aberta .etapa-body{display:block}
.etapa-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.etapa-n{flex:none;font-size:11px;font-weight:800;color:#fff;background:var(--brand-euc);border-radius:10px;padding:3px 7px;white-space:nowrap}
.barra-salvar{position:sticky;bottom:0;background:var(--surface-warm);padding-top:12px;margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;font-weight:600}
.msg.ok{color:#2E7D52}.msg.err{color:var(--vermelho)}
.autosave{font-size:13px;font-weight:600;color:var(--muted)}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:50vh;text-align:center;padding:0 24px}
.state h1{font-size:19px}.state p{color:var(--muted);font-size:15px;max-width:48ch}.state code{background:var(--surface-warm);padding:2px 6px;border-radius:10px;border:1px solid var(--line)}
.spin{width:24px;height:24px;border:2.5px solid var(--line-2);border-top-color:var(--brand-teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(7,48,52,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:18px}
.modal.on{display:flex}
.modal-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal-card h2{font-size:19px;margin-bottom:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}.wrap{padding:14px 12px 70px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Todo link abre em guia nova (<base target="_blank">) — o colaborador nunca
   perde a tela em que estava. Logo e "← Painel" são a exceção: são o gesto de
   VOLTAR, então trocam a guia atual (target="_self"). */
.barra a.logo{color:inherit;text-decoration:none;cursor:pointer}
.barra a.logo:hover{opacity:.82}


/* ---------- explicacao recolhida (C.2) ----------
   O dado vem primeiro; a instrucao fica a um clique e lembra a escolha. */
details.ajuda{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:8px 0}
details.ajuda>summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:12px;font-weight:800;color:var(--ink-2)}
details.ajuda>summary::-webkit-details-marker{display:none}
details.ajuda>summary::after{content:" \25BE";color:var(--muted)}
details.ajuda[open]>summary::after{content:" \25B4"}
details.ajuda>.txt{padding:0 12px 11px;font-size:12px;color:var(--muted);line-height:1.55}
details.ajuda>.txt b{color:var(--ink-2)}
/* ---------- o que nao gravou (C.3) ----------
   A linha (ou o campo) fica marcada e o "tentar de novo" nasce ali mesmo. */
.falhou{outline:2px solid var(--vermelho);outline-offset:-2px}
tr.falhou>td{background:#FBEAE7!important}
.btn-retry{display:block;margin-top:4px;font-family:var(--sans);font-size:11px;font-weight:800;cursor:pointer;
  border:1px solid var(--vermelho);background:var(--vermelho);color:#fff;border-radius:999px;padding:2px 9px;white-space:nowrap}
.btn-retry:disabled{opacity:.6;cursor:default}
/* ---------- padroes compartilhados (B.10 e B.12) ---------- */
/* Foco de teclado sempre visivel — quem navega por Tab precisa ver onde esta. */
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}
/* A barra nunca estoura: quebra de linha e o contador some no celular. */
.barra{flex-wrap:wrap}
@media(max-width:560px){.barra .cnt{display:none}}
</style>
</head>
<body>
<div class="barra">
  <a class="logo" id="logo-home" href="colaborador.html" target="_self" title="Voltar para o painel do colaborador">back<span class="y">4you</span></a>
  <span class="tag">Societário · equipe</span>
  <span class="spacer"></span>
  <span class="save-status" id="saveStatus"></span>
  <span class="cnt" id="cnt"></span>
  <a class="volta" id="volta" href="colaborador.html" target="_self">← Painel</a>
</div>
<div id="app"><div class="state"><div class="spin"></div><p>Carregando processos…</p></div></div>

<div class="modal" id="modal"><div class="modal-card">
  <h2>Novo processo societário</h2>
  <div class="fld"><label>ID do cliente *</label><input id="n-id" placeholder="ex.: 250001"></div>
  <div class="fld"><label>Nome / razão social</label><input id="n-nome" placeholder="opcional"></div>
  <div class="fld"><label>Código Processo</label><input id="n-cod" placeholder="ex.: B4Y - 040"></div>
  <div class="fld"><label>Processo *</label><textarea id="n-proc" placeholder="Descrição do processo (ex.: 4ª ACS …)"></textarea></div>
  <div class="fld"><label>Status Geral</label><select id="n-stg"></select></div>
  <div class="barra-salvar" style="position:static;background:none;padding:0">
    <button class="btn btn--pri" id="n-criar">Criar processo</button>
    <button class="btn btn--sec" id="n-cancelar">Cancelar</button>
    <span class="msg" id="n-msg"></span>
  </div>
</div></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbyGAro0qPWpZcVX665KwKd-BK3ouSvVkAj5Vxw_phgO82EDa3gJrURcHjWIPYNQXT5d/exec';
const CHAVE_PADRAO='b4u-equipe-2026';
const STATUS=['','Aguardando','Em andamento','Concluído','Não se aplica'];
function chaveAtual(){const q=new URLSearchParams(location.search).get('chave');const h=(location.hash||'').replace('#','').trim();return q||h||CHAVE_PADRAO;}
// Código do colaborador (?cod=) — vira a coluna "Colaborador" da aba log.
// Aqui o hash já é fallback da chave, então só lemos o parâmetro.
function codAtual(){return (new URLSearchParams(location.search).get('cod')||'').trim();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
/** Lembra no navegador se a explicação fica aberta — a escolha é de quem usa. */
function ligarDetalhes(el,chave){
  if(!el)return;
  try{if(localStorage.getItem(chave)==='1')el.open=true;}catch(e){}
  el.addEventListener('toggle',()=>{try{localStorage.setItem(chave,el.open?'1':'0');}catch(e){}});
}
function jsonp(url){return new Promise((ok,fail)=>{const cb='cb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{limpa();fail(new Error('A API não respondeu.'));},25000);function limpa(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{limpa();ok(d);};s.onerror=()=>{limpa();fail(new Error('Não consegui alcançar a API.'));};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s);});}
async function postAcao(obj){const body=JSON.stringify(Object.assign({chave:chaveAtual(),cod:codAtual()},obj));const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});const d=await r.json();if(d&&d.erro)throw new Error(d.erro);return d;}
function selectHTML(cls,val){return `<select class="${cls}">`+STATUS.map(o=>`<option value="${esc(o)}"${normTxt(o)===normTxt(val)?' selected':''}>${o||'—'}</option>`).join('')+`</select>`;}
function bdgStatus(s){const n=normTxt(s);let cl='agu';if(/conclu|finaliz|encerr/.test(n))cl='ok';else if(/andamento/.test(n))cl='and';else if(/nao se aplica|não se aplica/.test(n))cl='na';return `<span class="bdg ${cl}">${esc(s||'—')}</span>`;}

/* ===== duração do processo =====
   A planilha é mista: a data pode vir como yyyy-MM-dd (célula Data) ou como texto
   livre ("03/2026", "março/2026", "mar/26", "2026"). Quando só temos mês/ano (ou só o
   ano), estimamos o dia 1 e marcamos o resultado com "~". */
const MESES_ABREV={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const RE_CONCLUIDO=/conclu|finaliz|encerrad/;
function pad2(n){return String(n).padStart(2,'0');}
function ano4(a){return a<100?2000+a:a;}
function fmtData(d){return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();}
function parseDataFlex(v){
  const bruto=String(v==null?'':v).trim();
  const t=normTxt(bruto);
  if(!t)return null;
  let m;
  // yyyy-MM-dd (com ou sem hora)
  m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return {d:new Date(+m[1],+m[2]-1,+m[3]),est:false,rot:pad2(+m[3])+'/'+pad2(+m[2])+'/'+m[1],orig:bruto};
  // dd/mm/aaaa
  m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){const a=ano4(+m[3]);return {d:new Date(a,+m[2]-1,+m[1]),est:false,rot:pad2(+m[1])+'/'+pad2(+m[2])+'/'+a,orig:bruto};}
  // mm/aaaa
  m=t.match(/^(\d{1,2})[\/.-](\d{4})$/);
  if(m&&+m[1]>=1&&+m[1]<=12)return {d:new Date(+m[2],+m[1]-1,1),est:true,rot:pad2(+m[1])+'/'+m[2],orig:bruto};
  // mm/aa
  m=t.match(/^(\d{1,2})[\/.-](\d{2})$/);
  if(m&&+m[1]>=1&&+m[1]<=12){const a=ano4(+m[2]);return {d:new Date(a,+m[1]-1,1),est:true,rot:pad2(+m[1])+'/'+a,orig:bruto};}
  // nome do mês + ano: "março/2026", "mar 26", "março de 2026"
  const tn=t.replace(/\s+de\s+/g,'/').replace(/[\s.\-]+/g,'/');
  m=tn.match(/^([a-z]{3,9})\/?(\d{2,4})$/);
  if(m){const mm=MESES_ABREV[m[1].slice(0,3)];if(mm){const a=ano4(+m[2]);return {d:new Date(a,mm-1,1),est:true,rot:pad2(mm)+'/'+a,orig:bruto};}}
  // só o ano
  m=t.match(/^(\d{4})$/);
  if(m)return {d:new Date(+m[1],0,1),est:true,rot:'01/'+m[1],orig:bruto};
  return null;
}
function fmtDuracao(dias){
  const d=Math.max(0,Math.round(dias));
  if(d===0)return 'hoje';
  if(d<30)return d===1?'1 dia':d+' dias';
  const anos=Math.floor(d/365),resto=d-anos*365,meses=Math.floor(resto/30),rd=resto-meses*30;
  const partes=[];
  if(anos)partes.push(anos===1?'1 ano':anos+' anos');
  if(meses)partes.push(meses===1?'1 mês':meses+' meses');
  if(!anos&&rd)partes.push(rd===1?'1 dia':rd+' dias');
  if(!partes.length)partes.push(anos===1?'1 ano':anos+' anos');
  return partes.join(' e ');
}
function etapasOrdenadas(p){return (p.etapas||[]).filter(Boolean).slice().sort((a,b)=>(+a.n||0)-(+b.n||0));}
function primeiroInicio(p){for(const e of etapasOrdenadas(p)){const r=parseDataFlex(e.data_inicio);if(r)return r;}return null;}
function ultimoFim(p){const arr=etapasOrdenadas(p).reverse();for(const e of arr){const r=parseDataFlex(e.data_fim);if(r)return r;}return null;}
function procConcluido(p){
  if(RE_CONCLUIDO.test(normTxt(p.status_geral)))return true;
  const nomeadas=(p.etapas||[]).filter(e=>e&&String(e.nome||'').trim());
  return nomeadas.length>0&&nomeadas.every(e=>RE_CONCLUIDO.test(normTxt(e.status)));
}
function calcDuracao(p){
  const ini=primeiroInicio(p);
  if(!ini)return null;                       // sem data de início não dá para medir
  const concluido=procConcluido(p);
  const fimR=concluido?ultimoFim(p):null;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const fim=fimR?fimR.d:hoje;
  return {ini,fimR,fim,hoje,concluido,dias:Math.max(0,Math.round((fim-ini.d)/86400000)),estimado:!!(ini.est||(fimR&&fimR.est))};
}
function duracaoHTML(p){
  const c=calcDuracao(p);
  if(!c)return `<span class="bdg dur na" title="Nenhuma etapa tem data de início preenchida.">⏱ sem data de início</span>`;
  const dicas=[];
  if(c.ini.est)dicas.push('início estimado no dia 1 de '+c.ini.rot+' (planilha: '+c.ini.orig+')');
  if(c.fimR&&c.fimR.est)dicas.push('fim estimado no dia 1 de '+c.fimR.rot+' (planilha: '+c.fimR.orig+')');
  dicas.push('De '+fmtData(c.ini.d)+' até '+(c.fimR?fmtData(c.fim):'hoje, '+fmtData(c.hoje)));
  const rotulo=(c.estimado?'~':'')+fmtDuracao(c.dias)+(c.concluido?' (concluído)':' (em andamento)');
  return `<span class="bdg dur ${c.concluido?'ok':''}" title="${esc(dicas.join(' · '))}">⏱ ${esc(rotulo)}</span>`;
}
/* última movimentação = maior data (início ou fim) entre todas as etapas */
function ultimaMov(p){
  let melhor=null;
  for(const e of etapasOrdenadas(p)){
    for(const v of [e.data_inicio,e.data_fim]){
      const r=parseDataFlex(v);
      if(r&&(!melhor||r.d>melhor.d))melhor=r;
    }
  }
  return melhor;
}
function diasDesde(d){const h=new Date();h.setHours(0,0,0,0);return Math.floor((h-d)/86400000);}
function metaHTML(p){
  const nEt=(p.etapas||[]).filter(e=>e&&e.nome).length;
  const nOk=(p.etapas||[]).filter(e=>e&&e.nome&&RE_CONCLUIDO.test(normTxt(e.status))).length;
  return duracaoHTML(p)+bdgStatus(p.status_geral)+`<span class="bdg agu">${nOk}/${nEt} etapas ok</span>`+(p.codigo_processo?`<span class="bdg na">${esc(p.codigo_processo)}</span>`:'');
}

let PROCS=[];
function carregar(){
  return jsonp(API_URL+'?tipo=societario_equipe&chave='+encodeURIComponent(chaveAtual()))
    .then(d=>{if(d.erro)throw new Error(d.erro);PROCS=(d.processos||[]).map(p=>{p._visN=p.etapas.reduce((m,e)=>e.nome?e.n:m,0);return p;});render();})
    .catch(e=>{document.getElementById('app').innerHTML=`<div class="state"><h1>Não consegui carregar</h1><p>${esc(e.message||e)}</p><p>Confira a <code>chave</code> no endereço e se o Web App foi republicado com os arquivos <code>EquipeSocietario.gs</code> e as rotas novas.</p></div>`;});
}
/* ===== filtros, ordenação e busca =====
   Os três combinam: o chip de situação e a ordenação sempre trabalham em cima do
   que a busca deixou passar. Nada disso mexe no salvamento: redesenhar a lista
   fecha o editor aberto, exatamente como a busca já fazia antes — e o autosave
   captura os campos no evento "change" (que dispara no blur, antes do clique),
   então nada digitado se perde. */
const PARADO_DIAS=30;
let BUSCA='';
let FILTRO='todos';
let SORT={k:'dur',dir:'desc'};   // padrão: mais tempo em aberto no topo
const ORDENS=[
  {k:'dur',rot:'Tempo',dica:'Duração do processo — o mesmo número do badge ⏱. Sem data de início vai para o fim da lista.'},
  {k:'mov',rot:'Última movimentação',dica:'Data mais recente entre as etapas (início ou fim).'},
  {k:'id',rot:'ID',dica:'ID do cliente.'},
  {k:'nome',rot:'Cliente',dica:'Nome / razão social.'},
  {k:'status',rot:'Status geral',dica:'Em andamento primeiro, concluídos por último.'}
];
const DIR_ROT={dur:['menor duração','maior duração'],mov:['movimentação mais antiga','movimentação mais recente'],id:['ID crescente','ID decrescente'],nome:['A → Z','Z → A'],status:['em andamento primeiro','concluídos por último']};
function dirPadrao(k){return (k==='dur'||k==='mov')?'desc':'asc';}
function rotuloDir(){const par=DIR_ROT[SORT.k]||['crescente','decrescente'];return (SORT.dir==='asc'?'▲ ':'▼ ')+par[SORT.dir==='asc'?0:1];}
/* chave única do status: sem acento, sem caixa e sem espaço sobrando —
   assim "Concluído" e "concluido " viram o mesmo chip. */
function chaveStatus(s){return normTxt(s).replace(/\s+/g,' ');}
function pesoStatus(k){
  if(!k)return 5;                              // sem status vai depois de tudo
  if(/andamento/.test(k))return 0;
  if(/aguard|pendente|analis|protocol|exig/.test(k))return 1;
  if(RE_CONCLUIDO.test(k))return 4;
  if(/nao se aplica|cancel|desist|arquiv/.test(k))return 3;
  return 2;
}
/* calculado uma vez por desenho e reaproveitado em filtro, contagem e ordem */
function resumoProc(p){
  const c=calcDuracao(p),mov=ultimaMov(p);
  return {
    conc:procConcluido(p),
    dias:c?c.dias:null,
    mov:mov?mov.d.getTime():null,
    paradoDias:mov?diasDesde(mov.d):null,
    semResp:!String((p.extras&&p.extras.responsavel)||'').trim(),
    stk:chaveStatus(p.status_geral)
  };
}
/* lista de status montada a partir dos dados, na ordem que a equipe usa */
function statusDisponiveis(){
  const mapa=new Map();
  PROCS.forEach(p=>{
    const bruto=String(p.status_geral==null?'':p.status_geral).replace(/\s+/g,' ').trim();
    const k=chaveStatus(bruto);
    if(!k)return;                              // vazio tem o chip "Sem status"
    const it=mapa.get(k)||{k,rot:bruto,vars:new Map()};
    it.vars.set(bruto,(it.vars.get(bruto)||0)+1);
    mapa.set(k,it);
  });
  // o chip mostra a grafia mais usada na planilha (empate: a que tem maiúscula/acento)
  const nota=v=>(v!==v.toLowerCase()?1:0)+(/[áâãàéêíóôõúüç]/i.test(v)?1:0);
  return [...mapa.values()].map(it=>{
    let melhor=it.rot,mc=-1;
    it.vars.forEach((c,v)=>{if(c>mc||(c===mc&&nota(v)>nota(melhor))){melhor=v;mc=c;}});
    return {k:it.k,rot:melhor};
  }).sort((a,b)=>pesoStatus(a.k)-pesoStatus(b.k)||a.rot.localeCompare(b.rot,'pt'));
}
function passaBusca(p,alvo){
  return !alvo||normTxt(p.id+' '+p.nome+' '+p.codigo_processo+' '+p.processo+' '+p.status_geral).includes(alvo);
}
function passaFiltro(p,r,f){
  switch(f){
    case 'todos':return true;
    case 'aberto':return !r.conc;
    case 'concluido':return r.conc;
    // parado = ainda em aberto e sem nenhuma data de etapa nos últimos 30 dias.
    // Quem não tem data nenhuma cai em "Sem datas", não aqui.
    case 'parado':return !r.conc&&r.paradoDias!=null&&r.paradoDias>PARADO_DIAS;
    case 'semdata':return r.mov==null;
    case 'semresp':return r.semResp;
    case 'semstatus':return !r.stk;
    default:return f.slice(0,3)==='st:'?r.stk===f.slice(3):true;
  }
}
function valorOrd(p,r,k){
  if(k==='dur')return r.dias;
  if(k==='mov')return r.mov;
  if(k==='id')return String(p.id==null?'':p.id).trim()||null;
  if(k==='nome')return String(p.nome||'').trim()||null;
  if(k==='status')return r.stk?pesoStatus(r.stk)+'|'+r.stk:null;
  return null;
}
function ordenar(itens){
  const dir=SORT.dir==='asc'?1:-1;
  return itens.map((it,i)=>({it,i,v:valorOrd(it.p,it.r,SORT.k)}))
    .sort((a,b)=>{
      const na=a.v==null,nb=b.v==null;
      if(na!==nb)return na?1:-1;                // sem informação sempre no fim
      if(!na){
        const c=(typeof a.v==='number'&&typeof b.v==='number')
          ?a.v-b.v
          :String(a.v).localeCompare(String(b.v),'pt',{numeric:true,sensitivity:'base'});
        if(c)return c*dir;
      }
      return String(a.it.p.id).localeCompare(String(b.it.p.id),'pt',{numeric:true})||a.i-b.i;
    })
    .map(x=>x.it);
}
function baseBusca(){
  const alvo=normTxt(BUSCA);
  return PROCS.filter(p=>passaBusca(p,alvo)).map(p=>({p,r:resumoProc(p)}));
}
/* ---------- busca, filtro e ordenação no endereço (C.10) ----------
   F5 volta para a mesma visão; chave, cod e #hash ficam intactos. */
function sincronizarURL(){
  try{
    const u=new URL(location.href);
    const set=(k,v)=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k);};
    set('q',BUSCA);
    set('f',FILTRO==='todos'?'':FILTRO);
    set('ord',SORT.k==='dur'?'':SORT.k);
    set('dir',SORT.dir===dirPadrao(SORT.k)?'':SORT.dir);
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function lerURL(){
  const p=new URLSearchParams(location.search);
  BUSCA=p.get('q')||'';
  FILTRO=p.get('f')||'todos';
  SORT.k=p.get('ord')||'dur';
  SORT.dir=p.get('dir')||dirPadrao(SORT.k);
}
function chipHTML(k,rot,n,dica,extra){
  return `<button type="button" class="${['chip',extra||'',FILTRO===k?'on':''].filter(Boolean).join(' ')}" data-f="${esc(k)}" title="${esc(dica||'')}">${esc(rot)}<span class="n">${n}</span></button>`;
}
function desenharChips(base){
  const conta=f=>base.filter(x=>passaFiltro(x.p,x.r,f)).length;
  const semStatus=conta('semstatus');
  let sit=`<span class="rot">Status geral</span>`+chipHTML('todos','Todos',base.length,'Todos os processos (respeitando a busca).');
  statusDisponiveis().forEach(s=>{sit+=chipHTML('st:'+s.k,s.rot,conta('st:'+s.k),'Status Geral: '+s.rot);});
  if(semStatus)sit+=chipHTML('semstatus','Sem status',semStatus,'Processos com o Status Geral em branco.','falta');
  document.getElementById('chipsStatus').innerHTML=sit;
  document.getElementById('chipsAtalho').innerHTML=
    `<span class="rot">Atalhos</span>`+
    chipHTML('aberto','Em aberto',conta('aberto'),'Tudo que ainda não está concluído.')+
    chipHTML('concluido','Concluídos',conta('concluido'),'Processos concluídos.','feito')+
    chipHTML('parado','Parados há +'+PARADO_DIAS+' dias',conta('parado'),'Em aberto e sem nenhuma data de etapa mexida nos últimos '+PARADO_DIAS+' dias.','alerta')+
    chipHTML('semdata','Sem datas',conta('semdata'),'Nenhuma etapa com data de início ou de finalização.','falta')+
    chipHTML('semresp','Sem responsável',conta('semresp'),'Campo Responsável (Extra 34) em branco.','falta');
  document.getElementById('chipsOrd').innerHTML=
    `<span class="rot">Ordenar por</span>`+
    ORDENS.map(o=>{
      const on=SORT.k===o.k;
      return `<button type="button" class="chip${on?' on':''}" data-ord="${o.k}" title="${esc(o.dica+' Clique de novo para inverter.')}">${esc(o.rot)}${on?`<span class="seta">${SORT.dir==='asc'?'▲':'▼'}</span>`:''}</button>`;
    }).join('')+
    `<span class="rot" style="margin-left:2px">${esc(rotuloDir())}</span>`;
}
// contagens dos chips depois de um salvamento, sem tocar na lista (o editor aberto continua aberto)
function atualizarChips(){if(document.getElementById('chipsStatus'))desenharChips(baseBusca());}
function chipFocado(){
  const el=document.activeElement;
  if(!el||!el.classList||!el.classList.contains('chip'))return '';
  return el.dataset.f?'f:'+el.dataset.f:(el.dataset.ord?'o:'+el.dataset.ord:'');
}
function restaurarFoco(chave){
  if(!chave)return;
  const v=chave.slice(2),attr=chave[0]==='f'?'data-f':'data-ord';
  const el=document.querySelector('.chip['+attr+'="'+(window.CSS&&CSS.escape?CSS.escape(v):v)+'"]');
  if(el)el.focus();
}
function vazioHTML(){
  const filtrando=FILTRO!=='todos'||!!BUSCA.trim();
  return `<div class="vazio-filtro"><div>${filtrando?'Nenhum processo com esse filtro.':'Nenhum processo na planilha ainda.'}</div>`+
    (filtrando?`<button type="button" class="btn btn--mini" id="limparF">Limpar filtro e busca</button>`:'')+
    `</div>`;
}
function render(){
  lerURL();                                   // a visão vem do endereço (C.10)
  const app=document.getElementById('app');
  app.innerHTML=`<div class="wrap">
    <div class="topo">
      <div class="linha-topo">
        <input class="busca" id="busca" type="search" value="${esc(BUSCA)}" placeholder="Buscar por ID, nome, código, processo ou status…  ( / para focar)">
        <button class="btn btn--pri btn--pill" id="novo">+ Novo processo</button>
      </div>
      <div class="linha-filtros"><div class="grupo" id="chipsStatus"></div></div>
      <div class="linha-filtros"><div class="grupo" id="chipsAtalho"></div></div>
      <div class="linha-filtros"><div class="grupo" id="chipsOrd"></div></div>
      <details class="ajuda" id="ajuda">
        <summary>ⓘ Como funciona esta tela</summary>
        <div class="txt">Filtro, busca e ordenação funcionam juntos. Clique num processo para editar. Dentro dele, clique no nome da etapa para abrir os detalhes. Tudo salva automaticamente ao mudar de campo; as observações datadas entram pelo botão "Adicionar". Atalhos: <b>/</b> foca a busca e <b>Esc</b> limpa.</div>
      </details>
    </div>
    <div class="lista" id="lista"></div></div>`;
  desenhar();
  ligarDetalhes(document.getElementById('ajuda'),'b4u.societario.ajuda');
  document.getElementById('busca').addEventListener('input',e=>{BUSCA=e.target.value;desenhar();});
  document.getElementById('novo').addEventListener('click',abrirNovo);
}
function desenhar(){
  const foco=chipFocado();
  const base=baseBusca();
  const arr=ordenar(base.filter(x=>passaFiltro(x.p,x.r,FILTRO)));
  desenharChips(base);
  const lista=document.getElementById('lista');
  if(lista)lista.innerHTML=arr.map(x=>cardHTML(x.p)).join('')||vazioHTML();
  const cnt=document.getElementById('cnt');
  if(cnt)cnt.textContent=arr.length+' de '+PROCS.length+' processos';
  FALHAS.forEach((v,k)=>marcarFalha(k,true));   // redesenhar não pode apagar o que não gravou
  restaurarFoco(foco);
  sincronizarURL();
}
function cardHTML(p){
  return `<div class="proc" data-row="${p.row}">
    <div class="proc-h" data-toggle="${p.row}">
      <span class="pid">${esc(p.id)}</span>
      <div class="pmain">
        <div class="pnome">${esc(p.nome||'(sem nome)')}</div>
        <div class="pproc">${esc(p.processo||'')}</div>
        <div class="pmeta">${metaHTML(p)}</div>
      </div>
      <span class="chev">›</span>
    </div>
    <div class="editor" id="ed-${p.row}"></div>
  </div>`;
}
function rotuloData(v){
  const bruto=String(v==null?'':v).trim();
  if(!bruto)return '';
  const r=parseDataFlex(bruto);
  return r?r.rot:bruto;   // não deu para ler? mostra como está na planilha
}
function resumoDatasEtapa(ini,fim){
  const bits=[];
  const a=rotuloData(ini),b=rotuloData(fim);
  if(a)bits.push('início '+a);
  if(b)bits.push('fim '+b);
  return bits.join(' · ');
}
function etapaHTML(p,e){

    <button type="button" class="etapa-h" data-etapa-toggle="${e.n}" aria-expanded="${vazia?'true':'false'}">
      <span class="etapa-chev" aria-hidden="true">${vazia?'▾':'▸'}</span>
      <span class="etapa-n">Etapa ${e.n}</span>

      ${bdgStatus(e.status)}
      <span class="etapa-datas">${esc(resumoDatasEtapa(e.data_inicio,e.data_fim))}</span>
    </button>
    <div class="etapa-body">
    <div class="etapa-top">
      <input class="e-nome" style="flex:1;font-weight:700;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px" value="${esc(e.nome)}" placeholder="Nome da etapa"></div>
    <div class="grid2">
      <div class="fld"><label>Status</label>${selectHTML('e-status',e.status)}</div>
      <div class="fld"><label>Data início</label><input class="e-ini" value="${esc(e.data_inicio)}" placeholder="dd/mm/aaaa ou set/2025"></div>
      <div class="fld"><label>Data finalização</label><input class="e-fim" value="${esc(e.data_fim)}" placeholder="dd/mm/aaaa"></div>
    </div>
    <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Observações internas da etapa</label>
    <div class="log ${log?'':'vazio'}" data-etlog="${e.n}">${log?esc(log):'Sem observações.'}</div>
    <div class="addobs"><textarea data-etobs="${e.n}" placeholder="Nova observação (entra com a data de hoje)"></textarea>
      <button class="btn btn--mini btn--pri" data-addet="${e.n}">Adicionar</button></div>
    </div>
  </div>`;
}
// abre/fecha a etapa. O corpo só some por CSS: os inputs continuam no DOM, então
// coletar()/salvar continuam funcionando igual.
function alternarEtapa(btn){
  const bloco=btn.closest('.etapa');if(!bloco)return;
  const aberta=bloco.classList.toggle('aberta');
  btn.setAttribute('aria-expanded',aberta?'true':'false');
  const ch=btn.querySelector('.etapa-chev');if(ch)ch.textContent=aberta?'▾':'▸';
  if(aberta){const inp=bloco.querySelector('.e-nome');if(inp&&!inp.value.trim())inp.focus();}
}
// mantém o cabeçalho da etapa em dia enquanto o usuário digita
function sincronizarEtapa(campo){
  const bloco=campo.closest('.etapa');if(!bloco)return;
  const v=cls=>{const el=bloco.querySelector(cls);return el?el.value:'';};
  const nome=v('.e-nome').trim();
  const tit=bloco.querySelector('.etapa-titulo');if(tit)tit.textContent=nome||'Etapa sem nome';
  bloco.classList.toggle('vazia',!nome);
  const bdg=bloco.querySelector('.etapa-h .bdg');if(bdg)bdg.outerHTML=bdgStatus(v('.e-status'));
  const dt=bloco.querySelector('.etapa-datas');if(dt)dt.textContent=resumoDatasEtapa(v('.e-ini'),v('.e-fim'));
}

      <button class="btn btn--mini btn--pri" data-addgeral>Adicionar</button></div>

    <div data-etapas>${etv.map(e=>etapaHTML(p,e)).join('')}</div>

    <div class="sub">Campos internos</div>
    <div class="grid2">
      <div class="fld"><label>Responsável (Extra 34)</label><input class="f-e34" value="${esc(p.extras.responsavel)}"></div>
      <div class="fld"><label>UF / cidade (Extra 35)</label><input class="f-e35" value="${esc(p.extras.uf)}"></div>
      <div class="fld"><label>Órgão (Extra 36)</label><input class="f-e36" value="${esc(p.extras.orgao)}"></div>

      <div class="fld"><label>Dias p/ finalização</label><input class="f-dias" value="${esc(p.extras.dias)}"></div>
    </div>

    <div class="barra-salvar">
      <span class="autosave">✓ Salva automaticamente — o status aparece no topo da página</span>
    </div>`;
}
function abrirEditor(row){
  const proc=document.querySelector(`.proc[data-row="${row}"]`);
  const ed=document.getElementById('ed-'+row);
  const p=PROCS.find(x=>x.row==row);
  if(proc.classList.contains('open')){proc.classList.remove('open');ed.innerHTML='';return;}
  document.querySelectorAll('.proc.open').forEach(el=>{el.classList.remove('open');el.querySelector('.editor').innerHTML='';});
  ed.innerHTML=editorHTML(p);proc.classList.add('open');
  proc.scrollIntoView({block:'nearest'});
}
function reabrir(row){const ed=document.getElementById('ed-'+row);const p=PROCS.find(x=>x.row==row);if(ed)ed.innerHTML=editorHTML(p);}

function coletar(row){
  const ed=document.getElementById('ed-'+row);
  const etapas=[...ed.querySelectorAll('.etapa')].map(el=>({n:+el.dataset.n,nome:el.querySelector('.e-nome').value.trim(),status:el.querySelector('.e-status').value,data_inicio:el.querySelector('.e-ini').value.trim(),data_fim:el.querySelector('.e-fim').value.trim()}));
  return {nome:ed.querySelector('.f-nome').value.trim(),codigo_processo:ed.querySelector('.f-cod').value.trim(),processo:ed.querySelector('.f-proc').value.trim(),status_geral:ed.querySelector('.f-stg').value,extras:{responsavel:ed.querySelector('.f-e34').value.trim(),uf:ed.querySelector('.f-e35').value.trim(),orgao:ed.querySelector('.f-e36').value.trim(),protocolo:ed.querySelector('.f-e37').value.trim(),dias:ed.querySelector('.f-dias').value.trim()},etapas};
}
let saveTimers={};
/* ---------- pendências e falhas de gravação (C.3) ----------
   PENDENTES = alteração ainda no debounce. FALHAS = o servidor recusou e o dado
   só existe na tela. Nos dois casos fechar a aba pede confirmação, e a falha
   deixa o processo marcado com um "tentar de novo". */
const PENDENTES=new Set();
const FALHAS=new Map();   // row -> dados que não foram gravados
function temPendencia(){return PENDENTES.size>0||FALHAS.size>0;}
function marcarFalha(row,falhou){
  const cx=document.querySelector('.proc[data-row="'+row+'"]');
  if(!cx)return;
  cx.classList.toggle('falhou',!!falhou);
  const cab=cx.querySelector('.pmeta');if(!cab)return;
  const antigo=cab.querySelector('.btn-retry');
  if(falhou&&!antigo)cab.insertAdjacentHTML('beforeend',
    '<button type="button" class="btn-retry" data-retry="'+esc(String(row))+'">não salvou — tentar de novo</button>');
  if(!falhou&&antigo)antigo.remove();
}
/* Sair com alteração pendente (ou com uma gravação que falhou) pede confirmação. */
window.addEventListener('beforeunload',e=>{if(temPendencia()){e.preventDefault();e.returnValue='';}});
function horaAgora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function setMsg(row,cls,txt){
  const el=document.getElementById('saveStatus');   // status VISÍVEL no topo (barra fixa)
  if(el){el.className='save-status '+(/ok/.test(cls)?'ok':/err/.test(cls)?'err':'saving');el.textContent=txt;}
}
function agendarSalvar(row){
  const dados=coletar(row);                       // captura AGORA (mesmo que feche o editor depois)
  setMsg(row,'autosave','Alterado…');
  PENDENTES.add(String(row));
  clearTimeout(saveTimers[row]);
  saveTimers[row]=setTimeout(()=>salvarAuto(row,dados),450);
}
async function salvarAuto(row,dados){
  const p=PROCS.find(x=>x.row==row);if(!p)return;
  setMsg(row,'autosave','Salvando…');
  PENDENTES.add(String(row));
  try{
    await postAcao(Object.assign({acao:'soc_salvar',row:p.row,id:p.id},dados));
    Object.assign(p,{nome:dados.nome,codigo_processo:dados.codigo_processo,processo:dados.processo,status_geral:dados.status_geral,extras:dados.extras});
    dados.etapas.forEach(e=>{const alvo=p.etapas[e.n-1];if(alvo){alvo.nome=e.nome;alvo.status=e.status;alvo.data_inicio=e.data_inicio;alvo.data_fim=e.data_fim;}});
    setMsg(row,'msg ok','Salvo ✓ '+horaAgora());
    const h=document.querySelector(`.proc[data-row="${row}"] .pmeta`);
    if(h)h.innerHTML=metaHTML(p);
    const nome=document.querySelector(`.proc[data-row="${row}"] .pnome`);if(nome)nome.textContent=p.nome||'(sem nome)';
    PENDENTES.delete(String(row));FALHAS.delete(String(row));marcarFalha(row,false);
    try{atualizarChips();}catch(_){}   // contagem dos chips em dia; a lista fica como está
  }catch(e){
    PENDENTES.delete(String(row));
    FALHAS.set(String(row),dados);
    marcarFalha(row,true);
    setMsg(row,'msg err','Não salvou: '+(e.message||e));
  }
}
async function addObs(row,btn,tipo,n){
  const p=PROCS.find(x=>x.row==row);const ed=document.getElementById('ed-'+row);
  const ta=tipo==='geral'?ed.querySelector('[data-gobs]'):ed.querySelector(`[data-etobs="${n}"]`);
  const texto=ta.value.trim();if(!texto){ta.focus();return;}
  btn.disabled=true;const txtOrig=btn.textContent;btn.textContent='…';
  try{
    const acao=tipo==='geral'?'soc_obs_geral':'soc_obs_etapa';
    const d=await postAcao(Object.assign({acao,row:p.row,id:p.id,texto},tipo==='etapa'?{n}:{}));
    if(tipo==='geral'){p.observacoes_internas=d.valor;const log=ed.querySelector('[data-glog]');log.textContent=d.valor;log.classList.remove('vazio');}
    else{p.etapas[n-1].obs_interna=d.valor;const log=ed.querySelector(`[data-etlog="${n}"]`);log.textContent=d.valor;log.classList.remove('vazio');}
    ta.value='';ta.scrollIntoView({block:'nearest'});
  }catch(e){setMsg(p.row,'msg err','Não consegui salvar a observação: '+(e.message||e));}
  btn.disabled=false;btn.textContent=txtOrig;
}
function addEtapa(row){const p=PROCS.find(x=>x.row==row);if(p._visN>=10)return;p._visN++;reabrir(row);}

// modal novo processo
function abrirNovo(){document.getElementById('n-stg').innerHTML=STATUS.filter(Boolean).map(o=>`<option${o==='Em andamento'?' selected':''}>${o}</option>`).join('');['n-id','n-nome','n-cod','n-proc'].forEach(i=>document.getElementById(i).value='');document.getElementById('n-msg').textContent='';document.getElementById('modal').classList.add('on');}
function fecharNovo(){document.getElementById('modal').classList.remove('on');}
async function criarNovo(btn){
  const id=document.getElementById('n-id').value.trim(),proc=document.getElementById('n-proc').value.trim();
  const msg=document.getElementById('n-msg');
  if(!id||!proc){msg.className='msg err';msg.textContent='Informe ID e Processo.';return;}
  btn.disabled=true;msg.className='msg';msg.textContent='Criando…';
  try{
    const d=await postAcao({acao:'soc_novo',id,nome:document.getElementById('n-nome').value.trim(),codigo_processo:document.getElementById('n-cod').value.trim(),processo:proc,status_geral:document.getElementById('n-stg').value});
    fecharNovo();FILTRO='todos';BUSCA='';SORT={k:'dur',dir:dirPadrao('dur')};
    sincronizarURL();                                        // limpa o endereço ANTES de recarregar
    await carregar();   // o processo novo não pode nascer escondido por um filtro
    const el=document.querySelector(`.proc[data-row="${d.row}"]`);if(el){el.scrollIntoView({block:'center'});abrirEditor(d.row);}
  }catch(e){msg.className='msg err';msg.textContent=e.message||e;}
  btn.disabled=false;
}

// eventos (delegação)
document.addEventListener('click',e=>{
  const rt=e.target.closest('[data-retry]');
  if(rt){
    e.stopPropagation();
    const k=rt.dataset.retry,d=FALHAS.get(k);
    if(d){rt.textContent='enviando…';rt.disabled=true;salvarAuto(k,d);}
    return;
  }
  const cf=e.target.closest('.chip[data-f]');
  if(cf){FILTRO=cf.dataset.f;desenhar();return;}
  const co=e.target.closest('.chip[data-ord]');
  if(co){const k=co.dataset.ord;if(SORT.k===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.k=k;SORT.dir=dirPadrao(k);}desenhar();return;}
  if(e.target.closest('#limparF')){FILTRO='todos';BUSCA='';const b=document.getElementById('busca');if(b)b.value='';desenhar();return;}
  const et=e.target.closest('[data-etapa-toggle]');if(et){alternarEtapa(et);return;}
  const tg=e.target.closest('[data-toggle]');if(tg){abrirEditor(tg.dataset.toggle);return;}
  const ag=e.target.closest('[data-addgeral]');if(ag){addObs(ag.closest('.proc').dataset.row,ag,'geral');return;}
  const ae=e.target.closest('[data-addet]');if(ae){addObs(ae.closest('.proc').dataset.row,ae,'etapa',+ae.dataset.addet);return;}
  const at=e.target.closest('[data-addetapa]');if(at){addEtapa(at.closest('.proc').dataset.row);return;}
  if(e.target.id==='n-criar')criarNovo(e.target);
  if(e.target.id==='n-cancelar')fecharNovo();
  if(e.target.id==='modal')fecharNovo();
});
// SALVAMENTO AUTOMÁTICO: qualquer alteração num campo do editor salva sozinha.
document.addEventListener('change',e=>{
  const ed=e.target.closest('.editor');if(!ed)return;
  const f=e.target;if(!f.matches||!f.matches('input,select,textarea'))return;
  if(f.matches('[data-gobs],[data-etobs]'))return;   // as observações têm botão próprio (log com data)
  if(f.closest('.etapa'))sincronizarEtapa(f);
  const proc=e.target.closest('.proc');if(proc)agendarSalvar(proc.dataset.row);
});
// enquanto digita, o cabeçalho recolhido da etapa acompanha nome/datas
document.addEventListener('input',e=>{
  const f=e.target;
  if(f&&f.matches&&f.matches('.etapa .e-nome,.etapa .e-ini,.etapa .e-fim'))sincronizarEtapa(f);
});

/* Atalhos de busca (C.4): "/" foca, Esc limpa. Com o modal aberto, Esc fecha o
   modal — e o atalho não atrapalha quem já está digitando noutro campo. */
document.addEventListener('keydown',e=>{
  const modal=document.getElementById('modal');
  if(e.key==='Escape'&&modal&&modal.classList.contains('on')){fecharNovo();return;}
  const b=document.getElementById('busca');if(!b)return;
  const a=document.activeElement,tag=a&&a.tagName;
  const digitando=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(a&&a.isContentEditable);
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!digitando){e.preventDefault();b.focus();b.select();return;}
  if(e.key==='Escape'&&(a===b||!digitando)&&b.value){e.preventDefault();b.value='';BUSCA='';desenhar();}
});

document.getElementById('volta').href='colaborador.html?chave='+encodeURIComponent(chaveAtual());
carregar();
</script>
<script>
/* Logo = home do colaborador, levando a chave (e o código de quem está usando).
   Roda depois dos scripts da página, quando o "← Painel" já foi montado. */
(function(){
  var lg = document.getElementById('logo-home');
  if (lg) {
    var aplica = function () {
      var vt = document.getElementById('volta');
      var href = (vt && vt.getAttribute('href')) || '';
      if (!href || href === 'colaborador.html') {
        try { href = 'colaborador.html?chave=' + encodeURIComponent(chaveAtual()); }
        catch (e) { href = 'colaborador.html'; }
        try {
          var c = (typeof respAtual === 'function') ? respAtual()
                : (typeof codAtual === 'function') ? codAtual() : '';
          if (c) href += '&cod=' + encodeURIComponent(c);
        } catch (e) {}
      }
      lg.setAttribute('href', href);
    };
    aplica();
    setTimeout(aplica, 0);
  }
  /* Com <base target="_blank">, um href="#" abriria uma guia em branco.
     (é o caso do "Planilha ↗" antes da API responder) */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  }, true);
})();
</script>
