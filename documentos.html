<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Documentos e acessos — back4you</title>
<!--
  ESTA PÁGINA VIROU UM RECORTE. O conteúdo é o mesmo; o programa por baixo é o
  b4u-recorte.html, que serve qualquer recorte da aba Registro a partir de um
  descritor no 11_Recorte.gs. Aqui só sobrou o endereço.

  POR QUE O ENDEREÇO CONTINUA EXISTINDO
  "documentos" é o link do menu lateral, do cartão do painel do colaborador, do
  rodapé de dossiê antigo, e está em favorito e em conversa de WhatsApp. É
  também para onde `licencas.html` e `certificados.html` já apontam desde
  09/2026. Apagar o arquivo transformaria cada um desses em um 404 — e um 404
  não explica nada: quem clicasse concluiria que o painel caiu.

  Mantê-lo também é o que evita mexer no `link:` de cada página. O menu do
  b4u-shell.js monta o href como `pag + '?chave=' + …`, e `pag` não comporta uma
  segunda variável (`?r=documentos`). Trocar isso obrigaria a mudar a função
  `link` das 24 páginas para ganhar um salto instantâneo. O salto é mais barato.

  A CHAVE E O CÓDIGO VÃO JUNTO, e o `r=documentos` entra ANTES deles: sem
  repassar a query string, o redirecionamento levaria a pessoa para uma tela de
  "acesso restrito" — o que, do lado de quem usa, é indistinguível de estar
  quebrado. Todo parâmetro segue, inclusive o ?abrir=ID que o dossiê usa para
  chegar com a ficha já aberta, e o ?cod= que assina a linha do log.

  `location.replace` e não `href`: assim este endereço não entra no histórico e o
  botão Voltar leva de onde a pessoa veio, e não de volta para cá num laço.

  A TELA ANTIGA está em `_to_delete/documentos-html-antes-do-recorte-2026-09-02.html`
  e no histórico do GitHub. Apagar de vez quando o recorte tiver rodado algumas
  semanas contra dado real.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       color:#3d3a34;background:#F7F3EC;padding:24px;text-align:center}
  a{color:#1F6F6B;font-weight:700}
</style>
</head>
<body>
  <p><strong>Documentos, licenças e acessos</strong><br>
     Levando você para lá… <a id="ir" href="b4u-recorte?r=documentos">abrir agora</a></p>
<script>
(function(){
  /* O `r` entra primeiro e a query que veio é anexada atrás, sem o "?" dela —
     colar as duas com "?" nos dois lados produziria `?r=documentos?chave=…`, que
     o URLSearchParams lê como UM parâmetro chamado "r" de valor
     "documentos?chave=…". A chave sumiria, e a tela mandaria a pessoa para o
     login sem que ninguém entendesse por quê. */
  var q = location.search ? '&' + location.search.slice(1) : '';
  var destino = 'b4u-recorte?r=documentos' + q + location.hash;
  var ir = document.getElementById('ir');
  if (ir) ir.href = destino;
  location.replace(destino);
})();
</script>
</body>
</html>
